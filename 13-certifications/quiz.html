rage"}, {"k": "D", "t": "Queue Storage"}], "ans": ["B"], "exp": "Azure Files Premium/NetApp Files fournissent des partages SMB manages a faible latence adaptes a FSLogix."}, {"id": "az:bas:Q26", "track": "az", "source": "Base", "num": "Q26", "section": "Domaine 3 - Continuite d'activite", "q": "Une application web (App Service, SLA 99,95 %) utilise Azure SQL Database (SLA 99,99 %). Quel est le **SLA composite** approximatif ?", "opts": [{"k": "A", "t": "99,99 %"}, {"k": "B", "t": "99,95 %"}, {"k": "C", "t": "99,94 %"}, {"k": "D", "t": "99,999 %"}], "ans": ["C"], "exp": "Composants en serie : 0,9995 x 0,9999 = 0,99940 -> 99,94 %. Le SLA composite est toujours inferieur au plus faible composant."}, {"id": "az:bas:Q27", "track": "az", "source": "Base", "num": "Q27", "section": "Domaine 3 - Continuite d'activite", "q": "Vous voulez proteger des VM contre la panne d'un **datacenter entier** dans une region, avec le meilleur SLA de VM. Que faites-vous ?", "opts": [{"k": "A", "t": "Availability set"}, {"k": "B", "t": "VM unique Premium SSD"}, {"k": "C", "t": "Deployer les VM sur plusieurs Availability Zones"}, {"k": "D", "t": "Stockage LRS"}], "ans": ["C"], "exp": "Les zones sont des datacenters physiquement separes (SLA 99,99 %). Un availability set protege seulement a l'interieur d'un datacenter (99,95 %)."}, {"id": "az:bas:Q28", "track": "az", "source": "Base", "num": "Q28", "section": "Domaine 3 - Continuite d'activite", "q": "Vous devez assurer la **reprise apres sinistre de VM** vers une autre region avec un RPO tres faible et des tests de reprise sans impact en production. Quel service ?", "opts": [{"k": "A", "t": "Azure Backup"}, {"k": "B", "t": "Azure Site Recovery"}, {"k": "C", "t": "Snapshots manuels"}, {"k": "D", "t": "Azure Migrate"}], "ans": ["B"], "exp": "ASR replique en continu, propose des plans de reprise et des tests de failover isoles. Backup a un RPO bien plus eleve."}, {"id": "az:bas:Q29", "track": "az", "source": "Base", "num": "Q29", "section": "Domaine 3 - Continuite d'activite", "q": "Pour proteger les sauvegardes contre un **ransomware** avec un attaquant ayant obtenu des droits d'administrateur, quelles mesures sont les plus pertinentes ? *(choisir 2)*", "opts": [{"k": "A", "t": "Desactiver le soft delete pour economiser"}, {"k": "B", "t": "Coffre immuable (immutable vault)"}, {"k": "C", "t": "Multi-User Authorization avec Resource Guard et soft delete"}, {"k": "D", "t": "Stocker les sauvegardes sur le meme disque que les donnees"}], "ans": ["B", "C"], "exp": "L'immuabilite empeche la modification/suppression des points de recuperation ; MUA exige une seconde autorisation pour les operations critiques."}, {"id": "az:bas:Q30", "track": "az", "source": "Base", "num": "Q30", "section": "Domaine 3 - Continuite d'activite", "q": "Une application web HTTP(S) est deployee dans **deux regions**. Elle necessite une bascule automatique, l'acceleration pour les utilisateurs mondiaux et un **WAF**. Quel service ?", "opts": [{"k": "A", "t": "Azure Load Balancer"}, {"k": "B", "t": "Traffic Manager"}, {"k": "C", "t": "Azure Front Door"}, {"k": "D", "t": "Application Gateway (une seule region)"}], "ans": ["C"], "exp": "Front Door est un L7 global avec WAF, acceleration et bascule multi-regions. Traffic Manager est DNS (sans WAF ni acceleration)."}, {"id": "az:bas:Q31", "track": "az", "source": "Base", "num": "Q31", "section": "Domaine 3 - Continuite d'activite", "q": "Une application **non HTTP** (protocole TCP personnalise) est deployee dans deux regions et doit etre redirigee par basculement **DNS**. Quel service ?", "opts": [{"k": "A", "t": "Front Door"}, {"k": "B", "t": "Application Gateway"}, {"k": "C", "t": "Traffic Manager"}, {"k": "D", "t": "WAF"}], "ans": ["C"], "exp": "Traffic Manager fait du routage DNS pour n'importe quel protocole. Front Door et Application Gateway sont des services HTTP(S)."}, {"id": "az:bas:Q32", "track": "az", "source": "Base", "num": "Q32", "section": "Domaine 3 - Continuite d'activite", "q": "Une base **Azure SQL Database** critique doit basculer automatiquement vers une autre region, avec une **chaine de connexion qui ne change pas** apres le failover pour un groupe de bases. Que concevez-vous ?", "opts": [{"k": "A", "t": "Sauvegardes geo-redondantes uniquement"}, {"k": "B", "t": "Auto-failover group"}, {"k": "C", "t": "Restauration manuelle ponctuelle"}, {"k": "D", "t": "Elastic pool"}], "ans": ["B"], "exp": "Un auto-failover group offre des endpoints de lecture/ecriture stables et un failover coordonne pour plusieurs bases."}, {"id": "az:bas:Q33", "track": "az", "source": "Base", "num": "Q33", "section": "Domaine 4 - Infrastructure", "q": "Vous deployez des **microservices conteneurises** et voulez eviter de gerer Kubernetes, avec **mise a l'echelle jusqu'a zero** et facturation a l'usage. Quel service ?", "opts": [{"k": "A", "t": "AKS"}, {"k": "B", "t": "Virtual Machines"}, {"k": "C", "t": "Azure Container Apps"}, {"k": "D", "t": "Azure Batch"}], "ans": ["C"], "exp": "Container Apps est un service de conteneurs serverless base sur Kubernetes (KEDA, Dapr) sans gestion du cluster, avec scale-to-zero."}, {"id": "az:bas:Q34", "track": "az", "source": "Base", "num": "Q34", "section": "Domaine 4 - Infrastructure", "q": "Des VM doivent acceder a un compte de stockage et une base SQL **uniquement via le reseau prive**, y compris depuis le on-prem par ExpressRoute, avec **acces public desactive**. Que concevoir ?", "opts": [{"k": "A", "t": "Service endpoints"}, {"k": "B", "t": "Private Endpoints + zones DNS privees"}, {"k": "C", "t": "Regles de pare-feu IP publiques"}, {"k": "D", "t": "NSG uniquement"}], "ans": ["B"], "exp": "Un Private Endpoint donne une IP privee accessible depuis le on-prem et permet de couper l'acces public. Les service endpoints ne sont pas accessibles depuis le on-prem."}, {"id": "az:bas:Q35", "track": "az", "source": "Base", "num": "Q35", "section": "Domaine 4 - Infrastructure", "q": "Une organisation a **150 sites** a connecter a Azure avec transit automatique et administration minimale. Quelle architecture ?", "opts": [{"k": "A", "t": "Un VPN Gateway par site avec peerings manuels"}, {"k": "B", "t": "Azure Virtual WAN"}, {"k": "C", "t": "Un VNet unique"}, {"k": "D", "t": "Traffic Manager"}], "ans": ["B"], "exp": "Virtual WAN fournit un hub manage avec connectivite site-a-site, ExpressRoute et transit automatise a grande echelle."}, {"id": "az:bas:Q36", "track": "az", "source": "Base", "num": "Q36", "section": "Domaine 4 - Infrastructure", "q": "Vous concevez un hub-and-spoke et devez **inspecter tout le trafic entre spokes** et vers Internet. Que faites-vous ?", "opts": [{"k": "A", "t": "Aucun routage particulier"}, {"k": "B", "t": "Azure Firewall dans le hub + routes definies par l'utilisateur (UDR) dans les spokes"}, {"k": "C", "t": "Service endpoints"}, {"k": "D", "t": "NSG sur le hub uniquement"}], "ans": ["B"], "exp": "Le peering n'est pas transitif et ne force pas l'inspection ; les UDR dirigent le trafic vers le pare-feu du hub."}, {"id": "az:bas:Q37", "track": "az", "source": "Base", "num": "Q37", "section": "Domaine 4 - Infrastructure", "q": "Une application de commandes doit echanger des messages **dans l'ordre (FIFO), avec dead-letter et transactions**. Quel service ?", "opts": [{"k": "A", "t": "Storage Queue"}, {"k": "B", "t": "Event Grid"}, {"k": "C", "t": "Service Bus (queues/topics avec sessions)"}, {"k": "D", "t": "Event Hubs"}], "ans": ["C"], "exp": "Service Bus offre sessions FIFO, dead-letter, transactions et detection de doublons."}, {"id": "az:bas:Q38", "track": "az", "source": "Base", "num": "Q38", "section": "Domaine 4 - Infrastructure", "q": "Vous voulez declencher une fonction quand un **blob est cree** dans un compte de stockage (reaction a un evenement). Quel service d'evenements ?", "opts": [{"k": "A", "t": "Service Bus"}, {"k": "B", "t": "Event Hubs"}, {"k": "C", "t": "Event Grid"}, {"k": "D", "t": "Storage Queue"}], "ans": ["C"], "exp": "Event Grid distribue des evenements reactifs (publication/abonnement) depuis les services Azure."}, {"id": "az:bas:Q39", "track": "az", "source": "Base", "num": "Q39", "section": "Domaine 4 - Infrastructure", "q": "Vous publiez des API internes vers des partenaires avec **quotas, throttling, authentification OAuth et portail developpeur**. Quel service ?", "opts": [{"k": "A", "t": "Application Gateway"}, {"k": "B", "t": "API Management"}, {"k": "C", "t": "Azure Firewall"}, {"k": "D", "t": "Front Door"}], "ans": ["B"], "exp": "API Management centralise securite, quotas, transformation, versioning et portail pour les API."}, {"id": "az:bas:Q40", "track": "az", "source": "Base", "num": "Q40", "section": "Domaine 4 - Infrastructure", "q": "Vous devez evaluer et migrer **300 VM VMware** vers Azure, avec dimensionnement et estimation des couts. Quel outil de depart ?", "opts": [{"k": "A", "t": "Azure Site Recovery uniquement"}, {"k": "B", "t": "Azure Migrate (decouverte, evaluation, migration)"}, {"k": "C", "t": "Data Box"}, {"k": "D", "t": "AzCopy"}], "ans": ["B"], "exp": "Azure Migrate decouvre, evalue (compatibilite, taille, cout) et migre les serveurs."}, {"id": "az:bas:Q41", "track": "az", "source": "Base", "num": "Q41", "section": "Domaine 4 - Infrastructure", "q": "Vous avez des licences **Windows Server et SQL Server avec Software Assurance** et une charge VM **stable pendant 3 ans**. Comment reduire le cout au maximum ?", "opts": [{"k": "A", "t": "Spot VMs"}, {"k": "B", "t": "Azure Hybrid Benefit + Reservations (ou Savings Plan) 3 ans"}, {"k": "C", "t": "Pay-as-you-go"}, {"k": "D", "t": "Dev/Test pricing"}], "ans": ["B"], "exp": "Hybrid Benefit supprime le cout de licence ; la reservation reduit le cout de calcul pour une charge previsible. Spot est inadapte a une charge stable et critique."}, {"id": "az:bas:Q42", "track": "az", "source": "Base", "num": "Q42", "section": "Domaine 4 - Infrastructure", "q": "Les administrateurs doivent acceder en RDP/SSH aux VM **sans IP publique et sans VPN**. Quelle solution ?", "opts": [{"k": "A", "t": "NSG ouvrant le port 3389 a Internet"}, {"k": "B", "t": "Azure Bastion"}, {"k": "C", "t": "IP publique avec mot de passe"}, {"k": "D", "t": "Traffic Manager"}], "ans": ["B"], "exp": "Bastion fournit RDP/SSH via TLS depuis le portail, sans exposer les VM."}, {"id": "az:bas:A1", "track": "az", "source": "Base", "num": "A1", "section": "Cas A - Contoso Retail", "q": "**Contexte** : Contoso exploite un site e-commerce sur des VM IIS et SQL Server on-premise. Objectifs : migration vers Azure, **reduction de l'effort d'administration**, **disponibilite 99,95 % minimum**, le site est utilise en France et en Allemagne, et les donnees clients doivent rester dans l'UE. La base utilise **SQL Agent** et plusieurs bases liees. Les administrateurs se connectent via AD on-premise.\n\nQuelle plateforme pour le site web ?", "opts": [{"k": "A", "t": "VM IIS dans un availability set"}, {"k": "B", "t": "App Service (plan Premium, redondance de zone)"}, {"k": "C", "t": "AKS"}, {"k": "D", "t": "Azure Batch"}], "ans": ["B"], "exp": "PaaS = moins d'administration ; la redondance de zone assure la haute disponibilite. AKS est excessif pour un site IIS."}, {"id": "az:bas:A2", "track": "az", "source": "Base", "num": "A2", "section": "Cas A - Contoso Retail", "q": "**Contexte** : Contoso exploite un site e-commerce sur des VM IIS et SQL Server on-premise. Objectifs : migration vers Azure, **reduction de l'effort d'administration**, **disponibilite 99,95 % minimum**, le site est utilise en France et en Allemagne, et les donnees clients doivent rester dans l'UE. La base utilise **SQL Agent** et plusieurs bases liees. Les administrateurs se connectent via AD on-premise.\n\nQuelle plateforme pour la base ?", "opts": [{"k": "A", "t": "Azure SQL Database"}, {"k": "B", "t": "Azure SQL Managed Instance"}, {"k": "C", "t": "Cosmos DB"}, {"k": "D", "t": "Table Storage"}], "ans": ["B"], "exp": "SQL Agent et bases liees imposent SQL MI (quasi-compatibilite totale) tout en restant PaaS."}, {"id": "az:bas:A3", "track": "az", "source": "Base", "num": "A3", "section": "Cas A - Contoso Retail", "q": "**Contexte** : Contoso exploite un site e-commerce sur des VM IIS et SQL Server on-premise. Objectifs : migration vers Azure, **reduction de l'effort d'administration**, **disponibilite 99,95 % minimum**, le site est utilise en France et en Allemagne, et les donnees clients doivent rester dans l'UE. La base utilise **SQL Agent** et plusieurs bases liees. Les administrateurs se connectent via AD on-premise.\n\nComment les administrateurs s'authentifient-ils avec les identifiants AD existants, avec une infrastructure minimale et une haute disponibilite ?", "opts": [{"k": "A", "t": "AD FS"}, {"k": "B", "t": "Entra Connect avec Password Hash Sync"}, {"k": "C", "t": "Comptes cloud separes"}, {"k": "D", "t": "Entra Domain Services"}], "ans": ["B"], "exp": "PHS : simple, resilient (pas de dependance au on-prem). Combine avec PIM pour les roles d'administration."}, {"id": "az:bas:A4", "track": "az", "source": "Base", "num": "A4", "section": "Cas A - Contoso Retail", "q": "**Contexte** : Contoso exploite un site e-commerce sur des VM IIS et SQL Server on-premise. Objectifs : migration vers Azure, **reduction de l'effort d'administration**, **disponibilite 99,95 % minimum**, le site est utilise en France et en Allemagne, et les donnees clients doivent rester dans l'UE. La base utilise **SQL Agent** et plusieurs bases liees. Les administrateurs se connectent via AD on-premise.\n\nComment garantir que les ressources restent dans l'UE ?", "opts": [{"k": "A", "t": "Resource lock"}, {"k": "B", "t": "Azure Policy \"Allowed locations\" (Deny) sur le management group"}, {"k": "C", "t": "NSG"}, {"k": "D", "t": "Tags"}], "ans": ["B"], "exp": "Policy empeche techniquement le deploiement hors des regions autorisees."}, {"id": "az:bas:B1", "track": "az", "source": "Base", "num": "B1", "section": "Cas B - Fabrikam Telemetry", "q": "**Contexte** : Fabrikam collecte la telemetrie de 2 millions d'appareils IoT. Besoins : ingestion de millions d'evenements/s, analyse en temps reel et historique, **archivage 10 ans non modifiable**, DR vers une autre region avec RPO < 15 min, acces prive aux services PaaS depuis le on-prem (ExpressRoute).\n\nService d'ingestion ?", "opts": [{"k": "A", "t": "Service Bus"}, {"k": "B", "t": "Storage Queue"}, {"k": "C", "t": "Event Hubs"}, {"k": "D", "t": "Event Grid"}], "ans": ["C"], "exp": "Ingestion a haut debit de flux."}, {"id": "az:bas:B2", "track": "az", "source": "Base", "num": "B2", "section": "Cas B - Fabrikam Telemetry", "q": "**Contexte** : Fabrikam collecte la telemetrie de 2 millions d'appareils IoT. Besoins : ingestion de millions d'evenements/s, analyse en temps reel et historique, **archivage 10 ans non modifiable**, DR vers une autre region avec RPO < 15 min, acces prive aux services PaaS depuis le on-prem (ExpressRoute).\n\nStockage de l'historique et de l'archive ?", "opts": [{"k": "A", "t": "Azure SQL Database"}, {"k": "B", "t": "ADLS Gen2 (Blob) avec immutabilite et lifecycle vers Archive"}, {"k": "C", "t": "Table Storage"}, {"k": "D", "t": "Managed disks"}], "ans": ["B"], "exp": "Lac de donnees analytique ; WORM pour l'archivage reglementaire ; lifecycle pour le cout."}, {"id": "az:bas:B3", "track": "az", "source": "Base", "num": "B3", "section": "Cas B - Fabrikam Telemetry", "q": "**Contexte** : Fabrikam collecte la telemetrie de 2 millions d'appareils IoT. Besoins : ingestion de millions d'evenements/s, analyse en temps reel et historique, **archivage 10 ans non modifiable**, DR vers une autre region avec RPO < 15 min, acces prive aux services PaaS depuis le on-prem (ExpressRoute).\n\nAcces prive aux comptes de stockage depuis le on-prem ?", "opts": [{"k": "A", "t": "Service endpoints"}, {"k": "B", "t": "Private Endpoints (+ DNS prive) via ExpressRoute"}, {"k": "C", "t": "IP publique restreinte"}, {"k": "D", "t": "SAS tokens"}], "ans": ["B"], "exp": "Seuls les Private Endpoints sont joignables depuis le on-prem et permettent de desactiver l'acces public."}, {"id": "az:bas:B4", "track": "az", "source": "Base", "num": "B4", "section": "Cas B - Fabrikam Telemetry", "q": "**Contexte** : Fabrikam collecte la telemetrie de 2 millions d'appareils IoT. Besoins : ingestion de millions d'evenements/s, analyse en temps reel et historique, **archivage 10 ans non modifiable**, DR vers une autre region avec RPO < 15 min, acces prive aux services PaaS depuis le on-prem (ExpressRoute).\n\nRedondance du stockage pour le DR regional ?", "opts": [{"k": "A", "t": "LRS"}, {"k": "B", "t": "ZRS"}, {"k": "C", "t": "GZRS / GRS (avec acces secondaire en lecture si necessaire)"}, {"k": "D", "t": "Aucune"}], "ans": ["C"], "exp": "La replication geo-redondante protege d'une panne regionale ; GZRS ajoute la protection de zone."}, {"id": "az:ava:Q1", "track": "az", "source": "Avancees", "num": "Q1", "section": "A. Identite, gouvernance et supervision", "q": "Exigences : (1) les administrateurs activent leurs droits **a la demande**, (2) **approbation** par un responsable, (3) **MFA** a l'activation, (4) **revue trimestrielle** des affectations. Quelle combinaison ?", "opts": [{"k": "A", "t": "Conditional Access seul"}, {"k": "B", "t": "PIM (roles eligibles, approbation, MFA) + Access reviews"}, {"k": "C", "t": "Azure Policy"}, {"k": "D", "t": "Groupes de securite statiques"}], "ans": ["B"], "exp": "PIM couvre JIT, approbation et MFA ; les access reviews couvrent la revue periodique."}, {"id": "az:ava:Q2", "track": "az", "source": "Avancees", "num": "Q2", "section": "A. Identite, gouvernance et supervision", "q": "Une application web sur **App Service** doit lire un secret Key Vault. Exigences : **aucun secret** dans la config, droits **minimaux**, secret **rotatif**. Quelle conception ?", "opts": [{"k": "A", "t": "Service principal + secret client dans les parametres de l'application"}, {"k": "B", "t": "Managed identity de l'App Service + role RBAC Key Vault Secrets User sur le secret/coffre + reference Key Vault"}, {"k": "C", "t": "Cle d'acces du compte de stockage"}, {"k": "D", "t": "Access policy donnant \"All\" a l'application"}], "ans": ["B"], "exp": "Pas de secret a gerer, moindre privilege (Secrets User = lecture seule), rotation geree dans Key Vault."}, {"id": "az:ava:Q3", "track": "az", "source": "Avancees", "num": "Q3", "section": "A. Identite, gouvernance et supervision", "q": "Exigences : appliquer la meme baseline a **tous les abonnements presents et futurs**, **bloquer** les regions non autorisees, **activer automatiquement** les parametres de diagnostic vers Log Analytics. Quelle solution ?", "opts": [{"k": "A", "t": "Policy `Deny` (regions) et `DeployIfNotExists` (diagnostics), assignees au management group racine de la landing zone, avec identite manage et remediation"}, {"k": "B", "t": "Un script PowerShell hebdomadaire"}, {"k": "C", "t": "RBAC Reader"}, {"k": "D", "t": "Tags"}], "ans": ["A"], "exp": "Heritage vers les abonnements futurs ; `DeployIfNotExists` demande une managed identity avec droits suffisants et des remediation tasks pour l'existant."}, {"id": "az:ava:Q4", "track": "az", "source": "Avancees", "num": "Q4", "section": "A. Identite, gouvernance et supervision", "q": "Un utilisateur **Owner** d'un abonnement ne peut pas creer une VM en `eastus`. Cause la plus probable ?", "opts": [{"k": "A", "t": "Role insuffisant"}, {"k": "B", "t": "Une Azure Policy Deny (Allowed locations) heritee depuis un management group"}, {"k": "C", "t": "Quota ARM"}, {"k": "D", "t": "Probleme de licence"}], "ans": ["B"], "exp": "Policy s'applique independamment de RBAC : meme un Owner est bloque."}, {"id": "az:ava:Q5", "track": "az", "source": "Avancees", "num": "Q5", "section": "A. Identite, gouvernance et supervision", "q": "Une entreprise rachete une societe avec son propre **tenant**. Exigence : les employes de la filiale accedent a des applications du tenant principal **sans comptes dupliques**, et l'IT principale **gere des abonnements de la filiale** sans y creer de comptes. Que choisir ? *(choisir 2)*", "opts": [{"k": "A", "t": "Entra B2B (ou cross-tenant access / synchronisation inter-tenants)"}, {"k": "B", "t": "Azure Lighthouse pour la gestion deleguee des abonnements"}, {"k": "C", "t": "Fusion immediate des tenants"}, {"k": "D", "t": "Partage de mots de passe"}], "ans": ["A", "B"], "exp": "B2B/cross-tenant pour l'acces applicatif ; Lighthouse pour la gestion deleguee sans comptes invites."}, {"id": "az:ava:Q6", "track": "az", "source": "Avancees", "num": "Q6", "section": "A. Identite, gouvernance et supervision", "q": "Pour reduire le cout de **Log Analytics** tout en conservant 7 ans de logs d'audit consultables rarement : quelle conception ?", "opts": [{"k": "A", "t": "Garder 7 ans en retention interactive Analytics"}, {"k": "B", "t": "Retention interactive courte (ex. 90 j) + archivage long terme (archive/Auxiliary) ; filtrer a la source avec DCR ; tables Basic pour logs verbeux"}, {"k": "C", "t": "Supprimer les logs"}, {"k": "D", "t": "Les stocker sur disque VM"}], "ans": ["B"], "exp": "Combinaison de niveaux de tables, archive et filtrage a la source."}, {"id": "az:ava:Q7", "track": "az", "source": "Avancees", "num": "Q7", "section": "A. Identite, gouvernance et supervision", "q": "Politiques de Conditional Access : un compte **break-glass** est necessaire. Quelle est la meilleure pratique ?", "opts": [{"k": "A", "t": "Utiliser un compte nominatif d'administrateur"}, {"k": "B", "t": "Deux comptes cloud-only, mots de passe longs hors ligne, exclus de la CA habituelle ou proteges par MFA resistant au phishing dedie, avec alertes de connexion"}, {"k": "C", "t": "Aucun compte d'urgence"}, {"k": "D", "t": "Un compte partage avec MFA SMS"}], "ans": ["B"], "exp": "Evite le verrouillage total du tenant en cas de panne MFA/CA, avec surveillance forte."}, {"id": "az:ava:Q8", "track": "az", "source": "Avancees", "num": "Q8", "section": "B. Donnees", "q": "Une application utilise SQL Server avec **SQL Agent**, des **requetes entre 12 bases**, et doit etre migree avec **le minimum de changements** vers un service **PaaS**. En outre elle doit pouvoir etre reliee en **reseau prive** au on-prem. Que choisir ?", "opts": [{"k": "A", "t": "Azure SQL Database (base unique)"}, {"k": "B", "t": "SQL Managed Instance dans un VNet (acces prive)"}, {"k": "C", "t": "Pool elastique"}, {"k": "D", "t": "Cosmos DB"}], "ans": ["B"], "exp": "MI offre SQL Agent et requetes inter-bases, deployee dans un VNet."}, {"id": "az:ava:Q9", "track": "az", "source": "Avancees", "num": "Q9", "section": "B. Donnees", "q": "Une base Azure SQL de **60 To** doit offrir des **restaurations rapides** et des **replicas de lecture**. Quel niveau ?", "opts": [{"k": "A", "t": "General Purpose"}, {"k": "B", "t": "Business Critical (4 To max)"}, {"k": "C", "t": "Hyperscale"}, {"k": "D", "t": "DTU Standard"}], "ans": ["C"], "exp": "Hyperscale : tres grandes bases, instantanes, replicas nommes."}, {"id": "az:ava:Q10", "track": "az", "source": "Avancees", "num": "Q10", "section": "B. Donnees", "q": "Cosmos DB : application mondiale avec ecritures dans 3 regions (**multi-region writes**). Un architecte propose le niveau de coherence **Strong**. Pourquoi est-ce problematique ?", "opts": [{"k": "A", "t": "Aucun probleme"}, {"k": "B", "t": "Strong n'est pas supporte avec les ecritures multi-regions (et couterait en latence) ; choisir Session/Bounded staleness/Eventual"}, {"k": "C", "t": "Strong est moins couteux"}, {"k": "D", "t": "Strong supprime la replication"}], "ans": ["B"], "exp": "Strong exige une ecriture synchrone coordonnee ; incompatible avec multi-write."}, {"id": "az:ava:Q11", "track": "az", "source": "Avancees", "num": "Q11", "section": "B. Donnees", "q": "Une collection Cosmos DB contient `{ \"tenantId\": ..., \"orderId\": ... }`. 95 % du trafic vient d'un seul tenant. Quelle partition key evite un point chaud ?", "opts": [{"k": "A", "t": "`tenantId` seul"}, {"k": "B", "t": "Une cle composite/synthetique (`tenantId + orderId` ou hierarchical partition key)"}, {"k": "C", "t": "Une constante"}, {"k": "D", "t": "`country`"}], "ans": ["B"], "exp": "`tenantId` seul concentrerait 95 % de la charge sur une partition. Cles hierarchiques ou synthetiques distribuent."}, {"id": "az:ava:Q12", "track": "az", "source": "Avancees", "num": "Q12", "section": "B. Donnees", "q": "Compte de stockage : exigences **(1)** survivre a la perte d'une zone, **(2)** survivre a la perte de la region, **(3)** lecture de la region secondaire **meme sans failover**, **(4)** cout aussi bas que possible. Quelle option ?", "opts": [{"k": "A", "t": "LRS"}, {"k": "B", "t": "GRS"}, {"k": "C", "t": "RA-GZRS — mais si (1) n'etait pas exige, RA-GRS serait moins cher"}, {"k": "D", "t": "ZRS"}], "ans": ["C"], "exp": "(1)+(2)+(3) => RA-GZRS. L'exigence (4) ne contredit pas : on choisit le moins cher qui **satisfait toutes** les autres."}, {"id": "az:ava:Q13", "track": "az", "source": "Avancees", "num": "Q13", "section": "B. Donnees", "q": "Des fichiers tres volumineux (HPC, Oracle) exigent **NFS** a **tres haute performance et faible latence**, avec choix du niveau de service. Quel service ?", "opts": [{"k": "A", "t": "Azure Files Standard"}, {"k": "B", "t": "Blob Hot"}, {"k": "C", "t": "Azure NetApp Files"}, {"k": "D", "t": "Table Storage"}], "ans": ["C"], "exp": "NetApp Files (niveaux Standard/Premium/Ultra) pour HPC/SAP/Oracle."}, {"id": "az:ava:Q14", "track": "az", "source": "Avancees", "num": "Q14", "section": "B. Donnees", "q": "Des evenements de capteurs (1,5 M/s) doivent etre stockes pour l'analyse **sans code**, tout en alimentant des alertes temps reel. Quelle architecture ?", "opts": [{"k": "A", "t": "Service Bus -> SQL"}, {"k": "B", "t": "Event Hubs avec Capture vers ADLS Gen2 (cold path) + Stream Analytics (hot path)"}, {"k": "C", "t": "Storage Queue"}, {"k": "D", "t": "Event Grid"}], "ans": ["B"], "exp": "Event Hubs gere le debit ; Capture archive sans code ; Stream Analytics pour le temps reel."}, {"id": "az:ava:Q15", "track": "az", "source": "Avancees", "num": "Q15", "section": "C. Continuite et calculs", "q": "Calculez le SLA composite : Front Door (99,99 %) -> App Service (99,95 %) -> Azure SQL (99,99 %), en serie.", "opts": [{"k": "A", "t": "99,99 %"}, {"k": "B", "t": "99,95 %"}, {"k": "C", "t": "~99,93 %"}, {"k": "D", "t": "99,90 %"}], "ans": ["C"], "exp": "`0,9999 x 0,9995 x 0,9999 = 0,99930...` => 99,93 %."}, {"id": "az:ava:Q16", "track": "az", "source": "Avancees", "num": "Q16", "section": "C. Continuite et calculs", "q": "Deux regions actives, chacune avec un SLA applicatif de 99,9 %. Sans compter le routage, quel est le SLA combine ?", "opts": [{"k": "A", "t": "99,9 %"}, {"k": "B", "t": "99,99 %"}, {"k": "C", "t": "99,9999 %"}, {"k": "D", "t": "100 %"}], "ans": ["C"], "exp": "`1 - (0,001 x 0,001) = 1 - 0,000001 = 99,9999 %`. En pratique, le routeur global en serie (ex. 99,99 %) devient le **plafond**."}, {"id": "az:ava:Q17", "track": "az", "source": "Avancees", "num": "Q17", "section": "C. Continuite et calculs", "q": "Meme architecture que Q16 avec **Traffic Manager (99,99 %)** en serie devant les deux regions. SLA global approximatif ?", "opts": [{"k": "A", "t": "99,9999 %"}, {"k": "B", "t": "~99,99 %"}, {"k": "C", "t": "99,9 %"}, {"k": "D", "t": "99,5 %"}], "ans": ["B"], "exp": "`0,9999 x 0,999999 ~ 0,999899`, soit ~99,99 %. Le composant commun limite l'ensemble."}, {"id": "az:ava:Q18", "track": "az", "source": "Avancees", "num": "Q18", "section": "C. Continuite et calculs", "q": "Un SLA de **99,95 %** correspond a quelle indisponibilite maximale **par mois** (30 jours) ?", "opts": [{"k": "A", "t": "4,3 minutes"}, {"k": "B", "t": "~21,6 minutes"}, {"k": "C", "t": "43,2 minutes"}, {"k": "D", "t": "2,16 heures"}], "ans": ["B"], "exp": "`0,0005 x 43 200 min = 21,6 min`."}, {"id": "az:ava:Q19", "track": "az", "source": "Avancees", "num": "Q19", "section": "C. Continuite et calculs", "q": "Exigences DR : **RTO 1 h**, **RPO 5 min**, VM IaaS legacy, regions Azure differentes, **tests de reprise sans impact**. Solution ?", "opts": [{"k": "A", "t": "Azure Backup"}, {"k": "B", "t": "Azure Site Recovery avec plan de reprise et tests de failover"}, {"k": "C", "t": "Snapshots manuels"}, {"k": "D", "t": "Reinstaller"}], "ans": ["B"], "exp": "Replication continue (RPO ~ minute) et tests de failover isoles. Backup n'atteint pas ce RPO/RTO."}, {"id": "az:ava:Q20", "track": "az", "source": "Avancees", "num": "Q20", "section": "C. Continuite et calculs", "q": "Une equipe sauvegarde ses VM dans un coffre du **meme abonnement** que la production. Un attaquant obtient les droits Owner de l'abonnement et supprime coffre et VM. Quelle conception aurait limite l'impact ? *(choisir 2)*", "opts": [{"k": "A", "t": "Coffre immuable + soft delete + MUA (Resource Guard) dans un abonnement distinct gere par une autre equipe"}, {"k": "B", "t": "Stocker les sauvegardes en LRS"}, {"k": "C", "t": "Garder le meme abonnement pour simplicite"}, {"k": "D", "t": "Cross-Region Restore avec GRS pour la resilience regionale"}], "ans": ["A", "D"], "exp": "A protege contre la suppression malveillante (separation de responsabilites + immuabilite) ; D ajoute la resilience regionale. B reduit la protection, C est la cause du probleme."}, {"id": "az:ava:Q21", "track": "az", "source": "Avancees", "num": "Q21", "section": "C. Continuite et calculs", "q": "Une application dans un seul datacenter Azure (availability set) doit survivre a la **perte du datacenter**. Quelle modification **minimale** ?", "opts": [{"k": "A", "t": "Ajouter des VM dans l'availability set"}, {"k": "B", "t": "Repartir les VM sur des zones de disponibilite (zone-redundant) + services zone-redundant"}, {"k": "C", "t": "Passer en LRS"}, {"k": "D", "t": "Ajouter un NSG"}], "ans": ["B"], "exp": "Un availability set est limite a un datacenter. Les zones protegent d'une panne de datacenter."}, {"id": "az:ava:Q22", "track": "az", "source": "Avancees", "num": "Q22", "section": "C. Continuite et calculs", "q": "Quelle strategie DR minimise le **cout** pour une application dont l'indisponibilite acceptable est de **24 h** et la perte de donnees de **12 h** ?", "opts": [{"k": "A", "t": "Actif-actif multi-region"}, {"k": "B", "t": "Warm standby"}, {"k": "C", "t": "Sauvegarde/restauration vers une autre region (GRS + cross-region restore)"}, {"k": "D", "t": "Pilot light avec replicas"}], "ans": ["C"], "exp": "RTO/RPO larges : le plus economique suffit."}, {"id": "az:ava:Q23", "track": "az", "source": "Avancees", "num": "Q23", "section": "D. Reseau", "q": "Exigences : acces prive a un compte de stockage **depuis un reseau on-prem via ExpressRoute**, **aucun acces public**, resolution DNS correcte. Que faut-il ? *(choisir 3)*", "opts": [{"k": "A", "t": "Private Endpoint `blob`"}, {"k": "B", "t": "Zone Private DNS `privatelink.blob.core.windows.net` liee au VNet"}, {"k": "C", "t": "DNS Private Resolver (ou forwarders) pour resoudre cette zone depuis le on-prem"}, {"k": "D", "t": "Service Endpoint sur le sous-reseau"}, {"k": "E", "t": "Ouvrir le pare-feu du stockage a 0.0.0.0/0"}], "ans": ["A", "B", "C"], "exp": "Le Private Endpoint donne l'IP privee ; la zone DNS prive resout le nom ; le Private Resolver permet au on-prem de resoudre la zone Azure. Les service endpoints ne sont pas accessibles depuis le on-prem."}, {"id": "az:ava:Q24", "track": "az", "source": "Avancees", "num": "Q24", "section": "D. Reseau", "q": "Un hub-spoke : le trafic spoke-a-spoke et vers Internet doit etre **inspecte** par Azure Firewall dans le hub. Que configurer ? *(choisir 2)*", "opts": [{"k": "A", "t": "UDR `0.0.0.0/0` -> IP privee du pare-feu sur les sous-reseaux des spokes (et routes spoke-a-spoke)"}, {"k": "B", "t": "Peering avec `allow forwarded traffic` active"}, {"k": "C", "t": "Un NSG autorisant tout"}, {"k": "D", "t": "Service Endpoints"}], "ans": ["A", "B"], "exp": "Les UDR dirigent le trafic ; le peering doit autoriser le trafic transfere. Le peering seul n'est pas transitif."}, {"id": "az:ava:Q25", "track": "az", "source": "Avancees", "num": "Q25", "section": "D. Reseau", "q": "Une organisation a 200 sites, SD-WAN, VPN et ExpressRoute, et souhaite un **transit automatique** minimisant l'administration. Que choisir ?", "opts": [{"k": "A", "t": "Hub-spoke manuel avec peerings"}, {"k": "B", "t": "Azure Virtual WAN"}, {"k": "C", "t": "Un VPN par site vers un seul VNet"}, {"k": "D", "t": "Traffic Manager"}], "ans": ["B"], "exp": "Hub manage a grande echelle."}, {"id": "az:ava:Q26", "track": "az", "source": "Avancees", "num": "Q26", "section": "D. Reseau", "q": "Une application HTTPS regionale necessite **routage par chemin (/api, /web)**, **terminaison TLS** et **WAF**. Quel service ?", "opts": [{"k": "A", "t": "Azure Load Balancer"}, {"k": "B", "t": "Traffic Manager"}, {"k": "C", "t": "Application Gateway (WAF v2)"}, {"k": "D", "t": "NAT Gateway"}], "ans": ["C"], "exp": "L7 regional avec WAF. Pour du global : Front Door."}, {"id": "az:ava:Q27", "track": "az", "source": "Avancees", "num": "Q27", "section": "D. Reseau", "q": "Des VM sortent massivement vers Internet et subissent des erreurs de **SNAT port exhaustion**. Solution ?", "opts": [{"k": "A", "t": "Ajouter des NSG"}, {"k": "B", "t": "NAT Gateway associee au sous-reseau (IP publiques dediees)"}, {"k": "C", "t": "Reduire la taille des VM"}, {"k": "D", "t": "Activer Bastion"}], "ans": ["B"], "exp": "NAT Gateway fournit un SNAT evolutif et previsible."}, {"id": "az:ava:Q28", "track": "az", "source": "Avancees", "num": "Q28", "section": "D. Reseau", "q": "Vous exposez **votre propre service** (derriere un Standard Load Balancer) a des **clients dans d'autres tenants/VNets**, en prive, sans peering. Quelle fonction ?", "opts": [{"k": "A", "t": "VNet peering"}, {"k": "B", "t": "Private Link Service (le client cree un Private Endpoint)"}, {"k": "C", "t": "VPN point-a-site"}, {"k": "D", "t": "Service Endpoint"}], "ans": ["B"], "exp": "Private Link Service expose un service a d'autres consommateurs via Private Endpoint."}, {"id": "az:ava:Q29", "track": "az", "source": "Avancees", "num": "Q29", "section": "E. Calcul, applications et migration", "q": "Microservices HTTP, **scale-to-zero**, equipe sans competences Kubernetes, besoin de **Dapr**. Quel service ?", "opts": [{"k": "A", "t": "AKS"}, {"k": "B", "t": "VM Scale Sets"}, {"k": "C", "t": "Azure Container Apps"}, {"k": "D", "t": "Azure Batch"}], "ans": ["C"], "exp": "Container Apps integre KEDA et Dapr sans gerer K8s."}, {"id": "az:ava:Q30", "track": "az", "source": "Avancees", "num": "Q30", "section": "E. Calcul, applications et migration", "q": "Une fonction doit s'executer **toute l'annee avec zero cold start**, acceder a des ressources **dans un VNet** et gerer des traitements longs. Quel plan ?", "opts": [{"k": "A", "t": "Consumption"}, {"k": "B", "t": "Premium (ou Dedicated avec Always On)"}, {"k": "C", "t": "Logic Apps Consumption"}, {"k": "D", "t": "Container Instances"}], "ans": ["B"], "exp": "Instances pre-chauffees, integration VNet, durees longues."}, {"id": "az:ava:Q31", "track": "az", "source": "Avancees", "num": "Q31", "section": "E. Calcul, applications et migration", "q": "Messages de commandes : **ordre par client (FIFO)**, **transactions**, **dead-letter**, plusieurs applications abonnees avec **filtres** differents. Quel service ?", "opts": [{"k": "A", "t": "Storage Queue"}, {"k": "B", "t": "Event Grid"}, {"k": "C", "t": "Service Bus Topics (sessions)"}, {"k": "D", "t": "Event Hubs"}], "ans": ["C"], "exp": "Topics/abonnements avec filtres + sessions FIFO + DLQ + transactions."}, {"id": "az:ava:Q32", "track": "az", "source": "Avancees", "num": "Q32", "section": "E. Calcul, applications et migration", "q": "Pour migrer 800 serveurs, vous devez d'abord obtenir **dimensionnement, readiness et estimation de cout** avec **dependances applicatives**. Quelle approche ?", "opts": [{"k": "A", "t": "Migrer tout en rehost sans analyse"}, {"k": "B", "t": "Azure Migrate (appliance de decouverte + analyse de dependances + evaluation) puis vagues"}, {"k": "C", "t": "Excel manuel"}, {"k": "D", "t": "Data Box"}], "ans": ["B"], "exp": "Decouverte + dependances + evaluation sont le point de depart."}, {"id": "az:ava:Q33", "track": "az", "source": "Avancees", "num": "Q33", "section": "E. Calcul, applications et migration", "q": "Charge de calcul **stable pendant 3 ans** mais dont la **taille des VM et les regions pourraient changer**. Quelle option de cout ?", "opts": [{"k": "A", "t": "Spot"}, {"k": "B", "t": "Reservation 3 ans sur une taille precise"}, {"k": "C", "t": "Savings Plan for compute (3 ans)"}, {"k": "D", "t": "Pay-as-you-go"}], "ans": ["C"], "exp": "Flexibilite (taille/region/service) pour un engagement de depense ; la reservation serait plus rigide."}, {"id": "az:com:Q1", "track": "az", "source": "Complementaires", "num": "Q1", "section": "Domaine 1 - Identite, gouvernance et supervision", "q": "Vous devez garantir que **toutes les nouvelles ressources** de 30 abonnements recoivent automatiquement un parametre de diagnostic vers Log Analytics. Quelle solution ?", "opts": [{"k": "A", "t": "Un script PowerShell lance manuellement"}, {"k": "B", "t": "Azure Policy `DeployIfNotExists` assignee a un management group"}, {"k": "C", "t": "Un resource lock"}, {"k": "D", "t": "Un tag obligatoire"}], "ans": ["B"], "exp": "DeployIfNotExists deploie la configuration manquante (avec une identite managee de remediation) et s'applique a toute la hierarchie via le management group."}, {"id": "az:com:Q2", "track": "az", "source": "Complementaires", "num": "Q2", "section": "Domaine 1 - Identite, gouvernance et supervision", "q": "Des administrateurs ont besoin du role Owner **seulement quelques heures par mois**, avec approbation et journalisation. Quelle fonctionnalite ?", "opts": [{"k": "A", "t": "Role assignment permanent"}, {"k": "B", "t": "Acces conditionnel"}, {"k": "C", "t": "Privileged Identity Management (PIM) : activation Just-In-Time"}, {"k": "D", "t": "Entra B2B"}], "ans": ["C"], "exp": "PIM fournit des roles eligibles, activation temporaire, MFA, justification et approbation (necessite Entra ID P2)."}, {"id": "az:com:Q3", "track": "az", "source": "Complementaires", "num": "Q3", "section": "Domaine 1 - Identite, gouvernance et supervision", "q": "Une application sur une VM Azure doit lire un secret dans Key Vault **sans stocker d'identifiants**. Quelle approche ?", "opts": [{"k": "A", "t": "Stocker un client secret dans le fichier de configuration"}, {"k": "B", "t": "Utiliser une cle de stockage"}, {"k": "C", "t": "Une identite managee de la VM avec un role/une politique d'acces sur Key Vault"}, {"k": "D", "t": "Rendre le Key Vault public"}], "ans": ["C"], "exp": "L'identite managee obtient des jetons Entra automatiquement ; aucun secret a stocker ni a faire tourner."}, {"id": "az:com:Q4", "track": "az", "source": "Complementaires", "num": "Q4", "section": "Domaine 1 - Identite, gouvernance et supervision", "q": "Vous concevez l'espace de travail **Log Analytics**. Aucune contrainte de souverainete des donnees, equipes multiples. Quelle conception est recommandee par defaut ?", "opts": [{"k": "A", "t": "Un workspace par ressource"}, {"k": "B", "t": "Un workspace centralise avec RBAC adapte (par ressource ou table)"}, {"k": "C", "t": "Un workspace par developpeur"}, {"k": "D", "t": "Aucun workspace"}], "ans": ["B"], "exp": "Un nombre reduit de workspaces simplifie les requetes et la correlation ; on en separe seulement pour la souverainete, la facturation distincte ou une isolation de securite."}, {"id": "az:com:Q5", "track": "az", "source": "Complementaires", "num": "Q5", "section": "Domaine 2 - Donnees", "q": "Une application mondiale doit lire ses **propres ecritures immediatement** avec une faible latence, sans les couts de la coherence forte. Quel niveau de coherence Cosmos DB ?", "opts": [{"k": "A", "t": "Strong"}, {"k": "B", "t": "Eventual"}, {"k": "C", "t": "Session"}, {"k": "D", "t": "Consistent Prefix"}], "ans": ["C"], "exp": "Session garantit la lecture de ses propres ecritures dans une session client (c'est le niveau par defaut le plus utilise). Strong est limite en latence/geo ; Eventual ne garantit pas l'ordre."}, {"id": "az:com:Q6", "track": "az", "source": "Complementaires", "num": "Q6", "section": "Domaine 2 - Donnees", "q": "Vous hebergez 200 bases Azure SQL de petites applications, chacune avec des pics a des moments differents. Quelle option optimise le cout ?", "opts": [{"k": "A", "t": "200 bases provisionnees individuellement au pic"}, {"k": "B", "t": "Un pool elastique (elastic pool)"}, {"k": "C", "t": "Hyperscale pour chaque base"}, {"k": "D", "t": "200 SQL Managed Instances"}], "ans": ["B"], "exp": "Le pool partage les ressources entre bases dont les pics ne coincident pas."}, {"id": "az:com:Q7", "track": "az", "source": "Complementaires", "num": "Q7", "section": "Domaine 2 - Donnees", "q": "Des documents reglementaires doivent etre conserves **7 ans sans modification ni suppression**, meme par un administrateur. Que configurer ?", "opts": [{"k": "A", "t": "Un verrou de ressource"}, {"k": "B", "t": "Un acces SAS en lecture seule"}, {"k": "C", "t": "Immutable storage (WORM) avec politique de retention verrouillee"}, {"k": "D", "t": "Le chiffrement avec cle client"}], "ans": ["C"], "exp": "Une politique de retention basee sur le temps, une fois verrouillee, empeche modification et suppression. Un verrou de ressource ne protege pas les donnees du blob."}, {"id": "az:com:Q8", "track": "az", "source": "Complementaires", "num": "Q8", "section": "Domaine 2 - Donnees", "q": "Vous migrez une base SQL Server on-premise vers Azure avec **temps d'arret minimal**. Quel outil ?", "opts": [{"k": "A", "t": "Copie manuelle de fichiers .bak par FTP"}, {"k": "B", "t": "Azure Database Migration Service (mode en ligne) / Azure Migrate"}, {"k": "C", "t": "Azure Backup"}, {"k": "D", "t": "Data Box"}], "ans": ["B"], "exp": "La migration en ligne synchronise en continu puis permet une bascule courte. Data Box sert au transfert massif hors ligne."}, {"id": "az:com:Q9", "track": "az", "source": "Complementaires", "num": "Q9", "section": "Domaine 3 - Continuite", "q": "Une application depend en serie de deux composants avec SLA **99,95 %** et **99,9 %**. Quel est le SLA composite approximatif ?", "opts": [{"k": "A", "t": "99,95 %"}, {"k": "B", "t": "99,9 %"}, {"k": "C", "t": "99,85 %"}, {"k": "D", "t": "99,99 %"}], "ans": ["C"], "exp": "Composants en serie : 0,9995 x 0,999 = 0,9985 -> **99,85 %**. Il est toujours inferieur au plus faible. La redondance (parallele) l'ameliore."}, {"id": "az:com:Q10", "track": "az", "source": "Complementaires", "num": "Q10", "section": "Domaine 3 - Continuite", "q": "Vous devez repliquer des VM IaaS vers une autre region pour le DR avec un **RPO de quelques minutes** et des plans de basculement orchestres. Quel service ?", "opts": [{"k": "A", "t": "Azure Backup"}, {"k": "B", "t": "Azure Site Recovery"}, {"k": "C", "t": "Snapshots manuels"}, {"k": "D", "t": "Traffic Manager"}], "ans": ["B"], "exp": "ASR realise la replication continue et les plans de recuperation. Backup protege les donnees mais avec un RPO plus long (sauvegardes planifiees)."}, {"id": "az:com:Q11", "track": "az", "source": "Complementaires", "num": "Q11", "section": "Domaine 3 - Continuite", "q": "Les sauvegardes doivent survivre a une **suppression malveillante** par un attaquant ayant des droits. Que activer ?", "opts": [{"k": "A", "t": "Rien, Azure Backup est inviolable"}, {"k": "B", "t": "Soft delete et immutabilite du coffre Recovery Services, MFA pour les operations critiques"}, {"k": "C", "t": "Une IP publique"}, {"k": "D", "t": "Un tag \"ne pas supprimer\""}], "ans": ["B"], "exp": "Soft delete conserve les sauvegardes supprimees plusieurs jours ; l'immutabilite empeche la reduction de retention ou la suppression prematuree."}, {"id": "az:com:Q12", "track": "az", "source": "Complementaires", "num": "Q12", "section": "Domaine 4 - Infrastructure", "q": "Vous avez besoin d'un equilibreur **global HTTP(S)** avec WAF, acceleration et basculement entre regions. Quel service ?", "opts": [{"k": "A", "t": "Azure Load Balancer"}, {"k": "B", "t": "Application Gateway"}, {"k": "C", "t": "Traffic Manager"}, {"k": "D", "t": "Azure Front Door"}], "ans": ["D"], "exp": "Front Door est un point d'entree global de couche 7 avec WAF et CDN. Application Gateway est regional ; Traffic Manager est du DNS sans proxy."}, {"id": "az:com:Q13", "track": "az", "source": "Complementaires", "num": "Q13", "section": "Domaine 4 - Infrastructure", "q": "Des commandes doivent etre traitees **dans l'ordre**, de facon transactionnelle, avec files d'attente de lettres mortes. Quel service de messagerie ?", "opts": [{"k": "A", "t": "Event Grid"}, {"k": "B", "t": "Event Hubs"}, {"k": "C", "t": "Storage Queue"}, {"k": "D", "t": "Service Bus (sessions, dead-letter)"}], "ans": ["D"], "exp": "Service Bus offre l'ordre FIFO via sessions, transactions, dead-letter et detection de doublons. Event Grid = evenements reactifs ; Event Hubs = flux de telemetrie."}, {"id": "az:com:Q14", "track": "az", "source": "Complementaires", "num": "Q14", "section": "Domaine 4 - Infrastructure", "q": "Une equipe veut deployer des **microservices conteneurises** avec mise a l'echelle jusqu'a zero, sans gerer de cluster Kubernetes. Quel service ?", "opts": [{"k": "A", "t": "AKS"}, {"k": "B", "t": "VM Scale Sets"}, {"k": "C", "t": "Azure Container Apps"}, {"k": "D", "t": "Service Fabric"}], "ans": ["C"], "exp": "Container Apps est serverless (KEDA, Dapr) sans administration de cluster. AKS apporte plus de controle mais plus d'operations."}, {"id": "az:com:Q15", "track": "az", "source": "Complementaires", "num": "Q15", "section": "Domaine 4 - Infrastructure", "q": "Dans une topologie **hub-spoke**, le trafic des spokes vers Internet doit passer par un pare-feu central. Que configurer ?", "opts": [{"k": "A", "t": "Des NSG uniquement"}, {"k": "B", "t": "Azure Firewall dans le hub + route definie par l'utilisateur (UDR) 0.0.0.0/0 sur les spokes"}, {"k": "C", "t": "Un peering sans route"}, {"k": "D", "t": "Une IP publique sur chaque VM"}], "ans": ["B"], "exp": "L'UDR force le trafic vers l'appliance du hub. Les NSG filtrent mais ne centralisent pas l'inspection."}, {"id": "az:com:Q16", "track": "az", "source": "Complementaires", "num": "Q16", "section": "Domaine 4 - Infrastructure", "q": "Une liaison **ExpressRoute** est critique ; quelle conception ameliore sa resilience a faible cout ?", "opts": [{"k": "A", "t": "Aucune redondance"}, {"k": "B", "t": "Ajouter une seconde ExpressRoute dans la meme ville uniquement"}, {"k": "C", "t": "Ajouter une connexion VPN site-a-site de secours (ou un second circuit sur un autre site)"}, {"k": "D", "t": "Utiliser uniquement Internet"}], "ans": ["C"], "exp": "Un VPN en secours est l'option economique ; pour une haute disponibilite maximale, un second circuit dans un autre emplacement de peering."}, {"id": "tf:bas:Q1", "track": "tf", "source": "Base", "num": "Q1", "section": "A. Fondamentaux et CLI", "q": "Que fait `terraform init` ? *(choisir 3)*", "opts": [{"k": "A", "t": "Telecharge les providers declares"}, {"k": "B", "t": "Initialise le backend"}, {"k": "C", "t": "Telecharge les modules"}, {"k": "D", "t": "Cree les ressources d'infrastructure"}, {"k": "E", "t": "Verifie que les ressources existent dans le cloud"}], "ans": ["A", "B", "C"], "exp": "`init` prepare le repertoire de travail (providers, backend, modules, `.terraform.lock.hcl`). Il ne cree aucune ressource (D) et n'interroge pas le cloud (E : c'est le `plan`/refresh)."}, {"id": "tf:bas:Q2", "track": "tf", "source": "Base", "num": "Q2", "section": "A. Fondamentaux et CLI", "q": "Quelle sequence garantit que vous appliquez **exactement** ce qui a ete relu en revue de code ?", "opts": [{"k": "A", "t": "`terraform apply -auto-approve` apres le merge"}, {"k": "B", "t": "`terraform plan -out=tfplan`, revue, puis `terraform apply tfplan`"}, {"k": "C", "t": "`terraform plan`, puis `terraform apply` quelques heures plus tard"}, {"k": "D", "t": "`terraform apply -target=...`"}], "ans": ["B"], "exp": "Un plan sauvegarde est applique tel quel (Terraform refuse de l'appliquer si le state a change depuis). En C, la realite a pu changer entre-temps ; D contourne le graphe complet."}, {"id": "tf:bas:Q3", "track": "tf", "source": "Base", "num": "Q3", "section": "A. Fondamentaux et CLI", "q": "Vous modifiez a la main un tag dans la console cloud. Au prochain `terraform plan`, que se passe-t-il ?", "opts": [{"k": "A", "t": "Rien : Terraform ne regarde que le state"}, {"k": "B", "t": "Terraform detecte la derive pendant le refresh et propose de remettre la valeur de la configuration"}, {"k": "C", "t": "Terraform supprime la ressource"}, {"k": "D", "t": "Le plan echoue"}], "ans": ["B"], "exp": "Le refresh compare state et realite ; le diff avec la config propose de corriger. Pour accepter le changement sans toucher l'infra : `-refresh-only` (puis aligner la config)."}, {"id": "tf:bas:Q4", "track": "tf", "source": "Base", "num": "Q4", "section": "A. Fondamentaux et CLI", "q": "Quelle commande remplace `terraform taint aws_instance.web` (deprecie) ?", "opts": [{"k": "A", "t": "`terraform untaint`"}, {"k": "B", "t": "`terraform apply -replace=\"aws_instance.web\"`"}, {"k": "C", "t": "`terraform state rm aws_instance.web`"}, {"k": "D", "t": "`terraform destroy -target`"}], "ans": ["B"], "exp": "`-replace` marque la ressource pour remplacement **dans le plan** (visible, revuable), contrairement a `taint` qui modifiait le state."}, {"id": "tf:bas:Q5", "track": "tf", "source": "Base", "num": "Q5", "section": "A. Fondamentaux et CLI", "q": "Pour quoi faut-il committer `.terraform.lock.hcl` ?", "opts": [{"k": "A", "t": "Il contient les secrets du provider"}, {"k": "B", "t": "Il verrouille les versions et checksums des providers pour des runs reproductibles"}, {"k": "C", "t": "Il verrouille le state"}, {"k": "D", "t": "Il evite d'executer `terraform init`"}], "ans": ["B"], "exp": "Le verrou d'etat est un mecanisme distinct (backend). Le lock file garantit que CI et collegues utilisent les memes providers."}, {"id": "tf:bas:Q6", "track": "tf", "source": "Base", "num": "Q6", "section": "A. Fondamentaux et CLI", "q": "La contrainte `version = \"~> 5.2\"` autorise :", "opts": [{"k": "A", "t": "5.2.x uniquement"}, {"k": "B", "t": "`>= 5.2, < 6.0`"}, {"k": "C", "t": "`>= 5.2` sans limite"}, {"k": "D", "t": "5.2 exactement"}], "ans": ["B"], "exp": "`~> 5.2` autorise l'increment du dernier chiffre specifie (minor). `~> 5.2.1` serait `>= 5.2.1, < 5.3.0`."}, {"id": "tf:bas:Q7", "track": "tf", "source": "Base", "num": "Q7", "section": "A. Fondamentaux et CLI", "q": "Quelle est la **priorite** correcte des sources de variables (du plus faible au plus fort) ?", "opts": [{"k": "A", "t": "`-var` < `terraform.tfvars` < env `TF_VAR_*` < default"}, {"k": "B", "t": "default < env `TF_VAR_*` < `terraform.tfvars` < `*.auto.tfvars` < `-var` / `-var-file`"}, {"k": "C", "t": "default < `-var` < `terraform.tfvars`"}, {"k": "D", "t": "`terraform.tfvars` < default < `-var`"}], "ans": ["B"], "exp": "Le dernier `-var`/`-var-file` de la ligne de commande l'emporte toujours."}, {"id": "tf:bas:Q8", "track": "tf", "source": "Base", "num": "Q8", "section": "A. Fondamentaux et CLI", "q": "Qu'est-ce que le **state** ?", "opts": [{"k": "A", "t": "Une copie du code Terraform"}, {"k": "B", "t": "Le mapping entre les ressources declarees et les ressources reelles, avec leurs attributs connus"}, {"k": "C", "t": "Un cache de modules"}, {"k": "D", "t": "Un journal des commandes"}], "ans": ["B"], "exp": "Sans state, Terraform ne sait pas quelles ressources lui appartiennent."}, {"id": "tf:bas:Q9", "track": "tf", "source": "Base", "num": "Q9", "section": "A. Fondamentaux et CLI", "q": "Un collegue lance `terraform apply` pendant que votre pipeline en execute un sur le meme state. Que se passe-t-il avec un backend GCS ou azurerm ?", "opts": [{"k": "A", "t": "Les deux s'executent et la derniere ecriture gagne"}, {"k": "B", "t": "Le second echoue avec `Error acquiring the state lock`"}, {"k": "C", "t": "Terraform fusionne les states"}, {"k": "D", "t": "Le second est mis en file d'attente automatiquement"}], "ans": ["B"], "exp": "Le verrouillage empeche les ecritures concurrentes. (`-lock-timeout=5m` permet d'attendre.)"}, {"id": "tf:bas:Q10", "track": "tf", "source": "Base", "num": "Q10", "section": "A. Fondamentaux et CLI", "q": "Quel est le rapport entre `terraform refresh` et `terraform apply -refresh-only` ?", "opts": [{"k": "A", "t": "Identiques, aucune difference"}, {"k": "B", "t": "`refresh` est deprecie ; `apply -refresh-only` montre le plan de mise a jour du state et demande confirmation"}, {"k": "C", "t": "`refresh` modifie l'infrastructure"}, {"k": "D", "t": "`-refresh-only` detruit la derive"}], "ans": ["B"], "exp": "Ni l'un ni l'autre ne modifie l'infrastructure, mais `-refresh-only` est plus sur car on **voit** les changements avant de les ecrire dans le state."}, {"id": "tf:bas:Q11", "track": "tf", "source": "Base", "num": "Q11", "section": "A. Fondamentaux et CLI", "q": "Que fait `terraform plan -detailed-exitcode` ?", "opts": [{"k": "A", "t": "Affiche des logs plus detailles"}, {"k": "B", "t": "Retourne `0` (rien), `1` (erreur) ou `2` (changements) : utile pour detecter le drift en CI"}, {"k": "C", "t": "Applique les changements"}, {"k": "D", "t": "Valide la syntaxe"}], "ans": ["B"], "exp": ""}, {"id": "tf:bas:Q12", "track": "tf", "source": "Base", "num": "Q12", "section": "A. Fondamentaux et CLI", "q": "`terraform validate` verifie :", "opts": [{"k": "A", "t": "Que les ressources existent dans le cloud"}, {"k": "B", "t": "La validite syntaxique et la coherence interne de la configuration (pas de credentials requis)"}, {"k": "C", "t": "Les couts"}, {"k": "D", "t": "La conformite aux politiques"}], "ans": ["B"], "exp": "Il ne contacte pas les APIs. Les erreurs d'API/permissions n'apparaissent qu'au `plan`/`apply`."}, {"id": "tf:bas:Q13", "track": "tf", "source": "Base", "num": "Q13", "section": "B. Langage HCL", "q": "```hcl\nvariable \"names\" { default = [\"a\", \"b\", \"c\"] }\nresource \"local_file\" \"f\" {\n  count    = length(var.names)\n  filename = \"${var.names[count.index]}.txt\"\n  content  = \"x\"\n}\n```\nVous supprimez `\"b\"` de la liste. Que montre le plan ?", "opts": [{"k": "A", "t": "Seul `local_file.f[1]` est detruit"}, {"k": "B", "t": "`f[1]` est modifie (devient `c.txt`) et `f[2]` est detruit : les indices se decalent"}, {"k": "C", "t": "Rien ne change"}, {"k": "D", "t": "Tout est recree"}], "ans": ["B"], "exp": "`count` adresse par **index**. Avec `for_each = toset(var.names)`, seul `f[\"b\"]` serait detruit. C'est LA raison de preferer `for_each` pour des collections."}, {"id": "tf:bas:Q14", "track": "tf", "source": "Base", "num": "Q14", "section": "B. Langage HCL", "q": "```hcl\nvariable \"users\" { default = [\"alice\", \"bob\"] }\nresource \"x\" \"u\" { for_each = var.users }\n```\nResultat ?", "opts": [{"k": "A", "t": "Cree deux ressources"}, {"k": "B", "t": "Erreur : `for_each` exige une map ou un set de strings, pas une liste"}, {"k": "C", "t": "Cree une ressource"}, {"k": "D", "t": "Erreur de syntaxe sur `default`"}], "ans": ["B"], "exp": "Corriger : `for_each = toset(var.users)`. Avec un set, `each.key == each.value`."}, {"id": "tf:bas:Q15", "track": "tf", "source": "Base", "num": "Q15", "section": "B. Langage HCL", "q": "Quelle est la valeur de `merge({a = 1, b = 2}, {b = 3, c = 4})` ?", "opts": [{"k": "A", "t": "`{a=1, b=2, c=4}`"}, {"k": "B", "t": "`{a=1, b=3, c=4}`"}, {"k": "C", "t": "Erreur : cle dupliquee"}, {"k": "D", "t": "`{b=3, c=4}`"}], "ans": ["B"], "exp": "En cas de conflit, la **derniere** map l'emporte."}, {"id": "tf:bas:Q16", "track": "tf", "source": "Base", "num": "Q16", "section": "B. Langage HCL", "q": "Valeur de `cidrsubnet(\"10.0.0.0/16\", 8, 5)` ?", "opts": [{"k": "A", "t": "`10.0.5.0/24`"}, {"k": "B", "t": "`10.0.0.0/24`"}, {"k": "C", "t": "`10.5.0.0/16`"}, {"k": "D", "t": "`10.0.0.5/24`"}], "ans": ["A"], "exp": "On ajoute 8 bits au prefixe (/16 -> /24) et on prend le sous-reseau n°5 : `10.0.5.0/24`."}, {"id": "tf:bas:Q17", "track": "tf", "source": "Base", "num": "Q17", "section": "B. Langage HCL", "q": "Que produit ceci ?\n```hcl\nlocals { servers = [{n=\"a\", z=\"x\"}, {n=\"b\", z=\"x\"}, {n=\"c\", z=\"y\"}] }\noutput \"o\" { value = { for s in local.servers : s.z => s.n } }\n```", "opts": [{"k": "A", "t": "`{x=[\"a\",\"b\"], y=[\"c\"]}`"}, {"k": "B", "t": "Une erreur : cles dupliquees (`x` apparait deux fois)"}, {"k": "C", "t": "`{x=\"b\", y=\"c\"}`"}, {"k": "D", "t": "`{x=\"a\", y=\"c\"}`"}], "ans": ["B"], "exp": "Un `for` produisant une map exige des cles **uniques**. Pour regrouper, ajouter `...` : `{ for s in local.servers : s.z => s.n... }` -> `{x=[\"a\",\"b\"], y=[\"c\"]}`."}, {"id": "tf:bas:Q18", "track": "tf", "source": "Base", "num": "Q18", "section": "B. Langage HCL", "q": "Quel est l'interet de `try(var.config.timeout, 30)` ?", "opts": [{"k": "A", "t": "Reessayer l'appel API 30 fois"}, {"k": "B", "t": "Retourner 30 si l'attribut `timeout` n'existe pas ou provoque une erreur"}, {"k": "C", "t": "Convertir en nombre"}, {"k": "D", "t": "Definir un timeout de 30 s"}], "ans": ["B"], "exp": "`try` evalue les expressions dans l'ordre et retourne la premiere sans erreur. `can()` retourne un booleen."}, {"id": "tf:bas:Q19", "track": "tf", "source": "Base", "num": "Q19", "section": "B. Langage HCL", "q": "Quand utiliser un bloc `dynamic` ?", "opts": [{"k": "A", "t": "Pour creer plusieurs ressources"}, {"k": "B", "t": "Pour generer des blocs imbriques repetables a l'interieur d'une ressource (ex. `security_rule`, `ingress`)"}, {"k": "C", "t": "Pour lire une data source"}, {"k": "D", "t": "Pour creer des variables"}], "ans": ["B"], "exp": "Pour plusieurs ressources : `count`/`for_each`."}, {"id": "tf:bas:Q20", "track": "tf", "source": "Base", "num": "Q20", "section": "B. Langage HCL", "q": "Une variable est declaree `sensitive = true`. Laquelle des affirmations est **vraie** ?", "opts": [{"k": "A", "t": "Sa valeur est chiffree dans le state"}, {"k": "B", "t": "Sa valeur est masquee dans la sortie CLI, mais stockee en clair dans le state"}, {"k": "C", "t": "Elle n'apparait pas dans le state"}, {"k": "D", "t": "Elle ne peut pas etre utilisee dans une ressource"}], "ans": ["B"], "exp": "Proteger le state est indispensable. Pour eviter la persistance, voir les *ephemeral values* / arguments *write-only* (versions recentes)."}, {"id": "tf:bas:Q21", "track": "tf", "source": "Base", "num": "Q21", "section": "B. Langage HCL", "q": "Quelle difference entre `validation` dans une variable et `precondition` dans `lifecycle` ?", "opts": [{"k": "A", "t": "Aucune"}, {"k": "B", "t": "`validation` verifie une valeur d'entree seule ; `precondition` verifie une hypothese dans le contexte d'une ressource (peut referencer d'autres objets, data sources)"}, {"k": "C", "t": "`precondition` ne bloque jamais"}, {"k": "D", "t": "`validation` s'execute apres l'apply"}], "ans": ["B"], "exp": "(`validation` ne peut referencer, historiquement, que la variable elle-meme ; `check` est la version non bloquante.)"}, {"id": "tf:bas:Q22", "track": "tf", "source": "Base", "num": "Q22", "section": "B. Langage HCL", "q": "```hcl\nresource \"aws_instance\" \"x\" {\n  lifecycle { create_before_destroy = true }\n  tags = { Name = \"web\" }\n  # ... l'API impose un nom unique de ressource\n}\n```\nQuel piege avec `create_before_destroy` ?", "opts": [{"k": "A", "t": "Aucun"}, {"k": "B", "t": "Les deux versions doivent coexister : si un attribut doit etre unique (nom), la creation du remplacant echoue ; utiliser `name_prefix` ou un suffixe aleatoire"}, {"k": "C", "t": "La destruction est impossible"}, {"k": "D", "t": "Cela desactive le state"}], "ans": ["B"], "exp": ""}, {"id": "tf:bas:Q23", "track": "tf", "source": "Base", "num": "Q23", "section": "B. Langage HCL", "q": "Pourquoi utiliser `ignore_changes = [template[0].containers[0].image]` sur un service Cloud Run ?", "opts": [{"k": "A", "t": "Pour accelerer le plan"}, {"k": "B", "t": "Parce que l'image est mise a jour hors Terraform (Cloud Deploy/CI) et Terraform ne doit pas la \"remettre en arriere\""}, {"k": "C", "t": "Pour chiffrer l'image"}, {"k": "D", "t": "Pour forcer le rollback"}], "ans": ["B"], "exp": "Partage des responsabilites : Terraform gere l'infrastructure, le pipeline gere la version deployee."}, {"id": "tf:bas:Q24", "track": "tf", "source": "Base", "num": "Q24", "section": "B. Langage HCL", "q": "`prevent_destroy = true` est present sur une base. Un developpeur **supprime le bloc `resource`** de la config puis `apply`. Que se passe-t-il ?", "opts": [{"k": "A", "t": "Terraform refuse de detruire"}, {"k": "B", "t": "La base est detruite : `prevent_destroy` n'existe plus dans la config"}, {"k": "C", "t": "La base est deplacee"}, {"k": "D", "t": "Terraform demande une confirmation speciale"}], "ans": ["B"], "exp": "`prevent_destroy` n'est pas une protection absolue. Complements : `deletion_protection` du provider, locks Azure, IAM, Org Policy, revue de PR."}, {"id": "tf:bas:Q25", "track": "tf", "source": "Base", "num": "Q25", "section": "B. Langage HCL", "q": "Quelle est la difference entre `depends_on` et une reference implicite ?", "opts": [{"k": "A", "t": "`depends_on` est plus rapide"}, {"k": "B", "t": "Une reference (`x.y.id`) cree une dependance automatiquement ; `depends_on` sert aux dependances non visibles et peut rendre le plan plus conservateur"}, {"k": "C", "t": "Aucune"}, {"k": "D", "t": "`depends_on` supprime le parallelisme global"}], "ans": ["B"], "exp": ""}, {"id": "tf:bas:Q26", "track": "tf", "source": "Base", "num": "Q26", "section": "B. Langage HCL", "q": "Pourquoi les provisioners sont-ils consideres comme **dernier recours** ?", "opts": [{"k": "A", "t": "Ils sont payants"}, {"k": "B", "t": "Ils ne sont pas declaratifs, ne sont pas modelises dans le plan et leurs echecs sont difficiles a rejouer ; il vaut mieux cloud-init, images pre-construites ou ressources natives"}, {"k": "C", "t": "Ils ne fonctionnent que sur Windows"}, {"k": "D", "t": "Ils modifient le state"}], "ans": ["B"], "exp": ""}, {"id": "tf:bas:Q27", "track": "tf", "source": "Base", "num": "Q27", "section": "C. State et refactoring", "q": "Vous renommez `google_storage_bucket.logs` en `google_storage_bucket.audit` dans le code. Comment eviter la destruction/recreation du bucket ?", "opts": [{"k": "A", "t": "Impossible"}, {"k": "B", "t": "Ajouter un bloc `moved { from = google_storage_bucket.logs  to = google_storage_bucket.audit }`"}, {"k": "C", "t": "`terraform taint`"}, {"k": "D", "t": "Supprimer le state"}], "ans": ["B"], "exp": "Le bloc `moved` est declaratif et revuable (equivalent versionne de `terraform state mv`)."}, {"id": "tf:bas:Q28", "track": "tf", "source": "Base", "num": "Q28", "section": "C. State et refactoring", "q": "Une ressource existe deja dans le cloud (creee a la main). Quelle approche **declarative et revuable** pour l'adopter ?", "opts": [{"k": "A", "t": "`terraform state push`"}, {"k": "B", "t": "Un bloc `import { to = ... id = ... }` + `terraform plan` / `-generate-config-out`"}, {"k": "C", "t": "La supprimer puis la recreer"}, {"k": "D", "t": "`terraform refresh`"}], "ans": ["B"], "exp": "Disponible depuis 1.5. L'import apparait dans le plan, donc passe en revue de PR."}, {"id": "tf:bas:Q29", "track": "tf", "source": "Base", "num": "Q29", "section": "C. State et refactoring", "q": "Vous voulez que Terraform **cesse de gerer** une ressource sans la detruire. Quelle approche moderne ?", "opts": [{"k": "A", "t": "`terraform destroy -target`"}, {"k": "B", "t": "Un bloc `removed { from = ... lifecycle { destroy = false } }` (ou `terraform state rm`)"}, {"k": "C", "t": "La mettre en commentaire"}, {"k": "D", "t": "`prevent_destroy`"}], "ans": ["B"], "exp": "Mettre en commentaire sans `removed` **detruirait** la ressource."}, {"id": "tf:bas:Q30", "track": "tf", "source": "Base", "num": "Q30", "section": "C. State et refactoring", "q": "Un `terraform apply` a ete interrompu (CI tue) et le verrou persiste. Quand utiliser `force-unlock` ?", "opts": [{"k": "A", "t": "Toujours en premier"}, {"k": "B", "t": "Seulement apres avoir verifie qu'aucun run n'est reellement en cours sur ce state"}, {"k": "C", "t": "Jamais"}, {"k": "D", "t": "Uniquement en local"}], "ans": ["B"], "exp": "Debloquer un verrou actif peut corrompre le state."}, {"id": "tf:bas:Q31", "track": "tf", "source": "Base", "num": "Q31", "section": "C. State et refactoring", "q": "Pourquoi le bloc `backend` n'accepte-t-il pas `var.bucket` ?", "opts": [{"k": "A", "t": "Bug connu"}, {"k": "B", "t": "Le backend est initialise avant l'evaluation des variables ; utiliser la configuration partielle (`-backend-config`)"}, {"k": "C", "t": "Les variables sont interdites partout"}, {"k": "D", "t": "Seuls les backends cloud l'interdisent"}], "ans": ["B"], "exp": ""}, {"id": "tf:bas:Q32", "track": "tf", "source": "Base", "num": "Q32", "section": "C. State et refactoring", "q": "Que contient le state qui pose un probleme de securite ?", "opts": [{"k": "A", "t": "Rien de sensible"}, {"k": "B", "t": "Les attributs des ressources, dont des secrets en clair (mots de passe, cles) meme marques `sensitive`"}, {"k": "C", "t": "Le code source"}, {"k": "D", "t": "Les journaux"}], "ans": ["B"], "exp": "D'ou : backend chiffre + IAM strict + versioning + jamais dans Git."}, {"id": "tf:bas:Q33", "track": "tf", "source": "Base", "num": "Q33", "section": "C. State et refactoring", "q": "Pour un projet avec reseau, plateforme et applications, quelle organisation du state est recommandee ?", "opts": [{"k": "A", "t": "Un seul state geant pour tout"}, {"k": "B", "t": "Plusieurs states decoupes par couche/cycle de vie/equipe, avec des droits distincts"}, {"k": "C", "t": "Un state par ressource"}, {"k": "D", "t": "Un state par developpeur"}], "ans": ["B"], "exp": "Reduit le rayon d'impact, accelere les plans, permet des droits fins. Eviter l'exces (C)."}, {"id": "tf:bas:Q34", "track": "tf", "source": "Base", "num": "Q34", "section": "C. State et refactoring", "q": "Pour lire l'ID d'un VPC gere dans un **autre state**, quelle option est preferee ?", "opts": [{"k": "A", "t": "`terraform_remote_state` toujours"}, {"k": "B", "t": "Une data source native (`data \"google_compute_network\"`) qui lit la realite, ou un output publie dans un store (couplage faible)"}, {"k": "C", "t": "Copier l'ID en dur"}, {"k": "D", "t": "Partager le meme state"}], "ans": ["B"], "exp": "`terraform_remote_state` donne acces a **tout** le state source (y compris des secrets) et cree un couplage fort."}, {"id": "tf:bas:Q35", "track": "tf", "source": "Base", "num": "Q35", "section": "C. State et refactoring", "q": "Que fait `terraform state rm google_storage_bucket.b` ?", "opts": [{"k": "A", "t": "Detruit le bucket"}, {"k": "B", "t": "Retire le bucket du state ; il continue d'exister, et le prochain plan voudra le recreer s'il est toujours dans la config"}, {"k": "C", "t": "Supprime le code"}, {"k": "D", "t": "Verrouille le bucket"}], "ans": ["B"], "exp": ""}, {"id": "tf:bas:Q36", "track": "tf", "source": "Base", "num": "Q36", "section": "C. State et refactoring", "q": "Les workspaces CLI conviennent-ils pour separer dev et prod ?", "opts": [{"k": "A", "t": "Oui, c'est la methode recommandee"}, {"k": "B", "t": "Non en general : meme backend, memes credentials, risque d'erreur de workspace ; preferer dossiers/states separes et comptes/projets/abonnements distincts"}, {"k": "C", "t": "Oui mais seulement sur Azure"}, {"k": "D", "t": "Non, ils n'existent pas"}], "ans": ["B"], "exp": "Les workspaces CLI sont utiles pour des copies **identiques et ephemeres** (tests). Ils different des workspaces HCP Terraform."}, {"id": "tf:bas:Q37", "track": "tf", "source": "Base", "num": "Q37", "section": "C. State et refactoring", "q": "Vous migrez le state du backend local vers GCS. Quelles etapes ?", "opts": [{"k": "A", "t": "Copier le fichier a la main"}, {"k": "B", "t": "Ajouter le bloc `backend \"gcs\"` puis `terraform init -migrate-state`"}, {"k": "C", "t": "`terraform apply`"}, {"k": "D", "t": "`terraform init -reconfigure` (copie le state)"}], "ans": ["B"], "exp": "`-reconfigure` **ignore** l'ancien state sans le migrer."}, {"id": "tf:bas:Q38", "track": "tf", "source": "Base", "num": "Q38", "section": "C. State et refactoring", "q": "Comment detecter automatiquement le **drift** chaque nuit ?", "opts": [{"k": "A", "t": "Impossible"}, {"k": "B", "t": "Un job planifie executant `terraform plan -detailed-exitcode` (code 2 = changements) avec alerte, ou la detection de drift de HCP Terraform"}, {"k": "C", "t": "Relancer `apply` chaque nuit"}, {"k": "D", "t": "Supprimer le state"}], "ans": ["B"], "exp": "Ne pas auto-appliquer : un humain decide si c'est un drift a corriger ou a accepter."}, {"id": "tf:bas:Q39", "track": "tf", "source": "Base", "num": "Q39", "section": "D. Modules, tests, CI/CD", "q": "Un module enfant doit-il contenir un bloc `provider` ?", "opts": [{"k": "A", "t": "Oui, toujours"}, {"k": "B", "t": "Non : il declare `required_providers`, la configuration vient du module appelant (`providers = {...}`), sinon on ne peut plus l'utiliser avec `count/for_each` ni le supprimer proprement"}, {"k": "C", "t": "Oui pour les alias"}, {"k": "D", "t": "Seulement pour Azure"}], "ans": ["B"], "exp": ""}, {"id": "tf:bas:Q40", "track": "tf", "source": "Base", "num": "Q40", "section": "D. Modules, tests, CI/CD", "q": "Quelle est la bonne pratique de versionnement pour un module consomme en production ?", "opts": [{"k": "A", "t": "`source = \"git::https://...git\"` (branche par defaut)"}, {"k": "B", "t": "`source = \"git::https://...git?ref=v1.4.0\"` ou `version = \"~> 1.4\"` (Registry)"}, {"k": "C", "t": "Copier le code a chaque fois"}, {"k": "D", "t": "`ref=main`"}], "ans": ["B"], "exp": "Un tag immuable rend les deploiements reproductibles."}, {"id": "tf:bas:Q41", "track": "tf", "source": "Base", "num": "Q41", "section": "D. Modules, tests, CI/CD", "q": "Quelle commande/fonction teste un module avec des assertions sur le plan, sans outils externes ?", "opts": [{"k": "A", "t": "`terraform validate`"}, {"k": "B", "t": "`terraform test` (fichiers `.tftest.hcl`, `run` + `assert`, `mock_provider`)"}, {"k": "C", "t": "`terraform console`"}, {"k": "D", "t": "`terraform graph`"}], "ans": ["B"], "exp": "Disponible depuis 1.6 ; `mock_provider` depuis 1.7."}, {"id": "tf:bas:Q42", "track": "tf", "source": "Base", "num": "Q42", "section": "D. Modules, tests, CI/CD", "q": "Quel outil analyse la **securite statique** (bucket public, chiffrement absent) de la configuration avant le deploiement ?", "opts": [{"k": "A", "t": "`terraform fmt`"}, {"k": "B", "t": "Checkov / Trivy / KICS"}, {"k": "C", "t": "`terraform show`"}, {"k": "D", "t": "tflint uniquement"}], "ans": ["B"], "exp": "tflint cible plutot les erreurs de provider/convention ; Checkov/Trivy les mauvaises configurations de securite."}, {"id": "tf:bas:Q43", "track": "tf", "source": "Base", "num": "Q43", "section": "D. Modules, tests, CI/CD", "q": "Dans un pipeline, comment appliquer les changements apres approbation en garantissant que le plan applique est **celui valide** ?", "opts": [{"k": "A", "t": "Rejouer `plan` puis `apply -auto-approve`"}, {"k": "B", "t": "Sauvegarder `tfplan` en artefact au moment de la PR, puis `terraform apply tfplan` apres approbation dans un environnement protege"}, {"k": "C", "t": "Appliquer en local"}, {"k": "D", "t": "Utiliser `-target`"}], "ans": ["B"], "exp": "Terraform refuse un plan perime (state change depuis)."}, {"id": "tf:bas:Q44", "track": "tf", "source": "Base", "num": "Q44", "section": "D. Modules, tests, CI/CD", "q": "Comment authentifier un pipeline **GitHub Actions** vers GCP et Azure **sans secret statique** ?", "opts": [{"k": "A", "t": "Cle JSON / client secret dans les secrets GitHub"}, {"k": "B", "t": "OIDC : Workload Identity Federation (GCP) / federated credentials (Azure) avec `id-token: write`"}, {"k": "C", "t": "Mot de passe d'un utilisateur"}, {"k": "D", "t": "Clefs SSH"}], "ans": ["B"], "exp": "Jetons courts, lies au depot/branche/environnement via des conditions."}, {"id": "tf:bas:Q45", "track": "tf", "source": "Base", "num": "Q45", "section": "D. Modules, tests, CI/CD", "q": "Quelle est la difference entre Sentinel (ou OPA) et Azure Policy / Org Policy ?", "opts": [{"k": "A", "t": "Aucune"}, {"k": "B", "t": "Sentinel/OPA evaluent le plan avant l'apply (shift-left) ; Azure Policy / Org Policy appliquent les regles dans le cloud, quel que soit l'outil (garde-fou final). On combine les deux"}, {"k": "C", "t": "Sentinel ne fonctionne qu'avec Azure"}, {"k": "D", "t": "Org Policy remplace IAM"}], "ans": ["B"], "exp": ""}, {"id": "tf:bas:Q46", "track": "tf", "source": "Base", "num": "Q46", "section": "D. Modules, tests, CI/CD", "q": "Que signifie OpenTofu ?", "opts": [{"k": "A", "t": "Un plugin pour Terraform"}, {"k": "B", "t": "Un fork open source (Linux Foundation) de Terraform, cree apres le passage de Terraform a la licence BSL 1.1"}, {"k": "C", "t": "Un langage different"}, {"k": "D", "t": "Un produit Microsoft"}], "ans": ["B"], "exp": "Globalement compatible ; certaines fonctions divergent (ex. chiffrement natif du state). A connaitre pour le contexte, pas pour les examens Terraform Associate (qui portent sur Terraform/HCP)."}, {"id": "tf:bas:Q47", "track": "tf", "source": "Base", "num": "Q47", "section": "E. Scenarios GCP et Azure", "q": "Un pipeline CI doit appliquer Terraform sur GCP. L'identite utilisee peut creer des SA et modifier l'IAM. Comment reduire le risque ?", "opts": [{"k": "A", "t": "Donner `roles/owner`"}, {"k": "B", "t": "SA dediee par couche avec moindre privilege, acces via WIF conditionne au depot/branche, separation plan (lecture) / apply (ecriture, environnement protege)"}, {"k": "C", "t": "Partager un SA admin entre tous les depots"}, {"k": "D", "t": "Utiliser un compte personnel"}], "ans": ["B"], "exp": ""}, {"id": "tf:bas:Q48", "track": "tf", "source": "Base", "num": "Q48", "section": "E. Scenarios GCP et Azure", "q": "Dans quel ordre le risque est-il croissant ? `google_project_iam_member`, `google_project_iam_binding`, `google_project_iam_policy`", "opts": [{"k": "A", "t": "`policy` < `binding` < `member`"}, {"k": "B", "t": "`member` (ajoute un membre) < `binding` (remplace tous les membres d'un role) < `policy` (remplace toute la policy)"}, {"k": "C", "t": "Tous equivalents"}, {"k": "D", "t": "`binding` < `member` < `policy`"}], "ans": ["B"], "exp": "`iam_policy` peut vous verrouiller hors du projet. Par defaut, `iam_member`."}, {"id": "tf:bas:Q49", "track": "tf", "source": "Base", "num": "Q49", "section": "E. Scenarios GCP et Azure", "q": "`terraform destroy` d'un environnement desactive une API partagee (ex. `compute.googleapis.com`) et casse d'autres ressources. Reglage a appliquer ?", "opts": [{"k": "A", "t": "Supprimer `google_project_service`"}, {"k": "B", "t": "`disable_on_destroy = false`"}, {"k": "C", "t": "`prevent_destroy = true` sur le projet"}, {"k": "D", "t": "Rien"}], "ans": ["B"], "exp": "Evite de desactiver l'API lors de la destruction de la ressource."}, {"id": "tf:bas:Q50", "track": "tf", "source": "Base", "num": "Q50", "section": "E. Scenarios GCP et Azure", "q": "`terraform apply` retourne `Error 409: ... already exists` pour un bucket GCS cree manuellement. Que faites-vous ?", "opts": [{"k": "A", "t": "Supprimer le bucket manuellement et relancer"}, {"k": "B", "t": "Importer la ressource (bloc `import`) puis aligner la configuration"}, {"k": "C", "t": "Changer de provider"}, {"k": "D", "t": "Utiliser `-target`"}], "ans": ["B"], "exp": "La suppression pourrait detruire des donnees. L'import adopte la ressource existante."}, {"id": "tf:bas:Q51", "track": "tf", "source": "Base", "num": "Q51", "section": "E. Scenarios GCP et Azure", "q": "Sur Azure, votre pipeline s'authentifie avec un client secret qui expire tous les 6 mois et a deja fuite une fois. Alternative ?", "opts": [{"k": "A", "t": "Secret plus long"}, {"k": "B", "t": "Federated credential (OIDC) sur une identite (app registration ou managed identity) : `ARM_USE_OIDC=true`, pas de secret"}, {"k": "C", "t": "Compte utilisateur avec MFA desactive"}, {"k": "D", "t": "Cle de compte de stockage"}], "ans": ["B"], "exp": "Ou **managed identity** si le runner est dans Azure."}, {"id": "tf:bas:Q52", "track": "tf", "source": "Base", "num": "Q52", "section": "E. Scenarios GCP et Azure", "q": "Une fonctionnalite Azure toute recente n'est **pas encore supportee** par `azurerm`. Que faire ?", "opts": [{"k": "A", "t": "Attendre indefiniment"}, {"k": "B", "t": "Utiliser le provider `azapi` (acces direct a l'API ARM) pour cette ressource, tout en restant dans Terraform"}, {"k": "C", "t": "Passer au portail"}, {"k": "D", "t": "Forker azurerm"}], "ans": ["B"], "exp": "Bicep est l'autre option (jour-0), mais `azapi` evite de quitter Terraform."}, {"id": "tf:bas:Q53", "track": "tf", "source": "Base", "num": "Q53", "section": "E. Scenarios GCP et Azure", "q": "Vous gerez le state Azure dans un compte de stockage. Quelles mesures de securite ? *(choisir 3)*", "opts": [{"k": "A", "t": "Acces par Entra ID (RBAC) (`use_azuread_auth`) plutot que cle de compte"}, {"k": "B", "t": "Soft delete et versioning des blobs"}, {"k": "C", "t": "Compte de stockage public pour faciliter la CI"}, {"k": "D", "t": "Restriction reseau (pare-feu / Private Endpoint)"}, {"k": "E", "t": "Partager la cle de compte entre tous les developpeurs"}], "ans": ["A", "B", "D"], "exp": "Le state contient des secrets : acces restreint, recuperation possible, reseau limite."}, {"id": "tf:bas:Q54", "track": "tf", "source": "Base", "num": "Q54", "section": "E. Scenarios GCP et Azure", "q": "Apres `terraform apply` sur Azure, une affectation de role (`azurerm_role_assignment`) est creee mais la ressource qui en depend echoue en `AuthorizationFailed` pendant quelques minutes. Pourquoi, et que faire ?", "opts": [{"k": "A", "t": "Bug du provider"}, {"k": "B", "t": "Propagation RBAC (coherence eventuelle) ; ajouter un delai (`time_sleep`) ou reessayer, et ordonner via `depends_on`"}, {"k": "C", "t": "Le role n'existe pas"}, {"k": "D", "t": "Le state est corrompu"}], "ans": ["B"], "exp": ""}, {"id": "tf:bas:Q55", "track": "tf", "source": "Base", "num": "Q55", "section": "F. Debug", "q": "`Error: Cycle: google_compute_firewall.a, google_compute_instance.b`. Que signifie-t-elle et comment la corriger ?", "opts": [], "ans": [], "exp": "Une **dependance circulaire** : `a` depend de `b` et inversement (ex. regle de pare-feu qui reference l'instance qui reference la regle via un tag/ID). Corriger en **cassant le cycle** : utiliser une valeur statique (tag reseau, nom) au lieu de l'attribut de l'autre ressource, ou extraire la liaison dans une ressource separee. `terraform graph` aide a visualiser le cycle.", "open": true}, {"id": "tf:bas:Q56", "track": "tf", "source": "Base", "num": "Q56", "section": "F. Debug", "q": "Le plan indique `# aws_db_instance.main must be replaced ... forces replacement` apres un changement de variable. Que faites-vous **avant** d'appliquer ?", "opts": [], "ans": [], "exp": "1. Identifier l'attribut marque `# forces replacement` dans le plan.\n2. Se demander si le changement est voulu ; sinon corriger la valeur / utiliser `ignore_changes`.\n3. Si voulu : **sauvegarder les donnees** (snapshot), verifier `prevent_destroy`/`deletion_protection`, prevoir `create_before_destroy` et la migration de donnees, puis relire le plan en PR.\nNe jamais appliquer a l'aveugle un remplacement sur une ressource avec etat.", "open": true}, {"id": "tf:bas:Q57", "track": "tf", "source": "Base", "num": "Q57", "section": "F. Debug", "q": "Un `plan` montre un diff **permanent** sur une liste de blocs `rule` alors que rien
