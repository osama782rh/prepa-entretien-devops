n'a change. Pistes ?", "opts": [], "ans": [], "exp": "Le service API **reordonne ou normalise** la valeur (ordre, casse, valeurs par defaut ajoutees). Pistes : trier/normaliser dans la config (`sort`, `lower`), utiliser des `set` plutot que des listes si l'ordre n'est pas significatif, `ignore_changes` cible sur l'attribut, ou mettre a jour le provider (bug connu). Verifier avec `terraform show -json` la valeur reelle vs configuree.", "open": true}, {"id": "tf:bas:Q58", "track": "tf", "source": "Base", "num": "Q58", "section": "F. Debug", "q": "Votre `plan` prend 25 minutes et le state fait 80 Mo. Quelles actions, par ordre d'efficacite ?", "opts": [], "ans": [], "exp": "1. **Decouper le state** par couche/equipe (reseau, plateforme, apps).\n2. Remplacer les `terraform_remote_state` lourds par des data sources ciblees.\n3. Eviter des modules qui instancient des centaines de ressources avec des data sources redondantes.\n4. Ajuster `-parallelism` (monter si pas de 429, baisser sinon) ; utiliser `-refresh=false` seulement en depannage controle.\n5. `-target` uniquement comme depannage ponctuel, pas comme workflow.", "open": true}, {"id": "tf:com:Q1", "track": "tf", "source": "Complementaires", "num": "Q1", "section": "A. State et refactoring", "q": "Vous renommez `aws_instance.web` en `aws_instance.app` dans le code sans detruire la ressource. Quelle methode declarative ?", "opts": [{"k": "A", "t": "`terraform state rm` puis `apply`"}, {"k": "B", "t": "Un bloc `moved { from = aws_instance.web  to = aws_instance.app }`"}, {"k": "C", "t": "Supprimer et recreer"}, {"k": "D", "t": "`terraform refresh`"}], "ans": ["B"], "exp": "Le bloc `moved` met a jour l'adresse dans le state lors du plan, versionnable et relu en revue. A ferait recreer la ressource."}, {"id": "tf:com:Q2", "track": "tf", "source": "Complementaires", "num": "Q2", "section": "A. State et refactoring", "q": "Comment importer une ressource existante **en code** (Terraform >= 1.5) et generer une configuration de depart ?", "opts": [{"k": "A", "t": "Bloc `import {}` + `terraform plan -generate-config-out=generated.tf`"}, {"k": "B", "t": "`terraform taint`"}, {"k": "C", "t": "`terraform init -import`"}, {"k": "D", "t": "Impossible sans CLI manuelle"}], "ans": ["A"], "exp": "Le bloc `import` est declaratif ; `-generate-config-out` produit le HCL a relire et nettoyer. L'ancienne CLI `terraform import` reste valide mais imperative."}, {"id": "tf:com:Q3", "track": "tf", "source": "Complementaires", "num": "Q3", "section": "A. State et refactoring", "q": "Une liste de `count = 3` ressources : vous retirez l'element du **milieu**. Quel est le probleme ?", "opts": [{"k": "A", "t": "Aucun"}, {"k": "B", "t": "Les indices se decalent : Terraform detruit et recree les ressources suivantes"}, {"k": "C", "t": "Terraform refuse de planifier"}, {"k": "D", "t": "Seul le dernier est detruit"}], "ans": ["B"], "exp": "`count` identifie par index. Avec `for_each` sur des cles stables, seul l'element retire est detruit."}, {"id": "tf:com:Q4", "track": "tf", "source": "Complementaires", "num": "Q4", "section": "A. State et refactoring", "q": "Une variable marquee `sensitive = true` signifie que sa valeur...", "opts": [{"k": "A", "t": "Est chiffree dans le state"}, {"k": "B", "t": "N'apparait pas dans les sorties CLI, mais reste en clair dans le state"}, {"k": "C", "t": "N'est jamais stockee"}, {"k": "D", "t": "Est stockee dans Vault"}], "ans": ["B"], "exp": "`sensitive` masque l'affichage uniquement. Il faut proteger le state (backend chiffre, acces restreint) et preferer des references a un gestionnaire de secrets."}, {"id": "tf:com:Q5", "track": "tf", "source": "Complementaires", "num": "Q5", "section": "A. State et refactoring", "q": "Pourquoi utiliser un backend distant avec **verrouillage** (locking) ?", "opts": [{"k": "A", "t": "Accelerer le plan"}, {"k": "B", "t": "Empecher deux `apply` concurrents de corrompre le state"}, {"k": "C", "t": "Chiffrer le code"}, {"k": "D", "t": "Supprimer les providers"}], "ans": ["B"], "exp": "Le verrou serialise les operations d'ecriture. Il partage aussi le state entre l'equipe et la CI."}, {"id": "tf:com:Q6", "track": "tf", "source": "Complementaires", "num": "Q6", "section": "B. Langage et lifecycle", "q": "Comment empecher la suppression accidentelle d'une base de donnees de production ?", "opts": [{"k": "A", "t": "`lifecycle { prevent_destroy = true }`"}, {"k": "B", "t": "`ignore_changes = all`"}, {"k": "C", "t": "`create_before_destroy = true`"}, {"k": "D", "t": "`depends_on`"}], "ans": ["A"], "exp": "Terraform echoue si un plan doit detruire la ressource. C change l'ordre de remplacement ; B ignore la derive."}, {"id": "tf:com:Q7", "track": "tf", "source": "Complementaires", "num": "Q7", "section": "B. Langage et lifecycle", "q": "Un autoscaler modifie `desired_capacity` en dehors de Terraform. Comment eviter que le plan le \"corrige\" ?", "opts": [{"k": "A", "t": "`lifecycle { ignore_changes = [desired_capacity] }`"}, {"k": "B", "t": "`prevent_destroy`"}, {"k": "C", "t": "`terraform taint`"}, {"k": "D", "t": "Supprimer l'attribut du state"}], "ans": ["A"], "exp": "`ignore_changes` laisse un attribut gere hors Terraform ; a utiliser avec precaution."}, {"id": "tf:com:Q8", "track": "tf", "source": "Complementaires", "num": "Q8", "section": "B. Langage et lifecycle", "q": "Que fait `terraform apply -replace=\"aws_instance.web\"` ?", "opts": [{"k": "A", "t": "Supprime du state sans detruire"}, {"k": "B", "t": "Force la recreation de cette ressource au prochain apply (remplace `taint`)"}, {"k": "C", "t": "Importe la ressource"}, {"k": "D", "t": "Rafraichit uniquement"}], "ans": ["B"], "exp": "`-replace` est la methode moderne, visible dans le plan et sans modifier le state avant revue."}, {"id": "tf:com:Q9", "track": "tf", "source": "Complementaires", "num": "Q9", "section": "B. Langage et lifecycle", "q": "Vous devez generer un nombre variable de blocs `ingress` dans une ressource. Quelle construction ?", "opts": [{"k": "A", "t": "`count` sur un bloc"}, {"k": "B", "t": "Un bloc `dynamic \"ingress\"` avec `for_each`"}, {"k": "C", "t": "Une boucle `while`"}, {"k": "D", "t": "Plusieurs fichiers `.tf`"}], "ans": ["B"], "exp": "`dynamic` genere des blocs imbriques repetes a partir d'une collection."}, {"id": "tf:com:Q10", "track": "tf", "source": "Complementaires", "num": "Q10", "section": "B. Langage et lifecycle", "q": "Deux regions du meme provider dans un seul module racine. Comment ?", "opts": [{"k": "A", "t": "Deux workspaces"}, {"k": "B", "t": "Des `provider` avec `alias` et `provider = google.eu` sur les ressources"}, {"k": "C", "t": "Impossible"}, {"k": "D", "t": "Deux backends"}], "ans": ["B"], "exp": "Les alias permettent plusieurs configurations du meme provider ; les modules les recoivent via `providers = { ... }`."}, {"id": "tf:com:Q11", "track": "tf", "source": "Complementaires", "num": "Q11", "section": "B. Langage et lifecycle", "q": "Quel est l'interet de `precondition` / `postcondition` dans `lifecycle` ?", "opts": [{"k": "A", "t": "Accelerer le plan"}, {"k": "B", "t": "Valider des hypotheses (ex. image non obsolete, CIDR valide) et echouer tot avec un message clair"}, {"k": "C", "t": "Remplacer les variables"}, {"k": "D", "t": "Chiffrer les sorties"}], "ans": ["B"], "exp": "Elles verifient des garanties sur les entrees/sorties d'une ressource ou d'un data source."}, {"id": "tf:com:Q12", "track": "tf", "source": "Complementaires", "num": "Q12", "section": "B. Langage et lifecycle", "q": "La contrainte de version `~> 5.0` pour un provider autorise...", "opts": [{"k": "A", "t": "5.0.x uniquement"}, {"k": "B", "t": "Toute version >= 5.0"}, {"k": "C", "t": ">= 5.0 et < 6.0"}, {"k": "D", "t": "Exactement 5.0"}], "ans": ["C"], "exp": "L'operateur `~>` autorise l'incrementation du dernier chiffre indique ; `~> 5.0` = 5.x, `~> 5.0.1` = 5.0.x."}, {"id": "tf:com:Q13", "track": "tf", "source": "Complementaires", "num": "Q13", "section": "C. Environnements, CI et tests", "q": "Pourquoi les workspaces ne sont-ils pas toujours adaptes pour isoler dev et prod ?", "opts": [{"k": "A", "t": "Ils sont obsoletes"}, {"k": "B", "t": "Ils partagent la meme configuration et backend, avec un risque d'erreur de workspace et des identifiants souvent communs"}, {"k": "C", "t": "Ils ne gardent pas de state"}, {"k": "D", "t": "Ils ne supportent pas les variables"}], "ans": ["B"], "exp": "Pour des environnements fortement isoles (comptes/projets distincts, droits differents), preferer des repertoires/etats separes, parfois avec des modules partages."}, {"id": "tf:com:Q14", "track": "tf", "source": "Complementaires", "num": "Q14", "section": "C. Environnements, CI et tests", "q": "Quelles verifications faire dans la CI **avant** un `apply` ? *(choisir 3)*", "opts": [{"k": "A", "t": "`terraform fmt -check`"}, {"k": "B", "t": "`terraform validate`"}, {"k": "C", "t": "`terraform plan` revu (et scanne par un outil de politique)"}, {"k": "D", "t": "`terraform destroy`"}, {"k": "E", "t": "Supprimer le state"}], "ans": ["A", "B", "C"], "exp": "Format, validation syntaxique, plan relu/scanne. D et E sont destructifs."}, {"id": "tf:com:Q15", "track": "tf", "source": "Complementaires", "num": "Q15", "section": "C. Environnements, CI et tests", "q": "Quel outil teste un module avec des **assertions** sans creer d'infrastructure reelle (via `command = plan`) ?", "opts": [{"k": "A", "t": "`terraform graph`"}, {"k": "B", "t": "`terraform test` (fichiers `.tftest.hcl`)"}, {"k": "C", "t": "`terraform console`"}, {"k": "D", "t": "`terraform output`"}], "ans": ["B"], "exp": "`terraform test` execute des runs avec des `assert`, en `plan` ou `apply` (ressources temporaires)."}, {"id": "tf:com:Q16", "track": "tf", "source": "Complementaires", "num": "Q16", "section": "C. Environnements, CI et tests", "q": "Vous voulez retirer une ressource de la gestion Terraform **sans la detruire** dans le cloud. Quelle commande/bloc ?", "opts": [{"k": "A", "t": "`terraform destroy -target`"}, {"k": "B", "t": "`terraform state rm` ou un bloc `removed { lifecycle { destroy = false } }`"}, {"k": "C", "t": "Supprimer le fichier .tf seulement"}, {"k": "D", "t": "`terraform refresh`"}], "ans": ["B"], "exp": "Les deux retirent l'adresse du state sans toucher la ressource reelle. Supprimer simplement le code provoquerait une destruction au prochain apply."}], "courses": [{"track": "gcp", "doc": "Cours", "md": "# Cours - Google Cloud Professional Cloud DevOps Engineer\n\n> Parcours : ce cours -> [questions.md](questions.md) -> [approfondissement.md](approfondissement.md) -> [questions-avancees.md](questions-avancees.md).\n> Terraform (outil d'IaC du parcours) : [../terraform/README.md](../terraform/README.md), lab 4.\n\n## Table des matieres\n\n1. [Presentation de l'examen](#1-presentation-de-lexamen)\n2. [Domaine 1 - Bootstrapping de l'organisation](#2-domaine-1---bootstrapping-de-lorganisation-15-)\n3. [Domaine 2 - CI/CD](#3-domaine-2---pipelines-cicd-25-)\n4. [Domaine 3 - SRE](#4-domaine-3---pratiques-sre-23-)\n5. [Domaine 4 - Supervision](#5-domaine-4---supervision-21-)\n6. [Domaine 5 - Performance et cout](#6-domaine-5---optimisation-des-performances-16-)\n7. [Aide-memoire gcloud et exemples](#7-aide-memoire)\n8. [Pieges classiques et conseils](#8-pieges-classiques-et-conseils)\n\n---\n\n## 1. Presentation de l'examen\n\nCet examen valide la capacite a **construire des pipelines de livraison, operer des services de maniere fiable (SRE) et les superviser** sur Google Cloud.\n\nEtat d'esprit attendu : *\"Comment livrer vite **et** de maniere fiable, en mesurant la fiabilite avec des SLO, et en automatisant tout ce qui est repetitif ?\"*\n\nLe vocabulaire **SRE de Google** (SLI, SLO, error budget, toil, postmortem sans blame) est au coeur de l'examen. Les reponses qui suivent la philosophie SRE de Google sont presque toujours les bonnes.\n\n---\n\n## 2. Domaine 1 - Bootstrapping de l'organisation (~15 %)\n\n### 2.1 Hierarchie des ressources\n\n```\nOrganisation (example.com)            <- Org Policies, IAM, audit logs agreges\n |-- Dossier : Production\n |     |-- Projet : app-prod\n |     |-- Projet : network-host-prod   (Shared VPC host)\n |-- Dossier : Non-production\n |     |-- Projet : app-dev\n |     |-- Projet : app-staging\n |-- Dossier : Shared-services\n       |-- Projet : cicd-tools         (Cloud Build, Artifact Registry)\n       |-- Projet : logging-central    (sinks agreges)\n```\n\nRegles de base :\n- **IAM et Org Policies sont heritees** de haut en bas. Une permission accordee a l'organisation s'applique a tout.\n- Le **projet** est l'unite de facturation, de quotas, d'activation d'API et d'isolation.\n- Bonne pratique : **un projet par environnement et par application/equipe** (isolation des blast radius).\n- Utiliser des **dossiers** pour appliquer des politiques par groupe (prod / non-prod).\n\n### 2.2 IAM\n\n| Concept | Detail |\n|---------|--------|\n| **Principal** | Compte Google, groupe Google, compte de service, domaine Workspace, `allAuthenticatedUsers`, `allUsers` |\n| **Role primitif** | Owner / Editor / Viewer : **a eviter** en production (trop larges) |\n| **Role predefini** | Granulaire, maintenu par Google (ex. `roles/cloudbuild.builds.editor`) |\n| **Role personnalise** | Pour un besoin precis, defini au niveau projet ou organisation |\n| **Deny policies** | Interdisent explicitement des permissions, evaluees **avant** les allow |\n| **IAM Conditions** | Acces conditionnel (heure, ressource, tag...) |\n| **Policy Troubleshooter / Recommender** | Debug des acces et suppression des permissions inutilisees |\n\nBonnes pratiques :\n- Accorder des roles a des **groupes**, pas a des individus.\n- **Moindre privilege**, a la portee la plus basse possible.\n- Separer les roles (separation of duties) : celui qui deploie n'est pas celui qui administre l'IAM.\n\n### 2.3 Comptes de service (Service Accounts)\n\n- Identite pour une **application / un pipeline**, pas pour un humain.\n- Un compte de service est a la fois une **identite** (on lui donne des roles) et une **ressource** (on donne a d'autres le droit de l'utiliser : `roles/iam.serviceAccountUser`, `roles/iam.serviceAccountTokenCreator`).\n- **Eviter les cles JSON** (risque de fuite, pas d'expiration). Alternatives :\n\n| Besoin | Solution |\n|--------|----------|\n| Workload sur GCE / Cloud Run / GKE | **Service account attache** a la ressource (metadata server) |\n| Pod GKE | **Workload Identity Federation for GKE** (KSA -> GSA ou acces direct) |\n| Pipeline externe (GitHub Actions, GitLab, Azure DevOps, AWS) | **Workload Identity Federation** (OIDC / SAML) : pas de cle |\n| Utilisateur qui doit agir comme SA | **Impersonation** (`--impersonate-service-account`) |\n\n- Org Policy utile : `constraints/iam.disableServiceAccountKeyCreation`.\n- Creer des SA **dediees par workload**, jamais le compte Compute Engine par defaut avec le role Editor.\n\n### 2.4 Organization Policies\n\nContraintes appliquees a toute la hierarchie, independantes d'IAM (elles limitent **ce qui est possible**, meme pour un Owner).\n\n| Contrainte | Effet |\n|------------|-------|\n| `constraints/compute.vmExternalIpAccess` | Interdit les IP externes sur les VM |\n| `constraints/gcp.resourceLocations` | Limite les regions utilisables (residence des donnees) |\n| `constraints/iam.disableServiceAccountKeyCreation` | Interdit la creation de cles SA |\n| `constraints/iam.allowedPolicyMemberDomains` | Restreint les domaines des membres IAM |\n| `constraints/storage.uniformBucketLevelAccess` | Impose l'acces uniforme sur les buckets |\n| `constraints/compute.requireOsLogin` | Impose OS Login |\n| `constraints/compute.requireShieldedVm` | Impose les Shielded VM |\n\n### 2.5 Reseau : Shared VPC et connectivite\n\n- **Shared VPC** : un projet **hote** possede le reseau, des projets **de service** y attachent leurs ressources. Gestion reseau centralisee, equipes applicatives autonomes (role `compute.networkUser` sur les sous-reseaux).\n- **VPC Peering** : connecte deux VPC (non transitif).\n- **Cloud NAT** : sortie Internet pour des VM sans IP externe.\n- **Private Google Access** : acces aux API Google depuis des VM sans IP externe.\n- **VPC Service Controls** : perimetre de securite contre l'exfiltration de donnees (BigQuery, Cloud Storage...).\n- **Cloud VPN / Interconnect** : connectivite hybride.\n\n### 2.6 Infrastructure as Code et bootstrap\n\n- **Terraform** est l'outil de reference. Le **backend d'etat** doit etre distant : bucket Cloud Storage avec versioning (et verrouillage natif).\n- **Cloud Foundation Toolkit / Terraform blueprints** : modules de reference (org bootstrap, projets, reseau).\n- **Project factory** : module qui cree des projets standardises (APIs, budgets, labels, SA, Shared VPC).\n- Appliquer l'IaC via un **pipeline** (Cloud Build) : `plan` sur Pull Request, `apply` apres merge, avec revue.\n- Les labels (`env`, `team`, `cost-center`) permettent le suivi des couts.\n- **Budgets et alertes** de facturation, export de la facturation vers BigQuery.\n- **Config Connector / Config Controller** : gerer des ressources GCP via des manifestes Kubernetes.\n\n### 2.7 Journaux d'audit\n\n| Type | Active par defaut | Contenu | Retention bucket |\n|------|-------------------|---------|------------------|\n| **Admin Activity** | Oui, non desactivable | Modifications de config/metadata | 400 jours (`_Required`) |\n| **System Event** | Oui, non desactivable | Actions systeme Google | 400 jours (`_Required`) |\n| **Data Access** | **Non** (sauf BigQuery) | Lecture/ecriture de donnees | 30 jours (`_Default`) |\n| **Policy Denied** | Oui | Refus par VPC-SC / Org Policy | 30 jours (`_Default`) |\n\nPour conserver plus longtemps ou centraliser : **sink agrege** au niveau organisation/dossier (`--include-children`) vers Cloud Storage (avec **retention policy / Bucket Lock** pour conformite), BigQuery ou un bucket de logs central.\n\n---\n\n## 3. Domaine 2 - Pipelines CI/CD (~25 %)\n\n### 3.1 Vue d'ensemble\n\n```\n Git push --> [Cloud Build] --> build + test --> [Artifact Registry]\n                                                     |\n                                       scan de vulnerabilites + attestation\n                                                     v\n              [Cloud Deploy]  dev --> staging --> (approbation) --> prod\n                                                     |\n                                    [Binary Authorization] verifie la signature\n                                                     v\n                                          GKE / Cloud Run / GCE\n```\n\n### 3.2 Cloud Build\n\nService CI manage, serverless. Chaque etape est un **conteneur**.\n\n```yaml\n# cloudbuild.yaml\nsteps:\n  # 1. Tests\n  - id: test\n    name: 'python:3.12-slim'\n    entrypoint: bash\n    args: ['-c', 'pip install -r requirements.txt && pytest']\n\n  # 2. Build + push de l'image (avec cache)\n  - id: build\n    name: 'gcr.io/kaniko-project/executor:latest'\n    args:\n      - '--destination=europe-west1-docker.pkg.dev/$PROJECT_ID/apps/api:$SHORT_SHA'\n      - '--cache=true'\n\n  # 3. Creation d'une release Cloud Deploy\n  - id: release\n    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'\n    entrypoint: gcloud\n    args:\n      - deploy\n      - releases\n      - create\n      - rel-$SHORT_SHA\n      - --delivery-pipeline=api-pipeline\n      - --region=europe-west1\n      - --images=api=europe-west1-docker.pkg.dev/$PROJECT_ID/apps/api:$SHORT_SHA\n\noptions:\n  logging: CLOUD_LOGGING_ONLY\n  machineType: E2_HIGHCPU_8\ntimeout: 1200s\n```\n\nPoints cles :\n| Sujet | A retenir |\n|-------|-----------|\n| **Triggers** | Push, Pull Request, tag, Pub/Sub, webhook, manuel, planifie (Cloud Scheduler) |\n| **Substitutions** | Variables integrees (`$PROJECT_ID`, `$COMMIT_SHA`, `$SHORT_SHA`, `$BRANCH_NAME`, `$TAG_NAME`, `$BUILD_ID`) et personnalisees (`_MA_VAR`, doivent commencer par `_`) |\n| **Compte de service** | Utiliser un **SA specifie par l'utilisateur** avec moindre privilege plutot que le compte par defaut |\n| **Private pools** | Workers dans un reseau prive (acces a des ressources VPC : Cloud SQL prive, GKE prive, depots on-prem) |\n| **Secrets** | `availableSecrets` + Secret Manager. **Jamais** de secret en clair dans le YAML ou les substitutions |\n| **Cache** | Kaniko `--cache=true`, `--cache-from` Docker, ou cache dans Cloud Storage ; machine plus puissante (`machineType`) |\n| **Duree** | Timeout par defaut 10 minutes (`timeout` modifiable, max 24 h) |\n| **Parallelisme** | `waitFor: ['-']` pour demarrer immediatement, `waitFor: [id]` pour creer un graphe |\n| **Artefacts** | `images:` (pousses a la fin) et `artifacts:` (fichiers vers Cloud Storage) |\n| **Approbation** | Trigger avec **approbation manuelle** requise avant execution |\n| **Pull Requests** | Trigger PR (GitHub/GitLab/Bitbucket) avec `comment-control` pour les contributeurs externes |\n\n### 3.3 Artifact Registry\n\nRemplace Container Registry (GCR, deprecie). Stocke **images Docker/OCI, Helm, Maven, npm, Python, Apt, Yum, Go, Generic**.\n\n| Fonction | Detail |\n|----------|--------|\n| **Depots standard** | Vos propres artefacts |\n| **Depots remote** | Proxy/cache de depots publics (Docker Hub, PyPI, npm, Maven Central) : fiabilite, pas de rate limit |\n| **Depots virtuels** | Un point d'entree qui agrege plusieurs depots (priorites) : protection contre le *dependency confusion* |\n| **Artifact Analysis** | Scan de vulnerabilites automatique a la poussee, SBOM, metadonnees de provenance |\n| **IAM** | Par depot : `artifactregistry.reader / writer / admin` |\n| **Cleanup policies** | Suppression automatique des anciennes versions (cout) |\n| **Regional / multi-regional** | Placer le depot **pres du runtime** pour la vitesse et la sortie reseau |\n\n### 3.4 Cloud Deploy\n\nLivraison continue **geree** vers GKE, Cloud Run, GKE Enterprise (et plus). Basee sur **Skaffold**.\n\n```yaml\n# clouddeploy.yaml\napiVersion: deploy.cloud.google.com/v1\nkind: DeliveryPipeline\nmetadata:\n  name: api-pipeline\nserialPipeline:\n  stages:\n    - targetId: dev\n    - targetId: staging\n    - targetId: prod\n      strategy:\n        canary:\n          runtimeConfig:\n            cloudRun:\n              automaticTrafficControl: true\n          canaryDeployment:\n            percentages: [10, 50]\n            verify: true\n---\napiVersion: deploy.cloud.google.com/v1\nkind: Target\nmetadata:\n  name: prod\nrequireApproval: true\nrun:\n  location: projects/my-prod/locations/europe-west1\n```\n\n| Concept | Description |\n|---------|-------------|\n| **Delivery pipeline** | Sequence de cibles (stages) |\n| **Target** | Environnement de deploiement (cluster, service Cloud Run), `requireApproval` pour la prod |\n| **Release** | Instantane immuable (manifestes rendus + images) cree a chaque build |\n| **Rollout** | Deploiement d'une release vers une cible |\n| **Promotion** | Passage de la release a l'etape suivante |\n| **Strategies** | Standard, **canary**, (blue/green via configuration) |\n| **Verification** | Tests post-deploiement (job conteneur), echec = rollback |\n| **Automations** | Promotion automatique, reparation (relance/rollback) |\n| **Rollback** | Redeployer une release precedente (immuable, donc fiable) |\n\n### 3.5 Strategies de deploiement\n\n| Strategie | Principe | Avantages | Inconvenients |\n|-----------|----------|-----------|---------------|\n| **Recreate** | On arrete l'ancienne version, on demarre la nouvelle | Simple | Interruption de service |\n| **Rolling update** | Remplacement progressif des instances | Sans interruption, pas de surcout | Deux versions coexistent, rollback lent |\n| **Blue/Green** | Deux environnements complets, bascule du trafic | **Rollback instantane**, test complet avant bascule | Double de ressources |\n| **Canary** | Une petite part du trafic (1-10 %) vers la nouvelle version, augmentation progressive | Risque limite, validation sur trafic reel | Complexite, necessite de bonnes metriques |\n| **A/B testing** | Routage selon des criteres utilisateurs | Test de fonctionnalites | Pas une strategie de securite de livraison |\n| **Shadow (mirror)** | Copie du trafic vers la nouvelle version sans impact | Test sans risque | Cout, effets de bord sur les ecritures |\n\nImplementation sur GCP :\n- **Cloud Run** : revisions + `gcloud run services update-traffic --to-revisions=api-v2=10` ; tags pour tester une revision (`--tag`).\n- **GKE** : `RollingUpdate` (`maxSurge`, `maxUnavailable`), Cloud Deploy canary, Gateway API / service mesh (Cloud Service Mesh) pour le fractionnement de trafic.\n- **MIG (Compute Engine)** : *rolling update* avec `maxSurge`/`maxUnavailable`, **canary** via deux templates (`--canary-version`).\n- **App Engine** : repartition de trafic entre versions (`gcloud app services set-traffic --splits`).\n\n### 3.6 Securite de la chaine d'approvisionnement\n\n| Outil | Role |\n|-------|------|\n| **Artifact Analysis** | Detecte les vulnerabilites (CVE) des images |\n| **Binary Authorization** | **Politique de deploiement** : seules les images **attestees** (signees) par des *attestors* peuvent tourner sur GKE/Cloud Run |\n| **Attestations** | Signature cryptographique (cle KMS) emise par le pipeline apres tests/scan |\n| **SLSA / provenance** | Cloud Build produit une provenance verifiable (niveau SLSA 3) |\n| **Mode dry-run** | Journalise les violations sans bloquer (pour deployer progressivement) |\n| **Break-glass** | Annotation permettant un deploiement d'urgence, journalise |\n| **Continuous validation** | Verifie en continu que les pods en cours respectent encore la politique |\n| **Secret Manager** | Stockage des secrets (versions, rotation, IAM, audit) |\n| **Cloud KMS** | Cles de signature et de chiffrement |\n\nFlux type : build -> scan -> tests OK -> **attestation signee** -> Binary Authorization verifie a l'admission dans GKE -> deploiement.\n\n### 3.7 GitOps et configuration\n\n- **Config Sync** (GKE Enterprise) / **Argo CD / Flux** : l'etat desire est dans Git, un agent dans le cluster **reconcilie** en continu (corrige la derive de configuration).\n- **Policy Controller** (OPA Gatekeeper) : refuse les manifestes non conformes.\n- Pull Request = revue + historique + rollback via `git revert`.\n- Separer **depot applicatif** (code) et **depot de configuration** (manifestes / environnements).\n\n### 3.8 Tests dans le pipeline\n\nPyramide : tests unitaires (rapides, nombreux) > integration > bout-en-bout (lents, peu nombreux).\nAjouter : analyse statique / SAST, scan de dependances, scan d'images, tests de charge en pre-prod, **tests de fumee** apres deploiement, validation des politiques (OPA/conftest), `terraform validate/plan`.\n\n---\n\n## 4. Domaine 3 - Pratiques SRE (~23 %)\n\n### 4.1 Vocabulaire fondamental\n\n| Terme | Definition | Exemple |\n|-------|------------|---------|\n| **SLI** (Service Level Indicator) | **Mesure** quantitative de la qualite du service | % de requetes reussies, latence p95 |\n| **SLO** (Service Level Objective) | **Objectif** cible pour un SLI sur une fenetre | 99,9 % de requetes reussies sur 30 jours |\n| **SLA** (Service Level Agreement) | **Contrat** avec penalites si non respecte | Remboursement si < 99,5 % |\n| **Error budget** | `100 % - SLO` : fiabilite que l'on peut \"depenser\" | 0,1 % = ~43 min / 30 jours |\n| **Toil** | Travail manuel, repetitif, automatisable, tactique, sans valeur durable, qui croit avec le service | Redemarrer a la main un service |\n\nRegle : **SLO plus strict que le SLA** (marge de securite). SLA = affaire commerciale, SLO = affaire d'ingenierie.\n\n### 4.2 Choisir de bons SLI\n\nForme generique : `SLI = evenements bons / evenements valides x 100`\n\n| Type de service | SLI typiques |\n|-----------------|--------------|\n| **Service requete/reponse** | Disponibilite (reponses non 5xx), latence (% < seuil) |\n| **Pipeline de donnees** | Fraicheur, exactitude, couverture, debit |\n| **Stockage** | Durabilite, disponibilite, latence |\n\nConseils :\n- Mesurer **du point de vue de l'utilisateur** (au load balancer plutot que sur le serveur).\n- Preferer les **percentiles** (p95, p99) aux moyennes.\n- Peu de SLI, relies a l'experience utilisateur (parcours critiques / CUJ).\n- Exclure les erreurs client (4xx) du calcul de disponibilite.\n\n### 4.3 Tableau de disponibilite\n\n| SLO | Indisponibilite / 30 jours | / an |\n|-----|----------------------------|------|\n| 99 % | 7,2 h | 3,65 j |\n| 99,5 % | 3,6 h | 1,8 j |\n| 99,9 % | 43,2 min | 8,76 h |\n| 99,95 % | 21,6 min | 4,38 h |\n| 99,99 % | 4,32 min | 52,6 min |\n\n### 4.4 Error budget et politique\n\nL'**error budget policy** definit ce qu'on fait selon la consommation :\n\n| Etat du budget | Action |\n|----------------|--------|\n| Budget **restant** | On livre des fonctionnalites, on prend des risques, on experimente |\n| Budget **epuise** | **Gel des releases** non liees a la fiabilite ; priorite aux correctifs, a l'automatisation, aux postmortems |\n| Budget epuise a cause d'une dependance externe | Escalade, ajustement de l'architecture, revoir le SLO |\n\nL'error budget **aligne developpeurs et SRE** : fin du conflit \"livrer vite / etre stable\".\n\n### 4.5 Gestion des incidents\n\nPriorite n°1 : **attenuer l'impact (mitigation)**, ensuite trouver la cause racine.\n> *Rollback d'abord, enquete ensuite.*\n\nRoles (modele inspire de l'ICS) :\n\n| Role | Responsabilite |\n|------|----------------|\n| **Incident Commander (IC)** | Coordonne, decide, delegue. **Ne depanne pas lui-meme.** Maintient la vue d'ensemble |\n| **Operations Lead** | Seul(e) a modifier le systeme en production (evite les actions concurrentes) |\n| **Communications Lead** | Communique aux parties prenantes / clients, met a jour la page de statut |\n| **Planning Lead** | Suit les taches, prepare la passation, notes |\n\nBonnes pratiques :\n- Declarer l'incident tot, avec une **severite** claire, un canal dedie, un document partage d'incident.\n- **Passation explicite** du role d'IC lors d'un changement d'equipe.\n- Runbooks / playbooks, alertes **actionnables** (qui contiennent le lien du runbook).\n- Escalade rapide en cas de doute.\n\n### 4.6 Postmortem\n\n- **Sans blame** (*blameless*) : on cherche les failles du **systeme et des processus**, pas un coupable.\n- Contenu : resume, impact, chronologie, cause(s) racine(s) et facteurs contributifs, ce qui a bien marche, ce qui a mal marche, **actions correctives avec responsable et echeance**, lecons.\n- Rediger apres tout incident significatif (impact utilisateur, consommation importante du budget, intervention manuelle).\n- Partager largement, suivre l'avancement des actions.\n- **Wheel of Misfortune** : jeux de role pour s'entrainer ; **Game days / chaos engineering** : injection de pannes controlees.\n\n### 4.7 Reduction du toil\n\n- Cible Google : le toil **ne doit pas depasser 50 %** du temps d'un SRE ; le reste = ingenierie.\n- Methode : mesurer -> automatiser (scripts, Cloud Functions, Cloud Scheduler, Workflows, IaC) -> supprimer la cause (ameliorer le service).\n- Auto-reparation (health checks + autohealing des MIG, probes Kubernetes).\n\n### 4.8 Conception pour la fiabilite\n\n| Pattern | But |\n|---------|-----|\n| **Retries avec backoff exponentiel + jitter** | Eviter les \"retry storms\" qui aggravent une panne |\n| **Circuit breaker** | Arreter d'appeler une dependance defaillante |\n| **Timeouts et deadlines** | Ne jamais attendre indefiniment |\n| **Load shedding** | Rejeter une partie de la charge pour proteger le service (429/503) |\n| **Degradation gracieuse** | Fournir un service reduit plutot qu'une panne totale |\n| **Idempotence** | Rejouer sans effet de bord |\n| **Redondance multi-zone / multi-region** | Resister aux pannes de zone/region |\n| **Health checks** (liveness / readiness) | Retirer ou redemarrer les instances malades |\n| **Limitation du rayon d'impact** | Cellules, releases progressives, feature flags |\n\n### 4.9 Livraison et fiabilite\n\n- Petits changements frequents = moins de risque que de gros changements rares.\n- **Feature flags** : decoupler deploiement et activation.\n- Releases progressives (canary) avec **analyse automatique** des metriques (SLI) et rollback automatique.\n- **Capacity planning** : previsions organique + inorganique, tests de charge, quotas verifies avant les pics.\n- **Quotas** : surveiller et demander des augmentations a l'avance ; alerter a 80 %.\n\n### 4.10 Reprise apres sinistre\n\n| Strategie | RTO/RPO | Cout |\n|-----------|---------|------|\n| Sauvegarde / restauration | Heures | $ |\n| Pilot light | Dizaines de minutes | $$ |\n| Warm standby | Minutes | $$$ |\n| Actif-actif multi-region | Proche de zero | $$$$ |\n\nOutils : snapshots planifies, Backup and DR Service, replication Cloud Storage dual/multi-region, Cloud SQL HA + replicas cross-region, GKE multi-cluster, Cloud Load Balancing global avec bascule automatique.\n\n---\n\n## 5. Domaine 4 - Supervision (~21 %)\n\n### 5.1 Les piliers de l'observabilite\n\n| Pilier | Outil Google Cloud |\n|--------|--------------------|\n| **Metriques** | Cloud Monitoring, Managed Service for Prometheus |\n| **Logs** | Cloud Logging |\n| **Traces** | Cloud Trace (OpenTelemetry) |\n| **Profils** | Cloud Profiler |\n| **Erreurs** | Error Reporting |\n| **Disponibilite externe** | Uptime checks |\n\nL'**Ops Agent** (collecte metriques et logs sur Compute Engine) remplace les anciens agents Monitoring/Logging. GKE a la collecte integree (logs systeme/workloads, metriques systeme, Managed Prometheus).\n\n### 5.2 Cloud Monitoring\n\n- **Metrics scope** : un projet \"scoping\" peut afficher les metriques de **plusieurs projets** (vue unique multi-projets, ex. tous les environnements).\n- **Types de metriques** : systeme (GCP), agent, **personnalisees** (API / OpenTelemetry), **basees sur les journaux** (log-based).\n- **Requetes** : MQL (en transition) et **PromQL** (recommande).\n- **Alert policies** : condition (seuil, absence de donnees, taux de croissance, SLO burn rate), canaux de notification (email, SMS, Slack, PagerDuty, Pub/Sub, webhook), documentation (runbook) incluse, regroupement des alertes.\n- **Uptime checks** : HTTP/HTTPS/TCP depuis plusieurs regions ; **private uptime checks** pour des ressources internes.\n- **Dashboards** : personnalises ou pre-construits, partageables.\n- **Snooze** : mettre en sourdine pendant les maintenances.\n\n### 5.3 SLO monitoring et burn rate\n\nCloud Monitoring permet de definir un **SLO** (service + SLI + objectif + fenetre) et d'alerter sur le **burn rate** (vitesse de consommation du budget).\n\n> **Burn rate** = (taux d'erreur observe) / (taux d'erreur autorise). Burn rate 1 = on consomme exactement le budget sur la fenetre.\n\nAlerting multi-fenetres recommande (SLO 30 jours) :\n\n| Fenetre longue | Fenetre courte | Burn rate | Budget consomme | Action |\n|----------------|----------------|-----------|-----------------|--------|\n| 1 h | 5 min | 14,4 | 2 % | **Page** (urgence) |\n| 6 h | 30 min | 6 | 5 % | **Page** |\n| 3 jours | 6 h | 1 | 10 % | **Ticket** (non urgent) |\n\nPourquoi deux fenetres ? La longue evite les faux positifs, la courte permet de **se resoudre vite** quand le probleme est termine.\n\nAlerter sur les **symptomes** (impact utilisateur, SLO) plutot que sur les **causes** (CPU a 90 %).\n\n### 5.4 Cloud Logging\n\n```\n Sources (GCE, GKE, Cloud Run, audit...)\n          |\n   [ Log Router ]  --- sinks (filtres d'inclusion) ---> Cloud Storage (archive)\n          |                                          --> BigQuery (analyse SQL)\n          |                                          --> Pub/Sub (SIEM, streaming)\n          |                                          --> Log bucket (autre projet)\n   exclusions (reduction de cout)\n          v\n   Log buckets : _Required (400 j, gratuit), _Default (30 j), personnalises\n```\n\n| Notion | Detail |\n|--------|--------|\n| **Log Router** | Evalue chaque entree contre les **sinks** ; l'entree est stockee dans `_Default` sauf **exclusion** |\n| **Sink agrege** | Au niveau organisation/dossier (`--include-children`) pour centraliser |\n| **Exclusion filters** | Ne pas stocker (ex. logs de debug, health checks) pour **reduire les couts** |\n| **Retention** | Configurable par bucket ; `_Required` fixe a 400 jours |\n| **Log Analytics** | Requetes **SQL** sur les buckets mis a niveau, sans export BigQuery |\n| **Log-based metrics** | **Compteur** ou **distribution** a partir d'un filtre (ex. nombre d'erreurs \"payment failed\") -> alerte |\n| **Droit d'acces** | `logging.viewer`, `logging.privateLogViewer` (Data Access), vues de logs par equipe |\n| **Champs sensibles** | Eviter de journaliser PII/secrets ; masquage via Sensitive Data Protection |\n\nFiltre exemple :\n```\nresource.type=\"k8s_container\"\nresource.labels.cluster_name=\"prod\"\nseverity>=ERROR\njsonPayload.message:\"timeout\"\n```\n\n### 5.5 Trace, Profiler, Error Reporting\n\n- **Cloud Trace** : latence de bout en bout d'une requete a travers les microservices (spans). Instrumenter via **OpenTelemetry**. Trouve **quel service/appel** ralentit.\n- **Cloud Profiler** : profilage **continu**, a faible surcout (~quelques %), en production : montre **quelles fonctions** consomment CPU/memoire/temps. Trouve **quelle ligne de code**.\n- **Error Reporting** : regroupe et compte les exceptions, alerte sur les nouvelles erreurs.\n- **Cloud Debugger** est deprecie ; utiliser logs, snapshots via autres outils.\n\nRegle d'or : metriques (*qu'est-ce qui ne va pas ?*) -> traces (*ou ?*) -> logs/profils (*pourquoi ?*).\n\n### 5.6 Supervision de GKE\n\n- **Managed Service for Prometheus** (PodMonitoring / ClusterPodMonitoring) : collecte compatible Prometheus, stockage Monarch, requetes PromQL, sans gerer de serveur Prometheus.\n- Metriques cles : CPU/memoire (requests vs usage), `restart count`, pods `Pending` / `CrashLoopBackOff`, saturation des noeuds, latence et erreurs de l'Ingress.\n- **GKE dashboards** et **Cloud Service Mesh** (SLO automatiques par service).\n- Alertes sur : OOMKilled, noeuds NotReady, quota, volumes presque pleins.\n\n### 5.7 Les 4 signaux dorees (SRE)\n\n**Latence**, **Trafic**, **Erreurs**, **Saturation**. Methodes : **RED** (Rate, Errors, Duration) pour les services, **USE** (Utilization, Saturation, Errors) pour les ressources.\n\n---\n\n## 6. Domaine 5 - Optimisation des performances (~16 %)\n\n### 6.1 Demarche\n\n1. **Mesurer** (metriques, traces, profils) avant d'optimiser.\n2. Identifier le **goulot d'etranglement**.\n3. Corriger, **remesurer**.\n4. Equilibrer **performance / cout / fiabilite**.\n\n### 6.2 Autoscaling\n\n| Cible | Mecanisme | Detail |\n|-------|-----------|--------|\n| **MIG** (Compute Engine) | Autoscaler | Selon CPU, metrique Cloud Monitoring, utilisation du LB, **planning**, mode predictif. **Cool-down / initialization period** pour les VM lentes a demarrer |\n| **GKE pods** | **HPA** (Horizontal Pod Autoscaler) | Nombre de replicas selon CPU/memoire/metriques custom |\n| **GKE pods** | **VPA** (Vertical) | Ajuste requests/limits (ne pas combiner HPA et VPA sur la meme metrique) |\n| **GKE noeuds** | **Cluster Autoscaler** / auto-provisioning | Ajoute des noeuds quand des pods sont **Pending** faute de ressources |\n| **GKE** | **Autopilot** | Google gere les noeuds ; facturation par ressources de pod |\n| **Cloud Run** | Autoscaling natif | Concurrence par instance, `min-instances` (evite cold start), `max-instances` (protege les backends) |\n\nPiege : un cluster autoscaler ne s'active que si les pods ont des **requests** definis.\n\n### 6.3 Reseau et distribution\n\n- **Load Balancer global** (Application LB externe) : anycast, un seul IP, routage vers la region la plus proche.\n- **Cloud CDN** : cache en peripherie pour le contenu statique (reduit latence et charge).\n- Choisir le LB selon : externe/interne, L7/L4, global/regional, proxy/passthrough.\n- **Niveau de service reseau** : Premium (reseau Google) vs Standard (Internet public, moins cher).\n- **Connection draining**, **health checks** bien calibres, **timeout** de backend adaptes.\n- Placer les ressources **pres des utilisateurs** et **pres des donnees** (reduire la latence inter-regions et les couts de sortie).\n\n### 6.4 Compute et stockage\n\n- **Right-sizing** : suivre les recommandations (**Recommender / Active Assist**) ; machines **personnalisees** possibles.\n- Familles : E2 (rentable), N2/N4 (general), C3 (compute), M (memoire), A/G (GPU).\n- Disques : pd-balanced (defaut), pd-ssd (IOPS), Hyperdisk (perf configurable) ; **Local SSD** pour le tres faible latence (volatile).\n- **Cloud Storage** : classes Standard / Nearline / Coldline / Archive + **lifecycle rules** automatiques.\n- Bases de donnees : read replicas, cache (Memorystore), index, pooling de connexions (**Cloud SQL Auth Proxy**, PgBouncer).\n\n### 6.5 Optimisation des couts\n\n| Levier | Detail |\n|--------|--------|\n| **Remises automatiques d'utilisation continue** (SUD) | Appliquees automatiquement a certaines familles |\n| **Committed Use Discounts** (CUD) | Engagement 1 ou 3 ans (ressources ou depense), jusqu'a ~55-70 % |\n| **Spot VMs** | Jusqu'a ~60-91 % moins cher, interruptibles (pas de duree max) : batch, CI, workloads tolerants |\n| **Arret programme** | Instance schedules pour dev/test |\n| **Right-sizing** | Recommendations de taille |\n| **Labels + export facturation BigQuery** | Allocation des couts par equipe |\n| **Budgets et alertes** | Notification a 50/90/100 % |\n| **Journaux** | Exclusion des logs a faible valeur |\n| **Artifact Registry cleanup**, **lifecycle Cloud Storage** | Reduire le stockage inutile |\n\n### 6.6 Performance du pipeline CI/CD\n\n- Cache des dependances et des couches Docker (Kaniko cache).\n- Etapes en **parallele** (`waitFor`).\n- Machines plus grosses (`E2_HIGHCPU_32`) ou **private pools** dimensionnes.\n- Images de build legeres et pre-construites ; builds incrementaux ; tests selectifs.\n\n---\n\n## 7. Aide-memoire\n\n### gcloud\n\n```bash\n# Contexte\ngcloud config set project mon-projet\ngcloud auth login\ngcloud auth application-default login\ngcloud config list\n\n# IAM\ngcloud projects add-iam-policy-binding mon-projet \\\n  --member=\"group:devs@example.com\" --role=\"roles/run.developer\"\ngcloud iam service-accounts create deployer --display-name=\"Deployer\"\ngcloud iam service-accounts add-iam-policy-binding deployer@mon-projet.iam.gserviceaccount.com \\\n  --member=\"user:alice@example.com\" --role=\"roles/iam.serviceAccountTokenCreator\"\n\n# Org Policy\ngcloud resource-manager org-policies enable-enforce \\\n  constraints/compute.requireOsLogin --organization=123456789\n\n# Cloud Build\ngcloud builds submit --config=cloudbuild.yaml .\ngcloud builds triggers create github --repo-name=app --repo-owner=org \\\n  --branch-pattern='^main$' --build-config=cloudbuild.yaml\ngcloud builds list --ongoing\n\n# Artifact Registry\ngcloud artifacts repositories create apps --repository-format=docker --location=europe-west1\ngcloud auth configure-docker europe-west1-docker.pkg.dev\n\n# Cloud Deploy\ngcloud deploy apply --file=clouddeploy.yaml --region=europe-west1\ngcloud deploy releases promote --release=rel-abc123 --delivery-pipeline=api-pipeline --region=europe-west1\ngcloud deploy rollouts approve ROLLOUT --release=rel-abc123 --delivery-pipeline=api-pipeline --region=europe-west1\n\n# Cloud Run : canary et rollback\ngcloud run deploy api --image=IMAGE --no-traffic --tag=canary\ngcloud run services update-traffic api --to-revisions=api-00002=10,api-00001=90\ngcloud run services update-traffic api --to-latest\n\n# GKE\ngcloud container clusters get-credentials prod --region=europe-west1\nkubectl rollout status deployment/api\nkubectl rollout undo deployment/api\n\n# MIG\ngcloud compute instance-groups managed rolling-action start-update web-mig \\\n  --version=template=tpl-v2 --max-surge=3 --max-unavailable=0\n\n# Logging\ngcloud logging read 'severity>=ERROR AND resource.type=\"cloud_run_revision\"' --limit=20 --freshness=1h\ngcloud logging sinks create audit-sink \\\n  bigquery.googleapis.com/projects/logs-prj/datasets/audit \\\n  --organization=123456789 --include-children --log-filter='logName:\"cloudaudit.googleapis.com\"'\ngcloud logging metrics create payment_errors \\\n  --description=\"Paiements en erreur\" --log-filter='jsonPayload.event=\"payment_failed\"'\n\n# Monitoring\ngcloud monitoring policies list\ngcloud alpha monitoring policies create --policy-from-file=policy.json\n```\n\n### Exemple Binary Authorization (politique)\n\n```yaml\n# policy.yaml\nglobalPolicyEvaluationMode: ENABLE\ndefaultAdmissionRule:\n  evaluationMode: REQUIRE_ATTESTATION\n  enforcementMode: ENFORCED_BLOCK_AND_AUDIT_LOG\n  requireAttestationsBy:\n    - projects/cicd-tools/attestors/built-by-cloud-build\n```\n\n### Exemple SLO (alerte burn rate, concept)\n\n```\nCondition 1 : burn_rate(1h)  > 14.4  ET  burn_rate(5m)  > 14.4   -> PAGE\nCondition 2 : burn_rate(6h)  > 6     ET  burn_rate(30m) > 6      -> PAGE\nCondition 3 : burn_rate(3d)  > 1     ET  burn_rate(6h)  > 1      -> TICKET\n```\n\n### Arbre de decision rapide\n\n| Besoin | Reponse |\n|--------|---------|\n| Pas de cle SA depuis GitHub Actions | Workload Identity Federation |\n| Empecher les images non signees | Binary Authorization |\n| Pipeline multi-environnements avec approbation | Cloud Deploy |\n| Acceder a une ressource VPC depuis le build | Cloud Build private pool |\n| Interdire les IP publiques sur toute l'org | Org Policy `vmExternalIpAccess` |\n| Centraliser les logs de toute l'org | Sink agrege (include-children) |\n| Reduire le cout des logs | Exclusion filters |\n| Compteur a partir de logs | Log-based metric |\n| Vue de plusieurs projets dans Monitoring | Metrics scope |\n| Quelle fonction consomme le CPU en prod | Cloud Profiler |\n| Quel microservice ralentit | Cloud Trace |\n| Budget d'erreur epuise | Gel des releases, priorite a la fiabilite |\n| Alerter sur la consommation du budget | Alerte de burn rate multi-fenetres |\n| Rollback instantane | Blue/green (ou revision precedente Cloud Run) |\n| Validation sur trafic reel limite | Canary |\n| Batch tolerant aux interruptions | Spot VMs |\n| Pods en Pending | Cluster Autoscaler |\n\n---\n\n## 8. Pieges classiques et conseils\n\n1. **IAM** : \"le plus restrictif possible\", groupes, pas de role primitif, pas de cles SA.\n2. **Mitigation avant cause racine** pendant un incident (rollback, bascule de trafic).\n3. **Postmortem toujours sans blame**, avec actions suivies.\n4. **L'IC coordonne, il ne depanne pas.** Un seul Operations Lead modifie la production.\n5. **Alertes sur symptomes (SLO)**, pas sur causes ; peu d'alertes, toutes actionnables.\n6. **Error budget epuise = gel des releases** (sauf correctifs de fiabilite).\n7. **Services manages** (Cloud Build, Cloud Deploy, Cloud Run, Managed Prometheus) > solutions auto-hebergees quand les deux repondent au besoin.\n8. **Pas de secret en clair** : Secret Manager.\n9. **Data Access logs** : desactives par defaut (sauf BigQuery) : a activer pour l'audit des lectures.\n10. **Audit Admin Activity** : toujours actif, non desactivable, 400 jours.\n11. **Container Registry est deprecie** : reponse = Artifact Registry.\n12. **Cloud Debugger est deprecie** ; Stackdriver = ancien nom de Cloud Operations (Monitoring/Logging).\n13. Lisez les mots-cles : *\"minimiser l'effort operationnel\"*, *\"sans interruption\"*, *\"le moins cher\"*, *\"conformite\"*, *\"sans cles\"*. Ils designent la bonne reponse.\n14. Pour les QCM multiples, lisez combien de reponses sont demandees (*Choose 2*).\n15. Gerez votre temps : ~2 min par question, marquez et revenez.\n\n> Le livre **Site Reliability Engineering** et **The SRE Workbook** (sre.google) sont les meilleures sources pour le domaine 3 : lisez au moins les chapitres sur les SLO, l'alerting sur les SLO, la gestion des incidents et les postmortems.\n"}, {"track": "gcp", "doc": "Approfondissement", "md": "# GCP DevOps Engineer - Approfondissement (theorie et competences)\n\nA lire **apres** le [cours](README.md). Ce document descend d'un niveau : mecanismes internes, calculs, configurations concretes.\nChaque section se termine par **\"Savoir-faire\"** : ce que vous devez etre capable de faire sans aide.\n\n## Sommaire\n1. [IAM : evaluation des droits et identites](#1-iam--evaluation-des-droits-et-identites)\n2. [Cloud Build en profondeur](#2-cloud-build-en-profondeur)\n3. [Cloud Deploy et livraison progressive](#3-cloud-deploy-et-livraison-progressive)\n4. [GKE pour un DevOps](#4-gke-pour-un-devops)\n5. [Mathematiques des SLO](#5-mathematiques-des-slo)\n6. [Monitoring et logging : mecanismes](#6-monitoring-et-logging--mecanismes)\n7. [Fiabilite : pannes en cascade et capacite](#7-fiabilite--pannes-en-cascade-et-capacite)\n8. [Reseau, load balancers et performance](#8-reseau-load-balancers-et-performance)\n9. [Terraform pour cette certification](#9-terraform-pour-cette-certification)\n10. [Etudes de cas type examen](#10-etudes-de-cas-type-examen)\n\n---\n\n## 1. IAM : evaluation des droits et identites\n\n### 1.1 Ordre d'evaluation d'une requete\n\n```\nRequete (principal, permission, ressource)\n   |\n   1. Principal Access Boundary (PAB)  -> la ressource est-elle dans le perimetre du principal ?\n   2. Deny policies (heritees)         -> un DENY applicable ? => REFUSE (prioritaire)\n   3. Allow policies (heritees, union) -> une liaison accorde-t-elle la permission (conditions evaluees) ? => AUTORISE\n   4. Sinon                             => REFUSE (implicite)\n```\n\nPoints cles :\n- Les **allow** s'**additionnent** le long de la hierarchie (org + dossier + projet + ressource) : on ne peut **pas retirer** par un allow plus bas un droit accorde plus haut. Pour retirer : **deny policy** ou ne pas l'accorder en haut.\n- Les **deny** l'emportent toujours sur les allow.\n- **IAM Conditions** : expressions CEL (ex. `request.time < timestamp(\"2026-12-31T00:00:00Z\")`, `resource.name.startsWith(\"projects/_/buckets/dev-\")`, `resource.matchTag(...)`).\n- **Org Policy** n'est PAS de l'IAM : elle contraint **ce qui peut etre configure**. Les listes (allowed/denied values) **heritent** avec option `inheritFromParent`/`merge`, les booleennes se **remplacent** ou se fusionnent selon la regle.\n\n### 1.2 Les types de comptes de service\n\n| Type | Cree par | Usage |\n|------|----------|-------|\n| **Gere par l'utilisateur** | Vous | Vos workloads/pipelines |\n| **Par defaut** (Compute/App Engine) | Google a l'activation de l'API | **A eviter** (role Editor historique) ; desactiver l'octroi automatique par Org Policy |\n| **Agents de service** (service agents) | Google | Permettent a un service Google d'agir dans votre projet (ex. Cloud Build SA, `service-PROJECTNUM@gcp-sa-...`) : **ne pas modifier a la legere** |\n\n### 1.3 Impersonation et chaines de delegation\n\n- `roles/iam.serviceAccountTokenCreator` : permet de **generer des jetons** pour un SA (impersonation). Plus puissant qu'il n'y parait : equivaut a \"etre\" ce SA.\n- `roles/iam.serviceAccountUser` : permet d'**attacher** le SA a une ressource (VM, Cloud Run, build) => agir **indirectement** avec ses droits.\n- **Delegation** : A impersonne B qui impersonne C (`--impersonate-service-account=B,C`) ; utile pour des separations strictes.\n- **Jetons de courte duree** (1 h par defaut, max 12 h avec politique) plutot que des cles.\n\n### 1.4 Workload Identity Federation (WIF) : mecanique\n\n```\nGitHub (OIDC token, sub=repo:org/app:ref:refs/heads/main)\n     |  1. echange STS\n     v\nWorkload Identity Pool + Provider  (attribute_mapping + attribute_condition)\n     |  2. jeton federe -> \"principal://...\" / \"principalSet://...\"\n     v\nroles/iam.workloadIdentityUser sur le SA cible  -> 3. generateAccessToken (jeton SA court)\n```\n\n- **attribute_condition** (CEL) est le filtre de securite : sans lui, tout depot du meme fournisseur OIDC pourrait s'authentifier.\n- On peut accorder des roles **directement au principal federe** (principalSet) sans passer par un SA pour les services qui le supportent.\n- **WIF for GKE (Workload Identity)** : `pod KSA` -> identite `principal://iam.googleapis.com/projects/NUM/locations/global/workloadIdentityPools/PROJECT.svc.id.goog/subject/ns/NAMESPACE/sa/KSA` ; a preferer a l'annotation KSA->GSA historique quand possible.\n\n**Savoir-faire** : ecrire un `attribute_condition` limitant a un depot **et** une branche ; expliquer pourquoi `serviceAccountUser` != `tokenCreator` ; diagnostiquer un `PERMISSION_DENIED` avec **Policy Troubleshooter** et les **audit logs**.\n\n---\n\n## 2. Cloud Build en profondeur\n\n### 2.1 Fonctionnement\n\n- Chaque build s'execute sur une **VM ephemere** ; chaque etape = un conteneur ; le repertoire `/workspace` est **partage** entre etapes (c'est le seul lien de donnees entre etapes, avec les volumes).\n- Les etapes **sequentielles par defaut** ; `waitFor` cree un DAG ; `waitFor: ['-']` = demarrer immediatement.\n- Une etape en echec **arrete** le build (sauf `allowFailure: true` / `allowExitCodes`).\n\n```yaml\nsteps:\n  - id: deps                        # etapes paralleles\n    name: node:20\n    entrypoint: npm\n    args: ['ci']\n    waitFor: ['-']\n  - id: lint\n    name: node:20\n    entrypoint: npm\n    args: ['run', 'lint']\n    waitFor: ['deps']\n  - id: unit\n    name: node:20\n    entrypoint: npm\n    args: ['test']\n    waitFor: ['deps']\n  - id: image\n    name: gcr.io/kaniko-project/executor\n    args: ['--destination=${_REGION}-docker.pkg.dev/$PROJECT_ID/apps/api:$SHORT_SHA', '--cache=true']\n    waitFor: ['lint', 'unit']       # attend les DEUX\navailableSecrets:\n  secretManager:\n    - versionName: projects/$PROJECT_ID/secrets/npm-token/versions/latest\n      env: NPM_TOKEN\nsubstitutions:\n  _REGION: europe-west1\noptions:\n  machineType: E2_HIGHCPU_8\n  logging: CLOUD_LOGGING_ONLY\n  substitutionOption: ALLOW_LOOSE\ntimeout: 1800s\n```\n\n### 2.2 Securite et reseau\n\n| Sujet | A savoir |\n|-------|----------|\n| **Compte de service du build** | Utiliser un SA **specifie** (`serviceAccount:` dans le build/trigger) avec droits minimaux ; par defaut un SA historique (evolution des comptes par defaut : verifier la doc) |\n| **Private pool** | Workers dans un VPC Google peerable a votre VPC : acces a ressources privees, **egress controlable**, taille de machine configurable ; **pas** d'IP publique fixe par defaut (utiliser Cloud NAT pour une IP stable) |\n| **VPC Service Controls** | Cloud Build peut etre place dans un perimetre ; private pools recommandes |\n| **Secrets** | `availableSecrets` -> **variables d'env** par etape ; jamais en substitution |\n| **Provenance SLSA** | Cloud Build genere une provenance signee des images (attestation) ; verifiable par Binary Authorization |\n| **Approbation de build** | `--require-approval` sur le trigger (pour apply, deploy prod) |\n| **Pull Requests externes** | Controle de commentaire (`/gcbrun`) pour eviter l'execution de code non revu avec des droits eleves |\n| **Logs** | `CLOUD_LOGGING_ONLY`, bucket de logs dedie (necessaire avec SA specifie) |\n\n### 2.3 Performance du build\n\n- **Cache de couches** : Kaniko (`--cache=true`, `--cache-ttl`) ou `docker build --cache-from` (pull de l'image precedente).\n- **Cache de dependances** : bucket Cloud Storage restaure/sauvegarde via etapes (gsutil) ou volumes ; ou images de base contenant les deps.\n- **Machine** : `E2_HIGHCPU_8/32`, `N1_HIGHCPU_32` ; plus de CPU accelere builds paralleles ; le cout est a la minute.\n- **Eviter** les `pull` inutiles ; images d'etapes **epinglees par digest**.\n\n### 2.4 Cloud Build + gouvernance\n\n- **Triggers** : declares en Terraform (`google_cloudbuild_trigger`) ; filtres `included_files` pour ne builder que ce qui change (monorepo).\n- **Notifications** : Pub/Sub topic `cloud-builds` -> Slack / Cloud Function / alerte d'echec.\n- **Builds approuves** et **separation des SA** : SA \"build\" (ecrit Artifact Registry) != SA \"deploy\" (deploie).\n\n**Savoir-faire** : ecrire un `cloudbuild.yaml` avec parallelisme + secret + cache ; choisir entre pool par defaut et private pool ; expliquer comment empecher qu'une PR d'un fork exfiltre un secret.\n\n---\n\n## 3. Cloud Deploy et livraison progressive\n\n### 3.1 Cycle de vie\n\n```\nRelease (immuable, images + manifestes RENDUS par Skaffold)\n  -> Rollout #1 vers target dev   (auto)\n  -> Promotion -> Rollout vers staging (verification post-deploy)\n  -> Promotion -> [approbation requise] -> Rollout prod (canary 10% -> 50% -> 100%)\n```\n\n- Un **release** = rendu (render) des manifestes **une seule fois** : tous les environnements deploient **les memes artefacts** (la difference vient des **profils** Skaffold/Kustomize), ce qui garantit \"build once, deploy many\".\n- **Rollback** = nouveau rollout d'un **release precedent** (immuable) ; plus fiable qu'un `kubectl rollout undo` car il repasse par le pipeline et conserve l'historique.\n- **Verify** : job (conteneur) apres le deploiement ; echec => rollout en echec (et eventuel rollback via automation).\n- **Deploy hooks** : jobs avant/apres deploiement (migrations de BDD, notifications).\n- **Automations** : `PromoteRelease` (auto-promotion apres N minutes), `AdvanceRollout`, `RepairRollout` (retry/rollback sur echec).\n- **Deploy policies** : fenetres de maintenance (pas de deploiement le vendredi soir), restrictions.\n- **IAM** : `clouddeploy.releaser`, `clouddeploy.approver` (separer qui cree/qui approuve), `execution service account` par target.\n\n### 3.2 Canary : ce que fait Cloud Deploy\n\n- **Cloud Run** : repartit le trafic entre revisions (`automaticTrafficControl: true`), phases `percentages: [10, 50]` puis stable.\n- **GKE** : via service mesh/Gateway API (traffic splitting) ou **ajustement de replicas** (canary \"naif\" : proportion de pods).\n- Chaque phase peut avoir `verify: true`.\n\n### 3.3 Decider : quelle strategie ?\n\n| Question | Reponse |\n|----------|---------|\n| Rollback **instantane** exige ? | Blue/green (ou revision precedente Cloud Run) |\n| Budget **infra limite** ? | Rolling / canary (pas de doublement) |\n| Exposer a **peu d'utilisateurs d'abord** ? | Canary |\n| Migration de schema **incompatible** ? | Decouper : expand/contract (changements retrocompatibles), puis blue/green ; la BDD est le vrai point dur |\n| Tester sans impact utilisateur ? | Shadow traffic (mirroring) |\n\n**Expand/contract** : (1) ajouter la nouvelle colonne/table sans casser l'ancien code, (2) deployer le code qui ecrit les deux, (3) migrer les donnees, (4) deployer le code qui lit le nouveau, (5) supprimer l'ancien. Chaque etape est compatible avec N-1 -> rollback sur.\n\n**Savoir-faire** : ecrire un pipeline Cloud Deploy 3 etapes avec approbation prod et canary Cloud Run ; expliquer pourquoi un rollback d'application n'annule pas une migration destructive.\n\n---\n\n## 4. GKE pour un DevOps\n\n### 4.1 Composants a connaitre\n\n| Notion | Detail |\n|--------|--------|\n| **Standard vs Autopilot** | Standard : vous gerez les node pools ; Autopilot : Google gere noeuds, facturation par ressources de pod, durcissement par defaut |\n| **Zonal vs regional** | Regional = control plane et noeuds repartis sur 3 zones (HA) |\n| **Release channels** | Rapid / Regular / Stable / Extended : mises a jour automatiques du cluster |\n| **Maintenance windows / exclusions** | Controler quand les mises a jour automatiques ont lieu |\n| **Private cluster** | Noeuds sans IP publique ; control plane via endpoint prive/authorized networks |\n| **Workload Identity** | Identite GCP par pod, sans cle |\n| **Network Policy / Dataplane V2** | Isolation reseau entre pods |\n| **Binary Authorization** | Controle d'admission des images |\n| **Config Sync / Policy Controller** | GitOps + OPA Gatekeeper |\n\n### 4.2 Deploiements sans interruption\n\n```yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata: { name: api }\nspec:\n  replicas: 6\n  strategy:\n    type: RollingUpdate\n    rollingUpdate:\n      maxSurge: 25%          # pods supplementaires pendant la maj\n      maxUnavailable: 0      # jamais moins de 6 pods Ready -> zero downtime\n  template:\n    spec:\n      containers:\n        - name: api\n          image: europe-west1-docker.pkg.dev/prj/apps/api:1.4.2\n          resources:\n            requests: { cpu: 250m, memory: 256Mi }   # base du scheduling ET de l'HPA\n            limits:   { memory: 256Mi }              # limite memoire = requests (evite OOM surprise)\n          readinessProbe:                             # le pod n'RECOIT du trafic que s'il est Ready\n            httpGet: { path: /healthz/ready, port: 8080 }\n            periodSeconds: 5\n          livenessProbe:                              # redemarre le conteneur s'il est bloque\n            httpGet: { path: /healthz/live, port: 8080 }\n            initialDelaySeconds: 20\n          startupProbe:                               # laisse le temps de demarrer\n            httpGet: { path: /healthz/live, port: 8080 }\n            failureThreshold: 30\n            periodSeconds: 2\n      terminationGracePeriodSeconds: 30\n      topologySpreadConstraints:                      # repartit sur les zones\n        - maxSkew: 1\n          topologyKey: topology.kubernetes.io/zone\n          whenUnsatisfiable: ScheduleAnyway\n          labelSelector: { matchLabels: { app: api } }\n---\napiVersion: policy/v1\nkind: PodDisruptionBudget\nmetadata: { name: api }\nspec:\n  minAvailable: 4                                      # protege lors des drains/upgrades de noeuds\n  selector: { matchLabels: { app: api } }\n```\n\nComprendre :\n- **readiness** != **liveness** : readiness = \"puis-je recevoir du trafic ?\" (retire du Service) ; liveness = \"dois-je etre redemarre ?\" (une liveness trop agressive cause des **boucles de redemarrage**).\n- **PDB** protege contre les interruptions **volontaires** (drain, upgrade), pas contre une panne de noeud.\n- **Requests** determinent le **scheduling**, l'**HPA** et les **QoS classes** (Guaranteed / Burstable / BestEffort ; ordre d'eviction : BestEffort d'abord).\n- Pods tues par OOM : `limits.memory` depasse -> `OOMKilled` (exit 137).\n\n### 4.3 Autoscaling : formules\n\n**HPA** : `replicas = ceil( replicasActuels x (metriqueActuelle / cible) )`\nExemple : 4 pods, CPU moyen 90 %, cible 60 % => `ceil(4 x 90/60) = 6`.\n- La metrique CPU est en **% des requests** (donc requests irrealistes = HPA inefficace).\n- **Cluster Autoscaler** reagit aux pods **Pending** par manque de ressources et reduit quand les noeuds sont sous-utilises (et si les pods peuvent migrer ; PDB/annotations `safe-to-evict`).\n- **VPA** ajuste requests/limits (mode `Off` = recommandations seulement) ; **ne pas** combiner VPA et HPA sur la meme metrique CPU/memoire.\n- **Autopilot** : pas de gestion de noeuds ; HPA/VPA restent utiles.\n\n### 4.4 Diagnostic rapide\n\n| Symptome | Commande / piste |\n|----------|------------------|\n| `Pending` | `kubectl describe pod` : insuffisance de ressources, taints, PVC, quotas |\n| `CrashLoopBackOff` | `kubectl logs --previous`, probes trop strictes, config manquante |\n| `ImagePullBackOff` | Droits Artifact Registry (SA des noeuds), nom/tag de l'image |\n| `OOMKilled` | Augmenter la memoire / corriger la fuite (Profiler) |\n| Service injoignable | Selector/labels, readiness, NetworkPolicy, firewall, NEG/health check du LB |\n| Mise a jour bloquee | `kubectl rollout status`, readiness qui echoue, `maxUnavailable` |\n\n**Savoir-faire** : ecrire un Deployment zero-downtime avec probes, PDB, requests/limits ; calculer un HPA ; diagnostiquer un pod Pending/OOMKilled.\n\n---\n\n## 5. Mathematiques des SLO\n\n### 5.1 Definitions chiffrees\n\n- **SLI** (ratio) = bons evenements / evenements valides.\n- **Error budget** = `1 - SLO`, exprime en **evenements** (requetes) ou en **temps**.\n- **Burn rate** = `taux d'erreur observe / (1 - SLO)`. Burn rate **1** = vous consommez exactement le budget sur la fenetre ; **10** = vous l'epuisez 10 fois plus vite.\n\n### 5.2 Exemple complet\n\nSLO : **99,9 %** de requetes reussies sur **30 jours**. Trafic : 10 000 000 requetes / 30 jours.\n- Budget en requetes : `0,001 x 10 000 000 = 10 000` requetes en erreur autorisees.\n- Budget en temps (pour un service 100 % indisponible) : 43,2 min.\n- Incident : pendant 1 h, 5 % des requetes echouent => taux d'erreur 5 % => burn rate = `0,05 / 0,001 = 50`. A ce rythme le budget est epuise en `30 jours / 50 = 14,4 heures`.\n- Budget consomme pendant cette heure : `burn x duree / fenetre = 50 x 1 h / 720 h = 6,9 %`.\n\n**Seuils d'alerte multi-fenetres** (budget consomme -> burn rate = `% budget x fenetre / duree`) :\n\n| % du budget en... | Burn rate | Fenetre longue / courte |\n|-------------------|-----------|-------------------------|\n| 2 % en 1 h | `0,02 x 720 / 1 = 14,4` | 1 h / 5 min |\n| 5 % en 6 h | `0,05 x 720 / 6 = 6` | 6 h / 30 min |\n| 10 % en 3 j | `0,10 x 720 / 72 = 1` | 3 j / 6 h |\n\n**Savoir-faire** : retrouver ces nombres par calcul ; convertir un SLO en minutes/requetes ; justifier \"page\" vs \"ticket\".\n\n### 5.3 SLO composes et dependances\n\n- Service dependant de N composants **en serie** : disponibilite maximale ~ **produit** des disponibilites. 3 dependances a 99,9 % => `0,999^3 = 99,7 %` : votre SLO de 99,9 % est **impossible** sans redondance/degradation.\n- **Redondance en parallele** : `1 - (1-A)(1-B)`.\n- Une **degradation gracieuse** (cache, mode lecture seule) permet un SLO superieur a celui de la dependance la plus faible.\n\n### 5.4 Fenetres et choix\n\n| Fenetre | Avantages | Inconvenients |\n|---------|-----------|---------------|\n| **Glissante** (rolling 28/30 jours) | Reflète l'experience recente, pas de \"reset\" | Moins alignee avec les rapports mensuels |\n| **Calendaire** (mois) | Alignee avec les contrats/SLA | Le budget se \"reinitialise\" -> comportement opportuniste en fin de mois |\n\nSLI **par requete** (request-based) vs **par fenetre** (window-based : \"% de minutes bonnes\") : le premier est plus precis ; le second plus simple a expliquer.\n\n### 5.5 Choisir un seuil de latence\n\nSLO de latence : `95 % des requetes < 300 ms` ET `99 % < 1 s` (plusieurs paliers). Mesurer en **distribution** (histogramme/percentiles), jamais en moyenne.\n\n---\n\n## 6. Monitoring et logging : mecanismes\n\n### 6.1 Metriques\n\n| Notion | Detail |\n|--------|--------|\n| **Kinds** | `GAUGE` (valeur instantanee), `DELTA` (variation sur l'intervalle), `CUMULATIVE` (compteur croissant) |\n| **Types de valeur** | INT64, DOUBLE, BOOL, STRING, **DISTRIBUTION** |\n| **Alignement** | `alignment_period` + `per_series_aligner` (ex. `ALIGN_RATE` convertit un cumulatif en taux) |\n| **Reduction** | `cross_series_reducer` + `group_by_fields` (agreger plusieurs series) |\n| **Cardinalite** | Chaque combinaison de labels = une serie : **eviter** les labels a forte cardinalite (id utilisateur) -> cout et lenteur |\n\n### 6.2 Alertes : comportement\n\n- Condition **seuil**, **absence de donnees** (`condition_absent`), **taux de croissance**, **prevision** (forecast), **SLO burn rate**, **log match** (alerte sur un motif de log).\n- **Duration** : la condition doit etre vraie pendant X minutes -> reduit les faux positifs mais **retarde** la detection.\n- **Incidents** : ouverture automatique ; **auto-close** apres une periode sans violation ; **notification rate limit** (log-match) ; regroupement.\n- **Canaux** : email, SMS, Slack, PagerDuty, Pub/Sub (-> automatisation : Cloud Function de remediation), webhook.\n- Chaque alerte doit avoir une **documentation** (runbook) et une **severite**.\n\n### 6.3 Cloud Logging : architecture detaillee\n\n- Chaque entree traverse le **Log Router** : evaluee contre **tous les sinks** (plusieurs destinations possibles) ; `_Required` et `_Default` sont des sinks par defaut.\n- **Exclusions** s'appliquent **par sink** ; une entree exclue de `_Default` peut quand meme etre routee vers un autre sink.\n- **Log buckets** : region, retention, CMEK, **Log Analytics** (SQL) possible ; **log views** : acces par sous-ensemble (par equipe) sans copier les donnees.\n- **Sinks agreges** (org/dossier) avec `--include-children`, `unique-writer-identity`, **droits d'ecriture sur la destination** (erreur classique : sink qui n'exporte rien car le writer n'a pas le role).\n- **Log-based metrics** : **counter** (nombre de matches) ou **distribution** (extraire une valeur numerique par regex/champ) + **labels extraits** ; ne retroagissent pas sur les logs deja passes (s'appliquent aux nouveaux).\n- **Audit logs** : `protoPayload.methodName`, `authenticationInfo.principalEmail`, `resourceName` ; Data Access desactive par defaut sauf BigQuery (activable par service, avec exemptions de principaux).\n- **Couts** : ingestion au-dela du quota gratuit ; `_Required` gratuit ; exclusions et sampling reduisent la facture.\n\n### 6.4 Prometheus et OpenTelemetry\n\n- **Managed Service for Prometheus** : collecteurs manages par noeud (`PodMonitoring`), stockage Monarch, **PromQL** ; compatible Grafana (via frontend).\n- **OpenTelemetry** : standard d'instrumentation (traces, metriques, logs) ; **Collector** exporte vers Cloud Trace/Monitoring/Logging.\n- Pour le tracing : **propagation de contexte** (W3C `traceparent`) entre services ; **echantillonnage** (head/tail) pour maitriser le cout.\n\n**Savoir-faire** : creer une metrique basee sur les logs avec label, une alerte dessus et un runbook ; expliquer pourquoi un sink n'exporte rien (droits du writer) ; choisir entre Log Analytics et export BigQuery.\n\n---\n\n## 7. Fiabilite : pannes en cascade et capacite\n\n### 7.1 Pannes en cascade\n\nMecanisme : un composant sature -> latences -> **retries** des clients -> charge **amplifiee** -> effondrement.\nDefenses :\n- **Retries limites** : backoff exponentiel + **jitter** + **retry budget** (ex. max 10 % de trafic supplementaire) ; ne retenter que les erreurs **idempotentes/transitoires**.\n- **Timeouts** adaptes et propagation de **deadlines** (ne pas continuer un travail dont le client est parti).\n- **Load shedding** : rejeter proprement (503/429) au-dela de la capacite ; priorites (critique vs best-effort).\n- **Circuit breaker**, **bulkheads** (pools de ressources isoles par dependance).\n- **Graceful degradation** : cache, contenu reduit, mode lecture seule.\n- **Quotas par client**, **rate limiting**.\n\n### 7.2 Capacite et charge\n\n- **N+2** : prevoir de quoi absorber la perte d'une zone **pendant** une maintenance.\n- Tests de charge : mesurer le **point de saturation**, valider l'autoscaling (temps de reaction vs vitesse de montee de charge).\n- **Quotas** (CPU, IP, API) : alerter a 80 %, demander les hausses a l'avance ; les pics predictibles (soldes) -> **pre-chauffer** (min instances/replicas).\n- **Cold starts** : `min-instances` (Cloud Run), pods warm.\n\n### 7.3 Gestion d'incident : details\n\n| Notion | Detail |\n|--------|--------|\n| **Severite** | SEV1 (indisponibilite majeure/perte de donnees), SEV2 (degradation significative), SEV3 (impact mineur) : definit qui est reveille, delai de communication |\n| **Declaration** | Declarer **tot** ; mieux vaut sur-declarer et clore |\n| **Canal unique** + document d'incident | Journal horodate des actions |\n| **Escalade** | Quand ? (pas de progres en X min, impact > Y) |\n| **Passation (handoff)** | Explicite (\"tu es maintenant IC\") |\n| **Mitigation** | Rollback, bascule de trafic, desactivation de feature flag, ajout de capacite, blocage d'un client abusif |\n| **Fin** | Impact resolu -> fermeture ; postmortem planifie |\n\n**Contenu d'un postmortem** : resume ; impact (utilisateurs, duree, budget consomme) ; **chronologie** ; **cause racine et facteurs** ; detection (qu'est-ce qui l'a detecte ? delai ?) ; ce qui a bien/mal marche ; **actions** (prevenir / detecter / attenuer) avec **responsable + date + priorite** ; lecons.\n\n### 7.4 Releases et fiabilite\n\n- **Freeze** temporaire (periodes critiques) vs error budget policy (freeze **conditionnel**).\n- **Canary analysis** : comparer les SLI du canary et de la base ; seuils ; **rollback automatique**.\n- **Feature flags** : desactivation instantanee sans deploiement ; dette a gerer (nettoyage).\n- **Dark launch** : activer en production **sans exposer** (shadow).\n\n**Savoir-faire** : proposer un plan anti-cascade pour un service qui s'effondre sous retry ; rediger les actions d'un postmortem ; definir une error budget policy en 5 lignes.\n\n---\n\n## 8. Reseau, load balancers et performance\n\n### 8.1 Choisir le load balancer\n\n| Besoin | LB |\n|--------|----|\n| HTTP(S) global, CDN, Cloud Armor, anycast | **Global external Application LB** |\n| HTTP(S) regional (residence/cout) | Regional external Application LB |\n| HTTP(S) interne (microservices) | Internal Application LB |\n| TCP/SSL global | External proxy Network LB |\n| TCP/UDP passthrough, IP source preservee, tres bas niveau | External passthrough Network LB |\n| TCP/UDP interne | Internal passthrough Network LB |\n\n- **Backends** : MIG, **NEG** (zonal/serverless/internet), buckets (CDN).\n- **Health checks** : protocole/port/chemin ; ajuster `check-interval`, `unhealthy-threshold`, `timeout` ; **firewall** doit autoriser les plages de health check Google (`130.211.0.0/22`, `35.191.0.0/16`).\n- **Connection draining** (delai de grace a la suppression de backend) ; **timeout** du backend adapte aux requetes longues.\n- **Cloud Armor** : WAF/DDoS, regles, rate limiting.\n- **Premium vs Standard tier** : Premium = backbone Google, LB global ; Standard = Internet public, regional.\n\n### 8.2 Cloud Run : parametres de performance\n\n| Parametre | Effet |\n|-----------|-------|\n| `concurrency` | Requetes simultanees par instance (defaut 80) : monter si le code est asynchrone/leger |\n| `min-instances` | Evite les cold starts (cout) |\n| `max-instances` | Protege les backends (BDD) et le budget |\n| `cpu-boost`, `cpu always allocated` | Demarrage plus rapide / traitements d'arriere-plan |\n| `timeout` | Duree max d'une requete |\n| **Execution environment** gen1/gen2 | gen2 : compatibilite Linux complete, reseau |\n\n### 8.3 Optimisation de cout (dans un cadre DevOps)\n\n- **Recommender** : right-sizing VM, IAM, disques inactifs, IP non utilisees.\n- **CUD** (engagement) pour la base stable ; **Spot** pour tolerant ; **arret planifie** pour dev/test.\n- **Labels + export BigQuery** de la facturation => FinOps (cout par equipe/service).\n- Logs : **exclusions**, retention adaptee ; Artifact Registry : **cleanup policies**.\n\n---\n\n## 9. Terraform pour cette certification\n\nL'examen ne demande pas d'ecrire du HCL, mais les scenarios supposent de savoir **gerer l'organisation en code**. Le [cours Terraform](../terraform/README.md) et le lab 4 couvrent :\n- Etat distant GCS, impersonation, WIF pour la CI.\n- `google_project_iam_member` vs `binding` vs `policy`.\n- Org policies, sinks, alertes, Cloud Run avec `ignore_changes`.\n- Pipeline Terraform dans Cloud Build (SA dedie, approbation).\n\n**Reponses-types a connaitre** :\n| Question | Reponse |\n|----------|---------|\n| Ou stocker l'etat ? | Bucket GCS, versioning, acces restreint |\n| Comment la CI s'authentifie ? | WIF (externe) / SA attache (Cloud Build) |\n| Comment eviter la derive ? | Org Policy + IAM strict + plan planifie |\n| Creation de projets standardises ? | Project factory (module) |\n\n---\n\n## 10. Etudes de cas type examen\n\n### Cas 1 - \"Fintech Orion\"\n**Contexte** : Orion exploite une API de paiement sur GKE regional. SLA client 99,9 %. Deploiements 3 fois/semaine. Incidents recents : 2 regressions en production detectees par des clients. L'equipe supervise le CPU des noeuds. Les logs d'audit ne sont conserves que 30 jours et la conformite exige 7 ans.\n\n**Questions**\n1. Quel SLO proposer ? *Reponse : SLO interne de 99,95 % de requetes de paiement reussies (< SLA 99,9 %), plus un SLO de latence p99.*\n2. Comment detecter les regressions avant les clients ? *Canary via Cloud Deploy avec verification + alerte de burn rate ; rollback automatique.*\n3. Comment remplacer l'alerte CPU ? *Alertes sur symptomes : burn rate multi-fenetres sur le SLI de requetes ; CPU en dashboard.*\n4. Audit 7 ans ? *Sink agrege org -> bucket Cloud Storage avec retention policy verrouillee ; ou log bucket a retention personnalisee ; Data Access logs actives sur les services concernes.*\n5. Pas de cles SA : *WIF pour la CI, Workload Identity pour les pods, Org Policy `disableServiceAccountKeyCreation`.*\n\n### Cas 2 - \"Retail Atlas\"\n**Contexte** : pipeline Jenkins auto-heberge, builds de 40 min, images sur Docker Hub (rate limits), deploiement manuel via `kubectl`, secrets dans des variables de pipeline.\n\n**Plan de migration attendu** : Cloud Build (cache Kaniko, parallelisme) ; **Artifact Registry** avec depot **remote** pour Docker Hub (fiabilite, pas de rate limit) ; **Cloud Deploy** (dev -> staging -> prod avec approbation) ; secrets dans **Secret Manager** ; Binary Authorization (images signees) ; Terraform pour tout l'amorcage.\n\n### Cas 3 - \"Media Helios\" (incident)\n**Contexte** : pic de trafic ; un service de recommandation lent fait monter la latence du front ; les clients du front reessaient ; la BDD sature ; le site tombe.\n\n**Analyse** : panne en **cascade** par retry storm. Mitigation immediate : **shed load** (desactiver les recommandations via feature flag / degradation gracieuse), augmenter la capacite, limiter les retries. Action durable : retries avec backoff + jitter + budget, timeouts/deadlines, circuit breaker sur le service de recommandation, **tests de charge** et capacity planning, postmortem sans blame avec actions suivies.\n"}, {"track": "az", "doc": "Cours", "md": "# Cours - AZ-305 : Designing Microsoft Azure Infrastructure Solutions\n\n> Parcours : ce cours -> [questions.md](questions.md) -> [approfondissement.md](approfondissement.md) -> [questions-avancees.md](questions-avancees.md).\n> Terraform sur Azure : [../terraform/README.md](../terraform/README.md), lab 5.\n\n## Table des matieres\n\n1. [Presentation de l'examen](#1-presentation-de-lexamen)\n2. [Domaine 1 - Identite, gouvernance et supervision](#2-domaine-1---identite-gouvernance-et-supervision-25-30-)\n3. [Domaine 2 - Stockage de donnees](#3-domaine-2---stockage-de-donnees-20-25-)\n4. [Domaine 3 - Continuite d'activite](#4-domaine-3---continuite-dactivite-15-20-)\n5. [Domaine 4 - Infrastructure](#5-domaine-4---infrastructure-30-35-)\n6. [Well-Architected Framework et cout](#6-well-architected-framework-et-optimisation-des-couts)\n7. [Tableaux de decision](#7-tableaux-de-decision-aide-memoire)\n8. [Conseils pour l'examen](#8-conseils-pour-lexamen)\n\n---\n\n## 1. Presentation de l'examen\n\nAZ-305 est l'examen de **conception** (architecte), pas d'administration. On ne vous demande pas \"quelle commande ?\" mais **\"quelle solution repond a ces exigences ?\"**.\n\n- Questions a choix, **etudes de cas** (plusieurs questions sur un meme scenario, sans retour en arriere entre sections), glisser-deposer, ordonnancement, \"oui/non\".\n- Les exigences contiennent des **contraintes** : cout minimal, effort d'administration minimal, haute disponibilite, conformite, latence, hybride.\n- Regle d'or : **choisir le service manage (PaaS) le plus simple qui satisfait toutes les exigences**.\n\nPour obtenir la certification **Azure Solutions Architect Expert**, il faut AZ-305 **et** la certification Azure Administrator Associate (AZ-104).\n\n---\n\n## 2. Domaine 1 - Identite, gouvernance et supervision (25-30 %)\n\n### 2.1 Microsoft Entra ID (ex-Azure AD)\n\nService d'identite cloud : authentification (SSO, MFA, sans mot de passe), autorisation d'applications, gestion des identites externes.\n\n| Fonction | Usage |\n|----------|-------|\n| **Tenant** | Instance d'Entra ID d'une organisa
