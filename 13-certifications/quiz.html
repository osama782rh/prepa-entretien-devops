tion (frontiere d'identite) |\n| **Entra ID B2B** | Inviter des **partenaires/invites** avec leur propre identite a acceder a vos ressources |\n| **Entra External ID (ex-Azure AD B2C)** | Identites **clients** (consommateurs) : inscription, connexion sociale, flux personnalises |\n| **Conditional Access** | Politiques \"si... alors...\" : exiger MFA, appareil conforme, bloquer par pays/risque/application |\n| **MFA** | Second facteur, active via Conditional Access ou Security Defaults |\n| **Identity Protection** | Detection des **risques** (utilisateur, connexion), reponse automatique |\n| **PIM (Privileged Identity Management)** | Acces **juste-a-temps** et **eligible** aux roles privilegies, approbation, journalisation, expiration |\n| **Access reviews** | Revue periodique des acces (groupes, applications, roles) |\n| **Entitlement management** | Catalogues et packages d'acces, cycle de vie des acces |\n| **Application Proxy / Private Access** | Publier des applications web internes sans VPN |\n| **Domain Services (Entra DS)** | Domaine manage (LDAP, Kerberos, GPO) pour applications legacy sans controleurs de domaine |\n\n> Licences : Conditional Access, PIM et Identity Protection necessitent **Entra ID P1/P2** (P2 pour PIM et Identity Protection).\n\n### 2.2 Identite hybride\n\n| Option | Fonctionnement | A choisir quand |\n|--------|----------------|-----------------|\n| **Password Hash Sync (PHS)** | Hash du hash du mot de passe synchronise vers le cloud | **Simple, recommande par defaut**, haute disponibilite (pas de dependance on-prem), detection de fuite |\n| **Pass-through Authentication (PTA)** | Validation du mot de passe **en temps reel** par des agents on-prem | Politique interdisant de stocker les hash dans le cloud, mais sans federation |\n| **Federation (AD FS)** | Redirection vers l'AD FS on-prem | **Cartes a puce**, MFA tiers existant, exigences specifiques. Plus complexe |\n| **Seamless SSO** | Connexion automatique depuis les appareils du domaine | Complement de PHS/PTA |\n\nOutils de synchronisation : **Entra Connect Sync** (complet) et **Entra Cloud Sync** (leger, agent, **multi-forets deconnectees**, haute disponibilite).\n\n### 2.3 Autorisation : Azure RBAC vs roles Entra\n\n| | Azure RBAC | Roles Entra ID |\n|---|------------|----------------|\n| **Controle** | Ressources Azure (VM, stockage...) | Ressources d'identite/tenant (utilisateurs, applications, licences) |\n| **Portee** | Management group > abonnement > groupe de ressources > ressource | Tenant, unite administrative |\n| **Exemples** | Owner, Contributor, Reader, User Access Administrator | Global Administrator, User Administrator |\n| **Heritage** | Oui, descendant | Selon la portee |\n\n- **Moindre privilege**, a la portee la plus basse, accorde a des **groupes**.\n- **Deny assignments** (via Blueprints/Managed Apps) : rares.\n- **PIM** pour les roles Azure aussi (acces eligible).\n\n### 2.4 Identites des applications\n\n| Type | Description | Quand l'utiliser |\n|------|-------------|------------------|\n| **Managed identity system-assigned** | Liee au cycle de vie d'**une** ressource | Une ressource, un acces |\n| **Managed identity user-assigned** | Ressource independante, **partageable** entre plusieurs ressources | Plusieurs ressources avec les memes droits, pre-provisionnement |\n| **Service principal** | Identite d'application avec secret/certificat | Quand les managed identities ne sont pas possibles (hors Azure) ; preferer **federated credentials** (OIDC) pour CI/CD |\n\n**Toujours preferer une managed identity** : aucun secret a gerer. Elle s'authentifie aupres de Key Vault, Storage, SQL, etc.\n\n### 2.5 Azure Key Vault\n\n| Option | Description |\n|--------|-------------|\n| **Vault Standard** | Cles protegees par logiciel, secrets, certificats |\n| **Vault Premium** | Cles protegees par **HSM** (multi-tenant) |\n| **Managed HSM** | **HSM dedie, mono-locataire**, FIPS 140-3 Level 3, controle total du domaine de securite |\n| **Permissions** | Preferer **RBAC** aux access policies (modele historique) |\n| **Protection** | **Soft delete** (actif par defaut) et **purge protection** (anti-suppression definitive) |\n| **Reseau** | Private Endpoint / pare-feu |\n| **Rotation** | Rotation automatique des cles, expiration des secrets, evenements via Event Grid |\n\nChiffrement : **cles gerees par Microsoft** (defaut) vs **cles gerees par le client (CMK)** dans Key Vault vs **BYOK/HYOK**. Chiffrement hote (*encryption at host*) pour les VM, Azure Disk Encryption (BitLocker/dm-crypt).\n\n### 2.6 Gouvernance\n\n```\nTenant Root Management Group\n |-- MG: Platform\n |     |-- MG: Identity     (abonnement identite)\n |     |-- MG: Connectivity (hub reseau)\n |     |-- MG: Management   (supervision)\n |-- MG: Landing Zones\n |     |-- MG: Corp         (workloads internes, connectes)\n |     |-- MG: Online       (workloads exposes Internet)\n |-- MG: Sandbox\n |-- MG: Decommissioned\n```\n\nC'est l'architecture **Azure Landing Zone** du Cloud Adoption Framework (CAF).\n\n| Outil | Role |\n|-------|------|\n| **Management groups** | Hierarchie au-dessus des abonnements ; politiques et RBAC heritees (jusqu'a 6 niveaux) |\n| **Abonnements** | Frontiere de facturation, de quotas et d'administration |\n| **Azure Policy** | **Regles** et conformite : effets `Deny`, `Audit`, `Append`, `Modify`, `DeployIfNotExists`, `AuditIfNotExists`, `Disabled` |\n| **Initiatives** | Regroupement de politiques (ex. ISO 27001, benchmark securite) |\n| **Remediation tasks** | Corriger les ressources existantes non conformes (Modify/DeployIfNotExists) |\n| **Resource locks** | `CanNotDelete` / `ReadOnly` contre les suppressions/modifications accidentelles |\n| **Tags** | Metadonnees : cout, proprietaire, environnement (imposables via Policy) |\n| **Blueprints** | **Deprecie** : preferer Template Specs + Deployment Stacks + Policy + IaC |\n| **Azure Resource Graph** | Requetes (KQL) a grande echelle sur l'inventaire des ressources |\n| **Microsoft Defender for Cloud** | Posture de securite (CSPM), recommandations, protection des workloads (CWPP), conformite reglementaire |\n| **Cost Management + Budgets** | Analyse des couts, budgets, alertes, export |\n\n**Policy vs RBAC** : RBAC dit **qui** peut faire quoi ; Policy dit **ce qui est autorise** (ex. regions autorisees, SKU interdits, tags obligatoires), quelle que soit la personne.\n\n### 2.7 Supervision\n\n```\n Sources (VM, App, PaaS, AKS, reseau, Entra ID, abonnement)\n         | diagnostic settings / agents (Azure Monitor Agent) / SDK\n         v\n +----------------------+----------------------+\n | Metrics (temps reel, | Logs (Log Analytics  |\n | 93 j, faible latence)| workspace, KQL)      |\n +----------------------+----------------------+\n         |                         |\n   Alertes (metrique, log,  Workbooks, dashboards, Sentinel,\n   activity log) -> Action groups -> email/SMS/webhook/Logic App/Function\n```\n\n| Service | Usage |\n|---------|-------|\n| **Azure Monitor** | Plateforme commune : metriques, logs, alertes, autoscale |\n| **Log Analytics workspace** | Stockage de logs + requetes **KQL** |\n| **Application Insights** | **APM** applicatif : requetes, dependances, exceptions, cartes d'application, tests de disponibilite |\n| **VM Insights / Container Insights** | Performance et dependances des VM / AKS |\n| **Azure Monitor Agent (AMA)** + **Data Collection Rules** | Collecte moderne (remplace Log Analytics agent/MMA) |\n| **Diagnostic settings** | Envoi des logs de ressources vers Log Analytics, Storage (archive), Event Hubs (SIEM tiers) |\n| **Activity Log** | Operations du plan de controle de l'abonnement (qui a fait quoi) |\n| **Network Watcher** | Diagnostic reseau : IP flow verify, next hop, NSG flow logs, connection monitor |\n| **Microsoft Sentinel** | **SIEM/SOAR** cloud, construit sur Log Analytics |\n| **Service Health / Resource Health** | Incidents Azure affectant vos ressources |\n| **Alertes** | Metrique, log (KQL), activity log, smart detection ; **Action groups** reutilisables |\n\n**Conception des workspaces Log Analytics** :\n- **Un workspace centralise** : simplicite, correlation, cout (commitment tiers).\n- **Plusieurs workspaces** : exigences de **residence des donnees**, separation de droits stricte, filiales independantes, facturation separee.\n- Controle d'acces : RBAC au niveau workspace, ressource ou table.\n- Retention : 30 j par defaut (interactive), extensible jusqu'a 12 ans (archive) ; niveaux **Basic/Auxiliary logs** pour reduire le cout.\n\n---\n\n## 3. Domaine 2 - Stockage de donnees (20-25 %)\n\n### 3.1 Azure Storage\n\nTypes de comptes : **Standard general-purpose v2** (par defaut), **Premium** (block blobs, file shares, page blobs).\n\n| Service | Usage |\n|---------|-------|\n| **Blob** (Block/Append/Page) | Stockage objet : fichiers, medias, backups, data lake |\n| **Files** | Partages **SMB/NFS** manages, lift-and-shift de serveurs de fichiers |\n| **Queue** | File de messages simple (jusqu'a 64 Ko par message) |\n| **Table** | NoSQL cle-valeur simple (ou Cosmos DB Table) |\n| **Disks** | Disques de VM (voir ci-dessous) |\n| **ADLS Gen2** | Blob + **espace de noms hierarchique** : data lake analytique |\n\n**Niveaux d'acces (Blob)** : Hot, Cool (30 j min), Cold (90 j min), Archive (180 j min, **hors ligne**, reactivation en heures). Gestion automatique avec les **lifecycle management policies**.\n\n**Redondance** :\n\n| Option | Copies | Protege contre | Lecture secondaire |\n|--------|--------|----------------|--------------------|\n| **LRS** | 3 dans un datacenter | Panne de disque/rack | - |\n| **ZRS** | 3 dans 3 zones de disponibilite | Panne d'une **zone** | - |\n| **GRS** | LRS + 3 dans la region jumelee | Panne **regionale** | Non (RA-GRS : oui) |\n| **GZRS** | ZRS + LRS dans la region jumelee | Panne de zone **et** de region | Non (RA-GZRS : oui) |\n\n> Le failover vers la region secondaire peut entrainer une perte de donnees (replication **asynchrone**, RPO ~15 min, non garanti par SLA).\n\n**Fonctions de protection des donnees (Blob)** : soft delete, versioning, **change feed**, **point-in-time restore**, **immutable storage** (WORM : time-based retention / legal hold) pour la conformite (SEC 17a-4), **object replication**, **SFTP**.\n\n**Securite** : chiffrement au repos (SSE, cles Microsoft ou CMK), TLS en transit, **Entra ID RBAC** (a preferer aux cles de compte), **SAS** (acces delegue limite, preferer *user delegation SAS*), pare-feu, **Private Endpoint**, desactivation de l'acces anonyme.\n\n### 3.2 Options de fichiers\n\n| Besoin | Service |\n|--------|---------|\n| Partage SMB standard, lift-and-shift | **Azure Files** (Standard ou Premium) |\n| Synchroniser un serveur de fichiers on-prem avec cache local | **Azure File Sync** |\n| Performance extreme, faible latence, NFS/SMB, SAP HANA, HPC, Oracle | **Azure NetApp Files** |\n| Calcul haute performance, fichiers massifs | Azure Managed Lustre |\n| Profils utilisateur AVD (FSLogix) | Azure Files Premium ou NetApp Files |\n\n### 3.3 Disques manages\n\n| Type | Usage |\n|------|-------|\n| **Standard HDD** | Sauvegardes, acces rare |\n| **Standard SSD** | Serveurs web, dev/test |\n| **Premium SSD** | Production, bases de donnees |\n| **Premium SSD v2** | Performances (IOPS/debit) ajustables independamment de la capacite |\n| **Ultra Disk** | Latence sous la milliseconde, charges les plus exigeantes |\n\nHaute disponibilite : disques **ZRS** pour les VM multi-zones.\n\n### 3.4 Bases de donnees relationnelles\n\n| Option | Modele | Choisir quand |\n|--------|--------|---------------|\n| **Azure SQL Database** | PaaS, base unique / pool elastique | Nouvelles applications, effort d'admin minimal |\n| **Azure SQL Managed Instance** | PaaS, compatibilite **quasi totale** SQL Server | **Migration avec changements minimaux** : SQL Agent, requetes inter-bases, CLR, Service Broker, liens |\n| **SQL Server sur VM (IaaS)** | Controle total de l'OS | Acces OS necessaire, version/fonctions non supportees (SSRS, SSIS en natif...) |\n| **Azure Database for PostgreSQL / MySQL (Flexible Server)** | PaaS open source | Applications PostgreSQL/MySQL |\n\n**Azure SQL Database - options de conception** :\n\n| Option | Detail |\n|--------|--------|\n| **Modeles d'achat** | **vCore** (flexible, Hybrid Benefit, reservations) ou DTU (bundle simple) |\n| **Niveaux** | General Purpose, **Business Critical** (replicas locaux, faible latence, lecture secondaire), **Hyperscale** (jusqu'a ~100 To, scale rapide, replicas nommes) |\n| **Serverless** | Autoscaling et **pause automatique** : charges **intermittentes/imprevisibles** |\n| **Pool elastique** | Partage de ressources entre **plusieurs bases** a pics decales (SaaS multi-tenant) |\n| **Haute disponibilite** | Redondance de zone, SLA jusqu'a 99,995 % |\n| **Reprise apres sinistre** | **Active geo-replication** (par base) ou **Auto-failover groups** (groupe de bases, endpoint stable) |\n| **Sauvegardes** | Automatiques, PITR 1-35 j, LTR jusqu'a 10 ans |\n| **Securite** | Entra auth, TDE (par defaut), **Always Encrypted**, masquage dynamique, Row-level security, Defender for SQL, Private Endpoint |\n\n### 3.5 Bases NoSQL : Azure Cosmos DB\n\nBase **multi-modele distribuee globalement**, latence < 10 ms en lecture/ecriture a 99 %, SLA 99,999 % (multi-region).\n\n| APIs | NoSQL (natif), MongoDB, Cassandra, Gremlin (graphe), Table, PostgreSQL |\n|------|---|\n\n**Les 5 niveaux de coherence** (du plus fort au plus faible) :\n\n| Niveau | Garantie | Latence/Disponibilite |\n|--------|----------|-----------------------|\n| **Strong** | Lecture du dernier ecrit (lineaire) | Latence la plus haute |\n| **Bounded staleness** | Retard borne (K versions ou T secondes) | |\n| **Session** (**defaut**) | Coherence pour un client/session (\"lis ce que tu as ecrit\") | **Le meilleur compromis** |\n| **Consistent prefix** | Ordre garanti, pas de trou | |\n| **Eventual** | Aucune garantie d'ordre | Latence la plus basse |\n\nCapacite : **provisionnee** (RU/s, autoscale) ou **serverless**. **Multi-region writes** pour ecritures locales partout. **Partition key** bien choisie (forte cardinalite, repartition uniforme) = cle de la performance.\n\n### 3.6 Choisir le bon stockage de donnees\n\n| Donnees / Besoin | Service |\n|------------------|---------|\n| Relationnel, transactionnel, nouvelle app | Azure SQL Database |\n| Migration SQL Server avec peu de changements | SQL Managed Instance |\n| Documents JSON, global, faible latence | Cosmos DB (API NoSQL) |\n| Cle-valeur simple et bon marche | Table Storage |\n| Cache, sessions, faible latence | Azure Cache for Redis |\n| Fichiers/images/videos/backups | Blob Storage |\n| Lac de donnees pour analytique | ADLS Gen2 |\n| Entrepot de donnees, analytique massive SQL | Synapse Analytics / Microsoft Fabric |\n| Series temporelles IoT/telemetrie | Azure Data Explorer |\n| Recherche plein texte | Azure AI Search |\n| Graphe | Cosmos DB (Gremlin) |\n\n### 3.7 Integration de donnees et analytique\n\n| Service | Role |\n|---------|------|\n| **Azure Data Factory** | Orchestration ETL/ELT (pipelines, copy, data flows), runtime d'integration auto-heberge pour le on-prem |\n| **Synapse Analytics / Microsoft Fabric** | Plateforme analytique unifiee (SQL, Spark, pipelines) |\n| **Azure Databricks** | Spark / ML / lakehouse |\n| **Event Hubs** | **Ingestion** de flux d'evenements a tres grande echelle (millions/s), compatible Kafka |\n| **Stream Analytics** | Requetes SQL en temps reel sur des flux |\n| **Azure Purview / Microsoft Purview** | Catalogue, classification, gouvernance des donnees |\n\n### 3.8 Migration de donnees\n\n| Volume / Contexte | Solution |\n|-------------------|----------|\n| Quelques Go a To, bande passante correcte | **AzCopy**, Azure Storage Explorer, Data Factory |\n| **Dizaines a centaines de To**, reseau lent | **Azure Data Box** (disque 80 To, Heavy 1 Po) |\n| Bases de donnees | **Azure Database Migration Service**, Azure Migrate (assessment) |\n| Synchronisation continue de fichiers | Azure File Sync |\n| Serveurs complets | Azure Migrate (VM), Azure Site Recovery |\n\n---\n\n## 4. Domaine 3 - Continuite d'activite (15-20 %)\n\n### 4.1 Concepts\n\n| Terme | Signification |\n|-------|---------------|\n| **RTO** | Duree maximale acceptable de l'interruption |\n| **RPO** | Quantite maximale de donnees perdue acceptable (dans le temps) |\n| **SLA** | Engagement de disponibilite de Microsoft pour un service |\n| **HA** | Resiste aux pannes **locales** (zone, serveur) |\n| **DR** | Reprise apres sinistre **regional** |\n\n### 4.2 SLA composites\n\n- **Composants en serie** (tous necessaires) : on **multiplie**.\n  Exemple : App Service 99,95 % x SQL 99,99 % = 0,9995 x 0,9999 = **99,94 %**.\n- **Composants en parallele** (redondants) : `1 - (1 - A) x (1 - B)`.\n  Exemple : deux regions a 99,95 % -> 1 - 0,0005 x 0,0005 = **99,999975 %** (avant prise en compte du routeur global).\n- Ajouter un composant en serie **diminue** la disponibilite ; ajouter de la redondance l'**augmente**.\n- Un **service de bascule** (Traffic Manager/Front Door) fait aussi partie du calcul.\n\n### 4.3 Disponibilite des VM\n\n| Option | Protege contre | SLA VM |\n|--------|----------------|--------|\n| **VM unique** (Premium SSD/Ultra) | Aucune panne au-dela de l'hote (SLA 99,9 %) | 99,9 % |\n| **Availability Set** | Pannes de rack/maintenance (domaines de panne et de mise a jour) dans **un datacenter** | 99,95 % |\n| **Availability Zones** | Panne d'un **datacenter entier** (zone) dans la region | **99,99 %** |\n| **VM Scale Sets (VMSS)** | Autoscaling + repartition sur zones/domaines | 99,95 % - 99,99 % |\n| **Regions jumelees / multi-region** | Panne **regionale** | Selon l'architecture |\n\nModes de deploiement : **zonal** (VM epinglee a une zone) vs **zone-redundant** (service qui repartit automatiquement). Beaucoup de services PaaS offrent la **redondance de zone** (App Service, SQL, Storage ZRS, AKS, Load Balancer Standard, Application Gateway v2...).\n\n### 4.4 Sauvegarde : Azure Backup\n\n| Element | Detail |\n|---------|--------|\n| **Recovery Services vault** | VM Azure, SQL/SAP HANA dans des VM, Azure Files, serveurs on-prem (MARS, MABS, DPM) |\n| **Backup vault** | Blobs, disques, PostgreSQL, AKS |\n| **Stockage du coffre** | LRS / ZRS / **GRS** (par defaut) + **Cross-Region Restore** |\n| **Politiques** | Frequence, retention (jours, semaines, mois, annees) |\n| **Securite anti-ransomware** | **Soft delete**, **immutable vault**, **Multi-User Authorization (Resource Guard)**, chiffrement CMK |\n| **Instantanes** | Restauration instantanee de VM (retention 1-5 j) |\n\nBlob Storage a ses propres protections (versioning, PITR, soft delete). Azure SQL a ses sauvegardes automatiques.\n\n### 4.5 Reprise apres sinistre\n\n| Charge | Solution DR |\n|--------|-------------|\n| **VM Azure -> autre region** | **Azure Site Recovery (ASR)** : replication continue, RPO de l'ordre de secondes/minutes, plans de reprise, tests sans impact |\n| **VM on-prem (VMware/Hyper-V/physique) -> Azure** | ASR |\n| **Azure SQL Database** | Auto-failover groups / geo-replication |\n| **SQL Managed Instance** | Auto-failover groups |\n| **SQL sur VM** | Always On (dispo + DR), log shipping |\n| **Cosmos DB** | Multi-region, failover automatique |\n| **Storage** | GRS/GZRS, failover de compte |\n| **App Service** | Deploiement dans 2 regions + Front Door / Traffic Manager |\n| **Cle des architectures** | **Actif-actif** (RTO ~0, cout eleve) / **Actif-passif chaud** / **Pilot light** / **Sauvegarde-restauration** (cheap, lent) |\n\n### 4.6 Repartition de charge et bascule\n\n| Service | Couche | Portee | Usage |\n|---------|--------|--------|-------|\n| **Azure Load Balancer** | L4 (TCP/UDP) | Regional (ou **global** : cross-region) | Trafic non HTTP, haute performance |\n| **Application Gateway** | **L7** HTTP(S) | Regional | Routage URL/host, TLS, **WAF**, affinite de session |\n| **Azure Front Door** | **L7** HTTP(S) | **Global** | Acceleration, WAF, cache, bascule multi-regions, anycast |\n| **Traffic Manager** | **DNS** | Global | Routage DNS (priorite, pondere, performance, geographique, multivaleur) pour **tout protocole** |\n\nArbre de decision rapide :\n```\nHTTP(S) ?\n |- Oui -> Global ? -> Front Door     | Regional ? -> Application Gateway\n |- Non  -> Global ? -> Traffic Manager (DNS) ou LB cross-region\n            Regional ? -> Load Balancer\n```\n\n---\n\n## 5. Domaine 4 - Infrastructure (30-35 %)\n\n### 5.1 Choisir le calcul\n\n| Service | Type | Choisir quand |\n|---------|------|---------------|\n| **Virtual Machines** | IaaS | Controle total, logiciel legacy, lift-and-shift |\n| **VM Scale Sets** | IaaS | Flotte de VM identiques avec autoscaling |\n| **App Service** | PaaS | **Applications web/API** : deploiement simple, slots, autoscale |\n| **Azure Functions** | FaaS | Code **evenementiel** court, facturation a l'execution (Consumption), **Premium** : pas de cold start + VNet, **Dedicated** |\n| **Container Apps** | Conteneurs serverless | Microservices, **sans gerer Kubernetes**, **scale to zero**, KEDA, Dapr |\n| **AKS** | Kubernetes manage | Besoin complet de Kubernetes, ecosysteme, controle fin |\n| **Container Instances (ACI)** | Conteneurs a la demande | Taches courtes, burst, tests simples |\n| **Azure Batch** | Calcul par lots | HPC, rendu, simulations |\n| **Azure Virtual Desktop** | VDI | Postes de travail/applications distants (multi-session) |\n| **Azure VMware Solution** | VMware natif | Migration VMware sans changement |\n| **Logic Apps** | Workflows low-code | Integration SaaS/B2B, connecteurs |\n\nRegle : **PaaS/serverless d'abord** (moins d'exploitation) ; descendre vers IaaS seulement si une contrainte l'impose.\n\n**App Service** : plans (Free -> Premium v3/Isolated v2), **deployment slots** (staging, swap sans interruption), autoscale, VNet integration, Private Endpoint, **ASE** (Environnement dedie isole).\n\n**AKS** : node pools (systeme / utilisateur), autoscaler, Entra ID + RBAC, **Azure CNI** (IP de VNet pour les pods) vs **kubenet**, CNI Overlay, ingress (App Gateway for Containers / NGINX), Workload Identity, Azure Policy pour K8s, ACR pour les images.\n\n### 5.2 Reseau Azure\n\n**Conception d'adressage** : plages RFC 1918 **sans chevauchement** entre VNets et avec le on-prem.\n\n**Topologie hub-and-spoke** :\n\n```\n                       On-premise\n                    (VPN / ExpressRoute)\n                           |\n                  +----------------+\n                  |   Hub VNet     |  Azure Firewall, VPN/ER Gateway, Bastion, DNS\n                  +----------------+\n                   /       |        \\     peering\n           +-------+   +-------+   +-------+\n           |Spoke 1|   |Spoke 2|   |Spoke 3|    (workloads isoles)\n           +-------+   +-------+   +-------+\n   Trafic spoke-a-spoke et Internet force via Azure Firewall grace aux UDR (routes personnalisees)\n```\n\n**Azure Virtual WAN** : hub manage Microsoft, **connectivite a grande echelle** (nombreux sites/branches, SD-WAN, VPN, ExpressRoute, transit automatique). Choisir quand il y a **beaucoup de branches** et que l'on veut moins d'administration.\n\n**Connectivite hybride** :\n\n| Option | Description | Choisir quand |\n|--------|-------------|---------------|\n| **VPN Gateway site-a-site** | Tunnel IPsec sur Internet | Rapide, peu couteux, debit modere (jusqu'a ~10 Gb/s) |\n| **VPN point-a-site** | Utilisateurs distants | Teletravail |\n| **ExpressRoute** | **Connexion privee** via un fournisseur, hors Internet | Debit eleve, latence faible/previsible, conformite ; **peering prive** (VNet) et **Microsoft peering** (M365, PaaS public) |\n| **ExpressRoute + VPN** | VPN en secours de l'ER | **Resilience** |\n| **ExpressRoute Global Reach** | Relier deux sites on-prem via le backbone Microsoft | |\n| **ExpressRoute Direct** | Port 10/100 Gb/s directement | Tres gros debits |\n\n**Connexions entre VNets** : **VNet peering** (faible latence, non transitif, global possible) ; **VNet-to-VNet via VPN** (si chiffrement necessaire) ; **hub + NVA/Firewall** pour le transit.\n\n**Acces prive aux services PaaS** :\n\n| | Service Endpoint | **Private Endpoint (Private Link)** |\n|---|------------------|-------------------------------------|\n| **Mecanisme** | Route optimisee vers le service via le backbone ; IP de destination = IP **publique** du service | Carte reseau avec une **IP privee** dans votre VNet |\n| **Acces depuis le on-prem** | Non | **Oui** (ER/VPN) |\n| **Desactiver l'acces public** | Pas completement | **Oui** |\n| **Protection exfiltration** | Limitee (niveau service) | Forte (ressource specifique) |\n| **DNS** | Pas de changement | **Zone DNS privee** requise (`privatelink.*`) |\n| **Cout** | Gratuit | Payant |\n\nLe plus securise = **Private Endpoint**.\n\n**Securite reseau** :\n\n| Service | Role |\n|---------|------|\n| **NSG** | Filtrage L3/L4 par sous-reseau ou NIC (stateful), **ASG** pour grouper les VM |\n| **Azure Firewall** | Pare-feu manage L3-L7, FQDN/URL filtering, TLS inspection (Premium), threat intel, IDPS |\n| **WAF** | Protection web (OWASP) sur Application Gateway ou Front Door |\n| **DDoS Protection** | Protection DDoS **reseau** (IP publiques), SKU Network ou IP |\n| **Azure Bastion** | **RDP/SSH securises via TLS**, sans IP publique sur les VM |\n| **Just-in-Time VM access** | Ouverture temporaire des ports (Defender for Cloud) |\n| **Network Virtual Appliance** | Pare-feu tiers (Palo Alto, Fortinet...) |\n| **DNS Private Resolver** | Resolution DNS hybride (on-prem <-> Azure) |\n| **Azure DNS (public/prive)** | Zones DNS manages |\n\n### 5.3 Architecture d'applications\n\n**Messagerie et evenements** :\n\n| Service | Modele | Choisir quand |\n|---------|--------|---------------|\n| **Service Bus** | Messages d'entreprise : files, **topics/abonnements**, **sessions (FIFO)**, **dead-letter**, transactions, doublons, TTL | **Messages critiques/ordonnees**, integration d'entreprise |\n| **Storage Queue** | File simple, tres economique, tres gros volumes | Decoupling basique, > 80 Go, sans fonctions avancees |\n| **Event Grid** | **Evenements reactifs** (publication-abonnement, push) | Notification \"il s'est passe quelque chose\" (ex. blob cree) |\n| **Event Hubs** | **Flux de telemetrie** a haut debit, rejouable, partitions | Ingestion massive de logs/IoT/analytique |\n\nMnemonique : **Service Bus** = commandes (ne pas perdre un message) ; **Event Grid** = reaction aux evenements ; **Event Hubs** = streaming/big data.\n\n| Service | Role |\n|---------|------|\n| **API Management** | Passerelle d'API : auth (OAuth/JWT), **throttling**, cache, transformation, versioning, portail developpeur |\n| **Logic Apps / Durable Functions** | Orchestration de workflows |\n| **Azure Cache for Redis** | Cache, sessions : reduit la charge de la base |\n| **Azure CDN / Front Door** | Contenu statique en peripherie |\n| **Azure SignalR / Web PubSub** | Temps reel |\n\n**Patterns** : decouplage asynchrone, CQRS, event sourcing, **Cache-aside**, **Circuit breaker**, **Retry**, **Bulkhead**, **Queue-based load leveling**, **Strangler fig** (migration progressive), **Competing consumers**, Sidecar.\n\n**Architectures** : N-tier, microservices, event-driven, Web-Queue-Worker, Big data, ML.\n\n### 5.4 Migration\n\nCadre : **Cloud Adoption Framework** -> *Strategy -> Plan -> Ready -> Migrate/Innovate -> Govern -> Secure -> Manage*.\n\n**Les 5 R de la migration** :\n\n| Strategie | Description |\n|-----------|-------------|\n| **Rehost** (lift-and-shift) | Meme application sur des VM Azure : rapide, peu de changement |\n| **Refactor / Repackage** | Modifications mineures vers du PaaS (ex. SQL Server -> SQL MI, app -> App Service) |\n| **Rearchitect** | Reconcevoir (monolithe -> microservices) |\n| **Rebuild** | Reecrire cloud-native |\n| **Replace** | Remplacer par du SaaS |\n\nOutils :\n\n| Besoin | Outil |\n|--------|-------|\n| Decouverte, evaluation, migration de serveurs/VM/bases/webapps | **Azure Migrate** |\n| Replication de VM | Azure Migrate : Server Migration (ou ASR) |\n| Migration de bases (online/offline) | **Azure Database Migration Service** |\n| Migration d'applications web .NET/Java | **App Service Migration Assistant** |\n| Grands volumes hors ligne | **Azure Data Box** |\n| Estimation des couts | **Azure Pricing Calculator / TCO Calculator** |\n| Gerer on-prem/multi-cloud depuis Azure | **Azure Arc** |\n\n### 5.5 Hybride et multi-cloud\n\n- **Azure Arc** : projette serveurs, clusters Kubernetes, bases (SQL MI, PostgreSQL) hors Azure dans Azure Resource Manager ; Policy, RBAC, Defender, Monitor applicables.\n- **Azure Stack HCI / Azure Local** : infrastructure hyperconvergee on-prem geree avec Azure.\n- **Azure Stack Hub** : cloud Azure complet on-prem (deconnecte).\n- **Azure Stack Edge** : materiel edge avec calcul/IA.\n\n### 5.6 Automatisation et DevOps\n\n- **IaC** : **Bicep** (recommande), ARM templates, Terraform ; **Template Specs**, **Deployment Stacks**.\n- **Azure DevOps / GitHub Actions** : CI/CD ; **Azure Automation** (runbooks, Update Manager), **Azure Policy Guest Configuration**.\n- **Deployment slots** et **Traffic Manager/Front Door** pour livraisons progressives.\n\n---\n\n## 6. Well-Architected Framework et optimisation des couts\n\n### Les 5 piliers Azure WAF\n\n| Pilier | Idee cle |\n|--------|----------|\n| **Fiabilite** | Resilience, HA, DR, tests de panne |\n| **Securite** | Confidentialite, integrite, disponibilite ; Zero Trust |\n| **Optimisation des couts** | Valeur maximale, supprimer le gaspillage |\n| **Excellence operationnelle** | Automatisation, observabilite, DevOps |\n| **Efficacite des performances** | Scalabilite, charge, optimisation |\n\nOutils : **Azure Advisor** (recommandations sur les 5 piliers), **WAF Assessment**, **Azure Architecture Center**, **Defender for Cloud**.\n\n### Optimisation des couts\n\n| Levier | Detail |\n|--------|--------|\n| **Reservations** (1 ou 3 ans) | Engagement sur une ressource precise, jusqu'a ~72 % d'economie |\n| **Savings Plan for Compute** | Engagement de depense horaire flexible (VM, App Service premium, Functions premium, conteneurs) |\n| **Spot VMs** | Capacite excedentaire, tres bon marche, eviction possible (batch, tolerant) |\n| **Azure Hybrid Benefit** | Reutiliser les licences Windows Server / SQL Server avec Software Assurance (jusqu'a ~40-85 %) |\n| **Dev/Test pricing** | Tarifs reduits pour les abonnements dev/test |\n| **Autoscale + arret programme** | Eteindre hors horaires (Automation, DevTest Labs) |\n| **Right-sizing** | Recommandations d'Advisor |\n| **Stockage** | Tiering (Cool/Cold/Archive), lifecycle, reservations de capacite |\n| **Serverless** | Functions, Container Apps, SQL serverless, Cosmos serverless |\n| **Tags + budgets + alertes** | Responsabilisation (FinOps) |\n\n---\n\n## 7. Tableaux de decision (aide-memoire)\n\n### Identite et securite\n| Exigence | Solution |\n|----------|----------|\n| Partenaires externes accedent a une app | Entra B2B |\n| Clients grand public s'inscrivent (social login) | Entra External ID (B2C) |\n| Admins en acces juste-a-temps | PIM |\n| MFA hors reseau d'entreprise | Conditional Access |\n| App sur VM accede a Key Vault sans secret | Managed identity |\n| Cles HSM dedie mono-locataire | Managed HSM |\n| Revue periodique des acces | Access reviews |\n| Imposer regions et tags | Azure Policy (Deny / Modify) |\n| Empecher la suppression accidentelle | Resource lock |\n| Acces RDP/SSH sans IP publique | Azure Bastion |\n| Meme politique sur serveurs on-prem | Azure Arc + Policy |\n\n### Donnees\n| Exigence | Solution |\n|----------|----------|\n| Migration SQL Server a changements minimaux | SQL Managed Instance |\n| Charge SQL intermittente, pause auto | SQL Database serverless |\n| Beaucoup de petites bases, pics decales | Pool elastique |\n| BD > 4 To, croissance rapide, scaling | Hyperscale |\n| Ecritures locales dans plusieurs regions, < 10 ms | Cosmos DB multi-region writes |\n| Coherence \"lire ce que j'ai ecrit\" | Cosmos DB Session |\n| Archiver 7 ans, non modifiable | Blob immutable (WORM) + Archive tier |\n| Survivre a une panne de zone ET lire la region secondaire | RA-GZRS |\n| 200 To a transferer, reseau lent | Azure Data Box |\n| Ingerer des millions d'evenements/s | Event Hubs |\n\n### Continuite\n| Exigence | Solution |\n|----------|----------|\n| DR de VM d'une region a l'autre | Azure Site Recovery |\n| Survivre a la panne d'un datacenter | Availability Zones |\n| Ransomware sur les sauvegardes | Immutable vault + soft delete + Resource Guard |\n| Bascule HTTP globale avec WAF | Front Door |\n| Bascule DNS tout protocole | Traffic Manager |\n| LB L7 regional avec WAF | Application Gateway |\n| LB L4 regional | Load Balancer |\n| Bascule BD en groupe | Auto-failover group |\n\n### Infrastructure\n| Exigence | Solution |\n|----------|----------|\n| Microservices conteneurises sans Kubernetes, scale-to-zero | Container Apps |\n| Kubernetes complet | AKS |\n| App web simple, slots | App Service |\n| Code evenementiel court | Functions |\n| Messages ordonnes, fiables, topics | Service Bus |\n| Reaction a \"blob cree\" | Event Grid |\n| Exposer des API avec quotas/throttling | API Management |\n| Acces prive depuis le on-prem a un PaaS | Private Endpoint |\n| Beaucoup de branches, transit manage | Virtual WAN |\n| Lien prive dedie vers Azure | ExpressRoute (+ VPN de secours) |\n| Hub centralise, filtrage spoke-a-spoke | Hub-and-spoke + Azure Firewall + UDR |\n| Evaluer/migrer des VM | Azure Migrate |\n| Reduire le cout d'une charge stable | Reservation / Savings Plan + Hybrid Benefit |\n\n---\n\n## 8. Conseils pour l'examen\n\n1. **Lisez toutes les exigences** : une seule contrainte (ex. \"sans modifier le code\", \"dans le meme pays\", \"cout minimal\") elimine souvent 3 options.\n2. **PaaS > IaaS** a exigences egales (moins d'exploitation). IaaS seulement si acces OS/logiciel specifique.\n3. **Managed identity** quand il faut eviter les secrets.\n4. **Private Endpoint** est plus securise que Service Endpoint.\n5. **Front Door** = HTTP global ; **Traffic Manager** = DNS ; **App Gateway** = L7 regional ; **Load Balancer** = L4.\n6. **Zones = HA dans une region** ; **region jumelee/ASR = DR**.\n7. **SQL MI** = migration quasi sans changement ; **SQL DB** = nouvelle app ; **SQL sur VM** = besoin d'OS.\n8. **Service Bus / Event Grid / Event Hubs / Storage Queue** : memorisez la difference.\n9. **Policy** (ce qui est autorise) **vs RBAC** (qui peut agir).\n10. Etudes de cas : lisez d'abord **les questions**, puis parcourez le scenario pour retrouver les infos.\n11. Pour les calculs de SLA : serie = multiplication ; parallele = `1 - (1-A)(1-B)`.\n12. Pratiquez avec le **Practice Assessment** gratuit de Microsoft Learn et l'**Exam Sandbox**.\n13. Les noms de produits evoluent (Azure AD -> Entra ID, B2C -> External ID, Blueprints -> Template Specs/Deployment Stacks) : revoyez les notes de mise a jour de l'examen.\n"}, {"track": "az", "doc": "Approfondissement", "md": "# AZ-305 - Approfondissement (theorie et competences d'architecte)\n\nA lire **apres** le [cours](README.md). Ce document donne les **criteres de decision** et les **mecanismes** que l'examen teste dans les scenarios difficiles.\nChaque section se termine par **\"Savoir-faire\"**.\n\n## Sommaire\n1. [Identite : conception de bout en bout](#1-identite--conception-de-bout-en-bout)\n2. [Gouvernance et landing zone](#2-gouvernance-et-landing-zone)\n3. [Supervision : conception de Log Analytics et alertes](#3-supervision)\n4. [Reseau : conception detaillee](#4-reseau--conception-detaillee)\n5. [Donnees : choix et dimensionnement](#5-donnees--choix-et-dimensionnement)\n6. [Continuite : calculs et conception DR](#6-continuite--calculs-et-conception-dr)\n7. [Calcul et applications : arbres de decision](#7-calcul-et-applications--arbres-de-decision)\n8. [Migration](#8-migration)\n9. [Cout et Well-Architected](#9-cout-et-well-architected)\n10. [Infrastructure as Code pour AZ-305](#10-infrastructure-as-code-pour-az-305)\n11. [Etudes de cas completes](#11-etudes-de-cas-completes)\n\n---\n\n## 1. Identite : conception de bout en bout\n\n### 1.1 Tenants et abonnements\n\n| Decision | Recommandation |\n|----------|----------------|\n| **Un tenant ou plusieurs ?** | **Un seul** tenant de production par organisation (sauf separation legale/acquisition/isolation forte). Un tenant de test/sandbox separe est courant. |\n| **Multi-tenant (partenaires, MSP)** | **Azure Lighthouse** : gestion delegue multi-tenant sans comptes invites |\n| **Rattachement d'abonnement** | Un abonnement est lie a **un seul** tenant ; peut etre **transfere** entre tenants (perte des RBAC/identites manages) |\n\n### 1.2 Conditional Access : conception de politiques\n\nEnsemble de base recommande :\n1. **Exiger le MFA pour tous les administrateurs** (roles privilegies).\n2. **Exiger le MFA pour tous les utilisateurs** (au moins hors reseaux de confiance).\n3. **Bloquer l'authentification heritee** (legacy auth : IMAP/POP/SMTP basiques).\n4. **Exiger un appareil conforme / joint** pour les applications sensibles.\n5. **Exiger un MFA resistant au phishing** (FIDO2, Windows Hello, passkeys) pour les administrateurs.\n6. **Bloquer / contraindre selon le risque** (Identity Protection : risque de connexion/utilisateur) — licence P2.\n7. **Comptes d'urgence (break-glass)** : 2 comptes cloud-only, **exclus** des politiques CA (ou protegees par un MFA resistant au phishing dedie), mots de passe longs stockes hors ligne, **alertes** sur toute connexion.\n\nNotions :\n- **Report-only** : evaluer l'impact d'une politique avant de l'activer.\n- **Named locations**, **filtres d'appareils**, **sessions** (frequence de connexion, persistance), **authentication strengths**.\n- Les politiques CA s'appliquent **apres** l'authentification primaire.\n- **Security Defaults** : base gratuite (MFA pour tous), incompatible avec CA personnalise.\n\n### 1.3 PIM : parametres a connaitre\n\n| Parametre | Detail |\n|-----------|--------|\n| **Eligible vs actif** | Eligible = doit activer ; actif = droits en permanence (a eviter) |\n| **Duree d'activation maximale** | Heures (ex. 2-8 h) |\n| **Exiger** | MFA, justification, **approbation**, ticket |\n| **Alertes** | Roles non utilises, activations trop frequentes |\n| **Access reviews PIM** | Revue periodique des affectations eligibles |\n| **Portee** | Roles **Entra** et roles **Azure RBAC** (groupes PIM pour regrouper) |\n\n### 1.4 Hybride : choisir\n\n| Contrainte | Choix |\n|------------|-------|\n| Simplicite + resilience | **Password Hash Sync + Seamless SSO** |\n| \"Les mots de passe ne doivent pas etre stockes (meme hashes) dans le cloud\" | **Pass-through Auth** (agents on-prem, minimum 2-3 pour HA) |\n| Cartes a puce, MFA tiers, politiques de connexion AD FS | **Federation (AD FS)** — a eviter si possible (maintenance) |\n| Plusieurs forets **deconnectees**, deploiement leger | **Cloud Sync** |\n| Besoin d'un domaine pour applications legacy (LDAP/Kerberos) sans DC | **Entra Domain Services** |\n\nPHS **en plus** de PTA/federation sert de **secours** (bascule en cas de panne du on-prem).\n\n### 1.5 Identites d'application\n\n- **App registration** (definition globale de l'application) vs **Enterprise application / service principal** (instance dans un tenant, ou on assigne utilisateurs, consentement, SSO).\n- **Consentement** : utilisateur vs administrateur ; limiter le consentement utilisateur aux editeurs verifies.\n- **Managed identity** : le plus sur ; pas de secret ; attribuee a une ressource Azure (**system** ou **user-assigned**).\n- **Workload identity federation** (federated credentials) : GitHub/AKS/autres IdP -> pas de secret.\n- Si secret inevitable : **certificat > secret**, expiration courte, stockage dans **Key Vault**, **rotation** automatique.\n\n### 1.6 Key Vault : conception\n\n- **Un coffre par application et par environnement** (limite du rayon d'impact, RBAC distinct) ; pas de coffre unique geant.\n- **RBAC Azure** (recommande) plutot que les access policies.\n- **Soft delete + purge protection** obligatoires pour les cles de chiffrement (CMK).\n- **Reseau** : Private Endpoint + pare-feu ; \"Allow trusted Microsoft services\" selon besoin.\n- **Rotation et expiration**, evenements Event Grid `SecretNearExpiry`.\n- Hierarchie de chiffrement : **Key Encryption Key (KEK)** dans Key Vault chiffre la **Data Encryption Key (DEK)** utilisee par le service (envelope encryption).\n\n**Savoir-faire** : concevoir l'acces d'une application Azure a Key Vault sans secret ; choisir PHS/PTA/federation selon des contraintes ; definir 5 politiques CA de base ; expliquer l'interet d'un compte break-glass.\n\n---\n\n## 2. Gouvernance et landing zone\n\n### 2.1 Azure Landing Zone (CAF)\n\nPrincipes de conception :\n- **Separation** plateforme / workloads ; **abonnement = unite de mise a l'echelle** (quotas, facturation, isolation).\n- **Hierarchie de management groups** modeste (3-4 niveaux) ; politiques **heritees**.\n- **Subscription vending** : creation automatisee d'abonnements pre-configures.\n- **Hub-spoke ou Virtual WAN** pour la connectivite ; **identite centralisee**.\n- **Politiques en \"guardrails\"** (Deny/Audit/DeployIfNotExists) plutot que revues manuelles.\n\n### 2.2 Azure Policy : effets et ordre\n\n| Effet | Action | Cas d'usage |\n|-------|--------|-------------|\n| `Deny` | Bloque la creation/modification non conforme | Regions interdites, SKU interdits |\n| `Audit` / `AuditIfNotExists` | Marque non conforme sans bloquer | Evaluer avant d'imposer |\n| `Append` | Ajoute des champs a la demande | Anciennement tags/regles IP |\n| `Modify` | Ajoute/modifie des proprietes (tags...) ; **necessite une identite manage** pour la remediation | Heritage de tags |\n| `DeployIfNotExists` | Deploie une ressource associee si absente ; **identite manage** | Activer diagnostics, agent, Defender |\n| `Disabled` | Desactive la regle | Tests |\n| `DenyAction` | Bloque une action (ex. suppression) | Proteger contre `DELETE` |\n\nOrdre d'evaluation : `Disabled` -> `Append`/`Modify` -> `Deny` -> `Audit`.\n- **Initiative** (policy set) : regroupe des regles, une seule assignation.\n- **Exemptions** : pour des exceptions **documentees et datees** (waiver / mitigated).\n- **Remediation tasks** : corrigent les ressources **existantes** (la politique ne s'applique qu'aux nouvelles/modifiees sinon).\n- Politique != RBAC : un utilisateur **Owner** est quand meme bloque par un `Deny`.\n\n### 2.3 Gouvernance des couts et des acces\n\n- **Tags** obligatoires + Policy pour heritage ; **budgets** a differents niveaux ; **Cost Management exports**.\n- **RBAC** : donner les roles a des **groupes**, a la portee la plus basse ; **roles personnalises** si necessaire (JSON `Actions`/`NotActions`/`DataActions`).\n- **Deny assignments** (non creables directement hors Blueprints/Managed Apps/Deployment Stacks).\n- **Resource locks** protegent contre l'**action** de suppression/modification, y compris pour les Owners (il faut retirer le verrou).\n\n**Savoir-faire** : dessiner une hierarchie MG pour une entreprise avec filiales et environnements ; choisir l'effet de policy adapte ; expliquer pourquoi `DeployIfNotExists` necessite une managed identity.\n\n---\n\n## 3. Supervision\n\n### 3.1 Conception des espaces de travail Log Analytics\n\n| Critere | Un seul workspace | Plusieurs workspaces |\n|---------|-------------------|----------------------|\n| Correlation / requetes croisees | **Simple** | Requetes cross-workspace (plus lourd) |\n| Cout | Tarifs par **engagement** (commitment tiers) plus avantageux | Moins d'effet d'echelle |\n| Residence des donnees | Une region | **Un workspace par region/juridiction** |\n| Isolation des droits | RBAC par table / ressource-context | Isolation stricte |\n| Facturation separee | Via tags/Workbooks | Natif |\n\nModes d'acces : **workspace-context** (acces au workspace entier) vs **resource-context** (acces uniquement aux logs des ressources sur lesquelles on a RBAC).\nNiveaux de tables : **Analytics** (requetes completes, alertes), **Basic** (moins cher, requetes limitees, retention courte), **Auxiliary** (stockage tres bon marche, audit/conformite). **Archive** pour longue conservation (jusqu'a 12 ans).\n\n### 3.2 Alertes et reponse\n\n| Type | Latence | Usage |\n|------|---------|-------|\n| **Metrique** | ~1 min | Seuil sur CPU, disque ; **dynamique** (apprentissage) |\n| **Log (KQL)** | Quelques minutes | Requetes complexes, correlations |\n| **Activity log** | Evenements de plan de controle | Suppression de ressource, changement de politique |\n| **Service Health** | Incidents Azure | Impact regional |\n\n**Action groups** : email/SMS/voix, webhook, **Logic App**, **Function**, ITSM ; reutilisables. **Alert processing rules** : suppression pendant maintenance.\n\nKQL a savoir lire :\n```kusto\n// Taux d'erreurs HTTP 5xx par 5 minutes\nAppRequests\n| where TimeGenerated > ago(1h)\n| summarize total = count(), erreurs = countif(toint(ResultCode) >= 500) by bin(TimeGenerated, 5m)\n| extend taux = todouble(erreurs) / total\n| where taux > 0.05\n```\n\n### 3.3 Collecte moderne\n\n- **Azure Monitor Agent (AMA)** + **Data Collection Rules (DCR)** : remplacent Log Analytics agent (MMA, retire) ; filtrage/transformation a la source (reduction de cout).\n- **Diagnostic settings** par ressource -> Log Analytics / Storage (archive bon marche) / Event Hubs (SIEM tiers).\n- **Microsoft Sentinel** : SIEM/SOAR sur Log Analytics ; connecteurs, regles analytiques, playbooks (Logic Apps).\n\n**Savoir-faire** : choisir 1 vs N workspaces ; ecrire une alerte log simple ; expliquer comment reduire le cout de logs (DCR, tiers de tables, retention).\n\n---\n\n## 4. Reseau : conception detaillee\n\n### 4.1 Plan d'adressage\n\n- Plages **RFC 1918** non chevauchantes (VNets, on-prem, autres clouds).\n- Prevoir la croissance : un VNet `/16` par spoke est courant ; sous-reseaux dedies : `GatewaySubnet` (/27 minimum recommande), `AzureFirewallSubnet` (/26), `AzureBastionSubnet` (/26), sous-reseau de **Private Endpoints**.\n- Azure reserve **5 adresses** par sous-reseau (x.x.x.0-3 et la derniere).\n\n### 4.2 Peering et transit\n\n| Fonction | Detail |\n|----------|--------|\n| **VNet peering** | Faible latence, backbone Microsoft ; **non transitif** ; peut etre **global** (inter-regions) |\n| **Gateway transit** | Un spoke peut utiliser la **gateway VPN/ER du hub** (`allow gateway transit` + `use remote gateways`) |\n| **Forwarded traffic** | A autoriser pour qu'un NVA/Firewall du hub relaie |\n| **UDR (User Defined Routes)** | Forcer le trafic via le pare-feu ; route `0.0.0.0/0` -> Firewall pour l'**egress** central |\n| **BGP / route propagation** | Routes dynamiques depuis VPN/ER ; desactiver la propagation sur un sous-reseau pour forcer les UDR |\n\n**Virtual WAN vs hub-spoke manuel**\n\n| | Hub-spoke manuel | Virtual WAN |\n|---|------------------|-------------|\n| Administration | Vous gerez routage/peerings | **Manage** (routage automatique, transit) |\n| Echelle | Dizaines de spokes | Centaines de branches/VNets |\n| Flexibilite | Maximale (NVA custom) | Moindre, mais integrations (NVA partenaires, SD-WAN) |\n| Quand ? | Peu de sites, besoins specifiques | **Beaucoup de branches**, minimiser l'exploitation |\n\n### 4.3 Connectivite hybride\n\n| Solution | Debit | Latence | Cout | Remarques |\n|----------|-------|---------|------|-----------|\n| **VPN S2S** | Jusqu'a ~10 Gb/s agrege par gateway (selon SKU) | Variable (Internet) | Faible | IPsec ; **active-active** + **zone-redundant** pour HA |\n| **ExpressRoute** | 50 Mb/s - 10 Gb/s (circuit), jusqu'a 100 Gb/s (Direct) | Faible, previsible | Eleve | **Prive** (hors Internet) ; **2 connexions** redondantes par circuit ; **Premium** = geo-etendu / plus de routes |\n| **ER + VPN secours** | | | | **Resilience** maximale |\n| **Global Reach** | | | | Relie des sites on-prem entre eux via Microsoft |\n| **FastPath** | | | | Contourne la gateway pour reduire la latence |\n\nPeering ExpressRoute : **prive** (VNets), **Microsoft** (Microsoft 365, services PaaS publics).\nResilience : circuits dans **plusieurs emplacements de peering** pour survivre a la perte d'un site.\n\n### 4.4 Services de protection et de distribution\n\n| Besoin | Service |\n|--------|---------|\n| L3/L4 par sous-reseau/NIC | **NSG** (stateful) |\n| FQDN/URL, IDPS, TLS inspection, egress central | **Azure Firewall** (Standard/Premium) |\n| WAF OWASP | **WAF** sur Application Gateway ou Front Door |\n| DDoS reseau | **DDoS Protection** (SKU Network/IP) |\n| Acces admin sans IP publique | **Bastion** |\n| NAT sortant evolutif (SNAT) | **NAT Gateway** (evite l'epuisement des ports SNAT) |\n| DNS hybride | **DNS Private Resolver** (inbound/outbound endpoints) |\n| Resolution privee des PaaS | **Private DNS zones** (`privatelink.*`) liees aux VNets |\n\n### 4.5 Load balancing : tableau definitif\n\n| Service | OSI | Portee | WAF | Protocoles | Choisir quand |\n|---------|-----|--------|-----|------------|---------------|\n| **Load Balancer** (Standard) | L4 | Regional (zone-redundant) | Non | TCP/UDP | Trafic non HTTP, performances ; **cross-region LB** pour L4 global |\n| **Application Gateway v2** | L7 | Regional (zones) | **Oui** | HTTP/S, HTTP/2, WebSocket | Routage par URL/hote, TLS, WAF en region |\n| **Front Door** | L7 | **Global** | **Oui** | HTTP/S | Acceleration, multi-region, cache, WAF global |\n| **Traffic Manager** | DNS | Global | Non | **Tout** | Bascule DNS, non-HTTP, simple et economique |\n\n### 4.6 Private Link : pieges\n\n- Private Endpoint = **interface reseau + IP privee** vers **une** ressource/sous-ressource (ex. `blob`, `file` sont des endpoints distincts).\n- **DNS** : sans zone `privatelink.*` liee au VNet (et aux resolveurs on-prem via **forwarders/Private Resolver**), le nom resout vers l'IP **publique** -> echec quand l'acces public est coupe.\n- **NSG/UDR** sur sous-reseau de PE : support a activer (`PrivateEndpointNetworkPolicies`).\n- **Service Endpoint** : route optimisee, IP source privee visible par le service, **pas** d'acces on-prem, ressource accessible **publiquement** malgre tout.\n- **Private Link Service** : exposer **votre** service derriere un Standard LB a d'autres VNets/tenants.\n\n**Savoir-faire** : dessiner un hub-spoke avec pare-feu, gateway et DNS prive ; expliquer pourquoi un PE ne marche pas depuis le on-prem (DNS) ; choisir le bon LB en 10 secondes.\n\n---\n\n## 5. Donnees : choix et dimensionnement\n\n### 5.1 Azure SQL : decision approfondie\n\n| Question | Si oui |\n|----------|--------|\n| Besoin d'**SQL Agent**, requetes **inter-bases**, CLR, Service Broker, DB Mail, **migration quasi sans changement** | **SQL Managed Instance** |\n| Acces a l'**OS**, version non supportee, SSRS/SSIS/SSAS **sur la meme machine**, logiciel tiers installe | **SQL Server sur VM** |\n| Nouvelle application, base unique, **moins d'administration** | **SQL Database** |\n| Charge **intermittente** imprevisible | **Serverless** (pause auto) |\n| **Nombreuses bases** a pics decales | **Pool elastique** |\n| **> 4 To** a ~100 To, restauration rapide, scale-out lecture | **Hyperscale** |\n| Latence minimale, replicas de lecture integres, IO fort | **Business Critical** |\n| **DR** multi-region d'un ensemble de bases | **Auto-failover group** |\n\nDTU vs vCore : **vCore** pour flexibilite, **Hybrid Benefit** et **reservations** ; DTU pour simplicite.\nSauvegardes : **PITR** (par defaut 7 j, jusqu'a 35 j), **LTR** (jusqu'a 10 ans), redondance du stockage de sauvegarde (LRS/ZRS/GRS).\n\n### 5.2 Cosmos DB : RU et partitionnement\n\n- **RU/s** : unite de debit (lecture 1 Ko par cle = ~1 RU ; ecriture de 1 Ko ~ 5 RU, ordres de grandeur).\n- **Provisionne manuel**, **autoscale** (10 % a 100 % du max), **serverless** (charges faibles/intermittentes, limites).\n- **Partition key** : forte cardinalite, repartition uniforme, presente dans les requetes principales ; **hot partition** = goulot ; partition logique max 20 Go.\n- **Multi-region writes** : resolution de conflits (LWW par defaut) ; latence locale.\n- **Change feed** : flux d'evenements -> Functions/pipelines (event sourcing, materialisation).\n- **Choisir le niveau de coherence** : Strong (finance, **cout** latence/dispo ; pas avec multi-region writes), **Session** (defaut, apps utilisateur), **Eventual** (compteurs, flux non critiques).\n- API : NoSQL (natif, recommande pour nouvelle app), **MongoDB/Cassandra** (compatibilite de migration), Gremlin (graphe), Table.\n\n### 5.3 Stockage : options de performance\n\n| Besoin | Option |\n|--------|--------|\n| Blobs a forte transaction/faible latence | **Premium block blob** |\n| Partages de fichiers SMB, profils | **Azure Files Premium** (SSD) |\n| NFS/SMB tres performant, SAP HANA, HPC, Oracle | **Azure NetApp Files** (niveaux Standard/Premium/Ultra) |\n| Disques VM | Premium SSD (production), **Premium SSD v2** (IOPS/debit reglables), **Ultra Disk** (sub-ms) ; **bursting** pour pics |\n| Donnees chaudes -> froides | **Lifecycle management** (Hot -> Cool -> Cold -> Archive) |\n\n### 5.4 Analytique et ingestion\n\n```\nSources -> [Event Hubs / IoT Hub] -> [Stream Analytics / Spark Streaming] -> hot path (alertes, dashboards)\n                         \\-> [Capture] -> [ADLS Gen2] -> [Synapse / Fabric / Databricks] -> cold path (BI)\nBatch / ETL : [Data Factory] -> ADLS Gen2 -> transformation -> entrepot (Synapse/Fabric) -> Power BI\n```\n\n- **IoT Hub** (bidirectionnel, gestion d'appareils) vs **Event Hubs** (ingestion pure, debit).\n- **Medallion** : bronze (brut) -> silver (nettoye) -> gold (agrege).\n- **Purview** : catalogue, lineage, classification.\n\n**Savoir-faire** : justifier un choix SQL en 3 contraintes ; choisir une partition key Cosmos ; dessiner un pipeline IoT hot/cold path.\n\n---\n\n## 6. Continuite : calculs et conception DR\n\n### 6.1 SLA composites : exercices\n\n**Serie** : `A x B x C`.\n- Front Door (99,99 %) -> App Service (99,95 %) -> SQL (99,99 %) :\n  `0,9999 x 0,9995 x 0,9999 = 0,99930` -> **99,93 %**.\n\n**Parallele (deux regions actives)** : `1 - (1-A)(1-B)`.\n- Chaque region = App Service x SQL = 99,94 % (`0,9994`).\n- Deux regions : `1 - (0,0006)^2 = 1 - 0,00000036 = 99,999964 %`.\n- Mais il faut inclure le **routeur global** (Front Door 99,99 %) en serie :\n  `0,9999 x 0,99999964 ~ 99,99 %`. Le **point commun** (Front Door) devient le plafond !\n- Lecon : la redondance n'ameliore pas **au-dela** du composant unique partage.\n\n**Conversion temps** : 99,9 % = 8,76 h/an ; 99,95 % = 4,38 h ; 99,99 % = 52,6 min ; 99,999 % = 5,26 min.\n\n### 6.2 Disponibilite dans une region\n\n| Mecanisme | Protege de | Notes |\n|-----------|-----------|-------|\n| **Availability Zones** | Panne d'un datacenter | Zonal (epingle) vs zone-redundant (automatique) ; latence inter-zones < 2 ms environ |\n| **Availability Set** | Rack/maintenance | Domaines de panne (FD) / de mise a jour (UD) ; non disponible avec zones |\n| **VMSS flexible** | Repartition zones/FD | Autoscale |\n| **Redondance de zone** services PaaS | Zone | App Service (plan zone-redundant), SQL, Storage ZRS, AKS (zones), Application Gateway v2, LB Standard |\n\n### 6.3 Reprise regionale (DR)\n\n| Strategie | RTO | RPO | Cout |\n|-----------|-----|-----|------|\n| **Backup/restore** | Heures-jours | Heures | $ |\n| **Pilot light** | Dizaines de minutes | Minutes | $$ |\n| **Warm standby** | Minutes | Minutes/secondes | $$$ |\n| **Actif-actif** | ~0 | ~0-secondes | $$$$ |\n\n- **ASR** : replication **asynchrone** de VM (RPO de l'ordre de la minute), **plans de reprise** (ordre de demarrage, scripts), **test de failover** non destructif, retour (failback).\n- **Regions jumelees** : mises a jour sequencees, priorite de restauration en cas de panne regionale, GRS replique vers la region jumelee. Toutes les regions n'ont pas de jumelle (certaines **zones de disponibilite** suffisent).\n- **Data** : SQL FG (RPO ~ secondes), Cosmos multi-region, Storage GRS/GZRS (**RPO ~15 min non garanti**), Backup cross-region restore.\n- **Tests** : failover reguliers ; **Azure Chaos Studio** (injection de pannes) ; **Load Testing**.\n- **App Service multi-region** : deux plans + Front Door ; configuration et secrets reproduits ; base de donnees geo-repliquee.\n- **AKS multi-region** : deux clusters + Front Door/Traffic Manager + GitOps ; donnees via services geo-repliques.\n\n### 6.4 Sauvegarde : choix\n\n| Charge | Solution |\n|--------|----------|\n| VM Azure | Azure Backup (instantane + coffre) |\n| SQL dans une VM / SAP HANA | Azure Backup (agent workload) |\n| Azure SQL DB / MI | Sauvegardes automatiques (PITR/LTR) |\n| Blobs | Soft delete, versioning, PITR, **Backup vault** (operationnel/coffre) |\n| Azure Files | Azure Backup (instantanes) |\n| Serveurs on-prem | MARS (fichiers), **MABS/DPM** (workloads) |\n| Disques / AKS / PostgreSQL | **Backup vault** |\n\n**Securite des sauvegardes** : soft delete (14 j+), **immutable vault**, **MUA via Resource Guard**, chiffrement CMK, isolation (**abonnement separe** pour les coffres de sauvegarde critiques), alertes sur suppressions.\n\n**Savoir-faire** : calculer un SLA composite (serie/parallele avec point commun) ; choisir DR selon RTO/RPO/cout ; concevoir un backup resistant au ransomware.\n\n---\n\n## 7. Calcul et applications : arbres de decision\n\n### 7.1 Choisir le calcul\n\n```\nBesoin de controle OS / logiciel legacy / drivers ?\n  |-- Oui -> Virtual Machines (+ VMSS pour la mise a l'echelle)\n  |-- Non -> Conteneurs ?\n        |-- Oui -> Besoin de l'API Kubernetes / ecosysteme / controle fin ?\n        |         |-- Oui -> AKS\n        |         |-- Non -> Microservices/HTTP/evenements, scale-to-zero ? -> Container Apps\n        |                    Tache courte isolee ? -> Container Instances\n        |-- Non -> Application web/API ? -> App Service\n                   Code evenementiel court ? -> Functions\n                   Workflow d'integration low-code ? -> Logic Apps\n                   Calcul par lots / HPC ? -> Batch\n```\n\n**Functions : plans**\n\n| Plan | Mise a l'echelle | Cold start | VNet | Limite de duree | Facturation |\n|------|------------------|-----------|------|-----------------|-------------|\n| **Consumption** | A zero, auto | Oui | Limite | ~5-10 min | A l'execution |\n| **Flex Consumption** | Auto, instances toujours pretes optionnelles | Reduit | Oui | Plus long | A l'usage |\n| **Premium** | Instances pre-chauffees | **Non** | **Oui** | Long | Instances reservees |\n| **Dedicated (App Service)** | Manuelle/auto | Non (Always On) | Oui | Illimitee | Plan App Service |\n\n**App Service** : slots de deploiement (swap sans interruption, **warm-up**), autoscale (regles/planification), **VNet integration** (sortie) + **Private Endpoint** (entree), **ASE v3** (isolation, VNet dedie, forte echelle).\n\n**AKS : decisions de conception**\n- **Reseau** : **Azure CNI** (IP VNet par pod ; planifier l'espace d'adressage) ; **CNI Overlay** (economise les IP) ; kubenet (simple, limites).\n- **Identite** : Entra ID + RBAC K8s ; **Workload Identity** pour les pods ; managed identity du cluster.\n- **Noeuds** : pools **system** vs **user**, zones, autoscaler, **spot pools**, pools GPU.\n- **Mises a jour** : canaux d'upgrade, fenetres de maintenance, surge.\n- **Securite** : cluster prive, Azure Policy for K8s, Defender for Containers, Key Vault CSI driver, ACR + scan.\n- **Ingress** : App Gateway for Containers / AGIC / NGINX ; **WAF**.\n- **Observabilite** : Container Insights, Managed Prometheus + Grafana.\n\n**Container Apps vs AKS**\n\n| | Container Apps | AKS |\n|---|----------------|-----|\n| Complexite | Faible (pas d'API K8s) | Elevee |\n| Scale-to-zero | Oui (KEDA) | Possible (KEDA) mais a configurer |\n| Controle (CRD, operateurs, service mesh complet) | Limite | **Total** |\n| Dapr / evenements | Integre | Add-on |\n| Quand | Microservices standard, equipes sans K8s | Plateforme K8s, besoins avances |\n\n### 7.2 Messagerie : decision\n\n| Question | Service |\n|----------|---------|\n| Message critique, **ordre FIFO**, transactions, dead-letter, **topics/abonnements avec filtres**, planification | **Service Bus** (Premium pour isolation/VNet/gros messages) |\n| File simple, tres gros volume, cout minimal, > 80 Go de file | **Storage Queue** |\n| **Reaction** a un evenement Azure/SaaS (push, filtrage, fan-out) | **Event Grid** |\n| **Flux** haut debit, telemetrie, replay, partitions, Kafka | **Event Hubs** |\n| Appareils IoT bidirectionnels | **IoT Hub** |\n\nPatterns : **Competing consumers**, **Queue-based load leveling**, **Priority queue**, **Claim check** (message = reference, donnees dans Blob), **Saga** (transactions distribuees), **Outbox**.\n\n### 7.3 API et integration\n\n- **API Management** : tiers (Consumption, Developer, Basic, Standard, Premium) ; **Premium** = multi-region, VNet, zones ; politiques (rate-limit, validate-jwt, cache, transform) ; **self-hosted gateway** (on-prem/multi-cloud).\n- **Logic Apps** : connecteurs, workflows declaratifs (Consumption vs Standard) ; **Durable Functions** : orchestration en code (fan-out/fan-in, human interaction).\n- **Front Door/CDN** : cache statique et acceleration.\n\n**Savoir-faire** : parcourir l'arbre de decision calcul en 30 s ; choisir Service Bus/Event Grid/Event Hubs ; expliquer les plans Functions.\n\n---\n\n## 8. Migration\n\n### 8.1 Demarche (CAF)\n\n1. **Decouvrir** (Azure Migrate : appliance, dependances).\n2. **Evaluer** (compatibilite, dimensionnement, **cout** TCO, **readiness**).\n3. **Planifier** vagues (groupes d'applications, dependances).\n4. **Migrer** (replication, test de migration, cutover).\n5. **Optimiser** (right-sizing, reservations, PaaS).\n\n### 8.2 Choix de l'approche\n\n| Contrainte | Approche |\n|------------|----------|\n| Delai court, peu de changements | **Rehost** (lift-and-shift) |\n| Reduire l'exploitation sans reecriture | **Replatform/Refactor** (SQL MI, App Service) |\n| Modernisation profonde | **Rearchitect/Rebuild** |\n| Application SaaS equivalente | **Replace** |\n| Non migrable / reglementaire | **Hybride (Arc)** ou **retention on-prem** |\n\n**Migration de BD** : **online** (replication continue, **cutover** court) vs **offline** (arret) ; DMS ; **Data Migration Assistant** (compatibilite) ; **Log Replay Service / MI link** pour SQL MI.\n**Donnees massives** : **Data Box** (disque/Heavy), **AzCopy**, ExpressRoute ; **Data Box Gateway** (flux continu).\n**VMware** : **Azure VMware Solution** (migration sans changement) vs conversion en VM Azure (Azure Migrate).\n**Web apps** : **App Service Migration Assistant** / Azure Migrate web apps.\n\n**Savoir-faire** : proposer une strategie 5R pour un portefeuille ; choisir online/offline ; estimer l'utilite de Data Box.\n\n---\n\n## 9. Cout et Well-Architected\n\n### 9.1 Reservations vs Savings Plans\n\n| | Reservation | Savings Plan (compute) |\n|---|-------------|------------------------|\n| Engagement | Sur une **ressource precise** (taille/region) | Sur une **depense horaire** |\n| Flexibilite | Moindre (echange possible) | **Elevee** (famille, region, services) |\n| Remise | **Plus forte** sur la ressource ciblee | Un peu moindre |\n| Quand | Charge **stable et connue** | Charge **variable**, evolution des tailles/regions |\n\n**Spot** : eviction avec preavis ; **checkpoints** ; pools mixtes (spot + a la demande). **Hybrid Benefit** : licences Windows/SQL (+ RHEL/SUSE). **Dev/Test** : tarif reduit. **Arret/desallocation** : une VM arretee *non desallouee* est facturee.\n\n### 9.2 Piliers WAF : questions typiques\n\n| Pilier | Question |\n|--------|----------|\n| Fiabilite | Quelle est la **charge de travail critique** et son SLO ? Zones ? DR ? |\n| Securite | **Zero Trust** (verifier explicitement, moindre privilege, supposer la compromission) ? Identites, reseau, donnees |\n| Cout | Quelle est la **valeur** par euro ? Gaspillage ? Reservations ? |\n| Excellence op. | IaC ? CI/CD ? Observabilite ? Runbooks ? |\n| Performance | Scalabilite, cache, CDN, choix de SKU, tests de charge |\n\nCompromis types : **fiabilite vs cout** (multi-region ou non), **securite vs performance** (inspection TLS), **cout vs performance**.\n\n---\n\n## 10. Infrastructure as Code pour AZ-305\n\nL'examen cite **Bicep/ARM** ; en entreprise on utilise souvent **Terraform** (voir [cours Terraform](../terraform/README.md), lab 5).\n\n| Sujet | Bicep | Terraform |\n|-------|-------|-----------|\n| Etat | **Aucun** (ARM est la source de verite) | Fichier d'etat a gerer/proteger |\n| Nouvelles fonctions Azure | **Jour 0** | Attendre le provider (ou **azapi**) |\n| Multi-cloud | Non | Oui |\n| Previsualisation | `what-if` | `plan` |\n| Modules | Registre Bicep, **Template Specs** | Registry, **AVM** |\n| Suppression | Mode `Complete` (dangereux) / **Deployment Stacks** | `destroy` / retrait de config |\n\n**Deployment Stacks** : gerent le cycle de vie d'un ensemble de ressources (suppression/protection `denySettings`), remplace en partie Blueprints.\n**AVM (Azure Verified Modules)** : modules officiels Bicep/Terraform alignes WAF.\n\n---\n\n## 11. Etudes de cas completes\n\n### Cas 1 - \"Northwind Logistics\" (hybride + identite + DR)\n\n**Contexte** : Northwind a 3 datacenters on-prem, AD DS sur 2 forets, 400 VM, 60 applications. Objectifs : migration en 18 mois, **identite unique**, **connexion privee stable**, **DR** (RTO 2 h, RPO 15 min) pour les 10 applications critiques, **conformite RGPD (donnees en UE)**, equipe d'exploitation reduite.\n\n**Reponses attendues**\n- **Identite** : Entra Connect **Cloud Sync** (2 forets) ou Connect Sync + **PHS + Seamless SSO** ; MFA via **Conditional Access** ; **PIM** pour les admins ; **break-glass**.\n- **Connectivite** : **ExpressRoute** (2 circuits/2 emplacements) + **VPN S2S** de secours ; **Virtual WAN** si beaucoup de sites, sinon hub-spoke + gateway ; **Private Endpoints** + **DNS Private Resolver**.\n- **Migration** : **Azure Migrate** (assessment/dependances) en vagues ; **rehost** majoritaire, **SQL MI** pour les bases lourdes (SQL Agent) ; **Data Box** si gros volumes de fichiers.\n- **DR critiques** : **ASR** (RPO de l'ordre de la minute < 15 min) vers une region de DR **dans l'UE** (France Central est jumelee a France South, a acces restreint : verifier les regions utilisables, sinon choisir West Europe/North Europe) ; SQL **auto-failover group**.\n- **Conformite/gouvernance** : **Azure Policy** \"Allowed locations\" ; **management groups** ; Defender for Cloud.\n- **Exploitation reduite** : PaaS autant que possible, **Azure Monitor** centralise, **Update Manager**, **Backup**, IaC.\n\n### Cas 2 - \"Contoso Health\" (donnees sensibles)\n\n**Contexte** : application de dossiers medicaux (PaaS), donnees sensibles, exigences **chiffrement avec cles du client**, **aucun acces public**, audit complet, retention 10 ans non modifiable.\n\n**Reponses attendues** : **Private Endpoints** pour SQL/Storage/Key Vault, **acces public desactive**, **CMK** dans **Key Vault Premium/Managed HSM** (purge protection) avec rotation, **TDE** avec CMK, **Always Encrypted** pour colonnes ultra-sensibles, **managed identities**, **Blob immutable (WORM)** + Archive pour la retention, **diagnostic settings -> Log Analytics** + **Sentinel**, **Policy** (Deny public access, exiger CMK), **Defender for Cloud**.\n\n### Cas 3 - \"Fabrikam Games\" (global, pics de charge)\n\n**Contexte** : jeu en ligne mondial, pics tres eleves, classements en temps reel, profils joueurs JSON, evenements de jeu a analyser.\n\n**Reponses attendues** : **Front Door** + **AKS ou Container Apps** multi-region ; **Cosmos DB multi-region (Session)** pour profils ; **Azure Cache for Redis** (classements, sorted sets) ; **Event Hubs** pour les evenements -> **Stream Analytics/Fabric** + **ADLS** ; **Autoscale** + **tests de charge** ; **Savings Plan** pour la base + **Spot** pour le batch d'analyse.\n"}, {"track": "tf", "doc": "Cours", "md": "# Terraform avance - de l'Associate a l'expertise (GCP + Azure)\n\nCe cours **complete le module 08** (bases : HCL, workflow, state, modules). Ici on va plus loin :\ninternals, refactoring de state, tests, CI/CD, securite, et specificites des providers **Google** et **Azure**.\nIl prepare aussi a la certification **HashiCorp Certified: Terraform Associate** (voir section 14).\n\nRessources du dossier :\n- [questions.md](questions.md) : 58 questions (theorie, lecture de code, scenarios, debug)\n- [labs/README.md](labs/README.md) : 6 labs pratiques avec solutions (local, GCP, Azure, CI/CD)\n\n> Les numeros de version (ex. \"1.5\", \"1.10\") indiquent **quand une fonctionnalite est apparue**. Ils sont exacts a ma connaissance\n> mais verifiez le changelog de Terraform avant un examen ou une decision de mise a niveau.\n\n## Table des matieres\n\n1. [Modele mental : comment Terraform fonctionne vraiment](#1-modele-mental)\n2. [Langage HCL avance](#2-langage-hcl-avance)\n3. [State en profondeur](#3-state-en-profondeur)\n4. [Refactoring sans destruction](#4-refactoring-sans-destruction)\n5. [Providers et versions](#5-providers-et-versions)\n6. [Conception de modules](#6-conception-de-modules)\n7. [Structurer plusieurs environnements](#7-structurer-plusieurs-environnements)\n8. [Tests et qualite](#8-tests-et-qualite)\n9. [CI/CD et gouvernance](#9-cicd-et-gouvernance)\n10. [Securite et secrets](#10-securite-et-secrets)\n11. [Terraform sur Google Cloud](#11-terraform-sur-google-cloud)\n12. [Terraform sur Azure](#12-terraform-sur-azure)\n13. [Diagnostic : erreurs courantes](#13-diagnostic--erreurs-courantes)\n14. [Terraform Associate : objectifs d'examen](#14-terraform-associate)\n15. [Aide-memoire](#15-aide-memoire)\n\n---\n\n## 1. Modele mental\n\n### 1.1 Les trois mondes\n\n```\n   Configuration (.tf)      State (tfstate)         Realite (API cloud)\n   \"ce que je veux\"   <-->  \"ce que je crois    <--> \"ce qui existe\n                             avoir cree\"             vraiment\"\n```\n\n`terraform plan` fait : **1.** lire la config, **2.** *refresh* (comparer state <-> realite via les APIs), **3.** calculer le diff config <-> state refresh, **4.** afficher le plan.\n`terraform apply` execute ce plan.\n\nLe **state est une table de correspondance** : adresse Terraform (`google_storage_bucket.logs`) -> identifiant reel (`my-bucket`) + attributs connus.\nSi une ressource n'est **pas dans le state**, Terraform ne sait pas qu'elle existe : il essaiera de la **creer** (-> erreur `409 already exists`).\nSi elle est dans le state mais **plus dans la config**, il la **detruit**.\n\n### 1.2 Le graphe de dependances\n\n- Terraform construit un **DAG** : chaque reference (`aws_x.y.id`) cree une **dependance implicite**.\n- Les ressources sans dependance entre elles sont traitees en **parallele** (`-parallelism=10` par defaut).\n- `depends_on` ne sert que pour les dependances **invisibles** (ex. un role IAM doit exister avant un service qui l'utilise sans le referencer). A utiliser avec parcimonie : il rend le plan plus conservateur (valeurs \"known after apply\").\n- Une **boucle** de dependances = `Error: Cycle`. On la casse en decouplant (ressource intermediaire, `*_iam_member` separe de la ressource...).\n- A la destruction, l'ordre est **inverse**.\n\n### 1.3 Valeurs connues / inconnues\n\nPendant `plan`, certaines valeurs sont **connues apres apply** (ex. `id` d'une ressource a creer). Consequences :\n- `count` et `for_each` exigent des valeurs **connues au plan** (sinon : `The \"for_each\" map includes keys derived from resource attributes that cannot be determined until apply`).\n- Les `data` sources dont les arguments dependent d'une valeur inconnue sont lues **a l'apply**, produisant des diffs differes.\n- Regle : les **cles** de `for_each` doivent venir de variables/locals statiques, pas d'attributs de ressources.\n\n### 1.4 Architecture : core + providers\n\nTerraform core (binaire) parle en **gRPC** a des **plugins providers** (binaires separes telecharges par `init`). Le core gere graphe, state, plan ; le provider traduit en appels API. Les providers sont versionnes independamment ; `.terraform.lock.hcl` verrouille leurs versions et leurs **hashes**.\n\n---\n\n## 2. Langage HCL avance\n\n### 2.1 Types complexes et valeurs par defaut\n\n```hcl\nvariable \"services\" {\n  description = \"Services a deployer\"\n  type = map(object({\n    image     = string\n    port      = optional(number, 8080)          # defaut (1.3+)\n    env       = optional(map(string), {})\n    public    = optional(bool, false)\n    scaling   = optional(object({\n      min = optional(number, 0)\n      max = optional(number, 5)\n    }), {})\n  }))\n  nullable = false\n}\n```\n\nTypes : `string number bool`, collections `list(T) set(T) map(T)`, structurels `object({...}) tuple([...])`, et `any`.\nLes **conversions implicites** existent (nombre <-> string) mais sont une source d'ambiguite : preferer un type explicite.\n\n### 2.2 Validation, preconditions, checks\n\n```hcl\nvariable \"environment\" {\n  type = string\n  validation {\n    condition     = contains([\"dev\", \"staging\", \"prod\"], var.environment)\n    error_message = \"environment doit etre dev, staging ou prod.\"\n  }\n}\n\nresource \"google_compute_instance\" \"vm\" {\n  # ...\n  lifecycle {\n    precondition {                                         # avant creation/modif\n      condition     = data.google_compute_image.img.status == \"READY\"\n      error_message = \"L'image doit etre READY.\"\n    }\n    postcondition {                                        # apres : verifie le resultat\n      condition     = self.network_interface[0].network_ip != \"\"\n      error_message = \"Aucune IP privee attribuee.\"\n    }\n  }\n}\n\ncheck \"site_is_up\" {                                       # 1.5+ : avertissement non bloquant\n  data \"http\" \"health\" { url = \"https://example.com/health\" }\n  assert {\n    condition     = data.http.health.status_code == 200\n    error_message = \"Le site ne repond pas.\"\n  }\n}\n```\n\n| Mecanisme | Quand | Bloque ? |\n|-----------|-------|----------|\n| `validation` (variable) | Valide **une entree** | Oui |\n| `precondition` | Avant l'action sur la ressource | Oui |\n| `postcondition` | Apres l'action | Oui |\n| `check` | Supervision continue d'une hypothese | **Non** (warning) |\n\n### 2.3 Expressions\n\n```hcl\n# for -> liste, map ; filtre avec if\nnames     = [for s in var.list : upper(s)]\nby_name   = { for s in var.servers : s.name => s.ip }\nonly_prod = { for k, v in var.envs : k => v if v.tier == \"prod\" }\ngrouped   = { for s in var.servers : s.zone => s.name... }     # \"...\" = regroupement (valeurs en listes)\n\n# splat\nids = aws_instance.web[*].id                 # equiv. [for i in aws_instance.web : i.id]\n\n# conditionnel\nsize = var.environment == \"prod\" ? \"large\" : \"small\"\n```\n\nFonctions a maitriser (frequentes en examen et en vrai) :\n\n| Categorie | Fonctions |\n|-----------|-----------|\n| Collections | `merge`, `concat`, `flatten`, `distinct`, `keys`, `values`, `lookup`, `zipmap`, `setproduct`, `toset`, `tolist`, `tomap`, `slice`, `element`, `contains`, `length` |\n| Robustesse | `try(expr, defaut)`, `can(expr)`, `coalesce`, `coalescelist`, `one` |\n| Chaines | `format`, `join`, `split`, `replace`, `regex`, `trim*`, `lower`, `upper`, `substr` |\n| Fichiers | `file`, `templatefile`, `fileexists`, `filebase64` |\n| Encodage | `jsonencode`, `jsondecode`, `yamlencode`, `yamldecode`, `base64encode`, `sha256`, `md5` |\n| Reseau | `cidrsubnet`, `cidrhost`, `cidrnetmask`, `cidrsubnets` |\n| Temps | `timestamp`, `timeadd`, `plantimestamp` |\n\n```hcl\ncidrsubnet(\"10.0.0.0/16\", 8, 3)      # \"10.0.3.0/24\"  (ajoute 8 bits, subnet n°3)\ncidrhost(\"10.0.3.0/24\", 10)          # \"10.0.3.10\"\nmerge({a=1,b=2}, {b=3})              # {a=1, b=3}   <- la DERNIERE valeur gagne\nlookup({a=1}, \"z\", 0)                # 0\ntry(var.obj.optional_field, \"n/a\")   # evite une erreur si l'attribut n'existe pas\n```\n\n**setproduct** (produit cartesien) : utile pour creer une ressource par couple (env, region) :\n```hcl\nlocals {\n  pairs = { for p in setproduct(var.envs, var.regions) : \"${p[0]}-${p[1]}\" => { env = p[0], region = p[1] } }\n}\n```\n\n### 2.4 count vs for_each (le piege classique)\n\n```hcl\n# count : adresses par INDEX -> supprimer l'element 1 decale les autres et les DETRUIT/RECREE\nresource \"x\" \"a\" { count = length(var.names) }          # x.a[0], x.a[1], x.a[2]\n\n# for_each : adresses par CLE -> supprimer \"b\" n'affecte que \"b\"\nresource \"x\" \"a\" { for_each = toset(var.names) }        # x.a[\"a\"], x.a[\"b\"], x.a[\"c\"]\n```\n\n| | `count` | `for_each` |\n|---|---------|------------|\n| Cle d'adresse | index numerique | cle string |\n| Supprimer au milieu | **decale** les suivants (recreation) | affecte uniquement l'element |\n| Entree | nombre | **map ou set de strings** (pas une liste) |\n| Usage ideal | creation **conditionnelle** (`count = var.enabled ? 1 : 0`) | collections d'objets identifiables |\n\n`for_each` sur une liste d'objets : transformer en map (`{ for o in var.list : o.name => o }`).\n\n### 2.5 Blocs dynamiques\n\n```hcl\nresource \"azurerm_network_security_group\" \"this\" {\n  name                = \"nsg-web\"\n  location            = var.location\n  resource_group_name = var.rg_name\n\n  dynamic \"security_rule\" {\n    for_each = var.rules                       # map(object({priority, port, source}))\n    content {\n      name                       = security_rule.key\n      priority                   = security_rule.value.priority\n      direction                  = \"Inbound\"\n      access                     = \"Allow\"\n      protocol                   = \"Tcp\"\n      source_port_range          = \"*\"\n      destination_port_range     = security_rule.value.port\n      source_address_prefix      = security_rule.value.source\n      destination_address_prefix = \"*\"\n    }\n  }\n}\n```\nA utiliser pour des **blocs repetables** (rules, ingress...). Eviter l'abus : lisibilite.\n\n### 2.6 lifecycle\n\n| Argument | Effet | Cas d'usage |\n|----------|-------|-------------|\n| `create_before_destroy` | Cree le remplacant **avant** de detruire l'ancien | Zero downtime ; attention aux **noms uniques** (utiliser `name_prefix` ou suffixe aleatoire) |\n| `prevent_destroy` | Erreur si le plan detruit la ressource | Bases de donnees, buckets critiques. **Contournable** en supprimant le bloc de la config |\n| `ignore_changes` | Ignore les diffs sur des attributs | Attributs modifies hors Terraform (tags automatiques, image Cloud Deploy, autoscaling) |\n| `replace_triggered_by` | Remplace la ressource quand une autre change | Forcer la recreation en cascade |\n| `precondition/postcondition` | Garde-fous | Voir 2.2 |\n\n### 2.7 Les blocs de refactoring (voir section 4) et `terraform_data`\n\n`terraform_data` (1.4+) remplace `null_resource` : ressource **integree** (pas de provider) pour stocker une valeur ou declencher une action via `triggers_replace`.\n\n### 2.8 Provisioners : dernier recours\n\n`local-exec`, `remote-exec`, `file` : **non declaratifs**, non reflétés dans le plan, echecs difficiles a rejouer.\nPreferer : **cloud-init / startup-script**, images pre-construites (Packer), Ansible, ou ressources natives. Si indispensable : `terraform_data` + `triggers_replace`.\n\n---\n\n## 3. State en profondeur\n\n### 3.1 Contenu et sensibilite\n\nLe state contient **tous les attributs**, y compris les **secrets** (mots de passe generes, cles, valeurs `sensitive`) **en clair** (JSON). Donc :\n- Backend **chiffre**, acces **restreint** (IAM), **versioning** active, journalisation.\n- Ne jamais committer `terraform.tfstat
