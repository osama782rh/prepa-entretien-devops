<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certif Trainer</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2230;--mute:#667085;--line:#e3e6ec;--acc:#2f6fed;--acc-ink:#fff;--ok:#12805c;--okbg:#e4f5ee;--ko:#c0352b;--kobg:#fdeceb;--warn:#a96b00;--code:#eef0f4}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151c;--card:#1b202b;--ink:#e8ebf2;--mute:#9aa3b5;--line:#2c3342;--acc:#6b9bff;--acc-ink:#0c1020;--ok:#4cc79a;--okbg:#14382c;--ko:#ff8a80;--kobg:#3c1d1b;--warn:#e5b04a;--code:#252b38}}
:root[data-theme=dark]{--bg:#12151c;--card:#1b202b;--ink:#e8ebf2;--mute:#9aa3b5;--line:#2c3342;--acc:#6b9bff;--acc-ink:#0c1020;--ok:#4cc79a;--okbg:#14382c;--ko:#ff8a80;--kobg:#3c1d1b;--warn:#e5b04a;--code:#252b38}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:8px;min-height:56px;flex-wrap:wrap}
.brand{font-weight:700;margin-right:12px}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav a{color:var(--mute);text-decoration:none;padding:8px 14px;border-radius:8px;font-weight:600;font-size:15px}
nav a:hover{background:var(--bg)}
nav a.on{background:var(--acc);color:var(--acc-ink)}
.badge{background:var(--ko);color:#fff;border-radius:99px;font-size:12px;padding:1px 7px;margin-left:6px}
.icon{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:26px;margin:0 0 4px}h2{font-size:20px;margin:28px 0 10px}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,a:focus-visible,.opt:focus-within,.icon:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
label.f{display:block;font-size:13px;color:var(--mute);font-weight:600;margin-bottom:4px}
select,input[type=number]{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;min-width:150px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--card);color:var(--ink);border:0;padding:8px 14px;font:inherit;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--acc-ink);font-weight:600}
.bigstat{font-size:30px;font-weight:700;line-height:1.1}
.mute{color:var(--mute)}.small{font-size:13px}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--acc)}
.meter i.g{background:var(--ok)}
.qhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--mute);font-size:13px;margin-bottom:8px}
.tag{border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:12px;color:var(--mute)}
.stem{font-size:17px}
.stem p,.exp p{margin:.5em 0}
pre{background:var(--code);padding:12px;border-radius:8px;overflow:auto;font-size:14px;line-height:1.45}
code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.9em;font-family:ui-monospace,Consolas,monospace}
pre code{background:none;padding:0}
.opts{margin:16px 0;display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--acc)}
.opt input{margin-top:5px}
.opt .k{font-weight:700;color:var(--mute);min-width:1.2em}
.opt.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ko{background:var(--kobg);border-color:var(--ko)}
.opt.lock{cursor:default}
.fb{border-radius:10px;padding:12px 14px;margin-top:12px}
.fb.ok{background:var(--okbg)}.fb.ko{background:var(--kobg)}.fb.neutral{background:var(--code)}
.fb h3{margin:0 0 4px;font-size:16px}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
table.t{border-collapse:collapse;width:100%}
table.t th,table.t td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}
.course{display:grid;grid-template-columns:240px 1fr;gap:24px}
.toc{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;font-size:14px}
.toc a{display:block;color:var(--mute);text-decoration:none;padding:4px 8px;border-left:2px solid var(--line)}
.toc a:hover{color:var(--ink);border-color:var(--acc)}
.md{overflow-wrap:anywhere}
.md table{border-collapse:collapse;display:block;overflow:auto}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;font-size:14px}
.md blockquote{margin:12px 0;padding:4px 14px;border-left:4px solid var(--acc);background:var(--code);border-radius:0 8px 8px 0}
.md details{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0}
.md h1,.md h2,.md h3{scroll-margin-top:76px}
.md h2{border-top:1px solid var(--line);padding-top:18px}
.md a{color:var(--acc)}
@media (max-width:760px){.course{grid-template-columns:1fr}.toc{position:static;max-height:none}.brand{width:100%}}
</style>
</head>
<body>
<header><div class="bar">
  <span class="brand">Certif Trainer</span>
  <nav aria-label="Navigation principale" id="nav"></nav>
  <button class="icon" id="theme" title="Changer de theme" aria-label="Changer de theme">Theme</button>
</div></header>
<main id="app"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
const DATA = {"tracks": {"gcp": {"dir": "gcp-devops-engineer", "name": "GCP DevOps Engineer", "short": "GCP"}, "az": {"dir": "az-305", "name": "AZ-305 Azure Solutions Architect", "short": "AZ-305"}, "tf": {"dir": "terraform", "name": "Terraform (Associate -> avance)", "short": "Terraform"}}, "questions": [{"id": "gcp:bas:Q1", "track": "gcp", "source": "Base", "num": "Q1", "section": "Domaine 1 - Bootstrapping de l'organisation", "q": "Votre entreprise exige qu'**aucune VM de l'organisation** n'ait d'adresse IP externe, meme si un administrateur de projet dispose du role Owner. Que faites-vous ?", "opts": [{"k": "A", "t": "Accorder `compute.instanceAdmin` uniquement aux equipes reseau"}, {"k": "B", "t": "Definir l'Organization Policy `constraints/compute.vmExternalIpAccess` au niveau organisation"}, {"k": "C", "t": "Creer une regle de pare-feu bloquant le trafic entrant sur toutes les VM"}, {"k": "D", "t": "Demander aux equipes de ne pas utiliser d'IP externe"}], "ans": ["B"], "exp": "Les Organization Policies imposent des contraintes **independamment d'IAM** : meme un Owner ne peut pas les contourner. Le pare-feu (C) ne retire pas l'IP, IAM (A) n'est pas une garantie, et D n'est pas un controle technique."}, {"id": "gcp:bas:Q2", "track": "gcp", "source": "Base", "num": "Q2", "section": "Domaine 1 - Bootstrapping de l'organisation", "q": "Un pipeline **GitHub Actions** doit deployer sur Cloud Run. La securite interdit les cles de compte de service JSON longue duree. Quelle solution ?", "opts": [{"k": "A", "t": "Stocker la cle JSON dans les secrets GitHub et la renouveler tous les 90 jours"}, {"k": "B", "t": "Utiliser la Workload Identity Federation avec le fournisseur OIDC de GitHub"}, {"k": "C", "t": "Executer le pipeline sur une VM Compute Engine avec le compte par defaut"}, {"k": "D", "t": "Donner le role Editor a l'utilisateur qui lance le pipeline"}], "ans": ["B"], "exp": "La Workload Identity Federation echange le jeton OIDC de GitHub contre des identifiants GCP **temporaires**, sans aucune cle. A garde une cle (meme renouvelee), C change l'architecture et utilise un compte trop permissif, D est trop large."}, {"id": "gcp:bas:Q3", "track": "gcp", "source": "Base", "num": "Q3", "section": "Domaine 1 - Bootstrapping de l'organisation", "q": "Une equipe reseau centrale doit gerer **un reseau unique** partage par 15 projets applicatifs, tandis que chaque equipe garde le controle de ses propres ressources. Quelle architecture ?", "opts": [{"k": "A", "t": "VPC Peering entre les 15 projets"}, {"k": "B", "t": "Un VPC par projet relie par Cloud VPN"}, {"k": "C", "t": "Shared VPC : un projet hote, 15 projets de service"}, {"k": "D", "t": "Un seul projet contenant tout"}], "ans": ["C"], "exp": "Shared VPC centralise le reseau et la securite reseau dans le projet hote, tout en laissant chaque equipe gerer ses ressources dans son projet de service (role `compute.networkUser` sur les sous-reseaux). Le peering n'est pas transitif et decentralise la gestion ; D detruit l'isolation."}, {"id": "gcp:bas:Q4", "track": "gcp", "source": "Base", "num": "Q4", "section": "Domaine 1 - Bootstrapping de l'organisation", "q": "Vous devez conserver les journaux d'audit de **tous les projets** de l'organisation pendant 7 ans, de facon **non modifiable** pour la conformite. Que configurez-vous ?", "opts": [{"k": "A", "t": "Un sink par projet vers BigQuery"}, {"k": "B", "t": "Un sink agrege au niveau organisation (`--include-children`) vers un bucket Cloud Storage avec retention policy verrouillee (Bucket Lock)"}, {"k": "C", "t": "Augmenter la retention du bucket `_Required` a 7 ans"}, {"k": "D", "t": "Exporter manuellement les logs chaque mois"}], "ans": ["B"], "exp": "Le sink agrege couvre tous les projets (presents et futurs) ; le Bucket Lock rend la retention irreversible. `_Required` est fixe a 400 jours et non modifiable (C). A est fastidieux, non garanti pour les futurs projets, et non immuable."}, {"id": "gcp:bas:Q5", "track": "gcp", "source": "Base", "num": "Q5", "section": "Domaine 1 - Bootstrapping de l'organisation", "q": "Des developpeurs creent des cles JSON de comptes de service et les commitent par erreur dans Git. Quelle mesure **preventive** a le plus d'effet ?", "opts": [{"k": "A", "t": "Former les developpeurs"}, {"k": "B", "t": "Activer la contrainte d'organisation `iam.disableServiceAccountKeyCreation` et utiliser des SA attaches / Workload Identity Federation"}, {"k": "C", "t": "Scanner les depots Git chaque semaine"}, {"k": "D", "t": "Faire tourner les cles toutes les semaines"}], "ans": ["B"], "exp": "On supprime la cause : plus de creation de cles possible. Les autres options sont detectives ou palliatives."}, {"id": "gcp:bas:Q6", "track": "gcp", "source": "Base", "num": "Q6", "section": "Domaine 1 - Bootstrapping de l'organisation", "q": "Une equipe de developpement doit pouvoir deployer des services Cloud Run en non-production mais **ne doit pas pouvoir modifier l'IAM**. Quelle approche respecte le moindre privilege ?", "opts": [{"k": "A", "t": "Role Editor sur le projet"}, {"k": "B", "t": "Role Owner sur le projet de dev"}, {"k": "C", "t": "Role predefini `roles/run.developer` accorde a un groupe Google sur le dossier/projet non-prod"}, {"k": "D", "t": "Role personnalise accorde a chaque utilisateur individuellement"}], "ans": ["C"], "exp": "Role predefini precis, accorde a un groupe, a la portee adequate. Editor/Owner sont trop larges (A, B) ; accorder a des individus (D) complique la gestion."}, {"id": "gcp:bas:Q7", "track": "gcp", "source": "Base", "num": "Q7", "section": "Domaine 2 - CI/CD", "q": "Un build Cloud Build doit appliquer des migrations sur une base **Cloud SQL a IP privee uniquement**. Quelle solution ?", "opts": [{"k": "A", "t": "Ajouter l'IP publique de Cloud Build aux reseaux autorises"}, {"k": "B", "t": "Utiliser un private pool Cloud Build connecte a votre VPC"}, {"k": "C", "t": "Ouvrir la base a Internet temporairement"}, {"k": "D", "t": "Executer les migrations a la main"}], "ans": ["B"], "exp": "Les private pools executent les builds dans un reseau prive (peering) ayant acces aux ressources VPC. Le pool par defaut n'y a pas acces ; les IP des workers par defaut ne sont pas fixes."}, {"id": "gcp:bas:Q8", "track": "gcp", "source": "Base", "num": "Q8", "section": "Domaine 2 - CI/CD", "q": "Vous voulez **garantir que seules les images construites par votre pipeline** peuvent etre deployees sur GKE. Que mettez-vous en place ?", "opts": [{"k": "A", "t": "Artifact Registry avec IAM restrictif uniquement"}, {"k": "B", "t": "Binary Authorization avec un attestor : le pipeline signe l'image apres les tests, GKE refuse toute image non attestee"}, {"k": "C", "t": "Un scan de vulnerabilites uniquement"}, {"k": "D", "t": "Un controle manuel avant chaque deploiement"}], "ans": ["B"], "exp": "Binary Authorization applique une politique a l'admission : pas d'attestation valide = deploiement refuse. L'IAM du registre (A) n'empeche pas de deployer une image d'ailleurs ; le scan (C) detecte mais ne prouve pas la provenance."}, {"id": "gcp:bas:Q9", "track": "gcp", "source": "Base", "num": "Q9", "section": "Domaine 2 - CI/CD", "q": "Vous devez livrer une application sur dev, puis staging, puis production, avec **approbation manuelle avant la production**, de maniere managee et auditable. Quel service ?", "opts": [{"k": "A", "t": "Cloud Scheduler"}, {"k": "B", "t": "Cloud Deploy avec `requireApproval: true` sur la cible production"}, {"k": "C", "t": "Un script bash lance depuis un poste"}, {"k": "D", "t": "Cloud Functions declenchee par Pub/Sub"}], "ans": ["B"], "exp": "Cloud Deploy gere pipelines de livraison, promotions, approbations, rollbacks et historique. Les autres n'offrent pas ces fonctions nativement."}, {"id": "gcp:bas:Q10", "track": "gcp", "source": "Base", "num": "Q10", "section": "Domaine 2 - CI/CD", "q": "Les builds Docker prennent 25 minutes car toutes les couches sont reconstruites a chaque fois. Que faire en premier ?", "opts": [{"k": "A", "t": "Reduire le nombre de tests"}, {"k": "B", "t": "Activer le cache de couches (Kaniko `--cache=true`) et augmenter le `machineType`"}, {"k": "C", "t": "Passer a un autre outil CI"}, {"k": "D", "t": "Desactiver les logs"}], "ans": ["B"], "exp": "Le cache evite de reconstruire les couches inchangees ; une machine plus puissante accelere le reste. Reduire les tests (A) degrade la qualite."}, {"id": "gcp:bas:Q11", "track": "gcp", "source": "Base", "num": "Q11", "section": "Domaine 2 - CI/CD", "q": "Vous deployez une nouvelle revision de votre service **Cloud Run** et voulez d'abord l'exposer a **10 % du trafic**, avec possibilite de revenir immediatement en arriere. Comment ?", "opts": [{"k": "A", "t": "Deployer la nouvelle revision avec 100 % puis surveiller"}, {"k": "B", "t": "Deployer avec `--no-traffic`, puis `gcloud run services update-traffic --to-revisions=nouvelle=10,ancienne=90`"}, {"k": "C", "t": "Creer un second service et changer le DNS"}, {"k": "D", "t": "Utiliser un Cloud Scheduler pour changer les revisions"}], "ans": ["B"], "exp": "Cloud Run gere nativement les revisions et le fractionnement du trafic ; le rollback = remettre 100 % sur l'ancienne revision (instantane)."}, {"id": "gcp:bas:Q12", "track": "gcp", "source": "Base", "num": "Q12", "section": "Domaine 2 - CI/CD", "q": "Une etape de build a besoin d'un **token d'API** tiers. Comment le fournir ?", "opts": [{"k": "A", "t": "Le placer en clair dans `cloudbuild.yaml`"}, {"k": "B", "t": "Le passer en substitution `_TOKEN` dans le trigger"}, {"k": "C", "t": "Le stocker dans Secret Manager et le referencer via `availableSecrets`"}, {"k": "D", "t": "L'inclure dans l'image Docker"}], "ans": ["C"], "exp": "Secret Manager : chiffre, versionne, controle d'acces IAM, audite. Les substitutions (B) apparaissent dans les logs et la configuration ; A et D exposent le secret."}, {"id": "gcp:bas:Q13", "track": "gcp", "source": "Base", "num": "Q13", "section": "Domaine 2 - CI/CD", "q": "Vous voulez etre alerte automatiquement quand une **image poussee** contient des vulnerabilites critiques, et bloquer son deploiement. Quelle combinaison ?", "opts": [{"k": "A", "t": "Artifact Analysis (scan a la poussee) + Binary Authorization (attestation conditionnee au resultat du scan)"}, {"k": "B", "t": "Cloud Monitoring uniquement"}, {"k": "C", "t": "Cloud Armor"}, {"k": "D", "t": "VPC Service Controls"}], "ans": ["A"], "exp": "Le scan detecte, Binary Authorization applique le blocage. Cloud Armor protege des attaques web ; VPC-SC protege contre l'exfiltration."}, {"id": "gcp:bas:Q14", "track": "gcp", "source": "Base", "num": "Q14", "section": "Domaine 2 - CI/CD", "q": "La configuration d'un cluster GKE **derive** car des administrateurs appliquent des modifications manuelles avec `kubectl`. Vous voulez que Git soit la source de verite et que la derive soit corrigee automatiquement. Que faites-vous ?", "opts": [{"k": "A", "t": "Interdire kubectl aux developpeurs sans rien d'autre"}, {"k": "B", "t": "Adopter Config Sync (ou Argo CD/Flux) : l'agent reconcilie en continu le cluster avec le depot Git"}, {"k": "C", "t": "Recreer le cluster chaque semaine"}, {"k": "D", "t": "Documenter la configuration dans un wiki"}], "ans": ["B"], "exp": "GitOps : etat desire dans Git, reconciliation continue, historique et rollback via Git."}, {"id": "gcp:bas:Q15", "track": "gcp", "source": "Base", "num": "Q15", "section": "Domaine 2 - CI/CD", "q": "Une application critique necessite un **rollback instantane** et la possibilite de **tester completement le nouvel environnement** avant d'y envoyer du trafic. Le budget autorise de doubler temporairement les ressources. Quelle strategie ?", "opts": [{"k": "A", "t": "Rolling update"}, {"k": "B", "t": "Recreate"}, {"k": "C", "t": "Blue/Green"}, {"k": "D", "t": "Canary a 1 %"}], "ans": ["C"], "exp": "Blue/green : deux environnements complets, bascule du trafic, retour immediat. Le rolling est plus lent a annuler ; recreate cause une coupure ; le canary ne teste pas un environnement complet avant exposition."}, {"id": "gcp:bas:Q16", "track": "gcp", "source": "Base", "num": "Q16", "section": "Domaine 3 - SRE", "q": "Votre SLO de disponibilite est de **99,9 % sur 30 jours**. Quel est l'error budget en temps d'indisponibilite ?", "opts": [{"k": "A", "t": "4,3 minutes"}, {"k": "B", "t": "43,2 minutes"}, {"k": "C", "t": "7,2 heures"}, {"k": "D", "t": "8,76 heures"}], "ans": ["B"], "exp": "0,1 % de 30 j x 24 h x 60 min = 43 200 min x 0,001 = 43,2 min. (8,76 h correspond a 99,9 % **par an**.)"}, {"id": "gcp:bas:Q17", "track": "gcp", "source": "Base", "num": "Q17", "section": "Domaine 3 - SRE", "q": "Une equipe a consomme **100 % de l'error budget** du mois, a cause de plusieurs releases defectueuses. Selon les pratiques SRE, que faire ?", "opts": [{"k": "A", "t": "Continuer les releases pour livrer les fonctionnalites promises"}, {"k": "B", "t": "Geler les releases non liees a la fiabilite et se concentrer sur la stabilite/automatisation"}, {"k": "C", "t": "Augmenter le SLO a 99,99 %"}, {"k": "D", "t": "Supprimer l'alerting pour reduire le bruit"}], "ans": ["B"], "exp": "C'est le role de l'error budget policy : budget epuise = priorite a la fiabilite. Resserrer le SLO (C) n'aide pas, supprimer l'alerting (D) est dangereux."}, {"id": "gcp:bas:Q18", "track": "gcp", "source": "Base", "num": "Q18", "section": "Domaine 3 - SRE", "q": "Quel est le **meilleur SLI** de disponibilite pour une API publique ?", "opts": [{"k": "A", "t": "Utilisation CPU moyenne des serveurs"}, {"k": "B", "t": "Nombre de pods en etat Running"}, {"k": "C", "t": "Proportion de requetes valides reussies (non-5xx), mesuree au load balancer"}, {"k": "D", "t": "Temps de reponse moyen"}], "ans": ["C"], "exp": "Un bon SLI mesure l'experience utilisateur : `bons evenements / evenements valides`, au plus pres de l'utilisateur (le LB). CPU et nombre de pods sont des causes/ressources, pas des symptomes ; la moyenne masque les latences extremes."}, {"id": "gcp:bas:Q19", "track": "gcp", "source": "Base", "num": "Q19", "section": "Domaine 3 - SRE", "q": "Pendant un incident majeur, l'ingenieur d'astreinte le plus senior veut a la fois **coordonner l'equipe, communiquer avec la direction et depanner**. Que recommande l'approche SRE ?", "opts": [{"k": "A", "t": "Qu'il fasse tout pour aller plus vite"}, {"k": "B", "t": "Separer les roles : un Incident Commander qui coordonne, un Operations Lead qui agit, un Communications Lead"}, {"k": "C", "t": "Attendre que l'incident se resolve seul"}, {"k": "D", "t": "Laisser chacun modifier la production librement"}], "ans": ["B"], "exp": "Le cumul de roles degrade la prise de decision. Un seul Operations Lead modifie la production pour eviter les actions concurrentes ; l'IC garde la vue d'ensemble."}, {"id": "gcp:bas:Q20", "track": "gcp", "source": "Base", "num": "Q20", "section": "Domaine 3 - SRE", "q": "Apres un incident, la direction demande **qui est responsable** pour le sanctionner. Quelle est la bonne approche de postmortem ?", "opts": [{"k": "A", "t": "Identifier et sanctionner l'ingenieur fautif"}, {"k": "B", "t": "Postmortem sans blame : analyser les causes systemiques et definir des actions correctives avec responsables et echeances"}, {"k": "C", "t": "Ne pas rediger de postmortem"}, {"k": "D", "t": "Limiter le document a la direction"}], "ans": ["B"], "exp": "Le blame decourage la transparence. On cherche pourquoi le systeme a permis l'erreur et on corrige le systeme."}, {"id": "gcp:bas:Q21", "track": "gcp", "source": "Base", "num": "Q21", "section": "Domaine 3 - SRE", "q": "Un SRE passe 70 % de son temps a redemarrer manuellement des services et a mettre a jour des certificats a la main. Quel est le probleme principal et la reponse ?", "opts": [{"k": "A", "t": "C'est normal pour un SRE"}, {"k": "B", "t": "C'est du toil (> 50 %) : il faut automatiser et eliminer les causes"}, {"k": "C", "t": "Il faut embaucher plus de personnel pour faire ces taches"}, {"k": "D", "t": "Il faut desactiver les certificats"}], "ans": ["B"], "exp": "Taches manuelles, repetitives, automatisables, sans valeur durable = toil. L'objectif est de garder le toil sous 50 % et de le reduire par l'ingenierie."}, {"id": "gcp:bas:Q22", "track": "gcp", "source": "Base", "num": "Q22", "section": "Domaine 3 - SRE", "q": "Un service A appelle un service B qui est partiellement en panne. A reessaie immediatement et sans limite, et B s'effondre completement. Quelle amelioration ?", "opts": [{"k": "A", "t": "Augmenter le nombre de retries"}, {"k": "B", "t": "Retries avec backoff exponentiel et jitter, plus circuit breaker et timeouts"}, {"k": "C", "t": "Supprimer les timeouts"}, {"k": "D", "t": "Ajouter plus de threads cote A"}], "ans": ["B"], "exp": "Le backoff avec jitter etale les tentatives et evite le \"retry storm\" ; le circuit breaker laisse B se retablir."}, {"id": "gcp:bas:Q23", "track": "gcp", "source": "Base", "num": "Q23", "section": "Domaine 3 - SRE", "q": "Une nouvelle version vient d'etre deployee et le taux d'erreur monte a 15 %. Une cause possible est identifiee mais pas confirmee. Quelle est la **premiere action** ?", "opts": [{"k": "A", "t": "Investiguer la cause racine en production pendant 2 heures"}, {"k": "B", "t": "Faire un rollback vers la version precedente pour attenuer l'impact, puis investiguer"}, {"k": "C", "t": "Ecrire le postmortem"}, {"k": "D", "t": "Desactiver la supervision"}], "ans": ["B"], "exp": "Mitigation d'abord, cause racine ensuite. Un rollback est rapide et a faible risque."}, {"id": "gcp:bas:Q24", "track": "gcp", "source": "Base", "num": "Q24", "section": "Domaine 4 - Supervision", "q": "Vous voulez etre prevenu **rapidement** quand le service consomme son error budget trop vite, tout en evitant les faux positifs. Quelle alerte ?", "opts": [{"k": "A", "t": "Alerte sur CPU > 80 % pendant 1 minute"}, {"k": "B", "t": "Alerte sur burn rate multi-fenetres (fenetre longue + fenetre courte)"}, {"k": "C", "t": "Alerte a chaque erreur 5xx"}, {"k": "D", "t": "Alerte hebdomadaire par email"}], "ans": ["B"], "exp": "Exemple : burn rate 14,4 sur 1 h **et** sur 5 min pour une page. La fenetre longue limite les faux positifs, la courte permet de s'eteindre vite apres resolution. Les alertes sur causes (A) ou sur chaque erreur (C) generent du bruit."}, {"id": "gcp:bas:Q25", "track": "gcp", "source": "Base", "num": "Q25", "section": "Domaine 4 - Supervision", "q": "L'equipe securite veut analyser les journaux d'audit de toute l'organisation avec des **requetes SQL**. Que faire ?", "opts": [{"k": "A", "t": "Lire les logs a la main dans la console"}, {"k": "B", "t": "Creer un sink agrege vers BigQuery (ou utiliser Log Analytics sur un bucket mis a niveau)"}, {"k": "C", "t": "Exporter vers Cloud Storage et ouvrir les fichiers localement"}, {"k": "D", "t": "Utiliser Cloud Trace"}], "ans": ["B"], "exp": "Sink vers BigQuery ou Log Analytics = requetes SQL a grande echelle. Cloud Trace concerne la latence, pas les journaux d'audit."}, {"id": "gcp:bas:Q26", "track": "gcp", "source": "Base", "num": "Q26", "section": "Domaine 4 - Supervision", "q": "La facture Cloud Logging est elevee a cause de millions de logs de **health checks** sans valeur. Comment la reduire sans perdre les logs utiles ?", "opts": [{"k": "A", "t": "Desactiver Cloud Logging"}, {"k": "B", "t": "Ajouter un filtre d'exclusion sur le sink `_Default` pour ces logs"}, {"k": "C", "t": "Reduire la retention a 1 jour pour tous les logs"}, {"k": "D", "t": "Supprimer le projet"}], "ans": ["B"], "exp": "Les exclusions evitent le stockage des entrees ciblees, donc leur cout, sans toucher au reste."}, {"id": "gcp:bas:Q27", "track": "gcp", "source": "Base", "num": "Q27", "section": "Domaine 4 - Supervision", "q": "Vous gerez 12 projets (dev, staging, prod de 4 applications) et voulez **un seul tableau de bord** et des alertes couvrant toutes les metriques. Quelle fonction utilisez-vous ?", "opts": [{"k": "A", "t": "Un dashboard par projet"}, {"k": "B", "t": "Un projet de scoping avec un metrics scope incluant les 12 projets"}, {"k": "C", "t": "Exporter les metriques vers BigQuery"}, {"k": "D", "t": "Un script qui agrege les metriques"}], "ans": ["B"], "exp": "Le metrics scope permet a un projet de visualiser et d'alerter sur les metriques de plusieurs projets."}, {"id": "gcp:bas:Q28", "track": "gcp", "source": "Base", "num": "Q28", "section": "Domaine 4 - Supervision", "q": "Vous voulez declencher une alerte quand le message **\"payment failed\"** apparait plus de 50 fois par minute dans les logs applicatifs. Comment ?", "opts": [{"k": "A", "t": "Lire les logs manuellement"}, {"k": "B", "t": "Creer une metrique basee sur les journaux (compteur) puis une alerte sur cette metrique"}, {"k": "C", "t": "Creer un uptime check"}, {"k": "D", "t": "Utiliser Error Reporting uniquement"}], "ans": ["B"], "exp": "Une log-based metric transforme un motif de log en serie temporelle exploitable par Cloud Monitoring."}, {"id": "gcp:bas:Q29", "track": "gcp", "source": "Base", "num": "Q29", "section": "Domaine 4 - Supervision", "q": "Des auditeurs signalent qu'ils ne voient **aucune lecture d'objets** Cloud Storage dans les journaux d'audit. Pourquoi ?", "opts": [{"k": "A", "t": "Les logs Admin Activity sont desactives"}, {"k": "B", "t": "Les Data Access audit logs ne sont pas actives par defaut (sauf BigQuery) et doivent etre actives explicitement"}, {"k": "C", "t": "Cloud Storage ne supporte pas l'audit"}, {"k": "D", "t": "Les logs sont supprimes apres une heure"}], "ans": ["B"], "exp": "Seuls Admin Activity et System Event sont actives par defaut. Data Access doit etre active (couts a anticiper) via IAM > Audit Logs."}, {"id": "gcp:bas:Q30", "track": "gcp", "source": "Base", "num": "Q30", "section": "Domaine 4 - Supervision", "q": "Votre equipe utilise deja **Prometheus** et PromQL sur GKE et veut eviter de gerer des serveurs Prometheus. Quelle solution ?", "opts": [{"k": "A", "t": "Heberger Prometheus sur une VM"}, {"k": "B", "t": "Google Cloud Managed Service for Prometheus"}, {"k": "C", "t": "Reecrire tous les tableaux de bord dans un autre outil"}, {"k": "D", "t": "Utiliser uniquement Cloud Trace"}], "ans": ["B"], "exp": "Collecte compatible Prometheus, stockage manage, requetes PromQL, integre a Cloud Monitoring."}, {"id": "gcp:bas:Q31", "track": "gcp", "source": "Base", "num": "Q31", "section": "Domaine 5 - Performance", "q": "En production, le CPU d'un service est eleve et vous devez savoir **quelles fonctions du code** en sont responsables, avec un impact minimal sur la performance. Quel outil ?", "opts": [{"k": "A", "t": "Cloud Trace"}, {"k": "B", "t": "Cloud Profiler"}, {"k": "C", "t": "Error Reporting"}, {"k": "D", "t": "Uptime check"}], "ans": ["B"], "exp": "Profilage continu a faible surcout, par fonction. Trace montre la latence entre services (quel appel), pas quelle fonction consomme le CPU."}, {"id": "gcp:bas:Q32", "track": "gcp", "source": "Base", "num": "Q32", "section": "Domaine 5 - Performance", "q": "Une requete traverse 8 microservices et la latence globale est elevee. Comment trouver **quel service** ajoute le plus de latence ?", "opts": [{"k": "A", "t": "Cloud Profiler"}, {"k": "B", "t": "Cloud Trace (traces distribuees via OpenTelemetry)"}, {"k": "C", "t": "Cloud Billing"}, {"k": "D", "t": "IAM Recommender"}], "ans": ["B"], "exp": "Les traces montrent la decomposition en spans par service. On utilise ensuite Profiler pour descendre au niveau du code."}, {"id": "gcp:bas:Q33", "track": "gcp", "source": "Base", "num": "Q33", "section": "Domaine 5 - Performance", "q": "Un MIG demarre des VM qui mettent 4 minutes a etre pretes. L'autoscaler en ajoute beaucoup trop pendant le demarrage car il mesure des VM encore non pretes. Que configurer ?", "opts": [{"k": "A", "t": "Reduire la taille maximale du MIG a 1"}, {"k": "B", "t": "Definir une periode d'initialisation (cool-down) adaptee au temps de demarrage"}, {"k": "C", "t": "Desactiver l'autoscaler"}, {"k": "D", "t": "Utiliser des disques plus petits"}], "ans": ["B"], "exp": "La periode d'initialisation evite de prendre en compte les metriques des VM en cours de demarrage."}, {"id": "gcp:bas:Q34", "track": "gcp", "source": "Base", "num": "Q34", "section": "Domaine 5 - Performance", "q": "Des pods GKE restent en etat **Pending** car aucun noeud n'a assez de ressources. Quel composant doit resoudre cela automatiquement ?", "opts": [{"k": "A", "t": "HPA"}, {"k": "B", "t": "VPA"}, {"k": "C", "t": "Cluster Autoscaler (ou node auto-provisioning / Autopilot)"}, {"k": "D", "t": "Cloud NAT"}], "ans": ["C"], "exp": "Il ajoute des noeuds quand des pods ne peuvent pas etre planifies. HPA ajuste le nombre de replicas, VPA les requests/limits."}, {"id": "gcp:bas:Q35", "track": "gcp", "source": "Base", "num": "Q35", "section": "Domaine 5 - Performance", "q": "Un traitement batch de nuit est **tolerant aux interruptions** et doit couter le moins possible. Quelle option de compute ?", "opts": [{"k": "A", "t": "VM On-Demand standard"}, {"k": "B", "t": "Spot VMs"}, {"k": "C", "t": "Committed Use Discount sur 3 ans"}, {"k": "D", "t": "Sole-tenant nodes"}], "ans": ["B"], "exp": "Les Spot VMs offrent de fortes remises pour des charges interruptibles. Un CUD est pertinent pour une charge **continue et previsible**."}, {"id": "gcp:bas:Q36", "track": "gcp", "source": "Base", "num": "Q36", "section": "Domaine 5 - Performance", "q": "Une application web a des utilisateurs en Europe, Asie et Amerique. Le contenu statique est servi lentement. Quelle architecture reduit la latence et la charge sur l'origine ?", "opts": [{"k": "A", "t": "Un seul serveur puissant en Europe"}, {"k": "B", "t": "Load balancer global avec Cloud CDN"}, {"k": "C", "t": "Cloud VPN"}, {"k": "D", "t": "Plus de disques SSD"}], "ans": ["B"], "exp": "Anycast + cache en peripherie rapprochent le contenu des utilisateurs et soulagent l'origine."}, {"id": "gcp:ava:Q1", "track": "gcp", "source": "Avancees", "num": "Q1", "section": "A. IAM et securite", "q": "Un pipeline sur un **fork de depot public** doit etre empeche d'obtenir des identifiants GCP. Votre WIF accepte `assertion.repository_owner == \"acme\"`. Un attaquant cree un depot `acme-evil/app`. Est-il protege ?", "opts": [{"k": "A", "t": "Oui, car le proprietaire commence par \"acme\""}, {"k": "B", "t": "Oui, `repository_owner` est un nom exact et `acme-evil` != `acme` mais la condition devrait aussi restreindre le depot et la branche/environnement"}, {"k": "C", "t": "Non, l'attaquant peut usurper le proprietaire"}, {"k": "D", "t": "Non, WIF n'a pas de condition"}], "ans": ["B"], "exp": "L'egalite est exacte, donc `acme-evil` ne passe pas. Mais restreindre seulement a l'organisation autorise **tous** les depots de l'organisation (y compris un depot de test compromis). Bonne condition : `assertion.repository == \"acme/app\" && assertion.ref == \"refs/heads/main\"` (ou `environment`)."}, {"id": "gcp:ava:Q2", "track": "gcp", "source": "Avancees", "num": "Q2", "section": "A. IAM et securite", "q": "Alice a `roles/iam.serviceAccountUser` sur `sa-prod-deploy` mais pas `serviceAccountTokenCreator`. Que peut-elle faire ?", "opts": [{"k": "A", "t": "Generer un jeton d'acces pour `sa-prod-deploy` en local"}, {"k": "B", "t": "Attacher `sa-prod-deploy` a une ressource qu'elle cree (VM, Cloud Run, build) et agir ainsi avec ses droits ; mais pas generer directement de jeton"}, {"k": "C", "t": "Rien"}, {"k": "D", "t": "Supprimer le SA"}], "ans": ["B"], "exp": "`serviceAccountUser` = droit d'attachement (escalade indirecte possible si elle peut creer des ressources executant du code). `tokenCreator` = impersonation directe. Les deux sont sensibles."}, {"id": "gcp:ava:Q3", "track": "gcp", "source": "Avancees", "num": "Q3", "section": "A. IAM et securite", "q": "Une deny policy interdit `compute.instances.delete` au niveau du dossier `Prod` a tous sauf au groupe `sre-oncall`. Bob (membre de `sre-oncall`) a `roles/owner` sur un projet du dossier. Peut-il supprimer une VM ?", "opts": [{"k": "A", "t": "Non, deny l'emporte toujours"}, {"k": "B", "t": "Oui, car l'exception (`exceptionPrincipals`) l'exclut de la deny et son role Owner l'autorise"}, {"k": "C", "t": "Non, Owner ne contient pas cette permission"}, {"k": "D", "t": "Oui, mais seulement la nuit"}], "ans": ["B"], "exp": "La deny s'applique aux principaux non exceptes. Bob est excepte et l'allow Owner s'applique. Sans exception, la deny l'emporterait meme sur Owner."}, {"id": "gcp:ava:Q4", "track": "gcp", "source": "Avancees", "num": "Q4", "section": "A. IAM et securite", "q": "Une Org Policy `constraints/gcp.resourceLocations` autorise `in:eu-locations` a l'organisation. Un projet pose une policy qui autorise `in:us-locations` **sans** `inheritFromParent`. Resultat dans ce projet ?", "opts": [{"k": "A", "t": "EU et US autorises"}, {"k": "B", "t": "Seul US autorise (la policy du projet remplace celle du parent)"}, {"k": "C", "t": "Seul EU autorise"}, {"k": "D", "t": "Rien n'est autorise"}], "ans": ["B"], "exp": "Sans fusion/heritage explicite, la policy enfant remplace celle du parent. Avec `inheritFromParent: true` : EU + US. (Piege : un projet peut ainsi contourner une contrainte si on n'en protege pas l'edition.)"}, {"id": "gcp:ava:Q5", "track": "gcp", "source": "Avancees", "num": "Q5", "section": "A. IAM et securite", "q": "Pour que Cloud Build **n'utilise plus** le compte de service par defaut tres permissif, quelle approche est la meilleure ?", "opts": [{"k": "A", "t": "Retirer tous les roles du compte par defaut et esperer"}, {"k": "B", "t": "Creer un SA dedie avec moindre privilege et le specifier dans le trigger/build (`serviceAccount`), avec un bucket de logs configure"}, {"k": "C", "t": "Utiliser un compte utilisateur"}, {"k": "D", "t": "Executer les builds en local"}], "ans": ["B"], "exp": "Un SA par pipeline/fonction, droits minimaux ; ne pas oublier la configuration des logs (`CLOUD_LOGGING_ONLY` ou bucket dedie)."}, {"id": "gcp:ava:Q7", "track": "gcp", "source": "Avancees", "num": "Q7", "section": "B. CI/CD", "q": "Lisez ce `cloudbuild.yaml`. Quel est le probleme ?\n\n```yaml\nsteps:\n  - name: gcr.io/cloud-builders/docker\n    args: ['build', '-t', 'europe-west1-docker.pkg.dev/$PROJECT_ID/apps/api:$SHORT_SHA', '.']\n  - name: gcr.io/cloud-builders/docker\n    args: ['push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/apps/api:$SHORT_SHA']\n  - name: gcr.io/cloud-builders/gcloud\n    args: ['run', 'deploy', 'api', '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/apps/api:latest', '--region=europe-west1']\n```", "opts": [{"k": "A", "t": "Il manque `timeout`"}, {"k": "B", "t": "Le deploiement utilise le tag `latest` alors que l'image poussee est taggee `$SHORT_SHA` : on deploie une image inattendue / non tracable"}, {"k": "C", "t": "`$PROJECT_ID` n'est pas supporte"}, {"k": "D", "t": "Docker ne peut pas pousser vers Artifact Registry"}], "ans": ["B"], "exp": "Incoherence de tag. Bonnes pratiques : deployer par **digest ou SHA immuable**, jamais `latest` (reproductibilite, rollback). Ici le deploiement prendrait une ancienne image `latest` ou echouerait."}, {"id": "gcp:ava:Q8", "track": "gcp", "source": "Avancees", "num": "Q8", "section": "B. CI/CD", "q": "Un build doit utiliser un token npm prive. Quelle configuration est **correcte et sure** ?", "opts": [{"k": "A", "t": "`substitutions: { _NPM_TOKEN: \"abc123\" }`"}, {"k": "B", "t": "`availableSecrets.secretManager` + `secretEnv` sur l'etape concernee, avec entrypoint `bash` et `$$NPM_TOKEN`"}, {"k": "C", "t": "Le coder dans le Dockerfile"}, {"k": "D", "t": "Le passer en argument `--build-arg NPM_TOKEN=...` (visible dans l'historique de l'image)"}], "ans": ["B"], "exp": "Les secrets sont injectes en variables d'environnement a l'execution de l'etape ; le `$$` echappe pour que le shell (et non Cloud Build) fasse l'expansion. D laisse le secret dans les couches de l'image."}, {"id": "gcp:ava:Q9", "track": "gcp", "source": "Avancees", "num": "Q9", "section": "B. CI/CD", "q": "Votre pipeline doit empecher un deploiement en production si une image contient une vulnerabilite **CRITICAL** non corrigee. Quelle architecture ?", "opts": [{"k": "A", "t": "Alerte email apres deploiement"}, {"k": "B", "t": "Artifact Analysis (scan) -> une etape CI verifie le resultat et cree l'attestation seulement si OK -> Binary Authorization n'accepte que les images attestees"}, {"k": "C", "t": "Cloud Armor"}, {"k": "D", "t": "Scanner manuellement chaque semaine"}], "ans": ["B"], "exp": "Le blocage est applique a l'**admission** (shift-right enforce), l'attestation est conditionnee au scan (shift-left). Prevoir le mode dry-run et le break-glass."}, {"id": "gcp:ava:Q10", "track": "gcp", "source": "Avancees", "num": "Q10", "section": "B. CI/CD", "q": "Sur Cloud Run, une revision `v2` recoit 100 % du trafic des qu'elle est deployee. Vous voulez un deploiement qui **ne bascule jamais automatiquement**. Que faites-vous ?", "opts": [{"k": "A", "t": "`gcloud run deploy --no-traffic` puis `update-traffic` progressif apres verification (ou Cloud Deploy canary)"}, {"k": "B", "t": "Supprimer l'ancienne revision"}, {"k": "C", "t": "Desactiver l'autoscaling"}, {"k": "D", "t": "Utiliser `latest`"}], "ans": ["A"], "exp": "`--no-traffic` cree la revision sans trafic ; avec `--tag` on peut la tester via une URL dediee avant de basculer."}, {"id": "gcp:ava:Q11", "track": "gcp", "source": "Avancees", "num": "Q11", "section": "B. CI/CD", "q": "Une migration de BDD supprime une colonne utilisee par l'ancienne version. Vous voulez un deploiement **blue/green sans risque de rollback casse**. Quelle approche ?", "opts": [{"k": "A", "t": "Supprimer la colonne au meme moment que le deploiement"}, {"k": "B", "t": "Pattern expand/contract : ajouter sans casser, deployer, migrer, supprimer la colonne dans une release ulterieure"}, {"k": "C", "t": "Arreter le service pour la migration"}, {"k": "D", "t": "Forcer le rollback de la BDD"}], "ans": ["B"], "exp": "Chaque etape reste compatible N-1, donc un rollback applicatif est possible a tout moment. Une migration destructive rend le rollback impossible."}, {"id": "gcp:ava:Q12", "track": "gcp", "source": "Avancees", "num": "Q12", "section": "B. CI/CD", "q": "Dans Cloud Deploy, vous voulez que seuls certains **ingenieurs seniors** puissent promouvoir en production, mais que tous les developpeurs puissent creer des releases. Quelle approche ?", "opts": [{"k": "A", "t": "Donner `clouddeploy.admin` a tous"}, {"k": "B", "t": "`clouddeploy.releaser` aux developpeurs ; `requireApproval: true` sur la target prod ; `clouddeploy.approver` uniquement au groupe senior"}, {"k": "C", "t": "Un seul compte partage"}, {"k": "D", "t": "Desactiver l'approbation"}], "ans": ["B"], "exp": "Separation des taches : creation vs approbation. Le SA d'execution de la target prod a, lui, les droits de deploiement."}, {"id": "gcp:ava:Q13", "track": "gcp", "source": "Avancees", "num": "Q13", "section": "B. CI/CD", "q": "Le depot Docker Hub limite vos pulls (rate limit) et un package npm malveillant a un nom proche de votre package interne (**dependency confusion**). Que mettre en place dans Artifact Registry ?", "opts": [{"k": "A", "t": "Un depot standard seulement"}, {"k": "B", "t": "Des depots remote (cache de Docker Hub/npm/PyPI) et un depot virtuel avec priorites (interne d'abord) pour controler la resolution"}, {"k": "C", "t": "Rien"}, {"k": "D", "t": "Interdire npm"}], "ans": ["B"], "exp": "Le remote evite les rate limits et fournit un point de controle ; le virtuel avec priorites empeche qu'un package public ecrase un package interne."}, {"id": "gcp:ava:Q14", "track": "gcp", "source": "Avancees", "num": "Q14", "section": "B. CI/CD", "q": "`terraform apply` s'execute dans Cloud Build avec le SA `tf-apply` tres puissant. Comment reduire le risque ? *(choisir 2)*", "opts": [{"k": "A", "t": "Declencher l'apply uniquement depuis `main` avec approbation de build requise"}, {"k": "B", "t": "Donner `roles/owner` pour eviter les erreurs"}, {"k": "C", "t": "Utiliser un SA different pour `plan` (lecture) et `apply` (ecriture)"}, {"k": "D", "t": "Executer Terraform sur le poste de chaque developpeur"}], "ans": ["A", "C"], "exp": "Approbation + separation plan/apply. B et D augmentent le risque."}, {"id": "gcp:ava:Q15", "track": "gcp", "source": "Avancees", "num": "Q15", "section": "C. SRE et calculs", "q": "SLO : 99,95 % sur 30 jours, trafic de 20 M requetes. Combien de requetes en erreur sont **autorisees** ?", "opts": [{"k": "A", "t": "1 000"}, {"k": "B", "t": "10 000"}, {"k": "C", "t": "100 000"}, {"k": "D", "t": "20 000"}], "ans": ["B"], "exp": "`0,0005 x 20 000 000 = 10 000`."}, {"id": "gcp:ava:Q16", "track": "gcp", "source": "Avancees", "num": "Q16", "section": "C. SRE et calculs", "q": "SLO 99,9 % sur 30 jours. Pendant 30 minutes, 20 % des requetes echouent. Quelle part du budget est consommee ?", "opts": [{"k": "A", "t": "20 %"}, {"k": "B", "t": "Environ 13,9 %"}, {"k": "C", "t": "50 %"}, {"k": "D", "t": "1 %"}], "ans": ["B"], "exp": "Burn rate = `0,20 / 0,001 = 200`. Budget consomme = `burn x duree / fenetre = 200 x 0,5 h / 720 h = 13,9 %`."}, {"id": "gcp:ava:Q17", "track": "gcp", "source": "Avancees", "num": "Q17", "section": "C. SRE et calculs", "q": "Meme SLO (99,9 %/30 j). Un taux d'erreur **constant de 0,6 %** depuis 12 heures. Quel burn rate et que faire ?", "opts": [{"k": "A", "t": "Burn rate 0,6 : rien"}, {"k": "B", "t": "Burn rate 6 : correspond a la condition \"6 h / 30 min\" => page"}, {"k": "C", "t": "Burn rate 60 : incident majeur"}, {"k": "D", "t": "Burn rate 1 : ticket"}], "ans": ["B"], "exp": "`0,006 / 0,001 = 6`. A ce rythme, 5 % du budget part en 6 h : alerte de page. Si le taux continue 12 h, 10 % du budget est deja consomme."}, {"id": "gcp:ava:Q18", "track": "gcp", "source": "Avancees", "num": "Q18", "section": "C. SRE et calculs", "q": "Votre service depend de 3 services critiques, chacun a 99,9 %, appeles en serie sans degradation. Quelle est la disponibilite maximale theorique ?", "opts": [{"k": "A", "t": "99,9 %"}, {"k": "B", "t": "~99,7 % (0,999^3)"}, {"k": "C", "t": "99,99 %"}, {"k": "D", "t": "99,0 %"}], "ans": ["B"], "exp": "Produit des disponibilites. Votre SLO de 99,9 % est irrealiste sans redondance ou degradation gracieuse."}, {"id": "gcp:ava:Q19", "track": "gcp", "source": "Avancees", "num": "Q19", "section": "C. SRE et calculs", "q": "Pour rendre un SLO de 99,95 % realiste malgre une dependance a 99,9 %, quelle strategie est la plus efficace ?", "opts": [{"k": "A", "t": "Baisser le SLO a 99,9 %"}, {"k": "B", "t": "Rendre la dependance non critique (cache, mode degrade, appel asynchrone) ou ajouter de la redondance"}, {"k": "C", "t": "Doubler les timeouts"}, {"k": "D", "t": "Supprimer les alertes"}], "ans": ["B"], "exp": "Decoupler le chemin critique de la dependance (ou la dupliquer) releve le plafond. Baisser le SLO (A) est une option de negociation, pas une solution technique."}, {"id": "gcp:ava:Q20", "track": "gcp", "source": "Avancees", "num": "Q20", "section": "C. SRE et calculs", "q": "Une equipe a 6 mois sans incident et 90 % de budget d'erreur **inutilise**. Quelle conclusion SRE ?", "opts": [{"k": "A", "t": "Parfait, ne rien changer"}, {"k": "B", "t": "Le SLO est probablement trop strict : on peut prendre plus de risque (releases plus rapides, experimentation) ou revoir l'objectif"}, {"k": "C", "t": "Il faut embaucher"}, {"k": "D", "t": "Supprimer la supervision"}], "ans": ["B"], "exp": "Un budget jamais utilise signale une prudence excessive : l'objectif est d'**utiliser** le budget pour innover."}, {"id": "gcp:ava:Q21", "track": "gcp", "source": "Avancees", "num": "Q21", "section": "C. SRE et calculs", "q": "Lors d'un incident SEV1, l'IC remarque que deux ingenieurs modifient la meme configuration simultanement avec des actions contradictoires. Que fait l'IC ?", "opts": [{"k": "A", "t": "Rien, ils savent ce qu'ils font"}, {"k": "B", "t": "Rappeler que seul l'Operations Lead modifie la production, redistribuer les roles et faire annoncer chaque action dans le canal"}, {"k": "C", "t": "Prendre le clavier lui-meme"}, {"k": "D", "t": "Clore l'incident"}], "ans": ["B"], "exp": "Les actions concurrentes aggravent les incidents ; un seul point de changement et un journal des actions."}, {"id": "gcp:ava:Q22", "track": "gcp", "source": "Avancees", "num": "Q22", "section": "C. SRE et calculs", "q": "Quel element est **le plus important** dans un postmortem ?", "opts": [{"k": "A", "t": "Le nom du fautif"}, {"k": "B", "t": "Des actions correctives concretes, assignees, datees et suivies"}, {"k": "C", "t": "Un long recit chronologique"}, {"k": "D", "t": "Le cout financier uniquement"}], "ans": ["B"], "exp": "Sans actions suivies, les incidents se repetent. Le recit et l'impact sont necessaires mais ne protegent de rien en eux-memes."}, {"id": "gcp:ava:Q23", "track": "gcp", "source": "Avancees", "num": "Q23", "section": "D. Observabilite", "q": "Votre sink agrege d'organisation vers BigQuery ne contient aucune ligne depuis 2 jours. Aucune erreur visible. Cause **la plus probable** ?", "opts": [{"k": "A", "t": "BigQuery est en panne"}, {"k": "B", "t": "La `writer_identity` du sink n'a pas le role (ex. `roles/bigquery.dataEditor`) sur le dataset de destination"}, {"k": "C", "t": "Les logs sont desactives"}, {"k": "D", "t": "Le filtre est trop large"}], "ans": ["B"], "exp": "Erreur classique : creer le sink sans accorder a son identite d'ecriture le droit sur la destination. Verifier la metrique `logging.googleapis.com/exports/error_count`."}, {"id": "gcp:ava:Q24", "track": "gcp", "source": "Avancees", "num": "Q24", "section": "D. Observabilite", "q": "Vous voulez une alerte quand une chaine d'erreur precise apparait, **sans creer de metrique** intermediaire. Option ?", "opts": [{"k": "A", "t": "Uptime check"}, {"k": "B", "t": "Alerte basee sur les journaux (log-based alert / log match)"}, {"k": "C", "t": "Error Reporting uniquement"}, {"k": "D", "t": "Trace"}], "ans": ["B"], "exp": "Alerte de type \"log match\" avec filtre et limite de notifications. Pour des seuils de frequence, preferer une log-based metric."}, {"id": "gcp:ava:Q25", "track": "gcp", "source": "Avancees", "num": "Q25", "section": "D. Observabilite", "q": "Un dashboard Monitoring est tres lent et la facture de metriques explose apres l'ajout d'un label `user_id` sur une metrique personnalisee. Pourquoi ?", "opts": [{"k": "A", "t": "Bug de Monitoring"}, {"k": "B", "t": "Cardinalite explosive : chaque `user_id` cree une serie temporelle distincte"}, {"k": "C", "t": "Les labels sont interdits"}, {"k": "D", "t": "Trop de dashboards"}], "ans": ["B"], "exp": "Eviter les labels non bornes ; mettre ces details dans les **logs/traces**."}, {"id": "gcp:ava:Q26", "track": "gcp", "source": "Avancees", "num": "Q26", "section": "D. Observabilite", "q": "Vous voulez une alerte de burn rate **rapide mais sans faux positifs**. Quelle configuration ?", "opts": [{"k": "A", "t": "Une seule condition : taux d'erreur > 0 sur 1 min"}, {"k": "B", "t": "Deux fenetres : longue (ex. 1 h) ET courte (ex. 5 min) sur le meme burn rate (14,4)"}, {"k": "C", "t": "Seuil CPU"}, {"k": "D", "t": "Alerte hebdomadaire"}], "ans": ["B"], "exp": "La fenetre longue confirme que c'est significatif ; la courte permet a l'alerte de **s'eteindre vite** quand le probleme est resolu."}, {"id": "gcp:ava:Q27", "track": "gcp", "source": "Avancees", "num": "Q27", "section": "D. Observabilite", "q": "Vous devez isoler les logs de l'equipe Paiement : ils ne doivent etre visibles que par cette equipe, sans dupliquer les donnees. Quelle fonction ?", "opts": [{"k": "A", "t": "Un projet par equipe obligatoirement"}, {"k": "B", "t": "Log views sur un log bucket + IAM sur la vue"}, {"k": "C", "t": "Export BigQuery"}, {"k": "D", "t": "Desactiver les logs des autres equipes"}], "ans": ["B"], "exp": "Les vues donnent acces a un sous-ensemble de logs d'un bucket, controle par IAM."}, {"id": "gcp:ava:Q28", "track": "gcp", "source": "Avancees", "num": "Q28", "section": "D. Observabilite", "q": "Pour tracer des requetes a travers 12 microservices dont certains sont dans des langages differents, quelle approche ?", "opts": [{"k": "A", "t": "Un logger maison"}, {"k": "B", "t": "OpenTelemetry avec propagation du contexte (`traceparent`) + export vers Cloud Trace, echantillonnage adapte"}, {"k": "C", "t": "Cloud Profiler"}, {"k": "D", "t": "Uptime checks"}], "ans": ["B"], "exp": "Standard independant du langage ; le contexte doit etre propage a chaque saut."}, {"id": "gcp:ava:Q29", "track": "gcp", "source": "Avancees", "num": "Q29", "section": "E. GKE et performance", "q": "HPA cible CPU 50 %. 5 pods, utilisation moyenne 80 %. Combien de replicas voulus ?", "opts": [{"k": "A", "t": "6"}, {"k": "B", "t": "8"}, {"k": "C", "t": "10"}, {"k": "D", "t": "5"}], "ans": ["B"], "exp": "`ceil(5 x 80/50) = ceil(8) = 8`."}, {"id": "gcp:ava:Q30", "track": "gcp", "source": "Avancees", "num": "Q30", "section": "E. GKE et performance", "q": "Un Deployment a `maxSurge: 25%`, `maxUnavailable: 0`, 8 replicas. Combien de pods maximum existent pendant la mise a jour et combien sont au minimum disponibles ?", "opts": [{"k": "A", "t": "10 max, 8 min"}, {"k": "B", "t": "8 max, 6 min"}, {"k": "C", "t": "12 max, 6 min"}, {"k": "D", "t": "9 max, 7 min"}], "ans": ["A"], "exp": "`maxSurge 25 % de 8 = 2` (arrondi vers le haut) => 10 pods max ; `maxUnavailable 0` => 8 toujours disponibles."}, {"id": "gcp:ava:Q31", "track": "gcp", "source": "Avancees", "num": "Q31", "section": "E. GKE et performance", "q": "Des pods sont `OOMKilled` regulierement alors que le noeud a de la memoire libre. Cause ?", "opts": [{"k": "A", "t": "Le noeud est defectueux"}, {"k": "B", "t": "La limite memoire du conteneur (`limits.memory`) est depassee : le noyau tue le conteneur meme si le noeud a de la memoire libre"}, {"k": "C", "t": "Probleme reseau"}, {"k": "D", "t": "HPA mal configure"}], "ans": ["B"], "exp": "Solution : mesurer l'usage reel (Profiler/metriques), ajuster requests/limits, corriger la fuite."}, {"id": "gcp:com:Q1", "track": "gcp", "source": "Complementaires", "num": "Q1", "section": "Domaine 2 - CI/CD et supply chain", "q": "Vous voulez que **seules les images construites par votre pipeline Cloud Build** puissent etre deployees sur GKE en production. Quelle solution ?", "opts": [{"k": "A", "t": "Restreindre l'acces en ecriture a Artifact Registry"}, {"k": "B", "t": "Activer Container Analysis pour scanner les vulnerabilites"}, {"k": "C", "t": "Activer Binary Authorization avec une politique exigeant une attestation signee par le pipeline"}, {"k": "D", "t": "Utiliser des noms d'image avec le tag `prod`"}], "ans": ["C"], "exp": "Binary Authorization verifie a l'admission que l'image porte les attestations requises (signees par Cloud Build apres tests). A limite qui pousse, pas ce qui est deploye ; B detecte mais ne bloque pas ; D n'est pas un controle."}, {"id": "gcp:com:Q2", "track": "gcp", "source": "Complementaires", "num": "Q2", "section": "Domaine 2 - CI/CD et supply chain", "q": "Une application doit etre promue automatiquement de `dev` vers `staging`, puis **apres approbation manuelle** vers `prod`, avec un historique de releases. Quel service ?", "opts": [{"k": "A", "t": "Cloud Scheduler"}, {"k": "B", "t": "Cloud Deploy (delivery pipeline avec cibles et approbation)"}, {"k": "C", "t": "Cloud Functions declenchee par Pub/Sub"}, {"k": "D", "t": "Un script Bash dans Cloud Build"}], "ans": ["B"], "exp": "Cloud Deploy modelise une progression de cibles, des approbations, des rollbacks et un historique. D est faisable mais sans ces fonctions natives."}, {"id": "gcp:com:Q3", "track": "gcp", "source": "Complementaires", "num": "Q3", "section": "Domaine 2 - CI/CD et supply chain", "q": "Un deploiement Cloud Run doit envoyer **5 % du trafic** vers la nouvelle revision, puis augmenter si les metriques sont bonnes. Que faites-vous ?", "opts": [{"k": "A", "t": "Deployer la nouvelle revision avec `--no-traffic`, puis repartir le trafic avec `gcloud run services update-traffic`"}, {"k": "B", "t": "Creer deux services et utiliser Cloud DNS"}, {"k": "C", "t": "Utiliser un Load Balancer externe pour chaque revision"}, {"k": "D", "t": "Impossible sur Cloud Run"}], "ans": ["A"], "exp": "Cloud Run gere nativement la repartition du trafic par revision (canary, rollback instantane). Les autres options ajoutent de la complexite inutile."}, {"id": "gcp:com:Q4", "track": "gcp", "source": "Complementaires", "num": "Q4", "section": "Domaine 2 - CI/CD et supply chain", "q": "Vos builds Cloud Build doivent atteindre une base de donnees **sans IP publique** dans un VPC. Que faire ?", "opts": [{"k": "A", "t": "Ouvrir la base a Internet avec une liste d'IP autorisees"}, {"k": "B", "t": "Utiliser un private pool Cloud Build connecte au VPC"}, {"k": "C", "t": "Executer le build en local"}, {"k": "D", "t": "Donner le role Owner au compte de service Cloud Build"}], "ans": ["B"], "exp": "Les private pools executent les builds dans un reseau peered avec votre VPC. A affaiblit la securite, D n'aide pas le reseau."}, {"id": "gcp:com:Q5", "track": "gcp", "source": "Complementaires", "num": "Q5", "section": "Domaine 3 - SRE", "q": "Un service a un SLO de **99,9 %** de disponibilite sur 30 jours. Quel est le **budget d'erreur** en indisponibilite ?", "opts": [{"k": "A", "t": "Environ 4,3 minutes"}, {"k": "B", "t": "Environ 43 minutes"}, {"k": "C", "t": "Environ 7 heures"}, {"k": "D", "t": "Environ 72 heures"}], "ans": ["B"], "exp": "30 j x 24 h x 60 min = 43 200 min ; 0,1 % = **43,2 min**. (99,99 % donnerait ~4,3 min ; 99 % ~7,2 h.)"}, {"id": "gcp:com:Q6", "track": "gcp", "source": "Complementaires", "num": "Q6", "section": "Domaine 3 - SRE", "q": "Le budget d'erreur du trimestre est **epuise** alors que l'equipe produit veut livrer de nouvelles fonctions. Que dit l'approche SRE ?", "opts": [{"k": "A", "t": "Livrer quand meme, les clients comprendront"}, {"k": "B", "t": "Geler les deploiements de fonctionnalites et prioriser la fiabilite jusqu'au retour dans le budget"}, {"k": "C", "t": "Baisser le SLO pour remettre le budget a positif"}, {"k": "D", "t": "Supprimer les alertes"}], "ans": ["B"], "exp": "La politique de budget d'erreur lie vitesse et fiabilite. C (modifier le SLO apres coup) masque le probleme, sauf revue legitime du SLO."}, {"id": "gcp:com:Q7", "track": "gcp", "source": "Complementaires", "num": "Q7", "section": "Domaine 3 - SRE", "q": "Quelle alerte detecte le mieux un **epuisement rapide** du budget d'erreur tout en limitant les faux positifs ?", "opts": [{"k": "A", "t": "Alerte sur chaque erreur 5xx"}, {"k": "B", "t": "Alerte sur un seuil CPU > 80 %"}, {"k": "C", "t": "Alerte basee sur le burn rate avec fenetres multiples (courte et longue)"}, {"k": "D", "t": "Alerte sur la latence moyenne"}], "ans": ["C"], "exp": "Le burn rate mesure la vitesse de consommation du budget ; combiner une fenetre courte (reactivite) et longue (fiabilite) reduit le bruit. Les symptomes pour l'utilisateur priment sur les causes (CPU)."}, {"id": "gcp:com:Q8", "track": "gcp", "source": "Complementaires", "num": "Q8", "section": "Domaine 3 - SRE", "q": "Laquelle est un exemple de **toil** ?", "opts": [{"k": "A", "t": "Ecrire un outil qui automatise le renouvellement des certificats"}, {"k": "B", "t": "Redemarrer manuellement chaque semaine le meme service qui fuit en memoire"}, {"k": "C", "t": "Rediger un postmortem"}, {"k": "D", "t": "Concevoir un nouveau SLO"}], "ans": ["B"], "exp": "Le toil est manuel, repetitif, automatisable, sans valeur durable et croit avec le service. A est de l'ingenierie qui reduit le toil."}, {"id": "gcp:com:Q9", "track": "gcp", "source": "Complementaires", "num": "Q9", "section": "Domaine 3 - SRE", "q": "Apres un incident majeur, quelle pratique de postmortem est recommandee ?", "opts": [{"k": "A", "t": "Identifier la personne fautive pour la sanctionner"}, {"k": "B", "t": "Ne documenter que le correctif"}, {"k": "C", "t": "Postmortem sans blame : chronologie, causes racines, impact, actions suivies avec responsables"}, {"k": "D", "t": "Garder le document confidentiel dans l'equipe d'astreinte"}], "ans": ["C"], "exp": "L'objectif est d'apprendre et d'ameliorer les systemes ; le blame decourage la transparence. Les actions doivent etre suivies jusqu'a cloture."}, {"id": "gcp:com:Q10", "track": "gcp", "source": "Complementaires", "num": "Q10", "section": "Domaine 3 - SRE", "q": "Quels SLI choisir pour un **pipeline de traitement de donnees par lots** ? *(choisir 2)*", "opts": [{"k": "A", "t": "Fraicheur des donnees"}, {"k": "B", "t": "Taux de requetes HTTP 200"}, {"k": "C", "t": "Debit / proportion d'enregistrements traites correctement"}, {"k": "D", "t": "Utilisation CPU moyenne"}], "ans": ["A", "C"], "exp": "Pour le batch : fraicheur, exactitude/couverture, debit. Disponibilite/latence de requetes conviennent aux services interactifs ; la CPU est une metrique de ressource, pas un SLI utilisateur."}, {"id": "gcp:com:Q11", "track": "gcp", "source": "Complementaires", "num": "Q11", "section": "Domaine 4 - Supervision", "q": "Vous devez surveiller **plusieurs projets** depuis un seul tableau de bord Cloud Monitoring. Que configurer ?", "opts": [{"k": "A", "t": "Un export manuel de metriques vers chaque projet"}, {"k": "B", "t": "Une portee de metriques (metrics scope) dans un projet de supervision incluant les autres projets"}, {"k": "C", "t": "Un compte de service par projet"}, {"k": "D", "t": "Impossible"}], "ans": ["B"], "exp": "Le projet hote du metrics scope peut lire les metriques des projets surveilles et centraliser tableaux de bord et alertes."}, {"id": "gcp:com:Q12", "track": "gcp", "source": "Complementaires", "num": "Q12", "section": "Domaine 4 - Supervision", "q": "Vous devez garder les logs d'audit **7 ans** au moindre cout, sans besoin de requetes frequentes. Quelle destination de sink ?", "opts": [{"k": "A", "t": "BigQuery"}, {"k": "B", "t": "Pub/Sub"}, {"k": "C", "t": "Cloud Storage (classe Archive / Coldline avec retention)"}, {"k": "D", "t": "Cloud Logging avec retention 30 jours"}], "ans": ["C"], "exp": "Pour de l'archivage long et peu consulte, Cloud Storage est le plus economique (avec bucket lock si exigence reglementaire). BigQuery convient a l'analyse SQL."}, {"id": "gcp:com:Q13", "track": "gcp", "source": "Complementaires", "num": "Q13", "section": "Domaine 4 - Supervision", "q": "Un service est lent en production et vous voulez savoir **quelle fonction consomme le plus de CPU**, avec un faible surcout. Quel outil ?", "opts": [{"k": "A", "t": "Cloud Trace"}, {"k": "B", "t": "Cloud Profiler"}, {"k": "C", "t": "Error Reporting"}, {"k": "D", "t": "Uptime checks"}], "ans": ["B"], "exp": "Cloud Profiler fait du profilage continu (CPU, tas) en production. Trace montre la latence par requete/appel distribue ; Error Reporting regroupe les exceptions."}, {"id": "gcp:com:Q14", "track": "gcp", "source": "Complementaires", "num": "Q14", "section": "Domaine 4 - Supervision", "q": "Votre facture Cloud Logging est elevee a cause de logs de debug tres verbeux et inutiles. Quelle action reduit le cout **sans modifier le code** ?", "opts": [{"k": "A", "t": "Desactiver Cloud Monitoring"}, {"k": "B", "t": "Ajouter un filtre d'exclusion sur le routeur de logs (sink `_Default`)"}, {"k": "C", "t": "Passer les VM a un type plus petit"}, {"k": "D", "t": "Supprimer le projet"}], "ans": ["B"], "exp": "Les exclusions evitent de stocker les logs correspondants (les logs d'audit des activites d'administration ne peuvent pas etre exclus). Le meilleur levier reste de reduire le niveau de log applicatif."}, {"id": "gcp:com:Q15", "track": "gcp", "source": "Complementaires", "num": "Q15", "section": "Domaine 4 - Supervision", "q": "Vous collectez des metriques **Prometheus** depuis GKE et voulez eviter d'exploiter votre propre serveur Prometheus. Que choisir ?", "opts": [{"k": "A", "t": "Installer Prometheus sur un noeud"}, {"k": "B", "t": "Google Cloud Managed Service for Prometheus"}, {"k": "C", "t": "Exporter vers un fichier CSV"}, {"k": "D", "t": "Utiliser uniquement des logs"}], "ans": ["B"], "exp": "Service gere, compatible PromQL, sans operations de stockage a assurer."}, {"id": "gcp:com:Q16", "track": "gcp", "source": "Complementaires", "num": "Q16", "section": "Domaine 5 - Performance et cout", "q": "Une charge GKE tres variable ; l'equipe ne veut **pas gerer les noeuds** et paye a la ressource demandee par les pods. Quel mode ?", "opts": [{"k": "A", "t": "GKE Standard avec noeuds preemptibles"}, {"k": "B", "t": "GKE Autopilot"}, {"k": "C", "t": "Compute Engine avec MIG"}, {"k": "D", "t": "App Engine Flexible"}], "ans": ["B"], "exp": "Autopilot gere les noeuds et facture les ressources des pods. Standard donne plus de controle mais plus d'exploitation."}, {"id": "az:bas:Q1", "track": "az", "source": "Base", "num": "Q1", "section": "Domaine 1 - Identite, gouvernance et supervision", "q": "Des employes d'un partenaire doivent acceder a votre application d'entreprise avec **leurs propres identifiants** d'entreprise, sans que vous creiez de comptes avec mot de passe. Quelle solution ?", "opts": [{"k": "A", "t": "Creer des comptes locaux dans votre tenant"}, {"k": "B", "t": "Microsoft Entra B2B (utilisateurs invites)"}, {"k": "C", "t": "Entra Domain Services"}, {"k": "D", "t": "Azure AD Connect"}], "ans": ["B"], "exp": "B2B invite des utilisateurs externes qui s'authentifient aupres de leur propre fournisseur d'identite."}, {"id": "az:bas:Q2", "track": "az", "source": "Base", "num": "Q2", "section": "Domaine 1 - Identite, gouvernance et supervision", "q": "Vous lancez une application grand public. Les clients doivent s'inscrire avec Google, Facebook ou un email, avec des parcours d'inscription personnalises. Quelle solution ?", "opts": [{"k": "A", "t": "Entra B2B"}, {"k": "B", "t": "Entra Connect Sync"}, {"k": "C", "t": "Entra External ID (Azure AD B2C)"}, {"k": "D", "t": "Entra Domain Services"}], "ans": ["C"], "exp": "Le service d'identites clients (CIAM) gere inscription, connexion sociale et flux personnalises. B2B est pour les partenaires."}, {"id": "az:bas:Q3", "track": "az", "source": "Base", "num": "Q3", "section": "Domaine 1 - Identite, gouvernance et supervision", "q": "Les administrateurs ne doivent avoir des droits Contributor sur la production que **pendant 2 heures, apres approbation et justification**. Quelle fonction ?", "opts": [{"k": "A", "t": "Conditional Access"}, {"k": "B", "t": "Access reviews"}, {"k": "C", "t": "Privileged Identity Management (PIM)"}, {"k": "D", "t": "Azure Policy"}], "ans": ["C"], "exp": "PIM fournit l'activation juste-a-temps des roles *eligibles* avec approbation, justification, duree limitee et audit."}, {"id": "az:bas:Q4", "track": "az", "source": "Base", "num": "Q4", "section": "Domaine 1 - Identite, gouvernance et supervision", "q": "Une application sur une VM Azure doit lire des secrets dans Key Vault **sans stocker d'identifiants**. Trois autres VM identiques auront les memes droits. Que concevez-vous ?", "opts": [{"k": "A", "t": "Un service principal avec secret stocke dans un fichier de config"}, {"k": "B", "t": "Une managed identity user-assigned partagee par les 4 VM"}, {"k": "C", "t": "Une cle d'acces de compte de stockage"}, {"k": "D", "t": "Des identifiants utilisateur d'un administrateur"}], "ans": ["B"], "exp": "Une identite user-assigned est partageable entre plusieurs ressources (une seule attribution RBAC a gerer). System-assigned conviendrait a une seule ressource."}, {"id": "az:bas:Q5", "track": "az", "source": "Base", "num": "Q5", "section": "Domaine 1 - Identite, gouvernance et supervision", "q": "Vous synchronisez Active Directory on-premise avec Entra ID. Exigences : **haute disponibilite de l'authentification meme si le on-prem est hors ligne**, deploiement minimal. Quelle methode ?", "opts": [{"k": "A", "t": "Federation AD FS"}, {"k": "B", "t": "Pass-through Authentication"}, {"k": "C", "t": "Password Hash Synchronization (+ Seamless SSO)"}, {"k": "D", "t": "Authentification locale uniquement"}], "ans": ["C"], "exp": "PHS ne depend pas du on-prem au moment de la connexion. PTA et AD FS dependent d'agents/serveurs on-prem disponibles."}, {"id": "az:bas:Q6", "track": "az", "source": "Base", "num": "Q6", "section": "Domaine 1 - Identite, gouvernance et supervision", "q": "Une entreprise utilise des **cartes a puce** et un fournisseur MFA tiers existant avec AD FS pour l'authentification. Que choisir pour l'identite hybride ?", "opts": [{"k": "A", "t": "Password Hash Sync"}, {"k": "B", "t": "Federation avec AD FS"}, {"k": "C", "t": "Pass-through Authentication"}, {"k": "D", "t": "Cloud-only"}], "ans": ["B"], "exp": "La federation permet de conserver ces exigences specifiques (cartes a puce, MFA tiers), au prix d'une infrastructure plus lourde."}, {"id": "az:bas:Q7", "track": "az", "source": "Base", "num": "Q7", "section": "Domaine 1 - Identite, gouvernance et supervision", "q": "Vous devez exiger le **MFA** pour tout acces depuis l'exterieur du reseau d'entreprise a Microsoft 365. Quelle solution ?", "opts": [{"k": "A", "t": "NSG"}, {"k": "B", "t": "Azure Firewall"}, {"k": "C", "t": "Conditional Access"}, {"k": "D", "t": "Azure Policy"}], "ans": ["C"], "exp": "Conditional Access evalue les signaux (emplacement, appareil, risque) et applique des controles comme le MFA."}, {"id": "az:bas:Q8", "track": "az", "source": "Base", "num": "Q8", "section": "Domaine 1 - Identite, gouvernance et supervision", "q": "Chaque trimestre, les proprietaires de ressources doivent **confirmer que les membres de groupes privilegies ont encore besoin d'acces**. Quelle fonction ?", "opts": [{"k": "A", "t": "PIM alerts"}, {"k": "B", "t": "Access reviews (Entra ID Governance)"}, {"k": "C", "t": "Azure Monitor"}, {"k": "D", "t": "Resource Graph"}], "ans": ["B"], "exp": "Les access reviews automatisent les revues periodiques et retirent les acces non confirmes."}, {"id": "az:bas:Q9", "track": "az", "source": "Base", "num": "Q9", "section": "Domaine 1 - Identite, gouvernance et supervision", "q": "Vous devez stocker des cles de chiffrement dans un **HSM dedie, mono-locataire, FIPS 140-3 Level 3**, avec controle total du domaine de securite. Quel service ?", "opts": [{"k": "A", "t": "Key Vault Standard"}, {"k": "B", "t": "Key Vault Premium"}, {"k": "C", "t": "Azure Key Vault Managed HSM"}, {"k": "D", "t": "Un compte de stockage chiffre"}], "ans": ["C"], "exp": "Managed HSM est un service HSM mono-locataire hautement disponible. Premium utilise des HSM multi-locataires."}, {"id": "az:bas:Q10", "track": "az", "source": "Base", "num": "Q10", "section": "Domaine 1 - Identite, gouvernance et supervision", "q": "Toutes les ressources de tous les abonnements doivent etre deployees **uniquement en France Central et West Europe**, et un tag `CostCenter` doit etre ajoute automatiquement s'il manque. Que concevoir ?", "opts": [{"k": "A", "t": "Role RBAC personnalise"}, {"k": "B", "t": "Azure Policy au niveau management group : *Allowed locations* (Deny) + *Modify* pour le tag"}, {"k": "C", "t": "Resource locks"}, {"k": "D", "t": "NSG"}], "ans": ["B"], "exp": "Policy definit ce qui est autorise ; Deny pour les regions, Modify/Append pour les tags, avec heritage depuis le management group. RBAC ne controle que qui peut agir."}, {"id": "az:bas:Q11", "track": "az", "source": "Base", "num": "Q11", "section": "Domaine 1 - Identite, gouvernance et supervision", "q": "Pour eviter la **suppression accidentelle** d'un groupe de ressources de production tout en permettant les modifications, que faites-vous ?", "opts": [{"k": "A", "t": "Lock ReadOnly"}, {"k": "B", "t": "Lock CanNotDelete"}, {"k": "C", "t": "Retirer tous les droits"}, {"k": "D", "t": "Un tag \"ne pas supprimer\""}], "ans": ["B"], "exp": "CanNotDelete autorise lecture et modification mais interdit la suppression. ReadOnly bloquerait aussi les modifications."}, {"id": "az:bas:Q12", "track": "az", "source": "Base", "num": "Q12", "section": "Domaine 1 - Identite, gouvernance et supervision", "q": "Vous gerez 40 abonnements et voulez appliquer les memes politiques et attributions RBAC a des groupes d'abonnements (Production, Non-production). Que concevoir ?", "opts": [{"k": "A", "t": "Un abonnement unique"}, {"k": "B", "t": "Une hierarchie de management groups"}, {"k": "C", "t": "Un groupe de ressources par abonnement"}, {"k": "D", "t": "Des tags"}], "ans": ["B"], "exp": "Les management groups heritent politiques et RBAC vers les abonnements, base de l'architecture Landing Zone."}, {"id": "az:bas:Q13", "track": "az", "source": "Base", "num": "Q13", "section": "Domaine 1 - Identite, gouvernance et supervision", "q": "Plusieurs applications dans trois regions envoient leurs journaux. Exigence : correlation entre applications, administration simple, et **donnees des clients europeens qui doivent rester en Europe**. Quelle conception de Log Analytics ?", "opts": [{"k": "A", "t": "Un workspace unique aux Etats-Unis"}, {"k": "B", "t": "Un workspace par application"}, {"k": "C", "t": "Un workspace centralise par frontiere de residence des donnees (ex. un en Europe, un autre ailleurs)"}, {"k": "D", "t": "Pas de workspace : stockage local"}], "ans": ["C"], "exp": "On centralise au maximum (simplicite, correlation) mais on separe quand la residence des donnees l'exige."}, {"id": "az:bas:Q14", "track": "az", "source": "Base", "num": "Q14", "section": "Domaine 1 - Identite, gouvernance et supervision", "q": "Vous voulez surveiller les performances d'une application web, tracer les dependances (SQL, API) et voir les exceptions avec une carte d'application. Quel service ?", "opts": [{"k": "A", "t": "Network Watcher"}, {"k": "B", "t": "Application Insights"}, {"k": "C", "t": "Azure Advisor"}, {"k": "D", "t": "Service Health"}], "ans": ["B"], "exp": "Application Insights est l'APM d'Azure Monitor (requetes, dependances, exceptions, application map)."}, {"id": "az:bas:Q15", "track": "az", "source": "Base", "num": "Q15", "section": "Domaine 2 - Stockage de donnees", "q": "Un compte de stockage doit **survivre a la perte d'une zone ET d'une region entiere**, avec **acces en lecture** a la region secondaire. Quelle redondance ?", "opts": [{"k": "A", "t": "LRS"}, {"k": "B", "t": "ZRS"}, {"k": "C", "t": "GRS"}, {"k": "D", "t": "RA-GZRS"}], "ans": ["D"], "exp": "GZRS = ZRS en primaire + copie dans la region jumelee ; le prefixe RA ajoute la lecture secondaire."}, {"id": "az:bas:Q16", "track": "az", "source": "Base", "num": "Q16", "section": "Domaine 2 - Stockage de donnees", "q": "Des documents reglementaires doivent etre conserves 7 ans, **non modifiables et non supprimables**, au cout le plus bas possible. Que concevez-vous ?", "opts": [{"k": "A", "t": "Blob Hot avec RBAC"}, {"k": "B", "t": "Stockage immuable (time-based retention, WORM) + lifecycle vers le niveau Archive"}, {"k": "C", "t": "Azure Files"}, {"k": "D", "t": "Disques manages"}], "ans": ["B"], "exp": "L'immutabilite impose WORM ; le niveau Archive minimise le cout du stockage froid."}, {"id": "az:bas:Q17", "track": "az", "source": "Base", "num": "Q17", "section": "Domaine 2 - Stockage de donnees", "q": "Une application mondiale necessite des **ecritures locales dans plusieurs regions** avec des latences monocouche de ms et un schema JSON flexible. Quel service ?", "opts": [{"k": "A", "t": "Azure SQL Database avec geo-replication"}, {"k": "B", "t": "Azure Cosmos DB (API NoSQL) avec multi-region writes"}, {"k": "C", "t": "Table Storage"}, {"k": "D", "t": "SQL Server sur VM"}], "ans": ["B"], "exp": "Cosmos DB est distribue globalement, avec ecritures multi-regions et SLA de latence."}, {"id": "az:bas:Q18", "track": "az", "source": "Base", "num": "Q18", "section": "Domaine 2 - Stockage de donnees", "q": "Dans Cosmos DB, une application veut garantir qu'**un utilisateur lit toujours ses propres ecritures**, avec le meilleur compromis latence/coherence. Quel niveau ?", "opts": [{"k": "A", "t": "Strong"}, {"k": "B", "t": "Eventual"}, {"k": "C", "t": "Session"}, {"k": "D", "t": "Consistent prefix"}], "ans": ["C"], "exp": "Session (niveau par defaut) garantit \"read your writes\" dans une session, avec de bonnes performances."}, {"id": "az:bas:Q19", "track": "az", "source": "Base", "num": "Q19", "section": "Domaine 2 - Stockage de donnees", "q": "Vous migrez une base SQL Server on-prem qui utilise **SQL Agent, des requetes entre bases et le CLR**. Vous voulez un service **PaaS** avec le **minimum de changements**. Quelle cible ?", "opts": [{"k": "A", "t": "Azure SQL Database (base unique)"}, {"k": "B", "t": "Azure SQL Managed Instance"}, {"k": "C", "t": "Cosmos DB"}, {"k": "D", "t": "PostgreSQL Flexible Server"}], "ans": ["B"], "exp": "SQL MI offre une compatibilite quasi totale avec SQL Server en PaaS. SQL Database ne supporte pas SQL Agent ni les requetes inter-bases classiques."}, {"id": "az:bas:Q20", "track": "az", "source": "Base", "num": "Q20", "section": "Domaine 2 - Stockage de donnees", "q": "Une application interne utilise une base SQL **quelques heures par jour de maniere imprevisible**, et le cout doit etre minimal quand elle est inactive. Quelle option ?", "opts": [{"k": "A", "t": "Business Critical provisionne"}, {"k": "B", "t": "Azure SQL Database serverless (pause automatique)"}, {"k": "C", "t": "SQL Server sur VM"}, {"k": "D", "t": "Hyperscale avec replicas"}], "ans": ["B"], "exp": "Serverless adapte les vCores et met en pause en inactivite (facturation du stockage seulement)."}, {"id": "az:bas:Q21", "track": "az", "source": "Base", "num": "Q21", "section": "Domaine 2 - Stockage de donnees", "q": "Un editeur SaaS heberge 300 bases clients dont les pics de charge ne coincident pas. Comment **optimiser le cout** ?", "opts": [{"k": "A", "t": "Une base provisionnee au maximum pour chaque client"}, {"k": "B", "t": "Un pool elastique Azure SQL"}, {"k": "C", "t": "Une VM par client"}, {"k": "D", "t": "Cosmos DB uniquement"}], "ans": ["B"], "exp": "Les pools elastiques mutualisent les ressources entre bases aux pics decales."}, {"id": "az:bas:Q22", "track": "az", "source": "Base", "num": "Q22", "section": "Domaine 2 - Stockage de donnees", "q": "Une base de **80 To** a croissance rapide necessite des sauvegardes rapides et une mise a l'echelle de la lecture. Quelle option Azure SQL ?", "opts": [{"k": "A", "t": "General Purpose"}, {"k": "B", "t": "Business Critical"}, {"k": "C", "t": "Hyperscale"}, {"k": "D", "t": "DTU Basic"}], "ans": ["C"], "exp": "Hyperscale supporte de tres grandes bases (~100 To), sauvegardes par instantanes et replicas de lecture nommes."}, {"id": "az:bas:Q23", "track": "az", "source": "Base", "num": "Q23", "section": "Domaine 2 - Stockage de donnees", "q": "Vous devez transferer **250 To** de donnees on-prem vers Azure, avec une connexion de 100 Mb/s. Quelle solution ?", "opts": [{"k": "A", "t": "AzCopy sur Internet"}, {"k": "B", "t": "Azure Data Box"}, {"k": "C", "t": "Un VPN point-a-site"}, {"k": "D", "t": "Azure File Sync"}], "ans": ["B"], "exp": "250 To a 100 Mb/s prendrait plusieurs annees ; Data Box transfere par appareil physique."}, {"id": "az:bas:Q24", "track": "az", "source": "Base", "num": "Q24", "section": "Domaine 2 - Stockage de donnees", "q": "Vous concevez l'ingestion de **millions d'evenements par seconde** de telemetrie IoT pour traitement en temps reel. Quel service d'ingestion ?", "opts": [{"k": "A", "t": "Storage Queue"}, {"k": "B", "t": "Service Bus"}, {"k": "C", "t": "Event Hubs"}, {"k": "D", "t": "Event Grid"}], "ans": ["C"], "exp": "Event Hubs est concu pour l'ingestion de flux a tres haut debit (compatible Kafka)."}, {"id": "az:bas:Q25", "track": "az", "source": "Base", "num": "Q25", "section": "Domaine 2 - Stockage de donnees", "q": "Des postes AVD utilisent des **profils FSLogix** et vous voulez des partages de fichiers manages **hautes performances SMB**. Quelle option ?", "opts": [{"k": "A", "t": "Blob Storage"}, {"k": "B", "t": "Azure Files Premium (ou Azure NetApp Files)"}, {"k": "C", "t": "Table Sto
