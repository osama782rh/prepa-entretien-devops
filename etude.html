titre:"Plan de révision 15 jours",
lead:"Comment utiliser ce dossier pour arriver prêt le jour J.",
html:`
<h3>Le principe</h3>
<p>Tu ne retiendras pas en lisant. Tu retiendras en <b>essayant de répondre à voix haute, en te trompant, puis en corrigeant</b>. Le quiz est donc l'outil principal ; les fiches ne servent qu'à combler les trous que le quiz révèle.</p>
<p>Règle de fer : ne lis une fiche qu'<b>après</b> avoir raté les questions du domaine correspondant. Lire avant donne l'illusion de savoir.</p>

<h3>Rythme quotidien (≈ 2 à 3 h)</h3>
<ol>
<li><b>15 min — Révision du jour</b> : bouton « Révision du jour » dans le quiz. Ce sont les questions dues selon la répétition espacée. Non négociable, tous les jours.</li>
<li><b>45 min — Nouveau niveau</b> : un niveau du quiz, en formulant chaque réponse <b>à voix haute et en entier</b> avant de taper. Si tu ne peux pas l'expliquer oralement, tu ne le sais pas.</li>
<li><b>30 min — Fiches</b> : lis uniquement les fiches des domaines où tu es tombé sous 70 %.</li>
<li><b>45 min — Pratique réelle</b> : tape les commandes, écris le Terraform, casse un pod. La mémoire des mains compte double en entretien technique.</li>
<li><b>15 min — Mes points faibles</b> : bouton dédié, en fin de session.</li>
</ol>

<h3>Découpage sur 15 jours</h3>
<table>
<tr><th>Jours</th><th>Quiz</th><th>Focus pratique</th></tr>
<tr><td>J1–J2</td><td>Niveaux 1 et 2</td><td>Linux : permissions, redirections, systemd, scripts avec <code>set -euo pipefail</code></td></tr>
<tr><td>J3–J4</td><td>Niveau 3</td><td>Docker : multi-stage, non-root, debug d'un conteneur qui plante</td></tr>
<tr><td>J5–J6</td><td>Niveau 4</td><td>Kubernetes : deployment + service + ingress, probes, requests/limits</td></tr>
<tr><td>J7–J8</td><td>Niveau 5</td><td>Terraform : modules, for_each, backend distant, import, moved. Survole Ansible si tu n'en as jamais fait</td></tr>
<tr><td>J9–J10</td><td>Niveau 6</td><td>Troubleshooting : casse volontairement des choses et répare-les chronomètre en main</td></tr>
<tr><td>J11–J12</td><td>Niveaux 7 et 8</td><td>Architecture : lis la fiche <b>Architecture &amp; system design</b>, puis dessine ses 3 schémas de mémoire, chronomètre en main</td></tr>
<tr><td>J13</td><td>Niveau 9</td><td>Gouvernance, coûts, conformité — spécifique banque</td></tr>
<tr><td>J14</td><td>Niveau 10</td><td>Oral : réponds aux 28 questions à voix haute, chronométré, sans lire</td></tr>
<tr><td>J15</td><td>Marathon complet</td><td>Repos relatif. Relis la fiche « Jour J » uniquement.</td></tr>
</table>

<div class="box dire"><b>À faire absolument</b>
Enregistre-toi en train de répondre à 5 questions du niveau 10. Réécoute. C'est brutal, et c'est ce qui te fera progresser le plus vite sur la forme — le débit, les « euh », les réponses qui partent dans tous les sens.</div>

<h3>Ce qui est évalué par trois seniors</h3>
<ul>
<li><b>La profondeur</b> : ils vont relancer 3 fois sur la même question. « Et pourquoi ? », « et si ça tombe ? », « et à 10 000 req/s ? ». Une réponse apprise par cœur s'effondre à la deuxième relance.</li>
<li><b>L'honnêteté</b> : dire « je ne sais pas, voilà comment je chercherais » vaut mieux qu'un bluff. Ils sont trois : l'un des trois saura.</li>
<li><b>Le raisonnement d'exploitant</b> : qu'est-ce qui casse, comment tu le détectes, comment tu reviens en arrière. Beaucoup plus que la syntaxe.</li>
<li><b>L'arbitrage</b> : à leur niveau, il n'y a pas de bonne réponse universelle. Il y a un contexte, des contraintes et un choix assumé.</li>
</ul>

<h3>Les 10 sujets qui tombent quasi sûrement</h3>
<ol>
<li>Explique ce qui se passe quand tu tapes une URL (version infra).</li>
<li>Différence Security Group / NACL, ou NSG / Azure Firewall.</li>
<li>Le state Terraform : à quoi il sert, comment tu le sécurises, que fait-on à plusieurs.</li>
<li>Pod en CrashLoopBackOff / Pending : ta démarche de diagnostic.</li>
<li>Comment tu gères les secrets dans un pipeline.</li>
<li>Rolling update, blue/green, canary : différences et quand tu prends quoi.</li>
<li>Comment tu fais un rollback quand la base a été migrée.</li>
<li>Requests vs limits, et pourquoi un pod se fait OOMKill.</li>
<li>Comment tu construis un SLO et à quoi sert un error budget.</li>
<li>Raconte un incident que tu as géré.</li>
</ol>
`
}]);

<script>
/* fiches/01-linux.js */
window.FICHES = (window.FICHES || []).concat([{
id:"linux",
titre:"Linux & Bash",
lead:"Le socle. Un DevOps qui bafouille sur Linux perd la confiance des seniors en 3 minutes.",
html:`
<h3>Permissions</h3>
<p>Format <code>drwxr-xr-x</code> : 1er caractère = TYPE (<code>d</code> répertoire, <code>-</code> fichier, <code>l</code> lien), puis 3 triplets rwx pour propriétaire / groupe / autres.</p>
<table>
<tr><th>Octal</th><th>Droits</th><th>Usage typique</th></tr>
<tr><td>400</td><td>r--------</td><td>Clé privée .pem non modifiable</td></tr>
<tr><td>600</td><td>rw-------</td><td>Clé SSH, fichier de secrets</td></tr>
<tr><td>644</td><td>rw-r--r--</td><td>Fichier de config lisible</td></tr>
<tr><td>755</td><td>rwxr-xr-x</td><td>Script exécutable, répertoire</td></tr>
</table>
<p>Sur un répertoire : <code>x</code> = droit de TRAVERSER, <code>r</code> = droit de LISTER. Un répertoire en 644 est illisible en pratique.</p>
<p>Bits spéciaux : <b>setuid</b> (4xxx, s'exécute avec les droits du propriétaire — <code>passwd</code>), <b>setgid</b> (2xxx, hérite du groupe), <b>sticky bit</b> (1xxx, seul le propriétaire peut supprimer — <code>/tmp</code>).</p>

<h3>Processus et signaux</h3>
<table>
<tr><th>Signal</th><th>N°</th><th>Effet</th></tr>
<tr><td>SIGHUP</td><td>1</td><td>Rechargement de config (convention)</td></tr>
<tr><td>SIGINT</td><td>2</td><td>Ctrl+C, interceptable</td></tr>
<tr><td>SIGTERM</td><td>15</td><td>Arrêt propre demandé, interceptable — le défaut de <code>kill</code></td></tr>
<tr><td>SIGKILL</td><td>9</td><td>Tué par le noyau, NON interceptable</td></tr>
<tr><td>SIGSTOP</td><td>19</td><td>Suspend, non interceptable</td></tr>
</table>
<p>Exit code d'un process tué par signal = <b>128 + n°</b>. Donc <b>137</b> = SIGKILL (souvent OOM), <b>143</b> = SIGTERM. À connaître par cœur : ça tombe sur Kubernetes.</p>
<p>États : R (running), S (sleep interruptible), <b>D</b> (uninterruptible, attente I/O — compte dans la load), Z (zombie), T (stoppé).</p>

<h3>Diagnostic — la séquence à réciter</h3>
<pre><code>uptime              # load 1/5/15 min — comparer au nb de cœurs (nproc)
top / htop          # qui consomme, %CPU, %MEM, %wa
free -m             # mémoire + SWAP (swap actif = mort lente)
vmstat 1 5          # si/so (swap in/out), wa (iowait), r (run queue)
iostat -x 1         # %util par device, await
df -h / df -i       # espace ET inodes
ss -tulnp           # ports en écoute + process
dmesg -T | tail     # OOM killer, erreurs matérielles, réseau
journalctl -u svc -f --since "10 min ago"</code></pre>

<div class="box piege"><b>Pièges classiques</b>
<ul>
<li><b>Load élevée mais CPU bas</b> = attente I/O (état D), pas un problème de CPU.</li>
<li><b>df plein mais du ne trouve rien</b> = fichier supprimé encore ouvert (<code>lsof | grep deleted</code>) ou inodes épuisés (<code>df -i</code>).</li>
<li><b>« Too many open files »</b> = <code>LimitNOFILE</code> dans l'unité systemd, pas <code>ulimit</code> dans le shell. Et chercher la fuite d'abord.</li>
<li><b>Le swap qui s'active</b> dégrade tout : mieux vaut souvent un OOM franc qu'un serveur qui rame une heure.</li>
</ul></div>

<h3>Bash — les réflexes de production</h3>
<pre><code>#!/usr/bin/env bash
set -euo pipefail          # échec immédiat, var non définie = erreur, échec dans un pipe
IFS=$'\\n\\t'               # évite le découpage sur les espaces
trap 'echo "erreur ligne $LINENO" >&2' ERR
trap 'rm -f "$TMP"' EXIT   # nettoyage garanti

TMP=$(mktemp)
: "\${API_URL:?API_URL est obligatoire}"   # échoue avec un message clair</code></pre>
<ul>
<li><code>"$@"</code> et jamais <code>$*</code> pour relayer des arguments.</li>
<li>Toujours guillemeter les variables : <code>"$var"</code>. Un chemin avec espace casse tout sinon.</li>
<li><code>$(cmd)</code> plutôt que les backticks (imbricable, lisible).</li>
<li><code>[[ ]]</code> plutôt que <code>[ ]</code> en bash (pas de découpage de mots, regex avec <code>=~</code>).</li>
<li>Vérifier avec <b>shellcheck</b> en CI — mentionne-le, c'est un signal de maturité.</li>
</ul>

<h3>Texte : les 5 outils qui suffisent</h3>
<pre><code>grep -rniE "pattern" .          # récursif, insensible, numéros de ligne, regex étendue
grep -v / -c / -A3 -B3          # inverse / compte / contexte
awk -F: '{print $1, $3}'        # colonnes, séparateur custom
awk '$3 > 100 {sum+=$3} END{print sum}'
sed -i 's/ancien/nouveau/g' f   # remplacement en place
sort -k2 -rn | uniq -c | head   # tri numérique inverse + comptage
cut -d: -f1,3 /etc/passwd
xargs -r -n1 -P4 cmd            # parallélisation, -r = rien si entrée vide
find . -type f -mtime +30 -name "*.log" -delete</code></pre>
<p><b>À retenir</b> : <code>uniq</code> ne dédoublonne que des lignes ADJACENTES → toujours <code>sort | uniq</code>.</p>

<h3>systemd</h3>
<pre><code>systemctl status|start|stop|restart|reload mon.service
systemctl enable --now mon.service     # au boot + tout de suite
systemctl list-units --failed
systemctl daemon-reload                # après modif d'un fichier .service
journalctl -u mon.service -f -n 100 --since "1 hour ago" -p err</code></pre>
<pre><code>[Unit]
Description=Mon API
After=network-online.target

[Service]
Type=simple
User=app
ExecStart=/opt/app/bin/api
Restart=on-failure
RestartSec=5
LimitNOFILE=65536
Environment=NODE_ENV=production

[Install]
WantedBy=multi-user.target</code></pre>
<p><code>enable</code> ≠ <code>start</code> : <code>enable</code> crée le lien pour le boot, il ne lance rien maintenant (d'où <code>--now</code>).</p>

<h3>SSH — au-delà du « je me connecte »</h3>
<pre><code>ssh-keygen -t ed25519 -C "osama@poste"     # ed25519, pas RSA 2048
ssh -i ~/.ssh/cle.pem -o IdentitiesOnly=yes user@hote
ssh -J bastion user@hote-prive              # rebond (ProxyJump)
ssh -L 5432:db-interne:5432 user@bastion    # tunnel LOCAL : port local → distant
ssh -R 8080:localhost:3000 user@serveur     # tunnel INVERSE
ssh-add -l                                   # clés chargées dans l'agent
ssh -vvv user@hote                           # debug d'authentification</code></pre>
<p><code>~/.ssh/config</code> évite de retaper les options et documente le parc :</p>
<pre><code>Host prod-*
  User deploy
  IdentityFile ~/.ssh/prod_ed25519
  IdentitiesOnly yes
  ProxyJump bastion.exemple.com
  ServerAliveInterval 60</code></pre>
<ul>
<li><b>Permissions</b> : <code>~/.ssh</code> en 700, clé privée en 600 (ou 400), <code>authorized_keys</code> en 600. SSH REFUSE une clé trop permissive — cause d'échec très fréquente.</li>
<li><b>Durcissement de sshd</b> : <code>PermitRootLogin no</code>, <code>PasswordAuthentication no</code>, <code>AllowGroups</code>, MFA. Toujours garder une session ouverte en testant une modification de sshd.</li>
<li><b>En production cloud</b>, la bonne réponse n'est plus SSH direct mais SSM Session Manager (AWS) ou Azure Bastion : pas de port 22 ouvert, pas de clé à gérer, accès contrôlé par IAM et session enregistrée.</li>
</ul>

<h3>Utilisateurs, groupes et élévation</h3>
<pre><code>id osama                        # uid, gid, groupes
usermod -aG docker osama        # -a INDISPENSABLE, sinon on REMPLACE les groupes
getent group docker
sudo -l                         # ce que j'ai le droit de faire
visudo                          # éditer sudoers avec validation syntaxique</code></pre>
<table>
<tr><th></th><th>Effet</th></tr>
<tr><td><code>su</code></td><td>Change d'utilisateur en gardant l'environnement courant</td></tr>
<tr><td><code>su -</code></td><td>Login shell complet (PATH, HOME, profil de la cible)</td></tr>
<tr><td><code>sudo</code></td><td>Élévation par commande, <b>journalisée</b>, politique fine — le seul acceptable en production auditée</td></tr>
</table>
<div class="box piege">Ajouter un utilisateur au groupe <code>docker</code> équivaut à lui donner root sur la machine : il peut lancer un conteneur privilégié qui monte <code>/</code>. Ce n'est pas une permission anodine, et un auditeur le sait.</div>

<h3>Disques, systèmes de fichiers, montages</h3>
<pre><code>lsblk -f                    # arborescence des disques + systèmes de fichiers + UUID
blkid                       # UUID à utiliser dans fstab
mount | column -t
findmnt /var
mkfs.ext4 /dev/sdb1
mount -o noatime /dev/sdb1 /data
df -h / df -i               # espace ET inodes
du -ah /var | sort -rh | head</code></pre>
<pre><code># /etc/fstab — TOUJOURS par UUID, jamais par /dev/sdX (l'ordre change au reboot)
UUID=1234-abcd  /data  ext4  defaults,noatime,nofail  0  2</code></pre>
<div class="box piege"><b>L'option <code>nofail</code></b> : sans elle, une entrée fstab invalide empêche la machine de démarrer et t'oblige à passer par la console de secours. Après toute modification de fstab, valider avec <code>mount -a</code> AVANT de redémarrer.</div>
<p><b>LVM</b> en trois mots : disques physiques (PV) → regroupés en volume group (VG) → découpés en volumes logiques (LV) redimensionnables à chaud. C'est ce qui permet d'agrandir <code>/var</code> sans réinstaller : <code>lvextend -L +20G /dev/vg0/var &amp;&amp; resize2fs /dev/vg0/var</code>.</p>

<h3>Paquets et démarrage</h3>
<pre><code># Debian/Ubuntu                    # RHEL/Rocky
apt update && apt install -y x      dnf install -y x
apt list --installed | grep x       rpm -qa | grep x
dpkg -S /usr/bin/curl               rpm -qf /usr/bin/curl   # quel paquet fournit ce fichier</code></pre>
<p><b>Séquence de démarrage</b> : firmware → bootloader (GRUB) → noyau + initramfs → <code>systemd</code> (PID 1) → target (<code>multi-user.target</code>, <code>graphical.target</code>). Diagnostic : <code>systemd-analyze blame</code> pour voir ce qui ralentit le boot, <code>journalctl -b -1</code> pour lire les logs du démarrage précédent après un crash.</p>

<h3>Planification : cron ou timer systemd ?</h3>
<pre><code># crontab -e         min heure jour mois jourSemaine
*/15 * * * *  /opt/scripts/collecte.sh >> /var/log/collecte.log 2>&1</code></pre>
<table>
<tr><th></th><th>cron</th><th>timer systemd</th></tr>
<tr><td>Journalisation</td><td>À gérer soi-même</td><td>Native dans journald</td></tr>
<tr><td>Rattrapage après extinction</td><td>Non</td><td>Oui (<code>Persistent=true</code>)</td></tr>
<tr><td>Dépendances, limites de ressources</td><td>Non</td><td>Oui (c'est une unité)</td></tr>
<tr><td>Chevauchement d'exécutions</td><td>Possible</td><td>Empêché par défaut</td></tr>
</table>
<div class="box piege"><b>Cause n°1 d'un cron qui échoue alors qu'il marche à la main</b> : l'environnement minimal — PATH réduit, pas de <code>.bashrc</code>, HOME différent. Réflexes : chemins absolus partout, variables déclarées explicitement en tête de crontab, et redirection de stdout ET stderr vers un fichier pour pouvoir lire l'erreur.</div>

<h3>Namespaces & cgroups (le socle des conteneurs)</h3>
<table>
<tr><th>Mécanisme</th><th>Rôle</th><th>Exemples</th></tr>
<tr><td>Namespaces</td><td>Isolent ce que le process VOIT</td><td>pid, net, mnt, uts, ipc, user, cgroup</td></tr>
<tr><td>cgroups</td><td>Limitent ce qu'il CONSOMME</td><td>cpu, memory, io, pids</td></tr>
<tr><td>capabilities</td><td>Découpent les privilèges root</td><td>NET_ADMIN, SYS_TIME…</td></tr>
</table>
<p>Un conteneur = un processus normal + namespaces + cgroups + un rootfs overlay. Savoir dire ça posément impressionne toujours.</p>

<div class="box dire"><b>Formulation qui marque des points</b>
« Avant de regarder l'application, je valide le système : load, mémoire et swap, iowait, espace disque et inodes, ports en écoute, et <code>dmesg</code> pour un éventuel OOM. Ça élimine 80 % des fausses pistes en deux minutes. »</div>
`

id:"reseau",
titre:"Réseau (TCP/IP, DNS, TLS, HTTP)",
lead:"Le domaine où les seniors coincent le plus de candidats, parce que tout le monde le survole.",
html:`
<h3>Adressage et masques — à savoir de tête</h3>
<table>
<tr><th>CIDR</th><th>Adresses</th><th>Utilisables (AWS)</th><th>Usage</th></tr>
<tr><td>/16</td><td>65 536</td><td>—</td><td>Un VPC / VNet entier</td></tr>
<tr><td>/24</td><td>256</td><td>251</td><td>Un subnet standard</td></tr>
<tr><td>/26</td><td>64</td><td>59</td><td>Petit subnet (endpoints, bastion)</td></tr>
<tr><td>/28</td><td>16</td><td>11</td><td>Minimum AWS</td></tr>
<tr><td>/32</td><td>1</td><td>—</td><td>Une IP unique (règles de firewall)</td></tr>
</table>
<p>Calcul rapide : <b>2^(32 − masque)</b>. AWS réserve 5 adresses par subnet (réseau, routeur, DNS, réservé, broadcast), Azure en réserve 5 aussi.</p>
<p>Plages privées RFC1918 : <code>10.0.0.0/8</code>, <code>172.16.0.0/12</code>, <code>192.168.0.0/16</code>. Ne jamais choisir un plan qui chevauche celui de l'on-premise : le peering et le VPN deviennent impossibles.</p>

<h3>TCP vs UDP</h3>
<table>
<tr><th></th><th>TCP</th><th>UDP</th></tr>
<tr><td>Connexion</td><td>Handshake 3 temps (SYN, SYN-ACK, ACK)</td><td>Aucune</td></tr>
<tr><td>Fiabilité</td><td>Retransmission, ordre garanti</td><td>Aucune garantie</td></tr>
<tr><td>Contrôle</td><td>Congestion + flux</td><td>Non</td></tr>
<tr><td>Usage</td><td>HTTP, SSH, bases de données</td><td>DNS, VoIP, streaming, métriques, QUIC</td></tr>
</table>
<p>Fermeture TCP : FIN / ACK / FIN / ACK, puis <b>TIME_WAIT</b> (2×MSL) côté initiateur. Beaucoup de TIME_WAIT = normal sur un proxy ; beaucoup de <b>CLOSE_WAIT</b> = <b>bug applicatif</b>, l'application ne ferme pas ses sockets.</p>

<h3>Diagnostic réseau : la logique DROP vs REJECT</h3>
<table>
<tr><th>Symptôme client</th><th>Cause probable</th></tr>
<tr><td>Timeout (ça pend)</td><td>Paquet DROPPÉ : SG/NSG/NACL, route absente, mauvaise IP</td></tr>
<tr><td>Connection refused (immédiat)</td><td>Le paquet arrive, mais rien n'écoute sur le port</td></tr>
<tr><td>Erreur DNS / nom inconnu</td><td>Résolution, pas réseau</td></tr>
<tr><td>Petites requêtes OK, gros transferts figés</td><td>MTU / PMTUD cassé (ICMP bloqué)</td></tr>
<tr><td>Intermittent et erratique</td><td>Conntrack saturé, un backend sur N en panne, DNS</td></tr>
</table>
<pre><code>dig +short api.exemple.com          # résolution seule
dig @8.8.8.8 api.exemple.com        # tester un autre resolver
nc -zv host 443                     # le port répond-il ?
curl -v https://host/path           # DNS + TCP + TLS + HTTP, avec les temps
curl -w "%{time_namelookup} %{time_connect} %{time_appconnect} %{time_total}\\n" -o /dev/null -s URL
openssl s_client -connect host:443 -servername host -showcerts
traceroute / mtr host               # où ça s'arrête
tcpdump -i any -n port 443 -c 50    # le SYN arrive-t-il ? le SYN-ACK repart-il ?
ip route get 10.0.2.15              # quelle route sera empruntée</code></pre>

<h3>DNS</h3>
<table>
<tr><th>Type</th><th>Rôle</th></tr>
<tr><td>A / AAAA</td><td>Nom → IPv4 / IPv6</td></tr>
<tr><td>CNAME</td><td>Alias vers un autre NOM. <b>Interdit à l'apex</b> du domaine</td></tr>
<tr><td>ALIAS / A-alias</td><td>Équivalent CNAME utilisable à l'apex (Route 53, Azure DNS)</td></tr>
<tr><td>MX / TXT / NS / SOA</td><td>Mail / vérifications et SPF-DKIM / serveurs de noms / autorité</td></tr>
<tr><td>SRV</td><td>Service + port (utilisé par K8s pour les headless services)</td></tr>
</table>
<p><b>TTL</b> : le nerf de la guerre en bascule. On abaisse le TTL (60 s) plusieurs heures AVANT une migration, sinon les caches gardent l'ancienne IP pendant des heures. Attention : certains resolvers ignorent les TTL très courts.</p>

<h3>TLS</h3>
<ol>
<li>ClientHello : versions et suites supportées, SNI (quel nom d'hôte on demande).</li>
<li>ServerHello + certificat (+ chaîne d'intermédiaires).</li>
<li>Le client valide : chaîne jusqu'à une CA de confiance, date de validité, nom qui correspond, révocation.</li>
<li>Échange de clés ECDHE → dérivation d'une <b>clé de session symétrique</b> (forward secrecy).</li>
<li>Tout le trafic est ensuite chiffré en symétrique (AES-GCM).</li>
</ol>
<div class="box piege"><b>Erreurs de certificat les plus fréquentes en entreprise</b>
<ul>
<li><b>Chaîne incomplète</b> : le navigateur compense, pas un client Java/Go/curl. Vérifier avec <code>openssl s_client -showcerts</code>.</li>
<li><b>CA d'entreprise absente</b> du truststore du conteneur — classique derrière un proxy d'inspection TLS bancaire. Il faut injecter le bundle CA dans l'image.</li>
<li><b>SNI manquant</b> sur un hôte mutualisé → on tombe sur le mauvais certificat.</li>
<li><b>Expiration</b> : la cause d'incident la plus bête et la plus fréquente. Il faut une alerte à J-30 et de l'automatisation (ACME, Key Vault, ACM).</li>
</ul></div>

<h3>HTTP — codes à connaître</h3>
<table>
<tr><th>Code</th><th>Sens</th><th>Ce que ça dit en prod</th></tr>
<tr><td>301 / 302</td><td>Redirection permanente / temporaire</td><td>301 est mis en cache par le navigateur — attention</td></tr>
<tr><td>400 / 422</td><td>Requête invalide</td><td>Problème client, pas serveur</td></tr>
<tr><td>401 / 403</td><td>Non authentifié / non autorisé</td><td>401 = qui es-tu, 403 = tu n'as pas le droit</td></tr>
<tr><td>429</td><td>Trop de requêtes</td><td>Throttling : respecter <code>Retry-After</code></td></tr>
<tr><td>499</td><td>Client parti (nginx)</td><td>Le client a abandonné : ton backend est trop lent</td></tr>
<tr><td>500</td><td>Erreur applicative</td><td>Bug côté code</td></tr>
<tr><td>502</td><td>Bad gateway</td><td>Le backend a répondu n'importe quoi ou est mort</td></tr>
<tr><td>503</td><td>Service indisponible</td><td>Aucun backend sain / surcharge</td></tr>
<tr><td>504</td><td>Gateway timeout</td><td>Le backend est trop lent, le proxy a coupé</td></tr>
</table>
<p><b>502 vs 503 vs 504</b> : question classique. 502 = réponse invalide du backend, 503 = pas de backend disponible, 504 = backend trop lent. Savoir les distinguer oriente immédiatement le diagnostic.</p>

<h3>Load balancing</h3>
<table>
<tr><th></th><th>L4</th><th>L7</th></tr>
<tr><td>Voit</td><td>IP + port</td><td>Host, path, headers, cookies</td></tr>
<tr><td>Permet</td><td>TCP/UDP, TLS passthrough, IP source préservée</td><td>Routage par URL, terminaison TLS, WAF, sticky session, réécriture</td></tr>
<tr><td>AWS / Azure</td><td>NLB / Azure Load Balancer</td><td>ALB / Application Gateway</td></tr>
</table>
<p><b>Health checks</b> : un LB ne route que vers les cibles saines. Une santé mal configurée (endpoint qui teste la base alors qu'on veut juste savoir si le process vit) provoque des retraits en cascade. Séparer « liveness » et « readiness » vaut aussi pour les LB.</p>

<h3>Proxy vs reverse proxy vs NAT</h3>
<ul>
<li><b>Proxy (forward)</b> : côté client, sortant. Filtrage, cache, inspection TLS. Obligatoire en banque — pense à <code>HTTP_PROXY</code>/<code>NO_PROXY</code> dans les conteneurs.</li>
<li><b>Reverse proxy</b> : côté serveur, entrant. nginx, ALB, App Gateway, Ingress.</li>
<li><b>NAT</b> : réécriture d'adresse. En sortie de VPC, l'IP source devient celle du NAT Gateway → c'est CETTE IP que le partenaire doit autoriser.</li>
</ul>

<div class="box dire"><b>La question « que se passe-t-il quand je tape une URL »</b>
Réponds en 8 étapes : résolution DNS (caches successifs) → connexion TCP → handshake TLS → requête HTTP au reverse proxy → sélection d'un backend sain → traitement applicatif (cache, base) → réponse (compression, cache CDN) → rendu et appels secondaires. Puis propose d'aller plus loin sur l'étape qui les intéresse. C'est LA question qui permet de démontrer toute ta culture infra en 2 minutes.</div>

id:"git",
titre:"Git & workflows",
lead:"Outil quotidien, donc domaine où l'approximation se remarque immédiatement.",
html:`
<h3>Le modèle mental</h3>
<p>Un commit est un objet <b>immuable</b> identifié par un hash, contenant : un pointeur vers un ARBRE (l'instantané complet du projet), le ou les parents, l'auteur, la date, le message. Git stocke des <b>instantanés</b>, pas des diffs — les diffs sont calculés à l'affichage.</p>
<p>Une <b>branche</b> n'est qu'un pointeur mobile vers un commit : un fichier de 41 octets dans <code>.git/refs/heads/</code>. D'où la gratuité totale des branches.</p>
<p>Trois zones : <b>working tree</b> (tes fichiers) → <b>index / staging</b> (le brouillon du prochain commit) → <b>dépôt</b> (les commits). Un commit fige l'INDEX, pas le disque.</p>

<h3>Les objets Git</h3>
<table>
<tr><th>Objet</th><th>Contient</th></tr>
<tr><td><b>blob</b></td><td>Le contenu d'un fichier (sans son nom)</td></tr>
<tr><td><b>tree</b></td><td>Une arborescence : noms, modes, pointeurs vers blobs et trees</td></tr>
<tr><td><b>commit</b></td><td>Un tree + parents + métadonnées</td></tr>
<tr><td><b>tag annoté</b></td><td>Un pointeur nommé + auteur + message + signature éventuelle</td></tr>
</table>
<p>Tout est adressé par le contenu : deux fichiers identiques dans dix branches = un seul blob stocké. C'est ce qui explique la compacité des dépôts Git.</p>

<h3>Les commandes qui comptent vraiment</h3>
<pre><code>git add -p                    # choisir morceau par morceau ce qui part
git commit --amend            # corriger le dernier commit (jamais après un push partagé)
git rebase -i HEAD~5          # nettoyer l'historique local avant la PR
git log --oneline --graph --all --decorate
git log -S "motDePasse"       # chercher un commit qui a AJOUTÉ ou RETIRÉ ce texte
git log --follow -- fichier   # suivre un fichier à travers ses renommages
git diff --staged
git stash push -m "wip" / git stash pop
git bisect start / bad / good # trouver le commit fautif en log2(n) étapes
git reflog                    # LE filet de sécurité
git blame -L 40,60 fichier
git cherry-pick &lt;sha&gt;
git revert &lt;sha&gt;              # sûr sur une branche partagée
git clean -nd                 # -n = simulation AVANT de supprimer les non suivis</code></pre>

<h3>reset : les trois modes</h3>
<table>
<tr><th>Mode</th><th>HEAD</th><th>Index</th><th>Fichiers</th><th>Quand</th></tr>
<tr><td>--soft</td><td>déplacé</td><td>gardé</td><td>gardés</td><td>Refaire le commit autrement</td></tr>
<tr><td>--mixed <i>(défaut)</i></td><td>déplacé</td><td>vidé</td><td>gardés</td><td>Défaire un <code>add</code></td></tr>
<tr><td>--hard</td><td>déplacé</td><td>vidé</td><td><b>écrasés</b></td><td>Tout jeter — irréversible sauf reflog</td></tr>
</table>
<p><b>reset vs revert vs checkout</b> : <code>reset</code> déplace la branche (réécrit l'histoire), <code>revert</code> ajoute un commit d'annulation (sûr en partagé), <code>checkout</code>/<code>switch</code>/<code>restore</code> change ce que tu as sous les yeux sans toucher à l'historique.</p>

<h3>merge vs rebase</h3>
<table>
<tr><th></th><th>merge</th><th>rebase</th></tr>
<tr><td>Effet</td><td>Commit de fusion, histoire réelle préservée</td><td>Commits rejoués au-dessus de la cible</td></tr>
<tr><td>Hash</td><td>Inchangés</td><td><b>Nouveaux</b></td></tr>
<tr><td>Historique</td><td>Graphe</td><td>Linéaire</td></tr>
<tr><td>Sur branche partagée</td><td>Sûr</td><td><b>Jamais</b></td></tr>
</table>
<p>Pratique courante : rebase local pour nettoyer avant la PR, merge (ou squash-merge) pour intégrer. <code>git pull --rebase</code> évite les commits de merge parasites sur une branche personnelle.</p>
<p><b>Squash merge</b> : toute la branche devient un seul commit sur main. Historique très lisible, mais on perd le détail — et attention, la branche source apparaît alors comme « non fusionnée » à Git, ce qui casse le cherry-pick ultérieur.</p>

<h3>Résoudre un conflit</h3>
<pre><code>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD
ma version
=======
la leur
&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature/x</code></pre>
<ol>
<li>Éditer pour produire le résultat VOULU (pas juste choisir un côté).</li>
<li>Retirer les marqueurs.</li>
<li><code>git add fichier</code></li>
<li><code>git merge --continue</code> (ou <code>rebase --continue</code>).</li>
</ol>
<p><code>git merge --abort</code> annule tout. <code>git rerere</code> mémorise la résolution pour la rejouer automatiquement si le même conflit revient (utile en rebase long).</p>
<p>Le vrai remède est en amont : branches courtes et intégration fréquente. Un conflit énorme est un symptôme d'organisation, pas de Git.</p>

<h3>Stratégies de branches</h3>
<table>
<tr><th></th><th>GitFlow</th><th>Trunk-based</th><th>GitHub Flow</th></tr>
<tr><td>Branches</td><td>main, develop, feature, release, hotfix</td><td>main + branches de quelques heures</td><td>main + feature branches courtes</td></tr>
<tr><td>Intégration</td><td>Tardive, gros merges</td><td>Continue</td><td>Continue</td></tr>
<tr><td>Inachevé</td><td>Reste en branche</td><td>Caché par feature flag</td><td>Feature flag</td></tr>
<tr><td>Adapté à</td><td>Produits versionnés livrés au client</td><td>SaaS, livraison fréquente</td><td>Web, équipes petites</td></tr>
</table>
<div class="box dire"><b>Ce qu'il faut savoir dire</b>
« GitFlow est rigoureux mais il fait vivre les branches longtemps : l'intégration est tardive, les merges sont douloureux et la CI n'est plus vraiment continue. En trunk-based, on intègre plusieurs fois par jour et on cache l'inachevé derrière des feature flags. En banque, GitFlow reste fréquent pour les composants versionnés livrés à d'autres équipes — ce n'est pas absurde, c'est un choix lié au mode de livraison. »</div>

<h3>Protection de branche — les règles attendues</h3>
<ul>
<li>Push direct interdit sur <code>main</code>, tout passe par PR.</li>
<li>N approbations dont au moins un <b>CODEOWNER</b>, réapprobation à chaque nouveau commit.</li>
<li>Checks de CI obligatoires au vert.</li>
<li>Force-push et suppression de branche interdits.</li>
<li><b>Commits signés</b> exigés (GPG, SSH ou signature du forge).</li>
<li>Pas de bypass administrateur — c'est le point que regarde un auditeur.</li>
</ul>
<p>Ces règles matérialisent la <b>séparation des tâches</b> : personne ne peut seul écrire et faire partir un changement en production.</p>

<h3>Secrets et historique</h3>
<div class="box piege"><b>Le piège classique</b>
<code>git revert</code> ne protège rien : le blob reste dans l'historique et reste récupérable. L'ordre correct :
<ol>
<li><b>RÉVOQUER le secret</b> — c'est la seule action qui compte vraiment.</li>
<li>Réécrire l'historique (<code>git filter-repo</code>, BFG) et forcer le push.</li>
<li>Purger les forks, caches, PR et artefacts de CI qui en gardent une copie.</li>
<li>Auditer ce qui a été fait avec le secret pendant sa période d'exposition.</li>
<li>Post-mortem : pourquoi il existait, et mise en place de la détection.</li>
</ol>
Un candidat qui répond seulement « je fais un revert » se fait éliminer sur cette question.</div>
<p>Prévention : hook <code>pre-commit</code> (gitleaks, detect-secrets) — accélérateur contournable avec <code>--no-verify</code> — DOUBLÉ d'un contrôle côté serveur non contournable (push protection du forge, ou job CI bloquant).</p>

<h3>Divers utile</h3>
<ul>
<li><b><code>.gitignore</code></b> n'a aucun effet sur un fichier DÉJÀ suivi : il faut <code>git rm --cached</code> d'abord.</li>
<li><b>Tag annoté et signé</b> pour les releases (<code>git tag -s v1.2.0 -m "..."</code>) — c'est ce qui rend une release auditable.</li>
<li><b><code>--force-with-lease</code></b> plutôt que <code>--force</code> : refuse d'écraser si quelqu'un a poussé entre-temps.</li>
<li><b><code>git worktree</code></b> : plusieurs branches dans plusieurs répertoires depuis le même dépôt, sans re-cloner ni stasher.</li>
<li><b>Monorepo vs multi-repo</b> : le monorepo simplifie le refactoring transverse et la cohérence des versions, mais impose de l'outillage (détection des changements, build sélectif). Le multi-repo isole mais fait dériver les versions.</li>
</ul>
`
}]);

</script>

id:"docker",
titre:"Docker & conteneurs",
lead:"Savoir expliquer ce qu'est RÉELLEMENT un conteneur vaut plus que connaître 40 options de la CLI.",
html:`
<h3>Ce qu'est un conteneur, précisément</h3>
<p>Un processus Linux ordinaire, isolé par trois mécanismes du noyau :</p>
<table>
<tr><th>Mécanisme</th><th>Rôle</th><th>Exemples</th></tr>
<tr><td><b>namespaces</b></td><td>Isolent ce que le process VOIT</td><td>pid, net, mnt, uts, ipc, user, cgroup</td></tr>
<tr><td><b>cgroups</b></td><td>Limitent ce qu'il CONSOMME</td><td>cpu, memory, io, pids</td></tr>
<tr><td><b>capabilities / seccomp / LSM</b></td><td>Restreignent ce qu'il PEUT FAIRE</td><td>drop NET_ADMIN, filtrer les appels système</td></tr>
</table>
<p>Plus un système de fichiers en couches (OverlayFS). <b>Pas de machine virtuelle, pas d'hyperviseur, pas de noyau invité</b> — d'où le démarrage en millisecondes, mais aussi une isolation plus faible qu'une VM et une dépendance au noyau de l'hôte.</p>

<h3>Image vs conteneur</h3>
<p>L'<b>image</b> est un modèle immuable en lecture seule : un empilement de couches identifiées par leur digest, plus un manifeste. Le <b>conteneur</b> est une instance en exécution de cette image, avec une couche d'écriture éphémère au-dessus. Analogie : classe / objet.</p>
<p>Écrire dans un fichier d'une couche basse déclenche un <b>copy-up</b> : le fichier ENTIER est copié dans la couche d'écriture. D'où la lenteur des écritures sur de gros fichiers, et la règle : les données vont dans un volume, pas dans le conteneur.</p>
<p>Un <b>manifest list / image index</b> référence plusieurs manifestes, un par couple OS/architecture. C'est ce qui permet à <code>FROM alpine</code> de fonctionner sur amd64 et arm64 — et son absence explique qu'une image buildée sur un Mac M-series casse sur des nœuds x86.</p>

<h3>Dockerfile de production</h3>
<pre><code># syntax=docker/dockerfile:1
FROM node:20-alpine AS build
WORKDIR /app
COPY package*.json ./              # AVANT le code : cache des dépendances
RUN npm ci --omit=dev
COPY . .
RUN npm run build

FROM gcr.io/distroless/nodejs20-debian12 AS runtime
WORKDIR /app
COPY --from=build /app/dist ./dist
COPY --from=build /app/node_modules ./node_modules
USER 10001
EXPOSE 3000
ENTRYPOINT ["/nodejs/bin/node", "dist/server.js"]</code></pre>
<ul>
<li><b>Multi-stage</b> : on compile dans une image lourde, on livre une image minimale sans compilateur ni sources.</li>
<li><b>Ordre des couches</b> : du moins changeant au plus changeant, pour maximiser le cache.</li>
<li><b>Nettoyer dans la MÊME couche</b> : <code>RUN apt-get update &amp;&amp; apt-get install -y x &amp;&amp; rm -rf /var/lib/apt/lists/*</code>. Supprimer dans une couche ultérieure n'enlève rien au poids.</li>
<li><b>Forme exec</b> (JSON) pour ENTRYPOINT/CMD : la forme shell met <code>/bin/sh</code> en PID 1, qui ne relaie pas SIGTERM.</li>
<li><b>Tag immuable</b> : version sémantique ou SHA de commit. Jamais <code>latest</code> en production.</li>
</ul>

<h3>Les instructions qui piègent</h3>
<table>
<tr><th>Instruction</th><th>Ce qu'elle fait vraiment</th></tr>
<tr><td><code>EXPOSE 8080</code></td><td><b>Rien</b> de fonctionnel : simple métadonnée. Publier exige <code>-p</code> au run ou un Service côté K8s</td></tr>
<tr><td><code>ENTRYPOINT</code></td><td>L'exécutable fixe, non remplacé par les arguments de <code>docker run</code></td></tr>
<tr><td><code>CMD</code></td><td>Les arguments par défaut, remplaçables</td></tr>
<tr><td><code>ARG</code></td><td>Variable de BUILD — reste visible dans <code>docker history</code>. Jamais de secret</td></tr>
<tr><td><code>ENV</code></td><td>Variable persistée dans l'image et l'exécution</td></tr>
<tr><td><code>ADD</code></td><td>Comme COPY mais décompresse et télécharge des URL — préférer <code>COPY</code>, plus prévisible</td></tr>
<tr><td><code>HEALTHCHECK</code></td><td>Utilisé par Docker/Compose, <b>ignoré par Kubernetes</b> (qui veut des probes)</td></tr>
</table>

<h3>Le PID 1 et les signaux</h3>
<p>Deux problèmes classiques quand le processus principal est un shell :</p>
<ul>
<li>Il ne relaie pas SIGTERM → <code>docker stop</code> attend 10 s puis SIGKILL. En Kubernetes, cela donne des 502 pendant les déploiements.</li>
<li>Il ne récolte pas les processus enfants terminés → accumulation de <b>zombies</b>.</li>
</ul>
<p>Solutions : forme exec, un init léger (<code>tini</code>, <code>docker run --init</code>), ou un gestionnaire de signaux dans l'application.</p>

<h3>Durcissement</h3>
<pre><code>docker run --read-only \\
  --cap-drop ALL --security-opt no-new-privileges \\
  --user 10001:10001 \\
  --memory 512m --cpus 1 \\
  --tmpfs /tmp \\
  --pids-limit 200 \\
  monimage:1.4.2</code></pre>
<p>Équivalent Kubernetes dans <code>securityContext</code> : <code>runAsNonRoot: true</code>, <code>readOnlyRootFilesystem: true</code>, <code>allowPrivilegeEscalation: false</code>, <code>capabilities.drop: [ALL]</code>, <code>seccompProfile: RuntimeDefault</code>.</p>
<div class="box piege"><b>Le socket Docker monté dans un conteneur</b>
<code>-v /var/run/docker.sock:/var/run/docker.sock</code> donne le contrôle du daemon : on peut lancer un conteneur privilégié qui monte <code>/</code> de l'hôte. C'est un <b>root sur le nœud</b>, donc sur tous les conteneurs voisins. Pour construire des images sans daemon : Kaniko, Buildah, ou BuildKit en mode rootless.</div>

<h3>Réseau et volumes</h3>
<ul>
<li><b>Réseau bridge personnalisé</b> (<code>docker network create</code>) : indispensable pour la résolution DNS par nom de conteneur, absente du bridge par défaut.</li>
<li><b>Volume nommé</b> vs <b>bind mount</b> : le volume est géré par Docker, portable, sauvegardable ; le bind mount dépend de l'arborescence de l'hôte et de ses permissions. En production : volume ou stockage externe.</li>
<li>Les données écrites hors volume disparaissent avec le conteneur — un conteneur doit être <b>stateless par défaut</b>.</li>
</ul>

<h3>BuildKit</h3>
<pre><code>DOCKER_BUILDKIT=1 docker build \\
  --secret id=npmrc,src=$HOME/.npmrc \\
  --cache-from type=registry,ref=monregistry/app:cache \\
  --cache-to   type=registry,ref=monregistry/app:cache,mode=max \\
  --platform linux/amd64,linux/arm64 \\
  -t monregistry/app:1.4.2 --push .</code></pre>
<p>Apports : parallélisation du graphe de build, cache exportable et partagé entre machines (crucial pour des runners CI éphémères), montage de secrets (<code>--mount=type=secret</code>) sans les laisser dans les couches, cache de dépendances (<code>--mount=type=cache</code>), builds multi-plateformes.</p>

<h3>Disque qui se remplit</h3>
<pre><code>docker system df -v              # ventilation images / conteneurs / volumes / cache
docker system prune -a --volumes # ATTENTION : supprime les volumes non utilisés
docker image prune -f</code></pre>
<p>Le coupable le plus fréquent : les <b>logs json-file sans rotation</b>. À configurer dans <code>/etc/docker/daemon.json</code> : <code>"log-opts": {"max-size":"10m","max-file":"3"}</code>. Côté Kubernetes, c'est la garbage collection du kubelet et les logs applicatifs écrits dans le conteneur au lieu de stdout.</p>

<h3>« Ça marche sur mon poste »</h3>
<div class="box piege">Les causes structurelles à citer :
<ol>
<li><b>Architecture</b> différente (build ARM sur Mac vs nœuds amd64) → <code>buildx --platform</code>.</li>
<li><b>Config et secrets</b> présents en local via un <code>.env</code> absent en cluster.</li>
<li><b>DNS et proxy</b> d'entreprise obligatoire, CA interne absente de l'image.</li>
<li><b>Contraintes de sécurité</b> en cluster : non-root imposé, filesystem read-only, capabilities retirées.</li>
<li><b>Limites de ressources</b> qui déclenchent un OOM absent en local.</li>
</ol></div>

<h3>Docker Compose</h3>
<p>Décrit et lance plusieurs conteneurs liés sur UNE machine. Excellent en dev et en test d'intégration. <b>Ce n'est pas un orchestrateur de production</b> : pas de haute disponibilité, pas de scheduling multi-nœuds, pas de self-healing réel, pas de rolling update sûr.</p>

<h3>Chaîne d'approvisionnement</h3>
<ul>
<li>Registry privé (ECR, ACR, Harbor, Nexus) miroir des images de base approuvées et durcies.</li>
<li><b>Pin par digest</b> (<code>image@sha256:…</code>) en production — un tag est mutable et ne prouve rien.</li>
<li><b>Scan continu</b> (Trivy, Grype) : un scan au build ne suffit pas, les CVE apparaissent après.</li>
<li><b>Signature</b> (Cosign) + politique d'admission qui refuse les images non signées.</li>
<li><b>SBOM</b> généré au build : c'est ce qui permet de répondre en minutes à « quelle application utilise cette bibliothèque vulnérable ? ».</li>
</ul>
<div class="box dire"><b>La phrase qui montre le niveau</b>
« Un conteneur, ce n'est pas une machine légère : c'est un processus normal avec des namespaces, des cgroups et un rootfs overlay. Ça explique à la fois pourquoi il démarre en millisecondes et pourquoi l'isolation est plus faible qu'une VM — donc pourquoi on ne mutualise pas n'importe quoi sur un même nœud en environnement sensible. »</div>
`
}]);

</script>

id:"kubernetes",
titre:"Kubernetes",
lead:"Le domaine le plus challengé en entretien DevOps. Vise la profondeur : le cycle de vie, le réseau, le troubleshooting.",
html:`
<h3>Architecture</h3>
<table>
<tr><th>Composant</th><th>Rôle</th></tr>
<tr><td><b>kube-apiserver</b></td><td>Seule porte d'entrée : authN, authZ (RBAC), admission, validation, écriture dans etcd</td></tr>
<tr><td><b>etcd</b></td><td>Base clé-valeur distribuée (Raft) = l'unique source de vérité</td></tr>
<tr><td><b>kube-scheduler</b></td><td>Choisit un nœud pour chaque Pod non assigné (filtrage puis scoring)</td></tr>
<tr><td><b>controller-manager</b></td><td>Boucles de réconciliation (Deployment, ReplicaSet, Node, Job…)</td></tr>
<tr><td><b>kubelet</b></td><td>Agent sur chaque nœud : démarre les conteneurs via CRI, remonte le statut, exécute les probes</td></tr>
<tr><td><b>kube-proxy</b></td><td>Programme iptables/IPVS pour implémenter les Services</td></tr>
<tr><td><b>CoreDNS</b></td><td>DNS interne du cluster</td></tr>
</table>

<h3>Le chemin d'un <code>kubectl apply</code></h3>
<p>kubectl → API server (authentification, RBAC, <b>mutating</b> webhooks, validation de schéma, <b>validating</b> webhooks) → etcd → Deployment controller crée un ReplicaSet → ReplicaSet controller crée les Pods (sans nœud) → scheduler assigne un nœud → kubelet du nœud appelle containerd (CRI) → conteneurs démarrés → statut remonté.</p>
<p><b>Le concept clé</b> : boucle de réconciliation <em>level-triggered</em>. Les contrôleurs comparent en permanence état désiré et état observé, ils sont idempotents, et le système s'auto-répare même après une perte d'événements.</p>

<h3>Workloads</h3>
<table>
<tr><th>Objet</th><th>Pour quoi</th></tr>
<tr><td>Deployment</td><td>Stateless, Pods interchangeables, rolling update et rollback</td></tr>
<tr><td>StatefulSet</td><td>Identité stable (<code>db-0</code>), PVC par Pod, ordre de démarrage — bases, brokers</td></tr>
<tr><td>DaemonSet</td><td>Un Pod par nœud — agents de logs, CNI, monitoring</td></tr>
<tr><td>Job / CronJob</td><td>Traitement ponctuel / planifié</td></tr>
</table>

<h3>Probes — la question qui tombe toujours</h3>
<table>
<tr><th>Probe</th><th>Échec ⇒</th><th>Usage</th></tr>
<tr><td><b>liveness</b></td><td>Le conteneur est REDÉMARRÉ</td><td>Détecter un blocage définitif (deadlock)</td></tr>
<tr><td><b>readiness</b></td><td>Retiré des Endpoints (plus de trafic), pas de redémarrage</td><td>Dépendance temporairement indisponible, démarrage</td></tr>
<tr><td><b>startup</b></td><td>Désactive les deux autres tant qu'elle n'a pas réussi</td><td>Applications longues à démarrer (JVM)</td></tr>
</table>
<div class="box piege"><b>Piège liveness</b> : une liveness qui teste la base de données transforme une panne de base en boucle de redémarrage de TOUS les pods. La liveness ne doit tester QUE la santé interne du process. Les dépendances externes, c'est la readiness.</div>

<h3>Requests / limits</h3>
<ul>
<li><b>requests</b> : ce que le scheduler réserve. C'est la base du placement ET du calcul du HPA.</li>
<li><b>limits</b> : plafond. CPU dépassé → <b>throttling</b> (ralentissement). Mémoire dépassée → <b>OOMKill</b> immédiat (exit 137).</li>
<li>Classes QoS : <b>Guaranteed</b> (requests = limits, évincé en dernier), <b>Burstable</b>, <b>BestEffort</b> (rien de défini, évincé en premier).</li>
<li>Bonne pratique courante : requests mémoire = limits mémoire (la mémoire n'est pas compressible), et pas de limite CPU trop serrée pour éviter un throttling inutile.</li>
</ul>

<h3>Réseau</h3>
<p><b>Modèle CNI</b> : chaque Pod a son IP, tous les Pods se joignent <b>sans NAT</b>, un Pod se voit avec la même IP que les autres le voient.</p>
<table>
<tr><th>Service</th><th>Effet</th></tr>
<tr><td>ClusterIP</td><td>IP virtuelle interne (défaut)</td></tr>
<tr><td>NodePort</td><td>Port 30000-32767 ouvert sur chaque nœud</td></tr>
<tr><td>LoadBalancer</td><td>Provisionne un LB cloud</td></tr>
<tr><td>Headless (<code>clusterIP: None</code>)</td><td>Renvoie les IP des Pods — pour les StatefulSets</td></tr>
</table>
<p>DNS : <code>&lt;service&gt;.&lt;namespace&gt;.svc.cluster.local</code>. Pour un StatefulSet : <code>db-0.db.default.svc.cluster.local</code>.</p>
<p><b>NetworkPolicy</b> : par défaut tout est ouvert. Dès qu'une policy sélectionne un Pod dans une direction, tout le reste devient interdit DANS CETTE DIRECTION. Bonne pratique : default-deny par namespace puis ouverture explicite. Nécessite un CNI qui les implémente (Calico, Cilium).</p>

<h3>Stockage</h3>
<p><b>PVC</b> (la demande) → <b>StorageClass</b> (le type + provisioner) → <b>PV</b> (le volume réel, créé dynamiquement).</p>
<ul>
<li><code>ReadWriteOnce</code> : un seul nœud à la fois (disque bloc : EBS, Azure Disk).</li>
<li><code>ReadWriteMany</code> : plusieurs nœuds (NFS, EFS, Azure Files).</li>
<li><code>reclaimPolicy</code> : <b>Delete</b> (le volume part avec le PVC — dangereux en prod) vs <b>Retain</b>.</li>
<li>Un Pod RWO bloqué en Pending avec « Multi-Attach » = l'ancien nœud n'a pas relâché le volume. C'est une protection contre la double écriture, pas un bug.</li>
</ul>

<h3>Autoscaling</h3>
<table>
<tr><th>Mécanisme</th><th>Ajuste</th><th>Prérequis</th></tr>
<tr><td>HPA</td><td>Nombre de réplicas</td><td>metrics-server + <b>requests définies</b></td></tr>
<tr><td>VPA</td><td>requests/limits d'un Pod</td><td>Redémarre le Pod ; ne pas combiner avec HPA sur la même métrique</td></tr>
<tr><td>Cluster Autoscaler</td><td>Nombre de NŒUDS</td><td>Se déclenche sur des Pods Pending</td></tr>
<tr><td>KEDA</td><td>Réplicas sur événement (file, Kafka, cron)</td><td>Permet le scale-to-zero</td></tr>
</table>

<h3>Placement</h3>
<ul>
<li><b>Taint / toleration</b> : le NŒUD repousse ; seuls les Pods tolérants y vont (nœuds GPU, nœuds système).</li>
<li><b>nodeSelector / nodeAffinity</b> : le POD choisit où aller (required ou preferred).</li>
<li><b>podAntiAffinity</b> / <b>topologySpreadConstraints</b> : répartir les réplicas sur des nœuds et des zones différents. <b>Indispensable</b> pour une vraie HA — sinon les 3 réplicas peuvent atterrir sur le même nœud.</li>
<li><b>PodDisruptionBudget</b> : protège pendant les disruptions VOLONTAIRES (drain, upgrade). Ne protège pas d'un crash.</li>
</ul>

<h3>Troubleshooting — la méthode</h3>
<pre><code>kubectl get pods -o wide
kubectl describe pod &lt;pod&gt;            # EVENTS en bas = 80% des réponses
kubectl logs &lt;pod&gt; -c &lt;conteneur&gt; --previous --tail=200
kubectl get events --sort-by=.lastTimestamp -A
kubectl get endpoints &lt;svc&gt;            # vide = selector/readiness
kubectl exec -it &lt;pod&gt; -- sh
kubectl debug -it &lt;pod&gt; --image=busybox --target=&lt;conteneur&gt;   # image sans shell
kubectl top pods / nodes
kubectl auth can-i create pods --as=system:serviceaccount:ns:sa</code></pre>
<table>
<tr><th>Symptôme</th><th>Causes à vérifier dans l'ordre</th></tr>
<tr><td>Pending</td><td>Ressources insuffisantes → taints/affinity → PVC non lié → quota de namespace</td></tr>
<tr><td>ImagePullBackOff</td><td>Tag inexistant → imagePullSecret manquant → registry injoignable (proxy)</td></tr>
<tr><td>CrashLoopBackOff</td><td><code>logs --previous</code> : bug, config manquante, liveness trop stricte, OOM</td></tr>
<tr><td>OOMKilled (137)</td><td>Pic mémoire &gt; limit ; regarder le <b>max</b> du working set, pas la moyenne ; régler le heap sur le cgroup</td></tr>
<tr><td>Service sans trafic</td><td>Endpoints vides → selector ≠ labels → readiness KO → targetPort ≠ port écouté</td></tr>
<tr><td>502 pendant un déploiement</td><td>Race d'arrêt : ajouter <code>preStop</code> sleep, readiness qui bascule avant l'arrêt, arrêt gracieux</td></tr>
<tr><td>DNS intermittent</td><td>CoreDNS saturé, <code>ndots:5</code>, conntrack plein → NodeLocal DNSCache</td></tr>
</table>

<h3>Sécurité</h3>
<ul>
<li><b>RBAC</b> : Role (namespacé) / ClusterRole + RoleBinding / ClusterRoleBinding. Un ServiceAccount dédié par application, jamais <code>default</code>, jamais <code>cluster-admin</code>.</li>
<li><b>Pod Security Admission</b> : niveaux <code>privileged</code> / <code>baseline</code> / <code>restricted</code> par namespace.</li>
<li><b>Secrets</b> : base64, <b>pas chiffrés</b> par défaut dans etcd. Activer l'encryption at rest, ou externaliser (External Secrets Operator + Key Vault/Secrets Manager, CSI Secret Store).</li>
<li><b>Admission policies</b> (Kyverno, Gatekeeper) : imposer registry approuvé, image signée, non-root, labels obligatoires, interdiction de <code>latest</code>.</li>
<li><b>Identité cloud</b> : IRSA / Pod Identity (AWS), Workload Identity (Azure/GCP) — droits par application, aucune clé statique.</li>
</ul>

<h3>Helm / Kustomize / GitOps</h3>
<ul>
<li><b>Helm</b> : templating + gestion de releases. Bien pour packager du tiers. <code>helm template</code> pour voir le rendu, <code>helm diff</code> avant upgrade.</li>
<li><b>Kustomize</b> : superposition de patches sans templating, natif dans kubectl. Bien pour des variantes d'environnement.</li>
<li><b>Opérateur (CRD + contrôleur)</b> : quand il y a une logique CONTINUE (jour 2 : sauvegarde, bascule, upgrade). Helm ne fait que rendre un template à l'installation.</li>
<li><b>GitOps</b> (Argo CD, Flux) : l'agent dans le cluster tire depuis Git et réconcilie. Pas de credentials cluster dans la CI, dérive corrigée, rollback = revert Git.</li>
</ul>

<div class="box dire"><b>Ce qui distingue un candidat senior</b>
Il ne récite pas les objets : il parle du <b>cycle de vie</b> (comment un Pod naît, devient prêt, reçoit du trafic, s'arrête proprement), de ce qui casse et de comment il le détecte. Si on te demande « c'est quoi un Deployment », enchaîne spontanément sur le ReplicaSet, le rolling update et le rollback : tu réponds à la question suivante avant qu'elle soit posée.</div>
`
}]);

id:"helm-gitops",
titre:"Helm, Kustomize & GitOps",
lead:"Comment on déploie réellement dans Kubernetes — et pourquoi le GitOps est la réponse attendue en banque.",
html:`
<h3>Le problème à résoudre</h3>
<p>Des manifestes YAML bruts ne passent pas l'échelle : il faut les paramétrer par environnement, les versionner, les déployer de façon reproductible, savoir revenir en arrière et détecter les dérives. Trois familles d'outils y répondent différemment.</p>

<h3>Helm</h3>
<p>Un gestionnaire de paquets : un <b>chart</b> est un ensemble de templates Go + un <code>values.yaml</code>, installé sous forme de <b>release</b> versionnée dans le cluster.</p>
<pre><code>mon-chart/
  Chart.yaml          # nom, version du chart, version de l'app, dépendances
  values.yaml         # valeurs par défaut
  templates/
    deployment.yaml
    service.yaml
    _helpers.tpl      # fonctions de nommage réutilisables
    NOTES.txt</code></pre>
<pre><code>helm template mon-app ./chart -f values-prod.yaml   # voir le rendu SANS déployer
helm diff upgrade mon-app ./chart -f values-prod.yaml  # plugin, mais indispensable
helm upgrade --install mon-app ./chart -f values-prod.yaml \\
  --atomic --timeout 5m         # rollback automatique si échec
helm history mon-app
helm rollback mon-app 3</code></pre>
<table>
<tr><th>Points forts</th><th>Points faibles</th></tr>
<tr><td>Écosystème énorme pour le logiciel tiers</td><td>Templating Go peu lisible dès que ça se complique</td></tr>
<tr><td>Releases versionnées, rollback natif</td><td>Erreurs de template détectées tard</td></tr>
<tr><td>Dépendances entre charts</td><td>Ne gère rien après l'installation (pas de jour 2)</td></tr>
<tr><td>Hooks de cycle de vie (pre-upgrade…)</td><td>L'état de la release vit dans un Secret du cluster</td></tr>
</table>
<div class="box piege"><b>Pièges Helm</b>
<ul>
<li><code>--atomic</code> et <code>--wait</code> ne sont pas activés par défaut : sans eux, un upgrade « réussit » alors que les Pods ne démarrent pas.</li>
<li>Un <code>helm upgrade</code> sur un chart tiers dont on n'a pas figé la version peut tout changer sans prévenir — <b>toujours épingler <code>--version</code></b>.</li>
<li>Les hooks (<code>pre-upgrade</code>) ne sont pas rollbackés comme le reste : une migration jouée par un hook ne se défait pas.</li>
<li>Supprimer une release ne supprime pas les CRD installées par le chart — et supprimer une CRD supprime toutes ses instances.</li>
</ul></div>

<h3>Kustomize</h3>
<p>Pas de templating : une <b>base</b> de manifestes valides et des <b>overlays</b> qui appliquent des patches déclaratifs. Intégré nativement à kubectl (<code>kubectl apply -k</code>).</p>
<pre><code>base/
  kustomization.yaml    # liste des ressources + labels/annotations communs
  deployment.yaml
overlays/
  prod/
    kustomization.yaml  # patches, replicas, images, configMapGenerator
    patch-ressources.yaml</code></pre>
<pre><code>kubectl kustomize overlays/prod        # voir le rendu
kubectl apply -k overlays/prod</code></pre>
<p>Atouts : les fichiers de base restent des manifestes Kubernetes valides et lisibles, les <code>configMapGenerator</code>/<code>secretGenerator</code> ajoutent un hash au nom — ce qui <b>déclenche automatiquement un rollout</b> quand la config change (Helm ne le fait pas sans astuce de checksum).</p>
<p>Limite : pas de logique conditionnelle, pas de boucles. Au-delà d'un certain nombre de variantes, les overlays deviennent aussi illisibles que des templates.</p>

<h3>Helm ou Kustomize ?</h3>
<div class="box dire"><b>Réponse défendable en entretien</b>
« Helm pour packager et distribuer — notamment tout le logiciel tiers, où l'écosystème est incontournable. Kustomize pour décliner nos propres applications par environnement, parce qu'on garde des manifestes lisibles et qu'on évite une couche de templating. Les deux se combinent d'ailleurs : Argo CD sait rendre un chart Helm puis lui appliquer des patches Kustomize. »</div>

<h3>Opérateurs et CRD</h3>
<p>Une <b>CRD</b> ajoute un type d'objet à l'API Kubernetes ; un <b>opérateur</b> est le contrôleur qui l'implémente, encodant la connaissance opérationnelle : sauvegarde, bascule, montée de version, resharding.</p>
<p><b>Quand écrire un opérateur plutôt qu'un chart ?</b> Quand il y a une logique <b>continue</b> à appliquer. Helm ne fait que rendre un template au moment de l'installation ; il ne réagit à rien ensuite. Un opérateur réconcilie en permanence.</p>
<div class="box piege">Un opérateur tiers demande souvent des droits cluster très larges et installe des CRD : c'est une dépendance critique à traiter comme telle — revue de sécurité, version épinglée, compatibilité vérifiée avant chaque upgrade de cluster, et sauvegarde des ressources personnalisées (ce sont des données).</div>

<h3>GitOps</h3>
<p>L'état désiré est déclaré dans Git ; un <b>agent dans le cluster</b> (Argo CD, Flux) tire ce dépôt et réconcilie en continu.</p>
<table>
<tr><th></th><th>Push (CI classique)</th><th>Pull (GitOps)</th></tr>
<tr><td>Qui déploie</td><td>La CI, avec des credentials cluster</td><td>Un agent DANS le cluster</td></tr>
<tr><td>Credentials</td><td>Dans la CI — surface d'attaque</td><td>Aucun credential cluster à l'extérieur</td></tr>
<tr><td>Dérive</td><td>Non détectée</td><td>Détectée et corrigée automatiquement</td></tr>
<tr><td>Rollback</td><td>Rejouer un pipeline</td><td><code>git revert</code></td></tr>
<tr><td>Audit</td><td>Logs de pipeline</td><td>Historique Git = preuve de l'état désiré</td></tr>
<tr><td>Nouveau cluster</td><td>Rejouer tous les pipelines</td><td>Pointer l'agent sur le dépôt</td></tr>
</table>

<h3>Le pattern à deux dépôts</h3>
<pre><code>depot-application/          depot-deploiement/
  src/                        apps/mon-app/
  Dockerfile                    base/
  .gitlab-ci.yml                overlays/{dev,rec,prod}/

CI : build → test → push image:sha-abc123
   → ouvre une PR sur depot-deploiement qui bump le tag
   → l'approbation de CETTE PR est l'autorisation de mise en production
   → Argo CD détecte le merge et applique</code></pre>
<p>Bénéfice majeur en banque : l'autorisation de déploiement devient une <b>revue de code tracée et signée</b>, ce qui satisfait la séparation des tâches sans ajouter de guichet manuel.</p>

<h3>Argo CD — les notions à connaître</h3>
<ul>
<li><b>Application</b> : la liaison entre une source (dépôt + chemin + révision) et une destination (cluster + namespace).</li>
<li><b>Sync policy</b> : manuelle ou automatique, avec <code>prune</code> (supprimer ce qui a disparu de Git) et <code>selfHeal</code> (annuler les modifications faites à la main dans le cluster).</li>
<li><b>Statut</b> : <code>Synced</code>/<code>OutOfSync</code> (conformité à Git) et <code>Healthy</code>/<code>Degraded</code> (santé réelle) — deux axes distincts.</li>
<li><b>Sync waves</b> et hooks pour ordonner (migration de base avant l'application).</li>
<li><b>App of Apps</b> ou ApplicationSet pour générer des dizaines d'applications à partir d'un modèle.</li>
</ul>
<div class="box piege"><b>La question piège</b> : « avec <code>selfHeal</code> activé, que se passe-t-il si un ingénieur corrige un incident en modifiant un Deployment à la main ? » — Argo annule sa correction en quelques secondes. D'où l'importance de savoir suspendre la synchronisation pendant un incident, et de faire passer le correctif par Git ensuite.</div>

<h3>Les secrets en GitOps</h3>
<p>Le problème : l'état désiré est dans Git, mais on n'y met pas de secrets en clair. Trois réponses :</p>
<ol>
<li><b>External Secrets Operator / Secrets Store CSI</b> : le secret reste dans Key Vault / Secrets Manager / Vault, le cluster le synchronise ou le monte. <b>Approche à privilégier en banque</b> : rotation centralisée, accès audité.</li>
<li><b>Sealed Secrets / SOPS</b> : le secret CHIFFRÉ est versionné dans Git, seul le cluster peut le déchiffrer. Simple, mais la rotation et la révocation sont manuelles.</li>
<li>Injection au runtime par un agent (Vault Agent) : rien n'est stocké côté cluster.</li>
</ol>

id:"terraform",
titre:"Terraform & IaC",
lead:"Le state, le découpage et le workflow d'équipe : c'est là-dessus qu'on distingue un utilisateur d'un praticien.",
html:`
<h3>Le workflow</h3>
<pre><code>terraform init          # providers, modules, backend, lock file
terraform fmt -recursive
terraform validate      # syntaxe et cohérence, sans appel API
terraform plan -out=tf.plan
terraform apply tf.plan # applique CE plan-là, pas un replan
terraform destroy</code></pre>
<p>Symboles du plan : <code>+</code> création, <code>-</code> destruction, <code>~</code> modification en place, <code>-/+</code> <b>remplacement</b> (destroy puis create). Chercher systématiquement la mention <code># forces replacement</code>.</p>

<h3>Le state</h3>
<ul>
<li>Il mémorise la correspondance code ↔ ressources réelles (IDs, attributs, dépendances). Sans lui, Terraform ne sait plus ce qu'il gère.</li>
<li>Il contient souvent des <b>secrets en clair</b> : jamais dans Git, toujours en backend distant chiffré, accès restreint.</li>
<li><b>Backend distant obligatoire à plusieurs</b>, pour le partage ET le <b>verrouillage</b> : sans lock, deux apply simultanés corrompent le state.</li>
</ul>
<pre><code>terraform {
  required_version = "~> 1.9"
  required_providers {
    azurerm = { source = "hashicorp/azurerm", version = "~> 4.0" }
  }
  backend "azurerm" {
    resource_group_name  = "rg-tfstate"
    storage_account_name = "sttfstateprod"
    container_name       = "tfstate"
    key                  = "plateforme/prod.tfstate"
  }
}</code></pre>
<p>Équivalent AWS : backend <code>s3</code> avec <code>encrypt = true</code>, versioning activé et verrouillage (DynamoDB ou lockfile natif S3).</p>

<h3>Commandes de state</h3>
<table>
<tr><th>Commande</th><th>Effet</th><th>Quand</th></tr>
<tr><td><code>state list / show</code></td><td>Inspecter</td><td>Diagnostic</td></tr>
<tr><td><code>import</code> (ou bloc <code>import</code>)</td><td>Prendre en gestion une ressource existante</td><td>Reprise d'infra manuelle</td></tr>
<tr><td><code>state rm</code></td><td>Retirer du state <b>sans détruire</b></td><td>Abandonner la gestion, migrer vers un autre state</td></tr>
<tr><td><code>state mv</code> / bloc <code>moved</code></td><td>Changer l'adresse d'une ressource</td><td>Refactoring — <b>préférer le bloc <code>moved</code></b> : versionné et revu en PR</td></tr>
<tr><td><code>force-unlock &lt;id&gt;</code></td><td>Libérer un verrou coincé</td><td>Après avoir VÉRIFIÉ qu'aucun apply ne tourne</td></tr>
<tr><td><code>taint</code> / <code>-replace</code></td><td>Forcer la recréation</td><td>Ressource dans un état incohérent</td></tr>
</table>
<p><b>L'import ne génère pas le code</b> : on écrit d'abord la ressource, on importe, puis on itère sur le plan jusqu'à « no changes ».</p>

<h3>count vs for_each</h3>
<pre><code># count : indexé par POSITION → supprimer un élément décale tout
resource "azurerm_storage_account" "s" { count = 3 }

# for_each : indexé par CLÉ → adresse stable
resource "azurerm_storage_account" "s" {
  for_each = { logs = "Standard_LRS", data = "Standard_GRS" }
  name     = "st\${each.key}"
  account_replication_type = each.value
}</code></pre>
<p><b>Règle</b> : <code>count</code> uniquement pour un booléen (0 ou 1). <code>for_each</code> dès que les éléments sont distincts. La clé doit venir d'une valeur <b>connue au plan</b> — sinon Terraform refuse (« known after apply »).</p>

<h3>lifecycle</h3>
<pre><code>lifecycle {
  prevent_destroy       = true                # bloque toute destruction (base prod)
  create_before_destroy = true                # crée le remplaçant avant de supprimer
  ignore_changes        = [tags["LastScan"]]  # ignorer une dérive légitime
  replace_triggered_by  = [null_resource.v]   # forcer un remplacement piloté
}</code></pre>

<h3>Structure d'un module</h3>
<pre><code>modules/reseau/
  main.tf        # ressources
  variables.tf   # entrées typées, avec description et validation
  outputs.tf     # tout ce dont l'appelant a besoin
  versions.tf    # required_providers
  README.md</code></pre>
<pre><code>variable "environnement" {
  type        = string
  description = "dev | rec | prod"
  validation {
    condition     = contains(["dev","rec","prod"], var.environnement)
    error_message = "Environnement invalide."
  }
}</code></pre>
<div class="box piege"><b>Un module ne déclare JAMAIS</b> de bloc <code>provider</code> ni de <code>backend</code> : il les reçoit du root module (<code>providers = { aws = aws.eu }</code>). Un module qui définit son provider ne peut plus être supprimé proprement.</div>

<h3>Découpage des states</h3>
<p>On découpe par <b>rayon d'impact</b> et par <b>cycle de vie</b> :</p>
<ul>
<li><b>Socle / landing zone</b> : réseau, IAM, DNS, journalisation. Change rarement, très critique, droits très restreints.</li>
<li><b>Plateforme</b> : cluster, registry, coffres, bases partagées.</li>
<li><b>Applications</b> : un state par application × environnement. Change souvent, risque circonscrit.</li>
</ul>
<p>Bénéfices : plan rapide, erreur limitée, verrous indépendants, droits séparés. Coût : des contrats entre states. Pour lire une valeur produite ailleurs, préférer une <b>data source sur une source de vérité</b> (SSM Parameter, Key Vault, tag) plutôt que <code>terraform_remote_state</code>, qui exige un droit de lecture sur tout le state distant — donc sur ses secrets.</p>

<h3>Multi-région / multi-compte</h3>
<pre><code>provider "aws" { region = "eu-west-3" }
provider "aws" { alias = "us", region = "us-east-1" }

resource "aws_acm_certificate" "cdn" {
  provider = aws.us    # CloudFront exige us-east-1
  ...
}</code></pre>

<h3>Pipeline Terraform d'entreprise</h3>
<ol>
<li><b>PR</b> → <code>fmt -check</code>, <code>validate</code>, <code>tflint</code></li>
<li>Scan conformité : <b>tfsec / Checkov / OPA-Conftest</b> sur le plan JSON</li>
<li><code>plan</code> publié en commentaire de PR, relu par un humain (2 yeux en prod)</li>
<li>Merge → <code>apply</code> du <b>plan sauvegardé</b></li>
<li>Tests de smoke + notification</li>
<li>Détection de drift planifiée (<code>plan -detailed-exitcode</code>, code 2 = dérive)</li>
</ol>
<p>Authentification du pipeline par <b>OIDC</b> (aucun secret longue durée), environnements protégés avec approbation manuelle sur la prod, séparation des identités plan (lecture) et apply (écriture).</p>

<h3>Problèmes classiques</h3>
<table>
<tr><th>Symptôme</th><th>Cause / réponse</th></tr>
<tr><td>Diff perpétuel</td><td>L'API renvoie une valeur normalisée différente (casse, ordre, JSON). Écrire la forme canonique, sinon <code>ignore_changes</code> ciblé</td></tr>
<tr><td>Veut détruire/recréer</td><td>Un attribut immuable a changé. Lire <code># forces replacement</code>. Parade : <code>moved</code>, <code>ignore_changes</code>, <code>prevent_destroy</code></td></tr>
<tr><td>Apply échoué à mi-chemin</td><td>Le state reflète ce qui a été créé. On relance un <b>plan</b>, on corrige, on ré-applique — on ne restaure pas un vieux state à l'aveugle</td></tr>
<tr><td>Ressource supprimée à la main</td><td>Terraform la recrée au prochain apply. Sinon : import ou <code>state rm</code> + suppression du code</td></tr>
<tr><td>Erreur de verrouillage</td><td>Un autre apply tourne (ou a planté). Vérifier avant tout <code>force-unlock</code></td></tr>
<tr><td>Throttling API (429)</td><td>Réduire <code>-parallelism</code> (défaut 10)</td></tr>
</table>

<h3>Terraform vs natif</h3>
<table>
<tr><th></th><th>Terraform</th><th>Bicep / CloudFormation</th></tr>
<tr><td>Portée</td><td>Multi-fournisseur, y compris hors cloud (DNS, GitHub, Datadog, Vault)</td><td>Un seul cloud</td></tr>
<tr><td>State</td><td>À gérer et sécuriser</td><td>Géré par la plateforme</td></tr>
<tr><td>Nouveautés</td><td>Délai provider</td><td>Support dès le jour 1</td></tr>
<tr><td>Argument</td><td>Homogénéité des pratiques et des compétences</td><td>Zéro état à opérer, support éditeur</td></tr>
</table>

<div class="box dire"><b>Phrase qui rassure un architecte bancaire</b>
« Le state est un actif critique : backend managé répliqué et versionné, chiffrement, verrouillage, accès limité aux pipelines, restauration testée. Et en dernier recours, il est reconstructible par import — contrairement à une infrastructure non décrite, que personne ne sait recréer. »</div>
`

id:"ansible",
titre:"Ansible & gestion de configuration",
lead:"Le parc de VM ne disparaîtra pas. En banque, Ansible reste omniprésent — et c'est un sujet où beaucoup de candidats cloud sont pris de court.",
html:`
<h3>Où Ansible se place</h3>
<table>
<tr><th>Outil</th><th>Répond à</th></tr>
<tr><td><b>Terraform</b></td><td><i>Provisionner</i> : créer la VM, le réseau, la base — le CYCLE DE VIE des ressources</td></tr>
<tr><td><b>Ansible</b></td><td><i>Configurer</i> : ce qui se passe DANS la machine — paquets, fichiers, services, utilisateurs</td></tr>
<tr><td><b>Packer</b></td><td><i>Fabriquer l'image</i> : figer une configuration dans une AMI / image managée</td></tr>
</table>
<div class="box dire"><b>La réponse attendue sur « Terraform ou Ansible ? »</b>
« Ce ne sont pas des concurrents. Terraform gère le cycle de vie de l'infrastructure, Ansible la configuration à l'intérieur. Dans une approche immuable, on utilise plutôt Packer + Ansible pour construire une image dorée, et Terraform pour déployer cette image — on ne configure plus les machines en place, on les remplace. Ansible garde toute sa valeur sur le legacy, les appliances, les bases, et l'orchestration de procédures (bascules, patching coordonné). »</div>

<h3>Les concepts</h3>
<table>
<tr><th>Terme</th><th>Ce que c'est</th></tr>
<tr><td><b>Inventaire</b></td><td>La liste des hôtes, groupés (statique en INI/YAML, ou dynamique depuis AWS/Azure)</td></tr>
<tr><td><b>Playbook</b></td><td>Un fichier YAML : quelles tâches, sur quels hôtes, dans quel ordre</td></tr>
<tr><td><b>Tâche (task)</b></td><td>Un appel à un module, avec ses paramètres</td></tr>
<tr><td><b>Module</b></td><td>L'unité de travail (<code>apt</code>, <code>copy</code>, <code>systemd</code>, <code>user</code>…) — c'est lui qui porte l'idempotence</td></tr>
<tr><td><b>Rôle</b></td><td>Un ensemble réutilisable et structuré (tasks, handlers, templates, defaults, vars)</td></tr>
<tr><td><b>Handler</b></td><td>Une tâche déclenchée SEULEMENT si une autre a produit un changement (redémarrer nginx)</td></tr>
<tr><td><b>Facts</b></td><td>Les informations collectées sur l'hôte (OS, IP, mémoire), utilisables comme variables</td></tr>
<tr><td><b>Collection</b></td><td>Le format de distribution moderne (modules + rôles + plugins), installé via Ansible Galaxy</td></tr>
</table>

<h3>Ce qui distingue Ansible</h3>
<ul>
<li><b>Sans agent</b> : il se connecte en SSH (ou WinRM) et exécute du Python sur la cible. Rien à installer ni à maintenir sur les serveurs — argument décisif face à Puppet ou Chef en environnement contraint.</li>
<li><b>Push</b> : c'est le poste de contrôle qui déclenche, contrairement au modèle pull de Puppet/Chef. Simple, mais il faut un déclencheur (pipeline, AWX/Tower).</li>
<li><b>Déclaratif au niveau du module</b>, procédural au niveau du playbook : les tâches s'exécutent dans l'ordre, mais chaque module vise un ÉTAT.</li>
</ul>

<h3>L'idempotence — le concept central</h3>
<p>Rejouer le même playbook ne doit rien changer si l'état est déjà correct. Ansible le rapporte : <code>ok</code> (déjà conforme) vs <code>changed</code> (a modifié).</p>
<div class="box piege"><b>Ce qui casse l'idempotence</b>
<ul>
<li>Le module <b><code>shell</code> / <code>command</code></b> : Ansible ne peut pas savoir si l'action est nécessaire — il l'exécute toujours et rapporte <code>changed</code>. Correctifs : <code>creates=</code>, <code>removes=</code>, <code>when:</code>, ou <code>changed_when: false</code> pour une commande de simple lecture.</li>
<li><code>lineinfile</code> avec une regex trop lâche, qui réécrit à chaque passage.</li>
<li>Toute génération aléatoire ou horodatée dans un template.</li>
</ul>
Règle : chercher d'abord un module dédié. <code>shell</code> est un aveu d'échec — accepté, mais à justifier.</div>

<h3>Un playbook lisible</h3>
<pre><code>---
- name: Socle applicatif
  hosts: web
  become: true
  vars:
    version_app: "1.4.2"
  tasks:
    - name: Paquets requis
      ansible.builtin.apt:
        name: [nginx, curl]
        state: present
        update_cache: true

    - name: Configuration nginx
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        owner: root
        mode: "0644"
        validate: "nginx -t -c %s"     # refuse d'écrire une conf invalide
      notify: Recharger nginx

    - name: Service actif au démarrage
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Recharger nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded</code></pre>
<p>Points de qualité visibles ici : noms explicites, modules dédiés plutôt que <code>shell</code>, <code>validate</code> qui empêche de casser le service, handler déclenché uniquement sur changement réel.</p>

<h3>Structure d'un projet</h3>
<pre><code>inventaires/
  prod/hosts.yml
  prod/group_vars/web.yml
  rec/hosts.yml
roles/
  socle/{tasks,handlers,templates,defaults,vars,meta}/
  applicatif/
playbooks/
  site.yml
ansible.cfg
requirements.yml        # collections et rôles externes, VERSIONNÉS</code></pre>
<p><b>Précédence des variables</b> : <code>defaults/</code> du rôle (la plus faible, donc surchargeable) &lt; <code>group_vars</code> &lt; <code>host_vars</code> &lt; <code>vars/</code> du rôle &lt; <code>-e</code> en ligne de commande (la plus forte). Mettre les valeurs par défaut dans <code>defaults/</code> et jamais dans <code>vars/</code> est ce qui rend un rôle réutilisable.</p>

<h3>Sécurité et secrets</h3>
<ul>
<li><b>Ansible Vault</b> chiffre des fichiers ou des variables : <code>ansible-vault encrypt_string</code>. La clé de déchiffrement doit venir d'un coffre ou du pipeline, jamais d'un fichier commité.</li>
<li>Mieux : lire les secrets à l'exécution depuis Key Vault / Secrets Manager / HashiCorp Vault via un lookup, pour ne rien stocker dans le dépôt.</li>
<li><code>no_log: true</code> sur les tâches manipulant un secret, sinon il apparaît dans la sortie et les logs du pipeline.</li>
<li>Le poste (ou le runner) qui exécute Ansible détient des accès SSH privilégiés sur tout le parc : c'est une cible de premier ordre, à traiter comme un bastion.</li>
</ul>

<h3>Exploitation</h3>
<pre><code>ansible-playbook site.yml --check --diff     # dry-run + montre les différences
ansible-playbook site.yml --limit web-03      # cibler un hôte
ansible-playbook site.yml --tags nginx
ansible-playbook site.yml --start-at-task "Configuration nginx"
ansible-inventory --graph
ansible-lint                                   # qualité, en CI</code></pre>
<p><b><code>--check --diff</code> est l'équivalent du <code>terraform plan</code></b> : c'est le réflexe à citer. Limite honnête : en mode check, les tâches dépendant du résultat d'une tâche précédente non exécutée peuvent échouer ou rapporter faux.</p>

<h3>Déploiement sans coupure</h3>
<pre><code>- hosts: web
  serial: "25%"          # par vagues de 25% du parc
  max_fail_percentage: 0 # on arrête au premier échec
  pre_tasks:
    - name: Retirer du load balancer
      ...
  post_tasks:
    - name: Remettre dans le load balancer après contrôle de santé
      ...</code></pre>
<p><code>serial</code> transforme un playbook en <b>rolling update</b>. C'est ce qui permet de patcher un parc en production sans interruption, et c'est exactement l'usage bancaire typique.</p>

<h3>À savoir dire en entretien</h3>
<div class="box dire">
<ul>
<li>« Ansible ne remplace pas Terraform : l'un provisionne, l'autre configure. »</li>
<li>« Je préfère l'immuable quand c'est possible — Packer + Ansible pour construire l'image, puis on remplace les machines au lieu de les modifier. Ansible en place reste pertinent pour le legacy et l'orchestration de procédures. »</li>
<li>« L'idempotence n'est pas magique : elle vient des modules. Dès qu'on tombe dans <code>shell</code>, c'est à nous de la garantir. »</li>
<li>« En CI : <code>ansible-lint</code>, puis <code>--check --diff</code> sur un environnement de recette avant tout run en production, et un déploiement par vagues avec <code>serial</code>. »</li>
</ul></div>
`
}]);

</script>
