titre:"Plan de révision 15 jours",
lead:"Comment utiliser ce dossier pour arriver prêt le jour J.",
html:`
<h3>Le principe</h3>
<p>Tu ne retiendras pas en lisant. Tu retiendras en <b>essayant de répondre à voix haute, en te trompant, puis en corrigeant</b>. Le quiz est donc l'outil principal ; les fiches ne servent qu'à combler les trous que le quiz révèle.</p>
<p>Règle de fer : ne lis une fiche qu'<b>après</b> avoir raté les questions du domaine correspondant. Lire avant donne l'illusion de savoir.</p>

<h3>Rythme quotidien (≈ 2 à 3 h)</h3>
<ol>
<li><b>15 min — Révision du jour</b> : bouton « Révision du jour » dans le quiz. Ce sont les questions dues selon la répétition espacée. Non négociable, tous les jours.</li>
<li><b>45 min — Nouveau niveau</b> : un niveau du quiz, en formulant chaque réponse <b>à voix haute et en entier</b> avant de taper. Si tu ne peux pas l'expliquer oralement, tu ne le sais pas.</li>
<li><b>30 min — Fiches</b> : lis uniquement les fiches des domaines où tu es tombé sous 70 %.</li>
<li><b>45 min — Pratique réelle</b> : tape les commandes, écris le Terraform, casse un pod. La mémoire des mains compte double en entretien technique.</li>
<li><b>15 min — Mes points faibles</b> : bouton dédié, en fin de session.</li>
</ol>

<h3>Découpage sur 15 jours</h3>
<table>
<tr><th>Jours</th><th>Quiz</th><th>Focus pratique</th></tr>
<tr><td>J1–J2</td><td>Niveaux 1 et 2</td><td>Linux : permissions, redirections, systemd, scripts avec <code>set -euo pipefail</code></td></tr>
<tr><td>J3–J4</td><td>Niveau 3</td><td>Docker : multi-stage, non-root, debug d'un conteneur qui plante</td></tr>
<tr><td>J5–J6</td><td>Niveau 4</td><td>Kubernetes : deployment + service + ingress, probes, requests/limits</td></tr>
<tr><td>J7–J8</td><td>Niveau 5</td><td>Terraform : modules, for_each, backend distant, import, moved</td></tr>
<tr><td>J9–J10</td><td>Niveau 6</td><td>Troubleshooting : casse volontairement des choses et répare-les chronomètre en main</td></tr>
<tr><td>J11–J12</td><td>Niveaux 7 et 8</td><td>Architecture : dessine 3 archi au tableau (web 3-tiers, microservices, DR)</td></tr>
<tr><td>J13</td><td>Niveau 9</td><td>Gouvernance, coûts, conformité — spécifique banque</td></tr>
<tr><td>J14</td><td>Niveau 10</td><td>Oral : réponds aux 28 questions à voix haute, chronométré, sans lire</td></tr>
<tr><td>J15</td><td>Marathon complet</td><td>Repos relatif. Relis la fiche « Jour J » uniquement.</td></tr>
</table>

<div class="box dire"><b>À faire absolument</b>
Enregistre-toi en train de répondre à 5 questions du niveau 10. Réécoute. C'est brutal, et c'est ce qui te fera progresser le plus vite sur la forme — le débit, les « euh », les réponses qui partent dans tous les sens.</div>

<h3>Ce qui est évalué par trois seniors</h3>
<ul>
<li><b>La profondeur</b> : ils vont relancer 3 fois sur la même question. « Et pourquoi ? », « et si ça tombe ? », « et à 10 000 req/s ? ». Une réponse apprise par cœur s'effondre à la deuxième relance.</li>
<li><b>L'honnêteté</b> : dire « je ne sais pas, voilà comment je chercherais » vaut mieux qu'un bluff. Ils sont trois : l'un des trois saura.</li>
<li><b>Le raisonnement d'exploitant</b> : qu'est-ce qui casse, comment tu le détectes, comment tu reviens en arrière. Beaucoup plus que la syntaxe.</li>
<li><b>L'arbitrage</b> : à leur niveau, il n'y a pas de bonne réponse universelle. Il y a un contexte, des contraintes et un choix assumé.</li>
</ul>

<h3>Les 10 sujets qui tombent quasi sûrement</h3>
<ol>
<li>Explique ce qui se passe quand tu tapes une URL (version infra).</li>
<li>Différence Security Group / NACL, ou NSG / Azure Firewall.</li>
<li>Le state Terraform : à quoi il sert, comment tu le sécurises, que fait-on à plusieurs.</li>
<li>Pod en CrashLoopBackOff / Pending : ta démarche de diagnostic.</li>
<li>Comment tu gères les secrets dans un pipeline.</li>
<li>Rolling update, blue/green, canary : différences et quand tu prends quoi.</li>
<li>Comment tu fais un rollback quand la base a été migrée.</li>
<li>Requests vs limits, et pourquoi un pod se fait OOMKill.</li>
<li>Comment tu construis un SLO et à quoi sert un error budget.</li>
<li>Raconte un incident que tu as géré.</li>
</ol>
`
}]);

id:"linux",
titre:"Linux & Bash",
lead:"Le socle. Un DevOps qui bafouille sur Linux perd la confiance des seniors en 3 minutes.",
html:`
<h3>Permissions</h3>
<p>Format <code>drwxr-xr-x</code> : 1er caractère = TYPE (<code>d</code> répertoire, <code>-</code> fichier, <code>l</code> lien), puis 3 triplets rwx pour propriétaire / groupe / autres.</p>
<table>
<tr><th>Octal</th><th>Droits</th><th>Usage typique</th></tr>
<tr><td>400</td><td>r--------</td><td>Clé privée .pem non modifiable</td></tr>
<tr><td>600</td><td>rw-------</td><td>Clé SSH, fichier de secrets</td></tr>
<tr><td>644</td><td>rw-r--r--</td><td>Fichier de config lisible</td></tr>
<tr><td>755</td><td>rwxr-xr-x</td><td>Script exécutable, répertoire</td></tr>
</table>
<p>Sur un répertoire : <code>x</code> = droit de TRAVERSER, <code>r</code> = droit de LISTER. Un répertoire en 644 est illisible en pratique.</p>
<p>Bits spéciaux : <b>setuid</b> (4xxx, s'exécute avec les droits du propriétaire — <code>passwd</code>), <b>setgid</b> (2xxx, hérite du groupe), <b>sticky bit</b> (1xxx, seul le propriétaire peut supprimer — <code>/tmp</code>).</p>

<h3>Processus et signaux</h3>
<table>
<tr><th>Signal</th><th>N°</th><th>Effet</th></tr>
<tr><td>SIGHUP</td><td>1</td><td>Rechargement de config (convention)</td></tr>
<tr><td>SIGINT</td><td>2</td><td>Ctrl+C, interceptable</td></tr>
<tr><td>SIGTERM</td><td>15</td><td>Arrêt propre demandé, interceptable — le défaut de <code>kill</code></td></tr>
<tr><td>SIGKILL</td><td>9</td><td>Tué par le noyau, NON interceptable</td></tr>
<tr><td>SIGSTOP</td><td>19</td><td>Suspend, non interceptable</td></tr>
</table>
<p>Exit code d'un process tué par signal = <b>128 + n°</b>. Donc <b>137</b> = SIGKILL (souvent OOM), <b>143</b> = SIGTERM. À connaître par cœur : ça tombe sur Kubernetes.</p>
<p>États : R (running), S (sleep interruptible), <b>D</b> (uninterruptible, attente I/O — compte dans la load), Z (zombie), T (stoppé).</p>

<h3>Diagnostic — la séquence à réciter</h3>
<pre><code>uptime              # load 1/5/15 min — comparer au nb de cœurs (nproc)
top / htop          # qui consomme, %CPU, %MEM, %wa
free -m             # mémoire + SWAP (swap actif = mort lente)
vmstat 1 5          # si/so (swap in/out), wa (iowait), r (run queue)
iostat -x 1         # %util par device, await
df -h / df -i       # espace ET inodes
ss -tulnp           # ports en écoute + process
dmesg -T | tail     # OOM killer, erreurs matérielles, réseau
journalctl -u svc -f --since "10 min ago"</code></pre>

<div class="box piege"><b>Pièges classiques</b>
<ul>
<li><b>Load élevée mais CPU bas</b> = attente I/O (état D), pas un problème de CPU.</li>
<li><b>df plein mais du ne trouve rien</b> = fichier supprimé encore ouvert (<code>lsof | grep deleted</code>) ou inodes épuisés (<code>df -i</code>).</li>
<li><b>« Too many open files »</b> = <code>LimitNOFILE</code> dans l'unité systemd, pas <code>ulimit</code> dans le shell. Et chercher la fuite d'abord.</li>
<li><b>Le swap qui s'active</b> dégrade tout : mieux vaut souvent un OOM franc qu'un serveur qui rame une heure.</li>
</ul></div>

<h3>Bash — les réflexes de production</h3>
<pre><code>#!/usr/bin/env bash
set -euo pipefail          # échec immédiat, var non définie = erreur, échec dans un pipe
IFS=$'\\n\\t'               # évite le découpage sur les espaces
trap 'echo "erreur ligne $LINENO" >&2' ERR
trap 'rm -f "$TMP"' EXIT   # nettoyage garanti

TMP=$(mktemp)
: "\${API_URL:?API_URL est obligatoire}"   # échoue avec un message clair</code></pre>
<ul>
<li><code>"$@"</code> et jamais <code>$*</code> pour relayer des arguments.</li>
<li>Toujours guillemeter les variables : <code>"$var"</code>. Un chemin avec espace casse tout sinon.</li>
<li><code>$(cmd)</code> plutôt que les backticks (imbricable, lisible).</li>
<li><code>[[ ]]</code> plutôt que <code>[ ]</code> en bash (pas de découpage de mots, regex avec <code>=~</code>).</li>
<li>Vérifier avec <b>shellcheck</b> en CI — mentionne-le, c'est un signal de maturité.</li>
</ul>

<h3>Texte : les 5 outils qui suffisent</h3>
<pre><code>grep -rniE "pattern" .          # récursif, insensible, numéros de ligne, regex étendue
grep -v / -c / -A3 -B3          # inverse / compte / contexte
awk -F: '{print $1, $3}'        # colonnes, séparateur custom
awk '$3 > 100 {sum+=$3} END{print sum}'
sed -i 's/ancien/nouveau/g' f   # remplacement en place
sort -k2 -rn | uniq -c | head   # tri numérique inverse + comptage
cut -d: -f1,3 /etc/passwd
xargs -r -n1 -P4 cmd            # parallélisation, -r = rien si entrée vide
find . -type f -mtime +30 -name "*.log" -delete</code></pre>
<p><b>À retenir</b> : <code>uniq</code> ne dédoublonne que des lignes ADJACENTES → toujours <code>sort | uniq</code>.</p>

<h3>systemd</h3>
<pre><code>systemctl status|start|stop|restart|reload mon.service
systemctl enable --now mon.service     # au boot + tout de suite
systemctl list-units --failed
systemctl daemon-reload                # après modif d'un fichier .service
journalctl -u mon.service -f -n 100 --since "1 hour ago" -p err</code></pre>
<pre><code>[Unit]
Description=Mon API
After=network-online.target

[Service]
Type=simple
User=app
ExecStart=/opt/app/bin/api
Restart=on-failure
RestartSec=5
LimitNOFILE=65536
Environment=NODE_ENV=production

[Install]
WantedBy=multi-user.target</code></pre>
<p><code>enable</code> ≠ <code>start</code> : <code>enable</code> crée le lien pour le boot, il ne lance rien maintenant (d'où <code>--now</code>).</p>

<h3>Namespaces & cgroups (le socle des conteneurs)</h3>
<table>
<tr><th>Mécanisme</th><th>Rôle</th><th>Exemples</th></tr>
<tr><td>Namespaces</td><td>Isolent ce que le process VOIT</td><td>pid, net, mnt, uts, ipc, user, cgroup</td></tr>
<tr><td>cgroups</td><td>Limitent ce qu'il CONSOMME</td><td>cpu, memory, io, pids</td></tr>
<tr><td>capabilities</td><td>Découpent les privilèges root</td><td>NET_ADMIN, SYS_TIME…</td></tr>
</table>
<p>Un conteneur = un processus normal + namespaces + cgroups + un rootfs overlay. Savoir dire ça posément impressionne toujours.</p>

<div class="box dire"><b>Formulation qui marque des points</b>
« Avant de regarder l'application, je valide le système : load, mémoire et swap, iowait, espace disque et inodes, ports en écoute, et <code>dmesg</code> pour un éventuel OOM. Ça élimine 80 % des fausses pistes en deux minutes. »</div>
`
}]);

<script>
/* fiches/02-reseau.js */
window.FICHES = (window.FICHES || []).concat([{
id:"reseau",
titre:"Réseau (TCP/IP, DNS, TLS, HTTP)",
lead:"Le domaine où les seniors coincent le plus de candidats, parce que tout le monde le survole.",
html:`
<h3>Adressage et masques — à savoir de tête</h3>
<table>
<tr><th>CIDR</th><th>Adresses</th><th>Utilisables (AWS)</th><th>Usage</th></tr>
<tr><td>/16</td><td>65 536</td><td>—</td><td>Un VPC / VNet entier</td></tr>
<tr><td>/24</td><td>256</td><td>251</td><td>Un subnet standard</td></tr>
<tr><td>/26</td><td>64</td><td>59</td><td>Petit subnet (endpoints, bastion)</td></tr>
<tr><td>/28</td><td>16</td><td>11</td><td>Minimum AWS</td></tr>
<tr><td>/32</td><td>1</td><td>—</td><td>Une IP unique (règles de firewall)</td></tr>
</table>
<p>Calcul rapide : <b>2^(32 − masque)</b>. AWS réserve 5 adresses par subnet (réseau, routeur, DNS, réservé, broadcast), Azure en réserve 5 aussi.</p>
<p>Plages privées RFC1918 : <code>10.0.0.0/8</code>, <code>172.16.0.0/12</code>, <code>192.168.0.0/16</code>. Ne jamais choisir un plan qui chevauche celui de l'on-premise : le peering et le VPN deviennent impossibles.</p>

<h3>TCP vs UDP</h3>
<table>
<tr><th></th><th>TCP</th><th>UDP</th></tr>
<tr><td>Connexion</td><td>Handshake 3 temps (SYN, SYN-ACK, ACK)</td><td>Aucune</td></tr>
<tr><td>Fiabilité</td><td>Retransmission, ordre garanti</td><td>Aucune garantie</td></tr>
<tr><td>Contrôle</td><td>Congestion + flux</td><td>Non</td></tr>
<tr><td>Usage</td><td>HTTP, SSH, bases de données</td><td>DNS, VoIP, streaming, métriques, QUIC</td></tr>
</table>
<p>Fermeture TCP : FIN / ACK / FIN / ACK, puis <b>TIME_WAIT</b> (2×MSL) côté initiateur. Beaucoup de TIME_WAIT = normal sur un proxy ; beaucoup de <b>CLOSE_WAIT</b> = <b>bug applicatif</b>, l'application ne ferme pas ses sockets.</p>

<h3>Diagnostic réseau : la logique DROP vs REJECT</h3>
<table>
<tr><th>Symptôme client</th><th>Cause probable</th></tr>
<tr><td>Timeout (ça pend)</td><td>Paquet DROPPÉ : SG/NSG/NACL, route absente, mauvaise IP</td></tr>
<tr><td>Connection refused (immédiat)</td><td>Le paquet arrive, mais rien n'écoute sur le port</td></tr>
<tr><td>Erreur DNS / nom inconnu</td><td>Résolution, pas réseau</td></tr>
<tr><td>Petites requêtes OK, gros transferts figés</td><td>MTU / PMTUD cassé (ICMP bloqué)</td></tr>
<tr><td>Intermittent et erratique</td><td>Conntrack saturé, un backend sur N en panne, DNS</td></tr>
</table>
<pre><code>dig +short api.exemple.com          # résolution seule
dig @8.8.8.8 api.exemple.com        # tester un autre resolver
nc -zv host 443                     # le port répond-il ?
curl -v https://host/path           # DNS + TCP + TLS + HTTP, avec les temps
curl -w "%{time_namelookup} %{time_connect} %{time_appconnect} %{time_total}\\n" -o /dev/null -s URL
openssl s_client -connect host:443 -servername host -showcerts
traceroute / mtr host               # où ça s'arrête
tcpdump -i any -n port 443 -c 50    # le SYN arrive-t-il ? le SYN-ACK repart-il ?
ip route get 10.0.2.15              # quelle route sera empruntée</code></pre>

<h3>DNS</h3>
<table>
<tr><th>Type</th><th>Rôle</th></tr>
<tr><td>A / AAAA</td><td>Nom → IPv4 / IPv6</td></tr>
<tr><td>CNAME</td><td>Alias vers un autre NOM. <b>Interdit à l'apex</b> du domaine</td></tr>
<tr><td>ALIAS / A-alias</td><td>Équivalent CNAME utilisable à l'apex (Route 53, Azure DNS)</td></tr>
<tr><td>MX / TXT / NS / SOA</td><td>Mail / vérifications et SPF-DKIM / serveurs de noms / autorité</td></tr>
<tr><td>SRV</td><td>Service + port (utilisé par K8s pour les headless services)</td></tr>
</table>
<p><b>TTL</b> : le nerf de la guerre en bascule. On abaisse le TTL (60 s) plusieurs heures AVANT une migration, sinon les caches gardent l'ancienne IP pendant des heures. Attention : certains resolvers ignorent les TTL très courts.</p>

<h3>TLS</h3>
<ol>
<li>ClientHello : versions et suites supportées, SNI (quel nom d'hôte on demande).</li>
<li>ServerHello + certificat (+ chaîne d'intermédiaires).</li>
<li>Le client valide : chaîne jusqu'à une CA de confiance, date de validité, nom qui correspond, révocation.</li>
<li>Échange de clés ECDHE → dérivation d'une <b>clé de session symétrique</b> (forward secrecy).</li>
<li>Tout le trafic est ensuite chiffré en symétrique (AES-GCM).</li>
</ol>
<div class="box piege"><b>Erreurs de certificat les plus fréquentes en entreprise</b>
<ul>
<li><b>Chaîne incomplète</b> : le navigateur compense, pas un client Java/Go/curl. Vérifier avec <code>openssl s_client -showcerts</code>.</li>
<li><b>CA d'entreprise absente</b> du truststore du conteneur — classique derrière un proxy d'inspection TLS bancaire. Il faut injecter le bundle CA dans l'image.</li>
<li><b>SNI manquant</b> sur un hôte mutualisé → on tombe sur le mauvais certificat.</li>
<li><b>Expiration</b> : la cause d'incident la plus bête et la plus fréquente. Il faut une alerte à J-30 et de l'automatisation (ACME, Key Vault, ACM).</li>
</ul></div>

<h3>HTTP — codes à connaître</h3>
<table>
<tr><th>Code</th><th>Sens</th><th>Ce que ça dit en prod</th></tr>
<tr><td>301 / 302</td><td>Redirection permanente / temporaire</td><td>301 est mis en cache par le navigateur — attention</td></tr>
<tr><td>400 / 422</td><td>Requête invalide</td><td>Problème client, pas serveur</td></tr>
<tr><td>401 / 403</td><td>Non authentifié / non autorisé</td><td>401 = qui es-tu, 403 = tu n'as pas le droit</td></tr>
<tr><td>429</td><td>Trop de requêtes</td><td>Throttling : respecter <code>Retry-After</code></td></tr>
<tr><td>499</td><td>Client parti (nginx)</td><td>Le client a abandonné : ton backend est trop lent</td></tr>
<tr><td>500</td><td>Erreur applicative</td><td>Bug côté code</td></tr>
<tr><td>502</td><td>Bad gateway</td><td>Le backend a répondu n'importe quoi ou est mort</td></tr>
<tr><td>503</td><td>Service indisponible</td><td>Aucun backend sain / surcharge</td></tr>
<tr><td>504</td><td>Gateway timeout</td><td>Le backend est trop lent, le proxy a coupé</td></tr>
</table>
<p><b>502 vs 503 vs 504</b> : question classique. 502 = réponse invalide du backend, 503 = pas de backend disponible, 504 = backend trop lent. Savoir les distinguer oriente immédiatement le diagnostic.</p>

<h3>Load balancing</h3>
<table>
<tr><th></th><th>L4</th><th>L7</th></tr>
<tr><td>Voit</td><td>IP + port</td><td>Host, path, headers, cookies</td></tr>
<tr><td>Permet</td><td>TCP/UDP, TLS passthrough, IP source préservée</td><td>Routage par URL, terminaison TLS, WAF, sticky session, réécriture</td></tr>
<tr><td>AWS / Azure</td><td>NLB / Azure Load Balancer</td><td>ALB / Application Gateway</td></tr>
</table>
<p><b>Health checks</b> : un LB ne route que vers les cibles saines. Une santé mal configurée (endpoint qui teste la base alors qu'on veut juste savoir si le process vit) provoque des retraits en cascade. Séparer « liveness » et « readiness » vaut aussi pour les LB.</p>

<h3>Proxy vs reverse proxy vs NAT</h3>
<ul>
<li><b>Proxy (forward)</b> : côté client, sortant. Filtrage, cache, inspection TLS. Obligatoire en banque — pense à <code>HTTP_PROXY</code>/<code>NO_PROXY</code> dans les conteneurs.</li>
<li><b>Reverse proxy</b> : côté serveur, entrant. nginx, ALB, App Gateway, Ingress.</li>
<li><b>NAT</b> : réécriture d'adresse. En sortie de VPC, l'IP source devient celle du NAT Gateway → c'est CETTE IP que le partenaire doit autoriser.</li>
</ul>

<div class="box dire"><b>La question « que se passe-t-il quand je tape une URL »</b>
Réponds en 8 étapes : résolution DNS (caches successifs) → connexion TCP → handshake TLS → requête HTTP au reverse proxy → sélection d'un backend sain → traitement applicatif (cache, base) → réponse (compression, cache CDN) → rendu et appels secondaires. Puis propose d'aller plus loin sur l'étape qui les intéresse. C'est LA question qui permet de démontrer toute ta culture infra en 2 minutes.</div>
`

id:"git-docker",
titre:"Git & Docker",
lead:"Deux outils que tu utilises tous les jours — donc deux domaines où l'approximation se voit immédiatement.",
html:`
<h3>Git — modèle mental</h3>
<p>Un commit = un objet immuable contenant un pointeur vers un ARBRE (instantané complet du projet), le ou les parents, l'auteur et le message. Git stocke des <b>instantanés</b>, pas des diffs — les diffs sont calculés à l'affichage.</p>
<p>Trois zones : <b>working tree</b> (tes fichiers) → <b>index / staging</b> (le brouillon du prochain commit) → <b>dépôt</b> (les commits).</p>

<h3>Les commandes qui comptent</h3>
<pre><code>git add -p                    # choisir morceau par morceau ce qui part
git commit --amend            # corriger le dernier commit (jamais après un push partagé)
git rebase -i HEAD~5          # nettoyer l'historique local avant la PR
git log --oneline --graph --all
git diff --staged
git stash / git stash pop
git bisect start / bad / good # trouver le commit fautif en log2(n) étapes
git reflog                    # LE filet de sécurité : retrouver ce qu'on a "perdu"
git blame -L 40,60 fichier
git cherry-pick &lt;sha&gt;         # rejouer un commit ailleurs (hotfix vers release)
git revert &lt;sha&gt;              # annuler en ajoutant un commit (sûr sur branche partagée)</code></pre>

<h3>reset : les trois modes</h3>
<table>
<tr><th>Mode</th><th>HEAD</th><th>Index</th><th>Fichiers</th><th>Quand</th></tr>
<tr><td>--soft</td><td>déplacé</td><td>gardé</td><td>gardés</td><td>Refaire le commit autrement</td></tr>
<tr><td>--mixed</td><td>déplacé</td><td>vidé</td><td>gardés</td><td>Défaire un <code>add</code></td></tr>
<tr><td>--hard</td><td>déplacé</td><td>vidé</td><td><b>écrasés</b></td><td>Tout jeter — irréversible sauf reflog</td></tr>
</table>

<h3>merge vs rebase</h3>
<ul>
<li><b>merge</b> : crée un commit de fusion, préserve l'histoire réelle, sûr sur une branche partagée.</li>
<li><b>rebase</b> : rejoue tes commits au-dessus de la cible → historique linéaire mais <b>nouveaux hash</b>.</li>
<li><b>Règle d'or</b> : jamais de rebase sur une branche déjà poussée et partagée. En pratique : rebase local pour nettoyer avant la PR, merge pour intégrer.</li>
</ul>

<div class="box piege"><b>Le piège du secret commité</b>
<code>git revert</code> ne protège rien : le blob reste dans l'historique. Il faut (1) <b>révoquer le secret immédiatement</b> — c'est la seule action qui compte —, (2) réécrire l'historique (<code>git filter-repo</code>, BFG), (3) forcer le push et purger les forks/caches, (4) chercher ce qui a été fait avec dans les logs d'audit. Un candidat qui répond juste « je fais un revert » se fait éliminer sur cette question.</div>

<h3>Stratégies de branches</h3>
<table>
<tr><th></th><th>GitFlow</th><th>Trunk-based</th></tr>
<tr><td>Branches</td><td>main, develop, feature, release, hotfix</td><td>main + branches de quelques heures</td></tr>
<tr><td>Intégration</td><td>Tardive, gros merges</td><td>Continue, petits lots</td></tr>
<tr><td>Inachevé</td><td>Reste en branche</td><td>Caché par feature flag</td></tr>
<tr><td>Adapté à</td><td>Releases versionnées, produits packagés</td><td>SaaS, livraison fréquente</td></tr>
</table>

<h3>Docker — Dockerfile de production</h3>
<pre><code># syntax=docker/dockerfile:1
FROM node:20-alpine AS build
WORKDIR /app
COPY package*.json ./              # AVANT le code : cache des dépendances
RUN npm ci --omit=dev
COPY . .
RUN npm run build

FROM gcr.io/distroless/nodejs20-debian12 AS runtime
WORKDIR /app
COPY --from=build /app/dist ./dist
COPY --from=build /app/node_modules ./node_modules
USER 10001                          # non-root
EXPOSE 3000
ENTRYPOINT ["/nodejs/bin/node", "dist/server.js"]</code></pre>
<ul>
<li><b>Multi-stage</b> : compile dans une image lourde, livre une image minimale sans compilateur ni sources.</li>
<li><b>Ordre des couches</b> : du moins changeant au plus changeant, pour maximiser le cache.</li>
<li><b>.dockerignore</b> : exclure <code>.git</code>, <code>node_modules</code>, <code>.env</code> — sinon on gonfle le contexte et on fuite des secrets.</li>
<li><b>Forme exec</b> (JSON) pour ENTRYPOINT/CMD : la forme shell met <code>/bin/sh</code> en PID 1 qui ne relaie pas SIGTERM.</li>
<li><b>Tag immuable</b> : version sémantique ou SHA de commit, jamais <code>latest</code> en prod.</li>
</ul>

<h3>CMD vs ENTRYPOINT</h3>
<table>
<tr><th></th><th>ENTRYPOINT</th><th>CMD</th></tr>
<tr><td>Rôle</td><td>L'exécutable fixe</td><td>Les arguments par défaut</td></tr>
<tr><td>Surcharge par <code>docker run</code></td><td>Non (sauf <code>--entrypoint</code>)</td><td>Oui, en passant des arguments</td></tr>
</table>

<h3>Durcissement d'un conteneur</h3>
<pre><code>docker run --read-only \\
  --cap-drop ALL --security-opt no-new-privileges \\
  --user 10001:10001 \\
  --memory 512m --cpus 1 \\
  --tmpfs /tmp \\
  monimage:1.4.2</code></pre>
<p>Équivalent Kubernetes : <code>securityContext</code> avec <code>runAsNonRoot</code>, <code>readOnlyRootFilesystem</code>, <code>allowPrivilegeEscalation: false</code>, <code>capabilities.drop: [ALL]</code>, <code>seccompProfile: RuntimeDefault</code>.</p>

<h3>Où va la place disque</h3>
<pre><code>docker system df -v              # ventilation images / conteneurs / volumes / cache
docker system prune -a --volumes # attention : supprime les volumes non utilisés
docker image prune -f</code></pre>
<p>Le coupable le plus fréquent : les <b>logs json-file sans rotation</b>. Configurer <code>log-opts: max-size=10m, max-file=3</code> dans le daemon.json.</p>

<div class="box piege"><b>« Ça marche sur mon poste »</b>
Causes structurelles à citer : architecture différente (build ARM sur Mac vs nœuds amd64 → <code>docker buildx --platform</code>), variables et secrets présents en local via <code>.env</code>, DNS et proxy d'entreprise, contraintes de sécurité en cluster (non-root, filesystem read-only, capabilities), et limites de ressources qui déclenchent un OOM absent en local.</div>

<h3>Registry et supply chain</h3>
<ul>
<li>Registry privé (ECR, ACR, Harbor, Nexus) avec des images de base approuvées et scannées.</li>
<li>Pin par <b>digest</b> (<code>image@sha256:…</code>) en production, pas par tag mutable.</li>
<li>Scan continu (Trivy, Grype) — un scan au build ne suffit pas, les CVE apparaissent après.</li>
<li>Signature (Cosign) + politique d'admission qui refuse les images non signées.</li>
<li>SBOM généré au build pour répondre à « quel composant est affecté par cette CVE ? » en minutes plutôt qu'en semaines.</li>
</ul>
`

id:"kubernetes",
titre:"Kubernetes",
lead:"Le domaine le plus challengé en entretien DevOps. Vise la profondeur : le cycle de vie, le réseau, le troubleshooting.",
html:`
<h3>Architecture</h3>
<table>
<tr><th>Composant</th><th>Rôle</th></tr>
<tr><td><b>kube-apiserver</b></td><td>Seule porte d'entrée : authN, authZ (RBAC), admission, validation, écriture dans etcd</td></tr>
<tr><td><b>etcd</b></td><td>Base clé-valeur distribuée (Raft) = l'unique source de vérité</td></tr>
<tr><td><b>kube-scheduler</b></td><td>Choisit un nœud pour chaque Pod non assigné (filtrage puis scoring)</td></tr>
<tr><td><b>controller-manager</b></td><td>Boucles de réconciliation (Deployment, ReplicaSet, Node, Job…)</td></tr>
<tr><td><b>kubelet</b></td><td>Agent sur chaque nœud : démarre les conteneurs via CRI, remonte le statut, exécute les probes</td></tr>
<tr><td><b>kube-proxy</b></td><td>Programme iptables/IPVS pour implémenter les Services</td></tr>
<tr><td><b>CoreDNS</b></td><td>DNS interne du cluster</td></tr>
</table>

<h3>Le chemin d'un <code>kubectl apply</code></h3>
<p>kubectl → API server (authentification, RBAC, <b>mutating</b> webhooks, validation de schéma, <b>validating</b> webhooks) → etcd → Deployment controller crée un ReplicaSet → ReplicaSet controller crée les Pods (sans nœud) → scheduler assigne un nœud → kubelet du nœud appelle containerd (CRI) → conteneurs démarrés → statut remonté.</p>
<p><b>Le concept clé</b> : boucle de réconciliation <em>level-triggered</em>. Les contrôleurs comparent en permanence état désiré et état observé, ils sont idempotents, et le système s'auto-répare même après une perte d'événements.</p>

<h3>Workloads</h3>
<table>
<tr><th>Objet</th><th>Pour quoi</th></tr>
<tr><td>Deployment</td><td>Stateless, Pods interchangeables, rolling update et rollback</td></tr>
<tr><td>StatefulSet</td><td>Identité stable (<code>db-0</code>), PVC par Pod, ordre de démarrage — bases, brokers</td></tr>
<tr><td>DaemonSet</td><td>Un Pod par nœud — agents de logs, CNI, monitoring</td></tr>
<tr><td>Job / CronJob</td><td>Traitement ponctuel / planifié</td></tr>
</table>

<h3>Probes — la question qui tombe toujours</h3>
<table>
<tr><th>Probe</th><th>Échec ⇒</th><th>Usage</th></tr>
<tr><td><b>liveness</b></td><td>Le conteneur est REDÉMARRÉ</td><td>Détecter un blocage définitif (deadlock)</td></tr>
<tr><td><b>readiness</b></td><td>Retiré des Endpoints (plus de trafic), pas de redémarrage</td><td>Dépendance temporairement indisponible, démarrage</td></tr>
<tr><td><b>startup</b></td><td>Désactive les deux autres tant qu'elle n'a pas réussi</td><td>Applications longues à démarrer (JVM)</td></tr>
</table>
<div class="box piege"><b>Piège liveness</b> : une liveness qui teste la base de données transforme une panne de base en boucle de redémarrage de TOUS les pods. La liveness ne doit tester QUE la santé interne du process. Les dépendances externes, c'est la readiness.</div>

<h3>Requests / limits</h3>
<ul>
<li><b>requests</b> : ce que le scheduler réserve. C'est la base du placement ET du calcul du HPA.</li>
<li><b>limits</b> : plafond. CPU dépassé → <b>throttling</b> (ralentissement). Mémoire dépassée → <b>OOMKill</b> immédiat (exit 137).</li>
<li>Classes QoS : <b>Guaranteed</b> (requests = limits, évincé en dernier), <b>Burstable</b>, <b>BestEffort</b> (rien de défini, évincé en premier).</li>
<li>Bonne pratique courante : requests mémoire = limits mémoire (la mémoire n'est pas compressible), et pas de limite CPU trop serrée pour éviter un throttling inutile.</li>
</ul>

<h3>Réseau</h3>
<p><b>Modèle CNI</b> : chaque Pod a son IP, tous les Pods se joignent <b>sans NAT</b>, un Pod se voit avec la même IP que les autres le voient.</p>
<table>
<tr><th>Service</th><th>Effet</th></tr>
<tr><td>ClusterIP</td><td>IP virtuelle interne (défaut)</td></tr>
<tr><td>NodePort</td><td>Port 30000-32767 ouvert sur chaque nœud</td></tr>
<tr><td>LoadBalancer</td><td>Provisionne un LB cloud</td></tr>
<tr><td>Headless (<code>clusterIP: None</code>)</td><td>Renvoie les IP des Pods — pour les StatefulSets</td></tr>
</table>
<p>DNS : <code>&lt;service&gt;.&lt;namespace&gt;.svc.cluster.local</code>. Pour un StatefulSet : <code>db-0.db.default.svc.cluster.local</code>.</p>
<p><b>NetworkPolicy</b> : par défaut tout est ouvert. Dès qu'une policy sélectionne un Pod dans une direction, tout le reste devient interdit DANS CETTE DIRECTION. Bonne pratique : default-deny par namespace puis ouverture explicite. Nécessite un CNI qui les implémente (Calico, Cilium).</p>

<h3>Stockage</h3>
<p><b>PVC</b> (la demande) → <b>StorageClass</b> (le type + provisioner) → <b>PV</b> (le volume réel, créé dynamiquement).</p>
<ul>
<li><code>ReadWriteOnce</code> : un seul nœud à la fois (disque bloc : EBS, Azure Disk).</li>
<li><code>ReadWriteMany</code> : plusieurs nœuds (NFS, EFS, Azure Files).</li>
<li><code>reclaimPolicy</code> : <b>Delete</b> (le volume part avec le PVC — dangereux en prod) vs <b>Retain</b>.</li>
<li>Un Pod RWO bloqué en Pending avec « Multi-Attach » = l'ancien nœud n'a pas relâché le volume. C'est une protection contre la double écriture, pas un bug.</li>
</ul>

<h3>Autoscaling</h3>
<table>
<tr><th>Mécanisme</th><th>Ajuste</th><th>Prérequis</th></tr>
<tr><td>HPA</td><td>Nombre de réplicas</td><td>metrics-server + <b>requests définies</b></td></tr>
<tr><td>VPA</td><td>requests/limits d'un Pod</td><td>Redémarre le Pod ; ne pas combiner avec HPA sur la même métrique</td></tr>
<tr><td>Cluster Autoscaler</td><td>Nombre de NŒUDS</td><td>Se déclenche sur des Pods Pending</td></tr>
<tr><td>KEDA</td><td>Réplicas sur événement (file, Kafka, cron)</td><td>Permet le scale-to-zero</td></tr>
</table>

<h3>Placement</h3>
<ul>
<li><b>Taint / toleration</b> : le NŒUD repousse ; seuls les Pods tolérants y vont (nœuds GPU, nœuds système).</li>
<li><b>nodeSelector / nodeAffinity</b> : le POD choisit où aller (required ou preferred).</li>
<li><b>podAntiAffinity</b> / <b>topologySpreadConstraints</b> : répartir les réplicas sur des nœuds et des zones différents. <b>Indispensable</b> pour une vraie HA — sinon les 3 réplicas peuvent atterrir sur le même nœud.</li>
<li><b>PodDisruptionBudget</b> : protège pendant les disruptions VOLONTAIRES (drain, upgrade). Ne protège pas d'un crash.</li>
</ul>

<h3>Troubleshooting — la méthode</h3>
<pre><code>kubectl get pods -o wide
kubectl describe pod &lt;pod&gt;            # EVENTS en bas = 80% des réponses
kubectl logs &lt;pod&gt; -c &lt;conteneur&gt; --previous --tail=200
kubectl get events --sort-by=.lastTimestamp -A
kubectl get endpoints &lt;svc&gt;            # vide = selector/readiness
kubectl exec -it &lt;pod&gt; -- sh
kubectl debug -it &lt;pod&gt; --image=busybox --target=&lt;conteneur&gt;   # image sans shell
kubectl top pods / nodes
kubectl auth can-i create pods --as=system:serviceaccount:ns:sa</code></pre>
<table>
<tr><th>Symptôme</th><th>Causes à vérifier dans l'ordre</th></tr>
<tr><td>Pending</td><td>Ressources insuffisantes → taints/affinity → PVC non lié → quota de namespace</td></tr>
<tr><td>ImagePullBackOff</td><td>Tag inexistant → imagePullSecret manquant → registry injoignable (proxy)</td></tr>
<tr><td>CrashLoopBackOff</td><td><code>logs --previous</code> : bug, config manquante, liveness trop stricte, OOM</td></tr>
<tr><td>OOMKilled (137)</td><td>Pic mémoire &gt; limit ; regarder le <b>max</b> du working set, pas la moyenne ; régler le heap sur le cgroup</td></tr>
<tr><td>Service sans trafic</td><td>Endpoints vides → selector ≠ labels → readiness KO → targetPort ≠ port écouté</td></tr>
<tr><td>502 pendant un déploiement</td><td>Race d'arrêt : ajouter <code>preStop</code> sleep, readiness qui bascule avant l'arrêt, arrêt gracieux</td></tr>
<tr><td>DNS intermittent</td><td>CoreDNS saturé, <code>ndots:5</code>, conntrack plein → NodeLocal DNSCache</td></tr>
</table>

<h3>Sécurité</h3>
<ul>
<li><b>RBAC</b> : Role (namespacé) / ClusterRole + RoleBinding / ClusterRoleBinding. Un ServiceAccount dédié par application, jamais <code>default</code>, jamais <code>cluster-admin</code>.</li>
<li><b>Pod Security Admission</b> : niveaux <code>privileged</code> / <code>baseline</code> / <code>restricted</code> par namespace.</li>
<li><b>Secrets</b> : base64, <b>pas chiffrés</b> par défaut dans etcd. Activer l'encryption at rest, ou externaliser (External Secrets Operator + Key Vault/Secrets Manager, CSI Secret Store).</li>
<li><b>Admission policies</b> (Kyverno, Gatekeeper) : imposer registry approuvé, image signée, non-root, labels obligatoires, interdiction de <code>latest</code>.</li>
<li><b>Identité cloud</b> : IRSA / Pod Identity (AWS), Workload Identity (Azure/GCP) — droits par application, aucune clé statique.</li>
</ul>

<h3>Helm / Kustomize / GitOps</h3>
<ul>
<li><b>Helm</b> : templating + gestion de releases. Bien pour packager du tiers. <code>helm template</code> pour voir le rendu, <code>helm diff</code> avant upgrade.</li>
<li><b>Kustomize</b> : superposition de patches sans templating, natif dans kubectl. Bien pour des variantes d'environnement.</li>
<li><b>Opérateur (CRD + contrôleur)</b> : quand il y a une logique CONTINUE (jour 2 : sauvegarde, bascule, upgrade). Helm ne fait que rendre un template à l'installation.</li>
<li><b>GitOps</b> (Argo CD, Flux) : l'agent dans le cluster tire depuis Git et réconcilie. Pas de credentials cluster dans la CI, dérive corrigée, rollback = revert Git.</li>
</ul>

<div class="box dire"><b>Ce qui distingue un candidat senior</b>
Il ne récite pas les objets : il parle du <b>cycle de vie</b> (comment un Pod naît, devient prêt, reçoit du trafic, s'arrête proprement), de ce qui casse et de comment il le détecte. Si on te demande « c'est quoi un Deployment », enchaîne spontanément sur le ReplicaSet, le rolling update et le rollback : tu réponds à la question suivante avant qu'elle soit posée.</div>
`
}]);

id:"terraform",
titre:"Terraform & IaC",
lead:"Le state, le découpage et le workflow d'équipe : c'est là-dessus qu'on distingue un utilisateur d'un praticien.",
html:`
<h3>Le workflow</h3>
<pre><code>terraform init          # providers, modules, backend, lock file
terraform fmt -recursive
terraform validate      # syntaxe et cohérence, sans appel API
terraform plan -out=tf.plan
terraform apply tf.plan # applique CE plan-là, pas un replan
terraform destroy</code></pre>
<p>Symboles du plan : <code>+</code> création, <code>-</code> destruction, <code>~</code> modification en place, <code>-/+</code> <b>remplacement</b> (destroy puis create). Chercher systématiquement la mention <code># forces replacement</code>.</p>

<h3>Le state</h3>
<ul>
<li>Il mémorise la correspondance code ↔ ressources réelles (IDs, attributs, dépendances). Sans lui, Terraform ne sait plus ce qu'il gère.</li>
<li>Il contient souvent des <b>secrets en clair</b> : jamais dans Git, toujours en backend distant chiffré, accès restreint.</li>
<li><b>Backend distant obligatoire à plusieurs</b>, pour le partage ET le <b>verrouillage</b> : sans lock, deux apply simultanés corrompent le state.</li>
</ul>
<pre><code>terraform {
  required_version = "~> 1.9"
  required_providers {
    azurerm = { source = "hashicorp/azurerm", version = "~> 4.0" }
  }
  backend "azurerm" {
    resource_group_name  = "rg-tfstate"
    storage_account_name = "sttfstateprod"
    container_name       = "tfstate"
    key                  = "plateforme/prod.tfstate"
  }
}</code></pre>
<p>Équivalent AWS : backend <code>s3</code> avec <code>encrypt = true</code>, versioning activé et verrouillage (DynamoDB ou lockfile natif S3).</p>

<h3>Commandes de state</h3>
<table>
<tr><th>Commande</th><th>Effet</th><th>Quand</th></tr>
<tr><td><code>state list / show</code></td><td>Inspecter</td><td>Diagnostic</td></tr>
<tr><td><code>import</code> (ou bloc <code>import</code>)</td><td>Prendre en gestion une ressource existante</td><td>Reprise d'infra manuelle</td></tr>
<tr><td><code>state rm</code></td><td>Retirer du state <b>sans détruire</b></td><td>Abandonner la gestion, migrer vers un autre state</td></tr>
<tr><td><code>state mv</code> / bloc <code>moved</code></td><td>Changer l'adresse d'une ressource</td><td>Refactoring — <b>préférer le bloc <code>moved</code></b> : versionné et revu en PR</td></tr>
<tr><td><code>force-unlock &lt;id&gt;</code></td><td>Libérer un verrou coincé</td><td>Après avoir VÉRIFIÉ qu'aucun apply ne tourne</td></tr>
<tr><td><code>taint</code> / <code>-replace</code></td><td>Forcer la recréation</td><td>Ressource dans un état incohérent</td></tr>
</table>
<p><b>L'import ne génère pas le code</b> : on écrit d'abord la ressource, on importe, puis on itère sur le plan jusqu'à « no changes ».</p>

<h3>count vs for_each</h3>
<pre><code># count : indexé par POSITION → supprimer un élément décale tout
resource "azurerm_storage_account" "s" { count = 3 }

# for_each : indexé par CLÉ → adresse stable
resource "azurerm_storage_account" "s" {
  for_each = { logs = "Standard_LRS", data = "Standard_GRS" }
  name     = "st\${each.key}"
  account_replication_type = each.value
}</code></pre>
<p><b>Règle</b> : <code>count</code> uniquement pour un booléen (0 ou 1). <code>for_each</code> dès que les éléments sont distincts. La clé doit venir d'une valeur <b>connue au plan</b> — sinon Terraform refuse (« known after apply »).</p>

<h3>lifecycle</h3>
<pre><code>lifecycle {
  prevent_destroy       = true                # bloque toute destruction (base prod)
  create_before_destroy = true                # crée le remplaçant avant de supprimer
  ignore_changes        = [tags["LastScan"]]  # ignorer une dérive légitime
  replace_triggered_by  = [null_resource.v]   # forcer un remplacement piloté
}</code></pre>

<h3>Structure d'un module</h3>
<pre><code>modules/reseau/
  main.tf        # ressources
  variables.tf   # entrées typées, avec description et validation
  outputs.tf     # tout ce dont l'appelant a besoin
  versions.tf    # required_providers
  README.md</code></pre>
<pre><code>variable "environnement" {
  type        = string
  description = "dev | rec | prod"
  validation {
    condition     = contains(["dev","rec","prod"], var.environnement)
    error_message = "Environnement invalide."
  }
}</code></pre>
<div class="box piege"><b>Un module ne déclare JAMAIS</b> de bloc <code>provider</code> ni de <code>backend</code> : il les reçoit du root module (<code>providers = { aws = aws.eu }</code>). Un module qui définit son provider ne peut plus être supprimé proprement.</div>

<h3>Découpage des states</h3>
<p>On découpe par <b>rayon d'impact</b> et par <b>cycle de vie</b> :</p>
<ul>
<li><b>Socle / landing zone</b> : réseau, IAM, DNS, journalisation. Change rarement, très critique, droits très restreints.</li>
<li><b>Plateforme</b> : cluster, registry, coffres, bases partagées.</li>
<li><b>Applications</b> : un state par application × environnement. Change souvent, risque circonscrit.</li>
</ul>
<p>Bénéfices : plan rapide, erreur limitée, verrous indépendants, droits séparés. Coût : des contrats entre states. Pour lire une valeur produite ailleurs, préférer une <b>data source sur une source de vérité</b> (SSM Parameter, Key Vault, tag) plutôt que <code>terraform_remote_state</code>, qui exige un droit de lecture sur tout le state distant — donc sur ses secrets.</p>

<h3>Multi-région / multi-compte</h3>
<pre><code>provider "aws" { region = "eu-west-3" }
provider "aws" { alias = "us", region = "us-east-1" }

resource "aws_acm_certificate" "cdn" {
  provider = aws.us    # CloudFront exige us-east-1
  ...
}</code></pre>

<h3>Pipeline Terraform d'entreprise</h3>
<ol>
<li><b>PR</b> → <code>fmt -check</code>, <code>validate</code>, <code>tflint</code></li>
<li>Scan conformité : <b>tfsec / Checkov / OPA-Conftest</b> sur le plan JSON</li>
<li><code>plan</code> publié en commentaire de PR, relu par un humain (2 yeux en prod)</li>
<li>Merge → <code>apply</code> du <b>plan sauvegardé</b></li>
<li>Tests de smoke + notification</li>
<li>Détection de drift planifiée (<code>plan -detailed-exitcode</code>, code 2 = dérive)</li>
</ol>
<p>Authentification du pipeline par <b>OIDC</b> (aucun secret longue durée), environnements protégés avec approbation manuelle sur la prod, séparation des identités plan (lecture) et apply (écriture).</p>

<h3>Problèmes classiques</h3>
<table>
<tr><th>Symptôme</th><th>Cause / réponse</th></tr>
<tr><td>Diff perpétuel</td><td>L'API renvoie une valeur normalisée différente (casse, ordre, JSON). Écrire la forme canonique, sinon <code>ignore_changes</code> ciblé</td></tr>
<tr><td>Veut détruire/recréer</td><td>Un attribut immuable a changé. Lire <code># forces replacement</code>. Parade : <code>moved</code>, <code>ignore_changes</code>, <code>prevent_destroy</code></td></tr>
<tr><td>Apply échoué à mi-chemin</td><td>Le state reflète ce qui a été créé. On relance un <b>plan</b>, on corrige, on ré-applique — on ne restaure pas un vieux state à l'aveugle</td></tr>
<tr><td>Ressource supprimée à la main</td><td>Terraform la recrée au prochain apply. Sinon : import ou <code>state rm</code> + suppression du code</td></tr>
<tr><td>Erreur de verrouillage</td><td>Un autre apply tourne (ou a planté). Vérifier avant tout <code>force-unlock</code></td></tr>
<tr><td>Throttling API (429)</td><td>Réduire <code>-parallelism</code> (défaut 10)</td></tr>
</table>

<h3>Terraform vs natif</h3>
<table>
<tr><th></th><th>Terraform</th><th>Bicep / CloudFormation</th></tr>
<tr><td>Portée</td><td>Multi-fournisseur, y compris hors cloud (DNS, GitHub, Datadog, Vault)</td><td>Un seul cloud</td></tr>
<tr><td>State</td><td>À gérer et sécuriser</td><td>Géré par la plateforme</td></tr>
<tr><td>Nouveautés</td><td>Délai provider</td><td>Support dès le jour 1</td></tr>
<tr><td>Argument</td><td>Homogénéité des pratiques et des compétences</td><td>Zéro état à opérer, support éditeur</td></tr>
</table>

<div class="box dire"><b>Phrase qui rassure un architecte bancaire</b>
« Le state est un actif critique : backend managé répliqué et versionné, chiffrement, verrouillage, accès limité aux pipelines, restauration testée. Et en dernier recours, il est reconstructible par import — contrairement à une infrastructure non décrite, que personne ne sait recréer. »</div>

<h3>Fondations</h3>
<ul>
<li><b>Région</b> = zone géographique (eu-west-3 Paris). <b>AZ</b> = un ou plusieurs datacenters isolés, reliés à faible latence. HA = multi-AZ. DR = multi-région.</li>
<li><b>Responsabilité partagée</b> : AWS sécurise LE cloud (matériel, hyperviseur, réseau physique), le client sécurise DANS le cloud (IAM, chiffrement, patchs OS, configuration, données).</li>

<h3>IAM — le cœur de l'entretien</h3>
<p><b>Ordre d'évaluation</b> : deny par défaut → un <b>Deny explicite</b> l'emporte toujours → sinon il faut un Allow explicite dans l'intersection SCP ∩ permission boundary ∩ identity policy (ou une resource policy).</p>
<table>
<tr><th>Type</th><th>Attachée à</th><th>Particularité</th></tr>
<tr><td>Identity-based</td><td>User, group, rôle</td><td>Ce que CETTE identité peut faire</td></tr>
<tr><td>Resource-based</td><td>Bucket, clé KMS, SQS, Lambda</td><td>Contient un <code>Principal</code> → permet le cross-compte sans AssumeRole</td></tr>
<tr><td>SCP (Organizations)</td><td>OU / compte</td><td>Plafond de permissions, n'accorde rien</td></tr>
<tr><td>Permission boundary</td><td>User / rôle</td><td>Plafond individuel — pour la délégation encadrée</td></tr>
<tr><td>Session policy</td><td>Session STS</td><td>Réduit temporairement les droits</td></tr>
</table>
<p><b>Rôle vs user</b> : un rôle n'a pas de credentials permanents, on l'endosse via STS et on reçoit des credentials temporaires. Sur EC2 (instance profile), sur EKS (<b>IRSA</b> / Pod Identity), pour la CI (<b>OIDC</b>). Objectif : zéro clé d'accès statique.</p>
<div class="box piege"><b>AccessDenied malgré la bonne policy</b> — les 4 suspects : (1) un Deny explicite ailleurs (bucket policy, SCP, boundary), (2) l'objet est chiffré KMS et il manque <code>kms:Decrypt</code> sur la CLÉ, (3) une condition non satisfaite (<code>aws:SourceIp</code>, MFA, tag), (4) le mauvais compte/région. Outils : IAM Policy Simulator, CloudTrail, IAM Access Analyzer.</div>

<h3>VPC</h3>
<ul>
<li>Un subnet est <b>public</b> uniquement si sa route table a <code>0.0.0.0/0 → igw</code>. Le nom n'a aucune valeur.</li>
<li><b>NAT Gateway</b> : sortie internet pour les subnets privés. Doit être DANS un subnet public (il lui faut une EIP et une route vers l'IGW). Un NAT par AZ pour la résilience — et c'est un poste de coût majeur (heure + Go).</li>
<li><b>Peering</b> : non transitif, CIDR non chevauchants. Au-delà de quelques VPC → <b>Transit Gateway</b>.</li>
<li><b>VPC Endpoints</b> : Gateway (S3, DynamoDB — gratuit, ajoute une route) vs Interface/PrivateLink (ENI privée, payant, la plupart des services).</li>
</ul>
<table>
<tr><th></th><th>Security Group</th><th>NACL</th></tr>
<tr><td>Niveau</td><td>ENI / instance</td><td>Subnet</td></tr>
<tr><td>État</td><td><b>Stateful</b> (retour auto-autorisé)</td><td><b>Stateless</b> (règle dans chaque sens + ports éphémères)</td></tr>
<tr><td>Règles</td><td>Allow uniquement</td><td>Allow ET Deny, numérotées, premier match</td></tr>
<tr><td>Référence</td><td>Peut cibler un autre SG</td><td>CIDR uniquement</td></tr>
</table>

<h3>Compute</h3>
<ul>
<li><b>EC2</b> : familles <code>t</code> burstable (crédits CPU), <code>m</code> général, <code>c</code> compute, <code>r</code> mémoire. <code>user_data</code> ne s'exécute qu'au PREMIER démarrage.</li>
<li><b>Tarification</b> : On-Demand → Savings Plans / Reserved (−40 à −70 % sur un engagement 1-3 ans) → <b>Spot</b> (−90 %, interruptible avec 2 min de préavis) pour les charges tolérantes.</li>
<li><b>ASG + ELB</b> : l'ASG gère la CAPACITÉ (remplacement des instances non saines, scaling), l'ELB la RÉPARTITION. Les deux ensemble, avec le health check ELB comme critère de remplacement.</li>
<li><b>ECS / EKS / Fargate / Lambda</b> : du plus contrôlé au plus managé. Fargate supprime la gestion des nœuds ; Lambda facture à l'invocation (attention aux <b>cold starts</b> : package léger, init hors du handler, Provisioned Concurrency si nécessaire).</li>
</ul>

<h3>Stockage</h3>
<table>
<tr><th>Service</th><th>Nature</th><th>Points d'attention</th></tr>
<tr><td>S3</td><td>Objet</td><td>Cohérence forte depuis 2020. Block Public Access, versioning, Object Lock (WORM), lifecycle, chiffrement SSE-KMS</td></tr>
<tr><td>EBS</td><td>Bloc, une AZ</td><td>Attaché à une instance à la fois (sauf multi-attach io2). Snapshots incrémentaux dans S3</td></tr>
<tr><td>EFS</td><td>NFS partagé multi-AZ</td><td>Plus lent et plus cher, mais ReadWriteMany</td></tr>
</table>
<p>Classes S3 : Standard → Standard-IA / One Zone-IA → Intelligent-Tiering → Glacier Instant / Flexible / Deep Archive. Critère : fréquence d'accès et délai de restitution acceptable.</p>

<h3>Bases et messagerie</h3>
<ul>
<li><b>RDS</b> : Multi-AZ = <b>haute disponibilité</b> (réplique synchrone en standby, bascule automatique, pas de lecture). Read Replica = <b>montée en charge en lecture</b> (asynchrone). Ne pas confondre — question fréquente.</li>
<li><b>Aurora</b> : stockage distribué sur 3 AZ, 6 copies, bascule plus rapide, réplicas en lecture jusqu'à 15.</li>
<li><b>DynamoDB</b> : clé de partition + clé de tri, latence constante à toute échelle, mais le modèle d'accès doit être connu à l'avance.</li>
<li><b>SQS</b> (file, pull, un consommateur par message) vs <b>SNS</b> (pub/sub, push). <b>Fan-out</b> = SNS vers plusieurs SQS. Toujours une <b>DLQ</b> avec alerte sur sa profondeur.</li>
</ul>

<h3>Observabilité et gouvernance</h3>
<table>
<tr><th>Service</th><th>Répond à</th></tr>
<tr><td>CloudTrail</td><td>Qui a fait quel appel API, quand, depuis où (audit)</td></tr>
<tr><td>CloudWatch</td><td>Métriques, logs, alarmes (santé, performance)</td></tr>
<tr><td>AWS Config</td><td>État et historique de CONFIGURATION, règles de conformité, remédiation</td></tr>
<tr><td>GuardDuty / Security Hub</td><td>Détection de menaces / agrégation de la posture</td></tr>
<tr><td>X-Ray</td><td>Tracing distribué</td></tr>
</table>

<h3>Multi-compte</h3>
<p>AWS Organizations avec des OU par usage (Sécurité, Infrastructure, Prod, Non-Prod, Sandbox), <b>un compte par application × environnement</b>. Comptes centraux : Log Archive (bucket immuable, Object Lock), Security/Audit, Network. SCP interdisant de désactiver CloudTrail/GuardDuty. Control Tower ou Landing Zone Accelerator pour industrialiser. Bénéfices : isolation du rayon d'impact, quotas séparés, facturation par équipe.</p>

<h3>Architecture web 3-tiers de référence</h3>
<pre><code>Route 53
  → CloudFront (+ WAF, cache statique)
    → ALB (subnets publics, 2-3 AZ)
      → ASG / ECS / EKS (subnets privés)
        → RDS Multi-AZ (subnets base de données) + read replicas
Sortie : NAT Gateway par AZ
Secrets : Secrets Manager | Statique : S3
Observabilité : CloudWatch + alarmes | Tout en IaC</code></pre>

<h3>Optimisation des coûts (par impact)</h3>
<ol>
<li>Rightsizing — les instances sont surdimensionnées par défaut.</li>
<li>Savings Plans / Reserved sur la base stable.</li>
<li>Extinction planifiée du hors-production (nuits + week-ends ≈ −65 %).</li>
<li>Spot pour le tolérant aux interruptions.</li>
<li>Lifecycle S3, suppression des snapshots et volumes EBS orphelins.</li>
<li>Transfert de données : inter-AZ inutile, NAT Gateway au Go, CloudFront.</li>
<li>Rétention CloudWatch Logs (par défaut : infinie).</li>
</ol>
<p>Prérequis à tout : <b>tagging obligatoire</b> imposé par SCP/Config, sinon on ne peut rien attribuer.</p>

lead:"Le cloud dominant en banque française. Identité, réseau privé et gouvernance sont les trois axes attendus.",
html:`
<h3>Hiérarchie et gouvernance</h3>
<p><b>Management Group → Subscription → Resource Group → Ressource.</b> RBAC et Policy s'héritent du haut vers le bas.</p>
<ul>
<li><b>Resource Group</b> : conteneur logique, une ressource appartient à exactement un RG. Supprimer le RG supprime tout.</li>
<li><b>Resource Lock</b> : <code>CanNotDelete</code> ou <code>ReadOnly</code>, hérité — protège la prod (et casse parfois Terraform : c'est voulu).</li>
<li><b>Tags</b> : imposés par Azure Policy, indispensables pour la refacturation.</li>
</ul>

<h3>Identité : Entra ID vs RBAC</h3>
<table>
<tr><th></th><th>Entra ID (ex-Azure AD)</th><th>Azure RBAC</th></tr>
<tr><td>Gère</td><td>L'annuaire : identités, groupes, applications, rôles d'annuaire</td><td>Les droits sur les RESSOURCES Azure</td></tr>
<tr><td>Exemple de rôle</td><td>Global Administrator, User Administrator</td><td>Owner, Contributor, Reader, rôles custom</td></tr>
</table>
<div class="box piege">Un <b>Global Administrator n'a par défaut AUCUN droit sur les ressources</b> : ce sont deux plans distincts. Il doit activer « Elevate access » pour devenir User Access Administrator à la racine. Question de niveau senior qui piège beaucoup de monde.</div>
<p><b>Rôles clés</b> : Owner (tout + attribuer des droits), Contributor (tout <b>sauf</b> attribuer des droits), Reader, User Access Administrator. Assigner au niveau le plus élevé pertinent, à des <b>groupes</b>, jamais à des personnes.</p>

<h3>Identités applicatives</h3>
<table>
<tr><th></th><th>Service Principal</th><th>Managed Identity</th></tr>
<tr><td>Secret</td><td>À gérer, stocker, faire tourner, expire</td><td>Aucun — géré par Azure (token via IMDS)</td></tr>
<tr><td>Usage</td><td>Hors Azure (CI externe, on-premise)</td><td>Ressource dans Azure — <b>toujours à préférer</b></td></tr>
</table>
<p><b>System-assigned</b> : liée au cycle de vie de la ressource (1:1, supprimée avec elle). <b>User-assigned</b> : objet indépendant, réutilisable, permet d'assigner les droits RBAC AVANT de créer la ressource — ce qui règle le problème poule/œuf en Terraform.</p>
<p><b>PIM</b> (Privileged Identity Management) : élévation juste-à-temps avec approbation, justification et expiration. C'est LA réponse attendue sur « comment gérez-vous les accès admin en production ».</p>

<h3>Réseau</h3>
<ul>
<li><b>VNet</b> + subnets. <b>Peering</b> non transitif (d'où le hub-and-spoke).</li>
<li><b>NSG</b> : filtre L3/L4 (5-tuple, service tags, ASG), attaché à un subnet ou une NIC. Gratuit. Règles par priorité.</li>
<li><b>Azure Firewall</b> : service managé centralisé, règles applicatives par <b>FQDN</b>, threat intelligence, DNAT/SNAT, logs complets. Placé dans le hub.</li>
<li><b>UDR (route table)</b> : surcharge le routage système. Cas classique : <code>0.0.0.0/0</code> → IP privée du firewall (next hop = Virtual Appliance) pour forcer l'inspection.</li>
<li><b>Application Gateway</b> (L7 + WAF) vs <b>Load Balancer</b> (L4) vs <b>Front Door</b> (global, CDN + WAF).</li>
</ul>

<h3>Private Endpoint — la question qui revient</h3>
<p>Il donne une <b>IP privée dans ton VNet</b> à un service PaaS (Storage, SQL, Key Vault) : le trafic ne passe plus par internet, et on désactive <code>publicNetworkAccess</code>.</p>
<div class="box piege"><b>Le piège DNS</b> : le FQDN public (<code>monstorage.blob.core.windows.net</code>) doit désormais résoudre vers l'IP privée. Il faut une <b>Private DNS Zone</b> (<code>privatelink.blob.core.windows.net</code>) liée au VNet, avec un enregistrement A. Sans elle, on retombe sur l'IP publique et ça échoue. Pour une App Service, il faut en plus la VNet Integration et <code>vnetRouteAllEnabled</code>.</p>
<p>Différence avec <b>Service Endpoint</b> : celui-ci garde l'IP publique mais route par le backbone Azure et permet de filtrer par subnet. Le Private Endpoint est plus fort (IP privée, accessible depuis l'on-premise via ExpressRoute).</div>

<h3>Topologie hub-and-spoke</h3>
<pre><code>Hub : Azure Firewall + VPN/ExpressRoute Gateway + Bastion + Private DNS
  ↕ peering
Spoke prod / Spoke rec / Spoke dev  (une app ou une équipe par spoke)
UDR dans chaque spoke : 0.0.0.0/0 → IP privée du firewall</code></pre>
<p>Les spokes ne se parlent pas directement : tout transite par le hub pour inspection. C'est le modèle standard des landing zones bancaires.</p>

<h3>Compute — comment choisir</h3>
<table>
<tr><th>Service</th><th>Quand</th></tr>
<tr><td><b>App Service</b></td><td>Application web classique, peu d'ops, slots de déploiement. Le défaut raisonnable</td></tr>
<tr><td><b>Container Apps</b></td><td>Microservices conteneurisés, scale-to-zero, KEDA, Dapr, sans gérer de cluster</td></tr>
<tr><td><b>AKS</b></td><td>Besoin de contrôle fin (opérateurs, CRD, mesh, multi-tenant) ET une équipe capable d'opérer</td></tr>
<tr><td><b>Functions</b></td><td>Événementiel, court, sporadique</td></tr>
<tr><td><b>VM / VMSS</b></td><td>Legacy, logiciel tiers, contraintes d'OS</td></tr>
</table>
<p><b>Deployment slots</b> : instance parallèle pour déployer, chauffer et tester, puis swap quasi instantané avec retour arrière possible. <b>Piège</b> : par défaut les app settings SUIVENT le swap — il faut cocher « deployment slot setting » (sticky) sur ce qui est spécifique à l'environnement.</p>

<h3>Stockage et données</h3>
<ul>
<li><b>Storage Account</b> : Blob (objet), File (SMB/NFS), Queue, Table. Redondance : <b>LRS</b> (3 copies, 1 datacenter) → <b>ZRS</b> (3 zones) → <b>GRS</b> (+ région appairée, asynchrone) → <b>GZRS</b>. Variantes RA-* pour lire le secondaire.</li>
<li><b>Azure SQL</b> : DTU vs vCore, Business Critical (réplicas locaux, latence faible) vs General Purpose. Failover groups pour le DR. Auth par Entra ID plutôt que login SQL, TDE par défaut.</li>
<li><b>Cosmos DB</b> : multi-modèle, distribution globale, <b>5 niveaux de cohérence</b> (strong, bounded staleness, session, consistent prefix, eventual) — la question piège est de savoir que « session » est le défaut et un bon compromis.</li>
<li><b>Key Vault</b> : secrets, clés, certificats. Accès par RBAC (ou access policies sur les coffres anciens). <b>Soft delete + purge protection</b> : le nom reste réservé après suppression → recréer le même coffre échoue tant que la rétention court (piège en environnement éphémère).</li>
</ul>

<h3>Gouvernance : Azure Policy</h3>
<table>
<tr><th>Effet</th><th>Usage</th></tr>
<tr><td><code>Deny</code></td><td>Bloquer la création non conforme (région interdite, IP publique, absence de tag)</td></tr>
<tr><td><code>Audit</code></td><td>Constater sans bloquer — pour mesurer avant d'imposer</td></tr>
<tr><td><code>DeployIfNotExists</code></td><td>Déployer automatiquement le manquant (diagnostic settings, agent)</td></tr>
<tr><td><code>Modify</code></td><td>Ajouter ou corriger des propriétés (tags)</td></tr>
</table>
<p><b>Policy ≠ RBAC</b> : le RBAC dit QUI peut agir, la Policy dit CE QUI peut exister. Un Owner reste bloqué par un Deny. Assigner les initiatives au niveau <b>management group</b> pour couvrir les subscriptions futures ; les exceptions passent par une <b>exemption datée</b>, jamais par une désactivation.</p>

<h3>Observabilité</h3>
<p><b>Azure Monitor</b> + <b>Log Analytics workspace</b> (centralise via les diagnostic settings de chaque ressource), <b>Application Insights</b> (APM, traces distribuées), <b>Container Insights</b> pour AKS. Langage de requête : <b>KQL</b>.</p>
<pre><code>AzureDiagnostics
| where TimeGenerated > ago(1h)
| where ResourceType == "APPLICATIONGATEWAYS"
| summarize count() by httpStatus_d, bin(TimeGenerated, 5m)
| order by TimeGenerated desc</code></pre>

<h3>Landing zone</h3>
<p>Le socle déployé avant toute application : hiérarchie de management groups, subscriptions par usage (identité, connectivité, management, landing zones prod/non-prod), initiatives Policy, RBAC + PIM, réseau hub-and-spoke, DNS privé, journalisation centralisée, sauvegarde et DR — le tout en IaC (Terraform CAF/ALZ ou Bicep). C'est le vocabulaire attendu chez un grand compte.</p>

id:"cicd",
titre:"CI/CD & stratégies de déploiement",
lead:"Ici, ce qu'on évalue c'est ta capacité à livrer souvent SANS augmenter le risque. C'est un sujet de gouvernance autant que de technique.",
html:`
<h3>Vocabulaire exact</h3>
<table>
<tr><th>Terme</th><th>Définition</th></tr>
<tr><td>Continuous Integration</td><td>Chaque commit est intégré et validé automatiquement sur le tronc, plusieurs fois par jour</td></tr>
<tr><td>Continuous Delivery</td><td>Chaque build est <b>prêt</b> à partir en prod ; un humain déclenche</td></tr>
<tr><td>Continuous Deployment</td><td>Tout build qui passe part en prod <b>automatiquement</b></td></tr>
</table>
<p>En banque, on vise la <b>Delivery</b> : l'approbation reste, mais elle devient un clic tracé sur un pipeline fiable au lieu d'une opération manuelle.</p>

<h3>Ordre des étapes (fail fast)</h3>
<pre><code>lint / format          (secondes)
tests unitaires        (1-3 min)
build + SBOM           (artefact UNIQUE, versionné)
scan SAST + SCA + secrets
tests d'intégration
push de l'image signée vers le registry
déploiement dev → tests de smoke
déploiement rec → tests e2e / DAST
[approbation] → prod (progressif) → smoke + surveillance</code></pre>
<p><b>Build once, deploy many</b> : on construit UN artefact et on le PROMEUT d'environnement en environnement. Reconstruire par environnement, c'est déployer autre chose que ce qui a été testé.</p>

<h3>Stratégies de déploiement</h3>
<table>
<tr><th>Stratégie</th><th>Principe</th><th>Coût / risque</th></tr>
<tr><td><b>Recreate</b></td><td>On arrête tout, on redémarre</td><td>Coupure — seulement en dev</td></tr>
<tr><td><b>Rolling update</b></td><td>Remplacement progressif (maxSurge / maxUnavailable)</td><td>Défaut K8s. Deux versions coexistent → compatibilité requise</td></tr>
<tr><td><b>Blue/green</b></td><td>Deux environnements complets, bascule totale</td><td>Rollback instantané, mais double capacité</td></tr>
<tr><td><b>Canary</b></td><td>1 % → 10 % → 50 % → 100 % selon les métriques</td><td>Moins cher, détection réelle, mais plus long</td></tr>
<tr><td><b>Feature flag</b></td><td>Déploiement ≠ activation</td><td>Le plus puissant : on désactive sans redéployer. Coût : dette de flags à nettoyer</td></tr>
<tr><td><b>Shadow / mirroring</b></td><td>On duplique le trafic vers la nouvelle version sans servir sa réponse</td><td>Test réaliste sans risque — attention aux effets de bord (écritures)</td></tr>
</table>

<h3>Migrations de base : expand / contract</h3>
<ol>
<li><b>Expand</b> : ajouter la nouvelle colonne/table, nullable, sans rien casser.</li>
<li>Déployer le code qui écrit dans l'ancien ET le nouveau, et lit le nouveau avec repli.</li>
<li>Migrer les données existantes (par lots, en arrière-plan).</li>
<li><b>Contract</b> : une fois toutes les instances migrées et stabilisées, supprimer l'ancien.</li>
</ol>
<div class="box piege"><b>La question qui tue</b> : « comment tu rollback si la migration est déjà passée ? » La bonne réponse n'est pas « je restaure une sauvegarde » : c'est que les migrations doivent être <b>rétrocompatibles</b>, donc l'ancien binaire tourne sur le nouveau schéma. Sinon : roll-forward avec un correctif, la restauration étant un dernier recours assumé avec perte de données.</div>

<h3>Secrets dans le pipeline</h3>
<ol>
<li><b>Le mieux</b> : fédération d'identité <b>OIDC</b> entre le fournisseur CI et le cloud. Le pipeline échange un token signé contre des credentials temporaires. Aucun secret longue durée stocké.</li>
<li><b>Sinon</b> : coffre (Key Vault, Secrets Manager, Vault) avec injection au runtime, scope par environnement, masquage dans les logs, rotation.</li>
<li><b>Jamais</b> : secret en variable de pipeline non protégée, dans le code, dans une image (<code>ARG</code> reste dans <code>docker history</code>), ou dans le state Terraform accessible largement.</li>
</ol>

<h3>Sécuriser la chaîne CI/CD elle-même</h3>
<ul>
<li>Branches protégées, revue obligatoire, commits signés, interdiction du bypass.</li>
<li><b>Runners éphémères</b> et isolés par niveau de sensibilité — un runner persistant devient un vecteur de mouvement latéral.</li>
<li>Actions/images tierces <b>épinglées par digest</b>, jamais <code>@main</code>.</li>
<li>Séparation des identités <b>build</b> (lecture) et <b>deploy</b> (écriture), environnements protégés avec approbation distincte en prod.</li>
<li>Attention aux déclencheurs qui exécutent du code de fork avec les secrets du dépôt (<code>pull_request_target</code>) — approbation manuelle obligatoire pour les contributeurs externes.</li>
<li>Journalisation immuable : qui a approuvé, quel artefact, quand.</li>
</ul>

<h3>GitOps</h3>
<table>
<tr><th></th><th>Push (CI classique)</th><th>Pull (GitOps)</th></tr>
<tr><td>Qui déploie</td><td>La CI, avec des credentials cluster</td><td>Un agent DANS le cluster (Argo CD, Flux)</td></tr>
<tr><td>Credentials</td><td>Dans la CI — surface d'attaque</td><td>Aucun credential cluster à l'extérieur</td></tr>
<tr><td>Dérive</td><td>Non détectée</td><td>Détectée et corrigée en continu</td></tr>
<tr><td>Rollback</td><td>Rejouer un pipeline</td><td><code>git revert</code></td></tr>
<tr><td>Audit</td><td>Logs de pipeline</td><td>Historique Git = preuve de l'état désiré</td></tr>
</table>
<p>Pattern courant : un dépôt applicatif (code) + un dépôt de déploiement (manifestes). La CI construit l'image et ouvre une PR sur le dépôt de déploiement pour bumper le tag ; l'approbation de cette PR EST l'autorisation de mise en production.</p>

<h3>Mutualiser 50 pipelines</h3>
<p>Templates versionnés dans un dépôt central : <code>include</code> GitLab, reusable workflows GitHub, templates Azure DevOps, shared library Jenkins. Chaque dépôt applicatif ne garde qu'une dizaine de lignes. <b>Versionner les templates</b> (tag immuable, jamais <code>@main</code>), annoncer les dépréciations, garder une porte de sortie pour les cas particuliers.</p>

<h3>Métriques DORA</h3>
<table>
<tr><th>Métrique</th><th>Mesure</th><th>Élite</th></tr>
<tr><td>Deployment frequency</td><td>Fréquence de mise en production</td><td>À la demande, plusieurs fois par jour</td></tr>
<tr><td>Lead time for changes</td><td>Du commit à la prod</td><td>Moins d'un jour</td></tr>
<tr><td>Change failure rate</td><td>% de déploiements causant une dégradation</td><td>0-15 %</td></tr>
<tr><td>Time to restore</td><td>Durée de rétablissement</td><td>Moins d'une heure</td></tr>
</table>
<p><b>L'argument clé</b> : vitesse et stabilité progressent ENSEMBLE. Déployer souvent, en petits lots, réduit le risque — parce qu'on sait exactement ce qui a changé et qu'on revient en arrière facilement. C'est la réponse à « chez nous on livre une fois par trimestre, c'est plus sûr ».</p>

<div class="box dire"><b>Nuance bancaire à ne pas oublier</b>
Les périodes de gel (clôture comptable, arrêtés, jours de place) sont une contrainte métier <b>légitime</b>, pas une résistance au changement. Montrer qu'on la respecte tout en gardant un chemin d'urgence (hotfix avec approbation renforcée) prouve qu'on a déjà travaillé dans ce contexte.</div>

titre:"Sécurité & conformité",
lead:"En banque, c'est le domaine qui fait la différence entre un bon DevOps et un DevOps embauchable.",
html:`
<h3>Les fondamentaux à énoncer sans hésiter</h3>
<ul>
<li><b>AuthN puis AuthZ</b> : authentification = qui tu es ; autorisation = ce que tu as le droit de faire.</li>
<li><b>Moindre privilège</b> : le minimum de droits, pour la durée minimale. On part de zéro et on ajoute ; on audite ce qui n'a jamais servi (Access Advisor, Access Analyzer, Access Reviews) et on le retire.</li>
<li><b>Défense en profondeur</b> : plusieurs couches indépendantes (réseau, identité, chiffrement, détection). Aucune n'est censée être infaillible.</li>
<li><b>Séparation des tâches</b> : personne ne peut seul écrire ET mettre en production un changement.</li>
<li><b>Zero trust</b> : pas de réseau interne de confiance ; chaque appel est authentifié et autorisé quelle que soit sa provenance.</li>
</ul>

<h3>Chiffrement</h3>
<table>
<tr><th></th><th>Symétrique</th><th>Asymétrique</th></tr>
<tr><td>Clé</td><td>Une seule, partagée</td><td>Paire publique/privée</td></tr>
<tr><td>Vitesse</td><td>Rapide (AES)</td><td>Lent (RSA, ECDSA)</td></tr>
<tr><td>Problème résolu</td><td>Volume de données</td><td>Distribution des clés, authentification, signature</td></tr>
</table>
<p><b>TLS combine les deux</b> : l'asymétrique authentifie le serveur et établit un secret partagé (ECDHE → <b>forward secrecy</b>), puis tout le trafic passe en symétrique.</p>
<p><b>Chiffrement par enveloppe</b> (KMS / Key Vault) : le service génère une <b>data key</b>, la renvoie en clair ET chiffrée par la clé maître. On chiffre les données localement avec la clé en clair, on la jette de la mémoire, on stocke la version chiffrée à côté. La clé maître ne quitte jamais le HSM. C'est ce qui rend le chiffrement performant à grande échelle.</p>
<div class="box piege">Chiffrement au repos + en transit ne protègent <b>pas</b> d'un accès légitime détourné : si l'identité autorisée à déchiffrer est compromise, tout est lisible. D'où l'importance de l'IAM, de la segmentation et de la journalisation.</div>

<h3>Gestion des secrets — hiérarchie des bonnes pratiques</h3>
<ol>
<li><b>Pas de secret du tout</b> : identité fédérée (Managed Identity, IRSA, OIDC). Le meilleur secret est celui qui n'existe pas.</li>
<li><b>Coffre</b> (Key Vault, Secrets Manager, Vault) avec injection au runtime, rotation automatisée, journalisation des accès.</li>
<li><b>Variables de pipeline protégées</b>, scopées par environnement, masquées.</li>
<li><b>Jamais</b> : dans le code, dans une image, dans un tfvars commité, dans un fichier partagé.</li>
</ol>
<p><b>Secret fuité</b> : la seule action qui compte est de <b>le révoquer</b>. Réécrire l'historique Git ne protège rien si le secret reste valide. Ensuite : audit de ce qui a été fait avec, recherche de persistance, post-mortem sur pourquoi il existait.</p>

<h3>Sécurité des conteneurs et de la chaîne d'approvisionnement</h3>
<table>
<tr><th>Étape</th><th>Contrôle</th></tr>
<tr><td>Développement</td><td>Détection de secrets en pre-commit, SAST, revue de code</td></tr>
<tr><td>Dépendances</td><td>SCA + SBOM, lockfiles, dépôts internes miroirs (anti-typosquatting)</td></tr>
<tr><td>Build</td><td>Runner éphémère, base durcie (distroless), non-root, multi-stage</td></tr>
<tr><td>Registry</td><td>Privé, scan continu, signature Cosign, pin par digest</td></tr>
<tr><td>Déploiement</td><td>Admission policy : registry approuvé, image signée, non-root, pas de <code>latest</code></td></tr>
<tr><td>Runtime</td><td>read-only rootfs, capabilities drop ALL, seccomp, NetworkPolicy, détection runtime (Falco)</td></tr>
</table>
<p><b>Prioriser 200 CVE</b> : par risque réel — sévérité ET exploitabilité (KEV, EPSS, exploit public), présence effective dans le chemin d'exécution, exposition du service, disponibilité d'un correctif. Souvent, changer d'image de base en élimine 80 % d'un coup.</p>

<h3>Identité et accès humains</h3>
<ul>
<li>MFA résistante au phishing (FIDO2) obligatoire, surtout sur les comptes privilégiés.</li>
<li><b>Accès juste-à-temps</b> : PIM (Entra ID), IAM Identity Center avec sessions courtes. Aucun compte admin permanent.</li>
<li>Accès prod via bastion / Session Manager plutôt que SSH direct, avec enregistrement de session.</li>
<li>Revues d'accès périodiques, désactivation automatique des comptes dormants, départ = révocation immédiate.</li>
<li>Objectif final : l'accès humain direct est l'<b>exception documentée</b>, l'automatisation est le chemin normal.</li>
</ul>

<h3>JWT — ce qu'il faut savoir dire</h3>
<p>Trois parties base64url : header, payload, signature. Le payload est <b>signé, pas chiffré</b> → lisible par tous, jamais de secret dedans.</p>
<p>Erreurs classiques : ne pas vérifier la signature, accepter <code>alg: none</code> ou laisser le token choisir l'algorithme, ne pas valider <code>exp</code>/<code>aud</code>/<code>iss</code>, et croire qu'on peut révoquer un JWT (il faut des durées courtes + refresh token, ou une liste de révocation).</p>

<h3>Le confused deputy</h3>
<p>Un service tiers autorisé à endosser ton rôle peut être manipulé pour agir sur les ressources d'un autre client. Parades AWS : <code>ExternalId</code> dans la trust policy pour les rôles cross-compte tiers, conditions <code>aws:SourceAccount</code> / <code>aws:SourceArn</code> pour les services. Sortir ça en entretien te classe immédiatement.</p>

<h3>Conformité — le vocabulaire bancaire</h3>
<table>
<tr><th>Cadre</th><th>Ce qu'il impose (version DevOps)</th></tr>
<tr><td><b>DORA</b> (UE, applicable depuis janvier 2025)</td><td>Gestion du risque IT, notification rapide des incidents majeurs, tests de résilience, <b>surveillance des prestataires tiers critiques</b> (donc les clouds) : registre des dépendances, stratégies de sortie, scénarios de bascule testés</td></tr>
<tr><td><b>RGPD</b></td><td>Localisation et transferts, minimisation, durée de conservation appliquée <b>y compris dans les logs et les sauvegardes</b>, droit à l'effacement et à la portabilité, notification sous 72 h</td></tr>
<tr><td><b>PCI-DSS</b></td><td>Segmentation du périmètre carte, chiffrement, journalisation, revues d'accès, tests d'intrusion</td></tr>
<tr><td><b>ISO 27001 / NIST</b></td><td>Système de management de la sécurité, contrôles documentés et audités</td></tr>
<tr><td><b>ACPR / EBA</b></td><td>Externalisation informatique : réversibilité, auditabilité, continuité</td></tr>
</table>

<h3>Prouver la conformité à un auditeur</h3>
<p>La chaîne complète : demande/ticket → PR revue avec approbation nommée → commit signé → build tracé avec artefact versionné et SBOM → journal de déploiement horodaté → état réel via l'IaC et l'inventaire (AWS Config, Azure Resource Graph). En GitOps, le dépôt Git EST la preuve de l'état désiré et le contrôleur prouve la réconciliation.</p>
<p><b>Exceptions</b> : jamais en désactivant un contrôle. On crée une <b>exemption nommée, datée, avec un propriétaire et une justification</b>, inscrite dans un registre revu périodiquement.</p>

<h3>Policy as Code — les trois moments</h3>
<ol>
<li><b>En CI</b>, sur le plan Terraform JSON (OPA/Conftest, Sentinel, Checkov) — le moins cher, bloque avant création.</li>
<li><b>À l'admission</b> côté plateforme (Azure Policy Deny, SCP AWS, Kyverno/Gatekeeper) — rend le contrôle <b>non contournable</b>, même hors pipeline.</li>
<li><b>En continu</b> sur l'existant (Config, Defender for Cloud) — détecte la dérive.</li>
</ol>
<p>La CI seule ne suffit jamais : quelqu'un finira par agir hors pipeline.</p>

<h3>Réponse à incident de sécurité — l'ordre</h3>
<ol>
<li><b>Contenir</b> : révoquer/désactiver, isoler la ressource (sans la détruire — on préserve les preuves).</li>
<li><b>Évaluer</b> : logs d'audit, quelle période, quelles actions, quelles données.</li>
<li><b>Éradiquer</b> : chercher la persistance (nouvelles identités, clés, règles, tâches planifiées).</li>
<li><b>Restaurer</b> depuis un état sain vérifié.</li>
<li><b>Notifier</b> selon les obligations (RSSI, DPO, régulateur, clients).</li>
<li><b>Post-mortem blameless</b> avec actions systémiques datées.</li>
</ol>

<div class="box dire"><b>Formulation qui rassure en banque</b>
« Mon principe, c'est que le contrôle ne doit pas dépendre de la discipline des gens : il doit être dans la plateforme. Une policy en admission, une branche protégée, une identité fédérée — ce sont des contrôles qu'on ne peut pas oublier d'appliquer. »</div>
`
}]);
