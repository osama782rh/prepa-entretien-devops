<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QCM DevOps — Entretien BNP</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg">
<meta name="theme-color" content="#0d111a">
<script>
if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost")){
  window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
<style>
  :root{
    --bg:#0d111a; --surface:#151b27; --surface2:#1d2432; --ink:#dde4f0; --muted:#8d9ab2;
    --accent:#3ecf8e; --accent-soft:#0f2a1e; --ok:#3ecf8e; --ok-soft:#0f2a1e;
    --ko:#ff6b6b; --ko-soft:#2c1416; --warn:#edaa5f; --warn-soft:#2a2013;
    --border:#26303f; --code:#0a0e16;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f5f7fb; --surface:#fff; --surface2:#f0f3f9; --ink:#161d2b; --muted:#5c687d;
      --accent:#1e7a46; --accent-soft:#e7f5ec; --ok:#1e7a46; --ok-soft:#e7f5ec;
      --ko:#b3352b; --ko-soft:#fbeae8; --warn:#8a5a00; --warn-soft:#fdf3e3;
      --border:#dce2ee; --code:#eef1f7;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.55}
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 80px}
  a{color:var(--accent)}
  code{font-family:"Cascadia Code",Consolas,monospace;background:var(--code);padding:1px 5px;border-radius:5px;font-size:.88em;border:1px solid var(--border)}
  header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  header.top h1{font-size:19px;margin:0;font-weight:700}
  header.top h1 span{color:var(--accent)}
  .hstats{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .hstats b{color:var(--ink)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 16px}

  .levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin:14px 0 20px}
  .lvl{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 13px;cursor:pointer;text-align:left;color:inherit;font:inherit;transition:.15s}
  .lvl:hover{border-color:var(--accent);transform:translateY(-2px)}
  .lvl .n{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .lvl .t{font-weight:650;font-size:14.5px;margin:3px 0 5px;line-height:1.3}
  .lvl .m{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .bar{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--ok);width:0}

  .modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  button{font:inherit;cursor:pointer;border:none;border-radius:9px;padding:.6rem 1.1rem;background:var(--accent);color:#04180f;font-weight:700;font-size:14.5px}
  @media (prefers-color-scheme: light){ button{color:#fff} }
  button:hover{filter:brightness(1.08)}
  button.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--border);font-weight:600}
  button.tiny{padding:.35rem .7rem;font-size:13px}

  .progress{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-bottom:16px}
  .progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
  .meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:10px;gap:10px;flex-wrap:wrap}
  .tag{display:inline-block;background:var(--surface2);color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:700;letter-spacing:.03em}
  .qtext{font-size:17px;line-height:1.5;margin:6px 0 16px;font-weight:550}

  .choix{display:flex;flex-direction:column;gap:9px}
  .ch{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--border);
      border-radius:11px;padding:13px 15px;cursor:pointer;color:inherit;font:inherit;font-size:15px;line-height:1.45;transition:.12s}
  .ch:hover:not(:disabled){border-color:var(--accent)}
  .ch:disabled{cursor:default}
  .ch .lettre{flex:0 0 24px;height:24px;border-radius:6px;background:var(--bg);border:1px solid var(--border);
      display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:var(--muted)}
  .ch.bonne{background:var(--ok-soft);border-color:var(--ok)}
  .ch.bonne .lettre{background:var(--ok);color:#04180f;border-color:var(--ok)}
  .ch.mauvaise{background:var(--ko-soft);border-color:var(--ko)}
  .ch.mauvaise .lettre{background:var(--ko);color:#2a0605;border-color:var(--ko)}
  .ch.estompe{opacity:.5}

  .fb{margin-top:15px;padding:14px;border-radius:10px;font-size:14.5px;border:1px solid}
  .fb.ok{background:var(--ok-soft);border-color:var(--ok)}
  .fb.ko{background:var(--ko-soft);border-color:var(--ko)}
  .fb .badge{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:6px;letter-spacing:.04em;margin-bottom:8px}
  .fb.ok .badge{background:var(--ok);color:#04180f}
  .fb.ko .badge{background:var(--ko);color:#2a0605}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .done{text-align:center;padding:16px 0}
  .score{font-size:44px;font-weight:800;margin:8px 0;font-variant-numeric:tabular-nums}
  .dom-list{margin-top:14px;font-size:13.5px}
  .dom-list div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--border)}
  .hint{font-size:13px;color:var(--muted);margin-top:10px}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
  .serie{display:inline-block;background:var(--warn-soft);border:1px solid var(--warn);color:var(--warn);
      border-radius:20px;padding:2px 11px;font-size:12.5px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>QCM <span>DevOps</span> — Entretien BNP</h1>
    <div class="hstats" id="hstats"></div>
  </header>
  <div id="app"></div>
</div>

<script>
/* qcm/niveau01.js */
window.QCM = (window.QCM || []).concat([
/* ============ QCM NIVEAU 1 — VOCABULAIRE & FONDATIONS ============
   Propositions calibrées : longueurs comparables, distracteurs plausibles.  */

{ id:"c1-01", lvl:1, dom:"Linux",
  q:"Dans <code>drwxr-xr-x</code>, que représente le tout premier caractère ?",
  choix:["Le type de l'objet : répertoire, fichier, lien","Le droit de lecture accordé au propriétaire","Le droit d'exécution accordé à tous","Le fait que l'objet soit un fichier caché"],
  bonne:0,
  explain:"C'est le TYPE, pas une permission : <code>d</code> répertoire, <code>-</code> fichier ordinaire, <code>l</code> lien symbolique, <code>b</code>/<code>c</code> périphérique, <code>s</code> socket. Les permissions ne commencent qu'au 2ᵉ caractère." },

{ id:"c1-02", lvl:1, dom:"Linux",
  q:"<code>chmod 640 fichier</code> donne quels droits ?",
  choix:["Propriétaire rw · groupe r · autres rien","Propriétaire rwx · groupe rw · autres r","Propriétaire r · groupe rien · autres rien","Propriétaire rw · groupe rw · autres rw"],
  bonne:0,
  explain:"6 = rw- (4+2), 4 = r--, 0 = ---. Chaque chiffre est une somme : lecture 4, écriture 2, exécution 1." },

{ id:"c1-03", lvl:1, dom:"Linux",
  q:"Quelle est la différence entre <code>&gt;</code> et <code>&gt;&gt;</code> ?",
  choix:["<code>&gt;</code> écrase le fichier, <code>&gt;&gt;</code> ajoute à la fin","<code>&gt;</code> ajoute à la fin, <code>&gt;&gt;</code> écrase le fichier","<code>&gt;</code> écrit stdout, <code>&gt;&gt;</code> écrit stderr","<code>&gt;</code> crée le fichier, <code>&gt;&gt;</code> exige qu'il existe"],
  bonne:0,
  explain:"<code>&gt;</code> tronque le fichier avant d'écrire — et il le fait MÊME si la commande échoue ensuite. C'est le piège classique qui vide un fichier de configuration." },

{ id:"c1-04", lvl:1, dom:"Linux",
  q:"Que fait <code>2&gt;&amp;1</code> ?",
  choix:["Il envoie stderr là où pointe stdout","Il envoie stdout là où pointe stderr","Il fusionne le contenu de deux fichiers","Il exécute la commande une seconde fois"],
  bonne:0,
  explain:"Le descripteur 2 est redirigé vers la destination du descripteur 1 À CET INSTANT. D'où l'importance de l'ordre : <code>cmd &gt; f 2&gt;&amp;1</code> marche, <code>cmd 2&gt;&amp;1 &gt; f</code> laisse stderr sur le terminal." },

{ id:"c1-05", lvl:1, dom:"Linux",
  q:"À quoi sert <code>export</code> devant une variable ?",
  choix:["À la transmettre aux processus enfants","À la rendre permanente après un redémarrage","À la protéger contre toute modification","À la partager avec les autres utilisateurs"],
  bonne:0,
  explain:"<code>export</code> promeut une variable de shell en variable d'ENVIRONNEMENT, héritée par les enfants. C'est ce mécanisme qui transporte la configuration dans les conteneurs." },

{ id:"c1-06", lvl:1, dom:"Docker",
  q:"Quel énoncé décrit correctement image et conteneur ?",
  choix:["L'image est un modèle figé, le conteneur une instance qui tourne","Le conteneur est le modèle figé, l'image l'instance qui tourne","L'image contient les données, le conteneur contient le code","Ce sont deux appellations du même objet technique"],
  bonne:0,
  explain:"Analogie classe / objet : l'image est un empilement de couches en lecture seule ; le conteneur ajoute par-dessus une couche d'écriture éphémère." },

{ id:"c1-07", lvl:1, dom:"Docker",
  q:"Pourquoi un conteneur n'est-il pas une machine virtuelle ?",
  choix:["Il partage le noyau de l'hôte, c'est un processus isolé","Il utilise un hyperviseur plus léger et optimisé","Il embarque un OS minimaliste au lieu d'un OS complet","Il ne peut pas accéder directement au réseau physique"],
  bonne:0,
  explain:"Namespaces + cgroups + rootfs overlay, rien de plus. D'où un démarrage en millisecondes, mais une isolation plus faible et une dépendance au noyau de l'hôte." },

{ id:"c1-08", lvl:1, dom:"Docker",
  q:"Que deviennent les données écrites dans un conteneur supprimé ?",
  choix:["Elles sont perdues, sauf si un volume est monté","Elles sont conservées dans l'image d'origine","Elles sont recopiées automatiquement sur l'hôte","Elles sont sauvegardées par le daemon Docker"],
  bonne:0,
  explain:"La couche d'écriture est liée au cycle de vie du conteneur. Pour persister : volume nommé, bind mount, ou stockage externe. Un conteneur doit être stateless par défaut." },

{ id:"c1-09", lvl:1, dom:"Kubernetes",
  q:"Qu'est-ce qu'un Pod ?",
  choix:["Un ou plusieurs conteneurs partageant IP et volumes","Un conteneur unique, sous un autre nom","Un groupe de nœuds gérés ensemble","Un cloisonnement logique du cluster"],
  bonne:0,
  explain:"C'est la plus petite unité déployable. Les conteneurs d'un Pod partagent le namespace réseau (même IP, communication via localhost) et les volumes — d'où le pattern sidecar." },

{ id:"c1-10", lvl:1, dom:"Kubernetes",
  q:"Quel problème un Service Kubernetes résout-il ?",
  choix:["Les Pods changent d'IP : il donne une adresse stable","Les Pods manquent de mémoire : il ajuste les limites","Les Pods sont mal répartis : il choisit les nœuds","Les Pods perdent leurs données : il monte les volumes"],
  bonne:0,
  explain:"IP virtuelle et nom DNS stables, avec répartition du trafic sur les Pods correspondant à son <code>selector</code>. Sans lui, il faudrait suivre des IP qui changent à chaque recréation." },

{ id:"c1-11", lvl:1, dom:"Kubernetes",
  q:"Que se passe-t-il si tu supprimes à la main un Pod d'un Deployment ?",
  choix:["Le ReplicaSet en recrée aussitôt un nouveau","Il disparaît définitivement du cluster","Le Deployment bascule en état d'erreur","Le nœud concerné passe en NotReady"],
  bonne:0,
  explain:"C'est la boucle de réconciliation : le contrôleur compare l'état désiré (N réplicas) à l'état observé et corrige. Pour arrêter le service, il faut modifier le Deployment." },

{ id:"c1-12", lvl:1, dom:"Terraform",
  q:"Que signifie « Terraform est déclaratif » ?",
  choix:["Tu décris l'état final, il calcule les actions","Tu écris les commandes à exécuter, dans l'ordre","Le code s'exécute ligne par ligne, comme un script","Tu déclares les variables avant les ressources"],
  bonne:0,
  explain:"Conséquence pratique : c'est idempotent. Relancer un <code>apply</code> sans changement ne fait rien, là où un script bash rejoue tout." },

{ id:"c1-13", lvl:1, dom:"Terraform",
  q:"À quoi sert le fichier <code>terraform.tfstate</code> ?",
  choix:["À mémoriser le lien entre le code et le réel","À conserver l'historique des commandes lancées","À stocker les identifiants d'accès au cloud","À lister les providers restant à télécharger"],
  bonne:0,
  explain:"Sans lui, Terraform ne sait plus ce qu'il gère et voudrait tout recréer. Il contient souvent des secrets en clair : backend distant chiffré obligatoire, jamais dans Git." },

{ id:"c1-14", lvl:1, dom:"Terraform",
  q:"Différence entre un bloc <code>resource</code> et un bloc <code>data</code> ?",
  choix:["<code>resource</code> gère l'objet, <code>data</code> le lit seulement","<code>data</code> crée l'objet, <code>resource</code> le lit seulement","<code>data</code> ne concerne que les bases de données","Aucune : ce sont deux syntaxes équivalentes"],
  bonne:0,
  explain:"Une data source est en lecture seule : un <code>destroy</code> ne supprimera jamais ce qu'elle référence. On l'utilise pour récupérer l'ID d'un objet créé ailleurs." },

{ id:"c1-15", lvl:1, dom:"Terraform",
  q:"Que fait <code>terraform init</code> ?",
  choix:["Il installe providers et modules, et règle le backend","Il crée réellement les ressources dans le cloud","Il affiche les changements qui seraient appliqués","Il reformate les fichiers .tf au format canonique"],
  bonne:0,
  explain:"Obligatoire au premier usage et après tout changement de provider, de backend ou de module. Il ne touche jamais à l'infrastructure." },

{ id:"c1-16", lvl:1, dom:"AWS",
  q:"Quelle est la relation entre une Région et une Availability Zone ?",
  choix:["Une Région contient plusieurs AZ isolées","Une AZ contient plusieurs Régions voisines","Une AZ est partagée entre plusieurs Régions","Ce sont deux appellations du même concept"],
  bonne:0,
  explain:"eu-west-3 (Paris) contient plusieurs AZ reliées à faible latence. La haute disponibilité se construit multi-AZ ; la reprise après sinistre se construit multi-région." },

{ id:"c1-17", lvl:1, dom:"AWS",
  q:"Un bucket S3 est rendu public par erreur. Qui est responsable ?",
  choix:["Le client : il gère la sécurité DANS le cloud","AWS : il gère la sécurité de ses propres services","L'auditeur : il aurait dû détecter la configuration","Personne : c'est un comportement attendu du service"],
  bonne:0,
  explain:"AWS sécurise LE cloud (matériel, hyperviseur, réseau physique). Le client sécurise DANS le cloud : IAM, chiffrement, configuration, patchs de l'OS, données." },

{ id:"c1-18", lvl:1, dom:"Azure",
  q:"Que se passe-t-il si tu supprimes un Resource Group Azure ?",
  choix:["Toutes les ressources qu'il contient sont supprimées","Les ressources migrent vers un groupe par défaut","Seul le groupe disparaît, les ressources subsistent","La suppression échoue tant qu'il n'est pas vide"],
  bonne:0,
  explain:"Le RG regroupe des ressources partageant un cycle de vie, et toute ressource appartient à exactement un RG. C'est puissant… et dangereux sans Resource Lock." },

{ id:"c1-19", lvl:1, dom:"Azure",
  q:"Quelle est la hiérarchie Azure, du plus large au plus fin ?",
  choix:["Management Group, Subscription, Resource Group, Ressource","Subscription, Management Group, Resource Group, Ressource","Tenant, Resource Group, Subscription, Ressource","Resource Group, Management Group, Subscription, Ressource"],
  bonne:0,
  explain:"Policies et RBAC s'héritent du haut vers le bas : une assignation au niveau management group couvre toutes les subscriptions en dessous, présentes et futures." },

{ id:"c1-20", lvl:1, dom:"Réseau",
  q:"Combien d'adresses contient un réseau en <code>/24</code> ?",
  choix:["256","24","512","1024"],
  bonne:0,
  explain:"2^(32−24) = 2^8 = 256. Sur AWS, 5 sont réservées par la plateforme : il reste 251 adresses utilisables." },

{ id:"c1-21", lvl:1, dom:"Réseau",
  q:"Dans quel cas choisit-on UDP plutôt que TCP ?",
  choix:["Quand la latence prime sur la fiabilité","Quand l'ordre des paquets doit être garanti","Quand on transfère un fichier volumineux","Quand on veut un handshake chiffré"],
  bonne:0,
  explain:"TCP apporte handshake, retransmission, ordre garanti et contrôle de flux, au prix de la latence. UDP n'offre aucune garantie mais aucun surcoût : DNS, VoIP, streaming, métriques." },

{ id:"c1-22", lvl:1, dom:"Réseau",
  q:"Pourquoi un CNAME est-il interdit à la racine d'un domaine ?",
  choix:["La racine doit porter ses enregistrements SOA et NS","Les CNAME sont réservés aux sous-domaines par usage","C'est autorisé, mais mauvais pour la performance","Les registrars le facturent comme une option"],
  bonne:0,
  explain:"Un CNAME interdit tout autre enregistrement sur le même nom. D'où les enregistrements ALIAS/ANAME propriétaires : Route 53 Alias, Azure DNS Alias." },

{ id:"c1-23", lvl:1, dom:"Git",
  q:"Quelle est la différence entre <code>git fetch</code> et <code>git pull</code> ?",
  choix:["<code>pull</code> intègre en plus, <code>fetch</code> se contente de rapatrier","<code>fetch</code> intègre en plus, <code>pull</code> se contente de rapatrier","<code>fetch</code> envoie tes commits vers le serveur distant","Aucune : <code>pull</code> est un alias de <code>fetch</code>"],
  bonne:0,
  explain:"<code>pull</code> = <code>fetch</code> + <code>merge</code> (ou rebase) : il modifie ta branche. Avec <code>fetch</code>, on regarde avant de décider." },

{ id:"c1-24", lvl:1, dom:"Git",
  q:"Qu'est-ce qu'une branche Git, techniquement ?",
  choix:["Un pointeur mobile vers un commit","Une copie complète du répertoire de travail","Un répertoire dédié à l'intérieur de .git","Un fichier de différences par rapport à main"],
  bonne:0,
  explain:"41 octets dans <code>.git/refs/heads/</code>. C'est pour ça que créer une branche est instantané et gratuit." },

{ id:"c1-25", lvl:1, dom:"Git",
  q:"Un fichier ajouté au <code>.gitignore</code> apparaît toujours dans tes commits. Pourquoi ?",
  choix:["Il est déjà suivi : il faut <code>git rm --cached</code>","Le .gitignore doit être placé à la racine du disque","Il faut relancer <code>git init</code> pour le recharger","Le .gitignore ne s'applique qu'aux répertoires"],
  bonne:0,
  explain:"<code>.gitignore</code> n'empêche que le suivi de NOUVEAUX fichiers. C'est la raison numéro un pour laquelle un <code>.env</code> reste commité." },

{ id:"c1-26", lvl:1, dom:"CI/CD",
  q:"Différence entre Continuous Delivery et Continuous Deployment ?",
  choix:["En Delivery, un humain déclenche la mise en production","En Deployment, un humain déclenche la mise en production","En Delivery, on ne déploie jamais en production","En Deployment, on se passe complètement de tests"],
  bonne:0,
  explain:"Delivery : chaque build est PRÊT à partir. Deployment : tout build qui passe les tests part effectivement. En banque, on est presque toujours en Delivery." },

{ id:"c1-27", lvl:1, dom:"CI/CD",
  q:"Pourquoi construire un artefact UNE seule fois pour tous les environnements ?",
  choix:["Pour déployer exactement ce qui a été testé","Pour économiser du temps de calcul en CI","Pour respecter les quotas des registries","Pour éviter les collisions de numéros de version"],
  bonne:0,
  explain:"Principe <em>build once, deploy many</em> : on construit un artefact versionné puis on le PROMEUT dev → recette → prod. Seule la configuration change." },

{ id:"c1-28", lvl:1, dom:"Sécurité",
  q:"Quelle est la différence entre authentification et autorisation ?",
  choix:["L'une prouve qui tu es, l'autre ce que tu peux faire","L'une vaut pour les humains, l'autre pour les machines","L'autorisation s'effectue toujours en premier","Ce sont deux traductions du même terme anglais"],
  bonne:0,
  explain:"AuthN puis AuthZ, toujours dans cet ordre. Un token valide (authentifié) ne donne pas forcément le droit d'agir (autorisé)." },

{ id:"c1-29", lvl:1, dom:"Sécurité",
  q:"Que fait-on d'un mot de passe utilisateur avant de le stocker ?",
  choix:["On le hache, salé, avec bcrypt ou argon2","On le chiffre en AES avec une clé serveur","On l'encode en base64 puis on le stocke","On le stocke en clair dans une table protégée"],
  bonne:0,
  explain:"Le hachage est à SENS UNIQUE : on compare des empreintes. Chiffrer serait réversible — qui a la clé a tous les mots de passe. Le base64 n'est pas du chiffrement du tout." },

{ id:"c1-30", lvl:1, dom:"Observabilité",
  q:"Quels sont les trois piliers de l'observabilité ?",
  choix:["Métriques, logs, traces","Alertes, dashboards, rapports","Processeur, mémoire, disque","Prévention, détection, réaction"],
  bonne:0,
  explain:"Métriques (QUOI : agrégats, alerting), logs (POURQUOI : événements détaillés), traces (OÙ : parcours d'une requête). Les trois se corrèlent par un trace ID." },

{ id:"c1-31", lvl:1, dom:"SRE",
  q:"Lequel de ces engagements comporte des pénalités contractuelles ?",
  choix:["Le SLA","Le SLO","Le SLI","Les trois"],
  bonne:0,
  explain:"SLI = l'indicateur mesuré. SLO = l'objectif interne. SLA = l'engagement contractuel. Règle : SLA &lt; SLO, pour garder une marge avant de payer." },

{ id:"c1-32", lvl:1, dom:"SRE",
  q:"Avec un SLO de 99,9 %, quel budget d'indisponibilité mensuel ?",
  choix:["Environ 43 minutes","Environ 4 minutes","Environ 7 heures","Environ 3 jours"],
  bonne:0,
  explain:"0,1 % de 30 jours ≈ 43 min. C'est l'<em>error budget</em> : tant qu'il en reste on déploie vite ; consommé, on gèle les features pour la fiabilité." },

{ id:"c1-33", lvl:1, dom:"SQL",
  q:"Que garantit le « A » d'ACID ?",
  choix:["Atomicité : tout la transaction, ou rien du tout","Accessibilité : les données restent toujours lisibles","Authentification : l'utilisateur est vérifié","Archivage : les données sont conservées"],
  bonne:0,
  explain:"Atomicité (tout ou rien), Cohérence (contraintes respectées), Isolation (les transactions concurrentes ne se voient pas à moitié), Durabilité (survit à un crash)." },

{ id:"c1-34", lvl:1, dom:"SQL",
  q:"Quelle jointure garde toutes les lignes de la table de gauche ?",
  choix:["LEFT JOIN","INNER JOIN","CROSS JOIN","Aucune des trois"],
  bonne:0,
  explain:"Le LEFT JOIN remplit de NULL les colonnes de droite quand rien ne correspond — d'où son usage pour trouver les orphelins avec <code>WHERE b.id IS NULL</code>." },

{ id:"c1-35", lvl:1, dom:"SQL",
  q:"Quelle commande supprime la table elle-même, structure comprise ?",
  choix:["DROP","DELETE","TRUNCATE","PURGE"],
  bonne:0,
  explain:"<code>DELETE</code> supprime des lignes (avec WHERE, annulable). <code>TRUNCATE</code> vide toute la table très vite. <code>DROP</code> supprime la table." }

]);

<script>
/* qcm/niveau02.js */
window.QCM = (window.QCM || []).concat([
/* ============ QCM NIVEAU 2 — BASES OPÉRATIONNELLES ============ */

{ id:"c2-01", lvl:2, dom:"Linux",
  q:"Quelle commande liste les ports en écoute avec le processus associé ?",
  choix:["<code>ss -tulnp</code>","<code>ps aux | grep port</code>","<code>ls /proc/net</code>","<code>ifconfig -a</code>"],
  bonne:0,
  explain:"t=TCP, u=UDP, l=listening, n=numérique (pas de résolution DNS), p=processus. <code>lsof -i :8080</code> fait le chemin inverse : du port vers le process." },

{ id:"c2-02", lvl:2, dom:"Linux",
  q:"<code>df -h</code> annonce un disque plein, mais <code>du -sh</code> ne trouve rien. Cause la plus probable ?",
  choix:["Un fichier supprimé mais toujours ouvert par un processus","Une erreur d'affichage de df","Le disque est chiffré","Un autre utilisateur cache des fichiers"],
  bonne:0,
  explain:"L'inode n'est libéré qu'à la fermeture du descripteur. <code>lsof | grep deleted</code> le révèle — typiquement un log rotaté sans signal au process. Autre piste : inodes épuisés (<code>df -i</code>)." },

{ id:"c2-03", lvl:2, dom:"Linux",
  q:"Quelle est la différence essentielle entre SIGTERM et SIGKILL ?",
  choix:["SIGTERM est interceptable (arrêt propre), SIGKILL est traité par le noyau et ne l'est pas","SIGKILL est plus lent mais plus sûr","SIGTERM ne fonctionne que sur les daemons","SIGKILL demande confirmation"],
  bonne:0,
  explain:"SIGTERM (15) laisse le process fermer ses connexions et flusher ses buffers. SIGKILL (9) est brutal. C'est exactement la logique du <code>terminationGracePeriodSeconds</code> Kubernetes." },

{ id:"c2-04", lvl:2, dom:"Linux",
  q:"À quoi sert <code>set -euo pipefail</code> en tête d'un script ?",
  choix:["Arrêter au premier échec, échouer sur variable non définie, propager l'échec dans un pipe","Activer le mode verbeux et la coloration","Optimiser la vitesse d'exécution","Rendre le script compatible POSIX"],
  bonne:0,
  explain:"<code>-u</code> évite notamment le catastrophique <code>rm -rf $DIR/</code> avec DIR vide. <code>pipefail</code> évite qu'un <code>cmd_qui_echoue | tee log</code> soit vu comme un succès." },

{ id:"c2-05", lvl:2, dom:"Linux",
  q:"Un exit code de 137 dans un conteneur signifie généralement :",
  choix:["Le processus a été tué par SIGKILL — souvent l'OOM killer","Le fichier de configuration est introuvable","Le port est déjà utilisé","L'image est corrompue"],
  bonne:0,
  explain:"128 + numéro du signal. 137 = 128+9 = SIGKILL, 143 = 128+15 = SIGTERM. Dans Kubernetes, 137 avec <code>OOMKilled</code> dans <code>describe</code> = dépassement de la limite mémoire." },

{ id:"c2-06", lvl:2, dom:"Git",
  q:"Pourquoi ne jamais faire de <code>rebase</code> sur une branche déjà partagée ?",
  choix:["Le rebase réécrit l'historique et crée de nouveaux hash : les collègues divergent","Le rebase supprime les commits des autres","Git refuse le rebase sur une branche distante","Le rebase efface les messages de commit"],
  bonne:0,
  explain:"En pratique : rebase local pour nettoyer avant la PR, merge pour intégrer. Le rebase sur une branche partagée oblige tout le monde à recoller son historique." },

{ id:"c2-07", lvl:2, dom:"Git",
  q:"Tu as commité un mot de passe puis fait <code>git revert</code>. Le secret est-il protégé ?",
  choix:["Non : le blob reste dans l'historique. Il faut RÉVOQUER le secret","Oui, le revert supprime le contenu","Oui, si on force le push ensuite","Oui, après un git gc"],
  bonne:0,
  explain:"<code>revert</code> ajoute un commit qui annule l'effet, pas le contenu. Ordre correct : révoquer le secret (seule action qui compte), puis réécrire l'historique, purger forks et caches, auditer l'usage." },

{ id:"c2-08", lvl:2, dom:"Git",
  q:"Quel <code>git reset</code> détruit le travail non commité ?",
  choix:["<code>--hard</code>","<code>--soft</code>","<code>--mixed</code>","Aucun des trois"],
  bonne:0,
  explain:"<code>--soft</code> garde index et fichiers, <code>--mixed</code> (défaut) vide l'index mais garde les fichiers, <code>--hard</code> écrase tout. Récupérable seulement via le reflog, et seulement si c'était commité." },

{ id:"c2-09", lvl:2, dom:"Docker",
  q:"Quel est le rôle respectif d'ENTRYPOINT et de CMD ?",
  choix:["ENTRYPOINT est l'exécutable fixe, CMD fournit les arguments par défaut remplaçables","CMD s'exécute au build, ENTRYPOINT au run","ENTRYPOINT est optionnel, CMD est obligatoire","Ils sont interchangeables"],
  bonne:0,
  explain:"Combo typique : <code>ENTRYPOINT [\"nginx\"]</code> + <code>CMD [\"-g\",\"daemon off;\"]</code>. Toujours en forme exec (JSON) pour que le process reçoive les signaux." },

{ id:"c2-10", lvl:2, dom:"Docker",
  q:"Pourquoi copie-t-on <code>package.json</code> et installe-t-on les dépendances AVANT de copier le code ?",
  choix:["Pour que la couche des dépendances reste en cache tant que package.json ne change pas","Parce que npm exige cet ordre","Pour réduire la taille de l'image finale","Pour éviter les conflits de permissions"],
  bonne:0,
  explain:"Toute modification d'un fichier invalide sa couche ET toutes les suivantes. Copier le code en premier relancerait un <code>npm install</code> complet à chaque changement de source." },

{ id:"c2-11", lvl:2, dom:"Docker",
  q:"Qu'apporte un build multi-stage ?",
  choix:["On compile dans une image lourde et on ne livre que l'artefact dans une image minimale","On peut construire plusieurs images en parallèle","On accélère le téléchargement des couches","On permet le build multi-architecture"],
  bonne:0,
  explain:"Résultat : image beaucoup plus petite, sans compilateur ni sources — donc surface d'attaque, temps de pull et coût de stockage réduits." },

{ id:"c2-12", lvl:2, dom:"Docker",
  q:"Que fait réellement <code>EXPOSE 8080</code> dans un Dockerfile ?",
  choix:["Rien de fonctionnel : c'est une métadonnée documentaire","Il ouvre le port sur l'hôte","Il configure le firewall du conteneur","Il réserve le port pour éviter les conflits"],
  bonne:0,
  explain:"Pour joindre le port depuis l'hôte il faut <code>-p 8080:8080</code> au run, ou un Service côté Kubernetes. Beaucoup de candidats se trompent là-dessus." },

{ id:"c2-13", lvl:2, dom:"Kubernetes",
  q:"Quelle est la chaîne d'objets entre un Deployment et un Pod ?",
  choix:["Deployment → ReplicaSet → Pod","Deployment → Pod directement","Deployment → Service → Pod","Deployment → DaemonSet → Pod"],
  bonne:0,
  explain:"Le Deployment crée un NOUVEAU ReplicaSet à chaque changement de template et fait varier les réplicas des deux. Les anciens RS sont conservés pour permettre le rollback." },

{ id:"c2-14", lvl:2, dom:"Kubernetes",
  q:"Que se passe-t-il quand une readiness probe échoue ?",
  choix:["Le Pod est retiré des Endpoints du Service : plus de trafic, mais il reste vivant","Le conteneur est redémarré","Le Pod est supprimé et recréé","Le nœud est marqué NotReady"],
  bonne:0,
  explain:"C'est la liveness qui redémarre. Readiness = « prêt à recevoir du trafic ». Confondre les deux est l'erreur la plus fréquente sur Kubernetes." },

{ id:"c2-15", lvl:2, dom:"Kubernetes",
  q:"Un Secret Kubernetes est-il chiffré par défaut ?",
  choix:["Non : il est seulement encodé en base64 dans etcd","Oui, avec AES-256","Oui, si le cluster est managé","Oui, mais uniquement en transit"],
  bonne:0,
  explain:"Il faut activer l'<code>EncryptionConfiguration</code> côté API server, ou externaliser (External Secrets Operator, CSI Secret Store). Et surtout restreindre le RBAC sur les Secrets." },

{ id:"c2-16", lvl:2, dom:"Kubernetes",
  q:"Quelle est la différence entre un label et une annotation ?",
  choix:["Les labels sont indexés et servent à SÉLECTIONNER des objets ; les annotations portent des métadonnées non sélectionnables","Les annotations sont visibles, les labels sont internes","Les labels sont limités à 3 par objet","Aucune différence technique"],
  bonne:0,
  explain:"Services, ReplicaSets et NetworkPolicies fonctionnent par <code>selector</code> sur les labels. Les annotations transportent de la config d'outil, des checksums, des données volumineuses." },

{ id:"c2-17", lvl:2, dom:"Kubernetes",
  q:"Que fait <code>kubectl apply</code> qu'un <code>kubectl create</code> ne fait pas ?",
  choix:["Il est idempotent : il crée OU met à jour l'objet","Il valide le YAML avant envoi","Il crée les namespaces manquants","Il attend que les Pods soient prêts"],
  bonne:0,
  explain:"<code>create</code> échoue si l'objet existe déjà. <code>apply</code> calcule un diff et converge. En pipeline, c'est toujours <code>apply</code>." },

{ id:"c2-18", lvl:2, dom:"Terraform",
  q:"Que signifie <code>-/+</code> dans un plan Terraform ?",
  choix:["La ressource sera DÉTRUITE puis RECRÉÉE","Elle sera modifiée en place","Elle sera renommée","Elle sera ignorée"],
  bonne:0,
  explain:"<code>+</code> création, <code>-</code> destruction, <code>~</code> modification en place, <code>-/+</code> remplacement. Toujours chercher la mention <code># forces replacement</code> pour savoir quel attribut immuable a changé." },

{ id:"c2-19", lvl:2, dom:"Terraform",
  q:"Pourquoi un backend distant est-il indispensable en équipe ?",
  choix:["Pour partager le state ET le verrouiller pendant un apply","Pour accélérer le téléchargement des providers","Pour chiffrer le code source","Pour permettre le travail hors ligne"],
  bonne:0,
  explain:"Sans verrou, deux <code>apply</code> simultanés corrompent le state ou créent des doublons. S3+DynamoDB, azurerm avec bail de blob, ou HCP Terraform." },

{ id:"c2-20", lvl:2, dom:"Terraform",
  q:"Le fichier <code>.terraform.lock.hcl</code> doit-il être commité ?",
  choix:["Oui : il fige les versions et empreintes des providers pour tout le monde","Non, il est propre à chaque machine","Non, il contient des secrets","Seulement en production"],
  bonne:0,
  explain:"C'est ce qui garantit que ton poste, celui du collègue et la CI utilisent strictement les mêmes providers. À ne pas confondre avec le verrou de state." },

{ id:"c2-21", lvl:2, dom:"Terraform",
  q:"Quelle contrainte de version protège d'une montée de version majeure ?",
  choix:["<code>~&gt; 4.0</code>","<code>&gt;= 4.0</code>","<code>!= 3.0</code>","<code>latest</code>"],
  bonne:0,
  explain:"L'opérateur pessimiste <code>~&gt;</code> autorise 4.1 et 4.9 mais pas 5.0. <code>&gt;= 4.0</code> accepterait une v5 qui casse tout du jour au lendemain." },

{ id:"c2-22", lvl:2, dom:"AWS",
  q:"Qu'est-ce qui rend un subnet AWS « public » ?",
  choix:["Une route <code>0.0.0.0/0</code> vers l'Internet Gateway dans sa route table","Son nom contenant « public »","La présence d'une NAT Gateway","Un Security Group ouvert"],
  bonne:0,
  explain:"Le nom n'a aucune valeur technique. Il faut aussi une IP publique (ou EIP) sur l'instance pour qu'elle soit joignable de l'extérieur." },

{ id:"c2-23", lvl:2, dom:"AWS",
  q:"Un Security Group est stateful. Qu'est-ce que ça change ?",
  choix:["Le trafic de retour est automatiquement autorisé, sans règle sortante","Il mémorise les IP bloquées","Il s'applique à tout le subnet","Il journalise chaque connexion"],
  bonne:0,
  explain:"Une NACL, elle, est stateless : il faut une règle explicite dans CHAQUE sens, y compris sur les ports éphémères (1024-65535) pour le retour." },

{ id:"c2-24", lvl:2, dom:"AWS",
  q:"Pourquoi préférer un IAM Role à un IAM User pour une application sur EC2 ?",
  choix:["Le rôle délivre des credentials temporaires à rotation automatique — aucune clé statique","Le rôle est moins cher","Le rôle permet plus de permissions","Le rôle fonctionne sans réseau"],
  bonne:0,
  explain:"Instance profile sur EC2, IRSA sur EKS, OIDC pour la CI. Les clés d'accès statiques codées en dur sont la première cause de fuite en entreprise." },

{ id:"c2-25", lvl:2, dom:"Azure",
  q:"Quel est l'avantage principal d'une Managed Identity sur un Service Principal ?",
  choix:["Aucun secret à stocker ni à faire tourner : Azure gère le cycle de vie","Elle coûte moins cher","Elle donne plus de permissions","Elle fonctionne hors d'Azure"],
  bonne:0,
  explain:"Le token est récupéré via l'endpoint IMDS. Un Service Principal impose de gérer un secret ou un certificat, avec son expiration et sa rotation." },

{ id:"c2-26", lvl:2, dom:"Azure",
  q:"Dans quel cas une Managed Identity user-assigned est-elle nécessaire ?",
  choix:["Quand on veut assigner les droits RBAC AVANT de créer la ressource, ou la partager entre plusieurs ressources","Quand la ressource est dans un autre tenant","Quand on a besoin d'un mot de passe","Quand la ressource est éphémère"],
  bonne:0,
  explain:"System-assigned est liée au cycle de vie de sa ressource (1:1, supprimée avec elle). User-assigned est un objet indépendant — ce qui règle le problème poule/œuf en Terraform." },

{ id:"c2-27", lvl:2, dom:"Azure",
  q:"Comment sont évaluées les règles d'un NSG ?",
  choix:["Par priorité croissante, la première qui correspond s'applique et l'évaluation s'arrête","Toutes les règles sont évaluées, le Deny gagne toujours","Par ordre alphabétique du nom","De la plus récente à la plus ancienne"],
  bonne:0,
  explain:"Piège classique : une règle Allow en priorité 300 qui ne sert jamais parce qu'un Deny existe en 200. Des règles par défaut existent en fin de liste." },

{ id:"c2-28", lvl:2, dom:"Réseau",
  q:"Quelles sont les trois étapes du handshake TCP ?",
  choix:["SYN, SYN-ACK, ACK","HELLO, ACK, DATA","OPEN, CONFIRM, CLOSE","REQUEST, RESPONSE, ACK"],
  bonne:0,
  explain:"Une connexion bloquée en SYN_SENT côté client, c'est presque toujours un firewall qui DROP silencieusement — un REJECT donnerait un « connection refused » immédiat." },

{ id:"c2-29", lvl:2, dom:"Réseau",
  q:"Dans un handshake TLS, à quoi sert la partie asymétrique ?",
  choix:["À authentifier le serveur et établir une clé de session symétrique","À chiffrer tout le trafic de la session","À compresser les données","À vérifier l'intégrité des paquets"],
  bonne:0,
  explain:"L'asymétrique est lent : il ne sert qu'à établir la confiance et négocier la clé (ECDHE, d'où la forward secrecy). Le trafic est ensuite chiffré en symétrique (AES)." },

{ id:"c2-30", lvl:2, dom:"Réseau",
  q:"Quand choisit-on un load balancer L7 plutôt que L4 ?",
  choix:["Quand on a besoin de router par URL, host ou header, ou de terminer le TLS","Quand on veut la latence la plus faible possible","Quand le protocole n'est pas HTTP","Quand on a besoin d'une IP statique"],
  bonne:0,
  explain:"L4 (NLB, Azure LB) route sur IP/port sans lire le contenu : rapide, tout protocole, IP source préservée. L7 (ALB, App Gateway, Ingress) comprend HTTP." },

{ id:"c2-31", lvl:2, dom:"CI/CD",
  q:"Dans quel ordre ranger les étapes d'un pipeline pour un feedback rapide ?",
  choix:["Lint → tests unitaires → build → scan sécurité → tests d'intégration → déploiement","Build → déploiement → tests → lint","Tests d'intégration → tests unitaires → build","Scan sécurité → déploiement → build → tests"],
  bonne:0,
  explain:"Le moins coûteux et le plus discriminant d'abord (<em>fail fast</em>). Objectif : un retour utile en moins de 10 minutes sur une PR." },

{ id:"c2-32", lvl:2, dom:"CI/CD",
  q:"Pourquoi ne jamais taguer une image de production en <code>latest</code> ?",
  choix:["C'est un tag mutable : on ne sait plus ce qui tourne et le rollback devient impossible","Docker Hub facture les tags latest","Le tag latest est réservé aux images officielles","Il ralentit le pull"],
  bonne:0,
  explain:"En production, on référence idéalement le digest immuable (<code>@sha256:…</code>). Un tag peut être réaffecté à tout moment : il ne prouve rien." },

{ id:"c2-33", lvl:2, dom:"Sécurité",
  q:"Pourquoi ne pas passer un secret via <code>ARG</code> dans un Dockerfile ?",
  choix:["Il reste visible dans l'historique des couches (<code>docker history</code>)","Les ARG sont limités à 64 caractères","Docker les convertit en clair dans les logs de build uniquement","Ils ne sont pas transmis au conteneur"],
  bonne:0,
  explain:"Quiconque a l'image a le secret. Solutions : BuildKit <code>--mount=type=secret</code>, ou injection au RUNTIME depuis un coffre." },

{ id:"c2-34", lvl:2, dom:"Observabilité",
  q:"Pourquoi préférer des logs structurés en JSON ?",
  choix:["Ils sont indexables et requêtables par champ, sans regex fragile","Ils prennent moins de place","Ils sont chiffrés par défaut","Ils sont plus lisibles pour un humain"],
  bonne:0,
  explain:"Champs indispensables : timestamp, level, service, version, environnement, trace_id. Le texte libre casse dès qu'un dev change le format d'un message." },

{ id:"c2-35", lvl:2, dom:"SRE",
  q:"Qu'est-ce qu'un post-mortem « blameless » ?",
  choix:["Une analyse qui cherche les causes systémiques plutôt qu'un coupable","Un rapport rédigé sans nommer l'incident","Une réunion sans compte rendu écrit","Un post-mortem rédigé par un tiers externe"],
  bonne:0,
  explain:"Objectif : que les gens rapportent les incidents sans peur. Chercher un coupable fait taire l'information et garantit la récidive." }

]);

</script>
<script>
/* qcm/niveau03.js */
window.QCM = (window.QCM || []).concat([
/* ============ QCM NIVEAU 3 — USAGE QUOTIDIEN ============ */

{ id:"c3-01", lvl:3, dom:"Linux",
  q:"La load average est à 8 sur une machine à 4 cœurs, mais le CPU est à 10 %. Que conclus-tu ?",
  choix:["Saturation d'I/O : la load compte aussi les processus en attente ininterruptible","Le CPU est mal mesuré","Il faut ajouter des cœurs","La machine est en train de redémarrer"],
  bonne:0,
  explain:"Sous Linux, la load inclut les processus en état D (attente disque, NFS). À croiser avec <code>%iowait</code> via <code>top</code>, <code>vmstat</code> ou <code>iostat</code>." },

{ id:"c3-02", lvl:3, dom:"Linux",
  q:"Quelle commande rend un service systemd actif MAINTENANT et au prochain démarrage ?",
  choix:["<code>systemctl enable --now mon.service</code>","<code>systemctl start mon.service</code>","<code>systemctl enable mon.service</code>","<code>systemctl restart mon.service</code>"],
  bonne:0,
  explain:"<code>enable</code> seul crée le lien pour le boot sans rien lancer — piège très fréquent. <code>--now</code> ajoute le démarrage immédiat." },

{ id:"c3-03", lvl:3, dom:"Linux",
  q:"Différence entre un hard link et un symlink ?",
  choix:["Le hard link pointe le même inode ; le symlink stocke un chemin et devient mort si la cible disparaît","Le hard link peut traverser les systèmes de fichiers, pas le symlink","Le symlink duplique les données","Aucune, ce sont deux noms du même mécanisme"],
  bonne:0,
  explain:"Supprimer l'original ne casse pas un hard link : le contenu vit tant qu'il reste un lien. Le symlink, lui, peut traverser les systèmes de fichiers et pointer un répertoire." },

{ id:"c3-04", lvl:3, dom:"Linux",
  q:"Pourquoi <code>sort</code> est-il indispensable avant <code>uniq</code> ?",
  choix:["<code>uniq</code> ne dédoublonne que des lignes ADJACENTES","<code>uniq</code> exige une entrée triée pour des raisons de performance","<code>sort</code> supprime déjà les doublons","Ce n'est pas nécessaire"],
  bonne:0,
  explain:"D'où l'idiome <code>sort | uniq -c | sort -rn</code> pour obtenir un classement des occurrences." },

{ id:"c3-05", lvl:3, dom:"Linux",
  q:"Ton service échoue avec « Too many open files ». Quel est le bon réflexe ?",
  choix:["Regarder <code>/proc/&lt;pid&gt;/limits</code>, corriger <code>LimitNOFILE</code> dans l'unité systemd — et chercher la fuite","Ajouter <code>ulimit -n 65536</code> dans le .bashrc","Redémarrer la machine","Augmenter la RAM"],
  bonne:0,
  explain:"Le <code>ulimit</code> du shell ne s'applique pas à un service systemd. Et la vraie question reste la fuite : sockets non fermés, connexions en CLOSE_WAIT, absence de pool." },

{ id:"c3-06", lvl:3, dom:"Linux",
  q:"Pourquoi <code>tail -f</code> cesse-t-il d'afficher après une rotation de logs ?",
  choix:["Il suit le descripteur de fichier, donc l'ancien fichier renommé — <code>tail -F</code> suit le nom","La rotation coupe le processus tail","Le fichier est compressé","Les permissions changent"],
  bonne:0,
  explain:"Détail qui trahit l'expérience terrain. Même logique côté logrotate : il faut signaler au process de rouvrir son fichier (postrotate) ou utiliser <code>copytruncate</code>." },

{ id:"c3-07", lvl:3, dom:"Git",
  q:"Comment retrouver le commit qui a introduit un bug parmi 500 commits ?",
  choix:["<code>git bisect</code> : dichotomie, ~9 tests suffisent","<code>git log --all</code> et lecture manuelle","<code>git blame</code> sur chaque fichier","<code>git diff</code> entre le premier et le dernier commit"],
  bonne:0,
  explain:"<code>git bisect start</code>, <code>bad</code>, <code>good &lt;sha&gt;</code>, puis Git propose les commits intermédiaires. Avec <code>git bisect run ./test.sh</code>, c'est entièrement automatique." },

{ id:"c3-08", lvl:3, dom:"Git",
  q:"Tu as fait <code>git reset --hard</code> et perdu deux commits. Récupérables ?",
  choix:["Oui, via <code>git reflog</code> qui garde l'historique local de HEAD","Non, c'est définitif","Oui, en re-clonant le dépôt","Oui, avec <code>git fsck --repair</code>"],
  bonne:0,
  explain:"Le reflog conserve les positions de HEAD (~90 jours). Ça ne fonctionne que localement, et seulement pour du travail déjà commité." },

{ id:"c3-09", lvl:3, dom:"Git",
  q:"Pourquoi préférer <code>--force-with-lease</code> à <code>--force</code> ?",
  choix:["Il refuse d'écraser si quelqu'un a poussé entre-temps","Il est plus rapide","Il crée une sauvegarde automatique","Il fonctionne sans droits d'écriture"],
  bonne:0,
  explain:"<code>--force</code> écrase le distant quoi qu'il arrive, y compris le travail d'un collègue poussé entre ton fetch et ton push." },

{ id:"c3-10", lvl:3, dom:"Docker",
  q:"Ton conteneur met 10 secondes à s'arrêter avec <code>docker stop</code>. Pourquoi ?",
  choix:["Le PID 1 ne gère pas SIGTERM — souvent parce que le CMD est en forme shell","Le disque est lent","Le réseau doit se fermer proprement","C'est le comportement normal de Docker"],
  bonne:0,
  explain:"En forme shell, c'est <code>/bin/sh -c</code> qui est PID 1 et ne relaie pas les signaux. Après le timeout, Docker envoie SIGKILL. Solutions : forme exec, <code>tini</code>, ou un handler applicatif." },

{ id:"c3-11", lvl:3, dom:"Docker",
  q:"Comment deux conteneurs sur le même hôte se résolvent-ils par nom ?",
  choix:["En les plaçant sur un réseau bridge personnalisé, qui fournit un DNS interne","Via /etc/hosts modifié automatiquement","Par broadcast sur le réseau de l'hôte","C'est impossible sans Kubernetes"],
  bonne:0,
  explain:"Le bridge PAR DÉFAUT n'offre pas la résolution par nom — d'où la recommandation systématique de créer un réseau dédié avec <code>docker network create</code>." },

{ id:"c3-12", lvl:3, dom:"Docker",
  q:"Comment faire tourner un conteneur en non-root ?",
  choix:["Créer un utilisateur dans le Dockerfile puis <code>USER 10001</code>","Ajouter <code>--no-root</code> au docker run","Supprimer le shell de l'image","C'est automatique depuis Docker 20"],
  bonne:0,
  explain:"Côté Kubernetes on complète par <code>runAsNonRoot: true</code>, <code>readOnlyRootFilesystem: true</code> et <code>capabilities.drop: [ALL]</code>. Root dans le conteneur reste souvent root sur l'hôte." },

{ id:"c3-13", lvl:3, dom:"Kubernetes",
  q:"Un Pod reste en <code>Pending</code>. Quelle est la première commande à lancer ?",
  choix:["<code>kubectl describe pod</code> pour lire les Events","<code>kubectl logs</code>","<code>kubectl delete pod</code>","<code>kubectl top pod</code>"],
  bonne:0,
  explain:"Les Events en bas du describe donnent 80 % des réponses : ressources insuffisantes, taints non tolérés, PVC non lié, quota de namespace atteint. <code>logs</code> ne sert à rien : le conteneur n'a pas démarré." },

{ id:"c3-14", lvl:3, dom:"Kubernetes",
  q:"Différence entre CrashLoopBackOff et ImagePullBackOff ?",
  choix:["Crash = le conteneur démarre puis se termine en boucle ; ImagePull = l'image n'a pas pu être téléchargée","Crash concerne le nœud, ImagePull le Pod","ImagePull est temporaire, Crash est définitif","Aucune, ce sont deux affichages du même état"],
  bonne:0,
  explain:"CrashLoop : lire <code>kubectl logs --previous</code> (bug, config manquante, liveness trop stricte, OOM). ImagePull : tag inexistant, imagePullSecret manquant, registry injoignable derrière le proxy." },

{ id:"c3-15", lvl:3, dom:"Kubernetes",
  q:"Que se passe-t-il si un conteneur dépasse sa <code>limit</code> mémoire ?",
  choix:["Il est tué immédiatement (OOMKill), car la mémoire n'est pas compressible","Il est ralenti (throttling)","Il est déplacé sur un autre nœud","Kubernetes augmente la limite automatiquement"],
  bonne:0,
  explain:"Dépassement CPU = throttling (compressible). Dépassement mémoire = OOMKill, exit code 137. C'est LA distinction à connaître." },

{ id:"c3-16", lvl:3, dom:"Kubernetes",
  q:"Quel type de Service provisionne un load balancer cloud ?",
  choix:["LoadBalancer","ClusterIP","NodePort","ExternalName"],
  bonne:0,
  explain:"ClusterIP = interne (défaut). NodePort = un port sur chaque nœud. LoadBalancer = LB cloud pointant vers le NodePort. En production, on met plutôt un Ingress devant UN seul LoadBalancer." },

{ id:"c3-17", lvl:3, dom:"Kubernetes",
  q:"Pour quel besoin utilise-t-on un StatefulSet plutôt qu'un Deployment ?",
  choix:["Identité stable, PVC dédié par Pod, démarrage ordonné — bases, brokers, clusters à quorum","Pour les applications qui consomment beaucoup de CPU","Pour déployer un Pod par nœud","Pour les traitements batch"],
  bonne:0,
  explain:"Noms ordinaux (<code>db-0</code>, <code>db-1</code>), DNS stable via un headless Service. Un Deployment traite ses Pods comme du bétail interchangeable." },

{ id:"c3-18", lvl:3, dom:"Kubernetes",
  q:"À quoi sert un initContainer ?",
  choix:["Exécuter une tâche jusqu'à son terme AVANT les conteneurs principaux","Surveiller le conteneur principal en continu","Initialiser le nœud au démarrage","Remplacer le conteneur en cas de crash"],
  bonne:0,
  explain:"Usages : attendre une dépendance, appliquer une migration, récupérer un fichier de config, ajuster des permissions sur un volume. S'il échoue, le Pod redémarre." },

{ id:"c3-19", lvl:3, dom:"Terraform",
  q:"Pourquoi préférer <code>for_each</code> à <code>count</code> pour des ressources distinctes ?",
  choix:["<code>for_each</code> indexe par CLÉ : supprimer un élément n'affecte pas les autres","<code>count</code> est déprécié","<code>for_each</code> est plus rapide","<code>count</code> ne fonctionne pas avec les modules"],
  bonne:0,
  explain:"<code>count</code> indexe par position : supprimer l'élément 1 sur 3 décale tout et Terraform veut détruire/recréer les suivants. Règle : <code>count</code> uniquement pour un booléen 0/1." },

{ id:"c3-20", lvl:3, dom:"Terraform",
  q:"Comment intégrer dans Terraform une ressource créée à la main ?",
  choix:["Écrire la ressource, puis <code>terraform import</code> (ou un bloc <code>import</code>), puis itérer sur le plan","<code>terraform refresh</code> la détecte automatiquement","<code>terraform apply -sync</code>","Ce n'est pas possible, il faut la recréer"],
  bonne:0,
  explain:"L'import ne génère PAS le code. Le bloc <code>import</code> (1.5+) est préférable : déclaratif, versionné, visible dans le plan." },

{ id:"c3-21", lvl:3, dom:"Terraform",
  q:"Pourquoi utilise-t-on rarement <code>depends_on</code> ?",
  choix:["Terraform déduit le graphe des RÉFÉRENCES entre ressources — c'est implicite et suffisant à 95 %","Il est déprécié depuis la version 1.0","Il ralentit le téléchargement des providers","Il ne fonctionne pas dans les modules"],
  bonne:0,
  explain:"On le réserve aux dépendances non exprimables par une référence. En abuser sérialise inutilement le graphe et allonge l'apply." },

{ id:"c3-22", lvl:3, dom:"Terraform",
  q:"Que fait <code>terraform validate</code> que <code>plan</code> ne fait pas ?",
  choix:["Il vérifie syntaxe et cohérence interne SANS appeler les API ni lire le state","Il applique les changements en mode simulation","Il vérifie les permissions IAM","Il teste les modules distants"],
  bonne:0,
  explain:"Très rapide, utilisable sans credentials — donc parfait en première étape de CI. <code>plan</code> interroge réellement le fournisseur." },

{ id:"c3-23", lvl:3, dom:"AWS",
  q:"Quel type de policy IAM permet un accès cross-compte sans AssumeRole ?",
  choix:["Une resource-based policy (bucket policy, key policy), qui contient un <code>Principal</code>","Une identity-based policy","Une SCP","Une permission boundary"],
  bonne:0,
  explain:"Identity-based : ce que CETTE identité peut faire. Resource-based : qui peut agir sur CETTE ressource. La seconde porte un champ Principal." },

{ id:"c3-24", lvl:3, dom:"AWS",
  q:"Quand choisit-on un NLB plutôt qu'un ALB ?",
  choix:["Protocole non-HTTP, besoin d'IP statique à whitelister, ou performance extrême","Quand on veut router par path ou par host","Quand on a besoin d'un WAF","Quand on utilise des conteneurs"],
  bonne:0,
  explain:"NLB = L4 : latence très faible, millions de connexions, IP statique par AZ, préserve l'IP source, TCP/UDP. ALB = L7 : routage fin, WAF, authentification." },

{ id:"c3-25", lvl:3, dom:"AWS",
  q:"Pourquoi utiliser SSM Session Manager plutôt que SSH sur une instance EC2 ?",
  choix:["Aucun port 22 ouvert, aucune clé à gérer, accès contrôlé par IAM et session journalisée","C'est plus rapide que SSH","Ça fonctionne sans agent installé","Ça permet le transfert de fichiers"],
  bonne:0,
  explain:"C'est la réponse attendue sur « comment accédez-vous aux serveurs en production ». Le bastion classique est lui-même une machine à patcher et une cible." },

{ id:"c3-26", lvl:3, dom:"Azure",
  q:"Quelle différence entre un NSG et l'Azure Firewall ?",
  choix:["Le NSG filtre en L3/L4 sur un subnet ou une NIC ; l'Azure Firewall est un service managé centralisé avec des règles par FQDN","Le NSG est payant, le firewall est gratuit","Le NSG s'applique aux VM, le firewall aux conteneurs","Ils sont interchangeables"],
  bonne:0,
  explain:"L'Azure Firewall vit dans le hub d'une topologie hub-and-spoke : threat intelligence, DNAT/SNAT, journalisation complète, règles applicatives." },

{ id:"c3-27", lvl:3, dom:"Azure",
  q:"Tu crées un Private Endpoint vers un Storage Account, mais l'application joint toujours l'IP publique. Que manque-t-il ?",
  choix:["La Private DNS Zone <code>privatelink.*</code> liée au VNet","Un Security Group sur le subnet","Une route vers l'Internet Gateway","Un redémarrage du Storage Account"],
  bonne:0,
  explain:"Le FQDN public doit résoudre vers l'IP privée : sans Private DNS Zone liée au VNet, on retombe sur l'IP publique. C'est LE piège du Private Endpoint." },

{ id:"c3-28", lvl:3, dom:"Azure",
  q:"Un utilisateur a le rôle Owner sur une subscription. Une Azure Policy en mode Deny le bloque-t-elle ?",
  choix:["Oui : le RBAC dit QUI peut agir, la Policy dit CE QUI peut exister","Non, Owner contourne toutes les policies","Seulement si la policy est assignée au niveau management group","Non, sauf si la policy est en mode Enforce"],
  bonne:0,
  explain:"Ce sont deux plans distincts et complémentaires. Une policy Deny bloque la création non conforme, quel que soit le rôle." },

{ id:"c3-29", lvl:3, dom:"CI/CD",
  q:"Pourquoi un runner de CI doit-il être éphémère ?",
  choix:["Pour éviter cache pollué, dépendances résiduelles et secrets laissés par un job précédent","Pour réduire la facture cloud","Parce que les runners persistants sont dépréciés","Pour permettre le parallélisme"],
  bonne:0,
  explain:"Un runner persistant devient un point de compromission latérale entre projets. D'où les runners conteneurisés jetables." },

{ id:"c3-30", lvl:3, dom:"CI/CD",
  q:"Qu'est-ce qui distingue le GitOps d'un pipeline push classique ?",
  choix:["Un agent DANS le cluster tire depuis Git et réconcilie en continu — pas de credentials cluster dans la CI","Le GitOps n'utilise pas de pipeline","Le GitOps déploie plus vite","Le GitOps ne fonctionne qu'avec Helm"],
  bonne:0,
  explain:"Conséquences : dérive détectée et corrigée, rollback = <code>git revert</code>, audit natif par l'historique Git, et un nouveau cluster se reconstruit en pointant l'agent sur le dépôt." },

{ id:"c3-31", lvl:3, dom:"Sécurité",
  q:"Quel mécanisme évite tout secret longue durée entre un pipeline CI et le cloud ?",
  choix:["La fédération d'identité OIDC : le pipeline échange un token signé contre des credentials temporaires","Un secret stocké chiffré dans les variables du pipeline","Une clé d'accès avec rotation trimestrielle","Un certificat client renouvelé chaque année"],
  bonne:0,
  explain:"Le meilleur secret est celui qui n'existe pas. À défaut : coffre avec injection au runtime, scope par environnement, masquage des logs et rotation." },

{ id:"c3-32", lvl:3, dom:"Sécurité",
  q:"À quel moment du pipeline place-t-on un scan DAST ?",
  choix:["En recette, contre l'application déployée et en cours d'exécution","Au commit, sur le code source","Au build, sur les dépendances","En pre-commit, sur le poste du développeur"],
  bonne:0,
  explain:"SAST = analyse statique du code (tôt). SCA = dépendances et CVE (au build + veille continue). DAST = test dynamique contre l'application qui tourne." },

{ id:"c3-33", lvl:3, dom:"Observabilité",
  q:"Pourquoi alerte-t-on sur les symptômes plutôt que sur les causes ?",
  choix:["Alerter sur un CPU à 90 % génère du bruit alors que le service va peut-être très bien","Les causes sont plus difficiles à mesurer","Les symptômes se détectent plus vite techniquement","Pour respecter la norme ISO"],
  bonne:0,
  explain:"On alerte sur ce que l'utilisateur subit : latence, taux d'erreur, saturation (RED/USE). Les causes servent au diagnostic dans le dashboard, pas au réveil nocturne." },

{ id:"c3-34", lvl:3, dom:"SRE",
  q:"Qu'est-ce que le toil au sens SRE ?",
  choix:["Du travail manuel, répétitif, automatisable, sans valeur durable, qui croît avec le service","Toute tâche d'exploitation","Le travail effectué pendant l'astreinte","La dette technique accumulée"],
  bonne:0,
  explain:"Google fixe la limite à 50 % du temps d'un SRE. Au-delà, on arrête les nouveautés pour automatiser. C'est l'argument qui justifie un investissement d'outillage." },

{ id:"c3-35", lvl:3, dom:"SQL",
  q:"Quelle est la différence entre <code>WHERE</code> et <code>HAVING</code> ?",
  choix:["<code>WHERE</code> filtre les lignes avant l'agrégation, <code>HAVING</code> filtre les groupes après le GROUP BY","<code>HAVING</code> est plus rapide","<code>WHERE</code> ne fonctionne pas avec les jointures","Ce sont des synonymes selon le SGBD"],
  bonne:0,
  explain:"<code>HAVING</code> peut donc porter sur un agrégat (<code>HAVING COUNT(*) &gt; 5</code>). Pour la performance, filtrer un maximum dans le WHERE." },

{ id:"c3-36", lvl:3, dom:"SQL",
  q:"Quel est le coût d'un index ?",
  choix:["De l'espace disque et un surcoût sur chaque INSERT/UPDATE/DELETE","Uniquement de l'espace disque","Un ralentissement des lectures complexes","Aucun, c'est toujours bénéfique"],
  bonne:0,
  explain:"L'index doit être maintenu à chaque écriture. D'où : indexer les colonnes de filtre et de jointure réellement utilisées, pas tout par précaution." }

]);

</script>
<script>
