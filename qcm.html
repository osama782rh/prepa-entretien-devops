  {"id":"az900-ar-s-rbac","lvl":8,"dom":"Sécurité","q":"Un auditeur externe doit pouvoir CONSULTER toutes les ressources d'un abonnement sans RIEN modifier. Quel rôle RBAC ?","explain":"Lecture seule = Reader. Contributor peut modifier, Owner peut en plus gérer les accès. Toujours le moindre privilège.","choix":["Lecteur (Reader) sur l'abonnement","Contributeur (Contributor)","Propriétaire (Owner)","Administrateur général"],"bonne":0},
  {"id":"az900-ar-s-rbac2","lvl":9,"dom":"Sécurité","q":"Un prestataire doit créer et gérer des VM dans UN groupe de ressources, sans pouvoir donner d'accès à d'autres personnes. Quel rôle, quel périmètre ?","explain":"Contributor = gérer les ressources SANS gérer les accès (ça, c'est Owner). Et on limite le périmètre au seul groupe nécessaire.","choix":["Contributeur sur le groupe de ressources concerné","Propriétaire sur l'abonnement","Lecteur sur le groupe","Contributeur sur tout l'abonnement"],"bonne":0},
  {"id":"az900-go-costfactors","lvl":6,"dom":"SRE","q":"Quels facteurs influencent le coût d'une ressource Azure ?","explain":"Les 5 facteurs classiques. Le même service peut coûter plus cher dans une région que dans une autre — d'où l'intérêt de comparer avant de déployer.","choix":["Le type de ressource, sa taille, sa région, sa durée d'utilisation et le trafic réseau SORTANT","Uniquement la taille","Uniquement la durée","Le nombre d'utilisateurs de l'entreprise"],"bonne":0},
  {"id":"az900-go-egress","lvl":4,"dom":"SRE","q":"Concernant le trafic réseau, que facture Azure ?","explain":"Entrer dans Azure est gratuit, en sortir se paie. Rapatrier de gros volumes vers ton datacenter a un coût — à anticiper dans les scénarios hybrides.","choix":["Le trafic SORTANT d'Azure (egress) — le trafic entrant est gratuit","Le trafic entrant uniquement","Tout le trafic dans les deux sens","Rien, le réseau est toujours gratuit"],"bonne":0},
  {"id":"az900-go-s-calc","lvl":8,"dom":"SRE","q":"Ta direction demande : « combien économiserait-on en migrant notre datacenter vers Azure ? ». Quel outil utilises-tu ?","explain":"Comparaison existant vs Azure = TCO. La calculatrice de prix estime un déploiement futur ; Cost Management analyse les dépenses déjà engagées. Trio piège favori de l'examen.","choix":["La calculatrice TCO","La calculatrice de prix","Azure Advisor","Cost Management"],"bonne":0},
  {"id":"az900-go-budget","lvl":5,"dom":"SRE","q":"Que se passe-t-il quand un budget Cost Management est dépassé ?","explain":"Piège d'examen : un budget alerte, il ne coupe pas. Pour agir automatiquement, il faut brancher des actions supplémentaires soi-même.","choix":["Une ALERTE est envoyée — mais les ressources continuent de tourner et de facturer (le budget ne bloque rien par défaut)","Toutes les ressources s'arrêtent immédiatement","L'abonnement est suspendu","Microsoft offre le dépassement"],"bonne":0},
  {"id":"az900-go-s-tags","lvl":9,"dom":"SRE","q":"La direction financière veut savoir combien coûte CHAQUE département dans un abonnement partagé. Quelle solution ?","explain":"Tags + Cost Management = ventilation fine sans multiplier les abonnements. (Pour des factures séparées, là il faudrait des abonnements distincts.)","choix":["Taguer chaque ressource avec son département, puis filtrer dans Cost Management","Créer 50 abonnements","Regarder les factures PDF","Demander à chaque équipe"],"bonne":0},
  {"id":"az900-go-reservations","lvl":6,"dom":"SRE","q":"Comment réduire fortement le coût d'une VM qui tournera 24h/24 pendant des années ?","explain":"Les réservations récompensent l'engagement de durée. À combiner avec Azure Hybrid Benefit si tu as déjà des licences Windows/SQL Server.","choix":["Une réservation d'1 ou 3 ans (jusqu'à ~72 % de réduction par rapport au paiement à l'usage)","La passer en tier Archive","La redémarrer chaque nuit","Utiliser un budget"],"bonne":0},
  {"id":"az900-go-hybridbenefit","lvl":4,"dom":"SRE","q":"Qu'est-ce qu'Azure Hybrid Benefit ?","explain":"Tes licences on-premises avec Software Assurance valent une réduction dans Azure — souvent combinée aux réservations pour un cumul maximal.","choix":["Réutiliser ses licences Windows Server / SQL Server existantes pour réduire le prix des VM Azure","Un avantage pour le cloud hybride","Une remise sur ExpressRoute","La gratuité du support"],"bonne":0},
  {"id":"az900-go-spot","lvl":5,"dom":"SRE","q":"Qu'est-ce qu'une VM Spot ?","explain":"Spot = jusqu'à ~90 % de réduction, contre le risque d'éviction. Parfait pour le batch interruptible, exclu pour la production critique.","choix":["Une VM à prix TRÈS réduit utilisant la capacité inutilisée d'Azure — mais qu'Azure peut interrompre à tout moment","Une VM plus rapide","Une VM gratuite pour les tests","Une VM réservée"],"bonne":0},
  {"id":"az900-go-vm-stopped","lvl":6,"dom":"SRE","q":"Une VM arrêtée-désallouée (stopped deallocated) génère-t-elle encore des coûts ?","explain":"Piège récurrent : arrêter une VM ne coupe pas tout — le stockage persiste et se paie. Pour ne plus rien payer, il faut supprimer les ressources.","choix":["Oui — le calcul n'est plus facturé, mais les DISQUES et l'éventuelle IP publique réservée continuent de l'être","Non, plus aucun coût","Oui, exactement le même prix","Seulement si elle redémarre"],"bonne":0},
  {"id":"az900-go-policy-effect","lvl":4,"dom":"Sécurité","q":"Que peut faire Azure Policy face à une ressource non conforme ?","explain":"Effets principaux : Deny (bloquer), Audit (signaler), Append/Modify (corriger). Les ressources existantes sont marquées non conformes, pas supprimées.","choix":["Refuser sa création, l'auditer (la signaler), ou parfois la corriger — et évaluer aussi les ressources DÉJÀ existantes","Uniquement envoyer un e-mail","Supprimer la ressource immédiatement","Bloquer l'utilisateur"],"bonne":0},
  {"id":"az900-go-s-policy","lvl":7,"dom":"Sécurité","q":"L'entreprise exige que TOUTES les ressources soient créées uniquement dans les régions françaises. Quel outil l'impose techniquement ?","explain":"Contraindre le CONTENU des déploiements = Policy. RBAC contrôle les personnes, pas les propriétés des ressources. Distinction très testée.","choix":["Azure Policy (règle sur les localisations autorisées)","RBAC","Un e-mail à toutes les équipes","Un verrou de ressource"],"bonne":0},
  {"id":"az900-go-initiative","lvl":5,"dom":"Sécurité","q":"Qu'est-ce qu'une « initiative » Azure Policy ?","explain":"L'initiative regroupe des dizaines de règles en un seul assignement — la façon standard d'appliquer un standard de conformité complet.","choix":["Un GROUPE de policies assignées ensemble pour couvrir un objectif global (ex : conformité RGPD)","Une policy en période d'essai","Un projet de gouvernance","Une exception à une policy"],"bonne":0},
  {"id":"az900-go-lock-types","lvl":6,"dom":"Sécurité","q":"Quels sont les deux types de verrous de ressources ?","explain":"CannotDelete laisse travailler mais empêche la suppression ; ReadOnly fige tout. Le verrou prime sur les permissions RBAC.","choix":["CannotDelete (suppression interdite, modification permise) et ReadOnly (aucune modification possible)","Soft et Hard","Public et Privé","Temporaire et Permanent"],"bonne":0},
  {"id":"az900-go-s-lock","lvl":8,"dom":"Sécurité","q":"Un stagiaire a supprimé par erreur une base de production le mois dernier. Comment empêcher que ça se reproduise, même pour un administrateur pressé ?","explain":"Le verrou ajoute une friction volontaire : pour supprimer, il faut d'abord CONSCIEMMENT retirer le verrou. La sauvegarde répare, le verrou prévient.","choix":["Poser un verrou CannotDelete sur les ressources critiques","Retirer tous les accès à tout le monde","Faire une sauvegarde","Envoyer une note de service"],"bonne":0},
  {"id":"az900-go-purview","lvl":4,"dom":"Sécurité","q":"À quoi sert Microsoft Purview ?","explain":"Purview répond à « quelles données avons-nous, où, et lesquelles sont sensibles ? » — la base de la conformité data (RGPD…).","choix":["Gouverner les DONNÉES : les découvrir, les cataloguer, les classifier (sensibles, personnelles…) dans tout l'environnement","Surveiller les performances des VM","Gérer les mots de passe","Héberger des sites web"],"bonne":0},
  {"id":"az900-go-stp","lvl":5,"dom":"Sécurité","q":"Où trouver les certifications de conformité de Microsoft (ISO, RGPD, HDS…) et les rapports d'audit ?","explain":"Le Service Trust Portal centralise les preuves de conformité de Microsoft — ce que ton RSSI ou un auditeur demandera.","choix":["Sur le Service Trust Portal","Dans le portail Azure","Dans Cost Management","Sur le blog Azure"],"bonne":0},
  {"id":"az900-go-portal","lvl":2,"dom":"Azure","q":"Qu'est-ce que le portail Azure ?","explain":"portal.azure.com : l'interface visuelle. Idéale pour découvrir et administrer ponctuellement ; pour répéter et automatiser → CLI, PowerShell, templates.","choix":["L'interface WEB graphique pour créer et gérer toutes les ressources Azure","Un logiciel à installer","Une API REST","Un centre d'appels"],"bonne":0},
  {"id":"az900-go-cli","lvl":6,"dom":"Azure","q":"Qu'est-ce que l'Azure CLI ?","explain":"az group create, az vm create… Multiplateforme et scriptable. Son alternative Microsoft : Azure PowerShell (cmdlets Verbe-Nom comme New-AzVM).","choix":["L'outil en ligne de commande multiplateforme (Windows/Mac/Linux) dont les commandes commencent par « az »","Un outil réservé à Windows","L'interface graphique","Un langage de programmation"],"bonne":0},
  {"id":"az900-go-pwsh","lvl":4,"dom":"Azure","q":"Qu'est-ce qu'Azure PowerShell ?","explain":"Même rôle que la CLI, syntaxe PowerShell. Le choix entre les deux est affaire d'habitude d'équipe — les deux sont dans Cloud Shell.","choix":["Un module PowerShell avec des cmdlets Azure (New-AzVM, Get-AzResource…), multiplateforme","L'ancien nom du portail","Un OS de serveur","Un service de facturation"],"bonne":0},
  {"id":"az900-go-mobile","lvl":5,"dom":"Azure","q":"Peut-on gérer Azure depuis un téléphone ?","explain":"L'app mobile Azure : dépanner depuis n'importe où — consulter l'état, redémarrer une ressource, lancer Cloud Shell.","choix":["Oui — l'application mobile Azure permet de surveiller, recevoir des alertes et exécuter des actions de base (redémarrer une VM, Cloud Shell)","Non, uniquement depuis un PC","Oui, mais en lecture seule","Uniquement pour payer les factures"],"bonne":0},
  {"id":"az900-go-s-arc","lvl":9,"dom":"Azure","q":"Une entreprise a 200 serveurs dans son datacenter et 50 VM chez AWS. Elle veut leur appliquer les MÊMES policies et la même gestion que ses ressources Azure. Quel service ?","explain":"Gérer SANS migrer = Arc. (Migrate sert à déplacer vers Azure ; ExpressRoute est une connexion réseau.)","choix":["Azure Arc","Azure Migrate","ExpressRoute","Azure Virtual Desktop"],"bonne":0},
  {"id":"az900-go-arm","lvl":4,"dom":"Azure","q":"Qu'est-ce qu'Azure Resource Manager (ARM) ?","explain":"ARM est le chef d'orchestre unique : quel que soit l'outil utilisé, c'est lui qui reçoit, vérifie (RBAC, Policy, locks) et exécute.","choix":["La couche de déploiement et de gestion d'Azure : TOUTES les requêtes (portail, CLI, PowerShell) passent par lui","Un gestionnaire de mots de passe","Le service de facturation","Un type de VM"],"bonne":0},
  {"id":"az900-go-armtemplate","lvl":5,"dom":"Azure","q":"Que sont les templates ARM et Bicep ?","explain":"L'IaC : décrire l'état voulu dans un fichier plutôt que cliquer. Bicep est le langage moderne qui se compile en template ARM JSON.","choix":["Des fichiers DÉCLARATIFS (Infrastructure as Code) qui décrivent les ressources à déployer, de façon répétable et versionnable","Des modèles de facturation","Des thèmes pour le portail","Des sauvegardes de VM"],"bonne":0},
  {"id":"az900-go-s-template","lvl":7,"dom":"Azure","q":"Ton équipe doit déployer 30 fois le MÊME environnement (VM + réseau + stockage), à l'identique et sans erreur humaine. Quelle approche ?","explain":"Répétable + identique + auditable = IaC. Le portail est parfait pour UNE fois, désastreux pour trente.","choix":["Un template ARM/Bicep déployé 30 fois (Infrastructure as Code)","30 sessions de clics dans le portail","Un e-mail avec la procédure","Faire des captures d'écran de la config"],"bonne":0},
  {"id":"az900-go-advisor-cat","lvl":6,"dom":"Observabilité","q":"Quelles sont les 5 catégories de recommandations d'Azure Advisor ?","explain":"Les 5 piliers d'Advisor — alignés sur le Well-Architected Framework. « VM sous-utilisée à redimensionner » = catégorie Coûts.","choix":["Fiabilité, Sécurité, Performances, Coûts, Excellence opérationnelle","CPU, RAM, Disque, Réseau, Prix","Bronze, Argent, Or, Platine, Diamant","Compute, Storage, Network, Identity, Web"],"bonne":0},
  {"id":"az900-go-s-advisor","lvl":8,"dom":"Observabilité","q":"Tu veux une liste de VM SOUS-UTILISÉES à redimensionner pour économiser, sans rien installer ni configurer. Quel service ?","explain":"Advisor observe l'usage réel et propose des économies concrètes — gratuitement et sans configuration.","choix":["Azure Advisor (recommandations de coûts)","La calculatrice TCO","Azure Policy","Service Health"],"bonne":0},
  {"id":"az900-go-resourcehealth","lvl":4,"dom":"Observabilité","q":"Quelle est la différence entre Service Health et Resource Health ?","explain":"« Azure va bien ? » → Service Health. « MA VM va bien ? » → Resource Health. La question d'examen joue sur cette nuance.","choix":["Service Health = l'état de la PLATEFORME Azure (incidents, maintenances) ; Resource Health = l'état de TES ressources individuelles","Ce sont deux noms du même service","Resource Health est payant","Service Health surveille tes VM"],"bonne":0},
  {"id":"az900-go-s-maintenance","lvl":9,"dom":"Observabilité","q":"Tu veux être prévenu par e-mail AVANT toute maintenance planifiée qui touchera tes services Azure. Que configures-tu ?","explain":"Les alertes Service Health notifient incidents, maintenances planifiées et avis de santé — par e-mail, SMS ou webhook.","choix":["Une alerte Service Health","Un budget Cost Management","Une policy","Un verrou ReadOnly"],"bonne":0},
  {"id":"az900-go-loganalytics","lvl":5,"dom":"Observabilité","q":"À quoi sert un espace de travail Log Analytics ?","explain":"Log Analytics = la base de données des logs + son langage de requête. C'est là qu'on enquête après un incident.","choix":["Stocker et INTERROGER les journaux collectés par Azure Monitor (avec le langage de requête KQL)","Héberger des sites web","Stocker des sauvegardes","Analyser les coûts"],"bonne":0},
  {"id":"az900-go-appinsights","lvl":6,"dom":"Observabilité","q":"Que surveille Application Insights ?","explain":"App Insights = le monitoring APPLICATIF (ton code), quand Azure Monitor couvre l'infrastructure. « Mon site est lent, pourquoi ? » → App Insights.","choix":["Les PERFORMANCES de tes applications : requêtes, temps de réponse, erreurs, dépendances","La santé des datacenters Azure","Les coûts de l'abonnement","Les connexions des employés"],"bonne":0},
  {"id":"az900-go-alerts","lvl":4,"dom":"Observabilité","q":"Comment être averti automatiquement quand le CPU d'une VM dépasse 90 % pendant 10 minutes ?","explain":"Alerte = condition sur une métrique/un log + groupe d'actions (qui prévenir, quoi déclencher). Le duo de base de la supervision.","choix":["Une règle d'alerte Azure Monitor sur la métrique CPU, reliée à une notification (e-mail, SMS…)","Regarder le portail toutes les heures","Un budget","Azure Policy"],"bonne":0},
  {"id":"az900-go-s-slow","lvl":7,"dom":"Observabilité","q":"Les utilisateurs disent que ton application web « rame » par moments. Quel service te montre les requêtes lentes et leurs causes ?","explain":"Performance applicative détaillée = App Insights : chaque requête, sa durée, ses appels aux dépendances (base de données, API…).","choix":["Application Insights","Service Health","Cost Management","Azure Policy"],"bonne":0},
  {"id":"awsd-v-stack","lvl":2,"dom":"Terraform","q":"Quelle est la différence entre un template et une stack CloudFormation ?","explain":"Un même template peut créer plusieurs stacks (dev, staging, prod). Supprimer la stack supprime les ressources (sauf DeletionPolicy: Retain).","choix":["Le template est le fichier de code ; la stack est l'ensemble des ressources réellement déployées à partir de ce template","La stack est le fichier, le template est le déploiement","Ce sont deux noms du même objet","Le template ne concerne que le JSON, la stack le YAML"],"bonne":0},
  {"id":"awsd-v-elb","lvl":3,"dom":"Réseau","q":"Quelle est la différence principale entre un Application Load Balancer et un Network Load Balancer ?","explain":"ALB pour le routage applicatif (chemins, hôtes, blue/green par target group) ; NLB pour la performance extrême, le TCP brut ou une IP fixe.","choix":["L'ALB opère en couche 7 (HTTP/HTTPS, routage par chemin ou en-tête) ; le NLB en couche 4 (TCP/UDP, très faible latence, IP statique)","L'ALB est plus rapide","Le NLB gère le HTTPS, pas l'ALB","L'ALB est régional, le NLB est global"],"bonne":0},
  {"id":"awsd-v-rto-rpo","lvl":2,"dom":"SRE","q":"Quelle est la différence entre RTO et RPO ?","explain":"RTO = Recovery Time Objective (combien de temps pour redémarrer) ; RPO = Recovery Point Objective (combien de données perdues). Ils dictent la stratégie de DR.","choix":["Le RTO est la durée d'indisponibilité acceptable ; le RPO est la quantité de données qu'on accepte de perdre (fenêtre de temps)","Le RTO concerne les données, le RPO le temps","Ce sont des synonymes","Le RPO mesure la performance"],"bonne":0},
  {"id":"awsd-v-dr-strategies","lvl":3,"dom":"SRE","q":"Classe les 4 stratégies de reprise après sinistre du RTO le plus long au plus court :","explain":"Plus le RTO/RPO est court, plus c'est cher. Pilot light = données répliquées + cœur minimal éteint ; warm standby = version réduite mais ACTIVE.","choix":["Backup & restore → Pilot light → Warm standby → Multi-site active/active","Pilot light → Backup & restore → Multi-site → Warm standby","Multi-site → Warm standby → Pilot light → Backup & restore","Warm standby → Multi-site → Backup & restore → Pilot light"],"bonne":0},
  {"id":"awsd-v-immutable","lvl":1,"dom":"AWS","q":"Que signifie une infrastructure « immuable » (immutable infrastructure) ?","explain":"L'immuabilité élimine le drift de configuration et rend les déploiements reproductibles — d'où les AMI construites avec EC2 Image Builder ou Packer.","choix":["On ne modifie jamais un serveur en place : on en déploie un nouveau à partir d'une image et on retire l'ancien","On empêche la suppression des ressources","On chiffre les volumes","On verrouille les templates CloudFormation"],"bonne":0},
  {"id":"awsd-v-featureflag","lvl":1,"dom":"CI/CD","q":"Quel service AWS gère les feature flags et les expérimentations A/B ?","explain":"AppConfig gère les feature flags avec déploiement progressif et rollback automatique sur alarme ; Evidently ajoute l'A/B testing avec analyse statistique.","choix":["Amazon CloudWatch Evidently (ou AppConfig feature flags)","AWS Config","CodeGuru","Systems Manager Run Command"],"bonne":0},
  {"id":"awsd-v-ecs-fargate","lvl":3,"dom":"Docker","q":"Quelle est la différence entre ECS sur EC2 et ECS sur Fargate ?","explain":"Fargate supprime la gestion du parc d'instances. À l'examen : « pas d'infrastructure à gérer » → Fargate ; « besoin de GPU ou d'accès à l'hôte » → EC2.","choix":["Sur EC2 tu gères les instances hôtes ; sur Fargate AWS les gère et tu paies à la tâche (vCPU/mémoire)","Fargate ne supporte pas Docker","EC2 est serverless","Fargate impose Kubernetes"],"bonne":0},
  {"id":"awsd-v-lambda-alias","lvl":2,"dom":"AWS","q":"À quoi sert un alias Lambda ?","explain":"L'alias (ex : « prod ») permet le routage pondéré 90/10 — la base du canary Lambda, que CodeDeploy automatise.","choix":["Pointer vers une version, avec possibilité de répartir le trafic en pourcentage entre deux versions (déploiement pondéré)","Renommer la fonction","Créer un raccourci d'URL","Chiffrer les variables d'environnement"],"bonne":0},
  {"id":"awsd-v-iam-role","lvl":3,"dom":"Sécurité","q":"Quelle est la différence entre un utilisateur IAM et un rôle IAM ?","explain":"Bonne pratique AWS : privilégier les rôles (credentials temporaires, rotation automatique) plutôt que des access keys longue durée.","choix":["L'utilisateur a des credentials permanents ; le rôle est assumé temporairement et fournit des credentials éphémères via STS","Le rôle est réservé aux humains","L'utilisateur est temporaire","Aucune différence pratique"],"bonne":0},
  {"id":"awsd-v-oidc-gh","lvl":3,"dom":"Sécurité","q":"Comment GitHub Actions peut-il déployer sur AWS SANS stocker d'access key dans les secrets du dépôt ?","explain":"OIDC + rôle IAM avec condition sur `sub` (repo:org/repo:ref:refs/heads/main). C'est l'équivalent AWS de la workload identity federation.","choix":["Via un fournisseur d'identité OIDC dans IAM : le workflow échange son jeton OIDC contre un rôle temporaire (AssumeRoleWithWebIdentity)","En chiffrant l'access key","En utilisant un utilisateur IAM dédié","C'est impossible"],"bonne":0},
  {"id":"awsd-v-runbook","lvl":3,"dom":"AWS","q":"Qu'est-ce qu'un runbook dans Systems Manager Automation ?","explain":"Les runbooks SSM Automation (AWS-* ou custom) sont LA cible privilégiée d'une remédiation automatique déclenchée par EventBridge ou AWS Config.","choix":["Un document décrivant une suite d'actions automatisables pour traiter une situation opérationnelle (redémarrer, isoler, corriger)","Un rapport d'incident","Un manuel utilisateur","Un journal d'exécution"],"bonne":0},
  {"id":"awsd-v-tag","lvl":1,"dom":"Sécurité","q":"Pourquoi une stratégie de tagging est-elle essentielle en DevOps sur AWS ?","explain":"Les tag policies d'Organizations imposent la nomenclature ; ABAC autorise selon les tags ; Patch Manager et Backup ciblent par tags.","choix":["Les tags pilotent la répartition des coûts, les contrôles d'accès (ABAC), l'automatisation (Patch Manager, backups) et les rapports de conformité","Uniquement pour la facturation","Uniquement pour la documentation","Uniquement pour trier la console"],"bonne":0},
  {"id":"awsd-f-buildspec-phases","lvl":5,"dom":"CI/CD","q":"Quelles sont les 4 phases d'un buildspec, dans l'ordre ?","explain":"install (runtimes et dépendances), pre_build (login ECR, préparation), build (compilation/tests), post_build (packaging, push d'image).","choix":["install, pre_build, build, post_build","init, build, test, deploy","setup, compile, package, publish","before, main, after, cleanup"],"bonne":0},
  {"id":"awsd-f-buildspec-cache","lvl":5,"dom":"CI/CD","q":"Quels types de cache CodeBuild permettent d'accélérer les builds ?","explain":"Cache local = plus rapide mais non garanti (dépend de la réutilisation de l'hôte). Cache S3 = fiable et partagé, avec un coût de transfert.","choix":["Le cache S3 (partagé entre builds) et le cache local (docker layer, source, custom — sur le même hôte)","Uniquement le cache S3","Uniquement EFS","CodeBuild ne supporte pas le cache"],"bonne":0},
  {"id":"awsd-f-codebuild-vpc","lvl":6,"dom":"CI/CD","q":"Que faut-il configurer pour qu'un projet CodeBuild accède à une base RDS dans un subnet privé ?","explain":"Par défaut CodeBuild s'exécute hors de ton VPC. En VPC, prévoir l'accès sortant (NAT ou endpoints vers S3, ECR, CloudWatch Logs, Secrets Manager).","choix":["La configuration VPC du projet (VPC, subnets privés, security group) — et une NAT Gateway ou des VPC endpoints pour l'accès sortant","Ouvrir la base sur Internet","Utiliser un agent self-hosted","Rien, CodeBuild accède à tout par défaut"],"bonne":0},
  {"id":"awsd-f-codebuild-privileged","lvl":4,"dom":"CI/CD","q":"Quel réglage est requis pour construire une image Docker dans CodeBuild (démon Docker) ?","explain":"privilegedMode est obligatoire pour le Docker-in-Docker. Alternative moderne : buildah/kaniko, ou les images de build fournies par AWS.","choix":["Le mode privileged (privilegedMode: true) sur l'environnement du projet","Un runtime Docker installé manuellement","Un agent EC2 dédié","Aucun, c'est activé par défaut"],"bonne":0},
  {"id":"awsd-f-cd-configs-ec2","lvl":5,"dom":"CI/CD","q":"Quelles sont les 3 deployment configurations prédéfinies de CodeDeploy pour EC2 ?","explain":"Pour EC2/on-premises. Pour Lambda et ECS ce sont Canary/Linear/AllAtOnce — ne pas mélanger les deux familles, c'est un piège classique.","choix":["CodeDeployDefault.OneAtATime, HalfAtATime, AllAtOnce","Canary, Linear, AllAtOnce","Rolling, Immutable, BlueGreen","Fast, Safe, Staged"],"bonne":0},
  {"id":"awsd-f-cd-canary-lambda","lvl":6,"dom":"CI/CD","q":"Que signifie la configuration CodeDeployDefault.LambdaCanary10Percent5Minutes ?","explain":"Canary = deux paliers (X % puis tout). Linear = incréments réguliers (Linear10PercentEvery1Minute = +10 % chaque minute pendant 10 min).","choix":["10 % du trafic vers la nouvelle version pendant 5 minutes, puis 100 % d'un coup","10 % de plus toutes les 5 minutes jusqu'à 100 %","10 % du trafic pendant tout le déploiement","5 % pendant 10 minutes"],"bonne":0},
  {"id":"awsd-f-appspec-hooks-ec2","lvl":4,"dom":"CI/CD","q":"Quel est l'ordre des hooks appspec principaux lors d'un déploiement in-place sur EC2 ?","explain":"ApplicationStop utilise l'appspec de la révision PRÉCÉDENTE (souvent source d'échecs au 1er déploiement). ValidateService est le dernier : c'est là qu'on teste.","choix":["ApplicationStop → BeforeInstall → Install → AfterInstall → ApplicationStart → ValidateService","BeforeInstall → ApplicationStop → Install → ApplicationStart → ValidateService","Install → BeforeInstall → AfterInstall → ValidateService","ValidateService → Install → ApplicationStart"],"bonne":0},
  {"id":"awsd-f-appspec-hooks-lambda","lvl":5,"dom":"CI/CD","q":"Quels sont les 2 hooks disponibles pour un déploiement CodeDeploy sur Lambda ?","explain":"BeforeAllowTraffic = tests avant l'envoi du trafic ; AfterAllowTraffic = validation après. Chaque hook est lui-même une fonction Lambda de validation.","choix":["BeforeAllowTraffic et AfterAllowTraffic","BeforeInstall et AfterInstall","ApplicationStop et ApplicationStart","PreDeploy et PostDeploy"],"bonne":0},
  {"id":"awsd-f-cd-rollback","lvl":4,"dom":"CI/CD","q":"Comment CodeDeploy peut-il annuler automatiquement un déploiement ?","explain":"Rollback = redéploiement de la dernière révision saine connue. Associer une alarme (taux d'erreur 5xx, latence) rend la protection automatique.","choix":["Via les automatic rollback : sur échec du déploiement ou lorsqu'une alarme CloudWatch associée passe en ALARM","Uniquement manuellement","En redéployant la version précédente à la main","Par un script dans ValidateService"],"bonne":0},
  {"id":"awsd-f-cp-artifacts","lvl":5,"dom":"CI/CD","q":"Où CodePipeline stocke-t-il les artefacts échangés entre les étapes ?","explain":"Chaque action a des input/output artifacts qui transitent par S3. En cross-account, il faut une KMS key partagée et une bucket policy adaptée.","choix":["Dans un bucket S3 d'artefacts (l'artifact store), chiffré par KMS, dans la même région que le pipeline","Dans CodeCommit","Dans CodeArtifact","En mémoire sur l'agent"],"bonne":0},
  {"id":"awsd-f-cp-approval","lvl":6,"dom":"CI/CD","q":"Comment insérer une validation humaine dans un pipeline CodePipeline ?","explain":"L'action Manual approval bloque la transition jusqu'à décision (7 jours max), avec une URL de revue et une notification SNS.","choix":["Une action de type Manual approval, éventuellement reliée à un topic SNS pour notifier les approbateurs","Un script qui attend","Une Lambda bloquante","Ce n'est pas possible nativement"],"bonne":0},
  {"id":"awsd-f-cp-invoke","lvl":4,"dom":"CI/CD","q":"Comment exécuter une logique personnalisée (test maison, appel d'API tierce) dans une étape de pipeline ?","explain":"La Lambda DOIT rappeler PutJobSuccessResult ou PutJobFailureResult, sinon le pipeline reste bloqué jusqu'au timeout — piège classique.","choix":["Une action Invoke de type AWS Lambda, qui renvoie son résultat via PutJobSuccessResult / PutJobFailureResult","Une action CodeDeploy","Un hook appspec","Un événement EventBridge"],"bonne":0},
  {"id":"awsd-f-cp-trigger","lvl":5,"dom":"CI/CD","q":"Quelle est la méthode RECOMMANDÉE pour déclencher un pipeline dès un commit (plutôt que le polling) ?","explain":"Le polling introduit jusqu'à 1 min de latence et consomme des appels d'API. EventBridge déclenche instantanément — réponse attendue à l'examen.","choix":["Une règle EventBridge sur l'événement du dépôt (ou le webhook CodeConnections) — détection immédiate et sans appels d'API inutiles","Le polling périodique de CodePipeline","Un cron toutes les 5 minutes","Un déclenchement manuel"],"bonne":0},
  {"id":"awsd-f-cp-crossregion","lvl":6,"dom":"CI/CD","q":"Que faut-il pour déployer dans une région différente de celle du pipeline ?","explain":"CodePipeline réplique automatiquement les artefacts vers le bucket de la région cible, à condition qu'il soit déclaré dans la configuration du pipeline.","choix":["Une action cross-region, avec un bucket d'artefacts dans CHAQUE région concernée","Rien, c'est transparent","Un second pipeline obligatoirement","Un VPC peering"],"bonne":0},
  {"id":"awsd-f-cfn-ref","lvl":6,"dom":"Terraform","q":"Quelle est la différence entre !Ref et !GetAtt sur une ressource ?","explain":"!Ref sur un paramètre renvoie sa valeur ; sur une ressource, sa valeur « par défaut » documentée. !GetAtt MaRessource.Arn cible un attribut nommé.","choix":["!Ref renvoie la valeur par défaut de la ressource (souvent son nom ou son ID) ; !GetAtt renvoie un attribut précis (ARN, DNS, endpoint…)","!Ref ne marche que sur les paramètres","!GetAtt renvoie toujours l'ARN","Ce sont des synonymes"],"bonne":0},
  {"id":"awsd-f-cfn-importvalue","lvl":5,"dom":"Terraform","q":"Comment partager une valeur (ex : l'ID d'un VPC) entre deux stacks distinctes ?","explain":"Export/ImportValue crée une dépendance forte : impossible de supprimer ou modifier l'export tant qu'une stack l'importe. Alternative souple : les paramètres SSM.","choix":["Exporter la valeur via Outputs/Export dans la stack source, puis l'utiliser avec !ImportValue dans l'autre","Copier la valeur manuellement","Utiliser un nested stack obligatoirement","Via un paramètre SSM uniquement"],"bonne":0},
  {"id":"awsd-f-cfn-nested","lvl":6,"dom":"Terraform","q":"Quelle différence entre nested stacks et cross-stack references ?","explain":"Nested = découper un gros template en modules gérés ensemble. Cross-stack = stacks à cycles de vie indépendants (réseau vs application).","choix":["Les nested stacks sont des composants réutilisables imbriqués dans une stack parente ; les cross-stack references relient des stacks indépendantes via Export/Import","Les nested stacks sont dépréciées","Les cross-stack ne marchent qu'entre régions","Aucune différence"],"bonne":0},
  {"id":"awsd-f-cfn-creationpolicy","lvl":5,"dom":"Terraform","q":"Comment faire attendre CloudFormation qu'une application soit réellement prête sur une instance avant de continuer ?","explain":"Sans signal, CloudFormation considère l'EC2 « créée » dès son lancement, pas quand l'app tourne. CreationPolicy + cfn-signal règle exactement ce problème.","choix":["Une CreationPolicy sur la ressource + l'envoi du signal cfn-signal depuis l'instance","Un simple sleep dans le UserData","DependsOn suffit","Une Lambda de vérification obligatoire"],"bonne":0},
  {"id":"awsd-f-cfn-helpers","lvl":4,"dom":"Terraform","q":"À quoi servent respectivement cfn-init, cfn-signal et cfn-hup ?","explain":"Le trio des helper scripts. cfn-hup est la réponse au « appliquer un changement de configuration sans recréer l'instance ».","choix":["cfn-init applique la configuration de Metadata ; cfn-signal informe CloudFormation que l'instance est prête ; cfn-hup détecte les changements de metadata et réapplique","Ce sont trois alias de la même commande","cfn-hup crée la stack","cfn-signal supprime la stack"],"bonne":0},
  {"id":"awsd-f-cfn-customresource","lvl":5,"dom":"Terraform","q":"Comment gérer dans CloudFormation une ressource qu'il ne supporte pas nativement (ou un traitement externe) ?","explain":"La Lambda DOIT répondre à l'URL de callback, y compris en cas d'erreur — sinon la stack reste bloquée jusqu'au timeout (1 h). Piège récurrent.","choix":["Une custom resource adossée à une Lambda (ou un topic SNS), qui doit répondre SUCCESS/FAILED à l'URL pré-signée","Un script UserData","Une ressource AWS::Unknown","C'est impossible"],"bonne":0},
  {"id":"awsd-f-cfn-dynamic-ref","lvl":6,"dom":"Terraform","q":"Comment injecter un mot de passe stocké dans Secrets Manager dans un template CloudFormation sans l'écrire en clair ?","explain":"Les dynamic references : ssm, ssm-secure et secretsmanager. NoEcho masque l'affichage mais la valeur reste transmise en paramètre.","choix":["Une dynamic reference : '{{resolve:secretsmanager:MonSecret:SecretString:password}}'","Un paramètre avec NoEcho suffit","Une variable d'environnement","Un fichier chiffré en S3"],"bonne":0},
  {"id":"awsd-f-cfn-noecho","lvl":4,"dom":"Terraform","q":"Que fait exactement NoEcho: true sur un paramètre CloudFormation ?","explain":"NoEcho = masquage d'affichage seulement. Pour un vrai secret : dynamic reference vers Secrets Manager ou SSM SecureString.","choix":["Masque la valeur dans la console, les logs et les describe-stacks — mais ce n'est pas du chiffrement","Chiffre le paramètre avec KMS","Empêche sa modification","Le rend obligatoire"],"bonne":0},
  {"id":"awsd-f-cfn-stackset-modes","lvl":5,"dom":"Terraform","q":"Quelle différence entre StackSets self-managed et service-managed ?","explain":"L'auto-deployment sur les nouveaux comptes d'une OU n'existe qu'en service-managed — réponse fréquente aux scénarios de gouvernance multi-comptes.","choix":["Self-managed : tu crées toi-même les rôles IAM d'administration et d'exécution. Service-managed : intégré à AWS Organizations, avec déploiement automatique sur les nouveaux comptes","Service-managed est déprécié","Self-managed ne marche pas en multi-région","Aucune différence de permissions"],"bonne":0},
  {"id":"awsd-f-cfn-rollback-trigger","lvl":6,"dom":"Terraform","q":"Comment annuler automatiquement une mise à jour de stack si une alarme CloudWatch se déclenche pendant le déploiement ?","explain":"Les rollback triggers surveillent jusqu'à 5 alarmes pendant le déploiement et la période de monitoring qui suit, puis annulent en cas de déclenchement.","choix":["Configurer des rollback triggers (alarmes CloudWatch) avec une période de surveillance","Ce n'est pas possible","Uniquement via un script externe","Avec DeletionPolicy"],"bonne":0},
  {"id":"awsd-f-cfn-drift-limit","lvl":4,"dom":"Terraform","q":"Quelle est la limite importante de la détection de drift CloudFormation ?","explain":"Drift detection = photo à l'instant T. Pour détecter en continu et remédier automatiquement : AWS Config + règles + SSM Automation.","choix":["Elle est ponctuelle (à la demande) et ne corrige rien — pour une surveillance continue, il faut AWS Config","Elle est continue mais payante","Elle corrige automatiquement le drift","Elle ne marche que sur EC2"],"bonne":0},
  {"id":"awsd-f-beanstalk-policies","lvl":5,"dom":"AWS","q":"Quelle politique de déploiement Elastic Beanstalk garantit ZÉRO indisponibilité et un rollback rapide, en créant de nouvelles instances ?","explain":"Ordre du plus risqué au plus sûr : all at once < rolling < rolling with additional batch < immutable < blue/green (swap CNAME). Immutable double temporairement la capacité.","choix":["Immutable (nouvelles instances dans un ASG temporaire, bascule si tout est sain)","All at once","Rolling","Rolling with additional batch"],"bonne":0},
  {"id":"awsd-f-ssm-param-tiers","lvl":5,"dom":"AWS","q":"Quelle différence entre les tiers standard et advanced de Parameter Store ?","explain":"Les parameter policies (Expiration, ExpirationNotification, NoChangeNotification) n'existent qu'en tier advanced.","choix":["Standard : 10 000 paramètres, 4 Ko, gratuit. Advanced : 100 000 paramètres, 8 Ko, payant, avec politiques (expiration, notification)","Advanced est gratuit","Standard supporte la rotation","Aucune différence de taille"],"bonne":0},
  {"id":"awsd-f-ssm-patch","lvl":6,"dom":"AWS","q":"Quels composants Patch Manager définissent QUOI patcher et QUAND ?","explain":"Patch baseline + patch group (via le tag « Patch Group ») + maintenance window = le trio du patching automatisé et conforme.","choix":["Une patch baseline (règles d'approbation des correctifs) et une maintenance window (fenêtre d'exécution), ciblées par tags ou patch groups","Uniquement un cron","Un runbook Automation","Une règle Config"],"bonne":0},
  {"id":"awsd-f-ssm-state-manager","lvl":4,"dom":"AWS","q":"Quel composant de Systems Manager maintient les instances dans un état de configuration voulu, en réappliquant périodiquement une association ?","explain":"State Manager = configuration désirée appliquée à intervalle régulier (anti-drift). Run Command = exécution ponctuelle et impérative.","choix":["State Manager","Run Command","Session Manager","Inventory"],"bonne":0},
  {"id":"awsd-f-asg-healthcheck","lvl":5,"dom":"AWS","q":"Une instance passe les health checks EC2 mais l'application ne répond plus. Comment l'ASG peut-il la remplacer ?","explain":"Le health check EC2 ne vérifie que l'état de l'hyperviseur/instance. Le health check ELB teste réellement l'application — question quasi certaine.","choix":["Activer le health check de type ELB sur l'ASG, afin qu'il tienne compte de la santé applicative du target group","Réduire le cooldown","Activer les detailed metrics","Augmenter la capacité désirée"],"bonne":0},
  {"id":"awsd-f-asg-scaling-types","lvl":6,"dom":"AWS","q":"Quelle politique de scaling faut-il privilégier pour maintenir une métrique autour d'une valeur cible (ex : 60 % de CPU) ?","explain":"Target tracking = le plus simple et recommandé par défaut. Step scaling pour des réactions graduées, scheduled pour les pics prévisibles, predictive pour les motifs cycliques appris.","choix":["Target tracking scaling","Simple scaling","Step scaling","Scheduled scaling"],"bonne":0},
  {"id":"awsd-f-alb-bluegreen","lvl":5,"dom":"AWS","q":"Comment réaliser un blue/green avec un ALB ?","explain":"Le weighted target group permet même un canary progressif (95/5 puis 50/50…). C'est ce que CodeDeploy pilote pour ECS blue/green.","choix":["Deux target groups (bleu et vert) et une règle de listener qui bascule le trafic — éventuellement pondérée pour un canary","Deux ALB obligatoirement","Changer le security group","Redémarrer les instances"],"bonne":0},
  {"id":"awsd-f-route53-failover","lvl":6,"dom":"AWS","q":"Quelle politique de routage Route 53 bascule automatiquement vers une région de secours quand le health check de la région primaire échoue ?","explain":"Failover (primary/secondary) + health check = le DR actif/passif. Le weighted sert au canary, le latency à la performance multi-régions.","choix":["Failover routing","Weighted routing","Latency-based routing","Multivalue answer"],"bonne":0},
  {"id":"awsd-f-rds-multiaz","lvl":4,"dom":"AWS","q":"Quelle différence entre RDS Multi-AZ et une read replica ?","explain":"Multi-AZ = disponibilité ; read replica = performance (et peut servir de DR cross-région, avec promotion MANUELLE). Distinction testée systématiquement.","choix":["Multi-AZ = réplication synchrone pour la HAUTE DISPONIBILITÉ (bascule automatique, standby non lisible) ; read replica = réplication asynchrone pour la MONTÉE EN CHARGE en lecture","Ce sont deux noms du même mécanisme","Multi-AZ améliore les performances de lecture","La read replica bascule automatiquement"],"bonne":0},
  {"id":"awsd-f-sqs-visibility","lvl":6,"dom":"AWS","q":"Un même message SQS est traité plusieurs fois par des consommateurs différents. Quelle est la cause la plus probable ?","explain":"Visibility timeout (30 s par défaut, 12 h max) doit dépasser la durée de traitement — ou être prolongé par ChangeMessageVisibility.","choix":["Le visibility timeout est plus court que la durée de traitement : le message redevient visible avant d'être supprimé","La file est en mode FIFO","Le long polling est désactivé","La DLQ est mal configurée"],"bonne":0},
  {"id":"awsd-f-lambda-concurrency","lvl":5,"dom":"AWS","q":"Quelle différence entre reserved concurrency et provisioned concurrency ?","explain":"Reserved = gestion de quota (protéger les autres fonctions ou brider l'accès à une base). Provisioned = performance (latence), et c'est payant.","choix":["Reserved : réserve (et plafonne) un quota de concurrence pour la fonction. Provisioned : pré-initialise des environnements d'exécution pour éliminer les cold starts","Ce sont des synonymes","Provisioned est gratuit","Reserved supprime les cold starts"],"bonne":0},
  {"id":"awsd-f-cw-subscription","lvl":4,"dom":"AWS","q":"Quelles cibles peut alimenter un subscription filter CloudWatch Logs en temps réel ?","explain":"Subscription filter = flux temps réel des logs. Pour la centralisation multi-comptes, on route en général vers Firehose puis S3/OpenSearch.","choix":["Lambda, Kinesis Data Streams, Data Firehose et OpenSearch","Uniquement S3","Uniquement SNS","Uniquement une autre log group"],"bonne":0},
  {"id":"awsd-f-cw-insights","lvl":5,"dom":"AWS","q":"Quels sont les principaux mots-clés d'une requête CloudWatch Logs Insights ?","explain":"Ex : fields @timestamp, @message | filter @message like /ERROR/ | stats count() by bin(5m). (summarize/project, c'est du KQL Azure — piège si tu révises les deux.)","choix":["fields, filter, stats, sort, limit, parse","select, where, group by","match, aggregate, order","summarize, project, extend"],"bonne":0},
  {"id":"awsd-f-cw-alarm-missing","lvl":6,"dom":"AWS","q":"Quelles sont les options de traitement des données manquantes d'une alarme CloudWatch ?","explain":"Réglage crucial : une métrique custom qui ne remonte plus (application morte !) laisse l'alarme en INSUFFICIENT_DATA si on choisit « missing ».","choix":["notBreaching, breaching, ignore, missing","true, false, null","ok, alarm, insufficient","skip, fail, retry"],"bonne":0},
  {"id":"awsd-f-cw-agent","lvl":5,"dom":"AWS","q":"Comment collecter l'utilisation MÉMOIRE et l'espace DISQUE d'une instance EC2 ?","explain":"L'hyperviseur ne voit ni la RAM ni le système de fichiers de l'invité : seul un agent DANS l'instance peut les remonter. Question classique.","choix":["Installer et configurer le CloudWatch agent — ces métriques ne sont pas fournies par défaut","Elles sont disponibles nativement","Via CloudTrail","Via VPC Flow Logs"],"bonne":0},
  {"id":"awsd-f-cw-emf","lvl":6,"dom":"AWS","q":"Qu'est-ce que l'Embedded Metric Format (EMF) ?","explain":"EMF évite les appels API PutMetricData (coûteux et à limite de débit) : l'application écrit un log JSON, CloudWatch en tire les métriques.","choix":["Un format de log JSON structuré depuis lequel CloudWatch extrait automatiquement des métriques custom, sans appel PutMetricData","Un format d'export de dashboard","Un format d'archivage S3","Un protocole de l'agent"],"bonne":0},
  {"id":"awsd-f-cw-retention","lvl":4,"dom":"AWS","q":"Quelle est la rétention par défaut d'un log group CloudWatch Logs ?","explain":"Par défaut les logs ne sont jamais purgés et la facture grimpe. Définir une rétention (ou exporter vers S3 + Glacier) est une optimisation attendue.","choix":["Never expire (indéfinie) — il faut la configurer explicitement pour maîtriser les coûts","30 jours","7 jours","90 jours"],"bonne":0},
  {"id":"awsd-f-xray-sampling","lvl":5,"dom":"AWS","q":"Pourquoi X-Ray applique-t-il un échantillonnage (sampling) par défaut ?","explain":"Règle par défaut : 1 requête/seconde puis 5 % au-delà. Personnalisable par des sampling rules (ex : tracer 100 % d'un endpoint critique).","choix":["Pour limiter le coût et l'impact sur les performances tout en gardant une vision statistiquement représentative","Parce que le service est limité à 100 traces","Pour respecter le RGPD","Pour accélérer le réseau"],"bonne":0},
  {"id":"awsd-f-eb-pattern","lvl":4,"dom":"AWS","q":"Comment une règle EventBridge sélectionne-t-elle les événements qui l'intéressent ?","explain":"Le pattern est un sous-ensemble JSON de l'événement. Ex : {\"source\":[\"aws.ec2\"],\"detail-type\":[\"EC2 Instance State-change Notification\"]}.","choix":["Par un event pattern (filtre JSON sur source, detail-type, detail…) ou par une expression de planification","Par un script Lambda","Par une requête SQL","Par un tag"],"bonne":0},
  {"id":"awsd-f-eb-archive","lvl":5,"dom":"AWS","q":"Quelle fonctionnalité EventBridge permet de rejouer des événements passés (après correction d'un bug de traitement) ?","explain":"On archive les événements d'un bus (avec rétention), puis on les rejoue vers une ou plusieurs règles. Précieux en réponse à incident.","choix":["Archive & replay","Le DLQ","Les schemas","Les buses partagées"],"bonne":0},
  {"id":"awsd-f-eb-dlq","lvl":6,"dom":"AWS","q":"Que se passe-t-il si une cible EventBridge échoue de façon répétée ?","explain":"Sans DLQ configurée, les événements non délivrés sont PERDUS silencieusement. Configurer une DLQ est une bonne pratique attendue.","choix":["Après les tentatives (retry policy : âge maximal et nombre de tentatives), l'événement est envoyé en DLQ SQS si elle est configurée — sinon il est perdu","Il est rejoué indéfiniment","Il est stocké 30 jours automatiquement","La règle se désactive"],"bonne":0},
  {"id":"awsd-f-ssm-automation-remediation","lvl":4,"dom":"AWS","q":"Quel est le schéma standard d'une remédiation automatique sur AWS ?","explain":"C'est LE motif du domaine « réponse aux incidents » (14 %). AWS Config peut aussi invoquer directement une remédiation SSM Automation.","choix":["Détection (Config rule / GuardDuty / alarme) → EventBridge → SSM Automation runbook ou Lambda → correction + notification SNS","Un cron qui vérifie toutes les heures","Un ticket manuel","Un script sur une instance bastion"],"bonne":0},
  {"id":"awsd-f-config-remediation","lvl":5,"dom":"AWS","q":"Comment AWS Config peut-il corriger automatiquement une ressource non conforme ?","explain":"Ex : règle s3-bucket-public-read-prohibited + remédiation AWS-DisableS3BucketPublicReadWrite. La correction peut être automatique et réessayée.","choix":["Par une remediation action associée à la règle, qui exécute un runbook SSM Automation (avec option de remédiation automatique ou manuelle)","Par une Lambda obligatoirement","Config ne peut que détecter","Par une SCP"],"bonne":0},
  {"id":"awsd-f-health","lvl":6,"dom":"AWS","q":"Quel service informe des événements affectant TES ressources (maintenance planifiée, dégradation, retrait d'instance) ?","explain":"AWS Health est personnalisé à ton compte, contrairement au dashboard public. Ses événements EventBridge permettent d'automatiser la réaction.","choix":["AWS Health (Personal Health Dashboard), dont les événements sont routables via EventBridge","CloudWatch","Trusted Advisor","Service Health Dashboard public uniquement"],"bonne":0},
  {"id":"awsd-f-iam-eval","lvl":4,"dom":"Sécurité","q":"Dans l'évaluation des permissions IAM, quelle règle prime toujours ?","explain":"Ordre : Deny explicite > Allow explicite > Deny implicite (par défaut). Une SCP qui n'autorise pas une action bloque même un administrateur.","choix":["Un Deny explicite l'emporte sur tout Allow, où qu'il se trouve (identity policy, resource policy, SCP, boundary)","Le dernier Allow évalué","La policy la plus spécifique","La resource policy prime sur l'identity policy"],"bonne":0},
  {"id":"awsd-f-permission-boundary","lvl":5,"dom":"Sécurité","q":"À quoi sert une permission boundary IAM ?","explain":"Permissions effectives = intersection de la policy et de la boundary. C'est la réponse au scénario « laisser les devs créer des rôles sans qu'ils deviennent admin ».","choix":["Définir le plafond maximal de permissions d'un utilisateur ou rôle — utile pour déléguer la création de rôles sans risque d'escalade de privilèges","Accorder des permissions supplémentaires","Limiter les coûts","Restreindre les régions uniquement"],"bonne":0},
  {"id":"awsd-f-scp-vs-iam","lvl":6,"dom":"Sécurité","q":"Une SCP autorise-t-elle une action ?","explain":"SCP = garde-fou, jamais une source de droits. Elle s'applique à tous les principals du compte membre, y compris root (sauf compte de gestion).","choix":["Non — elle définit uniquement le plafond de ce qui PEUT être autorisé ; il faut toujours une policy IAM qui accorde l'action","Oui, elle remplace les policies IAM","Oui, pour l'utilisateur root uniquement","Oui, si elle est attachée à la racine"],"bonne":0},
  {"id":"awsd-f-s3-encryption","lvl":4,"dom":"AWS","q":"Quelle différence entre SSE-S3, SSE-KMS et SSE-C ?","explain":"SSE-KMS est attendu dès qu'on parle de contrôle d'accès aux clés et d'audit. Attention à ses quotas d'appels API sur les gros volumes.","choix":["SSE-S3 : clés gérées par S3. SSE-KMS : clés dans KMS (politique et traçabilité CloudTrail). SSE-C : clés fournies par le client à chaque requête","Trois noms du même mécanisme","SSE-C est le plus simple","SSE-KMS ne trace rien"],"bonne":0},
  {"id":"awsd-f-cloudtrail-data-events","lvl":4,"dom":"AWS","q":"Pourquoi les accès en lecture aux objets d'un bucket S3 n'apparaissent-ils pas dans CloudTrail par défaut ?","explain":"Management events (gratuits, activés) vs data events S3/Lambda/DynamoDB (payants, à activer explicitement). Question fréquente en investigation.","choix":["Ce sont des data events, désactivés par défaut (volume et coût) — seuls les management events sont tracés d'office","CloudTrail ne trace jamais S3","Il faut activer GuardDuty","Il faut activer le versioning"],"bonne":0},
  {"id":"awsd-f-org-trail","lvl":5,"dom":"AWS","q":"Comment collecter les logs CloudTrail de TOUS les comptes d'une organisation dans un bucket central, sans configuration par compte ?","explain":"L'organization trail est LA réponse aux scénarios d'audit centralisé multi-comptes, avec application automatique aux comptes créés ensuite.","choix":["Créer un organization trail depuis le compte de gestion : il s'applique automatiquement à tous les comptes, y compris les nouveaux","Un trail par compte, configuré manuellement","Une réplication S3","Un script quotidien"],"bonne":0},
  {"id":"awsd-f-secrets-rotation","lvl":6,"dom":"Sécurité","q":"Comment fonctionne la rotation automatique d'un secret RDS dans Secrets Manager ?","explain":"La stratégie alternating users (deux utilisateurs alternés) évite toute interruption pendant la rotation. Les applications lisent toujours AWSCURRENT.","choix":["Une Lambda de rotation applique les 4 étapes createSecret, setSecret, testSecret, finishSecret, avec les étiquettes AWSCURRENT et AWSPENDING","Le mot de passe change à chaque lecture","La base est redémarrée","Il faut un script cron"],"bonne":0},
  {"id":"awsd-f-ecr-scan","lvl":4,"dom":"Docker","q":"Quelle différence entre le scan basique et le scan amélioré (enhanced) d'ECR ?","explain":"Enhanced scanning re-scanne les images déjà publiées quand une nouvelle CVE paraît — indispensable, une image « propre » hier ne l'est plus demain.","choix":["Basic : scan à la poussée, CVE du système d'exploitation. Enhanced : via Amazon Inspector, scan continu, OS + dépendances applicatives","Enhanced est gratuit","Basic est continu","Aucune différence"],"bonne":0},
  {"id":"awsd-f-guardduty-org","lvl":5,"dom":"Sécurité","q":"Comment activer GuardDuty sur tous les comptes d'une organisation, y compris les futurs ?","explain":"Le pattern « delegated administrator » vaut pour GuardDuty, Security Hub, Config, Inspector et Macie — motif récurrent en gouvernance multi-comptes.","choix":["Désigner un compte administrateur délégué GuardDuty dans Organizations et activer l'auto-enable pour les nouveaux comptes","Se connecter à chaque compte","Utiliser une SCP","Via CloudFormation uniquement"],"bonne":0},
  {"id":"awsd-f-sechub-custom-action","lvl":6,"dom":"Sécurité","q":"Comment déclencher une remédiation depuis un finding Security Hub ?","explain":"Custom action (manuelle, depuis la console) ou règle EventBridge sur les findings (automatique). Security Hub détecte et centralise, la remédiation est externe.","choix":["Une custom action Security Hub qui émet un événement EventBridge, routé vers une Lambda ou un runbook SSM Automation","Security Hub corrige directement","Via une SCP","Via CloudTrail"],"bonne":0},
  {"id":"awsd-f-vpc-flow","lvl":4,"dom":"Réseau","q":"Que contiennent les VPC Flow Logs ?","explain":"Métadonnées seulement. Pour le contenu, il faut VPC Traffic Mirroring. Les Flow Logs servent à diagnostiquer les blocages de security group/NACL.","choix":["Les métadonnées du trafic IP (source, destination, ports, protocole, octets, ACCEPT/REJECT) — pas le contenu des paquets","Le contenu complet des paquets","Uniquement le trafic refusé","Les requêtes DNS uniquement"],"bonne":0},
  {"id":"awsd-f-abac","lvl":5,"dom":"Sécurité","q":"Qu'est-ce que l'ABAC (attribute-based access control) sur AWS ?","explain":"ABAC évite de multiplier les policies : une seule règle couvre tous les projets, à condition que la stratégie de tagging soit imposée (tag policies).","choix":["Autoriser l'accès en comparant les tags du principal et ceux de la ressource (ex : aws:PrincipalTag/Projet = aws:ResourceTag/Projet)","Un contrôle basé sur les groupes IAM","Un chiffrement par attribut","Une politique de facturation"],"bonne":0},
  {"id":"awsd-s-cd-alarm","lvl":8,"dom":"CI/CD","q":"Après un déploiement, le taux d'erreurs 5xx grimpe. L'équipe veut un retour arrière AUTOMATIQUE, sans intervention humaine. Quelle configuration ?","explain":"CodeDeploy surveille les alarmes pendant le déploiement et déclenche le rollback. Combiné à un canary, l'impact reste limité à quelques pourcents du trafic.","choix":["Associer une alarme CloudWatch sur le taux 5xx au deployment group CodeDeploy, avec rollback automatique activé","Un runbook manuel documenté","Une astreinte 24/7","Un déploiement plus lent"],"bonne":0},
  {"id":"awsd-s-lambda-canary","lvl":9,"dom":"CI/CD","q":"Une fonction Lambda critique doit être livrée en exposant d'abord 10 % du trafic pendant 10 minutes, avec rollback automatique sur erreur. Quelle solution avec le MOINS de code maison ?","explain":"SAM expose DeploymentPreference (Type, Alarms, Hooks) qui génère toute la mécanique CodeDeploy — zéro code d'orchestration à écrire.","choix":["CodeDeploy avec une deployment config Canary et des alarmes CloudWatch, en s'appuyant sur les alias pondérés (SAM/CDK le configurent nativement)","Deux fonctions et un routage maison dans API Gateway","Un déploiement all-at-once et une surveillance manuelle","Des feature flags dans le code"],"bonne":0},
  {"id":"awsd-s-ecs-bluegreen","lvl":7,"dom":"CI/CD","q":"Un service ECS doit être déployé en blue/green avec des tests automatisés sur la nouvelle version AVANT que les utilisateurs y accèdent. Comment ?","explain":"Le listener de test expose la version verte sur un port séparé : on la valide réellement en conditions de production avant la bascule du trafic client.","choix":["CodeDeploy blue/green pour ECS avec un listener de test sur l'ALB, et une Lambda de validation branchée sur le hook AfterAllowTestTraffic","Un rolling update ECS classique","Deux clusters ECS et un basculement DNS manuel","Des tests en préproduction uniquement"],"bonne":0},
  {"id":"awsd-s-ecs-rolling","lvl":8,"dom":"CI/CD","q":"Un service ECS en rolling update doit conserver 100 % de capacité pendant le déploiement. Quels paramètres ?","explain":"min 100 / max 200 = surcapacité temporaire, aucune dégradation. min 50 / max 100 économise des ressources mais dégrade la capacité pendant le déploiement.","choix":["minimumHealthyPercent à 100 et maximumPercent à 200 : ECS démarre les nouvelles tâches avant d'arrêter les anciennes","minimumHealthyPercent 0 et maximumPercent 100","Les deux à 100","Les deux à 50"],"bonne":0},
  {"id":"awsd-s-ecs-circuit","lvl":9,"dom":"CI/CD","q":"Un déploiement ECS échoue en boucle : les nouvelles tâches crashent et ECS les relance indéfiniment. Quelle fonctionnalité arrête ce cycle et revient à la version stable ?","explain":"Le circuit breaker détecte l'échec répété du déploiement, l'arrête et (avec rollback: true) restaure la dernière révision saine du task definition.","choix":["Le deployment circuit breaker avec rollback activé","Réduire le desired count","Augmenter le health check grace period","Passer sur Fargate"],"bonne":0},
  {"id":"awsd-s-pipeline-crossaccount","lvl":7,"dom":"CI/CD","q":"Un pipeline dans le compte « outils » doit déployer dans les comptes dev, staging et prod. Quelle architecture ?","explain":"Motif canonique : le pipeline assume un rôle de déploiement dans le compte cible. La KMS key doit autoriser les comptes cibles à déchiffrer les artefacts.","choix":["Des rôles IAM cross-account assumés par le pipeline dans chaque compte cible, avec une clé KMS partagée pour le bucket d'artefacts","Un pipeline dupliqué dans chaque compte","Des access keys stockées en variables","Un VPC peering entre comptes"],"bonne":0},
  {"id":"awsd-s-artifacts-promote","lvl":8,"dom":"CI/CD","q":"Pour garantir que le binaire testé en staging est EXACTEMENT celui déployé en production, que fais-tu ?","explain":"Build once, deploy many. Recompiler introduit un risque (dépendance amont modifiée, version de toolchain différente) même à commit identique.","choix":["Construire l'artefact une seule fois en début de pipeline et le promouvoir d'un environnement à l'autre, en injectant la configuration au déploiement","Recompiler à chaque environnement depuis le même commit","Comparer les checksums après coup","Rebuilder uniquement pour la prod"],"bonne":0},
  {"id":"awsd-s-build-slow","lvl":9,"dom":"AWS","q":"Un build CodeBuild dure 25 min, dont 15 de téléchargement de dépendances identiques à chaque exécution. Quelle optimisation en priorité ?","explain":"On traite la cause : le téléchargement répété. Une image custom dans ECR contenant déjà les outils supprime aussi le temps d'installation.","choix":["Activer le cache (S3 ou local) sur les répertoires de dépendances, et envisager une image de build custom pré-équipée","Passer sur une instance de build plus grosse uniquement","Réduire le nombre de tests","Builder moins souvent"],"bonne":0},
  {"id":"awsd-s-build-parallel","lvl":7,"dom":"AWS","q":"Une suite de tests séquentielle de 40 minutes bloque le pipeline. Quelle approche CodeBuild ?","explain":"CodePipeline exécute en parallèle les actions d'une même stage ayant le même runOrder ; CodeBuild propose les batch builds pour le fan-out natif.","choix":["Un batch build en mode build-fanout (ou plusieurs actions parallèles dans la même stage) pour répartir les tests","Supprimer les tests lents","Augmenter le timeout","Exécuter les tests après le déploiement"],"bonne":0},
  {"id":"awsd-s-cfn-nested-vs-module","lvl":8,"dom":"Terraform","q":"Un template CloudFormation de 3000 lignes devient ingérable et plusieurs équipes doivent réutiliser les mêmes briques. Que recommandes-tu ?","explain":"Nested stacks = modularité et réutilisation, avec une limite de taille de template contournée. Le CDK apporte en plus les boucles et le typage.","choix":["Découper en nested stacks réutilisables (ou en constructs CDK), versionnées dans S3 et référencées par les templates parents","Un seul template par compte","Copier-coller les sections utiles","Passer en console manuelle"],"bonne":0},
  {"id":"awsd-s-cfn-stack-fail","lvl":9,"dom":"Terraform","q":"Une mise à jour de stack échoue et reste bloquée en UPDATE_ROLLBACK_FAILED. Que faire ?","explain":"ContinueUpdateRollback avec ResourcesToSkip débloque la stack sans tout détruire. Supprimer une stack de production serait catastrophique.","choix":["Utiliser continue-update-rollback en ignorant (skip) les ressources problématiques, corriger manuellement, puis relancer la mise à jour","Supprimer la stack et tout recréer","Attendre le timeout","Modifier le template et redéployer directement"],"bonne":0},
  {"id":"awsd-s-cfn-manual-change","lvl":7,"dom":"Terraform","q":"Des ingénieurs modifient à la main des ressources gérées par CloudFormation, provoquant des échecs de déploiement. Quelle réponse durable ?","explain":"Le contrôle technique prime : si personne ne PEUT modifier hors pipeline, le drift disparaît. Config + EventBridge fournissent la surveillance continue.","choix":["Restreindre les permissions IAM aux seuls déploiements via CloudFormation (SCP/policies), détecter le drift en continu avec AWS Config, et alerter","Documenter l'interdiction","Détecter le drift une fois par trimestre","Recréer les stacks régulièrement"],"bonne":0},
  {"id":"awsd-s-cfn-secret","lvl":8,"dom":"Terraform","q":"Un template doit créer une base RDS dont le mot de passe ne doit apparaître ni dans le template, ni dans les paramètres, ni dans les logs.","explain":"Le secret est généré côté AWS et n'existe jamais en clair côté pipeline. SecretTargetAttachment relie ensuite le secret à l'instance RDS pour la rotation.","choix":["Générer le secret dans Secrets Manager (AWS::SecretsManager::Secret avec GenerateSecretString) et le référencer par dynamic reference","Un paramètre avec NoEcho","Un paramètre chiffré en base64","Passer le mot de passe en variable d'environnement du pipeline"],"bonne":0},
  {"id":"awsd-s-multi-account-baseline","lvl":9,"dom":"AWS","q":"Chaque nouveau compte AWS de l'organisation doit recevoir automatiquement une base commune (rôles, CloudTrail, Config, alarmes). Quelle solution avec le MOINS d'effort opérationnel ?","explain":"L'auto-deployment applique la baseline dès la création du compte, sans intervention. Control Tower industrialise ce motif avec ses guardrails.","choix":["Des StackSets service-managed avec auto-deployment sur l'OU concernée (idéalement via AWS Control Tower)","Un script à lancer à chaque création de compte","Un template partagé que chaque équipe déploie","Une AMI commune"],"bonne":0},
  {"id":"awsd-s-config-vs-cfn","lvl":7,"dom":"Sécurité","q":"L'entreprise veut détecter EN CONTINU tout bucket S3 rendu public et le corriger automatiquement. Quelle combinaison ?","explain":"Config évalue à chaque changement de configuration et peut remédier. Le drift CloudFormation est ponctuel et ne corrige rien.","choix":["Une règle AWS Config (s3-bucket-public-read-prohibited) avec remédiation automatique par SSM Automation","La détection de drift CloudFormation","Un scan quotidien par script","Trusted Advisor"],"bonne":0},
  {"id":"awsd-s-ami-pipeline","lvl":8,"dom":"Docker","q":"Les AMI de l'entreprise doivent être reconstruites chaque mois avec les derniers correctifs, testées, puis partagées avec tous les comptes. Quelle solution managée ?","explain":"Image Builder gère build + test + distribution + versionnement, sans infrastructure à maintenir. C'est le pilier de l'infrastructure immuable sur AWS.","choix":["EC2 Image Builder : pipeline d'image avec composants de build et de test, planification et distribution multi-comptes/régions","Un script Packer sur une instance dédiée","Créer les AMI à la main","Patcher les instances en production"],"bonne":0},
  {"id":"awsd-s-golden-vs-config","lvl":9,"dom":"AWS","q":"Un déploiement met 12 minutes car chaque instance installe ses dépendances au démarrage (UserData). Comment réduire ce délai ?","explain":"Déplacer le travail du démarrage vers la construction de l'image : le scale-out devient rapide et reproductible. Complémentaire : les warm pools.","choix":["Pré-construire une AMI dorée contenant les dépendances (Image Builder), pour ne laisser au démarrage que la configuration spécifique","Augmenter la taille des instances","Ajouter un lifecycle hook plus long","Désactiver les health checks"],"bonne":0},
  {"id":"awsd-s-asg-longboot","lvl":7,"dom":"AWS","q":"Le scale-out est trop lent : les instances mettent 6 minutes à devenir opérationnelles et le trafic monte plus vite. Quelles options ?","explain":"On attaque le délai de mise en service (warm pool + AMI) et l'anticipation (predictive scaling apprend les motifs récurrents et provisionne à l'avance).","choix":["Warm pool d'instances pré-initialisées, AMI dorée, et predictive scaling si la charge est cyclique","Baisser le seuil de CPU uniquement","Supprimer le health check grace period","Passer en scaling manuel"],"bonne":0},
  {"id":"awsd-s-stateful","lvl":8,"dom":"AWS","q":"Les utilisateurs sont déconnectés à chaque déploiement car les sessions sont stockées en mémoire sur les instances. Quelle correction architecturale ?","explain":"Les sticky sessions ne font que masquer le problème : l'instance qui disparaît emporte les sessions. Stateless = prérequis de l'élasticité et des déploiements sereins.","choix":["Externaliser les sessions (ElastiCache Redis ou DynamoDB) pour rendre les instances stateless","Activer les sticky sessions","Allonger le deregistration delay","Déployer la nuit"],"bonne":0},
  {"id":"awsd-s-dr-choice","lvl":9,"dom":"SRE","q":"RTO de 10 minutes et RPO de 1 minute, avec un budget contraint. Quelle stratégie de DR ?","explain":"Backup & restore (heures) et pilot light (dizaines de minutes) sont trop lents ; le multi-site actif/actif tiendrait le RTO mais coûte le double. Warm standby est le compromis.","choix":["Warm standby : une version réduite mais ACTIVE dans la région secondaire, mise à l'échelle lors du basculement, avec réplication continue des données","Backup & restore","Pilot light","Multi-site actif/actif"],"bonne":0},
  {"id":"awsd-s-dr-test","lvl":7,"dom":"SRE","q":"Comment garantir que le plan de reprise fonctionnera vraiment le jour J ?","explain":"Un plan de DR jamais testé est une hypothèse. AWS Resilience Hub et Fault Injection Service permettent d'éprouver la résilience méthodiquement.","choix":["Tester régulièrement le basculement (game days, exercices planifiés) et automatiser la procédure en IaC pour qu'elle soit reproductible","Documenter la procédure en détail","Faire confiance à la réplication","Tester une fois à la mise en place"],"bonne":0},
  {"id":"awsd-s-multiaz-outage","lvl":8,"dom":"AWS","q":"Une application doit survivre à la panne complète d'une zone de disponibilité, sans intervention. Que vérifies-tu ?","explain":"Piège du dimensionnement : si 2 AZ tournent à 100 %, la perte d'une AZ sature l'autre. Il faut prévoir la marge (N+1).","choix":["ASG et subnets répartis sur au moins 2 AZ, ELB multi-AZ, RDS en Multi-AZ, et une capacité suffisante pour absorber la perte d'une AZ","Un snapshot quotidien","Une seconde région active","Des instances plus grosses"],"bonne":0},
  {"id":"awsd-s-throttle","lvl":9,"dom":"AWS","q":"Un pic de trafic sature la base de données et fait tomber l'application. Quelle correction architecturale ?","explain":"Le buffering par file transforme un pic en flux régulier. Complément : Auto Scaling piloté par la profondeur de la file (ApproximateNumberOfMessagesVisible).","choix":["Découpler avec une file SQS entre le front et le traitement, pour lisser les pics et absorber la charge","Augmenter la taille de la base indéfiniment","Limiter le nombre d'utilisateurs","Désactiver les health checks"],"bonne":0},
  {"id":"awsd-s-alarm-noise","lvl":7,"dom":"Observabilité","q":"L'équipe reçoit 200 alertes par jour et ignore désormais les notifications. Que fais-tu ?","explain":"La fatigue d'alerte fait rater les vrais incidents. Une alerte qui réveille quelqu'un doit être urgente, actionnable et liée à l'impact client.","choix":["Alarmer sur les symptômes visibles par l'utilisateur (SLO), supprimer les alertes non actionnables, et regrouper les corrélées en alarmes composites","Augmenter tous les seuils","Créer un canal dédié","Ajouter des destinataires"],"bonne":0},
  {"id":"awsd-s-log-central","lvl":8,"dom":"AWS","q":"Les logs de 40 comptes AWS doivent être centralisés dans un compte d'audit, en quasi temps réel, pour analyse et conservation longue durée.","explain":"Firehose gère le buffering, la compression et la livraison. S3 + lifecycle assure le stockage long terme économique, OpenSearch la recherche opérationnelle.","choix":["Subscription filters CloudWatch Logs → Kinesis Data Firehose cross-account → S3 (avec lifecycle vers Glacier) et OpenSearch pour la recherche","Copier les fichiers chaque nuit par script","Donner un accès console à chaque compte","Un seul log group partagé"],"bonne":0},
  {"id":"awsd-s-log-cost","lvl":9,"dom":"AWS","q":"La facture CloudWatch Logs explose. Quelles actions concrètes ?","explain":"Par défaut la rétention est infinie. L'ingestion et le stockage sont facturés : la rétention par groupe est le premier levier, souvent oublié.","choix":["Définir des rétentions adaptées par log group, exporter l'historique vers S3/Glacier, réduire la verbosité, et utiliser les metric filters plutôt que de tout indexer","Supprimer tous les logs","Désactiver CloudWatch","Réduire le nombre d'instances"],"bonne":0},
  {"id":"awsd-s-app-slow","lvl":7,"dom":"Observabilité","q":"Une requête traverse 8 microservices et devient lente, sans qu'aucun service ne semble fautif isolément. Quel outil ?","explain":"Sans corrélation de bout en bout, on ne fait que deviner. X-Ray relie les segments par trace ID et révèle où le temps est réellement consommé.","choix":["X-Ray : traçage distribué, service map et analyse des segments pour localiser le maillon lent","Les métriques CPU de chaque service","Les VPC Flow Logs","CloudTrail"],"bonne":0},
  {"id":"awsd-s-custom-metric","lvl":8,"dom":"Observabilité","q":"Il faut alarmer dès que le mot « OutOfMemory » apparaît dans les logs applicatifs. Comment ?","explain":"Metric filter + alarme = le motif standard pour alarmer sur un CONTENU de log. Penser au traitement des données manquantes (treat missing data).","choix":["Un metric filter sur le log group qui incrémente une métrique custom, puis une alarme CloudWatch sur cette métrique","Une requête Logs Insights planifiée","Un script qui lit les logs","Une règle AWS Config"],"bonne":0},
  {"id":"awsd-s-dashboards","lvl":9,"dom":"Observabilité","q":"La direction veut suivre les 4 métriques DORA de l'organisation. Où trouver les données brutes sur AWS ?","explain":"AWS ne calcule pas DORA nativement : on capte les événements de déploiement (succès/échec, horodatage) et on dérive fréquence, lead time, CFR et MTTR.","choix":["Les événements CodePipeline/CodeDeploy via EventBridge stockés et agrégés (Lambda → DynamoDB/S3), restitués dans un dashboard CloudWatch ou QuickSight","Dans Trusted Advisor","Dans Cost Explorer","Dans AWS Config"],"bonne":0},
  {"id":"awsd-s-incident-auto","lvl":7,"dom":"AWS","q":"Dès qu'une instance EC2 passe en état d'alarme de status check, elle doit être remplacée automatiquement et l'équipe notifiée.","explain":"Dans un ASG, marquer l'instance unhealthy suffit : l'ASG la remplace. Hors ASG, l'action de récupération de l'alarme CloudWatch fait le travail.","choix":["Une règle EventBridge (ou alarme CloudWatch avec action EC2 recover/terminate) déclenchant le remplacement par l'ASG, plus une notification SNS","Une astreinte humaine","Un script cron de vérification","Un redémarrage quotidien préventif"],"bonne":0},
  {"id":"awsd-s-guardduty-response","lvl":8,"dom":"AWS","q":"GuardDuty détecte une instance EC2 communiquant avec une IP de minage de cryptomonnaie. Quelle réponse automatisée ?","explain":"Isoler AVANT de détruire : le snapshot préserve les preuves forensiques. Terminer l'instance efface les traces nécessaires à l'analyse.","choix":["EventBridge sur le finding → Lambda/SSM Automation : isoler l'instance (security group de quarantaine), prendre un snapshot pour investigation, notifier l'équipe","Terminer immédiatement l'instance","Ignorer si l'application fonctionne","Attendre la revue hebdomadaire"],"bonne":0},
  {"id":"awsd-s-runbook-auto","lvl":9,"dom":"AWS","q":"Un incident récurrent (disque plein sur un serveur applicatif) mobilise l'astreinte chaque semaine. Quelle approche ?","explain":"Réduire le MTTR par l'automatisation, mais SANS masquer la cause : le toil récurrent doit aussi déclencher une correction de fond (rotation des logs).","choix":["Automatiser la remédiation : alarme CloudWatch (métrique disque via l'agent) → SSM Automation runbook qui purge les logs et notifie, puis traiter la cause racine","Augmenter la taille des disques et attendre","Documenter la procédure manuelle","Supprimer l'alarme"],"bonne":0},
  {"id":"awsd-s-postmortem","lvl":7,"dom":"AWS","q":"Comment garantir qu'un incident majeur améliore réellement le système ?","explain":"Blâmer pousse à cacher l'information. Et une analyse dont les actions ne sont pas suivies ne change rien : c'est le suivi qui ferme la boucle.","choix":["Un postmortem sans blâme, dont les actions correctives deviennent des tickets priorisés et suivis jusqu'à leur déploiement","Un rapport archivé","Une sanction pour l'auteur de l'erreur","Une réunion de crise"],"bonne":0},
  {"id":"awsd-s-mttr-reduce","lvl":8,"dom":"AWS","q":"Quel est le premier réflexe lors d'un incident de production majeur ?","explain":"Atténuer d'abord, comprendre ensuite. Chercher la cause pendant que les utilisateurs sont impactés allonge inutilement le MTTR.","choix":["Rétablir le service au plus vite (rollback, bascule, feature flag), puis diagnostiquer la cause une fois les utilisateurs servis","Trouver la cause racine avant toute action","Identifier le responsable","Attendre la reproduction du problème"],"bonne":0},
  {"id":"awsd-s-least-priv","lvl":9,"dom":"Sécurité","q":"Comment resserrer les permissions d'un rôle de déploiement trop permissif, sans casser le pipeline ?","explain":"IAM Access Analyzer génère une policy fondée sur les actions réellement utilisées — la méthode outillée pour atteindre le moindre privilège sans deviner.","choix":["Analyser l'usage réel avec IAM Access Analyzer (génération de policy à partir de l'historique CloudTrail), puis appliquer la policy resserrée et surveiller","Retirer toutes les permissions et attendre les erreurs","Garder AdministratorAccess","Créer un utilisateur IAM dédié"],"bonne":0},
  {"id":"awsd-s-keys-rotation","lvl":7,"dom":"Sécurité","q":"Un audit révèle des access keys IAM vieilles de 2 ans utilisées par des scripts sur EC2. Quelle correction durable ?","explain":"Supprimer le secret plutôt que le gérer. Sur EC2 → instance profile ; en CI externe → OIDC ; entre services AWS → rôles assumés.","choix":["Remplacer les access keys par des rôles IAM attachés aux instances (instance profile) : credentials temporaires et rotation automatique","Faire tourner les clés tous les 90 jours","Chiffrer les clés dans un fichier","Restreindre les clés par IP"],"bonne":0},
  {"id":"awsd-s-public-s3","lvl":8,"dom":"Sécurité","q":"Comment empêcher DÉFINITIVEMENT toute exposition publique d'un bucket S3 dans l'organisation ?","explain":"Prévention (Block Public Access + SCP) plutôt que détection/correction. Config reste utile en filet de sécurité et pour la preuve d'audit.","choix":["Activer S3 Block Public Access au niveau du compte (via StackSets sur tous les comptes) et interdire sa désactivation par une SCP","Une règle Config avec remédiation seule","Une revue mensuelle des buckets","Chiffrer les objets"],"bonne":0},
  {"id":"awsd-s-compliance-evidence","lvl":9,"dom":"Sécurité","q":"Un auditeur exige la preuve que toutes les ressources sont restées conformes pendant 12 mois. Que fournis-tu ?","explain":"Config conserve l'historique de configuration et de conformité dans le temps ; CloudTrail prouve qui a agi. S3 Object Lock rend les preuves inaltérables.","choix":["L'historique de conformité d'AWS Config (avec agrégateur multi-comptes) et les logs CloudTrail avec validation d'intégrité, conservés en S3 verrouillé","Des captures d'écran de la console","Les templates CloudFormation","Un rapport Trusted Advisor"],"bonne":0},
  {"id":"awsd-s-secret-leak","lvl":7,"dom":"Sécurité","q":"Une access key AWS a été committée dans un dépôt Git public. Quel est l'ORDRE des actions ?","explain":"La clé est compromise dès la publication : la révoquer est prioritaire. Nettoyer l'historique d'abord laisserait la clé active pendant l'opération.","choix":["Désactiver/supprimer la clé immédiatement, analyser CloudTrail pour détecter un usage frauduleux, puis nettoyer l'historique Git et mettre en place un scan de secrets","Nettoyer l'historique Git d'abord","Rendre le dépôt privé et attendre","Changer le mot de passe du compte"],"bonne":0},
  {"id":"awsd-s-pipeline-scan","lvl":8,"dom":"AWS","q":"Comment empêcher qu'une image de conteneur contenant une vulnérabilité critique atteigne la production ?","explain":"Gate bloquante dans le pipeline (shift left) + scan continu du registre, car une nouvelle CVE peut concerner une image déjà publiée.","choix":["Scanner l'image dans le pipeline (ECR enhanced scanning / Inspector) et faire ÉCHOUER l'étape si une CVE critique est détectée, plus un scan continu du registre","Scanner après le déploiement","Un audit trimestriel","Faire confiance à l'image de base officielle"],"bonne":0},
  {"id":"awsd-s-iac-scan","lvl":9,"dom":"AWS","q":"Comment détecter une mauvaise configuration de sécurité DANS le code IaC, avant tout déploiement ?","explain":"CloudFormation Guard (policy-as-code) exprime des règles vérifiées sur le template. Config détecte APRÈS coup, ce qui est déjà trop tard.","choix":["Un scan statique de l'IaC dans le pipeline (cfn-lint, cfn_nag, CloudFormation Guard, Checkov) qui bloque en cas de violation de règle","AWS Config après déploiement","Une revue de code humaine seule","Trusted Advisor"],"bonne":0},
  {"id":"awsd-s-approval-sod","lvl":7,"dom":"Sécurité","q":"La conformité exige que le déploiement en production soit validé par une personne différente de l'auteur du code, avec traçabilité.","explain":"Séparation des tâches par IAM + piste d'audit CloudTrail = la preuve exigée par l'auditeur, bien plus solide qu'un processus hors outil.","choix":["Une action Manual approval dans CodePipeline, restreinte par IAM à un groupe distinct des développeurs, tracée dans CloudTrail","Une revue de code par un pair suffit","Un e-mail de validation","Une notification Slack"],"bonne":0},
  {"id":"awsd-s-tag-enforce","lvl":8,"dom":"Sécurité","q":"Comment garantir que toutes les ressources portent un tag « CostCenter » ?","explain":"Prévention (SCP avec condition sur aws:RequestTag) pour le nouveau + détection/remédiation (Config) pour l'historique. Les deux sont complémentaires.","choix":["Combiner tag policies (Organizations), une SCP refusant la création sans le tag, et une règle Config required-tags pour l'existant","Documenter la convention","Un rapport mensuel","Un script de correction hebdomadaire"],"bonne":0},
  {"id":"awsd-s-crossaccount-read","lvl":9,"dom":"Sécurité","q":"Une équipe d'un compte A doit lire un bucket S3 du compte B. Quelle configuration ?","explain":"En cross-account, l'accès exige un Allow des DEUX côtés (identity policy + resource policy). Vrai aussi pour KMS : la key policy doit autoriser le compte.","choix":["Une bucket policy dans B autorisant le principal de A, et une policy IAM dans A autorisant l'action — les deux côtés sont nécessaires","Uniquement une policy IAM dans A","Uniquement une bucket policy dans B","Rendre le bucket public"],"bonne":0},
  {"id":"awsd-s-least-overhead","lvl":7,"dom":"AWS","q":"Une question DOP précise « with the LEAST operational overhead ». Quel type de réponse privilégier ?","explain":"Réflexe d'examen : « least operational overhead » → managé et natif. « Most cost-effective » → coût. Lire ce qualificatif AVANT d'analyser les options fait gagner du temps.","choix":["La solution managée qui exige le moins de code maison et de maintenance (service AWS natif plutôt que script ou serveur à administrer)","La solution la moins chère","La plus rapide à exécuter","Celle qui utilise le plus de services"],"bonne":0},
