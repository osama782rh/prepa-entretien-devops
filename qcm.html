<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QCM DevOps — Entretien BNP</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg">
<meta name="theme-color" content="#0d111a">
<script>
if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost")){
  window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
<style>
  :root{
    --bg:#0d111a; --surface:#151b27; --surface2:#1d2432; --ink:#dde4f0; --muted:#8d9ab2;
    --accent:#3ecf8e; --accent-soft:#0f2a1e; --ok:#3ecf8e; --ok-soft:#0f2a1e;
    --ko:#ff6b6b; --ko-soft:#2c1416; --warn:#edaa5f; --warn-soft:#2a2013;
    --border:#26303f; --code:#0a0e16;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f5f7fb; --surface:#fff; --surface2:#f0f3f9; --ink:#161d2b; --muted:#5c687d;
      --accent:#1e7a46; --accent-soft:#e7f5ec; --ok:#1e7a46; --ok-soft:#e7f5ec;
      --ko:#b3352b; --ko-soft:#fbeae8; --warn:#8a5a00; --warn-soft:#fdf3e3;
      --border:#dce2ee; --code:#eef1f7;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.55}
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 80px}
  a{color:var(--accent)}
  code{font-family:"Cascadia Code",Consolas,monospace;background:var(--code);padding:1px 5px;border-radius:5px;font-size:.88em;border:1px solid var(--border)}
  header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  header.top h1{font-size:19px;margin:0;font-weight:700}
  header.top h1 span{color:var(--accent)}
  .hstats{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .hstats b{color:var(--ink)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 16px}

  .levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin:14px 0 20px}
  .lvl{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 13px;cursor:pointer;text-align:left;color:inherit;font:inherit;transition:.15s}
  .lvl:hover{border-color:var(--accent);transform:translateY(-2px)}
  .lvl .n{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .lvl .t{font-weight:650;font-size:14.5px;margin:3px 0 5px;line-height:1.3}
  .lvl .m{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .bar{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--ok);width:0}

  .modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  button{font:inherit;cursor:pointer;border:none;border-radius:9px;padding:.6rem 1.1rem;background:var(--accent);color:#04180f;font-weight:700;font-size:14.5px}
  @media (prefers-color-scheme: light){ button{color:#fff} }
  button:hover{filter:brightness(1.08)}
  button.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--border);font-weight:600}
  button.tiny{padding:.35rem .7rem;font-size:13px}

  .progress{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-bottom:16px}
  .progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
  .meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:10px;gap:10px;flex-wrap:wrap}
  .tag{display:inline-block;background:var(--surface2);color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:700;letter-spacing:.03em}
  .qtext{font-size:17px;line-height:1.5;margin:6px 0 16px;font-weight:550}

  .choix{display:flex;flex-direction:column;gap:9px}
  .ch{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--border);
      border-radius:11px;padding:13px 15px;cursor:pointer;color:inherit;font:inherit;font-size:15px;line-height:1.45;transition:.12s}
  .ch:hover:not(:disabled){border-color:var(--accent)}
  .ch:disabled{cursor:default}
  .ch .lettre{flex:0 0 24px;height:24px;border-radius:6px;background:var(--bg);border:1px solid var(--border);
      display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:var(--muted)}
  .ch.bonne{background:var(--ok-soft);border-color:var(--ok)}
  .ch.bonne .lettre{background:var(--ok);color:#04180f;border-color:var(--ok)}
  .ch.mauvaise{background:var(--ko-soft);border-color:var(--ko)}
  .ch.mauvaise .lettre{background:var(--ko);color:#2a0605;border-color:var(--ko)}
  .ch.estompe{opacity:.5}

  .fb{margin-top:15px;padding:14px;border-radius:10px;font-size:14.5px;border:1px solid}
  .fb.ok{background:var(--ok-soft);border-color:var(--ok)}
  .fb.ko{background:var(--ko-soft);border-color:var(--ko)}
  .fb .badge{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:6px;letter-spacing:.04em;margin-bottom:8px}
  .fb.ok .badge{background:var(--ok);color:#04180f}
  .fb.ko .badge{background:var(--ko);color:#2a0605}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .done{text-align:center;padding:16px 0}
  .score{font-size:44px;font-weight:800;margin:8px 0;font-variant-numeric:tabular-nums}
  .dom-list{margin-top:14px;font-size:13.5px}
  .dom-list div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--border)}
  .hint{font-size:13px;color:var(--muted);margin-top:10px}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
  .serie{display:inline-block;background:var(--warn-soft);border:1px solid var(--warn);color:var(--warn);
      border-radius:20px;padding:2px 11px;font-size:12.5px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>QCM <span>DevOps</span> — Entretien BNP</h1>
    <div class="hstats" id="hstats"></div>
  </header>
  <div id="app"></div>
</div>

<script>
/* qcm/complement-linux-conteneurs.js */
/* Complément QCM : comble les niveaux vides des blocs « Linux & Bash »
   et « Docker & Git ». Propositions calibrées à longueur comparable. */
window.QCM = (window.QCM || []).concat([

/* ---------- LINUX — niveau 4 ---------- */
{ id:"cq-lin-4-01", lvl:4, dom:"Linux",
  q:"Quelle directive systemd exprime une dépendance, et non un simple ordre de démarrage ?",
  choix:["<code>Requires=</code>","<code>After=</code>","<code>Before=</code>","<code>WantedBy=</code>"],
  bonne:0,
  explain:"<code>Requires=</code> lie les cycles de vie : si l'unité requise échoue, la nôtre est arrêtée. <code>After=</code>/<code>Before=</code> ne font qu'ordonner. Les deux sont indépendants — d'où le service qui démarre avant sa base quand on a mis l'un sans l'autre." },

{ id:"cq-lin-4-02", lvl:4, dom:"Linux",
  q:"Par défaut sur beaucoup de distributions, où journald stocke-t-il ses logs ?",
  choix:["En mémoire, dans <code>/run</code>","Sur disque, dans <code>/var/log</code>","Dans <code>/etc/systemd</code>","Dans la base du noyau"],
  bonne:0,
  explain:"Stockage volatile : les logs disparaissent au redémarrage. Pour les conserver : <code>Storage=persistent</code> dans <code>journald.conf</code>, ou création de <code>/var/log/journal</code>, avec <code>SystemMaxUse=</code> pour borner la taille." },

{ id:"cq-lin-4-03", lvl:4, dom:"Linux",
  q:"Que fait <code>systemctl mask</code> de plus que <code>disable</code> ?",
  choix:["Il rend l'unité indémarrable","Il supprime le fichier d'unité","Il arrête l'unité en cours","Il désactive ses dépendances"],
  bonne:0,
  explain:"<code>mask</code> crée un lien vers <code>/dev/null</code> : plus aucun démarrage possible, même manuel ou par dépendance. <code>disable</code> retire seulement le démarrage automatique. Utile pour neutraliser un service qu'un paquet réactiverait." },

{ id:"cq-lin-4-04", lvl:4, dom:"Linux",
  q:"Comment rendre un réglage <code>sysctl</code> permanent ?",
  choix:["Un fichier dans <code>/etc/sysctl.d/</code>","L'option <code>-w</code> de sysctl","Une ligne dans <code>/etc/fstab</code>","Une variable dans <code>/etc/environment</code>"],
  bonne:0,
  explain:"<code>sysctl -w</code> agit à chaud mais ne survit pas au redémarrage. Réglages fréquents en production : <code>net.core.somaxconn</code>, <code>fs.file-max</code>, <code>vm.max_map_count</code>." },

{ id:"cq-lin-4-05", lvl:4, dom:"Linux",
  q:"Comment autoriser un binaire non-root à écouter sur le port 80 ?",
  choix:["<code>setcap cap_net_bind_service</code>","<code>chmod +s</code> sur le binaire","<code>sysctl net.ipv4.ip_forward=1</code>","<code>usermod -aG netdev</code>"],
  bonne:0,
  explain:"Les capabilities découpent les privilèges de root : on accorde exactement celui qui manque. Le bit setuid donnerait tous les droits du propriétaire — bien trop large. Alternative plus propre : port haut + reverse proxy." },

{ id:"cq-lin-4-06", lvl:4, dom:"Linux",
  q:"Pourquoi <code>limits.conf</code> ne change-t-il rien pour un daemon systemd ?",
  choix:["Il n'est appliqué que par PAM, aux sessions","Il ne concerne que l'utilisateur root","Il est ignoré depuis systemd 240","Il faut redémarrer la machine"],
  bonne:0,
  explain:"Un service lancé par systemd ne passe pas par une session PAM. Il faut <code>LimitNOFILE=</code> et <code>LimitNPROC=</code> dans l'unité. C'est la cause du « j'ai pourtant augmenté ulimit » qui ne produit aucun effet." },

/* ---------- LINUX — niveau 5 ---------- */
{ id:"cq-lin-5-01", lvl:5, dom:"Linux",
  q:"Les permissions POSIX sont bonnes mais l'écriture est refusée. Quelle piste ?",
  choix:["SELinux ou AppArmor","Un disque monté en lecture seule","Un quota utilisateur atteint","Un verrou de fichier"],
  bonne:0,
  explain:"Un contrôle d'accès obligatoire se superpose aux permissions POSIX. Diagnostic : <code>getenforce</code>, <code>ausearch -m avc</code>, <code>audit2why</code>. Le correctif propre est de poser le bon contexte, pas de désactiver SELinux." },

{ id:"cq-lin-5-02", lvl:5, dom:"Linux",
  q:"Qu'apporte nftables par rapport à iptables ?",
  choix:["Une syntaxe unifiée et de meilleures performances","Le support du filtrage applicatif","Le chiffrement natif des flux","La compatibilité IPv6 exclusive"],
  bonne:0,
  explain:"Un seul cadre pour IPv4/IPv6/ARP/bridge au lieu de quatre outils, des ensembles et maps natifs pour de grands jeux de règles, et un rechargement atomique. <code>iptables</code> moderne est souvent un frontal traduisant vers nftables." },

{ id:"cq-lin-5-03", lvl:5, dom:"Linux",
  q:"À quoi sert auditd, par rapport à journald ?",
  choix:["Tracer les événements de sécurité du noyau","Centraliser les logs applicatifs","Faire tourner les fichiers de logs","Surveiller les performances système"],
  bonne:0,
  explain:"auditd enregistre les accès à des fichiers sensibles, des appels système ciblés et les changements de privilèges, avec des règles dédiées. En banque, c'est lui qui porte la traçabilité réglementaire : qui a lu quoi, qui a exécuté quoi en root." },

{ id:"cq-lin-5-04", lvl:5, dom:"Linux",
  q:"Quel est le point critique en exploitation d'un disque chiffré LUKS ?",
  choix:["Le déverrouillage automatique au démarrage","La performance en lecture séquentielle","La compatibilité avec les sauvegardes","La taille maximale du volume"],
  bonne:0,
  explain:"Une machine qui attend une passphrase au boot ne redémarre pas seule à 3 h du matin. D'où l'usage d'un TPM, d'un serveur de clés (Tang/Clevis) ou du chiffrement managé du cloud." },

{ id:"cq-lin-5-05", lvl:5, dom:"Linux",
  q:"Que règle <code>net.ipv4.ip_local_port_range</code> ?",
  choix:["La plage des ports source sortants","Les ports autorisés en écoute","La plage réservée aux conteneurs","Les ports filtrés par le pare-feu"],
  bonne:0,
  explain:"Sur un proxy ouvrant des dizaines de milliers de connexions vers une même destination, on épuise la plage et les connexions échouent. L'élargir aide, mais la vraie réponse est le keep-alive et le pooling." },

{ id:"cq-lin-5-06", lvl:5, dom:"Linux",
  q:"Comment crée-t-on proprement un compte de service Linux ?",
  choix:["Sans home, sans mot de passe, shell nologin","Avec un mot de passe fort et un home dédié","En le rattachant au groupe sudo","En réutilisant un compte existant"],
  bonne:0,
  explain:"<code>useradd --system --shell /usr/sbin/nologin</code>. L'objectif : qu'une compromission du service ne donne pas de session interactive. Convention d'UID sous 1000 pour les comptes système." },

{ id:"cq-lin-5-07", lvl:5, dom:"Linux",
  q:"Quelle directive systemd isole le <code>/tmp</code> d'un service ?",
  choix:["<code>PrivateTmp=yes</code>","<code>ProtectHome=yes</code>","<code>NoNewPrivileges=yes</code>","<code>ReadOnlyPaths=/tmp</code>"],
  bonne:0,
  explain:"Chaque service obtient son propre <code>/tmp</code>, invisible des autres. À combiner avec <code>ProtectSystem=strict</code>, <code>NoNewPrivileges=</code>, <code>SystemCallFilter=</code>. <code>systemd-analyze security</code> note l'unité et liste ce qui manque." },

{ id:"cq-lin-5-08", lvl:5, dom:"Linux",
  q:"Que révèle un grand nombre de sockets en état CLOSE_WAIT ?",
  choix:["L'application ne ferme pas ses sockets","Le réseau perd des paquets","Le pare-feu coupe les sessions","La charge dépasse la capacité"],
  bonne:0,
  explain:"CLOSE_WAIT signifie que le pair a fermé et que notre application n'a pas appelé <code>close()</code> : c'est un bug applicatif, pas un problème réseau. À distinguer de TIME_WAIT, normal et abondant sur un proxy." },

/* ---------- LINUX — niveau 7 ---------- */
{ id:"cq-lin-7-01", lvl:7, dom:"Linux",
  q:"Quel est l'argument principal de l'infrastructure immuable sur le patching en place ?",
  choix:["L'absence de dérive de configuration","Un coût de stockage plus faible","Un démarrage des machines plus rapide","Une compatibilité applicative accrue"],
  bonne:0,
  explain:"On reconstruit et on remplace au lieu de modifier : plus de dérive, retour arrière en redéployant l'image précédente, environnements reproductibles. Le patching en place reste nécessaire pour le legacy à état et les urgences." },

{ id:"cq-lin-7-02", lvl:7, dom:"Linux",
  q:"Pour tenir 100 000 connexions simultanées, quel plafond est le plus souvent oublié ?",
  choix:["Le backlog demandé par l'application","La taille de la mémoire vive","La fréquence du processeur","Le débit de la carte réseau"],
  bonne:0,
  explain:"On règle <code>net.core.somaxconn</code> et on oublie que l'application passe sa propre valeur à <code>listen()</code> : c'est le minimum des deux qui s'applique. À vérifier aussi : descripteurs, conntrack, ports éphémères." },

{ id:"cq-lin-7-03", lvl:7, dom:"Linux",
  q:"Quelle est la limite du kernel live patching ?",
  choix:["Tous les correctifs ne sont pas éligibles","Il exige une licence par cœur","Il dégrade les performances du noyau","Il ne fonctionne pas en machine virtuelle"],
  bonne:0,
  explain:"Un changement de structure de données impose un vrai redémarrage. C'est un outil pour absorber l'urgence, pas pour ne jamais redémarrer : un parc qui n'a pas rebooté depuis deux ans cache d'autres problèmes." },

{ id:"cq-lin-7-04", lvl:7, dom:"Linux",
  q:"Quel est le pire endroit où placer un secret sur une VM ?",
  choix:["Une variable d'environnement du service","Un fichier en 400 dans un tmpfs","Un coffre interrogé au démarrage","Un fichier chiffré par le TPM"],
  bonne:0,
  explain:"L'environnement d'un processus est lisible dans <code>/proc/&lt;pid&gt;/environ</code> et apparaît souvent dans les dumps et les outils de diagnostic. Préférer un fichier à permissions strictes en mémoire, renouvelé par un agent." },

{ id:"cq-lin-7-05", lvl:7, dom:"Linux",
  q:"Pourquoi borner la rotation des logs en TAILLE et pas seulement en durée ?",
  choix:["Un pic de logs peut saturer le disque avant l'échéance","La compression ne fonctionne que par taille","La durée n'est pas respectée par logrotate","Les logs anciens sont illisibles"],
  bonne:0,
  explain:"Une rotation « 30 jours » ne protège pas d'une boucle d'erreurs qui écrit 50 Go en une nuit. On borne les deux, et on met les logs sur une partition séparée pour qu'une saturation ne bloque pas le système." },

{ id:"cq-lin-7-06", lvl:7, dom:"Linux",
  q:"Lors d'un test de charge, quel est le facteur limitant le plus fréquent ?",
  choix:["La base de données ou un pool de connexions","Le processeur du serveur applicatif","La bande passante réseau","La taille du disque système"],
  bonne:0,
  explain:"Le CPU applicatif sature rarement en premier. On mesure jusqu'au point de rupture en observant latence par percentile, iowait, descripteurs et pools, puis on dimensionne avec une marge documentée." },

{ id:"cq-lin-7-07", lvl:7, dom:"Linux",
  q:"Quand préfère-t-on une microVM (Firecracker) à un conteneur ?",
  choix:["Pour exécuter du code non fiable ou multi-tenant","Pour réduire la taille des images","Pour accélérer les déploiements","Pour simplifier le réseau"],
  bonne:0,
  explain:"Une microVM embarque son propre noyau derrière un hyperviseur minimaliste : isolation de VM, démarrage en centaines de millisecondes. C'est ce qui sert de frontière quand un namespace ne suffit pas." },

/* ---------- LINUX — niveau 9 ---------- */
{ id:"cq-lin-9-01", lvl:9, dom:"Linux",
  q:"Comment déployer des correctifs sur 2000 serveurs en environnement bancaire ?",
  choix:["Par anneaux, du bac à sable à la prod critique","Simultanément, pendant une fenêtre unique","Par ordre alphabétique des machines","À la demande de chaque équipe applicative"],
  bonne:0,
  explain:"Chaque anneau valide le suivant, avec des fenêtres négociées et un retour arrière possible. Complété par un tableau de bord de conformité, des délais par criticité de CVE, et des exemptions datées." },

{ id:"cq-lin-9-02", lvl:9, dom:"Linux",
  q:"Comment applique-t-on un benchmark CIS sur un parc existant ?",
  choix:["En auditant d'abord, puis par lots validés","En appliquant le profil complet d'un coup","En ne gardant que les règles de niveau 1","En le déléguant à l'éditeur du système"],
  bonne:0,
  explain:"Appliquer un profil complet sur un serveur en production casse presque toujours quelque chose. On mesure l'écart en mode rapport (OpenSCAP), on traite par lots, on documente les exceptions justifiées." },

{ id:"cq-lin-9-03", lvl:9, dom:"Linux",
  q:"Où doit être stockée la base de référence d'un contrôle d'intégrité ?",
  choix:["Hors de la machine surveillée","Dans <code>/var/lib</code> de la machine","Dans un répertoire chiffré local","Dans la partition de démarrage"],
  bonne:0,
  explain:"Un attaquant root régénère la base locale après avoir modifié les fichiers, et le contrôle ne détecte plus rien. Même logique que pour les journaux : ils doivent partir en temps réel vers un collecteur inaccessible en écriture." },

{ id:"cq-lin-9-04", lvl:9, dom:"Linux",
  q:"Quelle conséquence pratique d'activer le mode FIPS ?",
  choix:["Des applications cessent de fonctionner","Les performances chutent de moitié","Le système refuse les mises à jour","Le chiffrement des disques est imposé"],
  bonne:0,
  explain:"Le système n'accepte que des implémentations cryptographiques validées : une application utilisant MD5 ou une bibliothèque non conforme casse. C'est à tester longtemps avant la mise en production." },

{ id:"cq-lin-9-05", lvl:9, dom:"Linux",
  q:"Un serveur est suspecté de compromission. Quel est le premier geste ?",
  choix:["L'isoler du réseau sans l'éteindre","L'éteindre pour stopper l'attaque","Réinstaller le système immédiatement","Changer tous les mots de passe locaux"],
  bonne:0,
  explain:"La mémoire vive contient des preuves qui disparaissent à l'extinction. On isole, on capture mémoire et disque, on préserve les journaux hors machine, puis on RECONSTRUIT depuis une source saine — on ne nettoie pas." },

{ id:"cq-lin-9-06", lvl:9, dom:"Linux",
  q:"Que vaut le support étendu payant d'une distribution en fin de vie ?",
  choix:["Un filet temporaire, pas une solution durable","Une alternative complète à la migration","Une obligation réglementaire en banque","Une garantie de compatibilité applicative"],
  bonne:0,
  explain:"Il couvre ce qui ne peut pas migrer à temps. Un système hors support en production reste un constat d'audit, même s'il fonctionne parfaitement. La migration se planifie avant la date d'échéance." },

{ id:"cq-lin-9-07", lvl:9, dom:"Linux",
  q:"Comment prouver qui a agi en root sur un serveur ?",
  choix:["Connexion nominative puis sudo, journaux exportés","Historique bash de l'utilisateur root","Fichier de log local d'auditd","Liste des clés SSH autorisées"],
  bonne:0,
  explain:"Jamais de login root direct ni de mot de passe partagé. Les journaux sudo et auditd doivent partir EN TEMPS RÉEL vers un collecteur que l'administrateur local ne peut pas modifier — sinon un attaquant root efface les traces." },

{ id:"cq-lin-9-08", lvl:9, dom:"Linux",
  q:"Quel est le coût principal d'un accès administrateur juste-à-temps ?",
  choix:["Le gestionnaire d'accès devient critique","La perte de traçabilité des actions","L'impossibilité d'automatiser les tâches","Une latence sur les commandes exécutées"],
  bonne:0,
  explain:"S'il tombe, plus personne n'entre — en pleine panne. D'où l'obligation d'un chemin de secours documenté (compte break-glass scellé, alerte à toute utilisation, rotation après usage)." },

/* ---------- LINUX — niveau 10 ---------- */
{ id:"cq-lin-10-01", lvl:10, dom:"Linux",
  q:"« Un serveur rame, 5 minutes, un SSH. » Qu'attendent-ils surtout ?",

{ id:"cq-lin-10-05", lvl:10, dom:"Linux",

{ id:"cq-dg-7-05", lvl:7, dom:"Git",

{ id:"cq-dg-7-06", lvl:7, dom:"Git",

{ id:"cq-dg-8-02", lvl:8, dom:"Docker",

{ id:"cq-dg-8-03", lvl:8, dom:"Docker",

{ id:"cq-dg-8-04", lvl:8, dom:"Git",

{ id:"cq-dg-8-05", lvl:8, dom:"Git",
  q:"Pourquoi un squash merge complique-t-il un cherry-pick ultérieur ?",

{ id:"cq-dg-8-06", lvl:8, dom:"Git",

window.QCM = (window.QCM || []).concat([
  {"id":"tf-v-declaratif","lvl":1,"dom":"Terraform","q":"Terraform est déclaratif. Qu'est-ce que ça veut dire ?","explain":"Déclaratif = le QUOI (état cible), pas le COMMENT. Terraform compare état désiré vs état connu et en déduit le plan. Un script bash est impératif.","choix":["Tu décris l'état FINAL désiré, Terraform calcule les actions pour l'atteindre","Tu écris chaque commande à exécuter dans l'ordre","Le code s'exécute ligne par ligne comme un script","Tu déclares les variables avant les ressources"],"bonne":0},
  {"id":"tf-v-plan","lvl":3,"dom":"Terraform","q":"Que fait « terraform plan » exactement ?","explain":"plan = prévisualisation (dry run) : + créer, - détruire, ~ modifier, -/+ remplacer. Seul apply modifie l'infrastructure.","choix":["Il calcule et affiche les actions nécessaires SANS rien modifier","Il applique les changements","Il formate le code","Il supprime l'infrastructure"],"bonne":0},
  {"id":"tf-v-output","lvl":2,"dom":"Terraform","q":"À quoi sert un bloc « output » ?","explain":"output = valeur de sortie : IP créée, nom généré… Un module parent lit module.nom.output ; terraform output les affiche.","choix":["Exposer une valeur après apply (affichée en CLI, consommable par d'autres configs/modules)","Écrire des logs","Définir une variable d'entrée","Exporter le state"],"bonne":0},
  {"id":"tf-v-dag","lvl":2,"dom":"Terraform","q":"Comment Terraform détermine-t-il l'ordre de création des ressources ?","explain":"Les références implicites (resource_a.id utilisé par resource_b) construisent le graphe ; ce qui est indépendant part en parallèle. depends_on force une dépendance explicite.","choix":["Il construit un graphe de dépendances (DAG) à partir des références entre ressources","Dans l'ordre d'écriture du fichier","Par ordre alphabétique","Au hasard, en parallèle total"],"bonne":0},
  {"id":"tf-v-provisioner","lvl":3,"dom":"Terraform","q":"Quelle est la position officielle de HashiCorp sur les provisioners (remote-exec, local-exec) ?","explain":"« Provisioners are a last resort » — question d'examen quasi garantie. Ils cassent le modèle déclaratif et ne sont pas dans le state.","choix":["Dernier recours uniquement — préférer cloud-init, Packer ou des outils de config management","La méthode recommandée pour configurer les VMs","Obligatoires pour chaque resource","Dépréciés et supprimés"],"bonne":0},
  {"id":"tf-v-validate","lvl":1,"dom":"Terraform","q":"Que vérifie « terraform validate » ?","explain":"validate = contrôle statique local (après init). Il ne détecte pas le drift ni les erreurs d'API — c'est le rôle de plan/apply.","choix":["La syntaxe et la cohérence interne de la config — SANS contacter les APIs ni le state distant","Que l'infrastructure réelle correspond au state","Les credentials du provider","Le coût du déploiement"],"bonne":0},
  {"id":"tf-v-pessimistic","lvl":1,"dom":"Terraform","q":"Que signifie la contrainte de version « ~> 4.10 » ?","explain":"~> incrémente seulement le DERNIER chiffre indiqué. ~> 4.10 = >= 4.10 et < 5.0. LA question de version classique.","choix":["Autorise 4.10, 4.11, 4.x… mais JAMAIS 5.0 (pessimistic constraint)","Exactement 4.10","N'importe quelle version au-dessus de 4.10, y compris 5.x","En dessous de 4.10"],"bonne":0},
  {"id":"tf-v-hcp","lvl":2,"dom":"Terraform","q":"Qu'apporte HCP Terraform (ex-Terraform Cloud) par rapport à la CLI open source ?","explain":"HCP Terraform = la plateforme SaaS : collaboration, state sécurisé, speculative plans sur PR, Sentinel, RBAC d'équipe.","choix":["State distant managé, runs à distance, intégration VCS, private registry, policies Sentinel, gestion d'équipe","Uniquement une interface graphique","Un langage différent de HCL","Rien, c'est identique"],"bonne":0},
  {"id":"tf-v-console","lvl":1,"dom":"Terraform","q":"À quoi sert « terraform console » ?","explain":"Un REPL pour expérimenter : lookup(), for expressions, références aux resources… Idéal pour déboguer une expression.","choix":["Tester interactivement des expressions et fonctions HCL (avec les valeurs du state)","Ouvrir un shell sur les VMs créées","Voir les logs du provider","Administrer HCP Terraform"],"bonne":0},
  {"id":"tf-v-lockfile","lvl":2,"dom":"Terraform","q":"Quel est le rôle du fichier .terraform.lock.hcl et que faut-il en faire ?","explain":"Le dependency lock file garantit les mêmes versions de providers pour toute l'équipe. À committer — contrairement à .terraform/ et *.tfstate.","choix":["Il fige les versions exactes des providers ; il faut le COMMITTER dans Git","Il verrouille le state ; ne pas le committer","Il contient les secrets ; à mettre dans .gitignore","Il est temporaire et peut être supprimé à chaque run"],"bonne":0},
  {"id":"tf-v-immutable","lvl":3,"dom":"Terraform","q":"Certains changements affichent « -/+ destroy and then create replacement » dans le plan. Pourquoi ?","explain":"Exemple : renommer une VM Azure force un remplacement (~ = modif en place ; -/+ = remplacement). create_before_destroy inverse l'ordre.","choix":["L'argument modifié ne peut pas être changé en place : la ressource doit être détruite puis recréée","C'est un bug de Terraform","Le provider est obsolète","Le state est corrompu"],"bonne":0},
  {"id":"tf-v-secrets-state","lvl":1,"dom":"Terraform","q":"Les mots de passe et secrets présents dans la config se retrouvent-ils dans le state ?","explain":"sensitive = true masque l'AFFICHAGE (CLI), mais le state contient la valeur en clair. D'où : backend chiffré + accès restreint.","choix":["Oui, EN CLAIR — le state doit être traité comme une donnée sensible","Non, ils sont toujours chiffrés","Non, ils ne sont jamais stockés","Seulement si sensitive = false"],"bonne":0},
  {"id":"tf-v-parallel","lvl":2,"dom":"Terraform","q":"Terraform crée-t-il les ressources une par une ?","explain":"Le graphe de dépendances permet le parallélisme (réglable avec -parallelism=n). Seules les dépendances imposent un ordre.","choix":["Non — les ressources indépendantes sont créées en parallèle (10 par défaut)","Oui, toujours séquentiellement","Oui, sauf avec -parallel","Seulement en HCP Terraform"],"bonne":0},
  {"id":"tf-v-multicloud","lvl":3,"dom":"Terraform","q":"Pourquoi dit-on que Terraform est « cloud-agnostic » ?","explain":"Piège classique : Terraform est multi-cloud par son écosystème, mais un bloc azurerm_* ne devient pas magiquement un bloc aws_*.","choix":["Un même outil/langage pilote des centaines de providers (Azure, AWS, GitHub, Datadog…) — mais chaque config reste spécifique à son provider","Le même code .tf se déploie tel quel sur Azure ET AWS","Il ne fonctionne que sur le cloud","Il traduit automatiquement azurerm en aws"],"bonne":0},
  {"id":"tf-v-binary","lvl":1,"dom":"Terraform","q":"Comment Terraform s'installe-t-il ?","explain":"Un seul exécutable écrit en Go. Les providers sont téléchargés séparément par terraform init.","choix":["Un binaire unique à mettre dans le PATH (ou gestionnaire de paquets)","Un serveur à déployer","Une extension de navigateur","Uniquement via Docker"],"bonne":0},
  {"id":"tf-v-apply-approve","lvl":2,"dom":"Terraform","q":"Que se passe-t-il quand tu lances « terraform apply » sans fichier de plan ?","explain":"apply = plan + confirmation interactive + exécution. -auto-approve saute la confirmation (CI). apply monplan.tfplan exécute un plan sauvegardé sans demander.","choix":["Il exécute un plan, l'affiche, et attend ta confirmation « yes »","Il applique immédiatement sans rien montrer","Il refuse de s'exécuter","Il ne fait qu'afficher le plan"],"bonne":0},
  {"id":"tf-v-gitignore","lvl":3,"dom":"Terraform","q":"Que faut-il mettre dans le .gitignore d'un projet Terraform ?","explain":"Le state (secrets !) et le dossier des plugins ne se versionnent pas. Le lock file, si. Les .tfvars avec secrets non plus.","choix":[".terraform/ et *.tfstate (mais PAS .terraform.lock.hcl)","Tous les fichiers .tf","Le lock file uniquement","Rien, tout se commit"],"bonne":0},
  {"id":"tf-f-var-prec","lvl":5,"dom":"Terraform","q":"Plusieurs sources définissent la même variable. Laquelle GAGNE (priorité la plus haute) ?","explain":"Ordre croissant : default < TF_VAR_ < terraform.tfvars < *.auto.tfvars (alphabétique) < -var/-var-file (le dernier passé gagne). La ligne de commande écrase tout.","choix":["-var / -var-file en ligne de commande","La variable d'environnement TF_VAR_x","terraform.tfvars","La valeur default du bloc variable"],"bonne":0},
  {"id":"tf-f-var-types","lvl":6,"dom":"Terraform","q":"Quels sont les types de variables Terraform valides ?","explain":"Types primitifs : string/number/bool. Collections : list/set/map. Structurels : object/tuple. any = non contraint.","choix":["string, number, bool, list, set, map, object, tuple, any","string, int, float, array, dict","varchar, boolean, json","Seulement string et number"],"bonne":0},
  {"id":"tf-f-var-validation","lvl":4,"dom":"Terraform","q":"Comment imposer qu'une variable respecte une règle (ex : longueur < 10) ?","explain":"validation { condition = length(var.name) < 10, error_message = \"...\" } — l'erreur sort dès le plan.","choix":["Un bloc validation { condition = ..., error_message = \"...\" } dans le bloc variable","Un if dans le resource","Ce n'est pas possible","Un provisioner de vérification"],"bonne":0},
  {"id":"tf-f-sensitive","lvl":5,"dom":"Terraform","q":"Que fait « sensitive = true » sur une variable ou un output ?","explain":"sensitive = masquage d'affichage uniquement. Pour lire un output sensible : terraform output nom (ou -json).","choix":["Masque la valeur dans les sorties CLI/plan — mais elle reste EN CLAIR dans le state","Chiffre la valeur dans le state","Empêche son utilisation","La supprime après apply"],"bonne":0},
  {"id":"tf-f-plan-out","lvl":4,"dom":"Terraform","q":"Comment garantir en CI que l'apply exécute EXACTEMENT ce que le plan a montré ?","explain":"Le fichier de plan sauvegardé est ré-exécuté tel quel (sans re-confirmation). Si l'infra a changé entre-temps, l'apply échoue — c'est voulu.","choix":["terraform plan -out=monplan puis terraform apply monplan","terraform apply -auto-approve directement","Copier-coller la sortie du plan","Lancer plan et apply en même temps"],"bonne":0},
  {"id":"tf-f-import","lvl":4,"dom":"Terraform","q":"Comment adopter une ressource créée à la main dans Terraform (v1.5+) ?","explain":"Le bloc import (déclaratif, peut même générer la config avec plan -generate-config-out). L'ancienne méthode : terraform import adresse id.","choix":["Un bloc import { to = ..., id = \"...\" } + plan/apply — ou la commande terraform import","terraform adopt","Elle est détectée automatiquement au plan","Impossible, il faut la recréer"],"bonne":0},
  {"id":"tf-f-moved","lvl":5,"dom":"Terraform","q":"À quoi sert le bloc « moved { from = ..., to = ... } » ?","explain":"moved = renommage déclaratif et versionné dans le code, appliqué au prochain apply. Remplace state mv pour les refactorings.","choix":["Refactorer/renommer une ressource ou la déplacer dans un module SANS destroy/recreate","Déplacer une VM entre régions","Migrer le backend","Déplacer un fichier .tf"],"bonne":0},
  {"id":"tf-f-detailed-exit","lvl":4,"dom":"Terraform","q":"Avec terraform plan -detailed-exitcode, que signifie le code de sortie 2 ?","explain":"0 = succès sans changement, 1 = erreur, 2 = succès avec changements. Très utilisé en CI pour détecter le drift.","choix":["Le plan a réussi ET des changements sont à appliquer","Erreur fatale","Aucun changement","State verrouillé"],"bonne":0},
  {"id":"tf-f-backend-lock","lvl":5,"dom":"Terraform","q":"Pourquoi le verrouillage (locking) du state est-il crucial en équipe ?","explain":"Deux writes concurrents = state corrompu. Le backend azurerm verrouille via lease sur le blob ; HCP Terraform verrouille nativement.","choix":["Empêcher deux applies simultanés de corrompre le state","Chiffrer le state","Empêcher la lecture du state","Accélérer les plans"],"bonne":0},
  {"id":"tf-f-count-foreach","lvl":4,"dom":"Terraform","q":"Quelle différence entre count et for_each ?","explain":"Supprimer l'élément 0 d'un count décale tous les index → recréations en cascade. for_each = adressage par clé, stable. Ils sont mutuellement exclusifs sur un même bloc.","choix":["count indexe par numéro (risque de recréation si la liste change) ; for_each par clé de map/set (stable)","for_each est déprécié","count crée des modules, for_each des resources","Aucune"],"bonne":0},
  {"id":"tf-f-foreach-types","lvl":5,"dom":"Terraform","q":"Quels types de valeurs accepte for_each ?","explain":"for_each = var.ma_map ou toset(var.ma_liste). Dans le bloc : each.key et each.value.","choix":["Une map ou un set de strings (une liste doit passer par toset())","N'importe quelle liste","Un number","Uniquement une map"],"bonne":0},
  {"id":"tf-f-lifecycle","lvl":6,"dom":"Terraform","q":"Quels sont les principaux arguments du bloc lifecycle ?","explain":"lifecycle contrôle le cycle de vie : remplacer sans coupure, interdire la destruction, ignorer des attributs, forcer un remplacement lié.","choix":["create_before_destroy, prevent_destroy, ignore_changes, replace_triggered_by","retry, timeout, backoff","depends_on, count, for_each","pre_apply, post_apply"],"bonne":0},
  {"id":"tf-f-dependson","lvl":4,"dom":"Terraform","q":"Quand utiliser depends_on ?","explain":"Les références (a.id dans b) créent déjà les dépendances implicites. depends_on = uniquement pour les liens invisibles (ex : rôle IAM requis avant une action).","choix":["Quand une dépendance existe mais n'apparaît PAS via une référence (dépendance cachée)","Sur chaque ressource, par sécurité","Pour accélérer le graphe","Jamais, c'est déprécié"],"bonne":0},
  {"id":"tf-f-dynamic","lvl":5,"dom":"Terraform","q":"À quoi sert un bloc « dynamic » ?","explain":"dynamic \"ip_restriction\" { for_each = var.rules  content { ... } } — le for_each des blocs internes, pas des ressources.","choix":["Générer plusieurs blocs imbriqués répétitifs (ex : ip_restriction) à partir d'une collection","Charger des variables au runtime","Créer des ressources conditionnelles","Rendre le state dynamique"],"bonne":0},
  {"id":"tf-f-splat","lvl":6,"dom":"Terraform","q":"Que renvoie l'expression azurerm_subnet.subnets[*].id ?","explain":"L'opérateur splat [*] collecte un attribut sur toutes les instances. Avec for_each : values(azurerm_subnet.subnets)[*].id.","choix":["La liste des ids de toutes les instances créées avec count","L'id de la première instance","Une erreur","Un objet unique"],"bonne":0},
  {"id":"tf-f-conditional","lvl":4,"dom":"Terraform","q":"Comment créer une ressource SEULEMENT si var.enabled est vrai ?","explain":"HCL n'a pas de « if » de bloc : le ternaire sur count (ou for_each sur collection vide) est LE pattern conditionnel.","choix":["count = var.enabled ? 1 : 0","if var.enabled { resource ... }","enabled = true dans le bloc","when = var.enabled"],"bonne":0},
  {"id":"tf-f-functions","lvl":5,"dom":"Terraform","q":"Quelle fonction lit le contenu d'un fichier et y injecte des variables (ex : script cloud-init) ?","explain":"templatefile = file() + interpolation ${port} dans le template. file() lit brut, sans variables.","choix":["templatefile(\"script.tpl\", { port = 8080 })","file_template()","render()","include()"],"bonne":0},
  {"id":"tf-f-reqprov","lvl":4,"dom":"Terraform","q":"Où déclare-t-on la source et la contrainte de version d'un provider ?","explain":"required_providers (source + version) dans le bloc terraform. Le bloc provider ne porte que la configuration (features, region…).","choix":["Dans terraform { required_providers { azurerm = { source = \"hashicorp/azurerm\", version = \"~> 4.0\" } } }","Dans le bloc provider \"azurerm\" {}","Dans terraform.tfvars","Dans le state"],"bonne":0},
  {"id":"tf-f-module-source","lvl":6,"dom":"Terraform","q":"Quel format de source référence un module du registry PUBLIC ?","explain":"source = \"Azure/vnet/azurerm\", version = \"~> 4.0\". L'argument version ne marche QUE pour les registries (pas git/local).","choix":["namespace/nom/provider (ex : Azure/vnet/azurerm) + argument version","Une URL http obligatoire","Un chemin absolu","Le nom du module seul"],"bonne":0},
  {"id":"tf-f-module-naming","lvl":5,"dom":"Terraform","q":"Convention de nommage OBLIGATOIRE d'un repo pour publier un module sur le registry ?","explain":"terraform-<PROVIDER>-<NAME>, repo public (ou private registry), releases taguées x.y.z. Question récurrente.","choix":["terraform-<PROVIDER>-<NAME> (ex : terraform-azurerm-vnet) + tags semver","module-<NAME>","tf-<NAME>","N'importe quel nom"],"bonne":0},
  {"id":"tf-f-provider-alias","lvl":6,"dom":"Terraform","q":"Comment utiliser le MÊME provider avec deux configurations (ex : deux régions/subscriptions) ?","explain":"provider \"azurerm\" { alias = \"west\" ... } et dans la ressource : provider = azurerm.west. Les modules reçoivent les providers via l'argument providers = {}.","choix":["Deux blocs provider dont un avec alias = \"west\", puis provider = azurerm.west dans la ressource","Deux dossiers séparés obligatoirement","provider2 = ...","C'est impossible"],"bonne":0},
  {"id":"tf-f-show","lvl":5,"dom":"Terraform","q":"Que fait « terraform show » ?","explain":"terraform show [monplan.tfplan] — inspection humaine ou JSON (pour outils d'analyse de plan).","choix":["Affiche le contenu lisible du state ou d'un fichier de plan (-json pour machine)","Montre la doc d'un provider","Ouvre l'interface web","Liste les workspaces"],"bonne":0},
  {"id":"tf-f-cloud-block","lvl":5,"dom":"Terraform","q":"Comment connecter une configuration CLI à HCP Terraform ?","explain":"terraform login stocke le token API ; le bloc cloud rattache la config à l'organisation/workspace. Les runs peuvent alors s'exécuter à distance.","choix":["Un bloc cloud { organization = \"...\" workspaces { name = \"...\" } } dans terraform {} + terraform login","Un provider hcp","Copier le state à la main","Ce n'est pas possible depuis la CLI"],"bonne":0},
  {"id":"tf-f-hcp-state","lvl":6,"dom":"Terraform","q":"Où est stocké le state quand on utilise HCP Terraform ?","explain":"Chaque workspace HCP porte son state : historique des versions, locking natif, contrôle d'accès par équipe.","choix":["Dans le workspace HCP, chiffré, versionné, avec verrouillage automatique","Toujours en local","Dans un blob Azure obligatoirement","Dans le repo Git"],"bonne":0},
  {"id":"tf-f-sentinel-levels","lvl":4,"dom":"Terraform","q":"Quels sont les 3 niveaux d'application (enforcement) d'une policy Sentinel ?","explain":"advisory = avertit ; soft-mandatory = bloque mais un admin peut outrepasser ; hard-mandatory = bloque toujours.","choix":["advisory, soft-mandatory, hard-mandatory","info, warn, error","low, medium, high","allow, deny, audit"],"bonne":0},
  {"id":"tf-f-plan-symbols","lvl":5,"dom":"Terraform","q":"Dans la sortie d'un plan, que signifie le symbole « -/+ » devant une ressource ?","explain":"+ créer, - détruire, ~ modifier en place, -/+ remplacer, <= lire (data). Savoir lire un plan = plusieurs questions d'examen.","choix":["Destruction PUIS recréation (remplacement)","Modification en place","Suppression simple","Lecture seule"],"bonne":0},
  {"id":"tf-f-null-alt","lvl":4,"dom":"Terraform","q":"Assigner « null » à un argument optionnel revient à :","explain":"null = « argument omis ». Pratique dans les ternaires : valeur != \"\" ? valeur : null.","choix":["Ne pas le définir du tout (le provider applique son défaut)","Le mettre à zéro","Provoquer une erreur","Le supprimer du state"],"bonne":0},
  {"id":"tf-f-apply-target","lvl":5,"dom":"Terraform","q":"À quoi sert terraform apply -target=adresse et quelle est la recommandation ?","explain":"-target crée des states incohérents s'il est utilisé en routine. HashiCorp : réservé aux situations exceptionnelles.","choix":["Appliquer seulement une ressource et ses dépendances — usage EXCEPTIONNEL (débogage), pas en routine","La façon normale de déployer ressource par ressource","Cibler un workspace","Cibler un backend"],"bonne":0},
  {"id":"tf-f-tfplan-secret","lvl":6,"dom":"Terraform","q":"Un fichier de plan sauvegardé (plan -out) peut-il contenir des données sensibles ?","explain":"Le .tfplan contient la config résolue et les valeurs. Même traitement que le state : ne pas le committer, le protéger.","choix":["Oui — il embarque les valeurs (dont secrets) : à protéger comme le state","Non, il est toujours chiffré","Non, il ne contient que des adresses","Seulement en JSON"],"bonne":0},
  {"id":"tf-s-team-state","lvl":8,"dom":"Terraform","q":"Deux collègues ont écrasé mutuellement leur state local et l'infra est incohérente. Quelle solution durable ?","explain":"Backend distant + locking = un seul state de vérité, jamais deux writes concurrents. Git ne verrouille pas et expose les secrets.","choix":["Backend distant partagé AVEC verrouillage (azurerm, HCP Terraform…)","S'envoyer le tfstate par mail après chaque apply","Committer le tfstate dans Git","Chacun son propre state local"],"bonne":0},
  {"id":"tf-s-secrets","lvl":9,"dom":"Terraform","q":"Ton state contient des mots de passe de base de données. Quelle est la bonne posture ?","explain":"sensitive ne masque que l'affichage. La protection réelle = backend sécurisé (chiffrement + RBAC) et state hors de Git. Base64 n'est pas du chiffrement.","choix":["Traiter le state comme un secret : backend chiffré au repos, accès restreint, pas de commit Git","Supprimer le state après chaque apply","Utiliser sensitive = true, ça suffit à le chiffrer","Encoder les mots de passe en base64"],"bonne":0},
  {"id":"tf-s-corrupted","lvl":7,"dom":"Terraform","q":"Une VM gérée par Terraform est corrompue ; sa config n'a pas changé. Comment la recréer proprement ?","explain":"-replace planifie le remplacement de cette seule ressource. La supprimer à la main fonctionnerait aussi (drift) mais c'est moins propre et plus risqué.","choix":["terraform apply -replace=azurerm_linux_virtual_machine.web","La supprimer dans le portail et relancer apply","Modifier un tag pour forcer un changement","terraform destroy complet"],"bonne":0},
  {"id":"tf-s-adopt","lvl":8,"dom":"Terraform","q":"Un resource group historique a été créé au portail. Tu veux le gérer avec Terraform SANS le recréer. Que fais-tu ?","explain":"Import = adoption dans le state. Un data source ne fait que LIRE — il ne gère pas. Après import, itérer sur la config jusqu'à un plan vide.","choix":["Écrire le bloc resource + bloc import { to, id } (ou terraform import), puis plan jusqu'à zéro diff","Le supprimer et le recréer via Terraform","Copier son JSON dans le state","Un data source suffit pour le gérer"],"bonne":0},
  {"id":"tf-s-rename","lvl":9,"dom":"Terraform","q":"Tu renommes azurerm_storage_account.old en .main dans le code. Sans précaution, que fera le prochain apply ?","explain":"Terraform raisonne par adresse : nouveau nom = nouvelle ressource. moved (ou state mv) préserve l'objet réel lors du refactoring.","choix":["Détruire l'ancienne et en créer une nouvelle — d'où le bloc moved { from, to } pour l'éviter","Rien, Terraform détecte le renommage","Une erreur de syntaxe","Un simple update en place"],"bonne":0},
  {"id":"tf-s-envs","lvl":7,"dom":"Terraform","q":"Même infra en dev, staging et prod avec des tailles différentes. Approche idiomatique ?","explain":"Le module porte la logique commune ; chaque env a son state isolé et ses valeurs (dev.tfvars…). Blast radius limité.","choix":["Un module commun + un state par environnement (workspaces CLI ou dossiers) + tfvars par env","Copier-coller la config trois fois","Trois branches Git","Un seul state pour tout"],"bonne":0},
  {"id":"tf-s-debug","lvl":9,"dom":"Terraform","q":"Un provider échoue avec un message obscur. Comment obtenir le détail des appels API ?","explain":"TRACE montre les requêtes/réponses des providers. TF_LOG_PROVIDER cible les seuls providers.","choix":["TF_LOG=TRACE (et TF_LOG_PATH pour fichier) puis rejouer la commande","Relancer apply en boucle","Réinstaller Terraform","Supprimer le state"],"bonne":0},
  {"id":"tf-s-pr-plan","lvl":7,"dom":"Terraform","q":"L'équipe veut voir le plan de chaque pull request AVANT le merge, automatiquement. Quelle solution native ?","explain":"Le VCS-driven workflow d'HCP Terraform : plan spéculatif (non applicable) sur chaque PR, apply au merge, avec approbations.","choix":["HCP Terraform avec intégration VCS : speculative plans postés sur les PR","Chacun lance plan sur sa machine","Un cron qui applique la nuit","Vérifier après le merge"],"bonne":0},
  {"id":"tf-s-private-mod","lvl":8,"dom":"Terraform","q":"Partager des modules internes (non publics) avec versionning à toute l'entreprise. Quelle solution ?","explain":"Le private registry donne la découverte, la doc générée et le versionning semver — sans exposer le code publiquement.","choix":["Le private registry d'HCP Terraform (ou sources git internes versionnées par tag)","Les publier sur le registry public","Un dossier partagé réseau","Copier-coller entre projets"],"bonne":0},
  {"id":"tf-s-pin","lvl":9,"dom":"Terraform","q":"Un upgrade surprise du provider a cassé la prod. Comment éviter que ça se reproduise ?","explain":"La contrainte pessimiste évite les sauts majeurs ; le lock file fige les versions exactes pour toute l'équipe et la CI. Upgrade choisi = init -upgrade.","choix":["Contrainte ~> dans required_providers + committer .terraform.lock.hcl","Ne plus jamais faire init","Copier le provider dans le repo","Supprimer les contraintes de version"],"bonne":0},
  {"id":"tf-s-partial-backend","lvl":7,"dom":"Terraform","q":"Tu ne veux PAS committer la clé du backend dans le bloc backend {}. Comment la fournir ?","explain":"Le bloc backend N'ACCEPTE PAS les variables (piège !). La solution : backend partiel + -backend-config au init.","choix":["Configuration partielle : terraform init -backend-config=... (fichier ou clé=valeur)","En dur dans le .tf, c'est obligatoire","Dans terraform.tfvars","Les variables var.* fonctionnent dans le bloc backend"],"bonne":0},
  {"id":"tf-s-output-share","lvl":8,"dom":"Terraform","q":"La config « app » a besoin de l'ID du VNet créé par la config « network » (states séparés). Solution idiomatique ?","explain":"terraform_remote_state expose les outputs d'une autre config. Alternative découplée : un data source qui retrouve la ressource par nom/tags.","choix":["data \"terraform_remote_state\" pour lire les outputs de network (ou un data source azurerm classique)","Fusionner les deux states","Copier l'ID en dur","Un provisioner qui lit le fichier state"],"bonne":0},
  {"id":"tf-s-drift-detect","lvl":9,"dom":"Terraform","q":"Vérifier chaque nuit en CI que PERSONNE n'a modifié l'infra à la main — sans rien changer. Quelle commande ?","explain":"Un plan nocturne + exit code = alerte de drift. HCP Terraform propose aussi les health assessments (drift detection) managés.","choix":["terraform plan -detailed-exitcode (code 2 = drift) ou plan -refresh-only","terraform apply -auto-approve","terraform validate","terraform fmt -check"],"bonne":0},
  {"id":"tf-s-vm-size-map","lvl":7,"dom":"Terraform","q":"La taille de VM dépend de l'environnement (dev → B1s, prod → D4s). Quelle approche idiomatique ?","explain":"size = var.sizes[var.env] (ou lookup avec défaut). Les maps de configuration par environnement sont un pattern central.","choix":["Une map { dev = \"Standard_B1s\", prod = \"Standard_D4s\" } indexée par var.env ou lookup()","Trois fichiers main.tf","Un if/else de blocs resource","Modifier à la main après apply"],"bonne":0},
  {"id":"tf-s-upgrade-tf","lvl":8,"dom":"Terraform","q":"Ton binaire local est en 1.7, un collègue en 1.9 : vos plans divergent. Comment stabiliser ?","explain":"required_version = \"~> 1.9.0\" fait échouer les binaires non conformes — l'équipe converge. La CI devient l'arbitre.","choix":["required_version dans le bloc terraform + un gestionnaire de versions (tenv/tfenv) ou la CI comme référence","Chacun garde sa version","Toujours prendre la plus vieille","Désinstaller Terraform"],"bonne":0},
  {"id":"tf-s-count-shift","lvl":9,"dom":"Terraform","q":"Tu retires le 1er élément d'une liste utilisée avec count = length(var.list). Que va proposer le plan ?","explain":"count[1] devient count[0], etc. → cascade de remplacements. C'est LA raison de préférer for_each (clés stables).","choix":["Recréer/déplacer TOUTES les ressources suivantes (les index se décalent)","Supprimer seulement la 1re","Aucun changement","Une erreur"],"bonne":0},
  {"id":"tf-s-local-exec","lvl":7,"dom":"Terraform","q":"Tu dois ABSOLUMENT lancer un script après création d'une ressource (aucune alternative). Quelle option, en gardant les bonnes pratiques ?","explain":"local-exec/remote-exec existent pour ces cas limites. L'examen attend que tu saches QUE c'est possible ET que c'est déconseillé.","choix":["provisioner \"local-exec\" sur la ressource — en sachant que c'est un dernier recours non idempotent","Un second apply","Modifier le state à la main","Un output qui exécute le script"],"bonne":0},
  {"id":"tf-s-relance-echec","lvl":8,"dom":"Terraform","q":"Un apply échoue à mi-parcours (30 ressources sur 50 créées). Que fait le prochain apply ?","explain":"Terraform est idempotent : les ressources déjà créées (dans le state) sont conservées ; le plan ne propose que le manquant. Les ressources « tainted » partiellement créées seront remplacées.","choix":["Il reprend là où c'était rendu : les 30 sont dans le state, il ne crée que le reste","Il détruit tout et recommence","Il échoue tant qu'on n'a pas nettoyé","Il duplique les 30 premières"],"bonne":0},
  {"id":"tf-c-ref","lvl":5,"dom":"Terraform","q":"Complète la référence au nom du resource group :","explain":"Syntaxe : <type>.<nom_local>.<attribut>. Cette référence crée aussi la dépendance implicite (RG créé avant le storage).","choix":["azurerm_resource_group.rg.name","rg.name","resource.rg.name","var.rg.name"],"bonne":0},
  {"id":"tf-c-foreach-each","lvl":6,"dom":"Terraform","q":"Complète pour obtenir « dev », « staging », « prod » :","explain":"Avec un set, each.key == each.value. Avec une map : each.key = la clé, each.value = la valeur. (each.index n'existe pas !)","choix":["key","value uniquement","index","item"],"bonne":0},
  {"id":"tf-c-locals-ref","lvl":6,"dom":"Terraform","q":"Complète la référence à la valeur locale :","explain":"Déclaration au pluriel (locals {}), référence au singulier (local.prefix) — piège de syntaxe très fréquent.","choix":["local","locals","var","this"],"bonne":0},
  {"id":"tf-csA-backend","lvl":9,"dom":"Terraform","q":"Quelle est la PREMIÈRE amélioration à mettre en place pour l'équipe ?","explain":"Le state local multiplié par 4 devs = conflits garantis. Backend distant + locking est le prérequis de toute collaboration.","choix":["Un backend distant avec verrouillage (azurerm ou HCP Terraform) remplaçant les states locaux","Passer tout le monde sur la même machine","Un state par développeur","Committer le state dans Git"],"bonne":0},
  {"id":"tf-csA-secrets","lvl":7,"dom":"Terraform","q":"Comment traiter les secrets DB présents dans le state ?","explain":"Le state contient les secrets en clair quoi qu'il arrive : c'est le BACKEND qu'on sécurise. sensitive ne protège que l'affichage.","choix":["Chiffrement au repos du backend + accès restreint (RBAC) + state hors Git + sensitive sur les outputs","sensitive = true suffit, le state est alors chiffré","Les mettre en commentaire","Les stocker dans le README"],"bonne":0},
  {"id":"tf-csA-envs","lvl":8,"dom":"Terraform","q":"Comment séparer proprement dev et prod ?","explain":"Un state par env = blast radius limité : casser dev ne touche jamais prod. Les tfvars portent les différences (tailles, SKUs).","choix":["Deux states isolés (workspaces CLI ou dossiers) + fichiers tfvars par environnement","Un booléen is_prod dans un state unique","Deux comptes Azure obligatoirement","Renommer les ressources à la main"],"bonne":0},
  {"id":"tf-csA-review","lvl":9,"dom":"Terraform","q":"Comment garantir qu'aucun apply ne parte sans revue ?","explain":"Le VCS-driven workflow rend la PR obligatoire : le plan est visible dans la revue, l'apply est contrôlé et tracé.","choix":["HCP Terraform en mode VCS : speculative plan sur PR, apply après merge avec approbation","Faire confiance à l'équipe","Un mot de passe sur le laptop","Interdire terraform apply"],"bonne":0},
  {"id":"tf-csB-modules","lvl":7,"dom":"Terraform","q":"Comment diffuser les patterns standards (VNet, AKS, storage) à toutes les équipes ?","explain":"Modules + private registry = réutilisation avec versionning semver et doc auto-générée. Le copier-coller diverge en quelques semaines.","choix":["Des modules versionnés dans le private registry HCP Terraform","Un wiki avec du code à copier-coller","Un canal Teams","Chaque équipe réinvente"],"bonne":0},
  {"id":"cka-c-context","lvl":2,"dom":"Kubernetes","q":"Que contient un « context » dans un fichier kubeconfig ?","explain":"À l'examen, CHAQUE tâche commence par la commande de bascule de contexte : la lancer systématiquement évite de travailler sur le mauvais cluster.","choix":["Un triplet cluster + utilisateur + namespace par défaut","Uniquement l'adresse du cluster","Le token d'authentification","La liste des namespaces"],"bonne":0},
  {"id":"cka-c-ns","lvl":3,"dom":"Kubernetes","q":"Quelles ressources ne sont PAS namespacées ?","explain":"kubectl api-resources --namespaced=false donne la liste exacte. Piège classique : chercher un PV dans un namespace.","choix":["Node, PersistentVolume, StorageClass, ClusterRole, ClusterRoleBinding, Namespace lui-même","Pod et Service","ConfigMap et Secret","Deployment et ReplicaSet"],"bonne":0},
  {"id":"cka-c-rs","lvl":1,"dom":"Kubernetes","q":"Quelle est la relation entre Deployment, ReplicaSet et Pod ?","explain":"Chaque mise à jour crée un nouveau ReplicaSet ; les anciens sont conservés (revisionHistoryLimit) pour permettre kubectl rollout undo.","choix":["Le Deployment gère des ReplicaSets (un par version), qui gèrent les Pods — c'est ce qui permet le rollback","Le Pod gère le ReplicaSet","Ils sont indépendants","Le ReplicaSet gère des Deployments"],"bonne":0},
  {"id":"cka-c-job","lvl":1,"dom":"Kubernetes","q":"Quelle différence entre un Job et un CronJob ?","explain":"Job : completions, parallelism, backoffLimit. CronJob : schedule, concurrencyPolicy, successfulJobsHistoryLimit.","choix":["Le Job exécute une tâche jusqu'à complétion ; le CronJob crée des Jobs selon une planification","Le CronJob est plus rapide","Le Job est planifié","Aucune différence"],"bonne":0},
  {"id":"cka-c-svc-types","lvl":2,"dom":"Kubernetes","q":"Quels sont les types de Service et leur portée ?","explain":"Chaque type inclut le précédent : un NodePort a aussi une ClusterIP, un LoadBalancer a aussi un NodePort.","choix":["ClusterIP (interne), NodePort (port sur chaque nœud, 30000-32767), LoadBalancer (LB externe), ExternalName (alias DNS)","Internal, External, Hybrid","Public et Private","HTTP et TCP"],"bonne":0},
  {"id":"cka-c-headless","lvl":1,"dom":"Kubernetes","q":"Qu'est-ce qu'un Service « headless » et à quoi sert-il ?","explain":"clusterIP: None supprime le load balancing : app-0.monsvc.ns.svc.cluster.local pointe directement sur le pod. Base des StatefulSets.","choix":["Un Service avec clusterIP: None : le DNS renvoie les IP des pods individuellement, ce qui permet l'identité par réplique d'un StatefulSet","Un Service sans sélecteur","Un Service externe","Un Service sans port"],"bonne":0},
  {"id":"cka-c-endpoints","lvl":2,"dom":"Kubernetes","q":"Comment un Service sait-il vers quels pods envoyer le trafic ?","explain":"Un Service dont les Endpoints sont VIDES = selector qui ne correspond à aucun pod prêt. C'est LE premier réflexe de diagnostic réseau.","choix":["Par son selector, qui alimente automatiquement les EndpointSlices avec les IP des pods correspondants et prêts","Par une liste d'IP statique","Par le nom des pods","Par le namespace"],"bonne":0},
  {"id":"cka-c-ingress","lvl":3,"dom":"Kubernetes","q":"Un objet Ingress suffit-il à exposer une application en HTTP ?","explain":"L'Ingress n'est qu'une déclaration de règles. Sans contrôleur, rien ne se passe. Depuis peu, la Gateway API est l'évolution de ce modèle (et sa doc est autorisée à l'examen).","choix":["Non — il faut aussi un Ingress Controller (nginx, traefik…) déployé dans le cluster pour appliquer les règles","Oui, c'est autonome","Oui, si le Service est en NodePort","Non, il faut un LoadBalancer cloud"],"bonne":0},
  {"id":"cka-c-dns-format","lvl":3,"dom":"Réseau","q":"Quel est le FQDN d'un Service « web » dans le namespace « prod » ?","explain":"<service>.<namespace>.svc.cluster.local. Depuis le même namespace, « web » suffit ; depuis un autre, « web.prod ».","choix":["web.prod.svc.cluster.local","prod.web.svc.cluster.local","web.svc.prod.cluster.local","cluster.local.prod.web"],"bonne":0},
  {"id":"cka-c-netpol-default","lvl":1,"dom":"Kubernetes","q":"Que se passe-t-il pour un pod dès qu'une NetworkPolicy le sélectionne ?","explain":"Sans policy, tout est autorisé. Dès qu'une policy cible un pod, la direction concernée (Ingress et/ou Egress) devient restrictive. Il faut aussi un CNI qui les supporte (Calico, Cilium — pas Flannel seul).","choix":["Il passe en mode « deny par défaut » pour les directions concernées : seul ce qui est explicitement autorisé passe","Rien ne change tant qu'on n'ajoute pas de deny","Tout le trafic est bloqué définitivement","Seul l'egress est affecté"],"bonne":0},
  {"id":"cka-c-pv-pvc","lvl":2,"dom":"SQL","q":"Quelle est la relation entre PV, PVC et StorageClass ?","explain":"Statique : un admin crée le PV, le PVC s'y lie. Dynamique : le PVC référence une StorageClass qui crée le PV automatiquement.","choix":["Le PVC est la demande de l'utilisateur, le PV la ressource de stockage réelle, la StorageClass permet le provisionnement dynamique du PV","Le PV demande, le PVC fournit","La StorageClass remplace le PV","Ils sont interchangeables"],"bonne":0},
  {"id":"cka-c-accessmodes","lvl":3,"dom":"SQL","q":"Que signifient les access modes RWO, ROX et RWX ?","explain":"RWO = un NŒUD (pas un pod) — plusieurs pods du même nœud peuvent partager. RWX exige un stockage réseau (NFS, CephFS).","choix":["ReadWriteOnce (un nœud en lecture-écriture), ReadOnlyMany (plusieurs nœuds en lecture), ReadWriteMany (plusieurs nœuds en lecture-écriture)","Read Write Original, Read Only eXtended, Read Write eXtended","Trois niveaux de performance","Trois classes de chiffrement"],"bonne":0},
  {"id":"cka-c-reclaim","lvl":1,"dom":"SQL","q":"Que fait la reclaim policy « Retain » d'un PersistentVolume ?","explain":"Retain protège les données mais laisse le PV en Released, non réutilisable tel quel. Delete supprime le volume sous-jacent (défaut du provisionnement dynamique).","choix":["À la suppression du PVC, le PV et ses données sont CONSERVÉS (statut Released) et doivent être récupérés manuellement","Le PV est supprimé","Le PV est recyclé automatiquement","Le PV est archivé"],"bonne":0},
  {"id":"cka-c-probes","lvl":2,"dom":"Kubernetes","q":"Quelle différence entre liveness, readiness et startup probe ?","explain":"Confusion classique : un pod qui échoue sa readiness reste vivant mais ne reçoit plus de trafic. Une liveness mal réglée provoque des redémarrages en boucle.","choix":["Liveness : redémarre le conteneur s'il échoue. Readiness : retire le pod des Endpoints du Service. Startup : laisse le temps au démarrage avant d'activer les autres sondes","Elles sont équivalentes","Readiness redémarre le pod","Liveness retire du Service"],"bonne":0},
  {"id":"cka-c-requests-limits","lvl":3,"dom":"Kubernetes","q":"Quelle est la différence entre requests et limits ?","explain":"Le scheduler ne regarde que les requests. Dépasser la limite mémoire → OOMKilled ; dépasser la limite CPU → throttling (pas de kill).","choix":["requests = ce qui est RÉSERVÉ et sert au scheduling ; limits = le plafond maximal consommable","requests est le maximum","limits sert au scheduling","Ce sont des synonymes"],"bonne":0},
  {"id":"cka-c-qos","lvl":1,"dom":"Kubernetes","q":"Quelle classe de QoS reçoit un pod dont requests == limits pour CPU ET mémoire sur tous ses conteneurs ?","explain":"Guaranteed (dernier évincé), Burstable (requests < limits ou partiels), BestEffort (rien de défini, premier évincé en cas de pression mémoire).","choix":["Guaranteed","Burstable","BestEffort","Reserved"],"bonne":0},
  {"id":"cka-c-taint-toleration","lvl":2,"dom":"Kubernetes","q":"Quelle est la logique taint / toleration ?","explain":"Taint = répulsion (côté nœud), toleration = permission (côté pod). Pour ATTIRER un pod sur un nœud précis : nodeSelector ou nodeAffinity.","choix":["Le taint sur un NŒUD repousse les pods ; la toleration sur un POD lui permet d'y être placé — sans garantir qu'il y aille","Le taint attire les pods","La toleration force le placement","C'est équivalent à nodeSelector"],"bonne":0},
  {"id":"cka-c-taint-effects","lvl":3,"dom":"Kubernetes","q":"Quels sont les 3 effets possibles d'un taint ?","explain":"NoExecute est le plus radical : il EXPULSE aussi les pods déjà en cours qui ne tolèrent pas le taint.","choix":["NoSchedule, PreferNoSchedule, NoExecute","Block, Warn, Allow","Hard, Soft, Never","Deny, Prefer, Force"],"bonne":0},
  {"id":"cka-c-affinity","lvl":1,"dom":"Kubernetes","q":"Quelle différence entre requiredDuringScheduling et preferredDuringScheduling en node affinity ?","explain":"Un pod Pending avec un message d'affinité non satisfaite vient presque toujours d'une règle « required » trop restrictive.","choix":["required = règle stricte (pod Pending si non satisfaite) ; preferred = préférence pondérée, le pod est placé quand même","preferred est plus strict","required n'existe pas","Les deux sont équivalents"],"bonne":0},
  {"id":"cka-c-role-vs-clusterrole","lvl":3,"dom":"Sécurité","q":"Quelle est la différence entre Role et ClusterRole ?","explain":"Astuce : un ClusterRole lié par un RoleBinding n'accorde ses droits que DANS ce namespace — utile pour réutiliser un rôle standard.","choix":["Le Role est limité à un namespace ; le ClusterRole est global et couvre aussi les ressources non namespacées (nodes, PV)","Le Role est plus puissant","Le ClusterRole est déprécié","Aucune différence"],"bonne":0},
  {"id":"cka-c-drain-cordon","lvl":2,"dom":"Kubernetes","q":"Quelle différence entre cordon et drain ?","explain":"Séquence de maintenance : drain → intervention → uncordon. drain exige souvent --ignore-daemonsets et --delete-emptydir-data.","choix":["cordon marque le nœud unschedulable (les pods existants restent) ; drain fait cordon PUIS évince les pods existants","drain est plus doux","cordon supprime les pods","Ce sont des synonymes"],"bonne":0},
  {"id":"cka-y-affinity-key","lvl":9,"dom":"Kubernetes","q":"Complète pour une règle OBLIGATOIRE (pod Pending si aucun nœud ne correspond) :","explain":"Le suffixe IgnoredDuringExecution signifie que si le label du nœud change APRÈS le placement, le pod n'est pas expulsé.","choix":["requiredDuringSchedulingIgnoredDuringExecution","preferredDuringSchedulingIgnoredDuringExecution","requiredDuringExecution","mandatoryScheduling"],"bonne":0},
  {"id":"cka-y-topologyspread","lvl":7,"dom":"Kubernetes","q":"Complète le champ qui décide du comportement si la contrainte de répartition ne peut être respectée :","explain":"whenUnsatisfiable: DoNotSchedule (strict, pod Pending) ou ScheduleAnyway (préférence). Sert à répartir les répliques entre nœuds ou zones.","choix":["whenUnsatisfiable","onViolation","ifUnsatisfied","fallbackPolicy"],"bonne":0},
  {"id":"cka-y-env-cm","lvl":6,"dom":"Kubernetes","q":"Complète pour lire cette valeur depuis une ConfigMap :","explain":"configMapKeyRef pour UNE clé ; envFrom + configMapRef pour importer TOUTES les clés d'un coup. Équivalent Secret : secretKeyRef.","choix":["configMapKeyRef","configMapRef","configMap","fromConfigMap"],"bonne":0},
  {"id":"cka-y-secret-mount","lvl":8,"dom":"Kubernetes","q":"Complète le type de volume pour monter un Secret en fichiers :","explain":"Un Secret monté en volume se met à jour automatiquement (contrairement aux variables d'environnement, figées au démarrage du pod).","choix":["secret","secretRef","fromSecret","secretVolume"],"bonne":0},
  {"id":"cka-y-pvc-mount","lvl":6,"dom":"Kubernetes","q":"Complète pour monter un PersistentVolumeClaim :","explain":"Le pod référence toujours un PVC, jamais directement un PV. Le nom complet du champ est demandé — pas d'abréviation en YAML.","choix":["persistentVolumeClaim","pvc","persistentVolume","volumeClaim"],"bonne":0},
  {"id":"cka-y-pv-hostpath","lvl":9,"dom":"Kubernetes","q":"Quel access mode pour un volume monté en lecture-écriture par un SEUL nœud ?","explain":"RWO = un NŒUD (plusieurs pods du même nœud peuvent l'utiliser). ReadWriteOncePod, plus récent, restreint à UN SEUL pod.","choix":["ReadWriteOnce","ReadWriteMany","ReadOnlyMany","ReadWriteOncePod"],"bonne":0},
  {"id":"cka-y-sc-binding","lvl":7,"dom":"Kubernetes","q":"Complète le champ qui retarde la création du volume jusqu'à la planification du pod :","explain":"WaitForFirstConsumer évite qu'un volume soit créé dans une zone où le pod ne sera jamais placé. L'autre valeur est Immediate.","choix":["volumeBindingMode","bindingMode","volumeMode","provisioningMode"],"bonne":0},
  {"id":"cka-y-svc-ports","lvl":5,"dom":"Kubernetes","q":"Que représente « targetPort » ?","explain":"port = le Service, targetPort = le conteneur, nodePort = le port ouvert sur chaque nœud. Confondre port et targetPort est l'erreur la plus fréquente.","choix":["Le port sur lequel le CONTENEUR écoute","Le port exposé par le Service","Le port ouvert sur chaque nœud","Le port du load balancer"],"bonne":0},
  {"id":"cka-y-ingress-path","lvl":8,"dom":"Kubernetes","q":"Complète le champ obligatoire qui définit comment le chemin est comparé :","explain":"pathType est OBLIGATOIRE depuis networking.k8s.io/v1 : Prefix, Exact ou ImplementationSpecific. L'oublier fait échouer la création.","choix":["pathType","matchType","pathMode","rule"],"bonne":0},
  {"id":"cka-y-netpol-deny","lvl":9,"dom":"Kubernetes","q":"Que fait cette policy avec un podSelector vide et aucune règle ingress ?","explain":"podSelector: {} = tous les pods du namespace. Aucune règle ingress = rien n'est autorisé. C'est le manifeste deny-all de référence.","choix":["Elle bloque TOUT le trafic entrant vers TOUS les pods du namespace (deny-all ingress)","Elle autorise tout","Elle ne fait rien","Elle bloque uniquement l'egress"],"bonne":0},
  {"id":"cka-y-netpol-from","lvl":7,"dom":"Kubernetes","q":"Complète le sélecteur ciblant des NAMESPACES entiers :","explain":"Piège majeur : namespaceSelector et podSelector dans le MÊME élément de liste = ET logique ; dans deux éléments séparés (deux tirets) = OU logique.","choix":["namespaceSelector","podSelector","ipBlock","nsSelector"],"bonne":0},
  {"id":"cka-y-rbac-rule","lvl":6,"dom":"Kubernetes","q":"Complète le champ qui vaut chaîne vide pour les ressources du groupe core (pods, services…) :","explain":"apiGroups: [\"\"] = groupe core (v1). Pour les Deployments : apiGroups: [\"apps\"]. Se tromper de groupe est une cause d'échec fréquente.","choix":["apiGroups","apiVersion","groups","api"],"bonne":0},
  {"id":"cka-y-sts-volumeclaim","lvl":8,"dom":"Kubernetes","q":"Complète le champ qui crée un PVC dédié par réplique :","explain":"Chaque réplique obtient son propre PVC (data-web-0, data-web-1…), conservé même si le pod est supprimé — d'où la persistance.","choix":["volumeClaimTemplates","volumeClaims","persistentVolumeClaims","claimTemplates"],"bonne":0},
  {"id":"cka-y-deploy-strategy","lvl":5,"dom":"Kubernetes","q":"Complète le champ garantissant qu'aucune réplique n'est indisponible pendant la mise à jour :","explain":"maxUnavailable: 0 + maxSurge: 1 = on crée d'abord, on supprime ensuite : zéro perte de capacité. L'autre type de stratégie est Recreate.","choix":["maxUnavailable","minAvailable","maxDown","minReady"],"bonne":0},
  {"id":"cka-y-securitycontext","lvl":9,"dom":"Kubernetes","q":"Complète le champ qui refuse le démarrage si l'image tente de tourner en root :","explain":"runAsNonRoot: true fait échouer le conteneur au démarrage si l'UID est 0. À placer au niveau du pod ou du conteneur.","choix":["runAsNonRoot","noRoot","denyRoot","privileged: false"],"bonne":0},
  {"id":"cka-y-resourcequota","lvl":7,"dom":"Kubernetes","q":"Quel objet plafonne la consommation totale d'un NAMESPACE ?","explain":"ResourceQuota = plafond global du namespace. LimitRange = valeurs par défaut et bornes par POD/conteneur. Les deux sont complémentaires.","choix":["ResourceQuota","LimitRange","PodDisruptionBudget","PriorityClass"],"bonne":0},
  {"id":"cka-y-limitrange","lvl":8,"dom":"Kubernetes","q":"Complète le champ qui attribue des requests par DÉFAUT aux conteneurs qui n'en déclarent pas :","explain":"« default » fixe les limits par défaut, « defaultRequest » les requests. Utile quand un ResourceQuota exige que tout pod déclare ses ressources.","choix":["defaultRequest","default","min","defaultLimit"],"bonne":0},
  {"id":"cka-y-cronjob-concurrency","lvl":9,"dom":"Kubernetes","q":"Complète le champ empêchant qu'une nouvelle exécution démarre si la précédente tourne encore :","explain":"concurrencyPolicy : Allow (défaut), Forbid (saute l'exécution), Replace (tue l'ancienne). Question classique sur les jobs qui se chevauchent.","choix":["concurrencyPolicy","parallelism","suspend","backoffLimit"],"bonne":0},
  {"id":"cka-y-static-pod-check","lvl":7,"dom":"Kubernetes","q":"Comment appliquer une modification de ce fichier ?","explain":"Le kubelet surveille ce dossier en permanence. Une ERREUR de syntaxe fait disparaître le pod : d'où l'importance de sauvegarder une copie AVANT de modifier.","choix":["Il suffit de sauvegarder : le kubelet détecte le changement et recrée le pod automatiquement","Lancer kubectl apply -f","Redémarrer le nœud","Exécuter systemctl restart kube-apiserver"],"bonne":0},
  {"id":"cka-d-netpol","lvl":6,"dom":"Kubernetes","q":"Tu dois écrire une NetworkPolicy complexe. Quelle est la page de doc la plus rentable ?","explain":"Cette page contient un manifeste complet avec ingress ET egress, podSelector, namespaceSelector et ipBlock : il suffit d'adapter. À repérer AVANT l'examen.","choix":["Concepts → Services, Load Balancing, and Networking → Network Policies (elle contient des exemples complets copiables)","La page Ingress","La référence de l'API","Le blog Kubernetes"],"bonne":0},
  {"id":"cka-d-etcd","lvl":4,"dom":"Kubernetes","q":"Où trouver rapidement la commande exacte de snapshot etcd avec ses certificats ?","explain":"Mieux encore : apprends les 3 chemins de certificats par cœur. Chercher cette page coûte 2 minutes que tu n'as pas.","choix":["Tasks → Administer a Cluster → Operating etcd clusters for Kubernetes","Concepts → Cluster Architecture","Reference → kubectl","Setup → Production environment"],"bonne":0},
  {"id":"cka-d-upgrade","lvl":5,"dom":"Kubernetes","q":"Où trouver la procédure complète de montée de version d'un cluster kubeadm ?","explain":"Cette page donne les commandes exactes dans l'ordre, control plane puis workers. Un signet mental indispensable.","choix":["Tasks → Administer a Cluster → Upgrading kubeadm clusters","Setup → Installing kubeadm","Concepts → Overview","Reference → kubeadm init"],"bonne":0},
  {"id":"cka-d-pv","lvl":6,"dom":"Kubernetes","q":"Où trouver un exemple de PersistentVolume et de PersistentVolumeClaim à copier ?","explain":"Le tutoriel contient les trois manifestes complets (PV, PVC, Pod) : c'est le plus rapide à adapter en conditions d'examen.","choix":["Concepts → Storage → Persistent Volumes, ou le tutoriel « Configure a Pod to Use a PersistentVolume »","Reference → API Overview","Tasks → Manage Secrets","Concepts → Workloads"],"bonne":0},
  {"id":"cka-d-rbac","lvl":4,"dom":"Kubernetes","q":"Où trouver des exemples de Role et RoleBinding prêts à copier ?","explain":"La page RBAC contient une longue série d'exemples commentés. Mais kubectl create role/rolebinding --dry-run=client -o yaml reste plus rapide.","choix":["Reference → Access Authn Authz → RBAC Authorization","Concepts → Security","Tasks → Configure Pods","Setup → Best practices"],"bonne":0},
  {"id":"cka-d-search","lvl":5,"dom":"Kubernetes","q":"Quelle est la règle exacte concernant la recherche pendant l'examen ?","explain":"Un seul onglet supplémentaire, et uniquement kubernetes.io/docs, /blog, helm.sh/docs et gateway-api.sigs.k8s.io. Ouvrir un lien StackOverflow depuis la recherche = infraction.","choix":["La recherche du site kubernetes.io est autorisée, mais il est interdit d'ouvrir un résultat pointant vers un site externe","Toute recherche est interdite","Google est autorisé","On peut ouvrir 3 onglets"],"bonne":0},
  {"id":"cka-d-explain","lvl":6,"dom":"Kubernetes","q":"Tu as oublié le nom exact d'un champ YAML. Quel est le moyen le PLUS rapide de le retrouver ?","explain":"Zéro changement de fenêtre, zéro latence réseau. kubectl explain pod.spec.containers.livenessProbe donne la structure exacte et les types.","choix":["kubectl explain <ressource>.spec --recursive directement dans le terminal","Chercher dans la doc en ligne","Regarder un exemple sur le blog","Deviner puis tester"],"bonne":0},
  {"id":"cka-t-pending","lvl":4,"dom":"Kubernetes","q":"Un pod reste indéfiniment en état « Pending ». Quelles sont les causes les plus probables ?","explain":"Pending = le SCHEDULER n'a trouvé aucun nœud. La réponse est toujours dans kubectl describe pod, section Events.","choix":["Ressources insuffisantes sur les nœuds, taint non toléré, nodeSelector/affinité non satisfaits, ou PVC non lié","L'image est introuvable","L'application plante au démarrage","Le Service est mal configuré"],"bonne":0},
  {"id":"cka-t-imagepull","lvl":6,"dom":"Kubernetes","q":"Un pod affiche « ImagePullBackOff ». Quelles causes envisager ?","explain":"ErrImagePull puis ImagePullBackOff (backoff exponentiel). describe donne le message exact du runtime : « not found » vs « unauthorized ».","choix":["Nom ou tag d'image erroné, registre privé sans imagePullSecret, ou pas d'accès réseau au registre","Manque de mémoire","Sonde liveness en échec","Le nœud est cordonné"],"bonne":0},
  {"id":"cka-t-crashloop","lvl":4,"dom":"Kubernetes","q":"Un pod est en « CrashLoopBackOff ». Quelle est la première commande à lancer ?","explain":"Le conteneur actuel vient de redémarrer : ses logs sont vides. --previous donne la vraie cause. Autre piste : une livenessProbe trop agressive.","choix":["kubectl logs <pod> --previous, pour voir pourquoi l'instance précédente est morte","kubectl delete pod","kubectl describe node","kubectl top pod"],"bonne":0},
  {"id":"cka-t-oomkilled","lvl":5,"dom":"Kubernetes","q":"Le describe d'un pod indique « Last State: Terminated, Reason: OOMKilled ». Que s'est-il passé ?","explain":"Dépasser la limite MÉMOIRE tue le conteneur ; dépasser la limite CPU ne fait que le ralentir (throttling). Distinction souvent testée.","choix":["Le conteneur a dépassé sa limite mémoire et a été tué par le noyau — il faut augmenter limits.memory ou corriger la fuite","Le nœud a redémarré","L'image est corrompue","Le disque est plein"],"bonne":0},
  {"id":"cka-t-init-error","lvl":6,"dom":"Kubernetes","q":"Un pod reste bloqué en « Init:0/1 ». Que se passe-t-il ?","explain":"Les conteneurs principaux ne démarrent JAMAIS tant que tous les initContainers ne se sont pas terminés en succès.","choix":["Le premier initContainer ne s'est pas terminé avec succès — il faut lire ses logs avec kubectl logs <pod> -c <init-container>","Le pod manque de mémoire","L'image principale est introuvable","Le Service n'a pas d'Endpoints"],"bonne":0},
  {"id":"cka-t-evicted","lvl":8,"dom":"Kubernetes","q":"Plusieurs pods passent en état « Evicted ». Quelle est la cause typique ?","explain":"Vérifier les conditions du nœud : DiskPressure, MemoryPressure. La classe de QoS détermine l'ordre d'éviction : BestEffort, puis Burstable, puis Guaranteed.","choix":["Le kubelet a expulsé des pods à cause d'une pression sur les ressources du nœud (disque plein, mémoire) — les BestEffort partent en premier","Une NetworkPolicy les bloque","Le Deployment a été supprimé","Le Service est mal configuré"],"bonne":0},
  {"id":"cka-t-svc-noendpoint","lvl":5,"dom":"Réseau","q":"Un Service ne répond pas et « kubectl get endpoints » renvoie une liste vide. Que vérifier ?","explain":"Endpoints vide = aucun pod prêt ne correspond au selector. Comparer avec kubectl get pods --show-labels. Un pod 0/1 READY n'est jamais dans les Endpoints.","choix":["Que le selector du Service correspond exactement aux labels des pods, et que les pods sont READY (readinessProbe)","La configuration DNS","Le NodePort","Les règles iptables"],"bonne":0},
  {"id":"cka-t-dns-fail","lvl":9,"dom":"Réseau","q":"AUCUN pod du cluster n'arrive à résoudre les noms de services. Où regarder en priorité ?","explain":"Panne DNS GLOBALE = CoreDNS. Panne sur un seul service = selector ou Endpoints. Le périmètre du symptôme oriente le diagnostic.","choix":["Les pods CoreDNS dans kube-system (Running ? logs ?) et le Service kube-dns","Les NetworkPolicies de chaque namespace","Le fichier /etc/hosts des nœuds","Les certificats de l'API server"],"bonne":0},
