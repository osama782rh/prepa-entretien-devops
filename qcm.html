  {"id":"awsd-c-buildspec-ecr","lvl":8,"dom":"AWS","q":"Quelle variable d'environnement CodeBuild identifie de façon unique la version du code buildé (souvent utilisée comme tag d'image) ?","explain":"CODEBUILD_RESOLVED_SOURCE_VERSION = le SHA du commit : tag d'image traçable jusqu'au code source. CODEBUILD_BUILD_NUMBER est un simple compteur.","choix":["RESOLVED_SOURCE_VERSION","BUILD_NUMBER","SOURCE_REPO","PROJECT_NAME"],"bonne":0},
  {"id":"awsd-c-cfn-getatt","lvl":6,"dom":"Terraform","q":"Complète la fonction qui récupère un attribut précis d'une ressource :","explain":"!GetAtt ressource.attribut. !Ref MonBucket renverrait le NOM du bucket, pas son ARN.","choix":["GetAtt","Ref","Sub","ImportValue"],"bonne":0},
  {"id":"awsd-c-cfn-creationpolicy","lvl":8,"dom":"Terraform","q":"Quelle commande l'instance doit-elle exécuter pour signaler qu'elle est prête ?","explain":"Sans cfn-signal, CloudFormation attend jusqu'au timeout puis échoue. cfn-init applique la config, cfn-signal notifie, cfn-hup surveille les changements.","choix":["cfn-signal","cfn-init","cfn-hup","cfn-get-metadata"],"bonne":0},
  {"id":"awsd-c-cfn-dynamic","lvl":9,"dom":"Terraform","q":"Complète la dynamic reference vers un secret à rotation automatique :","explain":"Trois dynamic references : ssm (paramètre standard), ssm-secure (SecureString) et secretsmanager (avec rotation). Aucun secret n'apparaît dans le template.","choix":["secretsmanager","ssm","ssm-secure","kms"],"bonne":0},
  {"id":"awsd-c-iam-condition","lvl":8,"dom":"Sécurité","q":"Complète l'élément qui rend cette règle applicable uniquement en HTTP non chiffré :","explain":"Cette policy classique refuse tout accès S3 hors HTTPS. aws:SecureTransport est une clé de condition globale à connaître.","choix":["Condition","Principal","Sid","NotAction"],"bonne":0},
  {"id":"awsd-c-iam-oidc","lvl":9,"dom":"Sécurité","q":"Complète le claim qui restreint la confiance à un dépôt et une branche précis :","explain":"Le claim « sub » identifie précisément le workflow. L'oublier (ou mettre *) laisserait N'IMPORTE quel dépôt GitHub assumer ton rôle — faille critique.","choix":["sub","iss","jti","azp"],"bonne":0},
  {"id":"awsd-c-scp-region","lvl":7,"dom":"AWS","q":"Complète l'effet de cette SCP qui restreint l'usage aux régions européennes :","explain":"Une SCP restrictive utilise Deny. Les services globaux (IAM, Organizations, Support) sont exclus via NotAction, sinon on casse le compte.","choix":["Deny","Allow","Block","Restrict"],"bonne":0},
  {"id":"awsd-c-eventbridge-pattern","lvl":8,"dom":"AWS","q":"Complète la clé qui identifie le type d'événement :","explain":"source + detail-type + detail = le trio du pattern EventBridge. Ce pattern précis alerte sur tout échec de pipeline.","choix":["detail-type","event-name","type","action"],"bonne":0},
  {"id":"awsd-c-eventbridge-schedule","lvl":5,"dom":"AWS","q":"Complète le type d'expression de planification :","explain":"Le cron EventBridge a 6 champs (min heure jour-du-mois mois jour-semaine année) et impose un « ? » sur l'un des deux champs de jour. rate(5 minutes) pour les intervalles simples.","choix":["cron","rate","schedule","timer"],"bonne":0},
  {"id":"awsd-c-logs-insights","lvl":6,"dom":"AWS","q":"Complète l'opérateur d'agrégation de CloudWatch Logs Insights :","explain":"C'est « stats » en Logs Insights (« summarize », c'est le KQL d'Azure Monitor — piège si tu prépares les deux certifications).","choix":["stats","summarize","group","aggregate"],"bonne":0},
  {"id":"awsd-c-ssm-param-cli","lvl":5,"dom":"AWS","q":"Complète le type de paramètre chiffré par KMS :","explain":"Les 3 types : String, StringList, SecureString. À la lecture, il faut --with-decryption ET la permission kms:Decrypt.","choix":["SecureString","String","StringList","Encrypted"],"bonne":0},
  {"id":"awsd-c-ecs-taskdef","lvl":8,"dom":"AWS","q":"Complète la clé qui référence le secret injecté dans le conteneur :","explain":"« secrets » avec valueFrom injecte depuis Secrets Manager ou Parameter Store au démarrage — la valeur n'apparaît jamais dans la task definition.","choix":["valueFrom","value","secretArn","source"],"bonne":0},
  {"id":"awsd-c-s3-lifecycle","lvl":6,"dom":"AWS","q":"Quelle classe de stockage pour archiver des logs consultés très rarement, au coût le plus bas avec restauration en quelques heures ?","explain":"Standard-IA pour l'accès occasionnel immédiat ; Glacier/Deep Archive pour l'archivage long terme avec délai de restauration. 2555 jours ≈ 7 ans de rétention.","choix":["GLACIER (ou DEEP_ARCHIVE pour encore moins cher)","STANDARD_IA","INTELLIGENT_TIERING","STANDARD"],"bonne":0},
  {"id":"awsd-c-cfn-guard","lvl":9,"dom":"AWS","q":"Complète l'opérateur CloudFormation Guard vérifiant que la propriété est définie :","explain":"CloudFormation Guard (policy-as-code) évalue les templates AVANT déploiement dans le pipeline — le shift left appliqué à l'IaC.","choix":["exists","== true","is set","required"],"bonne":0},
  {"id":"awsd-csA-pipeline","lvl":9,"dom":"AWS","q":"Quelle première action apporte le plus de valeur à Riverstone ?","explain":"On sécurise l'entrée du code avant d'accélérer la sortie. Automatiser le déploiement sans CI fiable revient à livrer des défauts plus vite.","choix":["Un pipeline CodePipeline déclenché par EventBridge : build et tests automatisés dans CodeBuild, avec artefact unique publié","Automatiser d'abord le déploiement en production","Migrer vers Kubernetes","Recruter une équipe DevOps séparée"],"bonne":0},
  {"id":"awsd-csA-deploy","lvl":7,"dom":"AWS","q":"Les déploiements provoquent 20 minutes d'indisponibilité. Quelle stratégie sur leur ASG derrière un ALB ?","explain":"Le blue/green supprime l'indisponibilité et offre un rollback immédiat par bascule de target group — sans fenêtre de maintenance.","choix":["CodeDeploy blue/green (ou rolling avec min 100 % de capacité) avec des health checks ELB et un rollback sur alarme","Déployer la nuit pour limiter l'impact","Prévenir les utilisateurs par e-mail","Doubler la taille des instances"],"bonne":0},
  {"id":"awsd-csB-baseline","lvl":7,"dom":"AWS","q":"Comment appliquer automatiquement la baseline de sécurité aux 60 comptes ET aux comptes créés ensuite ?","explain":"L'auto-deployment garantit qu'aucun compte n'échappe à la baseline, y compris ceux créés après coup — exactement l'exigence exprimée.","choix":["Des StackSets service-managed avec auto-deployment sur les OU, orchestrés par AWS Control Tower","Un script exécuté à chaque création de compte","Un template partagé que chaque équipe applique","Une AMI standardisée"],"bonne":0},
  {"id":"awsd-csB-evidence","lvl":9,"dom":"AWS","q":"L'auditeur demande la preuve de conformité continue sur 12 mois. Que fournis-tu ?","explain":"Config apporte l'historique dans le TEMPS, CloudTrail le « qui a fait quoi », Object Lock garantit l'inaltérabilité des preuves.","choix":["L'historique de conformité AWS Config via un agrégateur multi-comptes, plus les logs d'un organization trail CloudTrail avec validation d'intégrité, conservés en S3 Object Lock","Des exports de la console","Les templates CloudFormation versionnés","Un rapport Security Hub du jour"],"bonne":0},
  {"id":"awsd-csB-remediate","lvl":7,"dom":"AWS","q":"Un bucket S3 rendu public doit être corrigé en moins de 5 minutes, sans intervention humaine.","explain":"Config évalue à chaque changement de configuration et déclenche la remédiation. En prévention, on ajoute S3 Block Public Access verrouillé par SCP.","choix":["Règle AWS Config avec remédiation automatique par runbook SSM Automation, plus notification SNS à l'équipe sécurité","Une revue quotidienne","Un ticket automatique","Un rapport Trusted Advisor hebdomadaire"],"bonne":0},
  {"id":"awsd-csC-canary","lvl":8,"dom":"AWS","q":"Meridian veut livrer plusieurs fois par jour sans exposer tous ses clients au risque. Quelle approche ?","explain":"Séparer le déploiement (canary) de l'activation (feature flags) donne deux niveaux de maîtrise du risque, avec coupure en secondes.","choix":["Déploiement canary CodeDeploy (Lambda/ECS) piloté par des alarmes CloudWatch, complété par des feature flags AppConfig pour activer progressivement","Un déploiement all-at-once avec rollback manuel","Livrer une fois par semaine","Doubler les tests de préproduction"],"bonne":0},
  {"id":"awsd-csC-logs","lvl":7,"dom":"AWS","q":"La facture CloudWatch Logs a triplé en 6 mois. Quelles actions ?","explain":"La rétention par défaut est INFINIE : c'est la cause n°1. L'ingestion et le stockage étant facturés séparément, on agit sur les deux.","choix":["Définir des rétentions par log group, exporter l'historique vers S3 avec lifecycle Glacier, réduire la verbosité, et privilégier metric filters et EMF","Désactiver les logs des services non critiques","Passer tous les logs en DEBUG","Supprimer les log groups anciens à la main"],"bonne":0},
  {"id":"awsd-csC-scale","lvl":8,"dom":"AWS","q":"Les pics de trafic du lundi matin saturent la plateforme avant que l'Auto Scaling ne réagisse.","explain":"Un pic PRÉVISIBLE se traite par anticipation, pas par réaction. Predictive scaling apprend le motif et provisionne avant l'arrivée de la charge.","choix":["Predictive scaling (motif hebdomadaire récurrent) ou scheduled scaling, complétés par des warm pools et une AMI dorée pour accélérer la mise en service","Augmenter la capacité désirée en permanence","Réduire le seuil de CPU à 20 %","Passer en instances plus grosses"],"bonne":0},
  {"id":"awsd-csC-dr","lvl":9,"dom":"AWS","q":"Meridian exige un RTO de 15 minutes en cas de panne régionale, avec un budget maîtrisé.","explain":"Backup & restore et pilot light dépassent 15 min ; l'actif/actif tiendrait mais double la facture. Warm standby est le compromis attendu.","choix":["Warm standby : environnement réduit mais actif en région secondaire, données répliquées en continu, montée en échelle et bascule Route 53 au basculement","Backup & restore depuis S3","Multi-site actif/actif","Pilot light avec restauration de snapshots"],"bonne":0},
  {"id":"clf-co-def","lvl":2,"dom":"AWS","q":"Qu'est-ce que le cloud computing selon AWS ?","explain":"À la demande + via Internet + paiement à l'usage : les trois piliers de la définition. Plus besoin d'acheter ni de dimensionner à l'avance.","choix":["La fourniture à la demande de ressources informatiques via Internet, avec une tarification à l'usage","L'achat de serveurs pour son datacenter","Un logiciel de virtualisation","Un réseau privé d'entreprise"],"bonne":0},
  {"id":"clf-co-benefits","lvl":5,"dom":"AWS","q":"Parmi les 6 avantages du cloud mis en avant par AWS, lequel décrit « remplacer les dépenses d'investissement par des dépenses variables » ?","explain":"Trade capital expense for variable expense : le CapEx devient OpEx. Les 6 avantages officiels reviennent souvent à l'examen — sache les reconnaître.","choix":["Payer uniquement ce qu'on consomme au lieu d'investir dans des datacenters avant de connaître le besoin","Déployer dans le monde entier en minutes","Augmenter la vitesse et l'agilité","Bénéficier d'économies d'échelle massives"],"bonne":0},
  {"id":"clf-co-6adv","lvl":6,"dom":"AWS","q":"Lequel de ces éléments N'EST PAS un des 6 avantages du cloud AWS ?","explain":"Le contrôle PHYSIQUE est justement ce qu'on délègue à AWS. Les 6 avantages : coût variable, économies d'échelle, fin des devinettes de capacité, vitesse/agilité, fin de la gestion de datacenters, portée mondiale.","choix":["Un contrôle physique total sur les serveurs","Arrêter de deviner la capacité nécessaire","Ne plus dépenser pour faire tourner des datacenters","Passer à l'échelle mondiale en minutes"],"bonne":0},
  {"id":"clf-co-agility","lvl":4,"dom":"AWS","q":"Que signifie l'« agilité » apportée par le cloud ?","explain":"Tester une idée coûte quelques euros et quelques minutes — et l'abandonner ne coûte rien. C'est ça, l'agilité cloud.","choix":["Provisionner des ressources en minutes et expérimenter à faible coût, au lieu d'attendre des semaines","La rapidité du réseau AWS","La flexibilité des contrats","Le droit de résilier à tout moment"],"bonne":0},
  {"id":"clf-co-wellarch","lvl":5,"dom":"AWS","q":"Quels sont les 6 piliers du AWS Well-Architected Framework ?","explain":"Les 6 piliers du cadre officiel de bonnes pratiques. La durabilité (sustainability) est le 6e, ajouté en 2021 — souvent testé.","choix":["Excellence opérationnelle, Sécurité, Fiabilité, Efficacité des performances, Optimisation des coûts, Durabilité","Vitesse, Coût, Qualité, Sécurité, Simplicité, Scalabilité","Compute, Storage, Network, Database, Security, Billing","Plan, Build, Run, Monitor, Optimize, Secure"],"bonne":0},
  {"id":"clf-co-wellarch-rel","lvl":6,"dom":"AWS","q":"Quel pilier du Well-Architected Framework couvre « la capacité d'un système à récupérer après une panne » ?","explain":"Reliability = récupération, tolérance aux pannes, dimensionnement. À distinguer de la performance (utiliser les ressources efficacement).","choix":["La fiabilité (Reliability)","La sécurité","L'excellence opérationnelle","L'optimisation des coûts"],"bonne":0},
  {"id":"clf-co-caf","lvl":4,"dom":"AWS","q":"À quoi sert l'AWS Cloud Adoption Framework (CAF) ?","explain":"Le CAF structure l'adoption du cloud côté organisation et compétences — pas un outil technique, un cadre de transformation.","choix":["Guider la TRANSFORMATION d'une organisation vers le cloud via 6 perspectives (métier, personnes, gouvernance, plateforme, sécurité, opérations)","Calculer les coûts de migration","Certifier les architectes","Configurer les VPC"],"bonne":0},
  {"id":"clf-co-migration","lvl":5,"dom":"AWS","q":"Dans les stratégies de migration, que signifie « rehost » (lift-and-shift) ?","explain":"Rehost = déménager sans toucher. Replatform = petits ajustements ; refactor = réécrire pour le cloud ; repurchase = passer au SaaS ; retire/retain complètent les « R ».","choix":["Déplacer l'application telle quelle vers le cloud, sans modification","Réécrire l'application en serverless","Abandonner l'application","Passer à un SaaS équivalent"],"bonne":0},
  {"id":"clf-co-s-experiment","lvl":8,"dom":"AWS","q":"Une équipe veut tester un prototype pendant 2 semaines puis tout supprimer. Quel avantage du cloud cela illustre-t-il ?","explain":"Créer, tester, supprimer, ne payer que 2 semaines : impossible avec du matériel acheté. C'est l'argument n°1 pour l'innovation.","choix":["L'agilité et le paiement à l'usage : expérimenter à faible coût sans engagement","La haute disponibilité","La portée mondiale","La durabilité"],"bonne":0},
  {"id":"clf-co-s-global","lvl":9,"dom":"AWS","q":"Une entreprise française veut servir ses clients japonais avec une faible latence, sans construire de datacenter en Asie. Quel avantage du cloud ?","explain":"« Go global in minutes » : déployer dans une des ~30 régions AWS sans investissement immobilier.","choix":["La portée mondiale en quelques minutes : déployer dans la région Asie-Pacifique en quelques clics","Le paiement à l'usage","La sécurité gérée par AWS","L'élasticité"],"bonne":0},
  {"id":"clf-co-s-peak","lvl":7,"dom":"AWS","q":"Un site de billetterie explose de trafic à chaque mise en vente puis retombe. Quel principe cloud évite de payer des serveurs inutilisés le reste du temps ?","explain":"Charge en pics = élasticité. Les instances réservées seraient l'inverse : payer en continu pour un besoin intermittent.","choix":["L'élasticité (Auto Scaling + paiement à l'usage)","La redondance multi-régions","Les instances réservées","Le modèle de responsabilité partagée"],"bonne":0},
  {"id":"clf-co-s-couple","lvl":8,"dom":"AWS","q":"Pourquoi une bonne architecture cloud privilégie-t-elle le « découplage » des composants ?","explain":"Composants faiblement couplés = pannes isolées + mise à l'échelle indépendante. SQS et SNS sont les outils types de ce découplage.","choix":["Pour qu'une panne d'un composant n'entraîne pas les autres, et que chacun évolue indépendamment (ex : file SQS entre deux services)","Pour réduire la facture réseau","Pour simplifier la comptabilité","Pour éviter d'utiliser plusieurs régions"],"bonne":0},
  {"id":"clf-co-devops","lvl":6,"dom":"AWS","q":"Quel est l'intérêt de l'Infrastructure as Code (ex : CloudFormation) mis en avant au CLF ?","explain":"L'IaC : décrire l'infrastructure dans un fichier → déploiements identiques, auditables, automatisables.","choix":["Déployer des environnements répétables, versionnés et sans erreurs manuelles","Éviter d'écrire du code applicatif","Supprimer les coûts d'infrastructure","Chiffrer les données"],"bonne":0},
  {"id":"clf-se-shared-aws","lvl":4,"dom":"AWS","q":"Dans le modèle de responsabilité partagée AWS, de quoi AWS est-il responsable ?","explain":"La formule officielle : AWS = « security OF the cloud » (l'infrastructure), le client = « security IN the cloud » (ce qu'il y met). Question quasi garantie.","choix":["De la sécurité DU cloud : datacenters, matériel, réseau physique, hyperviseur","De la sécurité DANS le cloud : données et configurations","De tout, sans exception","Uniquement de la facturation"],"bonne":0},
  {"id":"clf-se-shared-client","lvl":5,"dom":"AWS","q":"Et le CLIENT, de quoi est-il toujours responsable ?","explain":"Données, identités, configurations : toujours au client — même en serverless. Le physique : toujours à AWS.","choix":["De ses données, de la gestion des accès (IAM) et de la configuration de ses ressources","Du remplacement des disques défaillants","De la climatisation des datacenters","Du réseau physique entre les AZ"],"bonne":0},
  {"id":"clf-se-shared-ec2","lvl":6,"dom":"AWS","q":"Qui applique les correctifs du système d'exploitation d'une instance EC2 ?","explain":"EC2 = IaaS : le patching de l'OS invité est à ta charge. Comparaison classique avec Lambda, où AWS gère tout le runtime.","choix":["Le CLIENT — sur EC2 (IaaS), l'OS invité t'appartient","AWS, automatiquement","Personne, EC2 n'a pas d'OS","L'éditeur de l'OS"],"bonne":0},
  {"id":"clf-se-shared-lambda","lvl":4,"dom":"AWS","q":"Et pour AWS Lambda, qui gère les correctifs du système et du runtime ?","explain":"La responsabilité GLISSE selon le service : EC2 → OS au client ; Lambda → tout l'environnement à AWS. L'examen adore ce contraste.","choix":["AWS — en serverless, le client ne gère que son code et ses permissions","Le client, comme partout","Un sous-traitant","Personne"],"bonne":0},
  {"id":"clf-se-root","lvl":5,"dom":"Sécurité","q":"Quelles sont les bonnes pratiques concernant le compte ROOT (racine) ?","explain":"Le root peut TOUT faire, y compris fermer le compte : on le verrouille (MFA, pas de clés) et on ne le sort que pour les rares tâches qui l'exigent.","choix":["Activer la MFA, supprimer ses clés d'accès, ne PAS l'utiliser au quotidien — créer des utilisateurs IAM à la place","L'utiliser pour toutes les tâches d'administration","Partager son mot de passe avec l'équipe","Le supprimer"],"bonne":0},
  {"id":"clf-se-group","lvl":6,"dom":"Sécurité","q":"Quelle est la bonne pratique pour donner les mêmes permissions à 30 développeurs ?","explain":"Le groupe IAM centralise : une modification de policy s'applique à tous ses membres d'un coup.","choix":["Créer un GROUPE IAM avec les policies, et y placer les 30 utilisateurs","Attacher les policies aux 30 utilisateurs un par un","Leur donner le mot de passe root","Créer 30 comptes AWS"],"bonne":0},
  {"id":"clf-se-role","lvl":4,"dom":"Sécurité","q":"Qu'est-ce qu'un RÔLE IAM et pourquoi est-il préférable aux clés d'accès pour une application sur EC2 ?","explain":"Le rôle élimine les clés codées en dur (qui fuitent sur Git et n'expirent jamais). LA bonne réponse à tout scénario « application qui accède à un service AWS ».","choix":["Une identité assumée temporairement : l'instance obtient des credentials temporaires renouvelés automatiquement, aucune clé n'est stockée","Un utilisateur avec plus de droits","Un mot de passe partagé","Un certificat TLS"],"bonne":0},
  {"id":"clf-se-policy","lvl":5,"dom":"Sécurité","q":"Qu'est-ce qu'une policy IAM ?","explain":"Effect (Allow/Deny) + Action + Resource : la grammaire des permissions AWS. Un Deny explicite l'emporte toujours.","choix":["Un document JSON qui AUTORISE ou REFUSE des actions sur des ressources","Un contrat commercial","Une règle de pare-feu","Un plan de support"],"bonne":0},
  {"id":"clf-se-idc","lvl":6,"dom":"Sécurité","q":"À quoi sert AWS IAM Identity Center (ex AWS SSO) ?","explain":"Identity Center = le portail SSO multi-comptes : un seul login d'entreprise pour tous les comptes AWS de l'organisation.","choix":["Offrir une connexion UNIQUE (SSO) à plusieurs comptes AWS et applications, reliée à l'annuaire de l'entreprise","Remplacer les mots de passe par la biométrie","Chiffrer les identités","Créer des comptes root"],"bonne":0},
  {"id":"clf-se-scp","lvl":4,"dom":"AWS","q":"Qu'est-ce qu'une SCP (Service Control Policy) dans AWS Organizations ?","explain":"La SCP limite ce que les policies IAM PEUVENT accorder, même à un administrateur du compte membre. L'outil de gouvernance multi-comptes.","choix":["Une politique qui fixe le PLAFOND de permissions d'un compte ou d'une unité d'organisation — elle n'accorde jamais de droits","Une policy qui donne des permissions supplémentaires","Un rapport de conformité","Un plan de support"],"bonne":0},
  {"id":"clf-se-shield","lvl":5,"dom":"AWS","q":"Qu'est-ce qu'AWS Shield Standard ?","explain":"Shield Standard : gratuit, automatique, contre les DDoS courants. Shield Advanced (payant) ajoute protections renforcées, visibilité et l'équipe de réponse (SRT).","choix":["Une protection anti-DDoS de base, GRATUITE et activée automatiquement pour tous les clients","Un antivirus payant","Un pare-feu applicatif","Un service de sauvegarde"],"bonne":0},
  {"id":"clf-se-waf-shield","lvl":6,"dom":"AWS","q":"Quelle est la différence entre AWS WAF et AWS Shield ?","explain":"WAF = règles sur les requêtes HTTP (couche 7). Shield = absorption des attaques par saturation. Ils se complètent souvent.","choix":["WAF filtre le CONTENU des requêtes web (injection SQL, XSS) ; Shield protège contre les attaques DDoS volumétriques","Ce sont deux noms du même service","Shield est applicatif, WAF est réseau","WAF est gratuit, Shield payant"],"bonne":0},
  {"id":"clf-se-acm","lvl":5,"dom":"AWS","q":"Que fournit AWS Certificate Manager (ACM) ?","explain":"ACM = le HTTPS sans douleur : certificats publics gratuits, renouvellement automatique, intégration native aux services AWS.","choix":["Des certificats TLS/SSL GRATUITS et renouvelés automatiquement pour les services AWS (CloudFront, load balancers)","Des certifications professionnelles AWS","Des clés SSH","Des badges de conformité"],"bonne":0},
  {"id":"clf-se-trail-watch","lvl":4,"dom":"AWS","q":"Quelle est la différence entre CloudTrail et CloudWatch ?","explain":"« Qui a supprimé cette instance ? » → CloudTrail. « Pourquoi le CPU est à 90 % ? » → CloudWatch. Confusion favorite de l'examen.","choix":["CloudTrail = l'AUDIT des actions (qui a appelé quelle API) ; CloudWatch = la SUPERVISION (métriques, logs applicatifs, alarmes)","Ce sont deux noms du même service","CloudWatch audite, CloudTrail supervise","CloudTrail est payant, CloudWatch gratuit"],"bonne":0},
  {"id":"clf-se-sechub","lvl":6,"dom":"AWS","q":"À quoi sert AWS Security Hub ?","explain":"Security Hub = le tableau de bord unique de la posture sécurité, multi-comptes et multi-services.","choix":["Centraliser et prioriser les alertes de sécurité (GuardDuty, Inspector, Macie…) dans une vue unique, avec des scores par standard","Héberger des sites sécurisés","Gérer les mots de passe","Bloquer les DDoS"],"bonne":0},
  {"id":"clf-se-encrypt","lvl":4,"dom":"AWS","q":"Quelle est la différence entre le chiffrement AU REPOS et EN TRANSIT ?","explain":"Deux protections complémentaires : KMS pour le stockage, TLS pour le réseau. Une architecture sérieuse applique les deux.","choix":["Au repos = données stockées chiffrées (S3, EBS via KMS) ; en transit = données chiffrées pendant leur transfert (TLS/HTTPS)","Au repos = pendant le transfert ; en transit = sur disque","Seul le repos existe","Ce sont des synonymes"],"bonne":0},
  {"id":"clf-se-sg","lvl":5,"dom":"Réseau","q":"Qu'est-ce qu'un security group ?","explain":"Security group = instance, stateful (la réponse repasse automatiquement), allow uniquement. Le NACL est son pendant au niveau subnet.","choix":["Un pare-feu virtuel au niveau de l'INSTANCE, à état (stateful), qui n'accepte que des règles d'AUTORISATION","Un groupe d'utilisateurs IAM","Un pare-feu au niveau du sous-réseau","Une équipe de sécurité AWS"],"bonne":0},
  {"id":"clf-se-nacl","lvl":6,"dom":"Réseau","q":"Quelle est la différence entre un security group et un NACL (network ACL) ?","explain":"Le trio à mémoriser : niveau (instance/subnet), état (stateful/stateless), règles (allow only / allow+deny).","choix":["SG = niveau instance, stateful, autorisations seulement ; NACL = niveau sous-réseau, stateless, autorisations ET refus","NACL = instance, SG = sous-réseau","Le NACL est payant","Le SG peut refuser explicitement"],"bonne":0},
  {"id":"clf-se-s3block","lvl":4,"dom":"AWS","q":"À quoi sert S3 Block Public Access ?","explain":"Activé par défaut sur les nouveaux buckets : le garde-fou contre la fuite de données S3, cause historique de nombreux incidents.","choix":["Empêcher toute exposition publique accidentelle des buckets et objets S3, au niveau du compte ou du bucket","Bloquer les uploads","Chiffrer les objets","Limiter la taille des fichiers"],"bonne":0},
  {"id":"clf-se-pentest","lvl":5,"dom":"Sécurité","q":"Un client peut-il réaliser des tests d'intrusion sur SES ressources AWS ?","explain":"AWS autorise les pentests sur tes propres ressources pour les services listés, sans approbation préalable. Attaquer l'infrastructure AWS elle-même reste interdit.","choix":["Oui — sans autorisation préalable pour une liste de services permis (EC2, RDS…), en respectant la politique AWS","Non, jamais","Oui, sur n'importe quoi, y compris l'infrastructure AWS","Seulement avec le plan de support Enterprise"],"bonne":0},
  {"id":"clf-se-s-audit","lvl":9,"dom":"AWS","q":"Un auditeur demande QUI a supprimé une instance EC2 le 12 mars et depuis quelle adresse IP. Quel service consultes-tu ?","explain":"Historique des appels d'API avec identité et IP source = CloudTrail, mot pour mot.","choix":["CloudTrail","CloudWatch","AWS Config","Trusted Advisor"],"bonne":0},
  {"id":"clf-se-s-soc","lvl":7,"dom":"AWS","q":"Ton client exige le rapport SOC 2 d'AWS avant de signer. Où le récupères-tu ?","explain":"Artifact = libre-service des rapports de conformité AWS. Pas besoin de ticket ni de plan de support particulier.","choix":["AWS Artifact","Sur demande au support par ticket","Security Hub","CloudTrail"],"bonne":0},
  {"id":"clf-se-s-pii","lvl":8,"dom":"AWS","q":"La DPO veut savoir si des numéros de carte bancaire traînent dans vos buckets S3. Quel service ?","explain":"Données sensibles dans S3 = Macie. Inspector cherche des vulnérabilités logicielles, pas des données.","choix":["Amazon Macie","Amazon Inspector","AWS Shield","AWS WAF"],"bonne":0},
  {"id":"clf-se-s-keys","lvl":9,"dom":"AWS","q":"Un audit révèle des clés d'accès AWS codées EN DUR dans une application tournant sur EC2. Quelle est la correction recommandée ?","explain":"Le rôle IAM supprime le secret au lieu de le cacher : credentials temporaires, renouvelés par AWS, rien à stocker ni faire tourner.","choix":["Remplacer les clés par un RÔLE IAM attaché à l'instance (credentials temporaires automatiques)","Chiffrer le fichier de configuration","Changer les clés tous les mois","Les déplacer dans un fichier séparé"],"bonne":0},
  {"id":"clf-se-s-regions","lvl":7,"dom":"AWS","q":"La direction exige qu'AUCUN des 15 comptes AWS de l'entreprise ne puisse créer de ressources hors d'Europe. Quelle solution ?","explain":"La SCP s'impose à tous les comptes membres, même à leurs administrateurs — une policy IAM locale serait contournable.","choix":["Une SCP dans AWS Organizations restreignant les régions, appliquée à tous les comptes","Une policy IAM dans chaque compte","Un e-mail à toutes les équipes","Un security group"],"bonne":0},
  {"id":"clf-se-s-ddos","lvl":8,"dom":"AWS","q":"Un site e-commerce critique veut une protection DDoS renforcée AVEC accès à une équipe d'experts AWS en cas d'attaque. Quel service ?","explain":"Shield Advanced (payant) : protections étendues, visibilité, garanties de coûts et accès à l'équipe de réponse (SRT). Standard n'inclut pas d'assistance dédiée.","choix":["AWS Shield Advanced","AWS Shield Standard","Amazon GuardDuty","AWS Config"],"bonne":0},
  {"id":"clf-se-s-threats","lvl":9,"dom":"AWS","q":"Tu veux être alerté si un compte AWS montre des signes de COMPROMISSION (appels d'API inhabituels, communication avec des IP malveillantes), sans installer d'agent. Quel service ?","explain":"Détection de menaces par analyse continue des logs = GuardDuty, activable en un clic sur toute l'organisation.","choix":["Amazon GuardDuty","Amazon Macie","AWS WAF","AWS KMS"],"bonne":0},
  {"id":"clf-te-edge","lvl":4,"dom":"AWS","q":"Que sont les « emplacements périphériques » (edge locations) d'AWS ?","explain":"Les edge locations servent le contenu au plus près de l'utilisateur (CDN CloudFront, Route 53). Bien plus nombreuses que les régions.","choix":["Des points de présence (400+) plus proches des utilisateurs, utilisés par CloudFront pour mettre le contenu en cache","Des petites régions","Des datacenters de secours","Des bureaux commerciaux AWS"],"bonne":0},
  {"id":"clf-te-s-hazone","lvl":7,"dom":"AWS","q":"Comment rendre une application EC2 hautement disponible face à la panne d'un datacenter ?","explain":"Multi-AZ + ELB = le motif de haute disponibilité de base chez AWS. Les sauvegardes réparent, elles n'évitent pas l'interruption.","choix":["Déployer les instances sur PLUSIEURS zones de disponibilité derrière un load balancer","Prendre une instance plus grosse","Faire des sauvegardes quotidiennes","Utiliser une edge location"],"bonne":0},
  {"id":"clf-te-ecs","lvl":5,"dom":"AWS","q":"Que sont Amazon ECS et Amazon EKS ?","explain":"ECS = l'orchestrateur maison, simple. EKS = Kubernetes managé, standard du marché. Les deux font tourner des conteneurs Docker.","choix":["Deux orchestrateurs de CONTENEURS : ECS (natif AWS) et EKS (Kubernetes managé)","Deux services de stockage","Deux bases de données","Deux outils de facturation"],"bonne":0},
  {"id":"clf-te-lightsail","lvl":5,"dom":"AWS","q":"À qui s'adresse Amazon Lightsail ?","explain":"Lightsail = le VPS simplifié d'AWS : prix fixe prévisible, configuration en quelques clics. La réponse aux scénarios « simple et prévisible ».","choix":["Aux débutants et petits projets : serveurs virtuels simples à prix fixe mensuel (site WordPress, petit site vitrine)","Aux supercalculateurs","Aux mainframes","Aux clusters Kubernetes"],"bonne":0},
  {"id":"clf-te-s-compute-event","lvl":8,"dom":"AWS","q":"Redimensionner automatiquement chaque image uploadée dans un bucket S3, sans serveur à gérer. Quel service de calcul ?","explain":"Événement + traitement court + zéro serveur = Lambda. Le déclencheur S3 → Lambda est le scénario serverless canonique.","choix":["AWS Lambda déclenché par l'événement S3","Une instance EC2 qui scrute le bucket","Amazon Lightsail","Amazon Redshift"],"bonne":0},
  {"id":"clf-te-s-lift","lvl":9,"dom":"AWS","q":"Migrer un serveur applicatif existant vers AWS SANS modifier l'application, en gardant le contrôle de l'OS. Quel service ?","explain":"Lift-and-shift = EC2 : la VM cloud qui réplique ton serveur actuel, OS compris.","choix":["Amazon EC2","AWS Lambda","AWS Fargate","Amazon S3"],"bonne":0},
  {"id":"clf-te-s3-classes","lvl":6,"dom":"AWS","q":"Quelle classe S3 choisir pour des données consultées RAREMENT mais devant rester disponibles IMMÉDIATEMENT ?","explain":"Standard-IA : stockage moins cher, frais de récupération, accès immédiat. One Zone-IA est encore moins cher mais une seule AZ (données recréables uniquement).","choix":["S3 Standard-IA (Infrequent Access)","S3 Standard","S3 Glacier Deep Archive","S3 One Zone-IA pour des données critiques"],"bonne":0},
  {"id":"clf-te-glacier","lvl":4,"dom":"AWS","q":"Quelle classe S3 est la MOINS chère pour un archivage long terme consulté une fois par an au plus, avec des heures de délai acceptables ?","explain":"Deep Archive : le coffre-fort le moins cher (récupération en ~12 h). La famille Glacier : Instant Retrieval (ms), Flexible (minutes-heures), Deep Archive (heures).","choix":["S3 Glacier Deep Archive","S3 Standard","S3 Intelligent-Tiering","S3 Standard-IA"],"bonne":0},
  {"id":"clf-te-intelligent","lvl":5,"dom":"AWS","q":"À quoi sert S3 Intelligent-Tiering ?","explain":"Schéma d'accès INCONNU ou changeant → Intelligent-Tiering optimise tout seul, moyennant de petits frais de surveillance.","choix":["Déplacer AUTOMATIQUEMENT les objets entre niveaux d'accès selon leur usage réel, quand les schémas d'accès sont imprévisibles","Chiffrer intelligemment","Compresser les objets","Détecter les données sensibles"],"bonne":0},
  {"id":"clf-te-efs","lvl":4,"dom":"AWS","q":"Quelle est la différence entre EBS et EFS ?","explain":"Un disque vs un partage réseau élastique. Pour du SMB Windows, c'est FSx for Windows File Server.","choix":["EBS = disque bloc attaché à UNE instance (une AZ) ; EFS = système de fichiers réseau PARTAGEABLE par plusieurs instances (multi-AZ)","EFS est pour Windows, EBS pour Linux","EBS est un stockage d'objets","Aucune différence"],"bonne":0},
  {"id":"clf-te-snow","lvl":5,"dom":"AWS","q":"À quoi sert la famille AWS Snow (Snowball, Snowcone) ?","explain":"Snowball : des dizaines de To par colis sécurisé — quand le camion bat la fibre. Aussi utilisable pour du edge computing hors connexion.","choix":["Transférer de GROS volumes de données vers AWS par appareil physique quand le réseau est trop lent, et traiter en périphérie","Refroidir les datacenters","Stocker des sauvegardes dans la neige","Accélérer le réseau"],"bonne":0},
  {"id":"clf-te-storagegw","lvl":6,"dom":"AWS","q":"À quoi sert AWS Storage Gateway ?","explain":"Storage Gateway = le pont de stockage hybride : fichiers, volumes ou bandes virtuelles adossés à S3, avec cache local.","choix":["Relier le stockage ON-PREMISES au cloud : les applications locales accèdent à S3 comme à un stockage local (cache hybride)","Créer des passerelles VPN","Équilibrer la charge","Migrer des bases de données"],"bonne":0},
  {"id":"clf-te-s-backup","lvl":7,"dom":"AWS","q":"Des sauvegardes réglementaires doivent être conservées 10 ans, quasiment jamais consultées, au coût minimal. Quelle classe S3 ?","explain":"10 ans + jamais consulté + coût minimal = Deep Archive, sans hésiter. Le délai de récupération de quelques heures est acceptable pour un audit.","choix":["S3 Glacier Deep Archive","S3 Standard","S3 One Zone-IA","S3 Express One Zone"],"bonne":0},
  {"id":"clf-te-elasticache","lvl":5,"dom":"AWS","q":"À quoi sert Amazon ElastiCache ?","explain":"Cache en mémoire = microsecondes. Le motif classique : ElastiCache devant RDS pour absorber les lectures répétées.","choix":["Fournir un CACHE en mémoire managé (Redis, Memcached) pour accélérer les applications et soulager les bases","Stocker des fichiers","Archiver des données","Faire du machine learning"],"bonne":0},
  {"id":"clf-te-s-db","lvl":8,"dom":"AWS","q":"Une application e-commerce a besoin d'une base MySQL SANS avoir à gérer les sauvegardes ni les correctifs. Quel service ?","explain":"MySQL + « managé » = RDS. Sur EC2, tu redeviendrais responsable de tout (sauvegardes, patchs, réplication).","choix":["Amazon RDS (ou Aurora)","MySQL installé sur EC2","Amazon DynamoDB","Amazon Redshift"],"bonne":0},
  {"id":"clf-te-s-cache","lvl":9,"dom":"AWS","q":"Ta base RDS sature à cause de lectures répétées des mêmes données. Quelle solution AWS classique ?","explain":"Lectures répétitives = cache. ElastiCache absorbe le trafic chaud et divise la charge de la base.","choix":["Ajouter Amazon ElastiCache en cache devant la base","Doubler la taille de l'instance RDS indéfiniment","Migrer vers Redshift","Activer le versioning S3"],"bonne":0},
  {"id":"clf-te-igw","lvl":4,"dom":"Réseau","q":"Quelle est la différence entre une Internet Gateway et une NAT Gateway ?","explain":"IGW = la porte d'entrée du VPC. NAT = la sortie à sens unique des subnets privés (mises à jour, appels d'API sortants).","choix":["L'IGW donne l'accès Internet au VPC (entrant/sortant) ; la NAT permet aux sous-réseaux PRIVÉS de sortir vers Internet sans être joignables depuis l'extérieur","La NAT est gratuite, l'IGW payante","L'IGW chiffre le trafic","Ce sont des synonymes"],"bonne":0},
  {"id":"clf-te-s-cdn","lvl":7,"dom":"Réseau","q":"Les utilisateurs australiens de ton site hébergé à Paris se plaignent de lenteurs sur les images et vidéos. Quelle solution ?","explain":"Contenu statique + utilisateurs lointains = CDN. CloudFront sert depuis l'edge location la plus proche de chaque visiteur.","choix":["Amazon CloudFront pour mettre le contenu en cache près d'eux","Une instance EC2 plus grosse à Paris","Un VPN vers l'Australie","Migrer toute l'app à Sydney"],"bonne":0},
  {"id":"clf-te-s-dx","lvl":8,"dom":"Réseau","q":"Une entreprise exige une liaison STABLE et PRIVÉE (hors Internet) entre son datacenter et AWS pour des transferts quotidiens massifs. Quelle solution ?","explain":"« Hors Internet public » + débit garanti = Direct Connect. Le VPN passe par Internet (chiffré mais variable).","choix":["AWS Direct Connect","Un VPN site-à-site","CloudFront","Une Internet Gateway"],"bonne":0},
  {"id":"clf-te-ssm","lvl":6,"dom":"AWS","q":"À quoi sert AWS Systems Manager ?","explain":"Systems Manager : la boîte à outils d'administration (Session Manager, Patch Manager, Parameter Store, Run Command).","choix":["Gérer un parc d'instances à grande échelle : exécuter des commandes, appliquer des correctifs, ouvrir des sessions sans SSH, stocker des paramètres","Gérer les factures","Créer des utilisateurs IAM","Héberger des sites web"],"bonne":0},
  {"id":"clf-te-console","lvl":2,"dom":"AWS","q":"Quelles sont les 3 façons principales d'interagir avec AWS ?","explain":"Console (visuel), CLI (scripts), SDK (applications). Toutes trois appellent les mêmes API AWS.","choix":["La console web, l'AWS CLI (ligne de commande) et les SDK (depuis le code)","Uniquement la console","Le téléphone et l'e-mail","FTP et SSH"],"bonne":0},
  {"id":"clf-te-ai","lvl":4,"dom":"AWS","q":"Quel service AWS permet de construire, entraîner et déployer des modèles de machine learning ?","explain":"SageMaker = la plateforme ML complète. Rekognition (images), Polly (voix), Comprehend (texte) sont des services IA « prêts à l'emploi ».","choix":["Amazon SageMaker","Amazon Rekognition","Amazon Athena","AWS Glue"],"bonne":0},
  {"id":"clf-te-rekognition","lvl":5,"dom":"AWS","q":"Quel service analyse IMAGES et VIDÉOS (détection d'objets, de visages, de contenu inapproprié) sans expertise ML ?","explain":"Rekognition = la vision par ordinateur clé en main. Pas besoin d'entraîner un modèle : on appelle l'API.","choix":["Amazon Rekognition","Amazon SageMaker","Amazon Redshift","AWS Config"],"bonne":0},
  {"id":"clf-te-athena","lvl":6,"dom":"AWS","q":"Quel service interroge en SQL des données stockées DANS S3, sans serveur ni chargement préalable ?","explain":"Athena : du SQL serverless directement sur tes fichiers S3, facturé au volume scanné. « Analyser des logs dans S3 » → Athena.","choix":["Amazon Athena","Amazon RDS","Amazon ElastiCache","AWS Snowball"],"bonne":0},
  {"id":"clf-te-s-decouple","lvl":9,"dom":"AWS","q":"Ton frontend envoie des commandes à un backend qui plante lors des pics : les commandes sont perdues. Quel service évite ces pertes en absorbant les pics ?","explain":"La file SQS stocke les commandes en attendant que le backend les traite : plus de perte, et le backend consomme à son rythme.","choix":["Amazon SQS entre le frontend et le backend","Un deuxième backend identique","CloudFront","AWS WAF"],"bonne":0},
  {"id":"clf-te-s-notify","lvl":7,"dom":"AWS","q":"Quand une alarme se déclenche, il faut prévenir EN MÊME TEMPS une équipe par e-mail, un webhook et une fonction Lambda. Quel service ?","explain":"Un événement diffusé à PLUSIEURS destinataires = pub/sub = SNS. SQS ne livrerait qu'à un seul consommateur.","choix":["Amazon SNS (un message publié → tous les abonnés notifiés)","Amazon SQS","AWS Direct Connect","Amazon EFS"],"bonne":0},
  {"id":"clf-te-s-iac","lvl":8,"dom":"AWS","q":"Déployer 20 fois le même environnement (VPC + EC2 + RDS) à l'identique, sans erreurs manuelles. Quelle approche AWS native ?","explain":"Répétable et identique = Infrastructure as Code = CloudFormation (natif) ou Terraform (tiers).","choix":["Un template CloudFormation déployé 20 fois","20 sessions de clics dans la console","Un document Word avec la procédure","Des captures d'écran"],"bonne":0},
  {"id":"clf-bi-ondemand","lvl":3,"dom":"SRE","q":"Qu'est-ce que la tarification « à la demande » (on-demand) ?","explain":"On-demand : la flexibilité maximale au prix le plus élevé. Le point de départ, avant d'optimiser avec réservations ou Savings Plans.","choix":["Payer les ressources à l'heure ou à la seconde, SANS engagement ni paiement initial","Un forfait mensuel fixe","Un paiement annuel obligatoire","Une enchère sur la capacité inutilisée"],"bonne":0},
  {"id":"clf-bi-ri","lvl":4,"dom":"SRE","q":"Que sont les instances réservées (Reserved Instances) ?","explain":"Engagement de durée = grosse réduction. Pour une charge STABLE et prévisible (serveur qui tourne 24h/24).","choix":["Un engagement d'1 ou 3 ans sur une instance, contre une réduction pouvant atteindre ~72 % par rapport à l'on-demand","Des instances gardées en secours","Des instances gratuites","Des instances interruptibles"],"bonne":0},
  {"id":"clf-bi-savings","lvl":5,"dom":"SRE","q":"Qu'est-ce qu'un Savings Plan ?","explain":"Savings Plans : on s'engage sur un montant, pas sur une instance précise — la flexibilité en plus par rapport aux RI.","choix":["Un engagement de DÉPENSE (en $/heure sur 1 ou 3 ans) plus flexible que les instances réservées : la réduction suit même si tu changes de type d'instance","Un plan d'épargne bancaire AWS","Une réduction automatique sans engagement","Un plafond de facturation"],"bonne":0},
  {"id":"clf-bi-spot","lvl":6,"dom":"SRE","q":"Que sont les instances Spot ?","explain":"Spot : imbattable en prix, interruptible par nature. Pour les traitements tolérants aux interruptions uniquement.","choix":["La capacité INUTILISÉE d'AWS jusqu'à ~90 % moins cher — mais récupérable par AWS à tout moment (interruption possible)","Des instances premium garanties","Des instances d'essai gratuites","Des instances réservées aux startups"],"bonne":0},
  {"id":"clf-bi-s-spot","lvl":9,"dom":"SRE","q":"Un traitement batch de rendu vidéo peut être interrompu et repris sans dommage. Quelle option de tarification minimise le coût ?","explain":"Tolérant aux interruptions = Spot (jusqu'à ~90 % d'économie). Le scénario type de l'examen.","choix":["Les instances Spot","Les instances réservées 3 ans","L'on-demand","Un dedicated host"],"bonne":0},
  {"id":"clf-bi-dedicated","lvl":4,"dom":"SRE","q":"Pourquoi choisir un Dedicated Host ?","explain":"Dedicated Host : le matériel rien qu'à toi (licences BYOL par socket/cœur, conformité). Le plus cher des modèles.","choix":["Obtenir un serveur PHYSIQUE entier dédié — pour des licences liées au matériel ou des exigences de conformité","Pour payer moins cher","Pour avoir plus de bande passante","C'est obligatoire en production"],"bonne":0},
  {"id":"clf-bi-freetier","lvl":5,"dom":"SRE","q":"Quels sont les 3 types d'offre gratuite (Free Tier) AWS ?","explain":"Always free / 12 months / trials — les trois familles du Free Tier, souvent testées avec un exemple à classer.","choix":["Toujours gratuit (ex : 1M requêtes Lambda/mois), 12 mois gratuits (ex : 750 h d'EC2 t2.micro), et essais courts (trials)","Tout AWS est gratuit la première année","Gratuit le week-end","Un crédit unique de 100 $"],"bonne":0},
  {"id":"clf-bi-transfer","lvl":6,"dom":"SRE","q":"Comment AWS facture-t-il les transferts de données ?","explain":"Entrer est gratuit, sortir se paie — comme chez Azure. À anticiper pour les architectures hybrides gourmandes en rapatriement.","choix":["Le trafic ENTRANT est gratuit ; le trafic SORTANT d'AWS est facturé","Tout le trafic est gratuit","L'entrant est payant, le sortant gratuit","Un forfait réseau fixe"],"bonne":0},
  {"id":"clf-bi-cur","lvl":5,"dom":"AWS","q":"Quel outil fournit les données de facturation LES PLUS détaillées (ligne par ligne, exportables) ?","explain":"Le CUR : l'export exhaustif heure par heure, ressource par ressource — la source des analyses fines et des refacturations internes.","choix":["Le Cost and Usage Report (CUR)","AWS Budgets","La calculatrice de prix","Trusted Advisor"],"bonne":0},
  {"id":"clf-bi-calc-vs","lvl":6,"dom":"AWS","q":"Estimer un projet FUTUR vs analyser les dépenses PASSÉES : quels outils ?","explain":"Avant = calculateur. Après = explorateur. Pendant = Budgets (alertes). Le trio préféré de l'examen.","choix":["Futur = Pricing Calculator ; passé = Cost Explorer","Futur = Cost Explorer ; passé = Pricing Calculator","Les deux avec Budgets","Les deux avec le CUR"],"bonne":0},
  {"id":"clf-bi-consolidated","lvl":4,"dom":"AWS","q":"Qu'apporte la facturation consolidée d'AWS Organizations ?","explain":"Un seul paieur + agrégation des usages : les remises de volume (S3, transfert…) se calculent sur le TOTAL des comptes.","choix":["UNE facture unique pour tous les comptes, et la MISE EN COMMUN des volumes pour atteindre les paliers de réduction plus vite","Une réduction fixe de 30 %","La gratuité du support","Des factures séparées par compte"],"bonne":0},
  {"id":"clf-bi-tags","lvl":5,"dom":"AWS","q":"Comment ventiler les coûts AWS par projet ou par équipe au sein d'un compte ?","explain":"Tags cost-allocation + Cost Explorer = la ventilation analytique. Même logique que les tags Azure.","choix":["Avec des TAGS de répartition des coûts (cost allocation tags) activés dans la facturation, puis filtrés dans Cost Explorer","En créant un compte par personne","En regardant les factures PDF","Ce n'est pas possible"],"bonne":0},
  {"id":"clf-bi-support-basic","lvl":6,"dom":"AWS","q":"Que comprend le plan de support Basic (gratuit) ?","explain":"Basic = inclus pour tous, zéro support technique. Premier niveau payant avec support technique : Developer.","choix":["Questions de compte et de facturation, documentation, forums — mais AUCUN support technique","Un support technique par e-mail","Une assistance téléphonique 24/7","Un TAM dédié"],"bonne":0},
  {"id":"clf-bi-support-dev","lvl":4,"dom":"AWS","q":"Que propose le plan de support Developer ?","explain":"Developer : e-mail en heures ouvrées, réponse < 24 h (< 12 h si système dégradé). Pas de téléphone, pas de 24/7.","choix":["Un support technique par e-mail aux heures ouvrées — adapté aux environnements de test/développement","Une hotline 24/7","Un TAM dédié","Une réponse en 15 minutes"],"bonne":0},
  {"id":"clf-bi-support-business","lvl":5,"dom":"AWS","q":"Que propose le plan de support Business ?","explain":"Business : le premier plan avec 24/7 téléphone/chat et l'ensemble des vérifications Trusted Advisor. Le TAM reste réservé à Enterprise.","choix":["Support 24/7 par téléphone et chat, réponse < 1 h si la production est HS, et Trusted Advisor COMPLET","Uniquement de l'e-mail","Un TAM dédié","Une réponse en 15 minutes garantie"],"bonne":0},
  {"id":"clf-bi-support-ent","lvl":6,"dom":"AWS","q":"Qu'est-ce qui distingue le plan de support Enterprise ?","explain":"Enterprise : TAM désigné + < 15 min sur incident critique + revues proactives. Enterprise On-Ramp est l'intermédiaire (< 30 min, pool de TAM).","choix":["Un TAM (Technical Account Manager) dédié et une réponse < 15 min pour les incidents critiques","C'est le seul plan avec téléphone","Il est gratuit au-delà de 1 M$ de facture","Il inclut les certifications AWS"],"bonne":0},
  {"id":"clf-bi-s-support","lvl":7,"dom":"AWS","q":"Une entreprise en PRODUCTION exige un support téléphonique 24/7 avec réponse < 1 h en cas de panne, AU MOINDRE COÛT. Quel plan ?","explain":"24/7 + téléphone + prod < 1 h = Business. Enterprise remplirait aussi mais coûte bien plus — « moindre coût » tranche.","choix":["Business","Developer","Basic","Enterprise"],"bonne":0},
  {"id":"clf-bi-trusted-cat","lvl":5,"dom":"AWS","q":"Quelles sont les 5 catégories de vérifications de Trusted Advisor ?","explain":"Les 5 catégories officielles — l'équivalent AWS d'Azure Advisor. « VM sous-utilisées » → catégorie coûts ; « port 22 ouvert » → sécurité.","choix":["Optimisation des coûts, Performance, Sécurité, Tolérance aux pannes, Limites de service","CPU, RAM, Disque, Réseau, Prix","Compute, Storage, Database, Network, Billing","Bronze, Argent, Or, Platine, Diamant"],"bonne":0},
  {"id":"clf-bi-marketplace","lvl":6,"dom":"AWS","q":"Qu'est-ce que l'AWS Marketplace ?","explain":"Le Marketplace simplifie l'achat de solutions éditeurs : déploiement en un clic, facturation intégrée à AWS.","choix":["Un catalogue de logiciels TIERS (pare-feux, BI, AMI préconfigurées…) déployables dans ton compte et facturés via ta facture AWS","La boutique de goodies AWS","Un site d'enchères d'instances","Le magasin d'applications mobiles d'Amazon"],"bonne":0},
  {"id":"clf-bi-free-services","lvl":4,"dom":"SRE","q":"Lesquels de ces services sont GRATUITS (on ne paie que les ressources qu'ils créent) ?","explain":"Les services d'« orchestration » sont gratuits : tu paies les ressources déployées, pas l'outil. Question fréquente sous forme de liste.","choix":["IAM, VPC, CloudFormation, Auto Scaling et Organizations","EC2 et S3","RDS et DynamoDB","CloudFront et Route 53"],"bonne":0}

/* qcm/niveau01.js */
window.QCM = (window.QCM || []).concat([
/* ============ QCM NIVEAU 1 — VOCABULAIRE & FONDATIONS ============
   Propositions calibrées : longueurs comparables, distracteurs plausibles.  */

{ id:"c1-01", lvl:1, dom:"Linux",
  q:"Dans <code>drwxr-xr-x</code>, que représente le tout premier caractère ?",
  choix:["Le type de l'objet : répertoire, fichier, lien","Le droit de lecture accordé au propriétaire","Le droit d'exécution accordé à tous","Le fait que l'objet soit un fichier caché"],
  bonne:0,
  explain:"C'est le TYPE, pas une permission : <code>d</code> répertoire, <code>-</code> fichier ordinaire, <code>l</code> lien symbolique, <code>b</code>/<code>c</code> périphérique, <code>s</code> socket. Les permissions ne commencent qu'au 2ᵉ caractère." },

{ id:"c1-02", lvl:1, dom:"Linux",
  q:"<code>chmod 640 fichier</code> donne quels droits ?",
  choix:["Propriétaire rw · groupe r · autres rien","Propriétaire rwx · groupe rw · autres r","Propriétaire r · groupe rien · autres rien","Propriétaire rw · groupe rw · autres rw"],
  bonne:0,
  explain:"6 = rw- (4+2), 4 = r--, 0 = ---. Chaque chiffre est une somme : lecture 4, écriture 2, exécution 1." },

{ id:"c1-03", lvl:1, dom:"Linux",
  q:"Quelle est la différence entre <code>&gt;</code> et <code>&gt;&gt;</code> ?",
  choix:["<code>&gt;</code> écrase le fichier, <code>&gt;&gt;</code> ajoute à la fin","<code>&gt;</code> ajoute à la fin, <code>&gt;&gt;</code> écrase le fichier","<code>&gt;</code> écrit stdout, <code>&gt;&gt;</code> écrit stderr","<code>&gt;</code> crée le fichier, <code>&gt;&gt;</code> exige qu'il existe"],
  bonne:0,
  explain:"<code>&gt;</code> tronque le fichier avant d'écrire — et il le fait MÊME si la commande échoue ensuite. C'est le piège classique qui vide un fichier de configuration." },

{ id:"c1-04", lvl:1, dom:"Linux",
  q:"Que fait <code>2&gt;&amp;1</code> ?",
  choix:["Il envoie stderr là où pointe stdout","Il envoie stdout là où pointe stderr","Il fusionne le contenu de deux fichiers","Il exécute la commande une seconde fois"],
  bonne:0,
  explain:"Le descripteur 2 est redirigé vers la destination du descripteur 1 À CET INSTANT. D'où l'importance de l'ordre : <code>cmd &gt; f 2&gt;&amp;1</code> marche, <code>cmd 2&gt;&amp;1 &gt; f</code> laisse stderr sur le terminal." },

{ id:"c1-05", lvl:1, dom:"Linux",
  q:"À quoi sert <code>export</code> devant une variable ?",
  choix:["À la transmettre aux processus enfants","À la rendre permanente après un redémarrage","À la protéger contre toute modification","À la partager avec les autres utilisateurs"],
  bonne:0,
  explain:"<code>export</code> promeut une variable de shell en variable d'ENVIRONNEMENT, héritée par les enfants. C'est ce mécanisme qui transporte la configuration dans les conteneurs." },

{ id:"c1-06", lvl:1, dom:"Docker",
  q:"Quel énoncé décrit correctement image et conteneur ?",
  choix:["L'image est un modèle figé, le conteneur une instance qui tourne","Le conteneur est le modèle figé, l'image l'instance qui tourne","L'image contient les données, le conteneur contient le code","Ce sont deux appellations du même objet technique"],
  bonne:0,
  explain:"Analogie classe / objet : l'image est un empilement de couches en lecture seule ; le conteneur ajoute par-dessus une couche d'écriture éphémère." },

{ id:"c1-07", lvl:1, dom:"Docker",
  q:"Pourquoi un conteneur n'est-il pas une machine virtuelle ?",
  choix:["Il partage le noyau de l'hôte, c'est un processus isolé","Il utilise un hyperviseur plus léger et optimisé","Il embarque un OS minimaliste au lieu d'un OS complet","Il ne peut pas accéder directement au réseau physique"],
  bonne:0,
  explain:"Namespaces + cgroups + rootfs overlay, rien de plus. D'où un démarrage en millisecondes, mais une isolation plus faible et une dépendance au noyau de l'hôte." },

{ id:"c1-08", lvl:1, dom:"Docker",
  q:"Que deviennent les données écrites dans un conteneur supprimé ?",
  choix:["Elles sont perdues, sauf si un volume est monté","Elles sont conservées dans l'image d'origine","Elles sont recopiées automatiquement sur l'hôte","Elles sont sauvegardées par le daemon Docker"],
  bonne:0,
  explain:"La couche d'écriture est liée au cycle de vie du conteneur. Pour persister : volume nommé, bind mount, ou stockage externe. Un conteneur doit être stateless par défaut." },

{ id:"c1-09", lvl:1, dom:"Kubernetes",
  q:"Qu'est-ce qu'un Pod ?",
  choix:["Un ou plusieurs conteneurs partageant IP et volumes","Un conteneur unique, sous un autre nom","Un groupe de nœuds gérés ensemble","Un cloisonnement logique du cluster"],
  bonne:0,
  explain:"C'est la plus petite unité déployable. Les conteneurs d'un Pod partagent le namespace réseau (même IP, communication via localhost) et les volumes — d'où le pattern sidecar." },

{ id:"c1-10", lvl:1, dom:"Kubernetes",
  q:"Quel problème un Service Kubernetes résout-il ?",
  choix:["Les Pods changent d'IP : il donne une adresse stable","Les Pods manquent de mémoire : il ajuste les limites","Les Pods sont mal répartis : il choisit les nœuds","Les Pods perdent leurs données : il monte les volumes"],
  bonne:0,
  explain:"IP virtuelle et nom DNS stables, avec répartition du trafic sur les Pods correspondant à son <code>selector</code>. Sans lui, il faudrait suivre des IP qui changent à chaque recréation." },

{ id:"c1-11", lvl:1, dom:"Kubernetes",
  q:"Que se passe-t-il si tu supprimes à la main un Pod d'un Deployment ?",
  choix:["Le ReplicaSet en recrée aussitôt un nouveau","Il disparaît définitivement du cluster","Le Deployment bascule en état d'erreur","Le nœud concerné passe en NotReady"],
  bonne:0,
  explain:"C'est la boucle de réconciliation : le contrôleur compare l'état désiré (N réplicas) à l'état observé et corrige. Pour arrêter le service, il faut modifier le Deployment." },

{ id:"c1-12", lvl:1, dom:"Terraform",
  q:"Que signifie « Terraform est déclaratif » ?",
  choix:["Tu décris l'état final, il calcule les actions","Tu écris les commandes à exécuter, dans l'ordre","Le code s'exécute ligne par ligne, comme un script","Tu déclares les variables avant les ressources"],
  bonne:0,
  explain:"Conséquence pratique : c'est idempotent. Relancer un <code>apply</code> sans changement ne fait rien, là où un script bash rejoue tout." },

{ id:"c1-13", lvl:1, dom:"Terraform",
  q:"À quoi sert le fichier <code>terraform.tfstate</code> ?",
  choix:["À mémoriser le lien entre le code et le réel","À conserver l'historique des commandes lancées","À stocker les identifiants d'accès au cloud","À lister les providers restant à télécharger"],
  bonne:0,
  explain:"Sans lui, Terraform ne sait plus ce qu'il gère et voudrait tout recréer. Il contient souvent des secrets en clair : backend distant chiffré obligatoire, jamais dans Git." },

{ id:"c1-14", lvl:1, dom:"Terraform",
  q:"Différence entre un bloc <code>resource</code> et un bloc <code>data</code> ?",
  choix:["<code>resource</code> gère l'objet, <code>data</code> le lit seulement","<code>data</code> crée l'objet, <code>resource</code> le lit seulement","<code>data</code> ne concerne que les bases de données","Aucune : ce sont deux syntaxes équivalentes"],
  bonne:0,
  explain:"Une data source est en lecture seule : un <code>destroy</code> ne supprimera jamais ce qu'elle référence. On l'utilise pour récupérer l'ID d'un objet créé ailleurs." },

{ id:"c1-15", lvl:1, dom:"Terraform",
  q:"Que fait <code>terraform init</code> ?",
  choix:["Il installe providers et modules, et règle le backend","Il crée réellement les ressources dans le cloud","Il affiche les changements qui seraient appliqués","Il reformate les fichiers .tf au format canonique"],
  bonne:0,
  explain:"Obligatoire au premier usage et après tout changement de provider, de backend ou de module. Il ne touche jamais à l'infrastructure." },

{ id:"c1-16", lvl:1, dom:"AWS",
  q:"Quelle est la relation entre une Région et une Availability Zone ?",
  choix:["Une Région contient plusieurs AZ isolées","Une AZ contient plusieurs Régions voisines","Une AZ est partagée entre plusieurs Régions","Ce sont deux appellations du même concept"],
  bonne:0,
  explain:"eu-west-3 (Paris) contient plusieurs AZ reliées à faible latence. La haute disponibilité se construit multi-AZ ; la reprise après sinistre se construit multi-région." },

{ id:"c1-17", lvl:1, dom:"AWS",
  q:"Un bucket S3 est rendu public par erreur. Qui est responsable ?",
  choix:["Le client : il gère la sécurité DANS le cloud","AWS : il gère la sécurité de ses propres services","L'auditeur : il aurait dû détecter la configuration","Personne : c'est un comportement attendu du service"],
  bonne:0,
  explain:"AWS sécurise LE cloud (matériel, hyperviseur, réseau physique). Le client sécurise DANS le cloud : IAM, chiffrement, configuration, patchs de l'OS, données." },

{ id:"c1-18", lvl:1, dom:"Azure",
  q:"Que se passe-t-il si tu supprimes un Resource Group Azure ?",
  choix:["Toutes les ressources qu'il contient sont supprimées","Les ressources migrent vers un groupe par défaut","Seul le groupe disparaît, les ressources subsistent","La suppression échoue tant qu'il n'est pas vide"],
  bonne:0,
  explain:"Le RG regroupe des ressources partageant un cycle de vie, et toute ressource appartient à exactement un RG. C'est puissant… et dangereux sans Resource Lock." },

{ id:"c1-19", lvl:1, dom:"Azure",
  q:"Quelle est la hiérarchie Azure, du plus large au plus fin ?",
  choix:["Management Group, Subscription, Resource Group, Ressource","Subscription, Management Group, Resource Group, Ressource","Tenant, Resource Group, Subscription, Ressource","Resource Group, Management Group, Subscription, Ressource"],
  bonne:0,
  explain:"Policies et RBAC s'héritent du haut vers le bas : une assignation au niveau management group couvre toutes les subscriptions en dessous, présentes et futures." },

{ id:"c1-20", lvl:1, dom:"Réseau",
  q:"Combien d'adresses contient un réseau en <code>/24</code> ?",
  choix:["256","24","512","1024"],
  bonne:0,
  explain:"2^(32−24) = 2^8 = 256. Sur AWS, 5 sont réservées par la plateforme : il reste 251 adresses utilisables." },

{ id:"c1-21", lvl:1, dom:"Réseau",
  q:"Dans quel cas choisit-on UDP plutôt que TCP ?",
  choix:["Quand la latence prime sur la fiabilité","Quand l'ordre des paquets doit être garanti","Quand on transfère un fichier volumineux","Quand on veut un handshake chiffré"],
  bonne:0,
  explain:"TCP apporte handshake, retransmission, ordre garanti et contrôle de flux, au prix de la latence. UDP n'offre aucune garantie mais aucun surcoût : DNS, VoIP, streaming, métriques." },

{ id:"c1-22", lvl:1, dom:"Réseau",
  q:"Pourquoi un CNAME est-il interdit à la racine d'un domaine ?",
  choix:["La racine doit porter ses enregistrements SOA et NS","Les CNAME sont réservés aux sous-domaines par usage","C'est autorisé, mais mauvais pour la performance","Les registrars le facturent comme une option"],
  bonne:0,
  explain:"Un CNAME interdit tout autre enregistrement sur le même nom. D'où les enregistrements ALIAS/ANAME propriétaires : Route 53 Alias, Azure DNS Alias." },

{ id:"c1-23", lvl:1, dom:"Git",
  q:"Quelle est la différence entre <code>git fetch</code> et <code>git pull</code> ?",
  choix:["<code>pull</code> intègre en plus, <code>fetch</code> se contente de rapatrier","<code>fetch</code> intègre en plus, <code>pull</code> se contente de rapatrier","<code>fetch</code> envoie tes commits vers le serveur distant","Aucune : <code>pull</code> est un alias de <code>fetch</code>"],
  bonne:0,
  explain:"<code>pull</code> = <code>fetch</code> + <code>merge</code> (ou rebase) : il modifie ta branche. Avec <code>fetch</code>, on regarde avant de décider." },

{ id:"c1-24", lvl:1, dom:"Git",
  q:"Qu'est-ce qu'une branche Git, techniquement ?",
  choix:["Un pointeur mobile vers un commit","Une copie complète du répertoire de travail","Un répertoire dédié à l'intérieur de .git","Un fichier de différences par rapport à main"],
  bonne:0,
  explain:"41 octets dans <code>.git/refs/heads/</code>. C'est pour ça que créer une branche est instantané et gratuit." },

{ id:"c1-25", lvl:1, dom:"Git",
  q:"Un fichier ajouté au <code>.gitignore</code> apparaît toujours dans tes commits. Pourquoi ?",
  choix:["Il est déjà suivi : il faut <code>git rm --cached</code>","Le .gitignore doit être placé à la racine du disque","Il faut relancer <code>git init</code> pour le recharger","Le .gitignore ne s'applique qu'aux répertoires"],
  bonne:0,
  explain:"<code>.gitignore</code> n'empêche que le suivi de NOUVEAUX fichiers. C'est la raison numéro un pour laquelle un <code>.env</code> reste commité." },

{ id:"c1-26", lvl:1, dom:"CI/CD",
  q:"Différence entre Continuous Delivery et Continuous Deployment ?",
  choix:["En Delivery, un humain déclenche la mise en production","En Deployment, un humain déclenche la mise en production","En Delivery, on ne déploie jamais en production","En Deployment, on se passe complètement de tests"],
  bonne:0,
  explain:"Delivery : chaque build est PRÊT à partir. Deployment : tout build qui passe les tests part effectivement. En banque, on est presque toujours en Delivery." },

{ id:"c1-27", lvl:1, dom:"CI/CD",
  q:"Pourquoi construire un artefact UNE seule fois pour tous les environnements ?",
  choix:["Pour déployer exactement ce qui a été testé","Pour économiser du temps de calcul en CI","Pour respecter les quotas des registries","Pour éviter les collisions de numéros de version"],
  bonne:0,
  explain:"Principe <em>build once, deploy many</em> : on construit un artefact versionné puis on le PROMEUT dev → recette → prod. Seule la configuration change." },

{ id:"c1-28", lvl:1, dom:"Sécurité",
  q:"Quelle est la différence entre authentification et autorisation ?",
  choix:["L'une prouve qui tu es, l'autre ce que tu peux faire","L'une vaut pour les humains, l'autre pour les machines","L'autorisation s'effectue toujours en premier","Ce sont deux traductions du même terme anglais"],
  bonne:0,
  explain:"AuthN puis AuthZ, toujours dans cet ordre. Un token valide (authentifié) ne donne pas forcément le droit d'agir (autorisé)." },

{ id:"c1-29", lvl:1, dom:"Sécurité",
  q:"Que fait-on d'un mot de passe utilisateur avant de le stocker ?",
  choix:["On le hache, salé, avec bcrypt ou argon2","On le chiffre en AES avec une clé serveur","On l'encode en base64 puis on le stocke","On le stocke en clair dans une table protégée"],
  bonne:0,
  explain:"Le hachage est à SENS UNIQUE : on compare des empreintes. Chiffrer serait réversible — qui a la clé a tous les mots de passe. Le base64 n'est pas du chiffrement du tout." },

{ id:"c1-30", lvl:1, dom:"Observabilité",
  q:"Quels sont les trois piliers de l'observabilité ?",
  choix:["Métriques, logs, traces","Alertes, dashboards, rapports","Processeur, mémoire, disque","Prévention, détection, réaction"],
  bonne:0,
  explain:"Métriques (QUOI : agrégats, alerting), logs (POURQUOI : événements détaillés), traces (OÙ : parcours d'une requête). Les trois se corrèlent par un trace ID." },

{ id:"c1-31", lvl:1, dom:"SRE",
  q:"Lequel de ces engagements comporte des pénalités contractuelles ?",
  choix:["Le SLA","Le SLO","Le SLI","Les trois"],
  bonne:0,
  explain:"SLI = l'indicateur mesuré. SLO = l'objectif interne. SLA = l'engagement contractuel. Règle : SLA &lt; SLO, pour garder une marge avant de payer." },

{ id:"c1-32", lvl:1, dom:"SRE",
  q:"Avec un SLO de 99,9 %, quel budget d'indisponibilité mensuel ?",
  choix:["Environ 43 minutes","Environ 4 minutes","Environ 7 heures","Environ 3 jours"],
  bonne:0,
  explain:"0,1 % de 30 jours ≈ 43 min. C'est l'<em>error budget</em> : tant qu'il en reste on déploie vite ; consommé, on gèle les features pour la fiabilité." },

{ id:"c1-33", lvl:1, dom:"SQL",
  q:"Que garantit le « A » d'ACID ?",
  choix:["Atomicité : tout la transaction, ou rien du tout","Accessibilité : les données restent toujours lisibles","Authentification : l'utilisateur est vérifié","Archivage : les données sont conservées"],
  bonne:0,
  explain:"Atomicité (tout ou rien), Cohérence (contraintes respectées), Isolation (les transactions concurrentes ne se voient pas à moitié), Durabilité (survit à un crash)." },

{ id:"c1-34", lvl:1, dom:"SQL",
  q:"Quelle jointure garde toutes les lignes de la table de gauche ?",
  choix:["LEFT JOIN","INNER JOIN","CROSS JOIN","Aucune des trois"],
  bonne:0,
  explain:"Le LEFT JOIN remplit de NULL les colonnes de droite quand rien ne correspond — d'où son usage pour trouver les orphelins avec <code>WHERE b.id IS NULL</code>." },

{ id:"c1-35", lvl:1, dom:"SQL",
  q:"Quelle commande supprime la table elle-même, structure comprise ?",
  choix:["DROP","DELETE","TRUNCATE","PURGE"],
  bonne:0,
  explain:"<code>DELETE</code> supprime des lignes (avec WHERE, annulable). <code>TRUNCATE</code> vide toute la table très vite. <code>DROP</code> supprime la table." }

]);
