window.QCM = (window.QCM || []).concat([
/* ============ QCM NIVEAU 4 — INTERMÉDIAIRE ============ */

{ id:"c4-01", lvl:4, dom:"Kubernetes",
  q:"Dans quel ordre se déroule un <code>kubectl apply</code> ?",
  choix:["API server (authN, RBAC, admission) → etcd → controller crée le ReplicaSet → scheduler assigne un nœud → kubelet démarre les conteneurs","Scheduler → API server → kubelet → etcd","kubelet → etcd → API server → controller","etcd → scheduler → API server → kubelet"],
  bonne:0,
  explain:"Tout passe par l'API server, seule porte d'entrée. Les webhooks mutating s'exécutent avant les validating, et etcd n'est écrit qu'après validation." },

{ id:"c4-02", lvl:4, dom:"Kubernetes",
  q:"Que règle <code>maxUnavailable: 0</code> combiné à <code>maxSurge: 1</code> ?",
  choix:["Aucune perte de capacité pendant le rollout, mais il faut de la marge sur le cluster","Le déploiement le plus rapide possible","Un déploiement blue/green","La désactivation du rolling update"],
  bonne:0,
  explain:"maxSurge = combien de Pods EN PLUS on autorise temporairement ; maxUnavailable = combien peuvent manquer. À 0/1, on ajoute avant de retirer." },

{ id:"c4-03", lvl:4, dom:"Kubernetes",
  q:"Contre quoi un PodDisruptionBudget ne protège-t-il PAS ?",
  choix:["Les disruptions involontaires : crash de nœud, OOMKill, panne matérielle","Les drains de nœud","Les upgrades de node pool","Le scale-down de l'autoscaler"],
  bonne:0,
  explain:"Le PDB ne couvre que les disruptions VOLONTAIRES. Sans lui, un upgrade de node pool peut vider ton service entier ; avec lui, un crash matériel reste un crash." },

{ id:"c4-04", lvl:4, dom:"Kubernetes",
  q:"Quelle est la différence entre un taint et une nodeAffinity ?",
  choix:["Le taint est une répulsion posée par le NŒUD ; la nodeAffinity est une attraction exprimée par le POD","Le taint concerne le CPU, l'affinity la mémoire","Le taint est temporaire, l'affinity est permanente","Ce sont deux syntaxes du même mécanisme"],
  bonne:0,
  explain:"Les deux se combinent : la toleration AUTORISE le Pod à aller sur un nœud tainté, l'affinity le DIRIGE vers le bon type de nœud." },

{ id:"c4-05", lvl:4, dom:"Kubernetes",
  q:"Quel est le FQDN complet d'un Service <code>api</code> dans le namespace <code>prod</code> ?",
  choix:["<code>api.prod.svc.cluster.local</code>","<code>prod.api.cluster.local</code>","<code>api.cluster.local/prod</code>","<code>svc.api.prod.local</code>"],
  bonne:0,
  explain:"Résolu par CoreDNS. Depuis le même namespace, le nom court suffit grâce à la liste <code>search</code> du resolv.conf injecté par le kubelet." },

{ id:"c4-06", lvl:4, dom:"Kubernetes",
  q:"Tu crées un objet Ingress mais rien ne route. Pourquoi ?",
  choix:["Un Ingress n'est qu'une déclaration : il faut un Ingress Controller pour l'appliquer","Il manque un Service de type LoadBalancer","Le namespace n'est pas annoté","L'Ingress met 24 h à se propager"],
  bonne:0,
  explain:"Le controller (ingress-nginx, Traefik, AGIC, ALB Controller) surveille les objets Ingress et configure un vrai reverse proxy. La Gateway API en est le successeur normalisé." },

{ id:"c4-07", lvl:4, dom:"Kubernetes",
  q:"Comment donner à un Pod le droit d'appeler l'API Kubernetes sans excès de privilèges ?",
  choix:["Un ServiceAccount dédié + un Role limité aux verbes nécessaires, lié par un RoleBinding","Lui donner le rôle cluster-admin puis restreindre par NetworkPolicy","Utiliser le ServiceAccount default du namespace","Monter le kubeconfig de l'administrateur"],
  bonne:0,
  explain:"Jamais le SA <code>default</code>, jamais <code>cluster-admin</code>. Et <code>automountServiceAccountToken: false</code> quand le Pod n'appelle pas l'API du tout." },

{ id:"c4-08", lvl:4, dom:"Kubernetes",
  q:"À quoi sert un sidecar ?",
  choix:["Un conteneur secondaire du même Pod : proxy de mesh, collecteur de logs, rechargeur de config","À remplacer le conteneur principal en cas de crash","À exécuter une tâche avant le démarrage","À répliquer le Pod sur un autre nœud"],
  bonne:0,
  explain:"Il partage réseau et volumes avec le conteneur principal. Coût : des ressources par Pod et un ordre d'arrêt à gérer — les <em>native sidecars</em> règlent ce dernier point." },

{ id:"c4-09", lvl:4, dom:"Terraform",
  q:"Que fait <code>terraform state rm</code> ?",
  choix:["Il retire la ressource du state SANS la détruire dans le cloud","Il détruit la ressource et l'enlève du state","Il supprime le fichier de state","Il annule le dernier apply"],
  bonne:0,
  explain:"Terraform cesse simplement de la gérer. Usage : migrer une ressource vers un autre state, ou abandonner sa gestion. Si le code la référence encore, le prochain apply voudra la recréer." },

{ id:"c4-10", lvl:4, dom:"Terraform",
  q:"Pourquoi préférer un bloc <code>moved</code> à <code>terraform state mv</code> ?",
  choix:["Il est versionné, revu en PR, visible dans le plan et rejoué automatiquement par tous","Il est plus rapide","<code>state mv</code> est déprécié","Il fonctionne sans backend distant"],
  bonne:0,
  explain:"<code>state mv</code> est une commande manuelle qu'il faudrait reproduire sur chaque poste et dans la CI. Le bloc <code>moved</code> déclare le refactoring dans le CODE." },

{ id:"c4-11", lvl:4, dom:"Terraform",
  q:"Que fait <code>create_before_destroy</code> ?",
  choix:["Crée le remplaçant avant de supprimer l'ancien, pour éviter la coupure","Empêche toute destruction de la ressource","Ignore les modifications faites hors Terraform","Crée une sauvegarde avant destruction"],
  bonne:0,
  explain:"Attention aux noms uniques : la ressource de remplacement ne peut pas porter le même nom que celle encore existante. <code>prevent_destroy</code> et <code>ignore_changes</code> répondent à d'autres besoins." },

{ id:"c4-12", lvl:4, dom:"Terraform",
  q:"Que ne doit JAMAIS contenir un module Terraform réutilisable ?",
  choix:["Un bloc <code>provider</code> ou <code>backend</code> — ils appartiennent au root module","Des outputs","Des variables avec validation","Des locals"],
  bonne:0,
  explain:"Un module qui définit son propre provider ne peut plus être supprimé proprement. Il les REÇOIT via <code>providers = { aws = aws.eu }</code>." },

{ id:"c4-13", lvl:4, dom:"AWS",
  q:"Un rôle a <code>s3:GetObject</code> mais l'appel échoue en AccessDenied. Cause la plus probable si l'objet est chiffré ?",
  choix:["Il manque <code>kms:Decrypt</code> sur la clé KMS","Le bucket est dans une autre région","L'objet est en classe Glacier","La policy doit être attachée à un user, pas à un rôle"],
  bonne:0,
  explain:"Autres suspects : un Deny explicite (bucket policy, SCP, boundary), Block Public Access, ou une condition non satisfaite. On tranche avec le Policy Simulator et CloudTrail." },

{ id:"c4-14", lvl:4, dom:"AWS",
  q:"Dans l'évaluation d'une décision IAM, qu'est-ce qui l'emporte toujours ?",
  choix:["Un Deny explicite","Un Allow explicite dans une identity policy","La policy la plus récente","La policy attachée au plus près de la ressource"],
  bonne:0,
  explain:"1) Deny par défaut. 2) Un Deny explicite arrête l'évaluation. 3) Sinon il faut un Allow dans l'intersection SCP ∩ boundary ∩ identity policy (ou une resource policy)." },

{ id:"c4-15", lvl:4, dom:"AWS",
  q:"Quelle est la différence entre RDS Multi-AZ et un Read Replica ?",
  choix:["Multi-AZ = haute disponibilité (réplication synchrone, bascule auto) ; Read Replica = montée en charge en lecture (asynchrone)","Multi-AZ permet de lire sur le standby","Read Replica bascule automatiquement en cas de panne","Ce sont deux noms du même mécanisme"],
  bonne:0,
  explain:"Question très discriminante. Le standby Multi-AZ n'est pas lisible (sur RDS classique) : il sert uniquement à la disponibilité." },

{ id:"c4-16", lvl:4, dom:"AWS",
  q:"Quel VPC Endpoint est gratuit et s'ajoute comme une route ?",
  choix:["Le Gateway endpoint (S3 et DynamoDB uniquement)","L'Interface endpoint (PrivateLink)","Les deux sont gratuits","Aucun, tous sont facturés à l'heure"],
  bonne:0,
  explain:"L'Interface endpoint crée une ENI avec IP privée dans ton subnet et se facture à l'heure ET au Go — mais il couvre la plupart des services." },

{ id:"c4-17", lvl:4, dom:"Azure",
  q:"Comment une App Service accède-t-elle à un Key Vault sans stocker de secret ?",
  choix:["Managed Identity + rôle Key Vault Secrets User, puis référence <code>@Microsoft.KeyVault(SecretUri=…)</code>","En stockant la clé du coffre dans les app settings","Via une chaîne de connexion chiffrée","En montant le coffre comme un volume"],
  bonne:0,
  explain:"Aucun secret dans le code ni dans la configuration. C'est le schéma attendu sur toute question de gestion de secrets côté Azure." },

{ id:"c4-18", lvl:4, dom:"Azure",
  q:"Quel est le piège classique lors d'un swap de deployment slot ?",
  choix:["Par défaut les app settings SUIVENT le swap : il faut cocher « deployment slot setting » sur ce qui est spécifique à l'environnement","Le swap provoque toujours une coupure de service","Les slots ne partagent pas le même plan","Le rollback après swap est impossible"],
  bonne:0,
  explain:"Sinon la préproduction récupère les chaînes de connexion de production, et inversement. Le retour arrière se fait en re-swappant." },

{ id:"c4-19", lvl:4, dom:"Azure",
  q:"Un Global Administrator Entra ID a-t-il par défaut des droits sur les ressources Azure ?",
  choix:["Non : Entra ID gère l'annuaire, Azure RBAC gère les ressources — il doit activer « Elevate access »","Oui, il a tous les droits partout","Oui, mais seulement en lecture","Seulement sur les subscriptions qu'il a créées"],
  bonne:0,
  explain:"Deux plans distincts. C'est une question de niveau senior qui piège beaucoup de candidats." },

{ id:"c4-20", lvl:4, dom:"Azure",
  q:"Dans une topologie hub-and-spoke, que met-on dans le hub ?",
  choix:["Azure Firewall, VPN/ExpressRoute Gateway, Bastion, DNS privé","Les applications les plus critiques","Les bases de données de production","Les environnements de développement"],
  bonne:0,
  explain:"Les spokes ne se parlent pas directement : on force le transit par le hub via des UDR pour inspecter le trafic. C'est le modèle standard des landing zones bancaires." },

{ id:"c4-21", lvl:4, dom:"CI/CD",
  q:"Quel est le coût principal d'un déploiement blue/green par rapport à un canary ?",
  choix:["Il faut payer la double capacité pendant la bascule","Il est impossible de revenir en arrière","Il exige deux bases de données","Il ne fonctionne pas avec des conteneurs"],
  bonne:0,
  explain:"Blue/green : bascule totale, rollback instantané, double capacité. Canary : montée progressive selon les métriques, moins cher, mais plus long et deux versions coexistent." },

{ id:"c4-22", lvl:4, dom:"CI/CD",
  q:"Comment déployer sans coupure une migration de base incompatible ?",
  choix:["Pattern expand/contract : ajouter, écrire dans les deux, migrer, puis seulement supprimer","Mettre l'application en maintenance le temps de la migration","Faire la migration après le déploiement du nouveau code","Utiliser une transaction unique très longue"],
  bonne:0,
  explain:"L'ancienne version doit continuer de fonctionner pendant tout le rollout — c'est aussi ce qui rend le rollback possible. Jamais de migration destructive dans le même déploiement que le code." },

{ id:"c4-23", lvl:4, dom:"CI/CD",
  q:"Que fait-on d'un test flaky ?",
  choix:["On le met en quarantaine hors du pipeline bloquant, on ouvre un ticket et on corrige la cause","On le relance jusqu'à ce qu'il passe","On le supprime définitivement","On augmente son timeout"],
  bonne:0,
  explain:"Causes : dépendance au temps, à l'ordre d'exécution, au réseau, à un état partagé. Un pipeline qu'on relance « pour voir » a perdu toute valeur de signal." },

{ id:"c4-24", lvl:4, dom:"Linux",
  q:"Quel mécanisme LIMITE la consommation de ressources d'un conteneur ?",
  choix:["Les cgroups","Les namespaces","Les capabilities","Le système de fichiers overlay"],
  bonne:0,
  explain:"Les namespaces isolent ce que le processus VOIT (pid, net, mnt, uts, ipc, user). Les cgroups limitent ce qu'il CONSOMME (cpu, memory, io, pids)." },

{ id:"c4-25", lvl:4, dom:"Linux",
  q:"Comment vérifier que ton application a été tuée par l'OOM killer ?",
  choix:["<code>dmesg -T | grep -i oom</code> ou <code>journalctl -k</code>","Dans les logs applicatifs","Avec <code>top</code>","Avec <code>df -h</code>"],
  bonne:0,
  explain:"Le noyau logue « Out of memory: Killed process ». Côté conteneur : exit code 137 et <code>OOMKilled</code> dans <code>kubectl describe</code>." },

{ id:"c4-26", lvl:4, dom:"Réseau",
  q:"Un client obtient un TIMEOUT plutôt qu'un « connection refused ». Que suspectes-tu ?",
  choix:["Un firewall qui DROP silencieusement, ou une route absente","Un service qui n'écoute pas sur le port","Un certificat TLS expiré","Une erreur DNS"],
  bonne:0,
  explain:"DROP = pas de réponse, le client attend. REJECT = RST ou ICMP unreachable, refus immédiat. Donc : timeout → SG/NSG/NACL ou routage ; refused → rien n'écoute." },

{ id:"c4-27", lvl:4, dom:"Réseau",
  q:"Symptôme signature d'un MTU mal réglé sur un tunnel VPN ?",
  choix:["Les petites requêtes passent, les gros transferts se figent","Toutes les connexions échouent","La latence double uniformément","Le DNS ne résout plus"],
  bonne:0,
  explain:"Les paquets pleins nécessitent une fragmentation refusée, souvent parce que l'ICMP « fragmentation needed » est bloqué : le PMTUD est cassé." },

{ id:"c4-28", lvl:4, dom:"Sécurité",
  q:"Qu'est-ce que mTLS apporte par rapport à TLS classique ?",
  choix:["Le CLIENT présente aussi un certificat : authentification mutuelle","Un chiffrement plus fort","Une compression du trafic","Une meilleure performance"],
  bonne:0,
  explain:"On l'impose entre services internes (service mesh, zero trust) ou avec des API partenaires. Coût : une PKI et une rotation de certificats à industrialiser." },

{ id:"c4-29", lvl:4, dom:"Sécurité",
  q:"Qu'est-ce qu'OpenID Connect ajoute à OAuth 2.0 ?",
  choix:["Une couche d'AUTHENTIFICATION avec un <code>id_token</code> décrivant l'utilisateur","Le chiffrement des tokens","La révocation automatique","La gestion des rôles"],
  bonne:0,
  explain:"OAuth 2.0 est un protocole d'AUTORISATION (déléguer un accès). Utiliser OAuth seul pour authentifier est une erreur de conception classique." },

{ id:"c4-30", lvl:4, dom:"Sécurité",
  q:"À quoi sert une permission boundary AWS ?",
  choix:["Plafonner les droits d'une identité : les permissions effectives sont l'INTERSECTION policy ∩ boundary","Interdire l'accès depuis certaines IP","Limiter la durée d'une session","Chiffrer les credentials"],
  bonne:0,
  explain:"Usage typique : laisser des équipes créer leurs propres rôles IAM sans qu'elles puissent s'octroyer plus que la boundary — délégation encadrée." },

{ id:"c4-31", lvl:4, dom:"Observabilité",
  q:"Que mesure la méthode RED ?",
  choix:["Rate, Errors, Duration — l'expérience côté service","Resources, Efficiency, Downtime","Read, Execute, Delete","Reliability, Endurance, Density"],
  bonne:0,
  explain:"RED répond à « mes utilisateurs souffrent-ils ? ». USE (Utilization, Saturation, Errors) répond à « quelle ressource est le goulot ? »." },

{ id:"c4-32", lvl:4, dom:"Observabilité",
  q:"Pourquoi regarder le p99 plutôt que la moyenne de latence ?",
  choix:["La moyenne masque la queue : 99 requêtes à 50 ms et une à 10 s donnent une moyenne rassurante","Le p99 est plus facile à calculer","La moyenne n'est pas supportée par Prometheus","Le p99 est exigé par les SLA"],
  bonne:0,
  explain:"Sur une page qui fait 20 appels, le p99 de chaque appel devient l'expérience normale d'un utilisateur. Et on ne moyenne jamais des percentiles : ils ne sont pas additifs." },

{ id:"c4-33", lvl:4, dom:"SRE",
  q:"Que signifie RPO ?",
  choix:["Le volume de données qu'on accepte de perdre","Le temps nécessaire pour rétablir le service","Le nombre de réplicas minimum","Le pourcentage de disponibilité garanti"],
  bonne:0,
  explain:"RTO = en combien de temps on revient. RPO = combien de données on perd. Un RPO proche de zéro impose de la réplication synchrone, donc du coût et de la latence." },

{ id:"c4-34", lvl:4, dom:"SQL",
  q:"Comment évite-t-on structurellement les deadlocks ?",
  choix:["Accéder aux ressources toujours dans le MÊME ordre et garder les transactions courtes","Augmenter le timeout de verrouillage","Passer en isolation Serializable","Supprimer les index"],
  bonne:0,
  explain:"Un deadlock, c'est deux transactions qui s'attendent mutuellement ; le SGBD en tue une et l'application doit rejouer. Indexer aide aussi : on verrouille des lignes plutôt que des plages." },

{ id:"c4-35", lvl:4, dom:"SQL",
  q:"Pourquoi <code>OFFSET 100000</code> est-il lent pour paginer ?",
  choix:["La base doit parcourir puis jeter 100 000 lignes ; le coût croît avec la page","Il verrouille toute la table","Il désactive les index","Il n'est pas supporté par PostgreSQL"],
  bonne:0,
  explain:"On préfère la pagination par clé (keyset/seek) : <code>WHERE (created_at, id) &lt; (:date, :id) ORDER BY … LIMIT 50</code>, à coût constant avec un index adapté." }

]);

</script>
<script>
/* qcm/niveau05.js */
window.QCM = (window.QCM || []).concat([
/* ============ QCM NIVEAU 5 — RÉSEAU, SÉCURITÉ, ÉTAT ============ */

{ id:"c5-01", lvl:5, dom:"Kubernetes",
  q:"Que garantit le modèle réseau CNI de Kubernetes ?",
  choix:["Chaque Pod a sa propre IP et tous les Pods se joignent SANS NAT","Tous les Pods partagent l'IP de leur nœud","Le trafic inter-Pod est chiffré par défaut","Les Pods d'un namespace sont isolés par défaut"],
  bonne:0,
  explain:"Un Pod se voit avec la même IP que les autres le voient. Le plugin (Calico, Cilium, Azure CNI, VPC CNI) implémente ce réseau plat, par overlay ou par routage natif." },

{ id:"c5-02", lvl:5, dom:"Kubernetes",
  q:"Quel est le comportement par défaut du trafic entre Pods, sans NetworkPolicy ?",
  choix:["Tout est autorisé, y compris entre namespaces","Tout est bloqué jusqu'à autorisation explicite","Seul le trafic intra-namespace est permis","Cela dépend du cloud provider"],
  bonne:0,
  explain:"Dès qu'une NetworkPolicy sélectionne un Pod pour une direction, tout ce qui n'est pas explicitement autorisé DANS CETTE DIRECTION devient interdit. Bonne pratique : default-deny par namespace." },

{ id:"c5-03", lvl:5, dom:"Kubernetes",
  q:"Ton HPA ne fait rien du tout. Quelle est la cause la plus fréquente ?",
  choix:["Les <code>resources.requests</code> ne sont pas définies : impossible de calculer un pourcentage","Le Deployment a trop de réplicas","Le namespace n'a pas de quota","Le HPA nécessite un service mesh"],
  bonne:0,
  explain:"Le HPA compare l'usage à la cible en % des <b>requests</b>. Autre prérequis : le metrics-server doit être installé." },

{ id:"c5-04", lvl:5, dom:"Kubernetes",
  q:"Quel autoscaler ajoute des NŒUDS au cluster ?",
  choix:["Le Cluster Autoscaler, déclenché par des Pods Pending","Le HPA","Le VPA","KEDA"],
  bonne:0,
  explain:"HPA = plus de Pods. VPA = ajuste les requests d'un Pod (et le redémarre). KEDA = réplicas sur événement, avec scale-to-zero. HPA + Cluster Autoscaler se complètent parfaitement." },

{ id:"c5-05", lvl:5, dom:"Kubernetes",
  q:"Que fait <code>kubectl drain</code> avant d'évincer les Pods ?",
  choix:["Il cordonne le nœud, puis évince en respectant les PodDisruptionBudgets","Il sauvegarde les volumes","Il migre les Pods à chaud sans redémarrage","Il supprime le nœud du cluster"],
  bonne:0,
  explain:"Précautions : capacité disponible ailleurs, PDB définis, <code>--ignore-daemonsets</code>, et <code>--delete-emptydir-data</code> seulement si on accepte de perdre ces données." },

{ id:"c5-06", lvl:5, dom:"Kubernetes",
  q:"Quel accessMode permet à plusieurs nœuds de monter le même volume en écriture ?",
  choix:["ReadWriteMany (NFS, EFS, Azure Files)","ReadWriteOnce","ReadOnlyMany","ReadWriteOncePod"],
  bonne:0,
  explain:"Un disque bloc (EBS, Azure Disk) est ReadWriteOnce : un seul nœud à la fois. D'où les erreurs « Multi-Attach » quand un Pod veut démarrer ailleurs avant le détachement." },

{ id:"c5-07", lvl:5, dom:"Kubernetes",
  q:"Comment un Pod EKS obtient-il des droits AWS sans clé statique ?",
  choix:["IRSA : provider OIDC + rôle IAM dont la trust policy accepte le ServiceAccount, annoté avec l'ARN","En montant les credentials de l'instance","Via un Secret Kubernetes contenant la clé","Par une NetworkPolicy vers l'API AWS"],
  bonne:0,
  explain:"Le SDK obtient des credentials temporaires par <code>AssumeRoleWithWebIdentity</code>. Droits par APPLICATION et non par nœud — c'est la différence clé avec l'instance profile." },

{ id:"c5-08", lvl:5, dom:"Terraform",
  q:"Comment détecter industriellement la dérive (drift) ?",
  choix:["<code>terraform plan -detailed-exitcode</code> planifié en CI (code 2 = changements)","<code>terraform validate</code> quotidien","En comparant les fichiers .tf entre eux","En relisant les logs CloudTrail à la main"],
  bonne:0,
  explain:"La vraie solution est en amont : retirer les droits d'écriture manuels en production. La détection ne fait que constater." },

{ id:"c5-09", lvl:5, dom:"Terraform",
  q:"Pourquoi éviter <code>terraform_remote_state</code> pour lire une valeur d'un autre state ?",
  choix:["Il exige un droit de lecture sur TOUT le state distant, donc sur ses secrets, et crée un couplage fort","Il est déprécié","Il ne fonctionne qu'avec le backend S3","Il ralentit le plan de 30 secondes"],
  bonne:0,
  explain:"Alternative préférable en banque : publier la valeur dans une source de vérité (SSM Parameter, Key Vault, tag) et la lire avec une data source — droits fins, découplage." },

{ id:"c5-10", lvl:5, dom:"Terraform",
  q:"Comment gérer deux régions dans une même configuration ?",
  choix:["Des providers aliasés (<code>alias = \"us\"</code>) référencés par <code>provider = aws.us</code>","Deux blocs backend","Une variable region avec une boucle for_each sur le provider","Deux fichiers .tfvars"],
  bonne:0,
  explain:"Cas typique : un certificat ACM pour CloudFront doit être créé dans us-east-1. Les modules reçoivent les providers via <code>providers = { … }</code>." },

{ id:"c5-11", lvl:5, dom:"Terraform",
  q:"Quel outil vérifie la conformité de l'infrastructure AVANT création ?",
  choix:["OPA/Conftest, Sentinel ou Checkov appliqués sur le plan JSON","terraform fmt","terraform refresh","Le linter du provider"],
  bonne:0,
  explain:"C'est le contrôle le moins cher. Mais il ne suffit pas : il faut aussi une admission côté plateforme (Azure Policy, SCP, Kyverno) pour ce qui contournerait le pipeline." },

{ id:"c5-12", lvl:5, dom:"AWS",
  q:"À quoi sert une dead-letter queue ?",
  choix:["Isoler les messages en échec après N tentatives, pour ne pas bloquer le traitement","Archiver les messages traités","Chiffrer les messages sensibles","Prioriser les messages urgents"],
  bonne:0,
  explain:"Sans DLQ, un message « poison » est redélivré indéfiniment. Il faut aussi ALERTER sur la profondeur de la DLQ : une DLQ que personne ne regarde est une perte de données silencieuse." },

{ id:"c5-13", lvl:5, dom:"AWS",
  q:"Quelle est la différence fonctionnelle entre SQS et SNS ?",
  choix:["SQS = file consommée en pull, un message traité une fois ; SNS = pub/sub en push vers plusieurs abonnés","SQS est synchrone, SNS asynchrone","SNS garantit l'ordre, pas SQS","SQS ne fonctionne qu'avec Lambda"],
  bonne:0,
  explain:"Le fan-out combine les deux : SNS publie vers PLUSIEURS files SQS, chacune consommée par un service indépendant à son rythme." },

{ id:"c5-14", lvl:5, dom:"AWS",
  q:"Comment réduire un cold start Lambda ?",
  choix:["Package léger, dépendances hors du handler, plus de mémoire, Provisioned Concurrency si nécessaire","Augmenter le timeout","Désactiver le VPC","Utiliser un runtime plus ancien"],
  bonne:0,
  explain:"Plus de mémoire = plus de CPU alloué, donc init plus rapide. La Provisioned Concurrency garde des environnements chauds, au prix d'un coût fixe." },

{ id:"c5-15", lvl:5, dom:"AWS",
  q:"Lequel répond à « qui a fait quel appel API, quand et depuis où » ?",
  choix:["CloudTrail","CloudWatch","AWS Config","GuardDuty"],
  bonne:0,
  explain:"CloudWatch = métriques, logs, alarmes. AWS Config = état et historique de CONFIGURATION avec règles de conformité. Distinction classique en environnement régulé." },

{ id:"c5-16", lvl:5, dom:"Azure",
  q:"Quel niveau de redondance réplique dans la région appairée ?",
  choix:["GRS","LRS","ZRS","Aucun"],
  bonne:0,
  explain:"LRS = 3 copies dans un datacenter. ZRS = 3 zones de la région. GRS = LRS + réplication asynchrone géo. GZRS = ZRS + géo. Les variantes RA-* permettent de lire le secondaire." },

{ id:"c5-17", lvl:5, dom:"Azure",
  q:"Dans quel cas une UDR est-elle indispensable ?",
  choix:["Pour forcer le trafic d'un spoke vers l'IP privée du firewall du hub (next hop Virtual Appliance)","Pour attribuer une IP publique à une VM","Pour activer les Private Endpoints","Pour autoriser le trafic entre deux subnets"],
  bonne:0,
  explain:"L'UDR surcharge le routage système d'Azure. Autre cas : le forced tunneling vers l'on-premise via ExpressRoute — exigence courante en banque." },

{ id:"c5-18", lvl:5, dom:"Azure",
  q:"Qu'est-ce que KQL ?",
  choix:["Le langage de requête de Log Analytics et Azure Monitor","Un format de fichier de configuration Azure","Le protocole de Key Vault","Un type de base de données Cosmos"],
  bonne:0,
  explain:"Exemple : <code>AzureDiagnostics | where TimeGenerated &gt; ago(1h) | summarize count() by ResourceId</code>. Il alimente aussi les alertes, les workbooks et Azure Resource Graph." },

{ id:"c5-19", lvl:5, dom:"Azure",
  q:"Quel est le principal inconvénient d'Azure CNI par rapport à Kubenet ?",
  choix:["Chaque Pod consomme une IP DU VNET : il faut dimensionner le subnet en conséquence","Il ne supporte pas les NetworkPolicy","Il est plus lent","Il ne fonctionne pas avec les Private Endpoints"],
  bonne:0,
  explain:"Dimensionnement : nœuds × (max pods par nœud + 1). Un sous-dimensionnement bloque la montée en charge et ne se corrige pas à chaud. Azure CNI Overlay est le compromis moderne." },

{ id:"c5-20", lvl:5, dom:"Réseau",
  q:"Quelle est la différence entre un proxy et un reverse proxy ?",
  choix:["Le proxy est côté client pour le trafic sortant ; le reverse proxy est côté serveur pour le trafic entrant","Le reverse proxy chiffre, le proxy non","Le proxy fonctionne en L4, le reverse proxy en L7","Aucune, c'est une question de configuration"],
  bonne:0,
  explain:"Le proxy d'entreprise (sortant, filtrage, inspection TLS) est obligatoire en banque — pensez à <code>HTTP_PROXY</code>/<code>NO_PROXY</code> et à la CA interne dans les conteneurs." },

{ id:"c5-21", lvl:5, dom:"Réseau",
  q:"Deux VPC sont peerés mais A ne joint pas C via B. Pourquoi ?",
  choix:["Le peering n'est pas transitif : il faut un Transit Gateway","Les CIDR sont trop grands","Le peering met 24 h à se propager","Il manque une NAT Gateway"],
  bonne:0,
  explain:"Autres vérifications sur un peering : accepté des deux côtés, routes présentes dans LES DEUX route tables, CIDR non chevauchants, SG/NACL ouverts dans les deux sens." },

{ id:"c5-22", lvl:5, dom:"Réseau",
  q:"Pourquoi l'IP source change-t-elle en sortie d'un VPC via NAT Gateway ?",
  choix:["Le NAT fait du Source NAT : l'IP privée est remplacée par l'IP publique du NAT","Le routeur anonymise le trafic pour la sécurité","L'IP privée n'est pas routable donc elle est supprimée","C'est un comportement propre à AWS"],
  bonne:0,
  explain:"Conséquence pratique : côté partenaire, c'est l'IP du NAT qu'il faut autoriser en liste blanche, pas celle de l'instance." },

{ id:"c5-23", lvl:5, dom:"Sécurité",
  q:"Le payload d'un JWT est-il chiffré ?",
  choix:["Non : il est signé, donc lisible par tous. Jamais de secret dedans","Oui, avec la clé du serveur","Oui, si l'algorithme est RS256","Cela dépend de l'émetteur"],
  bonne:0,
  explain:"Erreurs classiques : ne pas vérifier la signature, accepter <code>alg: none</code>, ne pas valider <code>exp</code>/<code>aud</code>/<code>iss</code>, et croire qu'on peut révoquer un JWT." },

{ id:"c5-24", lvl:5, dom:"Sécurité",
  q:"Pourquoi la rotation de secrets ne suffit-elle pas ?",
  choix:["Elle limite la fenêtre d'exploitation mais ne détecte pas la fuite","Elle est trop lente à automatiser","Elle casse les applications en production","Elle n'est pas exigée par les auditeurs"],
  bonne:0,
  explain:"Il faut aussi la détection de secrets dans le code, la journalisation des accès au coffre, l'alerte sur usage anormal — et surtout supprimer les secrets longue durée au profit de l'identité fédérée." },

{ id:"c5-25", lvl:5, dom:"Sécurité",
  q:"Quelle parade rend le contrôle des images NON contournable ?",
  choix:["Une politique d'admission (Kyverno, Gatekeeper) qui rejette les images non signées ou hors registry approuvé","Un scan bloquant en CI","Une revue de code obligatoire","Un registry privé"],
  bonne:0,
  explain:"La CI seule ne suffit jamais : quelqu'un finira par déployer hors pipeline. L'admission est la dernière barrière — elle ne remplace pas la CI, elle la rend obligatoire." },

{ id:"c5-26", lvl:5, dom:"Sécurité",
  q:"Qu'est-ce qu'une attaque de la chaîne d'approvisionnement sur une image de conteneur ?",
  choix:["La compromission d'un maillon amont : image de base, paquet typosquatté, action de CI tierce non épinglée","Un déni de service sur le registry","Le vol des credentials du registry","Une injection SQL dans l'application"],
  bonne:0,
  explain:"Parades : registry miroir avec bases approuvées, pin par digest, SBOM et scan continu, signature Cosign vérifiée à l'admission, attestations de provenance (SLSA)." },

{ id:"c5-27", lvl:5, dom:"Observabilité",
  q:"Prometheus fonctionne en push ou en pull ?",
  choix:["En pull : il scrape des endpoints /metrics découverts par service discovery","En push : les applications envoient leurs métriques","Les deux au choix","En pull pour les métriques, en push pour les logs"],
  bonne:0,
  explain:"Avantage du pull : il sait qui ne répond plus (<code>up == 0</code>). Pour les jobs batch qui meurent avant le scrape, on passe par le Pushgateway — avec parcimonie." },

{ id:"c5-28", lvl:5, dom:"Observabilité",
  q:"Pourquoi ne peut-on pas moyenner des p95 de plusieurs instances ?",
  choix:["Les percentiles ne sont pas additifs : il faut agréger les buckets bruts de l'histogramme","Parce que les instances ont des charges différentes","Parce que Prometheus l'interdit","On peut, c'est une bonne pratique"],
  bonne:0,
  explain:"D'où <code>histogram_quantile(0.95, sum(rate(..._bucket[5m])) by (le))</code>, qui agrège les buckets AVANT de calculer le quantile." },

{ id:"c5-29", lvl:5, dom:"Observabilité",
  q:"Pourquoi un compteur Prometheus s'utilise-t-il toujours avec <code>rate()</code> ?",
  choix:["Sa valeur brute cumulée n'a pas de sens ; <code>rate()</code> donne la variation par seconde et gère les redémarrages","Parce que <code>rate()</code> est plus rapide","Pour convertir en pourcentage","Pour lisser les pics"],
  bonne:0,
  explain:"« 4 823 191 requêtes depuis le démarrage » n'informe personne. <code>rate()</code> gère automatiquement les remises à zéro lors d'un redémarrage du process." },

{ id:"c5-30", lvl:5, dom:"SQL",
  q:"Quel niveau d'isolation empêche les lectures non répétables mais autorise encore les phantom reads ?",
  choix:["Repeatable Read","Read Committed","Read Uncommitted","Serializable"],
  bonne:0,
  explain:"Progression : Read Uncommitted (lectures sales) → Read Committed (lectures non répétables) → Repeatable Read (phantoms) → Serializable (tout empêché, au prix de la concurrence)." },

{ id:"c5-31", lvl:5, dom:"SQL",
  q:"Quelle est la première étape pour diagnostiquer une requête lente ?",
  choix:["<code>EXPLAIN ANALYZE</code> pour lire le plan d'exécution réel","Ajouter un index sur toutes les colonnes du WHERE","Augmenter la RAM du serveur","Passer en isolation Read Uncommitted"],
  bonne:0,
  explain:"On cherche : seq scan sur grosse table, estimation de lignes très éloignée du réel (statistiques périmées), mauvais ordre de jointure, tri sur disque." },

{ id:"c5-32", lvl:5, dom:"SRE",
  q:"Que fait un circuit breaker après N échecs ?",
  choix:["Il OUVRE le circuit et fait échouer immédiatement les appels, puis teste périodiquement (half-open)","Il redémarre le service défaillant","Il redirige vers un autre datacenter","Il met les requêtes en file d'attente"],
  bonne:0,
  explain:"Sans lui, les threads s'accumulent en attente de timeout et la panne d'un service en profondeur remonte en cascade jusqu'au front — mode de défaillance numéro un des microservices." },

{ id:"c5-33", lvl:5, dom:"SRE",
  q:"Qu'est-ce qu'une dégradation gracieuse ?",
  choix:["Le service rend l'essentiel en désactivant l'accessoire, au lieu de tomber entièrement","Une baisse progressive des performances","L'arrêt planifié d'un service","Le passage automatique en lecture seule"],
  bonne:0,
  explain:"Exemple bancaire : si le scoring temps réel est indisponible, on continue d'afficher solde et historique en désactivant les recommandations. Cela suppose d'avoir hiérarchisé les fonctions AVANT l'incident." },

{ id:"c5-34", lvl:5, dom:"Docker",
  q:"Qu'apporte BuildKit pour les secrets ?",
  choix:["<code>--mount=type=secret</code> : le secret est disponible pendant le RUN sans rester dans les couches","Il chiffre les couches de l'image","Il stocke les secrets dans le registry","Il génère automatiquement des secrets éphémères"],
  bonne:0,
  explain:"BuildKit apporte aussi la parallélisation du graphe, le cache exportable entre machines (crucial pour des runners éphémères) et les builds multi-plateformes." },

{ id:"c5-35", lvl:5, dom:"CI/CD",
  q:"Comment exécuter des migrations de base dans un déploiement Kubernetes ?",
  choix:["Un Job (ou hook Helm pre-upgrade) en UNE seule instance, avant le rollout","Un initContainer sur chaque Pod","Dans le CMD du conteneur principal","Manuellement après le déploiement"],
  bonne:0,
  explain:"Un initContainer sur N réplicas = N migrations simultanées : anti-pattern. L'outil de migration (Flyway, Liquibase) pose en plus un verrou en base." }

]);

</script>
<script>
/* qcm/niveau06.js */
window.QCM = (window.QCM || []).concat([
/* ============ QCM NIVEAU 6 — TROUBLESHOOTING ============ */

{ id:"c6-01", lvl:6, dom:"Kubernetes",
  q:"Un Service ne route vers aucun Pod. Quelle est la PREMIÈRE vérification ?",
  choix:["<code>kubectl get endpoints &lt;svc&gt;</code> : s'ils sont vides, aucun Pod ne matche ou aucun n'est Ready","Redémarrer kube-proxy","Vérifier le certificat TLS de l'Ingress","Augmenter le nombre de réplicas"],
  bonne:0,
  explain:"Endpoints vides → comparer le <code>selector</code> aux labels réels des Pods, puis vérifier la readiness. Ensuite seulement : targetPort vs port écouté, NetworkPolicy, kube-proxy." },

{ id:"c6-02", lvl:6, dom:"Kubernetes",
  q:"Un Pod est OOMKilled alors que la métrique moyenne de mémoire semble basse. Pourquoi ?",
  choix:["L'OOMKill se déclenche sur un PIC instantané, invisible sur une moyenne à 1 minute","La métrique est mal collectée","Le nœud manque de mémoire, pas le Pod","La limite s'applique à tout le namespace"],
  bonne:0,
  explain:"Regarder le MAX de <code>container_memory_working_set_bytes</code>, pas la moyenne. Correctifs : augmenter la limite, régler le heap JVM/Node sur le cgroup, chercher une fuite." },

{ id:"c6-03", lvl:6, dom:"Kubernetes",
  q:"Pendant chaque déploiement, la moitié des requêtes échoue en 502 pendant 30 s. Cause probable ?",
  choix:["Race entre l'arrêt du Pod et la propagation du retrait des endpoints","Le nouveau code est bugué","Le load balancer est saturé","Le certificat TLS est renouvelé"],
  bonne:0,
  explain:"Correctif : hook <code>preStop</code> avec un sleep de 5-10 s, readiness qui bascule en échec avant l'arrêt, <code>terminationGracePeriodSeconds</code> suffisant, arrêt gracieux applicatif." },

{ id:"c6-04", lvl:6, dom:"Kubernetes",
  q:"Un nœud passe NotReady. Au bout de combien de temps ses Pods sont-ils évincés par défaut ?",
  choix:["Environ 5 minutes","Immédiatement","30 secondes","Jamais, il faut intervenir manuellement"],
  bonne:0,
  explain:"Le node controller taint le nœud, les Pods passent Unknown puis sont évincés après le délai de toleration. Exception : un StatefulSet avec volume attaché attend le détachement, pour éviter la double écriture." },

{ id:"c6-05", lvl:6, dom:"Kubernetes",
  q:"Comment déboguer un conteneur distroless (sans shell) en production ?",
  choix:["<code>kubectl debug -it &lt;pod&gt; --image=busybox --target=&lt;conteneur&gt;</code>","<code>kubectl exec -it &lt;pod&gt; -- sh</code>","Reconstruire l'image avec un shell et redéployer","Se connecter en SSH sur le nœud et utiliser docker exec"],
  bonne:0,
  explain:"Le conteneur éphémère partage les namespaces de la cible sans redémarrer le Pod. Variante : <code>--copy-to</code> pour travailler sur une copie, ou <code>kubectl debug node/&lt;node&gt;</code>." },

{ id:"c6-06", lvl:6, dom:"Kubernetes",
  q:"Le DNS interne est intermittent. Quelle piste spécifique à Kubernetes explores-tu ?",
  choix:["<code>ndots:5</code> dans resolv.conf : chaque nom externe génère 4-5 requêtes inutiles, saturant CoreDNS","Le TTL des enregistrements est trop court","Le Service DNS a une mauvaise IP","Les Pods n'ont pas de route par défaut"],
  bonne:0,
  explain:"Autres pistes : réplicas et CPU de CoreDNS, conntrack saturé sur les nœuds, NetworkPolicy bloquant le port 53. Remède courant : NodeLocal DNSCache." },

{ id:"c6-07", lvl:6, dom:"Kubernetes",
  q:"Un namespace reste bloqué en <code>Terminating</code>. Que se passe-t-il ?",
  choix:["Un objet porte un finalizer qu'aucun contrôleur ne lève (opérateur désinstallé, webhook injoignable)","etcd est plein","Le namespace contient trop d'objets","C'est normal, il faut attendre 24 h"],
  bonne:0,
  explain:"On identifie l'objet bloqué dans les conditions du namespace et on répare le contrôleur. Retirer le finalizer à la main est un dernier recours qui peut laisser des ressources cloud orphelines." },

{ id:"c6-08", lvl:6, dom:"Kubernetes",
  q:"Des Pods sont évincés pour <code>ephemeral-storage</code>. Coupable le plus fréquent ?",
  choix:["Des logs applicatifs écrits dans le conteneur au lieu de stdout","Un volume persistant mal dimensionné","Trop d'images sur le nœud uniquement","Un Secret trop volumineux"],
  bonne:0,
  explain:"Correctifs : logger sur stdout, définir <code>ephemeral-storage</code> en requests/limits, garbage collection des images, volume dédié pour les fichiers volumineux." },

{ id:"c6-09", lvl:6, dom:"Kubernetes",
  q:"Après un upgrade de cluster, des manifestes sont refusés. Comment l'anticiper la prochaine fois ?",
  choix:["Scanner les manifestes avec <code>pluto</code>/<code>kubent</code> et surveiller la métrique des API dépréciées","Toujours sauter deux versions mineures d'un coup","Recréer le cluster à chaque montée de version","Désactiver la validation de schéma"],
  bonne:0,
  explain:"Une version d'API a été SUPPRIMÉE (ex. <code>batch/v1beta1</code> → <code>batch/v1</code>). La métrique <code>apiserver_requested_deprecated_apis</code> montre qui utilise encore quoi." },

{ id:"c6-10", lvl:6, dom:"Kubernetes",
  q:"Un HPA oscille entre 2 et 10 réplicas en boucle. Correctif ?",
  choix:["Allonger la <code>stabilizationWindowSeconds</code> et configurer <code>behavior</code> (monter vite, descendre lentement)","Supprimer le HPA","Doubler les limites CPU","Passer en VPA"],
  bonne:0,
  explain:"C'est du flapping. Vérifier aussi que la métrique n'est pas trop bruyante et que la cible n'est pas trop proche de la charge nominale." },

{ id:"c6-11", lvl:6, dom:"Linux",
  q:"Une application répond lentement, CPU normal, réseau bon. Que cherches-tu ?",
  choix:["Les points de sérialisation : pool de connexions saturé, verrou, pauses GC, throttling cgroup","Un problème de DNS","Une fuite mémoire du noyau","Un disque défectueux"],
  bonne:0,
  explain:"Le throttling CPU du cgroup (<code>nr_throttled</code>) est un classique : l'usage MOYEN paraît faible alors que le conteneur est bridé plusieurs fois par seconde." },

{ id:"c6-12", lvl:6, dom:"Linux",
  q:"Comment prouver qu'un problème vient du réseau et non de l'application ?",
  choix:["<code>curl -w</code> décompose DNS/connect/TLS/TTFB, et <code>tcpdump</code> des deux côtés montre si le SYN arrive","En pingant le serveur","En regardant la charge CPU","En comparant les logs applicatifs"],
  bonne:0,
  explain:"Si connect est rapide mais le TTFB lent, c'est l'application. Des retransmissions élevées (<code>ss -ti</code>, <code>netstat -s</code>) désignent le réseau ; leur absence l'innocente." },

{ id:"c6-13", lvl:6, dom:"Linux",
  q:"Le serveur swappe massivement. Que fais-tu ?",
  choix:["Identifier le consommateur et ajuster limites ou taille de machine — le swap est le symptôme, pas la cause","Désactiver le swap immédiatement","Augmenter vm.swappiness","Redémarrer le serveur toutes les nuits"],
  bonne:0,
  explain:"Désactiver le swap transforme une lenteur en OOMKill franc — ce qui est parfois PRÉFÉRABLE (Kubernetes l'exigeait historiquement, pour rendre les limites prévisibles)." },

{ id:"c6-14", lvl:6, dom:"Linux",
  q:"Comment identifier quel processus écrit massivement sur le disque ?",
  choix:["<code>iotop -o</code>, <code>pidstat -d 1</code>, ou <code>/proc/&lt;pid&gt;/io</code>","<code>df -h</code>","<code>du -sh /</code>","<code>free -m</code>"],
  bonne:0,
  explain:"Compléter par <code>lsof -p &lt;pid&gt;</code> pour voir quels fichiers, et <code>iostat -x 1</code> pour identifier le device saturé (%util proche de 100)." },

{ id:"c6-15", lvl:6, dom:"Docker",
  q:"Le disque des nœuds Docker se remplit continuellement. Coupable le plus fréquent ?",
  choix:["Les logs json-file sans rotation dans /var/lib/docker/containers","Les images de base trop lourdes","Le cache de build","Les réseaux orphelins"],
  bonne:0,
  explain:"Correctif : <code>log-opts max-size/max-file</code> dans daemon.json, plus un <code>docker system prune</code> planifié. Diagnostic : <code>docker system df -v</code>." },

{ id:"c6-16", lvl:6, dom:"Docker",
  q:"Le build Docker est lent en CI mais rapide en local. Pourquoi ?",
  choix:["Le runner est éphémère : aucun cache de couches local","Le réseau de la CI est bridé","Docker est plus lent sous Linux","Le Dockerfile est mal ordonné uniquement en CI"],
  bonne:0,
  explain:"Solutions : cache de build distant BuildKit (<code>--cache-from/--cache-to</code> vers le registry), image de base miroir interne, <code>.dockerignore</code> pour réduire le contexte." },

{ id:"c6-17", lvl:6, dom:"Terraform",
  q:"Un <code>apply</code> a échoué à mi-chemin. Que fais-tu ?",
  choix:["Relancer un <code>plan</code> pour voir le delta réel, corriger la cause, ré-appliquer","Restaurer une version antérieure du state","Supprimer le state et tout recréer","Lancer un destroy puis un apply complet"],
  bonne:0,
  explain:"Terraform écrit le state au fur et à mesure : les ressources créées y figurent. Restaurer un ancien state à l'aveugle crée des ressources orphelines." },

{ id:"c6-18", lvl:6, dom:"Terraform",
  q:"Le plan veut détruire/recréer une ressource critique après un simple changement de tag. Que regardes-tu ?",
  choix:["La ligne <code># forces replacement</code> : un attribut immuable a changé","Le fichier de lock","Les permissions du provider","La version de Terraform"],
  bonne:0,
  explain:"Causes fréquentes : nom calculé qui a bougé, défaut modifié par une nouvelle version du provider, clé de <code>for_each</code> changée. Parades : <code>moved</code>, <code>ignore_changes</code>, <code>prevent_destroy</code>." },

{ id:"c6-19", lvl:6, dom:"Terraform",
  q:"Quelqu'un a supprimé une ressource dans la console. Que fait Terraform au prochain plan ?",
  choix:["Il constate son absence et propose de la RECRÉER","Il l'enlève automatiquement du state","Il échoue avec une erreur bloquante","Il ignore la différence"],
  bonne:0,
  explain:"C'est le comportement normal. Si on abandonne sa gestion : <code>state rm</code> + suppression du code. Le vrai correctif est organisationnel : retirer les droits d'écriture manuels." },

{ id:"c6-20", lvl:6, dom:"Terraform",
  q:"Le plan met 20 minutes sur un gros périmètre. Solution DURABLE ?",
  choix:["Découper le state par domaine et par cycle de vie","Utiliser <code>-target</code> systématiquement","Désactiver le refresh en permanence","Augmenter le parallelism à 100"],
  bonne:0,
  explain:"Chaque ressource du state déclenche un appel API au refresh. <code>-target</code> est un outil de dépannage, pas un mode de fonctionnement ; monter le parallelism déclenche du throttling API." },

{ id:"c6-21", lvl:6, dom:"CI/CD",
  q:"Le pipeline passe mais le déploiement casse en production uniquement. Hypothèse n°1 ?",
  choix:["Un écart de CONFIGURATION : variables, secrets, feature flags, endpoints","Un bug du compilateur","Une version de Kubernetes différente","Un problème de licence"],
  bonne:0,
  explain:"Puis : écart de données (volumétrie, migrations), d'infrastructure (proxy, certificats, quotas), d'échelle (concurrence, timeouts). Parade : environnements iso-produits par IaC + smoke tests." },

{ id:"c6-22", lvl:6, dom:"CI/CD",
  q:"Le même pipeline réussit sur une branche et échoue sur une autre. Cause la plus fréquente ?",
  choix:["Les secrets ou variables sont restreints à certaines branches ou environnements protégés","Le runner est différent","Le cache est corrompu","Git est mal configuré"],
  bonne:0,
  explain:"Typiquement, les secrets ne sont pas exposés aux branches non protégées ni aux forks — c'est une protection voulue. On compare les deux exécutions ligne à ligne plutôt que de relancer." },

{ id:"c6-23", lvl:6, dom:"CI/CD",
  q:"Le déploiement a réussi mais l'ancienne version sert encore du trafic. Que vérifies-tu en premier ?",
  choix:["<code>kubectl rollout status</code> : le rollout est-il terminé, ou bloqué sur des Pods non Ready ?","Le DNS","La configuration du WAF","Les logs de la base de données"],
  bonne:0,
  explain:"Autres pistes : cache CDN non invalidé, sticky sessions, ancien ReplicaSet encore à réplicas &gt; 0, ou tag <code>latest</code> avec <code>imagePullPolicy: IfNotPresent</code>." },

{ id:"c6-24", lvl:6, dom:"CI/CD",
  q:"La nouvelle version est en production et la migration de base est déjà passée. Comment revenir en arrière ?",
  choix:["Redéployer l'ancien binaire — possible SI les migrations sont rétrocompatibles ; sinon roll-forward","Restaurer la sauvegarde de la base","Exécuter la migration inverse","Arrêter le service jusqu'à correction"],
  bonne:0,
  explain:"On ne « dé-migre » pas une base en production. La restauration de sauvegarde est un dernier recours assumé, avec perte de données. D'où l'exigence expand/contract." },

{ id:"c6-25", lvl:6, dom:"AWS",
  q:"Une instance EC2 en subnet public ne répond pas en SSH. Que vérifies-tu dans l'ordre ?",
  choix:["IP publique → route vers l'IGW → SG entrant 22 → NACL dans les deux sens → statut de l'instance → sshd","Le mot de passe root","La version de l'AMI","Le quota de vCPU"],
  bonne:0,
  explain:"Un timeout oriente vers SG/NACL/route ; un « connection refused » signifie que le chemin est bon mais que sshd n'écoute pas." },

{ id:"c6-26", lvl:6, dom:"AWS",
  q:"Vos coûts AWS ont doublé. Quels suspects regardes-tu en priorité ?",
  choix:["Transfert de données (inter-AZ, NAT Gateway au Go), volumes et snapshots orphelins, rétention CloudWatch","Le prix des instances a augmenté","Le nombre d'utilisateurs IAM","Le nombre de buckets S3"],
  bonne:0,
  explain:"Cost Explorer groupé par service puis par tag/compte, plus Cost Anomaly Detection pour la date de bascule. Prérequis : un tagging obligatoire imposé par policy." },

{ id:"c6-27", lvl:6, dom:"AWS",
  q:"Une Lambda échoue par intermittence en timeout sur RDS. Cause la plus probable ?",
  choix:["Épuisement des connexions : chaque environnement d'exécution ouvre la sienne","La Lambda manque de mémoire","Le VPC bloque le trafic","La base est en maintenance"],
  bonne:0,
  explain:"Solutions : RDS Proxy pour mutualiser, réutiliser la connexion hors du handler, plafonner la concurrence réservée, timeouts courts côté client." },

{ id:"c6-28", lvl:6, dom:"Azure",
  q:"Une App Service ne joint pas une base derrière un Private Endpoint. Que vérifies-tu ?",
  choix:["VNet Integration activée + Private DNS Zone liée au VNet + <code>vnetRouteAllEnabled</code>","Le pare-feu Windows de l'App Service","Le certificat TLS de la base","Le nombre d'instances du plan"],
  bonne:0,
  explain:"Sans intégration VNet ou sans zone DNS privée, le FQDN résout encore vers l'IP publique. Vérifier aussi NSG/UDR sur le subnet d'intégration." },

{ id:"c6-29", lvl:6, dom:"Azure",
  q:"Un déploiement ARM/Bicep échoue en <code>Conflict</code>. Que comprends-tu du plan de contrôle Azure ?",
  choix:["ARM est asynchrone et sérialise les opérations sur une même ressource : il faut retry avec backoff","La ressource est verrouillée définitivement","Le template est invalide","Le quota est atteint"],
  bonne:0,
  explain:"Éviter les apply concurrents sur un même RG, tenir compte de la cohérence à terme et des Resource Locks. Un Terraform très parallèle déclenche aussi du throttling (429 + Retry-After)." },

{ id:"c6-30", lvl:6, dom:"Sécurité",
  q:"Une clé d'accès AWS a fuité sur GitHub. Quelle est la PREMIÈRE action ?",
  choix:["Désactiver puis supprimer la clé immédiatement","Nettoyer l'historique Git","Rendre le dépôt privé","Ouvrir un ticket au support AWS"],
  bonne:0,
  explain:"Ensuite : CloudTrail pour inventorier l'usage, chercher la persistance (nouveaux users/rôles/clés), nettoyer l'historique, puis post-mortem sur l'existence même d'une clé statique." },

{ id:"c6-31", lvl:6, dom:"Sécurité",
  q:"Un scan remonte 200 CVE sur une image. Comment priorises-tu ?",
  choix:["Par risque réel : sévérité ET exploitabilité, exposition du service, présence dans le chemin d'exécution","Par ordre décroissant de score CVSS uniquement","Par ordre alphabétique des paquets","Toutes en même temps, sinon ça n'a pas de sens"],
  bonne:0,
  explain:"Beaucoup de CVE viennent de l'image de base : passer à une base minimale (distroless, slim) en élimine souvent la majorité d'un seul coup." },

{ id:"c6-32", lvl:6, dom:"Sécurité",
  q:"Tu découvres un conteneur en production avec le socket Docker monté. Quel est le risque ?",
  choix:["Contrôle du daemon : on peut lancer un conteneur privilégié qui monte / — c'est root sur le nœud","Un simple risque de fuite de logs","Une consommation excessive de CPU","Aucun si le conteneur tourne en non-root"],
  bonne:0,
  explain:"Remèdes : retirer le montage, utiliser un builder sans daemon (Kaniko, Buildah), et une politique d'admission qui interdit hostPath sur le socket et les conteneurs privilégiés." },

{ id:"c6-33", lvl:6, dom:"Observabilité",
  q:"Prometheus consomme 40 Go de RAM et redémarre. Cause quasi certaine ?",
  choix:["Explosion de cardinalité : un label à valeurs illimitées a créé des millions de séries","La rétention est trop longue","Trop de dashboards Grafana","Le disque est trop lent"],
  bonne:0,
  explain:"Diagnostic : <code>topk</code> sur <code>count by (__name__)</code>, page TSDB status. Correctifs : relabeling au scrape, long terme déporté (Thanos, Mimir), recording rules." },

{ id:"c6-34", lvl:6, dom:"Observabilité",
  q:"Les traces s'arrêtent au deuxième service. Pourquoi ?",
  choix:["Le contexte de trace n'est pas propagé : service non instrumenté, en-têtes filtrés, ou formats incompatibles","L'échantillonnage est trop agressif","Le backend de tracing est saturé","Les horloges ne sont pas synchronisées"],
  bonne:0,
  explain:"La propagation se fait par l'en-tête W3C <code>traceparent</code>. Attention aussi aux passages par une file de messages sans injection du contexte dans les en-têtes du message." },

{ id:"c6-35", lvl:6, dom:"SRE",
  q:"Une panne est en cours et personne ne sait qui décide. Que mets-tu en place ?",
  choix:["Des rôles explicites : Incident Commander qui décide sans taper au clavier, Operations, Communications, Scribe","Un canal Slack par équipe technique","Un rapport détaillé avant toute action","Une réunion de crise avec tous les managers"],
  bonne:0,
  explain:"Un canal unique, des points de situation réguliers, la priorité à la MITIGATION avant la compréhension, et un post-mortem blameless sous 48 h avec actions datées." },

{ id:"c6-36", lvl:6, dom:"SQL",
  q:"Une requête passe de 50 ms à 30 s sans changement de code. Que s'est-il passé ?",
  choix:["Le plan d'exécution a changé : statistiques périmées, volume, index supprimé, ou bind parameter sniffing","Le réseau est saturé","La base a été redémarrée","Le cache applicatif est vide"],
  bonne:0,
  explain:"Comparer <code>EXPLAIN ANALYZE</code> avec l'ancien plan, relancer <code>ANALYZE</code>, vérifier la croissance de la table et la sélectivité des index." },

{ id:"c6-37", lvl:6, dom:"Réseau",
  q:"Un appel HTTPS échoue côté serveur applicatif mais fonctionne dans le navigateur. Cause probable ?",
  choix:["Chaîne de certificats incomplète, ou CA d'entreprise absente du truststore du conteneur","Le serveur bloque les user-agents non navigateurs","Le protocole HTTP/2 n'est pas supporté","Le cookie de session manque"],
  bonne:0,
  explain:"Un navigateur peut compléter une chaîne incomplète, pas un client Java/Go/curl. Vérification : <code>openssl s_client -connect host:443 -showcerts</code>." }

]);

</script>
<script>
/* qcm/niveau07.js */
window.QCM = (window.QCM || []).concat([
/* ============ QCM NIVEAU 7 — ARCHITECTURE & PRODUCTION ============ */

{ id:"c7-01", lvl:7, dom:"SRE",
  q:"On te demande une application « hautement disponible ». Que fais-tu en premier ?",
  choix:["Tu poses des questions : SLO réel, RTO/RPO, budget, état ou pas, contraintes réglementaires","Tu proposes une architecture multi-région actif/actif","Tu doubles le nombre de réplicas","Tu ajoutes un load balancer"],
  bonne:0,
  explain:"Répondre « multi-région » sans ces réponses est le piège classique : c'est cher, complexe, et souvent inutile. La question teste la capacité à cadrer avant de concevoir." },

{ id:"c7-02", lvl:7, dom:"Kubernetes",
  q:"Tu as 3 nœuds et 3 réplicas. Es-tu protégé contre la perte d'un nœud ?",
  choix:["Pas automatiquement : le scheduler peut placer les 3 Pods sur le même nœud","Oui, Kubernetes répartit toujours les réplicas","Oui, si le Deployment a une readiness probe","Oui, à condition d'avoir un Service"],
  bonne:0,
  explain:"Il faut l'expliciter avec <code>topologySpreadConstraints</code> (hostname, puis zone) ou une podAntiAffinity — et prévoir la capacité pour que N-1 nœuds absorbent la charge." },

{ id:"c7-03", lvl:7, dom:"Kubernetes",
  q:"Faut-il faire tourner une base de données de production en Kubernetes ?",
  choix:["Par défaut non en banque : un service managé fournit sauvegardes, PITR, patchs et HA sans coût opérationnel","Oui, toujours : c'est plus portable","Non, c'est techniquement impossible","Oui, si on utilise un StatefulSet"],
  bonne:0,
  explain:"On peut le faire avec un opérateur mature (CloudNativePG, Vitess) et une vraie compétence interne. Le point évalué : savoir arbitrer coût opérationnel vs contrôle." },

{ id:"c7-04", lvl:7, dom:"Kubernetes",
  q:"Comment isoler plusieurs équipes sur un cluster mutualisé ?",
  choix:["Namespace + RBAC + ResourceQuota + NetworkPolicy default-deny + Pod Security + policies d'admission","Un namespace par équipe suffit","Un nœud dédié par équipe","Des Services de type ClusterIP uniquement"],
  bonne:0,
  explain:"Limite honnête à énoncer : l'isolation reste souple. Pour un vrai cloisonnement réglementaire, on sépare les CLUSTERS — c'est ce qui se fait entre prod et hors-prod en banque." },

{ id:"c7-05", lvl:7, dom:"Kubernetes",
  q:"Quel est le coût réel d'un service mesh ?",
  choix:["Un sidecar par Pod (CPU, mémoire, quelques ms de latence) et une couche de plus à opérer","Une licence par nœud","L'impossibilité d'utiliser des NetworkPolicy","La perte du rolling update"],
  bonne:0,
  explain:"Apports : mTLS automatique, routage fin, retries et circuit breakers hors du code, métriques uniformes. À justifier par un besoin, pas par la mode." },

{ id:"c7-06", lvl:7, dom:"Terraform",
  q:"Sur quel critère découpes-tu tes states Terraform ?",
  choix:["Par rayon d'impact et par cycle de vie : socle réseau / plateforme / applications","Un state par ressource","Un seul state par cloud provider","Par ordre alphabétique des ressources"],
  bonne:0,
  explain:"Bénéfices : plan rapide, erreur circonscrite, droits séparés, verrous indépendants. Coût : des contrats explicites entre states." },

{ id:"c7-07", lvl:7, dom:"Terraform",
  q:"Dans un pipeline Terraform, qu'applique-t-on après l'approbation ?",
  choix:["Le plan SAUVEGARDÉ qui a été revu, pas un nouveau plan recalculé","Un nouveau plan, pour être à jour","Directement les fichiers .tf","Le plan de l'environnement précédent"],
  bonne:0,
  explain:"Appliquer le plan revu garantit que ce qui est exécuté est exactement ce qui a été approuvé. Un replan pourrait avoir changé entre-temps." },

{ id:"c7-08", lvl:7, dom:"AWS",
  q:"Quelle stratégie multi-compte recommandes-tu pour une grande organisation ?",
  choix:["AWS Organizations, OU par usage, un compte par application ET par environnement, comptes centraux Log Archive et Security","Un compte unique avec des tags rigoureux","Un compte par développeur","Deux comptes : prod et non-prod"],
  bonne:0,
  explain:"Bénéfices : isolation dure du rayon d'impact et des quotas, facturation par équipe, SCP différenciées par OU. Control Tower / LZA pour industrialiser." },

{ id:"c7-09", lvl:7, dom:"AWS",
  q:"Quel levier d'optimisation de coûts appliquer AVANT de prendre des Savings Plans ?",
  choix:["Le rightsizing et le nettoyage : on ne s'engage pas 3 ans sur du gaspillage","La migration vers Graviton","L'achat d'instances réservées","Le passage en multi-région"],
  bonne:0,
  explain:"Ordre : visibilité (tags) → rightsizing → extinction du hors-prod → engagements sur la base stable → Spot → stockage et transfert de données." },

{ id:"c7-10", lvl:7, dom:"AWS",
  q:"Où placer une NAT Gateway pour un VPC hautement disponible ?",
  choix:["Une par AZ, dans les subnets publics","Une seule, dans un subnet privé","Une seule, dans un subnet public","Aucune, l'IGW suffit"],
  bonne:0,
  explain:"Le NAT a besoin d'une EIP et d'une route vers l'IGW, donc d'un subnet public. Une seule NAT = point de défaillance unique ET trafic inter-AZ facturé." },

{ id:"c7-11", lvl:7, dom:"Azure",
  q:"Que contient une landing zone Azure ?",
  choix:["Hiérarchie de management groups, subscriptions par usage, policies, RBAC/PIM, réseau hub-and-spoke, journalisation centralisée","Uniquement les VNets et les NSG","Les applications métier","Un abonnement de test"],
  bonne:0,
  explain:"C'est le socle de gouvernance déployé AVANT les applications, entièrement en IaC (CAF/ALZ Terraform ou Bicep). Vocabulaire attendu chez un grand compte." },

{ id:"c7-12", lvl:7, dom:"Azure",
  q:"AKS, App Service ou Container Apps : quel est le critère décisif ?",
  choix:["La maturité et la taille de l'équipe qui devra l'exploiter","La popularité de la technologie","Le prix affiché par mois","La compatibilité avec Terraform"],
  bonne:0,
  explain:"App Service = défaut raisonnable pour une app web. Container Apps = microservices sans gérer de cluster. AKS = besoin de contrôle fin ET équipe capable d'opérer un cluster à 3 h du matin." },

{ id:"c7-13", lvl:7, dom:"Azure",
  q:"Comment garantir la conformité de 200 abonnements ?",
  choix:["Des initiatives Azure Policy assignées au niveau management group, avec remédiation et exemptions datées","Un audit manuel trimestriel","Un script PowerShell planifié","Des alertes Azure Monitor"],
  bonne:0,
  explain:"L'assignation au management group couvre les abonnements présents ET futurs. Les exceptions passent par une exemption tracée, jamais par une désactivation." },

{ id:"c7-14", lvl:7, dom:"CI/CD",
  q:"Comment éviter de dupliquer 50 fois le même YAML de pipeline ?",
  choix:["Des templates/workflows réutilisables versionnés dans un dépôt central, paramétrés par service","Un script qui copie le YAML dans chaque dépôt","Un monorepo unique","Des variables d'environnement globales"],
  bonne:0,
  explain:"Point d'attention : VERSIONNER les templates par tag immuable. Les consommer sur <code>@main</code>, c'est casser 50 équipes le jour où on modifie le template." },

{ id:"c7-15", lvl:7, dom:"CI/CD",
  q:"Quelles sont les quatre métriques DORA ?",
  choix:["Fréquence de déploiement, lead time, taux d'échec des changements, temps de rétablissement","Couverture de tests, dette technique, vélocité, bugs ouverts","Uptime, latence, throughput, erreurs","Nombre de commits, de PR, de builds, de déploiements"],
  bonne:0,
  explain:"Les deux premières mesurent la VITESSE, les deux dernières la STABILITÉ. Résultat clé : elles progressent ENSEMBLE — déployer souvent en petits lots réduit le risque." },

{ id:"c7-16", lvl:7, dom:"CI/CD",
  q:"Comment gérer une release nécessitant 5 services interdépendants ?",
  choix:["Rétrocompatibilité des contrats d'API + tests de contrat + déploiement indépendant + feature flags","Une fenêtre de déploiement coordonnée un dimanche","Un script qui déploie les 5 dans le bon ordre","Fusionner les 5 services en un seul"],
  bonne:0,
  explain:"Si une coordination stricte reste nécessaire, c'est un signal de couplage à corriger dans l'architecture, pas un problème de planification." },

{ id:"c7-17", lvl:7, dom:"Sécurité",
  q:"Que signifie le zero trust appliqué au cloud ?",
  choix:["Chaque appel est authentifié et autorisé, quelle que soit sa provenance — plus de réseau interne de confiance","Interdire tout accès depuis internet","Chiffrer tous les disques","Supprimer les comptes administrateurs"],
  bonne:0,
  explain:"En pratique : identité forte partout (mTLS, identités de charge), autorisation contextuelle, micro-segmentation, chiffrement, journalisation exhaustive. Le périmètre reste utile en défense en profondeur." },

{ id:"c7-18", lvl:7, dom:"Sécurité",
  q:"Comment sécuriser la chaîne CI/CD elle-même ?",
  choix:["Branches protégées, runners éphémères isolés, OIDC sans secret long, actions tierces épinglées par digest, séparation build/deploy","Un antivirus sur les runners","Un VPN pour accéder au forge","Des mots de passe complexes"],
  bonne:0,
  explain:"Qui contrôle le pipeline contrôle la production : c'est la cible privilégiée. Attention aux déclencheurs qui exécutent du code de fork avec les secrets du dépôt." },

{ id:"c7-19", lvl:7, dom:"Observabilité",
  q:"Qu'est-ce qui casse une trace distribuée de bout en bout ?",
  choix:["Un service qui ne propage pas le contexte (en-tête traceparent)","Un backend de tracing trop lent","Un échantillonnage à 100 %","Des horloges désynchronisées"],
  bonne:0,
  explain:"OpenTelemetry standardise l'instrumentation et la propagation. Sans elle, la trace se coupe au premier service non instrumenté — y compris au passage par une file de messages." },

{ id:"c7-20", lvl:7, dom:"Observabilité",
  q:"Quels critères doit remplir une alerte qui réveille à 3 h du matin ?",
  choix:["Impact utilisateur réel + urgence + action possible avec un runbook","Un seuil technique dépassé","Une anomalie détectée par l'IA","La demande d'un manager"],
  bonne:0,
  explain:"Tout le reste va en ticket ou en dashboard. On alerte sur le burn rate du budget d'erreur (multi-fenêtres) plutôt que sur un seuil instantané, et on mesure les faux positifs." },

{ id:"c7-21", lvl:7, dom:"SRE",
  q:"Comment introduire le chaos engineering en banque ?",
  choix:["Progressivement : d'abord en recette, périmètre défini, hypothèse écrite, bouton d'arrêt, fenêtre annoncée","Directement en production, sinon ça n'a pas de valeur","En simulant les pannes sur un tableau blanc","En laissant l'outil injecter des pannes au hasard"],
  bonne:0,
  explain:"Le principe : injecter une panne pour VALIDER une hypothèse de résilience. On ne passe en production qu'après avoir démontré la valeur et obtenu l'adhésion du risque opérationnel." },

{ id:"c7-22", lvl:7, dom:"SRE",
  q:"Comment dimensionner pour un pic connu (clôture mensuelle) ?",
  choix:["Test de charge pour trouver le point de rupture, identifier le vrai goulot, puis PRÉ-scaler avant le pic","Se reposer sur l'autoscaling","Doubler toutes les ressources en permanence","Limiter le nombre d'utilisateurs simultanés"],
  bonne:0,
  explain:"L'autoscaling réactif arrive trop tard face à un pic brutal. Et le facteur limitant est souvent la base ou un pool de connexions, pas le CPU applicatif." },

{ id:"c7-23", lvl:7, dom:"SRE",
  q:"Monolithe ou microservices pour une nouvelle application ?",
  choix:["Commencer par un monolithe modulaire, extraire un service quand un besoin réel apparaît","Microservices dès le départ, c'est l'état de l'art","Monolithe, toujours","Cela dépend uniquement du langage"],
  bonne:0,
  explain:"Les microservices déplacent la complexité du code vers le réseau et l'exploitation. Loi de Conway : l'architecture reflétera l'organisation — c'est elle qui doit décider." },

{ id:"c7-24", lvl:7, dom:"SQL",
  q:"Quand choisir du NoSQL plutôt que du relationnel ?",
  choix:["Quand le modèle d'ACCÈS est connu à l'avance, par clé, avec besoin d'échelle horizontale et de latence constante","Quand le volume dépasse 1 To","Quand on veut éviter d'écrire du SQL","Quand l'application est en microservices"],
  bonne:0,
  explain:"On choisit selon le modèle d'accès, pas selon la mode. En banque le relationnel reste dominant : cohérence transactionnelle et auditabilité priment." },

{ id:"c7-25", lvl:7, dom:"SQL",
  q:"En cas de partition réseau, que choisit-on pour un solde de compte ?",
  choix:["La cohérence (CP) : mieux vaut refuser de répondre que donner un solde faux","La disponibilité (AP) : l'utilisateur doit toujours voir quelque chose","Les deux sont possibles simultanément","Cela dépend de la charge"],
  bonne:0,
  explain:"CAP : en cas de partition, il faut choisir. Pour un catalogue produit on prendrait AP. PACELC complète : hors partition, l'arbitrage devient latence vs cohérence." },

{ id:"c7-26", lvl:7, dom:"Messagerie",
  q:"Dans Kafka, qu'est-ce qui plafonne le parallélisme d'un consumer group ?",
  choix:["Le nombre de partitions du topic","Le nombre de brokers","La rétention configurée","La taille des messages"],
  bonne:0,
  explain:"Un 11ᵉ consommateur sur un topic de 10 partitions restera inactif. Et le nombre de partitions ne peut qu'augmenter, jamais diminuer." },

{ id:"c7-27", lvl:7, dom:"Messagerie",
  q:"Dans Kafka, l'ordre des messages est garanti :",
  choix:["Uniquement à l'intérieur d'une partition","Sur tout le topic","Par consumer group","Uniquement en mode transactionnel"],
  bonne:0,
  explain:"Si l'ordre compte pour un client donné, sa clé doit toujours le ranger dans la même partition. C'est tout l'enjeu du choix de la clé de partition." },

{ id:"c7-28", lvl:7, dom:"Messagerie",
  q:"Quelle garantie de livraison vise-t-on en pratique dans un système financier ?",
  choix:["At least once, avec un traitement IDEMPOTENT côté consommateur","At most once, pour éviter tout doublon","Exactly once, garanti de bout en bout par le broker","Aucune garantie, on accepte les pertes"],
  bonne:0,
  explain:"L'exactly-once de bout en bout entre systèmes hétérogènes est un mythe. Ce qu'on obtient, c'est un effet observable exactement une fois — grâce à une clé d'idempotence." },

{ id:"c7-29", lvl:7, dom:"Messagerie",
  q:"Quelle métrique surveille-t-on en priorité sur un consommateur Kafka ?",
  choix:["Le consumer lag : le retard en messages","Le nombre de brokers actifs","La taille moyenne des messages","Le nombre de topics"],
  bonne:0,
  explain:"À compléter par l'âge du plus vieux message : 10 000 messages de retard sur un flux rapide n'est pas grave, 30 minutes d'âge oui. KEDA sait autoscaler sur le lag." },

{ id:"c7-30", lvl:7, dom:"Ansible",
  q:"Terraform et Ansible : quelle répartition des rôles ?",
  choix:["Terraform provisionne l'infrastructure, Ansible configure ce qui se passe DANS la machine","Ansible provisionne, Terraform configure","Ce sont deux concurrents, il faut choisir","Ansible remplace Terraform depuis les collections cloud"],
  bonne:0,
  explain:"Dans une approche immuable, on préfère Packer + Ansible pour construire une image dorée, et Terraform pour déployer cette image — on remplace les machines au lieu de les modifier." },

{ id:"c7-31", lvl:7, dom:"Ansible",
  q:"Qu'est-ce qui casse l'idempotence d'un playbook Ansible ?",
  choix:["L'usage du module <code>shell</code>/<code>command</code> sans <code>creates</code>, <code>when</code> ou <code>changed_when</code>","L'utilisation de rôles","Les handlers","Les variables de groupe"],
  bonne:0,
  explain:"Ansible ne peut pas deviner si une commande arbitraire est nécessaire : il l'exécute toujours. L'idempotence vient des MODULES dédiés." },

{ id:"c7-32", lvl:7, dom:"Ansible",
  q:"Quel est l'équivalent Ansible du <code>terraform plan</code> ?",
  choix:["<code>ansible-playbook --check --diff</code>","<code>ansible-playbook --syntax-check</code>","<code>ansible-lint</code>","<code>ansible-inventory --graph</code>"],
  bonne:0,
  explain:"Limite honnête : en mode check, une tâche dépendant du résultat d'une tâche non exécutée peut échouer ou rapporter faux." },

{ id:"c7-33", lvl:7, dom:"GitOps",
  q:"Quel est le principal bénéfice sécurité du GitOps par rapport au push ?",
  choix:["Aucun credential de cluster n'est stocké dans la CI : c'est l'agent interne qui tire","Les manifestes sont chiffrés dans Git","Le cluster devient inaccessible depuis internet","Les images sont signées automatiquement"],
  bonne:0,
  explain:"Autres bénéfices : dérive détectée et corrigée, rollback = <code>git revert</code>, audit natif. En banque, l'approbation d'une PR devient l'autorisation de mise en production." },

{ id:"c7-34", lvl:7, dom:"GitOps",
  q:"Avec <code>selfHeal</code> activé dans Argo CD, que se passe-t-il si un ingénieur modifie un Deployment à la main pendant un incident ?",
  choix:["Argo annule sa correction en quelques secondes pour revenir à l'état déclaré dans Git","La modification est acceptée et poussée dans Git","Argo passe l'application en Degraded sans agir","Rien, selfHeal ne concerne que les suppressions"],
  bonne:0,
  explain:"D'où l'importance de savoir SUSPENDRE la synchronisation pendant un incident, puis de faire passer le correctif par Git." },

{ id:"c7-35", lvl:7, dom:"GitOps",
  q:"Comment gère-t-on les secrets en GitOps ?",
  choix:["External Secrets Operator ou CSI : le secret reste dans le coffre, le cluster le synchronise","On les commite chiffrés en base64","On les passe en variables d'environnement du pipeline","On les saisit manuellement après chaque déploiement"],
  bonne:0,
  explain:"Alternative : Sealed Secrets / SOPS (chiffré dans Git, déchiffrable par le seul cluster). En banque on préfère le coffre externe : rotation centralisée et accès audité." }

]);

window.QCM = (window.QCM || []).concat([
/* ============ QCM NIVEAU 8 — INTERNES & CAS LIMITES ============ */

{ id:"c8-01", lvl:8, dom:"Kubernetes",
  q:"Si etcd perd le quorum, que se passe-t-il ?",
  choix:["Plus aucune écriture : ni déploiement ni reprogrammation — mais le trafic existant continue de fonctionner","Tous les Pods s'arrêtent immédiatement","Le cluster bascule automatiquement sur un etcd de secours","Les Services cessent de router"],
  bonne:0,
  explain:"C'est une panne du plan de CONTRÔLE, pas du plan de DONNÉES. La distinction est exactement ce qu'un senior attend d'entendre." },

{ id:"c8-02", lvl:8, dom:"Kubernetes",
  q:"Quelle est la limite du mode iptables de kube-proxy à grande échelle ?",
  choix:["Les règles sont évaluées de façon quasi linéaire : au-delà de quelques milliers de Services, ça se dégrade","Il ne supporte pas UDP","Il ne fonctionne pas en multi-nœud","Il empêche les NetworkPolicy"],
  bonne:0,
  explain:"Le mode IPVS utilise des tables de hachage (O(1)) et de vrais algorithmes de répartition. Cilium peut remplacer kube-proxy entièrement par de l'eBPF." },

{ id:"c8-03", lvl:8, dom:"Kubernetes",
  q:"Dans quel ordre s'exécutent les admission webhooks ?",
  choix:["Mutating d'abord, puis validation de schéma, puis validating","Validating d'abord, puis mutating","En parallèle","Dans l'ordre alphabétique de leur nom"],
  bonne:0,
  explain:"Logique : on ne valide qu'après toutes les mutations. Piège d'exploitation : un webhook en <code>failurePolicy: Fail</code> et indisponible bloque tout le cluster." },

{ id:"c8-04", lvl:8, dom:"Kubernetes",
  q:"Pourquoi les contrôleurs Kubernetes doivent-ils être idempotents ?",
  choix:["Ils sont level-triggered : ils réagissent au NIVEAU courant, pas à un événement — la réconciliation est rejouée en boucle","Pour pouvoir tourner en plusieurs réplicas simultanés","Parce que l'API server les relance aléatoirement","Pour économiser des appels réseau"],
  bonne:0,
  explain:"C'est ce qui rend le système auto-réparant même après une perte d'événements : le contrôleur compare état désiré et état observé, quel que soit l'historique." },

{ id:"c8-05", lvl:8, dom:"Kubernetes",
  q:"Un Pod avec un PVC ReadWriteOnce ne redémarre pas sur un autre nœud. Pourquoi ?",
  choix:["Le volume bloc ne peut être attaché qu'à un nœud à la fois : il faut le détachement de l'ancien","Le PVC a expiré","La StorageClass est mal configurée","Le nouveau nœud n'a pas le driver CSI"],
  bonne:0,
  explain:"C'est une PROTECTION contre la double écriture, pas un bug. Forcer prématurément risque de corrompre le système de fichiers." },

{ id:"c8-06", lvl:8, dom:"Kubernetes",
  q:"À quoi sert le mécanisme de leader election entre réplicas d'un contrôleur ?",
  choix:["Un seul réplica agit à la fois : il détient un Lease qu'il renouvelle périodiquement","À répartir la charge entre les réplicas","À élire le nœud maître du cluster","À trier les Pods par priorité"],
  bonne:0,
  explain:"Si le leader cesse de renouveler, le bail expire et un autre prend la main. C'est ce qui permet la haute disponibilité d'un contrôleur sans double exécution." },

{ id:"c8-07", lvl:8, dom:"Kubernetes",
  q:"Que résout le server-side apply ?",
  choix:["L'API suit QUI possède chaque champ : les conflits entre acteurs multiples sont détectés au lieu d'être écrasés","Il accélère les gros déploiements","Il valide le YAML côté client","Il chiffre les objets dans etcd"],
  bonne:0,
  explain:"Il remplace l'ancien mécanisme basé sur l'annotation <code>last-applied-configuration</code>, qui gérait mal la suppression de champs et les acteurs concurrents (dev, opérateur, HPA)." },

{ id:"c8-08", lvl:8, dom:"Kubernetes",
  q:"Pourquoi une JVM peut-elle se faire OOMKill alors que son heap est bien sous la limite ?",
  choix:["Le cgroup compte TOUT : metaspace, piles de threads, buffers directs, code natif — pas seulement le heap","Le heap est mal mesuré par Kubernetes","La JVM ignore les limites mémoire","Le garbage collector consomme la limite"],
  bonne:0,
  explain:"Correctifs : JVM récente avec <code>-XX:MaxRAMPercentage</code>, limite avec 25-30 % de marge au-dessus du heap, et surveillance du working set plutôt que du heap." },

{ id:"c8-09", lvl:8, dom:"Linux",
  q:"Pourquoi forker un processus de 8 Go est-il quasi instantané ?",
  choix:["Le copy-on-write : rien n'est copié tant qu'on n'écrit pas","Le noyau compresse la mémoire","Seul le code est dupliqué, pas les données","Le fork est asynchrone"],
  bonne:0,
  explain:"<code>fork()</code> duplique le processus (mémoire marquée COW), <code>exec()</code> remplace l'image par un autre programme. C'est ce que fait un shell à chaque commande." },

{ id:"c8-10", lvl:8, dom:"Linux",
  q:"Comment un processus zombie disparaît-il ?",
  choix:["Quand son parent lit son code de retour avec <code>wait()</code>, ou quand PID 1 l'adopte et le récolte","Quand le noyau le tue après un délai","Avec <code>kill -9</code>","Au redémarrage uniquement"],
  bonne:0,
  explain:"Dans un conteneur, si PID 1 ne récolte pas, les zombies s'accumulent — d'où l'usage de <code>tini</code> ou <code>docker run --init</code>." },

{ id:"c8-11", lvl:8, dom:"Linux",
  q:"Qu'est-ce que l'overcommit mémoire sous Linux ?",
  choix:["Le noyau accorde plus de mémoire virtuelle que de RAM+swap, en pariant que tout ne sera pas utilisé","Une option à activer pour les serveurs de bases de données","Le fait de dépasser la limite d'un cgroup","Une technique de compression de la RAM"],
  bonne:0,
  explain:"Quand la RAM réelle manque, l'OOM killer choisit une victime selon un score ajustable par <code>oom_score_adj</code>. Dans un conteneur, la limite du cgroup déclenche un OOM local." },

{ id:"c8-12", lvl:8, dom:"Linux",
  q:"Quelle métrique mémoire Kubernetes utilise-t-il pour l'OOM et le HPA ?",
  choix:["Le working set : usage courant moins le page cache récupérable","La mémoire virtuelle (VSZ)","Le RSS brut","La somme des allocations du processus"],
  bonne:0,
  explain:"VSZ est un espace d'adressage réservé, souvent énorme et peu significatif. RSS inclut des pages partagées. Confondre les trois fait échouer le dimensionnement des limites." },

{ id:"c8-13", lvl:8, dom:"Linux",
  q:"Pourquoi seccomp est-il un contrôle de sécurité efficace pour un conteneur ?",
  choix:["Il filtre les appels système autorisés : sans <code>mount</code> ou <code>ptrace</code>, des familles entières d'exploits d'évasion tombent","Il chiffre la mémoire du processus","Il isole le réseau du conteneur","Il empêche l'écriture sur le disque"],
  bonne:0,
  explain:"Le profil <code>RuntimeDefault</code> bloque déjà une bonne partie des appels dangereux — et il n'est pas actif par défaut partout." },

{ id:"c8-14", lvl:8, dom:"Linux",
  q:"Qu'apporte eBPF ?",
