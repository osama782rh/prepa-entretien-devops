  choix:["Nommer précisément la limite, puis montrer ton processus d'apprentissage avec un exemple concret et daté","Éviter le sujet et parler de ce que tu maîtrises","Dire que tu apprendras vite","Minimiser l'importance de cette technologie"],
  bonne:0,
  explain:"Bluffer sur une technologie que trois seniors connaissent est éliminatoire en une relance. « Je ne sais pas, voilà comment je m'y prendrais » est une réponse FORTE." },

{ id:"c10-26", lvl:10, dom:"CI/CD",
  q:"Pourquoi un environnement de recette n'est-il presque jamais identique à la production ?",
  choix:["Volume et nature des données, charge non reproduite, topologie simplifiée, et dérive dès qu'on y touche à la main","Parce que le budget est insuffisant","Parce que les outils ne le permettent pas","Parce que les équipes n'ont pas le temps"],
  bonne:0,
  explain:"D'où : générer les deux avec le MÊME code IaC paramétré, et compléter par des tests en production maîtrisée (canary, shadow traffic) plutôt que de croire à une recette parfaite." },

{ id:"c10-27", lvl:10, dom:"Sécurité",
  q:"Première mesure de sécurité sur une plateforme cloud qui n'en a aucune ?",
  choix:["Verrouiller les IDENTITÉS : MFA, compte racine sécurisé, suppression des clés statiques et comptes dormants","Chiffrer tous les disques","Mettre en place un WAF","Segmenter le réseau"],
  bonne:0,
  explain:"Juste après : activer la journalisation immuable pour pouvoir enquêter. Sans identité maîtrisée, le chiffrement et la segmentation ne protègent rien." },

{ id:"c10-28", lvl:10, dom:"SRE",
  q:"Tu rejoins une équipe où tout est manuel et personne ne veut changer. Premiers 30 jours ?",
  choix:["Comprendre POURQUOI ça n'a pas changé, gagner en crédibilité sur les tâches pénibles, puis automatiser UNE douleur qu'ils ont nommée","Présenter un plan de transformation complet","Automatiser le processus le plus critique","Demander un mandat clair à la direction"],
  bonne:0,
  explain:"Il y a souvent une tentative passée qui a mal fini. Le changement en banque est d'abord un travail de confiance ; arriver en donneur de leçons garantit l'échec." },

{ id:"c10-29", lvl:10, dom:"SRE",
  q:"« Préférez-vous être expert ou généraliste ? » Quel est le piège ?",
  choix:["Choisir un camp de façon absolue : la bonne réponse est le profil en T, avec des profondeurs nommées honnêtement","Répondre « généraliste », c'est ce qu'on attend d'un DevOps","Répondre « expert », ça rassure sur le niveau","Il n'y a pas de piège, c'est une question de préférence"],
  bonne:0,
  explain:"Une base large pour dialoguer avec toutes les équipes et diagnostiquer de bout en bout, plus une ou deux profondeurs réelles. Prétendre être expert de tout face à trois spécialistes est éliminatoire." },

{ id:"c10-30", lvl:10, dom:"CI/CD",
  q:"Avant de sortir de la salle d'entretien, qu'est-ce qui est indispensable ?",
  choix:["Avoir posé tes questions ET demandé les prochaines étapes et le délai","Avoir résumé tes compétences","Avoir remercié chaque intervenant nommément","Avoir demandé un retour immédiat sur ta prestation"],
  bonne:0,
  explain:"Demander les prochaines étapes montre de l'intérêt et t'évite d'attendre dans le flou. Sortir sans rien demander laisse une impression tiède, même après une bonne performance." },

{ id:"c10-31", lvl:10, dom:"SRE",
  q:"« Vous n'avez jamais travaillé en banque. Pourquoi vous prendre ? »",
  choix:["Reconnaître l'écart, montrer ce qui est transférable, et prouver que tu as compris LEUR contexte (conformité, séparation des tâches, gels, réversibilité)","Expliquer que la technique est la même partout","Citer des projets similaires en complexité","Dire que tu apprendras le métier rapidement"],
  bonne:0,
  explain:"Prouver qu'on a fait l'effort de comprendre leur métier vaut plus que dix ans d'expérience générique. On ne s'excuse pas, on ne nie pas." },

{ id:"c10-32", lvl:10, dom:"Sécurité",
  q:"« Notre sécurité ralentit tout. Vous en pensez quoi ? » — c'est un test. Que réponds-tu ?",
  choix:["Les contraintes sont légitimes ; le problème est leur COÛT d'application — il faut les automatiser et les intégrer au chemin par défaut","Vous avez raison, il faudrait assouplir certaines règles","La sécurité passe avant la vitesse, c'est normal","Je trouverais des moyens de contourner les blocages"],
  bonne:0,
  explain:"Le piège est de se ranger du côté de la vitesse pour se rendre sympathique. Un contrôle manuel et répété ralentit ET est mal appliqué : c'est ça qu'on corrige." },

{ id:"c10-33", lvl:10, dom:"AWS",
  q:"« Combien coûterait votre architecture ? » Tu n'as pas les chiffres. Que fais-tu ?",
  choix:["Raisonner en ordre de grandeur à voix haute : postes dominants, hypothèse de volumétrie assumée, fourchette, et ce qui la ferait basculer","Dire que tu ne peux pas répondre sans les données","Donner un chiffre approximatif au hasard","Proposer d'envoyer une estimation par mail"],
  bonne:0,
  explain:"Ce qui est testé : la conscience que chaque choix technique a un prix, pas la capacité à réciter un tarif." },

{ id:"c10-34", lvl:10, dom:"SRE",
  q:"On te donne 6 mois et 4 personnes. Comment cadres-tu ta priorité n°1 ?",
  choix:["Refuser de répondre dans le vide, puis donner ta GRILLE : risque d'abord, toil ensuite, valeur produit enfin — plus un livrable visible sous 6 semaines","Annoncer une migration vers Kubernetes","Commencer par le monitoring","Recruter deux personnes de plus"],
  bonne:0,
  explain:"« Ça dépend de ce que je trouverais, mais voici comment je trancherais » est une réponse forte : elle montre une méthode plutôt qu'une recette." },

{ id:"c10-35", lvl:10, dom:"SRE",
  q:"« Comment sauriez-vous que votre travail a de la valeur ? »",
  choix:["En nommant des mesures : MTTR, réveils nocturnes, lead time, taux d'échec des changements, temps gagné par les équipes produit","« Quand tout fonctionne bien »","« Quand mon manager est satisfait »","« Quand il n'y a plus d'incidents »"],
  bonne:0,
  explain:"Un candidat qui répond « quand ça marche bien » n'a jamais eu à défendre un budget. À ce niveau, on cherche quelqu'un capable de rendre son impact visible sans qu'on le lui demande." }

]);

</script>
<script>
const BANK = window.QCM || [];
const LEVEL_TITLES = {
  1:"Vocabulaire & fondations",
  2:"Bases opérationnelles",
  3:"Usage quotidien",
  4:"Intermédiaire",
  5:"Réseau, sécurité, état",
  6:"Troubleshooting",
  7:"Architecture & production",
  8:"Internes & cas limites",
  9:"Résilience, coûts, gouvernance",
  10:"Entretien senior — arbitrages"
};
const STORE = "bnp_qcm_v1";
let ST = load();
function load(){ try{ return JSON.parse(localStorage.getItem(STORE)) || {q:{}}; }catch(e){ return {q:{}}; } }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(ST)); }catch(e){} }

const BOX_DAYS = [0,0,1,3,7,16,35];
function qs(id){ return ST.q[id] || (ST.q[id] = {box:1, ok:0, ko:0, last:0}); }
function due(id){
  const s = ST.q[id]; if(!s) return true;
  return Date.now() - s.last >= BOX_DAYS[Math.min(s.box,6)]*864e5;
}
function grade(id, ok){
  const s = qs(id);
  if(ok){ s.ok++; s.box = Math.min(s.box+1, 6); } else { s.ko++; s.box = 1; }
  s.last = Date.now(); save();
}

function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[b[i],b[j]]=[b[j],b[i]];} return b; }

let S = null;   // {list, i, score, wrong:[], label, serie}

function startLevel(l){ start(shuffle(BANK.filter(q=>q.lvl===l)), "Niveau "+l+" — "+LEVEL_TITLES[l]); }
function startAll(){ start(shuffle(BANK), "Marathon — toutes les questions"); }
function startRandom(n){ start(shuffle(BANK).slice(0,n), "Aléatoire — "+n+" questions"); }
function startDomain(d){ start(shuffle(BANK.filter(q=>q.dom===d)), "Domaine — "+d); }
function startDue(){
  const d = shuffle(BANK.filter(q=>due(q.id))).slice(0,40);
  if(!d.length){ alert("Rien à réviser pour le moment. Lance un niveau."); return; }
  start(d, "Révision du jour — "+d.length+" questions");
}
function startWeak(){
  const w = BANK.filter(q => ST.q[q.id] && ST.q[q.id].ko>0 && ST.q[q.id].box<=2);
  if(!w.length){ alert("Aucune question ratée en mémoire. Lance un niveau d'abord."); return; }
  start(shuffle(w), "Mes points faibles — "+w.length+" questions");
}
function start(list, label){
  if(!list.length){ alert("Aucune question."); return; }
  S = {list, i:0, score:0, wrong:[], label, serie:0};
  render();
}

function headerStats(){
  const vues = Object.keys(ST.q).length;
  const solides = Object.values(ST.q).filter(s=>s.box>=4).length;
  document.getElementById("hstats").innerHTML =
    `<b>${BANK.length}</b> questions · vues <b>${vues}</b> · solides <b>${solides}</b>`;
}

function home(){
  S = null;
  const doms = [...new Set(BANK.map(q=>q.dom))].sort();
  let lv = "";
  for(let l=1;l<=10;l++){
    const qs_ = BANK.filter(q=>q.lvl===l);
    const acquis = qs_.filter(q=>ST.q[q.id] && ST.q[q.id].box>=3).length;
    const pct = qs_.length ? Math.round(acquis/qs_.length*100) : 0;
    lv += `<button class="lvl" onclick="startLevel(${l})">
      <div class="n">Niveau ${l}</div>
      <div class="t">${LEVEL_TITLES[l]}</div>
      <div class="m">${qs_.length} questions · ${pct}% acquis</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </button>`;
  }
  document.getElementById("app").innerHTML = `
    <div class="card">
      <h2 style="margin:0 0 4px;font-size:22px">Choix multiples</h2>
      <p class="sub">Le mode pour construire tes bases sans te décourager : tu reconnais la bonne réponse et tu lis pourquoi les autres sont fausses. Quand un niveau te paraît facile ici, passe au même niveau en <a href="quiz.html">réponses libres</a> — c'est là que ça s'ancre vraiment.</p>
      <div class="modes">
        <button onclick="startDue()">Révision du jour</button>
        <button class="ghost" onclick="startRandom(30)">30 au hasard</button>
        <button class="ghost" onclick="startWeak()">Mes points faibles</button>
        <button class="ghost" onclick="startAll()">Marathon complet</button>
      </div>
      <div class="hint">Par domaine : ${doms.map(d=>`<a href="#" onclick="startDomain('${d}');return false">${d}</a>`).join(" · ")}</div>
    </div>
    <div class="levels">${lv}</div>
    <div class="card" style="font-size:13.5px;color:var(--muted)">
      <b style="color:var(--ink)">Comment t'en servir.</b> Avant de cliquer, dis la réponse dans ta tête <em>et</em> la raison. Puis lis l'explication même quand tu as juste — les mauvaises réponses proposées sont les erreurs qu'on entend réellement en entretien, savoir pourquoi elles sont fausses vaut autant que la bonne réponse.
      <div class="row">
        <button class="ghost tiny" onclick="location.href='quiz.html'">Réponses libres →</button>
        <button class="ghost tiny" onclick="location.href='etude.html'">Fiches d'étude →</button>
        <button class="ghost tiny" onclick="resetAll()">Réinitialiser</button>
      </div>
    </div>`;
  headerStats();
}
function resetAll(){ if(confirm("Effacer ta progression sur le QCM ?")){ ST={q:{}}; save(); home(); } }

function render(){
  if(!S) return home();
  const app = document.getElementById("app");
  if(S.i >= S.list.length) return finish();
  const it = S.list[S.i];

  // mélange des propositions à chaque affichage : la position ne se mémorise pas
  if(!it._ordre) it._ordre = shuffle(it.choix.map((_,k)=>k));

  const lettres = "ABCDE";
  const boutons = it._ordre.map((idx,pos)=>
    `<button class="ch" id="ch${pos}" onclick="repondre(${idx},${pos})">
       <span class="lettre">${lettres[pos]}</span><span>${it.choix[idx]}</span>
     </button>`).join("");

  app.innerHTML = `
    <div class="toolbar">
      <div class="meta"><span>${S.label}</span></div>
      <button class="ghost tiny" onclick="home()">Quitter</button>
    </div>
    <div class="progress"><i style="width:${S.i/S.list.length*100}%"></i></div>
    <div class="card">
      <div class="meta">
        <span>Question ${S.i+1} / ${S.list.length} ${S.serie>=3?`<span class="serie">${S.serie} d'affilée</span>`:""}</span>
        <span><span class="tag">${it.dom}</span> <span class="tag">N${it.lvl}</span></span>
      </div>
      <div class="qtext">${it.q}</div>
      <div class="choix">${boutons}</div>
      <div id="fb"></div>
    </div>`;
  headerStats();
}

function repondre(idx, pos){
  const it = S.list[S.i];
  const ok = (idx === it.bonne);
  if(ok){ S.score++; S.serie++; } else { S.wrong.push(it); S.serie = 0; }
  grade(it.id, ok);

  it._ordre.forEach((choixIdx, p)=>{
    const b = document.getElementById("ch"+p);
    b.disabled = true;
    if(choixIdx === it.bonne) b.classList.add("bonne");
    else if(p === pos) b.classList.add("mauvaise");
    else b.classList.add("estompe");
  });

  document.getElementById("fb").innerHTML = `
    <div class="fb ${ok?'ok':'ko'}">
      <span class="badge">${ok?'CORRECT':'À REVOIR'}</span>
      <div>${it.explain}</div>
    </div>
    <div class="row"><button onclick="next()">Suivant →</button></div>`;
  document.querySelector(".row button").focus();
}
function next(){ S.i++; render(); }

function finish(){
  const pct = Math.round(S.score/S.list.length*100);
  const byDom = {};
  S.list.forEach(q=>{ byDom[q.dom] = byDom[q.dom]||{t:0,k:0}; byDom[q.dom].t++; });
  S.wrong.forEach(q=>{ byDom[q.dom].k++; });
  const rows = Object.entries(byDom).sort((a,b)=>(b[1].k/b[1].t)-(a[1].k/a[1].t))
    .map(([d,v])=>`<div><span>${d}</span><span>${v.t-v.k}/${v.t}</span></div>`).join("");
  const msg = pct>=85 ? "Ce niveau est acquis en reconnaissance. Passe au même niveau en réponses libres."
            : pct>=65 ? "Bonne base. Refais les ratées, puis retente."
            : pct>=45 ? "Ça vient. Lis les fiches du domaine le plus rouge avant de rejouer."
            : "Normal à ce stade — lis l'explication de chaque question, c'est là qu'est le cours.";
  document.getElementById("app").innerHTML = `
    <div class="card done">
      <div class="meta" style="justify-content:center">${S.label}</div>
      <div class="score">${S.score} / ${S.list.length}</div>
      <div class="sub">${pct}% — ${msg}</div>
      <div class="row" style="justify-content:center">
        ${S.wrong.length?`<button onclick="replayWrong()">Rejouer les ${S.wrong.length} ratées</button>`:""}
        ${pct>=85?`<button class="ghost" onclick="location.href='quiz.html'">Passer aux réponses libres →</button>`:""}
        <button class="ghost" onclick="home()">Accueil</button>
      </div>
      <div class="dom-list" style="text-align:left">${rows}</div>
    </div>`;
  headerStats();
}
function replayWrong(){
  const w = S.wrong.map(q=>{ delete q._ordre; return q; });
  start(shuffle(w), "Rattrapage — "+S.label);
}

home();
</script>
</body>
