  {"id":"cka-t-netpol-block","lvl":7,"dom":"Réseau","q":"Deux pods communiquaient, puis plus rien — sans changement applicatif. Quelle piste vérifier tôt ?","explain":"Dès qu'une policy cible un pod, tout ce qui n'est pas explicitement autorisé est refusé. Oublier la règle egress DNS (port 53) est un piège très courant.","choix":["Une NetworkPolicy récemment ajoutée qui sélectionne l'un des deux pods et bloque implicitement le reste","Les limites de ressources","Le nombre de répliques","Les labels du nœud"],"bonne":0},
  {"id":"cka-t-netpol-dns","lvl":8,"dom":"Réseau","q":"Après ajout d'une NetworkPolicy egress restrictive, les pods ne résolvent plus aucun nom. Pourquoi ?","explain":"Piège classique. Toujours ajouter une règle egress vers kube-system/CoreDNS sur le port 53 UDP+TCP dans une policy egress restrictive.","choix":["La policy bloque le trafic DNS sortant : il faut autoriser explicitement le port 53 (UDP et TCP) vers CoreDNS","CoreDNS est tombé","Le CNI ne supporte pas l'egress","Les pods ont perdu leur IP"],"bonne":0},
  {"id":"cka-t-pvc-pending","lvl":6,"dom":"SQL","q":"Un PVC reste en « Pending ». Quelles causes envisager ?","explain":"Comparer minutieusement PVC et PV : capacité demandée ≤ capacité offerte, accessModes identiques, storageClassName identique (une chaîne vide n'égale pas « standard »).","choix":["Aucun PV disponible correspondant (taille, accessModes, storageClassName), ou StorageClass inexistante / pas de provisionneur","Le pod n'existe pas encore","Le namespace est plein","Le nœud est cordonné"],"bonne":0},
  {"id":"cka-t-pod-pvc","lvl":9,"dom":"SQL","q":"Un pod reste Pending avec « pod has unbound immediate PersistentVolumeClaims ». Que faire ?","explain":"Le scheduler refuse de placer un pod dont le volume n'est pas lié. La cause est toujours en amont, côté PVC/PV/StorageClass.","choix":["Diagnostiquer le PVC (kubectl describe pvc) : c'est lui qui bloque, pas le pod","Supprimer et recréer le pod","Augmenter les ressources du nœud","Ajouter une toleration"],"bonne":0},
  {"id":"cka-t-rbac-forbidden","lvl":7,"dom":"Sécurité","q":"Une application reçoit « Error from server (Forbidden) » en interrogeant l'API. Comment diagnostiquer ?","explain":"Forbidden = authentifié mais pas autorisé (RBAC). Unauthorized (401) = problème d'authentification. Nuance testée à l'examen.","choix":["Identifier le ServiceAccount du pod, puis tester avec kubectl auth can-i <verbe> <ressource> --as=system:serviceaccount:<ns>:<sa>","Redémarrer le pod","Vérifier le DNS","Recréer le namespace"],"bonne":0},
  {"id":"cka-t-certs-expired","lvl":8,"dom":"Kubernetes","q":"Après un an sans maintenance, kubectl renvoie une erreur de certificat expiré. Que fais-tu ?","explain":"Les certificats kubeadm durent 1 an et sont renouvelés automatiquement à chaque upgrade — d'où les pannes sur les clusters jamais mis à jour.","choix":["kubeadm certs check-expiration puis kubeadm certs renew all, et régénérer /etc/kubernetes/admin.conf","Réinstaller le cluster","Redémarrer les nœuds","Désactiver TLS"],"bonne":0},
  {"id":"cka-t-scheduler-down","lvl":9,"dom":"Kubernetes","q":"Les nouveaux pods restent Pending, aucun n'est placé, mais les pods existants fonctionnent. Quelle hypothèse ?","explain":"Un pod Pending SANS événement de scheduling (aucun message « FailedScheduling ») évoque un scheduler absent, pas un manque de ressources.","choix":["kube-scheduler est arrêté ou en erreur — vérifier son static pod et ses logs","Le CNI est tombé","etcd est plein","Les nœuds sont NotReady"],"bonne":0},
  {"id":"cka-t-disk-pressure","lvl":7,"dom":"Kubernetes","q":"Un nœud a la condition DiskPressure=True. Quelles conséquences et quelle action ?","explain":"Le garbage collector du kubelet supprime les images inutilisées, mais des logs volumineux ou un /var plein exigent une intervention manuelle.","choix":["Le kubelet expulse des pods et refuse d'en placer de nouveaux ; il faut libérer de l'espace (images inutilisées, logs) sur le nœud","Rien de particulier","Le nœud passe automatiquement en Ready","Les pods sont migrés sans impact"],"bonne":0},
  {"id":"cka-t-exit-code","lvl":8,"dom":"Kubernetes","q":"Un conteneur se termine avec le code de sortie 137. Que signifie-t-il ?","explain":"Exit 0 = succès, 1 = erreur applicative, 137 = SIGKILL (souvent OOMKilled), 143 = SIGTERM (arrêt propre).","choix":["128 + 9 (SIGKILL) : le conteneur a été tué de force, typiquement par OOM ou par un timeout d'arrêt","Erreur applicative","Image introuvable","Problème réseau"],"bonne":0},
  {"id":"az204-v-sku","lvl":1,"dom":"Azure","q":"Dans Azure, que désigne le « SKU » d'un service ?","explain":"SKU = Stock Keeping Unit, terme hérité du commerce. Dans Azure : le « tier » choisi (Basic/Standard/Premium…), qui détermine fonctionnalités et prix.","choix":["Sa déclinaison tarifaire et de capacité (ex : Basic, Standard, Premium)","Son identifiant unique dans le tenant","Sa région de déploiement","Sa version d'API"],"bonne":0},
  {"id":"az204-v-arm","lvl":3,"dom":"Azure","q":"Qu'est-ce qu'ARM dans Azure ?","explain":"Azure Resource Manager reçoit toutes les requêtes (portail, CLI, SDK) et gère les déploiements — notamment via les templates ARM/Bicep.","choix":["Azure Resource Manager — la couche de déploiement et de gestion de toutes les ressources","Un type de processeur uniquement","Le service de monitoring","L'annuaire des identités"],"bonne":0},
  {"id":"az204-v-rbac","lvl":1,"dom":"Sécurité","q":"Que permet Azure RBAC (Role-Based Access Control) ?","explain":"RBAC = qui (identité) peut faire quoi (rôle) sur quoi (scope : subscription, resource group, ressource).","choix":["Attribuer des rôles (lecteur, contributeur…) à des identités sur un périmètre donné","Chiffrer les données au repos","Filtrer le trafic réseau","Générer des tokens OAuth"],"bonne":0},
  {"id":"az204-v-blob","lvl":1,"dom":"Azure","q":"Que signifie « blob » dans Azure Blob Storage ?","explain":"Un blob = n'importe quel fichier (image, vidéo, log…). Trois types : block blob (fichiers), append blob (logs), page blob (disques VM).","choix":["Binary Large Object — un objet binaire (fichier) non structuré","Backup Log Object Base","Un type de base de données","Block Level Output Buffer"],"bonne":0},
  {"id":"az204-v-lrs","lvl":2,"dom":"Azure","q":"Que garantit la redondance LRS (Locally Redundant Storage) ?","explain":"LRS = 3 copies, 1 datacenter. ZRS = 3 zones. GRS = + région appairée. RA-GRS = + lecture sur le secondaire.","choix":["3 copies dans un même datacenter","3 copies sur 3 zones de disponibilité","6 copies sur 2 régions","1 copie avec snapshot quotidien"],"bonne":0},
  {"id":"az204-v-etag","lvl":1,"dom":"Azure","q":"À quoi sert l'ETag d'un blob ou d'un document Cosmos ?","explain":"L'ETag change à chaque modification. En envoyant If-Match: <etag>, l'écriture échoue (412) si quelqu'un a modifié entre-temps.","choix":["À la concurrence optimiste : détecter qu'une ressource a changé depuis sa lecture (If-Match)","À chiffrer la ressource","À définir son tier d'accès","À tracer les accès"],"bonne":0},
  {"id":"az204-v-oidc","lvl":1,"dom":"Sécurité","q":"Quelle est la différence entre OAuth 2.0 et OpenID Connect (OIDC) ?","explain":"OIDC ajoute l'ID token à OAuth 2.0. Access token = ce que l'app peut faire ; ID token = qui est l'utilisateur.","choix":["OAuth = autorisation (accéder à des ressources) ; OIDC = authentification (prouver qui est l'utilisateur), par-dessus OAuth","Ce sont deux noms du même protocole","OIDC est l'ancienne version d'OAuth","OAuth authentifie, OIDC autorise"],"bonne":0},
  {"id":"az204-v-msal","lvl":2,"dom":"Sécurité","q":"Qu'est-ce que MSAL ?","explain":"MSAL gère l'acquisition et le cache des tokens. Deux clients : PublicClientApplication et ConfidentialClientApplication.","choix":["La bibliothèque Microsoft pour obtenir des tokens auprès de la plateforme d'identité (Microsoft Authentication Library)","Le service d'audit de sécurité Azure","Un protocole réseau","Le langage des policies APIM"],"bonne":0},
  {"id":"az204-v-hsm","lvl":2,"dom":"Sécurité","q":"Que signifie HSM (disponible dans Key Vault Premium) ?","explain":"Le HSM garantit que les clés ne quittent jamais un matériel certifié (FIPS 140-2). C'est ce qui distingue Key Vault Premium du Standard.","choix":["Hardware Security Module — un boîtier matériel qui protège les clés cryptographiques","High Security Mode","Hosted Secret Manager","Hybrid Storage Module"],"bonne":0},
  {"id":"az204-v-apm","lvl":3,"dom":"Observabilité","q":"Application Insights est un outil « APM ». Que signifie ce sigle ?","explain":"APM = surveiller les performances applicatives : requêtes, dépendances, exceptions, disponibilité.","choix":["Application Performance Monitoring (ou Management)","Azure Platform Metrics","Automated Process Manager","Application Portal Microsoft"],"bonne":0},
  {"id":"az204-v-idempotent","lvl":1,"dom":"Azure","q":"Une opération « idempotente », c'est quoi ?","explain":"Crucial en messagerie : Event Grid et Service Bus livrent « at-least-once » → un même message peut arriver deux fois, ton traitement doit être idempotent.","choix":["Une opération qu'on peut exécuter plusieurs fois avec le même résultat qu'une seule fois","Une opération qui ne peut jamais échouer","Une opération asynchrone","Une opération chiffrée de bout en bout"],"bonne":0},
  {"id":"az204-v-nosql","lvl":1,"dom":"Azure","q":"Qu'est-ce qui caractérise une base NoSQL comme Cosmos DB par rapport à SQL Server ?","explain":"Cosmos DB stocke des documents JSON sans schéma imposé et scale horizontalement via les partitions. Les requêtes SQL-like existent (SELECT * FROM c WHERE…).","choix":["Schéma flexible (documents JSON), scalabilité horizontale par partitionnement","Pas de possibilité de requêtes","Uniquement du stockage clé-valeur","Transactions impossibles"],"bonne":0},
  {"id":"az204-v-401","lvl":3,"dom":"Azure","q":"Quelle est la différence entre HTTP 401 et 403 ?","explain":"401 Unauthorized = « qui es-tu ? » ; 403 Forbidden = « je sais qui tu es, mais tu n'as pas le droit ».","choix":["401 = non authentifié (pas/mauvais token) ; 403 = authentifié mais pas autorisé","401 = pas autorisé ; 403 = pas authentifié","Les deux sont identiques","401 = erreur serveur ; 403 = erreur client"],"bonne":0},
  {"id":"az204-v-sidecar","lvl":1,"dom":"Docker","q":"Dans le pattern « sidecar », que fait le second conteneur ?","explain":"Dans ACI, un container group permet ce pattern : plusieurs conteneurs sur le même hôte partageant réseau et volumes.","choix":["Il tourne à côté du conteneur principal (même hôte, réseau partagé) pour l'assister : logs, proxy, monitoring","Il remplace le conteneur principal en cas de panne","Il stocke les images","Il compile le code du conteneur principal"],"bonne":0},
  {"id":"az204-f-storage-req","lvl":5,"dom":"Azure","q":"Une Function App exige-t-elle un compte de stockage Azure ?","explain":"Toujours : le runtime s'en sert pour la gestion des triggers, les clés, et l'état des Durable Functions (task hub).","choix":["Oui, toujours (AzureWebJobsStorage)","Non, jamais","Seulement en plan Premium","Seulement avec Durable Functions"],"bonne":0},
  {"id":"az204-f-cron5min","lvl":4,"dom":"Azure","q":"Quelle expression NCRONTAB déclenche une fonction toutes les 5 minutes ?","explain":"6 champs, secondes en premier : « 0 */5 * * * * » = à la seconde 0 de chaque minute multiple de 5. « 0 0 */5 * * * » serait toutes les 5 heures.","choix":["0 */5 * * * *","*/5 * * * *","0 0 */5 * * *","5 * * * * *"],"bonne":0},
  {"id":"az204-f-hostjson","lvl":5,"dom":"Azure","q":"host.json vs local.settings.json : lequel est déployé dans Azure ?","explain":"local.settings.json ne quitte JAMAIS ta machine (il contient les secrets locaux). En prod, ses valeurs deviennent des app settings.","choix":["host.json (config globale du runtime) ; local.settings.json reste local","local.settings.json ; host.json reste local","Les deux sont déployés","Aucun des deux"],"bonne":0},
  {"id":"az204-f-durable-det","lvl":6,"dom":"Azure","q":"Dans un orchestrateur Durable Functions, comment obtenir la date/heure courante ?","explain":"L'orchestrateur rejoue son historique (event sourcing) : son code doit être déterministe. DateTime.Now changerait à chaque replay.","choix":["context.CurrentUtcDateTime — jamais DateTime.Now","DateTime.Now","DateTime.UtcNow","Environment.TickCount"],"bonne":0},
  {"id":"az204-f-connstr-prefix","lvl":5,"dom":"Azure","q":"Une connection string de type « Custom » configurée dans App Service apparaît dans l'environnement avec quel préfixe ?","explain":"Chaque type a son préfixe : SQLAZURECONNSTR_, SQLCONNSTR_, MYSQLCONNSTR_, POSTGRESQLCONNSTR_, CUSTOMCONNSTR_.","choix":["CUSTOMCONNSTR_","SQLCONNSTR_","AZURECONNSTR_","CONNSTR_"],"bonne":0},
  {"id":"az204-f-appsettings-restart","lvl":6,"dom":"Azure","q":"Que se passe-t-il quand tu modifies un app setting d'une App Service ?","explain":"Modifier les app settings redémarre l'app. Ils sont injectés comme variables d'environnement au démarrage et écrasent appsettings.json.","choix":["L'application redémarre","Rien, c'est pris en compte à chaud","Il faut redéployer le code","Le setting n'est appliqué qu'au prochain swap"],"bonne":0},
  {"id":"az204-f-lifecycle-freq","lvl":4,"dom":"Azure","q":"À quelle fréquence s'exécute une lifecycle management policy sur un compte de stockage ?","explain":"~1×/jour. Ne pas s'attendre à un effet immédiat après création de la policy — question classique.","choix":["Environ une fois par jour (premiers effets sous 24-48 h)","En temps réel","Toutes les heures","Une fois par semaine"],"bonne":0},
  {"id":"az204-f-cosmos-trigger","lvl":4,"dom":"Azure","q":"Les pre/post-triggers Cosmos DB s'exécutent-ils automatiquement sur chaque opération ?","explain":"Piège classique : contrairement à SQL Server, un trigger Cosmos ne se déclenche que si l'opération le demande (PreTriggers/PostTriggers dans les options).","choix":["Non — ils doivent être explicitement spécifiés dans les options de chaque requête","Oui, dès qu'ils sont créés","Oui, mais seulement les pre-triggers","Seulement en mode serverless"],"bonne":0},
  {"id":"az204-f-cosmos-feed","lvl":5,"dom":"Azure","q":"Le change feed de Cosmos DB expose-t-il les suppressions ?","explain":"Le change feed standard = créations + modifications, dans l'ordre par partition. Pour « voir » les deletes : marquer l'item supprimé puis laisser le TTL le purger.","choix":["Non (en mode standard) — utiliser un flag soft delete + TTL","Oui, toutes les opérations","Oui, mais seulement 24 h","Seulement via stored procedure"],"bonne":0},
  {"id":"az204-f-apim-sections","lvl":4,"dom":"Azure","q":"Quelles sont les 4 sections d'une policy APIM ?","explain":"inbound (avant le backend), backend, outbound (avant de répondre au client), on-error. <base /> contrôle l'héritage des policies parentes.","choix":["inbound, backend, outbound, on-error","request, response, error, retry","pre, main, post, catch","in, out, err, finally"],"bonne":0},
  {"id":"az204-f-sb-modes","lvl":4,"dom":"Azure","q":"Quel mode de réception Service Bus risque de PERDRE un message si le consommateur crashe ?","explain":"Receive-and-delete = at-most-once (rapide mais risqué). Peek-lock (défaut) = at-least-once : le message revient si pas complété avant la fin du lock.","choix":["Receive-and-delete (supprimé dès réception)","Peek-lock","Les deux","Aucun"],"bonne":0},
  {"id":"az204-f-eg-schemas","lvl":4,"dom":"Azure","q":"Quels sont les deux schémas d'événements supportés par Event Grid ?","explain":"Le schéma propriétaire (id, topic, subject, eventType…) et CloudEvents 1.0 (source, type, specversion…) — le standard ouvert interopérable.","choix":["Event Grid schema et CloudEvents 1.0","JSON et XML","AMQP et MQTT","OpenAPI et AsyncAPI"],"bonne":0},
  {"id":"az204-s-func-30min","lvl":9,"dom":"Azure","q":"Un traitement serverless dure 30 minutes. Quels plans Functions conviennent ?","explain":"Consumption plafonne à 10 min. Premium/Flex/Dedicated : 30 min par défaut, extensible sans limite garantie 60 min.","choix":["Premium ou Flex Consumption (ou Dedicated)","Consumption classique","N'importe lequel","Aucun — il faut une VM"],"bonne":0},
  {"id":"az204-s-order-strict","lvl":8,"dom":"Azure","q":"Les commandes d'un même client doivent être traitées STRICTEMENT dans l'ordre. Quelle solution ?","explain":"Sessions Service Bus = FIFO garanti par session + un seul consommateur par session. Queue Storage ne garantit pas l'ordre.","choix":["Service Bus avec sessions (SessionId = id client)","Queue Storage","Event Grid","Event Hubs sans consumer group"],"bonne":0},
  {"id":"az204-s-avail-multi","lvl":7,"dom":"Observabilité","q":"Tu dois tester la disponibilité d'un parcours qui enchaîne login puis appel API (plusieurs requêtes + logique custom). Quelle approche App Insights ?","explain":"Le standard test = UNE requête. Multi-étapes ou logique custom → TrackAvailability() dans une Function déclenchée par timer.","choix":["Une Azure Function qui exécute le parcours et appelle TrackAvailability()","Un standard test","Un URL ping test","Live Metrics"],"bonne":0},
  {"id":"az204-s-apim-breaking","lvl":7,"dom":"Azure","q":"Tu introduis un changement d'API INCOMPATIBLE que les consommateurs doivent choisir explicitement. Version ou revision ?","explain":"Version = breaking change, opt-in du consommateur. Revision = changement non-breaking testé en parallèle puis promu « current ».","choix":["Version (breaking, visible : /v2, query ou header)","Revision (non-breaking, testable via ;rev=2)","Les deux sont équivalents","Un nouveau product"],"bonne":0},
  {"id":"az204-s-apim-ratelimit","lvl":8,"dom":"Azure","q":"Limiter chaque IP à 100 appels par minute sur ton API. Quelle policy APIM ?","explain":"rate-limit-by-key calls=\"100\" renewal-period=\"60\" counter-key=\"@(context.Request.IpAddress)\". quota = plafond long terme (mois), ip-filter = bloquer des IP.","choix":["rate-limit-by-key avec counter-key = l'adresse IP","quota","validate-jwt","ip-filter"],"bonne":0},
  {"id":"az204-s-fanout","lvl":8,"dom":"Azure","q":"Traiter 500 images en PARALLÈLE puis agréger les résultats en un rapport. Quel pattern Durable Functions ?","explain":"Fan-out : lancer N activities en parallèle ; fan-in : Task.WhenAll pour agréger. Chaining = séquentiel.","choix":["Fan-out/fan-in","Function chaining","Monitor","Human interaction"],"bonne":0},
  {"id":"az204-s-approval","lvl":9,"dom":"Azure","q":"Un workflow attend l'approbation d'un manager, avec escalade automatique après 72 h. Quelles APIs Durable Functions ?","explain":"Task.WhenAny entre WaitForExternalEvent(\"Approval\") et un durable timer de 72 h : le premier arrivé gagne.","choix":["WaitForExternalEvent + CreateTimer (pattern human interaction)","CallActivityAsync en boucle","Un trigger HTTP simple","SignalEntity"],"bonne":0},
  {"id":"az204-s-202","lvl":7,"dom":"Azure","q":"Une API REST lance un traitement de 20 min. Le client HTTP ne peut pas attendre. Quel pattern ?","explain":"Le starter Durable Functions renvoie 202 Accepted avec CreateCheckStatusResponse() : le client polle l'endpoint de statut.","choix":["Async HTTP API : répondre 202 + URL de statut à poller","Augmenter le timeout HTTP à 20 min","Répondre 200 à la fin","WebSockets obligatoires"],"bonne":0},
  {"id":"az204-s-swap-sticky","lvl":8,"dom":"Azure","q":"Après un swap staging → production, quel élément reste attaché au slot (ne bascule PAS) ?","explain":"Les settings marqués slot-specific sont sticky, comme les custom domains, bindings TLS et paramètres de scale. Le reste suit le code.","choix":["Les app settings marqués « Deployment slot setting »","Les app settings non marqués","Les handler mappings","Les certificats publics"],"bonne":0},
  {"id":"az204-s-canary","lvl":7,"dom":"Docker","q":"Déployer une nouvelle version d'un microservice conteneurisé en envoyant 10 % du trafic dessus (canary). Quel service le permet nativement ?","explain":"Container Apps en mode multiple revisions : 90 % sur l'ancienne révision, 10 % sur la nouvelle. ACI n'a ni révisions ni répartition.","choix":["Container Apps (traffic splitting entre révisions)","ACI","App Service Free","ACR"],"bonne":0},
  {"id":"az204-s-cosmos-react","lvl":9,"dom":"Azure","q":"Exécuter du code à chaque création/modification de document Cosmos DB, en serverless. Quelle approche ?","explain":"Le trigger Functions s'appuie sur le change feed (+ lease container). Les triggers Cosmos natifs ne sont pas automatiques, et le polling gaspille des RU.","choix":["Azure Function avec trigger Cosmos DB (change feed)","Un pre-trigger Cosmos","Interroger la base toutes les secondes","Event Grid sur le compte Cosmos"],"bonne":0},
  {"id":"az204-s-silent","lvl":7,"dom":"Sécurité","q":"Dans quel ordre MSAL doit-il tenter d'obtenir un token pour minimiser les interactions utilisateur ?","explain":"Le cache d'abord (silent), l'UI seulement si nécessaire. C'est le pattern canonique MSAL — et une question récurrente.","choix":["AcquireTokenSilent d'abord, AcquireTokenInteractive dans le catch (MsalUiRequiredException)","Interactive d'abord, silent ensuite","Toujours interactive","Toujours silent"],"bonne":0},
  {"id":"az204-s-graph-throttle","lvl":8,"dom":"Azure","q":"Microsoft Graph renvoie 429 à ton application. Que doit-elle faire ?","explain":"Respecter Retry-After (backoff). Réduire aussi la charge : $select, $top, batching.","choix":["Attendre la durée du header Retry-After puis réessayer","Réessayer immédiatement en boucle","Changer de tenant","Passer en HTTP 1.0"],"bonne":0},
  {"id":"az204-s-appconfig","lvl":7,"dom":"Azure","q":"Centraliser la config NON sensible de 5 microservices avec des valeurs différentes par environnement (dev/prod). Quelle solution ?","explain":"App Configuration + labels dev/prod ; les secrets restent dans Key Vault (via des références Key Vault). Un seul endroit à modifier.","choix":["Azure App Configuration avec labels","Key Vault uniquement","Un fichier JSON dans chaque repo","Variables d'environnement en dur"],"bonne":0},
  {"id":"az204-s-feature10","lvl":8,"dom":"Azure","q":"Activer une nouvelle fonctionnalité pour seulement 10 % des utilisateurs, sans redéployer. Quelle approche ?","explain":"Feature management d'App Configuration : filtres percentage (déploiement progressif), time window et targeting (groupes précis).","choix":["Feature flag App Configuration avec filtre percentage","Un app setting booléen","Deux déploiements séparés","Un slot de staging"],"bonne":0},
  {"id":"az204-s-eg-validate","lvl":8,"dom":"Azure","q":"À la création d'une subscription Event Grid vers ton webhook custom, la livraison échoue immédiatement. Que faut-il gérer ?","explain":"Event Grid vérifie que tu possèdes l'endpoint : répondre 200 avec le validationCode (les handlers Azure comme Functions le font automatiquement).","choix":["Le handshake de validation : renvoyer le validationCode reçu dans l'événement SubscriptionValidationEvent","Rien, Event Grid n'a pas de validation","Installer un certificat client","Ouvrir le port 8080"],"bonne":0},
  {"id":"az204-s-eg-filter","lvl":9,"dom":"Azure","q":"Ta Function ne doit recevoir que les événements des blobs créés dans le dossier « factures/ ». Quelle configuration de la subscription ?","explain":"Le filtrage se fait dans l'event subscription (subject begins/ends with, event types, advanced filters) — pas dans le code, pour ne pas payer les invocations inutiles.","choix":["Un filtre subjectBeginsWith sur le chemin","Un consumer group dédié","Filtrer dans le code de la Function","Une session"],"bonne":0},
  {"id":"az204-s-replay","lvl":7,"dom":"Azure","q":"Un bug a corrompu le traitement des événements d'hier. Comment retraiter les données avec Event Hubs (rétention 7 jours) ?","explain":"Event Hubs ne supprime rien à la lecture : chaque consumer group garde son offset. Il suffit de repartir d'un checkpoint antérieur pendant la rétention.","choix":["Relire le flux depuis un offset antérieur (le checkpoint appartient au consommateur)","Impossible, les événements sont consommés","Demander à l'émetteur de tout renvoyer","Restaurer un backup"],"bonne":0},
  {"id":"az204-s-dlq-why","lvl":8,"dom":"Azure","q":"Des messages disparaissent de ta queue Service Bus sans avoir été traités avec succès. Où regarder en premier ?","explain":"queue/$deadletterqueue : les messages y partent automatiquement après 10 échecs de livraison ou TTL expiré. Rien n'est « perdu » silencieusement en peek-lock.","choix":["La dead-letter queue (TTL expiré ou MaxDeliveryCount atteint)","Les logs du VNet","Le change feed","La région secondaire"],"bonne":0},
  {"id":"az204-s-dedup","lvl":9,"dom":"Azure","q":"L'émetteur peut envoyer deux fois la même commande en cas de retry réseau. Comment éviter le double traitement côté Service Bus ?","explain":"Duplicate detection : Service Bus ignore les messages portant un MessageId déjà vu dans la fenêtre configurée. L'émetteur doit fixer un MessageId métier.","choix":["Activer la duplicate detection (fenêtre basée sur MessageId)","Utiliser receive-and-delete","Réduire le TTL","Passer en tier Basic"],"bonne":0},
  {"id":"az204-s-sub-filter","lvl":7,"dom":"Azure","q":"Sur un topic Service Bus, la subscription « compta » ne doit recevoir que les messages où montant > 1000. Quel type de filtre ?","explain":"SQL filter : montant > 1000. Le correlation filter ne fait que des égalités (plus performant) ; boolean = tout ou rien.","choix":["SQL filter (expression sur les propriétés applicatives)","Correlation filter","Boolean filter","Session filter"],"bonne":0},
  {"id":"az204-s-kv-deleted","lvl":8,"dom":"Azure","q":"Un développeur a supprimé un secret Key Vault critique il y a 3 jours (soft delete actif). Que faire ?","explain":"Le soft delete conserve les objets supprimés (90 j par défaut) : ils sont récupérables. La purge protection empêche même leur purge anticipée.","choix":["Le récupérer avec az keyvault secret recover — il est en rétention","Il est perdu définitivement","Restaurer un backup de la subscription","Recréer le vault"],"bonne":0},
  {"id":"az204-s-healthcheck","lvl":9,"dom":"Azure","q":"Sur 4 instances App Service, une instance renvoie des erreurs. Comment l'écarter automatiquement du trafic ?","explain":"Health check pingue un chemin sur chaque instance ; en échec répété, l'instance est exclue puis remplacée si elle ne récupère pas.","choix":["Activer le health check : l'instance défaillante est retirée du load balancer","Redémarrer manuellement toutes les heures","Passer en plan Isolated","Activer Always On"],"bonne":0},
  {"id":"az204-s-secure-env","lvl":7,"dom":"Docker","q":"Passer une clé API à un conteneur ACI sans qu'elle apparaisse dans le portail ni dans az container show. Comment ?","explain":"Les secure environment variables sont masquées dans les sorties. Encore mieux pour du vrai secret : managed identity + Key Vault.","choix":["--secure-environment-variables","--environment-variables","La coder en dur dans l'image","Un tag Docker"],"bonne":0},
  {"id":"az204-s-scale-rule","lvl":8,"dom":"Azure","q":"Ton autoscale ajoute des instances à CPU > 70 % mais la facture explose : le nombre d'instances ne redescend jamais. Qu'as-tu oublié ?","explain":"Toujours des règles en PAIRE : scale-out ET scale-in. Sans règle de retour, les instances ajoutées restent indéfiniment.","choix":["La règle de scale-IN symétrique (ex : CPU < 30 %)","Le health check","Un slot de staging","Le cool down"],"bonne":0},
  {"id":"az204-s-choose-svc","lvl":9,"dom":"Azure","q":"« Notifier en push plusieurs systèmes qu'une commande a été créée, sans qu'ils aient de valeur métier à extraire du message lui-même. » Quel service ?","explain":"Un ÉVÉNEMENT notifie un fait (l'émetteur n'attend rien) → Event Grid. Un MESSAGE transporte une donnée à traiter (contrat) → Service Bus / Queue Storage.","choix":["Event Grid (événement discret, push, réactif)","Event Hubs","Service Bus","Queue Storage"],"bonne":0},
  {"id":"az204-v-az-zone","lvl":3,"dom":"Azure","q":"Qu'est-ce qu'une « availability zone » dans une région Azure ?","explain":"3 zones minimum par région compatible. C'est ce qui rend ZRS résilient : 3 copies sur 3 zones = survivre à la perte d'un datacenter entier.","choix":["Un (ou plusieurs) datacenter physiquement séparé, avec alimentation et réseau indépendants","Un sous-réseau virtuel","Une zone géographique de facturation","Un cluster Kubernetes"],"bonne":0},
  {"id":"az204-v-authcode","lvl":3,"dom":"Sécurité","q":"Quel flow OAuth 2.0 utilise une web app classique pour connecter un UTILISATEUR ?","explain":"Authorization code + PKCE est le standard actuel. Client credentials = daemons sans utilisateur. Le flow implicit est déprécié.","choix":["Authorization code (avec PKCE)","Client credentials","Device code","Implicit (recommandé)"],"bonne":0},
  {"id":"az204-v-pkce","lvl":1,"dom":"Sécurité","q":"À quoi sert PKCE dans le flow authorization code ?","explain":"PKCE (Proof Key for Code Exchange) : le client prouve que c'est bien lui qui échange le code, sans avoir besoin d'un secret.","choix":["Protéger les clients publics (SPA, mobile) contre l'interception du code d'autorisation","Chiffrer le token en AES","Remplacer le refresh token","Signer les requêtes Graph"],"bonne":0},
  {"id":"az204-v-kudu","lvl":1,"dom":"Azure","q":"Qu'est-ce que « Kudu » pour une App Service ?","explain":"Kudu (endpoint SCM) donne accès aux fichiers, aux logs de déploiement, à une console — très utile en debug. C'est aussi lui qui reçoit les ZIP deploy.","choix":["La console d'administration avancée (site https://monapp.scm.azurewebsites.net) : fichiers, console, déploiements","Le load balancer interne","Un SKU Premium","L'outil de migration de bases"],"bonne":0},
  {"id":"az204-v-dapr","lvl":3,"dom":"Docker","q":"Que fournit Dapr, intégré nativement dans Azure Container Apps ?","explain":"Dapr (Distributed Application Runtime) tourne en sidecar à côté de ton conteneur. KEDA = scaling, Dapr = plomberie microservices, envoy = ingress.","choix":["Des briques microservices : invocation de services, pub/sub, gestion d'état, via un sidecar","L'autoscaling","Le registre d'images","Le chiffrement TLS"],"bonne":0},
  {"id":"az204-v-put","lvl":1,"dom":"Azure","q":"Quelle est la différence entre PUT et PATCH ?","explain":"PUT envoyé deux fois = même résultat (idempotent). Les SDK Azure Cosmos utilisent ReplaceItem (PUT) vs PatchItem (PATCH, opérations ciblées).","choix":["PUT remplace la ressource ENTIÈRE (idempotent) ; PATCH modifie partiellement","PUT crée, PATCH supprime","PATCH est plus rapide","Aucune différence"],"bonne":0},
  {"id":"az204-v-cicd","lvl":2,"dom":"Azure","q":"Que signifie CI/CD (indispensable pour ta carrière) ?","explain":"CI = intégrer et tester en continu ; CD = livrer automatiquement. Sur Azure : GitHub Actions ou Azure DevOps Pipelines, souvent vers un slot de staging puis swap.","choix":["Continuous Integration / Continuous Delivery — builder, tester et déployer automatiquement à chaque commit","Cloud Infrastructure / Cloud Deployment","Container Image / Container Deploy","Code Inspection / Code Debug"],"bonne":0},
  {"id":"az204-v-ade","lvl":3,"dom":"Sécurité","q":"« Encryption at rest » vs « encryption in transit » : quelle est la différence ?","explain":"Azure Storage chiffre au repos par défaut (SSE, clés Microsoft ou customer-managed). En transit : TLS — d'où les options « HTTPS only » et spr=https des SAS.","choix":["At rest = données chiffrées sur disque (SSE) ; in transit = chiffrées sur le réseau (TLS/HTTPS)","At rest = RAM, in transit = disque","Ce sont des synonymes","At rest concerne seulement les backups"],"bonne":0},
  {"id":"az204-f-alwayson","lvl":5,"dom":"Azure","q":"À quoi sert le paramètre « Always On » d'une App Service ?","explain":"Sans Always On (dispo dès Basic), l'app « s'endort » et la première requête subit un démarrage lent. Obligatoire pour des Functions sur plan App Service.","choix":["Empêcher le déchargement de l'app après ~20 min sans trafic (requis pour les Functions en plan Dedicated)","Garantir le SLA","Activer l'autoscale","Forcer HTTPS"],"bonne":0},
  {"id":"az204-f-zipdeploy","lvl":6,"dom":"Azure","q":"Quelle commande CLI déploie un package ZIP sur une App Service ?","explain":"az webapp deploy (successeur de config-zip). Astuce liée : WEBSITE_RUN_FROM_PACKAGE=1 exécute l'app directement depuis le package (lecture seule, démarrage propre).","choix":["az webapp deploy --src-path app.zip --type zip","az webapp push app.zip","az appservice upload app.zip","az webapp start --zip"],"bonne":0},
  {"id":"az204-f-blobtypes","lvl":4,"dom":"Azure","q":"Quels sont les 3 types de blobs et leur usage ?","explain":"Block blob = le cas général. Append blob = optimisé pour l'ajout (logs). Page blob = pages de 512 octets, disques de VM. Hot/Cool/Archive sont des TIERS, pas des types.","choix":["Block (fichiers), Append (logs, ajout en fin), Page (disques VM, accès aléatoire)","Hot, Cool, Archive","Standard, Premium, Ultra","Text, Binary, Stream"],"bonne":0},
  {"id":"az204-f-staticweb","lvl":5,"dom":"Azure","q":"Comment héberger un site statique directement depuis un compte de stockage ?","explain":"Static website → conteneur $web + endpoint https://compte.z6.web.core.windows.net. Souvent combiné avec un CDN pour le domaine custom et le HTTPS.","choix":["Activer « static website » : les fichiers sont servis depuis le conteneur $web","Créer un conteneur public nommé www","Installer IIS sur le compte","Impossible sans App Service"],"bonne":0},
  {"id":"az204-f-cosmos-autoscale","lvl":5,"dom":"Azure","q":"En mode autoscale, entre quelles bornes Cosmos DB fait-il varier le débit ?","explain":"Autoscale RU max = 4000 → varie entre 400 et 4000 RU/s. Tu paies le pic atteint dans l'heure.","choix":["Entre 10 % et 100 % du maximum configuré","Entre 0 et l'infini","Entre 50 % et 150 %","Il double à chaque pic"],"bonne":0},
  {"id":"az204-f-cosmos-indexmode","lvl":6,"dom":"Azure","q":"Quels sont les modes d'indexation d'un conteneur Cosmos DB ?","explain":"Consistent = défaut (l'index suit chaque écriture). None = pour les conteneurs purement clé/valeur. On optimise surtout via include/exclude paths.","choix":["Consistent (index mis à jour de façon synchrone, défaut) et None","Fast et Slow","Lazy uniquement","Full-text et Vector uniquement"],"bonne":0},
  {"id":"az204-f-kv-objects","lvl":6,"dom":"Azure","q":"Quels sont les 3 types d'objets stockés dans Key Vault ?","explain":"Secrets (valeurs récupérables), keys (opérations crypto SANS extraction de la clé), certificates (gestion + renouvellement auto possible).","choix":["Secrets, keys (clés crypto), certificates","Users, groups, roles","Blobs, queues, tables","Tokens, claims, scopes"],"bonne":0},
  {"id":"az204-f-apim-groups","lvl":6,"dom":"Azure","q":"Quels sont les 3 groupes intégrés du developer portal APIM ?","explain":"Administrators (gèrent), Developers (authentifiés, consomment), Guests (non authentifiés — peuvent voir les APIs autorisées).","choix":["Administrators, Developers, Guests","Owners, Readers, Contributors","Admins, Users, Anonymous","Root, Staff, Public"],"bonne":0},
  {"id":"az204-f-eh-tu","lvl":4,"dom":"Azure","q":"Que représente 1 throughput unit (TU) Event Hubs Standard ?","explain":"1 TU = 1 Mo/s ingress, 2 Mo/s egress. Premium compte en processing units, Dedicated en capacity units.","choix":["1 Mo/s (ou 1000 événements/s) en entrée et 2 Mo/s en sortie","10 Mo/s symétriques","1 partition","1 consumer group"],"bonne":0},
  {"id":"az204-f-sb-basic","lvl":5,"dom":"Azure","q":"Quelle fonctionnalité N'EST PAS disponible dans Service Bus tier Basic ?","explain":"Basic = queues uniquement. Topics/subscriptions → Standard minimum. Messages 100 Mo, VNet, perf prévisible → Premium.","choix":["Les topics (pub/sub)","Les queues","L'envoi de messages","La réception peek-lock"],"bonne":0},
  {"id":"az204-f-sb-lockdur","lvl":6,"dom":"Azure","q":"Durée par défaut (et maximum) du verrou peek-lock sur un message Service Bus ?","explain":"Lock de 1 min (défaut), 5 min max — renouvelable côté client (auto-renewal du SDK). Passé le délai sans Complete, le message redevient visible.","choix":["1 minute par défaut, 5 minutes max (renouvelable)","30 s par défaut, 1 h max","5 min par défaut, illimité","10 s fixes"],"bonne":0},
  {"id":"az204-f-acr-triggers","lvl":6,"dom":"Docker","q":"Quels sont les 3 déclencheurs automatiques d'un ACR Task ?","explain":"Source code update, base image update (LE cas d'examen : patcher automatiquement quand l'image FROM est mise à jour), et schedule.","choix":["Commit dans le repo source, mise à jour de l'image de base, planification (timer)","Push d'image, pull d'image, suppression","Alerte de sécurité, quota, coût","Webhook, e-mail, SMS"],"bonne":0},
  {"id":"az204-s-managed-cert","lvl":7,"dom":"Azure","q":"Ajouter HTTPS sur le domaine custom www.monsite.fr d'une App Service SANS acheter de certificat. Quelle solution ?","explain":"App Service managed certificate : gratuit, auto-renouvelé. Limites : pas de wildcard, pas d'export. Custom domain + TLS dès le tier Basic.","choix":["Le certificat managé App Service (gratuit, renouvelé automatiquement)","Un certificat auto-signé","Obligatoirement un certificat payant","Désactiver HTTPS"],"bonne":0},
  {"id":"az204-s-worm","lvl":8,"dom":"Azure","q":"La réglementation impose que des documents blob ne puissent être NI modifiés NI supprimés pendant 5 ans. Quelle fonctionnalité ?","explain":"Immutability policies (WORM = Write Once, Read Many) : time-based retention ou legal hold. Archive rend le blob offline mais pas immuable.","choix":["Immutable storage : time-based retention policy (WORM)","Le tier Archive","Un lease infini","La redondance GRS"],"bonne":0},
  {"id":"az204-s-storage-cors","lvl":9,"dom":"Azure","q":"Ta SPA JavaScript reçoit une erreur du navigateur en appelant directement le blob storage : « blocked by CORS policy ». Que faire ?","explain":"CORS se configure côté service (compte de stockage, section CORS) : allowed origins/methods/headers + max age.","choix":["Configurer les règles CORS sur le compte de stockage (origines, méthodes, headers autorisés)","Changer le tier du blob","Utiliser HTTP au lieu de HTTPS","Désactiver le firewall Windows"],"bonne":0},
  {"id":"az204-s-poison","lvl":7,"dom":"Azure","q":"Un message de Queue Storage fait planter ta Function à chaque tentative. Que se passe-t-il après 5 échecs ?","explain":"Le trigger Queue Storage retente 5 fois (maxDequeueCount) puis met le message en poison queue. L'équivalent Service Bus = dead-letter après MaxDeliveryCount.","choix":["Il est déplacé dans la queue « nomqueue-poison »","Il est supprimé définitivement","La Function est désactivée","Il bloque la queue"],"bonne":0},
  {"id":"az204-s-hotpartition","lvl":8,"dom":"Azure","q":"Ton conteneur Cosmos a des 429 alors que le débit global est loin du provisionné : une seule partition sature. Quelle est la cause probable ?","explain":"Le débit est réparti entre partitions physiques : une partition key qui concentre le trafic (ex : la date du jour) sature sa partition. Choisir haute cardinalité + répartition uniforme.","choix":["Partition key mal choisie (faible cardinalité → hot partition)","Trop de consumer groups","Le TTL est désactivé","L'index est en mode consistent"],"bonne":0},
  {"id":"az204-s-crosspartition","lvl":9,"dom":"Azure","q":"Une requête Cosmos coûte très cher en RU et s'exécute lentement car elle interroge TOUTES les partitions. Comment l'éviter ?","explain":"Une requête sans partition key = cross-partition (fan-out sur toutes les partitions). Toujours filtrer sur la partition key quand c'est possible.","choix":["Inclure la partition key dans le filtre WHERE (requête ciblée sur une partition)","Augmenter le TTL","Passer en consistance eventual","Désactiver l'index"],"bonne":0},
  {"id":"az204-s-obo","lvl":7,"dom":"Sécurité","q":"Ton API reçoit un token utilisateur et doit appeler Microsoft Graph AU NOM de cet utilisateur. Quel flow OAuth ?","explain":"On-behalf-of : l'API (confidential client) échange le token reçu contre un token pour l'API en aval, en préservant l'identité de l'utilisateur.","choix":["On-behalf-of (OBO) : échanger le token entrant contre un token Graph","Client credentials","Device code","Implicit"],"bonne":0},
  {"id":"az204-s-kvref","lvl":8,"dom":"Azure","q":"Une App Service doit lire un secret Key Vault via un simple app setting, sans code SDK. Quelle syntaxe ?","explain":"Les Key Vault references dans les app settings + managed identity autorisée sur le vault : l'app lit le setting comme une valeur normale.","choix":["@Microsoft.KeyVault(SecretUri=https://monvault.vault.azure.net/secrets/MonSecret/)","{{keyvault:MonSecret}}","$KEYVAULT/MonSecret","%KV_MonSecret%"],"bonne":0},
  {"id":"az204-s-slowdep","lvl":9,"dom":"Observabilité","q":"Les utilisateurs se plaignent de lenteurs. Tu veux identifier QUELLE dépendance (SQL, API externe…) ralentit quelle opération. Quel outil App Insights ?","explain":"Application Map montre la topologie avec latences/échecs par dépendance ; ensuite le transaction search/end-to-end détaille chaque opération.","choix":["Application Map (+ dependency tracking) pour visualiser latence et taux d'échec par composant","Live Metrics","Un availability test","Le sampling"],"bonne":0},
  {"id":"az204-s-redis-mux","lvl":8,"dom":"Azure","q":"Ton app .NET épuise les connexions Redis et lève des timeouts sous charge. Quelle est l'erreur de code classique ?","explain":"Le ConnectionMultiplexer est thread-safe et conçu pour être partagé (singleton / Lazy<T>). En créer un par requête = fuite de connexions.","choix":["Créer un ConnectionMultiplexer à chaque requête au lieu d'un singleton réutilisé","Utiliser le port 6380","Mettre des TTL trop courts","Utiliser StringSet au lieu de HashSet"],"bonne":0},
  {"id":"az204-s-cdn-qs","lvl":9,"dom":"Azure","q":"Ton API derrière CDN renvoie des résultats différents selon ?ville=paris ou ?ville=lyon, mais le CDN sert la même réponse aux deux. Quel réglage ?","explain":"Par défaut le CDN peut ignorer la query string. « Cache every unique URL » fait de chaque combinaison de paramètres une entrée de cache distincte.","choix":["Query string caching = « cache every unique URL »","Purger le cache","Augmenter le TTL","Désactiver la compression"],"bonne":0},
  {"id":"az204-s-apim-cachepol","lvl":7,"dom":"Azure","q":"Réduire la charge du backend pour un GET très fréquent dont la réponse change peu. Quelles policies APIM ?","explain":"cache-lookup vérifie le cache en entrée ; cache-store enregistre la réponse en sortie (duration en secondes). Le backend n'est appelé qu'à l'expiration.","choix":["cache-lookup (inbound) + cache-store (outbound) avec une durée","rate-limit + quota","validate-jwt + cors","mock-response"],"bonne":0},
  {"id":"az204-s-apim-delheader","lvl":9,"dom":"Azure","q":"Pour des raisons de sécurité, supprimer le header « X-Powered-By » des réponses renvoyées aux clients. Quelle policy et où ?","explain":"On modifie les réponses en OUTBOUND : <set-header name=\"X-Powered-By\" exists-action=\"delete\" />. Masquer les headers techniques limite la reconnaissance.","choix":["set-header avec exists-action=\"delete\" dans la section outbound","rewrite-uri en inbound","ip-filter en backend","retry en on-error"],"bonne":0},
  {"id":"az204-s-eg-dl","lvl":7,"dom":"Azure","q":"Des événements Event Grid non livrés après 24 h de retry doivent être CONSERVÉS pour analyse. Quelle configuration ?","explain":"Sans dead-letter configuré, les événements expirés sont PERDUS. Le dead-lettering (vers un blob storage) doit être explicitement activé sur la subscription.","choix":["Activer le dead-lettering de la subscription vers un conteneur blob","Ils sont conservés automatiquement","Augmenter le retry à 48 h","Basculer sur CloudEvents"],"bonne":0},
  {"id":"az204-s-kafka","lvl":8,"dom":"Azure","q":"Migrer une application Kafka existante vers Azure SANS réécrire le code producteur/consommateur. Quelle solution ?","explain":"Event Hubs expose une surface Kafka (protocole 1.0+) : l'app pointe sur le namespace Event Hubs, quasiment sans changement de code.","choix":["Event Hubs avec son endpoint compatible Kafka (changer la connection string)","Service Bus topics","Event Grid","Queue Storage"],"bonne":0},
  {"id":"az204-s-sb-scheduled","lvl":9,"dom":"Azure","q":"Envoyer maintenant un message qui ne doit être DISPONIBLE pour les consommateurs que demain à 9 h. Quelle fonctionnalité Service Bus ?","explain":"ScheduledEnqueueTimeUtc (ou ScheduleMessageAsync) : le message reste invisible jusqu'à l'heure programmée. TTL = expiration, l'inverse.","choix":["Scheduled delivery (ScheduledEnqueueTime sur le message)","Le TTL","Une session","Le defer"],"bonne":0},
  {"id":"az204-s-sb-defer","lvl":7,"dom":"Azure","q":"Un message ne peut pas être traité MAINTENANT (il attend un autre événement) mais ne doit être ni abandonné ni dead-lettered. Quelle opération ?","explain":"Defer sort le message du flux normal ; on le récupère explicitement via ReceiveDeferredMessageAsync(sequenceNumber) — à stocker quelque part.","choix":["Defer : le mettre de côté et le récupérer plus tard par son SequenceNumber","Complete","Abandon (il reviendra)","Le renvoyer dans la queue"],"bonne":0},
  {"id":"az204-s-front-back","lvl":7,"dom":"Azure","q":"Pour ta carrière : une API interne appelée UNIQUEMENT par tes microservices doit être protégée sans gérer de secrets. Quelle combinaison Azure ?","explain":"Chaque service appelle avec sa managed identity (token Entra ID), l'API valide audience et rôle. Zéro secret, rotation automatique — le pattern de référence.","choix":["Managed identities + validation du token Entra ID (audience de l'API)","Une clé API en dur dans le code","Un mot de passe partagé par e-mail","IP whitelisting seul"],"bonne":0},
  {"id":"az204-c-blob-get","lvl":5,"dom":"Azure","q":"Complète le code : quelle méthode obtient le client du blob ?","explain":"Hiérarchie SDK v12 : BlobServiceClient → GetBlobContainerClient → GetBlobClient. GetBlockBlobReference vient de l'ancien SDK v11 — piège classique.","choix":["GetBlobClient","GetBlockBlobReference","CreateBlob","OpenBlob"],"bonne":0},
  {"id":"az204-c-blob-udk","lvl":8,"dom":"Azure","q":"Quelle méthode obtient la clé nécessaire à une user delegation SAS ?","explain":"On demande d'abord la user delegation key (credentials Entra ID), puis on signe la SAS avec — jamais avec la clé du compte.","choix":["GetUserDelegationKeyAsync","GetAccountSasAsync","CreateSasTokenAsync","GetSharedKeyAsync"],"bonne":0},
  {"id":"az204-c-feed-lease","lvl":9,"dom":"Azure","q":"Complète : où le change feed processor stocke-t-il sa position de lecture ?","explain":"Le lease container mémorise l'avancement et coordonne plusieurs instances. Les 4 composants : conteneur surveillé, lease container, host, delegate.","choix":["WithLeaseContainer","WithCheckpointStore","WithOffsetContainer","WithStateTable"],"bonne":0},
  {"id":"az204-c-msal-client","lvl":7,"dom":"Azure","q":"Quelle méthode MSAL correspond au flow client credentials ?","explain":"AcquireTokenForClient = l'app s'authentifie elle-même. Note le scope /.default — indissociable de ce flow.","choix":["AcquireTokenForClient","AcquireTokenSilent","AcquireTokenInteractive","AcquireTokenByAuthorizationCode"],"bonne":0},
  {"id":"az204-c-sb-sender","lvl":6,"dom":"Azure","q":"Complète la création de l'émetteur :","explain":"ServiceBusClient.CreateSender / CreateReceiver / CreateProcessor. (CreateProducer, c'est Event Hubs — piège.)","choix":["CreateSender","GetQueue","CreateProducer","OpenChannel"],"bonne":0},
  {"id":"az204-c-eh-batch","lvl":5,"dom":"Azure","q":"Complète la création du lot d'événements :","explain":"CreateBatchAsync + TryAdd (qui renvoie false si le lot est plein) + SendAsync — le pattern d'envoi efficace.","choix":["CreateBatchAsync","NewBatch","BeginBatchAsync","CreateEventGroup"],"bonne":0},
  {"id":"az204-c-queue-send","lvl":4,"dom":"Azure","q":"Complète l'envoi du message :","explain":"SDK v12 : SendMessageAsync / ReceiveMessagesAsync / UpdateMessageAsync / DeleteMessageAsync. AddMessage = ancien SDK.","choix":["SendMessageAsync","AddMessageAsync","EnqueueAsync","PushAsync"],"bonne":0},
  {"id":"az204-c-graph-me","lvl":6,"dom":"Azure","q":"Complète pour récupérer le profil de l'utilisateur connecté :","explain":"graphClient.Me = l'utilisateur du token. graphClient.Users[id] pour un autre utilisateur (permissions app).","choix":["Me","Users[\"moi\"]","Profile","CurrentUser"],"bonne":0},
  {"id":"az204-c-funcjson-dir","lvl":4,"dom":"Azure","q":"Quelle valeur pour la direction d'un trigger ?","explain":"Un trigger est toujours direction « in ». Les bindings de sortie sont « out ».","choix":["in","out","inout","trigger"],"bonne":0},
  {"id":"az204-c-ncron-930","lvl":9,"dom":"Azure","q":"Quelle expression NCRONTAB déclenche tous les jours à 9 h 30 ?","explain":"6 champs : sec min heure jour mois jour-semaine → 0 30 9 * * *. « 30 9 * * * » est du cron Unix à 5 champs — invalide ici.","choix":["0 30 9 * * *","30 9 * * *","0 9 30 * * *","* 30 9 * * *"],"bonne":0},
  {"id":"az204-c-apim-ratekey","lvl":8,"dom":"Azure","q":"Complète pour limiter le débit PAR adresse IP :","explain":"context.Request.IpAddress. Les expressions de policy sont du C# entre @(...).","choix":["IpAddress","ClientIp","RemoteAddr","Origin"],"bonne":0},
  {"id":"az204-c-kql-fail","lvl":5,"dom":"Azure","q":"Complète pour ne garder que les requêtes en échec :","explain":"La table requests a une colonne booléenne « success ». where → summarize → order : le squelette KQL à reconnaître.","choix":["success","failed","status","ok"],"bonne":0},
  {"id":"az204-c-kvref-setting","lvl":9,"dom":"Azure","q":"Complète la syntaxe de référence Key Vault :","explain":"@Microsoft.KeyVault(SecretUri=...) + managed identity autorisée sur le vault = secret lu comme un app setting normal.","choix":["KeyVault","SecretStore","Vault","AppConfig"],"bonne":0},
  {"id":"az204-csA-deploy","lvl":8,"dom":"Azure","q":"Comment répondre à l'exigence « déploiements sans interruption » au moindre effort ?","explain":"Le plan Standard de Contoso inclut 5 slots : staging + swap préchauffé = zéro downtime, sans coût supplémentaire.","choix":["Deployment slots + swap (le plan Standard les inclut déjà)","Redéployer la nuit en espérant peu de trafic","Créer une 2e app et basculer le DNS","Arrêter l'app pendant la mise à jour"],"bonne":0},
  {"id":"az204-csA-scale","lvl":9,"dom":"Azure","q":"Comment absorber la charge des week-ends en maîtrisant les coûts ?","explain":"Le pic est prévisible → règles planifiées, complétées par des règles métriques pour l'imprévu. Et toujours des règles de scale-in pour redescendre.","choix":["Autoscale : règles planifiées (week-end) + règles métriques (CPU), avec scale-in symétrique","Passer en plan Isolated en permanence","Scale-up manuel chaque vendredi soir","Doubler le nombre d'instances à l'année"],"bonne":0},
  {"id":"az204-csA-secrets","lvl":8,"dom":"Azure","q":"Comment satisfaire « aucun secret dans le code ou la configuration » pour l'accès à Cosmos DB ?","explain":"Managed identity + RBAC élimine le secret. Un app setting en clair reste un secret stocké — ça ne répond pas à l'exigence.","choix":["Managed identity de l'App Service + rôle RBAC sur Cosmos, via DefaultAzureCredential","Connection string dans appsettings.json","Connection string dans un app setting en clair","Un compte SQL partagé par l'équipe"],"bonne":0},
  {"id":"az204-csB-alert","lvl":8,"dom":"Azure","q":"Une anomalie détectée doit alerter PLUSIEURS systèmes en mode push et réactif. Quel service ?","explain":"Un événement discret à diffuser en push vers plusieurs abonnés = Event Grid. Chaque système filtre ce qui l'intéresse.","choix":["Event Grid (custom topic + une subscription par système)","Une boucle de polling sur Event Hubs","Un e-mail groupé","Queue Storage lue par tous"],"bonne":0},
  {"id":"az204-csB-order","lvl":9,"dom":"Azure","q":"Les ordres de maintenance doivent être traités DANS L'ORDRE pour chaque machine. Quelle solution ?","explain":"FIFO par machine = sessions Service Bus, avec le SessionId comme clé de regroupement. Aucun autre service ne garantit cet ordre.","choix":["Service Bus avec sessions (SessionId = identifiant machine)","Event Grid avec advanced filters","Queue Storage avec visibility timeout","Event Hubs avec Capture"],"bonne":0},
  {"id":"az204-csC-expose","lvl":7,"dom":"Azure","q":"Comment exposer l'API aux partenaires avec clés d'accès et documentation self-service ?","explain":"APIM industrialise tout : le developer portal documente, les products regroupent, les subscriptions fournissent les clés.","choix":["API Management : products, subscriptions et developer portal","Distribuer l'URL des Functions avec leur clé de fonction","Un PDF envoyé par e-mail","Un VPN par partenaire"],"bonne":0},
  {"id":"az204-csC-version","lvl":9,"dom":"Azure","q":"Tailwind doit livrer un changement incompatible SANS casser les intégrations existantes. Quelle approche APIM ?","explain":"Breaking change = nouvelle VERSION, opt-in des consommateurs, coexistence v1/v2. Une revision promue modifierait l'API sous leurs pieds.","choix":["Publier une version v2 (path/header) et laisser la v1 active pour les partenaires existants","Modifier l'API en place","Créer une revision et la rendre current immédiatement","Changer l'URL du backend"],"bonne":0},
  {"id":"az204-csC-slow","lvl":7,"dom":"Azure","q":"Des partenaires signalent des lenteurs intermittentes. Comment identifier le composant responsable ?","explain":"App Insights trace chaque requête de bout en bout (APIM → Functions → dépendances) : l'Application Map montre où le temps se perd.","choix":["Application Insights : Application Map + suivi des dépendances pour voir les latences par composant","Redémarrer les Functions tous les jours","Augmenter le SKU APIM","Demander des captures d'écran aux partenaires"],"bonne":0},
  {"id":"az400-v-devops","lvl":2,"dom":"CI/CD","q":"Quelle est la meilleure définition de DevOps ?","explain":"Définition officielle Microsoft : « people, process and products to enable continuous delivery of value ». Créer une « équipe DevOps » séparée est justement un anti-pattern (nouveau silo).","choix":["L'union des personnes, des processus et des produits pour livrer de la valeur en continu aux utilisateurs","Un outil d'automatisation des déploiements","Une équipe dédiée entre les devs et les ops","Un synonyme de CI/CD"],"bonne":0},
  {"id":"az400-v-calms","lvl":3,"dom":"CI/CD","q":"Que recouvre l'acronyme CALMS, cadre d'évaluation de la maturité DevOps ?","explain":"CALMS : Culture (collaboration), Automation, Lean (flux, petits lots), Measurement (mesurer pour améliorer), Sharing (partage des responsabilités).","choix":["Culture, Automation, Lean, Measurement, Sharing","Code, Agile, Learn, Monitor, Ship","Continuous, Automated, Layered, Managed, Secure","Collaboration, Analytics, Logs, Metrics, Security"],"bonne":0},
  {"id":"az400-v-dora","lvl":1,"dom":"CI/CD","q":"Quelles sont les 4 métriques DORA de performance DevOps ?","explain":"Les 4 clés DORA : deux de vitesse (fréquence de déploiement, délai de livraison) et deux de stabilité (taux d'échec des changements, temps de restauration). Explicitement au programme des dashboards.","choix":["Deployment frequency, Lead time for changes, Change failure rate, Time to restore service","Vélocité, burndown, story points, capacité","CPU, mémoire, disque, réseau","Couverture de tests, dette technique, bugs, incidents"],"bonne":0},
  {"id":"az400-v-leadtime","lvl":2,"dom":"CI/CD","q":"Que mesure le « lead time for changes » (délai de livraison) ?","explain":"Du commit à la production. À distinguer du cycle time (début du travail → livraison) et du lead time métier (demande → livraison).","choix":["Le temps entre le commit du code et sa mise en production","La durée d'un sprint","Le temps de build","Le temps entre l'idée et le commit"],"bonne":0},
  {"id":"az400-v-cfr","lvl":1,"dom":"CI/CD","q":"Que mesure le « change failure rate » ?","explain":"Le taux d'échec des changements : % de déploiements causant un incident/rollback/hotfix. Un build échoué en CI ne compte PAS (il n'atteint pas la prod).","choix":["Le pourcentage de déploiements en production qui provoquent une dégradation nécessitant une correction","Le nombre de builds échoués","Le taux de bugs par sprint","Le pourcentage de PR rejetées"],"bonne":0},
  {"id":"az400-v-ci","lvl":2,"dom":"CI/CD","q":"Qu'est-ce que l'intégration continue (CI) ?","explain":"CI = intégrer souvent + valider automatiquement (build + tests). Objectif : détecter les conflits et régressions au plus tôt.","choix":["Fusionner fréquemment le code dans une branche partagée, avec build et tests automatiques à chaque intégration","Déployer automatiquement en production","Écrire des tests unitaires","Surveiller l'application en continu"],"bonne":0},
  {"id":"az400-v-shiftleft","lvl":3,"dom":"CI/CD","q":"Que signifie « shift left » en DevSecOps ?","explain":"Plus un défaut est détecté tard, plus il coûte cher. Shift left = scanner le code, les dépendances et les secrets dès la PR, pas juste avant la prod.","choix":["Déplacer les tests et la sécurité au plus TÔT dans le cycle (dès le commit / la PR)","Déplacer la charge vers l'équipe ops","Passer en revue le code de droite à gauche","Réduire le nombre d'environnements"],"bonne":0},
  {"id":"az400-v-sre","lvl":1,"dom":"SRE","q":"Que signifie SRE et quel est son principe central ?","explain":"SRE applique des pratiques d'ingénierie logicielle à l'exploitation : SLI/SLO, error budget, automatisation du toil, postmortems sans blâme.","choix":["Site Reliability Engineering — traiter la fiabilité comme un problème d'ingénierie, piloté par des SLO et un budget d'erreur","Secure Runtime Environment — sécuriser l'exécution","System Resource Estimation — dimensionner les serveurs","Software Release Engineering — gérer les livraisons"],"bonne":0},
  {"id":"az400-v-sli-slo","lvl":2,"dom":"SRE","q":"Quelle est la différence entre SLI, SLO et SLA ?","explain":"Indicator (je mesure) → Objective (je vise) → Agreement (je m'engage juridiquement). Le SLO est toujours plus strict que le SLA.","choix":["SLI = la mesure (ex : % de requêtes < 300 ms) ; SLO = l'objectif interne visé ; SLA = l'engagement contractuel avec pénalités","SLI et SLO sont identiques, SLA est technique","SLA est interne, SLO est contractuel","Ce sont trois niveaux de sévérité d'incident"],"bonne":0},
  {"id":"az400-v-errorbudget","lvl":3,"dom":"SRE","q":"Qu'est-ce qu'un « error budget » ?","explain":"L'error budget arbitre objectivement entre vitesse et stabilité : tant qu'il reste du budget, on livre ; épuisé, la priorité passe à la fiabilité.","choix":["La part d'indisponibilité tolérée par le SLO (ex : SLO 99,9 % → 0,1 % de budget) ; épuisé, on gèle les nouvelles features pour fiabiliser","Le budget financier alloué aux incidents","Le nombre de bugs autorisés par sprint","La marge de dépassement du coût cloud"],"bonne":0},
  {"id":"az400-v-postmortem","lvl":1,"dom":"SRE","q":"Qu'est-ce qu'un postmortem « blameless » ?","explain":"Blâmer pousse à cacher les erreurs. Sans blâme, on obtient la vraie chronologie et on corrige le système (process, garde-fous), pas la personne.","choix":["Une analyse d'incident centrée sur les causes systémiques, sans désigner de coupable, pour que l'information circule librement","Un rapport anonyme","Une réunion sans les managers","Un incident classé sans suite"],"bonne":0},
  {"id":"az400-v-toil","lvl":2,"dom":"SRE","q":"Qu'appelle-t-on le « toil » en SRE ?","explain":"Le toil grandit avec le service. Les SRE plafonnent le temps qu'ils y consacrent (souvent 50 %) pour garder du temps d'ingénierie.","choix":["Le travail manuel, répétitif, automatisable et sans valeur durable — à éliminer par l'automatisation","Les heures supplémentaires","Le travail de documentation","Les incidents de production"],"bonne":0},
  {"id":"az400-v-azdo-services","lvl":3,"dom":"CI/CD","q":"Quels sont les 5 services d'Azure DevOps ?","explain":"Boards (travail), Repos (Git), Pipelines (CI/CD), Artifacts (packages), Test Plans (tests manuels/exploratoires — licence à part).","choix":["Boards, Repos, Pipelines, Artifacts, Test Plans","Boards, Wiki, Actions, Packages, Monitor","Repos, Actions, Registry, Insights, Plans","Projects, Issues, Builds, Releases, Reports"],"bonne":0},
  {"id":"az400-v-gh-services","lvl":1,"dom":"Git","q":"Quel est l'équivalent GitHub d'Azure Pipelines ?","explain":"Actions = CI/CD. Correspondances : Boards ↔ Issues/Projects, Repos ↔ Repositories, Artifacts ↔ Packages. L'examen teste les DEUX plateformes.","choix":["GitHub Actions","GitHub Packages","GitHub Projects","GitHub Codespaces"],"bonne":0},
  {"id":"az400-v-yaml","lvl":2,"dom":"CI/CD","q":"Pourquoi privilégier les pipelines YAML aux pipelines classiques (interface graphique) ?","explain":"« Pipeline as code » : le pipeline suit le cycle de vie du code. Les pipelines classiques sont en fin de vie — la migration classic → YAML est explicitement au programme.","choix":["Le pipeline est versionné avec le code : historique, revue en PR, branches, réutilisation par templates","Le YAML s'exécute plus vite","Les pipelines classiques ne supportent pas Azure","Le YAML permet plus de jobs parallèles"],"bonne":0},
  {"id":"az400-v-artifact","lvl":3,"dom":"CI/CD","q":"Qu'est-ce qu'un artefact de pipeline ?","explain":"Principe clé : « build once, deploy many » — on construit l'artefact UNE fois puis on déploie le MÊME artefact sur chaque environnement.","choix":["Le résultat d'un build (binaire, package, image, template) publié pour être consommé par les étapes ou pipelines suivants","Un fichier de log","Une variable de pipeline","Un agent de build"],"bonne":0},
  {"id":"az400-v-buildonce","lvl":1,"dom":"CI/CD","q":"Que signifie le principe « build once, deploy many » ?","explain":"Rebuilder par environnement casse la garantie : ce qui est testé en staging n'est plus le binaire déployé en prod. La config vient des variables/App Configuration.","choix":["Un seul artefact est construit puis promu tel quel de dev à prod, la configuration étant injectée à l'exécution","Rebuild à chaque environnement pour garantir la fraîcheur","Un build par branche","Construire une image par région"],"bonne":0},
  {"id":"az400-v-idempotent","lvl":3,"dom":"Terraform","q":"Pourquoi une opération de déploiement doit-elle être idempotente ?","explain":"Idempotent = rejouable sans risque. C'est ce qui permet de relancer un déploiement partiellement échoué en toute sécurité.","choix":["Pour qu'une réexécution donne le même résultat, sans effet de bord — indispensable aux retries et à la reprise après échec","Pour aller plus vite","Pour réduire les coûts","Pour chiffrer les secrets"],"bonne":0},
  {"id":"az400-v-ab","lvl":3,"dom":"CI/CD","q":"Quel est l'objectif d'un test A/B (par opposition à un canary) ?","explain":"Canary = réduire le risque technique ; A/B = décider quelle variante est la meilleure pour le business. Même mécanique de routage, finalité différente.","choix":["Comparer deux variantes sur une MÉTRIQUE MÉTIER (conversion, engagement) — c'est une expérimentation produit","Réduire le risque technique d'une mise en production","Tester la charge","Valider un rollback"],"bonne":0},
  {"id":"az400-v-ghflow","lvl":2,"dom":"CI/CD","q":"En quoi consiste GitHub Flow ?","explain":"GitHub Flow (explicitement au programme) : simple, adapté au déploiement continu. GitFlow est plus lourd (develop/release/hotfix), adapté aux versions livrées périodiquement.","choix":["Une branche main toujours déployable + branches de feature courtes fusionnées par pull request","Cinq types de branches avec des règles de fusion strictes","Une branche par environnement","Développer directement sur main sans PR"],"bonne":0},
  {"id":"az400-v-pr","lvl":3,"dom":"CI/CD","q":"À quoi sert une pull request (PR) ?","explain":"La PR est le point de contrôle qualité : revue humaine + build de validation + scans de sécurité, avant que le code n'entre dans la branche protégée.","choix":["Proposer une fusion, déclencher la revue par les pairs et les validations automatiques avant intégration","Récupérer les modifications distantes","Créer une branche","Publier un package"],"bonne":0},
  {"id":"az400-v-monorepo","lvl":1,"dom":"CI/CD","q":"Quel est l'avantage principal d'un monorepo ?","explain":"Monorepo = un commit peut modifier plusieurs composants de façon cohérente. Il faut alors des path filters pour ne builder que ce qui a changé.","choix":["Refactoring atomique inter-projets et partage de code simplifié, au prix de pipelines plus complexes (filtres de chemins)","Des dépôts plus légers","Une sécurité renforcée","Des builds toujours plus rapides"],"bonne":0},
  {"id":"az400-v-semver","lvl":1,"dom":"CI/CD","q":"Dans le versionnement sémantique MAJOR.MINOR.PATCH, quand incrémente-t-on MAJOR ?","explain":"MAJOR = rupture de compatibilité, MINOR = ajout rétrocompatible, PATCH = correction rétrocompatible. CalVer (versionnement par date, ex : 2026.07.1) est l'alternative citée au programme.","choix":["Lors d'un changement incompatible (breaking change) avec les versions précédentes","À chaque nouvelle fonctionnalité","À chaque correction de bug","À chaque build"],"bonne":0},
  {"id":"az400-v-calver","lvl":2,"dom":"CI/CD","q":"Qu'est-ce que le CalVer ?","explain":"CalVer (Calendar Versioning) — explicitement cité dans le référentiel à côté de SemVer. Utilisé par Ubuntu, PyCharm… quand la date porte plus de sens que la compatibilité.","choix":["Un versionnement basé sur la date (ex : 2026.07.1), utile quand la cadence prime sur la compatibilité","Un calcul automatique de version par le pipeline","Une version calibrée sur les tests","Le versionnement des calendriers de release"],"bonne":0},
  {"id":"az400-v-feed","lvl":3,"dom":"CI/CD","q":"Qu'est-ce qu'un « feed » dans Azure Artifacts ?","explain":"Le feed héberge tes packages ET peut relayer des sources amont (nuget.org, npmjs) — un seul point d'accès, avec cache et traçabilité.","choix":["Un dépôt de packages (NuGet, npm, Maven, Python, Universal) partageable, avec vues et sources amont","Un flux d'événements du pipeline","Un canal de notifications","Un flux RSS des releases"],"bonne":0},
  {"id":"az400-v-sast","lvl":1,"dom":"Sécurité","q":"Quelle est la différence entre SAST et DAST ?","explain":"SAST (ex : CodeQL) tourne dès la PR ; DAST attaque une instance déployée. SCA (Software Composition Analysis, ex : Dependabot) analyse les dépendances tierces.","choix":["SAST analyse le code source à l'arrêt (statique) ; DAST teste l'application en cours d'exécution (dynamique)","SAST teste en production, DAST en développement","SAST concerne les dépendances, DAST le code","Ce sont des synonymes"],"bonne":0},
  {"id":"az400-v-sca","lvl":2,"dom":"Sécurité","q":"Que fait l'analyse SCA (Software Composition Analysis) ?","explain":"SCA = dépendances tierces (Dependabot, Mend, Snyk). Les 4 types de scan au programme : dependency, code, secret et licensing scanning.","choix":["Inventorier les dépendances open source et détecter leurs vulnérabilités et licences","Analyser la complexité du code","Scanner les secrets","Tester les performances"],"bonne":0},
  {"id":"az400-v-spn","lvl":2,"dom":"Sécurité","q":"Qu'est-ce qu'un service principal Microsoft Entra ?","explain":"Un service principal = identité non humaine. Il a des credentials à faire tourner (secret/certificat), contrairement à une managed identity ou à la fédération d'identité de charge de travail.","choix":["Une identité applicative permettant à un pipeline ou script de s'authentifier avec des droits RBAC","Un compte administrateur","Un groupe de sécurité","Un certificat TLS"],"bonne":0},
  {"id":"az400-v-oidc","lvl":1,"dom":"Sécurité","q":"Qu'est-ce que la fédération d'identité de charge de travail (workload identity federation / OIDC) dans un pipeline ?","explain":"C'est l'authentification « secretless » recommandée pour GitHub Actions et Azure Pipelines : fini les secrets qui expirent ou fuitent.","choix":["Le pipeline échange un jeton OIDC de confiance contre un jeton Entra : plus AUCUN secret stocké à faire tourner","Un système de single sign-on pour les développeurs","Un chiffrement des variables","Un annuaire fédéré multi-tenant"],"bonne":0},
  {"id":"az400-v-pat","lvl":2,"dom":"Sécurité","q":"Qu'est-ce qu'un PAT (Personal Access Token) et quelle est la bonne pratique ?","explain":"Un PAT porte l'identité de la PERSONNE (il meurt avec son compte). Pour l'automatisation durable : service principal, managed identity ou workload identity federation.","choix":["Un jeton personnel remplaçant le mot de passe : durée de vie courte, périmètre (scope) minimal, jamais partagé ni committé","Un mot de passe administrateur permanent","Un certificat client","Un jeton attaché au projet, pas à la personne"],"bonne":0},
  {"id":"az400-v-appinsights","lvl":2,"dom":"Observabilité","q":"À quoi sert Application Insights ?","explain":"C'est l'APM d'Azure Monitor. Le référentiel cite explicitement le traçage distribué (distributed tracing) via App Insights.","choix":["Surveiller les performances applicatives : requêtes, dépendances, exceptions, traçage distribué, disponibilité","Gérer les identités","Stocker les artefacts","Orchestrer les conteneurs"],"bonne":0},
  {"id":"az400-v-tracing","lvl":3,"dom":"Observabilité","q":"Qu'est-ce que le traçage distribué (distributed tracing) ?","explain":"Indispensable en microservices : l'operation_Id corrèle les télémétries, et la vue end-to-end transaction montre où le temps se perd.","choix":["Suivre une requête unique à travers tous les microservices traversés, via un identifiant de corrélation","Tracer les logs de plusieurs serveurs dans un même fichier","Répliquer les traces entre régions","Déboguer pas à pas à distance"],"bonne":0},
  {"id":"az400-v-mermaid","lvl":2,"dom":"CI/CD","q":"Qu'est-ce que Mermaid, cité au programme pour la documentation ?","explain":"Mermaid = diagrammes as code, versionnés avec la doc. Supporté dans les wikis Azure DevOps et le Markdown GitHub.","choix":["Une syntaxe texte pour générer des diagrammes (flowchart, séquence, Gantt) dans un wiki ou un Markdown","Un moteur de recherche de wiki","Un générateur d'API REST","Un format d'artefact"],"bonne":0},
  {"id":"az400-v-shiftright","lvl":3,"dom":"CI/CD","q":"Que désigne le « shift right » ?","explain":"Complémentaire du shift left : certains comportements n'apparaissent qu'en conditions réelles. D'où l'instrumentation et les déploiements progressifs.","choix":["Tester et observer en production (monitoring, chaos engineering, canary) car tout ne peut pas être validé avant","Repousser les tests à la fin","Déléguer aux ops","Déployer plus tard dans la semaine"],"bonne":0},
  {"id":"az400-v-wip","lvl":1,"dom":"CI/CD","q":"À quoi sert une limite de WIP (work in progress) sur un tableau Kanban ?","explain":"Loi de Little : plus il y a de travail en cours, plus le cycle time s'allonge. La limite WIP force à terminer avant de commencer.","choix":["Limiter le nombre de tâches en cours pour réduire le temps de cycle et révéler les goulots d'étranglement","Limiter le nombre de développeurs","Plafonner les heures travaillées","Limiter la taille des PR"],"bonne":0},
  {"id":"az400-v-cycletime","lvl":2,"dom":"CI/CD","q":"Dans Azure Boards, quelle est la différence entre cycle time et lead time ?","explain":"Lead time ≥ cycle time : il inclut le temps passé dans le backlog. Les deux widgets existent dans les dashboards Azure Boards.","choix":["Cycle time : du début du travail (In Progress) à la clôture. Lead time : de la CRÉATION du work item à sa clôture","Ce sont deux noms du même indicateur","Cycle time inclut l'attente, lead time non","Lead time concerne les bugs uniquement"],"bonne":0},
  {"id":"az400-v-stakeholder","lvl":3,"dom":"CI/CD","q":"Que permet le niveau d'accès « Stakeholder » (gratuit et illimité) dans Azure DevOps ?","explain":"Stakeholder = parties prenantes métier : suivre le travail sans licence Basic. Sans accès au code source. Question fréquente sur le choix du niveau d'accès.","choix":["Consulter et modifier les work items et dashboards, mais PAS accéder au code ni aux pipelines complets","Un accès complet en lecture seule à tout","Le même accès que Basic","Uniquement la lecture des wikis"],"bonne":0},
  {"id":"az400-v-outside","lvl":1,"dom":"Git","q":"Qu'est-ce qu'un « outside collaborator » sur GitHub ?","explain":"C'est l'accès de moindre privilège pour un prestataire : accès ciblé à un dépôt, sans visibilité sur l'organisation. Cité explicitement au programme.","choix":["Une personne extérieure à l'organisation, invitée sur des dépôts précis sans être membre de l'organisation","Un utilisateur en lecture seule","Un bot d'automatisation","Un compte de service"],"bonne":0},
  {"id":"az400-f-yaml-hier","lvl":5,"dom":"CI/CD","q":"Quelle est la hiérarchie correcte d'un pipeline YAML Azure ?","explain":"Stage = frontière logique (Build, Test, Deploy) ; job = unité exécutée sur UN agent ; step = tâche ou script. Chez GitHub Actions il n'y a pas de stage : workflow → jobs → steps.","choix":["Pipeline → stages → jobs → steps (tasks/scripts)","Pipeline → jobs → stages → steps","Pipeline → phases → tasks → actions","Pipeline → workflows → jobs → runs"],"bonne":0},
  {"id":"az400-f-job-agent","lvl":6,"dom":"CI/CD","q":"Deux steps d'un même job partagent-ils le système de fichiers ?","explain":"Le job est l'unité d'exécution sur un agent. Entre DEUX jobs (potentiellement sur des agents différents), il faut publier/télécharger des artefacts pour transmettre des fichiers.","choix":["Oui — un job s'exécute entièrement sur un seul agent, les steps partagent l'espace de travail","Non, chaque step a son propre agent","Seulement si on active un cache","Uniquement en self-hosted"],"bonne":0},
  {"id":"az400-f-trigger-ci","lvl":4,"dom":"CI/CD","q":"À quoi sert le mot-clé « trigger » (par opposition à « pr ») dans un pipeline YAML ?","explain":"trigger: branches: include: [main] pour la CI. pr: pour valider les PR. « trigger: none » désactive le déclenchement automatique.","choix":["trigger = déclenchement CI sur push vers les branches listées ; pr = déclenchement sur pull request","trigger = manuel, pr = automatique","trigger = planifié, pr = sur commit","Ce sont deux alias du même mécanisme"],"bonne":0},
  {"id":"az400-f-schedule","lvl":4,"dom":"CI/CD","q":"Comment planifier un pipeline tous les jours à 3 h du matin en YAML ?","explain":"schedules: - cron: '0 3 * * *' branches: include: [main] always: true. Cron UTC à 5 champs (contrairement au NCRONTAB à 6 champs des Azure Functions).","choix":["Un bloc schedules: avec cron: '0 3 * * *' et la branche cible","trigger: daily","Un timer trigger","Uniquement via l'interface graphique"],"bonne":0},
  {"id":"az400-f-var-syntax","lvl":5,"dom":"CI/CD","q":"Quelle est la différence entre $(var), ${{ var }} et $[ var ] dans un pipeline YAML ?","explain":"LA question de syntaxe la plus fréquente. ${{ }} est résolu quand le YAML est compilé (utilisable pour générer la structure), $[ ] et $( ) au moment de l'exécution.","choix":["$( ) = macro, remplacée au runtime ; ${{ }} = expression évaluée à la COMPILATION (avant l'exécution) ; $[ ] = expression runtime","Trois syntaxes équivalentes","$( ) pour les secrets uniquement","${{ }} est réservé aux templates GitHub"],"bonne":0},
  {"id":"az400-f-var-secret-env","lvl":6,"dom":"CI/CD","q":"Pourquoi une variable SECRÈTE n'est-elle pas accessible via $(maSecret) dans un script sans configuration supplémentaire ?","explain":"Il faut un mapping explicite : env: MON_SECRET: $(maSecret). C'est une protection contre les fuites accidentelles dans les logs.","choix":["Les secrets ne sont pas injectés automatiquement dans l'environnement : il faut les mapper explicitement via env:","Les secrets sont chiffrés et illisibles","Il faut un agent self-hosted","Ils expirent immédiatement"],"bonne":0},
  {"id":"az400-f-logging-cmd","lvl":6,"dom":"CI/CD","q":"Quelle syntaxe permet à un script de définir une variable consommable par les steps suivants ?","explain":"Les logging commands ##vso[...] pilotent l'agent depuis un script. Équivalent GitHub Actions : echo \"nom=valeur\" >> $GITHUB_OUTPUT.","choix":["echo \"##vso[task.setvariable variable=nom]valeur\"","export nom=valeur","set-variable nom=valeur","echo nom=valeur >> $VARS"],"bonne":0},
  {"id":"az400-f-params-vs-var","lvl":4,"dom":"CI/CD","q":"Quelle différence entre « parameters » et « variables » dans un template YAML ?","explain":"Un parameter peut être boolean/number/object/step/stageList et conditionner la GÉNÉRATION du YAML. Une variable ne peut pas créer ou supprimer un job.","choix":["parameters sont TYPÉS et résolus à la compilation (ils peuvent modifier la structure du pipeline) ; variables sont des chaînes résolues au runtime","Les parameters sont secrets","Les variables sont typées, pas les parameters","Aucune différence"],"bonne":0},
  {"id":"az400-f-template-extends","lvl":5,"dom":"CI/CD","q":"Quelle est la différence entre « extends » et l'inclusion simple d'un template ?","explain":"extends + required templates permet à la sécurité d'imposer des étapes obligatoires (scans) qu'un pipeline enfant ne peut pas contourner.","choix":["extends impose un template parent qui contrôle la structure entière (utilisé pour la gouvernance/sécurité) ; l'inclusion insère juste un fragment","extends est plus rapide","L'inclusion est dépréciée","extends ne fonctionne qu'avec GitHub"],"bonne":0},
  {"id":"az400-f-taskgroup","lvl":6,"dom":"CI/CD","q":"Qu'est-ce qu'un « task group » et quelle est sa limite ?","explain":"Les task groups n'existent PAS en YAML : la réutilisation y passe par les templates. Piège fréquent lors des questions de migration classic → YAML.","choix":["Un ensemble de tâches réutilisable des pipelines CLASSIQUES uniquement — l'équivalent YAML est le template","Un groupe de jobs parallèles","Un regroupement d'agents","Un groupe de variables"],"bonne":0},
  {"id":"az400-f-hosted-agent","lvl":4,"dom":"CI/CD","q":"Quel est l'avantage principal d'un agent Microsoft-hosted ?","explain":"Machine jetable = builds reproductibles. Ses limites : pas d'accès aux réseaux privés, pas de cache local persistant, logiciels préinstallés imposés.","choix":["Machine neuve et propre à chaque job, maintenance et outillage gérés par Microsoft, aucune infrastructure à administrer","Il est toujours plus rapide","Il accède au réseau privé de l'entreprise","Il conserve le cache entre les builds"],"bonne":0},
  {"id":"az400-f-selfhosted-why","lvl":5,"dom":"CI/CD","q":"Dans quels cas un agent self-hosted est-il nécessaire ?","explain":"Le critère décisif à l'examen : accès réseau privé (VNet, on-premises) ou environnement d'exécution non standard. Contrepartie : c'est TOI qui maintiens et sécurises la machine.","choix":["Accès à des ressources réseau privées, logiciels/licences spécifiques, matériel particulier, cache persistant, ou builds très longs","Uniquement pour réduire les coûts","Quand on utilise GitHub","Pour exécuter du YAML"],"bonne":0},
  {"id":"az400-f-demands","lvl":5,"dom":"CI/CD","q":"À quoi servent les « capabilities » et « demands » ?","explain":"pool: name: MonPool, demands: [java, Agent.OS -equals Linux]. Sert à cibler le bon agent dans un pool hétérogène.","choix":["L'agent publie ses capabilities (logiciels installés) ; le job exprime des demands pour être routé vers un agent compatible","À limiter la consommation CPU","À définir les droits d'accès","À planifier les jobs"],"bonne":0},
