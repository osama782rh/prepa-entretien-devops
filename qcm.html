  {"id":"az400-f-parallel-jobs","lvl":6,"dom":"CI/CD","q":"Que détermine le nombre de « jobs parallèles » acheté dans Azure DevOps ?","explain":"C'est le levier n°1 pour réduire l'attente quand plusieurs équipes buildent en même temps. Optimiser la concurrence pour le coût et la perf est explicitement au programme.","choix":["Combien de jobs peuvent s'exécuter SIMULTANÉMENT dans toute l'organisation (les autres sont mis en file d'attente)","Le nombre de pipelines autorisés","Le nombre d'agents installables","Le nombre de stages par pipeline"],"bonne":0},
  {"id":"az400-f-slicing","lvl":5,"dom":"CI/CD","q":"Que fait « strategy: parallel: 5 » sur un job de tests ?","explain":"Le job slicing utilise System.JobPositionInPhase / System.TotalJobsInPhase pour répartir les tests. Levier direct de réduction de la durée du pipeline.","choix":["Découpe le job en 5 tranches (slicing) exécutées en parallèle, chacune traitant une partie des tests","Lance 5 pipelines","Autorise 5 tentatives","Réserve 5 agents pour la journée"],"bonne":0},
  {"id":"az400-f-dependson","lvl":5,"dom":"CI/CD","q":"Par défaut, comment s'exécutent plusieurs jobs déclarés dans un même stage ?","explain":"Les jobs sont parallèles par défaut ; les STAGES sont séquentiels par défaut. Inverser un stage en parallèle se fait avec dependsOn: [].","choix":["En PARALLÈLE (s'il y a assez de jobs parallèles) — dependsOn permet de les séquencer","Séquentiellement dans l'ordre d'écriture","Aléatoirement","Un seul job par stage est autorisé"],"bonne":0},
  {"id":"az400-f-stage-parallel","lvl":6,"dom":"CI/CD","q":"Comment rendre deux stages parallèles alors qu'ils sont séquentiels par défaut ?","explain":"dependsOn: [] supprime la dépendance implicite au stage précédent. Utile pour déployer plusieurs régions simultanément.","choix":["Mettre dependsOn: [] sur le second stage","Ajouter parallel: true","Les fusionner en un seul stage","Utiliser deux pipelines"],"bonne":0},
  {"id":"az400-f-deployjob","lvl":4,"dom":"CI/CD","q":"Qu'apporte un « deployment job » par rapport à un job classique ?","explain":"jobs: - deployment: Deploy / environment: prod / strategy: runOnce. C'est ce qui donne l'historique de déploiement par environnement et les portes d'approbation.","choix":["Il cible un environment (traçabilité, checks et approbations) et offre des stratégies : runOnce, rolling, canary","Il est plus rapide","Il autorise plus de steps","Il chiffre les variables"],"bonne":0},
  {"id":"az400-f-strategies","lvl":5,"dom":"CI/CD","q":"Quelles sont les 3 stratégies d'un deployment job YAML ?","explain":"runOnce (une passe), rolling (par lots de machines), canary (increments successifs). Le blue-green s'implémente via les slots ou le routage, pas comme stratégie native.","choix":["runOnce, rolling, canary","blue-green, canary, ring","manual, auto, scheduled","fast, safe, staged"],"bonne":0},
  {"id":"az400-f-lifecycle-hooks","lvl":6,"dom":"CI/CD","q":"Quels hooks de cycle de vie sont disponibles dans une stratégie de deployment job ?","explain":"routeTraffic bascule le trafic, postRouteTraffic sert à surveiller après bascule, et on: failure exécute le rollback. Séquence à connaître pour les canary/blue-green.","choix":["preDeploy, deploy, routeTraffic, postRouteTraffic, on: success | failure","before, main, after","init, run, cleanup","start, stop, rollback"],"bonne":0},
  {"id":"az400-f-checks","lvl":5,"dom":"CI/CD","q":"Quels types de « checks » peut-on attacher à un environment YAML ?","explain":"Les checks sont la version YAML des release gates classiques : approbation humaine ET portes automatiques (santé, ITSM, horaires, template imposé).","choix":["Approbations manuelles, Azure Monitor alerts, Invoke REST API, Invoke Azure Function, Business hours, Required template, Exclusive lock","Uniquement des approbations manuelles","Uniquement des tests unitaires","Uniquement des scans de sécurité"],"bonne":0},
  {"id":"az400-f-gates","lvl":6,"dom":"CI/CD","q":"À quoi sert une « gate » automatique avant un déploiement en production ?","explain":"Query Azure Monitor alerts, Query work items, Invoke REST API, Invoke Azure Function. Elles peuvent être réévaluées périodiquement jusqu'au timeout.","choix":["Vérifier automatiquement des conditions externes (aucune alerte active, aucun bug bloquant, ticket ITSM approuvé) avant de laisser passer","Bloquer les commits","Valider la syntaxe YAML","Chiffrer les artefacts"],"bonne":0},
  {"id":"az400-f-approval-manual","lvl":4,"dom":"CI/CD","q":"Qui NE PEUT PAS approuver un déploiement, par bonne pratique de séparation des tâches ?","explain":"L'option « Requesters can't approve their own runs » implémente la séparation des tâches exigée par les audits de conformité.","choix":["La personne qui a déclenché le run (option « approbateurs ne peuvent pas approuver leurs propres runs »)","Un membre de l'équipe sécurité","Un chef de projet","Un approbateur d'un autre groupe"],"bonne":0},
  {"id":"az400-f-download","lvl":6,"dom":"CI/CD","q":"Dans un deployment job, faut-il télécharger explicitement les artefacts ?","explain":"Les deployment jobs téléchargent automatiquement les artefacts ; les jobs classiques non. Piège fréquent dans les questions de dépannage.","choix":["Non — les artefacts du pipeline courant sont téléchargés automatiquement (comportement désactivable avec « download: none »)","Oui, toujours manuellement","Seulement en runOnce","Seulement sur agents self-hosted"],"bonne":0},
  {"id":"az400-f-resources-pipeline","lvl":4,"dom":"CI/CD","q":"Comment consommer l'artefact d'un AUTRE pipeline et se déclencher quand il se termine ?","explain":"Les pipeline resources créent le lien de traçabilité et le déclenchement en cascade (pipeline chaining), utile pour séparer build et release.","choix":["Une ressource « resources: pipelines: - pipeline: X source: ... trigger: true »","Un webhook","Un script de copie","Une variable partagée"],"bonne":0},
  {"id":"az400-f-feed-views","lvl":5,"dom":"CI/CD","q":"À quoi servent les vues @local, @prerelease et @release d'un feed Azure Artifacts ?","explain":"Les vues implémentent la promotion de qualité : les consommateurs de prod pointent sur @release et ne voient jamais un package non validé.","choix":["Promouvoir progressivement un package : @local (tout) → @prerelease (testable) → @release (validé pour la prod)","Séparer les packages par langage","Gérer les permissions","Archiver les anciennes versions"],"bonne":0},
  {"id":"az400-f-retention","lvl":4,"dom":"CI/CD","q":"Pourquoi définir une politique de rétention sur les runs et artefacts de pipeline ?","explain":"« Design and implement a retention strategy for pipeline artifacts and dependencies » est au programme. On peut retenir indéfiniment un run précis (release auditée).","choix":["Maîtriser les coûts de stockage tout en conservant ce qui est requis par la conformité (les runs peuvent être épinglés/retenus)","Accélérer les builds","Améliorer la sécurité des agents","Réduire le nombre de jobs parallèles"],"bonne":0},
  {"id":"az400-f-coverage","lvl":5,"dom":"CI/CD","q":"Quels formats la tâche PublishCodeCoverageResults accepte-t-elle ?","explain":"Cobertura/JaCoCo pour la couverture ; JUnit/NUnit/VSTest/xUnit pour les résultats de tests ; SARIF pour les résultats de scan de sécurité. Ne pas les confondre.","choix":["Cobertura et JaCoCo","JUnit et NUnit","JSON et XML génériques","SARIF"],"bonne":0},
  {"id":"az400-f-branchpolicy","lvl":4,"dom":"CI/CD","q":"Quelles protections une branch policy Azure Repos peut-elle imposer ?","explain":"Équivalent GitHub : branch protection rules (required reviews, required status checks, CODEOWNERS, linear history). Le référentiel demande de connaître les DEUX.","choix":["Nombre minimal de reviewers, work items liés, commentaires résolus, build de validation, reviewers automatiques, vérifications de statut","Uniquement le nombre de reviewers","Uniquement un build vert","Uniquement la signature des commits"],"bonne":0},
  {"id":"az400-f-buildvalidation","lvl":5,"dom":"CI/CD","q":"Que fait une policy « build validation » sur une branche ?","explain":"C'est le mécanisme qui garantit que main reste toujours verte : le code est testé fusionné AVANT d'être réellement fusionné.","choix":["Déclenche un pipeline sur la fusion proposée et bloque la complétion de la PR s'il échoue","Valide la syntaxe du YAML","Construit une image Docker à chaque commit","Vérifie la signature du build"],"bonne":0},
  {"id":"az400-f-codeowners","lvl":6,"dom":"CI/CD","q":"À quoi sert un fichier CODEOWNERS sur GitHub ?","explain":"CODEOWNERS + « Require review from Code Owners » garantit que l'équipe compétente relit son périmètre. Équivalent Azure Repos : les automatic reviewers.","choix":["Désigner automatiquement les reviewers obligatoires selon les chemins modifiés","Lister les licences du projet","Définir les permissions du dépôt","Attribuer les issues"],"bonne":0},
  {"id":"az400-f-mergetypes","lvl":4,"dom":"Git","q":"Que fait un « squash merge » ?","explain":"Les 4 types Azure Repos : merge (no fast-forward), squash, rebase, semi-linear merge (rebase + commit de merge).","choix":["Condense tous les commits de la branche en UN seul commit sur la cible : historique linéaire et lisible, mais détail des commits perdu","Fusionne sans créer de commit","Rejoue les commits un par un","Crée un commit de merge classique"],"bonne":0},
  {"id":"az400-f-rebase-vs-merge","lvl":5,"dom":"Git","q":"Quelle est la règle d'or du rebase ?","explain":"Le rebase réécrit les SHA : sur une branche partagée, les collègues se retrouvent avec des historiques divergents. Sur SA branche locale, c'est idéal.","choix":["Ne jamais rebaser des commits déjà poussés sur une branche partagée (cela réécrit l'historique commun)","Toujours rebaser avant chaque commit","Le rebase remplace le merge dans tous les cas","Rebaser uniquement main"],"bonne":0},
  {"id":"az400-f-revert-vs-reset","lvl":4,"dom":"Git","q":"Quelle différence entre git revert et git reset ?","explain":"Sur une branche partagée : TOUJOURS revert. reset --hard sur main déjà poussée casse le dépôt de toute l'équipe.","choix":["revert crée un NOUVEAU commit qui annule les changements (sûr sur branche partagée) ; reset déplace la branche en réécrivant l'historique","revert est local, reset est distant","Ce sont des synonymes","reset est plus sûr que revert"],"bonne":0},
  {"id":"az400-f-remove-secret","lvl":4,"dom":"Git","q":"Un secret a été committé il y a 3 mois. Que faut-il faire ?","explain":"Ordre crucial : la révocation d'abord (le secret est déjà compromis), la réécriture ensuite. Un simple delete laisse le secret dans l'historique.","choix":["RÉVOQUER immédiatement le secret, puis réécrire l'historique (git filter-repo ou BFG) et forcer le push","Supprimer le fichier dans un nouveau commit","Rendre le dépôt privé","Ajouter le fichier au .gitignore"],"bonne":0},
  {"id":"az400-f-gitattributes","lvl":5,"dom":"Git","q":"À quoi sert le fichier .gitattributes ?","explain":"C'est là qu'on déclare « *.psd filter=lfs diff=lfs merge=lfs -text » pour router les gros binaires vers Git LFS.","choix":["Définir le traitement des fichiers par Git : fins de ligne, fichiers binaires, suivi par LFS, stratégie de diff/merge","Lister les contributeurs","Définir les permissions","Configurer les hooks"],"bonne":0},
  {"id":"az400-f-tags","lvl":6,"dom":"Git","q":"Quelle est la différence entre un tag léger (lightweight) et un tag annoté (annotated) ?","explain":"git tag -a v1.2.0 -m \"...\" pour une release traçable et signable. Le tag léger n'est qu'un pointeur vers un SHA.","choix":["Le tag annoté est un objet Git complet (auteur, date, message, signature possible) — recommandé pour marquer les releases","Le tag léger est plus sûr","Le tag annoté est temporaire","Aucune différence fonctionnelle"],"bonne":0},
  {"id":"az400-f-fork","lvl":4,"dom":"Git","q":"Pourquoi un pipeline déclenché par une PR issue d'un FORK n'a-t-il pas accès aux secrets par défaut ?","explain":"Sécurité fondamentale des dépôts publics. On peut l'autoriser explicitement (déconseillé) ou exiger une approbation avant l'exécution du pipeline de fork.","choix":["Pour empêcher un contributeur externe d'exfiltrer les secrets via du code malveillant dans sa PR","Parce que les forks sont hors ligne","Par limitation technique du stockage","Parce que les forks n'ont pas de pipeline"],"bonne":0},
  {"id":"az400-f-submodule","lvl":5,"dom":"Git","q":"Qu'est-ce qu'un submodule Git ?","explain":"Le submodule épingle un commit exact (reproductibilité) mais complique le workflow. Alternative souvent préférable : publier un package versionné.","choix":["Une référence vers un COMMIT précis d'un autre dépôt, permettant le partage de code entre dépôts","Un dossier ignoré","Une branche liée","Un package NuGet"],"bonne":0},
  {"id":"az400-f-ghas","lvl":6,"dom":"CI/CD","q":"Quelles sont les 3 fonctionnalités principales de GitHub Advanced Security ?","explain":"GHAS existe pour GitHub ET pour Azure DevOps (GHAS for Azure DevOps) — le référentiel demande explicitement de configurer les deux.","choix":["Code scanning (CodeQL), secret scanning (avec push protection) et dependency review/Dependabot","Pare-feu, antivirus et VPN","Chiffrement, signature et audit","SAST, DAST et tests de pénétration"],"bonne":0},
  {"id":"az400-f-dependabot","lvl":6,"dom":"Sécurité","q":"Quelle est la différence entre Dependabot alerts et Dependabot security updates ?","explain":"Alerts = détection (via la GitHub Advisory Database). Security updates = remédiation automatisée par PR. Version updates = mises à jour régulières hors sécurité.","choix":["Les alerts signalent une dépendance vulnérable ; les security updates ouvrent automatiquement une PR de mise à jour","Les alerts sont payantes","Les updates ne concernent que npm","Ce sont deux noms du même mécanisme"],"bonne":0},
  {"id":"az400-f-defender-devops","lvl":4,"dom":"Sécurité","q":"Que permet Microsoft Defender for Cloud DevOps Security ?","explain":"La vue unifiée « du code au cloud » : les vulnérabilités du code remontent au même endroit que celles de l'infrastructure. Intégration GHAS ↔ Defender explicitement au programme.","choix":["Centraliser la posture de sécurité des dépôts GitHub/Azure DevOps dans Defender for Cloud, avec les résultats de GHAS","Scanner les VM uniquement","Remplacer les branch policies","Chiffrer les pipelines"],"bonne":0},
  {"id":"az400-f-github-token","lvl":4,"dom":"Sécurité","q":"Qu'est-ce que le GITHUB_TOKEN dans un workflow GitHub Actions ?","explain":"Éphémère et scopé — toujours le préférer à un PAT. Bonne pratique : « permissions: contents: read » pour appliquer le moindre privilège.","choix":["Un jeton temporaire généré automatiquement pour chaque run, expirant à la fin du job, dont on peut restreindre les permissions","Un PAT à créer manuellement","Le mot de passe du compte","Un secret d'organisation permanent"],"bonne":0},
  {"id":"az400-f-github-app","lvl":5,"dom":"Sécurité","q":"Quand privilégier une GitHub App plutôt qu'un PAT pour une automatisation ?","explain":"Le PAT est lié à un individu (il meurt avec son compte et porte tous ses droits). La GitHub App est l'identité d'automatisation propre.","choix":["Quand l'automatisation doit survivre au départ d'une personne : permissions fines, jetons courts, identité propre non nominative","Quand il faut un accès permanent","Pour les scripts locaux","Jamais, le PAT est recommandé"],"bonne":0},
  {"id":"az400-f-azdo-groups","lvl":6,"dom":"CI/CD","q":"Quels sont les groupes de sécurité intégrés d'un projet Azure DevOps ?","explain":"Bonne pratique : attribuer les droits à des GROUPES (idéalement synchronisés depuis Entra ID), jamais à des individus.","choix":["Readers, Contributors, Build Administrators, Project Administrators","Owners, Members, Guests","Admin, User, Guest","Developers, Testers, Managers"],"bonne":0},
  {"id":"az400-f-gh-roles","lvl":4,"dom":"Git","q":"Quels sont les rôles de dépôt GitHub, du moins au plus permissif ?","explain":"Triage = gérer issues/PR sans écrire de code ; Maintain = gérer le dépôt sans accès aux actions destructrices/sécurité sensibles.","choix":["Read, Triage, Write, Maintain, Admin","Guest, User, Power User, Admin","Viewer, Editor, Owner","Reader, Contributor, Owner"],"bonne":0},
  {"id":"az400-f-kql-ago","lvl":6,"dom":"CI/CD","q":"Que fait « where timestamp > ago(24h) » en KQL ?","explain":"ago() est relatif à maintenant. Pour des tranches temporelles : summarize count() by bin(timestamp, 1h).","choix":["Filtre les 24 dernières heures","Décale l'horodatage de 24 h","Regroupe par tranches de 24 h","Supprime les données de plus de 24 h"],"bonne":0},
  {"id":"az400-f-gh-insights","lvl":5,"dom":"Git","q":"Que trouve-t-on dans l'onglet Insights d'un dépôt GitHub ?","explain":"« Configure monitoring in GitHub, including enabling insights and creating and configuring charts » est explicitement au programme.","choix":["Les graphiques d'activité : pulse, contributeurs, fréquence de commits, dependency graph, trafic","Les logs applicatifs","Les métriques Azure Monitor","Les résultats de tests"],"bonne":0},
  {"id":"az400-f-alert-pipeline","lvl":6,"dom":"Observabilité","q":"Comment être alerté de l'échec d'un pipeline Azure DevOps ?","explain":"« Configure alerts for events in GitHub Actions and Azure Pipelines » est au programme : notifications, service hooks, intégration Teams.","choix":["Les notifications intégrées (abonnements par équipe/projet), un service hook vers Teams/Slack, ou une alerte sur métrique","Uniquement par e-mail personnel","Ce n'est pas possible nativement","Uniquement via Azure Monitor"],"bonne":0},
  {"id":"az400-f-availability","lvl":4,"dom":"Observabilité","q":"Quel outil vérifie en continu qu'une URL répond correctement depuis plusieurs régions ?","explain":"Standard test pour une requête simple ; TrackAvailability() dans une Function pour un parcours multi-étapes. Tester depuis ≥ 5 régions.","choix":["Les availability tests d'Application Insights (standard test ou TrackAvailability custom)","Container Insights","Log Analytics agent","Network Watcher"],"bonne":0},
  {"id":"az400-f-loganalytics","lvl":5,"dom":"Observabilité","q":"Quel est le rôle d'un Log Analytics workspace ?","explain":"C'est le magasin de données d'Azure Monitor Logs. Centraliser plusieurs sources dans UN workspace permet les requêtes croisées.","choix":["Stocker et indexer les logs et métriques de multiples sources, interrogeables en KQL","Héberger les pipelines","Stocker les artefacts","Gérer les identités"],"bonne":0},
  {"id":"az400-f-process-templates","lvl":6,"dom":"CI/CD","q":"Quels sont les 4 process templates d'Azure Boards ?","explain":"Basic (Issue/Task, le plus simple), Agile (User Story/Bug), Scrum (Product Backlog Item), CMMI (Requirement, le plus formel — environnements régulés).","choix":["Basic, Agile, Scrum, CMMI","Kanban, Scrum, SAFe, Lean","Simple, Standard, Advanced, Enterprise","Waterfall, Agile, Hybrid, Custom"],"bonne":0},
  {"id":"az400-f-traceability","lvl":5,"dom":"CI/CD","q":"Qu'appelle-t-on la traçabilité de bout en bout dans un contexte DevOps ?","explain":"« Design and implement source, bug, and quality traceability » : indispensable en environnement audité pour répondre à « qu'est-ce qui est parti en prod, validé par qui ? ».","choix":["Pouvoir relier une exigence → commit → build → release → déploiement → incident, dans les deux sens","Tracer les logs applicatifs","Suivre les utilisateurs","Auditer les connexions"],"bonne":0},
  {"id":"az400-f-wiki-code","lvl":6,"dom":"CI/CD","q":"Quelle est la différence entre un wiki de projet et un « publish code as wiki » ?","explain":"Publier le code comme wiki maintient la doc au plus près du code, revue dans la même PR — la pratique « docs as code ».","choix":["Le wiki de projet vit dans un dépôt Git dédié ; publish as wiki publie des fichiers Markdown d'un dépôt de code existant (doc versionnée avec le code)","Le second est en lecture seule pour tous","Le premier ne supporte pas Markdown","Aucune différence"],"bonne":0},
  {"id":"az400-f-releasenotes","lvl":4,"dom":"CI/CD","q":"Comment générer automatiquement des release notes à partir de l'historique Git ?","explain":"« Automate creation of documentation from Git history » est au programme. GitHub génère des notes depuis les PR fusionnées ; côté Azure DevOps, des extensions/scripts exploitent les work items liés.","choix":["Une tâche/script de pipeline qui exploite git log et les work items liés (ou la génération automatique de notes GitHub Releases)","Il faut les écrire à la main","Via Azure Monitor","Via un webhook Teams"],"bonne":0},
  {"id":"az400-f-teams-integration","lvl":5,"dom":"CI/CD","q":"Comment notifier un canal Microsoft Teams quand un déploiement échoue ?","explain":"« Configure integration between GitHub or Azure DevOps and Microsoft Teams » est explicitement au programme. Les approbations peuvent même se faire depuis Teams.","choix":["Le connecteur Azure Pipelines pour Teams, ou un service hook vers un webhook entrant du canal","Uniquement par e-mail","Via une Logic App obligatoirement","Ce n'est pas supporté"],"bonne":0},
  {"id":"az400-f-deliveryplans","lvl":6,"dom":"CI/CD","q":"À quoi servent les Delivery Plans dans Azure Boards ?","explain":"Vue calendaire multi-équipes — l'outil de coordination inter-équipes du domaine « processus et communications ».","choix":["Visualiser sur un calendrier les livrables de PLUSIEURS équipes pour repérer les dépendances et conflits","Planifier les déploiements","Gérer les congés","Estimer les coûts"],"bonne":0},
  {"id":"az400-f-cfd","lvl":5,"dom":"CI/CD","q":"Que montre un diagramme de flux cumulé (CFD) ?","explain":"CFD = outil de diagnostic du flux. Une bande « In Review » qui s'élargit signale que les revues de code sont le goulot.","choix":["La quantité de travail dans chaque état au fil du temps : un élargissement de bande révèle un goulot d'étranglement","La vélocité par sprint","La couverture de tests","Le taux d'échec des déploiements"],"bonne":0},
  {"id":"az400-s-branch-strategy","lvl":8,"dom":"CI/CD","q":"Une équipe de 8 devs déploie plusieurs fois par jour. Les merges sont douloureux car les branches vivent 2 semaines. Que recommandes-tu ?","explain":"La douleur du merge vient de la DURÉE de vie des branches. Les feature flags permettent de fusionner du code inachevé mais désactivé.","choix":["Trunk-based development : branches de feature de moins de 1-2 jours, intégration continue dans main, feature flags pour le code inachevé","GitFlow avec develop et release","Une branche par développeur","Une branche par environnement"],"bonne":0},
  {"id":"az400-s-env-branches","lvl":9,"dom":"CI/CD","q":"Une équipe utilise des branches dev/staging/prod et « promeut » par merge entre branches. Quel est le problème ?","explain":"Anti-pattern des « environment branches ». Le bon modèle : une branche source de vérité, un artefact construit une fois, promu de stage en stage.","choix":["Le binaire est rebuild à chaque branche : ce qui est testé n'est pas ce qui part en prod. Il faut un artefact unique promu entre environnements","Aucun, c'est la bonne pratique","Il manque une branche QA","Les branches doivent être protégées"],"bonne":0},
  {"id":"az400-s-large-files","lvl":8,"dom":"CI/CD","q":"Le clone du dépôt prend 40 minutes à cause d'assets binaires volumineux versionnés depuis des années. Que fais-tu ?","explain":"LFS remplace les blobs par des pointeurs. Attention : migrer les fichiers EXISTANTS impose une réécriture d'historique (git lfs migrate).","choix":["Migrer les binaires vers Git LFS (et réécrire l'historique si nécessaire) ; envisager Scalar / clone partiel pour les très gros dépôts","Supprimer l'historique","Passer en clone superficiel définitivement","Découper en 10 dépôts"],"bonne":0},
  {"id":"az400-s-agents-cost","lvl":9,"dom":"CI/CD","q":"Les builds attendent 30 minutes en file d'attente aux heures de pointe. Quelle est la première action ?","explain":"Attente en file = manque de CONCURRENCE (jobs parallèles). Un build lent est un autre problème (durée), qu'on traite ensuite par le cache et le découpage.","choix":["Augmenter le nombre de jobs parallèles (ou ajouter des agents self-hosted), puis optimiser la durée des builds (cache, parallélisme, path filters)","Acheter des agents plus puissants","Réduire le nombre de commits","Supprimer les tests"],"bonne":0},
  {"id":"az400-s-private-net","lvl":7,"dom":"CI/CD","q":"Le pipeline doit déployer sur un SQL Server on-premises accessible uniquement depuis le réseau interne. Que mets-tu en place ?","explain":"C'est LE cas d'usage canonique du self-hosted. Alternative gérée : les VM scale set agents dans un VNet, qui combinent isolation réseau et élasticité.","choix":["Un agent self-hosted (ou un scale set d'agents) placé dans le réseau qui a la visibilité sur la ressource","Ouvrir le SQL Server sur Internet","Utiliser un agent Microsoft-hosted avec une IP fixe","Passer par un webhook"],"bonne":0},
  {"id":"az400-s-slow-pipeline","lvl":8,"dom":"CI/CD","q":"Un pipeline dure 45 minutes, dont 20 de restauration de dépendances et 15 de tests séquentiels. Quelles optimisations ?","explain":"« Optimize a pipeline for cost, time, performance, and reliability » est au programme. Cache + parallélisme sont les deux leviers principaux.","choix":["Mettre en cache les dépendances (Cache@2 clé sur le lock file) et paralléliser les tests (matrix ou job slicing)","Supprimer les tests","Passer sur un agent plus gros uniquement","Réduire la fréquence des builds"],"bonne":0},
  {"id":"az400-s-classic-migrate","lvl":9,"dom":"CI/CD","q":"Comment migrer un pipeline classique (interface graphique) vers YAML avec le moins de risque ?","explain":"« Migrate a pipeline from classic to YAML » est au programme. Exécuter les deux en parallèle valide l'équivalence avant la bascule. Rappel : les task groups n'existent pas en YAML (→ templates).","choix":["Exporter le YAML depuis l'éditeur classique (« View YAML »), créer le pipeline YAML en parallèle sur une branche, comparer les résultats, puis basculer","Tout réécrire de zéro directement sur main","Supprimer le classique puis recréer","Attendre une migration automatique de Microsoft"],"bonne":0},
  {"id":"az400-s-order-deploy","lvl":7,"dom":"CI/CD","q":"L'API dépend d'une migration de base de données qui doit être appliquée AVANT elle, et le front après l'API. Comment garantir l'ordre ?","explain":"« Design a pipeline to ensure that dependency deployments are reliably ordered ». dependsOn crée le graphe : un échec de la migration bloque la suite.","choix":["Des stages distincts chaînés par dependsOn (DB → API → Front), chacun avec ses conditions de réussite","Trois pipelines déclenchés manuellement dans l'ordre","Des sleep entre les tâches","Tout dans un seul job"],"bonne":0},
  {"id":"az400-s-db-deploy","lvl":8,"dom":"CI/CD","q":"Comment déployer un changement de schéma de base sans casser l'application pendant le déploiement progressif ?","explain":"Pendant un canary/rolling, ANCIENNE et NOUVELLE versions coexistent : le schéma doit être compatible avec les deux. C'est le pattern expand/contract.","choix":["Des migrations rétrocompatibles (expand/contract) : ajouter d'abord les colonnes sans supprimer, déployer le code, puis nettoyer dans une release ultérieure","Arrêter l'application pendant la migration","Déployer le schéma après le code","Ne jamais modifier le schéma"],"bonne":0},
  {"id":"az400-s-rollback","lvl":7,"dom":"CI/CD","q":"Quelle stratégie offre le rollback le plus RAPIDE en cas de problème en production ?","explain":"Rebasculer un swap ou couper un flag prend quelques secondes ; un redéploiement complet prend des minutes. D'où feature flags + blue-green pour les systèmes critiques.","choix":["Blue-green (rebasculer le trafic vers l'environnement précédent) ou un feature flag désactivé instantanément","Redéployer la version précédente depuis le pipeline","Restaurer une sauvegarde","Corriger et redéployer (roll forward)"],"bonne":0},
  {"id":"az400-s-progressive","lvl":8,"dom":"CI/CD","q":"L'équipe veut valider une refonte majeure sur 5 % des utilisateurs réels avant de généraliser, avec possibilité de coupure immédiate. Que combines-tu ?","explain":"Le flag avec filtre percentage cible les UTILISATEURS (pas les serveurs) et se coupe sans redéploiement. Le monitoring est indispensable pour décider d'étendre.","choix":["Feature flags (App Configuration Feature Manager) avec filtre de pourcentage + surveillance des métriques applicatives","Un déploiement blue-green seul","Un canary sans instrumentation","Des tests de charge en préproduction"],"bonne":0},
  {"id":"az400-s-approvals-audit","lvl":9,"dom":"Sécurité","q":"Un audit exige la preuve que chaque mise en production a été approuvée par une personne différente du développeur. Comment l'implémenter ?","explain":"Séparation des tâches native + piste d'audit intégrée (qui a approuvé, quand, quel artefact). Bien plus solide qu'un processus manuel externe.","choix":["Des approbations sur l'environment de production, avec l'option interdisant au demandeur d'approuver son propre run — l'historique fait foi","Un e-mail de validation archivé","Une signature dans le commit","Une revue de code suffit"],"bonne":0},
  {"id":"az400-s-secret-strategy","lvl":8,"dom":"Sécurité","q":"Un pipeline a besoin d'une chaîne de connexion et d'un certificat pour déployer. Quelle conception ?","explain":"Chaque type de sensible a son mécanisme : Key Vault (secrets), secure files (fichiers), fédération OIDC (authentification sans secret).","choix":["Secrets dans Key Vault (variable group lié) + certificat en secure file, accès via une service connection en workload identity federation","Variables secrètes du pipeline copiées à la main","Fichiers chiffrés committés dans le dépôt","Un PAT partagé par l'équipe"],"bonne":0},
  {"id":"az400-s-leak-prevent","lvl":9,"dom":"Sécurité","q":"Comment concevoir un pipeline pour éviter la fuite d'informations sensibles dans les logs ?","explain":"« Design pipelines to prevent leakage of sensitive information ». Les secrets sont masqués automatiquement, mais un script qui les transforme (base64) peut les révéler.","choix":["Utiliser des variables secrètes (masquées), ne pas activer le debug verbeux en prod, éviter d'echo les valeurs, et activer le secret scanning avec push protection","Supprimer les logs après chaque run","Restreindre l'accès aux logs uniquement","Chiffrer les logs"],"bonne":0},
  {"id":"az400-s-scan-strategy","lvl":8,"dom":"Sécurité","q":"Comment concevoir une stratégie de scan complète dans la CI ?","explain":"Les 4 axes du référentiel : dependency, code, secret et licensing scanning — plus le scan des images de conteneurs, explicitement cité.","choix":["Combiner secret scanning (push protection), SAST sur le code (CodeQL), SCA sur les dépendances et licences (Dependabot), et scan des images de conteneurs","Un scan antivirus des artefacts","Un pentest annuel","Le scan SAST uniquement"],"bonne":0},
  {"id":"az400-s-license","lvl":9,"dom":"Sécurité","q":"L'entreprise interdit les dépendances sous licence GPL dans ses produits propriétaires. Comment l'appliquer automatiquement ?","explain":"Le licensing scanning est explicitement au programme. Le contrôle doit se faire à la PR (shift left), pas à la livraison.","choix":["Un scan de licences dans la CI (dependency review GitHub, Mend/Snyk) qui échoue le build ou bloque la PR en cas de licence interdite","Une revue juridique manuelle par release","Une mention dans le README","Interdire l'open source"],"bonne":0},
  {"id":"az400-s-container-scan","lvl":7,"dom":"Sécurité","q":"Quand faut-il scanner une image de conteneur ?","explain":"Une image « propre » aujourd'hui ne l'est plus demain : une CVE peut être publiée après le build. D'où le scan continu du registre (Defender for Containers).","choix":["Au build (dans la CI) ET en continu dans le registre, car de nouvelles CVE apparaissent après la publication","Uniquement au build","Uniquement au déploiement","Une fois par trimestre"],"bonne":0},
  {"id":"az400-s-ghas-azdo","lvl":8,"dom":"CI/CD","q":"Une entreprise utilise Azure Repos (pas GitHub) mais veut CodeQL et le secret scanning. Est-ce possible ?","explain":"GHAS for Azure DevOps est explicitement cité au programme, à côté de GHAS for GitHub. Piège classique : croire que GHAS est réservé à GitHub.","choix":["Oui — GitHub Advanced Security for Azure DevOps apporte code scanning, secret scanning et dependency scanning dans Azure Repos","Non, il faut migrer vers GitHub","Seulement le secret scanning","Uniquement avec un outil tiers"],"bonne":0},
  {"id":"az400-s-iac-choice","lvl":7,"dom":"Terraform","q":"Quelle différence essentielle entre provisionnement (ARM/Bicep/Terraform) et gestion de configuration (DSC/Ansible) ?","explain":"« Recommend a configuration management technology for application infrastructure » : savoir choisir la bonne catégorie d'outil selon le besoin.","choix":["Le provisionnement crée l'infrastructure (VM, réseau, PaaS) ; la gestion de configuration règle ce qui tourne DANS les machines et maintient leur état","Ce sont des synonymes","Le provisionnement concerne le cloud, la configuration l'on-premises","La configuration précède toujours le provisionnement"],"bonne":0},
  {"id":"az400-s-iac-test","lvl":8,"dom":"Terraform","q":"Comment tester l'infrastructure as code avant de l'appliquer en production ?","explain":"« Define an IaC strategy, including source control and automation of testing and deployment ». az deployment group what-if est l'équivalent Azure du terraform plan.","choix":["Validation/linting, what-if (ARM/Bicep) ou plan (Terraform), déploiement dans un environnement éphémère, puis tests d'intégration","Appliquer directement en prod et surveiller","Relire le code uniquement","Tester après le déploiement"],"bonne":0},
  {"id":"az400-s-package-strategy","lvl":7,"dom":"CI/CD","q":"Plusieurs équipes dupliquent la même bibliothèque interne par copier-coller. Que recommandes-tu ?","explain":"Le package versionné découple les cycles de vie : chaque équipe monte de version quand elle le décide, et un correctif se diffuse par une nouvelle version.","choix":["La publier comme package versionné (Azure Artifacts ou GitHub Packages) avec SemVer, consommé via un feed","Un submodule Git dans chaque dépôt","Un dossier partagé réseau","Un monorepo obligatoire"],"bonne":0},
  {"id":"az400-s-breaking-pkg","lvl":8,"dom":"CI/CD","q":"Une bibliothèque interne doit introduire un changement incompatible. Comment gérer la transition ?","explain":"SemVer est un contrat : MAJOR signale la rupture, et les consommateurs migrent à leur rythme grâce à la coexistence des versions.","choix":["Publier une nouvelle version MAJEURE (SemVer), maintenir temporairement la précédente, et communiquer un chemin de migration","Modifier la version existante","Forcer toutes les équipes à migrer le jour même","Créer un nouveau feed"],"bonne":0},
  {"id":"az400-s-gate-monitor","lvl":9,"dom":"CI/CD","q":"Le déploiement en production ne doit pas partir s'il existe une alerte Azure Monitor active sur le service. Comment l'automatiser ?","explain":"Les gates automatiques interrogent l'état réel du système avant de laisser passer, et peuvent être réévaluées périodiquement pendant une fenêtre d'attente.","choix":["Un check/gate « Query Azure Monitor alerts » sur l'environment de production","Vérifier manuellement avant chaque release","Un script qui lit les e-mails d'alerte","Bloquer le pipeline la nuit"],"bonne":0},
  {"id":"az400-s-gate-workitem","lvl":7,"dom":"CI/CD","q":"Une release ne doit pas partir s'il reste des bugs bloquants ouverts sur l'itération. Quelle gate ?","explain":"La gate transforme une règle de gouvernance en contrôle automatique et traçable, sans dépendre de la vigilance humaine.","choix":["« Query work items » avec une requête filtrant les bugs bloquants : la gate échoue si le résultat n'est pas vide","Une approbation manuelle","Un test unitaire","Une branch policy"],"bonne":0},
  {"id":"az400-s-canary-monitor","lvl":8,"dom":"CI/CD","q":"Dans un déploiement canary, comment décider automatiquement d'étendre ou de faire marche arrière ?","explain":"Le canary sans instrumentation n'a aucun intérêt : c'est le hook postRouteTraffic + les métriques qui rendent la décision automatique et rapide.","choix":["Comparer les métriques (taux d'erreur, latence) du canary à la référence pendant postRouteTraffic, avec une gate qui déclenche le rollback via on: failure","Attendre les retours utilisateurs","Décider après 24 h","Étendre systématiquement"],"bonne":0},
  {"id":"az400-s-flaky-strategy","lvl":9,"dom":"CI/CD","q":"20 % des builds échouent à cause de tests instables, et l'équipe a pris l'habitude de relancer sans regarder. Que fais-tu ?","explain":"La normalisation du « relance et ça passe » détruit la valeur de la CI : on finit par ignorer de vrais échecs. Isoler puis corriger, sans supprimer la couverture.","choix":["Activer la détection de flaky tests pour les isoler, créer des work items pour les corriger, et interdire le simple « re-run » comme solution","Désactiver tous les tests instables définitivement","Augmenter le nombre de tentatives automatiques","Ignorer les échecs de tests"],"bonne":0},
  {"id":"az400-s-test-pyramid","lvl":7,"dom":"CI/CD","q":"Comment répartir les tests dans une stratégie équilibrée ?","explain":"Les tests E2E sont lents et fragiles (source principale de flakiness). La pyramide maximise la couverture rapide en CI et réserve l'E2E aux parcours critiques.","choix":["Beaucoup de tests unitaires rapides, moins de tests d'intégration, très peu de tests end-to-end lents (pyramide des tests)","Uniquement des tests end-to-end réalistes","Autant de chaque type","Uniquement des tests manuels"],"bonne":0},
  {"id":"az400-s-shared-runner-sec","lvl":8,"dom":"CI/CD","q":"Quel est le principal risque de sécurité d'un agent self-hosted partagé entre projets ?","explain":"Contrairement aux agents hosted (machine neuve à chaque job), le self-hosted garde son état. D'où : pools séparés par niveau de confiance, jamais de dépôt public sur un pool de prod.","choix":["La persistance entre jobs : un pipeline malveillant peut laisser des fichiers ou récupérer les secrets d'un autre projet","Une consommation CPU excessive","Une version d'outil obsolète","Un coût plus élevé"],"bonne":0},
  {"id":"az400-s-slo-alerting","lvl":9,"dom":"SRE","q":"L'équipe est submergée d'alertes dont la plupart n'exigent aucune action. Que fais-tu ?","explain":"La fatigue d'alerte fait rater les vrais incidents. Règle SRE : une alerte qui réveille quelqu'un doit être urgente, actionnable et liée à l'impact utilisateur.","choix":["Alerter sur les symptômes visibles par l'utilisateur (violation de SLO/budget d'erreur), supprimer les alertes non actionnables et regrouper le reste en tableaux de bord","Augmenter tous les seuils","Désactiver les alertes la nuit","Ajouter des destinataires"],"bonne":0},
  {"id":"az400-s-dashboard-dora","lvl":7,"dom":"CI/CD","q":"La direction veut mesurer objectivement la performance de la livraison logicielle. Quel tableau de bord construis-tu ?","explain":"Les métriques d'activité individuelle (lignes, commits) sont contre-productives. DORA mesure le SYSTÈME de livraison et équilibre vitesse et stabilité.","choix":["Les 4 métriques DORA : fréquence de déploiement, lead time for changes, change failure rate et time to restore","Le nombre de lignes de code et de commits par développeur","La vélocité de chaque équipe","Le nombre d'heures travaillées"],"bonne":0},
  {"id":"az400-s-incident-flow","lvl":8,"dom":"SRE","q":"Comment garantir qu'un incident de production alimente réellement l'amélioration continue ?","explain":"Une analyse dont les actions ne sont pas suivies ne change rien : la traçabilité incident → work item → correctif déployé ferme la boucle de feedback.","choix":["Postmortem sans blâme → actions correctives converties en work items priorisés et suivis dans le backlog","Un rapport archivé","Une réunion de crise","Sanctionner l'auteur de l'erreur"],"bonne":0},
  {"id":"az400-s-teams-notif","lvl":9,"dom":"CI/CD","q":"Trop de notifications noient l'équipe : personne ne réagit plus aux échecs de build sur main. Que fais-tu ?","explain":"Même logique que la fatigue d'alerte : trop de signaux tue le signal. Un canal dédié aux événements actionnables restaure la réactivité.","choix":["Cibler les notifications : seuls les échecs sur les branches protégées et les déploiements de prod vont dans un canal dédié, le reste est filtré","Envoyer tout à tout le monde","Supprimer toutes les notifications","Créer un canal par pipeline"],"bonne":0},
  {"id":"az400-s-github-azdo","lvl":7,"dom":"CI/CD","q":"L'entreprise garde le code sur GitHub mais veut piloter le travail dans Azure Boards, avec traçabilité complète.","explain":"« Design and implement integration between GitHub repositories and Azure Pipelines » et l'intégration Boards ↔ GitHub sont toutes deux au programme.","choix":["Connecter Azure Boards au dépôt GitHub (Azure Boards app) et référencer AB#<id> dans les commits et PR","Migrer tout le code vers Azure Repos","Copier manuellement les liens","Utiliser uniquement GitHub Issues"],"bonne":0},
  {"id":"az400-s-selfservice-doc","lvl":8,"dom":"CI/CD","q":"La documentation d'architecture est systématiquement obsolète. Quelle approche ?","explain":"La doc suit le code dans la même PR : elle ne peut plus diverger sans être vue en revue. Mermaid et le wiki publié depuis le code sont explicitement au programme.","choix":["« Docs as code » : Markdown et diagrammes Mermaid dans le dépôt, revus dans la même PR que le code, publiés en wiki","Un document Word partagé","Une réunion mensuelle de mise à jour","Un wiki libre non versionné"],"bonne":0},
  {"id":"az400-s-migration-plan","lvl":9,"dom":"CI/CD","q":"Une équipe déploie manuellement une fois par trimestre. Par où commencer la transformation DevOps ?","explain":"Sans CI fiable, automatiser le déploiement ne fait qu'accélérer la livraison de défauts. On mesure, on sécurise la CI, puis on ouvre le robinet de la CD.","choix":["Mesurer l'existant (DORA), puis automatiser d'abord le build et les tests (CI) avant d'automatiser le déploiement","Automatiser d'abord le déploiement en production","Réorganiser les équipes","Acheter tous les outils DevOps"],"bonne":0},
  {"id":"az400-s-shared-pipeline","lvl":7,"dom":"CI/CD","q":"15 microservices ont des pipelines quasi identiques, copiés-collés. Un changement de règle impose 15 modifications. Que fais-tu ?","explain":"« Create reusable pipeline elements, including YAML templates » : le template dans un dépôt dédié, référencé en resource, se met à jour en un seul endroit.","choix":["Extraire un template YAML centralisé (dépôt dédié) que chaque pipeline étend avec ses paramètres","Un pipeline unique pour les 15 services","Un script partagé appelé par chaque pipeline","Documenter la procédure de mise à jour"],"bonne":0},
  {"id":"az400-s-multi-repo-tmpl","lvl":8,"dom":"CI/CD","q":"Comment référencer un template YAML hébergé dans un AUTRE dépôt ?","explain":"resources: repositories: - repository: templates, type: git, name: Projet/DepotTemplates, ref: refs/tags/v1 — épingler un tag garantit la stabilité.","choix":["Déclarer une resource « repositories » puis « extends: template: chemin.yml@nomResource »","Copier le fichier dans chaque dépôt","Une URL HTTP dans extends","C'est impossible"],"bonne":0},
  {"id":"az400-s-retention-audit","lvl":9,"dom":"Sécurité","q":"La conformité impose de conserver 7 ans la preuve de ce qui a été déployé en production, mais le stockage coûte cher.","explain":"On distingue les runs de CI (jetables) des releases de production (preuves d'audit). Les politiques de rétention permettent exactement cette granularité.","choix":["Rétention courte par défaut + rétention/épinglage spécifique des runs de production, et archivage des artefacts de release dans un stockage froid","Tout conserver indéfiniment","Ne rien conserver","Des captures d'écran archivées"],"bonne":0},
  {"id":"az400-c-yaml-condition-branch","lvl":8,"dom":"CI/CD","q":"Complète pour ne déployer que depuis la branche main :","explain":"Build.SourceBranch contient la référence COMPLÈTE (refs/heads/main). Pour le nom court, utiliser Build.SourceBranchName — confusion classique.","choix":["refs/heads/main","main","origin/main","$(main)"],"bonne":0},
  {"id":"az400-c-gha-permissions","lvl":8,"dom":"CI/CD","q":"Quel principe de sécurité applique-t-on en restreignant ainsi les permissions ?","explain":"Par défaut le GITHUB_TOKEN peut être trop permissif : déclarer explicitement les permissions minimales limite les dégâts d'une action compromise.","choix":["Le moindre privilège","La défense en profondeur","La séparation des tâches","Le zero trust"],"bonne":0},
  {"id":"az400-csA-branch","lvl":7,"dom":"CI/CD","q":"Quelle stratégie de branches recommandes-tu à Northwind pour réduire les conflits et accélérer la livraison ?","explain":"Les conflits viennent des branches longues. Trunk-based + flags permet d'intégrer en continu du code même inachevé, sans bloquer la livraison.","choix":["Trunk-based avec des branches de feature très courtes, branch policies sur main (build de validation + 2 reviewers) et feature flags","GitFlow complet avec develop, release et hotfix","Une branche par environnement","Une branche permanente par équipe"],"bonne":0},
  {"id":"az400-csA-ci","lvl":8,"dom":"CI/CD","q":"Le build manuel de 2 h doit devenir une CI fiable. Quelle première étape apporte le plus de valeur ?","explain":"On sécurise l'entrée du code avant d'accélérer la sortie. La build validation policy garantit que main reste toujours déployable.","choix":["Un pipeline YAML déclenché sur PR : build + tests + publication d'artefact, rendu obligatoire par une policy de build validation","Automatiser d'abord le déploiement en production","Migrer vers GitHub","Acheter 10 jobs parallèles"],"bonne":0},
  {"id":"az400-csA-artifact","lvl":9,"dom":"CI/CD","q":"Chaque environnement rebuild actuellement depuis les sources. Quel principe appliques-tu ?","explain":"Rebuilder par environnement rompt la garantie de test : le binaire validé en staging n'est pas celui déployé en prod.","choix":["Build once, deploy many : un artefact unique produit en CI, promu de dev à prod, la configuration étant injectée au déploiement","Rebuilder garantit la fraîcheur du code","Un pipeline par environnement","Compiler directement sur le serveur cible"],"bonne":0},
  {"id":"az400-csB-approval","lvl":8,"dom":"CI/CD","q":"Comment satisfaire l'exigence de séparation des tâches sur les déploiements de production ?","explain":"L'auditeur veut une preuve horodatée et infalsifiable : l'historique d'approbation de l'environment la fournit nativement.","choix":["Approbations sur l'environment production, avec interdiction pour le demandeur d'approuver son propre run, et l'historique comme piste d'audit","Une revue de code par un pair suffit","Un e-mail de validation du responsable","Restreindre le droit de push sur main"],"bonne":0},
  {"id":"az400-csB-scan","lvl":9,"dom":"CI/CD","q":"Fabrikam doit prouver qu'aucune dépendance vulnérable ou sous licence interdite n'atteint la production. Que mets-tu en place ?","explain":"Le required template rend les scans impossibles à contourner, et leurs résultats horodatés constituent la preuve de conformité continue.","choix":["Scans obligatoires dans un template imposé (extends) : SCA, licences, SAST et secrets, avec résultats bloquants et archivés","Un audit de sécurité annuel","Un scan manuel avant chaque release","Une clause contractuelle avec les fournisseurs"],"bonne":0},
  {"id":"az400-csB-audit","lvl":8,"dom":"CI/CD","q":"L'auditeur demande, pour une release donnée, quel code exact est parti en production et qui l'a validé. Comment y répondre ?","explain":"C'est exactement l'objectif de « source, bug, and quality traceability » couplé à une politique de rétention adaptée aux exigences d'audit.","choix":["La traçabilité de bout en bout : work items → commits → build → artefact → release approuvée, avec rétention prolongée des runs de production","Consulter les logs du serveur web","Demander à l'équipe de développement","Comparer les fichiers déployés"],"bonne":0},
  {"id":"az400-csC-runner","lvl":9,"dom":"CI/CD","q":"Contoso doit déployer vers un cluster AKS privé, non joignable depuis Internet. Quelle infrastructure d'exécution ?","explain":"L'accès réseau privé impose le self-hosted. Le scale set d'agents apporte l'élasticité et le renouvellement automatique des machines.","choix":["Des agents self-hosted (idéalement un VM scale set d'agents) déployés dans le VNet ayant accès au cluster","Des agents Microsoft-hosted avec une plage d'IP autorisée","Exposer l'API du cluster publiquement","Un déploiement manuel depuis un poste"],"bonne":0},
  {"id":"az400-csC-monorepo","lvl":7,"dom":"CI/CD","q":"Le monorepo de 30 microservices rebuild tout à chaque commit (45 min). Que fais-tu ?","explain":"Les path filters règlent la cause (on build ce qui n'a pas changé). Éclater le monorepo est une décision structurelle bien plus lourde.","choix":["Des path filters par service pour ne builder que ce qui change, plus du cache et de la parallélisation","Découper en 30 dépôts immédiatement","Builder uniquement la nuit","Supprimer les tests d'intégration"],"bonne":0},
  {"id":"az400-csC-progressive","lvl":8,"dom":"CI/CD","q":"Contoso veut livrer plusieurs fois par jour sans risquer d'impacter tous ses clients. Quelle combinaison ?","explain":"Séparer le déploiement (canary) de l'activation (flags) donne deux niveaux de maîtrise du risque, et un kill switch en secondes.","choix":["Déploiement canary/anneaux piloté par les métriques + feature flags pour activer progressivement et couper instantanément","Déployer tout le monde en une fois avec un plan de rollback","Livrer une fois par semaine en soirée","Doubler les tests de préproduction"],"bonne":0},
  {"id":"az400-csC-observe","lvl":9,"dom":"CI/CD","q":"Une requête lente traverse 6 microservices : comment identifier le maillon responsable ?","explain":"Le traçage distribué est explicitement au programme. Sans corrélation, diagnostiquer 6 services revient à chercher une aiguille dans une botte de foin.","choix":["Le traçage distribué d'Application Insights : corrélation par operation_Id, Application Map et vue end-to-end transaction","Lire les logs de chaque service séparément","Ajouter des compteurs CPU","Interroger les utilisateurs"],"bonne":0},
  {"id":"az900-cl-def","lvl":2,"dom":"Azure","q":"Qu'est-ce que le cloud computing ?","explain":"Deux idées clés : les ressources sont fournies à la demande via Internet, et tu paies ce que tu consommes au lieu d'investir dans du matériel.","choix":["La fourniture de services informatiques (serveurs, stockage, bases, réseau…) via Internet, avec paiement à l'usage","L'achat de serveurs pour son propre datacenter","Un logiciel installé sur ton PC","Un réseau privé d'entreprise"],"bonne":0},
  {"id":"az900-cl-public","lvl":1,"dom":"Azure","q":"Qu'est-ce qu'un cloud public ?","explain":"« Public » signifie que l'infrastructure est partagée entre de nombreux clients — pas que tes données sont publiques : elles restent isolées et privées.","choix":["Des ressources détenues par un fournisseur (Microsoft, AWS…), mutualisées entre clients et accessibles via Internet","Un cloud accessible sans mot de passe","Un cloud réservé aux administrations publiques","Un cloud gratuit"],"bonne":0},
  {"id":"az900-cl-consumption","lvl":3,"dom":"Azure","q":"Que signifie le « modèle basé sur la consommation » ?","explain":"Pay-as-you-go : aucune avance, facturation à l'usage réel. C'est ce qui rend le cloud accessible à une startup comme à un grand groupe.","choix":["Tu paies uniquement les ressources que tu utilises réellement, sans coût initial — et tu arrêtes de payer quand tu arrêtes d'utiliser","Un forfait mensuel fixe","Un paiement unique à l'installation","Une facturation à l'utilisateur"],"bonne":0},
  {"id":"az900-cl-scalability","lvl":2,"dom":"Azure","q":"Qu'est-ce que la scalabilité (mise à l'échelle) ?","explain":"Scale out/in = ajouter/retirer des instances (horizontal). Scale up/down = augmenter/réduire la puissance d'une instance (vertical).","choix":["La capacité à ajuster les ressources à la demande — en ajoutant des instances (horizontal) ou en les agrandissant (vertical)","La capacité à chiffrer les données","La vitesse du réseau","La taille maximale d'un disque"],"bonne":0},
  {"id":"az900-cl-vertical","lvl":5,"dom":"Azure","q":"Quelle est la différence entre la mise à l'échelle verticale et horizontale ?","explain":"Scale up (vertical) a une limite physique et impose souvent un redémarrage ; scale out (horizontal) est le modèle cloud par excellence — quasi illimité.","choix":["Verticale = augmenter la puissance d'UNE instance (CPU/RAM) ; horizontale = ajouter DES instances supplémentaires","Verticale = ajouter des instances ; horizontale = agrandir l'instance","Ce sont deux synonymes","Verticale concerne le stockage, horizontale le calcul"],"bonne":0},
  {"id":"az900-cl-agility","lvl":1,"dom":"Azure","q":"Que désigne l'« agilité » comme bénéfice du cloud ?","explain":"Provisionner un serveur = quelques clics et 2 minutes, contre des semaines en datacenter classique. C'est ce qui permet de tester des idées vite et à peu de frais.","choix":["Déployer et adapter des ressources en quelques minutes, au lieu de semaines d'achat et d'installation de matériel","La vitesse du processeur","La flexibilité des contrats","La possibilité de changer de fournisseur"],"bonne":0},
  {"id":"az900-cl-reliability","lvl":6,"dom":"Azure","q":"Qu'est-ce que la fiabilité (reliability) d'un système cloud ?","explain":"Aucun système n'est infaillible : la fiabilité, c'est concevoir pour que les pannes ne soient pas fatales. Le cloud aide par sa redondance native multi-zones et multi-régions.","choix":["Sa capacité à RÉCUPÉRER après une panne et à continuer de fonctionner — grâce à la redondance et à la décentralisation","L'absence totale de pannes, garantie par contrat","La précision des factures","La vitesse de calcul"],"bonne":0},
  {"id":"az900-cl-predictability","lvl":4,"dom":"Azure","q":"Que recouvre la « prévisibilité » comme bénéfice du cloud ?","explain":"Prévisibilité des coûts (Cost Management, calculatrices) et des performances (les ressources s'ajustent à la charge). Les deux rassurent une direction.","choix":["Prévoir les COÛTS (outils d'analyse, budgets) et les PERFORMANCES (autoscaling, load balancing)","Savoir à l'avance quand Azure tombera en panne","Connaître la date des mises à jour","Prédire la demande des clients"],"bonne":0},
  {"id":"az900-cl-scale-econ","lvl":5,"dom":"Azure","q":"Que sont les « économies d'échelle » dont bénéficie le cloud ?","explain":"Microsoft achète des serveurs par millions : le coût unitaire s'effondre. C'est pour ça qu'une VM louée coûte moins cher que le même serveur acheté et exploité soi-même.","choix":["Un fournisseur géant achète et exploite le matériel bien moins cher par unité que n'importe quelle entreprise seule, et répercute ce coût réduit","Une réduction accordée aux grandes entreprises","Des économies sur la climatisation","Un tarif dégressif la nuit"],"bonne":0},
  {"id":"az900-cl-shared-iaas","lvl":6,"dom":"Azure","q":"En IaaS (machine virtuelle), qui est responsable des mises à jour du système d'exploitation ?","explain":"IaaS : Microsoft gère le datacenter, le matériel, le réseau physique. TOI : l'OS, les correctifs, les applications, les données, les accès.","choix":["Le CLIENT — en IaaS, tout ce qui est au-dessus du matériel t'appartient (OS, patchs, applis, données)","Microsoft, comme pour tout le reste","Personne, l'OS se met à jour seul","L'éditeur de l'OS"],"bonne":0},
  {"id":"az900-cl-shared-saas","lvl":4,"dom":"Azure","q":"En SaaS (ex : Microsoft 365), de quoi le client reste-t-il TOUJOURS responsable ?","explain":"Quel que soit le modèle — même en SaaS — les données, les identités et les appareils restent TOUJOURS ta responsabilité. Question quasi garantie à l'examen.","choix":["Ses données, ses comptes et identités, et ses appareils","Plus rien, tout est géré","Le système d'exploitation des serveurs","Le réseau du datacenter"],"bonne":0},
  {"id":"az900-cl-shared-ms","lvl":5,"dom":"Azure","q":"Qu'est-ce qui relève TOUJOURS de Microsoft, quel que soit le modèle de service ?","explain":"Le physique est toujours au fournisseur ; les données/identités/appareils toujours au client ; entre les deux, ça dépend du modèle (IaaS/PaaS/SaaS).","choix":["Le datacenter physique, le réseau physique et les hôtes physiques","Les comptes utilisateurs","Les données du client","Les appareils des employés"],"bonne":0},
  {"id":"az900-cl-paas-ex","lvl":6,"dom":"Azure","q":"Lequel de ces services Azure est un exemple de PaaS ?","explain":"App Service = tu déploies ton code, Azure gère l'OS et le runtime → PaaS. VM = IaaS ; Microsoft 365 = SaaS.","choix":["Azure App Service","Les machines virtuelles Azure","Microsoft 365","ExpressRoute"],"bonne":0},
  {"id":"az900-cl-iaas-ex","lvl":4,"dom":"Azure","q":"Lequel de ces services est un exemple d'IaaS ?","explain":"La VM est l'exemple canonique d'IaaS : tu loues l'infrastructure et tu gères l'OS. Functions = serverless/PaaS ; SQL Database = PaaS.","choix":["Les machines virtuelles Azure","Azure Functions","Microsoft 365","Azure SQL Database"],"bonne":0},
  {"id":"az900-cl-saas-ex","lvl":5,"dom":"Azure","q":"Lequel est un exemple de SaaS ?","explain":"Logiciel fini, utilisable immédiatement dans le navigateur, rien à administrer → SaaS.","choix":["Microsoft 365 (Outlook, Teams, Word en ligne)","Azure App Service","Une machine virtuelle Linux","Azure Kubernetes Service"],"bonne":0},
  {"id":"az900-cl-private-why","lvl":6,"dom":"Azure","q":"Quelle est la principale raison de choisir un cloud PRIVÉ malgré son coût ?","explain":"Le cloud privé se paie cher (matériel, personnel, maintenance) : on le choisit pour le contrôle et la conformité, pas pour l'économie.","choix":["Le contrôle total sur les données et le matériel, souvent exigé par la réglementation ou des besoins de conformité stricts","C'est toujours moins cher","C'est plus rapide à déployer","Il n'y a pas de maintenance"],"bonne":0},
  {"id":"az900-cl-hybrid-why","lvl":8,"dom":"Azure","q":"Une banque doit garder ses données clients dans son datacenter (réglementation) mais veut héberger son site vitrine dans Azure. Quel modèle de déploiement ?","explain":"Données sensibles sur site + services publics dans le cloud, reliés entre eux = la définition même du cloud hybride.","choix":["Le cloud hybride","Le cloud public uniquement","Le cloud privé uniquement","Le multi-cloud"],"bonne":0},
  {"id":"az900-cl-s-lift","lvl":9,"dom":"Azure","q":"Tu migres 20 serveurs existants vers Azure SANS modifier les applications, en gardant le contrôle des OS. Quel modèle de service ?","explain":"Le « lift-and-shift » : on déplace tel quel → IaaS. On garde le contrôle (et la responsabilité) des systèmes d'exploitation.","choix":["IaaS (machines virtuelles)","PaaS","SaaS","Serverless"],"bonne":0},
  {"id":"az900-cl-s-webapp","lvl":7,"dom":"Azure","q":"Ton équipe veut déployer une application web SANS jamais gérer de système d'exploitation ni de serveurs. Quel modèle de service ?","explain":"« Juste déployer le code » = PaaS. Le SaaS ne conviendrait pas : c'est TON application, pas un logiciel prêt à l'emploi.","choix":["PaaS (ex : Azure App Service)","IaaS","SaaS","Cloud privé"],"bonne":0},
  {"id":"az900-cl-s-mail","lvl":8,"dom":"Azure","q":"Une PME veut une messagerie professionnelle sans rien administrer du tout. Quel modèle de service ?","explain":"Zéro administration = SaaS. Monter son propre serveur mail en IaaS serait l'exact opposé du besoin.","choix":["SaaS (ex : Microsoft 365)","IaaS avec un serveur mail","PaaS","Un cloud privé"],"bonne":0},
  {"id":"az900-cl-s-startup","lvl":9,"dom":"Azure","q":"Une startup sans capital veut lancer son produit sans acheter de matériel. Quel avantage du cloud répond EXACTEMENT à ce besoin ?","explain":"Pas de capital → pas de CapEx possible. Le cloud transforme l'investissement en dépense de fonctionnement au fil de l'usage.","choix":["Le modèle OpEx : payer à l'usage, sans investissement initial (CapEx)","La haute disponibilité","Les régions souveraines","Le cloud privé"],"bonne":0},
  {"id":"az900-cl-s-peak","lvl":7,"dom":"Azure","q":"Un site e-commerce subit des pics de trafic imprévisibles pendant les soldes puis retombe. Quel bénéfice du cloud est LE plus pertinent ?","explain":"Pics imprévisibles = élasticité (ajustement AUTOMATIQUE). Dimensionner pour le pic en permanence coûterait une fortune pour rien.","choix":["L'élasticité : les ressources s'ajustent automatiquement à la demande, la facture aussi","La reprise après sinistre","Le cloud privé","Les économies d'échelle"],"bonne":0},
  {"id":"az900-cl-s-region-down","lvl":8,"dom":"Azure","q":"Ton application doit survivre à la panne complète d'une région Azure. Que mets-tu en place ?","explain":"Contre une panne RÉGIONALE, la seule parade est une autre région : déploiement multi-régions + géo-réplication (ex : stockage GRS).","choix":["Un déploiement multi-régions avec réplication géographique des données","Plus de RAM sur les serveurs","Un cloud privé","Un verrou sur les ressources"],"bonne":0},
  {"id":"az900-cl-s-consumption","lvl":9,"dom":"Azure","q":"Un traitement ne tourne que 2 heures par mois. Quel modèle de facturation est le plus économique ?","explain":"2 h/mois = 0,3 % du temps. Toute ressource permanente serait payée à 99,7 % pour rien. Serverless/consommation gagne haut la main.","choix":["Le modèle à la consommation (serverless) : payer uniquement les exécutions","Une VM réservée 3 ans","Un serveur dédié","Un forfait mensuel"],"bonne":0},
  {"id":"az900-cl-multicloud","lvl":4,"dom":"Azure","q":"Qu'est-ce qu'une stratégie « multi-cloud » ?","explain":"Multi-cloud = plusieurs FOURNISSEURS. À ne pas confondre avec hybride (privé + public). Azure Arc sert justement à gérer ces environnements mixtes.","choix":["Utiliser plusieurs fournisseurs de cloud public (ex : Azure ET AWS) pour éviter la dépendance ou combiner leurs forces","Avoir plusieurs abonnements Azure","Combiner cloud public et privé","Utiliser plusieurs régions Azure"],"bonne":0},
  {"id":"az900-ar-paired","lvl":6,"dom":"Azure","q":"Qu'est-ce qu'une paire de régions (region pair) ?","explain":"Ex : France Centre ↔ France Sud. La réplication GRS s'appuie dessus, et Microsoft n'applique jamais une maintenance majeure aux deux en même temps.","choix":["Deux régions de la même zone géographique, distantes d'au moins ~500 km, appairées pour la réplication et jamais mises à jour en même temps","Deux régions au même endroit","Deux datacenters d'une même région","Deux abonnements liés"],"bonne":0},
  {"id":"az900-ar-sovereign","lvl":4,"dom":"Azure","q":"Que sont les régions « souveraines » d'Azure ?","explain":"Isolées physiquement et logiquement du cloud Azure global, avec des opérateurs et des conformités spécifiques.","choix":["Des instances isolées d'Azure pour des besoins spécifiques (Azure Government pour les USA, Azure China opéré par 21Vianet)","Les régions européennes","Des régions réservées aux gouvernements français","Des régions sans datacenter"],"bonne":0},
  {"id":"az900-ar-s-az","lvl":7,"dom":"Azure","q":"Ton application doit survivre à la panne d'un DATACENTER complet, tout en restant dans la même région. Que choisis-tu ?","explain":"Panne de datacenter → zones de disponibilité (même région). Panne de région → multi-régions/paires. Bien distinguer les deux périmètres.","choix":["Déployer sur plusieurs zones de disponibilité","Déployer sur plusieurs régions","Un plus gros serveur","Un resource group par datacenter"],"bonne":0},
  {"id":"az900-ar-rg-rules","lvl":6,"dom":"Azure","q":"Laquelle de ces affirmations sur les groupes de ressources est VRAIE ?","explain":"1 ressource = 1 groupe, pas d'imbrication. On peut en revanche déplacer une ressource d'un groupe à un autre.","choix":["Une ressource appartient à UN seul groupe à la fois, et les groupes ne peuvent pas être imbriqués","Une ressource peut être dans plusieurs groupes","On peut imbriquer des groupes dans des groupes","Un groupe est limité à 10 ressources"],"bonne":0},
  {"id":"az900-ar-rg-region","lvl":4,"dom":"Azure","q":"Un groupe de ressources créé en « France Centre » peut-il contenir une VM déployée en « West Europe » ?","explain":"Piège classique : la région du resource group n'impose RIEN aux ressources qu'il contient.","choix":["Oui — la localisation du groupe ne stocke que ses métadonnées, les ressources peuvent être dans d'autres régions","Non, jamais","Oui, mais seulement des ressources de stockage","Uniquement avec une autorisation Microsoft"],"bonne":0},
  {"id":"az900-ar-s-subs","lvl":8,"dom":"Azure","q":"Une entreprise veut des factures séparées pour le département Marketing et le département IT. Quelle structure ?","explain":"La frontière de FACTURATION est l'abonnement. Les tags permettent de ventiler les coûts au sein d'un abonnement, mais pour des factures séparées → abonnements distincts.","choix":["Un abonnement par département","Un groupe de ressources par département","Un tag par département","Deux comptes Microsoft"],"bonne":0},
  {"id":"az900-ar-availset","lvl":6,"dom":"Azure","q":"À quoi sert un « availability set » pour des VM ?","explain":"L'availability set protège d'une panne de rack et des redémarrages de maintenance simultanés. Pour une panne de datacenter entier → zones de disponibilité.","choix":["Répartir les VM sur des racks (fault domains) et des groupes de maintenance (update domains) différents, dans UN datacenter","Répliquer les VM entre régions","Sauvegarder les VM chaque nuit","Chiffrer les disques"],"bonne":0},
  {"id":"az900-ar-avd","lvl":5,"dom":"Azure","q":"Qu'est-ce qu'Azure Virtual Desktop ?","explain":"AVD fournit des postes de travail Windows virtualisés — le télétravail sécurisé sans distribuer de machines physiques.","choix":["Un service de bureaux et d'applications Windows accessibles à distance depuis le cloud, sur n'importe quel appareil","Un logiciel de visioconférence","Une VM Linux","Un émulateur de téléphone"],"bonne":0},
  {"id":"az900-ar-container-vs-vm","lvl":6,"dom":"Azure","q":"Quel est l'avantage principal d'un conteneur par rapport à une machine virtuelle ?","explain":"VM = OS complet par instance (lourdes, minutes). Conteneur = partage du noyau de l'hôte (légers, secondes, densité supérieure).","choix":["Il est plus léger et démarre en secondes, car il partage l'OS de l'hôte au lieu d'en embarquer un complet","Il est plus sécurisé dans tous les cas","Il ne tombe jamais en panne","Il est toujours gratuit"],"bonne":0},
  {"id":"az900-ar-s-event","lvl":9,"dom":"Azure","q":"Tu dois exécuter un petit traitement à chaque fois qu'un fichier est déposé, sans payer quand il ne se passe rien. Quel service ?","explain":"Événementiel + facturation à l'exécution + zéro serveur = Functions. Une VM permanente serait payée à 99 % pour attendre.","choix":["Azure Functions","Une machine virtuelle allumée en permanence","AKS","Azure Virtual Desktop"],"bonne":0},
  {"id":"az900-ar-s-aks","lvl":7,"dom":"Azure","q":"Ton entreprise déploie 40 microservices conteneurisés qu'il faut orchestrer, mettre à l'échelle et mettre à jour. Quel service ?","explain":"Beaucoup de conteneurs + orchestration = AKS. ACI est parfait pour UN conteneur ponctuel, pas pour une flotte.","choix":["Azure Kubernetes Service (AKS)","Azure Container Instances","App Service","Une grosse VM"],"bonne":0},
  {"id":"az900-ar-vpngw","lvl":5,"dom":"Réseau","q":"Qu'est-ce qu'une passerelle VPN (VPN Gateway) ?","explain":"Le VPN chiffre le trafic mais passe par Internet (latence variable). Pour une liaison privée garantie sans Internet → ExpressRoute.","choix":["Un tunnel CHIFFRÉ entre ton réseau sur site et un VNet Azure, qui transite par Internet public","Une connexion physique privée vers Azure","Un pare-feu","Un équilibreur de charge"],"bonne":0},
  {"id":"az900-ar-er-fact","lvl":6,"dom":"Réseau","q":"Quelle est LA différence fondamentale entre un VPN site-à-site et ExpressRoute ?","explain":"Question d'examen très fréquente. Les mots-clés « sans transiter par Internet public » = ExpressRoute.","choix":["Le VPN passe par Internet public (chiffré) ; ExpressRoute est une liaison privée dédiée qui n'emprunte pas Internet","ExpressRoute est gratuit","Le VPN est plus rapide","ExpressRoute ne fonctionne qu'en France"],"bonne":0},
  {"id":"az900-ar-dns","lvl":4,"dom":"Réseau","q":"À quoi sert Azure DNS ?","explain":"Azure DNS héberge et sert tes enregistrements DNS. (App Service Domains permet l'achat, mais l'hébergement de zones est le rôle d'Azure DNS.)","choix":["Héberger tes zones DNS et résoudre tes noms de domaine avec l'infrastructure mondiale d'Azure","Attribuer des adresses IP aux VM","Bloquer les sites malveillants","Acheter des noms de domaine uniquement"],"bonne":0},
  {"id":"az900-ar-fw","lvl":5,"dom":"Réseau","q":"Quelle est la différence entre un NSG et Azure Firewall ?","explain":"NSG = filtre local basique et gratuit. Azure Firewall = pare-feu d'entreprise centralisé (filtrage par nom de domaine, inspection, journalisation).","choix":["Le NSG filtre par règles simples au niveau subnet/carte réseau ; Azure Firewall est un service managé CENTRALISÉ, intelligent et payant, pour tout le réseau","Ce sont deux noms du même service","Le NSG est payant, le Firewall gratuit","Azure Firewall ne filtre que le trafic entrant"],"bonne":0},
  {"id":"az900-ar-ddos","lvl":6,"dom":"Réseau","q":"Contre quel type d'attaque Azure DDoS Protection protège-t-il ?","explain":"DDoS = submerger de requêtes. Une protection de base est incluse gratuitement pour tout Azure ; le tier payant ajoute des protections adaptées à TES applications.","choix":["Les attaques par déni de service distribué, qui saturent un service de trafic pour le rendre indisponible","Le vol de mots de passe","Les virus dans les VM","Le phishing"],"bonne":0},
  {"id":"az900-ar-endpoint","lvl":4,"dom":"Réseau","q":"Qu'apporte un « private endpoint » à un service PaaS comme un compte de stockage ?","explain":"Le private endpoint sort le service PaaS d'Internet et le fait apparaître DANS ton réseau privé — exigence de sécurité courante en entreprise.","choix":["Une adresse IP PRIVÉE dans ton VNet : le service n'est plus accessible que par ton réseau, plus du tout par Internet","Une adresse IP publique supplémentaire","Un cache plus rapide","Un certificat TLS gratuit"],"bonne":0},
  {"id":"az900-ar-s-vpn-er","lvl":8,"dom":"Réseau","q":"Un hôpital exige que les données médicales échangées avec Azure ne transitent JAMAIS par Internet public. Quelle connexion ?","explain":"« Jamais par Internet public » = ExpressRoute, mot pour mot. Le VPN chiffre mais emprunte Internet.","choix":["ExpressRoute","Un VPN site-à-site","Le peering de VNets","Une IP publique dédiée"],"bonne":0},
  {"id":"az900-ar-s-p2s","lvl":9,"dom":"Réseau","q":"Un développeur en télétravail doit se connecter de façon sécurisée au VNet de l'entreprise depuis son portable. Quelle solution ?","explain":"Point-à-site = UN appareil vers le VNet. Site-à-site = un RÉSEAU entier (bureau) vers le VNet. ExpressRoute chez un particulier n'a pas de sens.","choix":["Un VPN point-à-site (P2S)","ExpressRoute chez lui","Un VPN site-à-site","Un peering"],"bonne":0},
  {"id":"az900-ar-s-nsg","lvl":7,"dom":"Réseau","q":"Tu dois bloquer l'accès RDP (port 3389) à tes VM depuis Internet, au moindre coût. Quelle solution ?","explain":"Un simple NSG (gratuit) suffit pour bloquer un port. Azure Firewall serait surdimensionné pour ce seul besoin.","choix":["Une règle de refus dans le NSG du sous-réseau","Acheter Azure Firewall","Supprimer les IP publiques et ne plus travailler","Un private endpoint"],"bonne":0},
  {"id":"az900-ar-storacct","lvl":1,"dom":"Azure","q":"Qu'est-ce qu'un compte de stockage Azure ?","explain":"Le compte de stockage regroupe les services de données. Son nom doit être unique mondialement car il fait partie de l'URL d'accès.","choix":["Le conteneur de base des services de stockage (blobs, fichiers, files, tables), avec un nom unique au monde","Un compte bancaire pour payer Azure","Un disque dur physique","Un abonnement"],"bonne":0},
  {"id":"az900-ar-disks","lvl":5,"dom":"Azure","q":"À quoi servent les disques managés (managed disks) ?","explain":"Chaque VM a un disque OS et éventuellement des disques de données — ce sont des managed disks.","choix":["Ce sont les disques virtuels des machines virtuelles, gérés par Azure (réplication et fiabilité incluses)","À stocker des sites web statiques","À échanger des messages","À héberger des bases NoSQL"],"bonne":0},
  {"id":"az900-ar-queues-tables","lvl":6,"dom":"Azure","q":"Quelle est la différence entre le stockage File d'attente (Queue) et Table ?","explain":"Queue Storage découple les composants (messages) ; Table Storage stocke des données NoSQL simples et massives à faible coût.","choix":["Queue = messages échangés entre composants d'application ; Table = données NoSQL clé/valeur semi-structurées","Queue = fichiers, Table = images","Ce sont deux noms du même service","Queue = SQL, Table = fichiers"],"bonne":0},
  {"id":"az900-ar-tiers","lvl":4,"dom":"Azure","q":"Quels sont les niveaux d'accès (tiers) du stockage Blob, du plus cher en stockage au moins cher ?","explain":"Hot = accès fréquent. Cool/Cold = accès rare (min 30/90 jours). Archive = quasi jamais (min 180 jours), stockage très bon marché mais données HORS LIGNE.","choix":["Hot → Cool → Cold → Archive (le stockage coûte de moins en moins cher, l'accès de plus en plus)","Archive → Cool → Hot","Premium → Standard → Basic","Gold → Silver → Bronze"],"bonne":0},
  {"id":"az900-ar-archive","lvl":5,"dom":"Azure","q":"Quelle est la particularité CRITIQUE du tier Archive ?","explain":"Archive = le moins cher au Go, mais lecture impossible sans réhydratation préalable. À réserver aux archives légales et sauvegardes anciennes.","choix":["Les données sont HORS LIGNE : il faut les « réhydrater » (jusqu'à plusieurs heures) avant de pouvoir les lire","Il est plus rapide que Hot","Il est réservé aux vidéos","Les données y sont publiques"],"bonne":0},
  {"id":"az900-ar-zrs","lvl":6,"dom":"Azure","q":"Que garantit la redondance ZRS (Zone-Redundant Storage) ?","explain":"ZRS survit à la perte d'un datacenter entier (une zone). Pour survivre à la perte de la RÉGION, il faut GRS/GZRS.","choix":["3 copies réparties sur 3 zones de disponibilité de la région","3 copies dans un seul datacenter","Une copie dans une autre région","Un chiffrement renforcé"],"bonne":0},
  {"id":"az900-ar-grs","lvl":4,"dom":"Azure","q":"Qu'ajoute la redondance GRS par rapport à LRS ?","explain":"GRS = LRS local + LRS répliqué dans la région partenaire. La variante RA-GRS permet en plus la LECTURE sur le secondaire.","choix":["3 copies supplémentaires dans la RÉGION APPAIRÉE (6 copies au total) — protection contre une panne régionale","Rien, c'est identique","Un accès plus rapide","Des copies sur 3 zones de la même région"],"bonne":0},
  {"id":"az900-ar-s-redundancy","lvl":8,"dom":"Azure","q":"Des sauvegardes critiques doivent survivre à une catastrophe RÉGIONALE, au meilleur coût. Quelle redondance ?","explain":"Survivre à la perte d'une région = réplication vers la région appairée = GRS (ou GZRS si l'on veut aussi la résilience zonale en local).","choix":["GRS (géo-redondant)","LRS","ZRS","Un deuxième disque dans la même VM"],"bonne":0},
  {"id":"az900-ar-storexplorer","lvl":6,"dom":"Azure","q":"Qu'est-ce qu'Azure Storage Explorer ?","explain":"L'interface visuelle du stockage : glisser-déposer des blobs, parcourir tables et files. AzCopy est son équivalent en ligne de commande.","choix":["Une application GRAPHIQUE (Windows/Mac/Linux) pour parcourir et gérer le contenu de tes comptes de stockage","Un service de sauvegarde","Une commande CLI","Un explorateur de coûts"],"bonne":0},
  {"id":"az900-ar-filesync","lvl":4,"dom":"Azure","q":"Que permet Azure File Sync ?","explain":"File Sync = le meilleur des deux mondes : accès local rapide dans chaque agence + source de vérité centralisée dans Azure.","choix":["Synchroniser un serveur de fichiers Windows LOCAL avec Azure Files — le cloud centralise, le serveur local sert de cache rapide","Synchroniser deux téléphones","Copier des VM entre régions","Partager des fichiers par e-mail"],"bonne":0},
  {"id":"az900-ar-s-databox","lvl":9,"dom":"Azure","q":"Tu dois envoyer 120 To de données vers Azure, mais ta liaison Internet est limitée à 50 Mbit/s (≈ 6 mois de transfert). Quelle solution ?","explain":"Ordre de grandeur à retenir : au-delà de quelques dizaines de To sur un lien lent, le camion bat la fibre. C'est le cas d'usage de Data Box.","choix":["Azure Data Box : le transfert physique sera plus rapide et plus fiable","Attendre 6 mois","AzCopy en tâche de fond","Compresser les fichiers"],"bonne":0},
  {"id":"az900-ar-passwordless","lvl":4,"dom":"Sécurité","q":"Quelles méthodes d'authentification SANS mot de passe Azure propose-t-il ?","explain":"Le « passwordless » remplace le mot de passe par la biométrie ou une clé physique — plus sûr ET plus pratique.","choix":["Windows Hello, l'application Microsoft Authenticator et les clés de sécurité FIDO2","Le SMS uniquement","Une question secrète","Un mot de passe plus long"],"bonne":0},
  {"id":"az900-ar-b2b","lvl":5,"dom":"Sécurité","q":"Comment inviter un partenaire EXTERNE à collaborer sur tes ressources sans lui créer un compte interne ?","explain":"Les identités externes (B2B) : l'invité garde SON compte, ton organisation garde le contrôle et la traçabilité.","choix":["Avec Microsoft Entra External ID (invités B2B) : il utilise sa propre identité, tu contrôles ses accès","Lui prêter le compte d'un collègue","Créer un compte admin partagé","C'est impossible"],"bonne":0},
  {"id":"az900-ar-s-condaccess","lvl":7,"dom":"Sécurité","q":"L'entreprise veut exiger la MFA UNIQUEMENT quand un employé se connecte depuis l'extérieur du réseau. Quelle fonctionnalité ?","explain":"« Selon le contexte de connexion » = accès conditionnel : la MFA devient contextuelle au lieu d'être systématique.","choix":["L'accès conditionnel (Conditional Access)","Activer la MFA pour tout le monde en permanence","Un NSG","Un verrou de ressource"],"bonne":0},
  {"id":"az900-ar-rbac-scope","lvl":4,"dom":"Sécurité","q":"Un rôle RBAC attribué sur un groupe de ressources s'applique-t-il aux ressources qu'il contient ?","explain":"L'héritage descendant du RBAC : attribuer au bon NIVEAU évite des dizaines d'attributions individuelles.","choix":["Oui — les attributions héritent vers le bas : management group → abonnement → groupe → ressource","Non, il faut l'attribuer ressource par ressource","Seulement pour le rôle Propriétaire","Seulement si on l'active"],"bonne":0},
  {"id":"az900-ar-zerotrust","lvl":5,"dom":"Sécurité","q":"Quel est le principe central du modèle Zero Trust ?","explain":"Zero Trust : vérifier explicitement, accorder le moindre privilège, supposer la compromission. Le périmètre réseau n'est plus une garantie.","choix":["« Ne jamais faire confiance, toujours vérifier » : chaque accès est authentifié et contrôlé, même depuis le réseau interne","Faire confiance au réseau interne de l'entreprise","Bloquer tout Internet","Utiliser uniquement des mots de passe forts"],"bonne":0},
