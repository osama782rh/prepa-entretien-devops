  explain:"Local (<code>source = \"./modules/x\"</code>) : versionné avec le dépôt, pas de version indépendante. Registry (<code>source = \"org/x/aws\"</code>, avec <code>version</code>) : versionnement sémantique propre. Git (<code>source = \"git::https://...?ref=v1.2.0\"</code>) : versionné par tag — toujours épingler le <code>ref</code>, jamais <code>main</code>." },

{ id:"b3-aws-01", lvl:3, dom:"AWS",
  q:"Comment donnes-tu à une Lambda l'accès à une base RDS dans un subnet privé ?",
  accept:["vpc config","eni","security group","role d execution"],
  explain:"On attache la Lambda au VPC (subnets privés + security group), ce qui lui crée des ENI ; on autorise ce SG en entrée sur le SG de la base. Conséquence : une Lambda dans un VPC n'a plus d'accès internet sans NAT Gateway ou VPC endpoints. Et pour l'authentification, préférer IAM auth plutôt qu'un mot de passe." },

{ id:"b3-aws-02", lvl:3, dom:"AWS",
  q:"Quelle est la différence entre une politique de cycle de vie S3 et la réplication ?",
  accept:["transition","suppression","copie vers un autre bucket","classe de stockage"],
  explain:"Le cycle de vie fait transiter les objets entre classes de stockage ou les supprime après N jours (optimisation de coût, rétention). La réplication (CRR/SRR) copie les objets vers un autre bucket, éventuellement dans une autre région ou un autre compte (DR, conformité, isolation des sauvegardes)." },

{ id:"b3-aws-03", lvl:3, dom:"AWS",
  q:"Qu'est-ce qu'un service quota AWS et pourquoi ça compte pour un plan de DR ?",
  accept:["limite par compte","par region","demander une augmentation","capacite indisponible"],
  explain:"Chaque compte a des limites par service et par région (nombre d'instances, d'EIP, de vCPU). Dans un plan de DR, la région de secours a ses PROPRES quotas, souvent jamais augmentés : au moment de la bascule, on ne peut pas lancer la capacité nécessaire. C'est un échec de DR très fréquent — les quotas se demandent à l'avance et se testent." },

{ id:"b3-az-01", lvl:3, dom:"Azure",
  q:"Comment sauvegardes-tu des VM Azure et que faut-il vérifier au-delà de la sauvegarde ?",
  accept:["recovery services vault","backup policy","restauration testee","retention"],
  explain:"Azure Backup avec un Recovery Services Vault et une politique (fréquence, rétention court/long terme). Au-delà : tester réellement la restauration, vérifier que le coffre est protégé (soft delete, immuabilité, RBAC séparé) et qu'il n'est pas dans le même périmètre de compromission que les VM — sinon un ransomware chiffre aussi les sauvegardes." },

{ id:"b3-az-02", lvl:3, dom:"Azure",
  q:"Qu'est-ce qu'un Azure Container Registry et comment un AKS y accède-t-il proprement ?",
  accept:["attach","managed identity","acrpull","sans secret"],
  explain:"C'est le registry privé d'images. L'accès propre depuis AKS : <code>az aks update --attach-acr</code>, qui donne le rôle <code>AcrPull</code> à l'identité managée du kubelet — aucun imagePullSecret à gérer ni à faire tourner. Compléter par un Private Endpoint sur le registry si la sortie internet est interdite." },

{ id:"b3-az-03", lvl:3, dom:"Azure",
  q:"Comment fonctionne l'autoscaling d'une App Service et quelle est sa limite ?",
  accept:["scale out","regles","metrique","tier","delai"],
  explain:"Scale out (nombre d'instances) sur règles de métrique ou planification, dans les limites du tier du plan. Limites : le scale UP (changer de tier) n'est pas automatique, la réaction prend plusieurs minutes — donc inefficace face à un pic brutal —, et la base de données derrière ne scale pas avec. D'où le pré-scaling avant un pic connu." },

{ id:"b3-cicd-01", lvl:3, dom:"CI/CD",
  q:"Comment structures-tu la promotion d'un artefact de dev à prod ? Que change-t-on entre les environnements ?",
  accept:["meme artefact","configuration","variables","pas de rebuild"],
  explain:"Le MÊME artefact circule ; seule la CONFIGURATION change (variables d'environnement, secrets, endpoints, feature flags), injectée au déploiement. Rien de spécifique à l'environnement ne doit être compilé dans l'artefact — c'est le principe 12-factor, et c'est ce qui rend la recette représentative." },

{ id:"b3-cicd-02", lvl:3, dom:"CI/CD",
  q:"Qu'est-ce qu'un smoke test post-déploiement et pourquoi c'est non négociable ?",
  accept:["verification rapide","apres le deploiement","valide le chemin critique","rollback automatique"],
  explain:"Une poignée de tests rapides sur le chemin critique, exécutés juste après le déploiement contre l'environnement réel (l'appli répond, elle joint sa base, un parcours métier clé fonctionne). Sans ça, on ne découvre l'échec que par les utilisateurs. Idéalement, leur échec déclenche un rollback automatique." },

{ id:"b3-cicd-03", lvl:3, dom:"CI/CD",
  q:"Comment gères-tu les dépendances entre jobs et l'exécution en parallèle dans un pipeline ?",
  accept:["stages","needs","dag","dependances explicites"],
  explain:"Par stages séquentiels (simple mais on attend le plus lent) ou en DAG avec des dépendances explicites (<code>needs</code>, <code>dependsOn</code>) qui laissent démarrer un job dès que SES prérequis sont satisfaits. Le DAG réduit fortement le temps total sur des pipelines à nombreux modules." },

{ id:"b3-sec-01", lvl:3, dom:"Sécurité",
  q:"Comment protèges-tu une branche principale ? Cite quatre règles.",
  must:[["revue","approbation","pull request"],["pipeline","checks","tests verts"]],
  explain:"1) Interdiction du push direct, tout passe par PR. 2) N approbations dont au moins un CODEOWNER. 3) Checks de CI obligatoires au vert. 4) Interdiction du force-push et de la suppression. 5) Commits signés. 6) Réapprobation à chaque nouveau commit. 7) Pas de bypass administrateur. Ces règles matérialisent la séparation des tâches attendue par un auditeur." },

{ id:"b3-sec-02", lvl:3, dom:"Sécurité",
  q:"Qu'est-ce qu'un bastion (jump host) et pourquoi les services managés le remplacent-ils ?",
  accept:["point d entree unique","rebond","session manager","azure bastion","a maintenir"],
  explain:"Une machine unique exposée servant de rebond vers le réseau privé, avec journalisation. Un bastion classique est lui-même une VM à patcher, à durcir et à surveiller — un point de défaillance et une cible. Les services managés (SSM Session Manager, Azure Bastion) offrent la même fonction sans machine à maintenir, avec un contrôle IAM et un enregistrement natifs." },

{ id:"b3-obs-01", lvl:3, dom:"Observabilité",
  q:"Comment détectes-tu qu'un certificat TLS va expirer, avant l'incident ?",
  accept:["sonde","blackbox exporter","alerte j-30","probe","surveillance"],
  explain:"Une sonde externe qui se connecte régulièrement et exporte les jours restants (blackbox_exporter <code>probe_ssl_earliest_cert_expiry</code>, ou équivalent), avec une alerte à J-30 et une escalade à J-7. Et surtout : automatiser le renouvellement (ACME, Key Vault, ACM) pour que la surveillance ne soit qu'un filet de sécurité." },

{ id:"b3-obs-02", lvl:3, dom:"Observabilité",
  q:"Qu'est-ce qu'un test synthétique et qu'apporte-t-il par rapport aux métriques serveur ?",
  accept:["depuis l exterieur","point de vue utilisateur","parcours","24/7"],
  explain:"C'est un robot qui exécute un parcours utilisateur depuis l'extérieur, en continu, même sans trafic réel. Il détecte ce que les métriques serveur ne voient pas : DNS cassé, certificat expiré, CDN en panne, WAF trop agressif, dégradation régionale. C'est la réponse à « mes dashboards sont verts mais les clients se plaignent »." },

{ id:"b3-sre-01", lvl:3, dom:"SRE",
  q:"Comment définis-tu la gravité d'un incident (P1/P2/P3) ?",
  accept:["impact","nombre d utilisateurs","service critique","perte financiere","escalade"],
  explain:"Sur l'IMPACT MÉTIER, pas sur la difficulté technique : nombre d'utilisateurs touchés, criticité de la fonction (paiement vs page d'aide), perte financière ou réglementaire, existence d'un contournement. Chaque niveau doit avoir un délai de prise en charge, un canal et une règle d'escalade définis à l'avance — pas décidés pendant la panne." },

{ id:"b3-sql-01", lvl:3, dom:"SQL",
  q:"Qu'est-ce qu'une transaction longue et pourquoi c'est un problème en production ?",
  accept:["verrous","bloque","vacuum","idle in transaction","concurrence"],
  explain:"Une transaction ouverte longtemps tient ses verrous, bloque les écritures concurrentes, empêche le nettoyage des anciennes versions (VACUUM) et fait gonfler la base. Sur PostgreSQL, surveiller les sessions <code>idle in transaction</code> et poser un <code>idle_in_transaction_session_timeout</code>." },

{ id:"b3-sql-02", lvl:3, dom:"SQL",
  q:"Comment fais-tu une pagination performante sur une grosse table ?",
  accept:["keyset","seek","curseur","where id >","offset lent"],
  explain:"Pas avec <code>OFFSET 100000</code> : la base doit parcourir et jeter 100 000 lignes, et le coût croît avec la page. On utilise la pagination par clé (keyset/seek) : <code>WHERE (created_at, id) &lt; (:dernier_date, :dernier_id) ORDER BY created_at DESC, id DESC LIMIT 50</code> — coût constant, avec un index adapté." }

]);

</script>
<script>
/* data/niveau04b.js */
window.QBANK = (window.QBANK || []).concat([
/* ============ NIVEAU 4 — SÉRIE B ============ */

{ id:"b4-k8s-01", lvl:4, dom:"Kubernetes",
  q:"Qu'est-ce qu'un sidecar ? Donne deux usages réels et le principal inconvénient.",
  accept:["conteneur additionnel","meme pod","proxy","log","consomme des ressources"],
  explain:"Un conteneur secondaire dans le même Pod, partageant réseau et volumes. Usages : proxy de service mesh (Envoy), collecteur de logs, rechargeur de config/secrets, adaptateur de métriques. Inconvénients : ressources consommées par Pod, ordre d'arrêt à gérer (le sidecar ne doit pas mourir avant l'app), et complexité de debug. Les <em>native sidecars</em> (initContainers avec restartPolicy Always) règlent le problème du cycle de vie." },

{ id:"b4-k8s-02", lvl:4, dom:"Kubernetes",
  q:"Comment fais-tu tourner une charge sur des nœuds Spot sans compromettre la disponibilité ?",
  must:[["taint","toleration","node pool","selector"],["pdb","replicas","stateless","tolerant"]],
  explain:"Node pool Spot avec un taint, tolerations uniquement sur les charges tolérantes aux interruptions, réplicas répartis (topologySpread) sur Spot ET on-demand, PDB, arrêt gracieux court, et gestion du signal d'interruption (2 min sur AWS, 30 s sur Azure) pour drainer. Jamais de charge à état ou de composant unique du chemin critique uniquement sur du Spot." },

{ id:"b4-k8s-03", lvl:4, dom:"Kubernetes",
  q:"Qu'est-ce qu'un headless Service et pour quel besoin l'utilise-t-on ?",
  accept:["clusterip none","ip des pods","statefulset","dns par pod","pas de load balancing"],
  explain:"<code>clusterIP: None</code> : pas d'IP virtuelle ni de répartition, le DNS renvoie directement les IP de tous les Pods. Usages : StatefulSets (adresser <code>db-0</code> précisément), clients qui font leur propre équilibrage ou découverte de pairs (Kafka, Cassandra, Elasticsearch), et gRPC qui a besoin des endpoints individuels." },

{ id:"b4-k8s-04", lvl:4, dom:"Kubernetes",
  q:"Pourquoi gRPC s'équilibre-t-il mal derrière un Service ClusterIP classique ?",
  accept:["connexion persistante","http/2","multiplexe","une seule connexion","l4"],
  explain:"gRPC utilise HTTP/2 avec des connexions longue durée multiplexées : le Service, qui équilibre au niveau CONNEXION (L4), envoie tout le trafic d'un client vers un seul Pod. Résultat : charge très déséquilibrée. Solutions : équilibrage côté client via un headless Service, un proxy L7 conscient de gRPC, ou un service mesh." },

{ id:"b4-k8s-05", lvl:4, dom:"Kubernetes",
  q:"Comment gères-tu les secrets dans Kubernetes sans les stocker dans Git ?",
  accept:["external secrets","secrets store csi","sealed secrets","coffre externe"],
  explain:"1) External Secrets Operator ou Secrets Store CSI Driver : le secret reste dans Key Vault / Secrets Manager / Vault, le cluster le synchronise ou le monte à la demande. 2) Sealed Secrets / SOPS : le secret CHIFFRÉ est versionné dans Git, seul le cluster peut le déchiffrer. La première approche est préférable en banque (rotation centralisée, audit des accès)." },

{ id:"b4-k8s-06", lvl:4, dom:"Kubernetes",
  q:"Que se passe-t-il exactement entre le moment où tu supprimes un Pod et sa disparition ?",
  must:[["sigterm"],["grace","terminationgraceperiod","delai"]],
  explain:"Le Pod passe en Terminating, il est retiré des Endpoints (en parallèle, d'où les races), le hook <code>preStop</code> s'exécute, puis SIGTERM est envoyé au PID 1. Le conteneur a <code>terminationGracePeriodSeconds</code> (30 s par défaut) pour finir ses requêtes en cours et sortir ; passé ce délai, SIGKILL. D'où : arrêt gracieux applicatif + preStop pour couvrir la propagation du retrait." },

{ id:"b4-tf-01", lvl:4, dom:"Terraform",
  q:"Comment migres-tu un state d'un backend local vers un backend distant, sans perdre l'infrastructure ?",
  accept:["init -migrate-state","copier","terraform init","confirmation"],
  explain:"On ajoute le bloc <code>backend</code> dans la configuration puis <code>terraform init -migrate-state</code> : Terraform propose de copier le state existant vers le nouveau backend. On vérifie ensuite par un <code>plan</code> qui doit annoncer « no changes ». Sauvegarder le fichier local avant, par prudence." },

{ id:"b4-tf-02", lvl:4, dom:"Terraform",
  q:"À quoi servent les <code>dynamic</code> blocks et quel est leur inconvénient ?",
  accept:["generer des blocs","boucle","for_each imbrique","lisibilite"],
  explain:"Ils génèrent dynamiquement des blocs imbriqués répétitifs (règles de security group, settings) à partir d'une collection. Inconvénient : ça dégrade sérieusement la lisibilité et complique le diff du plan. Règle pratique : n'y recourir que quand le nombre de blocs est réellement variable, pas pour économiser cinq lignes." },

{ id:"b4-tf-03", lvl:4, dom:"Terraform",
  q:"Comment structures-tu le nommage et le tagging de tes ressources en Terraform ?",
  accept:["locals","convention","tags communs","merge","default_tags"],
  explain:"Une convention centralisée dans des <code>locals</code> (<code>{projet}-{env}-{composant}-{région}</code>) et un bloc de tags communs fusionné partout avec <code>merge(local.tags_communs, {...})</code>. Sur AWS, <code>default_tags</code> au niveau provider ; sur Azure, une Azure Policy en mode Modify pour imposer les tags. Sans ça, aucune refacturation ni inventaire fiable." },

{ id:"b4-tf-04", lvl:4, dom:"Terraform",
  q:"Terraform doit créer une ressource qui dépend d'une valeur générée aléatoirement. Comment garantis-tu la stabilité ?",
  accept:["random provider","keepers","dans le state","ne change pas"],
  explain:"On utilise le provider <code>random</code> (<code>random_password</code>, <code>random_id</code>) : la valeur est générée UNE fois et conservée dans le state, donc stable aux apply suivants. Les <code>keepers</code> permettent de forcer une régénération quand une entrée change. Un <code>uuid()</code> ou un <code>timestamp()</code> dans une ressource provoque au contraire un diff perpétuel." },

{ id:"b4-aws-01", lvl:4, dom:"AWS",
  q:"Comment fonctionne le chiffrement S3 côté serveur ? Différence SSE-S3, SSE-KMS, SSE-C.",
  must:[["kms","cle geree"],["s3","aws gere"]],
  explain:"SSE-S3 : clés entièrement gérées par AWS, simple, pas de contrôle ni de traçabilité fine. SSE-KMS : clé dans KMS, avec politique d'accès, journalisation CloudTrail de chaque déchiffrement et possibilité de clé gérée par le client (CMK) — le choix bancaire. SSE-C : tu fournis la clé à chaque requête, AWS ne la stocke pas (rare, contraignant). À savoir : SSE-KMS ajoute un coût et un quota de requêtes KMS." },

{ id:"b4-aws-02", lvl:4, dom:"AWS",
  q:"Qu'est-ce qu'AWS Step Functions et quand le préfère-t-on à une Lambda qui appelle d'autres Lambdas ?",
  accept:["orchestration","machine a etats","retry","visibilite","longue duree"],
  explain:"C'est un orchestrateur de workflow (machine à états) : il gère les retries, les branchements, les erreurs, les timeouts et les traitements longs, avec une visualisation de l'exécution. On le préfère dès qu'il y a plusieurs étapes : chaîner des Lambdas à la main, c'est réimplémenter mal la gestion d'erreurs, et perdre toute traçabilité du parcours." },

{ id:"b4-aws-03", lvl:4, dom:"AWS",
  q:"Comment sécurises-tu un bucket S3 qui ne doit JAMAIS être public ? Cite les couches.",
  must:[["block public access"],["bucket policy","deny","policy"]],
  explain:"1) Block Public Access au niveau bucket ET au niveau compte. 2) Bucket policy avec un Deny explicite sur tout principal non autorisé et un Deny si <code>aws:SecureTransport = false</code>. 3) SCP d'organisation interdisant de désactiver Block Public Access. 4) Chiffrement SSE-KMS avec une key policy restrictive. 5) Access Analyzer + Config pour détecter toute dérive. Défense en profondeur : une seule couche finit toujours par sauter." },

{ id:"b4-aws-04", lvl:4, dom:"AWS",
  q:"Différence entre ECS sur EC2 et ECS sur Fargate ? Sur quoi arbitres-tu ?",
  accept:["gerer les instances","serverless","cout","controle","densite"],
  explain:"Sur EC2 : tu gères les instances (patchs, capacité, AMI), tu peux optimiser la densité et le coût, utiliser du Spot et des types spécifiques (GPU). Sur Fargate : plus de nœuds à gérer, isolation par tâche, facturation à la ressource demandée — plus cher à l'unité mais souvent moins cher tout compris quand on valorise le temps humain. Arbitrage : contrôle et coût unitaire vs charge opérationnelle." },

{ id:"b4-az-01", lvl:4, dom:"Azure",
  q:"Comment mets-tu en place une identité de pipeline Azure DevOps / GitHub vers Azure sans secret ?",
  accept:["workload identity federation","oidc","federated credential","sans secret"],
  explain:"Workload identity federation : on crée une application/identité managée dans Entra ID et on lui ajoute un <em>federated credential</em> qui fait confiance à l'émetteur OIDC du fournisseur CI, restreint au dépôt/branche/environnement précis. Le pipeline échange son token OIDC contre un token Entra — aucun secret à stocker ni à faire tourner." },

{ id:"b4-az-02", lvl:4, dom:"Azure",
  q:"Qu'est-ce qu'un Azure Front Door et en quoi diffère-t-il d'une Application Gateway ?",
  accept:["global","regional","anycast","edge","multi region"],
  explain:"Front Door est GLOBAL : points de présence en périphérie, routage anycast, cache CDN, WAF, bascule multi-région et accélération. Application Gateway est RÉGIONALE : L7 + WAF pour les backends d'une région. Architecture typique : Front Door en entrée mondiale → Application Gateway par région → backends." },

{ id:"b4-az-03", lvl:4, dom:"Azure",
  q:"Comment fonctionne le patching des VM Azure à l'échelle ?",
  accept:["update manager","maintenance configuration","fenetre","conformite"],
  explain:"Azure Update Manager : évaluation périodique de la conformité, planification par <em>maintenance configuration</em> (fenêtres définies), déploiement par vagues avec exclusions, et rapports. En complément : images dorées reconstruites régulièrement plutôt que patchées en place — plus proche de l'immuabilité, et c'est l'argument à donner." },

{ id:"b4-az-04", lvl:4, dom:"Azure",
  q:"Différence entre Azure Files et Azure Blob pour une application conteneurisée ?",
  accept:["systeme de fichiers","smb nfs","objet","readwritemany","api rest"],
  explain:"Azure Files expose un système de fichiers (SMB/NFS) montable par plusieurs Pods simultanément — c'est l'option ReadWriteMany. Blob est du stockage objet accédé par API/SDK, bien plus performant et économique pour de gros volumes, mais ce n'est pas un filesystem POSIX. Choisir Files uniquement quand l'application EXIGE un montage partagé." },

{ id:"b4-cicd-01", lvl:4, dom:"CI/CD",
  q:"Comment implémentes-tu un déploiement canary sur Kubernetes ? Cite deux approches.",
  accept:["argo rollouts","flagger","ingress weight","service mesh","deux deployments"],
  explain:"1) Manuellement : deux Deployments (stable et canary) derrière le même Service, ratio piloté par le nombre de réplicas — grossier. 2) Par pondération au niveau du routage : annotations de l'ingress controller, Gateway API, ou service mesh. 3) Automatisé avec Argo Rollouts ou Flagger : montée progressive avec ANALYSE automatique des métriques et rollback si les seuils sont dépassés — c'est la bonne réponse." },

{ id:"b4-cicd-02", lvl:4, dom:"CI/CD",
  q:"Qu'est-ce qu'un feature flag, et quelle dette crée-t-il ?",
  accept:["activer sans deployer","decouple","nettoyage","combinatoire","dette"],
  explain:"Un interrupteur qui active/désactive une fonctionnalité sans redéployer : il découple la mise en production de la mise à disposition, permet le déploiement progressif par segment et le kill switch instantané. Dette : chaque flag ajoute un chemin de code et une combinatoire de tests. Il faut une date de péremption et un nettoyage systématique — un flag permanent est devenu une option de configuration, il faut l'assumer comme telle." },

{ id:"b4-cicd-03", lvl:4, dom:"CI/CD",
  q:"Comment garantis-tu qu'un artefact déployé en production est bien celui qui a été testé ?",
  accept:["digest","immuable","signature","promotion","meme identifiant"],
  explain:"Référencer par identifiant IMMUABLE (digest SHA256 de l'image, pas un tag), signer l'artefact au build et vérifier la signature à l'admission, tracer la promotion (quel digest a passé quel environnement), et produire une attestation de provenance. Un tag mutable ne prouve rien — il peut être réaffecté à tout moment." },

{ id:"b4-sec-01", lvl:4, dom:"Sécurité",
  q:"Qu'est-ce qu'OAuth 2.0 et OpenID Connect ? Ne confonds pas les deux.",
  must:[["autorisation","acces","deleguer"],["authentification","identite","id token"]],
  explain:"OAuth 2.0 est un protocole d'AUTORISATION : il délègue un accès à une ressource via un access token, sans partager le mot de passe. OpenID Connect est une couche d'AUTHENTIFICATION construite au-dessus : il ajoute l'<code>id_token</code> (un JWT décrivant l'utilisateur) et le endpoint userinfo. Utiliser OAuth seul pour authentifier est une erreur classique de conception." },

{ id:"b4-sec-02", lvl:4, dom:"Sécurité",
  q:"Qu'est-ce qu'une permission boundary AWS et quand l'utilise-t-on ?",
  accept:["plafond","delegation","limite maximale","developpeur peut creer des roles"],
  explain:"C'est un plafond de permissions attaché à une identité : les droits effectifs sont l'INTERSECTION de la policy et de la boundary. Usage typique : autoriser des équipes à créer leurs propres rôles IAM (autonomie) sans qu'elles puissent s'octroyer plus que ce que la boundary permet — délégation encadrée, très utilisée en grande organisation." },

{ id:"b4-sec-03", lvl:4, dom:"Sécurité",
  q:"Comment détectes-tu qu'un secret a été commité, avant qu'il n'arrive dans l'historique partagé ?",
  accept:["pre-commit","gitleaks","trufflehog","scan","push protection"],
  explain:"Hook pre-commit (gitleaks, detect-secrets, trufflehog) sur les postes, DOUBLÉ d'un contrôle côté serveur non contournable : push protection du forge, ou job CI bloquant qui scanne l'historique de la PR. Le hook local seul est contournable avec <code>--no-verify</code> — c'est un accélérateur, pas un contrôle." },

{ id:"b4-obs-01", lvl:4, dom:"Observabilité",
  q:"Comment instrumentes-tu une application pour exposer des métriques Prometheus ?",
  accept:["client library","/metrics","counter","histogram","exporter"],
  explain:"Bibliothèque cliente (ou OpenTelemetry avec export Prometheus) qui expose un endpoint <code>/metrics</code> : counters pour les requêtes et erreurs, histogrammes pour les latences, gauges pour les états. Pour un composant qu'on ne peut pas modifier, on utilise un <em>exporter</em> dédié. Règle : labels de cardinalité bornée uniquement." },

{ id:"b4-obs-02", lvl:4, dom:"Observabilité",
  q:"Qu'est-ce qu'Alertmanager apporte par rapport à une simple règle d'alerte ?",
  accept:["regroupement","inhibition","silence","routage","deduplication"],
  explain:"Il gère le cycle de vie de la notification : regroupement (une notification pour 50 pods tombés, pas 50), déduplication, inhibition (ne pas alerter sur les symptômes quand la cause parente est déjà connue), silences planifiés pour les maintenances, et routage vers la bonne équipe selon les labels. Sans lui, une panne génère une avalanche qui noie l'information utile." },

{ id:"b4-sre-01", lvl:4, dom:"SRE",
  q:"Qu'est-ce qu'un test de charge, un test de stress et un test d'endurance ?",
  must:[["charge attendue","nominal","cible"],["limite","rupture","au-dela"],["duree","longue","fuite"]],
  explain:"Charge : on valide le comportement à la charge ATTENDUE (latence, erreurs). Stress : on pousse jusqu'à la RUPTURE pour connaître le point de bascule et vérifier que la dégradation est gracieuse. Endurance (soak) : charge nominale pendant des heures pour révéler les fuites mémoire, la saturation de pools et le gonflement des logs. Les trois répondent à des questions différentes." },

{ id:"b4-sre-02", lvl:4, dom:"SRE",
  q:"Comment estimes-tu le coût d'une minute d'indisponibilité, et pourquoi c'est utile ?",
  accept:["chiffre d affaires","transactions","penalite","justifier l investissement"],
  explain:"Chiffre d'affaires ou volume de transactions par minute sur la période concernée, plus les pénalités contractuelles, le coût de traitement des réclamations, et l'impact réputationnel/réglementaire (en banque, un incident majeur se déclare au régulateur). Utilité : c'est le seul argument qui fait accepter un investissement en résilience par une direction." },

{ id:"b4-linux-01", lvl:4, dom:"Linux",
  q:"Qu'est-ce que le TIME_WAIT et faut-il s'en inquiéter sur un reverse proxy ?",
  accept:["fermeture","2msl","normal","ports ephemeres","reutilisation"],
  explain:"C'est l'état d'attente (2×MSL, ~60 s) du côté qui ferme la connexion, pour absorber les paquets retardataires. Sur un proxy à fort trafic, en voir des dizaines de milliers est NORMAL. Ça ne devient un problème que si on épuise les ports éphémères — la solution est le keep-alive et le pooling de connexions, pas de bricoler les sysctl à l'aveugle." },

{ id:"b4-linux-02", lvl:4, dom:"Linux",
  q:"Comment fonctionne la rotation de logs et quel est le piège avec un processus qui écrit en continu ?",
  accept:["logrotate","copytruncate","signal","reouvre le fichier","descripteur"],
  explain:"logrotate renomme le fichier et en crée un nouveau — mais le processus écrit toujours dans l'ancien descripteur. Il faut soit lui envoyer un signal pour qu'il rouvre (<code>postrotate</code> + SIGHUP/<code>systemctl reload</code>), soit utiliser <code>copytruncate</code> (copie puis tronque, avec un petit risque de perte). Oublier ça, c'est le disque qui se remplit avec un fichier « supprimé »." },

{ id:"b4-res-01", lvl:4, dom:"Réseau",
  q:"Qu'est-ce qu'un routage asymétrique et pourquoi ça casse un firewall stateful ?",
  accept:["aller et retour differents","pas le meme chemin","etat inconnu","drop"],
  explain:"L'aller passe par un chemin et le retour par un autre. Un firewall stateful qui voit le retour sans avoir vu l'aller ne trouve pas d'entrée dans sa table d'états et jette le paquet. C'est un classique des architectures hybrides avec VPN + ExpressRoute/Direct Connect actifs simultanément et des préférences BGP mal réglées." },

{ id:"b4-res-02", lvl:4, dom:"Réseau",
  q:"Comment fonctionne le health check d'un load balancer et quel réglage cause le plus de faux positifs ?",
  accept:["intervalle","seuil","timeout","trop agressif","unhealthy threshold"],
  explain:"Le LB interroge périodiquement un endpoint ; après N échecs consécutifs la cible est retirée, après M succès elle revient. Faux positifs classiques : timeout plus court que la latence réelle sous charge, seuil d'échec à 1, ou endpoint de santé qui teste les dépendances externes — un ralentissement de la base retire alors TOUTES les cibles d'un coup." }

]);

</script>
<script>
/* data/niveau05b.js */
window.QBANK = (window.QBANK || []).concat([
/* ============ NIVEAU 5 — SÉRIE B ============ */

{ id:"b5-k8s-01", lvl:5, dom:"Kubernetes",
  q:"Explique ce qu'est un CSI driver et pourquoi Kubernetes l'a introduit.",
  accept:["interface de stockage","plugin externe","hors du core","standard"],
  explain:"Container Storage Interface : une interface standard qui permet à un fournisseur de stockage d'écrire un pilote HORS du code de Kubernetes. Avant, chaque intégration (EBS, Azure Disk) vivait dans le core (« in-tree ») et suivait le cycle de release de K8s. Le CSI permet des mises à jour indépendantes, et apporte snapshots, redimensionnement et clonage standardisés." },

{ id:"b5-k8s-02", lvl:5, dom:"Kubernetes",
  q:"Comment fonctionne la découverte de services entre namespaces, et comment la restreins-tu ?",
  must:[["fqdn","namespace","svc.cluster.local"],["networkpolicy","policy"]],
  explain:"On appelle <code>service.autre-namespace.svc.cluster.local</code> — le DNS résout à travers tout le cluster et rien n'est bloqué par défaut. Pour restreindre : NetworkPolicy default-deny en ingress ET egress dans chaque namespace, puis autorisation explicite par namespaceSelector. Le cloisonnement DNS seul n'existe pas : c'est le réseau qui filtre." },

{ id:"b5-k8s-03", lvl:5, dom:"Kubernetes",
  q:"Un cluster a 3 nœuds et tu déploies 3 réplicas. Es-tu protégé contre la perte d'un nœud ? Justifie.",
  accept:["pas garanti","topologyspread","anti-affinity","peuvent etre sur le meme noeud"],
  explain:"Pas automatiquement : le scheduler peut placer les 3 Pods sur le même nœud si les ressources le permettent. Il faut l'expliciter avec <code>topologySpreadConstraints</code> (topologyKey <code>kubernetes.io/hostname</code>, et <code>topology.kubernetes.io/zone</code> pour le multi-AZ) ou une podAntiAffinity. Et prévoir la capacité pour que N-1 nœuds absorbent la charge." },

{ id:"b5-k8s-04", lvl:5, dom:"Kubernetes",
  q:"Qu'est-ce que le Pod Security Admission et quels sont ses trois niveaux ?",
  must:[["privileged"],["baseline"],["restricted"]],
  explain:"Le contrôleur d'admission natif qui applique les Pod Security Standards par namespace via des labels. <b>privileged</b> : aucune restriction. <b>baseline</b> : bloque les élévations évidentes (privileged, hostNetwork, hostPath). <b>restricted</b> : durcissement complet (non-root obligatoire, capabilities drop ALL, seccomp RuntimeDefault). Modes <code>enforce</code>, <code>audit</code>, <code>warn</code> — on commence toujours par audit/warn." },

{ id:"b5-k8s-05", lvl:5, dom:"Kubernetes",
  q:"Comment sauvegardes-tu un cluster Kubernetes ? Que faut-il sauvegarder exactement ?",
  must:[["etcd","objets","manifestes"],["volume","pv","donnees"]],
  explain:"Deux choses distinctes : (1) l'état des objets — snapshot etcd, ou mieux, tout le désiré dans Git (GitOps) ce qui rend la sauvegarde presque inutile ; (2) les DONNÉES des volumes persistants, via des snapshots CSI. Velero fait les deux (objets + volumes + restauration sélective). Piège : sauvegarder etcd sans les PV ne restaure rien d'utile." },

{ id:"b5-k8s-06", lvl:5, dom:"Kubernetes",
  q:"Que fait un Ingress Controller concrètement quand tu crées un objet Ingress ?",
  accept:["watch","reconfigure","reload","genere la conf","proxy"],
  explain:"Il surveille (watch) les objets Ingress via l'API, génère la configuration du proxy sous-jacent (nginx.conf, routes Envoy, règles de l'ALB), la recharge à chaud, et met à jour le statut de l'Ingress avec l'adresse d'entrée. Il surveille aussi Services et Endpoints pour router directement vers les IP des Pods et éviter un double saut par le Service." },

{ id:"b5-tf-01", lvl:5, dom:"Terraform",
  q:"Comment gérerais-tu la création d'un cluster AKS/EKS ET des ressources Kubernetes dedans avec Terraform ?",
  accept:["deux states","separer","provider kubernetes","dependance","poule et oeuf"],
  explain:"On SÉPARE en deux states : un pour le cluster (provider cloud), un pour les objets Kubernetes (providers kubernetes/helm configurés depuis les outputs du premier). Raison : configurer un provider à partir d'une ressource créée dans le même apply crée un problème d'initialisation (valeurs inconnues au plan) et rend le destroy impossible. C'est une question de conception très discriminante." },

{ id:"b5-tf-02", lvl:5, dom:"Terraform",
  q:"Comment gérerais-tu 200 comptes AWS avec Terraform sans dupliquer 200 fois le code ?",
  accept:["module","for_each","pipeline par compte","assume role","matrice"],
  explain:"Un module de baseline unique, appliqué par compte via un pipeline paramétré (matrice) qui assume un rôle dans chaque compte, avec un state par compte. Alternative : une couche d'orchestration (Terragrunt, workspaces, ou un générateur de configuration). Ce qu'il ne faut PAS faire : un état géant avec 200 providers aliasés — plan interminable et rayon d'impact maximal." },

{ id:"b5-tf-03", lvl:5, dom:"Terraform",
  q:"Que se passe-t-il si tu supprimes un bloc de ressource du code sans faire de destroy ?",
  accept:["detruite au prochain apply","plan de destruction","supprime","state"],
  explain:"Au prochain plan, Terraform voit une ressource dans le state absente du code : il propose de la DÉTRUIRE. C'est le comportement normal et attendu. Si l'intention était de cesser de la gérer sans la supprimer, il fallait <code>terraform state rm</code> AVANT de retirer le code — ou un bloc <code>removed</code> (1.7+) qui exprime ça de façon déclarative." },

{ id:"b5-tf-04", lvl:5, dom:"Terraform",
  q:"Comment fais-tu une revue de code Terraform efficace ? Que regardes-tu en priorité ?",
  must:[["plan","destruction","remplacement"],["securite","public","chiffrement","droits"]],
  explain:"1) Le PLAN avant le code : y a-t-il des destroy ou des replacement inattendus ? 2) Sécurité : exposition publique, chiffrement, droits trop larges, secrets en clair. 3) Rayon d'impact : quel environnement, quelle criticité. 4) Réversibilité : peut-on revenir en arrière ? 5) Seulement ensuite : style, nommage, factorisation. Beaucoup de revues font l'inverse et laissent passer l'essentiel." },

{ id:"b5-aws-01", lvl:5, dom:"AWS",
  q:"Comment fonctionne le routage Route 53 ? Cite trois politiques et leur usage.",
  must:[["latency","latence","geo","weighted","failover"]],
  explain:"Simple (un enregistrement), Weighted (répartition par pourcentage — canary ou migration), Latency (l'utilisateur va vers la région la plus rapide), Geolocation/Geoproximity (conformité, contenu local), Failover (primaire/secours avec health check), Multivalue. Combinées aux health checks, elles permettent une bascule DR automatique — sous réserve d'un TTL court." },

{ id:"b5-aws-02", lvl:5, dom:"AWS",
  q:"Qu'est-ce qu'AWS Organizations SCP et pourquoi une SCP n'accorde-t-elle jamais de droits ?",
  accept:["plafond","filtre","garde-fou","intersection","limite"],
  explain:"Une SCP est un FILTRE appliqué à un compte ou une OU : elle définit le maximum autorisé, mais n'accorde rien par elle-même. Les droits effectifs = intersection SCP ∩ policies IAM. Usages : interdire les régions non autorisées, empêcher la désactivation de CloudTrail/GuardDuty, bloquer la suppression des sauvegardes. Elle ne s'applique pas au compte de gestion — piège classique." },

{ id:"b5-aws-03", lvl:5, dom:"AWS",
  q:"Explique le fonctionnement d'un Auto Scaling Group avec une politique de target tracking.",
  accept:["metrique cible","ajuste","cloudwatch","thermostat","cooldown"],
  explain:"On fixe une cible (par exemple CPU moyen à 50 %) et l'ASG ajuste le nombre d'instances pour s'en approcher, comme un thermostat, via des alarmes CloudWatch gérées automatiquement. Points d'attention : le délai de mise en service (warm-up) rend la réaction lente face à un pic brutal, d'où le pré-scaling planifié ; et le scale-in doit respecter un cooldown pour éviter l'oscillation." },

{ id:"b5-aws-04", lvl:5, dom:"AWS",
  q:"Comment isoles-tu les sauvegardes d'un ransomware sur AWS ?",
  must:[["compte separe","autre compte","isole"],["immuable","object lock","vault lock","worm"]],
  explain:"Copie des sauvegardes dans un COMPTE dédié auquel les identités de production n'ont aucun accès en écriture ou en suppression, avec immuabilité (S3 Object Lock en mode Compliance, AWS Backup Vault Lock), MFA delete, et SCP empêchant la suppression même pour un administrateur. Le principe : un attaquant qui compromet la prod ne doit pas pouvoir atteindre les sauvegardes." },

{ id:"b5-az-01", lvl:5, dom:"Azure",
  q:"Comment fonctionne l'authentification à Azure SQL par Entra ID plutôt que par login SQL ?",
  accept:["token","managed identity","pas de mot de passe","administrateur entra"],
  explain:"On définit un administrateur Entra ID sur le serveur, on crée des utilisateurs contenus depuis Entra (<code>CREATE USER [app] FROM EXTERNAL PROVIDER</code>), et l'application obtient un token via sa Managed Identity au lieu d'un mot de passe. Bénéfices : aucun secret, révocation centralisée, MFA et accès conditionnel possibles sur les accès humains, journalisation unifiée." },

{ id:"b5-az-02", lvl:5, dom:"Azure",
  q:"Qu'est-ce que le mode Kubenet vs Azure CNI dans AKS ? Quel impact sur le plan d'adressage ?",
  accept:["ip du vnet","pod ip routable","consomme des ip","overlay","nat"],
  explain:"Kubenet : les Pods ont des IP hors du VNet, routées par UDR — économe en IP mais limité et moins performant. Azure CNI : chaque Pod reçoit une IP DU VNET, donc directement routable et compatible avec les Private Endpoints, mais il faut dimensionner le subnet pour <code>nœuds × (max pods par nœud + 1)</code> — un sous-dimensionnement bloque la montée en charge et ne se corrige pas à chaud. Azure CNI Overlay est le compromis moderne." },

{ id:"b5-az-03", lvl:5, dom:"Azure",
  q:"Comment centralises-tu les logs de 50 subscriptions Azure ?",
  accept:["log analytics","diagnostic settings","policy","deployifnotexists","workspace central"],
  explain:"Un (ou quelques) workspace Log Analytics central dans une subscription de management, alimenté par les diagnostic settings de chaque ressource — imposés automatiquement par une initiative Azure Policy en <code>DeployIfNotExists</code> assignée au management group. Compléter par l'export vers un stockage immuable pour la rétention longue, et Sentinel pour le SIEM." },

{ id:"b5-res-01", lvl:5, dom:"Réseau",
  q:"Qu'est-ce que le split-horizon DNS et dans quel cas en a-t-on besoin ?",
  accept:["reponse differente","interne externe","meme nom","vue"],
  explain:"Le même nom résout vers des IP différentes selon l'origine de la requête : IP privée depuis le réseau interne, IP publique depuis internet. C'est exactement ce que font les Private DNS Zones Azure et les hosted zones privées Route 53. Indispensable pour utiliser le même FQDN partout tout en gardant le trafic interne sur le réseau privé." },

{ id:"b5-res-02", lvl:5, dom:"Réseau",
  q:"Comment fonctionne BGP dans un contexte de connexion hybride, en une explication simple ?",
  accept:["annonce des routes","annonce les prefixes","echange de routes","routage dynamique","preference","systeme autonome"],
  explain:"Chaque côté ANNONCE les préfixes qu'il sait joindre, et chacun choisit le meilleur chemin selon des attributs (AS path, local preference, MED). Concrètement : ton datacenter annonce ses plages à Azure/AWS et inversement, sans configuration statique. Intérêt : la bascule VPN ↔ lien dédié devient automatique. Risque : une annonce trop large ou une préférence mal réglée provoque un routage asymétrique ou une fuite de routes." },

{ id:"b5-res-03", lvl:5, dom:"Réseau",
  q:"Qu'est-ce qu'une attaque DDoS volumétrique et comment s'en protège-t-on dans le cloud ?",
  accept:["saturer la bande passante","shield","ddos protection","cdn","absorber"],
  explain:"On sature la bande passante ou les ressources par un volume massif de trafic. Protections : services dédiés (AWS Shield, Azure DDoS Protection Standard) qui absorbent et filtrent en amont, CDN/anycast qui répartissent la charge mondialement, WAF avec rate limiting pour les attaques applicatives (L7), et une architecture qui ne dépend pas d'une IP unique. Point clé : on ne se défend pas d'un DDoS volumétrique avec de l'autoscaling — on paierait la facture de l'attaquant." },

{ id:"b5-sec-01", lvl:5, dom:"Sécurité",
  q:"Comment fonctionne HashiCorp Vault et qu'apporte-t-il par rapport à un coffre cloud natif ?",
  accept:["secrets dynamiques","bail","lease","multi cloud","moteur"],
  explain:"Vault authentifie une identité (Kubernetes, OIDC, AppRole) et délivre des secrets, avec des moteurs qui GÉNÈRENT des secrets dynamiques à durée de vie limitée (un couple identifiant/mot de passe de base créé à la demande, révoqué à l'expiration du bail). Par rapport au natif : portable multi-cloud et on-premise, secrets dynamiques, chiffrement en tant que service. Coût : c'est un composant critique de plus à opérer en haute disponibilité." },

{ id:"b5-sec-02", lvl:5, dom:"Sécurité",
  q:"Qu'est-ce qu'un WAF et quelles sont ses limites ?",
  accept:["filtre applicatif","owasp","faux positifs","ne corrige pas","couche 7"],
  explain:"Un pare-feu applicatif qui inspecte le trafic HTTP et bloque les motifs d'attaque (injection SQL, XSS, top 10 OWASP) avec du rate limiting et des règles gérées. Limites : il ne corrige pas la vulnérabilité sous-jacente, il génère des faux positifs qui cassent des fonctionnalités légitimes (d'où un passage obligatoire en mode détection avant blocage), et il est contournable. C'est une couche de défense en profondeur, pas un substitut au code sûr." },

{ id:"b5-sec-03", lvl:5, dom:"Sécurité",
  q:"Comment gères-tu la révocation d'accès d'une personne qui quitte l'entreprise, en environnement cloud ?",
  must:[["desactiver le compte","identite","annuaire"],["cle","token","secret","session"]],
  explain:"Désactivation dans l'annuaire source (Entra ID/IdP) — ce qui coupe tout ce qui est fédéré —, révocation des sessions et tokens de rafraîchissement en cours, suppression des clés d'accès et tokens personnels (cloud, Git, registry), retrait des groupes et des accès break-glass, et rotation de tout secret partagé qu'elle connaissait. Puis vérification par revue d'accès. La leçon : plus les accès sont fédérés et temporaires, plus cette procédure est simple et fiable." },

{ id:"b5-obs-01", lvl:5, dom:"Observabilité",
  q:"Qu'est-ce qu'OpenTelemetry et pourquoi c'est important stratégiquement ?",
  accept:["standard","vendor neutral","instrumentation unique","collector","portabilite"],
  explain:"C'est le standard CNCF d'instrumentation (traces, métriques, logs) : une seule instrumentation dans le code, et un <em>collector</em> qui exporte vers n'importe quel backend. Enjeu stratégique : on ne réinstrumente pas 200 services le jour où on change d'éditeur d'APM. C'est un argument de négociation et de réversibilité, pas seulement technique." },

{ id:"b5-obs-02", lvl:5, dom:"Observabilité",
  q:"Comment calcules-tu un taux de disponibilité à partir de métriques ? Quel piège ?",
  accept:["requetes reussies","ratio","fenetre","zero trafic","division par zero"],
  explain:"Ratio requêtes réussies / requêtes totales sur une fenêtre glissante (SLI basé sur les requêtes), plutôt que du temps d'uptime — c'est plus proche du vécu utilisateur. Pièges : les périodes sans trafic (division par zéro ou disponibilité artificiellement parfaite la nuit), les erreurs client 4xx qu'il ne faut pas compter comme des échecs du service, et le point de mesure (mesurer dans l'app rate ce qui casse avant elle)." },

{ id:"b5-sre-01", lvl:5, dom:"SRE",
  q:"Qu'est-ce qu'une dégradation gracieuse ? Donne un exemple bancaire.",
  accept:["fonctionnalite reduite","au lieu de tomber","cache","mode degrade","essentiel"],
  explain:"Le service continue de rendre l'essentiel en désactivant l'accessoire au lieu de tomber entièrement. Exemple bancaire : si le service de scoring temps réel est indisponible, on continue d'afficher le solde et l'historique en désactivant les recommandations ; ou on sert un solde en cache daté explicitement plutôt qu'une erreur. Cela suppose d'avoir hiérarchisé les fonctions AVANT l'incident." },

{ id:"b5-sre-02", lvl:5, dom:"SRE",
  q:"Comment organises-tu une astreinte soutenable ?",
  accept:["rotation","suffisamment de personnes","runbook","compensation","alertes actionnables"],
  explain:"Rotation avec assez de personnes pour que le tour revienne rarement (6-8 minimum), alertes uniquement actionnables avec runbook, mesure du nombre de réveils par tour comme indicateur suivi, droit à la récupération après une nuit blanche, compensation, passation formelle entre tours, et budget explicite pour corriger ce qui a réveillé. Une astreinte qui sonne toutes les nuits est un problème d'ingénierie, pas de planning." },

{ id:"b5-sql-01", lvl:5, dom:"SQL",
  q:"Comment fonctionne le point-in-time recovery et de quoi dépend-il ?",
  accept:["sauvegarde complete","logs de transaction","wal","rejouer","instant precis"],
  explain:"On restaure une sauvegarde complète antérieure, puis on REJOUE les journaux de transactions (WAL / binlog) jusqu'à l'instant choisi. Cela dépend donc de la conservation continue de ces journaux et de la fenêtre de rétention. C'est ce qui permet de revenir juste avant un <code>DELETE</code> catastrophique — à condition de l'avoir testé, car la restauration d'une grosse base prend des heures." },

{ id:"b5-sql-02", lvl:5, dom:"SQL",
  q:"Qu'est-ce qu'une vue matérialisée et quand l'utilise-t-on ?",
  accept:["resultat stocke","precalcule","rafraichir","agregation couteuse"],
  explain:"Une vue dont le RÉSULTAT est stocké physiquement, à rafraîchir explicitement ou périodiquement. On l'utilise pour des agrégations coûteuses relues souvent (tableaux de bord, rapports). Contrepartie : les données sont périmées entre deux rafraîchissements, et le rafraîchissement lui-même peut être lourd et verrouillant (d'où <code>REFRESH ... CONCURRENTLY</code>)." },

{ id:"b5-cicd-01", lvl:5, dom:"CI/CD",
  q:"Comment gères-tu les migrations de base dans un pipeline Kubernetes ?",
  accept:["job","initcontainer","avant le deploiement","une seule instance","verrou"],
  explain:"Un Job Kubernetes (ou un hook Helm pre-upgrade) exécuté AVANT le rollout, en une seule instance, avec un verrou applicatif dans l'outil de migration (Flyway/Liquibase pose un verrou en base) pour éviter deux exécutions concurrentes. Un initContainer sur chaque Pod est un anti-pattern : N réplicas = N migrations simultanées. Et les migrations doivent rester rétrocompatibles pour permettre le rollback." },

{ id:"b5-docker-01", lvl:5, dom:"Docker",
  q:"Qu'est-ce que BuildKit apporte par rapport au builder Docker historique ?",
  accept:["parallelisation","cache","mount secret","plus rapide","cache distant"],
  explain:"Exécution parallèle des étapes indépendantes du graphe, cache plus fin et exportable/partagé entre machines (<code>--cache-from/--cache-to</code>), montage de secrets sans les laisser dans les couches (<code>--mount=type=secret</code>), montage de caches de dépendances (<code>--mount=type=cache</code>), et builds multi-plateformes. C'est ce qui rend les builds de CI à la fois plus rapides et plus sûrs." },

{ id:"b5-linux-01", lvl:5, dom:"Linux",
  q:"Comment fonctionne le DNS côté client Linux dans un conteneur ? Quels fichiers interviennent ?",
  accept:["resolv.conf","nsswitch","ndots","search","nameserver"],
  explain:"<code>/etc/nsswitch.conf</code> définit l'ordre des sources (files puis dns), <code>/etc/hosts</code> est consulté en premier, puis <code>/etc/resolv.conf</code> donne les <code>nameserver</code>, la liste <code>search</code> et les options dont <code>ndots</code>. Dans un Pod, ce fichier est injecté par le kubelet avec <code>ndots:5</code> — d'où les requêtes multiples pour un nom externe et la surcharge de CoreDNS." }

]);

window.QBANK = (window.QBANK || []).concat([
/* ============ NIVEAU 6 — SÉRIE B ============ */

{ id:"b6-k8s-01", lvl:6, dom:"Kubernetes",
  q:"Un Pod démarre puis passe en Error après 30 secondes, sans log applicatif. Quelles hypothèses ?",
  accept:["oomkill","liveness","exit code","secret manquant","dependance"],
  explain:"Lire <code>kubectl describe</code> : <b>Last State</b> et l'exit code. 137 = OOMKill (limite mémoire), 143 = SIGTERM (liveness ou éviction), 1/2 = sortie applicative, 126/127 = commande introuvable ou non exécutable. Sans log, suspecter aussi : ConfigMap/Secret référencé absent, volume non montable, ou un crash avant l'initialisation du logger (écrire sur stderr très tôt dans l'app aide énormément)." },

{ id:"b6-k8s-02", lvl:6, dom:"Kubernetes",
  q:"Le cluster répond très lentement à toutes les commandes kubectl. Où regardes-tu ?",
  accept:["api server","etcd","latence","webhook","audit"],
  explain:"1) Santé et latence d'etcd (<code>etcd_disk_wal_fsync_duration</code> — etcd est très sensible aux I/O disque). 2) Charge de l'API server, throttling client (message « client-side throttling »). 3) Un admission webhook lent ou injoignable qui ajoute un aller-retour à chaque requête. 4) Volume d'objets (millions d'Events, Secrets, Jobs terminés non nettoyés). 5) Log d'audit sur un disque saturé." },

{ id:"b6-k8s-03", lvl:6, dom:"Kubernetes",
  q:"Un HPA oscille : il monte à 10 réplicas, redescend à 2, remonte. Comment corriges-tu ?",
  accept:["stabilization window","behavior","metrique instable","cooldown","seuil"],
  explain:"C'est du <em>flapping</em>. Correctifs : augmenter la <code>stabilizationWindowSeconds</code> en scale-down (300 s par défaut, souvent à allonger), configurer <code>behavior</code> avec des politiques de montée et descente asymétriques (monter vite, descendre lentement), choisir une métrique moins bruyante ou l'agréger sur une fenêtre plus longue, et vérifier que la cible n'est pas trop proche de la charge nominale." },

{ id:"b6-k8s-04", lvl:6, dom:"Kubernetes",
  q:"Après un upgrade de cluster, certains manifestes sont refusés. Quelle est la cause probable et comment l'anticiper ?",
  accept:["api depreciee","version d api","supprimee","pluto","kubent"],
  explain:"Une version d'API a été supprimée (par exemple le passage de <code>batch/v1beta1</code> à <code>batch/v1</code> pour CronJob). Anticipation : lire les notes de dépréciation AVANT l'upgrade, scanner les manifestes et les releases Helm avec <code>pluto</code> ou <code>kubent</code>, activer les métriques d'API dépréciées côté API server (<code>apiserver_requested_deprecated_apis</code>) pour repérer qui utilise encore quoi." },

{ id:"b6-k8s-05", lvl:6, dom:"Kubernetes",
  q:"Un namespace reste bloqué en <code>Terminating</code> indéfiniment. Que se passe-t-il ?",
  accept:["finalizer","ressource bloquee","api service","non supprimable"],
  explain:"Un objet du namespace porte un <em>finalizer</em> qu'aucun contrôleur ne lève — souvent parce que le contrôleur ou l'APIService qui devait le traiter n'existe plus (opérateur désinstallé, webhook injoignable). On identifie l'objet bloqué (<code>kubectl get namespace x -o json</code>, section conditions), on répare ou supprime le contrôleur fautif ; retirer le finalizer à la main est un dernier recours qui peut laisser des ressources cloud orphelines." },

{ id:"b6-k8s-06", lvl:6, dom:"Kubernetes",
  q:"Des Pods sont évincés avec le message <code>Evicted: The node was low on resource: ephemeral-storage</code>. Explique.",
  accept:["disque du noeud","logs","emptydir","couche d ecriture","stockage ephemere"],
  explain:"Le kubelet applique une pression d'éviction quand le disque du nœud se remplit. Coupables : logs applicatifs écrits dans le conteneur au lieu de stdout, gros fichiers temporaires dans un emptyDir, images accumulées. Correctifs : logger sur stdout, définir <code>ephemeral-storage</code> en requests/limits, garbage collection des images, et volumes dédiés pour les fichiers volumineux." },

{ id:"b6-linux-01", lvl:6, dom:"Linux",
  q:"Un serveur a une charge CPU normale mais toutes les requêtes sont lentes. Le réseau semble bon. Quelles pistes ?",
  accept:["verrou","pool sature","gc","descripteurs","dependance lente","thread"],
  explain:"Chercher les points de sérialisation plutôt que la saturation : pool de connexions base ou HTTP saturé, verrou applicatif, pauses de garbage collector, descripteurs de fichiers épuisés, threads bloqués sur une dépendance lente, conntrack plein, ou throttling CPU du cgroup (visible dans <code>cpu.stat</code> : <code>nr_throttled</code>) alors que l'usage moyen paraît faible." },

{ id:"b6-linux-02", lvl:6, dom:"Linux",
  q:"Comment prouves-tu qu'un problème vient du réseau et non de l'application ?",
  must:[["tcpdump","capture","des deux cotes"],["latence","temps","curl","mesure"]],
  explain:"On isole par la mesure : <code>curl -w</code> décompose DNS / connect / TLS / première octet / total — si le TTFB est lent mais que connect est rapide, c'est l'application. Une capture <code>tcpdump</code> des deux côtés montre si le SYN arrive, si le SYN-ACK repart, s'il y a des retransmissions. Des retransmissions élevées (<code>ss -ti</code>, <code>netstat -s</code>) désignent le réseau ; leur absence l'innocente." },

{ id:"b6-linux-03", lvl:6, dom:"Linux",
  q:"Le serveur swappe massivement. Faut-il désactiver le swap ?",
  accept:["depend","kubernetes exige","cause racine","swappiness","memoire insuffisante"],
  explain:"Le swap n'est pas la cause, c'est le symptôme d'un manque de mémoire. Le désactiver transforme une lenteur en OOMKill franc — ce qui est parfois PRÉFÉRABLE (Kubernetes l'exigeait historiquement, pour que les limites soient prévisibles). La vraie réponse : identifier le consommateur, ajuster les limites ou la taille de la machine ; ajuster <code>vm.swappiness</code> n'est qu'un pansement." },

{ id:"b6-docker-01", lvl:6, dom:"Docker",
  q:"Le build Docker en CI est très lent alors qu'il est rapide en local. Pourquoi ?",
  accept:["pas de cache","runner ephemere","cache distant","telechargement","contexte"],
  explain:"Le runner est éphémère : aucun cache de couches local, tout est retéléchargé et reconstruit. Solutions : cache de build distant BuildKit (<code>--cache-from/--cache-to</code> vers le registry), image de base miroir interne, <code>.dockerignore</code> pour réduire le contexte envoyé, et ordonner le Dockerfile pour que les dépendances soient cachables. Vérifier aussi qu'on ne builde pas pour plusieurs plateformes sans le vouloir." },

{ id:"b6-docker-02", lvl:6, dom:"Docker",
  q:"Un conteneur consomme toute la mémoire de l'hôte alors qu'il a une limite. Comment est-ce possible ?",
  accept:["page cache","limite non appliquee","enfant","limite mal definie","hote"],
  explain:"Pistes : la limite n'a pas été appliquée (<code>--memory</code> oublié, ou en Kubernetes des limits absentes), le conteneur tourne en privileged ou partage un namespace, ou ce qu'on observe est du page cache imputé au cgroup mais récupérable. Vérifier les compteurs réels du cgroup (<code>memory.current</code>, <code>memory.max</code>) plutôt que la vue globale de l'hôte, qui mélange tout." },

{ id:"b6-tf-01", lvl:6, dom:"Terraform",
  q:"<code>terraform destroy</code> échoue en boucle sur une ressource. Quelles causes classiques ?",
  accept:["dependance externe","protection","lock","ressource creee hors terraform","timeout"],
  explain:"1) Une dépendance créée HORS Terraform s'accroche à la ressource (un endpoint dans un subnet, une ENI orpheline, un enregistrement DNS). 2) Une protection : deletion protection, resource lock Azure, <code>prevent_destroy</code>, politique de rétention. 3) Un ordre de destruction que Terraform ne connaît pas (dépendance implicite non exprimée). 4) Un timeout trop court. On lit l'erreur du provider, on nettoie la dépendance, on relance." },

{ id:"b6-tf-02", lvl:6, dom:"Terraform",
  q:"Deux équipes ont importé la même ressource dans deux states différents. Quel est le problème et comment tu le règles ?",
  accept:["deux sources de verite","conflit","state rm","une seule","ecrasement"],
  explain:"Deux states pensent gérer le même objet : chaque apply peut écraser la configuration de l'autre, et un destroy d'un côté supprime une ressource dont l'autre dépend. Résolution : décider d'un propriétaire unique, faire un <code>state rm</code> côté non-propriétaire, retirer le code correspondant, et exposer la valeur nécessaire via un output ou une data source. Prévention : découpage clair des périmètres et convention de propriété." },

{ id:"b6-tf-03", lvl:6, dom:"Terraform",
  q:"Le plan Terraform met 20 minutes sur un gros périmètre. Comment tu accélères ?",
  accept:["decouper le state","parallelism","refresh","cibler","trop de ressources"],
  explain:"Cause principale : trop de ressources dans un seul state, chaque refresh appelant l'API. Solutions durables : découper les states par domaine et cycle de vie. Palliatifs : ajuster <code>-parallelism</code> (attention au throttling API), <code>-refresh=false</code> quand on sait qu'il n'y a pas eu de dérive, et remplacer des data sources coûteuses par des valeurs figées. <code>-target</code> n'est pas une solution de routine." },

{ id:"b6-cicd-01", lvl:6, dom:"CI/CD",
  q:"Le même pipeline réussit sur une branche et échoue sur une autre. Quelles hypothèses ?",
  accept:["variables","secrets scopes","environnement protege","code different","runner"],
  explain:"1) Variables/secrets restreints à certaines branches ou environnements (le cas le plus fréquent : les secrets ne sont pas exposés aux branches non protégées ni aux forks). 2) Le code de la branche diffère réellement (dépendance, version). 3) Runner ou image de job différents. 4) Cache pollué propre à la branche. 5) Règles de protection qui ajoutent des étapes. On compare les deux exécutions ligne à ligne plutôt que de relancer." },

{ id:"b6-cicd-02", lvl:6, dom:"CI/CD",
  q:"Un déploiement a réussi mais l'ancienne version continue de servir du trafic. Que vérifies-tu ?",
  accept:["cache","cdn","rollout incomplet","endpoints","session persistante","replicaset"],
  explain:"1) Le rollout est-il vraiment terminé (<code>kubectl rollout status</code>) ou bloqué sur des Pods non Ready ? 2) Cache CDN ou navigateur non invalidé. 3) Sticky sessions qui maintiennent les clients sur d'anciens backends. 4) Un ancien ReplicaSet encore à réplicas > 0. 5) Deux Services/Ingress qui pointent vers des sélecteurs différents. 6) Une image taguée <code>latest</code> avec <code>imagePullPolicy: IfNotPresent</code> : le nœud garde l'ancienne image." },

{ id:"b6-aws-01", lvl:6, dom:"AWS",
  q:"Une Lambda échoue par intermittence avec des timeouts sur une base RDS. Quelles pistes ?",
  accept:["connexions","cold start","pool","rds proxy","concurrence"],
  explain:"Chaque environnement d'exécution Lambda ouvre sa propre connexion : sous forte concurrence, on épuise les connexions de la base. Solutions : RDS Proxy pour mutualiser, réutiliser la connexion hors du handler, plafonner la concurrence réservée, timeouts courts côté client. Vérifier aussi les ENI dans le VPC (cold start réseau) et les DNS de la base." },

{ id:"b6-aws-02", lvl:6, dom:"AWS",
  q:"Des objets S3 sont accessibles alors que le bucket est privé. Comment est-ce possible ?",
  accept:["acl d objet","presigned url","cloudfront","policy","proprietaire different"],
  explain:"1) Une ACL au niveau OBJET le rend public (d'où Block Public Access et Object Ownership « bucket owner enforced » qui désactivent les ACL). 2) Une URL pré-signée valide circule. 3) Une distribution CloudFront ou un autre service sert le contenu avec ses propres droits. 4) Une bucket policy plus permissive qu'on ne le croit (Principal <code>*</code> avec une condition mal écrite). CloudTrail et Access Analyzer tranchent." },

{ id:"b6-az-01", lvl:6, dom:"Azure",
  q:"Une VM Azure ne démarre plus après une modification. Quels outils de diagnostic ?",
  accept:["boot diagnostics","serial console","capture de disque","redeploy"],
  explain:"Boot diagnostics (capture d'écran de démarrage + logs série), Serial Console pour intervenir même sans réseau, attachement du disque OS à une VM saine pour réparer un fstab ou une config, <em>Redeploy</em> pour la migrer vers un autre hôte physique, ou restauration depuis un snapshot/sauvegarde. Réflexe préalable : toujours faire un snapshot du disque OS avant une modification risquée." },

{ id:"b6-az-02", lvl:6, dom:"Azure",
  q:"Les métriques d'une ressource Azure n'apparaissent pas dans Log Analytics. Pourquoi ?",
  accept:["diagnostic settings","categorie","pas active","destination","delai"],
  explain:"Les diagnostic settings ne sont pas activés sur la ressource, ou la bonne CATÉGORIE de log/métrique n'est pas cochée, ou la destination pointe vers un autre workspace. Ajouter aussi : le délai d'ingestion (plusieurs minutes), et le fait que les métriques de plateforme et les logs de ressource sont deux flux distincts. Correctif systémique : imposer les diagnostic settings par Azure Policy <code>DeployIfNotExists</code>." },

{ id:"b6-sec-01", lvl:6, dom:"Sécurité",
  q:"Tu découvres qu'un conteneur en production tourne en root avec le socket Docker monté. Quel est le risque et que fais-tu ?",
  accept:["evasion","controle de l hote","equivalent root","urgence","isoler"],
  explain:"Le socket Docker donne le contrôle du daemon : on peut lancer un conteneur privilégié qui monte <code>/</code> de l'hôte — c'est un root sur le nœud, et donc sur tous les conteneurs voisins. Actions : évaluer l'exposition et l'usage réel, isoler la charge, retirer le montage (utiliser une API dédiée ou un builder sans daemon comme Kaniko/Buildah), puis une politique d'admission qui interdit hostPath sur le socket et les conteneurs privilégiés." },

{ id:"b6-sec-02", lvl:6, dom:"Sécurité",
  q:"Un pipeline s'est mis à déployer en production sans approbation. Comment enquêtes-tu ?",
  must:[["journal","log","audit","historique"],["regle","protection","configuration","qui a modifie"]],
  explain:"1) Journal d'audit du forge : qui a modifié les règles de protection, les environnements ou les approbateurs, et quand. 2) Historique des exécutions : quel déclencheur, quelle identité, quel commit. 3) Vérifier un contournement (droit administrateur, workflow modifié dans la PR elle-même, self-approval). 4) Révoquer, restaurer les règles, puis post-mortem : le contrôle doit être non contournable, y compris par un admin." },

{ id:"b6-obs-01", lvl:6, dom:"Observabilité",
  q:"Les traces sont incomplètes : elles s'arrêtent au deuxième service. Pourquoi ?",
  accept:["propagation","contexte non transmis","header","instrumentation manquante","format"],
  explain:"Le contexte de trace n'est pas propagé : service non instrumenté, en-têtes <code>traceparent</code> non transmis par un client HTTP maison ou un proxy qui les filtre, format incompatible (B3 vs W3C) entre deux bibliothèques, ou passage par une file de messages sans injection du contexte dans les en-têtes du message. Vérifier aussi que l'échantillonnage n'est pas décidé différemment d'un service à l'autre." },

{ id:"b6-obs-02", lvl:6, dom:"Observabilité",
  q:"Prometheus consomme 40 Go de RAM et redémarre. Quelles causes et quelles actions ?",
  accept:["cardinalite","trop de series","retention","recording rule","federation"],
  explain:"Presque toujours la cardinalité : un label à valeurs illimitées a explosé le nombre de séries. Diagnostic : <code>topk</code> sur <code>count by (__name__)</code>, la page TSDB status, <code>prometheus_tsdb_head_series</code>. Actions : supprimer le label fautif (relabeling au scrape), réduire la rétention locale et déporter le long terme (Thanos, Mimir, Cortex), pré-agréger avec des recording rules, et poser des limites de séries par cible." },

{ id:"b6-sre-01", lvl:6, dom:"SRE",
  q:"Un incident est résolu mais reviendra sûrement. Comment traites-tu ça correctement ?",
  accept:["cause racine","action systemique","ticket","echeance","proprietaire"],
  explain:"On distingue la MITIGATION (fait) de la CORRECTION (à faire). Post-mortem avec chronologie et causes systémiques, actions concrètes avec un propriétaire nommé et une échéance, priorisées dans le backlog au même titre que les features — sinon elles n'existent pas. Et on ajoute une détection : si ça revient, l'alerte doit se déclencher avant les utilisateurs." },

{ id:"b6-sre-02", lvl:6, dom:"SRE",
  q:"Comment mènes-tu une analyse de cause racine sans tomber dans le « c'est la faute du dev » ?",
  accept:["5 pourquoi","facteurs contributifs","systeme","pourquoi c etait possible","barriere"],
  explain:"On demande « pourquoi c'était POSSIBLE » plutôt que « qui l'a fait ». Méthode des 5 pourquoi ou arbre des causes, en cherchant les facteurs contributifs multiples : absence de garde-fou, revue insuffisante, alerte manquante, documentation ambiguë, pression de délai. Une erreur humaine est toujours le DERNIER maillon d'une chaîne de défenses absentes — ce sont ces défenses qu'on ajoute." },

{ id:"b6-sql-01", lvl:6, dom:"SQL",
  q:"Une requête qui prenait 50 ms prend soudain 30 s sans changement de code. Que s'est-il passé ?",
  accept:["statistiques","plan change","volume","index supprime","parametre"],
  explain:"Le plan d'exécution a changé : statistiques périmées après une forte croissance de volume, index devenu inefficace ou supprimé, bind parameter sniffing (un plan mis en cache pour une valeur atypique), ou bascule d'un index scan vers un seq scan quand la sélectivité change. Diagnostic : comparer <code>EXPLAIN ANALYZE</code> avec l'ancien plan, relancer <code>ANALYZE</code>, vérifier la croissance de la table." },

{ id:"b6-res-01", lvl:6, dom:"Réseau",
  q:"Un service est joignable depuis un Pod mais pas depuis un autre, dans le même cluster. Que vérifies-tu ?",
  accept:["networkpolicy","namespace","dns","noeud","selecteur"],
  explain:"1) NetworkPolicy : une policy sélectionne-t-elle le Pod source ou destination (podSelector, namespaceSelector) ? 2) Le namespace d'origine et le FQDN utilisé. 3) Les deux Pods sont-ils sur des nœuds différents — auquel cas c'est le CNI ou une règle de sécurité inter-nœuds. 4) Résolution DNS depuis chaque Pod. 5) mTLS / service mesh : le sidecar est-il injecté des deux côtés ?" },

{ id:"b6-res-02", lvl:6, dom:"Réseau",
  q:"Les connexions vers une API externe échouent une fois sur dix. Comment tu diagnostiques ?",
  accept:["plusieurs ip","un backend en panne","dns round robin","retry","capture"],
  explain:"Un nom qui résout vers plusieurs IP dont une seule est défaillante donne exactement ce taux. On teste chaque IP individuellement (<code>curl --resolve</code>), on regarde si l'échec suit une IP précise. Autres pistes : conntrack saturé, pool NAT épuisé, MTU sur un chemin, ou throttling côté fournisseur. Un retry avec backoff masque le symptôme mais il faut identifier la cause avant de l'accepter." }

]);
