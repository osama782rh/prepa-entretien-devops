  must:[["notes de version","breaking change","api deprecie"],["recette","preprod","tester"],["node pool","progressif","par lot"]],
  explain:"1) Lire les notes de version et l'obsolescence des API ; scanner les manifestes (<code>pluto</code>, <code>kubent</code>). 2) Vérifier la compatibilité des addons (CNI, CSI, ingress, opérateurs, agents de sécurité). 3) Rejouer sur un cluster de recette identique. 4) Plan de contrôle d'abord, puis les node pools par lots avec surge, PDB en place et fenêtre annoncée. 5) Un saut de version mineure à la fois. 6) Plan de repli documenté et validation métier après chaque lot." },

{ id:"n9-k8s-02", lvl:9, dom:"Kubernetes",
  q:"Comment garantis-tu que seules des images approuvées peuvent tourner sur le cluster ?",
  must:[["admission","kyverno","gatekeeper","policy"],["signature","registry autorise","digest"]],
  explain:"Politique d'admission (Kyverno / OPA Gatekeeper) qui rejette toute image hors des registries approuvés, exige un digest plutôt qu'un tag mutable, et vérifie une signature Cosign contre une clé/identité de confiance. En amont : registry privé avec images de base durcies, scan bloquant en CI, et interdiction du pull depuis internet au niveau réseau. Le contrôle d'admission est la dernière barrière — il ne remplace pas la CI, il la rend non contournable." },

{ id:"n9-sec-01", lvl:9, dom:"Sécurité",
  q:"Comment conçois-tu la gestion des accès humains à la production ?",
  must:[["juste a temps","jit","temporaire","elevation"],["journal","audit","tracabilite"]],
  explain:"Accès juste-à-temps et temporaire (PIM Entra ID, AWS IAM Identity Center avec sessions courtes), avec justification, approbation et expiration automatique. Aucun compte permanent privilégié, MFA résistante au phishing, accès via bastion/Session Manager plutôt que SSH direct, enregistrement des sessions, et revues d'accès périodiques. L'objectif final : que l'accès humain direct devienne l'exception documentée, l'automatisation étant le chemin normal." },

{ id:"n9-sec-02", lvl:9, dom:"Sécurité",
  q:"Qu'est-ce que DORA (règlement européen) et pourquoi ça concerne un DevOps en banque ?",
  accept:["resilience operationnelle numerique","tiers","incident","test","2025"],
  explain:"Le Digital Operational Resilience Act, applicable depuis janvier 2025, impose au secteur financier européen : gestion du risque IT, notification des incidents majeurs dans des délais courts, tests de résilience (jusqu'aux tests de pénétration guidés par la menace), et surtout la surveillance des prestataires TIERS CRITIQUES — donc les fournisseurs cloud. Concrètement : registre des dépendances, stratégies de sortie, scénarios de bascule testés et documentés." },

{ id:"n9-data-01", lvl:9, dom:"Sécurité",
  q:"Quelles contraintes le RGPD impose-t-il à une architecture cloud, concrètement ?",
  must:[["localisation","residence","transfert"],["droit","effacement","minimisation","chiffrement"]],
  explain:"Localisation et encadrement des transferts hors UE, minimisation des données collectées, base légale et durée de conservation définies (donc des politiques de rétention réellement appliquées, y compris dans les logs et les sauvegardes), capacité à effacer et à exporter les données d'une personne, chiffrement et pseudonymisation, journalisation des accès, et notification d'une violation sous 72 h. Point sous-estimé : un ID utilisateur dans les logs et les backups est une donnée personnelle." },

{ id:"n9-arch-01", lvl:9, dom:"SRE",
  q:"Comment migres-tu une application legacy on-premise vers le cloud ? Cite la démarche et les stratégies possibles.",
  must:[["rehost","lift and shift"],["replatform","refactor","rearchitect"]],
  explain:"Inventaire et cartographie des dépendances d'abord, puis les 6R : Retire, Retain, Rehost (lift & shift, rapide mais aucun gain), Replatform (ajustements ciblés : base managée, conteneurisation), Repurchase (SaaS), Refactor (réécriture cloud-native, coûteux). Démarche : commencer par une application peu critique pour apprendre, pattern strangler pour découper progressivement, double run avec réversibilité, et migration des données planifiée avec sa fenêtre de bascule." },

{ id:"n9-arch-02", lvl:9, dom:"SRE",
  q:"Comment mesures-tu qu'une transformation DevOps réussit dans une organisation ?",
  must:[["dora","metrique","lead time","frequence"],["incident","qualite","satisfaction"]],
  explain:"Métriques DORA en tendance (fréquence, lead time, taux d'échec, MTTR), plus des indicateurs humains : temps passé en toil, charge d'astreinte et réveils nocturnes, satisfaction des développeurs, délai entre l'idée et le retour utilisateur. On évite les vanity metrics (nombre de pipelines, % de couverture). Une transformation qui accélère la livraison en épuisant les équipes n'est pas une réussite : elle est en dette." },

{ id:"n9-tf-01", lvl:9, dom:"Terraform",
  q:"Comment gères-tu la montée de version d'un provider majeur (ex : AzureRM v3 → v4) sur 40 states ?",
  must:[["notes de version","breaking change","changelog"],["progressif","par lot","non prod d abord"]],
  explain:"Lire le guide de migration et les breaking changes, épingler la version actuelle partout d'abord, faire un plan à blanc en non-prod pour mesurer l'impact réel (attention aux remplacements), corriger le code et les modules partagés, dérouler par lots en commençant par les périmètres à faible risque, avec un plan systématiquement relu par un humain. On ne monte JAMAIS un provider majeur sans plan préalable — le risque est la destruction/recréation silencieuse." },

{ id:"n9-tf-02", lvl:9, dom:"Terraform",
  q:"Comment fais-tu du Policy as Code sur l'infrastructure, et à quels moments ?",
  accept:["opa","conftest","sentinel","checkov","plan json","admission"],
  explain:"À trois moments complémentaires : 1) en CI sur le PLAN JSON (OPA/Conftest, Sentinel, Checkov) pour bloquer avant création — le moins cher. 2) À l'admission côté plateforme (Azure Policy deny, SCP AWS, Kyverno sur K8s) pour rendre le contrôle non contournable même hors pipeline. 3) En continu sur l'existant (Config, Defender for Cloud) pour détecter la dérive. La CI seule ne suffit pas : quelqu'un finira par agir hors pipeline." },

{ id:"n9-cicd-01", lvl:9, dom:"CI/CD",
  q:"Comment déploies-tu en production un vendredi à 16 h sans que ce soit une mauvaise idée ?",
  accept:["petits lots","rollback","feature flag","observabilite","progressif"],
  explain:"Ce n'est pas la date qui pose problème, c'est la confiance dans le processus : petits lots fréquents, déploiement progressif (canary) avec analyse automatique des métriques, feature flags pour découpler la mise en production de l'activation, rollback testé et rapide, observabilité qui détecte en minutes. Si on interdit le vendredi, c'est un aveu que le rollback n'est pas fiable — et c'est ÇA qu'il faut corriger. Nuance bancaire : les périodes de gel (clôture, arrêtés comptables) sont, elles, une contrainte métier légitime." },

{ id:"n9-cicd-02", lvl:9, dom:"CI/CD",
  q:"Quelle stratégie de branches et de versionnement recommandes-tu pour une plateforme partagée par 15 équipes ?",
  accept:["trunk based","semver","tags","branches courtes","compatibilite"],
  explain:"Trunk-based avec des branches de courte durée et intégration continue, versionnement sémantique des modules/templates partagés avec des tags immuables, dépréciation annoncée avant suppression (N-1 supporté), changelog et notes de migration. Les consommateurs épinglent une version et montent quand ils veulent, dans une fenêtre imposée. Ce qui casse une plateforme partagée, c'est le changement non versionné sur <code>main</code>." },

{ id:"n9-obs-01", lvl:9, dom:"Observabilité",
  q:"Comment construis-tu un SLO à partir de zéro pour une API critique ?",
  must:[["sli","indicateur","mesure"],["fenetre","periode","28","30 jours"],["budget d erreur","error budget"]],
  explain:"1) Identifier le parcours utilisateur critique. 2) Définir le SLI mesurable côté utilisateur (part de requêtes réussies sous 300 ms, mesurée au load balancer et non dans l'app). 3) Choisir une cible réaliste à partir de l'historique, pas un chiffre rond arbitraire. 4) Fenêtre glissante de 28-30 jours. 5) Dériver le budget d'erreur et les alertes de burn rate multi-fenêtres. 6) Faire VALIDER la cible par le métier — un SLO que le métier n'assume pas ne sert à rien." },

{ id:"n9-obs-02", lvl:9, dom:"Observabilité",
  q:"Pourquoi 99,99 % de disponibilité peut être un objectif déraisonnable ? Chiffre-le.",
  accept:["52 minutes","4 minutes par mois","cout","dependances","astreinte"],
  explain:"99,99 % = ~52 min d'indisponibilité par AN, soit ~4 min par mois : moins que le temps de détection humaine. Ça impose de l'automatisation totale de la bascule, du multi-région, une astreinte 24/7 et des dépendances au moins aussi fiables — or les SLA des services managés sous-jacents sont souvent à 99,9 %. On ne peut pas être plus fiable que la somme de ses dépendances : c'est l'argument à sortir quand un métier demande « du 100 % »." },

{ id:"n9-aws-01", lvl:9, dom:"AWS",
  q:"Comment centralises-tu la sécurité et les logs sur une organisation de 100 comptes AWS ?",
  must:[["compte dedie","log archive","centralise"],["organization","delegated","agrege"]],
  explain:"Comptes dédiés Log Archive et Security. CloudTrail organisationnel avec un trail unique vers un bucket centralisé immuable (Object Lock), VPC Flow Logs et logs de service agrégés, GuardDuty / Security Hub / Config activés par l'organisation avec un administrateur délégué, SCP interdisant de désactiver la journalisation, et alertes remontant à un SIEM unique. Point clé : le compte de logs doit être inaccessible en écriture aux comptes producteurs." },

{ id:"n9-az-01", lvl:9, dom:"Azure",
  q:"Comment appliques-tu une exigence de résidence des données « France uniquement » sur tout un tenant Azure ?",
  must:[["azure policy","allowed locations","deny"],["management group","niveau superieur"]],
  explain:"Initiative Azure Policy « Allowed locations » (et sa variante pour les resource groups) en mode Deny, assignée au niveau MANAGEMENT GROUP pour couvrir toutes les subscriptions présentes et futures, avec exemptions nominatives et datées pour les services globaux qui n'ont pas de notion de région. On complète par un contrôle de conformité continu, l'attention aux réplications géo (GRS vers la région appairée) et aux logs/sauvegardes qui peuvent sortir du périmètre sans qu'on y pense." }

]);

</script>
<script>
/* data/niveau09b.js */
window.QBANK = (window.QBANK || []).concat([
/* ============ NIVEAU 9 — SÉRIE B ============ */

{ id:"b9-gov-01", lvl:9, dom:"Sécurité",
  q:"Qu'est-ce qu'un compte break-glass et comment le gères-tu ?",
  accept:["urgence","secours","scelle","surveille","hors fédération"],
  explain:"Un compte d'urgence à privilèges maximaux, utilisable quand l'authentification normale est cassée (panne de l'IdP, verrouillage MFA généralisé). Gestion : identifiants scellés et stockés physiquement, exclus de la fédération et des accès conditionnels, MFA matérielle dédiée, alerte immédiate à toute utilisation, test périodique de validité, et procédure de rotation après usage. Sans ce compte, une panne d'identité devient une panne totale sans possibilité d'intervention." },

{ id:"b9-gov-02", lvl:9, dom:"Sécurité",
  q:"Comment démontres-tu à un auditeur que seules des personnes habilitées ont accès à la production ?",
  must:[["revue d acces","liste","inventaire"],["journal","preuve","trace","approbation"]],
  explain:"Inventaire des accès généré depuis la source de vérité (groupes Entra/IAM Identity Center), revues d'accès périodiques signées par les responsables, preuve que l'attribution passe par une demande approuvée et tracée, journal des élévations juste-à-temps, et enregistrement des sessions. Le point qui convainc : montrer que l'accès EXPIRE automatiquement, donc qu'il n'y a pas de droits résiduels accumulés." },

{ id:"b9-gov-03", lvl:9, dom:"Sécurité",
  q:"Qu'est-ce qu'un registre des traitements et un registre des dépendances tierces ? Pourquoi un DevOps est concerné ?",
  accept:["rgpd","dora","inventaire","fournisseur","donnees"],
  explain:"Le registre des traitements (RGPD) documente quelles données personnelles sont traitées, où, pourquoi et combien de temps. Le registre des dépendances tierces (DORA) recense les prestataires critiques, dont les fournisseurs cloud et SaaS. Le DevOps est concerné parce que c'est lui qui SAIT où vont réellement les données (logs, sauvegardes, régions, sous-traitants du SaaS) — et que ces registres doivent refléter la réalité technique, pas une intention." },

{ id:"b9-dr-01", lvl:9, dom:"SRE",
  q:"Comment testes-tu un plan de reprise sans impacter la production ?",
  accept:["exercice","environnement isole","game day","bascule partielle","annonce"],
  explain:"Par paliers : (1) test de restauration technique dans un environnement isolé, chronométré ; (2) exercice sur table (game day) avec les équipes, sur un scénario écrit ; (3) bascule réelle d'un composant non critique ; (4) bascule complète planifiée en fenêtre annoncée, avec critères de succès et procédure de retour. Chaque palier produit des écarts documentés. Un plan de reprise jamais exercé est une hypothèse, pas un plan." },

{ id:"b9-dr-02", lvl:9, dom:"SRE",
  q:"Ta région primaire est perdue et tu bascules. Quelles sont les trois choses qu'on oublie systématiquement ?",
  must:[["dns","ttl","bascule"],["secret","cle","certificat","quota"]],
  explain:"1) Le DNS : TTL trop long, ou l'automatisation de bascule qui dépend d'un composant de la région perdue. 2) Les secrets, clés KMS et certificats : régionaux, non répliqués — l'application démarre mais ne peut rien déchiffrer. 3) Les quotas et la capacité réellement disponible dans la région de secours. Et souvent une quatrième : le pipeline de déploiement lui-même hébergé dans la région tombée." },

{ id:"b9-dr-03", lvl:9, dom:"SRE",
  q:"Comment protèges-tu une plateforme contre un ransomware ? Cite la chaîne complète.",
  must:[["sauvegarde immuable","hors ligne","isole"],["segmentation","moindre privilege","laterale"]],
  explain:"Prévention : durcissement, patching, MFA, moindre privilège, segmentation réseau pour limiter le mouvement latéral, contrôle applicatif. Détection : EDR, détection de comportements anormaux, alertes sur les suppressions massives. Résilience : sauvegardes immuables dans un compte/tenant séparé, hors de portée des identités de production, avec MFA delete et rétention verrouillée. Reprise : procédure de restauration testée, et capacité à reconstruire l'infrastructure depuis l'IaC plutôt que de restaurer des machines potentiellement infectées." },

{ id:"b9-cost-01", lvl:9, dom:"SRE",
  q:"Comment mets-tu en place une refacturation (chargeback) crédible des coûts cloud ?",
  must:[["tag","etiquetage","obligatoire"],["compte","subscription","separation"]],
  explain:"Deux leviers combinés : une séparation structurelle (un compte/subscription par équipe ou application — la répartition est alors native et incontestable) et un tagging obligatoire imposé par policy pour ce qui reste mutualisé. Ensuite : règles d'allocation des coûts partagés (cluster mutualisé, réseau, outillage) définies et acceptées à l'avance, rapports mensuels par équipe, et un propriétaire budgétaire nommé. Sans propriétaire, aucun rapport ne change quoi que ce soit." },

{ id:"b9-cost-02", lvl:9, dom:"SRE",
  q:"Le coût d'un cluster Kubernetes mutualisé explose. Comment identifies-tu qui consomme ?",
  accept:["kubecost","opencost","par namespace","requests","allocation"],
  explain:"On alloue le coût des nœuds aux workloads au prorata des <b>requests</b> (OpenCost/Kubecost), par namespace, label d'équipe ou déploiement. On repère alors les classiques : requests surdimensionnées « au cas où » qui réservent sans consommer, environnements de test jamais éteints, jobs oubliés, volumes orphelins. La correction passe par des ResourceQuota, du rightsizing basé sur l'usage réel (VPA en mode recommandation) et une visibilité rendue aux équipes." },

{ id:"b9-k8s-01", lvl:9, dom:"Kubernetes",
  q:"Comment gères-tu le cycle de vie des CRD et des opérateurs tiers dans un cluster de production ?",
  must:[["version","compatibilite","upgrade"],["sauvegarde","donnees","suppression"]],
  explain:"Traiter un opérateur comme une dépendance critique : version épinglée, compatibilité vérifiée avec la version de K8s cible avant chaque upgrade, sauvegarde des ressources personnalisées (ce sont des données), et attention à la suppression — supprimer une CRD supprime TOUTES ses instances, donc potentiellement les ressources cloud qu'elles pilotaient. Ajouter une revue de sécurité : un opérateur demande souvent des droits cluster très larges." },

{ id:"b9-k8s-02", lvl:9, dom:"Kubernetes",
  q:"Comment justifies-tu auprès d'un RSSI que Kubernetes est déployable en environnement bancaire ?",
  must:[["rbac","admission","policy","controle"],["reseau","networkpolicy","isolation","chiffrement"]],
  explain:"En traduisant chaque exigence en contrôle technique : RBAC et identités de charge de travail sans secret, admission policies qui rendent les règles non contournables, Pod Security restricted, NetworkPolicy default-deny et chiffrement en transit, secrets externalisés dans un coffre, images signées depuis un registry interne, journalisation d'audit exportée vers le SIEM, détection au runtime, et clusters séparés prod/hors-prod. Le message : Kubernetes est un plan de contrôle AUDITABLE, plus contrôlable qu'un parc de VM administrées à la main." },

{ id:"b9-arch-01", lvl:9, dom:"SRE",
  q:"Comment conduis-tu la migration d'un monolithe critique sans big bang ?",
  accept:["strangler","progressif","facade","routage","coexistence"],
  explain:"Pattern strangler fig : on place une façade (passerelle) devant le monolithe, on extrait un domaine à la fois vers un nouveau service, et on route progressivement le trafic de ce domaine vers le nouveau. Les deux coexistent le temps nécessaire, avec double écriture ou synchronisation des données puis bascule. Chaque étape est réversible. On commence par un domaine périphérique à faible risque pour valider la mécanique, jamais par le cœur métier." },

{ id:"b9-arch-02", lvl:9, dom:"SRE",
  q:"Comment gères-tu la coexistence de données entre l'ancien et le nouveau système pendant une migration ?",
  must:[["double ecriture","synchronisation","cdc","replication"],["source de verite","reconciliation","controle"]],
  explain:"On désigne une SOURCE DE VÉRITÉ unique à chaque instant, et on synchronise l'autre (double écriture applicative, ou capture de changements CDC). On ajoute une réconciliation automatique qui compare les deux et alerte sur les écarts — c'est ce qui manque dans la plupart des migrations ratées. Puis on bascule la source de vérité par domaine, avec une fenêtre de retour arrière définie, et on ne coupe l'ancien qu'après une période d'observation." },

{ id:"b9-cicd-01", lvl:9, dom:"CI/CD",
  q:"Comment concilies-tu déploiement continu et périodes de gel réglementaires ?",
  accept:["feature flag","decoupler","hotfix encadre","calendrier","preparer"],
  explain:"On découple déploiement et activation : le code part en production en continu, désactivé par feature flag, et l'activation métier respecte le calendrier. On maintient un chemin d'urgence documenté (correctif de sécurité ou incident) avec approbation renforcée. On utilise la période de gel pour ce qui ne touche pas la production (dette, tests, préparation). Et on l'annonce dans le pipeline pour éviter les surprises." },

{ id:"b9-cicd-02", lvl:9, dom:"CI/CD",
  q:"Comment garantis-tu la réversibilité d'un déploiement au sens réglementaire ?",
  must:[["rollback","retour arriere","procedure"],["teste","demontre","exercice"]],
  explain:"Une procédure de retour arrière DOCUMENTÉE, automatisée et TESTÉE régulièrement (pas seulement décrite) : artefact précédent conservé et immédiatement redéployable, migrations rétrocompatibles, données restaurables au point de bascule, et un temps de retour arrière mesuré. L'auditeur ne demandera pas si vous pouvez revenir en arrière : il demandera quand vous l'avez démontré pour la dernière fois, et avec quel chronomètre." },

{ id:"b9-sec-01", lvl:9, dom:"Sécurité",
  q:"Comment organises-tu la gestion des vulnérabilités à l'échelle d'un parc de 300 applications ?",
  must:[["inventaire","sbom","cartographie"],["priorisation","criticite","exposition","sla"]],
  explain:"1) Inventaire fiable : SBOM par artefact, cartographie composant → application → criticité métier → exposition. 2) Priorisation par risque réel (exploitabilité KEV/EPSS, exposition, présence dans le chemin d'exécution) et non par volume de CVE. 3) Délais de remédiation contractualisés par niveau de criticité. 4) Correction à la source (image de base, bibliothèque partagée) plutôt que 300 correctifs unitaires. 5) Tableau de bord suivi par la direction, avec les exceptions datées." },

{ id:"b9-sec-02", lvl:9, dom:"Sécurité",
  q:"Une CVE critique sort sur une bibliothèque très utilisée. Décris ta réponse dans les 24 heures.",
  must:[["identifier","sbom","ou est-elle","inventaire"],["prioriser","exposition","patcher","mitiger"]],
  explain:"Heure 0-2 : déterminer si on est concerné, où, et quelles applications sont exposées à internet — c'est ce que permet un SBOM à jour (sinon on passe la journée à chercher). Heure 2-6 : mitigation temporaire si un correctif n'existe pas (règle WAF, désactivation de fonctionnalité, restriction réseau). Heure 6-24 : correction de l'image de base ou de la dépendance partagée, rebuild et redéploiement par ordre d'exposition, vérification. Puis communication interne et post-mortem sur le délai de détection." },

{ id:"b9-obs-01", lvl:9, dom:"Observabilité",
  q:"Comment fixes-tu la rétention des logs en environnement bancaire ?",
  must:[["obligation","reglementaire","duree legale"],["cout","chaud","froid","archive"]],
  explain:"On part des obligations : certaines traces (audit, transactions, accès) ont une durée légale de conservation qui peut aller à plusieurs années, tandis que le RGPD impose au contraire de ne PAS conserver indéfiniment des données personnelles. On distingue donc les catégories, puis on applique une rétention par palier : chaud et requêtable quelques jours à semaines, froid moins cher pour quelques mois, archive immuable pour le légal. Et on documente la politique — c'est elle que l'auditeur lit." },

{ id:"b9-obs-02", lvl:9, dom:"Observabilité",
  q:"Comment définis-tu des SLO pour une plateforme interne (le cluster, le pipeline) et pas pour une application ?",
  accept:["utilisateur interne","disponibilite de l api","temps de build","developpeur"],
  explain:"Les utilisateurs sont les équipes internes, donc les SLI portent sur ce qu'elles subissent : disponibilité de l'API du cluster, temps entre un merge et la disponibilité en recette, taux de succès des pipelines hors erreurs applicatives, délai de provisionnement d'un environnement. C'est ce qui transforme une équipe plateforme en fournisseur de service mesurable — et ce qui permet d'arbitrer entre nouvelles fonctionnalités et fiabilité du socle." },

{ id:"b9-tf-01", lvl:9, dom:"Terraform",
  q:"Comment gères-tu les secrets qui finissent dans le state, à l'échelle d'une organisation ?",
  must:[["chiffrement","backend","kms","acces restreint"],["ne pas faire transiter","generer dans le coffre","reference"]],
  explain:"Deux axes. Protection : backend chiffré avec une clé gérée, accès limité aux seules identités de pipeline, journalisation des lectures, versioning. Évitement : ne pas faire transiter le secret par Terraform — le générer directement dans le coffre (ou via <code>random_password</code> écrit dans le coffre et jamais ressorti en output), et ne référencer que son identifiant. Politique organisationnelle : interdire les outputs sensibles et scanner les states." },

{ id:"b9-tf-02", lvl:9, dom:"Terraform",
  q:"Comment appliques-tu la séparation des tâches sur un pipeline Terraform ?",
  must:[["identite plan","lecture","identite apply","ecriture"],["approbation","revue","environnement protege"]],
  explain:"Deux identités distinctes : le job de plan n'a que des droits de LECTURE (il tourne sur du code non encore revu, y compris des forks), le job d'apply a les droits d'écriture et ne se déclenche qu'après merge et approbation d'un environnement protégé. Le plan appliqué est celui qui a été revu (fichier sauvegardé), personne ne peut approuver son propre changement, et tout est journalisé de façon immuable." },

{ id:"b9-aws-01", lvl:9, dom:"AWS",
  q:"Comment conçois-tu une stratégie de sortie (exit strategy) d'AWS, au sens DORA ?",
  must:[["portabilite","standard","conteneur","iac"],["donnees","export","reversibilite"]],
  explain:"Documenter les dépendances aux services propriétaires et leur criticité, privilégier des standards portables sur le chemin critique (conteneurs, PostgreSQL, S3-compatible, OpenTelemetry), garder l'infrastructure décrite en IaC, garantir l'exportabilité des données dans un format ouvert avec un délai mesuré, et estimer le coût et le délai réels d'une migration. Le régulateur ne demande pas d'être multi-cloud : il demande de savoir COMMENT on sortirait, en combien de temps et à quel prix." },

{ id:"b9-az-01", lvl:9, dom:"Azure",
  q:"Comment structures-tu les management groups pour une banque avec filiales et contraintes pays ?",
  must:[["hierarchie","par entite","par pays","par environnement"],["policy","heritage","exemption"]],
  explain:"Racine avec les policies non négociables du groupe (régions autorisées, chiffrement, journalisation), puis un niveau par entité/pays pour les contraintes locales de souveraineté, puis par environnement (prod / hors-prod) pour la rigueur différenciée. Les policies s'héritent et se cumulent ; les dérogations locales passent par des exemptions datées à un niveau bas. Éviter une hiérarchie trop profonde : elle devient impossible à raisonner et à déboguer." },

{ id:"b9-sql-01", lvl:9, dom:"SQL",
  q:"Comment gères-tu la conservation et la purge de données personnelles dans une base et ses sauvegardes ?",
  must:[["duree de conservation","purge","politique"],["sauvegarde","backup","rotation","anonymisation"]],
  explain:"Politique de rétention par catégorie de données, purge ou anonymisation automatisée en base (jobs planifiés, partitionnement par date qui permet de dropper une partition entière). Pour les sauvegardes : on ne réécrit pas une sauvegarde — on s'appuie sur leur rotation naturelle, avec une durée de rétention alignée sur la politique, et on documente que la donnée disparaît au plus tard à l'expiration du dernier jeu. Le droit à l'effacement doit être traité de bout en bout, logs et réplicas compris." },

{ id:"b9-sre-01", lvl:9, dom:"SRE",
  q:"Comment convaincs-tu une direction d'investir dans la fiabilité plutôt que dans de nouvelles fonctionnalités ?",
  must:[["chiffrer","cout","incident","euro"],["velocite","ralentit","dette","donnee"]],
  explain:"On parle en euros et en vélocité, pas en technique : coût des incidents de l'année (temps passé × coût, pertes, pénalités), part de la capacité de l'équipe consommée par le toil et les incidents plutôt que par les features, et corrélation entre instabilité et ralentissement des livraisons (métriques DORA). Puis on propose un investissement borné avec un résultat mesurable. L'error budget rend cet arbitrage automatique et dépassionné." },

{ id:"b9-sre-02", lvl:9, dom:"SRE",
  q:"Comment mesures-tu si une équipe est en surcharge opérationnelle avant qu'elle ne craque ?",
  must:[["astreinte","reveil","interruption","alerte"],["temps passe","toil","ratio"]],
  explain:"Indicateurs suivis dans le temps : nombre d'alertes hors heures et de réveils par tour d'astreinte, ratio temps passé en interruptions/toil vs travail planifié, délai moyen de traitement des demandes entrantes, taux d'absentéisme et rotation des personnes. Seuils définis à l'avance déclenchant une action (renfort, gel des nouveautés, chantier d'automatisation). Attendre le burn-out pour réagir, c'est déjà avoir perdu la compétence." }

]);

</script>
<script>
/* data/niveau10.js */
window.QBANK = (window.QBANK || []).concat([
/* ========== NIVEAU 10 — ENTRETIEN SENIOR : ARBITRAGES & CONTRADICTION ========== */

{ id:"n10-01", lvl:10, dom:"SRE",
  q:"« Votre solution est trop complexe pour notre équipe. » Comment tu réagis en entretien quand un chef attaque ta proposition ?",
  accept:["je demande le contexte","je reformule","alternative","assume","arbitrage"],
  explain:"On ne défend pas son ego : on reformule la contrainte (« la complexité vous inquiète sur l'exploitabilité ou sur la montée en compétence ? »), on reconnaît ce qui est vrai, et on propose une version dégradée assumée avec ce qu'on perd. Un senior cherche à voir si tu SAIS ARBITRER, pas si tu as raison. La pire réponse est de camper ou de céder immédiatement sans argument." },

{ id:"n10-02", lvl:10, dom:"SRE",
  q:"On te demande « quelle est la première chose que tu fais en arrivant sur une plateforme que tu ne connais pas ? »",
  accept:["comprendre","cartographier","ecouter","observer","ne rien changer"],
  explain:"Écouter et cartographier avant de toucher : quels services, quels flux critiques, quels incidents récents, où est la douleur des équipes, qu'est-ce qui réveille les gens la nuit. Puis identifier les risques immédiats (sauvegardes non testées, secrets en clair, absence de rollback) et poser des quick wins mesurables. Arriver en imposant sa stack est le signal d'alarme numéro un pour un chef d'équipe." },

{ id:"n10-03", lvl:10, dom:"Kubernetes",
  q:"« On veut Kubernetes. » Quelles questions poses-tu avant de dire oui ?",
  must:[["besoin","pourquoi","probleme"],["equipe","competence","qui exploite"]],
  explain:"Quel problème cherche-t-on à résoudre (scaling, densité, portabilité, standardisation) ? Combien de services, quel volume ? Qui exploite le cluster à 3 h du matin et avec quelle compétence ? Quelles contraintes réglementaires ? Quelle alternative plus simple a été écartée (App Service, ECS, Container Apps) et pourquoi ? Kubernetes est un coût opérationnel permanent qu'il faut justifier — dire ça posément marque des points." },

{ id:"n10-04", lvl:10, dom:"Terraform",
  q:"Un architecte te dit : « le state Terraform, c'est un point de défaillance unique, on ne veut pas de ça en prod ». Que réponds-tu ?",
  accept:["backend redonde","versioning","sauvegarde","reconstruction par import","risque gere"],
  explain:"C'est un risque RÉEL mais géré : backend managé et répliqué (S3 avec versioning + réplication, Storage Account GRS), verrouillage, chiffrement, accès restreint, sauvegardes et restauration testées, et en dernier recours reconstruction par import. Le vrai point de défaillance unique, c'est l'infrastructure non décrite que personne ne sait recréer. On ne nie pas l'objection : on montre les contrôles." },

{ id:"n10-05", lvl:10, dom:"CI/CD",
  q:"« Chez nous on met en prod une fois par trimestre, et ça marche très bien. » Comment argumentes-tu sans braquer ?",
  accept:["taille du lot","risque","dora","rollback","progressif"],
  explain:"On ne dit pas « c'est archaïque ». On pointe le coût caché : un lot trimestriel contient des centaines de changements, donc en cas d'incident on ne sait pas lequel accuse, le rollback annule tout, et la charge de test est massive. Les données DORA montrent que la fréquence RÉDUIT le taux d'échec. Puis on propose un chemin progressif : découpler déploiement et activation (feature flags), automatiser les tests, viser mensuel avant hebdomadaire." },

{ id:"n10-06", lvl:10, dom:"Sécurité",
  q:"Le RSSI refuse tout accès sortant internet depuis les nœuds Kubernetes. Comment fais-tu tourner la plateforme ?",
  must:[["registry interne","miroir","proxy"],["private endpoint","endpoint prive","liaison privee"]],
  explain:"Registry privé miroir pour les images (et un miroir des dépôts de paquets/modules), proxy sortant autorisé par liste blanche de FQDN pour ce qui doit vraiment sortir, endpoints privés vers les services managés (registry, coffre, stockage, API du plan de contrôle), et CA d'entreprise injectée dans les images pour l'inspection TLS. C'est standard en banque : la question teste si tu as déjà travaillé en environnement contraint." },

{ id:"n10-07", lvl:10, dom:"Sécurité",
  q:"Un développeur a besoin d'un accès prod « juste pour 10 minutes » pour débloquer un incident client. Que fais-tu ?",
  accept:["acces temporaire","jit","approbation","enregistre","tracé"],
  explain:"On ne refuse pas et on ne donne pas un accès permanent : élévation juste-à-temps avec approbation, périmètre minimal, expiration automatique, session enregistrée, et un ticket rattaché à l'incident. Puis, en post-mortem : pourquoi l'observabilité n'a pas suffi à diagnostiquer sans accès ? L'accès prod récurrent est un symptôme d'outillage insuffisant, pas un besoin légitime durable." },

{ id:"n10-08", lvl:10, dom:"SRE",
  q:"Raconte un incident que tu as géré : quelle structure de réponse en entretien ?",
  must:[["contexte","situation"],["action","ce que j ai fait"],["resultat","apprentissage","ce que j ai change"]],
  explain:"Structure STAR resserrée : contexte et impact chiffré → ce que j'ai fait ET comment j'ai décidé (hypothèses testées, pourquoi j'ai mitigé avant de comprendre) → résultat mesuré → ce que j'ai changé DURABLEMENT ensuite. Les seniors écoutent surtout la dernière partie : un candidat qui ne tire pas d'action systémique d'un incident rejouera le même incident chez eux." },

{ id:"n10-09", lvl:10, dom:"SRE",
  q:"« Quelle est la dernière fois où tu t'es trompé techniquement ? » Pourquoi cette question, et comment y répondre ?",
  accept:["honnetete","apprentissage","je reconnais","ce que j ai change"],
  explain:"Elle teste la lucidité et la sécurité psychologique : quelqu'un qui n'a jamais tort ne rapportera pas ses erreurs en production. Réponse efficace : une vraie erreur technique avec impact réel, comment tu l'as détectée et assumée, et le garde-fou que tu as mis en place après. À éviter absolument : la fausse humilité (« je suis trop perfectionniste ») et l'erreur d'un collègue déguisée." },

{ id:"n10-10", lvl:10, dom:"AWS",
  q:"Conçois en 5 minutes une plateforme de paiement à 10 000 transactions/seconde. Par où commences-tu ?",
  must:[["exigence","question","clarifier"],["idempotence","coherence","transaction"]],
  explain:"D'abord CLARIFIER : pic ou soutenu ? latence acceptable ? cohérence forte obligatoire (oui pour du paiement) ? contraintes réglementaires et de traçabilité ? Ensuite : découpler par file avec idempotence stricte (clé d'idempotence pour ne jamais débiter deux fois), écriture durable avant acquittement, base transactionnelle partitionnée, event sourcing/journal immuable pour l'audit, back-pressure et dégradation contrôlée. Commencer à dessiner sans poser de questions est éliminatoire." },

{ id:"n10-11", lvl:10, dom:"SRE",
  q:"Idempotence : pourquoi est-ce LE concept central d'un système financier distribué ?",
  accept:["rejouer sans effet","une seule fois","cle d idempotence","doublon","retry"],
  explain:"Dans un système distribué, on ne sait jamais si un appel a échoué ou si c'est la réponse qui s'est perdue — donc on retente. Sans idempotence, un retry débite deux fois. On l'implémente avec une clé d'idempotence fournie par le client, stockée avec le résultat : un second appel avec la même clé renvoie le résultat initial sans réexécuter. C'est le fondement des sémantiques « exactly-once » observables." },

{ id:"n10-12", lvl:10, dom:"Kubernetes",
  q:"Trois chefs te contredisent en même temps sur un choix technique. Que fais-tu ?",
  accept:["ecouter","clarifier le critere","donnees","test","decision reversible"],
  explain:"On ramène le débat sur les CRITÈRES plutôt que sur les opinions : « on optimise pour quoi — le time-to-market, le coût d'exploitation, ou la conformité ? ». Puis on propose de trancher par la donnée (un POC borné, un test de charge) et on distingue décision réversible (on essaie vite) de décision irréversible (on prend le temps). Rester calme et structurer le désaccord est exactement ce qui est évalué." },

{ id:"n10-13", lvl:10, dom:"Terraform",
  q:"« Pourquoi l'IaC plutôt que des scripts ou la console ? » Réponds comme à un directeur, pas à un dev.",
  accept:["auditable","reproductible","revue","tracabilite","reduction du risque"],
  explain:"Langage direction : réduction du risque opérationnel (tout changement est revu, tracé et rejouable), reprise après sinistre (on reconstruit une région en heures au lieu de semaines), conformité et preuve d'audit intégrées, réduction de la dépendance aux personnes, et vitesse de livraison. Le coût — formation et discipline — est réel et doit être annoncé. Parler de HCL et de state à un directeur est une erreur de registre." },

{ id:"n10-14", lvl:10, dom:"Observabilité",
  q:"Comment convaincs-tu d'investir dans l'observabilité alors qu'« il n'y a pas d'incident en ce moment » ?",
  accept:["mttr","cout d un incident","temps de diagnostic","chiffrer","assurance"],
  explain:"On chiffre : temps moyen passé à diagnostiquer par incident × coût horaire de l'équipe × nombre d'incidents, plus le coût métier d'une minute d'indisponibilité. On montre les incidents où on a « redémarré sans comprendre ». On propose un pilote mesurable sur un service critique avec un objectif de MTTR. L'argument gagnant n'est jamais technique : c'est le temps de diagnostic transformé en euros." },

{ id:"n10-15", lvl:10, dom:"Sécurité",
  q:"On te demande de mettre en prod quelque chose que tu juges dangereux. Comment tu gères ?",
  accept:["expliquer le risque","ecrit","alternative","decision assumee","escalade"],
  explain:"1) Expliquer le risque concrètement (scénario, impact, probabilité), pas en termes moraux. 2) Proposer une alternative ou une mitigation qui permet d'avancer. 3) Si la décision est maintenue, la faire acter par écrit par la personne qui l'assume, avec un plan de remédiation daté. 4) Escalader seulement si l'enjeu est majeur. Ce qui est évalué : savoir alerter sans bloquer, et accepter qu'on n'est pas le décideur final." },

{ id:"n10-16", lvl:10, dom:"CI/CD",
  q:"Comment introduis-tu le GitOps dans une organisation qui déploie via des tickets et des opérateurs manuels ?",
  accept:["progressif","un service pilote","co-construction","preuve","conserver l approbation"],
  explain:"On ne supprime pas le contrôle, on le déplace : l'approbation devient une PR approuvée, le ticket reste comme trace, l'opérateur devient garant du pipeline. On commence par un service pilote non critique, on démontre le rollback et l'audit à l'équipe risque, on documente la traçabilité pour les auditeurs, puis on étend. Imposer l'outil avant d'avoir traité la question du contrôle échoue systématiquement en banque." },

{ id:"n10-17", lvl:10, dom:"SRE",
  q:"Quelle est la différence entre un bon et un mauvais runbook ?",
  accept:["actionnable","teste","a jour","decision","pas juste des commandes"],
  explain:"Un bon runbook part du SYMPTÔME observé, donne les commandes exactes à exécuter, indique comment vérifier l'effet, précise quand escalader et à qui, et il a été TESTÉ par quelqu'un qui n'est pas l'auteur — idéalement pendant un exercice. Un mauvais runbook décrit l'architecture, date de deux ans, suppose un contexte implicite et renvoie vers une page qui n'existe plus." },

{ id:"n10-18", lvl:10, dom:"Réseau",
  q:"Un flux entre deux applications ne passe pas et quatre équipes se renvoient la balle. Comment tu tranches ?",
  must:[["couche par couche","methodique","isoler"],["test","preuve","capture","telnet","tcpdump"]],
  explain:"On produit des PREUVES au lieu d'arguments : résolution DNS depuis la source, test TCP sur le port (<code>nc -zv</code>), capture des deux côtés (<code>tcpdump</code>) pour voir si le SYN arrive et si le SYN-ACK repart, lecture des flow logs. Ça localise le point exact de rupture et met fin au débat. La compétence évaluée est autant méthodologique que politique : ramener une discussion à des faits vérifiables." },

{ id:"n10-19", lvl:10, dom:"Kubernetes",
  q:"Le cluster va bien, les métriques sont vertes, mais les utilisateurs se plaignent. Comment procèdes-tu ?",
  accept:["mesurer cote utilisateur","bout en bout","synthetique","hors du cluster","cdn dns"],
  explain:"Le problème est presque toujours en dehors du périmètre observé : DNS, CDN, WAF, certificat, réseau opérateur, client mobile, ou un endpoint particulier noyé dans les moyennes. On mesure depuis le POINT DE VUE UTILISATEUR (tests synthétiques externes, RUM), on segmente (région, version de client, endpoint), et on remonte le chemin. « Mes dashboards sont verts » n'est jamais une réponse acceptable face à des utilisateurs qui souffrent." },

{ id:"n10-20", lvl:10, dom:"SRE",
  q:"Quelles questions poses-tu, TOI, à la fin de l'entretien ? Pourquoi ça compte ?",
  accept:["astreinte","incident","dette","organisation","autonomie","roadmap"],
  explain:"Des questions qui montrent que tu penses en exploitant : comment se passe l'astreinte et à quelle fréquence ça sonne ? Quel a été le dernier incident majeur et qu'est-ce qui a changé après ? Quelle est la plus grosse dette technique assumée ? Quelle autonomie a l'équipe pour mettre en prod ? Qu'attendez-vous de cette personne dans 6 mois ? Ne poser aucune question, ou seulement sur le télétravail, casse une bonne performance technique." },

{ id:"n10-21", lvl:10, dom:"Sécurité",
  q:"Comment expliques-tu à un métier non technique pourquoi il faut arrêter les mots de passe partagés dans un fichier Excel ?",
  accept:["tracabilite","qui a fait quoi","revocation","coffre","impact"],
  explain:"Sans jargon : « aujourd'hui, si quelqu'un fait une erreur ou part, on ne peut ni savoir qui a agi ni couper son accès sans bloquer tout le monde ». On parle traçabilité, révocation individuelle et responsabilité — pas de chiffrement. Puis on propose la solution qui ne dégrade pas leur quotidien : un coffre avec accès nominatif, et on accompagne la bascule. La sécurité qui rend le travail impossible est contournée." },

{ id:"n10-22", lvl:10, dom:"AWS",
  q:"Ton prédécesseur a laissé une infrastructure entièrement créée à la main, sans documentation. Quel est ton plan sur 3 mois ?",
  must:[["inventaire","cartographie","decouvrir"],["import","iac","reprendre en code"]],
  explain:"1) Inventaire automatisé (Config/Resource Graph, tags, coûts) et cartographie des flux critiques. 2) Geler la création manuelle et exiger l'IaC pour tout ce qui est NOUVEAU — arrêter l'hémorragie avant de nettoyer. 3) Sauvegardes et accès d'urgence vérifiés en priorité. 4) Reprise en IaC par import, en commençant par le socle stable (réseau, IAM) puis les applications. 5) Documenter au fur et à mesure. Vouloir tout réécrire d'un coup est le piège." },

{ id:"n10-23", lvl:10, dom:"SRE",
  q:"« On n'a pas le temps de faire les choses proprement. » Comment tu réponds concrètement ?",
  accept:["dette","interet","chiffrer","incremental","negocier"],
  explain:"On accepte la contrainte mais on la nomme : c'est une DETTE, avec un intérêt qui se paiera en incidents et en lenteur. On demande à ce qu'elle soit tracée avec un propriétaire et une échéance, on négocie un pourcentage de capacité récurrent (10-20 % par sprint) plutôt qu'un grand chantier futur qui n'arrivera jamais, et on fait le minimum non négociable maintenant : sauvegardes, rollback, observabilité de base." },

{ id:"n10-24", lvl:10, dom:"Kubernetes",
  q:"Comment expliquerais-tu Kubernetes à un chef de projet qui n'est pas technique, en 30 secondes ?",
  accept:["chef d orchestre","maintient l etat","redemarre","repartit","automatise"],
  explain:"« C'est un chef d'orchestre pour nos applications : on lui décrit ce qu'on veut — trois copies de l'application, qui répondent sur ce port, avec ces ressources — et il s'assure en permanence que c'est le cas. Si une machine tombe ou qu'une copie plante, il redémarre ailleurs sans que personne n'intervienne, et il sait déployer une nouvelle version progressivement sans coupure. » Savoir vulgariser est une compétence évaluée à ce niveau." },

{ id:"n10-25", lvl:10, dom:"SRE",
  q:"Sur quoi te ferais-tu challenger si tu prétends être senior, et que tu ne maîtrises pas encore ? Comment le dis-tu ?",
  accept:["honnete","ce que je sais faire","comment j apprends","exemple"],
  explain:"On assume une zone précise (« je n'ai pas opéré de service mesh en production, j'ai fait un POC Istio ») et on montre immédiatement le processus : comment j'ai appris Kubernetes en partant de zéro, en combien de temps, avec quel résultat. Bluffer sur une technologie que trois seniors connaissent est éliminatoire en une relance. Dire « je ne sais pas, voilà comment je m'y prendrais » est une réponse forte." },

{ id:"n10-26", lvl:10, dom:"CI/CD",
  q:"Quelle est la valeur réelle d'un environnement de recette identique à la production, et pourquoi c'est rarement vrai ?",
  accept:["donnees","volume","cout","derive","charge"],
  explain:"La valeur : les bugs de configuration et d'intégration se voient avant la prod. Pourquoi c'est rarement vrai : le volume et la nature des données diffèrent (anonymisation), la charge n'est pas reproduite, la topologie réseau est simplifiée, et la recette dérive dès qu'on y touche à la main. D'où : générer les deux avec le MÊME code IaC paramétré, et compléter par des tests en production maîtrisée (canary, shadow traffic) plutôt que de croire à une recette parfaite." },

{ id:"n10-27", lvl:10, dom:"Sécurité",
  q:"Quelle est la première mesure de sécurité que tu mettrais en place sur une plateforme cloud qui n'en a aucune ?",
  accept:["mfa","identite","journalisation","supprimer les acces","racine"],
  explain:"Réponse défendable : verrouiller les IDENTITÉS — MFA obligatoire, sécurisation/blocage du compte racine, suppression des clés d'accès statiques et des comptes dormants, accès administrateur nominatif et temporaire. Juste après : activer la journalisation immuable pour pouvoir enquêter. Les identités et les traces d'abord ; le chiffrement et la segmentation viennent après, car sans identité maîtrisée le reste ne protège rien." },

{ id:"n10-28", lvl:10, dom:"SRE",
  q:"On te propose de rejoindre une équipe où tout est manuel mais où personne ne veut changer. Que fais-tu les 30 premiers jours ?",
  accept:["comprendre pourquoi","gagner la confiance","petit gain","aider","douleur"],
  explain:"Comprendre POURQUOI ça n'a pas changé — souvent une tentative passée qui a mal fini, un manque de temps, ou une peur légitime de perdre le contrôle. Gagner en crédibilité en prenant les tâches pénibles avec eux, puis automatiser UNE douleur concrète qu'ils ont nommée, et leur en donner le mérite. Le changement technique en environnement bancaire est d'abord un travail de confiance ; arriver en donneur de leçons garantit l'échec." }

]);

</script>
<script>
/* data/niveau10b.js */
window.QBANK = (window.QBANK || []).concat([
/* ============ NIVEAU 10 — SÉRIE B ============ */

{ id:"b10-01", lvl:10, dom:"SRE",
  q:"« Présentez-vous en 90 secondes. » Que doit contenir ta réponse, et qu'est-ce qui la gâche ?",
  must:[["ce que j ai construit","realisation","concret"],["pourquoi ce poste","motivation","lien"]],
  explain:"Trois blocs : qui tu es professionnellement (une phrase), 2-3 réalisations CONCRÈTES avec un résultat mesurable, et pourquoi CE poste précisément. Ce qui gâche : dérouler son CV chronologiquement depuis le lycée, énumérer 30 technologies sans contexte, ou dépasser 2 minutes. Les seniors décident en 90 secondes s'ils vont creuser ou survoler — c'est le seul moment que tu contrôles entièrement, donc c'est celui qu'on répète à voix haute." },

{ id:"b10-02", lvl:10, dom:"SRE",
  q:"« Vous n'avez jamais travaillé en banque. Pourquoi vous prendrions-nous ? » Comment tu réponds ?",
  accept:["ce que j apporte","contrainte","apprendre","transferable","reconnais"],
  explain:"On ne nie pas et on ne s'excuse pas. On reconnaît l'écart, puis on montre ce qui est TRANSFÉRABLE (rigueur, traçabilité, gestion d'incident, environnements contraints) et ce qu'on a déjà compris de leur contexte (conformité, séparation des tâches, périodes de gel, réversibilité). On termine sur la vitesse d'apprentissage démontrée par un exemple précis. Prouver qu'on a fait l'effort de comprendre leur métier vaut plus que dix ans d'expérience générique." },

{ id:"b10-03", lvl:10, dom:"Kubernetes",
  q:"Ils te posent une question dont tu maîtrises la réponse à 80 %. Que fais-tu des 20 % restants ?",
  accept:["annonce la limite","je crois","a verifier","honnete","separer"],
  explain:"Tu réponds sur ce que tu sais avec assurance, puis tu MARQUES la frontière : « ça, j'en suis certain ; sur ce point précis, de mémoire c'est X mais je vérifierais avant de l'affirmer ». Cette séparation explicite entre ce qu'on sait et ce qu'on croit est un signal de fiabilité très fort en production. À l'inverse, noyer les 20 % dans le flot général donne l'impression que tout le reste est du même niveau de certitude." },

{ id:"b10-04", lvl:10, dom:"Terraform",
  q:"« Montrez-nous comment vous concevriez notre plateforme. » Ils te donnent un tableau blanc. Par quoi tu commences ?",
  accept:["questions","contraintes","exigences","clarifier","pas dessiner"],
  explain:"Pas par dessiner. Par écrire les CONTRAINTES à gauche du tableau : volumétrie, SLO, RTO/RPO, conformité et résidence des données, budget, taille et compétence de l'équipe, existant et dépendances. Puis on propose une architecture et on explique quelle contrainte justifie chaque choix. Dessiner immédiatement une architecture générique montre qu'on applique une recette au lieu de résoudre LEUR problème." },

{ id:"b10-05", lvl:10, dom:"CI/CD",
  q:"Un chef affirme quelque chose de techniquement faux devant les deux autres. Que fais-tu ?",
  accept:["ne pas humilier","poser une question","reformuler","peut-etre","sans le contredire","diplomatie"],
  explain:"Ni acquiescer (tu valides une erreur et tu perds en crédibilité technique), ni corriger frontalement devant ses pairs. On passe par la question ouverte : « je l'avais compris différemment — dans le cas X, est-ce que ça ne donnerait pas plutôt Y ? ». Ça ouvre la discussion sans confrontation, et si tu as raison, ils le verront. Cette question teste exactement ta capacité à travailler avec des seniors sans créer de conflit." },

{ id:"b10-06", lvl:10, dom:"Sécurité",
  q:"« Quelle est la décision technique dont vous êtes le plus fier ? » Comment tu la choisis ?",
  must:[["arbitrage","alternative","pourquoi ce choix"],["resultat","impact","mesure"]],
  explain:"Choisis une décision où tu as ARBITRÉ entre plusieurs options défendables, pas où tu as appliqué une évidence. Structure : le contexte et la contrainte, les options envisagées, pourquoi tu as tranché ainsi, le résultat mesuré, et ce que tu ferais différemment aujourd'hui. Cette dernière partie compte autant que le reste : elle montre que tu continues d'évaluer tes propres choix." },

{ id:"b10-07", lvl:10, dom:"SRE",
  q:"« Comment réagissez-vous quand un développeur refuse d'appliquer vos recommandations ? »",
  accept:["comprendre pourquoi","contrainte","proposer","co-construire","pas d autorite"],
  explain:"D'abord comprendre le refus : contrainte de délai, recommandation impraticable dans leur contexte, ou désaccord de fond ? Souvent la recommandation était juste mais coûteuse à appliquer, et le vrai travail est de la rendre facile (outiller, automatiser, fournir un modèle prêt à l'emploi). Si le désaccord persiste sur un risque important, on documente le risque, on le fait arbitrer, et on avance. Un DevOps qui impose par l'autorité n'a plus d'influence six mois plus tard." },

{ id:"b10-08", lvl:10, dom:"Kubernetes",
  q:"« Si vous deviez supprimer une seule technologie de notre stack, laquelle et pourquoi ? » Comment tu abordes ça ?",
  accept:["je ne connais pas assez","questions","coherence","complexite","prudence"],
  explain:"C'est un piège : critiquer une stack qu'on ne connaît pas depuis 40 minutes est présomptueux, mais botter en touche est mou. Bonne réponse : « je n'ai pas assez de contexte pour trancher, mais voici ce que je regarderais — les composants qui font doublon, ceux que personne ne maîtrise vraiment, et ceux dont la valeur ne justifie pas la charge opérationnelle. Est-ce qu'il y en a un qui vous pose déjà question ? » Tu montres une grille d'analyse et tu leur rends la parole." },

{ id:"b10-09", lvl:10, dom:"Observabilité",
  q:"« Vous êtes d'astreinte, tout est rouge, votre téléphone sonne, le métier vous appelle. Vous faites quoi dans les 5 premières minutes ? »",
  must:[["etat des lieux","impact","que se passe-t-il"],["communiquer","canal","informer"]],
  explain:"1) Accuser réception et ouvrir un canal unique — arrêter d'être appelé sur trois lignes. 2) Qualifier l'impact réel : quoi, depuis quand, combien d'utilisateurs. 3) Chercher le CHANGEMENT récent (déploiement, flag, config) — c'est la cause dans la majorité des cas. 4) Décider de mitiger (rollback, scale, bascule) sans attendre de comprendre. 5) Donner un premier point de situation avec une heure de prochain point. Ce qui est évalué : que tu communiques et que tu priorises la mitigation." },

{ id:"b10-10", lvl:10, dom:"AWS",
  q:"« Combien coûterait votre architecture ? » Tu n'as pas les chiffres exacts. Que fais-tu ?",
  accept:["ordre de grandeur","hypotheses","postes principaux","calculette","estimer"],
  explain:"On ne dit pas « je ne sais pas ». On raisonne en ordre de grandeur à voix haute : les postes dominants (calcul, base, transfert de données, licences), une hypothèse de volumétrie assumée, une fourchette, et ce qui la ferait basculer. Puis on propose de l'affiner avec le calculateur du fournisseur. Ce qui est testé : la conscience que chaque choix technique a un prix, pas la capacité à réciter un tarif." },

{ id:"b10-11", lvl:10, dom:"SRE",
  q:"« Qu'est-ce qui vous ferait refuser ce poste ? » Pourquoi cette question, et que répondre ?",
  accept:["honnete","conditions de travail","autonomie","ce que je cherche","reciproque"],
  explain:"Elle teste la maturité et vérifie que tu évalues aussi de ton côté — un candidat prêt à tout accepter inquiète. Réponse honnête et professionnelle : ce qui compte pour toi (autonomie sur la production, possibilité d'automatiser, astreinte soutenable, équipe qui fait des post-mortems) et ce qui serait rédhibitoire (accès prod interdit sans alternative, aucune capacité à corriger la dette). Sans agressivité : tu décris des conditions de réussite, pas des exigences." },

{ id:"b10-12", lvl:10, dom:"Sécurité",
  q:"« Notre sécurité impose des contraintes qui ralentissent tout. Vous en pensez quoi ? » Attention, c'est un test.",
  accept:["legitimes","automatiser","pas contourner","integrer","les deux"],
  explain:"Le piège est de se ranger du côté de la vitesse pour se rendre sympathique. Réponse solide : les contraintes sont légitimes en banque, le problème n'est pas leur existence mais leur COÛT d'application — quand un contrôle est manuel et répété, il ralentit ET il est mal appliqué. Le travail consiste à les automatiser et à les intégrer dans le chemin par défaut, pour qu'elles deviennent invisibles au développeur. Jamais « je trouverais un moyen de contourner »." },

{ id:"b10-13", lvl:10, dom:"CI/CD",
  q:"« Votre prédécesseur a mis en place quelque chose que vous jugez mauvais. Vous faites quoi ? »",
  accept:["comprendre le contexte","raison","ne pas juger","progressif","risque"],
  explain:"D'abord chercher POURQUOI : il y avait probablement une contrainte qu'on ignore (budget, délai, compétence disponible, exigence d'alors). Ensuite évaluer le risque réel et le coût du changement — beaucoup de choses « mauvaises » fonctionnent et ne valent pas la peine d'être refaites. Si le changement se justifie : le proposer avec les bénéfices chiffrés, et le faire progressivement. Arriver en critiquant le travail des autres est le meilleur moyen de perdre l'équipe en place." },

{ id:"b10-14", lvl:10, dom:"Réseau",
  q:"Ils te demandent de déboguer un problème au tableau, sans machine. Comment tu procèdes ?",
  must:[["hypothese","methodique","couche par couche"],["ce que je verifierais","commande","preuve"]],
  explain:"Tu verbalises une méthode : quelles hypothèses, dans quel ORDRE tu les testerais, quelle commande te donnerait quelle information, et comment chaque résultat orienterait la suite. « Je regarderais d'abord X ; si ça montre Y, alors j'irais vers Z, sinon vers W. » L'exercice n'évalue pas la bonne réponse mais la structure de ton raisonnement — un candidat qui saute directement à une conclusion échoue même s'il tombe juste." },

{ id:"b10-15", lvl:10, dom:"SRE",
  q:"« Où vous voyez-vous dans 3 ans ? » Comment répondre sans cliché ni piège ?",
  accept:["competence","profondeur","expertise","concret","lien avec le poste"],
  explain:"On évite les deux extrêmes : « manager » (tu pars du poste technique qu'ils recrutent) et « je ne sais pas » (aucun projet). Réponse efficace : une direction de compétence concrète et cohérente avec le poste (référent sur un domaine, capable de porter l'architecture d'une plateforme, de former les autres), en montrant que ce poste est une étape logique de ce chemin. Ils cherchent à savoir si tu resteras assez longtemps pour être rentable." },

{ id:"b10-16", lvl:10, dom:"Terraform",
  q:"« Quelle est la chose la plus difficile que vous ayez automatisée ? » Que cherchent-ils vraiment ?",
  must:[["complexite","pourquoi c etait dur","obstacle"],["resultat","avant apres","gain"]],
  explain:"Ils cherchent : est-ce que tu as affronté de la vraie complexité, ou juste enchaîné des tutoriels ? Structure : pourquoi c'était difficile (état existant, dépendances, absence de documentation, résistance humaine, contraintes de production), comment tu as découpé le problème, ce qui a échoué en chemin, et le gain mesuré. La difficulté humaine ou organisationnelle compte autant que la difficulté technique — souvent plus." },

{ id:"b10-17", lvl:10, dom:"Kubernetes",
  q:"Trois seniors, trois avis différents sur ta réponse. Comment évites-tu de te faire déchirer ?",
  accept:["reconnais","critere","contexte","pas de reponse unique","les faire parler"],
  explain:"Tu reconnais explicitement qu'il n'y a pas de réponse unique et tu ramènes au CRITÈRE : « les trois approches sont défendables, elles n'optimisent pas la même chose — dans votre contexte, qu'est-ce qui prime ? ». Tu passes de la position défensive à l'animation d'une discussion technique. C'est exactement la posture attendue d'un profil senior : savoir cadrer un désaccord entre gens compétents." },

{ id:"b10-18", lvl:10, dom:"Sécurité",
  q:"« Qu'est-ce que vous feriez le premier jour si on vous donnait les accès à la production ? »",
  accept:["rien","observer","lire","ne pas toucher","comprendre"],
  explain:"Rien qui modifie quoi que ce soit. On lit : architecture, runbooks, historique des incidents, dashboards, alertes des dernières semaines, et on écoute l'équipe. On identifie les risques immédiats sans y toucher (sauvegarde jamais testée, certificat qui expire, absence de rollback). Répondre « je commencerais par mettre en place X » le premier jour est le drapeau rouge numéro un pour un chef d'exploitation." },

{ id:"b10-19", lvl:10, dom:"SQL",
  q:"« Un batch de nuit dépasse sa fenêtre et empiète sur l'ouverture. Comment vous traitez ça ? »",
  must:[["mesurer","ou passe le temps","profil"],["decouper","parallele","incremental"]],
  explain:"1) Mesurer où passe réellement le temps (étape par étape) avant d'optimiser quoi que ce soit. 2) Leviers classiques : traitement incrémental plutôt que complet, parallélisation par partition, index adaptés, suppression des allers-retours ligne à ligne, exécution sur un réplica pour les lectures. 3) Court terme : découper en lots reprenables pour ne pas tout perdre à l'arrêt. 4) Poser un SLO sur ce batch et alerter AVANT le dépassement, pas après. En banque, ce sujet est très concret : les arrêtés de nuit conditionnent l'ouverture." },

{ id:"b10-20", lvl:10, dom:"SRE",
  q:"« Vous avez 6 mois et une équipe de 4 personnes. Quelle est votre priorité numéro un ? » Comment cadrer la réponse ?",
  accept:["depend du diagnostic","risque","je poserais des questions","valeur","reduire le risque"],
  explain:"On refuse poliment de répondre dans le vide : « ça dépend de ce que je trouverais, mais voici comment je trancherais ». Grille : d'abord ce qui met l'entreprise en risque (sauvegardes, rollback, sécurité des accès), ensuite ce qui coûte le plus de temps à l'équipe chaque semaine (le toil), enfin ce qui débloque le plus de valeur pour les équipes produit. Et un livrable visible sous 6 semaines pour établir la crédibilité." },

{ id:"b10-21", lvl:10, dom:"CI/CD",
  q:"« Combien de temps entre un commit et la production, chez vous ? » Comment répondre si c'était lent ?",
  accept:["honnete","chiffre","pourquoi","ce que j ai ameliore","contraintes"],
  explain:"Donne le chiffre réel, sans le maquiller — ils le sentiront. Puis explique POURQUOI (validation métier, contraintes réglementaires, dépendances, dette) et surtout ce que tu as fait pour l'améliorer, même partiellement, avec le gain obtenu. Un candidat qui connaît son chiffre et sa cause vaut mieux qu'un candidat qui annonce 15 minutes sans savoir ce qu'il y a dans le pipeline." },

{ id:"b10-22", lvl:10, dom:"AWS",
  q:"« On vous demande de réduire les coûts de 30 % en 3 mois. Vous commencez par quoi ? »",
  must:[["visibilite","mesurer","ou part l argent","tag"],["quick win","eteindre","rightsizing","engagement"]],
  explain:"1) Visibilité d'abord : ventilation par service, compte, équipe — sans ça, on optimise au hasard. 2) Quick wins sans risque : extinction du hors-production la nuit et le week-end, suppression des ressources orphelines (volumes, snapshots, IP, load balancers vides), rétention des logs. 3) Rightsizing basé sur l'usage réel. 4) Engagements (Savings Plans) sur la base stable une fois le parc assaini — jamais avant, sinon on s'engage sur du gaspillage. 5) Restitution aux équipes avec un objectif par périmètre." },

{ id:"b10-23", lvl:10, dom:"Observabilité",
  q:"« Comment sauriez-vous que votre travail a de la valeur ? » Que répondre concrètement ?",
  must:[["metrique","mesure","chiffre"],["avant apres","incident","temps gagne"]],
  explain:"En nommant des mesures : réduction du MTTR, baisse du nombre d'alertes nocturnes, temps de déploiement, taux d'échec des changements, temps gagné par les équipes produit sur une tâche récurrente, coût par transaction. Un candidat qui répond « quand ça marche bien » n'a jamais eu à défendre un budget. Ceux qui recrutent des seniors cherchent quelqu'un capable de rendre son impact visible sans qu'on le lui demande." },

{ id:"b10-24", lvl:10, dom:"Sécurité",
  q:"« Racontez-nous une fois où vous avez cassé la production. » Piège ou vraie question ?",
  accept:["vraie question","honnetete","ce que j ai appris","detecte","corrige"],
  explain:"Vraie question, et refuser d'y répondre (« ça ne m'est jamais arrivé ») est la pire réponse : soit tu n'as jamais touché à la production, soit tu ne l'assumes pas. Structure : ce que j'ai fait, comment je m'en suis rendu compte, ce que j'ai fait dans les 10 minutes suivantes, comment je l'ai communiqué, et le garde-fou mis en place après. Assumer une erreur avec cette rigueur inspire plus confiance qu'un parcours sans accroc." },

{ id:"b10-25", lvl:10, dom:"SRE",
  q:"L'entretien se termine, tu sens que tu as raté une question. Que fais-tu ?",
  accept:["revenir dessus","proposer","corriger","assume","email"],
  explain:"Si l'occasion se présente, tu y reviens brièvement et proprement : « tout à l'heure sur la question X, j'ai répondu trop vite — avec le recul, je dirais plutôt Y ». Ça transforme un point faible en démonstration de lucidité. Sinon, un message de remerciement court après l'entretien peut reprendre le point en deux phrases. Ce qu'il ne faut pas faire : ressasser pendant le reste de l'entretien et rater les questions suivantes." },

{ id:"b10-26", lvl:10, dom:"Kubernetes",
  q:"« Expliquez-nous un concept technique complexe comme si nous n'y connaissions rien. » Que testent-ils ?",
  accept:["vulgarisation","analogie","sans jargon","comprehension reelle","transmettre"],
  explain:"Ils testent deux choses : ta compréhension réelle (on ne vulgarise bien que ce qu'on maîtrise vraiment) et ta capacité à parler à des interlocuteurs non techniques — indispensable en banque où tu dialogueras avec le risque, la conformité et le métier. Bonne technique : une analogie du quotidien, zéro acronyme, puis vérifier que ça a été compris avant d'ajouter une couche." },

{ id:"b10-27", lvl:10, dom:"SRE",
  q:"« Préférez-vous être expert d'un domaine ou généraliste ? » Quel est le piège ?",
  accept:["les deux","profondeur sur","large","t-shaped","selon le poste"],
  explain:"Le piège est de choisir un camp de façon absolue. Réponse solide : le profil en T — une base large qui permet de dialoguer avec toutes les équipes et de diagnostiquer de bout en bout, et une ou deux profondeurs réelles où l'on est référent. Et tu précises tes profondeurs actuelles honnêtement. En DevOps, prétendre être expert de tout est une réponse éliminatoire face à trois spécialistes." },

{ id:"b10-28", lvl:10, dom:"CI/CD",
  q:"Ils te disent « merci, on vous rappelle ». Qu'est-ce que tu dois avoir fait avant de sortir de la salle ?",
  must:[["questions","poser"],["prochaines etapes","suite","delai"]],
  explain:"1) Avoir posé tes 2-3 questions (astreinte, dernier incident majeur, attentes à 6 mois). 2) Avoir demandé les prochaines étapes et le délai — ça montre de l'intérêt et ça t'évite d'attendre dans le flou. 3) Avoir noté les noms. 4) Éventuellement dit en une phrase pourquoi le poste t'intéresse après ce que tu as entendu. Sortir sans rien demander laisse une impression tiède, même après une bonne performance technique." }

]);

</script>
<script>
/* ============ MODELE ============ */
const BANK = window.QBANK || [];
const LEVEL_TITLES = {
  1:"Vocabulaire & fondations",
  2:"Bases opérationnelles",
  3:"Usage quotidien",
  4:"Intermédiaire",
  5:"Réseau, sécurité, état",
  6:"Troubleshooting",
  7:"Architecture & production",
  8:"Internes & cas limites",
  9:"Résilience, coûts, gouvernance",
  10:"Entretien senior — arbitrages"
};
const STORE = "bnp_devops_v1";
let ST = load();
function load(){ try{ return JSON.parse(localStorage.getItem(STORE)) || {q:{},lvl:{}}; }catch(e){ return {q:{},lvl:{}}; } }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(ST)); }catch(e){} }

const BOX_DAYS = [0,0,1,3,7,16,35];
function qs(id){ return ST.q[id] || (ST.q[id] = {box:1, ok:0, ko:0, last:0}); }
function due(id){
  const s = ST.q[id]; if(!s) return true;
  const days = BOX_DAYS[Math.min(s.box,6)];
  return Date.now() - s.last >= days*864e5;
}
function grade(id, ok){
  const s = qs(id);
  if(ok){ s.ok++; s.box = Math.min(s.box+1, 6); }
  else  { s.ko++; s.box = 1; }
  s.last = Date.now(); save();
}

/* ============ NORMALISATION / CORRECTION ============ */
function norm(s){
  return (s||"").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9+#./_-]+/g," ")
    .replace(/\s+/g," ").trim();
}
function hit(n, needle){
  const a = norm(needle);
  if(!a) return false;                     // mot-clé vide : ne doit JAMAIS tout valider
  if(a.length <= 3){                       // court (chiffres, sigles) : mot entier exigé
    const echap = a.replace(/[.*+?^${}()|[\]\\\/-]/g, "\\$&");
    return new RegExp("(^|\\s)" + echap + "($|\\s)").test(n);
  }
  return n.includes(a);                    // long : sous-chaîne, pour rester tolérant
}
function evaluate(input, item){
  const n = norm(input);
  if(!n) return false;
  if(item.must && item.must.length){
    const allMust = item.must.every(g => Array.isArray(g) ? g.some(x=>hit(n,x)) : hit(n,g));
    if(!allMust) return false;
    if(!item.accept) return true;
  }
  return (item.accept||[]).some(a => hit(n,a));
}

/* ============ ETAT DE SESSION ============ */
let S = null; // {list, i, score, wrong:[], label}

function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[b[i],b[j]]=[b[j],b[i]];} return b; }

function startLevel(l){
  start(shuffle(BANK.filter(q=>q.lvl===l)), "Niveau "+l+" — "+LEVEL_TITLES[l]);
}
function startAll(){ start(shuffle(BANK), "Marathon — toutes les questions"); }
function startRandom(n){ start(shuffle(BANK).slice(0,n), "Aléatoire — "+n+" questions"); }
function startDue(){
  const d = shuffle(BANK.filter(q=>due(q.id))).slice(0,40);
  if(!d.length){ alert("Rien à réviser pour le moment. Reviens plus tard ou lance un niveau."); return; }
  start(d, "Révision espacée — "+d.length+" questions dues");
}
function startWeak(){
  const w = BANK.filter(q => ST.q[q.id] && ST.q[q.id].ko > 0 && ST.q[q.id].box <= 2);
  if(!w.length){ alert("Aucune question ratée en mémoire. Lance un niveau d'abord."); return; }
  start(shuffle(w), "Mes points faibles — "+w.length+" questions");
}
function startDomain(dom){
  start(shuffle(BANK.filter(q=>q.dom===dom)), "Domaine — "+dom);
}
function start(list, label){
  if(!list.length){ alert("Aucune question."); return; }
  S = {list, i:0, score:0, wrong:[], label};
  render();
}

/* ============ RENDU ============ */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function headerStats(){
  const seen = Object.keys(ST.q).length;
  const solid = Object.values(ST.q).filter(s=>s.box>=4).length;
  const dueN = BANK.filter(q=>due(q.id) && ST.q[q.id]).length;
  document.getElementById("hstats").innerHTML =
    `<b>${BANK.length}</b> questions · vues <b>${seen}</b> · solides <b>${solid}</b> · à revoir <b>${dueN}</b>`;
}

function home(){
  S = null;
  const doms = [...new Set(BANK.map(q=>q.dom))].sort();
  let lv = "";
  for(let l=1;l<=10;l++){
    const qs_ = BANK.filter(q=>q.lvl===l);
    const known = qs_.filter(q=>ST.q[q.id] && ST.q[q.id].box>=3).length;
    const pct = qs_.length ? Math.round(known/qs_.length*100) : 0;
    lv += `<button class="lvl" onclick="startLevel(${l})">
      <div class="n">Niveau ${l}</div>
      <div class="t">${LEVEL_TITLES[l]}</div>
      <div class="m">${qs_.length} questions · ${pct}% acquis</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </button>`;
  }
  document.getElementById("app").innerHTML = `
    <div class="card">
      <h2 style="margin:0 0 4px;font-size:22px">Entraînement libre</h2>
      <p class="sub">Tu tapes ta réponse avec tes mots. C'est le mode exigeant : si un niveau te bloque, va d'abord le faire en <a href="qcm.html">choix multiples</a> puis reviens. Le bouton <b>Indice</b> débloque une piste, et si tu avais juste mais formulé autrement, tu peux te corriger toi-même après coup.</p>
      <div class="modes">
        <button onclick="startDue()">Révision du jour</button>
        <button class="ghost" onclick="startRandom(30)">30 au hasard</button>
        <button class="ghost" onclick="startRandom(60)">60 au hasard</button>
        <button class="ghost" onclick="startWeak()">Mes points faibles</button>
        <button class="ghost" onclick="startAll()">Marathon complet</button>
      </div>
      <div class="hint">Par domaine : ${doms.map(d=>`<a href="#" onclick="startDomain('${d}');return false">${d}</a>`).join(" · ")}</div>
    </div>
    <div class="levels">${lv}</div>
    <div class="card" style="font-size:13.5px;color:var(--muted)">
      <b style="color:var(--ink)">Méthode anti-dump.</b> Le but n'est pas de reconnaître une réponse mais de savoir l'expliquer à voix haute. Avant de valider, formule ta réponse comme si un chef de projet BNP était en face. Les questions ratées reviennent plus vite (répétition espacée, 6 paliers).
      <div class="row">
        <button class="ghost tiny" onclick="location.href='qcm.html'">← Mode choix multiples</button>
        <button class="ghost tiny" onclick="location.href='etude.html'">Fiches d'étude →</button>
        <button class="ghost tiny" onclick="resetAll()">Réinitialiser ma progression</button>
      </div>
    </div>`;
  headerStats();
}

function resetAll(){
  if(confirm("Effacer toute ta progression enregistrée ?")){ ST={q:{},lvl:{}}; save(); home(); }
}

function render(){
  if(!S) return home();
  const app = document.getElementById("app");
  if(S.i >= S.list.length) return finish();
  const it = S.list[S.i];
  app.innerHTML = `
    <div class="toolbar">
      <div class="meta"><span>${S.label}</span></div>
      <button class="ghost tiny" onclick="home()">Quitter</button>
    </div>
    <div class="progress"><i style="width:${S.i/S.list.length*100}%"></i></div>
    <div class="card">
      <div class="meta">
        <span>Question ${S.i+1} / ${S.list.length}</span>
        <span><span class="tag">${it.dom}</span> <span class="tag">N${it.lvl}</span></span>
      </div>
      <div class="qtext">${it.q}</div>
      <textarea id="ans" placeholder="Explique avec tes mots…" autocomplete="off" spellcheck="false"></textarea>
      <div class="row">
        <button onclick="check()">Valider</button>
        <button class="ghost" onclick="indice()">Indice</button>
        <button class="ghost" onclick="skip()">Je ne sais pas</button>
      </div>
      <div class="hint" id="zoneIndice"><span class="kbd">Ctrl</span>+<span class="kbd">Entrée</span> pour valider</div>
      <div id="fb"></div>
    </div>`;
  const ta = document.getElementById("ans");
  ta.focus();
  ta.addEventListener("keydown", e=>{
    if(e.key==="Enter" && (e.ctrlKey||e.metaKey)){ e.preventDefault(); check(); }
  });
  headerStats();
}

function feedback(ok, it, selfEval){
  const fb = document.getElementById("fb");
  fb.innerHTML = `
    <div class="fb ${ok?'ok':'ko'}">
      <span class="badge">${ok?'CORRECT':'À REVOIR'}</span>
      <div>${it.explain}</div>
      ${it.tip?`<div class="tip">${it.tip}</div>`:""}
      <div class="keys">Mots-clés attendus : ${(it.accept||it.must||[]).flat().slice(0,8).map(esc).join(" · ")}</div>
    </div>
    <div class="row">
      <button onclick="next()">Suivant →</button>
      ${selfEval && !ok ? `<button class="ghost" onclick="selfOk()">En fait j'avais juste ✓</button>`:""}
      ${selfEval && ok ? `<button class="ghost" onclick="selfKo()">Non, je devinais ✗</button>`:""}
    </div>`;
  document.getElementById("ans").disabled = true;
  document.querySelectorAll(".row button").forEach(b=>{
    const t = b.textContent;
    if(t.includes("Valider") || t.includes("Indice") || t.includes("Je ne sais pas")) b.remove();
  });
}

function indice(){
  const it = S.list[S.i];
  const mots = (it.accept || it.must || []).flat();
  const nb = it.must ? it.must.length : 1;
  document.getElementById("zoneIndice").innerHTML =
    `Piste : la réponse tourne autour de « <b>${esc(mots[0])}</b> »` +
    (nb > 1 ? ` — et il faut <b>${nb} éléments</b> distincts.` : ".");
}

function check(){
  const it = S.list[S.i];
  const ok = evaluate(document.getElementById("ans").value, it);
  applyResult(ok, it, true);
}
function skip(){ applyResult(false, S.list[S.i], false); }
function applyResult(ok, it, selfEval){
  if(ok) S.score++; else S.wrong.push(it);
  grade(it.id, ok);
  feedback(ok, it, selfEval);
}
function selfOk(){
  const it = S.list[S.i];
  S.score++; S.wrong = S.wrong.filter(x=>x.id!==it.id);
  grade(it.id, true); feedback(true, it, false);
}
function selfKo(){
  const it = S.list[S.i];
  S.score--; S.wrong.push(it);
  grade(it.id, false); feedback(false, it, false);
}
function next(){ S.i++; render(); }

function finish(){
  const pct = Math.round(S.score/S.list.length*100);
  const byDom = {};
  S.list.forEach(q=>{ byDom[q.dom] = byDom[q.dom] || {t:0,k:0}; byDom[q.dom].t++; });
  S.wrong.forEach(q=>{ byDom[q.dom].k++; });
  const rows = Object.entries(byDom).sort((a,b)=>(b[1].k/b[1].t)-(a[1].k/a[1].t))
    .map(([d,v])=>`<div><span>${d}</span><span>${v.t-v.k}/${v.t}</span></div>`).join("");
  const msg = pct>=90?"Niveau entretien. Tu peux défendre ça devant trois seniors."
            : pct>=75?"Solide. Reprends les domaines rouges ci-dessous."
            : pct>=50?"Base présente, mais tu te ferais coincer sur les relances. Refais les ratées."
            : "À retravailler sérieusement. Passe par la partie étude avant de rejouer.";
  document.getElementById("app").innerHTML = `
    <div class="card done">
      <div class="meta" style="justify-content:center">${S.label}</div>
      <div class="score">${S.score} / ${S.list.length}</div>
      <div class="sub">${pct}% — ${msg}</div>
      <div class="row" style="justify-content:center">
        ${S.wrong.length?`<button onclick="replayWrong()">Rejouer les ${S.wrong.length} ratées</button>`:""}
        <button class="ghost" onclick="home()">Accueil</button>
      </div>
      <div class="dom-list" style="text-align:left">${rows}</div>
    </div>`;
  headerStats();
}
function replayWrong(){ start(shuffle(S.wrong), "Rattrapage — "+S.label); }

/* Lancement direct depuis le menu Formations : quiz.html?dom=Terraform,Ansible&lvl=3&titre=… */
(function router(){
  const p = new URLSearchParams(location.search);
  const dom = p.get("dom"), lvl = p.get("lvl");
  if(!dom || !lvl){ home(); return; }
  const doms = dom.split(",");
  const liste = BANK.filter(q => q.lvl === Number(lvl) && doms.includes(q.dom));
  if(!liste.length){ home(); return; }
  start(shuffle(liste), (p.get("titre") || dom) + " — niveau " + lvl);
})();
</script>
</body>
