<script>
/* data/niveau09.js */
window.QBANK = (window.QBANK || []).concat([
/* ================= NIVEAU 9 — RÉSILIENCE, COÛTS, GOUVERNANCE ================= */

{ id:"n9-dr-01", lvl:9, dom:"SRE",
  q:"Cite les quatre stratégies de disaster recovery cloud, de la moins chère à la plus chère, avec leur RTO typique.",
  must:[["backup","sauvegarde"],["pilot light","veilleuse"],["warm standby","tiede"],["actif actif","multi site","hot"]],
  explain:"1) Backup & restore : RTO en heures, coût minimal. 2) Pilot light : le cœur (base répliquée) tourne, le reste est éteint — RTO en dizaines de minutes. 3) Warm standby : environnement complet à capacité réduite, RTO en minutes. 4) Multi-site actif/actif : RTO quasi nul, coût maximal et complexité de cohérence des données. Le choix découle du RTO/RPO négocié avec le métier, pas d'une préférence technique." },

{ id:"n9-dr-02", lvl:9, dom:"SRE",
  q:"Ta sauvegarde existe mais n'a jamais été restaurée. Quel est le problème, et quelle est la règle de référence ?",
  accept:["3-2-1","non testee","restauration","exercice","pas une sauvegarde"],
  explain:"Une sauvegarde jamais restaurée n'est pas une sauvegarde, c'est une hypothèse. Règle 3-2-1 : 3 copies, 2 supports différents, 1 hors site — complétée aujourd'hui par 1 copie immuable/hors ligne contre les ransomwares. Il faut un exercice de restauration PLANIFIÉ et chronométré (au moins annuel en banque), qui valide aussi la restauration des CLÉS de chiffrement et des dépendances (DNS, comptes de service)." },

{ id:"n9-dr-03", lvl:9, dom:"SRE",
  q:"Une région cloud entière tombe. Qu'est-ce qui casse en premier dans une architecture mal préparée ?",
  accept:["dns","bascule manuelle","etat","base primaire","dependance regionale"],
  explain:"Typiquement : la base primaire n'a pas de réplique promue automatiquement, le DNS pointe encore vers la région morte avec un TTL trop long, les secrets/clés KMS sont régionaux et non répliqués, le pipeline de déploiement lui-même vit dans la région tombée, et les quotas de la région de secours n'ont jamais été demandés. La capacité de secours indisponible au moment du besoin est l'échec le plus fréquent." },

{ id:"n9-gov-01", lvl:9, dom:"Sécurité",
  q:"Qu'est-ce que la séparation des tâches (SoD) et comment la mets-tu en œuvre dans un pipeline automatisé ?",
  accept:["celui qui developpe ne deploie pas","approbation","tracabilite","quatre yeux","role distinct"],
  explain:"Personne ne doit pouvoir seul écrire ET mettre en production un changement. En pipeline : branches protégées avec revue obligatoire par un tiers, environnements protégés avec approbation distincte pour la prod, identités de pipeline séparées (build ≠ deploy), interdiction du bypass des règles, journalisation immuable de qui a approuvé quoi. Le contrôle passe du geste manuel à la GOUVERNANCE DU PIPELINE — c'est cet argument qu'un auditeur bancaire attend." },

{ id:"n9-gov-02", lvl:9, dom:"Sécurité",
  q:"Un auditeur te demande de prouver ce qui tourne en production et qui l'a autorisé. Que lui montres-tu ?",
  must:[["git","historique","commit"],["pipeline","journal","log de deploiement"]],
  explain:"La chaîne complète : ticket/demande → PR avec revue et approbation nommée → commit signé → build tracé avec son artefact versionné et son SBOM → journal du pipeline de déploiement horodaté → état réel de la plateforme via l'IaC et l'inventaire (AWS Config, Azure Resource Graph). En GitOps, le dépôt Git EST la preuve de l'état désiré, et le contrôleur prouve la réconciliation." },

{ id:"n9-gov-03", lvl:9, dom:"Sécurité",
  q:"Comment gères-tu une exception à une politique de sécurité qui bloque une équipe en urgence ?",
  accept:["exemption tracee","duree limitee","approbation","risque accepte","ticket"],
  explain:"Jamais en désactivant la policy : on crée une EXEMPTION nommée, limitée à un périmètre, avec une date d'expiration, un propriétaire, une justification et une approbation du risque. On l'inscrit dans un registre revu périodiquement. Une exception sans date de fin devient une règle permanente que personne n'assume — c'est exactement ce que cherchent les auditeurs." },

{ id:"n9-cost-01", lvl:9, dom:"SRE",
  q:"Qu'est-ce que le FinOps et quelles sont ses trois phases ?",
  must:[["inform","visibilite","mesurer"],["optimize","optimiser"],["operate","gouverner","operer"]],
  explain:"Inform (visibilité : tagging, allocation des coûts par équipe, showback/chargeback), Optimize (rightsizing, engagements, architecture), Operate (gouvernance continue : budgets, alertes d'anomalie, coût intégré aux critères de conception). Le point clé : le coût devient une métrique d'ingénierie suivie comme la latence, avec un propriétaire — pas un rapport financier trimestriel." },

{ id:"n9-cost-02", lvl:9, dom:"SRE",
  q:"Une équipe veut du multi-cloud « pour ne pas être verrouillée ». Que réponds-tu ?",
  accept:["cout","denominateur commun","complexite","rarement justifie","competences"],
  explain:"Question honnête : le multi-cloud actif/actif coûte cher (double compétence, double outillage, réseau inter-cloud, dénominateur commun de services) et réduit souvent la fiabilité au lieu de l'augmenter. Alternatives : portabilité RAISONNABLE (conteneurs, IaC, standards ouverts, abstraction des points de sortie critiques) et négociation contractuelle. Le multi-cloud se justifie par une exigence réglementaire, une acquisition, ou un service unique — pas par la peur du verrouillage." },

{ id:"n9-k8s-01", lvl:9, dom:"Kubernetes",
  q:"Comment planifies-tu la mise à jour d'un cluster Kubernetes en production bancaire ?",
  must:[["notes de version","breaking change","api deprecie"],["recette","preprod","tester"],["node pool","progressif","par lot"]],
  explain:"1) Lire les notes de version et l'obsolescence des API ; scanner les manifestes (<code>pluto</code>, <code>kubent</code>). 2) Vérifier la compatibilité des addons (CNI, CSI, ingress, opérateurs, agents de sécurité). 3) Rejouer sur un cluster de recette identique. 4) Plan de contrôle d'abord, puis les node pools par lots avec surge, PDB en place et fenêtre annoncée. 5) Un saut de version mineure à la fois. 6) Plan de repli documenté et validation métier après chaque lot." },

{ id:"n9-k8s-02", lvl:9, dom:"Kubernetes",
  q:"Comment garantis-tu que seules des images approuvées peuvent tourner sur le cluster ?",
  must:[["admission","kyverno","gatekeeper","policy"],["signature","registry autorise","digest"]],
  explain:"Politique d'admission (Kyverno / OPA Gatekeeper) qui rejette toute image hors des registries approuvés, exige un digest plutôt qu'un tag mutable, et vérifie une signature Cosign contre une clé/identité de confiance. En amont : registry privé avec images de base durcies, scan bloquant en CI, et interdiction du pull depuis internet au niveau réseau. Le contrôle d'admission est la dernière barrière — il ne remplace pas la CI, il la rend non contournable." },

{ id:"n9-sec-01", lvl:9, dom:"Sécurité",
  q:"Comment conçois-tu la gestion des accès humains à la production ?",
  must:[["juste a temps","jit","temporaire","elevation"],["journal","audit","tracabilite"]],
  explain:"Accès juste-à-temps et temporaire (PIM Entra ID, AWS IAM Identity Center avec sessions courtes), avec justification, approbation et expiration automatique. Aucun compte permanent privilégié, MFA résistante au phishing, accès via bastion/Session Manager plutôt que SSH direct, enregistrement des sessions, et revues d'accès périodiques. L'objectif final : que l'accès humain direct devienne l'exception documentée, l'automatisation étant le chemin normal." },

{ id:"n9-sec-02", lvl:9, dom:"Sécurité",
  q:"Qu'est-ce que DORA (règlement européen) et pourquoi ça concerne un DevOps en banque ?",
  accept:["resilience operationnelle numerique","tiers","incident","test","2025"],
  explain:"Le Digital Operational Resilience Act, applicable depuis janvier 2025, impose au secteur financier européen : gestion du risque IT, notification des incidents majeurs dans des délais courts, tests de résilience (jusqu'aux tests de pénétration guidés par la menace), et surtout la surveillance des prestataires TIERS CRITIQUES — donc les fournisseurs cloud. Concrètement : registre des dépendances, stratégies de sortie, scénarios de bascule testés et documentés." },

{ id:"n9-data-01", lvl:9, dom:"Sécurité",
  q:"Quelles contraintes le RGPD impose-t-il à une architecture cloud, concrètement ?",
  must:[["localisation","residence","transfert"],["droit","effacement","minimisation","chiffrement"]],
  explain:"Localisation et encadrement des transferts hors UE, minimisation des données collectées, base légale et durée de conservation définies (donc des politiques de rétention réellement appliquées, y compris dans les logs et les sauvegardes), capacité à effacer et à exporter les données d'une personne, chiffrement et pseudonymisation, journalisation des accès, et notification d'une violation sous 72 h. Point sous-estimé : un ID utilisateur dans les logs et les backups est une donnée personnelle." },

{ id:"n9-arch-01", lvl:9, dom:"SRE",
  q:"Comment migres-tu une application legacy on-premise vers le cloud ? Cite la démarche et les stratégies possibles.",
  must:[["rehost","lift and shift"],["replatform","refactor","rearchitect"]],
  explain:"Inventaire et cartographie des dépendances d'abord, puis les 6R : Retire, Retain, Rehost (lift & shift, rapide mais aucun gain), Replatform (ajustements ciblés : base managée, conteneurisation), Repurchase (SaaS), Refactor (réécriture cloud-native, coûteux). Démarche : commencer par une application peu critique pour apprendre, pattern strangler pour découper progressivement, double run avec réversibilité, et migration des données planifiée avec sa fenêtre de bascule." },

{ id:"n9-arch-02", lvl:9, dom:"SRE",
  q:"Comment mesures-tu qu'une transformation DevOps réussit dans une organisation ?",
  must:[["dora","metrique","lead time","frequence"],["incident","qualite","satisfaction"]],
  explain:"Métriques DORA en tendance (fréquence, lead time, taux d'échec, MTTR), plus des indicateurs humains : temps passé en toil, charge d'astreinte et réveils nocturnes, satisfaction des développeurs, délai entre l'idée et le retour utilisateur. On évite les vanity metrics (nombre de pipelines, % de couverture). Une transformation qui accélère la livraison en épuisant les équipes n'est pas une réussite : elle est en dette." },

{ id:"n9-tf-01", lvl:9, dom:"Terraform",
  q:"Comment gères-tu la montée de version d'un provider majeur (ex : AzureRM v3 → v4) sur 40 states ?",
  must:[["notes de version","breaking change","changelog"],["progressif","par lot","non prod d abord"]],
  explain:"Lire le guide de migration et les breaking changes, épingler la version actuelle partout d'abord, faire un plan à blanc en non-prod pour mesurer l'impact réel (attention aux remplacements), corriger le code et les modules partagés, dérouler par lots en commençant par les périmètres à faible risque, avec un plan systématiquement relu par un humain. On ne monte JAMAIS un provider majeur sans plan préalable — le risque est la destruction/recréation silencieuse." },

{ id:"n9-tf-02", lvl:9, dom:"Terraform",
  q:"Comment fais-tu du Policy as Code sur l'infrastructure, et à quels moments ?",
  accept:["opa","conftest","sentinel","checkov","plan json","admission"],
  explain:"À trois moments complémentaires : 1) en CI sur le PLAN JSON (OPA/Conftest, Sentinel, Checkov) pour bloquer avant création — le moins cher. 2) À l'admission côté plateforme (Azure Policy deny, SCP AWS, Kyverno sur K8s) pour rendre le contrôle non contournable même hors pipeline. 3) En continu sur l'existant (Config, Defender for Cloud) pour détecter la dérive. La CI seule ne suffit pas : quelqu'un finira par agir hors pipeline." },

{ id:"n9-cicd-01", lvl:9, dom:"CI/CD",
  q:"Comment déploies-tu en production un vendredi à 16 h sans que ce soit une mauvaise idée ?",
  accept:["petits lots","rollback","feature flag","observabilite","progressif"],
  explain:"Ce n'est pas la date qui pose problème, c'est la confiance dans le processus : petits lots fréquents, déploiement progressif (canary) avec analyse automatique des métriques, feature flags pour découpler la mise en production de l'activation, rollback testé et rapide, observabilité qui détecte en minutes. Si on interdit le vendredi, c'est un aveu que le rollback n'est pas fiable — et c'est ÇA qu'il faut corriger. Nuance bancaire : les périodes de gel (clôture, arrêtés comptables) sont, elles, une contrainte métier légitime." },

{ id:"n9-cicd-02", lvl:9, dom:"CI/CD",
  q:"Quelle stratégie de branches et de versionnement recommandes-tu pour une plateforme partagée par 15 équipes ?",
  accept:["trunk based","semver","tags","branches courtes","compatibilite"],
  explain:"Trunk-based avec des branches de courte durée et intégration continue, versionnement sémantique des modules/templates partagés avec des tags immuables, dépréciation annoncée avant suppression (N-1 supporté), changelog et notes de migration. Les consommateurs épinglent une version et montent quand ils veulent, dans une fenêtre imposée. Ce qui casse une plateforme partagée, c'est le changement non versionné sur <code>main</code>." },

{ id:"n9-obs-01", lvl:9, dom:"Observabilité",
  q:"Comment construis-tu un SLO à partir de zéro pour une API critique ?",
  must:[["sli","indicateur","mesure"],["fenetre","periode","28","30 jours"],["budget d erreur","error budget"]],
  explain:"1) Identifier le parcours utilisateur critique. 2) Définir le SLI mesurable côté utilisateur (part de requêtes réussies sous 300 ms, mesurée au load balancer et non dans l'app). 3) Choisir une cible réaliste à partir de l'historique, pas un chiffre rond arbitraire. 4) Fenêtre glissante de 28-30 jours. 5) Dériver le budget d'erreur et les alertes de burn rate multi-fenêtres. 6) Faire VALIDER la cible par le métier — un SLO que le métier n'assume pas ne sert à rien." },

{ id:"n9-obs-02", lvl:9, dom:"Observabilité",
  q:"Pourquoi 99,99 % de disponibilité peut être un objectif déraisonnable ? Chiffre-le.",
  accept:["52 minutes","4 minutes par mois","cout","dependances","astreinte"],
  explain:"99,99 % = ~52 min d'indisponibilité par AN, soit ~4 min par mois : moins que le temps de détection humaine. Ça impose de l'automatisation totale de la bascule, du multi-région, une astreinte 24/7 et des dépendances au moins aussi fiables — or les SLA des services managés sous-jacents sont souvent à 99,9 %. On ne peut pas être plus fiable que la somme de ses dépendances : c'est l'argument à sortir quand un métier demande « du 100 % »." },

{ id:"n9-aws-01", lvl:9, dom:"AWS",
  q:"Comment centralises-tu la sécurité et les logs sur une organisation de 100 comptes AWS ?",
  must:[["compte dedie","log archive","centralise"],["organization","delegated","agrege"]],
  explain:"Comptes dédiés Log Archive et Security. CloudTrail organisationnel avec un trail unique vers un bucket centralisé immuable (Object Lock), VPC Flow Logs et logs de service agrégés, GuardDuty / Security Hub / Config activés par l'organisation avec un administrateur délégué, SCP interdisant de désactiver la journalisation, et alertes remontant à un SIEM unique. Point clé : le compte de logs doit être inaccessible en écriture aux comptes producteurs." },

{ id:"n9-az-01", lvl:9, dom:"Azure",
  q:"Comment appliques-tu une exigence de résidence des données « France uniquement » sur tout un tenant Azure ?",
  must:[["azure policy","allowed locations","deny"],["management group","niveau superieur"]],
  explain:"Initiative Azure Policy « Allowed locations » (et sa variante pour les resource groups) en mode Deny, assignée au niveau MANAGEMENT GROUP pour couvrir toutes les subscriptions présentes et futures, avec exemptions nominatives et datées pour les services globaux qui n'ont pas de notion de région. On complète par un contrôle de conformité continu, l'attention aux réplications géo (GRS vers la région appairée) et aux logs/sauvegardes qui peuvent sortir du périmètre sans qu'on y pense." }

]);

</script>

/* ========== NIVEAU 10 — ENTRETIEN SENIOR : ARBITRAGES & CONTRADICTION ========== */

{ id:"n10-01", lvl:10, dom:"SRE",
  q:"« Votre solution est trop complexe pour notre équipe. » Comment tu réagis en entretien quand un chef attaque ta proposition ?",
  accept:["je demande le contexte","je reformule","alternative","assume","arbitrage"],
  explain:"On ne défend pas son ego : on reformule la contrainte (« la complexité vous inquiète sur l'exploitabilité ou sur la montée en compétence ? »), on reconnaît ce qui est vrai, et on propose une version dégradée assumée avec ce qu'on perd. Un senior cherche à voir si tu SAIS ARBITRER, pas si tu as raison. La pire réponse est de camper ou de céder immédiatement sans argument." },

{ id:"n10-02", lvl:10, dom:"SRE",
  q:"On te demande « quelle est la première chose que tu fais en arrivant sur une plateforme que tu ne connais pas ? »",
  accept:["comprendre","cartographier","ecouter","observer","ne rien changer"],
  explain:"Écouter et cartographier avant de toucher : quels services, quels flux critiques, quels incidents récents, où est la douleur des équipes, qu'est-ce qui réveille les gens la nuit. Puis identifier les risques immédiats (sauvegardes non testées, secrets en clair, absence de rollback) et poser des quick wins mesurables. Arriver en imposant sa stack est le signal d'alarme numéro un pour un chef d'équipe." },

{ id:"n10-03", lvl:10, dom:"Kubernetes",
  q:"« On veut Kubernetes. » Quelles questions poses-tu avant de dire oui ?",
  must:[["besoin","pourquoi","probleme"],["equipe","competence","qui exploite"]],
  explain:"Quel problème cherche-t-on à résoudre (scaling, densité, portabilité, standardisation) ? Combien de services, quel volume ? Qui exploite le cluster à 3 h du matin et avec quelle compétence ? Quelles contraintes réglementaires ? Quelle alternative plus simple a été écartée (App Service, ECS, Container Apps) et pourquoi ? Kubernetes est un coût opérationnel permanent qu'il faut justifier — dire ça posément marque des points." },

{ id:"n10-04", lvl:10, dom:"Terraform",
  q:"Un architecte te dit : « le state Terraform, c'est un point de défaillance unique, on ne veut pas de ça en prod ». Que réponds-tu ?",
  accept:["backend redonde","versioning","sauvegarde","reconstruction par import","risque gere"],
  explain:"C'est un risque RÉEL mais géré : backend managé et répliqué (S3 avec versioning + réplication, Storage Account GRS), verrouillage, chiffrement, accès restreint, sauvegardes et restauration testées, et en dernier recours reconstruction par import. Le vrai point de défaillance unique, c'est l'infrastructure non décrite que personne ne sait recréer. On ne nie pas l'objection : on montre les contrôles." },

{ id:"n10-05", lvl:10, dom:"CI/CD",
  q:"« Chez nous on met en prod une fois par trimestre, et ça marche très bien. » Comment argumentes-tu sans braquer ?",
  accept:["taille du lot","risque","dora","rollback","progressif"],
  explain:"On ne dit pas « c'est archaïque ». On pointe le coût caché : un lot trimestriel contient des centaines de changements, donc en cas d'incident on ne sait pas lequel accuse, le rollback annule tout, et la charge de test est massive. Les données DORA montrent que la fréquence RÉDUIT le taux d'échec. Puis on propose un chemin progressif : découpler déploiement et activation (feature flags), automatiser les tests, viser mensuel avant hebdomadaire." },

{ id:"n10-06", lvl:10, dom:"Sécurité",
  q:"Le RSSI refuse tout accès sortant internet depuis les nœuds Kubernetes. Comment fais-tu tourner la plateforme ?",
  must:[["registry interne","miroir","proxy"],["private endpoint","endpoint prive","liaison privee"]],
  explain:"Registry privé miroir pour les images (et un miroir des dépôts de paquets/modules), proxy sortant autorisé par liste blanche de FQDN pour ce qui doit vraiment sortir, endpoints privés vers les services managés (registry, coffre, stockage, API du plan de contrôle), et CA d'entreprise injectée dans les images pour l'inspection TLS. C'est standard en banque : la question teste si tu as déjà travaillé en environnement contraint." },

{ id:"n10-07", lvl:10, dom:"Sécurité",
  q:"Un développeur a besoin d'un accès prod « juste pour 10 minutes » pour débloquer un incident client. Que fais-tu ?",
  accept:["acces temporaire","jit","approbation","enregistre","tracé"],
  explain:"On ne refuse pas et on ne donne pas un accès permanent : élévation juste-à-temps avec approbation, périmètre minimal, expiration automatique, session enregistrée, et un ticket rattaché à l'incident. Puis, en post-mortem : pourquoi l'observabilité n'a pas suffi à diagnostiquer sans accès ? L'accès prod récurrent est un symptôme d'outillage insuffisant, pas un besoin légitime durable." },

{ id:"n10-08", lvl:10, dom:"SRE",
  q:"Raconte un incident que tu as géré : quelle structure de réponse en entretien ?",
  must:[["contexte","situation"],["action","ce que j ai fait"],["resultat","apprentissage","ce que j ai change"]],
  explain:"Structure STAR resserrée : contexte et impact chiffré → ce que j'ai fait ET comment j'ai décidé (hypothèses testées, pourquoi j'ai mitigé avant de comprendre) → résultat mesuré → ce que j'ai changé DURABLEMENT ensuite. Les seniors écoutent surtout la dernière partie : un candidat qui ne tire pas d'action systémique d'un incident rejouera le même incident chez eux." },

{ id:"n10-09", lvl:10, dom:"SRE",
  q:"« Quelle est la dernière fois où tu t'es trompé techniquement ? » Pourquoi cette question, et comment y répondre ?",
  accept:["honnetete","apprentissage","je reconnais","ce que j ai change"],
  explain:"Elle teste la lucidité et la sécurité psychologique : quelqu'un qui n'a jamais tort ne rapportera pas ses erreurs en production. Réponse efficace : une vraie erreur technique avec impact réel, comment tu l'as détectée et assumée, et le garde-fou que tu as mis en place après. À éviter absolument : la fausse humilité (« je suis trop perfectionniste ») et l'erreur d'un collègue déguisée." },

{ id:"n10-10", lvl:10, dom:"AWS",
  q:"Conçois en 5 minutes une plateforme de paiement à 10 000 transactions/seconde. Par où commences-tu ?",
  must:[["exigence","question","clarifier"],["idempotence","coherence","transaction"]],
  explain:"D'abord CLARIFIER : pic ou soutenu ? latence acceptable ? cohérence forte obligatoire (oui pour du paiement) ? contraintes réglementaires et de traçabilité ? Ensuite : découpler par file avec idempotence stricte (clé d'idempotence pour ne jamais débiter deux fois), écriture durable avant acquittement, base transactionnelle partitionnée, event sourcing/journal immuable pour l'audit, back-pressure et dégradation contrôlée. Commencer à dessiner sans poser de questions est éliminatoire." },

{ id:"n10-11", lvl:10, dom:"SRE",
  q:"Idempotence : pourquoi est-ce LE concept central d'un système financier distribué ?",
  accept:["rejouer sans effet","une seule fois","cle d idempotence","doublon","retry"],
  explain:"Dans un système distribué, on ne sait jamais si un appel a échoué ou si c'est la réponse qui s'est perdue — donc on retente. Sans idempotence, un retry débite deux fois. On l'implémente avec une clé d'idempotence fournie par le client, stockée avec le résultat : un second appel avec la même clé renvoie le résultat initial sans réexécuter. C'est le fondement des sémantiques « exactly-once » observables." },

{ id:"n10-12", lvl:10, dom:"Kubernetes",
  q:"Trois chefs te contredisent en même temps sur un choix technique. Que fais-tu ?",
  accept:["ecouter","clarifier le critere","donnees","test","decision reversible"],
  explain:"On ramène le débat sur les CRITÈRES plutôt que sur les opinions : « on optimise pour quoi — le time-to-market, le coût d'exploitation, ou la conformité ? ». Puis on propose de trancher par la donnée (un POC borné, un test de charge) et on distingue décision réversible (on essaie vite) de décision irréversible (on prend le temps). Rester calme et structurer le désaccord est exactement ce qui est évalué." },

{ id:"n10-13", lvl:10, dom:"Terraform",
  q:"« Pourquoi l'IaC plutôt que des scripts ou la console ? » Réponds comme à un directeur, pas à un dev.",
  accept:["auditable","reproductible","revue","tracabilite","reduction du risque"],
  explain:"Langage direction : réduction du risque opérationnel (tout changement est revu, tracé et rejouable), reprise après sinistre (on reconstruit une région en heures au lieu de semaines), conformité et preuve d'audit intégrées, réduction de la dépendance aux personnes, et vitesse de livraison. Le coût — formation et discipline — est réel et doit être annoncé. Parler de HCL et de state à un directeur est une erreur de registre." },

{ id:"n10-14", lvl:10, dom:"Observabilité",
  q:"Comment convaincs-tu d'investir dans l'observabilité alors qu'« il n'y a pas d'incident en ce moment » ?",
  accept:["mttr","cout d un incident","temps de diagnostic","chiffrer","assurance"],
  explain:"On chiffre : temps moyen passé à diagnostiquer par incident × coût horaire de l'équipe × nombre d'incidents, plus le coût métier d'une minute d'indisponibilité. On montre les incidents où on a « redémarré sans comprendre ». On propose un pilote mesurable sur un service critique avec un objectif de MTTR. L'argument gagnant n'est jamais technique : c'est le temps de diagnostic transformé en euros." },

{ id:"n10-15", lvl:10, dom:"Sécurité",
  q:"On te demande de mettre en prod quelque chose que tu juges dangereux. Comment tu gères ?",
  accept:["expliquer le risque","ecrit","alternative","decision assumee","escalade"],
  explain:"1) Expliquer le risque concrètement (scénario, impact, probabilité), pas en termes moraux. 2) Proposer une alternative ou une mitigation qui permet d'avancer. 3) Si la décision est maintenue, la faire acter par écrit par la personne qui l'assume, avec un plan de remédiation daté. 4) Escalader seulement si l'enjeu est majeur. Ce qui est évalué : savoir alerter sans bloquer, et accepter qu'on n'est pas le décideur final." },

{ id:"n10-16", lvl:10, dom:"CI/CD",
  q:"Comment introduis-tu le GitOps dans une organisation qui déploie via des tickets et des opérateurs manuels ?",
  accept:["progressif","un service pilote","co-construction","preuve","conserver l approbation"],
  explain:"On ne supprime pas le contrôle, on le déplace : l'approbation devient une PR approuvée, le ticket reste comme trace, l'opérateur devient garant du pipeline. On commence par un service pilote non critique, on démontre le rollback et l'audit à l'équipe risque, on documente la traçabilité pour les auditeurs, puis on étend. Imposer l'outil avant d'avoir traité la question du contrôle échoue systématiquement en banque." },

{ id:"n10-17", lvl:10, dom:"SRE",
  q:"Quelle est la différence entre un bon et un mauvais runbook ?",
  accept:["actionnable","teste","a jour","decision","pas juste des commandes"],
  explain:"Un bon runbook part du SYMPTÔME observé, donne les commandes exactes à exécuter, indique comment vérifier l'effet, précise quand escalader et à qui, et il a été TESTÉ par quelqu'un qui n'est pas l'auteur — idéalement pendant un exercice. Un mauvais runbook décrit l'architecture, date de deux ans, suppose un contexte implicite et renvoie vers une page qui n'existe plus." },

{ id:"n10-18", lvl:10, dom:"Réseau",
  q:"Un flux entre deux applications ne passe pas et quatre équipes se renvoient la balle. Comment tu tranches ?",
  must:[["couche par couche","methodique","isoler"],["test","preuve","capture","telnet","tcpdump"]],
  explain:"On produit des PREUVES au lieu d'arguments : résolution DNS depuis la source, test TCP sur le port (<code>nc -zv</code>), capture des deux côtés (<code>tcpdump</code>) pour voir si le SYN arrive et si le SYN-ACK repart, lecture des flow logs. Ça localise le point exact de rupture et met fin au débat. La compétence évaluée est autant méthodologique que politique : ramener une discussion à des faits vérifiables." },

{ id:"n10-19", lvl:10, dom:"Kubernetes",
  q:"Le cluster va bien, les métriques sont vertes, mais les utilisateurs se plaignent. Comment procèdes-tu ?",
  accept:["mesurer cote utilisateur","bout en bout","synthetique","hors du cluster","cdn dns"],
  explain:"Le problème est presque toujours en dehors du périmètre observé : DNS, CDN, WAF, certificat, réseau opérateur, client mobile, ou un endpoint particulier noyé dans les moyennes. On mesure depuis le POINT DE VUE UTILISATEUR (tests synthétiques externes, RUM), on segmente (région, version de client, endpoint), et on remonte le chemin. « Mes dashboards sont verts » n'est jamais une réponse acceptable face à des utilisateurs qui souffrent." },

{ id:"n10-20", lvl:10, dom:"SRE",
  q:"Quelles questions poses-tu, TOI, à la fin de l'entretien ? Pourquoi ça compte ?",
  accept:["astreinte","incident","dette","organisation","autonomie","roadmap"],
  explain:"Des questions qui montrent que tu penses en exploitant : comment se passe l'astreinte et à quelle fréquence ça sonne ? Quel a été le dernier incident majeur et qu'est-ce qui a changé après ? Quelle est la plus grosse dette technique assumée ? Quelle autonomie a l'équipe pour mettre en prod ? Qu'attendez-vous de cette personne dans 6 mois ? Ne poser aucune question, ou seulement sur le télétravail, casse une bonne performance technique." },

{ id:"n10-21", lvl:10, dom:"Sécurité",
  q:"Comment expliques-tu à un métier non technique pourquoi il faut arrêter les mots de passe partagés dans un fichier Excel ?",
  accept:["tracabilite","qui a fait quoi","revocation","coffre","impact"],
  explain:"Sans jargon : « aujourd'hui, si quelqu'un fait une erreur ou part, on ne peut ni savoir qui a agi ni couper son accès sans bloquer tout le monde ». On parle traçabilité, révocation individuelle et responsabilité — pas de chiffrement. Puis on propose la solution qui ne dégrade pas leur quotidien : un coffre avec accès nominatif, et on accompagne la bascule. La sécurité qui rend le travail impossible est contournée." },

{ id:"n10-22", lvl:10, dom:"AWS",
  q:"Ton prédécesseur a laissé une infrastructure entièrement créée à la main, sans documentation. Quel est ton plan sur 3 mois ?",
  must:[["inventaire","cartographie","decouvrir"],["import","iac","reprendre en code"]],
  explain:"1) Inventaire automatisé (Config/Resource Graph, tags, coûts) et cartographie des flux critiques. 2) Geler la création manuelle et exiger l'IaC pour tout ce qui est NOUVEAU — arrêter l'hémorragie avant de nettoyer. 3) Sauvegardes et accès d'urgence vérifiés en priorité. 4) Reprise en IaC par import, en commençant par le socle stable (réseau, IAM) puis les applications. 5) Documenter au fur et à mesure. Vouloir tout réécrire d'un coup est le piège." },

{ id:"n10-23", lvl:10, dom:"SRE",
  q:"« On n'a pas le temps de faire les choses proprement. » Comment tu réponds concrètement ?",
  accept:["dette","interet","chiffrer","incremental","negocier"],
  explain:"On accepte la contrainte mais on la nomme : c'est une DETTE, avec un intérêt qui se paiera en incidents et en lenteur. On demande à ce qu'elle soit tracée avec un propriétaire et une échéance, on négocie un pourcentage de capacité récurrent (10-20 % par sprint) plutôt qu'un grand chantier futur qui n'arrivera jamais, et on fait le minimum non négociable maintenant : sauvegardes, rollback, observabilité de base." },

{ id:"n10-24", lvl:10, dom:"Kubernetes",
  q:"Comment expliquerais-tu Kubernetes à un chef de projet qui n'est pas technique, en 30 secondes ?",
  accept:["chef d orchestre","maintient l etat","redemarre","repartit","automatise"],
  explain:"« C'est un chef d'orchestre pour nos applications : on lui décrit ce qu'on veut — trois copies de l'application, qui répondent sur ce port, avec ces ressources — et il s'assure en permanence que c'est le cas. Si une machine tombe ou qu'une copie plante, il redémarre ailleurs sans que personne n'intervienne, et il sait déployer une nouvelle version progressivement sans coupure. » Savoir vulgariser est une compétence évaluée à ce niveau." },

{ id:"n10-25", lvl:10, dom:"SRE",
  q:"Sur quoi te ferais-tu challenger si tu prétends être senior, et que tu ne maîtrises pas encore ? Comment le dis-tu ?",
  accept:["honnete","ce que je sais faire","comment j apprends","exemple"],
  explain:"On assume une zone précise (« je n'ai pas opéré de service mesh en production, j'ai fait un POC Istio ») et on montre immédiatement le processus : comment j'ai appris Kubernetes en partant de zéro, en combien de temps, avec quel résultat. Bluffer sur une technologie que trois seniors connaissent est éliminatoire en une relance. Dire « je ne sais pas, voilà comment je m'y prendrais » est une réponse forte." },

{ id:"n10-26", lvl:10, dom:"CI/CD",
  q:"Quelle est la valeur réelle d'un environnement de recette identique à la production, et pourquoi c'est rarement vrai ?",
  accept:["donnees","volume","cout","derive","charge"],
  explain:"La valeur : les bugs de configuration et d'intégration se voient avant la prod. Pourquoi c'est rarement vrai : le volume et la nature des données diffèrent (anonymisation), la charge n'est pas reproduite, la topologie réseau est simplifiée, et la recette dérive dès qu'on y touche à la main. D'où : générer les deux avec le MÊME code IaC paramétré, et compléter par des tests en production maîtrisée (canary, shadow traffic) plutôt que de croire à une recette parfaite." },

{ id:"n10-27", lvl:10, dom:"Sécurité",
  q:"Quelle est la première mesure de sécurité que tu mettrais en place sur une plateforme cloud qui n'en a aucune ?",
  accept:["mfa","identite","journalisation","supprimer les acces","racine"],
  explain:"Réponse défendable : verrouiller les IDENTITÉS — MFA obligatoire, sécurisation/blocage du compte racine, suppression des clés d'accès statiques et des comptes dormants, accès administrateur nominatif et temporaire. Juste après : activer la journalisation immuable pour pouvoir enquêter. Les identités et les traces d'abord ; le chiffrement et la segmentation viennent après, car sans identité maîtrisée le reste ne protège rien." },

{ id:"n10-28", lvl:10, dom:"SRE",
  q:"On te propose de rejoindre une équipe où tout est manuel mais où personne ne veut changer. Que fais-tu les 30 premiers jours ?",
  accept:["comprendre pourquoi","gagner la confiance","petit gain","aider","douleur"],
  explain:"Comprendre POURQUOI ça n'a pas changé — souvent une tentative passée qui a mal fini, un manque de temps, ou une peur légitime de perdre le contrôle. Gagner en crédibilité en prenant les tâches pénibles avec eux, puis automatiser UNE douleur concrète qu'ils ont nommée, et leur en donner le mérite. Le changement technique en environnement bancaire est d'abord un travail de confiance ; arriver en donneur de leçons garantit l'échec." }

]);

</script>
<script>
/* data/niveau01b.js */
window.QBANK = (window.QBANK || []).concat([
/* ============ NIVEAU 1 — SÉRIE B ============ */

{ id:"b1-linux-01", lvl:1, dom:"Linux",
  q:"Différence entre un chemin absolu et un chemin relatif ? Pourquoi ça compte dans un script de CI ?",
  accept:["part de la racine","commence par /","depend du repertoire courant","cwd"],
  explain:"Un chemin absolu part de <code>/</code> et est toujours le même. Un chemin relatif dépend du répertoire courant, qui n'est pas garanti dans un runner de CI ou un service systemd. D'où : chemins absolus, ou <code>cd \"$(dirname \"$0\")\"</code> en début de script." },

{ id:"b1-linux-02", lvl:1, dom:"Linux",
  q:"À quoi sert le pipe <code>|</code> et qu'est-ce qui transite dedans exactement ?",
  accept:["stdout vers stdin","sortie standard","chaine","enchainer"],
  explain:"Il connecte le <b>stdout</b> de la commande de gauche au <b>stdin</b> de celle de droite. Seul stdout passe — stderr continue vers le terminal, sauf <code>2>&1</code> ou <code>|&</code>. Les commandes s'exécutent en parallèle, pas l'une après l'autre." },

{ id:"b1-linux-03", lvl:1, dom:"Linux",
  q:"Que contient <code>/etc/passwd</code> et qu'est-ce qui n'y est PAS ?",
  accept:["pas les mots de passe","shadow","comptes","utilisateurs"],
  explain:"Les comptes utilisateurs : login, UID, GID, home, shell. Les mots de passe hachés sont dans <code>/etc/shadow</code>, lisible uniquement par root — d'où le <code>x</code> dans le champ mot de passe de passwd." },

{ id:"b1-linux-04", lvl:1, dom:"Linux",
  q:"Que fait <code>&amp;&amp;</code> par rapport à <code>;</code> entre deux commandes ?",
  accept:["si la premiere reussit","code de retour 0","conditionnel","succes"],
  explain:"<code>;</code> enchaîne inconditionnellement. <code>&amp;&amp;</code> n'exécute la seconde que si la première a retourné 0 (succès). <code>||</code> fait l'inverse : seulement en cas d'échec. C'est la base du <code>cmd || exit 1</code> dans les scripts." },

{ id:"b1-linux-05", lvl:1, dom:"Linux",
  q:"À quoi sert la variable <code>PATH</code> ?",
  accept:["repertoires de recherche","ou chercher les executables","liste de chemins"],
  explain:"Elle liste les répertoires où le shell cherche un exécutable quand on tape son nom sans chemin. <code>which</code>/<code>command -v</code> montre lequel est retenu (le premier trouvé). Piège de sécurité : ne jamais mettre <code>.</code> dans le PATH." },

{ id:"b1-docker-01", lvl:1, dom:"Docker",
  q:"Que fait <code>docker run</code> par rapport à <code>docker start</code> ?",
  accept:["cree un nouveau conteneur","relance un existant","creation"],
  explain:"<code>run</code> = <code>create</code> + <code>start</code> : il crée un NOUVEAU conteneur depuis une image. <code>start</code> relance un conteneur existant déjà créé (avec sa couche d'écriture et sa config). Enchaîner des <code>run</code> laisse des dizaines de conteneurs arrêtés qui remplissent le disque." },

{ id:"b1-docker-02", lvl:1, dom:"Docker",
  q:"À quoi sert <code>EXPOSE 8080</code> dans un Dockerfile ? Ça publie le port ?",
  accept:["documentation","ne publie pas","non","metadonnee","-p"],
  explain:"Non : c'est purement déclaratif (métadonnée + utilisable par <code>-P</code>). Pour rendre le port joignable depuis l'hôte il faut <code>-p 8080:8080</code> au run, ou un Service côté Kubernetes. Beaucoup de candidats se trompent là-dessus." },

{ id:"b1-docker-03", lvl:1, dom:"Docker",
  q:"À quoi sert un fichier <code>.dockerignore</code> ?",
  accept:["exclure du contexte","reduire le contexte","eviter d envoyer","secrets"],
  explain:"Il exclut des fichiers du CONTEXTE de build envoyé au daemon. Double bénéfice : builds beaucoup plus rapides (on n'envoie pas <code>node_modules</code> ni <code>.git</code>) et sécurité (on n'embarque pas <code>.env</code> ou des clés par un <code>COPY . .</code>)." },

{ id:"b1-k8s-01", lvl:1, dom:"Kubernetes",
  q:"Que signifie « Kubernetes est déclaratif » dans la pratique quotidienne ?",
  accept:["etat desire","yaml","reconcilie","tu decris le resultat"],
  explain:"Tu décris l'état voulu dans un manifeste (3 réplicas de cette image) et le cluster s'arrange en permanence pour l'atteindre et le maintenir. Tu ne dis jamais « démarre ce conteneur sur ce serveur ». Corollaire : supprimer un Pod à la main ne sert à rien, le contrôleur le recrée." },

{ id:"b1-k8s-02", lvl:1, dom:"Kubernetes",
  q:"Quelle est la différence entre <code>kubectl apply</code> et <code>kubectl create</code> ?",
  accept:["apply idempotent","create echoue si existe","met a jour","declaratif"],
  explain:"<code>create</code> est impératif : il échoue si l'objet existe déjà. <code>apply</code> est déclaratif et idempotent : il crée ou met à jour en calculant un diff (via l'annotation last-applied ou le server-side apply). En pipeline, c'est toujours <code>apply</code>." },

{ id:"b1-k8s-03", lvl:1, dom:"Kubernetes",
  q:"Que se passe-t-il si tu supprimes manuellement un Pod géré par un Deployment ?",
  accept:["recree","remplace","le controleur","nouveau pod"],
  explain:"Le ReplicaSet constate qu'il manque un réplica et en crée un nouveau (avec un nouveau nom et une nouvelle IP). C'est la boucle de réconciliation. Pour vraiment arrêter le service, il faut modifier le Deployment (réplicas à 0) ou le supprimer." },

{ id:"b1-tf-01", lvl:1, dom:"Terraform",
  q:"Que fait <code>terraform fmt</code> et pourquoi le mettre en CI ?",
  accept:["formate","indentation","canonique","coherence"],
  explain:"Il réécrit les fichiers au format canonique HCL. En CI on utilise <code>terraform fmt -check -recursive</code> qui échoue si du code n'est pas formaté : ça supprime définitivement les débats de style en revue de code et les diffs parasites." },

{ id:"b1-tf-02", lvl:1, dom:"Terraform",
  q:"Quelle est la différence entre <code>terraform validate</code> et <code>terraform plan</code> ?",
  accept:["hors ligne","sans appel api","syntaxe","coherence interne","plan interroge"],
  explain:"<code>validate</code> vérifie la syntaxe et la cohérence interne SANS appeler les API du cloud ni lire le state — donc très rapide, utilisable sans credentials. <code>plan</code> interroge réellement le fournisseur et compare avec le state." },

{ id:"b1-tf-03", lvl:1, dom:"Terraform",
  q:"À quoi sert un fichier <code>.tfvars</code> ?",
  accept:["valeurs des variables","par environnement","separer","alimenter"],
  explain:"Il fournit les valeurs des variables d'entrée, séparément du code : <code>terraform apply -var-file=prod.tfvars</code>. <code>terraform.tfvars</code> et <code>*.auto.tfvars</code> sont chargés automatiquement. Ne jamais y mettre de secret commité." },

{ id:"b1-aws-01", lvl:1, dom:"AWS",
  q:"Qu'est-ce qu'un bucket S3 et quelle est la contrainte sur son nom ?",
  accept:["globalement unique","unique au monde","conteneur d objets","dns"],
  explain:"Un conteneur d'objets. Son nom est <b>globalement unique sur tout AWS</b> (il fait partie d'un nom DNS), en minuscules, sans underscore. D'où les conventions de nommage avec préfixe entreprise + compte + région." },

{ id:"b1-aws-02", lvl:1, dom:"AWS",
  q:"Différence entre une IP publique EC2 et une Elastic IP ?",
  accept:["change au redemarrage","fixe","statique","reservee"],
  explain:"L'IP publique auto-assignée change à chaque arrêt/démarrage de l'instance. Une Elastic IP est une IP fixe réservée à ton compte, réattachable à une autre instance — utile pour du whitelisting partenaire ou un enregistrement DNS. Elle est facturée quand elle n'est PAS attachée." },

{ id:"b1-aws-03", lvl:1, dom:"AWS",
  q:"Qu'est-ce qu'AWS CloudFormation, et son équivalent Azure ?",
  accept:["iac natif","arm","bicep","templates"],
  explain:"C'est l'IaC native d'AWS (templates YAML/JSON, notion de <em>stack</em>, état géré par AWS). L'équivalent Azure est ARM / Bicep. Différence avec Terraform : pas de state à gérer soi-même, mais mono-cloud." },

{ id:"b1-az-01", lvl:1, dom:"Azure",
  q:"Qu'est-ce qu'un App Service Plan et pourquoi c'est un piège de facturation ?",
  accept:["ressources de calcul","factures meme sans app","tier","mutualise"],
  explain:"C'est le socle de calcul (VM sous-jacente, tier, nombre d'instances) sur lequel tournent une ou plusieurs App Services. On paie le PLAN, pas l'app : un plan Premium vide continue de coûter. Plusieurs apps sur un même plan se partagent CPU et mémoire." },

{ id:"b1-az-02", lvl:1, dom:"Azure",
  q:"À quoi sert Azure Blob Storage et quels sont ses tiers d'accès ?",
  accept:["hot","cool","archive","objet","non structure"],
  explain:"Stockage d'objets non structurés (fichiers, images, sauvegardes, logs). Tiers : Hot (accès fréquent, stockage cher / accès peu cher), Cool (30 j min), Cold, Archive (180 j min, réhydratation de plusieurs heures). On automatise le passage par des règles de cycle de vie." },

{ id:"b1-res-01", lvl:1, dom:"Réseau",
  q:"Quelle différence entre le port 80 et le port 443 ?",
  accept:["http","https","chiffre","tls"],
  explain:"80 = HTTP en clair, 443 = HTTPS (HTTP sur TLS). En production on redirige systématiquement 80 → 443 et on active HSTS pour que le navigateur n'essaie même plus le port 80." },

{ id:"b1-res-02", lvl:1, dom:"Réseau",
  q:"À quoi sert le fichier <code>/etc/hosts</code> et quelle est sa priorité par rapport au DNS ?",
  accept:["resolution locale","avant le dns","prioritaire","statique"],
  explain:"Il fait une résolution nom → IP locale, consultée AVANT le DNS (selon <code>/etc/nsswitch.conf</code>). Pratique pour tester une bascule ou contourner un DNS. Piège : un <code>/etc/hosts</code> oublié sur un serveur provoque des comportements incompréhensibles." },

{ id:"b1-res-03", lvl:1, dom:"Réseau",
  q:"Qu'est-ce qu'une passerelle par défaut (default gateway) ?",
  accept:["route par defaut","0.0.0.0/0","sortie du reseau","routeur"],
  explain:"C'est l'équipement vers lequel on envoie tout paquet dont la destination n'est pas sur le réseau local — la route <code>0.0.0.0/0</code>. Dans un VPC, ce rôle est tenu par l'Internet Gateway ou le NAT Gateway selon le subnet." },

{ id:"b1-git-01", lvl:1, dom:"Git",
  q:"À quoi sert le fichier <code>.gitignore</code> et que fait-il si le fichier est DÉJÀ suivi ?",
  accept:["ignorer","rien","deja suivi","git rm --cached"],
  explain:"Il empêche Git de suivre les fichiers correspondants. Mais il n'a AUCUN effet sur un fichier déjà suivi : il faut d'abord <code>git rm --cached fichier</code>. C'est la raison n°1 pour laquelle un <code>.env</code> continue d'apparaître dans les commits." },

{ id:"b1-git-02", lvl:1, dom:"Git",
  q:"Qu'est-ce qu'une branche Git, techniquement ?",
  accept:["pointeur","reference","vers un commit","leger"],
  explain:"Un simple pointeur mobile vers un commit (un fichier de 41 octets dans <code>.git/refs/heads/</code>). C'est pour ça que créer une branche est instantané et gratuit — contrairement à d'autres SCM où c'est une copie." },

{ id:"b1-git-03", lvl:1, dom:"Git",
  q:"Que fait <code>git clone</code> par rapport à <code>git init</code> ?",
  accept:["copie un depot existant","cree un depot vide","distant","origin"],
  explain:"<code>init</code> crée un dépôt vide localement. <code>clone</code> copie un dépôt distant complet (tout l'historique, toutes les branches) et configure automatiquement le remote <code>origin</code> ainsi que la branche de suivi." },

{ id:"b1-cicd-01", lvl:1, dom:"CI/CD",
  q:"Qu'est-ce qu'un runner (ou agent) de CI ?",
  accept:["machine qui execute","execute les jobs","worker"],
  explain:"C'est la machine (VM, conteneur, pod) qui exécute réellement les jobs du pipeline. Hébergé par le fournisseur (shared) ou par toi (self-hosted, souvent obligatoire en banque pour accéder au réseau interne)." },

{ id:"b1-cicd-02", lvl:1, dom:"CI/CD",
  q:"Qu'est-ce qu'un webhook et à quoi ça sert dans une chaîne CI/CD ?",
  accept:["appel http","declenche","notification","evenement"],
  explain:"C'est un appel HTTP envoyé automatiquement par un système quand un événement se produit (push, PR ouverte, tag créé). C'est le mécanisme qui déclenche un pipeline sans polling. Il doit être signé/vérifié, sinon n'importe qui peut déclencher tes builds." },

{ id:"b1-sec-01", lvl:1, dom:"Sécurité",
  q:"Qu'est-ce que le MFA et pourquoi un mot de passe fort ne suffit-il pas ?",
  accept:["deuxieme facteur","authentification multifacteur","quelque chose que tu possedes","phishing"],
  explain:"L'authentification multifacteur combine plusieurs catégories : ce que tu SAIS (mot de passe), ce que tu POSSÈDES (clé, téléphone), ce que tu ES (biométrie). Un mot de passe, même fort, peut être volé par phishing ou fuite de base. Le MFA rend ce vol seul inexploitable — d'où son caractère obligatoire sur les comptes privilégiés." },

{ id:"b1-sec-02", lvl:1, dom:"Sécurité",
  q:"Quelle différence entre hacher et chiffrer un mot de passe ?",
  accept:["hachage irreversible","sens unique","chiffrement reversible","bcrypt"],
  explain:"Le hachage est à SENS UNIQUE : on ne peut pas revenir en arrière, on compare des empreintes. Le chiffrement est réversible avec la clé. Un mot de passe se HACHE (bcrypt, argon2, avec un sel), jamais ne se chiffre — sinon quiconque a la clé a tous les mots de passe." },

{ id:"b1-obs-01", lvl:1, dom:"Observabilité",
  q:"Qu'est-ce qu'un dashboard utile par rapport à un dashboard décoratif ?",
  accept:["repond a une question","actionnable","decision","trop de graphiques"],
  explain:"Un dashboard utile répond à une question précise (« le service est-il sain ? », « où est le goulot ? ») et se lit en 10 secondes. Un dashboard à 40 graphiques ne se lit pas pendant un incident : on le regarde parce qu'il est joli, pas parce qu'il aide à décider." },

{ id:"b1-sre-01", lvl:1, dom:"SRE",
  q:"Qu'est-ce que la haute disponibilité, et en quoi diffère-t-elle de la reprise après sinistre ?",
  accept:["panne locale","automatique","dr = sinistre majeur","autre region","continuite"],
  explain:"La HA absorbe automatiquement une panne LOCALE (une instance, une AZ) sans intervention et sans coupure notable. Le DR répond à un sinistre MAJEUR (perte d'une région, corruption, ransomware) et implique généralement une bascule décidée, avec un RTO/RPO négociés. Beaucoup de candidats confondent les deux." },

{ id:"b1-sre-02", lvl:1, dom:"SRE",
  q:"Qu'est-ce qu'un single point of failure ? Donne un exemple qu'on oublie souvent.",
  accept:["point unique","spof","dns","certificat","une seule instance"],
  explain:"Un composant dont la panne suffit à tout arrêter. Les exemples oubliés : le DNS, l'autorité de certification, le service d'authentification, le registry d'images, le coffre à secrets — et parfois le pipeline CI dont dépend le rollback." },

{ id:"b1-sql-01", lvl:1, dom:"SQL",
  q:"Qu'est-ce qu'une clé primaire et une clé étrangère ?",
  accept:["identifie de maniere unique","reference","integrite referentielle","unique"],
  explain:"La clé primaire identifie de façon unique chaque ligne d'une table (unique + non nulle, indexée automatiquement). La clé étrangère référence la clé primaire d'une autre table et garantit l'intégrité référentielle : on ne peut pas créer une commande pour un client inexistant." },

{ id:"b1-sql-02", lvl:1, dom:"SQL",
  q:"Que fait <code>COMMIT</code> et que fait <code>ROLLBACK</code> ?",
  accept:["valide","annule","transaction","definitif"],
  explain:"<code>COMMIT</code> valide définitivement la transaction : les modifications deviennent visibles aux autres et durables. <code>ROLLBACK</code> annule tout depuis le début de la transaction. Tant qu'on n'a pas commité, on tient des verrous — d'où la règle des transactions courtes." },

{ id:"b1-sql-03", lvl:1, dom:"SQL",
  q:"Différence entre <code>DELETE</code>, <code>TRUNCATE</code> et <code>DROP</code> ?",
  must:[["ligne","where","transactionnel"],["vide la table","toutes les lignes"],["supprime la table","structure"]],
  explain:"<code>DELETE</code> supprime des lignes (avec WHERE), c'est journalisé et annulable. <code>TRUNCATE</code> vide toute la table très rapidement (peu de journalisation, remet souvent les séquences à zéro, souvent non annulable). <code>DROP</code> supprime la table elle-même, structure comprise." }

]);

</script>
<script>
/* data/niveau02b.js */
window.QBANK = (window.QBANK || []).concat([
/* ============ NIVEAU 2 — SÉRIE B ============ */

{ id:"b2-linux-01", lvl:2, dom:"Linux",
  q:"Comment lances-tu un processus qui survit à la fermeture de ta session SSH ?",
  accept:["nohup","tmux","screen","systemd-run","disown"],
  explain:"<code>nohup cmd &amp;</code>, ou mieux <code>tmux</code>/<code>screen</code> pour pouvoir revenir dessus, ou <code>systemd-run --user</code>. Sans ça, la fermeture du terminal envoie SIGHUP au groupe de processus et tue le job. En production, la vraie réponse est : une unité systemd, pas un nohup." },

{ id:"b2-linux-02", lvl:2, dom:"Linux",
  q:"Que fait <code>tail -f</code> et quelle est sa limite avec la rotation de logs ?",
  accept:["suit le fichier","perd le fichier","tail -F","rotation","inode"],
  explain:"<code>-f</code> suit le descripteur : après une rotation, il continue de lire l'ANCIEN fichier renommé et n'affiche plus rien. <code>tail -F</code> suit le NOM et rouvre le fichier après rotation. Détail qui trahit l'expérience terrain." },

{ id:"b2-linux-03", lvl:2, dom:"Linux",
  q:"Comment vois-tu l'espace disque ET les inodes, et pourquoi les deux ?",
  must:[["df -h"],["df -i","inode"]],
  explain:"<code>df -h</code> pour les octets, <code>df -i</code> pour les inodes. On peut avoir 90 % d'espace libre et 100 % d'inodes utilisés : typiquement des millions de petits fichiers (sessions PHP, caches, messages). Le symptôme est un « No space left on device » incompréhensible." },

{ id:"b2-linux-04", lvl:2, dom:"Linux",
  q:"À quoi sert <code>cron</code> et quelle est la première cause d'échec d'un job cron qui marche en manuel ?",
  accept:["environnement","path","variables","pas le meme shell"],
  explain:"cron planifie des tâches récurrentes. Cause n°1 d'échec : l'environnement minimal — PATH réduit, pas de variables du <code>.bashrc</code>, pas de HOME identique. Correctif : chemins absolus partout, variables déclarées explicitement, et rediriger stdout/stderr vers un fichier pour voir l'erreur." },

{ id:"b2-linux-05", lvl:2, dom:"Linux",
  q:"Quelle différence entre <code>su</code>, <code>su -</code> et <code>sudo</code> ?",
  accept:["environnement de connexion","sudo journalise","par commande","login shell"],
  explain:"<code>su</code> change d'utilisateur en gardant l'environnement courant ; <code>su -</code> ouvre un login shell complet (PATH, HOME, profil de la cible). <code>sudo</code> élève les privilèges commande par commande, avec journalisation et politique fine dans sudoers — c'est le seul acceptable en production auditée." },

{ id:"b2-git-01", lvl:2, dom:"Git",
  q:"Comment résous-tu un conflit de merge ? Décris les étapes.",
  accept:["editer les marqueurs","git add","git merge --continue","choisir"],
  explain:"Git marque les zones en conflit (<code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code>, <code>=======</code>, <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt;</code>). On édite le fichier pour produire le résultat voulu (pas juste choisir un côté), on retire les marqueurs, <code>git add</code> le fichier, puis <code>git merge --continue</code>. <code>git merge --abort</code> pour tout annuler. Le vrai remède est en amont : petites branches et intégration fréquente." },

{ id:"b2-git-02", lvl:2, dom:"Git",
  q:"À quoi sert un tag Git et quelle différence entre tag léger et tag annoté ?",
  accept:["marquer une version","annote contient","objet","signature","metadonnees"],
  explain:"Un tag marque un point de l'historique (une release). Le tag léger est un simple pointeur ; le tag annoté est un OBJET Git avec auteur, date, message et possibilité de signature GPG. En production on utilise des tags annotés et signés — c'est ce qui rend la release auditable." },

{ id:"b2-git-03", lvl:2, dom:"Git",
  q:"Que fait <code>git push --force-with-lease</code> et pourquoi le préférer à <code>--force</code> ?",
  accept:["verifie","refuse si quelqu un a pousse","protege","etat attendu"],
  explain:"<code>--force</code> écrase le distant quoi qu'il arrive, y compris le travail poussé par un collègue entre-temps. <code>--force-with-lease</code> vérifie d'abord que le distant est bien à l'état que tu as observé, et refuse sinon. C'est le réflexe qui évite d'effacer le travail des autres." },

{ id:"b2-docker-01", lvl:2, dom:"Docker",
  q:"Différence entre <code>docker exec</code> et <code>docker attach</code> ?",
  accept:["nouveau processus","processus principal","pid 1","shell separe"],
  explain:"<code>exec</code> lance un NOUVEAU processus dans le conteneur (typiquement un shell) — c'est ce qu'on veut pour déboguer, et sortir ne tue rien. <code>attach</code> se branche sur le processus PID 1 existant : un Ctrl+C peut arrêter le conteneur." },

{ id:"b2-docker-02", lvl:2, dom:"Docker",
  q:"À quoi sert Docker Compose et quelle est sa limite en production ?",
  accept:["plusieurs conteneurs","dev","un seul hote","pas d orchestration","pas de ha"],
  explain:"Il décrit et lance plusieurs conteneurs liés (app + base + cache) sur UNE machine. Limite : pas de haute disponibilité, pas de scheduling multi-nœuds, pas de self-healing réel, pas de rolling update sûr. C'est excellent en dev et en test, ce n'est pas un orchestrateur de production." },

{ id:"b2-docker-03", lvl:2, dom:"Docker",
  q:"Que fait un HEALTHCHECK Docker et à quoi ça correspond dans Kubernetes ?",
  accept:["verifie la sante","readiness","liveness","statut unhealthy"],
  explain:"Il exécute périodiquement une commande dans le conteneur pour marquer son état (healthy/unhealthy), ce que Compose et Swarm exploitent. L'équivalent Kubernetes, ce sont les probes (liveness/readiness/startup) — et K8s ignore le HEALTHCHECK de l'image : il faut définir les probes." },

{ id:"b2-k8s-01", lvl:2, dom:"Kubernetes",
  q:"Quelle est la différence entre un Job et un CronJob ?",
  accept:["ponctuel","planifie","recurrent","schedule"],
  explain:"Un Job exécute un traitement jusqu'à complétion (avec <code>completions</code>, <code>parallelism</code>, <code>backoffLimit</code>). Un CronJob crée des Jobs selon une planification cron. Pièges du CronJob : <code>concurrencyPolicy</code> (que faire si le précédent tourne encore) et l'historique conservé qui remplit le namespace." },

{ id:"b2-k8s-02", lvl:2, dom:"Kubernetes",
  q:"Qu'est-ce qu'un initContainer et à quoi ça sert concrètement ?",
  accept:["avant les conteneurs","sequentiel","attendre","preparer","migration"],
  explain:"Un conteneur qui s'exécute jusqu'à son terme AVANT les conteneurs principaux, séquentiellement. Usages : attendre qu'une dépendance soit prête, appliquer une migration de base, récupérer un fichier de config ou un secret, ajuster des permissions sur un volume. S'il échoue, le Pod redémarre." },

{ id:"b2-k8s-03", lvl:2, dom:"Kubernetes",
  q:"Comment injectes-tu la valeur d'un ConfigMap dans un conteneur ? Cite les deux méthodes et leur différence majeure.",
  must:[["variable d environnement","env"],["volume","fichier","monte"]],
  explain:"1) En variables d'environnement (<code>envFrom</code> / <code>valueFrom</code>) : simple, mais figé au démarrage — modifier le ConfigMap n'a aucun effet sans redémarrage. 2) Monté en volume : les fichiers sont mis à jour automatiquement (avec un délai), ce qui permet le rechargement à chaud si l'application le gère." },

{ id:"b2-k8s-04", lvl:2, dom:"Kubernetes",
  q:"À quoi sert <code>kubectl rollout undo</code> et jusqu'où peut-on remonter ?",
  accept:["revenir a la version precedente","revisionhistorylimit","historique","rollback"],
  explain:"Il revient à la révision précédente du Deployment (ou à une révision précise avec <code>--to-revision</code>). L'historique conservé est limité par <code>revisionHistoryLimit</code> (10 par défaut) : au-delà, les anciens ReplicaSets sont supprimés et le rollback n'est plus possible." },

{ id:"b2-k8s-05", lvl:2, dom:"Kubernetes",
  q:"Que fait <code>kubectl port-forward</code> et pourquoi ce n'est pas une solution d'exposition ?",
  accept:["tunnel local","depuis ton poste","temporaire","un seul pod","debug"],
  explain:"Il ouvre un tunnel depuis ta machine vers un Pod ou un Service, via l'API server. C'est un outil de DEBUG : mono-utilisateur, éphémère, dépendant de ta session et de tes droits API. Exposer un service se fait par Service + Ingress." },

{ id:"b2-tf-01", lvl:2, dom:"Terraform",
  q:"À quoi sert un <code>output</code> et comment le récupère-t-on en dehors de Terraform ?",
  accept:["exposer une valeur","terraform output","json","module appelant"],
  explain:"Il expose une valeur calculée : au module appelant, ou à l'utilisateur. On le récupère avec <code>terraform output -raw nom</code> ou <code>-json</code> pour un pipeline. Marquer <code>sensitive = true</code> masque la valeur dans les logs — mais elle reste en clair dans le state." },

{ id:"b2-tf-02", lvl:2, dom:"Terraform",
  q:"Quelle est la différence entre <code>~&gt; 4.0</code> et <code>&gt;= 4.0</code> dans une contrainte de version ?",
  accept:["pessimiste","autorise 4.x","bloque la majeure","tout ce qui est superieur"],
  explain:"<code>~&gt; 4.0</code> (opérateur pessimiste) autorise 4.1, 4.9 mais PAS 5.0 : on se protège des breaking changes majeurs. <code>&gt;= 4.0</code> accepte tout, y compris une v5 qui casse ta configuration du jour au lendemain. En production : toujours borner." },

{ id:"b2-tf-03", lvl:2, dom:"Terraform",
  q:"Comment gères-tu une valeur conditionnelle en Terraform (créer une ressource seulement en prod) ?",
  accept:["count = var","condition","ternaire","0 ou 1"],
  explain:"<code>count = var.environnement == \"prod\" ? 1 : 0</code>, puis on référence <code>ressource[0]</code>. Attention : la référence doit alors être protégée (<code>try()</code> ou <code>one()</code>) quand count vaut 0. Pour plusieurs objets conditionnels, préférer un <code>for_each</code> sur une map filtrée." },

{ id:"b2-tf-04", lvl:2, dom:"Terraform",
  q:"À quoi servent les fonctions <code>lookup</code>, <code>try</code> et <code>coalesce</code> ?",
  accept:["valeur par defaut","gerer l absence","premiere non nulle","robustesse"],
  explain:"<code>lookup(map, cle, defaut)</code> lit une map avec un repli. <code>try(expr, repli)</code> renvoie le repli si l'expression échoue (attribut absent). <code>coalesce(a, b, c)</code> renvoie la première valeur non nulle/non vide. Ce sont les outils qui rendent un module tolérant aux entrées partielles." },

{ id:"b2-aws-01", lvl:2, dom:"AWS",
  q:"Qu'est-ce qu'un Target Group et quel est son lien avec le health check ?",
  accept:["cibles du load balancer","instances enregistrees","sain","retire du trafic"],
  explain:"C'est l'ensemble des cibles (instances, IP, Lambda, conteneurs) vers lesquelles un ALB/NLB route, avec son propre health check (chemin, seuils, intervalle). Une cible qui échoue est retirée du routage. Un health check mal calibré (trop strict, ou qui teste la base) provoque des retraits en cascade." },

{ id:"b2-aws-02", lvl:2, dom:"AWS",
  q:"Qu'est-ce que le service AWS Systems Manager Session Manager et pourquoi le préférer à SSH ?",
  accept:["pas de port ouvert","sans bastion","journalise","iam","agent"],
  explain:"Il ouvre un shell sur l'instance via l'agent SSM, sans ouvrir le port 22, sans bastion, sans clé à gérer. L'accès est contrôlé par IAM, journalisé dans CloudTrail et la session peut être enregistrée. C'est la réponse attendue sur « comment vous accédez aux serveurs en production »." },

{ id:"b2-aws-03", lvl:2, dom:"AWS",
  q:"Quelle est la différence entre un snapshot RDS automatique et manuel ?",
  accept:["retention","supprime avec l instance","conserve","backup window"],
  explain:"Les snapshots automatiques suivent la fenêtre de sauvegarde et une rétention configurée (0-35 jours) ; ils sont SUPPRIMÉS avec l'instance. Les snapshots manuels sont conservés jusqu'à suppression explicite. Le point de restauration dans le temps (PITR) repose sur les automatiques + les logs de transaction." },

{ id:"b2-az-01", lvl:2, dom:"Azure",
  q:"Comment fonctionnent les priorités de règles dans un NSG ?",
  accept:["numero croissant","premier match","100 a 4096","arrete l evaluation"],
  explain:"Les règles sont évaluées par priorité croissante (100 → 4096) et la PREMIÈRE qui correspond s'applique, l'évaluation s'arrête. Il existe des règles par défaut en fin de liste (autoriser le trafic intra-VNet, refuser le reste en entrée). Piège classique : une règle Allow à 300 qui ne sert jamais parce qu'un Deny existe à 200." },

{ id:"b2-az-02", lvl:2, dom:"Azure",
  q:"Qu'est-ce qu'un Availability Set et un Availability Zone dans Azure ? Différence ?",
  accept:["domaine de panne","fault domain","rack","zone = datacenter","physiquement separe"],
  explain:"L'Availability Set répartit les VM sur des fault domains et update domains DANS un même datacenter (protège d'une panne de rack ou d'une maintenance). Les Availability Zones répartissent sur des datacenters physiquement distincts de la région — protection bien supérieure. Les deux ne se combinent pas." },

{ id:"b2-az-03", lvl:2, dom:"Azure",
  q:"À quoi sert Azure Resource Graph ?",
  accept:["requeter l inventaire","kql","toutes les subscriptions","recherche rapide"],
  explain:"Il permet d'interroger en KQL l'inventaire de TOUTES tes ressources sur toutes les subscriptions, très rapidement — là où l'API ARM classique est lente et paginée. C'est l'outil pour répondre à « combien de VM sans tag Owner sur tout le tenant ? » en quelques secondes." },

{ id:"b2-res-01", lvl:2, dom:"Réseau",
  q:"À quoi sert un CDN et quel problème résout-il exactement ?",
  accept:["latence","proche de l utilisateur","cache","edge","charge"],
  explain:"Il met en cache le contenu sur des points de présence proches géographiquement des utilisateurs. Il réduit la latence (la vitesse de la lumière ne se négocie pas), décharge l'origine, absorbe les pics et sert souvent de première ligne WAF/anti-DDoS. Point clé : bien définir ce qui est cacheable et la stratégie d'invalidation." },

{ id:"b2-res-02", lvl:2, dom:"Réseau",
  q:"Qu'est-ce qu'un keep-alive HTTP et pourquoi ça change les performances ?",
  accept:["reutilise la connexion","evite le handshake","persistante","cout tcp tls"],
  explain:"Il réutilise la même connexion TCP/TLS pour plusieurs requêtes, au lieu de refaire handshake TCP + handshake TLS à chaque fois (plusieurs allers-retours). Sur une liaison à 50 ms de RTT, ça peut diviser le temps de réponse par deux. HTTP/2 va plus loin avec le multiplexage sur une seule connexion." },

{ id:"b2-cicd-01", lvl:2, dom:"CI/CD",
  q:"Qu'est-ce qu'un cache de pipeline et quel est le risque de mal le configurer ?",
  accept:["dependances","accelere","cache empoisonne","cle de cache","resultat faux"],
  explain:"Il conserve des dépendances entre exécutions pour accélérer le build. Risques : une clé de cache trop large donne des builds non reproductibles ou masque une régression ; un cache partagé entre projets ou entre branches non fiables est un vecteur d'empoisonnement. La clé doit dériver du hash du lockfile." },

{ id:"b2-cicd-02", lvl:2, dom:"CI/CD",
  q:"Quelle différence entre un artefact et une image de conteneur dans un pipeline ?",
  accept:["binaire","package","image = artefact executable","registry"],
  explain:"L'artefact est le livrable brut du build (jar, wheel, binaire, bundle). L'image de conteneur est un format d'artefact qui embarque en plus le runtime et les dépendances système, stocké dans un registry. Dans les deux cas : versionné, immuable, produit UNE fois puis promu." },

{ id:"b2-sec-01", lvl:2, dom:"Sécurité",
  q:"Pourquoi ne jamais logger le contenu d'un token ou d'un mot de passe, même en debug ?",
  accept:["logs centralises","conserves","sauvegarde","exfiltration","rgpd"],
  explain:"Les logs partent dans un SIEM, sont dupliqués, sauvegardés longtemps et accessibles à beaucoup plus de personnes que la production. Un secret loggué une fois est un secret compromis, à révoquer. Même logique pour les données personnelles (RGPD sur les logs et les sauvegardes)." },

{ id:"b2-sec-02", lvl:2, dom:"Sécurité",
  q:"Qu'est-ce qu'un scan de vulnérabilités d'image, et pourquoi le rejouer périodiquement ?",
  accept:["nouvelles cve","apparaissent apres","image inchangee","veille"],
  explain:"Il compare les paquets de l'image à des bases de CVE. Il faut le rejouer parce que de nouvelles vulnérabilités sont publiées APRÈS le build : une image scannée propre il y a trois mois peut être critique aujourd'hui, sans avoir changé d'un octet. D'où le scan continu au niveau du registry." },

{ id:"b2-obs-01", lvl:2, dom:"Observabilité",
  q:"Que signifie le fait qu'un compteur Prometheus soit toujours utilisé avec <code>rate()</code> ?",
  accept:["croissant","valeur brute inutile","par seconde","gere les reset"],
  explain:"Un counter ne fait qu'augmenter : sa valeur brute (« 4 823 191 requêtes depuis le démarrage ») n'a aucun intérêt. <code>rate()</code> calcule la variation par seconde sur une fenêtre et gère automatiquement les remises à zéro lors d'un redémarrage du process." },

{ id:"b2-obs-02", lvl:2, dom:"Observabilité",
  q:"Pourquoi faut-il horodater les logs en UTC avec le fuseau explicite ?",
  accept:["correlation","fuseau","ambiguite","heure d ete","ordre"],
  explain:"Pour corréler des événements entre serveurs, régions et services pendant un incident. Les heures locales créent des ambiguïtés (changement d'heure, machines mal réglées) et rendent l'ordre des événements impossible à établir — exactement au moment où on en a le plus besoin." },

{ id:"b2-sre-01", lvl:2, dom:"SRE",
  q:"Qu'est-ce qu'un runbook et en quoi diffère-t-il d'une documentation d'architecture ?",
  accept:["procedure","pendant l incident","actionnable","etapes","symptome"],
  explain:"Le runbook part d'un SYMPTÔME observé et donne les commandes exactes à exécuter, comment vérifier l'effet et quand escalader. La documentation d'architecture explique comment le système est construit. Pendant un incident à 3 h du matin, on a besoin du premier, pas du second." },

{ id:"b2-sql-01", lvl:2, dom:"SQL",
  q:"Que fait <code>GROUP BY</code> et quelle erreur classique commet-on avec ?",
  accept:["regroupe","agregat","colonne non agregee","select"],
  explain:"Il regroupe les lignes partageant les mêmes valeurs pour appliquer des fonctions d'agrégation. Erreur classique : sélectionner une colonne qui n'est ni dans le GROUP BY ni agrégée — PostgreSQL refuse, MySQL en mode permissif renvoie une valeur arbitraire, ce qui donne des résultats faux silencieusement." }

]);

</script>
<script>
/* data/niveau03b.js */
window.QBANK = (window.QBANK || []).concat([
/* ============ NIVEAU 3 — SÉRIE B ============ */

{ id:"b3-linux-01", lvl:3, dom:"Linux",
  q:"Comment mesures-tu ce qu'un processus fait réellement quand il semble bloqué ?",
  accept:["strace","proc","wchan","gdb","appels systeme"],
  explain:"<code>strace -p &lt;pid&gt;</code> montre les appels système en cours (souvent bloqué sur un <code>read</code>, un <code>futex</code> ou un <code>connect</code>). <code>cat /proc/&lt;pid&gt;/stack</code> ou <code>/proc/&lt;pid&gt;/wchan</code> indique où il attend dans le noyau. <code>strace -c</code> donne une synthèse. Attention : strace ralentit fortement le process, à utiliser avec prudence en prod." },

{ id:"b3-linux-02", lvl:3, dom:"Linux",
  q:"Qu'est-ce que le page cache et pourquoi <code>free -m</code> affiche-t-il souvent « peu de mémoire libre » ?",
  accept:["cache disque","recuperable","available","normal","buff/cache"],
  explain:"Linux utilise toute la RAM inutilisée comme cache de fichiers — c'est une optimisation, pas une fuite. La colonne à regarder est <b>available</b>, pas <b>free</b> : elle indique ce qui est réellement mobilisable, cache récupérable inclus. Une alerte basée sur <code>free</code> génère des faux positifs permanents." },

{ id:"b3-linux-03", lvl:3, dom:"Linux",
  q:"Comment limites-tu les ressources d'un service systemd ?",
  accept:["memorymax","cpuquota","limitnofile","cgroup","tasksmax"],
  explain:"Directives dans l'unité : <code>MemoryMax</code>, <code>CPUQuota</code>, <code>TasksMax</code>, <code>LimitNOFILE</code>, <code>IOWeight</code>. systemd les applique via les cgroups — exactement le même mécanisme que les limits Kubernetes. <code>systemd-cgtop</code> montre la consommation par unité." },

{ id:"b3-linux-04", lvl:3, dom:"Linux",
  q:"Comment cherches-tu efficacement dans 20 Go de logs sans saturer la machine ?",
  accept:["zgrep","journalctl --since","filtrer par date","rg","limiter la fenetre"],
  explain:"Réduire d'abord la fenêtre temporelle (<code>journalctl --since/--until</code>, fichiers du bon jour), utiliser <code>zgrep</code>/<code>zcat</code> pour les archives compressées, <code>LC_ALL=C grep -F</code> pour une recherche littérale rapide, <code>ripgrep</code> si disponible, et toujours borner la sortie (<code>| head</code>). Idéalement : requêter le backend de logs plutôt que la machine." },

{ id:"b3-git-01", lvl:3, dom:"Git",
  q:"Comment retrouves-tu le commit qui a introduit un bug dans un historique de 500 commits ?",
  accept:["git bisect","dichotomie","binaire","log2"],
  explain:"<code>git bisect start</code>, <code>git bisect bad</code> (version cassée), <code>git bisect good &lt;sha&gt;</code> (version saine), puis Git propose des commits intermédiaires par dichotomie : ~9 tests pour 500 commits. Avec <code>git bisect run ./test.sh</code>, c'est entièrement automatique." },

{ id:"b3-git-02", lvl:3, dom:"Git",
  q:"Qu'est-ce qu'un hook Git et quelle est sa limite en tant que contrôle de sécurité ?",
  accept:["script declenche","local","contournable","--no-verify","cote client"],
  explain:"Un script exécuté à un moment du cycle (pre-commit, pre-push, post-receive). Limite : les hooks CLIENT sont locaux, non versionnés par défaut et contournables avec <code>--no-verify</code>. Un contrôle de sécurité doit donc aussi exister côté serveur (hook serveur, règle de protection de branche, ou job de CI bloquant)." },

{ id:"b3-git-03", lvl:3, dom:"Git",
  q:"À quoi sert <code>git worktree</code> ?",
  accept:["plusieurs branches","plusieurs repertoires","meme depot","sans cloner"],
  explain:"Il permet d'avoir plusieurs répertoires de travail sur des branches différentes à partir du MÊME dépôt, sans re-cloner ni stasher. Très pratique pour traiter un hotfix urgent pendant qu'une feature est en cours de build." },

{ id:"b3-docker-01", lvl:3, dom:"Docker",
  q:"Comment réduis-tu la taille d'une image de 1,2 Go à quelques dizaines de Mo ? Cite trois leviers.",
  must:[["multi-stage","multi stage"],["image de base","alpine","distroless","slim"]],
  explain:"1) Multi-stage : ne garder que l'artefact. 2) Image de base minimale (alpine, slim, distroless, scratch pour du binaire statique). 3) Fusionner les RUN et nettoyer dans la MÊME couche (<code>rm -rf /var/lib/apt/lists/*</code>) — supprimer dans une couche ultérieure n'enlève rien au poids. 4) <code>.dockerignore</code>. 5) Ne pas installer les paquets de build en runtime." },

{ id:"b3-docker-02", lvl:3, dom:"Docker",
  q:"Deux conteneurs sur le même hôte doivent communiquer. Comment, et comment se résolvent-ils ?",
  accept:["reseau docker","bridge personnalise","par nom","dns integre"],
  explain:"On les place sur le même réseau bridge personnalisé (<code>docker network create</code>) : Docker fournit alors une résolution DNS interne par NOM de conteneur ou de service. Le bridge par défaut n'offre pas cette résolution par nom — d'où la recommandation systématique de créer un réseau dédié." },

{ id:"b3-docker-03", lvl:3, dom:"Docker",
  q:"Pourquoi une image construite aujourd'hui peut-elle différer de la même construite hier, avec le même Dockerfile ?",
  accept:["tag mutable","apt-get update","dependances non figees","non reproductible"],
  explain:"Parce que rien n'est figé : <code>FROM node:20</code> pointe vers une image qui a été republiée, <code>apt-get install</code> tire les dernières versions, <code>npm install</code> sans lockfile résout différemment. Pour la reproductibilité : pin par digest, lockfiles commités, versions de paquets épinglées." },

{ id:"b3-k8s-01", lvl:3, dom:"Kubernetes",
  q:"Comment exposer une application HTTPS avec un certificat automatique dans Kubernetes ?",
  accept:["ingress","cert-manager","lets encrypt","clusterissuer","tls secret"],
  explain:"Un Ingress (ou Gateway) avec une section <code>tls</code> référençant un Secret, et <b>cert-manager</b> qui obtient et renouvelle le certificat automatiquement via un Issuer/ClusterIssuer (ACME/Let's Encrypt, ou une PKI interne en banque). Sans renouvellement automatique, l'expiration est une panne annoncée." },

{ id:"b3-k8s-02", lvl:3, dom:"Kubernetes",
  q:"Quelle est la différence entre <code>kubectl delete pod</code> et <code>kubectl drain</code> ?",
  accept:["un pod","tous les pods du noeud","cordon","respecte les pdb"],
  explain:"<code>delete pod</code> supprime un Pod (recréé aussitôt par son contrôleur). <code>drain</code> vise un NŒUD : il le cordonne (plus de nouveaux Pods) puis évince tous ses Pods en respectant les PodDisruptionBudgets. C'est la procédure de maintenance d'un nœud." },

{ id:"b3-k8s-03", lvl:3, dom:"Kubernetes",
  q:"Que se passe-t-il quand tu changes une image dans un Deployment ? Décris la séquence.",
  accept:["nouveau replicaset","monte progressivement","reduit l ancien","rollout"],
  explain:"Le template du Pod change → le Deployment crée un NOUVEAU ReplicaSet avec 0 réplica → il monte progressivement le nouveau et réduit l'ancien selon maxSurge/maxUnavailable, en attendant que les nouveaux Pods soient Ready → l'ancien RS descend à 0 mais est CONSERVÉ pour permettre le rollback." },

{ id:"b3-k8s-04", lvl:3, dom:"Kubernetes",
  q:"À quoi sert un ResourceQuota et un LimitRange ?",
  accept:["quota du namespace","valeur par defaut","min max","total","par pod"],
  explain:"Le ResourceQuota plafonne la consommation TOTALE d'un namespace (CPU, mémoire, nombre d'objets, PVC). Le LimitRange agit par OBJET : valeurs par défaut si le dev n'en met pas, et bornes min/max. Les deux ensemble empêchent une équipe de consommer tout le cluster, volontairement ou par erreur." },

{ id:"b3-k8s-05", lvl:3, dom:"Kubernetes",
  q:"Comment vérifies-tu qu'un ServiceAccount a le droit de faire une action précise ?",
  accept:["auth can-i","kubectl auth","--as"],
  explain:"<code>kubectl auth can-i create deployments --as=system:serviceaccount:mon-ns:mon-sa -n mon-ns</code>. Avec <code>--list</code> pour tout énumérer. C'est l'outil qui évite de deviner en lisant des ClusterRoleBindings pendant une heure." },

{ id:"b3-tf-01", lvl:3, dom:"Terraform",
  q:"Comment testes-tu une modification Terraform sans risquer la production ?",
  accept:["plan","environnement de test","workspace dedie","compte bac a sable"],
  explain:"1) <code>plan</code> systématique et relu (jamais d'apply à l'aveugle). 2) D'abord sur un environnement de non-production issu du MÊME code paramétré. 3) Idéalement un compte/subscription bac à sable jetable. 4) <code>terraform test</code> ou Terratest pour les modules réutilisables. 5) Scans de conformité sur le plan JSON." },

{ id:"b3-tf-02", lvl:3, dom:"Terraform",
  q:"Que fait <code>terraform refresh</code> (ou <code>-refresh-only</code>) et pourquoi c'est délicat ?",
  accept:["met a jour le state","interroge les api","sans modifier l infra","drift"],
  explain:"Il met à jour le state avec l'état réel du cloud, sans modifier l'infrastructure. Délicat parce qu'il fait DISPARAÎTRE la trace d'une dérive du state : on peut masquer une modification manuelle au lieu de la traiter. <code>plan -refresh-only</code> permet de voir ce que le refresh changerait avant de l'accepter." },

{ id:"b3-tf-03", lvl:3, dom:"Terraform",
  q:"Comment passes-tu un secret à Terraform sans le committer ?",
  accept:["variable d environnement","tf_var","data source","coffre","vault"],
  explain:"Par ordre de préférence : (1) ne pas le faire transiter — le créer dans le coffre et n'en référencer que l'URI ; (2) une data source qui le lit dans Key Vault/Secrets Manager au moment de l'apply ; (3) <code>TF_VAR_mot_de_passe</code> injectée par le pipeline. Jamais dans un tfvars commité. Et rappeler qu'il finira quand même en clair dans le state." },

{ id:"b3-tf-04", lvl:3, dom:"Terraform",
  q:"Quelle différence entre un module local, un module de registry et un module Git ?",
  accept:["chemin relatif","versionne","source","ref"],
