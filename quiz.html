window.QBANK = (window.QBANK || []).concat([
/* ================= NIVEAU 3 — USAGE QUOTIDIEN ================= */

{ id:"n3-linux-01", lvl:3, dom:"Linux",
  q:"La load average affiche <code>8.0</code> sur une machine à 4 cœurs. Est-ce forcément un problème CPU ?",
  accept:["non","iowait","attente disque","entrees sorties","uninterruptible","d state"],
  explain:"Non : sous Linux, la load compte les processus runnable ET ceux en attente ininterruptible (I/O disque, NFS). Une load de 8 sur 4 cœurs avec un CPU à 10 % = saturation I/O. Il faut croiser avec <code>%iowait</code> (<code>top</code>, <code>vmstat</code>, <code>iostat</code>)." },

{ id:"n3-linux-02", lvl:3, dom:"Linux",
  q:"Comment rendre un service persistant après reboot avec systemd, et comment lire ses logs ?",
  must:[["enable"],["journalctl"]],
  explain:"<code>systemctl enable --now mon.service</code> (enable = au boot, --now = démarre tout de suite). Logs : <code>journalctl -u mon.service -f</code>, avec <code>--since</code>, <code>-p err</code> pour filtrer la sévérité. <code>enable</code> sans <code>start</code> ne lance rien maintenant : piège classique." },

{ id:"n3-linux-03", lvl:3, dom:"Linux",
  q:"Quelle est la différence entre un hard link et un symlink ?",
  accept:["meme inode","pointe vers un chemin","lien cassé","traverse les systemes de fichiers","reference"],
  explain:"Un hard link est une seconde entrée de répertoire vers le MÊME inode : supprimer l'original ne casse rien, le contenu vit tant qu'il reste un lien. Un symlink stocke un CHEMIN : il devient un lien mort si la cible disparaît, mais peut traverser les systèmes de fichiers et pointer un répertoire." },

{ id:"n3-linux-04", lvl:3, dom:"Linux",
  q:"Que fait <code>grep -rn \"erreur\" . | awk '{print $1}' | sort | uniq -c | sort -rn</code> ?",
  accept:["compte","occurrences par fichier","classe","top fichiers"],
  explain:"Recherche récursive avec numéros de ligne, extraction du premier champ (fichier:ligne), tri, comptage des doublons puis tri décroissant : on obtient le classement des fichiers les plus bruyants. Le <code>sort</code> avant <code>uniq</code> est obligatoire — <code>uniq</code> ne dédoublonne que des lignes adjacentes." },

{ id:"n3-linux-05", lvl:3, dom:"Linux",
  q:"Différence entre <code>$@</code> et <code>$*</code> dans un script bash, et pourquoi les guillemets comptent ?",
  accept:["arguments separes","une seule chaine","preserve les espaces","tableau"],
  explain:"<code>\"$@\"</code> développe chaque argument comme un mot distinct (préserve les espaces dans les arguments) ; <code>\"$*\"</code> les concatène en une seule chaîne. Règle : toujours <code>\"$@\"</code> pour relayer des arguments." },

{ id:"n3-git-01", lvl:3, dom:"Git",
  q:"Explique le workflow GitFlow et pourquoi beaucoup d'équipes lui préfèrent le trunk-based.",
  accept:["branches longues","develop release hotfix","merges douloureux","integration continue","branches courtes"],
  explain:"GitFlow : main + develop + feature/release/hotfix. Rigoureux mais les branches vivent longtemps → gros merges, intégration tardive, feedback lent. Le trunk-based garde des branches de quelques heures fusionnées dans main, avec feature flags pour cacher l'inachevé : c'est ce qui rend la CI réellement continue." },

{ id:"n3-git-02", lvl:3, dom:"Git",
  q:"Tu as fait un <code>git reset --hard</code> et perdu deux commits. Récupérable ?",
  accept:["reflog","git reflog","oui"],
  explain:"Oui : <code>git reflog</code> conserve l'historique local des positions de HEAD (~90 jours par défaut). Tu retrouves le SHA puis <code>git reset --hard &lt;sha&gt;</code> ou <code>git cherry-pick</code>. Ne fonctionne que localement et seulement pour du travail déjà commité." },

{ id:"n3-git-03", lvl:3, dom:"Git",
  q:"À quoi sert <code>git cherry-pick</code> et quel est son principal inconvénient ?",
  accept:["un commit precis","copie","duplique","autre hash","doublon a la fusion"],
  explain:"Il rejoue un commit précis sur une autre branche (typiquement un hotfix vers une branche de release). Inconvénient : ça DUPLIQUE le changement avec un hash différent — au moment de fusionner les branches, on peut se retrouver avec des conflits ou une double application." },

{ id:"n3-docker-01", lvl:3, dom:"Docker",
  q:"Pourquoi faire tourner un conteneur en non-root, et comment ?",
  accept:["useradd","user","reduire l impact","escalade","uid"],
  explain:"Pour limiter l'impact d'une évasion ou d'une RCE : root dans le conteneur = souvent root sur l'hôte si le user namespace n'est pas remappé. On crée un utilisateur dans le Dockerfile puis <code>USER 10001</code>, et côté K8s <code>runAsNonRoot: true</code>, <code>readOnlyRootFilesystem: true</code>, <code>drop ALL capabilities</code>." },

{ id:"n3-docker-02", lvl:3, dom:"Docker",
  q:"Différence entre un bind mount et un volume nommé ?",
  accept:["chemin de l hote","gere par docker","portable","dependance au chemin"],
  explain:"Bind mount = un chemin de l'hôte monté dans le conteneur : pratique en dev, mais dépendant de l'arborescence de la machine et des permissions. Volume nommé = géré par Docker dans son espace, portable, sauvegardable, pilotable par des drivers (NFS, cloud). En prod : volume ou stockage externe." },

{ id:"n3-docker-03", lvl:3, dom:"Docker",
  q:"Ton conteneur ne s'arrête pas avec <code>docker stop</code> et met 10 s. Pourquoi ?",
  accept:["pid 1","ne recoit pas le signal","shell form","sigterm ignore","exec form"],
  explain:"Le process PID 1 ne gère pas SIGTERM. Typiquement parce que le CMD est en forme shell : c'est <code>/bin/sh -c</code> qui est PID 1 et il ne relaie pas les signaux. Solution : forme exec (JSON), un init léger (<code>tini</code>, <code>--init</code>) ou un handler de signal dans l'app. Après le timeout, Docker envoie SIGKILL." },

{ id:"n3-k8s-01", lvl:3, dom:"Kubernetes",
  q:"Un Pod reste en <code>Pending</code>. Cite trois causes possibles et comment tu les distingues.",
  must:[["ressource","cpu","memoire","insufficient"],["describe","event"]],
  explain:"<code>kubectl describe pod</code> et on lit les Events : 1) pas de nœud avec assez de CPU/mémoire, 2) taints sans toleration / nodeSelector ou affinity impossible à satisfaire, 3) PVC non lié (pas de StorageClass ou pas de volume dispo). Plus rare : quota de namespace atteint." },

{ id:"n3-k8s-02", lvl:3, dom:"Kubernetes",
  q:"Différence entre <code>CrashLoopBackOff</code> et <code>ImagePullBackOff</code> ?",
  accept:["demarre et plante","image introuvable","registry","droits de pull","redemarrage en boucle"],
  explain:"CrashLoopBackOff : le conteneur démarre puis se termine en boucle — bug applicatif, config manquante, liveness trop stricte ; on lit <code>kubectl logs --previous</code>. ImagePullBackOff : l'image n'a pas pu être téléchargée — tag inexistant, registry privé sans imagePullSecret, ou problème réseau/proxy." },

{ id:"n3-k8s-03", lvl:3, dom:"Kubernetes",
  q:"Différence entre requests et limits, et laquelle sert au scheduling ?",
  accept:["requests pour le scheduling","limits plafond","garantie","oomkill","throttle"],
  explain:"Les <code>requests</code> sont ce que le scheduler réserve pour placer le Pod (garantie minimale). Les <code>limits</code> sont un plafond : dépassement CPU = throttling, dépassement mémoire = OOMKill immédiat. La mémoire n'est pas compressible, contrairement au CPU." },

{ id:"n3-k8s-04", lvl:3, dom:"Kubernetes",
  q:"Quels sont les types de Service et à quoi sert chacun ?",
  must:[["clusterip"],["nodeport"],["loadbalancer"]],
  explain:"ClusterIP (défaut) : IP interne au cluster. NodePort : ouvre un port (30000-32767) sur chaque nœud. LoadBalancer : provisionne un LB cloud qui pointe vers le NodePort. ExternalName : simple alias DNS CNAME. En prod on expose plutôt via un Ingress/Gateway devant un seul LoadBalancer." },

{ id:"n3-k8s-05", lvl:3, dom:"Kubernetes",
  q:"Différence entre un Deployment et un StatefulSet ?",
  accept:["identite stable","nom ordonne","pvc par pod","ordre de demarrage","dns stable"],
  explain:"Le Deployment traite ses Pods comme du bétail interchangeable (noms aléatoires, ordre quelconque). Le StatefulSet donne une identité stable : noms ordinaux (<code>db-0</code>, <code>db-1</code>), DNS stable via un headless Service, un PVC dédié par Pod, démarrage/arrêt ordonnés. Pour les bases, brokers, clusters à quorum." },

{ id:"n3-tf-01", lvl:3, dom:"Terraform",
  q:"Explique la différence entre <code>count</code> et <code>for_each</code> et pourquoi ça compte au moment d'une suppression.",
  accept:["index","cle","decalage","recree","identifiant stable"],
  explain:"<code>count</code> indexe par position : supprimer l'élément 1 sur 3 décale tout et Terraform veut détruire/recréer les suivants. <code>for_each</code> indexe par CLÉ (map ou set) : chaque ressource a une adresse stable, la suppression n'affecte que l'entrée concernée. Règle : for_each dès que les éléments sont distincts." },

{ id:"n3-tf-02", lvl:3, dom:"Terraform",
  q:"Comment intégrer dans Terraform une ressource déjà créée à la main ?",
  accept:["terraform import","import block","importer"],
  explain:"<code>terraform import addr id</code> (ou un bloc <code>import</code> déclaratif depuis la 1.5, qui a l'avantage d'être revu en plan et versionné). L'import ne génère PAS le code : il faut écrire la ressource, importer, puis lancer un plan jusqu'à obtenir « no changes »." },

{ id:"n3-tf-03", lvl:3, dom:"Terraform",
  q:"À quoi servent <code>depends_on</code> et pourquoi l'utilise-t-on rarement ?",
  accept:["dependance explicite","implicite","reference","graphe"],
  explain:"Terraform déduit le graphe de dépendances des RÉFÉRENCES entre ressources — c'est implicite et suffisant à 95 %. <code>depends_on</code> ne sert que pour une dépendance non exprimable par une référence (ex : une policy IAM doit exister avant qu'une app l'utilise). En abuser sérialise inutilement et ralentit l'apply." },

{ id:"n3-tf-04", lvl:3, dom:"Terraform",
  q:"Comment gère-t-on plusieurs environnements (dev/rec/prod) avec Terraform ? Cite deux approches et leurs limites.",
  accept:["workspace","repertoires separes","tfvars","backend distinct"],
  explain:"1) Workspaces : un seul backend, un state par workspace — simple mais même code, même backend, risque d'erreur d'environnement. 2) Répertoires/dépôts séparés avec backends distincts et un module commun paramétré : plus verbeux mais isolation réelle des states et des droits. En banque, on prend presque toujours la 2." },

{ id:"n3-aws-01", lvl:3, dom:"AWS",
  q:"Différence entre un rôle IAM, une policy identity-based et une policy resource-based ?",
  accept:["attachee a l identite","attachee a la ressource","bucket policy","cross account","principal"],
  explain:"Identity-based : attachée à un user/rôle, dit ce que CETTE identité peut faire. Resource-based : attachée à la ressource (bucket policy, KMS key policy, SQS), avec un champ <code>Principal</code> — c'est elle qui permet l'accès cross-compte sans AssumeRole. Une action est autorisée si l'une des deux l'autorise et qu'aucune ne la refuse." },

{ id:"n3-aws-02", lvl:3, dom:"AWS",
  q:"Quelles sont les classes de stockage S3 principales et sur quel critère on choisit ?",
  accept:["standard","infrequent access","glacier","frequence d acces","cout de restitution"],
  explain:"Standard (accès fréquent), Standard-IA / One Zone-IA (rare mais immédiat, coût de récupération), Intelligent-Tiering (bascule automatique), Glacier Instant/Flexible/Deep Archive (archivage, restitution de minutes à heures). Critère : fréquence d'accès et tolérance au délai de restitution. On automatise avec des lifecycle policies." },

{ id:"n3-aws-03", lvl:3, dom:"AWS",
  q:"Différence entre un ALB et un NLB, et quand prend-on un NLB ?",
  accept:["couche 7","couche 4","ip statique","tres haute performance","tcp"],
  explain:"ALB = L7 HTTP/HTTPS : routage par path/host, WAF, authentification, mais IP dynamiques. NLB = L4 : latence ultra-faible, millions de connexions, IP statique par AZ (ou EIP), préserve l'IP source, supporte TCP/UDP et TLS passthrough. On prend le NLB pour du non-HTTP, une IP fixe à whitelister, ou de la performance extrême." },

{ id:"n3-az-01", lvl:3, dom:"Azure",
  q:"Différence entre un NSG et un Azure Firewall ?",
  accept:["couche 3 4","stateful l7","fqdn","service manage","regles reseau"],
  explain:"Le NSG est un filtre L3/L4 gratuit attaché à un subnet ou une NIC (5-tuple, service tags). L'Azure Firewall est un service managé payant, centralisé, avec règles applicatives par FQDN, threat intelligence, SNAT/DNAT et journalisation complète — c'est lui qu'on met en hub dans une topologie hub-and-spoke." },

{ id:"n3-az-02", lvl:3, dom:"Azure",
  q:"À quoi sert un Private Endpoint et quel problème DNS crée-t-il ?",
  accept:["ip privee","sort du reseau public","private dns zone","resolution","vnet"],
  explain:"Il donne une IP PRIVÉE dans ton VNet à un service PaaS (Storage, SQL, Key Vault) : le trafic ne passe plus par internet. Piège : le FQDN public doit désormais résoudre vers l'IP privée — il faut une Private DNS Zone (<code>privatelink.blob.core.windows.net</code>) liée au VNet, sinon on retombe sur l'IP publique." },

{ id:"n3-az-03", lvl:3, dom:"Azure",
  q:"Différence entre Azure Policy et Azure RBAC ?",
  accept:["rbac qui peut faire","policy ce qui est autorise","conformite","proprietes de la ressource","deny"],
  explain:"Le RBAC contrôle QUI peut faire quoi (identité → action). Azure Policy contrôle CE QUI peut exister : elle évalue les propriétés des ressources (deny sans tag, deny hors région autorisée, deployIfNotExists pour forcer des diagnostics). Un Owner reste bloqué par une policy deny." },

{ id:"n3-cicd-01", lvl:3, dom:"CI/CD",
  q:"Pourquoi un runner de CI doit-il être éphémère ?",
  accept:["etat residuel","pollution","reproductible","isolation","secrets residuels"],
  explain:"Pour garantir la reproductibilité et la sécurité : pas de cache pollué, pas de dépendance installée par un job précédent, pas de secrets résiduels dans le filesystem. Un runner persistant devient un point de compromission latérale entre projets — d'où les runners conteneurisés jetables." },

{ id:"n3-cicd-02", lvl:3, dom:"CI/CD",
  q:"Qu'est-ce que le GitOps et qu'est-ce qui le distingue d'un pipeline push classique ?",
  accept:["git source de verite","reconciliation","pull","agent dans le cluster","argocd","flux"],
  explain:"L'état désiré est déclaré dans Git ; un agent DANS le cluster (Argo CD, Flux) tire et réconcilie en continu. Différences avec le push : pas de credentials cluster dans la CI, dérive détectée et corrigée automatiquement, rollback = revert Git, audit natif via l'historique." },

{ id:"n3-sec-01", lvl:3, dom:"Sécurité",
  q:"Comment gères-tu les secrets dans un pipeline CI/CD ? Cite le mécanisme le plus solide.",
  accept:["oidc","federation","coffre","key vault","secrets manager","token court"],
  explain:"Le plus solide : fédération d'identité OIDC entre le fournisseur CI et le cloud — le pipeline échange un token signé contre des credentials temporaires, aucun secret long terme stocké. Sinon : coffre (Key Vault, Secrets Manager, Vault) avec injection au runtime, masquage des logs et rotation." },

{ id:"n3-sec-02", lvl:3, dom:"Sécurité",
  q:"Qu'est-ce qu'un scan SAST, DAST et SCA ? Où les place-t-on dans le pipeline ?",
  must:[["code source","statique"],["execution","application qui tourne","dynamique"],["dependance","librairie","cve"]],
  explain:"SAST = analyse statique du code source (tôt, à chaque commit). SCA = analyse des dépendances et CVE connues (au build, + veille continue). DAST = test dynamique contre l'application déployée (en recette). On complète par le scan d'images et la détection de secrets en pre-commit." },

{ id:"n3-obs-01", lvl:3, dom:"Observabilité",
  q:"Pourquoi alerte-t-on sur les symptômes plutôt que sur les causes ?",
  accept:["impact utilisateur","bruit","trop d alertes","symptome","fatigue"],
  explain:"Alerter sur les causes (CPU à 90 %, un pod redémarré) génère du bruit et de la fatigue d'astreinte alors que le service va peut-être très bien. On alerte sur ce que l'utilisateur subit — latence, taux d'erreur, saturation, trafic (méthode RED/USE) — et on utilise les causes comme éléments de diagnostic dans le dashboard." },

{ id:"n3-sql-01", lvl:3, dom:"SQL",
  q:"Différence entre <code>WHERE</code> et <code>HAVING</code> ?",
  accept:["avant l agregation","apres le group by","filtre les groupes","agregat"],
  explain:"<code>WHERE</code> filtre les lignes AVANT l'agrégation ; <code>HAVING</code> filtre les GROUPES après le <code>GROUP BY</code> et peut donc porter sur une fonction d'agrégation (<code>HAVING COUNT(*) &gt; 5</code>). Pour la performance, filtrer un maximum dans le WHERE." },

{ id:"n3-sre-01", lvl:3, dom:"SRE",
  q:"Qu'est-ce que le toil au sens SRE, et quel est l'objectif chiffré classique ?",
  accept:["tache manuelle","repetitive","automatisable","sans valeur durable","50"],
  explain:"Le toil = travail manuel, répétitif, automatisable, sans valeur durable, qui croît linéairement avec le service. Google fixe la limite à 50 % du temps d'un SRE ; au-delà, on arrête les nouveautés pour automatiser. C'est un argument très utile en entretien pour justifier un investissement d'outillage." }

]);

</script>

window.QBANK = (window.QBANK || []).concat([
/* ============ NIVEAU 3 — SÉRIE B ============ */

{ id:"b3-linux-01", lvl:3, dom:"Linux",
  q:"Comment mesures-tu ce qu'un processus fait réellement quand il semble bloqué ?",
  accept:["strace","proc","wchan","gdb","appels systeme"],
  explain:"<code>strace -p &lt;pid&gt;</code> montre les appels système en cours (souvent bloqué sur un <code>read</code>, un <code>futex</code> ou un <code>connect</code>). <code>cat /proc/&lt;pid&gt;/stack</code> ou <code>/proc/&lt;pid&gt;/wchan</code> indique où il attend dans le noyau. <code>strace -c</code> donne une synthèse. Attention : strace ralentit fortement le process, à utiliser avec prudence en prod." },

{ id:"b3-linux-02", lvl:3, dom:"Linux",
  q:"Qu'est-ce que le page cache et pourquoi <code>free -m</code> affiche-t-il souvent « peu de mémoire libre » ?",
  accept:["cache disque","recuperable","available","normal","buff/cache"],
  explain:"Linux utilise toute la RAM inutilisée comme cache de fichiers — c'est une optimisation, pas une fuite. La colonne à regarder est <b>available</b>, pas <b>free</b> : elle indique ce qui est réellement mobilisable, cache récupérable inclus. Une alerte basée sur <code>free</code> génère des faux positifs permanents." },

{ id:"b3-linux-03", lvl:3, dom:"Linux",
  q:"Comment limites-tu les ressources d'un service systemd ?",
  accept:["memorymax","cpuquota","limitnofile","cgroup","tasksmax"],
  explain:"Directives dans l'unité : <code>MemoryMax</code>, <code>CPUQuota</code>, <code>TasksMax</code>, <code>LimitNOFILE</code>, <code>IOWeight</code>. systemd les applique via les cgroups — exactement le même mécanisme que les limits Kubernetes. <code>systemd-cgtop</code> montre la consommation par unité." },

{ id:"b3-linux-04", lvl:3, dom:"Linux",
  q:"Comment cherches-tu efficacement dans 20 Go de logs sans saturer la machine ?",
  accept:["zgrep","journalctl --since","filtrer par date","rg","limiter la fenetre"],
  explain:"Réduire d'abord la fenêtre temporelle (<code>journalctl --since/--until</code>, fichiers du bon jour), utiliser <code>zgrep</code>/<code>zcat</code> pour les archives compressées, <code>LC_ALL=C grep -F</code> pour une recherche littérale rapide, <code>ripgrep</code> si disponible, et toujours borner la sortie (<code>| head</code>). Idéalement : requêter le backend de logs plutôt que la machine." },

{ id:"b3-git-01", lvl:3, dom:"Git",
  q:"Comment retrouves-tu le commit qui a introduit un bug dans un historique de 500 commits ?",
  accept:["git bisect","dichotomie","binaire","log2"],
  explain:"<code>git bisect start</code>, <code>git bisect bad</code> (version cassée), <code>git bisect good &lt;sha&gt;</code> (version saine), puis Git propose des commits intermédiaires par dichotomie : ~9 tests pour 500 commits. Avec <code>git bisect run ./test.sh</code>, c'est entièrement automatique." },

{ id:"b3-git-02", lvl:3, dom:"Git",
  q:"Qu'est-ce qu'un hook Git et quelle est sa limite en tant que contrôle de sécurité ?",
  accept:["script declenche","local","contournable","--no-verify","cote client"],
  explain:"Un script exécuté à un moment du cycle (pre-commit, pre-push, post-receive). Limite : les hooks CLIENT sont locaux, non versionnés par défaut et contournables avec <code>--no-verify</code>. Un contrôle de sécurité doit donc aussi exister côté serveur (hook serveur, règle de protection de branche, ou job de CI bloquant)." },

{ id:"b3-git-03", lvl:3, dom:"Git",
  q:"À quoi sert <code>git worktree</code> ?",
  accept:["plusieurs branches","plusieurs repertoires","meme depot","sans cloner"],
  explain:"Il permet d'avoir plusieurs répertoires de travail sur des branches différentes à partir du MÊME dépôt, sans re-cloner ni stasher. Très pratique pour traiter un hotfix urgent pendant qu'une feature est en cours de build." },

{ id:"b3-docker-01", lvl:3, dom:"Docker",
  q:"Comment réduis-tu la taille d'une image de 1,2 Go à quelques dizaines de Mo ? Cite trois leviers.",
  must:[["multi-stage","multi stage"],["image de base","alpine","distroless","slim"]],
  explain:"1) Multi-stage : ne garder que l'artefact. 2) Image de base minimale (alpine, slim, distroless, scratch pour du binaire statique). 3) Fusionner les RUN et nettoyer dans la MÊME couche (<code>rm -rf /var/lib/apt/lists/*</code>) — supprimer dans une couche ultérieure n'enlève rien au poids. 4) <code>.dockerignore</code>. 5) Ne pas installer les paquets de build en runtime." },

{ id:"b3-docker-02", lvl:3, dom:"Docker",
  q:"Deux conteneurs sur le même hôte doivent communiquer. Comment, et comment se résolvent-ils ?",
  accept:["reseau docker","bridge personnalise","par nom","dns integre"],
  explain:"On les place sur le même réseau bridge personnalisé (<code>docker network create</code>) : Docker fournit alors une résolution DNS interne par NOM de conteneur ou de service. Le bridge par défaut n'offre pas cette résolution par nom — d'où la recommandation systématique de créer un réseau dédié." },

{ id:"b3-docker-03", lvl:3, dom:"Docker",
  q:"Pourquoi une image construite aujourd'hui peut-elle différer de la même construite hier, avec le même Dockerfile ?",
  accept:["tag mutable","apt-get update","dependances non figees","non reproductible"],
  explain:"Parce que rien n'est figé : <code>FROM node:20</code> pointe vers une image qui a été republiée, <code>apt-get install</code> tire les dernières versions, <code>npm install</code> sans lockfile résout différemment. Pour la reproductibilité : pin par digest, lockfiles commités, versions de paquets épinglées." },

{ id:"b3-k8s-01", lvl:3, dom:"Kubernetes",
  q:"Comment exposer une application HTTPS avec un certificat automatique dans Kubernetes ?",
  accept:["ingress","cert-manager","lets encrypt","clusterissuer","tls secret"],
  explain:"Un Ingress (ou Gateway) avec une section <code>tls</code> référençant un Secret, et <b>cert-manager</b> qui obtient et renouvelle le certificat automatiquement via un Issuer/ClusterIssuer (ACME/Let's Encrypt, ou une PKI interne en banque). Sans renouvellement automatique, l'expiration est une panne annoncée." },

{ id:"b3-k8s-02", lvl:3, dom:"Kubernetes",
  q:"Quelle est la différence entre <code>kubectl delete pod</code> et <code>kubectl drain</code> ?",
  accept:["un pod","tous les pods du noeud","cordon","respecte les pdb"],
  explain:"<code>delete pod</code> supprime un Pod (recréé aussitôt par son contrôleur). <code>drain</code> vise un NŒUD : il le cordonne (plus de nouveaux Pods) puis évince tous ses Pods en respectant les PodDisruptionBudgets. C'est la procédure de maintenance d'un nœud." },

{ id:"b3-k8s-03", lvl:3, dom:"Kubernetes",
  q:"Que se passe-t-il quand tu changes une image dans un Deployment ? Décris la séquence.",
  accept:["nouveau replicaset","monte progressivement","reduit l ancien","rollout"],
  explain:"Le template du Pod change → le Deployment crée un NOUVEAU ReplicaSet avec 0 réplica → il monte progressivement le nouveau et réduit l'ancien selon maxSurge/maxUnavailable, en attendant que les nouveaux Pods soient Ready → l'ancien RS descend à 0 mais est CONSERVÉ pour permettre le rollback." },

{ id:"b3-k8s-04", lvl:3, dom:"Kubernetes",
  q:"À quoi sert un ResourceQuota et un LimitRange ?",
  accept:["quota du namespace","valeur par defaut","min max","total","par pod"],
  explain:"Le ResourceQuota plafonne la consommation TOTALE d'un namespace (CPU, mémoire, nombre d'objets, PVC). Le LimitRange agit par OBJET : valeurs par défaut si le dev n'en met pas, et bornes min/max. Les deux ensemble empêchent une équipe de consommer tout le cluster, volontairement ou par erreur." },

{ id:"b3-k8s-05", lvl:3, dom:"Kubernetes",
  q:"Comment vérifies-tu qu'un ServiceAccount a le droit de faire une action précise ?",
  accept:["auth can-i","kubectl auth","--as"],
  explain:"<code>kubectl auth can-i create deployments --as=system:serviceaccount:mon-ns:mon-sa -n mon-ns</code>. Avec <code>--list</code> pour tout énumérer. C'est l'outil qui évite de deviner en lisant des ClusterRoleBindings pendant une heure." },

{ id:"b3-tf-01", lvl:3, dom:"Terraform",
  q:"Comment testes-tu une modification Terraform sans risquer la production ?",
  accept:["plan","environnement de test","workspace dedie","compte bac a sable"],
  explain:"1) <code>plan</code> systématique et relu (jamais d'apply à l'aveugle). 2) D'abord sur un environnement de non-production issu du MÊME code paramétré. 3) Idéalement un compte/subscription bac à sable jetable. 4) <code>terraform test</code> ou Terratest pour les modules réutilisables. 5) Scans de conformité sur le plan JSON." },

{ id:"b3-tf-02", lvl:3, dom:"Terraform",
  q:"Que fait <code>terraform refresh</code> (ou <code>-refresh-only</code>) et pourquoi c'est délicat ?",
  accept:["met a jour le state","interroge les api","sans modifier l infra","drift"],
  explain:"Il met à jour le state avec l'état réel du cloud, sans modifier l'infrastructure. Délicat parce qu'il fait DISPARAÎTRE la trace d'une dérive du state : on peut masquer une modification manuelle au lieu de la traiter. <code>plan -refresh-only</code> permet de voir ce que le refresh changerait avant de l'accepter." },

{ id:"b3-tf-03", lvl:3, dom:"Terraform",
  q:"Comment passes-tu un secret à Terraform sans le committer ?",
  accept:["variable d environnement","tf_var","data source","coffre","vault"],
  explain:"Par ordre de préférence : (1) ne pas le faire transiter — le créer dans le coffre et n'en référencer que l'URI ; (2) une data source qui le lit dans Key Vault/Secrets Manager au moment de l'apply ; (3) <code>TF_VAR_mot_de_passe</code> injectée par le pipeline. Jamais dans un tfvars commité. Et rappeler qu'il finira quand même en clair dans le state." },

{ id:"b3-tf-04", lvl:3, dom:"Terraform",
  q:"Quelle différence entre un module local, un module de registry et un module Git ?",
  accept:["chemin relatif","versionne","source","ref"],
  explain:"Local (<code>source = \"./modules/x\"</code>) : versionné avec le dépôt, pas de version indépendante. Registry (<code>source = \"org/x/aws\"</code>, avec <code>version</code>) : versionnement sémantique propre. Git (<code>source = \"git::https://...?ref=v1.2.0\"</code>) : versionné par tag — toujours épingler le <code>ref</code>, jamais <code>main</code>." },

{ id:"b3-aws-01", lvl:3, dom:"AWS",
  q:"Comment donnes-tu à une Lambda l'accès à une base RDS dans un subnet privé ?",
  accept:["vpc config","eni","security group","role d execution"],
  explain:"On attache la Lambda au VPC (subnets privés + security group), ce qui lui crée des ENI ; on autorise ce SG en entrée sur le SG de la base. Conséquence : une Lambda dans un VPC n'a plus d'accès internet sans NAT Gateway ou VPC endpoints. Et pour l'authentification, préférer IAM auth plutôt qu'un mot de passe." },

{ id:"b3-aws-02", lvl:3, dom:"AWS",
  q:"Quelle est la différence entre une politique de cycle de vie S3 et la réplication ?",
  accept:["transition","suppression","copie vers un autre bucket","classe de stockage"],
  explain:"Le cycle de vie fait transiter les objets entre classes de stockage ou les supprime après N jours (optimisation de coût, rétention). La réplication (CRR/SRR) copie les objets vers un autre bucket, éventuellement dans une autre région ou un autre compte (DR, conformité, isolation des sauvegardes)." },

{ id:"b3-aws-03", lvl:3, dom:"AWS",
  q:"Qu'est-ce qu'un service quota AWS et pourquoi ça compte pour un plan de DR ?",
  accept:["limite par compte","par region","demander une augmentation","capacite indisponible"],
  explain:"Chaque compte a des limites par service et par région (nombre d'instances, d'EIP, de vCPU). Dans un plan de DR, la région de secours a ses PROPRES quotas, souvent jamais augmentés : au moment de la bascule, on ne peut pas lancer la capacité nécessaire. C'est un échec de DR très fréquent — les quotas se demandent à l'avance et se testent." },

{ id:"b3-az-01", lvl:3, dom:"Azure",
  q:"Comment sauvegardes-tu des VM Azure et que faut-il vérifier au-delà de la sauvegarde ?",
  accept:["recovery services vault","backup policy","restauration testee","retention"],
  explain:"Azure Backup avec un Recovery Services Vault et une politique (fréquence, rétention court/long terme). Au-delà : tester réellement la restauration, vérifier que le coffre est protégé (soft delete, immuabilité, RBAC séparé) et qu'il n'est pas dans le même périmètre de compromission que les VM — sinon un ransomware chiffre aussi les sauvegardes." },

{ id:"b3-az-02", lvl:3, dom:"Azure",
  q:"Qu'est-ce qu'un Azure Container Registry et comment un AKS y accède-t-il proprement ?",
  accept:["attach","managed identity","acrpull","sans secret"],
  explain:"C'est le registry privé d'images. L'accès propre depuis AKS : <code>az aks update --attach-acr</code>, qui donne le rôle <code>AcrPull</code> à l'identité managée du kubelet — aucun imagePullSecret à gérer ni à faire tourner. Compléter par un Private Endpoint sur le registry si la sortie internet est interdite." },

{ id:"b3-az-03", lvl:3, dom:"Azure",
  q:"Comment fonctionne l'autoscaling d'une App Service et quelle est sa limite ?",
  accept:["scale out","regles","metrique","tier","delai"],
  explain:"Scale out (nombre d'instances) sur règles de métrique ou planification, dans les limites du tier du plan. Limites : le scale UP (changer de tier) n'est pas automatique, la réaction prend plusieurs minutes — donc inefficace face à un pic brutal —, et la base de données derrière ne scale pas avec. D'où le pré-scaling avant un pic connu." },

{ id:"b3-cicd-01", lvl:3, dom:"CI/CD",
  q:"Comment structures-tu la promotion d'un artefact de dev à prod ? Que change-t-on entre les environnements ?",
  accept:["meme artefact","configuration","variables","pas de rebuild"],
  explain:"Le MÊME artefact circule ; seule la CONFIGURATION change (variables d'environnement, secrets, endpoints, feature flags), injectée au déploiement. Rien de spécifique à l'environnement ne doit être compilé dans l'artefact — c'est le principe 12-factor, et c'est ce qui rend la recette représentative." },

{ id:"b3-cicd-02", lvl:3, dom:"CI/CD",
  q:"Qu'est-ce qu'un smoke test post-déploiement et pourquoi c'est non négociable ?",
  accept:["verification rapide","apres le deploiement","valide le chemin critique","rollback automatique"],
  explain:"Une poignée de tests rapides sur le chemin critique, exécutés juste après le déploiement contre l'environnement réel (l'appli répond, elle joint sa base, un parcours métier clé fonctionne). Sans ça, on ne découvre l'échec que par les utilisateurs. Idéalement, leur échec déclenche un rollback automatique." },

{ id:"b3-cicd-03", lvl:3, dom:"CI/CD",
  q:"Comment gères-tu les dépendances entre jobs et l'exécution en parallèle dans un pipeline ?",
  accept:["stages","needs","dag","dependances explicites"],
  explain:"Par stages séquentiels (simple mais on attend le plus lent) ou en DAG avec des dépendances explicites (<code>needs</code>, <code>dependsOn</code>) qui laissent démarrer un job dès que SES prérequis sont satisfaits. Le DAG réduit fortement le temps total sur des pipelines à nombreux modules." },

{ id:"b3-sec-01", lvl:3, dom:"Sécurité",
  q:"Comment protèges-tu une branche principale ? Cite quatre règles.",
  must:[["revue","approbation","pull request"],["pipeline","checks","tests verts"]],
  explain:"1) Interdiction du push direct, tout passe par PR. 2) N approbations dont au moins un CODEOWNER. 3) Checks de CI obligatoires au vert. 4) Interdiction du force-push et de la suppression. 5) Commits signés. 6) Réapprobation à chaque nouveau commit. 7) Pas de bypass administrateur. Ces règles matérialisent la séparation des tâches attendue par un auditeur." },

{ id:"b3-sec-02", lvl:3, dom:"Sécurité",
  q:"Qu'est-ce qu'un bastion (jump host) et pourquoi les services managés le remplacent-ils ?",
  accept:["point d entree unique","rebond","session manager","azure bastion","a maintenir"],
  explain:"Une machine unique exposée servant de rebond vers le réseau privé, avec journalisation. Un bastion classique est lui-même une VM à patcher, à durcir et à surveiller — un point de défaillance et une cible. Les services managés (SSM Session Manager, Azure Bastion) offrent la même fonction sans machine à maintenir, avec un contrôle IAM et un enregistrement natifs." },

{ id:"b3-obs-01", lvl:3, dom:"Observabilité",
  q:"Comment détectes-tu qu'un certificat TLS va expirer, avant l'incident ?",
  accept:["sonde","blackbox exporter","alerte j-30","probe","surveillance"],
  explain:"Une sonde externe qui se connecte régulièrement et exporte les jours restants (blackbox_exporter <code>probe_ssl_earliest_cert_expiry</code>, ou équivalent), avec une alerte à J-30 et une escalade à J-7. Et surtout : automatiser le renouvellement (ACME, Key Vault, ACM) pour que la surveillance ne soit qu'un filet de sécurité." },

{ id:"b3-obs-02", lvl:3, dom:"Observabilité",
  q:"Qu'est-ce qu'un test synthétique et qu'apporte-t-il par rapport aux métriques serveur ?",
  accept:["depuis l exterieur","point de vue utilisateur","parcours","24/7"],
  explain:"C'est un robot qui exécute un parcours utilisateur depuis l'extérieur, en continu, même sans trafic réel. Il détecte ce que les métriques serveur ne voient pas : DNS cassé, certificat expiré, CDN en panne, WAF trop agressif, dégradation régionale. C'est la réponse à « mes dashboards sont verts mais les clients se plaignent »." },

{ id:"b3-sre-01", lvl:3, dom:"SRE",
  q:"Comment définis-tu la gravité d'un incident (P1/P2/P3) ?",
  accept:["impact","nombre d utilisateurs","service critique","perte financiere","escalade"],
  explain:"Sur l'IMPACT MÉTIER, pas sur la difficulté technique : nombre d'utilisateurs touchés, criticité de la fonction (paiement vs page d'aide), perte financière ou réglementaire, existence d'un contournement. Chaque niveau doit avoir un délai de prise en charge, un canal et une règle d'escalade définis à l'avance — pas décidés pendant la panne." },

{ id:"b3-sql-01", lvl:3, dom:"SQL",
  q:"Qu'est-ce qu'une transaction longue et pourquoi c'est un problème en production ?",
  accept:["verrous","bloque","vacuum","idle in transaction","concurrence"],
  explain:"Une transaction ouverte longtemps tient ses verrous, bloque les écritures concurrentes, empêche le nettoyage des anciennes versions (VACUUM) et fait gonfler la base. Sur PostgreSQL, surveiller les sessions <code>idle in transaction</code> et poser un <code>idle_in_transaction_session_timeout</code>." },

{ id:"b3-sql-02", lvl:3, dom:"SQL",
  q:"Comment fais-tu une pagination performante sur une grosse table ?",
  accept:["keyset","seek","curseur","where id >","offset lent"],
  explain:"Pas avec <code>OFFSET 100000</code> : la base doit parcourir et jeter 100 000 lignes, et le coût croît avec la page. On utilise la pagination par clé (keyset/seek) : <code>WHERE (created_at, id) &lt; (:dernier_date, :dernier_id) ORDER BY created_at DESC, id DESC LIMIT 50</code> — coût constant, avec un index adapté." }

]);

<script>
/* data/niveau04.js */
window.QBANK = (window.QBANK || []).concat([
/* ================= NIVEAU 4 — INTERMÉDIAIRE ================= */

{ id:"n4-k8s-01", lvl:4, dom:"Kubernetes",
  q:"Décris le chemin complet d'un <code>kubectl apply -f deploy.yaml</code> jusqu'au conteneur qui tourne.",
  must:[["api server","apiserver"],["etcd"],["scheduler"],["kubelet"]],
  explain:"kubectl → API server (authN, authZ RBAC, admission controllers mutating puis validating) → persistance dans etcd → le Deployment controller crée un ReplicaSet → le ReplicaSet controller crée les Pods (sans nœud) → le scheduler leur assigne un nœud → le kubelet du nœud demande au container runtime (containerd via CRI) de démarrer les conteneurs → le kubelet remonte le statut à l'API server." },

{ id:"n4-k8s-02", lvl:4, dom:"Kubernetes",
  q:"Comment fonctionne un rolling update, et quel rôle jouent <code>maxSurge</code> et <code>maxUnavailable</code> ?",
  accept:["progressivement","nouveau replicaset","pods en plus","pods indisponibles","sans coupure"],
  explain:"Le Deployment crée un nouveau ReplicaSet et transfère progressivement les réplicas. <code>maxSurge</code> = combien de Pods EN PLUS du nominal on autorise temporairement ; <code>maxUnavailable</code> = combien peuvent manquer. maxUnavailable=0 + maxSurge=1 donne un déploiement sans perte de capacité, mais plus lent et il faut de la marge sur le cluster." },

{ id:"n4-k8s-03", lvl:4, dom:"Kubernetes",
  q:"À quoi sert un PodDisruptionBudget et contre quoi ne protège-t-il PAS ?",
  accept:["disruption volontaire","drain","minavailable","pas les crashs","pas involontaire"],
  explain:"Il garantit un nombre minimal de Pods disponibles pendant les disruptions VOLONTAIRES : <code>kubectl drain</code>, upgrade de nœuds, autoscaler qui réduit. Il ne protège pas des disruptions involontaires (crash de nœud, OOMKill, panne matérielle). Sans PDB, un upgrade de node pool peut vider ton service entier." },

{ id:"n4-k8s-04", lvl:4, dom:"Kubernetes",
  q:"Différence entre taints/tolerations et nodeAffinity ?",
  accept:["le noeud repousse","le pod attire","exclusion","preference","repulsion"],
  explain:"Taint = le NŒUD repousse les Pods sauf ceux qui ont la toleration correspondante (mécanisme d'exclusion : nœuds GPU, nœuds système). nodeAffinity = le POD exprime où il veut aller (attraction, avec required ou preferred). Les deux se combinent : la toleration autorise, l'affinity dirige." },

{ id:"n4-k8s-05", lvl:4, dom:"Kubernetes",
  q:"Comment le DNS interne résout-il un Service ? Donne le FQDN complet.",
  accept:["svc.namespace.svc.cluster.local","coredns","cluster.local"],
  explain:"<code>&lt;service&gt;.&lt;namespace&gt;.svc.cluster.local</code>, résolu par CoreDNS. Depuis le même namespace, le nom court suffit grâce au <code>search</code> du <code>/etc/resolv.conf</code> injecté. Un headless Service (<code>clusterIP: None</code>) renvoie directement les IP des Pods, d'où <code>db-0.db.default.svc.cluster.local</code> pour un StatefulSet." },

{ id:"n4-k8s-06", lvl:4, dom:"Kubernetes",
  q:"Qu'est-ce qu'un Ingress et pourquoi un objet Ingress seul ne fait rien ?",
  accept:["controller","besoin d un controleur","regles de routage","nginx","juste une declaration"],
  explain:"L'Ingress n'est qu'une déclaration de règles de routage HTTP (host/path → Service). Il faut un Ingress Controller (ingress-nginx, Traefik, AGIC, ALB Controller) qui les lit et configure un vrai reverse proxy. Sans controller, l'objet existe mais rien ne route. La Gateway API est le successeur normalisé." },

{ id:"n4-k8s-07", lvl:4, dom:"Kubernetes",
  q:"Comment donner à un Pod le droit d'appeler l'API Kubernetes, sans lui donner trop de droits ?",
  must:[["serviceaccount"],["role","rolebinding","rbac"]],
  explain:"Un ServiceAccount dédié au Pod + un Role (namespacé) ou ClusterRole limité aux verbes/ressources nécessaires, lié par un RoleBinding. Jamais le SA <code>default</code>, jamais <code>cluster-admin</code>, et <code>automountServiceAccountToken: false</code> quand le Pod n'appelle pas l'API." },

{ id:"n4-tf-01", lvl:4, dom:"Terraform",
  q:"Que fait <code>terraform state rm</code> et dans quel cas l'utilise-t-on ?",
  accept:["retire du state","sans detruire","cesse de gerer","migration"],
  explain:"Il retire une ressource du state SANS la détruire dans le cloud : Terraform cesse de la gérer. Cas d'usage : sortir une ressource pour la déplacer vers un autre state/module, ou abandonner la gestion d'un objet repris par une autre équipe. Un <code>apply</code> ensuite voudra la recréer si elle est encore dans le code." },

{ id:"n4-tf-02", lvl:4, dom:"Terraform",
  q:"À quoi sert le bloc <code>moved</code> et pourquoi c'est mieux que <code>terraform state mv</code> ?",
  accept:["renommer sans detruire","refactoring","declaratif","versionne","revue"],
  explain:"Il déclare dans le CODE qu'une ressource a changé d'adresse (renommage, passage en module, count → for_each). Avantages sur <code>state mv</code> : c'est versionné, revu en PR, visible dans le plan et rejoué automatiquement par tous les collaborateurs et la CI — pas une commande manuelle à reproduire partout." },

{ id:"n4-tf-03", lvl:4, dom:"Terraform",
  q:"Explique <code>lifecycle { prevent_destroy }</code>, <code>create_before_destroy</code> et <code>ignore_changes</code>.",
  must:[["prevent","bloque","empeche"],["avant de detruire","cree d abord"],["ignore"]],
  explain:"<code>prevent_destroy</code> : l'apply échoue si le plan veut détruire la ressource (base de données prod). <code>create_before_destroy</code> : crée le remplaçant avant de supprimer l'ancien (évite la coupure, attention aux noms uniques). <code>ignore_changes</code> : Terraform ignore la dérive sur certains attributs modifiés hors Terraform (tags posés par un outil, nombre d'instances géré par un autoscaler)." },

{ id:"n4-tf-04", lvl:4, dom:"Terraform",
  q:"Comment structures-tu un module Terraform réutilisable ? Que doit-il exposer et ne pas faire ?",
  must:[["variable","input"],["output"]],
  explain:"Fichiers <code>main.tf</code>/<code>variables.tf</code>/<code>outputs.tf</code>/<code>versions.tf</code>, variables typées avec description et validation, outputs pour tout ce dont l'appelant a besoin. Un module ne doit PAS déclarer de <code>provider</code> ni de <code>backend</code> (c'est le rôle du root module), et doit rester agnostique de l'environnement." },

{ id:"n4-tf-05", lvl:4, dom:"Terraform",
  q:"Que se passe-t-il si deux pipelines lancent <code>terraform apply</code> en même temps sur le même state ?",
  accept:["lock","verrou","le second attend","erreur de verrouillage","corruption sans lock"],
  explain:"Avec un backend qui supporte le locking, le second obtient une erreur de verrouillage (ou attend) — c'est le comportement voulu. Sans lock, les deux écrivent le state et l'un écrase l'autre : ressources orphelines et state incohérent. Un lock resté coincé se libère avec <code>terraform force-unlock &lt;id&gt;</code>, après avoir vérifié qu'aucun apply ne tourne." },

{ id:"n4-aws-01", lvl:4, dom:"AWS",
  q:"Un rôle IAM autorise <code>s3:GetObject</code> mais l'appel échoue en AccessDenied. Cite trois causes possibles.",
  must:[["bucket policy","resource"],["kms","chiffrement","scp","boundary"]],
  explain:"1) La bucket policy (ou un Block Public Access / une SCP d'organisation) refuse explicitement — un Deny gagne toujours. 2) L'objet est chiffré en KMS et le rôle n'a pas <code>kms:Decrypt</code> sur la clé. 3) Une permission boundary ou une session policy réduit les droits effectifs. On tranche avec le IAM Policy Simulator et CloudTrail." },

{ id:"n4-aws-02", lvl:4, dom:"AWS",
  q:"Explique l'ordre d'évaluation d'une décision IAM.",
  accept:["deny explicite gagne","deny par defaut","allow explicite","implicite"],
  explain:"1) Deny par défaut. 2) Un Deny EXPLICITE (SCP, policy, bucket policy, boundary) l'emporte toujours et arrête l'évaluation. 3) Sinon, un Allow explicite doit exister dans l'intersection des SCP / boundary / identity policy (ou dans une resource policy). Sans Allow, c'est refusé." },

{ id:"n4-aws-03", lvl:4, dom:"AWS",
  q:"Différence entre Auto Scaling Group et Elastic Load Balancer — et pourquoi les deux ensemble ?",
  accept:["capacite","repartition","health check","ajoute des instances","distribue le trafic"],
  explain:"L'ASG gère la CAPACITÉ (nombre d'instances, remplacement des instances non saines, scaling par métrique). L'ELB gère la RÉPARTITION du trafic. Ensemble : l'ASG enregistre automatiquement les nouvelles instances dans le target group, et peut utiliser le health check ELB pour décider qu'une instance est à remplacer." },

{ id:"n4-aws-04", lvl:4, dom:"AWS",
  q:"Qu'est-ce qu'un VPC Endpoint et quelle différence entre Gateway et Interface endpoint ?",
  accept:["sans passer par internet","route table","eni privee","privatelink","s3 dynamodb"],
  explain:"Il permet d'atteindre un service AWS sans sortir sur internet. Gateway endpoint : uniquement S3 et DynamoDB, gratuit, s'ajoute comme une ROUTE dans la route table. Interface endpoint (PrivateLink) : une ENI avec IP privée dans ton subnet, payant à l'heure et au Go, disponible pour la plupart des services." },

{ id:"n4-aws-05", lvl:4, dom:"AWS",
  q:"Quelle est la différence entre un snapshot EBS et une AMI ?",
  accept:["ami inclut","metadonnees","bloc","volume","bootable"],
  explain:"Un snapshot EBS est une copie incrémentale d'UN volume, stockée dans S3. Une AMI est un modèle de lancement complet : un ou plusieurs snapshots + les métadonnées (architecture, mode de virtualisation, mapping des devices, noyau) qui rendent l'ensemble bootable." },

{ id:"n4-az-01", lvl:4, dom:"Azure",
  q:"Comment une App Service accède-t-elle à un Key Vault sans stocker de secret ?",
  must:[["managed identity","identite manageee"],["access policy","rbac","role"]],
  explain:"On active une Managed Identity sur l'App Service, on lui donne le rôle <code>Key Vault Secrets User</code> (RBAC, ou une access policy sur les coffres anciens), puis on référence le secret dans les app settings via <code>@Microsoft.KeyVault(SecretUri=…)</code>. Aucun secret dans le code ni dans la config." },

{ id:"n4-az-02", lvl:4, dom:"Azure",
  q:"Qu'est-ce qu'un deployment slot App Service et quel piège au moment du swap ?",
  accept:["preproduction","swap","warm up","sticky","parametres de slot"],
  explain:"Un slot est une instance parallèle de l'app (même plan) permettant de déployer, chauffer et tester avant un swap quasi instantané avec la prod — et de revenir en arrière en re-swappant. Piège : par défaut, les app settings SUIVENT le swap ; il faut cocher « deployment slot setting » (sticky) sur les paramètres spécifiques à l'environnement (chaînes de connexion, feature flags)." },

{ id:"n4-az-03", lvl:4, dom:"Azure",
  q:"Différence entre Azure AD (Entra ID) et Azure RBAC — un Global Administrator peut-il tout faire sur les ressources ?",
  accept:["plan de controle different","non","elevate access","annuaire","ressources"],
  explain:"Entra ID gère l'ANNUAIRE (identités, groupes, applications, rôles d'annuaire). Azure RBAC gère les droits sur les RESSOURCES Azure. Ce sont deux plans distincts : un Global Admin n'a par défaut aucun droit sur les ressources, il doit d'abord activer « Elevate access » pour devenir User Access Administrator à la racine." },

{ id:"n4-az-04", lvl:4, dom:"Azure",
  q:"Décris une topologie hub-and-spoke et ce qu'on met dans le hub.",
  accept:["peering","firewall","bastion","vpn gateway","services partages"],
  explain:"Un VNet hub connecté par peering à des VNets spokes (une app / une équipe / un environnement par spoke). Dans le hub : Azure Firewall, VPN/ExpressRoute Gateway, Bastion, DNS privé, éventuellement les Private Endpoints partagés. Les spokes ne se parlent pas directement : on force le transit par le hub via des UDR pour inspecter le trafic." },

{ id:"n4-cicd-01", lvl:4, dom:"CI/CD",
  q:"Explique un déploiement blue/green et son coût par rapport à un canary.",
  accept:["deux environnements","bascule","rollback instantane","double capacite","progressif"],
  explain:"Blue/green : deux environnements complets, on bascule tout le trafic d'un coup, rollback instantané en repointant — mais il faut payer la double capacité. Canary : on route un petit pourcentage vers la nouvelle version et on augmente progressivement selon les métriques — moins cher, mais plus long et il faut deux versions compatibles simultanément." },

{ id:"n4-cicd-02", lvl:4, dom:"CI/CD",
  q:"Comment gères-tu une migration de base de données incompatible dans un déploiement sans coupure ?",
  accept:["expand contract","retrocompatible","deux etapes","backward compatible","ajouter puis supprimer"],
  explain:"Pattern expand/contract : 1) EXPAND — on ajoute la nouvelle colonne/table sans rien casser, l'ancienne version continue de fonctionner. 2) On déploie le code qui écrit dans les deux et lit la nouvelle. 3) On migre les données. 4) CONTRACT — une fois toutes les instances migrées, on supprime l'ancienne colonne. Jamais de migration destructive dans le même déploiement que le code." },

{ id:"n4-cicd-03", lvl:4, dom:"CI/CD",
  q:"Qu'est-ce qu'un test flaky et comment le traites-tu ?",
  accept:["resultat non deterministe","aleatoire","quarantaine","isole","depend du temps"],
  explain:"Un test qui passe ou échoue sans changement de code (dépendance au temps, à l'ordre d'exécution, au réseau, à un état partagé). On ne le relance pas en boucle : on le met en quarantaine hors du pipeline bloquant, on ouvre un ticket, on corrige la cause. Un pipeline qu'on relance « pour voir » a perdu toute valeur de signal." },

{ id:"n4-linux-01", lvl:4, dom:"Linux",
  q:"Que sont les namespaces et les cgroups, et lequel fait quoi pour un conteneur ?",
  must:[["namespace","isolation","visibilite"],["cgroup","ressource","limite"]],
  explain:"Les namespaces isolent la VISION du process : pid, net, mnt, uts, ipc, user, cgroup — ce qu'il peut voir. Les cgroups limitent la CONSOMMATION : CPU, mémoire, I/O, nombre de pids. Un conteneur = un process normal avec des namespaces + des cgroups + un filesystem overlay. Rien de magique." },

{ id:"n4-linux-02", lvl:4, dom:"Linux",
  q:"Ton application est tuée sans log applicatif. Comment vérifies-tu que c'est l'OOM killer ?",
  accept:["dmesg","journalctl -k","oom-killer","kern.log","exit code 137"],
  explain:"<code>dmesg -T | grep -i oom</code> ou <code>journalctl -k</code> : le noyau logue « Out of memory: Killed process ». Côté conteneur, un exit code 137 (128+9 = SIGKILL) et <code>OOMKilled</code> dans <code>kubectl describe</code>. Ensuite on regarde si c'est la limite du cgroup ou la mémoire physique de l'hôte." },

{ id:"n4-res-01", lvl:4, dom:"Réseau",
  q:"Quelle différence entre un firewall qui DROP et un qui REJECT, et comment le diagnostiques-tu côté client ?",
  accept:["timeout","connection refused","silencieux","rst","icmp"],
  explain:"DROP jette le paquet sans réponse : le client attend et finit en TIMEOUT. REJECT renvoie un RST TCP ou un ICMP unreachable : le client obtient « connection refused » immédiatement. Donc : timeout → suspecte un SG/NSG/NACL ou une route ; refused → la route est bonne mais rien n'écoute sur le port." },

{ id:"n4-res-02", lvl:4, dom:"Réseau",
  q:"Qu'est-ce que le MTU et quel symptôme typique donne un MTU mal réglé sur un tunnel VPN ?",
  accept:["taille maximale","fragmentation","petites requetes passent","gros paquets bloques","1500"],
  explain:"Le MTU est la taille max d'une trame (1500 en Ethernet, moins dans un tunnel à cause de l'encapsulation). Symptôme signature : les petites requêtes (ping, handshake) passent, mais les gros transferts se figent — les paquets pleins nécessitent une fragmentation refusée, souvent parce que l'ICMP « fragmentation needed » est bloqué (PMTUD cassé)." },

{ id:"n4-sec-01", lvl:4, dom:"Sécurité",
  q:"Qu'est-ce que le chiffrement au repos vs en transit, et pourquoi les deux ne suffisent pas ?",
  accept:["disque","reseau","tls","en memoire","cle","acces applicatif"],
  explain:"Au repos = données chiffrées sur le support (KMS/Key Vault, TDE, chiffrement de disque). En transit = TLS/mTLS sur le réseau. Ça ne protège pas d'un accès légitime détourné : si l'application ou l'identité qui a le droit de déchiffrer est compromise, tout est lisible. D'où IAM, segmentation, journalisation et chiffrement applicatif pour les données les plus sensibles." },

{ id:"n4-sec-02", lvl:4, dom:"Sécurité",
  q:"Qu'est-ce que mTLS et quand l'impose-t-on ?",
  accept:["authentification mutuelle","les deux presentent un certificat","service mesh","client aussi"],
  explain:"En TLS classique seul le serveur prouve son identité ; en mTLS le CLIENT présente aussi un certificat. On l'impose entre services internes (service mesh type Istio/Linkerd, zero trust), pour des API partenaires en banque, ou quand on ne veut pas dépendre d'un secret partagé. Coût : une PKI et une rotation de certificats à industrialiser." },

{ id:"n4-obs-01", lvl:4, dom:"Observabilité",
  q:"Explique la méthode RED et la méthode USE, et pour quoi chacune est faite.",
  must:[["rate","requete","debit"],["error","erreur"],["duration","latence"]],
  explain:"RED (services) : Rate (req/s), Errors (taux d'erreur), Duration (latence, en percentiles). USE (ressources) : Utilization, Saturation, Errors — pour CPU, mémoire, disque, réseau. RED répond « mes utilisateurs souffrent-ils ? », USE répond « quelle ressource est le goulot ? »." },

{ id:"n4-obs-02", lvl:4, dom:"Observabilité",
  q:"Pourquoi regarde-t-on le p95/p99 de latence plutôt que la moyenne ?",
  accept:["moyenne masque","valeurs extremes","queue","percentile","utilisateurs les plus lents"],
  explain:"La moyenne masque la queue de distribution : avec 99 requêtes à 50 ms et une à 10 s, la moyenne reste bonne alors qu'un utilisateur a une expérience catastrophique. Les percentiles décrivent l'expérience réelle des pires cas — et sur une page qui fait 20 appels, le p99 de chaque appel devient la norme pour l'utilisateur." },

{ id:"n4-sql-01", lvl:4, dom:"SQL",
  q:"Qu'est-ce qu'un deadlock en base et comment le résout-on structurellement ?",
  accept:["attente mutuelle","interblocage","ordre des verrous","transactions courtes","victime"],
  explain:"Deux transactions attendent chacune un verrou détenu par l'autre ; le SGBD en tue une (victime) et l'application doit rejouer. Structurellement : accéder aux ressources TOUJOURS dans le même ordre, garder les transactions courtes, réduire le niveau d'isolation si acceptable, et indexer pour verrouiller des lignes plutôt que des plages." },

{ id:"n4-sre-01", lvl:4, dom:"SRE",
  q:"Différence entre RTO et RPO ? Donne un exemple chiffré.",
  must:[["temps de reprise","duree d indisponibilite","recovery time"],["perte de donnees","recovery point"]],
  explain:"RTO = en combien de temps le service doit revenir. RPO = combien de données on accepte de perdre. Exemple : RTO 1 h / RPO 15 min → il faut des sauvegardes ou une réplication toutes les 15 min et une procédure de bascule tenant en une heure. Un RPO proche de zéro impose de la réplication synchrone, donc un coût et une latence." }

]);

<script>
/* data/niveau04b.js */
window.QBANK = (window.QBANK || []).concat([
/* ============ NIVEAU 4 — SÉRIE B ============ */

{ id:"b4-k8s-01", lvl:4, dom:"Kubernetes",
  q:"Qu'est-ce qu'un sidecar ? Donne deux usages réels et le principal inconvénient.",
  accept:["conteneur additionnel","meme pod","proxy","log","consomme des ressources"],
  explain:"Un conteneur secondaire dans le même Pod, partageant réseau et volumes. Usages : proxy de service mesh (Envoy), collecteur de logs, rechargeur de config/secrets, adaptateur de métriques. Inconvénients : ressources consommées par Pod, ordre d'arrêt à gérer (le sidecar ne doit pas mourir avant l'app), et complexité de debug. Les <em>native sidecars</em> (initContainers avec restartPolicy Always) règlent le problème du cycle de vie." },

{ id:"b4-k8s-02", lvl:4, dom:"Kubernetes",
  q:"Comment fais-tu tourner une charge sur des nœuds Spot sans compromettre la disponibilité ?",
  must:[["taint","toleration","node pool","selector"],["pdb","replicas","stateless","tolerant"]],
  explain:"Node pool Spot avec un taint, tolerations uniquement sur les charges tolérantes aux interruptions, réplicas répartis (topologySpread) sur Spot ET on-demand, PDB, arrêt gracieux court, et gestion du signal d'interruption (2 min sur AWS, 30 s sur Azure) pour drainer. Jamais de charge à état ou de composant unique du chemin critique uniquement sur du Spot." },

{ id:"b4-k8s-03", lvl:4, dom:"Kubernetes",
  q:"Qu'est-ce qu'un headless Service et pour quel besoin l'utilise-t-on ?",
  accept:["clusterip none","ip des pods","statefulset","dns par pod","pas de load balancing"],
  explain:"<code>clusterIP: None</code> : pas d'IP virtuelle ni de répartition, le DNS renvoie directement les IP de tous les Pods. Usages : StatefulSets (adresser <code>db-0</code> précisément), clients qui font leur propre équilibrage ou découverte de pairs (Kafka, Cassandra, Elasticsearch), et gRPC qui a besoin des endpoints individuels." },

{ id:"b4-k8s-04", lvl:4, dom:"Kubernetes",
  q:"Pourquoi gRPC s'équilibre-t-il mal derrière un Service ClusterIP classique ?",
  accept:["connexion persistante","http/2","multiplexe","une seule connexion","l4"],
  explain:"gRPC utilise HTTP/2 avec des connexions longue durée multiplexées : le Service, qui équilibre au niveau CONNEXION (L4), envoie tout le trafic d'un client vers un seul Pod. Résultat : charge très déséquilibrée. Solutions : équilibrage côté client via un headless Service, un proxy L7 conscient de gRPC, ou un service mesh." },

{ id:"b4-k8s-05", lvl:4, dom:"Kubernetes",
  q:"Comment gères-tu les secrets dans Kubernetes sans les stocker dans Git ?",
  accept:["external secrets","secrets store csi","sealed secrets","coffre externe"],
  explain:"1) External Secrets Operator ou Secrets Store CSI Driver : le secret reste dans Key Vault / Secrets Manager / Vault, le cluster le synchronise ou le monte à la demande. 2) Sealed Secrets / SOPS : le secret CHIFFRÉ est versionné dans Git, seul le cluster peut le déchiffrer. La première approche est préférable en banque (rotation centralisée, audit des accès)." },

{ id:"b4-k8s-06", lvl:4, dom:"Kubernetes",
  q:"Que se passe-t-il exactement entre le moment où tu supprimes un Pod et sa disparition ?",
  must:[["sigterm"],["grace","terminationgraceperiod","delai"]],
  explain:"Le Pod passe en Terminating, il est retiré des Endpoints (en parallèle, d'où les races), le hook <code>preStop</code> s'exécute, puis SIGTERM est envoyé au PID 1. Le conteneur a <code>terminationGracePeriodSeconds</code> (30 s par défaut) pour finir ses requêtes en cours et sortir ; passé ce délai, SIGKILL. D'où : arrêt gracieux applicatif + preStop pour couvrir la propagation du retrait." },

{ id:"b4-tf-01", lvl:4, dom:"Terraform",
  q:"Comment migres-tu un state d'un backend local vers un backend distant, sans perdre l'infrastructure ?",
  accept:["init -migrate-state","copier","terraform init","confirmation"],
  explain:"On ajoute le bloc <code>backend</code> dans la configuration puis <code>terraform init -migrate-state</code> : Terraform propose de copier le state existant vers le nouveau backend. On vérifie ensuite par un <code>plan</code> qui doit annoncer « no changes ». Sauvegarder le fichier local avant, par prudence." },

{ id:"b4-tf-02", lvl:4, dom:"Terraform",
  q:"À quoi servent les <code>dynamic</code> blocks et quel est leur inconvénient ?",
  accept:["generer des blocs","boucle","for_each imbrique","lisibilite"],
  explain:"Ils génèrent dynamiquement des blocs imbriqués répétitifs (règles de security group, settings) à partir d'une collection. Inconvénient : ça dégrade sérieusement la lisibilité et complique le diff du plan. Règle pratique : n'y recourir que quand le nombre de blocs est réellement variable, pas pour économiser cinq lignes." },

{ id:"b4-tf-03", lvl:4, dom:"Terraform",
  q:"Comment structures-tu le nommage et le tagging de tes ressources en Terraform ?",
  accept:["locals","convention","tags communs","merge","default_tags"],
  explain:"Une convention centralisée dans des <code>locals</code> (<code>{projet}-{env}-{composant}-{région}</code>) et un bloc de tags communs fusionné partout avec <code>merge(local.tags_communs, {...})</code>. Sur AWS, <code>default_tags</code> au niveau provider ; sur Azure, une Azure Policy en mode Modify pour imposer les tags. Sans ça, aucune refacturation ni inventaire fiable." },

{ id:"b4-tf-04", lvl:4, dom:"Terraform",
  q:"Terraform doit créer une ressource qui dépend d'une valeur générée aléatoirement. Comment garantis-tu la stabilité ?",
  accept:["random provider","keepers","dans le state","ne change pas"],
  explain:"On utilise le provider <code>random</code> (<code>random_password</code>, <code>random_id</code>) : la valeur est générée UNE fois et conservée dans le state, donc stable aux apply suivants. Les <code>keepers</code> permettent de forcer une régénération quand une entrée change. Un <code>uuid()</code> ou un <code>timestamp()</code> dans une ressource provoque au contraire un diff perpétuel." },

{ id:"b4-aws-01", lvl:4, dom:"AWS",
  q:"Comment fonctionne le chiffrement S3 côté serveur ? Différence SSE-S3, SSE-KMS, SSE-C.",
  must:[["kms","cle geree"],["s3","aws gere"]],
  explain:"SSE-S3 : clés entièrement gérées par AWS, simple, pas de contrôle ni de traçabilité fine. SSE-KMS : clé dans KMS, avec politique d'accès, journalisation CloudTrail de chaque déchiffrement et possibilité de clé gérée par le client (CMK) — le choix bancaire. SSE-C : tu fournis la clé à chaque requête, AWS ne la stocke pas (rare, contraignant). À savoir : SSE-KMS ajoute un coût et un quota de requêtes KMS." },

{ id:"b4-aws-02", lvl:4, dom:"AWS",
  q:"Qu'est-ce qu'AWS Step Functions et quand le préfère-t-on à une Lambda qui appelle d'autres Lambdas ?",
  accept:["orchestration","machine a etats","retry","visibilite","longue duree"],
  explain:"C'est un orchestrateur de workflow (machine à états) : il gère les retries, les branchements, les erreurs, les timeouts et les traitements longs, avec une visualisation de l'exécution. On le préfère dès qu'il y a plusieurs étapes : chaîner des Lambdas à la main, c'est réimplémenter mal la gestion d'erreurs, et perdre toute traçabilité du parcours." },

{ id:"b4-aws-03", lvl:4, dom:"AWS",
  q:"Comment sécurises-tu un bucket S3 qui ne doit JAMAIS être public ? Cite les couches.",
  must:[["block public access"],["bucket policy","deny","policy"]],
  explain:"1) Block Public Access au niveau bucket ET au niveau compte. 2) Bucket policy avec un Deny explicite sur tout principal non autorisé et un Deny si <code>aws:SecureTransport = false</code>. 3) SCP d'organisation interdisant de désactiver Block Public Access. 4) Chiffrement SSE-KMS avec une key policy restrictive. 5) Access Analyzer + Config pour détecter toute dérive. Défense en profondeur : une seule couche finit toujours par sauter." },

{ id:"b4-aws-04", lvl:4, dom:"AWS",
  q:"Différence entre ECS sur EC2 et ECS sur Fargate ? Sur quoi arbitres-tu ?",
  accept:["gerer les instances","serverless","cout","controle","densite"],
  explain:"Sur EC2 : tu gères les instances (patchs, capacité, AMI), tu peux optimiser la densité et le coût, utiliser du Spot et des types spécifiques (GPU). Sur Fargate : plus de nœuds à gérer, isolation par tâche, facturation à la ressource demandée — plus cher à l'unité mais souvent moins cher tout compris quand on valorise le temps humain. Arbitrage : contrôle et coût unitaire vs charge opérationnelle." },

{ id:"b4-az-01", lvl:4, dom:"Azure",
  q:"Comment mets-tu en place une identité de pipeline Azure DevOps / GitHub vers Azure sans secret ?",
  accept:["workload identity federation","oidc","federated credential","sans secret"],
  explain:"Workload identity federation : on crée une application/identité managée dans Entra ID et on lui ajoute un <em>federated credential</em> qui fait confiance à l'émetteur OIDC du fournisseur CI, restreint au dépôt/branche/environnement précis. Le pipeline échange son token OIDC contre un token Entra — aucun secret à stocker ni à faire tourner." },

{ id:"b4-az-02", lvl:4, dom:"Azure",
  q:"Qu'est-ce qu'un Azure Front Door et en quoi diffère-t-il d'une Application Gateway ?",
  accept:["global","regional","anycast","edge","multi region"],
  explain:"Front Door est GLOBAL : points de présence en périphérie, routage anycast, cache CDN, WAF, bascule multi-région et accélération. Application Gateway est RÉGIONALE : L7 + WAF pour les backends d'une région. Architecture typique : Front Door en entrée mondiale → Application Gateway par région → backends." },

{ id:"b4-az-03", lvl:4, dom:"Azure",
  q:"Comment fonctionne le patching des VM Azure à l'échelle ?",
  accept:["update manager","maintenance configuration","fenetre","conformite"],
  explain:"Azure Update Manager : évaluation périodique de la conformité, planification par <em>maintenance configuration</em> (fenêtres définies), déploiement par vagues avec exclusions, et rapports. En complément : images dorées reconstruites régulièrement plutôt que patchées en place — plus proche de l'immuabilité, et c'est l'argument à donner." },

{ id:"b4-az-04", lvl:4, dom:"Azure",
  q:"Différence entre Azure Files et Azure Blob pour une application conteneurisée ?",
  accept:["systeme de fichiers","smb nfs","objet","readwritemany","api rest"],
  explain:"Azure Files expose un système de fichiers (SMB/NFS) montable par plusieurs Pods simultanément — c'est l'option ReadWriteMany. Blob est du stockage objet accédé par API/SDK, bien plus performant et économique pour de gros volumes, mais ce n'est pas un filesystem POSIX. Choisir Files uniquement quand l'application EXIGE un montage partagé." },

{ id:"b4-cicd-01", lvl:4, dom:"CI/CD",
  q:"Comment implémentes-tu un déploiement canary sur Kubernetes ? Cite deux approches.",
  accept:["argo rollouts","flagger","ingress weight","service mesh","deux deployments"],
  explain:"1) Manuellement : deux Deployments (stable et canary) derrière le même Service, ratio piloté par le nombre de réplicas — grossier. 2) Par pondération au niveau du routage : annotations de l'ingress controller, Gateway API, ou service mesh. 3) Automatisé avec Argo Rollouts ou Flagger : montée progressive avec ANALYSE automatique des métriques et rollback si les seuils sont dépassés — c'est la bonne réponse." },

{ id:"b4-cicd-02", lvl:4, dom:"CI/CD",
  q:"Qu'est-ce qu'un feature flag, et quelle dette crée-t-il ?",
  accept:["activer sans deployer","decouple","nettoyage","combinatoire","dette"],
  explain:"Un interrupteur qui active/désactive une fonctionnalité sans redéployer : il découple la mise en production de la mise à disposition, permet le déploiement progressif par segment et le kill switch instantané. Dette : chaque flag ajoute un chemin de code et une combinatoire de tests. Il faut une date de péremption et un nettoyage systématique — un flag permanent est devenu une option de configuration, il faut l'assumer comme telle." },

{ id:"b4-cicd-03", lvl:4, dom:"CI/CD",
  q:"Comment garantis-tu qu'un artefact déployé en production est bien celui qui a été testé ?",
  accept:["digest","immuable","signature","promotion","meme identifiant"],
  explain:"Référencer par identifiant IMMUABLE (digest SHA256 de l'image, pas un tag), signer l'artefact au build et vérifier la signature à l'admission, tracer la promotion (quel digest a passé quel environnement), et produire une attestation de provenance. Un tag mutable ne prouve rien — il peut être réaffecté à tout moment." },

{ id:"b4-sec-01", lvl:4, dom:"Sécurité",
  q:"Qu'est-ce qu'OAuth 2.0 et OpenID Connect ? Ne confonds pas les deux.",
  must:[["autorisation","acces","deleguer"],["authentification","identite","id token"]],
  explain:"OAuth 2.0 est un protocole d'AUTORISATION : il délègue un accès à une ressource via un access token, sans partager le mot de passe. OpenID Connect est une couche d'AUTHENTIFICATION construite au-dessus : il ajoute l'<code>id_token</code> (un JWT décrivant l'utilisateur) et le endpoint userinfo. Utiliser OAuth seul pour authentifier est une erreur classique de conception." },

{ id:"b4-sec-02", lvl:4, dom:"Sécurité",
  q:"Qu'est-ce qu'une permission boundary AWS et quand l'utilise-t-on ?",
  accept:["plafond","delegation","limite maximale","developpeur peut creer des roles"],
  explain:"C'est un plafond de permissions attaché à une identité : les droits effectifs sont l'INTERSECTION de la policy et de la boundary. Usage typique : autoriser des équipes à créer leurs propres rôles IAM (autonomie) sans qu'elles puissent s'octroyer plus que ce que la boundary permet — délégation encadrée, très utilisée en grande organisation." },

{ id:"b4-sec-03", lvl:4, dom:"Sécurité",
  q:"Comment détectes-tu qu'un secret a été commité, avant qu'il n'arrive dans l'historique partagé ?",
  accept:["pre-commit","gitleaks","trufflehog","scan","push protection"],
  explain:"Hook pre-commit (gitleaks, detect-secrets, trufflehog) sur les postes, DOUBLÉ d'un contrôle côté serveur non contournable : push protection du forge, ou job CI bloquant qui scanne l'historique de la PR. Le hook local seul est contournable avec <code>--no-verify</code> — c'est un accélérateur, pas un contrôle." },

{ id:"b4-obs-01", lvl:4, dom:"Observabilité",
  q:"Comment instrumentes-tu une application pour exposer des métriques Prometheus ?",
  accept:["client library","/metrics","counter","histogram","exporter"],
  explain:"Bibliothèque cliente (ou OpenTelemetry avec export Prometheus) qui expose un endpoint <code>/metrics</code> : counters pour les requêtes et erreurs, histogrammes pour les latences, gauges pour les états. Pour un composant qu'on ne peut pas modifier, on utilise un <em>exporter</em> dédié. Règle : labels de cardinalité bornée uniquement." },

{ id:"b4-obs-02", lvl:4, dom:"Observabilité",
  q:"Qu'est-ce qu'Alertmanager apporte par rapport à une simple règle d'alerte ?",
  accept:["regroupement","inhibition","silence","routage","deduplication"],
  explain:"Il gère le cycle de vie de la notification : regroupement (une notification pour 50 pods tombés, pas 50), déduplication, inhibition (ne pas alerter sur les symptômes quand la cause parente est déjà connue), silences planifiés pour les maintenances, et routage vers la bonne équipe selon les labels. Sans lui, une panne génère une avalanche qui noie l'information utile." },

{ id:"b4-sre-01", lvl:4, dom:"SRE",
  q:"Qu'est-ce qu'un test de charge, un test de stress et un test d'endurance ?",
  must:[["charge attendue","nominal","cible"],["limite","rupture","au-dela"],["duree","longue","fuite"]],
  explain:"Charge : on valide le comportement à la charge ATTENDUE (latence, erreurs). Stress : on pousse jusqu'à la RUPTURE pour connaître le point de bascule et vérifier que la dégradation est gracieuse. Endurance (soak) : charge nominale pendant des heures pour révéler les fuites mémoire, la saturation de pools et le gonflement des logs. Les trois répondent à des questions différentes." },

{ id:"b4-sre-02", lvl:4, dom:"SRE",
  q:"Comment estimes-tu le coût d'une minute d'indisponibilité, et pourquoi c'est utile ?",
  accept:["chiffre d affaires","transactions","penalite","justifier l investissement"],
  explain:"Chiffre d'affaires ou volume de transactions par minute sur la période concernée, plus les pénalités contractuelles, le coût de traitement des réclamations, et l'impact réputationnel/réglementaire (en banque, un incident majeur se déclare au régulateur). Utilité : c'est le seul argument qui fait accepter un investissement en résilience par une direction." },

{ id:"b4-linux-01", lvl:4, dom:"Linux",
  q:"Qu'est-ce que le TIME_WAIT et faut-il s'en inquiéter sur un reverse proxy ?",
  accept:["fermeture","2msl","normal","ports ephemeres","reutilisation"],
  explain:"C'est l'état d'attente (2×MSL, ~60 s) du côté qui ferme la connexion, pour absorber les paquets retardataires. Sur un proxy à fort trafic, en voir des dizaines de milliers est NORMAL. Ça ne devient un problème que si on épuise les ports éphémères — la solution est le keep-alive et le pooling de connexions, pas de bricoler les sysctl à l'aveugle." },

{ id:"b4-linux-02", lvl:4, dom:"Linux",
  q:"Comment fonctionne la rotation de logs et quel est le piège avec un processus qui écrit en continu ?",
  accept:["logrotate","copytruncate","signal","reouvre le fichier","descripteur"],
  explain:"logrotate renomme le fichier et en crée un nouveau — mais le processus écrit toujours dans l'ancien descripteur. Il faut soit lui envoyer un signal pour qu'il rouvre (<code>postrotate</code> + SIGHUP/<code>systemctl reload</code>), soit utiliser <code>copytruncate</code> (copie puis tronque, avec un petit risque de perte). Oublier ça, c'est le disque qui se remplit avec un fichier « supprimé »." },

{ id:"b4-res-01", lvl:4, dom:"Réseau",
  q:"Qu'est-ce qu'un routage asymétrique et pourquoi ça casse un firewall stateful ?",
  accept:["aller et retour differents","pas le meme chemin","etat inconnu","drop"],
  explain:"L'aller passe par un chemin et le retour par un autre. Un firewall stateful qui voit le retour sans avoir vu l'aller ne trouve pas d'entrée dans sa table d'états et jette le paquet. C'est un classique des architectures hybrides avec VPN + ExpressRoute/Direct Connect actifs simultanément et des préférences BGP mal réglées." },

{ id:"b4-res-02", lvl:4, dom:"Réseau",
  q:"Comment fonctionne le health check d'un load balancer et quel réglage cause le plus de faux positifs ?",
  accept:["intervalle","seuil","timeout","trop agressif","unhealthy threshold"],
  explain:"Le LB interroge périodiquement un endpoint ; après N échecs consécutifs la cible est retirée, après M succès elle revient. Faux positifs classiques : timeout plus court que la latence réelle sous charge, seuil d'échec à 1, ou endpoint de santé qui teste les dépendances externes — un ralentissement de la base retire alors TOUTES les cibles d'un coup." }

]);
