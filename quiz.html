window.QBANK = (window.QBANK || []).concat([
/* ================= NIVEAU 7 — ARCHITECTURE & PRODUCTION ================= */

{ id:"n7-arch-01", lvl:7, dom:"SRE",
  q:"On te demande une application « hautement disponible ». Quelles questions poses-tu AVANT de proposer une architecture ?",
  must:[["rto","rpo","perte de donnees","temps de reprise"],["budget","cout","slo","disponibilite cible"]],
  explain:"1) Quel SLO de disponibilité réel, et qui le subit ? 2) RTO et RPO acceptés ? 3) Budget, y compris le coût de la capacité dormante. 4) L'application est-elle stateless ou porte-t-elle un état ? 5) Contraintes réglementaires et de résidence des données. 6) Y a-t-il des dépendances externes hors de notre contrôle ? Répondre « multi-région actif/actif » sans ces réponses est le piège classique." },

{ id:"n7-k8s-01", lvl:7, dom:"Kubernetes",
  q:"Comment garantis-tu qu'un service reste disponible pendant l'upgrade d'un cluster AKS/EKS ?",
  must:[["pdb","poddisruptionbudget"],["anti-affinity","topology spread","reparti","plusieurs noeuds"]],
  explain:"Réplicas &gt; 1 répartis par <code>topologySpreadConstraints</code> ou anti-affinité sur des zones et des nœuds différents, PodDisruptionBudget avec <code>minAvailable</code>, readiness probes fiables, arrêt gracieux avec preStop, surge upgrade sur le node pool (on ajoute un nœud avant de vider l'ancien), et upgrade nœud par nœud hors des heures de pointe. On teste la procédure en recette d'abord." },

{ id:"n7-k8s-02", lvl:7, dom:"Kubernetes",
  q:"Faut-il faire tourner une base de données en Kubernetes ? Défends une position.",
  accept:["depend","operateur","statefulset","service manage","complexite"],
  explain:"Position défendable : par défaut NON en banque — un service managé (RDS, Azure SQL, Aurora) fournit sauvegardes, PITR, patchs, HA et certification sans coût opérationnel. On met une base dans K8s si on a un opérateur mature (CloudNativePG, Vitess), une vraie compétence interne, un besoin de portabilité multi-cloud ou du dev/test. Le point clé en entretien : montrer qu'on arbitre coût opérationnel vs contrôle, pas dire « ça se fait »." },

{ id:"n7-k8s-03", lvl:7, dom:"Kubernetes",
  q:"Multi-tenant : comment isoles-tu plusieurs équipes sur un même cluster ?",
  must:[["namespace"],["rbac"],["networkpolicy","reseau"],["quota","resourcequota","limitrange"]],
  explain:"Namespace par équipe + RBAC limité, ResourceQuota et LimitRange, NetworkPolicy default-deny, Pod Security Admission (restricted), politiques d'admission (Kyverno/Gatekeeper) pour imposer labels, images signées et absence de privilèges, node pools dédiés avec taints pour les charges sensibles. Limite honnête : l'isolation reste souple — pour du vrai cloisonnement réglementaire, on sépare les clusters." },

{ id:"n7-k8s-04", lvl:7, dom:"Kubernetes",
  q:"Qu'apporte un service mesh et quel est son coût réel ?",
  accept:["mtls","observabilite","trafic","sidecar","latence","complexite"],
  explain:"Apports : mTLS automatique entre services, routage fin (canary, mirroring), retries/timeouts/circuit breakers hors du code, métriques et traces uniformes. Coût : un sidecar par Pod (CPU, mémoire, latence de quelques ms), une couche de plus à opérer et déboguer, une courbe d'apprentissage réelle. À justifier par un besoin (zero trust, canaries fins), pas par la mode ; les modes ambient/eBPF réduisent le surcoût." },

{ id:"n7-tf-01", lvl:7, dom:"Terraform",
  q:"Comment découpes-tu tes states Terraform sur une plateforme d'entreprise, et pourquoi ?",
  must:[["par cycle de vie","par domaine","par environnement","blast radius","rayon"]],
  explain:"On découpe par RAYON D'IMPACT et par cycle de vie : réseau/landing zone (change rarement, très critique) / plateforme partagée (cluster, registry) / applications (change souvent). Plus un environnement par state. Bénéfices : plan rapide, erreur circonscrite, droits séparés par équipe, verrous indépendants. Le coût : des contrats explicites entre states (paramètres publiés, pas de lecture croisée)." },

{ id:"n7-tf-02", lvl:7, dom:"Terraform",
  q:"Décris un pipeline Terraform d'entreprise, de la PR à la prod.",
  must:[["plan","pr"],["approbation","validation","review"],["apply"]],
  explain:"PR → <code>fmt</code>/<code>validate</code>/<code>tflint</code> → scan de conformité (tfsec/Checkov/OPA) → <code>plan</code> publié en commentaire de PR → revue humaine (2 yeux minimum en prod) → merge → <code>apply</code> du plan SAUVEGARDÉ (pas un replan) → tests de smoke → notification. Identité du pipeline par OIDC, aucun credential statique, environnements protégés avec approbation manuelle sur la prod, et détection de drift planifiée." },

{ id:"n7-tf-03", lvl:7, dom:"Terraform",
  q:"Terraform ou Bicep/ARM/CloudFormation pour un client mono-cloud ? Argumente les deux côtés.",
  accept:["natif","multi cloud","state","ecosysteme","support day 0"],
  explain:"Natif (Bicep/CFN) : pas de state à gérer, support des nouveautés dès le jour 1, intégration native au support de l'éditeur, drift géré par la plateforme. Terraform : langage unique quel que soit le fournisseur, écosystème de modules et d'outils, gestion des ressources hors cloud (DNS, GitHub, Vault, Datadog), compétences transférables. En banque multi-cloud, Terraform gagne surtout par l'homogénéité des pratiques." },

{ id:"n7-aws-01", lvl:7, dom:"AWS",
  q:"Conçois une architecture web 3-tiers hautement disponible sur AWS. Cite les composants et où ils vivent.",
  must:[["multi az","plusieurs az","az"],["alb","load balancer"],["rds","base","multi-az"]],
  explain:"Route 53 → CloudFront (+ WAF) → ALB dans les subnets publics de 2-3 AZ → ASG d'instances (ou ECS/EKS) dans les subnets privés → RDS Multi-AZ dans les subnets base de données, avec réplicas en lecture. Sortie via NAT Gateway par AZ. Secrets dans Secrets Manager, statique sur S3, sauvegardes automatiques, alarmes CloudWatch, et tout décrit en IaC." },

{ id:"n7-aws-02", lvl:7, dom:"AWS",
  q:"Quelle stratégie multi-compte recommandes-tu et pourquoi ?",
  must:[["organizations","landing zone","control tower"],["scp","isolation","separation"]],
  explain:"AWS Organizations avec des OU par usage (Sécurité, Infrastructure, Workloads Prod, Workloads Non-Prod, Bac à sable), un compte par application ET par environnement. Bénéfices : isolation dure du rayon d'impact et des quotas, facturation par équipe, SCP différenciées par OU. Comptes centraux : log archive, audit/sécurité, réseau. Control Tower / Landing Zone Accelerator pour industrialiser." },

{ id:"n7-aws-03", lvl:7, dom:"AWS",
  q:"Comment optimises-tu sérieusement une facture AWS ? Cite au moins cinq leviers classés par impact.",
  must:[["savings plan","reserved","engagement"],["rightsizing","dimensionnement"],["arret","eteindre","planification"]],
  explain:"1) Rightsizing (les instances sont surdimensionnées par défaut). 2) Savings Plans / Reserved Instances sur la base stable (jusqu'à -70 %). 3) Extinction planifiée des environnements hors production. 4) Spot pour les charges tolérantes aux interruptions. 5) Cycle de vie du stockage (S3 tiering, suppression des snapshots et volumes orphelins). 6) Transfert de données : éviter l'inter-AZ inutile, revoir NAT Gateway et CloudFront. 7) Rétention des logs. Prérequis : tagging obligatoire pour attribuer les coûts." },

{ id:"n7-az-01", lvl:7, dom:"Azure",
  q:"Qu'est-ce qu'une landing zone Azure et que contient-elle ?",
  must:[["management group","hierarchie"],["policy","gouvernance"],["reseau","hub","connectivite"]],
  explain:"Le socle de gouvernance déployé avant les applications : hiérarchie de management groups, subscriptions par usage (identité, connectivité, management, landing zones prod/non-prod), Azure Policy et initiatives de conformité, RBAC et PIM, réseau hub-and-spoke avec firewall et DNS privé, journalisation centralisée dans un workspace Log Analytics, et sauvegarde/DR. Le tout en IaC (CAF/ALZ Terraform ou Bicep)." },

{ id:"n7-az-02", lvl:7, dom:"Azure",
  q:"AKS, App Service ou Container Apps : comment choisis-tu ?",
  accept:["controle","complexite","serverless","charge de travail","equipe"],
  explain:"App Service : application web classique, peu d'ops, déploiement simple, slots — le défaut raisonnable. Container Apps : microservices conteneurisés, scale-to-zero, KEDA, Dapr, sans gérer de cluster. AKS : besoin de contrôle fin (opérateurs, CRD, service mesh, réseau, multi-tenant), équipe capable d'opérer un cluster. Critère décisif : la maturité et la taille de l'équipe, pas la technologie." },

{ id:"n7-az-03", lvl:7, dom:"Azure",
  q:"Comment garantis-tu la conformité continue d'un parc Azure de 200 abonnements ?",
  must:[["azure policy","initiative"],["remediation","deployifnotexists","audit"]],
  explain:"Initiatives Azure Policy assignées au niveau management group (deny sur les régions non autorisées, deny sur IP publique, audit du chiffrement, deployIfNotExists pour les diagnostic settings), remédiation automatique sur l'existant, tableau de bord de conformité, Defender for Cloud avec un score de sécurité suivi, et blueprints/IaC pour tout nouveau compte. Les exceptions passent par une exemption tracée et datée, jamais par une désactivation." },

{ id:"n7-cicd-01", lvl:7, dom:"CI/CD",
  q:"Comment conçois-tu un pipeline pour 50 microservices sans dupliquer 50 fois le même YAML ?",
  accept:["template","pipeline reutilisable","workflow reutilisable","bibliotheque partagee","versionne"],
  explain:"Des templates/workflows réutilisables versionnés dans un dépôt central (GitLab <code>include</code>, GitHub reusable workflows, Azure DevOps templates, Jenkins shared library), paramétrés par service. Chaque dépôt applicatif ne contient qu'une dizaine de lignes. Points d'attention : versionner les templates (jamais <code>@main</code> en prod), tester leurs évolutions, et garder une porte de sortie pour les cas particuliers." },

{ id:"n7-cicd-02", lvl:7, dom:"CI/CD",
  q:"Quelles sont les quatre métriques DORA et que mesurent-elles ensemble ?",
  must:[["frequence de deploiement","deployment frequency"],["lead time","delai"],["mttr","temps de restauration"],["taux d echec","change failure"]],
  explain:"Fréquence de déploiement, Lead time for changes (du commit à la prod), Change failure rate (% de déploiements causant une dégradation), Time to restore service. Les deux premières mesurent la VITESSE, les deux dernières la STABILITÉ — et le résultat clé de l'étude DORA est qu'elles progressent ENSEMBLE : déployer plus souvent et par petits lots réduit le risque au lieu de l'augmenter. Argument très utile face à une culture bancaire prudente." },

{ id:"n7-cicd-03", lvl:7, dom:"CI/CD",
  q:"Comment gères-tu une release nécessitant la coordination de 5 services interdépendants ?",
  accept:["retrocompatibilite","contrat","versionner l api","feature flag","decoupler"],
  explain:"On refuse le big bang : rétrocompatibilité des contrats d'API (versionner, ne jamais casser un champ existant), tests de contrat (Pact) en CI, déploiement indépendant service par service, et feature flags pour activer la fonctionnalité une fois tous les morceaux en place. Si une coordination stricte reste nécessaire, c'est un signal de couplage à corriger dans l'architecture." },

{ id:"n7-sec-01", lvl:7, dom:"Sécurité",
  q:"Qu'est-ce que le modèle zero trust appliqué à une infrastructure cloud ?",
  must:[["jamais faire confiance","verifier","pas de confiance implicite"],["identite","moindre privilege","mtls","segmentation"]],
  explain:"On abandonne l'idée de réseau interne de confiance : chaque appel est authentifié et autorisé, quelle que soit sa provenance. En pratique : identité forte partout (MFA, identités de charge de travail, mTLS entre services), autorisation contextuelle et moindre privilège, micro-segmentation réseau, chiffrement systématique, journalisation exhaustive et vérification continue de la posture. Le périmètre reste utile en défense en profondeur, mais il n'est plus le contrôle principal." },

{ id:"n7-sec-02", lvl:7, dom:"Sécurité",
  q:"Comment sécurises-tu la chaîne CI/CD elle-même ?",
  must:[["oidc","identite federee","pas de secret statique"],["runner","isolation","ephemere"],["approbation","protection","branche protegee"]],
  explain:"Branches protégées avec revue obligatoire et commits signés, runners éphémères et isolés par niveau de sensibilité, identité fédérée OIDC sans secret longue durée, secrets scopés par environnement avec approbation manuelle en prod, actions/images tierces épinglées par digest, séparation des droits build vs deploy, et journalisation immuable des déploiements. La CI est la cible privilégiée : qui contrôle le pipeline contrôle la prod." },

{ id:"n7-obs-01", lvl:7, dom:"Observabilité",
  q:"Comment instrumentes-tu une architecture microservices pour pouvoir diagnostiquer une requête de bout en bout ?",
  must:[["trace","tracing distribue"],["correlation","trace id","propagation","context"]],
  explain:"OpenTelemetry comme standard d'instrumentation : propagation du contexte (W3C traceparent) à travers tous les appels HTTP/gRPC/messages, trace ID injecté dans TOUS les logs pour la corrélation, spans sur les appels sortants et les requêtes base, exemplars reliant métriques et traces, échantillonnage adaptatif (garder 100 % des erreurs et des requêtes lentes). Sans propagation du contexte, la trace se coupe au premier service non instrumenté." },

{ id:"n7-obs-02", lvl:7, dom:"Observabilité",
  q:"Comment définis-tu une alerte qui mérite de réveiller quelqu'un à 3 h du matin ?",
  must:[["actionnable","action possible"],["impact","utilisateur","urgent"]],
  explain:"Trois critères cumulatifs : impact utilisateur réel et en cours, urgence (attendre le matin aggrave), et ACTION possible par la personne d'astreinte (avec un runbook). Tout le reste va en ticket ou en dashboard. On alerte sur le budget d'erreur qui se consomme trop vite (burn rate multi-fenêtres) plutôt que sur un seuil instantané, et on mesure le taux de faux positifs." },

{ id:"n7-sre-01", lvl:7, dom:"SRE",
  q:"Qu'est-ce que le chaos engineering et comment l'introduis-tu dans une banque ?",
  must:[["hypothese","experience","injecter une panne"],["perimetre","controle","recette","progressif"]],
  explain:"Injecter volontairement des pannes pour VALIDER une hypothèse de résilience (« si une AZ tombe, le service tient »). En banque, on introduit progressivement : d'abord en recette avec un périmètre défini, une hypothèse écrite, un rayon d'impact limité, un bouton d'arrêt et une fenêtre annoncée. On ne passe en production qu'après avoir démontré la valeur et obtenu l'adhésion du risque opérationnel — c'est autant un sujet de gouvernance que technique." },

{ id:"n7-sre-02", lvl:7, dom:"SRE",
  q:"Comment dimensionnes-tu une capacité pour un pic connu (clôture mensuelle, Black Friday) ?",
  must:[["test de charge","load test","benchmark"],["marge","headroom","autoscaling"]],
  explain:"1) Mesurer le point de rupture par un test de charge représentatif (pas un ping). 2) Identifier le facteur limitant réel (souvent la base ou un pool de connexions, pas le CPU applicatif). 3) Extrapoler le pic attendu avec une marge (x2 typique). 4) Pré-scaler avant le pic plutôt que compter sur un autoscaling réactif qui arrive trop tard. 5) Prévoir la dégradation gracieuse (file d'attente, fonctionnalités secondaires coupées) et un plan de repli." },

{ id:"n7-res-01", lvl:7, dom:"Réseau",
  q:"Comment connectes-tu un datacenter on-premise à Azure et AWS de façon fiable ?",
  must:[["expressroute","direct connect"],["vpn","redondance","secours"]],
  explain:"Lien privé dédié (ExpressRoute côté Azure, Direct Connect côté AWS) pour la latence et la bande passante garanties, avec un VPN IPsec site-to-site en secours automatique par BGP. Redondance : deux circuits sur des points de présence distincts et si possible deux opérateurs. Attention aux chevauchements de plans d'adressage, à la propagation BGP et au routage asymétrique — c'est là que ça casse en pratique." },

{ id:"n7-sql-01", lvl:7, dom:"SQL",
  q:"Quand choisis-tu une base NoSQL plutôt que relationnelle ? Justifie sans clichés.",
  accept:["modele d acces","cle","echelle horizontale","schema flexible","jointure"],
  explain:"On choisit selon le MODÈLE D'ACCÈS, pas selon la mode. NoSQL clé-valeur/document (DynamoDB, Cosmos) quand les accès sont connus à l'avance, par clé, avec un besoin d'échelle horizontale massive et de latence constante. Relationnel quand on a des relations riches, des requêtes ad hoc, de l'intégrité transactionnelle forte et des besoins analytiques. En banque, le relationnel reste dominant : la cohérence et l'auditabilité priment." },

{ id:"n7-sql-02", lvl:7, dom:"SQL",
  q:"Explique le théorème CAP et ce qu'il implique concrètement lors d'une partition réseau.",
  must:[["coherence","consistency"],["disponibilite","availability"],["partition"]],
  explain:"En cas de PARTITION réseau (qui n'est pas optionnelle en distribué), il faut choisir : rester cohérent en refusant de répondre (CP — la base refuse les écritures du côté minoritaire), ou rester disponible en acceptant des réponses potentiellement périmées (AP). Concrètement : pour un solde de compte on prend CP, pour un catalogue produit on prend AP. Hors partition, on peut avoir les deux — d'où le modèle PACELC, plus honnête." },

{ id:"n7-arch-02", lvl:7, dom:"SRE",
  q:"Microservices ou monolithe pour une nouvelle application ? Ta réponse en entretien.",
  accept:["monolithe modulaire","commencer simple","cout organisationnel","conway","depend de l equipe"],
  explain:"Réponse défendable : commencer par un monolithe MODULAIRE bien découpé et n'extraire des services que quand un besoin réel apparaît (équipes indépendantes, scaling différencié, cycles de release divergents). Les microservices déplacent la complexité du code vers le réseau et l'exploitation : latence, cohérence distribuée, observabilité, coût. Loi de Conway : l'architecture reflétera l'organisation — c'est elle qui doit décider, pas l'inverse." }

]);

</script>

/* ============ NIVEAU 7 — SÉRIE B ============ */

{ id:"b7-arch-01", lvl:7, dom:"SRE",
  q:"Conçois une architecture d'ingestion de 500 000 événements par minute. Quels choix structurants ?",
  must:[["file","broker","kafka","queue","tampon"],["partition","scale","parallele","consommateur"]],
  explain:"Un broker en tampon (Kafka, Event Hubs, Kinesis) pour découpler production et consommation et absorber les pics, partitionné sur une clé qui répartit uniformément et préserve l'ordre là où c'est nécessaire. Consommateurs scalables horizontalement (un par partition au maximum), traitement idempotent avec gestion des rejeux, DLQ pour les messages empoisonnés, et stockage cible adapté (colonne/objet, pas une base transactionnelle). Points d'attention : rétention, back-pressure, et coût du transfert." },

{ id:"b7-arch-02", lvl:7, dom:"SRE",
  q:"Quelle différence entre une architecture pilotée par les événements et un appel synchrone ? Quand choisis-tu quoi ?",
  must:[["couplage","decouple","asynchrone"],["reponse immediate","synchrone","coherence"]],
  explain:"Synchrone : simple, réponse immédiate, mais couplage temporel — si le service appelé est lent ou mort, l'appelant l'est aussi. Événementiel : découplage, absorption des pics, plusieurs consommateurs, mais cohérence à terme, ordre à gérer, débogage plus difficile. On prend le synchrone quand l'utilisateur attend une réponse (autorisation de paiement), l'événementiel pour la propagation (notification, mise à jour d'un référentiel, analytique)." },

{ id:"b7-k8s-01", lvl:7, dom:"Kubernetes",
  q:"Comment dimensionnes-tu un cluster Kubernetes : peu de gros nœuds ou beaucoup de petits ?",
  accept:["granularite","rayon d impact","surcout","bin packing","depend"],
  explain:"Gros nœuds : meilleur remplissage (bin packing), moins de surcoût système par nœud, meilleur pour les Pods gourmands — mais rayon d'impact élevé à la perte d'un nœud et scaling par gros incréments. Petits nœuds : granularité fine, impact réduit, mais surcoût système et limite de Pods par nœud. Compromis usuel : nœuds moyens, plusieurs node pools par profil de charge, et au moins 3 nœuds répartis sur les zones." },

{ id:"b7-k8s-02", lvl:7, dom:"Kubernetes",
  q:"Un cluster ou plusieurs clusters ? Sur quels critères tranches-tu ?",
  must:[["isolation","conformite","rayon d impact"],["cout","complexite","operation"]],
  explain:"Plusieurs clusters quand : exigence d'isolation réglementaire, séparation prod / non-prod, régions distinctes, cycles d'upgrade indépendants, ou rayon d'impact inacceptable. Un cluster mutualisé quand : coût et charge opérationnelle priment, avec namespaces + RBAC + quotas + NetworkPolicy. En banque, la séparation prod / hors-prod par cluster est quasi systématique ; le multi-tenant fin se fait par namespace à l'intérieur." },

{ id:"b7-k8s-03", lvl:7, dom:"Kubernetes",
  q:"Comment gères-tu la configuration de 15 applications sur 4 environnements sans duplication ?",
  accept:["helm values","kustomize overlay","base commune","surcharge","hierarchie"],
  explain:"Une base commune + des surcharges par environnement : Kustomize (base + overlays, patches déclaratifs) ou Helm (un chart, des <code>values-{env}.yaml</code>). La règle : ne surcharger que ce qui DIFFÈRE réellement (réplicas, ressources, endpoints, noms de secrets) — si l'overlay redéfinit tout, la base ne sert à rien. Et versionner le chart/la base comme un contrat entre plateforme et applications." },

{ id:"b7-tf-01", lvl:7, dom:"Terraform",
  q:"Comment organises-tu un dépôt de modules Terraform partagé entre 10 équipes ?",
  must:[["version","tag","semver"],["documentation","exemple","readme","test"]],
  explain:"Un dépôt (ou un registry interne) avec un module par domaine, versionnement sémantique par tags immuables, README avec entrées/sorties et exemples exécutables, tests automatisés (<code>terraform test</code>/Terratest), changelog et politique de dépréciation (N-1 supporté, préavis annoncé). Les consommateurs épinglent une version. Le pire scénario : des modules consommés sur <code>main</code> — un changement casse dix équipes en même temps." },

{ id:"b7-tf-02", lvl:7, dom:"Terraform",
  q:"Une équipe applique du Terraform depuis les postes de travail. Quels risques et quel chemin de sortie ?",
  must:[["credentials","droits personnels","tracabilite"],["pipeline","ci","apply centralise"]],
  explain:"Risques : credentials personnels à privilèges élevés sur les postes, aucune traçabilité de qui a appliqué quoi, versions d'outils divergentes, verrous mal gérés, code non revu. Chemin de sortie progressif : d'abord state distant + verrouillage, puis plan obligatoire en PR, puis apply uniquement depuis le pipeline avec une identité fédérée, et enfin retrait des droits d'écriture humains en production." },

{ id:"b7-aws-01", lvl:7, dom:"AWS",
  q:"Comment conçois-tu une architecture multi-région active/passive sur AWS ? Cite les points durs.",
  must:[["donnees","replication","base"],["dns","bascule","route 53","failover"]],
  explain:"Réplication des données (Aurora Global Database, réplication S3 cross-région, backups répliqués), infrastructure décrite en IaC et déployée dans les deux régions, bascule DNS par Route 53 avec health checks. Points durs : la réplication de base est ASYNCHRONE (donc RPO > 0), les quotas de la région de secours, les secrets et clés KMS régionaux, les dépendances qui n'existent que dans la région primaire, et surtout le TEST réel de bascule — sinon on ne sait pas si ça marche." },

{ id:"b7-aws-02", lvl:7, dom:"AWS",
  q:"Comment réduis-tu la facture de transfert de données sur AWS ? Où se cachent les coûts ?",
  accept:["inter-az","nat gateway","sortie internet","cloudfront","endpoints"],
  explain:"Les coûts cachés : trafic inter-AZ (facturé dans les deux sens — un service qui appelle systématiquement une autre AZ coûte cher), NAT Gateway facturé au Go traité, sortie internet, réplication cross-région. Leviers : topology aware routing / zone affinity, VPC endpoints pour S3 et DynamoDB (gratuits en gateway), CloudFront devant les gros volumes sortants, compression, et regroupement des composants bavards dans la même AZ quand la HA le permet." },

{ id:"b7-aws-03", lvl:7, dom:"AWS",
  q:"Comment structures-tu la journalisation et la détection de sécurité sur une organisation AWS ?",
  must:[["cloudtrail","organisation","trail"],["compte de log","centralise","immuable"]],
  explain:"CloudTrail organisationnel vers un bucket dans un compte Log Archive dédié, en écriture seule pour les producteurs, avec Object Lock et chiffrement KMS. VPC Flow Logs et logs applicatifs agrégés au même endroit. GuardDuty, Security Hub et Config activés par l'organisation avec un administrateur délégué dans un compte Security. SCP interdisant la désactivation. Export vers le SIEM. Le principe : les traces doivent survivre à la compromission du compte qu'elles observent." },

{ id:"b7-az-01", lvl:7, dom:"Azure",
  q:"Comment garantis-tu que 200 subscriptions respectent les mêmes règles réseau ?",
  must:[["policy","initiative","management group"],["deny","remediation","audit"]],
  explain:"Initiatives Azure Policy assignées au niveau management group : deny des IP publiques sur les NIC, deny des NSG sans règles obligatoires, deny hors régions autorisées, deployIfNotExists pour associer les UDR et les diagnostic settings. Complété par une landing zone qui provisionne le réseau du spoke automatiquement (pas de VNet créé à la main), et un tableau de bord de conformité suivi avec les exemptions datées." },

{ id:"b7-az-02", lvl:7, dom:"Azure",
  q:"Comment conçois-tu la reprise d'activité d'une application Azure critique ?",
  must:[["region appairee","secondaire","autre region"],["rto","rpo","test"]],
  explain:"Partir du RTO/RPO négociés. Puis : données répliquées (geo-redundant storage, failover group Azure SQL, Cosmos multi-région), infrastructure décrite en IaC redéployable dans la région secondaire, Front Door ou Traffic Manager pour la bascule, secrets et clés répliqués (Key Vault dans les deux régions), quotas demandés à l'avance. Et un exercice de bascule réel, chronométré, au moins une fois par an — c'est ce que demandera l'auditeur." },

{ id:"b7-cicd-01", lvl:7, dom:"CI/CD",
  q:"Comment fais-tu cohabiter une équipe qui livre 10 fois par jour et une qui livre une fois par mois ?",
  accept:["autonomie","contrat d api","decouplage","plateforme","standards communs"],
  explain:"On ne les aligne pas sur le même rythme : on les DÉCOUPLE. Contrats d'API versionnés et rétrocompatibles, tests de contrat automatisés, déploiements indépendants, feature flags. La plateforme fournit un socle commun (pipeline, observabilité, sécurité) mais chaque équipe garde la main sur sa cadence. Forcer un rythme commun ramène au train de release, c'est-à-dire au plus lent." },

{ id:"b7-cicd-02", lvl:7, dom:"CI/CD",
  q:"Comment mesures-tu et améliores-tu le lead time d'un pipeline de 45 minutes ?",
  accept:["decomposer","paralleliser","cache","tests","chemin critique"],
  explain:"D'abord MESURER par étape pour trouver le chemin critique — l'intuition se trompe souvent. Ensuite : paralléliser en DAG, mettre en cache dépendances et couches, découper les tests (unitaires bloquants, intégration en parallèle, e2e en aval), ne rebuild que ce qui a changé sur un monorepo, dimensionner les runners, supprimer les étapes redondantes. Objectif : feedback utile en moins de 10 minutes sur une PR." },

{ id:"b7-sec-01", lvl:7, dom:"Sécurité",
  q:"Comment mets-tu en place une PKI interne pour du mTLS entre services ?",
  accept:["ca interne","cert-manager","rotation courte","automatique","service mesh"],
  explain:"Une CA racine hors ligne, des CA intermédiaires par environnement, et une émission AUTOMATISÉE de certificats à courte durée de vie (heures/jours) : cert-manager avec un issuer Vault ou une CA d'entreprise, ou la CA intégrée d'un service mesh. Le point critique n'est pas d'émettre mais de RENOUVELER sans intervention — un certificat manuel d'un an est une panne programmée. Prévoir aussi la révocation et la rotation de la CA." },

{ id:"b7-sec-02", lvl:7, dom:"Sécurité",
  q:"Une équipe veut exposer une API à un partenaire externe. Quelles couches de sécurité mets-tu ?",
  must:[["authentification","mtls","oauth","token"],["limitation","rate limit","quota","waf"]],
  explain:"Passerelle d'API en frontal : authentification forte (mTLS et/ou OAuth client credentials avec scopes), autorisation fine par scope, rate limiting et quotas par client, WAF et validation stricte des schémas, allowlist d'IP si le partenaire est fixe, journalisation complète et corrélation, chiffrement en transit, et versionnement du contrat. Côté organisation : convention de service, procédure d'onboarding et de révocation, et environnement de bac à sable pour le partenaire." },

{ id:"b7-obs-01", lvl:7, dom:"Observabilité",
  q:"Comment conçois-tu l'observabilité d'une plateforme utilisée par 20 équipes ?",
  must:[["standard","convention","socle commun","automatique"],["autonomie","dashboard","par equipe"]],
  explain:"La plateforme fournit le socle par défaut : collecte automatique (agents, sidecars, auto-instrumentation), conventions de nommage et de labels imposées, dashboards et alertes générés pour chaque service à sa création, quotas de cardinalité et de rétention. Les équipes gardent l'autonomie sur leurs métriques métier et leurs SLO. Le principe : l'observabilité doit être un défaut, pas un projet à mener par chaque équipe." },

{ id:"b7-obs-02", lvl:7, dom:"Observabilité",
  q:"Comment justifies-tu le choix entre une solution éditeur (Datadog, Dynatrace) et une stack open source ?",
  must:[["cout","licence","volume"],["charge operationnelle","competence","a operer"]],
  explain:"Éditeur : mise en route rapide, corrélation intégrée, support, mais coût qui croît avec le volume et l'ingestion, et un verrouillage réel. Open source (Prometheus, Grafana, Loki, Tempo) : coût maîtrisable et contrôle total, mais c'est une plateforme à opérer en haute disponibilité avec la compétence associée. Point de sortie commun : instrumenter en OpenTelemetry pour pouvoir changer d'avis sans réinstrumenter 200 services." },

{ id:"b7-sre-01", lvl:7, dom:"SRE",
  q:"Comment définis-tu la frontière entre une équipe plateforme et les équipes produit ?",
  accept:["produit interne","self-service","pave route","autonomie","responsabilite"],
  explain:"La plateforme est un PRODUIT interne : elle fournit des chemins pavés (golden paths) en self-service — pipeline, socle K8s, observabilité, sécurité par défaut — avec une documentation et un support. Les équipes produit gardent la responsabilité de leur service en production. L'anti-pattern : une plateforme qui devient un guichet de tickets, ce qui recrée l'ancien mur entre dev et ops sous un nouveau nom." },

{ id:"b7-sre-02", lvl:7, dom:"SRE",
  q:"Comment traites-tu une dépendance externe (SaaS, API partenaire) qui n'a pas le niveau de service attendu ?",
  must:[["circuit breaker","timeout","degradation","cache"],["contrat","sla","escalade","alternative"]],
  explain:"Techniquement : timeouts stricts, circuit breaker, cache ou valeur de repli, dégradation gracieuse, file d'attente pour le différé, et surveillance dédiée de CETTE dépendance avec son propre SLO observé. Contractuellement : SLA, pénalités, escalade, et — exigence DORA en banque — une stratégie de sortie et si possible un fournisseur alternatif. Ton SLO ne peut pas dépasser celui de ta dépendance sur le chemin critique." },

{ id:"b7-sql-01", lvl:7, dom:"SQL",
  q:"Comment conçois-tu la stratégie de sauvegarde d'une base bancaire critique ?",
  must:[["pitr","point in time","logs de transaction"],["test de restauration","teste","exercice"],["immuable","isole","hors ligne"]],
  explain:"Sauvegardes complètes régulières + journaux de transactions continus pour un PITR fin, rétention alignée sur les obligations réglementaires (souvent plusieurs années pour certaines données), copies isolées et immuables hors du périmètre de production (anti-ransomware), chiffrement avec des clés dont la restauration est elle-même testée, et exercices de restauration chronométrés documentés. Le RPO annoncé n'a de valeur que s'il a été démontré." },

{ id:"b7-sql-02", lvl:7, dom:"SQL",
  q:"Comment gères-tu l'anonymisation des données de production pour les environnements de test ?",
  must:[["anonymiser","pseudonymiser","masquer"],["coherence","referentiel","format","utilisable"]],
  explain:"Masquage ou substitution des données personnelles avec préservation du FORMAT et de la COHÉRENCE référentielle (même client → même pseudonyme partout, IBAN valide mais fictif), sinon les tests ne valent rien. Attention à la ré-identification par croisement, aux données dans les logs et les fichiers joints. Alternative : générer des jeux synthétiques. C'est une exigence RGPD, pas une bonne pratique optionnelle." },

{ id:"b7-linux-01", lvl:7, dom:"Linux",
  q:"Comment construis-tu et maintiens-tu une image de VM durcie (golden image) ?",
  accept:["packer","pipeline","cis","reconstruire","versionner"],
  explain:"Un pipeline qui construit l'image (Packer) à partir d'une base officielle, applique le durcissement (benchmarks CIS), installe les agents obligatoires, scanne le résultat, la teste puis la publie versionnée. On la RECONSTRUIT régulièrement (mensuellement, ou dès une CVE critique) au lieu de patcher en place — infrastructure immuable. Et on force l'expiration des anciennes versions pour éviter qu'un parc entier reste sur une image de l'an dernier." },

{ id:"b7-res-01", lvl:7, dom:"Réseau",
  q:"Comment conçois-tu le plan d'adressage IP d'une entreprise qui démarre sur le cloud ?",
  must:[["pas de chevauchement","overlap","on-premise"],["reserve","croissance","allouer"]],
  explain:"On part d'une allocation centrale documentée (IPAM) : plages distinctes par cloud, par région et par environnement, sans aucun chevauchement avec l'on-premise ni avec les partenaires (les fusions-acquisitions font mal). On réserve large — le CIDR d'un VNet/VPC ne se réduit pas et un subnet AKS sous-dimensionné bloque la croissance. Et on prévoit les plages spécifiques (Pods, services, endpoints privés, gateways)." },

{ id:"b7-docker-01", lvl:7, dom:"Docker",
  q:"Comment industrialises-tu la gestion des images de base dans une grande entreprise ?",
  must:[["images approuvees","catalogue","base interne"],["reconstruction","scan","mise a jour"]],
  explain:"Un catalogue d'images de base internes, dérivées d'images officielles, durcies, scannées et signées, republiées automatiquement à chaque correctif de sécurité. Les équipes ne peuvent tirer que depuis le registry interne (blocage réseau + politique d'admission). Un mécanisme de rebuild automatique des images applicatives quand la base change, et un tableau de bord d'obsolescence pour identifier qui tourne encore sur une base ancienne." }

]);

/* ================= NIVEAU 8 — INTERNES & CAS LIMITES ================= */

{ id:"n8-k8s-01", lvl:8, dom:"Kubernetes",
  q:"Comment kube-proxy implémente-t-il un Service, et quelle limite a le mode iptables ?",
  accept:["iptables","ipvs","regles","lineaire","performance"],
  explain:"kube-proxy programme des règles de redirection depuis l'IP virtuelle du Service vers les IP des Pods. En mode iptables, les règles sont évaluées de façon quasi linéaire : au-delà de quelques milliers de Services, le temps de mise à jour et de traversée devient un problème. Le mode IPVS utilise des tables de hachage (O(1)) et de vrais algorithmes de répartition. Cilium peut remplacer kube-proxy par de l'eBPF." },

{ id:"n8-k8s-02", lvl:8, dom:"Kubernetes",
  q:"Que se passe-t-il si etcd perd le quorum ? Le cluster continue-t-il à servir le trafic ?",
  accept:["lecture seule","plus d ecriture","raft","majorite","le trafic continue"],
  explain:"etcd utilise Raft : sans majorité (2/3, 3/5), plus aucune ÉCRITURE n'est possible, l'API server ne peut plus modifier l'état, donc plus de déploiements ni de reprogrammation de Pods. En revanche le trafic existant continue de fonctionner : kube-proxy et les Pods déjà en place tournent. C'est une panne du plan de CONTRÔLE, pas du plan de DONNÉES — distinction attendue en entretien senior." },

{ id:"n8-k8s-03", lvl:8, dom:"Kubernetes",
  q:"Quelle est la différence entre un mutating et un validating admission webhook, et dans quel ordre s'exécutent-ils ?",
  accept:["mutating avant","modifie","valide","rejette","schema entre les deux"],
  explain:"Les mutating webhooks s'exécutent D'ABORD et peuvent modifier l'objet (injection de sidecar, ajout de labels, valeurs par défaut). Le schéma OpenAPI est validé ensuite, puis les validating webhooks acceptent ou rejettent sans modifier. Ordre logique : on ne valide qu'après toutes les mutations. Piège d'exploitation : un webhook en <code>failurePolicy: Fail</code> et indisponible bloque tout le cluster." },

{ id:"n8-k8s-04", lvl:8, dom:"Kubernetes",
  q:"Explique le pattern controller / boucle de réconciliation. Pourquoi les contrôleurs sont-ils idempotents ?",
  accept:["etat desire","etat observe","watch","reconcilie","niveau","level triggered"],
  explain:"Un contrôleur observe l'état désiré (spec) et l'état observé (status) et agit pour réduire l'écart, en boucle. Il est <em>level-triggered</em> et non <em>edge-triggered</em> : il ne réagit pas à un événement ponctuel mais au niveau courant, donc il doit être idempotent — rejouer la réconciliation ne doit rien casser. C'est ce qui rend le système auto-réparant même après une perte d'événements." },

{ id:"n8-k8s-05", lvl:8, dom:"Kubernetes",
  q:"Qu'est-ce qu'une CRD et un opérateur ? Quand écris-tu un opérateur plutôt qu'un Helm chart ?",
  accept:["extension de l api","controleur dedie","logique metier","day 2","reconciliation continue"],
  explain:"Une CRD ajoute un type d'objet à l'API Kubernetes ; un opérateur est le contrôleur qui l'implémente, encodant la connaissance opérationnelle (sauvegarde, bascule, upgrade de version, resharding). Helm ne fait que rendre un template au moment de l'installation : il ne gère pas le jour 2. On écrit un opérateur quand il y a une logique CONTINUE à appliquer, pas juste des manifestes paramétrés." },

{ id:"n8-k8s-06", lvl:8, dom:"Kubernetes",
  q:"Un Pod avec un PVC ReadWriteOnce ne redémarre pas sur un autre nœud. Explique le mécanisme.",
  accept:["volume attache","detachement","multi-attach","un seul noeud","node affinity"],
  explain:"Un disque bloc (EBS, Azure Disk) ne peut être attaché qu'à un nœud à la fois. Tant que l'ancien nœud n'a pas relâché le volume — ou tant que le contrôleur ne peut pas confirmer que l'ancien Pod est mort (nœud injoignable) — le nouveau Pod reste en <code>Pending</code> avec une erreur Multi-Attach. C'est une protection contre la double écriture. Un forçage prématuré risque de corrompre le système de fichiers." },

{ id:"n8-linux-01", lvl:8, dom:"Linux",
  q:"Explique ce que fait <code>fork()</code> + <code>exec()</code> et le rôle du copy-on-write.",
  accept:["duplique le processus","remplace l image","copy on write","pas de copie immediate"],
  explain:"<code>fork()</code> duplique le processus courant (même espace mémoire, marqué copy-on-write : rien n'est réellement copié tant qu'on n'écrit pas). <code>exec()</code> remplace l'image du processus enfant par un autre programme. C'est ce que fait un shell à chaque commande. Le COW explique pourquoi forker un process de 8 Go est instantané et peu coûteux tant que l'enfant n'écrit pas." },

{ id:"n8-linux-02", lvl:8, dom:"Linux",
  q:"Qu'est-ce qu'un processus zombie et un processus orphelin ? Comment un zombie disparaît-il ?",
  accept:["wait","code de retour","parent","init","reaper","adopte par pid 1"],
  explain:"Un zombie a terminé mais son parent n'a pas lu son code de retour avec <code>wait()</code> : l'entrée reste dans la table des processus. Il disparaît quand le parent fait le <code>wait</code> — ou quand le parent meurt et que PID 1 l'adopte et le récolte. Un orphelin est un processus dont le parent est mort ; il est adopté par PID 1. Dans un conteneur, si PID 1 ne récolte pas, les zombies s'accumulent : d'où <code>tini</code> / <code>--init</code>." },

{ id:"n8-linux-03", lvl:8, dom:"Linux",
  q:"Que fait le noyau quand la mémoire manque ? Explique le rôle de l'OOM score et de l'overcommit.",
  accept:["oom killer","score","overcommit","tue le processus","badness"],
  explain:"Linux fait de l'overcommit : il accorde plus de mémoire virtuelle que de RAM+swap, en pariant que tout ne sera pas utilisé. Quand la RAM réelle manque, l'OOM killer choisit une victime selon un score (proportionnel à la mémoire consommée, ajustable par <code>oom_score_adj</code>) et la tue. Dans un conteneur, la limite du cgroup déclenche un OOM local qui tue le processus du cgroup, sans toucher l'hôte." },

{ id:"n8-linux-04", lvl:8, dom:"Linux",
  q:"Différence entre mémoire RSS, virtuelle et le working set d'un conteneur ?",
  accept:["rss physique","virtuelle reservee","working set","page cache"],
  explain:"VSZ/virtuelle = espace d'adressage réservé, souvent énorme et peu significatif. RSS = pages réellement en RAM, mais elle inclut des pages partagées et exclut le page cache. Le <em>working set</em> (métrique utilisée par Kubernetes pour l'OOM et le HPA) = usage courant moins le page cache récupérable. Un candidat qui confond les trois se fait piéger sur le dimensionnement des limites mémoire." },

{ id:"n8-tf-01", lvl:8, dom:"Terraform",
  q:"Explique le cycle de vie complet d'un provider Terraform : que se passe-t-il entre le plan et l'apply ?",
  accept:["grpc","plugin","readresource","planresourcechange","applyresourcechange"],
  explain:"Le provider est un binaire séparé, lancé par Terraform Core et piloté en gRPC. Au refresh, Core appelle <code>ReadResource</code> pour rafraîchir l'état réel ; au plan, <code>PlanResourceChange</code> où le provider annonce ce qu'il fera et quels attributs sont <em>known after apply</em> ; à l'apply, <code>ApplyResourceChange</code> exécute réellement les appels API. Comprendre ça explique les valeurs inconnues au plan et les diffs perpétuels." },

{ id:"n8-tf-02", lvl:8, dom:"Terraform",
  q:"Qu'est-ce qu'un « diff perpétuel » et comment le résous-tu proprement ?",
  accept:["difference a chaque plan","normalisation","api renvoie autre chose","ignore_changes","bug du provider"],
  explain:"À chaque plan, Terraform veut modifier un attribut déjà correct : l'API renvoie une valeur normalisée différente de celle écrite (casse, ordre d'une liste, JSON reformaté, valeur par défaut ajoutée côté cloud). Solutions par ordre de préférence : écrire la valeur sous la forme canonique renvoyée par l'API, utiliser <code>jsonencode</code>/tri déterministe, sinon <code>ignore_changes</code> ciblé — et remonter le bug au provider." },

{ id:"n8-tf-03", lvl:8, dom:"Terraform",
  q:"Pourquoi une valeur <code>known after apply</code> peut-elle rendre un plan inutilisable, et comment contourner ?",
  accept:["inconnue au plan","count","for_each","cascade","valeur non determinee"],
  explain:"Terraform ne peut pas construire le graphe si un <code>count</code> ou une clé de <code>for_each</code> dépend d'une valeur inconnue avant l'apply — il refuse le plan. Contournements : dériver la clé d'une valeur STATIQUE connue (nom, variable) plutôt que d'un attribut calculé, ou découper l'apply en deux étapes (<code>-target</code> en dépannage, ou deux states avec un contrat explicite entre eux)." },

{ id:"n8-tf-04", lvl:8, dom:"Terraform",
  q:"Que fait <code>terraform apply -target</code> et pourquoi HashiCorp le déconseille en usage courant ?",
  accept:["limite le graphe","partiel","etat incoherent","depannage","contourne les dependances"],
  explain:"Il limite l'apply à une ressource et ses dépendances, en ignorant le reste du graphe. Résultat : le state peut devenir partiellement cohérent et masquer une dérive qui explosera au prochain apply complet. C'est un outil de DÉPANNAGE (débloquer un cycle, réparer un apply cassé), pas un mode de fonctionnement. Si on en a besoin régulièrement, c'est que le state est mal découpé." },

{ id:"n8-aws-01", lvl:8, dom:"AWS",
  q:"Explique le modèle de cohérence de S3 aujourd'hui et ce qui a changé.",
  accept:["forte coherence","read after write","depuis 2020","strong consistency"],
  explain:"Depuis décembre 2020, S3 offre une cohérence FORTE en lecture après écriture pour les PUT, les overwrites et les DELETE, sur toutes les régions et sans surcoût. Avant, seuls les PUT de nouveaux objets l'étaient ; les overwrites et suppressions étaient à cohérence à terme, ce qui obligeait à des contournements (nommage unique, DynamoDB en index). Attention : le listing reste cohérent mais les métriques et la réplication restent asynchrones." },

{ id:"n8-aws-02", lvl:8, dom:"AWS",
  q:"Comment fonctionne le throttling d'une API AWS et comment un SDK doit-il réagir ?",
  accept:["token bucket","backoff exponentiel","jitter","retry","throttlingexception"],
  explain:"La plupart des API utilisent un seau à jetons (débit soutenu + capacité de burst) et renvoient <code>ThrottlingException</code>/429 au-delà. Le SDK doit faire un retry avec backoff EXPONENTIEL et JITTER, respecter un budget de retry, et idéalement utiliser le mode adaptatif. Les erreurs de throttling doivent être observées comme métrique : elles annoncent une saturation avant l'incident visible." },

{ id:"n8-aws-03", lvl:8, dom:"AWS",
  q:"Explique le fonctionnement des clés KMS : chiffrement par enveloppe et data key.",
  accept:["data key","enveloppe","cmk","chiffre la cle","jamais la donnee"],
  explain:"KMS ne chiffre pas tes données volumineuses : il génère une <em>data key</em> (symétrique), renvoie sa version en clair ET sa version chiffrée par la clé maître. Le service chiffre les données localement avec la clé en clair, la jette de la mémoire et stocke la version chiffrée à côté de la donnée. Au déchiffrement, il redemande à KMS de déchiffrer la data key. Avantages : performance, et la clé maître ne quitte jamais le HSM." },

{ id:"n8-az-01", lvl:8, dom:"Azure",
  q:"Comment fonctionne le throttling ARM et qu'est-ce qu'un « resource provider » ?",
  accept:["limite par abonnement","429","retry-after","microsoft.compute","enregistrement"],
  explain:"Un resource provider est le service qui expose un type de ressource (<code>Microsoft.Compute</code>, <code>Microsoft.Network</code>) et doit être enregistré sur l'abonnement. ARM applique des limites de requêtes par abonnement, par région et par provider ; au dépassement il renvoie 429 avec un en-tête <code>Retry-After</code> qu'il faut respecter. Un Terraform très parallèle sur un gros parc déclenche ce throttling : on réduit le <code>-parallelism</code>." },

{ id:"n8-az-02", lvl:8, dom:"Azure",
  q:"Quelle est la différence entre un soft delete et un purge protection sur Key Vault ? Pourquoi ça pose problème en IaC ?",
  accept:["retention","nom reserve","conflit","purge","recreation impossible"],
  explain:"Le soft delete conserve le coffre (et ses secrets) pendant une période de rétention ; la purge protection interdit la purge anticipée. Conséquence en IaC : après un <code>destroy</code>, le NOM reste réservé — recréer le même coffre échoue en conflit tant que la rétention court. Avec la purge protection, on ne peut même pas forcer. En environnement éphémère, on génère donc des noms uniques." },

{ id:"n8-res-01", lvl:8, dom:"Réseau",
  q:"Qu'est-ce que le conntrack et pourquoi sa saturation provoque-t-elle des pannes bizarres ?",
  accept:["table de suivi de connexion","nf_conntrack_max","paquets droppes","nat","etat"],
  explain:"Netfilter maintient une table des connexions suivies pour le NAT et les règles stateful. Quand <code>nf_conntrack_max</code> est atteint, les nouveaux paquets sont DROPPÉS silencieusement : symptômes erratiques, timeouts intermittents, DNS UDP qui échoue par intermittence, alors que CPU et réseau semblent sains. On le voit dans <code>dmesg</code> (« nf_conntrack: table full ») et on corrige en augmentant la table, réduisant les timeouts ou supprimant le NAT du chemin." },

{ id:"n8-res-02", lvl:8, dom:"Réseau",
  q:"Qu'est-ce que le TCP slow start et l'impact d'un RTT élevé sur le débit ?",
  accept:["fenetre de congestion","augmente progressivement","bandwidth delay product","latence limite le debit"],
  explain:"TCP démarre avec une petite fenêtre de congestion et l'augmente progressivement. Le débit maximal est borné par fenêtre / RTT (bandwidth-delay product) : sur une liaison Paris–Singapour à 200 ms de RTT, une fenêtre de 64 Ko plafonne à ~2,5 Mbit/s quelle que soit la bande passante achetée. D'où l'intérêt des CDN, du keep-alive, de HTTP/2-3 et du réglage des buffers pour les gros transferts longue distance." },

{ id:"n8-sec-01", lvl:8, dom:"Sécurité",
  q:"Explique la différence entre chiffrement symétrique et asymétrique, et pourquoi TLS utilise les deux.",
  accept:["meme cle","paire de cles","performance","echange de cle","lent"],
  explain:"Le symétrique (AES) est rapide mais suppose que les deux parties partagent déjà la clé. L'asymétrique (RSA, ECDSA) résout la distribution et l'authentification mais est bien plus lent. TLS combine : l'asymétrique sert à authentifier le serveur et à établir un secret partagé (ECDHE, qui apporte la forward secrecy), puis tout le trafic est chiffré en symétrique. La forward secrecy garantit qu'une compromission future de la clé privée ne déchiffre pas les sessions passées." },

{ id:"n8-sec-02", lvl:8, dom:"Sécurité",
  q:"Qu'est-ce que la confused deputy problem en IAM cloud, et comment AWS la traite ?",
  accept:["external id","condition","tiers","utilise les droits","sourceaccount"],
  explain:"Un service tiers légitimement autorisé à endosser ton rôle peut être manipulé pour agir sur les ressources d'un AUTRE client : il est le « député confus » qui utilise ses droits pour le mauvais demandeur. AWS traite ça avec l'<code>ExternalId</code> dans la trust policy pour les rôles cross-compte tiers, et les conditions <code>aws:SourceAccount</code> / <code>aws:SourceArn</code> pour les services. Question typique d'un entretien senior en sécurité cloud." },

{ id:"n8-docker-01", lvl:8, dom:"Docker",
  q:"Comment fonctionne le système de couches d'une image et le filesystem overlay ?",
  accept:["overlayfs","lowerdir","upperdir","copy on write","couches empilees"],
  explain:"Chaque instruction du Dockerfile crée une couche en lecture seule identifiée par son digest. OverlayFS les empile (lowerdirs) et ajoute une couche d'écriture (upperdir) pour le conteneur. Écrire dans un fichier d'une couche basse déclenche un copy-up : le fichier entier est copié dans la couche supérieure — d'où la lenteur des écritures sur de gros fichiers et l'intérêt de mettre les données en volume." },

{ id:"n8-docker-02", lvl:8, dom:"Docker",
  q:"Qu'est-ce qu'un manifest list / image index, et pourquoi c'est important en multi-architecture ?",
  accept:["multi arch","digest par plateforme","buildx","index","selection automatique"],
  explain:"Un manifest list est un index qui référence plusieurs manifestes d'image, un par couple OS/architecture. Le client tire le digest correspondant à sa plateforme automatiquement. C'est ce qui permet à <code>FROM alpine</code> de fonctionner sur amd64 et arm64. On le produit avec <code>docker buildx build --platform linux/amd64,linux/arm64 --push</code>. Sans lui, un build fait sur Mac M-series casse sur des nœuds x86." },

{ id:"n8-cicd-01", lvl:8, dom:"CI/CD",
  q:"Qu'est-ce qu'une attaque par pull_request_target / workflow d'un fork, et comment s'en protéger ?",
  accept:["execute avec les secrets","code non fiable","fork","approbation","permissions"],
  explain:"Certains déclencheurs exécutent le workflow avec les SECRETS du dépôt cible tout en checkoutant du code venant d'un fork non fiable : un contributeur malveillant exfiltre les secrets. Protections : ne jamais checkouter la référence du fork dans un contexte privilégié, exiger une approbation manuelle pour les workflows de contributeurs externes, restreindre <code>GITHUB_TOKEN</code> en lecture seule par défaut, et isoler les jobs qui manipulent des secrets." },

{ id:"n8-obs-01", lvl:8, dom:"Observabilité",
  q:"Qu'est-ce que l'explosion de cardinalité en métriques et pourquoi est-elle fatale ?",
  accept:["trop de series","label unique","memoire","user id","serie temporelle"],
  explain:"Chaque combinaison unique de labels crée une SÉRIE temporelle distincte, stockée en mémoire. Mettre un ID utilisateur, un trace ID ou une URL avec paramètres en label génère des millions de séries : le TSDB explose en RAM et devient injoignable. Règle : les labels doivent être de cardinalité BORNÉE et connue (service, méthode, code de statut, région). Le détail unitaire appartient aux logs et aux traces, pas aux métriques." },

{ id:"n8-sql-01", lvl:8, dom:"SQL",
  q:"Comment fonctionne le MVCC, et quel effet a-t-il sur PostgreSQL en écriture intensive ?",
  accept:["versions","pas de verrou en lecture","bloat","vacuum","tuples morts"],
  explain:"En MVCC, un UPDATE ne modifie pas la ligne : il écrit une nouvelle version et marque l'ancienne comme morte. Les lecteurs voient la version cohérente avec leur snapshot, donc les lectures ne bloquent pas les écritures. Contrepartie : accumulation de tuples morts (bloat) qu'il faut nettoyer avec VACUUM (autovacuum), sous peine de tables gonflées, d'index inefficaces et, à l'extrême, d'un risque de wraparound des transaction IDs." },

{ id:"n8-sre-01", lvl:8, dom:"SRE",
  q:"Explique pourquoi ajouter des retries peut AGGRAVER une panne, et ce qu'il faut mettre à la place.",
  accept:["amplification","charge multipliee","budget de retry","circuit breaker","effondrement"],
  explain:"Un service qui rame reçoit 3x plus de requêtes à cause des retries, ce qui l'achève : c'est l'effondrement métastable. Il faut un budget de retry global (par exemple max 10 % du trafic en retries), un backoff exponentiel avec jitter, un circuit breaker, des timeouts décroissants en profondeur (le service appelé doit avoir un timeout plus court que l'appelant), et un load shedding qui refuse tôt plutôt que de traiter mal." },

{ id:"n8-sre-02", lvl:8, dom:"SRE",
  q:"Qu'est-ce qu'une dépendance critique cachée, et comment la découvres-tu avant l'incident ?",
  accept:["dependance non identifiee","spof","cartographie","test de panne","dns","certificat"],
  explain:"Un composant dont la panne casse tout sans figurer dans les schémas : DNS, autorité de certification, service d'authentification, registry d'images, secret manager, ou même le pipeline CI dont dépend le rollback. On les découvre par cartographie des dépendances (traces distribuées), revue des chemins critiques, et surtout par des exercices de panne contrôlée. Question piège classique : « votre rollback dépend-il du système qui est tombé ? »" }

]);

/* ============ NIVEAU 8 — SÉRIE B ============ */

{ id:"b8-k8s-01", lvl:8, dom:"Kubernetes",
  q:"Comment fonctionne le mécanisme de leader election entre plusieurs réplicas d'un contrôleur ?",
  accept:["lease","bail","un seul actif","renouvelle","coordination"],
  explain:"Les réplicas tentent d'acquérir un objet <code>Lease</code> (anciennement une annotation sur un ConfigMap/Endpoints) dans l'API. Celui qui l'obtient devient leader et le renouvelle périodiquement ; les autres restent en veille. Si le leader cesse de renouveler, le bail expire et un autre prend la main. C'est ce qui permet d'avoir des contrôleurs en haute disponibilité sans double exécution — et c'est exactement ce que fait le kube-controller-manager." },

{ id:"b8-k8s-02", lvl:8, dom:"Kubernetes",
  q:"Explique le fonctionnement de <code>resourceVersion</code> et du mécanisme de watch.",
  accept:["optimistic concurrency","conflit","reprendre","etcd revision","informer"],
  explain:"Chaque objet porte une <code>resourceVersion</code> issue de la révision etcd. En écriture, elle sert de contrôle de concurrence optimiste : si l'objet a changé depuis votre lecture, l'API renvoie un conflit (409) et le client rejoue. En lecture, un <code>watch</code> depuis une resourceVersion permet de reprendre le flux d'événements là où on s'était arrêté — c'est le socle des informers et donc de tous les contrôleurs." },

{ id:"b8-k8s-03", lvl:8, dom:"Kubernetes",
  q:"Qu'est-ce que le server-side apply et quel problème résout-il ?",
  accept:["field manager","propriete des champs","conflit","last-applied","plusieurs acteurs"],
  explain:"L'API suit QUI possède chaque champ (field manager). Quand deux acteurs modifient le même objet (un dev, un opérateur, un HPA), les conflits sont détectés explicitement au lieu d'être écrasés silencieusement. Cela remplace l'ancien mécanisme basé sur l'annotation <code>last-applied-configuration</code>, qui gérait mal la suppression de champs et les acteurs multiples." },

{ id:"b8-k8s-04", lvl:8, dom:"Kubernetes",
  q:"Comment le scheduler choisit-il un nœud ? Décris les deux phases.",
  must:[["filtrage","predicat","eligibles"],["score","priorite","meilleur"]],
  explain:"1) <b>Filtrage</b> : élimine les nœuds inéligibles (ressources insuffisantes, taints non tolérés, affinités impossibles, ports en conflit, volume non attachable). 2) <b>Scoring</b> : note les nœuds restants selon des plugins (répartition, ressources les moins utilisées, localité de l'image, topologie) et prend le meilleur. Puis il « binde » le Pod au nœud. On peut étendre les deux phases par des plugins ou un scheduler personnalisé." },

{ id:"b8-k8s-05", lvl:8, dom:"Kubernetes",
  q:"Qu'est-ce que la préemption de Pods et à quoi sert une PriorityClass ?",
  accept:["evincer","priorite plus basse","liberer de la place","critique"],
  explain:"Si un Pod de haute priorité ne peut pas être placé, le scheduler peut ÉVINCER des Pods de priorité inférieure pour lui faire de la place. Les PriorityClass définissent cette hiérarchie (les composants système utilisent <code>system-cluster-critical</code>). Utile pour garantir que les charges critiques passent avant le batch. Danger : mal calibrées, elles provoquent des évictions en cascade — et un PDB peut freiner mais pas empêcher la préemption." },

{ id:"b8-k8s-06", lvl:8, dom:"Kubernetes",
  q:"Pourquoi une application Java en conteneur peut-elle se faire OOMKill alors que son heap est bien inférieur à la limite ?",
  accept:["hors heap","metaspace","thread","overhead","jvm ne voit pas le cgroup"],
  explain:"La mémoire d'une JVM ne se limite pas au heap : metaspace, piles de threads, buffers directs, code natif, GC. Le cgroup compte TOUT. De plus, une JVM ancienne ne détecte pas la limite du cgroup et dimensionne son heap sur la RAM de l'hôte. Correctifs : JVM récente avec <code>-XX:MaxRAMPercentage</code>, limite mémoire avec une marge de 25-30 % au-dessus du heap, et surveillance du working set, pas du heap." },

{ id:"b8-linux-01", lvl:8, dom:"Linux",
  q:"Explique ce qu'est un appel système et pourquoi seccomp est un contrôle de sécurité efficace.",
  accept:["interface noyau","restreint les appels","surface d attaque","filtre"],
  explain:"Un appel système est le seul point d'entrée d'un programme vers le noyau (open, read, socket, clone...). seccomp filtre les appels autorisés pour un processus : un conteneur qui n'a pas besoin de <code>mount</code>, <code>ptrace</code> ou <code>keyctl</code> ne peut plus les invoquer, ce qui neutralise des familles entières d'exploits d'évasion. Le profil <code>RuntimeDefault</code> bloque déjà une bonne partie des appels dangereux — et il n'est pas actif par défaut partout." },

{ id:"b8-linux-02", lvl:8, dom:"Linux",
  q:"Qu'est-ce que le user namespace remapping et pourquoi ça change la donne pour les conteneurs ?",
  accept:["root dans le conteneur","non privilegie sur l hote","uid different","isolation"],
  explain:"Il fait correspondre l'UID 0 DANS le conteneur à un UID non privilégié sur l'hôte. Conséquence : même si un processus est root dans le conteneur, une évasion ne donne qu'un utilisateur ordinaire sur l'hôte. C'est une des rares protections structurelles contre l'évasion, longtemps peu utilisée par défaut (contraintes sur les volumes et les permissions), aujourd'hui disponible dans Kubernetes." },

{ id:"b8-linux-03", lvl:8, dom:"Linux",
  q:"Qu'est-ce qu'eBPF et pourquoi ça transforme l'observabilité et le réseau ?",
  accept:["programme dans le noyau","sans module","verifie","sans modifier l application","cilium"],
  explain:"eBPF permet d'exécuter des programmes vérifiés et sandboxés DANS le noyau, attachés à des points d'instrumentation (appels système, pile réseau, tracepoints), sans module noyau ni redémarrage. Applications : observabilité sans instrumenter les applications, réseau et politiques haute performance (Cilium remplace kube-proxy et iptables), détection de sécurité au runtime (Falco, Tetragon). C'est le sujet où l'on gagne des points en entretien senior." },

{ id:"b8-tf-01", lvl:8, dom:"Terraform",
  q:"Comment fonctionne le graphe de dépendances de Terraform et qu'implique-t-il pour la parallélisation ?",
  accept:["dag","acyclique","references","parallele","ordre"],
  explain:"Terraform construit un graphe orienté acyclique à partir des RÉFÉRENCES entre ressources, puis parcourt ce graphe en exécutant en parallèle (10 par défaut) tout ce qui n'a pas de dépendance mutuelle. Conséquences : abuser de <code>depends_on</code> sérialise inutilement, un cycle bloque le plan, et l'ordre de destruction est simplement l'inverse du graphe." },

{ id:"b8-tf-02", lvl:8, dom:"Terraform",
  q:"Que se passe-t-il si le processus Terraform est tué pendant un apply ?",
  accept:["lock reste","state partiel","force-unlock","ressource orpheline"],
  explain:"Le verrou reste posé (il faudra un <code>force-unlock</code> après vérification) et le state peut ne pas refléter la dernière opération en cours : une ressource créée côté cloud mais non écrite dans le state devient ORPHELINE — Terraform voudra la recréer et échouera sur un conflit de nom. Reprise : lever le verrou, faire un plan, identifier les orphelines, les importer ou les supprimer manuellement." },

{ id:"b8-tf-03", lvl:8, dom:"Terraform",
  q:"Quelle est la différence entre <code>sensitive = true</code> sur une variable et un secret réellement protégé ?",
  accept:["masque l affichage","toujours en clair dans le state","pas du chiffrement","logs"],
  explain:"<code>sensitive</code> masque simplement la valeur dans la sortie du plan et des outputs — c'est un garde-fou d'affichage, pas une protection. La valeur reste EN CLAIR dans le state, et peut fuiter par une ressource qui l'expose ou par un provider verbeux. La vraie protection : chiffrement et contrôle d'accès du state, et surtout ne pas faire transiter le secret par Terraform." },

{ id:"b8-aws-01", lvl:8, dom:"AWS",
  q:"Comment fonctionne le mécanisme d'éventuelle cohérence d'IAM et quel piège pratique ça crée ?",
  accept:["propagation","delai","reessayer","role vient d etre cree","globalement"],
  explain:"IAM est un service global dont les modifications se propagent avec un léger délai. Piège classique en automatisation : on crée un rôle puis on l'utilise immédiatement, et l'appel échoue en AccessDenied ou « role cannot be assumed ». Parade : retry avec backoff sur ces créations, ou dépendance explicite plus une temporisation. C'est un cas typique où l'on croit à tort à un bug de permissions." },

{ id:"b8-aws-02", lvl:8, dom:"AWS",
  q:"Explique le fonctionnement des partitions DynamoDB et le problème de la clé chaude.",
  accept:["partition key","repartition","hot partition","throttling","cardinalite"],
  explain:"Les données sont réparties par hachage de la clé de partition ; chaque partition a sa part de capacité. Si une clé concentre le trafic (une date du jour, un identifiant de tenant dominant), on obtient une <em>hot partition</em> : throttling alors que la capacité globale semble suffisante. Parades : choisir une clé à haute cardinalité et bien distribuée, ajouter un suffixe de répartition (write sharding), ou utiliser le mode on-demand avec adaptive capacity." },

{ id:"b8-aws-03", lvl:8, dom:"AWS",
  q:"Qu'est-ce que le modèle de facturation d'une NAT Gateway et pourquoi c'est un piège d'architecture ?",
  accept:["par heure","par go traite","tout le trafic","endpoints","inter-az"],
  explain:"On paie à l'heure ET au Go TRAITÉ, y compris pour du trafic vers S3 ou une autre AZ. Sur une plateforme qui télécharge beaucoup d'images ou écrit massivement dans S3, la NAT peut coûter plus cher que le calcul. Parades : VPC endpoints (gateway pour S3/DynamoDB, gratuits), registry miroir interne, et vérifier qu'on ne fait pas transiter du trafic interne par la NAT à cause d'une route mal placée." },

{ id:"b8-az-01", lvl:8, dom:"Azure",
  q:"Comment fonctionne le modèle de cohérence de Cosmos DB ? Cite les niveaux et l'arbitrage.",
  must:[["strong","forte"],["eventual","eventuelle"],["session"]],
  explain:"Cinq niveaux : Strong (linéarisable, latence et coût maximaux, limite la distribution), Bounded Staleness (retard borné en versions ou en temps), <b>Session</b> (défaut : cohérence garantie pour la session d'un client — le bon compromis dans la majorité des cas), Consistent Prefix (ordre respecté sans garantie de fraîcheur), Eventual (le moins cher et le plus rapide). L'arbitrage porte sur latence, disponibilité, coût en RU et fraîcheur." },

{ id:"b8-az-02", lvl:8, dom:"Azure",
  q:"Qu'est-ce qu'un ARM template deployment mode « Complete » et pourquoi c'est dangereux ?",
  accept:["supprime ce qui n est pas dans le template","incremental","destruction","resource group"],
  explain:"En mode Complete, tout ce qui existe dans le resource group mais n'apparaît PAS dans le template est SUPPRIMÉ. C'est puissant pour garantir la conformité stricte, et catastrophique si le template est incomplet ou si le RG contient des ressources créées ailleurs. Le mode Incremental (par défaut) ne fait qu'ajouter/mettre à jour. À manier avec des RG dédiés et jamais en découverte." },

{ id:"b8-sec-01", lvl:8, dom:"Sécurité",
  q:"Qu'est-ce que la forward secrecy et pourquoi c'est important pour de la donnée bancaire ?",
  accept:["cle de session ephemere","compromission future","dechiffrer le passe","ecdhe"],
  explain:"Chaque session dérive une clé éphémère (ECDHE) qui n'est jamais transmise ni dérivable de la clé privée du serveur. Conséquence : un attaquant qui enregistre le trafic aujourd'hui et vole la clé privée dans trois ans ne peut PAS déchiffrer les sessions passées. Pour des données à longue durée de sensibilité (données bancaires, santé), c'est essentiel — et c'est obligatoire en TLS 1.3." },

{ id:"b8-sec-02", lvl:8, dom:"Sécurité",
  q:"Qu'est-ce qu'une attaque SSRF et pourquoi est-elle particulièrement dangereuse dans le cloud ?",
  accept:["metadonnees","169.254.169.254","imds","credentials","serveur fait la requete"],
  explain:"L'attaquant fait émettre une requête PAR le serveur vers une adresse qu'il choisit. Dans le cloud, la cible est l'endpoint de métadonnées (<code>169.254.169.254</code>) : on en extrait les credentials temporaires du rôle de l'instance, donc un accès direct au compte. Parades : IMDSv2 obligatoire (requête avec token, hop limit), Managed Identity via des mécanismes non exposés, validation stricte des URL sortantes, et egress filtré." },

{ id:"b8-cicd-01", lvl:8, dom:"CI/CD",
  q:"Qu'est-ce que SLSA et à quoi servent les attestations de provenance ?",
  accept:["chaine d approvisionnement","niveaux","prouver l origine","build","integrite"],
  explain:"SLSA est un référentiel de niveaux de maturité pour l'intégrité de la chaîne de build. Une attestation de provenance est un document signé produit par le système de build qui déclare : quel code source, quel commit, quel builder, quels paramètres ont produit CET artefact. Vérifiée à l'admission, elle empêche de déployer un artefact qui n'a pas été produit par le pipeline officiel — une réponse directe aux attaques type SolarWinds." },

{ id:"b8-cicd-02", lvl:8, dom:"CI/CD",
  q:"Comment gères-tu un monorepo de 200 services pour ne construire que ce qui a changé ?",
  accept:["detection de changement","graphe de dependances","bazel","nx","turborepo","affected"],
  explain:"Détection des chemins modifiés dans le commit, puis résolution du graphe de dépendances internes pour inclure ce qui est impacté indirectement (outils : Bazel, Nx, Turborepo, ou un script maison sur les paths). Cache d'artefacts indexé par hash des entrées pour réutiliser un build identique. Piège : oublier les dépendances transitives ou les fichiers partagés — on rate alors une régression, ce qui est pire que de tout builder." },

{ id:"b8-obs-01", lvl:8, dom:"Observabilité",
  q:"Explique la différence entre échantillonnage head-based et tail-based, et l'arbitrage.",
  must:[["au debut","des le premier span","head"],["apres","trace complete","tail","erreur"]],
  explain:"Head-based : la décision de garder la trace est prise au DÉBUT, avant de savoir si elle sera intéressante — simple, peu coûteux, mais on jette des erreurs et des requêtes lentes. Tail-based : on bufferise la trace complète puis on décide (garder 100 % des erreurs et des traces au-dessus d'un seuil de latence, échantillonner le reste) — bien plus utile, mais nécessite un collector qui garde les traces en mémoire et voit tous les spans d'une même trace." },

{ id:"b8-obs-02", lvl:8, dom:"Observabilité",
  q:"Qu'est-ce qu'un exemplar en Prometheus et quel problème ça résout ?",
  accept:["lien metrique trace","trace id","du graphe vers la trace","correlation"],
  explain:"C'est un identifiant de trace attaché à une observation d'histogramme : depuis un graphe de latence, on clique sur le point aberrant et on ouvre LA trace correspondante. Ça résout le trou classique entre « je vois que le p99 est mauvais » et « je ne sais pas quelle requête regarder ». C'est la corrélation métriques → traces sans passer par une recherche à l'aveugle dans les logs." },

{ id:"b8-sre-01", lvl:8, dom:"SRE",
  q:"Qu'est-ce qu'une défaillance métastable et pourquoi est-elle si difficile à résoudre ?",
  accept:["persiste apres la cause","boucle","retry","ne revient pas seul","effondrement"],
  explain:"Le système entre dans un état dégradé qui s'AUTO-ENTRETIENT même après la disparition de la cause initiale : les retries, les files pleines et les caches froids maintiennent la surcharge. Retirer la cause ne suffit donc plus. Sortie : réduire drastiquement la charge (load shedding, coupure du trafic, vidage des files) pour casser la boucle, puis remonter progressivement. C'est le mode de panne qui explique les incidents de plusieurs heures chez les grands acteurs." },

{ id:"b8-sre-02", lvl:8, dom:"SRE",
  q:"Pourquoi un cache peut-il aggraver une panne ? Explique deux mécanismes.",
  accept:["cache stampede","cache froid","expiration simultanee","dependance","tout arrive en meme temps"],
  explain:"1) <b>Cache stampede</b> : de nombreuses entrées expirent en même temps, tous les clients frappent l'origine simultanément et la tuent (parades : TTL avec jitter, verrou de recalcul, rafraîchissement anticipé). 2) <b>Cache froid</b> : après un redémarrage ou un vidage, le service ne peut plus absorber le trafic nominal car il comptait sur un taux de hit élevé — d'où l'intérêt de remonter progressivement et de dimensionner l'origine pour un scénario sans cache." },

{ id:"b8-sql-01", lvl:8, dom:"SQL",
  q:"Qu'est-ce que le write amplification et pourquoi ça compte pour une base sur SSD cloud ?",
  accept:["ecriture reelle superieure","index","wal","iops","cout"],
  explain:"Une écriture logique déclenche plusieurs écritures physiques : journal (WAL), page de données, chaque index, réplication, puis la gestion interne du SSD. Une table à 8 index peut multiplier les IOPS par un facteur important. Conséquences cloud : on atteint la limite d'IOPS provisionnées bien avant la limite de CPU, et la facture de stockage explose. D'où : n'indexer que l'utile, regrouper les écritures par lots." },

{ id:"b8-sql-02", lvl:8, dom:"SQL",
  q:"Comment fonctionne la réplication en flux (streaming) PostgreSQL et que se passe-t-il si le réplica prend du retard ?",
  accept:["wal","lag","slot de replication","disque plein","lecture perimee"],
  explain:"Le primaire envoie son flux de WAL au réplica qui les rejoue. Si le réplica prend du retard : les lectures sur le réplica renvoient des données périmées, et surtout — avec un <em>replication slot</em> — le primaire CONSERVE les WAL non consommés, ce qui peut remplir son disque et arrêter la base. C'est un piège d'exploitation classique : un réplica arrêté et oublié met le primaire à genoux (d'où <code>max_slot_wal_keep_size</code>)." },

{ id:"b8-res-01", lvl:8, dom:"Réseau",
  q:"Qu'apporte HTTP/2 et HTTP/3 par rapport à HTTP/1.1, et quel problème résout QUIC ?",
  must:[["multiplexage","une seule connexion"],["udp","quic","head of line"]],
  explain:"HTTP/2 : multiplexage de plusieurs flux sur une connexion TCP, compression des en-têtes, priorisation — mais une perte de paquet bloque TOUS les flux (head-of-line blocking au niveau TCP). HTTP/3 sur QUIC (UDP) résout ça : les flux sont indépendants, le handshake est fusionné avec TLS 1.3 (0-RTT possible) et la connexion survit à un changement d'IP. Gain surtout sensible sur réseau mobile et à latence élevée." },

{ id:"b8-docker-01", lvl:8, dom:"Docker",
  q:"Pourquoi une image <code>scratch</code> ou distroless complique-t-elle l'exploitation, et comment on s'en sort ?",
  accept:["pas de shell","pas d outils","ephemeral container","debug","kubectl debug"],
  explain:"Pas de shell, pas de <code>ps</code>, pas de résolveur DNS parfois, pas de certificats CA si on ne les copie pas. Bénéfice : surface d'attaque minimale et quasi zéro CVE système. On s'en sort par les conteneurs éphémères (<code>kubectl debug --target</code>), une variante « debug » de l'image utilisée ponctuellement, une observabilité applicative solide, et en copiant explicitement les certificats CA et le fichier de zones horaires dans l'image." }

]);

</script>
<script>
/* data/niveau09.js */
window.QBANK = (window.QBANK || []).concat([
/* ================= NIVEAU 9 — RÉSILIENCE, COÛTS, GOUVERNANCE ================= */

{ id:"n9-dr-01", lvl:9, dom:"SRE",
  q:"Cite les quatre stratégies de disaster recovery cloud, de la moins chère à la plus chère, avec leur RTO typique.",
  must:[["backup","sauvegarde"],["pilot light","veilleuse"],["warm standby","tiede"],["actif actif","multi site","hot"]],
  explain:"1) Backup & restore : RTO en heures, coût minimal. 2) Pilot light : le cœur (base répliquée) tourne, le reste est éteint — RTO en dizaines de minutes. 3) Warm standby : environnement complet à capacité réduite, RTO en minutes. 4) Multi-site actif/actif : RTO quasi nul, coût maximal et complexité de cohérence des données. Le choix découle du RTO/RPO négocié avec le métier, pas d'une préférence technique." },

{ id:"n9-dr-02", lvl:9, dom:"SRE",
  q:"Ta sauvegarde existe mais n'a jamais été restaurée. Quel est le problème, et quelle est la règle de référence ?",
  accept:["3-2-1","non testee","restauration","exercice","pas une sauvegarde"],
  explain:"Une sauvegarde jamais restaurée n'est pas une sauvegarde, c'est une hypothèse. Règle 3-2-1 : 3 copies, 2 supports différents, 1 hors site — complétée aujourd'hui par 1 copie immuable/hors ligne contre les ransomwares. Il faut un exercice de restauration PLANIFIÉ et chronométré (au moins annuel en banque), qui valide aussi la restauration des CLÉS de chiffrement et des dépendances (DNS, comptes de service)." },

{ id:"n9-dr-03", lvl:9, dom:"SRE",
  q:"Une région cloud entière tombe. Qu'est-ce qui casse en premier dans une architecture mal préparée ?",
  accept:["dns","bascule manuelle","etat","base primaire","dependance regionale"],
  explain:"Typiquement : la base primaire n'a pas de réplique promue automatiquement, le DNS pointe encore vers la région morte avec un TTL trop long, les secrets/clés KMS sont régionaux et non répliqués, le pipeline de déploiement lui-même vit dans la région tombée, et les quotas de la région de secours n'ont jamais été demandés. La capacité de secours indisponible au moment du besoin est l'échec le plus fréquent." },

{ id:"n9-gov-01", lvl:9, dom:"Sécurité",
  q:"Qu'est-ce que la séparation des tâches (SoD) et comment la mets-tu en œuvre dans un pipeline automatisé ?",
  accept:["celui qui developpe ne deploie pas","approbation","tracabilite","quatre yeux","role distinct"],
  explain:"Personne ne doit pouvoir seul écrire ET mettre en production un changement. En pipeline : branches protégées avec revue obligatoire par un tiers, environnements protégés avec approbation distincte pour la prod, identités de pipeline séparées (build ≠ deploy), interdiction du bypass des règles, journalisation immuable de qui a approuvé quoi. Le contrôle passe du geste manuel à la GOUVERNANCE DU PIPELINE — c'est cet argument qu'un auditeur bancaire attend." },

{ id:"n9-gov-02", lvl:9, dom:"Sécurité",
  q:"Un auditeur te demande de prouver ce qui tourne en production et qui l'a autorisé. Que lui montres-tu ?",
  must:[["git","historique","commit"],["pipeline","journal","log de deploiement"]],
  explain:"La chaîne complète : ticket/demande → PR avec revue et approbation nommée → commit signé → build tracé avec son artefact versionné et son SBOM → journal du pipeline de déploiement horodaté → état réel de la plateforme via l'IaC et l'inventaire (AWS Config, Azure Resource Graph). En GitOps, le dépôt Git EST la preuve de l'état désiré, et le contrôleur prouve la réconciliation." },

{ id:"n9-gov-03", lvl:9, dom:"Sécurité",
  q:"Comment gères-tu une exception à une politique de sécurité qui bloque une équipe en urgence ?",
  accept:["exemption tracee","duree limitee","approbation","risque accepte","ticket"],
  explain:"Jamais en désactivant la policy : on crée une EXEMPTION nommée, limitée à un périmètre, avec une date d'expiration, un propriétaire, une justification et une approbation du risque. On l'inscrit dans un registre revu périodiquement. Une exception sans date de fin devient une règle permanente que personne n'assume — c'est exactement ce que cherchent les auditeurs." },

{ id:"n9-cost-01", lvl:9, dom:"SRE",
  q:"Qu'est-ce que le FinOps et quelles sont ses trois phases ?",
  must:[["inform","visibilite","mesurer"],["optimize","optimiser"],["operate","gouverner","operer"]],
  explain:"Inform (visibilité : tagging, allocation des coûts par équipe, showback/chargeback), Optimize (rightsizing, engagements, architecture), Operate (gouvernance continue : budgets, alertes d'anomalie, coût intégré aux critères de conception). Le point clé : le coût devient une métrique d'ingénierie suivie comme la latence, avec un propriétaire — pas un rapport financier trimestriel." },

{ id:"n9-cost-02", lvl:9, dom:"SRE",
  q:"Une équipe veut du multi-cloud « pour ne pas être verrouillée ». Que réponds-tu ?",
  accept:["cout","denominateur commun","complexite","rarement justifie","competences"],
  explain:"Question honnête : le multi-cloud actif/actif coûte cher (double compétence, double outillage, réseau inter-cloud, dénominateur commun de services) et réduit souvent la fiabilité au lieu de l'augmenter. Alternatives : portabilité RAISONNABLE (conteneurs, IaC, standards ouverts, abstraction des points de sortie critiques) et négociation contractuelle. Le multi-cloud se justifie par une exigence réglementaire, une acquisition, ou un service unique — pas par la peur du verrouillage." },

{ id:"n9-k8s-01", lvl:9, dom:"Kubernetes",
  q:"Comment planifies-tu la mise à jour d'un cluster Kubernetes en production bancaire ?",
