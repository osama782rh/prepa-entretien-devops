<html lang="fr">
<head>

<style>
  :root{
    --bg:#0d111a; --surface:#151b27; --surface2:#1d2432; --ink:#dde4f0; --muted:#8d9ab2;
    --accent:#6c8cff; --accent-soft:#1a2440; --ok:#3ecf8e; --ok-soft:#0f2a1e;
    --ko:#ff6b6b; --ko-soft:#2c1416; --warn:#edaa5f; --warn-soft:#2a2013;
    --border:#26303f; --code:#0a0e16;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f5f7fb; --surface:#fff; --surface2:#f0f3f9; --ink:#161d2b; --muted:#5c687d;
      --accent:#2b5fd9; --accent-soft:#e6edfc; --ok:#1e7a46; --ok-soft:#e7f5ec;
      --ko:#b3352b; --ko-soft:#fbeae8; --warn:#8a5a00; --warn-soft:#fdf3e3;
      --border:#dce2ee; --code:#eef1f7;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.55}
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 80px}
  a{color:var(--accent)}
  code{font-family:"Cascadia Code",Consolas,monospace;background:var(--code);padding:1px 5px;border-radius:5px;font-size:.88em;border:1px solid var(--border)}
  header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  header.top h1{font-size:19px;margin:0;font-weight:700}
  header.top h1 span{color:var(--accent)}
  .hstats{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .hstats b{color:var(--ink)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 16px}

  .levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin:14px 0 20px}
  .lvl{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 13px;cursor:pointer;text-align:left;color:inherit;font:inherit;transition:.15s;position:relative}
  .lvl:hover{border-color:var(--accent);transform:translateY(-2px)}
  .lvl .n{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .lvl .t{font-weight:650;font-size:14.5px;margin:3px 0 5px;line-height:1.3}
  .lvl .m{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .bar{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--ok);width:0}

  .modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  button{font:inherit;cursor:pointer;border:none;border-radius:9px;padding:.6rem 1.1rem;background:var(--accent);color:#fff;font-weight:600;font-size:14.5px}
  button:hover{filter:brightness(1.08)}
  button.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--border)}
  button.tiny{padding:.35rem .7rem;font-size:13px}
  button:disabled{opacity:.45;cursor:not-allowed}

  .progress{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-bottom:16px}
  .progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
  .meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:10px;gap:10px;flex-wrap:wrap}
  .tag{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:700;letter-spacing:.03em}
  .qtext{font-size:17px;line-height:1.5;margin:6px 0 16px;font-weight:550}
  textarea{width:100%;padding:.75rem;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--ink);font:inherit;font-size:15px;resize:vertical;min-height:76px}
  textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .fb{margin-top:14px;padding:14px;border-radius:10px;font-size:14.5px;border:1px solid}
  .fb.ok{background:var(--ok-soft);border-color:var(--ok)}
  .fb.ko{background:var(--ko-soft);border-color:var(--ko)}
  .fb .badge{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:6px;letter-spacing:.04em;margin-bottom:8px}
  .fb.ok .badge{background:var(--ok);color:#04180f}
  .fb.ko .badge{background:var(--ko);color:#2a0605}
  .fb .keys{font-size:12.5px;color:var(--muted);margin-top:9px}
  .tip{margin-top:9px;padding:9px 11px;background:var(--warn-soft);border-left:3px solid var(--warn);border-radius:6px;font-size:13.5px}
  .done{text-align:center;padding:16px 0}
  .score{font-size:44px;font-weight:800;margin:8px 0;font-variant-numeric:tabular-nums}
  .dom-list{margin-top:14px;font-size:13.5px}
  .dom-list div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--border)}
  .hint{font-size:13px;color:var(--muted);margin-top:8px}
  .kbd{border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:12px;background:var(--surface2)}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
</style>
</head>

<div class="wrap">
  <header class="top">
    <h1>Quiz <span>DevOps</span> — Entretien BNP</h1>
    <div class="hstats" id="hstats"></div>
  </header>
  <div id="app"></div>
</div>

<script>
/* data/niveau01.js */
window.QBANK = (window.QBANK || []).concat([
/* ================= NIVEAU 1 — VOCABULAIRE & FONDATIONS ================= */

{ id:"n1-linux-01", lvl:1, dom:"Linux",
  q:"Que représente exactement le premier caractère de <code>drwxr-xr-x</code> dans une sortie <code>ls -l</code> ?",
  accept:["type","repertoire","dossier","directory","d pour"],
  explain:"C'est le TYPE de l'objet, pas une permission : <code>d</code> répertoire, <code>-</code> fichier ordinaire, <code>l</code> lien symbolique, <code>b</code>/<code>c</code> périphérique bloc/caractère, <code>s</code> socket, <code>p</code> pipe nommé." },

{ id:"n1-linux-02", lvl:1, dom:"Linux",
  q:"Traduis <code>chmod 640 fichier</code> en droits lisibles : qui peut faire quoi ?",
  must:[["proprietaire","owner","user"],["groupe","group"]],
  accept:["lecture ecriture","rw r","lit et ecrit"],
  explain:"6=rw- pour le propriétaire, 4=r-- pour le groupe, 0=--- pour les autres. Donc : le propriétaire lit et écrit, le groupe lit seulement, le reste du monde n'a aucun accès." },

{ id:"n1-linux-03", lvl:1, dom:"Linux",
  q:"Quelle est la différence entre <code>&gt;</code> et <code>&gt;&gt;</code> dans un shell ?",
  accept:["ecrase","remplace","truncate","ajoute a la fin","append"],
  explain:"<code>&gt;</code> écrase (truncate) le fichier cible, <code>&gt;&gt;</code> ajoute à la fin. Piège classique : <code>&gt;</code> vide le fichier même si la commande échoue ensuite." },

{ id:"n1-linux-04", lvl:1, dom:"Linux",
  q:"Que fait <code>2&gt;&amp;1</code> et pourquoi l'ordre <code>cmd &gt; f 2&gt;&amp;1</code> compte-t-il ?",
  accept:["stderr","erreur","descripteur 2","sortie d erreur"],
  explain:"Ça redirige stderr (fd 2) vers là où pointe stdout (fd 1) à cet instant. Écrit dans l'autre sens (<code>2&gt;&amp;1 &gt; f</code>), stderr part encore vers le terminal car il a copié la destination AVANT la redirection de stdout." },

{ id:"n1-git-01", lvl:1, dom:"Git",
  q:"Quelle est la différence fondamentale entre <code>git fetch</code> et <code>git pull</code> ?",
  accept:["pull = fetch + merge","fetch ne modifie pas","pull fusionne","merge automatique","rapatrie sans integrer"],
  explain:"<code>fetch</code> rapatrie les commits distants sans toucher à ta branche de travail. <code>pull</code> = <code>fetch</code> + <code>merge</code> (ou <code>rebase</code>) : il modifie ton working tree. En entretien : fetch d'abord, on regarde, puis on intègre." },

{ id:"n1-git-02", lvl:1, dom:"Git",
  q:"À quoi sert la zone d'index (staging area) de Git ?",
  accept:["preparer le commit","selectionner","zone intermediaire","choisir ce qui part","construire le prochain commit"],
  explain:"C'est le brouillon du prochain commit : elle permet de choisir précisément QUELS changements partent dans le commit, y compris des morceaux de fichier (<code>git add -p</code>). Un commit est un instantané de l'index, pas du disque." },

{ id:"n1-docker-01", lvl:1, dom:"Docker",
  q:"Quelle est la différence entre une image et un conteneur Docker ?",
  accept:["image = modele","template","lecture seule","instance","conteneur = image en execution","classe et instance"],
  explain:"L'image est un modèle immuable en lecture seule (empilement de couches). Le conteneur est une instance en cours d'exécution de cette image, avec une couche d'écriture éphémère au-dessus. Analogie : classe / objet." },

{ id:"n1-docker-02", lvl:1, dom:"Docker",
  q:"Pourquoi dit-on qu'un conteneur n'est PAS une machine virtuelle ?",
  accept:["partage le noyau","meme kernel","pas d os complet","isolation par namespaces","pas d hyperviseur"],
  explain:"Un conteneur partage le noyau de l'hôte et n'est qu'un processus isolé (namespaces + cgroups). Une VM embarque un OS complet au-dessus d'un hyperviseur. D'où : démarrage en ms, mais isolation plus faible et dépendance au kernel Linux." },

{ id:"n1-k8s-01", lvl:1, dom:"Kubernetes",
  q:"Qu'est-ce qu'un Pod, et pourquoi Kubernetes n'orchestre-t-il pas directement des conteneurs ?",
  accept:["plus petite unite","unite deployable","un ou plusieurs conteneurs","partagent le reseau","meme ip"],
  explain:"Le Pod est la plus petite unité déployable : un ou plusieurs conteneurs qui partagent la même IP, les mêmes volumes et le même namespace réseau. Il permet le pattern sidecar (proxy, log shipper) et donne un cycle de vie commun." },

{ id:"n1-k8s-02", lvl:1, dom:"Kubernetes",
  q:"Qu'est-ce qu'un Service Kubernetes résout comme problème ?",
  accept:["ip instable","pods ephemeres","point d entree stable","load balancing","adresse fixe","decouverte"],
  explain:"Les Pods sont éphémères et changent d'IP à chaque recréation. Le Service fournit une IP virtuelle + un nom DNS stables et répartit le trafic sur les Pods correspondant à son selector." },

{ id:"n1-tf-01", lvl:1, dom:"Terraform",
  q:"Qu'est-ce que ça change concrètement que Terraform soit déclaratif plutôt qu'impératif ?",
  accept:["etat final","etat desire","le quoi pas le comment","idempotent","terraform calcule"],
  explain:"Tu décris l'état FINAL voulu ; Terraform compare cet état au state et calcule lui-même les actions. Conséquence pratique : c'est idempotent — relancer un apply sans changement ne fait rien. Un script bash, lui, rejoue tout." },

{ id:"n1-tf-02", lvl:1, dom:"Terraform",
  q:"À quoi sert le fichier <code>terraform.tfstate</code> ? Pourquoi est-il critique ?",
  accept:["correspondance","mapping","memorise les ressources","lien entre le code et le reel","source de verite"],
  explain:"Il mémorise la correspondance entre ton code et les ressources réelles (IDs, attributs). Sans lui Terraform ne sait plus ce qu'il gère et voudrait tout recréer. Il contient souvent des secrets en clair : jamais dans Git, toujours en backend distant chiffré." },

{ id:"n1-tf-03", lvl:1, dom:"Terraform",
  q:"Quelle est la différence entre un bloc <code>resource</code> et un bloc <code>data</code> ?",
  accept:["data lit","lecture seule","resource cree","data ne gere pas","existant"],
  explain:"<code>resource</code> = Terraform crée et gère tout le cycle de vie (create/update/destroy). <code>data</code> = lecture seule d'un objet existant créé ailleurs, pour récupérer un ID ou un attribut. Un <code>destroy</code> ne supprime jamais une data source." },

{ id:"n1-aws-01", lvl:1, dom:"AWS",
  q:"Qu'est-ce qui différencie une Région AWS d'une Availability Zone ?",
  accept:["zone geographique","plusieurs az","datacenter","isolation physique","une region contient"],
  explain:"Une Région est une zone géographique (eu-west-3 = Paris) contenant plusieurs AZ. Une AZ est un ou plusieurs datacenters isolés physiquement, reliés aux autres AZ par un réseau à faible latence. La haute dispo se construit multi-AZ ; le DR se construit multi-région." },

{ id:"n1-aws-02", lvl:1, dom:"AWS",
  q:"Explique le modèle de responsabilité partagée AWS avec un exemple concret.",
  accept:["aws securise le cloud","toi dans le cloud","securite du cloud","securite dans le cloud","partage"],
  explain:"AWS assure la sécurité DU cloud (datacenters, hyperviseur, matériel, réseau physique). Le client assure la sécurité DANS le cloud (IAM, chiffrement, patchs de l'OS sur EC2, config des Security Groups, données). Exemple : un bucket S3 public, c'est ta faute, pas celle d'AWS." },

{ id:"n1-az-01", lvl:1, dom:"Azure",
  q:"À quoi sert un Resource Group dans Azure, et quelle contrainte impose-t-il ?",
  accept:["conteneur logique","regroupe des ressources","cycle de vie","supprime tout","une seule region"],
  explain:"C'est un conteneur logique regroupant des ressources partageant un cycle de vie. Toute ressource appartient à exactement un RG. Supprimer le RG supprime tout ce qu'il contient. Il porte aussi des tags et des assignations RBAC héritées." },

{ id:"n1-az-02", lvl:1, dom:"Azure",
  q:"Cite la hiérarchie de gestion Azure du plus large au plus fin.",
  must:[["management group","groupe d administration"],["subscription","abonnement"],["resource group","groupe de ressources"]],
  explain:"Management Group → Subscription → Resource Group → Ressource. Les policies et le RBAC s'héritent du haut vers le bas : une assignation au niveau subscription s'applique à tous les RG en dessous." },

{ id:"n1-res-01", lvl:1, dom:"Réseau",
  q:"Que signifie le <code>/24</code> dans <code>10.0.1.0/24</code> et combien d'adresses ça représente ?",
  accept:["24 bits","masque","256","bits de reseau"],
  explain:"Les 24 premiers bits identifient le réseau, les 8 restants les hôtes : 2^8 = 256 adresses (dont réseau et broadcast). Sur AWS, 5 sont réservées par la plateforme → 251 utilisables." },

{ id:"n1-res-02", lvl:1, dom:"Réseau",
  q:"Quelle est la différence entre TCP et UDP, et quand choisit-on UDP ?",
  accept:["connexion","fiable","sans connexion","accuse de reception","ordre garanti","plus rapide"],
  explain:"TCP est orienté connexion (handshake, retransmission, ordre garanti, contrôle de flux). UDP est sans connexion, sans garantie, mais sans surcoût : on le choisit pour le DNS, le streaming, la VoIP, les métriques — là où la latence prime sur la perte." },

{ id:"n1-res-03", lvl:1, dom:"Réseau",
  q:"Que fait un enregistrement DNS de type <code>CNAME</code>, et quelle limite a-t-il à la racine d'un domaine ?",
  accept:["alias","pointe vers un autre nom","interdit a l apex","pas a la racine","zone apex"],
  explain:"Un CNAME est un alias vers un autre NOM. Interdit à l'apex du domaine (<code>exemple.com</code>) car la racine doit porter SOA et NS. D'où les enregistrements ALIAS/ANAME propriétaires (Route 53 Alias, Azure DNS Alias)." },

{ id:"n1-cicd-01", lvl:1, dom:"CI/CD",
  q:"Quelle est la différence entre Continuous Delivery et Continuous Deployment ?",
  accept:["validation manuelle","approbation","automatique en prod","bouton","deploiement automatique"],
  explain:"Continuous Delivery : chaque build est prêt à partir en prod mais un humain déclenche la mise en production. Continuous Deployment : tout build qui passe les tests part en prod automatiquement, sans intervention. En banque, on est presque toujours en Delivery." },

{ id:"n1-cicd-02", lvl:1, dom:"CI/CD",
  q:"Qu'est-ce qu'un artefact de build, et pourquoi ne doit-on le construire qu'une seule fois ?",
  accept:["build once","une seule fois","meme binaire","reproductible","promotion"],
  explain:"C'est le livrable produit par la CI (jar, image, package). Principe <em>build once, deploy many</em> : on construit un artefact unique versionné, puis on le PROMEUT de dev → recette → prod. Reconstruire par environnement, c'est risquer de déployer autre chose que ce qui a été testé." },

{ id:"n1-sec-01", lvl:1, dom:"Sécurité",
  q:"Différence entre authentification et autorisation ?",
  accept:["qui tu es","identite","ce que tu as le droit","permissions","droits"],
  explain:"Authentification = prouver QUI tu es (mot de passe, certificat, token). Autorisation = déterminer ce que tu as le DROIT de faire une fois identifié (RBAC, policies IAM). AuthN puis AuthZ, toujours dans cet ordre." },

{ id:"n1-sec-02", lvl:1, dom:"Sécurité",
  q:"Qu'est-ce que le principe du moindre privilège, et comment le vérifie-t-on en pratique ?",
  accept:["strict necessaire","minimum de droits","juste ce qu il faut","access analyzer","revue"],
  explain:"N'accorder que les permissions strictement nécessaires, pour la durée strictement nécessaire. En pratique on part de zéro et on ajoute, on audite avec IAM Access Analyzer / Access Advisor (AWS) ou les PIM/Access Reviews (Azure AD) pour retirer ce qui n'a jamais servi." },

{ id:"n1-obs-01", lvl:1, dom:"Observabilité",
  q:"Cite les trois piliers de l'observabilité et ce que chacun répond.",
  must:[["metrique","metrics"],["log","journaux"],["trace","tracing"]],
  explain:"Métriques (QUOI : agrégats numériques, alerting), Logs (POURQUOI : événements détaillés horodatés), Traces (OÙ : parcours d'une requête à travers les services distribués). Les trois se corrèlent par un trace/correlation ID." },

{ id:"n1-obs-02", lvl:1, dom:"Observabilité",
  q:"Quelle différence fais-tu entre monitoring et observabilité ?",
  accept:["questions connues","inconnues","known unknowns","anticipe","explorer"],
  explain:"Le monitoring répond à des questions qu'on a prévues (dashboards et seuils définis à l'avance). L'observabilité, c'est la capacité à répondre à des questions qu'on n'avait PAS anticipées, à partir des données émises, sans redéployer." },

{ id:"n1-sre-01", lvl:1, dom:"SRE",
  q:"Qu'est-ce qu'un SLI, un SLO et un SLA ? Lequel a des pénalités ?",
  must:[["indicateur","mesure","indicator"],["objectif","cible","objective"],["contrat","penalite","juridique"]],
  explain:"SLI = l'indicateur mesuré (ex : % de requêtes &lt; 300 ms). SLO = l'objectif interne visé (99,9 %). SLA = l'engagement contractuel envers le client, avec pénalités. Règle : SLA &lt; SLO, pour garder une marge avant de payer." },

{ id:"n1-sre-02", lvl:1, dom:"SRE",
  q:"Qu'est-ce qu'un error budget et à quoi sert-il concrètement dans une équipe ?",
  accept:["marge d indisponibilite","budget d erreur","100 moins le slo","droit a l echec","arbitrage"],
  explain:"C'est 100 % moins le SLO : avec un SLO à 99,9 %, tu as droit à ~43 min d'indispo par mois. Tant qu'il reste du budget, on déploie vite ; quand il est consommé, on gèle les features et on repasse sur la fiabilité. C'est l'outil d'arbitrage entre vitesse et stabilité." },

{ id:"n1-sql-01", lvl:1, dom:"SQL",
  q:"Que garantit chacune des lettres d'ACID ?",
  must:[["atomic","atomicite","tout ou rien"],["coherence","consistency","contraintes"],["isolation"],["durab","persist"]],
  explain:"Atomicité (tout ou rien), Cohérence (les contraintes restent respectées), Isolation (les transactions concurrentes ne se voient pas à moitié), Durabilité (une fois commité, ça survit à un crash)." },

{ id:"n1-sql-02", lvl:1, dom:"SQL",
  q:"Différence entre <code>INNER JOIN</code> et <code>LEFT JOIN</code> ?",
  accept:["correspondance des deux","seulement les lignes qui matchent","toutes les lignes de gauche","null a droite"],
  explain:"INNER JOIN ne garde que les lignes ayant une correspondance des deux côtés. LEFT JOIN garde TOUTES les lignes de la table de gauche, en remplissant de NULL quand il n'y a pas de correspondance à droite — d'où son usage pour trouver les orphelins (<code>WHERE b.id IS NULL</code>)." },

{ id:"n1-linux-05", lvl:1, dom:"Linux",
  q:"Quelle différence entre une variable shell et une variable d'environnement ?",
  accept:["export","heritee","processus enfant","transmise"],
  explain:"Une variable shell n'existe que dans le shell courant. <code>export VAR=x</code> la promeut en variable d'environnement : elle est alors héritée par les processus enfants. C'est exactement ce mécanisme qui transporte la config dans les conteneurs (12-factor)." },

{ id:"n1-docker-03", lvl:1, dom:"Docker",
  q:"Que se passe-t-il pour les données écrites dans le système de fichiers d'un conteneur quand il est supprimé ?",
  accept:["perdues","ephemere","disparaissent","volume"],
  explain:"Elles sont perdues : la couche d'écriture est liée au cycle de vie du conteneur. Pour persister il faut un volume (nommé ou bind mount), ou du stockage externe. Corollaire : un conteneur doit être stateless par défaut." },

{ id:"n1-k8s-03", lvl:1, dom:"Kubernetes",
  q:"Qu'est-ce qu'un namespace Kubernetes, et qu'est-ce qu'il n'isole PAS ?",
  accept:["cloisonnement logique","separation logique","pas le reseau","pas d isolation reseau","quotas"],
  explain:"C'est un cloisonnement LOGIQUE des objets (noms uniques par namespace, quotas, RBAC). Il n'isole PAS le réseau par défaut : un Pod du namespace A joint un Pod du namespace B, sauf NetworkPolicy. Il n'isole pas non plus les nœuds ni les objets cluster-scoped (Node, PV, ClusterRole)." },

{ id:"n1-tf-04", lvl:1, dom:"Terraform",
  q:"Que fait <code>terraform init</code> exactement ?",
  accept:["telecharge les providers","initialise le backend","modules","plugins"],
  explain:"Il initialise le répertoire de travail : téléchargement des providers et des modules, configuration du backend de state, création du lock file <code>.terraform.lock.hcl</code>. Obligatoire au premier usage et après tout changement de provider/backend/module." },

{ id:"n1-git-03", lvl:1, dom:"Git",
  q:"Qu'est-ce qu'un commit Git, techniquement ?",
  accept:["instantane","snapshot","pointeur","arbre","hash","parent"],
  explain:"Un objet immuable identifié par un SHA-1/SHA-256, contenant : un pointeur vers un arbre (l'instantané complet du projet), le ou les parents, l'auteur, la date et le message. Git stocke des instantanés, pas des diffs — les diffs sont calculés à l'affichage." }

]);

<script>
/* data/niveau02.js */
window.QBANK = (window.QBANK || []).concat([
/* ================= NIVEAU 2 — BASES OPÉRATIONNELLES ================= */

{ id:"n2-linux-01", lvl:2, dom:"Linux",
  q:"Un process tourne mais tu ne sais pas quel port il écoute. Quelle commande et quelles options ?",
  accept:["ss -tulnp","netstat -tulnp","ss -lntp","lsof -i"],
  explain:"<code>ss -tulnp</code> (t=TCP, u=UDP, l=listening, n=numérique sans résolution DNS, p=processus). <code>lsof -i :8080</code> fait l'inverse : du port vers le process. <code>netstat</code> est déprécié mais encore demandé en entretien." },

{ id:"n2-linux-02", lvl:2, dom:"Linux",
  q:"Un disque est plein d'après <code>df -h</code> mais <code>du -sh</code> ne trouve rien. Quelle explication classique ?",
  accept:["fichier supprime encore ouvert","deleted","descripteur ouvert","inode","process tient le fichier"],
  explain:"Un fichier supprimé mais toujours ouvert par un process : l'inode n'est libéré qu'à la fermeture du descripteur. <code>lsof | grep deleted</code> le révèle ; il faut redémarrer le process (souvent un log rotaté à la sauvage). Autre piste : inodes épuisés (<code>df -i</code>)." },

{ id:"n2-linux-03", lvl:2, dom:"Linux",
  q:"Quelle est la différence entre <code>SIGTERM</code> et <code>SIGKILL</code> ?",
  accept:["term peut etre intercepte","gracieux","kill non interceptable","9 immediat","arret propre"],
  explain:"SIGTERM (15) est interceptable : le process peut fermer ses connexions, flusher ses buffers et sortir proprement. SIGKILL (9) est traité par le noyau, non interceptable, non ignorable — arrêt brutal, risque de corruption. C'est exactement la logique du <code>terminationGracePeriodSeconds</code> Kubernetes." },

{ id:"n2-linux-04", lvl:2, dom:"Linux",
  q:"À quoi sert <code>set -euo pipefail</code> en tête d'un script bash ?",
  must:[["e","erreur","echec"],["u","variable non definie","undefined"],["pipefail","pipe"]],
  explain:"<code>-e</code> arrête au premier échec, <code>-u</code> échoue sur une variable non définie (évite <code>rm -rf $DIR/</code> avec DIR vide), <code>pipefail</code> fait remonter l'échec de n'importe quelle commande d'un pipeline au lieu de ne regarder que la dernière. Réflexe obligatoire sur un script de CI." },

{ id:"n2-linux-05", lvl:2, dom:"Linux",
  q:"Comment trouver les 10 plus gros fichiers sous <code>/var</code> ?",
  accept:["du -a","sort -rh","find -size","du -h | sort"],
  explain:"<code>du -ah /var | sort -rh | head -10</code>, ou <code>find /var -type f -printf '%s %p\\n' | sort -rn | head</code>. Le <code>-h</code> de <code>sort</code> comprend les suffixes K/M/G." },

{ id:"n2-git-01", lvl:2, dom:"Git",
  q:"Différence entre <code>git merge</code> et <code>git rebase</code> — et le risque du rebase ?",
  accept:["reecrit l historique","nouveaux hash","historique lineaire","commit de merge","jamais sur une branche partagee"],
  explain:"<code>merge</code> crée un commit de fusion et préserve l'histoire réelle. <code>rebase</code> rejoue tes commits au-dessus de la cible : historique linéaire, mais NOUVEAUX hash. Donc jamais de rebase sur une branche déjà partagée/poussée, sinon les collègues divergent." },

{ id:"n2-git-02", lvl:2, dom:"Git",
  q:"Tu as commité un secret puis fait un <code>git revert</code>. Le secret est-il protégé ?",
  accept:["non","toujours dans l historique","reste accessible","revoquer"],
  explain:"Non — <code>revert</code> ajoute un commit qui annule l'effet, mais le blob reste dans l'historique et reste récupérable. Il faut réécrire l'historique (<code>git filter-repo</code>, BFG), forcer le push, purger les forks/caches… et surtout RÉVOQUER le secret : c'est la seule action qui compte vraiment." },

{ id:"n2-git-03", lvl:2, dom:"Git",
  q:"Différence entre <code>git reset --soft</code>, <code>--mixed</code> et <code>--hard</code> ?",
  must:[["soft"],["mixed","index"],["hard"]],
  explain:"<code>--soft</code> déplace HEAD, garde index + working tree (pour re-commiter autrement). <code>--mixed</code> (défaut) déplace HEAD et vide l'index, garde les fichiers modifiés. <code>--hard</code> écrase tout, y compris le travail non commité — irréversible sauf via le reflog." },

{ id:"n2-docker-01", lvl:2, dom:"Docker",
  q:"Différence entre <code>CMD</code> et <code>ENTRYPOINT</code> dans un Dockerfile ?",
  accept:["entrypoint executable","cmd arguments par defaut","cmd remplacable","surcharge"],
  explain:"ENTRYPOINT définit l'exécutable fixe du conteneur ; CMD fournit les arguments par défaut, remplaçables par ceux passés à <code>docker run</code>. Combo usuel : <code>ENTRYPOINT [\"nginx\"]</code> + <code>CMD [\"-g\",\"daemon off;\"]</code>. Toujours en forme exec (JSON) pour recevoir les signaux." },

{ id:"n2-docker-02", lvl:2, dom:"Docker",
  q:"Pourquoi place-t-on <code>COPY package.json</code> puis <code>RUN npm install</code> AVANT <code>COPY . .</code> ?",
  accept:["cache","couches","layer cache","invalidation","reutilisation"],
  explain:"Pour le cache de couches : tant que <code>package.json</code> ne change pas, la couche d'installation des dépendances est réutilisée. Si on copiait tout le code d'abord, la moindre modification d'un fichier source invaliderait le cache et relancerait un <code>npm install</code> complet." },

{ id:"n2-docker-03", lvl:2, dom:"Docker",
  q:"Qu'apporte un build multi-stage, concrètement ?",
  accept:["image finale legere","sans outils de build","separer compilation","surface d attaque","copie l artefact"],
  explain:"On compile dans une image lourde (SDK, compilateur, dépendances de build) puis on ne copie que l'artefact final dans une image runtime minimale. Résultat : image beaucoup plus petite, sans compilateur ni sources — donc surface d'attaque et temps de pull réduits." },

{ id:"n2-k8s-01", lvl:2, dom:"Kubernetes",
  q:"Quelle est la chaîne d'objets entre un Deployment et un Pod ?",
  accept:["replicaset","deployment cree un replicaset","rs"],
  explain:"Deployment → ReplicaSet → Pods. Le Deployment gère les versions et le rollout ; il crée un NOUVEAU ReplicaSet à chaque changement de template et fait varier les réplicas des deux RS. Les anciens RS sont conservés (<code>revisionHistoryLimit</code>) pour permettre le rollback." },

{ id:"n2-k8s-02", lvl:2, dom:"Kubernetes",
  q:"Différence entre une liveness probe et une readiness probe ?",
  accept:["liveness redemarre","readiness retire du service","endpoints","trafic"],
  explain:"Liveness : si elle échoue, kubelet REDÉMARRE le conteneur (il est bloqué). Readiness : si elle échoue, le Pod est retiré des Endpoints du Service — il ne reçoit plus de trafic mais reste vivant. Mettre une liveness trop agressive au démarrage = boucle de redémarrage : c'est le rôle de la startupProbe." },

{ id:"n2-k8s-03", lvl:2, dom:"Kubernetes",
  q:"Différence entre un ConfigMap et un Secret ? Le Secret est-il chiffré ?",
  accept:["base64","pas chiffre","encode","non chiffre par defaut","encryption at rest"],
  explain:"Même usage (injecter de la config), mais un Secret est seulement encodé en base64 dans etcd — PAS chiffré par défaut. Il faut activer <code>EncryptionConfiguration</code> côté API server, ou externaliser (External Secrets Operator + Key Vault / Secrets Manager). Le RBAC sur les Secrets doit être strict." },

{ id:"n2-k8s-04", lvl:2, dom:"Kubernetes",
  q:"À quoi sert un label et en quoi diffère-t-il d'une annotation ?",
  accept:["selection","selector","identification","annotation non selectionnable","metadonnee"],
  explain:"Les labels sont des paires clé/valeur indexées servant à SÉLECTIONNER des objets (Services, ReplicaSets, NetworkPolicies). Les annotations portent des métadonnées non sélectionnables et souvent volumineuses (config d'un ingress controller, checksum, outil externe)." },

{ id:"n2-tf-01", lvl:2, dom:"Terraform",
  q:"Que fait <code>terraform plan</code> et quelles sont les quatre actions possibles affichées ?",
  must:[["+","cree"],["-","detruit"],["~","modifie"]],
  explain:"Il rafraîchit l'état, compare config vs state et affiche un dry-run : <code>+</code> création, <code>-</code> destruction, <code>~</code> modification en place, <code>-/+</code> remplacement (destroy puis create). Aucun changement n'est appliqué. En CI, on sauvegarde le plan (<code>-out</code>) et on applique CE plan-là." },

{ id:"n2-tf-02", lvl:2, dom:"Terraform",
  q:"Pourquoi un backend distant est-il indispensable dès qu'on travaille à plusieurs ?",
  accept:["verrouillage","lock","state partage","concurrence","corruption"],
  explain:"Pour partager le state ET le verrouiller : sans lock, deux <code>apply</code> simultanés corrompent le state ou créent des ressources en double. S3 + DynamoDB (ou S3 lockfile natif), azurerm avec bail de blob, ou HCP Terraform. Bonus : chiffrement au repos et versioning pour restaurer." },

{ id:"n2-tf-03", lvl:2, dom:"Terraform",
  q:"À quoi sert <code>.terraform.lock.hcl</code> et doit-il être commité ?",
  accept:["versions des providers","hash","commite","versionne","reproductible"],
  explain:"Il fige les versions exactes des providers et leurs empreintes de hachage. OUI, il se commite : c'est ce qui garantit que ton poste, celui du collègue et la CI utilisent strictement les mêmes providers. Ne pas le confondre avec le verrou de state." },

{ id:"n2-tf-04", lvl:2, dom:"Terraform",
  q:"Quelle différence entre une variable et un local dans Terraform ?",
  accept:["variable = entree","local = calcul","interne","pas surchargeable","expression"],
  explain:"Une <code>variable</code> est une entrée du module, fournie de l'extérieur (tfvars, -var, env). Un <code>local</code> est une valeur calculée interne, non surchargeable, qui sert à factoriser une expression répétée (naming, tags communs, conditions)." },

{ id:"n2-aws-01", lvl:2, dom:"AWS",
  q:"Qu'est-ce qui rend un subnet AWS « public » ?",
  accept:["route table","table de routage","route vers l igw","0.0.0.0/0"],
  explain:"Uniquement sa route table : une route <code>0.0.0.0/0 → igw-xxx</code>. Le nom du subnet n'a aucune valeur technique. Il faut aussi une IP publique sur l'instance (ou une EIP) pour être joignable de l'extérieur." },

{ id:"n2-aws-02", lvl:2, dom:"AWS",
  q:"Security Group vs NACL : cite les trois différences majeures.",
  must:[["instance","eni"],["subnet"],["stateful","stateless","etat"]],
  explain:"1) Niveau : SG sur l'ENI/instance, NACL sur le subnet. 2) État : SG stateful (le retour est autorisé automatiquement), NACL stateless (il faut une règle explicite dans chaque sens, ports éphémères compris). 3) Deny : SG allow uniquement, NACL supporte allow ET deny, avec des règles numérotées évaluées dans l'ordre." },

{ id:"n2-aws-03", lvl:2, dom:"AWS",
  q:"À quoi sert un IAM Role par rapport à un IAM User, et pourquoi le préférer sur EC2 ?",
  accept:["credentials temporaires","pas de cle statique","assume","identite endossable","rotation automatique"],
  explain:"Un rôle n'a pas de credentials permanents : on l'endosse (<code>AssumeRole</code>/STS) et on reçoit des credentials temporaires à rotation automatique. Sur EC2 (instance profile) ou EKS (IRSA), ça supprime les clés d'accès statiques codées en dur — la première cause de fuite en entreprise." },

{ id:"n2-az-01", lvl:2, dom:"Azure",
  q:"Différence entre un Service Principal et une Managed Identity ?",
  accept:["gere le secret","pas de secret","rotation automatique","azure gere","identite managee"],
  explain:"Les deux sont des identités applicatives. Le Service Principal demande de gérer un secret ou un certificat (stockage, rotation, expiration). La Managed Identity est gérée par Azure : pas de secret à manipuler, le token est récupéré via l'endpoint IMDS. Toujours préférer la Managed Identity quand la ressource est dans Azure." },

{ id:"n2-az-02", lvl:2, dom:"Azure",
  q:"Différence entre une Managed Identity system-assigned et user-assigned ?",
  accept:["liee au cycle de vie","supprimee avec la ressource","partagee","plusieurs ressources","independante"],
  explain:"System-assigned : créée avec la ressource, supprimée avec elle, 1:1. User-assigned : objet indépendant, réutilisable par plusieurs ressources, survit à leur suppression — indispensable quand tu veux préassigner les droits RBAC avant même de créer la VM (évite le poule/œuf en Terraform)." },

{ id:"n2-res-01", lvl:2, dom:"Réseau",
  q:"Décris le handshake TCP en trois temps.",
  must:[["syn"],["syn ack","syn-ack"],["ack"]],
  explain:"SYN (client → serveur, propose un numéro de séquence), SYN-ACK (serveur accuse et propose le sien), ACK (client accuse). Une connexion bloquée en SYN_SENT côté client, c'est presque toujours un firewall/SG qui DROP silencieusement — un REJECT donnerait un « connection refused » immédiat." },

{ id:"n2-res-02", lvl:2, dom:"Réseau",
  q:"Que se passe-t-il pendant un handshake TLS, en trois idées ?",
  must:[["certificat","cert"],["cle de session","symetrique","session key"]],
  explain:"1) Négociation de version et de suite cryptographique. 2) Le serveur présente son certificat, le client valide la chaîne jusqu'à une CA de confiance. 3) Échange de clés (ECDHE) pour dériver une clé de SESSION symétrique — l'asymétrique ne sert qu'à établir la confiance, le trafic est ensuite chiffré symétriquement." },

{ id:"n2-res-03", lvl:2, dom:"Réseau",
  q:"Différence entre un load balancer L4 et L7 ?",
  accept:["couche 4 tcp","couche 7 http","routage par url","inspecte le contenu","header"],
  explain:"L4 route sur IP/port sans lire le contenu (rapide, tout protocole TCP/UDP) : NLB, Azure LB. L7 comprend HTTP : routage par host/path/header, terminaison TLS, réécriture, sticky sessions, WAF : ALB, Application Gateway, Ingress." },

{ id:"n2-cicd-01", lvl:2, dom:"CI/CD",
  q:"Pourquoi un pipeline doit-il échouer VITE (fail fast) et dans quel ordre ranger les étapes ?",
  accept:["lint puis tests unitaires","du plus rapide","feedback rapide","le moins couteux d abord"],
  explain:"Pour donner un feedback en quelques minutes et ne pas gaspiller des runners. Ordre : lint/format → tests unitaires → build → scan sécurité/SAST → tests d'intégration → déploiement. Le moins coûteux et le plus discriminant d'abord." },

{ id:"n2-cicd-02", lvl:2, dom:"CI/CD",
  q:"Pourquoi ne jamais taguer une image de production en <code>latest</code> ?",
  accept:["non deterministe","pas reproductible","mutable","rollback impossible","quelle version"],
  explain:"<code>latest</code> est un tag mutable : deux pulls peuvent donner deux images différentes, on ne sait plus ce qui tourne et le rollback est impossible. On tague par version sémantique ou SHA de commit, et en prod on référence idéalement le digest immuable (<code>@sha256:…</code>)." },

{ id:"n2-sec-01", lvl:2, dom:"Sécurité",
  q:"Pourquoi ne pas passer un secret via une variable d'environnement de build Docker (<code>ARG</code>) ?",
  accept:["reste dans l historique","docker history","couche","inspectable","persiste dans l image"],
  explain:"L'ARG et les commandes RUN restent visibles dans l'historique des couches (<code>docker history</code>) : quiconque a l'image a le secret. Il faut utiliser BuildKit <code>--mount=type=secret</code>, ou injecter le secret au RUNTIME depuis un coffre." },

{ id:"n2-obs-01", lvl:2, dom:"Observabilité",
  q:"Pourquoi préfère-t-on des logs structurés (JSON) à du texte libre ?",
  accept:["parsable","indexable","requetable","champs","correlation"],
  explain:"Parce qu'ils sont directement indexables et requêtables par champ (level, service, trace_id, user_id) sans regex fragiles. Ça permet l'agrégation, l'alerting sur un champ et la corrélation avec les traces. Le texte libre casse dès qu'un dev change le format d'un message." },

{ id:"n2-sql-01", lvl:2, dom:"SQL",
  q:"À quoi sert un index, et quel est son coût ?",
  accept:["accelere la lecture","ralentit les ecritures","occupe de l espace","maintenu a chaque insert"],
  explain:"Il accélère les lectures en évitant le full scan (structure B-tree triée). Coût : espace disque, et surcoût sur chaque INSERT/UPDATE/DELETE car l'index doit être maintenu. D'où : indexer les colonnes de filtre/jointure réellement utilisées, pas tout." },

{ id:"n2-sre-01", lvl:2, dom:"SRE",
  q:"Qu'est-ce qu'un post-mortem « blameless » et pourquoi cette approche ?",
  accept:["sans blamer","cause systemique","pas de coupable","apprendre","processus"],
  explain:"On analyse l'incident en cherchant les causes systémiques (manque de garde-fou, alerte absente, procédure ambiguë) plutôt qu'un coupable. Objectif : que les gens rapportent les incidents sans peur. Chercher un coupable fait taire l'information et garantit la récidive." }

]);

</script>
<script>
/* data/niveau03.js */
window.QBANK = (window.QBANK || []).concat([
/* ================= NIVEAU 3 — USAGE QUOTIDIEN ================= */

{ id:"n3-linux-01", lvl:3, dom:"Linux",
  q:"La load average affiche <code>8.0</code> sur une machine à 4 cœurs. Est-ce forcément un problème CPU ?",
  accept:["non","iowait","attente disque","entrees sorties","uninterruptible","d state"],
  explain:"Non : sous Linux, la load compte les processus runnable ET ceux en attente ininterruptible (I/O disque, NFS). Une load de 8 sur 4 cœurs avec un CPU à 10 % = saturation I/O. Il faut croiser avec <code>%iowait</code> (<code>top</code>, <code>vmstat</code>, <code>iostat</code>)." },

{ id:"n3-linux-02", lvl:3, dom:"Linux",
  q:"Comment rendre un service persistant après reboot avec systemd, et comment lire ses logs ?",
  must:[["enable"],["journalctl"]],
  explain:"<code>systemctl enable --now mon.service</code> (enable = au boot, --now = démarre tout de suite). Logs : <code>journalctl -u mon.service -f</code>, avec <code>--since</code>, <code>-p err</code> pour filtrer la sévérité. <code>enable</code> sans <code>start</code> ne lance rien maintenant : piège classique." },

{ id:"n3-linux-03", lvl:3, dom:"Linux",
  q:"Quelle est la différence entre un hard link et un symlink ?",
  accept:["meme inode","pointe vers un chemin","lien cassé","traverse les systemes de fichiers","reference"],
  explain:"Un hard link est une seconde entrée de répertoire vers le MÊME inode : supprimer l'original ne casse rien, le contenu vit tant qu'il reste un lien. Un symlink stocke un CHEMIN : il devient un lien mort si la cible disparaît, mais peut traverser les systèmes de fichiers et pointer un répertoire." },

{ id:"n3-linux-04", lvl:3, dom:"Linux",
  q:"Que fait <code>grep -rn \"erreur\" . | awk '{print $1}' | sort | uniq -c | sort -rn</code> ?",
  accept:["compte","occurrences par fichier","classe","top fichiers"],
  explain:"Recherche récursive avec numéros de ligne, extraction du premier champ (fichier:ligne), tri, comptage des doublons puis tri décroissant : on obtient le classement des fichiers les plus bruyants. Le <code>sort</code> avant <code>uniq</code> est obligatoire — <code>uniq</code> ne dédoublonne que des lignes adjacentes." },

{ id:"n3-linux-05", lvl:3, dom:"Linux",
  q:"Différence entre <code>$@</code> et <code>$*</code> dans un script bash, et pourquoi les guillemets comptent ?",
  accept:["arguments separes","une seule chaine","preserve les espaces","tableau"],
  explain:"<code>\"$@\"</code> développe chaque argument comme un mot distinct (préserve les espaces dans les arguments) ; <code>\"$*\"</code> les concatène en une seule chaîne. Règle : toujours <code>\"$@\"</code> pour relayer des arguments." },

{ id:"n3-git-01", lvl:3, dom:"Git",
  q:"Explique le workflow GitFlow et pourquoi beaucoup d'équipes lui préfèrent le trunk-based.",
  accept:["branches longues","develop release hotfix","merges douloureux","integration continue","branches courtes"],
  explain:"GitFlow : main + develop + feature/release/hotfix. Rigoureux mais les branches vivent longtemps → gros merges, intégration tardive, feedback lent. Le trunk-based garde des branches de quelques heures fusionnées dans main, avec feature flags pour cacher l'inachevé : c'est ce qui rend la CI réellement continue." },

{ id:"n3-git-02", lvl:3, dom:"Git",
  q:"Tu as fait un <code>git reset --hard</code> et perdu deux commits. Récupérable ?",
  accept:["reflog","git reflog","oui"],
  explain:"Oui : <code>git reflog</code> conserve l'historique local des positions de HEAD (~90 jours par défaut). Tu retrouves le SHA puis <code>git reset --hard &lt;sha&gt;</code> ou <code>git cherry-pick</code>. Ne fonctionne que localement et seulement pour du travail déjà commité." },

{ id:"n3-git-03", lvl:3, dom:"Git",
  q:"À quoi sert <code>git cherry-pick</code> et quel est son principal inconvénient ?",
  accept:["un commit precis","copie","duplique","autre hash","doublon a la fusion"],
  explain:"Il rejoue un commit précis sur une autre branche (typiquement un hotfix vers une branche de release). Inconvénient : ça DUPLIQUE le changement avec un hash différent — au moment de fusionner les branches, on peut se retrouver avec des conflits ou une double application." },

{ id:"n3-docker-01", lvl:3, dom:"Docker",
  q:"Pourquoi faire tourner un conteneur en non-root, et comment ?",
  accept:["useradd","user","reduire l impact","escalade","uid"],
  explain:"Pour limiter l'impact d'une évasion ou d'une RCE : root dans le conteneur = souvent root sur l'hôte si le user namespace n'est pas remappé. On crée un utilisateur dans le Dockerfile puis <code>USER 10001</code>, et côté K8s <code>runAsNonRoot: true</code>, <code>readOnlyRootFilesystem: true</code>, <code>drop ALL capabilities</code>." },

{ id:"n3-docker-02", lvl:3, dom:"Docker",
  q:"Différence entre un bind mount et un volume nommé ?",
  accept:["chemin de l hote","gere par docker","portable","dependance au chemin"],
  explain:"Bind mount = un chemin de l'hôte monté dans le conteneur : pratique en dev, mais dépendant de l'arborescence de la machine et des permissions. Volume nommé = géré par Docker dans son espace, portable, sauvegardable, pilotable par des drivers (NFS, cloud). En prod : volume ou stockage externe." },

{ id:"n3-docker-03", lvl:3, dom:"Docker",
  q:"Ton conteneur ne s'arrête pas avec <code>docker stop</code> et met 10 s. Pourquoi ?",
  accept:["pid 1","ne recoit pas le signal","shell form","sigterm ignore","exec form"],
  explain:"Le process PID 1 ne gère pas SIGTERM. Typiquement parce que le CMD est en forme shell : c'est <code>/bin/sh -c</code> qui est PID 1 et il ne relaie pas les signaux. Solution : forme exec (JSON), un init léger (<code>tini</code>, <code>--init</code>) ou un handler de signal dans l'app. Après le timeout, Docker envoie SIGKILL." },

{ id:"n3-k8s-01", lvl:3, dom:"Kubernetes",
  q:"Un Pod reste en <code>Pending</code>. Cite trois causes possibles et comment tu les distingues.",
  must:[["ressource","cpu","memoire","insufficient"],["describe","event"]],
  explain:"<code>kubectl describe pod</code> et on lit les Events : 1) pas de nœud avec assez de CPU/mémoire, 2) taints sans toleration / nodeSelector ou affinity impossible à satisfaire, 3) PVC non lié (pas de StorageClass ou pas de volume dispo). Plus rare : quota de namespace atteint." },

{ id:"n3-k8s-02", lvl:3, dom:"Kubernetes",
  q:"Différence entre <code>CrashLoopBackOff</code> et <code>ImagePullBackOff</code> ?",
  accept:["demarre et plante","image introuvable","registry","droits de pull","redemarrage en boucle"],
  explain:"CrashLoopBackOff : le conteneur démarre puis se termine en boucle — bug applicatif, config manquante, liveness trop stricte ; on lit <code>kubectl logs --previous</code>. ImagePullBackOff : l'image n'a pas pu être téléchargée — tag inexistant, registry privé sans imagePullSecret, ou problème réseau/proxy." },

{ id:"n3-k8s-03", lvl:3, dom:"Kubernetes",
  q:"Différence entre requests et limits, et laquelle sert au scheduling ?",
  accept:["requests pour le scheduling","limits plafond","garantie","oomkill","throttle"],
  explain:"Les <code>requests</code> sont ce que le scheduler réserve pour placer le Pod (garantie minimale). Les <code>limits</code> sont un plafond : dépassement CPU = throttling, dépassement mémoire = OOMKill immédiat. La mémoire n'est pas compressible, contrairement au CPU." },

{ id:"n3-k8s-04", lvl:3, dom:"Kubernetes",
  q:"Quels sont les types de Service et à quoi sert chacun ?",
  must:[["clusterip"],["nodeport"],["loadbalancer"]],
  explain:"ClusterIP (défaut) : IP interne au cluster. NodePort : ouvre un port (30000-32767) sur chaque nœud. LoadBalancer : provisionne un LB cloud qui pointe vers le NodePort. ExternalName : simple alias DNS CNAME. En prod on expose plutôt via un Ingress/Gateway devant un seul LoadBalancer." },

{ id:"n3-k8s-05", lvl:3, dom:"Kubernetes",
  q:"Différence entre un Deployment et un StatefulSet ?",
  accept:["identite stable","nom ordonne","pvc par pod","ordre de demarrage","dns stable"],
  explain:"Le Deployment traite ses Pods comme du bétail interchangeable (noms aléatoires, ordre quelconque). Le StatefulSet donne une identité stable : noms ordinaux (<code>db-0</code>, <code>db-1</code>), DNS stable via un headless Service, un PVC dédié par Pod, démarrage/arrêt ordonnés. Pour les bases, brokers, clusters à quorum." },

{ id:"n3-tf-01", lvl:3, dom:"Terraform",
  q:"Explique la différence entre <code>count</code> et <code>for_each</code> et pourquoi ça compte au moment d'une suppression.",
  accept:["index","cle","decalage","recree","identifiant stable"],
  explain:"<code>count</code> indexe par position : supprimer l'élément 1 sur 3 décale tout et Terraform veut détruire/recréer les suivants. <code>for_each</code> indexe par CLÉ (map ou set) : chaque ressource a une adresse stable, la suppression n'affecte que l'entrée concernée. Règle : for_each dès que les éléments sont distincts." },

{ id:"n3-tf-02", lvl:3, dom:"Terraform",
  q:"Comment intégrer dans Terraform une ressource déjà créée à la main ?",
  accept:["terraform import","import block","importer"],
  explain:"<code>terraform import addr id</code> (ou un bloc <code>import</code> déclaratif depuis la 1.5, qui a l'avantage d'être revu en plan et versionné). L'import ne génère PAS le code : il faut écrire la ressource, importer, puis lancer un plan jusqu'à obtenir « no changes »." },

{ id:"n3-tf-03", lvl:3, dom:"Terraform",
  q:"À quoi servent <code>depends_on</code> et pourquoi l'utilise-t-on rarement ?",
  accept:["dependance explicite","implicite","reference","graphe"],
  explain:"Terraform déduit le graphe de dépendances des RÉFÉRENCES entre ressources — c'est implicite et suffisant à 95 %. <code>depends_on</code> ne sert que pour une dépendance non exprimable par une référence (ex : une policy IAM doit exister avant qu'une app l'utilise). En abuser sérialise inutilement et ralentit l'apply." },

{ id:"n3-tf-04", lvl:3, dom:"Terraform",
  q:"Comment gère-t-on plusieurs environnements (dev/rec/prod) avec Terraform ? Cite deux approches et leurs limites.",
  accept:["workspace","repertoires separes","tfvars","backend distinct"],
  explain:"1) Workspaces : un seul backend, un state par workspace — simple mais même code, même backend, risque d'erreur d'environnement. 2) Répertoires/dépôts séparés avec backends distincts et un module commun paramétré : plus verbeux mais isolation réelle des states et des droits. En banque, on prend presque toujours la 2." },

{ id:"n3-aws-01", lvl:3, dom:"AWS",
  q:"Différence entre un rôle IAM, une policy identity-based et une policy resource-based ?",
  accept:["attachee a l identite","attachee a la ressource","bucket policy","cross account","principal"],
  explain:"Identity-based : attachée à un user/rôle, dit ce que CETTE identité peut faire. Resource-based : attachée à la ressource (bucket policy, KMS key policy, SQS), avec un champ <code>Principal</code> — c'est elle qui permet l'accès cross-compte sans AssumeRole. Une action est autorisée si l'une des deux l'autorise et qu'aucune ne la refuse." },

{ id:"n3-aws-02", lvl:3, dom:"AWS",
  q:"Quelles sont les classes de stockage S3 principales et sur quel critère on choisit ?",
  accept:["standard","infrequent access","glacier","frequence d acces","cout de restitution"],
  explain:"Standard (accès fréquent), Standard-IA / One Zone-IA (rare mais immédiat, coût de récupération), Intelligent-Tiering (bascule automatique), Glacier Instant/Flexible/Deep Archive (archivage, restitution de minutes à heures). Critère : fréquence d'accès et tolérance au délai de restitution. On automatise avec des lifecycle policies." },

{ id:"n3-aws-03", lvl:3, dom:"AWS",
  q:"Différence entre un ALB et un NLB, et quand prend-on un NLB ?",
  accept:["couche 7","couche 4","ip statique","tres haute performance","tcp"],
  explain:"ALB = L7 HTTP/HTTPS : routage par path/host, WAF, authentification, mais IP dynamiques. NLB = L4 : latence ultra-faible, millions de connexions, IP statique par AZ (ou EIP), préserve l'IP source, supporte TCP/UDP et TLS passthrough. On prend le NLB pour du non-HTTP, une IP fixe à whitelister, ou de la performance extrême." },

{ id:"n3-az-01", lvl:3, dom:"Azure",
  q:"Différence entre un NSG et un Azure Firewall ?",
  accept:["couche 3 4","stateful l7","fqdn","service manage","regles reseau"],
  explain:"Le NSG est un filtre L3/L4 gratuit attaché à un subnet ou une NIC (5-tuple, service tags). L'Azure Firewall est un service managé payant, centralisé, avec règles applicatives par FQDN, threat intelligence, SNAT/DNAT et journalisation complète — c'est lui qu'on met en hub dans une topologie hub-and-spoke." },

{ id:"n3-az-02", lvl:3, dom:"Azure",
  q:"À quoi sert un Private Endpoint et quel problème DNS crée-t-il ?",
  accept:["ip privee","sort du reseau public","private dns zone","resolution","vnet"],
  explain:"Il donne une IP PRIVÉE dans ton VNet à un service PaaS (Storage, SQL, Key Vault) : le trafic ne passe plus par internet. Piège : le FQDN public doit désormais résoudre vers l'IP privée — il faut une Private DNS Zone (<code>privatelink.blob.core.windows.net</code>) liée au VNet, sinon on retombe sur l'IP publique." },

{ id:"n3-az-03", lvl:3, dom:"Azure",
  q:"Différence entre Azure Policy et Azure RBAC ?",
  accept:["rbac qui peut faire","policy ce qui est autorise","conformite","proprietes de la ressource","deny"],
  explain:"Le RBAC contrôle QUI peut faire quoi (identité → action). Azure Policy contrôle CE QUI peut exister : elle évalue les propriétés des ressources (deny sans tag, deny hors région autorisée, deployIfNotExists pour forcer des diagnostics). Un Owner reste bloqué par une policy deny." },

{ id:"n3-cicd-01", lvl:3, dom:"CI/CD",
  q:"Pourquoi un runner de CI doit-il être éphémère ?",
  accept:["etat residuel","pollution","reproductible","isolation","secrets residuels"],
  explain:"Pour garantir la reproductibilité et la sécurité : pas de cache pollué, pas de dépendance installée par un job précédent, pas de secrets résiduels dans le filesystem. Un runner persistant devient un point de compromission latérale entre projets — d'où les runners conteneurisés jetables." },

{ id:"n3-cicd-02", lvl:3, dom:"CI/CD",
  q:"Qu'est-ce que le GitOps et qu'est-ce qui le distingue d'un pipeline push classique ?",
  accept:["git source de verite","reconciliation","pull","agent dans le cluster","argocd","flux"],
  explain:"L'état désiré est déclaré dans Git ; un agent DANS le cluster (Argo CD, Flux) tire et réconcilie en continu. Différences avec le push : pas de credentials cluster dans la CI, dérive détectée et corrigée automatiquement, rollback = revert Git, audit natif via l'historique." },

{ id:"n3-sec-01", lvl:3, dom:"Sécurité",
  q:"Comment gères-tu les secrets dans un pipeline CI/CD ? Cite le mécanisme le plus solide.",
  accept:["oidc","federation","coffre","key vault","secrets manager","token court"],
  explain:"Le plus solide : fédération d'identité OIDC entre le fournisseur CI et le cloud — le pipeline échange un token signé contre des credentials temporaires, aucun secret long terme stocké. Sinon : coffre (Key Vault, Secrets Manager, Vault) avec injection au runtime, masquage des logs et rotation." },

{ id:"n3-sec-02", lvl:3, dom:"Sécurité",
  q:"Qu'est-ce qu'un scan SAST, DAST et SCA ? Où les place-t-on dans le pipeline ?",
  must:[["code source","statique"],["execution","application qui tourne","dynamique"],["dependance","librairie","cve"]],
  explain:"SAST = analyse statique du code source (tôt, à chaque commit). SCA = analyse des dépendances et CVE connues (au build, + veille continue). DAST = test dynamique contre l'application déployée (en recette). On complète par le scan d'images et la détection de secrets en pre-commit." },

{ id:"n3-obs-01", lvl:3, dom:"Observabilité",
  q:"Pourquoi alerte-t-on sur les symptômes plutôt que sur les causes ?",
  accept:["impact utilisateur","bruit","trop d alertes","symptome","fatigue"],
  explain:"Alerter sur les causes (CPU à 90 %, un pod redémarré) génère du bruit et de la fatigue d'astreinte alors que le service va peut-être très bien. On alerte sur ce que l'utilisateur subit — latence, taux d'erreur, saturation, trafic (méthode RED/USE) — et on utilise les causes comme éléments de diagnostic dans le dashboard." },

{ id:"n3-sql-01", lvl:3, dom:"SQL",
  q:"Différence entre <code>WHERE</code> et <code>HAVING</code> ?",
  accept:["avant l agregation","apres le group by","filtre les groupes","agregat"],
  explain:"<code>WHERE</code> filtre les lignes AVANT l'agrégation ; <code>HAVING</code> filtre les GROUPES après le <code>GROUP BY</code> et peut donc porter sur une fonction d'agrégation (<code>HAVING COUNT(*) &gt; 5</code>). Pour la performance, filtrer un maximum dans le WHERE." },

{ id:"n3-sre-01", lvl:3, dom:"SRE",
  q:"Qu'est-ce que le toil au sens SRE, et quel est l'objectif chiffré classique ?",
  accept:["tache manuelle","repetitive","automatisable","sans valeur durable","50"],
  explain:"Le toil = travail manuel, répétitif, automatisable, sans valeur durable, qui croît linéairement avec le service. Google fixe la limite à 50 % du temps d'un SRE ; au-delà, on arrête les nouveautés pour automatiser. C'est un argument très utile en entretien pour justifier un investissement d'outillage." }

]);

</script>
<script>
/* data/niveau04.js */
window.QBANK = (window.QBANK || []).concat([
/* ================= NIVEAU 4 — INTERMÉDIAIRE ================= */

{ id:"n4-k8s-01", lvl:4, dom:"Kubernetes",
  q:"Décris le chemin complet d'un <code>kubectl apply -f deploy.yaml</code> jusqu'au conteneur qui tourne.",
  must:[["api server","apiserver"],["etcd"],["scheduler"],["kubelet"]],
  explain:"kubectl → API server (authN, authZ RBAC, admission controllers mutating puis validating) → persistance dans etcd → le Deployment controller crée un ReplicaSet → le ReplicaSet controller crée les Pods (sans nœud) → le scheduler leur assigne un nœud → le kubelet du nœud demande au container runtime (containerd via CRI) de démarrer les conteneurs → le kubelet remonte le statut à l'API server." },

{ id:"n4-k8s-02", lvl:4, dom:"Kubernetes",
  q:"Comment fonctionne un rolling update, et quel rôle jouent <code>maxSurge</code> et <code>maxUnavailable</code> ?",
  accept:["progressivement","nouveau replicaset","pods en plus","pods indisponibles","sans coupure"],
  explain:"Le Deployment crée un nouveau ReplicaSet et transfère progressivement les réplicas. <code>maxSurge</code> = combien de Pods EN PLUS du nominal on autorise temporairement ; <code>maxUnavailable</code> = combien peuvent manquer. maxUnavailable=0 + maxSurge=1 donne un déploiement sans perte de capacité, mais plus lent et il faut de la marge sur le cluster." },

{ id:"n4-k8s-03", lvl:4, dom:"Kubernetes",
  q:"À quoi sert un PodDisruptionBudget et contre quoi ne protège-t-il PAS ?",
  accept:["disruption volontaire","drain","minavailable","pas les crashs","pas involontaire"],
  explain:"Il garantit un nombre minimal de Pods disponibles pendant les disruptions VOLONTAIRES : <code>kubectl drain</code>, upgrade de nœuds, autoscaler qui réduit. Il ne protège pas des disruptions involontaires (crash de nœud, OOMKill, panne matérielle). Sans PDB, un upgrade de node pool peut vider ton service entier." },

{ id:"n4-k8s-04", lvl:4, dom:"Kubernetes",
  q:"Différence entre taints/tolerations et nodeAffinity ?",
  accept:["le noeud repousse","le pod attire","exclusion","preference","repulsion"],
  explain:"Taint = le NŒUD repousse les Pods sauf ceux qui ont la toleration correspondante (mécanisme d'exclusion : nœuds GPU, nœuds système). nodeAffinity = le POD exprime où il veut aller (attraction, avec required ou preferred). Les deux se combinent : la toleration autorise, l'affinity dirige." },

{ id:"n4-k8s-05", lvl:4, dom:"Kubernetes",
  q:"Comment le DNS interne résout-il un Service ? Donne le FQDN complet.",
  accept:["svc.namespace.svc.cluster.local","coredns","cluster.local"],
  explain:"<code>&lt;service&gt;.&lt;namespace&gt;.svc.cluster.local</code>, résolu par CoreDNS. Depuis le même namespace, le nom court suffit grâce au <code>search</code> du <code>/etc/resolv.conf</code> injecté. Un headless Service (<code>clusterIP: None</code>) renvoie directement les IP des Pods, d'où <code>db-0.db.default.svc.cluster.local</code> pour un StatefulSet." },

{ id:"n4-k8s-06", lvl:4, dom:"Kubernetes",
  q:"Qu'est-ce qu'un Ingress et pourquoi un objet Ingress seul ne fait rien ?",
  accept:["controller","besoin d un controleur","regles de routage","nginx","juste une declaration"],
  explain:"L'Ingress n'est qu'une déclaration de règles de routage HTTP (host/path → Service). Il faut un Ingress Controller (ingress-nginx, Traefik, AGIC, ALB Controller) qui les lit et configure un vrai reverse proxy. Sans controller, l'objet existe mais rien ne route. La Gateway API est le successeur normalisé." },

{ id:"n4-k8s-07", lvl:4, dom:"Kubernetes",
  q:"Comment donner à un Pod le droit d'appeler l'API Kubernetes, sans lui donner trop de droits ?",
  must:[["serviceaccount"],["role","rolebinding","rbac"]],
  explain:"Un ServiceAccount dédié au Pod + un Role (namespacé) ou ClusterRole limité aux verbes/ressources nécessaires, lié par un RoleBinding. Jamais le SA <code>default</code>, jamais <code>cluster-admin</code>, et <code>automountServiceAccountToken: false</code> quand le Pod n'appelle pas l'API." },

{ id:"n4-tf-01", lvl:4, dom:"Terraform",
  q:"Que fait <code>terraform state rm</code> et dans quel cas l'utilise-t-on ?",
  accept:["retire du state","sans detruire","cesse de gerer","migration"],
  explain:"Il retire une ressource du state SANS la détruire dans le cloud : Terraform cesse de la gérer. Cas d'usage : sortir une ressource pour la déplacer vers un autre state/module, ou abandonner la gestion d'un objet repris par une autre équipe. Un <code>apply</code> ensuite voudra la recréer si elle est encore dans le code." },

{ id:"n4-tf-02", lvl:4, dom:"Terraform",
  q:"À quoi sert le bloc <code>moved</code> et pourquoi c'est mieux que <code>terraform state mv</code> ?",
  accept:["renommer sans detruire","refactoring","declaratif","versionne","revue"],
  explain:"Il déclare dans le CODE qu'une ressource a changé d'adresse (renommage, passage en module, count → for_each). Avantages sur <code>state mv</code> : c'est versionné, revu en PR, visible dans le plan et rejoué automatiquement par tous les collaborateurs et la CI — pas une commande manuelle à reproduire partout." },

{ id:"n4-tf-03", lvl:4, dom:"Terraform",
  q:"Explique <code>lifecycle { prevent_destroy }</code>, <code>create_before_destroy</code> et <code>ignore_changes</code>.",
  must:[["prevent","bloque","empeche"],["avant de detruire","cree d abord"],["ignore"]],
  explain:"<code>prevent_destroy</code> : l'apply échoue si le plan veut détruire la ressource (base de données prod). <code>create_before_destroy</code> : crée le remplaçant avant de supprimer l'ancien (évite la coupure, attention aux noms uniques). <code>ignore_changes</code> : Terraform ignore la dérive sur certains attributs modifiés hors Terraform (tags posés par un outil, nombre d'instances géré par un autoscaler)." },

{ id:"n4-tf-04", lvl:4, dom:"Terraform",
  q:"Comment structures-tu un module Terraform réutilisable ? Que doit-il exposer et ne pas faire ?",
  must:[["variable","input"],["output"]],
  explain:"Fichiers <code>main.tf</code>/<code>variables.tf</code>/<code>outputs.tf</code>/<code>versions.tf</code>, variables typées avec description et validation, outputs pour tout ce dont l'appelant a besoin. Un module ne doit PAS déclarer de <code>provider</code> ni de <code>backend</code> (c'est le rôle du root module), et doit rester agnostique de l'environnement." },

{ id:"n4-tf-05", lvl:4, dom:"Terraform",
  q:"Que se passe-t-il si deux pipelines lancent <code>terraform apply</code> en même temps sur le même state ?",
  accept:["lock","verrou","le second attend","erreur de verrouillage","corruption sans lock"],
  explain:"Avec un backend qui supporte le locking, le second obtient une erreur de verrouillage (ou attend) — c'est le comportement voulu. Sans lock, les deux écrivent le state et l'un écrase l'autre : ressources orphelines et state incohérent. Un lock resté coincé se libère avec <code>terraform force-unlock &lt;id&gt;</code>, après avoir vérifié qu'aucun apply ne tourne." },

{ id:"n4-aws-01", lvl:4, dom:"AWS",
  q:"Un rôle IAM autorise <code>s3:GetObject</code> mais l'appel échoue en AccessDenied. Cite trois causes possibles.",
  must:[["bucket policy","resource"],["kms","chiffrement","scp","boundary"]],
  explain:"1) La bucket policy (ou un Block Public Access / une SCP d'organisation) refuse explicitement — un Deny gagne toujours. 2) L'objet est chiffré en KMS et le rôle n'a pas <code>kms:Decrypt</code> sur la clé. 3) Une permission boundary ou une session policy réduit les droits effectifs. On tranche avec le IAM Policy Simulator et CloudTrail." },

{ id:"n4-aws-02", lvl:4, dom:"AWS",
  q:"Explique l'ordre d'évaluation d'une décision IAM.",
  accept:["deny explicite gagne","deny par defaut","allow explicite","implicite"],
  explain:"1) Deny par défaut. 2) Un Deny EXPLICITE (SCP, policy, bucket policy, boundary) l'emporte toujours et arrête l'évaluation. 3) Sinon, un Allow explicite doit exister dans l'intersection des SCP / boundary / identity policy (ou dans une resource policy). Sans Allow, c'est refusé." },

{ id:"n4-aws-03", lvl:4, dom:"AWS",
  q:"Différence entre Auto Scaling Group et Elastic Load Balancer — et pourquoi les deux ensemble ?",
  accept:["capacite","repartition","health check","ajoute des instances","distribue le trafic"],
  explain:"L'ASG gère la CAPACITÉ (nombre d'instances, remplacement des instances non saines, scaling par métrique). L'ELB gère la RÉPARTITION du trafic. Ensemble : l'ASG enregistre automatiquement les nouvelles instances dans le target group, et peut utiliser le health check ELB pour décider qu'une instance est à remplacer." },

{ id:"n4-aws-04", lvl:4, dom:"AWS",
  q:"Qu'est-ce qu'un VPC Endpoint et quelle différence entre Gateway et Interface endpoint ?",
  accept:["sans passer par internet","route table","eni privee","privatelink","s3 dynamodb"],
  explain:"Il permet d'atteindre un service AWS sans sortir sur internet. Gateway endpoint : uniquement S3 et DynamoDB, gratuit, s'ajoute comme une ROUTE dans la route table. Interface endpoint (PrivateLink) : une ENI avec IP privée dans ton subnet, payant à l'heure et au Go, disponible pour la plupart des services." },

{ id:"n4-aws-05", lvl:4, dom:"AWS",
  q:"Quelle est la différence entre un snapshot EBS et une AMI ?",
  accept:["ami inclut","metadonnees","bloc","volume","bootable"],
  explain:"Un snapshot EBS est une copie incrémentale d'UN volume, stockée dans S3. Une AMI est un modèle de lancement complet : un ou plusieurs snapshots + les métadonnées (architecture, mode de virtualisation, mapping des devices, noyau) qui rendent l'ensemble bootable." },

{ id:"n4-az-01", lvl:4, dom:"Azure",
  q:"Comment une App Service accède-t-elle à un Key Vault sans stocker de secret ?",
  must:[["managed identity","identite manageee"],["access policy","rbac","role"]],
  explain:"On active une Managed Identity sur l'App Service, on lui donne le rôle <code>Key Vault Secrets User</code> (RBAC, ou une access policy sur les coffres anciens), puis on référence le secret dans les app settings via <code>@Microsoft.KeyVault(SecretUri=…)</code>. Aucun secret dans le code ni dans la config." },

{ id:"n4-az-02", lvl:4, dom:"Azure",
  q:"Qu'est-ce qu'un deployment slot App Service et quel piège au moment du swap ?",
  accept:["preproduction","swap","warm up","sticky","parametres de slot"],
  explain:"Un slot est une instance parallèle de l'app (même plan) permettant de déployer, chauffer et tester avant un swap quasi instantané avec la prod — et de revenir en arrière en re-swappant. Piège : par défaut, les app settings SUIVENT le swap ; il faut cocher « deployment slot setting » (sticky) sur les paramètres spécifiques à l'environnement (chaînes de connexion, feature flags)." },

{ id:"n4-az-03", lvl:4, dom:"Azure",
  q:"Différence entre Azure AD (Entra ID) et Azure RBAC — un Global Administrator peut-il tout faire sur les ressources ?",
  accept:["plan de controle different","non","elevate access","annuaire","ressources"],
  explain:"Entra ID gère l'ANNUAIRE (identités, groupes, applications, rôles d'annuaire). Azure RBAC gère les droits sur les RESSOURCES Azure. Ce sont deux plans distincts : un Global Admin n'a par défaut aucun droit sur les ressources, il doit d'abord activer « Elevate access » pour devenir User Access Administrator à la racine." },

{ id:"n4-az-04", lvl:4, dom:"Azure",
  q:"Décris une topologie hub-and-spoke et ce qu'on met dans le hub.",
  accept:["peering","firewall","bastion","vpn gateway","services partages"],
  explain:"Un VNet hub connecté par peering à des VNets spokes (une app / une équipe / un environnement par spoke). Dans le hub : Azure Firewall, VPN/ExpressRoute Gateway, Bastion, DNS privé, éventuellement les Private Endpoints partagés. Les spokes ne se parlent pas directement : on force le transit par le hub via des UDR pour inspecter le trafic." },

{ id:"n4-cicd-01", lvl:4, dom:"CI/CD",
  q:"Explique un déploiement blue/green et son coût par rapport à un canary.",
  accept:["deux environnements","bascule","rollback instantane","double capacite","progressif"],
  explain:"Blue/green : deux environnements complets, on bascule tout le trafic d'un coup, rollback instantané en repointant — mais il faut payer la double capacité. Canary : on route un petit pourcentage vers la nouvelle version et on augmente progressivement selon les métriques — moins cher, mais plus long et il faut deux versions compatibles simultanément." },

{ id:"n4-cicd-02", lvl:4, dom:"CI/CD",
  q:"Comment gères-tu une migration de base de données incompatible dans un déploiement sans coupure ?",
  accept:["expand contract","retrocompatible","deux etapes","backward compatible","ajouter puis supprimer"],
  explain:"Pattern expand/contract : 1) EXPAND — on ajoute la nouvelle colonne/table sans rien casser, l'ancienne version continue de fonctionner. 2) On déploie le code qui écrit dans les deux et lit la nouvelle. 3) On migre les données. 4) CONTRACT — une fois toutes les instances migrées, on supprime l'ancienne colonne. Jamais de migration destructive dans le même déploiement que le code." },

{ id:"n4-cicd-03", lvl:4, dom:"CI/CD",
  q:"Qu'est-ce qu'un test flaky et comment le traites-tu ?",
  accept:["resultat non deterministe","aleatoire","quarantaine","isole","depend du temps"],
  explain:"Un test qui passe ou échoue sans changement de code (dépendance au temps, à l'ordre d'exécution, au réseau, à un état partagé). On ne le relance pas en boucle : on le met en quarantaine hors du pipeline bloquant, on ouvre un ticket, on corrige la cause. Un pipeline qu'on relance « pour voir » a perdu toute valeur de signal." },

{ id:"n4-linux-01", lvl:4, dom:"Linux",
  q:"Que sont les namespaces et les cgroups, et lequel fait quoi pour un conteneur ?",
  must:[["namespace","isolation","visibilite"],["cgroup","ressource","limite"]],
  explain:"Les namespaces isolent la VISION du process : pid, net, mnt, uts, ipc, user, cgroup — ce qu'il peut voir. Les cgroups limitent la CONSOMMATION : CPU, mémoire, I/O, nombre de pids. Un conteneur = un process normal avec des namespaces + des cgroups + un filesystem overlay. Rien de magique." },

{ id:"n4-linux-02", lvl:4, dom:"Linux",
  q:"Ton application est tuée sans log applicatif. Comment vérifies-tu que c'est l'OOM killer ?",
  accept:["dmesg","journalctl -k","oom-killer","kern.log","exit code 137"],
  explain:"<code>dmesg -T | grep -i oom</code> ou <code>journalctl -k</code> : le noyau logue « Out of memory: Killed process ». Côté conteneur, un exit code 137 (128+9 = SIGKILL) et <code>OOMKilled</code> dans <code>kubectl describe</code>. Ensuite on regarde si c'est la limite du cgroup ou la mémoire physique de l'hôte." },

{ id:"n4-res-01", lvl:4, dom:"Réseau",
  q:"Quelle différence entre un firewall qui DROP et un qui REJECT, et comment le diagnostiques-tu côté client ?",
  accept:["timeout","connection refused","silencieux","rst","icmp"],
  explain:"DROP jette le paquet sans réponse : le client attend et finit en TIMEOUT. REJECT renvoie un RST TCP ou un ICMP unreachable : le client obtient « connection refused » immédiatement. Donc : timeout → suspecte un SG/NSG/NACL ou une route ; refused → la route est bonne mais rien n'écoute sur le port." },

{ id:"n4-res-02", lvl:4, dom:"Réseau",
  q:"Qu'est-ce que le MTU et quel symptôme typique donne un MTU mal réglé sur un tunnel VPN ?",
  accept:["taille maximale","fragmentation","petites requetes passent","gros paquets bloques","1500"],
  explain:"Le MTU est la taille max d'une trame (1500 en Ethernet, moins dans un tunnel à cause de l'encapsulation). Symptôme signature : les petites requêtes (ping, handshake) passent, mais les gros transferts se figent — les paquets pleins nécessitent une fragmentation refusée, souvent parce que l'ICMP « fragmentation needed » est bloqué (PMTUD cassé)." },

{ id:"n4-sec-01", lvl:4, dom:"Sécurité",
  q:"Qu'est-ce que le chiffrement au repos vs en transit, et pourquoi les deux ne suffisent pas ?",
  accept:["disque","reseau","tls","en memoire","cle","acces applicatif"],
  explain:"Au repos = données chiffrées sur le support (KMS/Key Vault, TDE, chiffrement de disque). En transit = TLS/mTLS sur le réseau. Ça ne protège pas d'un accès légitime détourné : si l'application ou l'identité qui a le droit de déchiffrer est compromise, tout est lisible. D'où IAM, segmentation, journalisation et chiffrement applicatif pour les données les plus sensibles." },

{ id:"n4-sec-02", lvl:4, dom:"Sécurité",
  q:"Qu'est-ce que mTLS et quand l'impose-t-on ?",
  accept:["authentification mutuelle","les deux presentent un certificat","service mesh","client aussi"],
  explain:"En TLS classique seul le serveur prouve son identité ; en mTLS le CLIENT présente aussi un certificat. On l'impose entre services internes (service mesh type Istio/Linkerd, zero trust), pour des API partenaires en banque, ou quand on ne veut pas dépendre d'un secret partagé. Coût : une PKI et une rotation de certificats à industrialiser." },

{ id:"n4-obs-01", lvl:4, dom:"Observabilité",
  q:"Explique la méthode RED et la méthode USE, et pour quoi chacune est faite.",
  must:[["rate","requete","debit"],["error","erreur"],["duration","latence"]],
  explain:"RED (services) : Rate (req/s), Errors (taux d'erreur), Duration (latence, en percentiles). USE (ressources) : Utilization, Saturation, Errors — pour CPU, mémoire, disque, réseau. RED répond « mes utilisateurs souffrent-ils ? », USE répond « quelle ressource est le goulot ? »." },

{ id:"n4-obs-02", lvl:4, dom:"Observabilité",
  q:"Pourquoi regarde-t-on le p95/p99 de latence plutôt que la moyenne ?",
  accept:["moyenne masque","valeurs extremes","queue","percentile","utilisateurs les plus lents"],
  explain:"La moyenne masque la queue de distribution : avec 99 requêtes à 50 ms et une à 10 s, la moyenne reste bonne alors qu'un utilisateur a une expérience catastrophique. Les percentiles décrivent l'expérience réelle des pires cas — et sur une page qui fait 20 appels, le p99 de chaque appel devient la norme pour l'utilisateur." },

{ id:"n4-sql-01", lvl:4, dom:"SQL",
  q:"Qu'est-ce qu'un deadlock en base et comment le résout-on structurellement ?",
  accept:["attente mutuelle","interblocage","ordre des verrous","transactions courtes","victime"],
  explain:"Deux transactions attendent chacune un verrou détenu par l'autre ; le SGBD en tue une (victime) et l'application doit rejouer. Structurellement : accéder aux ressources TOUJOURS dans le même ordre, garder les transactions courtes, réduire le niveau d'isolation si acceptable, et indexer pour verrouiller des lignes plutôt que des plages." },

{ id:"n4-sre-01", lvl:4, dom:"SRE",
  q:"Différence entre RTO et RPO ? Donne un exemple chiffré.",
  must:[["temps de reprise","duree d indisponibilite","recovery time"],["perte de donnees","recovery point"]],
  explain:"RTO = en combien de temps le service doit revenir. RPO = combien de données on accepte de perdre. Exemple : RTO 1 h / RPO 15 min → il faut des sauvegardes ou une réplication toutes les 15 min et une procédure de bascule tenant en une heure. Un RPO proche de zéro impose de la réplication synchrone, donc un coût et une latence." }

]);
