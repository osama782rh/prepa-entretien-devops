  {"id":"j2-6","lvl":5,"dom":"AWS","q":"Security Group : niveau instance ou niveau subnet ?","explain":"Security Group = niveau instance (ENI). NACL = niveau subnet.","accept":["instance"]},
  {"id":"j2-7","lvl":6,"dom":"AWS","q":"Une NACL peut-elle contenir des règles 'Deny' explicites, contrairement à un Security Group ?","explain":"Oui — les NACL supportent Allow ET Deny, avec des règles numérotées évaluées dans l'ordre. Un Security Group ne peut QUE autoriser (allow), jamais refuser explicitement.","accept":["oui"]},
  {"id":"j2-8","lvl":4,"dom":"AWS","q":"Qu'est-ce qu'une AMI ?","explain":"Amazon Machine Image : le template de départ d'une instance (OS + logiciels préinstallés). On peut créer sa propre AMI (golden image) pour déployer des instances identiques rapidement.","accept":["template","image machine","os préinstallé","golden image"]},
  {"id":"j2-9","lvl":5,"dom":"AWS","q":"Un script user_data s'exécute-t-il à nouveau après un simple <code>reboot</code> de l'instance ?","explain":"Non — user_data ne s'exécute qu'une seule fois, au tout premier démarrage. Le script doit donc être auto-suffisant en une passe ; pour du répétitif, utiliser systemd ou cron.","accept":["non"]},
  {"id":"j2-10","lvl":6,"dom":"AWS","q":"Dans un type d'instance comme <code>t3.micro</code>, que signifie la lettre <code>t</code> ?","explain":"t = burstable/économique (crédits CPU). m = général équilibré, c = compute-optimized, r = RAM-optimized.","accept":["burstable","économique"]},
  {"id":"j2-11","lvl":4,"dom":"AWS","q":"Tu perds ta clé privée SSH d'une instance EC2. Peux-tu encore te connecter en SSH directement avec la clé publique seule ?","explain":"Non — seule la clé privée permet l'authentification. Sans elle, plus d'accès SSH direct (il faudrait passer par un autre mécanisme comme EC2 Instance Connect ou reconfigurer via un volume détaché).","accept":["non"]},
  {"id":"j2-12","lvl":5,"dom":"AWS","q":"Pourquoi chmod 400 (et pas 600) est souvent recommandé pour un fichier .pem téléchargé une seule fois ?","explain":"400 = lecture seule pour le propriétaire, aucune écriture même pour lui-même — encore plus restrictif que 600, adapté à une clé qu'on ne modifie jamais après création.","accept":["lecture seule","pas d'écriture","plus restrictif"]},
  {"id":"j2-13","lvl":6,"dom":"AWS","q":"Dans une architecture VPC->EC2, dans quel ordre doit-on DÉTRUIRE les ressources (subnet, route table, IGW, VPC) ?","explain":"Du plus dépendant vers le plus général (inverse de la création) : instance -> route table -> subnet -> détacher IGW -> supprimer IGW -> VPC. Même logique que les role assignments Azure avant les role definitions.","accept":["du plus dépendant","spécifique vers général","inverse de la création"]}
]);

<script>
/* data/niveau01.js */
window.QBANK = (window.QBANK || []).concat([
/* ================= NIVEAU 1 — VOCABULAIRE & FONDATIONS ================= */

{ id:"n1-linux-01", lvl:1, dom:"Linux",
  q:"Que représente exactement le premier caractère de <code>drwxr-xr-x</code> dans une sortie <code>ls -l</code> ?",
  accept:["type","repertoire","dossier","directory","d pour"],
  explain:"C'est le TYPE de l'objet, pas une permission : <code>d</code> répertoire, <code>-</code> fichier ordinaire, <code>l</code> lien symbolique, <code>b</code>/<code>c</code> périphérique bloc/caractère, <code>s</code> socket, <code>p</code> pipe nommé." },

{ id:"n1-linux-02", lvl:1, dom:"Linux",
  q:"Traduis <code>chmod 640 fichier</code> en droits lisibles : qui peut faire quoi ?",
  must:[["proprietaire","owner","user"],["groupe","group"]],
  accept:["lecture ecriture","rw r","lit et ecrit"],
  explain:"6=rw- pour le propriétaire, 4=r-- pour le groupe, 0=--- pour les autres. Donc : le propriétaire lit et écrit, le groupe lit seulement, le reste du monde n'a aucun accès." },

{ id:"n1-linux-03", lvl:1, dom:"Linux",
  q:"Quelle est la différence entre <code>&gt;</code> et <code>&gt;&gt;</code> dans un shell ?",
  accept:["ecrase","remplace","truncate","ajoute a la fin","append"],
  explain:"<code>&gt;</code> écrase (truncate) le fichier cible, <code>&gt;&gt;</code> ajoute à la fin. Piège classique : <code>&gt;</code> vide le fichier même si la commande échoue ensuite." },

{ id:"n1-linux-04", lvl:1, dom:"Linux",
  q:"Que fait <code>2&gt;&amp;1</code> et pourquoi l'ordre <code>cmd &gt; f 2&gt;&amp;1</code> compte-t-il ?",
  accept:["stderr","erreur","descripteur 2","sortie d erreur"],
  explain:"Ça redirige stderr (fd 2) vers là où pointe stdout (fd 1) à cet instant. Écrit dans l'autre sens (<code>2&gt;&amp;1 &gt; f</code>), stderr part encore vers le terminal car il a copié la destination AVANT la redirection de stdout." },

{ id:"n1-git-01", lvl:1, dom:"Git",
  q:"Quelle est la différence fondamentale entre <code>git fetch</code> et <code>git pull</code> ?",
  accept:["pull = fetch + merge","fetch ne modifie pas","pull fusionne","merge automatique","rapatrie sans integrer"],
  explain:"<code>fetch</code> rapatrie les commits distants sans toucher à ta branche de travail. <code>pull</code> = <code>fetch</code> + <code>merge</code> (ou <code>rebase</code>) : il modifie ton working tree. En entretien : fetch d'abord, on regarde, puis on intègre." },

{ id:"n1-git-02", lvl:1, dom:"Git",
  q:"À quoi sert la zone d'index (staging area) de Git ?",
  accept:["preparer le commit","selectionner","zone intermediaire","choisir ce qui part","construire le prochain commit"],
  explain:"C'est le brouillon du prochain commit : elle permet de choisir précisément QUELS changements partent dans le commit, y compris des morceaux de fichier (<code>git add -p</code>). Un commit est un instantané de l'index, pas du disque." },

{ id:"n1-docker-01", lvl:1, dom:"Docker",
  q:"Quelle est la différence entre une image et un conteneur Docker ?",
  accept:["image = modele","template","lecture seule","instance","conteneur = image en execution","classe et instance"],
  explain:"L'image est un modèle immuable en lecture seule (empilement de couches). Le conteneur est une instance en cours d'exécution de cette image, avec une couche d'écriture éphémère au-dessus. Analogie : classe / objet." },

{ id:"n1-docker-02", lvl:1, dom:"Docker",
  q:"Pourquoi dit-on qu'un conteneur n'est PAS une machine virtuelle ?",
  accept:["partage le noyau","meme kernel","pas d os complet","isolation par namespaces","pas d hyperviseur"],
  explain:"Un conteneur partage le noyau de l'hôte et n'est qu'un processus isolé (namespaces + cgroups). Une VM embarque un OS complet au-dessus d'un hyperviseur. D'où : démarrage en ms, mais isolation plus faible et dépendance au kernel Linux." },

{ id:"n1-k8s-01", lvl:1, dom:"Kubernetes",
  q:"Qu'est-ce qu'un Pod, et pourquoi Kubernetes n'orchestre-t-il pas directement des conteneurs ?",
  accept:["plus petite unite","unite deployable","un ou plusieurs conteneurs","partagent le reseau","meme ip"],
  explain:"Le Pod est la plus petite unité déployable : un ou plusieurs conteneurs qui partagent la même IP, les mêmes volumes et le même namespace réseau. Il permet le pattern sidecar (proxy, log shipper) et donne un cycle de vie commun." },

{ id:"n1-k8s-02", lvl:1, dom:"Kubernetes",
  q:"Qu'est-ce qu'un Service Kubernetes résout comme problème ?",
  accept:["ip instable","pods ephemeres","point d entree stable","load balancing","adresse fixe","decouverte"],
  explain:"Les Pods sont éphémères et changent d'IP à chaque recréation. Le Service fournit une IP virtuelle + un nom DNS stables et répartit le trafic sur les Pods correspondant à son selector." },

{ id:"n1-tf-01", lvl:1, dom:"Terraform",
  q:"Qu'est-ce que ça change concrètement que Terraform soit déclaratif plutôt qu'impératif ?",
  accept:["etat final","etat desire","le quoi pas le comment","idempotent","terraform calcule"],
  explain:"Tu décris l'état FINAL voulu ; Terraform compare cet état au state et calcule lui-même les actions. Conséquence pratique : c'est idempotent — relancer un apply sans changement ne fait rien. Un script bash, lui, rejoue tout." },

{ id:"n1-tf-02", lvl:1, dom:"Terraform",
  q:"À quoi sert le fichier <code>terraform.tfstate</code> ? Pourquoi est-il critique ?",
  accept:["correspondance","mapping","memorise les ressources","lien entre le code et le reel","source de verite"],
  explain:"Il mémorise la correspondance entre ton code et les ressources réelles (IDs, attributs). Sans lui Terraform ne sait plus ce qu'il gère et voudrait tout recréer. Il contient souvent des secrets en clair : jamais dans Git, toujours en backend distant chiffré." },

{ id:"n1-tf-03", lvl:1, dom:"Terraform",
  q:"Quelle est la différence entre un bloc <code>resource</code> et un bloc <code>data</code> ?",
  accept:["data lit","lecture seule","resource cree","data ne gere pas","existant"],
  explain:"<code>resource</code> = Terraform crée et gère tout le cycle de vie (create/update/destroy). <code>data</code> = lecture seule d'un objet existant créé ailleurs, pour récupérer un ID ou un attribut. Un <code>destroy</code> ne supprime jamais une data source." },

{ id:"n1-aws-01", lvl:1, dom:"AWS",
  q:"Qu'est-ce qui différencie une Région AWS d'une Availability Zone ?",
  accept:["zone geographique","plusieurs az","datacenter","isolation physique","une region contient"],
  explain:"Une Région est une zone géographique (eu-west-3 = Paris) contenant plusieurs AZ. Une AZ est un ou plusieurs datacenters isolés physiquement, reliés aux autres AZ par un réseau à faible latence. La haute dispo se construit multi-AZ ; le DR se construit multi-région." },

{ id:"n1-aws-02", lvl:1, dom:"AWS",
  q:"Explique le modèle de responsabilité partagée AWS avec un exemple concret.",
  accept:["aws securise le cloud","toi dans le cloud","securite du cloud","securite dans le cloud","partage"],
  explain:"AWS assure la sécurité DU cloud (datacenters, hyperviseur, matériel, réseau physique). Le client assure la sécurité DANS le cloud (IAM, chiffrement, patchs de l'OS sur EC2, config des Security Groups, données). Exemple : un bucket S3 public, c'est ta faute, pas celle d'AWS." },

{ id:"n1-az-01", lvl:1, dom:"Azure",
  q:"À quoi sert un Resource Group dans Azure, et quelle contrainte impose-t-il ?",
  accept:["conteneur logique","regroupe des ressources","cycle de vie","supprime tout","une seule region"],
  explain:"C'est un conteneur logique regroupant des ressources partageant un cycle de vie. Toute ressource appartient à exactement un RG. Supprimer le RG supprime tout ce qu'il contient. Il porte aussi des tags et des assignations RBAC héritées." },

{ id:"n1-az-02", lvl:1, dom:"Azure",
  q:"Cite la hiérarchie de gestion Azure du plus large au plus fin.",
  must:[["management group","groupe d administration"],["subscription","abonnement"],["resource group","groupe de ressources"]],
  explain:"Management Group → Subscription → Resource Group → Ressource. Les policies et le RBAC s'héritent du haut vers le bas : une assignation au niveau subscription s'applique à tous les RG en dessous." },

{ id:"n1-res-01", lvl:1, dom:"Réseau",
  q:"Que signifie le <code>/24</code> dans <code>10.0.1.0/24</code> et combien d'adresses ça représente ?",
  accept:["24 bits","masque","256","bits de reseau"],
  explain:"Les 24 premiers bits identifient le réseau, les 8 restants les hôtes : 2^8 = 256 adresses (dont réseau et broadcast). Sur AWS, 5 sont réservées par la plateforme → 251 utilisables." },

{ id:"n1-res-02", lvl:1, dom:"Réseau",
  q:"Quelle est la différence entre TCP et UDP, et quand choisit-on UDP ?",
  accept:["connexion","fiable","sans connexion","accuse de reception","ordre garanti","plus rapide"],
  explain:"TCP est orienté connexion (handshake, retransmission, ordre garanti, contrôle de flux). UDP est sans connexion, sans garantie, mais sans surcoût : on le choisit pour le DNS, le streaming, la VoIP, les métriques — là où la latence prime sur la perte." },

{ id:"n1-res-03", lvl:1, dom:"Réseau",
  q:"Que fait un enregistrement DNS de type <code>CNAME</code>, et quelle limite a-t-il à la racine d'un domaine ?",
  accept:["alias","pointe vers un autre nom","interdit a l apex","pas a la racine","zone apex"],
  explain:"Un CNAME est un alias vers un autre NOM. Interdit à l'apex du domaine (<code>exemple.com</code>) car la racine doit porter SOA et NS. D'où les enregistrements ALIAS/ANAME propriétaires (Route 53 Alias, Azure DNS Alias)." },

{ id:"n1-cicd-01", lvl:1, dom:"CI/CD",
  q:"Quelle est la différence entre Continuous Delivery et Continuous Deployment ?",
  accept:["validation manuelle","approbation","automatique en prod","bouton","deploiement automatique"],
  explain:"Continuous Delivery : chaque build est prêt à partir en prod mais un humain déclenche la mise en production. Continuous Deployment : tout build qui passe les tests part en prod automatiquement, sans intervention. En banque, on est presque toujours en Delivery." },

{ id:"n1-cicd-02", lvl:1, dom:"CI/CD",
  q:"Qu'est-ce qu'un artefact de build, et pourquoi ne doit-on le construire qu'une seule fois ?",
  accept:["build once","une seule fois","meme binaire","reproductible","promotion"],
  explain:"C'est le livrable produit par la CI (jar, image, package). Principe <em>build once, deploy many</em> : on construit un artefact unique versionné, puis on le PROMEUT de dev → recette → prod. Reconstruire par environnement, c'est risquer de déployer autre chose que ce qui a été testé." },

{ id:"n1-sec-01", lvl:1, dom:"Sécurité",
  q:"Différence entre authentification et autorisation ?",
  accept:["qui tu es","identite","ce que tu as le droit","permissions","droits"],
  explain:"Authentification = prouver QUI tu es (mot de passe, certificat, token). Autorisation = déterminer ce que tu as le DROIT de faire une fois identifié (RBAC, policies IAM). AuthN puis AuthZ, toujours dans cet ordre." },

{ id:"n1-sec-02", lvl:1, dom:"Sécurité",
  q:"Qu'est-ce que le principe du moindre privilège, et comment le vérifie-t-on en pratique ?",
  accept:["strict necessaire","minimum de droits","juste ce qu il faut","access analyzer","revue"],
  explain:"N'accorder que les permissions strictement nécessaires, pour la durée strictement nécessaire. En pratique on part de zéro et on ajoute, on audite avec IAM Access Analyzer / Access Advisor (AWS) ou les PIM/Access Reviews (Azure AD) pour retirer ce qui n'a jamais servi." },

{ id:"n1-obs-01", lvl:1, dom:"Observabilité",
  q:"Cite les trois piliers de l'observabilité et ce que chacun répond.",
  must:[["metrique","metrics"],["log","journaux"],["trace","tracing"]],
  explain:"Métriques (QUOI : agrégats numériques, alerting), Logs (POURQUOI : événements détaillés horodatés), Traces (OÙ : parcours d'une requête à travers les services distribués). Les trois se corrèlent par un trace/correlation ID." },

{ id:"n1-obs-02", lvl:1, dom:"Observabilité",
  q:"Quelle différence fais-tu entre monitoring et observabilité ?",
  accept:["questions connues","inconnues","known unknowns","anticipe","explorer"],
  explain:"Le monitoring répond à des questions qu'on a prévues (dashboards et seuils définis à l'avance). L'observabilité, c'est la capacité à répondre à des questions qu'on n'avait PAS anticipées, à partir des données émises, sans redéployer." },

{ id:"n1-sre-01", lvl:1, dom:"SRE",
  q:"Qu'est-ce qu'un SLI, un SLO et un SLA ? Lequel a des pénalités ?",
  must:[["indicateur","mesure","indicator"],["objectif","cible","objective"],["contrat","penalite","juridique"]],
  explain:"SLI = l'indicateur mesuré (ex : % de requêtes &lt; 300 ms). SLO = l'objectif interne visé (99,9 %). SLA = l'engagement contractuel envers le client, avec pénalités. Règle : SLA &lt; SLO, pour garder une marge avant de payer." },

{ id:"n1-sre-02", lvl:1, dom:"SRE",
  q:"Qu'est-ce qu'un error budget et à quoi sert-il concrètement dans une équipe ?",
  accept:["marge d indisponibilite","budget d erreur","100 moins le slo","droit a l echec","arbitrage"],
  explain:"C'est 100 % moins le SLO : avec un SLO à 99,9 %, tu as droit à ~43 min d'indispo par mois. Tant qu'il reste du budget, on déploie vite ; quand il est consommé, on gèle les features et on repasse sur la fiabilité. C'est l'outil d'arbitrage entre vitesse et stabilité." },

{ id:"n1-sql-01", lvl:1, dom:"SQL",
  q:"Que garantit chacune des lettres d'ACID ?",
  must:[["atomic","atomicite","tout ou rien"],["coherence","consistency","contraintes"],["isolation"],["durab","persist"]],
  explain:"Atomicité (tout ou rien), Cohérence (les contraintes restent respectées), Isolation (les transactions concurrentes ne se voient pas à moitié), Durabilité (une fois commité, ça survit à un crash)." },

{ id:"n1-sql-02", lvl:1, dom:"SQL",
  q:"Différence entre <code>INNER JOIN</code> et <code>LEFT JOIN</code> ?",
  accept:["correspondance des deux","seulement les lignes qui matchent","toutes les lignes de gauche","null a droite"],
  explain:"INNER JOIN ne garde que les lignes ayant une correspondance des deux côtés. LEFT JOIN garde TOUTES les lignes de la table de gauche, en remplissant de NULL quand il n'y a pas de correspondance à droite — d'où son usage pour trouver les orphelins (<code>WHERE b.id IS NULL</code>)." },

{ id:"n1-linux-05", lvl:1, dom:"Linux",
  q:"Quelle différence entre une variable shell et une variable d'environnement ?",
  accept:["export","heritee","processus enfant","transmise"],
  explain:"Une variable shell n'existe que dans le shell courant. <code>export VAR=x</code> la promeut en variable d'environnement : elle est alors héritée par les processus enfants. C'est exactement ce mécanisme qui transporte la config dans les conteneurs (12-factor)." },

{ id:"n1-docker-03", lvl:1, dom:"Docker",
  q:"Que se passe-t-il pour les données écrites dans le système de fichiers d'un conteneur quand il est supprimé ?",
  accept:["perdues","ephemere","disparaissent","volume"],
  explain:"Elles sont perdues : la couche d'écriture est liée au cycle de vie du conteneur. Pour persister il faut un volume (nommé ou bind mount), ou du stockage externe. Corollaire : un conteneur doit être stateless par défaut." },

{ id:"n1-k8s-03", lvl:1, dom:"Kubernetes",
  q:"Qu'est-ce qu'un namespace Kubernetes, et qu'est-ce qu'il n'isole PAS ?",
  accept:["cloisonnement logique","separation logique","pas le reseau","pas d isolation reseau","quotas"],
  explain:"C'est un cloisonnement LOGIQUE des objets (noms uniques par namespace, quotas, RBAC). Il n'isole PAS le réseau par défaut : un Pod du namespace A joint un Pod du namespace B, sauf NetworkPolicy. Il n'isole pas non plus les nœuds ni les objets cluster-scoped (Node, PV, ClusterRole)." },

{ id:"n1-tf-04", lvl:1, dom:"Terraform",
  q:"Que fait <code>terraform init</code> exactement ?",
  accept:["telecharge les providers","initialise le backend","modules","plugins"],
  explain:"Il initialise le répertoire de travail : téléchargement des providers et des modules, configuration du backend de state, création du lock file <code>.terraform.lock.hcl</code>. Obligatoire au premier usage et après tout changement de provider/backend/module." },

{ id:"n1-git-03", lvl:1, dom:"Git",
  q:"Qu'est-ce qu'un commit Git, techniquement ?",
  accept:["instantane","snapshot","pointeur","arbre","hash","parent"],
  explain:"Un objet immuable identifié par un SHA-1/SHA-256, contenant : un pointeur vers un arbre (l'instantané complet du projet), le ou les parents, l'auteur, la date et le message. Git stocke des instantanés, pas des diffs — les diffs sont calculés à l'affichage." }

]);

</script>
<script>
/* data/niveau01b.js */
window.QBANK = (window.QBANK || []).concat([
/* ============ NIVEAU 1 — SÉRIE B ============ */

{ id:"b1-linux-01", lvl:1, dom:"Linux",
  q:"Différence entre un chemin absolu et un chemin relatif ? Pourquoi ça compte dans un script de CI ?",
  accept:["part de la racine","commence par /","depend du repertoire courant","cwd"],
  explain:"Un chemin absolu part de <code>/</code> et est toujours le même. Un chemin relatif dépend du répertoire courant, qui n'est pas garanti dans un runner de CI ou un service systemd. D'où : chemins absolus, ou <code>cd \"$(dirname \"$0\")\"</code> en début de script." },

{ id:"b1-linux-02", lvl:1, dom:"Linux",
  q:"À quoi sert le pipe <code>|</code> et qu'est-ce qui transite dedans exactement ?",
  accept:["stdout vers stdin","sortie standard","chaine","enchainer"],
  explain:"Il connecte le <b>stdout</b> de la commande de gauche au <b>stdin</b> de celle de droite. Seul stdout passe — stderr continue vers le terminal, sauf <code>2>&1</code> ou <code>|&</code>. Les commandes s'exécutent en parallèle, pas l'une après l'autre." },

{ id:"b1-linux-03", lvl:1, dom:"Linux",
  q:"Que contient <code>/etc/passwd</code> et qu'est-ce qui n'y est PAS ?",
  accept:["pas les mots de passe","shadow","comptes","utilisateurs"],
  explain:"Les comptes utilisateurs : login, UID, GID, home, shell. Les mots de passe hachés sont dans <code>/etc/shadow</code>, lisible uniquement par root — d'où le <code>x</code> dans le champ mot de passe de passwd." },

{ id:"b1-linux-04", lvl:1, dom:"Linux",
  q:"Que fait <code>&amp;&amp;</code> par rapport à <code>;</code> entre deux commandes ?",
  accept:["si la premiere reussit","code de retour 0","conditionnel","succes"],
  explain:"<code>;</code> enchaîne inconditionnellement. <code>&amp;&amp;</code> n'exécute la seconde que si la première a retourné 0 (succès). <code>||</code> fait l'inverse : seulement en cas d'échec. C'est la base du <code>cmd || exit 1</code> dans les scripts." },

{ id:"b1-linux-05", lvl:1, dom:"Linux",
  q:"À quoi sert la variable <code>PATH</code> ?",
  accept:["repertoires de recherche","ou chercher les executables","liste de chemins"],
  explain:"Elle liste les répertoires où le shell cherche un exécutable quand on tape son nom sans chemin. <code>which</code>/<code>command -v</code> montre lequel est retenu (le premier trouvé). Piège de sécurité : ne jamais mettre <code>.</code> dans le PATH." },

{ id:"b1-docker-01", lvl:1, dom:"Docker",
  q:"Que fait <code>docker run</code> par rapport à <code>docker start</code> ?",
  accept:["cree un nouveau conteneur","relance un existant","creation"],
  explain:"<code>run</code> = <code>create</code> + <code>start</code> : il crée un NOUVEAU conteneur depuis une image. <code>start</code> relance un conteneur existant déjà créé (avec sa couche d'écriture et sa config). Enchaîner des <code>run</code> laisse des dizaines de conteneurs arrêtés qui remplissent le disque." },

{ id:"b1-docker-02", lvl:1, dom:"Docker",
  q:"À quoi sert <code>EXPOSE 8080</code> dans un Dockerfile ? Ça publie le port ?",
  accept:["documentation","ne publie pas","non","metadonnee","-p"],
  explain:"Non : c'est purement déclaratif (métadonnée + utilisable par <code>-P</code>). Pour rendre le port joignable depuis l'hôte il faut <code>-p 8080:8080</code> au run, ou un Service côté Kubernetes. Beaucoup de candidats se trompent là-dessus." },

{ id:"b1-docker-03", lvl:1, dom:"Docker",
  q:"À quoi sert un fichier <code>.dockerignore</code> ?",
  accept:["exclure du contexte","reduire le contexte","eviter d envoyer","secrets"],
  explain:"Il exclut des fichiers du CONTEXTE de build envoyé au daemon. Double bénéfice : builds beaucoup plus rapides (on n'envoie pas <code>node_modules</code> ni <code>.git</code>) et sécurité (on n'embarque pas <code>.env</code> ou des clés par un <code>COPY . .</code>)." },

{ id:"b1-k8s-01", lvl:1, dom:"Kubernetes",
  q:"Que signifie « Kubernetes est déclaratif » dans la pratique quotidienne ?",
  accept:["etat desire","yaml","reconcilie","tu decris le resultat"],
  explain:"Tu décris l'état voulu dans un manifeste (3 réplicas de cette image) et le cluster s'arrange en permanence pour l'atteindre et le maintenir. Tu ne dis jamais « démarre ce conteneur sur ce serveur ». Corollaire : supprimer un Pod à la main ne sert à rien, le contrôleur le recrée." },

{ id:"b1-k8s-02", lvl:1, dom:"Kubernetes",
  q:"Quelle est la différence entre <code>kubectl apply</code> et <code>kubectl create</code> ?",
  accept:["apply idempotent","create echoue si existe","met a jour","declaratif"],
  explain:"<code>create</code> est impératif : il échoue si l'objet existe déjà. <code>apply</code> est déclaratif et idempotent : il crée ou met à jour en calculant un diff (via l'annotation last-applied ou le server-side apply). En pipeline, c'est toujours <code>apply</code>." },

{ id:"b1-k8s-03", lvl:1, dom:"Kubernetes",
  q:"Que se passe-t-il si tu supprimes manuellement un Pod géré par un Deployment ?",
  accept:["recree","remplace","le controleur","nouveau pod"],
  explain:"Le ReplicaSet constate qu'il manque un réplica et en crée un nouveau (avec un nouveau nom et une nouvelle IP). C'est la boucle de réconciliation. Pour vraiment arrêter le service, il faut modifier le Deployment (réplicas à 0) ou le supprimer." },

{ id:"b1-tf-01", lvl:1, dom:"Terraform",
  q:"Que fait <code>terraform fmt</code> et pourquoi le mettre en CI ?",
  accept:["formate","indentation","canonique","coherence"],
  explain:"Il réécrit les fichiers au format canonique HCL. En CI on utilise <code>terraform fmt -check -recursive</code> qui échoue si du code n'est pas formaté : ça supprime définitivement les débats de style en revue de code et les diffs parasites." },

{ id:"b1-tf-02", lvl:1, dom:"Terraform",
  q:"Quelle est la différence entre <code>terraform validate</code> et <code>terraform plan</code> ?",
  accept:["hors ligne","sans appel api","syntaxe","coherence interne","plan interroge"],
  explain:"<code>validate</code> vérifie la syntaxe et la cohérence interne SANS appeler les API du cloud ni lire le state — donc très rapide, utilisable sans credentials. <code>plan</code> interroge réellement le fournisseur et compare avec le state." },

{ id:"b1-tf-03", lvl:1, dom:"Terraform",
  q:"À quoi sert un fichier <code>.tfvars</code> ?",
  accept:["valeurs des variables","par environnement","separer","alimenter"],
  explain:"Il fournit les valeurs des variables d'entrée, séparément du code : <code>terraform apply -var-file=prod.tfvars</code>. <code>terraform.tfvars</code> et <code>*.auto.tfvars</code> sont chargés automatiquement. Ne jamais y mettre de secret commité." },

{ id:"b1-aws-01", lvl:1, dom:"AWS",
  q:"Qu'est-ce qu'un bucket S3 et quelle est la contrainte sur son nom ?",
  accept:["globalement unique","unique au monde","conteneur d objets","dns"],
  explain:"Un conteneur d'objets. Son nom est <b>globalement unique sur tout AWS</b> (il fait partie d'un nom DNS), en minuscules, sans underscore. D'où les conventions de nommage avec préfixe entreprise + compte + région." },

{ id:"b1-aws-02", lvl:1, dom:"AWS",
  q:"Différence entre une IP publique EC2 et une Elastic IP ?",
  accept:["change au redemarrage","fixe","statique","reservee"],
  explain:"L'IP publique auto-assignée change à chaque arrêt/démarrage de l'instance. Une Elastic IP est une IP fixe réservée à ton compte, réattachable à une autre instance — utile pour du whitelisting partenaire ou un enregistrement DNS. Elle est facturée quand elle n'est PAS attachée." },

{ id:"b1-aws-03", lvl:1, dom:"AWS",
  q:"Qu'est-ce qu'AWS CloudFormation, et son équivalent Azure ?",
  accept:["iac natif","arm","bicep","templates"],
  explain:"C'est l'IaC native d'AWS (templates YAML/JSON, notion de <em>stack</em>, état géré par AWS). L'équivalent Azure est ARM / Bicep. Différence avec Terraform : pas de state à gérer soi-même, mais mono-cloud." },

{ id:"b1-az-01", lvl:1, dom:"Azure",
  q:"Qu'est-ce qu'un App Service Plan et pourquoi c'est un piège de facturation ?",
  accept:["ressources de calcul","factures meme sans app","tier","mutualise"],
  explain:"C'est le socle de calcul (VM sous-jacente, tier, nombre d'instances) sur lequel tournent une ou plusieurs App Services. On paie le PLAN, pas l'app : un plan Premium vide continue de coûter. Plusieurs apps sur un même plan se partagent CPU et mémoire." },

{ id:"b1-az-02", lvl:1, dom:"Azure",
  q:"À quoi sert Azure Blob Storage et quels sont ses tiers d'accès ?",
  accept:["hot","cool","archive","objet","non structure"],
  explain:"Stockage d'objets non structurés (fichiers, images, sauvegardes, logs). Tiers : Hot (accès fréquent, stockage cher / accès peu cher), Cool (30 j min), Cold, Archive (180 j min, réhydratation de plusieurs heures). On automatise le passage par des règles de cycle de vie." },

{ id:"b1-res-01", lvl:1, dom:"Réseau",
  q:"Quelle différence entre le port 80 et le port 443 ?",
  accept:["http","https","chiffre","tls"],
  explain:"80 = HTTP en clair, 443 = HTTPS (HTTP sur TLS). En production on redirige systématiquement 80 → 443 et on active HSTS pour que le navigateur n'essaie même plus le port 80." },

{ id:"b1-res-02", lvl:1, dom:"Réseau",
  q:"À quoi sert le fichier <code>/etc/hosts</code> et quelle est sa priorité par rapport au DNS ?",
  accept:["resolution locale","avant le dns","prioritaire","statique"],
  explain:"Il fait une résolution nom → IP locale, consultée AVANT le DNS (selon <code>/etc/nsswitch.conf</code>). Pratique pour tester une bascule ou contourner un DNS. Piège : un <code>/etc/hosts</code> oublié sur un serveur provoque des comportements incompréhensibles." },

{ id:"b1-res-03", lvl:1, dom:"Réseau",
  q:"Qu'est-ce qu'une passerelle par défaut (default gateway) ?",
  accept:["route par defaut","0.0.0.0/0","sortie du reseau","routeur"],
  explain:"C'est l'équipement vers lequel on envoie tout paquet dont la destination n'est pas sur le réseau local — la route <code>0.0.0.0/0</code>. Dans un VPC, ce rôle est tenu par l'Internet Gateway ou le NAT Gateway selon le subnet." },

{ id:"b1-git-01", lvl:1, dom:"Git",
  q:"À quoi sert le fichier <code>.gitignore</code> et que fait-il si le fichier est DÉJÀ suivi ?",
  accept:["ignorer","rien","deja suivi","git rm --cached"],
  explain:"Il empêche Git de suivre les fichiers correspondants. Mais il n'a AUCUN effet sur un fichier déjà suivi : il faut d'abord <code>git rm --cached fichier</code>. C'est la raison n°1 pour laquelle un <code>.env</code> continue d'apparaître dans les commits." },

{ id:"b1-git-02", lvl:1, dom:"Git",
  q:"Qu'est-ce qu'une branche Git, techniquement ?",
  accept:["pointeur","reference","vers un commit","leger"],
  explain:"Un simple pointeur mobile vers un commit (un fichier de 41 octets dans <code>.git/refs/heads/</code>). C'est pour ça que créer une branche est instantané et gratuit — contrairement à d'autres SCM où c'est une copie." },

{ id:"b1-git-03", lvl:1, dom:"Git",
  q:"Que fait <code>git clone</code> par rapport à <code>git init</code> ?",
  accept:["copie un depot existant","cree un depot vide","distant","origin"],
  explain:"<code>init</code> crée un dépôt vide localement. <code>clone</code> copie un dépôt distant complet (tout l'historique, toutes les branches) et configure automatiquement le remote <code>origin</code> ainsi que la branche de suivi." },

{ id:"b1-cicd-01", lvl:1, dom:"CI/CD",
  q:"Qu'est-ce qu'un runner (ou agent) de CI ?",
  accept:["machine qui execute","execute les jobs","worker"],
  explain:"C'est la machine (VM, conteneur, pod) qui exécute réellement les jobs du pipeline. Hébergé par le fournisseur (shared) ou par toi (self-hosted, souvent obligatoire en banque pour accéder au réseau interne)." },

{ id:"b1-cicd-02", lvl:1, dom:"CI/CD",
  q:"Qu'est-ce qu'un webhook et à quoi ça sert dans une chaîne CI/CD ?",
  accept:["appel http","declenche","notification","evenement"],
  explain:"C'est un appel HTTP envoyé automatiquement par un système quand un événement se produit (push, PR ouverte, tag créé). C'est le mécanisme qui déclenche un pipeline sans polling. Il doit être signé/vérifié, sinon n'importe qui peut déclencher tes builds." },

{ id:"b1-sec-01", lvl:1, dom:"Sécurité",
  q:"Qu'est-ce que le MFA et pourquoi un mot de passe fort ne suffit-il pas ?",
  accept:["deuxieme facteur","authentification multifacteur","quelque chose que tu possedes","phishing"],
  explain:"L'authentification multifacteur combine plusieurs catégories : ce que tu SAIS (mot de passe), ce que tu POSSÈDES (clé, téléphone), ce que tu ES (biométrie). Un mot de passe, même fort, peut être volé par phishing ou fuite de base. Le MFA rend ce vol seul inexploitable — d'où son caractère obligatoire sur les comptes privilégiés." },

{ id:"b1-sec-02", lvl:1, dom:"Sécurité",
  q:"Quelle différence entre hacher et chiffrer un mot de passe ?",
  accept:["hachage irreversible","sens unique","chiffrement reversible","bcrypt"],
  explain:"Le hachage est à SENS UNIQUE : on ne peut pas revenir en arrière, on compare des empreintes. Le chiffrement est réversible avec la clé. Un mot de passe se HACHE (bcrypt, argon2, avec un sel), jamais ne se chiffre — sinon quiconque a la clé a tous les mots de passe." },

{ id:"b1-obs-01", lvl:1, dom:"Observabilité",
  q:"Qu'est-ce qu'un dashboard utile par rapport à un dashboard décoratif ?",
  accept:["repond a une question","actionnable","decision","trop de graphiques"],
  explain:"Un dashboard utile répond à une question précise (« le service est-il sain ? », « où est le goulot ? ») et se lit en 10 secondes. Un dashboard à 40 graphiques ne se lit pas pendant un incident : on le regarde parce qu'il est joli, pas parce qu'il aide à décider." },

{ id:"b1-sre-01", lvl:1, dom:"SRE",
  q:"Qu'est-ce que la haute disponibilité, et en quoi diffère-t-elle de la reprise après sinistre ?",
  accept:["panne locale","automatique","dr = sinistre majeur","autre region","continuite"],
  explain:"La HA absorbe automatiquement une panne LOCALE (une instance, une AZ) sans intervention et sans coupure notable. Le DR répond à un sinistre MAJEUR (perte d'une région, corruption, ransomware) et implique généralement une bascule décidée, avec un RTO/RPO négociés. Beaucoup de candidats confondent les deux." },

{ id:"b1-sre-02", lvl:1, dom:"SRE",
  q:"Qu'est-ce qu'un single point of failure ? Donne un exemple qu'on oublie souvent.",
  accept:["point unique","spof","dns","certificat","une seule instance"],
  explain:"Un composant dont la panne suffit à tout arrêter. Les exemples oubliés : le DNS, l'autorité de certification, le service d'authentification, le registry d'images, le coffre à secrets — et parfois le pipeline CI dont dépend le rollback." },

{ id:"b1-sql-01", lvl:1, dom:"SQL",
  q:"Qu'est-ce qu'une clé primaire et une clé étrangère ?",
  accept:["identifie de maniere unique","reference","integrite referentielle","unique"],
  explain:"La clé primaire identifie de façon unique chaque ligne d'une table (unique + non nulle, indexée automatiquement). La clé étrangère référence la clé primaire d'une autre table et garantit l'intégrité référentielle : on ne peut pas créer une commande pour un client inexistant." },

{ id:"b1-sql-02", lvl:1, dom:"SQL",
  q:"Que fait <code>COMMIT</code> et que fait <code>ROLLBACK</code> ?",
  accept:["valide","annule","transaction","definitif"],
  explain:"<code>COMMIT</code> valide définitivement la transaction : les modifications deviennent visibles aux autres et durables. <code>ROLLBACK</code> annule tout depuis le début de la transaction. Tant qu'on n'a pas commité, on tient des verrous — d'où la règle des transactions courtes." },

{ id:"b1-sql-03", lvl:1, dom:"SQL",
  q:"Différence entre <code>DELETE</code>, <code>TRUNCATE</code> et <code>DROP</code> ?",
  must:[["ligne","where","transactionnel"],["vide la table","toutes les lignes"],["supprime la table","structure"]],
  explain:"<code>DELETE</code> supprime des lignes (avec WHERE), c'est journalisé et annulable. <code>TRUNCATE</code> vide toute la table très rapidement (peu de journalisation, remet souvent les séquences à zéro, souvent non annulable). <code>DROP</code> supprime la table elle-même, structure comprise." }

]);

</script>
<script>
/* data/niveau02.js */
window.QBANK = (window.QBANK || []).concat([
/* ================= NIVEAU 2 — BASES OPÉRATIONNELLES ================= */

{ id:"n2-linux-01", lvl:2, dom:"Linux",
  q:"Un process tourne mais tu ne sais pas quel port il écoute. Quelle commande et quelles options ?",
  accept:["ss -tulnp","netstat -tulnp","ss -lntp","lsof -i"],
  explain:"<code>ss -tulnp</code> (t=TCP, u=UDP, l=listening, n=numérique sans résolution DNS, p=processus). <code>lsof -i :8080</code> fait l'inverse : du port vers le process. <code>netstat</code> est déprécié mais encore demandé en entretien." },

{ id:"n2-linux-02", lvl:2, dom:"Linux",
  q:"Un disque est plein d'après <code>df -h</code> mais <code>du -sh</code> ne trouve rien. Quelle explication classique ?",
  accept:["fichier supprime encore ouvert","deleted","descripteur ouvert","inode","process tient le fichier"],
  explain:"Un fichier supprimé mais toujours ouvert par un process : l'inode n'est libéré qu'à la fermeture du descripteur. <code>lsof | grep deleted</code> le révèle ; il faut redémarrer le process (souvent un log rotaté à la sauvage). Autre piste : inodes épuisés (<code>df -i</code>)." },

{ id:"n2-linux-03", lvl:2, dom:"Linux",
  q:"Quelle est la différence entre <code>SIGTERM</code> et <code>SIGKILL</code> ?",
  accept:["term peut etre intercepte","gracieux","kill non interceptable","9 immediat","arret propre"],
  explain:"SIGTERM (15) est interceptable : le process peut fermer ses connexions, flusher ses buffers et sortir proprement. SIGKILL (9) est traité par le noyau, non interceptable, non ignorable — arrêt brutal, risque de corruption. C'est exactement la logique du <code>terminationGracePeriodSeconds</code> Kubernetes." },

{ id:"n2-linux-04", lvl:2, dom:"Linux",
  q:"À quoi sert <code>set -euo pipefail</code> en tête d'un script bash ?",
  must:[["e","erreur","echec"],["u","variable non definie","undefined"],["pipefail","pipe"]],
  explain:"<code>-e</code> arrête au premier échec, <code>-u</code> échoue sur une variable non définie (évite <code>rm -rf $DIR/</code> avec DIR vide), <code>pipefail</code> fait remonter l'échec de n'importe quelle commande d'un pipeline au lieu de ne regarder que la dernière. Réflexe obligatoire sur un script de CI." },

{ id:"n2-linux-05", lvl:2, dom:"Linux",
  q:"Comment trouver les 10 plus gros fichiers sous <code>/var</code> ?",
  accept:["du -a","sort -rh","find -size","du -h | sort"],
  explain:"<code>du -ah /var | sort -rh | head -10</code>, ou <code>find /var -type f -printf '%s %p\\n' | sort -rn | head</code>. Le <code>-h</code> de <code>sort</code> comprend les suffixes K/M/G." },

{ id:"n2-git-01", lvl:2, dom:"Git",
  q:"Différence entre <code>git merge</code> et <code>git rebase</code> — et le risque du rebase ?",
  accept:["reecrit l historique","nouveaux hash","historique lineaire","commit de merge","jamais sur une branche partagee"],
  explain:"<code>merge</code> crée un commit de fusion et préserve l'histoire réelle. <code>rebase</code> rejoue tes commits au-dessus de la cible : historique linéaire, mais NOUVEAUX hash. Donc jamais de rebase sur une branche déjà partagée/poussée, sinon les collègues divergent." },

{ id:"n2-git-02", lvl:2, dom:"Git",
  q:"Tu as commité un secret puis fait un <code>git revert</code>. Le secret est-il protégé ?",
  accept:["non","toujours dans l historique","reste accessible","revoquer"],
  explain:"Non — <code>revert</code> ajoute un commit qui annule l'effet, mais le blob reste dans l'historique et reste récupérable. Il faut réécrire l'historique (<code>git filter-repo</code>, BFG), forcer le push, purger les forks/caches… et surtout RÉVOQUER le secret : c'est la seule action qui compte vraiment." },

{ id:"n2-git-03", lvl:2, dom:"Git",
  q:"Différence entre <code>git reset --soft</code>, <code>--mixed</code> et <code>--hard</code> ?",
  must:[["soft"],["mixed","index"],["hard"]],
  explain:"<code>--soft</code> déplace HEAD, garde index + working tree (pour re-commiter autrement). <code>--mixed</code> (défaut) déplace HEAD et vide l'index, garde les fichiers modifiés. <code>--hard</code> écrase tout, y compris le travail non commité — irréversible sauf via le reflog." },

{ id:"n2-docker-01", lvl:2, dom:"Docker",
  q:"Différence entre <code>CMD</code> et <code>ENTRYPOINT</code> dans un Dockerfile ?",
  accept:["entrypoint executable","cmd arguments par defaut","cmd remplacable","surcharge"],
  explain:"ENTRYPOINT définit l'exécutable fixe du conteneur ; CMD fournit les arguments par défaut, remplaçables par ceux passés à <code>docker run</code>. Combo usuel : <code>ENTRYPOINT [\"nginx\"]</code> + <code>CMD [\"-g\",\"daemon off;\"]</code>. Toujours en forme exec (JSON) pour recevoir les signaux." },

{ id:"n2-docker-02", lvl:2, dom:"Docker",
  q:"Pourquoi place-t-on <code>COPY package.json</code> puis <code>RUN npm install</code> AVANT <code>COPY . .</code> ?",
  accept:["cache","couches","layer cache","invalidation","reutilisation"],
  explain:"Pour le cache de couches : tant que <code>package.json</code> ne change pas, la couche d'installation des dépendances est réutilisée. Si on copiait tout le code d'abord, la moindre modification d'un fichier source invaliderait le cache et relancerait un <code>npm install</code> complet." },

{ id:"n2-docker-03", lvl:2, dom:"Docker",
  q:"Qu'apporte un build multi-stage, concrètement ?",
  accept:["image finale legere","sans outils de build","separer compilation","surface d attaque","copie l artefact"],
  explain:"On compile dans une image lourde (SDK, compilateur, dépendances de build) puis on ne copie que l'artefact final dans une image runtime minimale. Résultat : image beaucoup plus petite, sans compilateur ni sources — donc surface d'attaque et temps de pull réduits." },

{ id:"n2-k8s-01", lvl:2, dom:"Kubernetes",
  q:"Quelle est la chaîne d'objets entre un Deployment et un Pod ?",
  accept:["replicaset","deployment cree un replicaset","rs"],
  explain:"Deployment → ReplicaSet → Pods. Le Deployment gère les versions et le rollout ; il crée un NOUVEAU ReplicaSet à chaque changement de template et fait varier les réplicas des deux RS. Les anciens RS sont conservés (<code>revisionHistoryLimit</code>) pour permettre le rollback." },

{ id:"n2-k8s-02", lvl:2, dom:"Kubernetes",
  q:"Différence entre une liveness probe et une readiness probe ?",
  accept:["liveness redemarre","readiness retire du service","endpoints","trafic"],
  explain:"Liveness : si elle échoue, kubelet REDÉMARRE le conteneur (il est bloqué). Readiness : si elle échoue, le Pod est retiré des Endpoints du Service — il ne reçoit plus de trafic mais reste vivant. Mettre une liveness trop agressive au démarrage = boucle de redémarrage : c'est le rôle de la startupProbe." },

{ id:"n2-k8s-03", lvl:2, dom:"Kubernetes",
  q:"Différence entre un ConfigMap et un Secret ? Le Secret est-il chiffré ?",
  accept:["base64","pas chiffre","encode","non chiffre par defaut","encryption at rest"],
  explain:"Même usage (injecter de la config), mais un Secret est seulement encodé en base64 dans etcd — PAS chiffré par défaut. Il faut activer <code>EncryptionConfiguration</code> côté API server, ou externaliser (External Secrets Operator + Key Vault / Secrets Manager). Le RBAC sur les Secrets doit être strict." },

{ id:"n2-k8s-04", lvl:2, dom:"Kubernetes",
  q:"À quoi sert un label et en quoi diffère-t-il d'une annotation ?",
  accept:["selection","selector","identification","annotation non selectionnable","metadonnee"],
  explain:"Les labels sont des paires clé/valeur indexées servant à SÉLECTIONNER des objets (Services, ReplicaSets, NetworkPolicies). Les annotations portent des métadonnées non sélectionnables et souvent volumineuses (config d'un ingress controller, checksum, outil externe)." },

{ id:"n2-tf-01", lvl:2, dom:"Terraform",
  q:"Que fait <code>terraform plan</code> et quelles sont les quatre actions possibles affichées ?",
  must:[["cree","creation","ajoute"],["detruit","destruction","supprime"],["modifie","modification","change"]],
  explain:"Il rafraîchit l'état, compare config vs state et affiche un dry-run : <code>+</code> création, <code>-</code> destruction, <code>~</code> modification en place, <code>-/+</code> remplacement (destroy puis create). Aucun changement n'est appliqué. En CI, on sauvegarde le plan (<code>-out</code>) et on applique CE plan-là." },

{ id:"n2-tf-02", lvl:2, dom:"Terraform",
  q:"Pourquoi un backend distant est-il indispensable dès qu'on travaille à plusieurs ?",
  accept:["verrouillage","lock","state partage","concurrence","corruption"],
  explain:"Pour partager le state ET le verrouiller : sans lock, deux <code>apply</code> simultanés corrompent le state ou créent des ressources en double. S3 + DynamoDB (ou S3 lockfile natif), azurerm avec bail de blob, ou HCP Terraform. Bonus : chiffrement au repos et versioning pour restaurer." },

{ id:"n2-tf-03", lvl:2, dom:"Terraform",
  q:"À quoi sert <code>.terraform.lock.hcl</code> et doit-il être commité ?",
  accept:["versions des providers","hash","commite","versionne","reproductible"],
  explain:"Il fige les versions exactes des providers et leurs empreintes de hachage. OUI, il se commite : c'est ce qui garantit que ton poste, celui du collègue et la CI utilisent strictement les mêmes providers. Ne pas le confondre avec le verrou de state." },

{ id:"n2-tf-04", lvl:2, dom:"Terraform",
  q:"Quelle différence entre une variable et un local dans Terraform ?",
  accept:["variable = entree","local = calcul","interne","pas surchargeable","expression"],
  explain:"Une <code>variable</code> est une entrée du module, fournie de l'extérieur (tfvars, -var, env). Un <code>local</code> est une valeur calculée interne, non surchargeable, qui sert à factoriser une expression répétée (naming, tags communs, conditions)." },

{ id:"n2-aws-01", lvl:2, dom:"AWS",
  q:"Qu'est-ce qui rend un subnet AWS « public » ?",
  accept:["route table","table de routage","route vers l igw","0.0.0.0/0"],
  explain:"Uniquement sa route table : une route <code>0.0.0.0/0 → igw-xxx</code>. Le nom du subnet n'a aucune valeur technique. Il faut aussi une IP publique sur l'instance (ou une EIP) pour être joignable de l'extérieur." },

{ id:"n2-aws-02", lvl:2, dom:"AWS",
  q:"Security Group vs NACL : cite les trois différences majeures.",
  must:[["instance","eni"],["subnet"],["stateful","stateless","etat"]],
  explain:"1) Niveau : SG sur l'ENI/instance, NACL sur le subnet. 2) État : SG stateful (le retour est autorisé automatiquement), NACL stateless (il faut une règle explicite dans chaque sens, ports éphémères compris). 3) Deny : SG allow uniquement, NACL supporte allow ET deny, avec des règles numérotées évaluées dans l'ordre." },

{ id:"n2-aws-03", lvl:2, dom:"AWS",
  q:"À quoi sert un IAM Role par rapport à un IAM User, et pourquoi le préférer sur EC2 ?",
  accept:["credentials temporaires","pas de cle statique","assume","identite endossable","rotation automatique"],
  explain:"Un rôle n'a pas de credentials permanents : on l'endosse (<code>AssumeRole</code>/STS) et on reçoit des credentials temporaires à rotation automatique. Sur EC2 (instance profile) ou EKS (IRSA), ça supprime les clés d'accès statiques codées en dur — la première cause de fuite en entreprise." },

{ id:"n2-az-01", lvl:2, dom:"Azure",
  q:"Différence entre un Service Principal et une Managed Identity ?",
  accept:["gere le secret","pas de secret","rotation automatique","azure gere","identite managee"],
  explain:"Les deux sont des identités applicatives. Le Service Principal demande de gérer un secret ou un certificat (stockage, rotation, expiration). La Managed Identity est gérée par Azure : pas de secret à manipuler, le token est récupéré via l'endpoint IMDS. Toujours préférer la Managed Identity quand la ressource est dans Azure." },

{ id:"n2-az-02", lvl:2, dom:"Azure",
  q:"Différence entre une Managed Identity system-assigned et user-assigned ?",
  accept:["liee au cycle de vie","supprimee avec la ressource","partagee","plusieurs ressources","independante"],
  explain:"System-assigned : créée avec la ressource, supprimée avec elle, 1:1. User-assigned : objet indépendant, réutilisable par plusieurs ressources, survit à leur suppression — indispensable quand tu veux préassigner les droits RBAC avant même de créer la VM (évite le poule/œuf en Terraform)." },

{ id:"n2-res-01", lvl:2, dom:"Réseau",
  q:"Décris le handshake TCP en trois temps.",
  must:[["syn"],["syn ack","syn-ack"],["ack"]],
  explain:"SYN (client → serveur, propose un numéro de séquence), SYN-ACK (serveur accuse et propose le sien), ACK (client accuse). Une connexion bloquée en SYN_SENT côté client, c'est presque toujours un firewall/SG qui DROP silencieusement — un REJECT donnerait un « connection refused » immédiat." },

{ id:"n2-res-02", lvl:2, dom:"Réseau",
  q:"Que se passe-t-il pendant un handshake TLS, en trois idées ?",
  must:[["certificat","cert"],["cle de session","symetrique","session key"]],
  explain:"1) Négociation de version et de suite cryptographique. 2) Le serveur présente son certificat, le client valide la chaîne jusqu'à une CA de confiance. 3) Échange de clés (ECDHE) pour dériver une clé de SESSION symétrique — l'asymétrique ne sert qu'à établir la confiance, le trafic est ensuite chiffré symétriquement." },

{ id:"n2-res-03", lvl:2, dom:"Réseau",
  q:"Différence entre un load balancer L4 et L7 ?",
  accept:["couche 4 tcp","couche 7 http","routage par url","inspecte le contenu","header"],
  explain:"L4 route sur IP/port sans lire le contenu (rapide, tout protocole TCP/UDP) : NLB, Azure LB. L7 comprend HTTP : routage par host/path/header, terminaison TLS, réécriture, sticky sessions, WAF : ALB, Application Gateway, Ingress." },

{ id:"n2-cicd-01", lvl:2, dom:"CI/CD",
  q:"Pourquoi un pipeline doit-il échouer VITE (fail fast) et dans quel ordre ranger les étapes ?",
  accept:["lint puis tests unitaires","du plus rapide","feedback rapide","le moins couteux d abord"],
  explain:"Pour donner un feedback en quelques minutes et ne pas gaspiller des runners. Ordre : lint/format → tests unitaires → build → scan sécurité/SAST → tests d'intégration → déploiement. Le moins coûteux et le plus discriminant d'abord." },

{ id:"n2-cicd-02", lvl:2, dom:"CI/CD",
  q:"Pourquoi ne jamais taguer une image de production en <code>latest</code> ?",
  accept:["non deterministe","pas reproductible","mutable","rollback impossible","quelle version"],
  explain:"<code>latest</code> est un tag mutable : deux pulls peuvent donner deux images différentes, on ne sait plus ce qui tourne et le rollback est impossible. On tague par version sémantique ou SHA de commit, et en prod on référence idéalement le digest immuable (<code>@sha256:…</code>)." },

{ id:"n2-sec-01", lvl:2, dom:"Sécurité",
  q:"Pourquoi ne pas passer un secret via une variable d'environnement de build Docker (<code>ARG</code>) ?",
  accept:["reste dans l historique","docker history","couche","inspectable","persiste dans l image"],
  explain:"L'ARG et les commandes RUN restent visibles dans l'historique des couches (<code>docker history</code>) : quiconque a l'image a le secret. Il faut utiliser BuildKit <code>--mount=type=secret</code>, ou injecter le secret au RUNTIME depuis un coffre." },

{ id:"n2-obs-01", lvl:2, dom:"Observabilité",
  q:"Pourquoi préfère-t-on des logs structurés (JSON) à du texte libre ?",
  accept:["parsable","indexable","requetable","champs","correlation"],
  explain:"Parce qu'ils sont directement indexables et requêtables par champ (level, service, trace_id, user_id) sans regex fragiles. Ça permet l'agrégation, l'alerting sur un champ et la corrélation avec les traces. Le texte libre casse dès qu'un dev change le format d'un message." },

{ id:"n2-sql-01", lvl:2, dom:"SQL",
  q:"À quoi sert un index, et quel est son coût ?",
  accept:["accelere la lecture","ralentit les ecritures","occupe de l espace","maintenu a chaque insert"],
  explain:"Il accélère les lectures en évitant le full scan (structure B-tree triée). Coût : espace disque, et surcoût sur chaque INSERT/UPDATE/DELETE car l'index doit être maintenu. D'où : indexer les colonnes de filtre/jointure réellement utilisées, pas tout." },

{ id:"n2-sre-01", lvl:2, dom:"SRE",
  q:"Qu'est-ce qu'un post-mortem « blameless » et pourquoi cette approche ?",
  accept:["sans blamer","cause systemique","pas de coupable","apprendre","processus"],
  explain:"On analyse l'incident en cherchant les causes systémiques (manque de garde-fou, alerte absente, procédure ambiguë) plutôt qu'un coupable. Objectif : que les gens rapportent les incidents sans peur. Chercher un coupable fait taire l'information et garantit la récidive." }

]);

<script>
/* data/niveau02b.js */
window.QBANK = (window.QBANK || []).concat([
/* ============ NIVEAU 2 — SÉRIE B ============ */

{ id:"b2-linux-01", lvl:2, dom:"Linux",
  q:"Comment lances-tu un processus qui survit à la fermeture de ta session SSH ?",
  accept:["nohup","tmux","screen","systemd-run","disown"],
  explain:"<code>nohup cmd &amp;</code>, ou mieux <code>tmux</code>/<code>screen</code> pour pouvoir revenir dessus, ou <code>systemd-run --user</code>. Sans ça, la fermeture du terminal envoie SIGHUP au groupe de processus et tue le job. En production, la vraie réponse est : une unité systemd, pas un nohup." },

{ id:"b2-linux-02", lvl:2, dom:"Linux",
  q:"Que fait <code>tail -f</code> et quelle est sa limite avec la rotation de logs ?",
  accept:["suit le fichier","perd le fichier","tail -F","rotation","inode"],
  explain:"<code>-f</code> suit le descripteur : après une rotation, il continue de lire l'ANCIEN fichier renommé et n'affiche plus rien. <code>tail -F</code> suit le NOM et rouvre le fichier après rotation. Détail qui trahit l'expérience terrain." },

{ id:"b2-linux-03", lvl:2, dom:"Linux",
  q:"Comment vois-tu l'espace disque ET les inodes, et pourquoi les deux ?",
  must:[["df -h"],["df -i","inode"]],
  explain:"<code>df -h</code> pour les octets, <code>df -i</code> pour les inodes. On peut avoir 90 % d'espace libre et 100 % d'inodes utilisés : typiquement des millions de petits fichiers (sessions PHP, caches, messages). Le symptôme est un « No space left on device » incompréhensible." },

{ id:"b2-linux-04", lvl:2, dom:"Linux",
  q:"À quoi sert <code>cron</code> et quelle est la première cause d'échec d'un job cron qui marche en manuel ?",
  accept:["environnement","path","variables","pas le meme shell"],
  explain:"cron planifie des tâches récurrentes. Cause n°1 d'échec : l'environnement minimal — PATH réduit, pas de variables du <code>.bashrc</code>, pas de HOME identique. Correctif : chemins absolus partout, variables déclarées explicitement, et rediriger stdout/stderr vers un fichier pour voir l'erreur." },

{ id:"b2-linux-05", lvl:2, dom:"Linux",
  q:"Quelle différence entre <code>su</code>, <code>su -</code> et <code>sudo</code> ?",
  accept:["environnement de connexion","sudo journalise","par commande","login shell"],
  explain:"<code>su</code> change d'utilisateur en gardant l'environnement courant ; <code>su -</code> ouvre un login shell complet (PATH, HOME, profil de la cible). <code>sudo</code> élève les privilèges commande par commande, avec journalisation et politique fine dans sudoers — c'est le seul acceptable en production auditée." },

{ id:"b2-git-01", lvl:2, dom:"Git",
  q:"Comment résous-tu un conflit de merge ? Décris les étapes.",
  accept:["editer les marqueurs","git add","git merge --continue","choisir"],
  explain:"Git marque les zones en conflit (<code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code>, <code>=======</code>, <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt;</code>). On édite le fichier pour produire le résultat voulu (pas juste choisir un côté), on retire les marqueurs, <code>git add</code> le fichier, puis <code>git merge --continue</code>. <code>git merge --abort</code> pour tout annuler. Le vrai remède est en amont : petites branches et intégration fréquente." },

{ id:"b2-git-02", lvl:2, dom:"Git",
  q:"À quoi sert un tag Git et quelle différence entre tag léger et tag annoté ?",
  accept:["marquer une version","annote contient","objet","signature","metadonnees"],
  explain:"Un tag marque un point de l'historique (une release). Le tag léger est un simple pointeur ; le tag annoté est un OBJET Git avec auteur, date, message et possibilité de signature GPG. En production on utilise des tags annotés et signés — c'est ce qui rend la release auditable." },

{ id:"b2-git-03", lvl:2, dom:"Git",
  q:"Que fait <code>git push --force-with-lease</code> et pourquoi le préférer à <code>--force</code> ?",
  accept:["verifie","refuse si quelqu un a pousse","protege","etat attendu"],
  explain:"<code>--force</code> écrase le distant quoi qu'il arrive, y compris le travail poussé par un collègue entre-temps. <code>--force-with-lease</code> vérifie d'abord que le distant est bien à l'état que tu as observé, et refuse sinon. C'est le réflexe qui évite d'effacer le travail des autres." },

{ id:"b2-docker-01", lvl:2, dom:"Docker",
  q:"Différence entre <code>docker exec</code> et <code>docker attach</code> ?",
  accept:["nouveau processus","processus principal","pid 1","shell separe"],
  explain:"<code>exec</code> lance un NOUVEAU processus dans le conteneur (typiquement un shell) — c'est ce qu'on veut pour déboguer, et sortir ne tue rien. <code>attach</code> se branche sur le processus PID 1 existant : un Ctrl+C peut arrêter le conteneur." },

{ id:"b2-docker-02", lvl:2, dom:"Docker",
  q:"À quoi sert Docker Compose et quelle est sa limite en production ?",
  accept:["plusieurs conteneurs","dev","un seul hote","pas d orchestration","pas de ha"],
  explain:"Il décrit et lance plusieurs conteneurs liés (app + base + cache) sur UNE machine. Limite : pas de haute disponibilité, pas de scheduling multi-nœuds, pas de self-healing réel, pas de rolling update sûr. C'est excellent en dev et en test, ce n'est pas un orchestrateur de production." },

{ id:"b2-docker-03", lvl:2, dom:"Docker",
  q:"Que fait un HEALTHCHECK Docker et à quoi ça correspond dans Kubernetes ?",
  accept:["verifie la sante","readiness","liveness","statut unhealthy"],
  explain:"Il exécute périodiquement une commande dans le conteneur pour marquer son état (healthy/unhealthy), ce que Compose et Swarm exploitent. L'équivalent Kubernetes, ce sont les probes (liveness/readiness/startup) — et K8s ignore le HEALTHCHECK de l'image : il faut définir les probes." },

{ id:"b2-k8s-01", lvl:2, dom:"Kubernetes",
  q:"Quelle est la différence entre un Job et un CronJob ?",
  accept:["ponctuel","planifie","recurrent","schedule"],
  explain:"Un Job exécute un traitement jusqu'à complétion (avec <code>completions</code>, <code>parallelism</code>, <code>backoffLimit</code>). Un CronJob crée des Jobs selon une planification cron. Pièges du CronJob : <code>concurrencyPolicy</code> (que faire si le précédent tourne encore) et l'historique conservé qui remplit le namespace." },

{ id:"b2-k8s-02", lvl:2, dom:"Kubernetes",
  q:"Qu'est-ce qu'un initContainer et à quoi ça sert concrètement ?",
  accept:["avant les conteneurs","sequentiel","attendre","preparer","migration"],
  explain:"Un conteneur qui s'exécute jusqu'à son terme AVANT les conteneurs principaux, séquentiellement. Usages : attendre qu'une dépendance soit prête, appliquer une migration de base, récupérer un fichier de config ou un secret, ajuster des permissions sur un volume. S'il échoue, le Pod redémarre." },

{ id:"b2-k8s-03", lvl:2, dom:"Kubernetes",
  q:"Comment injectes-tu la valeur d'un ConfigMap dans un conteneur ? Cite les deux méthodes et leur différence majeure.",
  must:[["variable d environnement","env"],["volume","fichier","monte"]],
  explain:"1) En variables d'environnement (<code>envFrom</code> / <code>valueFrom</code>) : simple, mais figé au démarrage — modifier le ConfigMap n'a aucun effet sans redémarrage. 2) Monté en volume : les fichiers sont mis à jour automatiquement (avec un délai), ce qui permet le rechargement à chaud si l'application le gère." },

{ id:"b2-k8s-04", lvl:2, dom:"Kubernetes",
  q:"À quoi sert <code>kubectl rollout undo</code> et jusqu'où peut-on remonter ?",
  accept:["revenir a la version precedente","revisionhistorylimit","historique","rollback"],
  explain:"Il revient à la révision précédente du Deployment (ou à une révision précise avec <code>--to-revision</code>). L'historique conservé est limité par <code>revisionHistoryLimit</code> (10 par défaut) : au-delà, les anciens ReplicaSets sont supprimés et le rollback n'est plus possible." },

{ id:"b2-k8s-05", lvl:2, dom:"Kubernetes",
  q:"Que fait <code>kubectl port-forward</code> et pourquoi ce n'est pas une solution d'exposition ?",
  accept:["tunnel local","depuis ton poste","temporaire","un seul pod","debug"],
  explain:"Il ouvre un tunnel depuis ta machine vers un Pod ou un Service, via l'API server. C'est un outil de DEBUG : mono-utilisateur, éphémère, dépendant de ta session et de tes droits API. Exposer un service se fait par Service + Ingress." },

{ id:"b2-tf-01", lvl:2, dom:"Terraform",
  q:"À quoi sert un <code>output</code> et comment le récupère-t-on en dehors de Terraform ?",
  accept:["exposer une valeur","terraform output","json","module appelant"],
  explain:"Il expose une valeur calculée : au module appelant, ou à l'utilisateur. On le récupère avec <code>terraform output -raw nom</code> ou <code>-json</code> pour un pipeline. Marquer <code>sensitive = true</code> masque la valeur dans les logs — mais elle reste en clair dans le state." },

{ id:"b2-tf-02", lvl:2, dom:"Terraform",
  q:"Quelle est la différence entre <code>~&gt; 4.0</code> et <code>&gt;= 4.0</code> dans une contrainte de version ?",
  accept:["pessimiste","autorise 4.x","bloque la majeure","tout ce qui est superieur"],
  explain:"<code>~&gt; 4.0</code> (opérateur pessimiste) autorise 4.1, 4.9 mais PAS 5.0 : on se protège des breaking changes majeurs. <code>&gt;= 4.0</code> accepte tout, y compris une v5 qui casse ta configuration du jour au lendemain. En production : toujours borner." },

{ id:"b2-tf-03", lvl:2, dom:"Terraform",
  q:"Comment gères-tu une valeur conditionnelle en Terraform (créer une ressource seulement en prod) ?",
  accept:["count = var","condition","ternaire","0 ou 1"],
  explain:"<code>count = var.environnement == \"prod\" ? 1 : 0</code>, puis on référence <code>ressource[0]</code>. Attention : la référence doit alors être protégée (<code>try()</code> ou <code>one()</code>) quand count vaut 0. Pour plusieurs objets conditionnels, préférer un <code>for_each</code> sur une map filtrée." },

{ id:"b2-tf-04", lvl:2, dom:"Terraform",
  q:"À quoi servent les fonctions <code>lookup</code>, <code>try</code> et <code>coalesce</code> ?",
  accept:["valeur par defaut","gerer l absence","premiere non nulle","robustesse"],
  explain:"<code>lookup(map, cle, defaut)</code> lit une map avec un repli. <code>try(expr, repli)</code> renvoie le repli si l'expression échoue (attribut absent). <code>coalesce(a, b, c)</code> renvoie la première valeur non nulle/non vide. Ce sont les outils qui rendent un module tolérant aux entrées partielles." },

{ id:"b2-aws-01", lvl:2, dom:"AWS",
  q:"Qu'est-ce qu'un Target Group et quel est son lien avec le health check ?",
  accept:["cibles du load balancer","instances enregistrees","sain","retire du trafic"],
  explain:"C'est l'ensemble des cibles (instances, IP, Lambda, conteneurs) vers lesquelles un ALB/NLB route, avec son propre health check (chemin, seuils, intervalle). Une cible qui échoue est retirée du routage. Un health check mal calibré (trop strict, ou qui teste la base) provoque des retraits en cascade." },

{ id:"b2-aws-02", lvl:2, dom:"AWS",
  q:"Qu'est-ce que le service AWS Systems Manager Session Manager et pourquoi le préférer à SSH ?",
  accept:["pas de port ouvert","sans bastion","journalise","iam","agent"],
  explain:"Il ouvre un shell sur l'instance via l'agent SSM, sans ouvrir le port 22, sans bastion, sans clé à gérer. L'accès est contrôlé par IAM, journalisé dans CloudTrail et la session peut être enregistrée. C'est la réponse attendue sur « comment vous accédez aux serveurs en production »." },

{ id:"b2-aws-03", lvl:2, dom:"AWS",
  q:"Quelle est la différence entre un snapshot RDS automatique et manuel ?",
  accept:["retention","supprime avec l instance","conserve","backup window"],
  explain:"Les snapshots automatiques suivent la fenêtre de sauvegarde et une rétention configurée (0-35 jours) ; ils sont SUPPRIMÉS avec l'instance. Les snapshots manuels sont conservés jusqu'à suppression explicite. Le point de restauration dans le temps (PITR) repose sur les automatiques + les logs de transaction." },

{ id:"b2-az-01", lvl:2, dom:"Azure",
  q:"Comment fonctionnent les priorités de règles dans un NSG ?",
  accept:["numero croissant","premier match","100 a 4096","arrete l evaluation"],
  explain:"Les règles sont évaluées par priorité croissante (100 → 4096) et la PREMIÈRE qui correspond s'applique, l'évaluation s'arrête. Il existe des règles par défaut en fin de liste (autoriser le trafic intra-VNet, refuser le reste en entrée). Piège classique : une règle Allow à 300 qui ne sert jamais parce qu'un Deny existe à 200." },

{ id:"b2-az-02", lvl:2, dom:"Azure",
  q:"Qu'est-ce qu'un Availability Set et un Availability Zone dans Azure ? Différence ?",
  accept:["domaine de panne","fault domain","rack","zone = datacenter","physiquement separe"],
  explain:"L'Availability Set répartit les VM sur des fault domains et update domains DANS un même datacenter (protège d'une panne de rack ou d'une maintenance). Les Availability Zones répartissent sur des datacenters physiquement distincts de la région — protection bien supérieure. Les deux ne se combinent pas." },

{ id:"b2-az-03", lvl:2, dom:"Azure",
  q:"À quoi sert Azure Resource Graph ?",
  accept:["requeter l inventaire","kql","toutes les subscriptions","recherche rapide"],
  explain:"Il permet d'interroger en KQL l'inventaire de TOUTES tes ressources sur toutes les subscriptions, très rapidement — là où l'API ARM classique est lente et paginée. C'est l'outil pour répondre à « combien de VM sans tag Owner sur tout le tenant ? » en quelques secondes." },

{ id:"b2-res-01", lvl:2, dom:"Réseau",
  q:"À quoi sert un CDN et quel problème résout-il exactement ?",
  accept:["latence","proche de l utilisateur","cache","edge","charge"],
  explain:"Il met en cache le contenu sur des points de présence proches géographiquement des utilisateurs. Il réduit la latence (la vitesse de la lumière ne se négocie pas), décharge l'origine, absorbe les pics et sert souvent de première ligne WAF/anti-DDoS. Point clé : bien définir ce qui est cacheable et la stratégie d'invalidation." },

{ id:"b2-res-02", lvl:2, dom:"Réseau",
  q:"Qu'est-ce qu'un keep-alive HTTP et pourquoi ça change les performances ?",
  accept:["reutilise la connexion","evite le handshake","persistante","cout tcp tls"],
  explain:"Il réutilise la même connexion TCP/TLS pour plusieurs requêtes, au lieu de refaire handshake TCP + handshake TLS à chaque fois (plusieurs allers-retours). Sur une liaison à 50 ms de RTT, ça peut diviser le temps de réponse par deux. HTTP/2 va plus loin avec le multiplexage sur une seule connexion." },

{ id:"b2-cicd-01", lvl:2, dom:"CI/CD",
  q:"Qu'est-ce qu'un cache de pipeline et quel est le risque de mal le configurer ?",
  accept:["dependances","accelere","cache empoisonne","cle de cache","resultat faux"],
  explain:"Il conserve des dépendances entre exécutions pour accélérer le build. Risques : une clé de cache trop large donne des builds non reproductibles ou masque une régression ; un cache partagé entre projets ou entre branches non fiables est un vecteur d'empoisonnement. La clé doit dériver du hash du lockfile." },

{ id:"b2-cicd-02", lvl:2, dom:"CI/CD",
  q:"Quelle différence entre un artefact et une image de conteneur dans un pipeline ?",
  accept:["binaire","package","image = artefact executable","registry"],
  explain:"L'artefact est le livrable brut du build (jar, wheel, binaire, bundle). L'image de conteneur est un format d'artefact qui embarque en plus le runtime et les dépendances système, stocké dans un registry. Dans les deux cas : versionné, immuable, produit UNE fois puis promu." },

{ id:"b2-sec-01", lvl:2, dom:"Sécurité",
  q:"Pourquoi ne jamais logger le contenu d'un token ou d'un mot de passe, même en debug ?",
  accept:["logs centralises","conserves","sauvegarde","exfiltration","rgpd"],
  explain:"Les logs partent dans un SIEM, sont dupliqués, sauvegardés longtemps et accessibles à beaucoup plus de personnes que la production. Un secret loggué une fois est un secret compromis, à révoquer. Même logique pour les données personnelles (RGPD sur les logs et les sauvegardes)." },

{ id:"b2-sec-02", lvl:2, dom:"Sécurité",
  q:"Qu'est-ce qu'un scan de vulnérabilités d'image, et pourquoi le rejouer périodiquement ?",
  accept:["nouvelles cve","apparaissent apres","image inchangee","veille"],
  explain:"Il compare les paquets de l'image à des bases de CVE. Il faut le rejouer parce que de nouvelles vulnérabilités sont publiées APRÈS le build : une image scannée propre il y a trois mois peut être critique aujourd'hui, sans avoir changé d'un octet. D'où le scan continu au niveau du registry." },

{ id:"b2-obs-01", lvl:2, dom:"Observabilité",
  q:"Que signifie le fait qu'un compteur Prometheus soit toujours utilisé avec <code>rate()</code> ?",
  accept:["croissant","valeur brute inutile","par seconde","gere les reset"],
  explain:"Un counter ne fait qu'augmenter : sa valeur brute (« 4 823 191 requêtes depuis le démarrage ») n'a aucun intérêt. <code>rate()</code> calcule la variation par seconde sur une fenêtre et gère automatiquement les remises à zéro lors d'un redémarrage du process." },

{ id:"b2-obs-02", lvl:2, dom:"Observabilité",
  q:"Pourquoi faut-il horodater les logs en UTC avec le fuseau explicite ?",
  accept:["correlation","fuseau","ambiguite","heure d ete","ordre"],
  explain:"Pour corréler des événements entre serveurs, régions et services pendant un incident. Les heures locales créent des ambiguïtés (changement d'heure, machines mal réglées) et rendent l'ordre des événements impossible à établir — exactement au moment où on en a le plus besoin." },

{ id:"b2-sre-01", lvl:2, dom:"SRE",
  q:"Qu'est-ce qu'un runbook et en quoi diffère-t-il d'une documentation d'architecture ?",
  accept:["procedure","pendant l incident","actionnable","etapes","symptome"],
  explain:"Le runbook part d'un SYMPTÔME observé et donne les commandes exactes à exécuter, comment vérifier l'effet et quand escalader. La documentation d'architecture explique comment le système est construit. Pendant un incident à 3 h du matin, on a besoin du premier, pas du second." },

{ id:"b2-sql-01", lvl:2, dom:"SQL",
  q:"Que fait <code>GROUP BY</code> et quelle erreur classique commet-on avec ?",
  accept:["regroupe","agregat","colonne non agregee","select"],
  explain:"Il regroupe les lignes partageant les mêmes valeurs pour appliquer des fonctions d'agrégation. Erreur classique : sélectionner une colonne qui n'est ni dans le GROUP BY ni agrégée — PostgreSQL refuse, MySQL en mode permissif renvoie une valeur arbitraire, ce qui donne des résultats faux silencieusement." }

]);

</script>
<script>
