<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiches d'étude — Entretien BNP</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg">
<meta name="theme-color" content="#0d111a">
<script>
if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost")){
  window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
<style>
  :root{
    --bg:#0d111a; --surface:#151b27; --surface2:#1d2432; --ink:#dde4f0; --muted:#8d9ab2;
    --accent:#6c8cff; --accent-soft:#1a2440; --ok:#3ecf8e; --warn:#edaa5f; --warn-soft:#2a2013;
    --ko:#ff6b6b; --ko-soft:#2c1416; --border:#26303f; --code:#0a0e16;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f5f7fb; --surface:#fff; --surface2:#f0f3f9; --ink:#161d2b; --muted:#5c687d;
      --accent:#2b5fd9; --accent-soft:#e6edfc; --ok:#1e7a46; --warn:#8a5a00; --warn-soft:#fdf3e3;
      --ko:#b3352b; --ko-soft:#fbeae8; --border:#dce2ee; --code:#eef1f7;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;line-height:1.6}
  .layout{display:flex;max-width:1180px;margin:0 auto;gap:24px;padding:20px 16px 80px}
  nav{width:230px;flex-shrink:0;position:sticky;top:20px;align-self:flex-start;max-height:calc(100vh - 40px);overflow-y:auto}
  nav h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:16px 0 6px}
  nav a{display:block;padding:6px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;border-left:2px solid transparent}
  nav a:hover{background:var(--surface2)}
  nav a.on{background:var(--accent-soft);color:var(--accent);border-left-color:var(--accent);font-weight:600}
  main{flex:1;min-width:0}
  header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  header.top h1{font-size:19px;margin:0}
  header.top h1 span{color:var(--accent)}
  a.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:.5rem 1rem;border-radius:9px;font-size:14px;font-weight:600}
  article{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px;margin-bottom:18px}
  article h2{margin:0 0 4px;font-size:23px}
  article h3{margin:26px 0 8px;font-size:16.5px;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:5px}
  article h4{margin:18px 0 6px;font-size:14.5px}
  article p{margin:8px 0}
  article ul,article ol{margin:8px 0;padding-left:22px}
  article li{margin:4px 0}
  code{font-family:"Cascadia Code",Consolas,monospace;background:var(--code);padding:1px 5px;border-radius:5px;font-size:.88em;border:1px solid var(--border)}
  pre{background:var(--code);border:1px solid var(--border);border-radius:10px;padding:13px 15px;overflow-x:auto;font-size:13.2px;line-height:1.5}
  pre code{background:none;border:none;padding:0}
  table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px;display:block;overflow-x:auto}
  th,td{border:1px solid var(--border);padding:7px 10px;text-align:left;vertical-align:top}
  th{background:var(--surface2);font-weight:650}
  .lead{color:var(--muted);font-size:14.5px;margin-bottom:4px}
  .box{border-radius:10px;padding:12px 15px;margin:14px 0;font-size:14.3px;border-left:3px solid}
  .box.piege{background:var(--ko-soft);border-color:var(--ko)}
  .box.dire{background:var(--warn-soft);border-color:var(--warn)}
  .box.piege b,.box.dire b{display:block;margin-bottom:4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
  .toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:14px}
  .toc a{display:block;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--ink)}
  .toc a:hover{border-color:var(--accent)}
  .toc a b{display:block;font-size:15px}
  .toc a span{font-size:12.5px;color:var(--muted)}
  @media(max-width:860px){
    .layout{flex-direction:column;padding:16px 12px 60px}
    article{padding:20px}
    nav{width:100%;position:static;max-height:none;order:-1;display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;border-bottom:1px solid var(--border)}
    nav h2{display:none}
    nav a{flex:0 0 auto;white-space:nowrap;border-left:none;border-bottom:2px solid transparent;border-radius:8px 8px 0 0}
    nav a.on{border-left:none;border-bottom-color:var(--accent)}
  }
</style>
</head>
<body>
<div class="layout">
  <nav id="nav"></nav>
  <main>
    <header class="top">
      <h1>Fiches <span>d'étude</span> — Entretien BNP</h1>
      <a class="btn" href="quiz.html">Aller au quiz →</a>
    </header>
    <div id="content"></div>
  </main>
</div>

<script src="fiches/00-plan.js"></script>
<script src="fiches/01-linux.js"></script>
<script src="fiches/02-reseau.js"></script>
<script src="fiches/03-git.js"></script>
<script src="fiches/04-docker.js"></script>
<script src="fiches/05-kubernetes.js"></script>
<script src="fiches/06-helm-gitops.js"></script>
<script src="fiches/07-terraform.js"></script>
<script src="fiches/08-ansible.js"></script>
<script src="fiches/09-aws.js"></script>
<script src="fiches/10-azure.js"></script>
<script src="fiches/11-cicd.js"></script>
<script src="fiches/12-securite.js"></script>
<script src="fiches/13-obs-sre.js"></script>
<script src="fiches/14-messagerie.js"></script>
<script src="fiches/15-sql.js"></script>
<script src="fiches/16-architecture.js"></script>
<script src="fiches/17-entretien.js"></script>
<script>
const F = window.FICHES || [];
const nav = document.getElementById("nav");
const content = document.getElementById("content");

nav.innerHTML = "<h2>Fiches</h2>" + F.map(f=>`<a href="#${f.id}" data-id="${f.id}">${f.titre}</a>`).join("");

function show(id){
  const f = F.find(x=>x.id===id) || F[0];
  content.innerHTML = `<article><h2>${f.titre}</h2><div class="lead">${f.lead||""}</div>${f.html}</article>`;
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on", a.dataset.id===f.id));
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", ()=>show(location.hash.slice(1)));
show(location.hash.slice(1) || F[0].id);
</script>
</body>
</html>
