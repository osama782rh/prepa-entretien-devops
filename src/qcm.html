<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QCM DevOps — Entretien BNP</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg">
<meta name="theme-color" content="#0d111a">
<script>
if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost")){
  window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
<style>
  :root{
    --bg:#0d111a; --surface:#151b27; --surface2:#1d2432; --ink:#dde4f0; --muted:#8d9ab2;
    --accent:#3ecf8e; --accent-soft:#0f2a1e; --ok:#3ecf8e; --ok-soft:#0f2a1e;
    --ko:#ff6b6b; --ko-soft:#2c1416; --warn:#edaa5f; --warn-soft:#2a2013;
    --border:#26303f; --code:#0a0e16;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f5f7fb; --surface:#fff; --surface2:#f0f3f9; --ink:#161d2b; --muted:#5c687d;
      --accent:#1e7a46; --accent-soft:#e7f5ec; --ok:#1e7a46; --ok-soft:#e7f5ec;
      --ko:#b3352b; --ko-soft:#fbeae8; --warn:#8a5a00; --warn-soft:#fdf3e3;
      --border:#dce2ee; --code:#eef1f7;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.55}
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 80px}
  a{color:var(--accent)}
  code{font-family:"Cascadia Code",Consolas,monospace;background:var(--code);padding:1px 5px;border-radius:5px;font-size:.88em;border:1px solid var(--border)}
  header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  header.top h1{font-size:19px;margin:0;font-weight:700}
  header.top h1 span{color:var(--accent)}
  .hstats{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .hstats b{color:var(--ink)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 16px}

  .levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin:14px 0 20px}
  .lvl{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 13px;cursor:pointer;text-align:left;color:inherit;font:inherit;transition:.15s}
  .lvl:hover{border-color:var(--accent);transform:translateY(-2px)}
  .lvl .n{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .lvl .t{font-weight:650;font-size:14.5px;margin:3px 0 5px;line-height:1.3}
  .lvl .m{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .bar{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--ok);width:0}

  .modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  button{font:inherit;cursor:pointer;border:none;border-radius:9px;padding:.6rem 1.1rem;background:var(--accent);color:#04180f;font-weight:700;font-size:14.5px}
  @media (prefers-color-scheme: light){ button{color:#fff} }
  button:hover{filter:brightness(1.08)}
  button.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--border);font-weight:600}
  button.tiny{padding:.35rem .7rem;font-size:13px}

  .progress{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-bottom:16px}
  .progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
  .meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:10px;gap:10px;flex-wrap:wrap}
  .tag{display:inline-block;background:var(--surface2);color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:700;letter-spacing:.03em}
  .qtext{font-size:17px;line-height:1.5;margin:6px 0 16px;font-weight:550}

  .choix{display:flex;flex-direction:column;gap:9px}
  .ch{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--border);
      border-radius:11px;padding:13px 15px;cursor:pointer;color:inherit;font:inherit;font-size:15px;line-height:1.45;transition:.12s}
  .ch:hover:not(:disabled){border-color:var(--accent)}
  .ch:disabled{cursor:default}
  .ch .lettre{flex:0 0 24px;height:24px;border-radius:6px;background:var(--bg);border:1px solid var(--border);
      display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:var(--muted)}
  .ch.bonne{background:var(--ok-soft);border-color:var(--ok)}
  .ch.bonne .lettre{background:var(--ok);color:#04180f;border-color:var(--ok)}
  .ch.mauvaise{background:var(--ko-soft);border-color:var(--ko)}
  .ch.mauvaise .lettre{background:var(--ko);color:#2a0605;border-color:var(--ko)}
  .ch.estompe{opacity:.5}

  .fb{margin-top:15px;padding:14px;border-radius:10px;font-size:14.5px;border:1px solid}
  .fb.ok{background:var(--ok-soft);border-color:var(--ok)}
  .fb.ko{background:var(--ko-soft);border-color:var(--ko)}
  .fb .badge{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:6px;letter-spacing:.04em;margin-bottom:8px}
  .fb.ok .badge{background:var(--ok);color:#04180f}
  .fb.ko .badge{background:var(--ko);color:#2a0605}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .done{text-align:center;padding:16px 0}
  .score{font-size:44px;font-weight:800;margin:8px 0;font-variant-numeric:tabular-nums}
  .dom-list{margin-top:14px;font-size:13.5px}
  .dom-list div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--border)}
  .hint{font-size:13px;color:var(--muted);margin-top:10px}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
  .serie{display:inline-block;background:var(--warn-soft);border:1px solid var(--warn);color:var(--warn);
      border-radius:20px;padding:2px 11px;font-size:12.5px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>QCM <span>DevOps</span> — Entretien BNP</h1>
    <div class="hstats" id="hstats"></div>
  </header>
  <div id="app"></div>
</div>

<script src="qcm/niveau01.js"></script>
<script src="qcm/niveau02.js"></script>
<script src="qcm/niveau03.js"></script>
<script src="qcm/niveau04.js"></script>
<script src="qcm/niveau05.js"></script>
<script src="qcm/niveau06.js"></script>
<script src="qcm/niveau07.js"></script>
<script src="qcm/niveau08.js"></script>
<script src="qcm/niveau09.js"></script>
<script src="qcm/niveau10.js"></script>
<script>
const BANK = window.QCM || [];
const LEVEL_TITLES = {
  1:"Vocabulaire & fondations",
  2:"Bases opérationnelles",
  3:"Usage quotidien",
  4:"Intermédiaire",
  5:"Réseau, sécurité, état",
  6:"Troubleshooting",
  7:"Architecture & production",
  8:"Internes & cas limites",
  9:"Résilience, coûts, gouvernance",
  10:"Entretien senior — arbitrages"
};
const STORE = "bnp_qcm_v1";
let ST = load();
function load(){ try{ return JSON.parse(localStorage.getItem(STORE)) || {q:{}}; }catch(e){ return {q:{}}; } }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(ST)); }catch(e){} }

const BOX_DAYS = [0,0,1,3,7,16,35];
function qs(id){ return ST.q[id] || (ST.q[id] = {box:1, ok:0, ko:0, last:0}); }
function due(id){
  const s = ST.q[id]; if(!s) return true;
  return Date.now() - s.last >= BOX_DAYS[Math.min(s.box,6)]*864e5;
}
function grade(id, ok){
  const s = qs(id);
  if(ok){ s.ok++; s.box = Math.min(s.box+1, 6); } else { s.ko++; s.box = 1; }
  s.last = Date.now(); save();
}

function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[b[i],b[j]]=[b[j],b[i]];} return b; }

let S = null;   // {list, i, score, wrong:[], label, serie}

function startLevel(l){ start(shuffle(BANK.filter(q=>q.lvl===l)), "Niveau "+l+" — "+LEVEL_TITLES[l]); }
function startAll(){ start(shuffle(BANK), "Marathon — toutes les questions"); }
function startRandom(n){ start(shuffle(BANK).slice(0,n), "Aléatoire — "+n+" questions"); }
function startDomain(d){ start(shuffle(BANK.filter(q=>q.dom===d)), "Domaine — "+d); }
function startDue(){
  const d = shuffle(BANK.filter(q=>due(q.id))).slice(0,40);
  if(!d.length){ alert("Rien à réviser pour le moment. Lance un niveau."); return; }
  start(d, "Révision du jour — "+d.length+" questions");
}
function startWeak(){
  const w = BANK.filter(q => ST.q[q.id] && ST.q[q.id].ko>0 && ST.q[q.id].box<=2);
  if(!w.length){ alert("Aucune question ratée en mémoire. Lance un niveau d'abord."); return; }
  start(shuffle(w), "Mes points faibles — "+w.length+" questions");
}
function start(list, label){
  if(!list.length){ alert("Aucune question."); return; }
  S = {list, i:0, score:0, wrong:[], label, serie:0};
  render();
}

function headerStats(){
  const vues = Object.keys(ST.q).length;
  const solides = Object.values(ST.q).filter(s=>s.box>=4).length;
  document.getElementById("hstats").innerHTML =
    `<b>${BANK.length}</b> questions · vues <b>${vues}</b> · solides <b>${solides}</b>`;
}

function home(){
  S = null;
  const doms = [...new Set(BANK.map(q=>q.dom))].sort();
  let lv = "";
  for(let l=1;l<=10;l++){
    const qs_ = BANK.filter(q=>q.lvl===l);
    const acquis = qs_.filter(q=>ST.q[q.id] && ST.q[q.id].box>=3).length;
    const pct = qs_.length ? Math.round(acquis/qs_.length*100) : 0;
    lv += `<button class="lvl" onclick="startLevel(${l})">
      <div class="n">Niveau ${l}</div>
      <div class="t">${LEVEL_TITLES[l]}</div>
      <div class="m">${qs_.length} questions · ${pct}% acquis</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </button>`;
  }
  document.getElementById("app").innerHTML = `
    <div class="card">
      <h2 style="margin:0 0 4px;font-size:22px">Choix multiples</h2>
      <p class="sub">Le mode pour construire tes bases sans te décourager : tu reconnais la bonne réponse et tu lis pourquoi les autres sont fausses. Quand un niveau te paraît facile ici, passe au même niveau en <a href="quiz.html">réponses libres</a> — c'est là que ça s'ancre vraiment.</p>
      <div class="modes">
        <button onclick="startDue()">Révision du jour</button>
        <button class="ghost" onclick="startRandom(30)">30 au hasard</button>
        <button class="ghost" onclick="startWeak()">Mes points faibles</button>
        <button class="ghost" onclick="startAll()">Marathon complet</button>
      </div>
      <div class="hint">Par domaine : ${doms.map(d=>`<a href="#" onclick="startDomain('${d}');return false">${d}</a>`).join(" · ")}</div>
    </div>
    <div class="levels">${lv}</div>
    <div class="card" style="font-size:13.5px;color:var(--muted)">
      <b style="color:var(--ink)">Comment t'en servir.</b> Avant de cliquer, dis la réponse dans ta tête <em>et</em> la raison. Puis lis l'explication même quand tu as juste — les mauvaises réponses proposées sont les erreurs qu'on entend réellement en entretien, savoir pourquoi elles sont fausses vaut autant que la bonne réponse.
      <div class="row">
        <button class="ghost tiny" onclick="location.href='quiz.html'">Réponses libres →</button>
        <button class="ghost tiny" onclick="location.href='etude.html'">Fiches d'étude →</button>
        <button class="ghost tiny" onclick="resetAll()">Réinitialiser</button>
      </div>
    </div>`;
  headerStats();
}
function resetAll(){ if(confirm("Effacer ta progression sur le QCM ?")){ ST={q:{}}; save(); home(); } }

function render(){
  if(!S) return home();
  const app = document.getElementById("app");
  if(S.i >= S.list.length) return finish();
  const it = S.list[S.i];

  // mélange des propositions à chaque affichage : la position ne se mémorise pas
  if(!it._ordre) it._ordre = shuffle(it.choix.map((_,k)=>k));

  const lettres = "ABCDE";
  const boutons = it._ordre.map((idx,pos)=>
    `<button class="ch" id="ch${pos}" onclick="repondre(${idx},${pos})">
       <span class="lettre">${lettres[pos]}</span><span>${it.choix[idx]}</span>
     </button>`).join("");

  app.innerHTML = `
    <div class="toolbar">
      <div class="meta"><span>${S.label}</span></div>
      <button class="ghost tiny" onclick="home()">Quitter</button>
    </div>
    <div class="progress"><i style="width:${S.i/S.list.length*100}%"></i></div>
    <div class="card">
      <div class="meta">
        <span>Question ${S.i+1} / ${S.list.length} ${S.serie>=3?`<span class="serie">${S.serie} d'affilée</span>`:""}</span>
        <span><span class="tag">${it.dom}</span> <span class="tag">N${it.lvl}</span></span>
      </div>
      <div class="qtext">${it.q}</div>
      <div class="choix">${boutons}</div>
      <div id="fb"></div>
    </div>`;
  headerStats();
}

function repondre(idx, pos){
  const it = S.list[S.i];
  const ok = (idx === it.bonne);
  if(ok){ S.score++; S.serie++; } else { S.wrong.push(it); S.serie = 0; }
  grade(it.id, ok);

  it._ordre.forEach((choixIdx, p)=>{
    const b = document.getElementById("ch"+p);
    b.disabled = true;
    if(choixIdx === it.bonne) b.classList.add("bonne");
    else if(p === pos) b.classList.add("mauvaise");
    else b.classList.add("estompe");
  });

  document.getElementById("fb").innerHTML = `
    <div class="fb ${ok?'ok':'ko'}">
      <span class="badge">${ok?'CORRECT':'À REVOIR'}</span>
      <div>${it.explain}</div>
    </div>
    <div class="row"><button onclick="next()">Suivant →</button></div>`;
  document.querySelector(".row button").focus();
}
function next(){ S.i++; render(); }

function finish(){
  const pct = Math.round(S.score/S.list.length*100);
  const byDom = {};
  S.list.forEach(q=>{ byDom[q.dom] = byDom[q.dom]||{t:0,k:0}; byDom[q.dom].t++; });
  S.wrong.forEach(q=>{ byDom[q.dom].k++; });
  const rows = Object.entries(byDom).sort((a,b)=>(b[1].k/b[1].t)-(a[1].k/a[1].t))
    .map(([d,v])=>`<div><span>${d}</span><span>${v.t-v.k}/${v.t}</span></div>`).join("");
  const msg = pct>=85 ? "Ce niveau est acquis en reconnaissance. Passe au même niveau en réponses libres."
            : pct>=65 ? "Bonne base. Refais les ratées, puis retente."
            : pct>=45 ? "Ça vient. Lis les fiches du domaine le plus rouge avant de rejouer."
            : "Normal à ce stade — lis l'explication de chaque question, c'est là qu'est le cours.";
  document.getElementById("app").innerHTML = `
    <div class="card done">
      <div class="meta" style="justify-content:center">${S.label}</div>
      <div class="score">${S.score} / ${S.list.length}</div>
      <div class="sub">${pct}% — ${msg}</div>
      <div class="row" style="justify-content:center">
        ${S.wrong.length?`<button onclick="replayWrong()">Rejouer les ${S.wrong.length} ratées</button>`:""}
        ${pct>=85?`<button class="ghost" onclick="location.href='quiz.html'">Passer aux réponses libres →</button>`:""}
        <button class="ghost" onclick="home()">Accueil</button>
      </div>
      <div class="dom-list" style="text-align:left">${rows}</div>
    </div>`;
  headerStats();
}
function replayWrong(){
  const w = S.wrong.map(q=>{ delete q._ordre; return q; });
  start(shuffle(w), "Rattrapage — "+S.label);
}

home();
</script>
</body>
</html>
